<script id="data" type="application/json">{"badge":"SAT","title":"SAT Math","ns":"satm","groups":["Öğren","4 Konu"],"lessons":[{"eyebrow":"Öğren","group":"Öğren","id":"basla","blocks":[{"t":"p","x":"Digital SAT Math iki modülden oluşur, tamamında hesap makinesi serbesttir. Dört ana konu vardır. Bu modül her konuyu çözümlü çoktan seçmeli sorularla çalıştırır."},{"head":["Konu","İçerik"],"t":"table","rows":[["Algebra","Lineer denklemler, eşitsizlikler, denklem sistemleri, grafikler."],["Problem Solving and Data","Oran, yüzde, hız, ortalama, veri yorumlama."],["Advanced Math","Karesel denklemler, üsler, fonksiyonlar, çarpanlara ayırma."],["Geometry and Trigonometry","Alan, çevre, açılar, Pisagor, çember, temel trigonometri."]]},{"lines":["Math bolumu 200-800 puan, Reading and Writing ile birlikte toplam 400-1600. Iki modul, adaptif, hesap makinesi serbest.","Dort konu esit agirlikta cikar."],"title":"Puanlama","t":"note","k":"ipucu"},{"title":"Strateji","t":"note","lines":["Soruyu çözmeden şıklara bakma. Kendi cevabını bul, sonra eşleştir.","Şıklardan geri gitmek (plugging in) bazen en hızlı yoldur, özellikle değişkenli sorularda.","Birim ve işaret hatalarına dikkat. SAT tuzağı çoğu zaman doğru sayı, yanlış işaret veya birimdir."],"k":"ipucu"}],"name":"SAT Math Yapısı"},{"eyebrow":"Konu 1","blocks":[{"lines":["Lineer denklemde değişkeni yalnız bırak: aynı işlemi iki tarafa uygula.","Eşitsizlikte iki tarafı negatif sayıyla çarpar veya bölersen yön değişir.","Sistemde ekleme veya yerine koyma ile bir değişkeni yok et."],"t":"note","title":"Kural","k":"karar"},{"k":"kapsam","t":"note","title":"Ne ölçülüyor","lines":["Algebra, SAT Math'in en büyük ağırlığa sahip başlığıdır ve doğrusal (lineer) ilişkilerin her yönünü sınar.","Tek değişkenli ve iki değişkenli lineer denklemleri kurma, çözme; lineer eşitsizlikleri ve mutlak değerli ifadeleri yorumlama gücünü ölçer.","İki bilinmeyenli denklem sistemlerini çözme (yerine koyma, yok etme) ve bir sistemin kaç çözümü olduğunu belirleme becerisini test eder.","Ayrıca bir grafiğin eğimini/kesim noktasını gerçek hayat bağlamında yorumlama ve kelime problemini denkleme çevirme yeteneğini ister."]},{"lines":["Eğim (slope): İki nokta (x1,y1) ve (x2,y2) için m = (y2 - y1) / (x2 - x1); yani dikey değişimin yatay değişime oranıdır.","Eğim-kesim formu: y = mx + b. Burada m eğimi, b ise doğrunun y eksenini kestiği noktayı (y-kesim) gösterir.","Standart form: Ax + By = C. Bu formda eğim m = -A/B, y-kesim ise C/B olarak bulunur.","Paralel doğruların eğimleri eşittir (m1 = m2). Dik doğruların eğimleri çarpımı -1'dir (m1 * m2 = -1), yani biri diğerinin negatif tersidir.","Sistem çözüm sayısı: a1x + b1y = c1 ve a2x + b2y = c2 için oranlara bakılır.","Tek çözüm (kesişen doğrular): a1/a2 farklı b1/b2. Sonsuz çözüm (çakışık doğrular): a1/a2 = b1/b2 = c1/c2. Çözüm yok (paralel doğrular): a1/a2 = b1/b2 farklı c1/c2.","Mutlak değer: |x| = a denkleminin çözümü x = a veya x = -a şeklinde iki durum verir; |x| ifadesi daima sıfır veya pozitiftir."],"t":"note","title":"Temel kavramlar ve formüller","k":"kavramlar"},{"lines":["1. Adım: Soruyu oku ve neyin sorulduğunu belirle; bilinmeyeni (genellikle x veya y) net bir cümleyle tanımla.","2. Adım: Sözel ifadeleri matematiğe çevir. 'Toplam' için +, 'fark' için -, 'başına/her' için çarpım, 'sabit ücret' için sabit terim kullan.","3. Adım: Denklemi veya sistemi kur; eşitliğin iki tarafını da aynı birimle yazdığından emin ol.","4. Adım: Çöz. Tek denklemde bilinmeyeni yalnız bırak; sistemde yerine koyma ya da yok etme yönteminden uygun olanı seç.","5. Adım: Eşitsizlik varsa, her iki tarafı negatif bir sayıyla çarparken veya bölerken eşitsizlik yönünü ters çevirmeyi unutma.","6. Adım: Bulduğun değeri orijinal denklemde yerine koyarak kontrol et ve sorunun gerçekte istediği ifadeyi (örneğin x değil, 2x+1) yanıtla."],"t":"note","title":"Karar prosedürü","k":"prosedur"},{"k":"alt-tipler","lines":["Eğim yorumu: Bir doğrusal modelde eğimin ya da y-kesiminin gerçek hayattaki anlamını (ör. saatlik ücret, başlangıç bedeli) açıklamanı ister.","Kelime problemi kurma: Verilen metinden doğru denklemi veya eşitsizliği oluşturmanı; genelde denklemi kurmak çözmekten daha önemlidir.","Sistem çözme: İki bilinmeyenli iki denklemi yerine koyma veya yok etme ile çözüp x, y ya da bunların bir kombinasyonunu bulmanı ister.","Çözüm sayısı belirleme: Bir sistemin tek, sonsuz veya hiç çözümü olması için bir katsayının değerini bulmanı sorar.","Eşitsizlik ve bölge: Bir eşitsizliği çözmeni ya da bir noktanın çözüm kümesine ait olup olmadığını sınamanı ister.","Doğrunun denklemi: Verilen iki noktadan, bir nokta ve eğimden veya paralel/dik koşuldan doğrunun denklemini yazmanı ister.","Eşdeğer ifade: Bir lineer denklemi yeniden düzenleyip belirli bir değişkeni yalnız bırakmanı (formül çözme) test eder."],"t":"note","title":"Soru alt tipleri"},{"k":"ornek","lines":["Problem: Bir spor salonu üyeliği 40 lira sabit kayıt ücreti ve her ay 25 lira aidat alıyor. Toplam ödeme 240 lirayı geçmeden en fazla kaç ay üye kalınabilir?","1. Adım: Ay sayısını x ile gösterelim. Toplam maliyet 40 + 25x olur.","2. Adım: 'Geçmeden' ifadesi 'küçük veya eşit' demektir: 40 + 25x <= 240 eşitsizliğini kuralım.","3. Adım: Her iki taraftan 40 çıkaralım: 25x <= 200.","4. Adım: Her iki tarafı 25'e bölelim (pozitif sayı, yön değişmez): x <= 8.","5. Adım: x bir ay sayısı olduğundan en büyük tam değer x = 8'dir. Kontrol: 40 + 25*8 = 240, koşulu tam sağlar.","Sonuç: Kişi en fazla 8 ay üye kalabilir."],"title":"Çözümlü örnek","t":"note"},{"k":"hatalar","t":"note","title":"Sık hatalar","lines":["Eşitsizliği negatif bir sayıyla çarpıp/bölerken yön değiştirmeyi unutmak: -2x < 6 ise x > -3 olur, x < -3 değil.","Eğimi ters hesaplamak: Eğim daima (y farkı)/(x farkı)'dır; x farkını paya, y farkını paydaya koymak yanlış sonuç verir.","Dik doğru eğimini sadece işaret değiştirerek almak: Doğrusu negatif TERS'tir; eğim 2 ise dik eğim -1/2, sadece -2 değil.","Birim karıştırmak: Denklemde bir tarafı lira diğerini kuruş ya da bir tarafı saat diğerini dakika yazmak hataya yol açar.","Sorunun istediğini yanlış okumak: x sorulduğunu sanıp 2x'i bulmak ya da tersi; en sık puan kaybı buradadır.","Sistemde yok etme yaparken sadece bir denklemi katsayıyla çarpıp diğerini unutmak veya işaret hatası yapmak."]},{"k":"ipuclari","lines":["Şıklarda sayılar varsa ve denklem kurmak uzun sürüyorsa, şıkları denklemde yerine koyarak deneme (geri koyma) çoğu zaman daha hızlıdır.","Çözüm sayısı sorularında hemen katsayı oranlarına bak: eğimler eşit ama kesimler farklıysa çözüm yok, hepsi eşitse sonsuz çözüm vardır.","Kelime problemlerinde önce bilinmeyeni bir cümleyle tanımla; doğru kurulum, hatasız çözümün yarısıdır.","Grafik yorumu sorularında eğim 'değişim hızını', y-kesim ise 'başlangıç değerini' temsil eder; bu iki kalıbı ezberle.","Zamanını yönet: Bir soruda tıkanırsan işaretleyip geç; Algebra soruları genelde kısadır, kolay puanları önce topla."],"t":"note","title":"İpuçları ve sınav stratejisi"},{"items":[{"stem":"If 3x + 7 = 22, what is the value of x?","ans":"D","why":"3x = 22 - 7 = 15, x = 5.","slug":"gri-mod-satm-algebra-1-1","choices":{"B":"9","A":"3","D":"5","C":"7"},"n":1},{"slug":"gri-mod-satm-algebra-1-2","n":2,"stem":"If 2(x - 4) = 10, what is the value of x?","ans":"B","choices":{"D":"1","C":"7","A":"3","B":"9"},"why":"2x - 8 = 10, 2x = 18, x = 9."},{"slug":"gri-mod-satm-algebra-1-3","n":3,"stem":"A line has slope 2 and passes through (0, -3). What is its equation?","ans":"C","choices":{"C":"y = 2x - 3","D":"y = -2x - 3","A":"y = 2x + 3","B":"y = -3x + 2"},"why":"Eğim 2, y-kesişimi -3. y = mx + b = 2x - 3."},{"choices":{"A":"1","B":"2","C":"3","D":"4"},"stem":"If 5x - 3 > 12, which of the following is a possible value of x?","ans":"D","why":"5x > 15, x > 3. Yalnızca 4 bu koşulu sağlar.","slug":"gri-mod-satm-algebra-1-4","n":4},{"choices":{"D":"6","C":"7","A":"3","B":"5"},"n":5,"why":"İki denklemi topla: 2x = 14, x = 7.","ans":"C","stem":"If x + y = 10 and x - y = 4, what is the value of x?","slug":"gri-mod-satm-algebra-1-5"},{"slug":"gri-mod-satm-algebra-1-6","n":6,"choices":{"C":"0.1(20 + t)","D":"20 + 10t","A":"20t + 0.1","B":"20 + 0.1t"},"ans":"B","stem":"A phone plan costs $20 per month plus $0.10 per text. Which expression gives the total monthly cost for t texts?","why":"Sabit 20, mesaj başına 0.10, t mesaj: 20 + 0.1t."},{"choices":{"A":"5","B":"29/3","D":"10","C":"15"},"stem":"Solve for x: 3x + 7 = 22","ans":"A","why":"3x = 22 - 7 = 15, so x = 5.","slug":"gri-mod-satm-algebra-1-7","n":7},{"stem":"Solve for x: 4x + 9 = x + 30","choices":{"D":"-7","C":"13","A":"3","B":"7"},"ans":"B","why":"4x - x = 30 - 9, so 3x = 21 and x = 7.","slug":"gri-mod-satm-algebra-1-8","n":8},{"why":"2x < 16, so x < 8 (dividing by positive 2 keeps the sign).","choices":{"D":"x > 8","C":"x < 8","A":"x < 3","B":"x < 16"},"ans":"C","stem":"Which describes all solutions of 2x - 5 < 11?","n":9,"slug":"gri-mod-satm-algebra-1-9"},{"stem":"In the system x + y = 10 and x - y = 4, what is the value of x?","choices":{"A":"3","B":"5","C":"6","D":"7"},"ans":"D","why":"Add the equations: 2x = 14, so x = 7 (and y = 3).","slug":"gri-mod-satm-algebra-1-10","n":10},{"stem":"What is the slope of the line passing through the points (2, 3) and (6, 11)?","ans":"A","choices":{"C":"-2","D":"4","A":"2","B":"1/2"},"why":"Slope = (11 - 3)/(6 - 2) = 8/4 = 2.","slug":"gri-mod-satm-algebra-1-11","n":11},{"slug":"gri-mod-satm-algebra-1-12","n":12,"stem":"For the line y = 3x - 4, what is the value of y when x = 5?","choices":{"C":"-11","D":"19","A":"15","B":"11"},"ans":"B","why":"y = 3(5) - 4 = 15 - 4 = 11."},{"ans":"C","stem":"A number increased by 8 equals 3 times the number. What is the number?","choices":{"C":"4","D":"16","B":"8","A":"2"},"why":"n + 8 = 3n gives 2n = 8, so n = 4.","slug":"gri-mod-satm-algebra-1-13","n":13},{"n":14,"choices":{"B":"(P - l)/2","A":"P - 2l","D":"(P - 2l)/2","C":"2P - 2l"},"slug":"gri-mod-satm-algebra-1-14","why":"P - 2l = 2w, so w = (P - 2l)/2.","stem":"The perimeter of a rectangle is P = 2l + 2w. Which expression gives w in terms of P and l?","ans":"D"},{"why":"2x - 6 = 4x + 2, so -8 = 2x and x = -4.","choices":{"A":"-4","B":"4","C":"-2","D":"2"},"ans":"A","stem":"Solve for x: 2(x - 3) = 4x + 2","n":15,"slug":"gri-mod-satm-algebra-1-15"},{"slug":"gri-mod-satm-algebra-1-16","n":16,"choices":{"C":"x ≤ -2","D":"x ≥ -2","A":"x ≥ 2","B":"x ≤ 2"},"stem":"Which describes all solutions of -3x + 7 ≥ 1?","ans":"B","why":"-3x ≥ -6; dividing by -3 flips the sign, so x ≤ 2."},{"ans":"C","choices":{"D":"-2","C":"2","B":"3","A":"6"},"stem":"In the system 2x + 3y = 12 and x = 3, what is the value of y?","why":"2(3) + 3y = 12, so 3y = 6 and y = 2.","slug":"gri-mod-satm-algebra-1-17","n":17},{"slug":"gri-mod-satm-algebra-1-18","n":18,"stem":"What is the slope of the line 4x + 2y = 8?","ans":"D","choices":{"D":"-2","C":"-4","B":"2","A":"4"},"why":"Solve for y: 2y = -4x + 8, y = -2x + 4, so slope = -2."},{"why":"24 + 5c = 39, so 5c = 15 and c = 3.","stem":"Adult tickets cost $8 and child tickets cost $5. If 3 adult tickets and c child tickets total $39, what is c?","choices":{"A":"3","B":"5","D":"13","C":"8"},"ans":"A","n":19,"slug":"gri-mod-satm-algebra-1-19"},{"why":"x/4 = 4, so x = 16.","choices":{"D":"28","C":"40","A":"1","B":"16"},"stem":"Solve for x: x/4 + 3 = 7","ans":"B","n":20,"slug":"gri-mod-satm-algebra-1-20"},{"stem":"What is the x-intercept of the line y = 3x - 2?","ans":"C","why":"Set y = 0: 0 = 3x - 2, so 3x = 2 and x = 2/3.","slug":"gri-mod-satm-algebra-1-21","choices":{"D":"-2/3","C":"2/3","A":"-2","B":"2"},"n":21},{"n":22,"slug":"gri-mod-satm-algebra-1-22","why":"Parallel lines have equal slopes, so the slope is 1/2.","stem":"A line is parallel to y = (1/2)x + 1. What is the slope of that parallel line?","ans":"D","choices":{"B":"-2","A":"-1/2","D":"1/2","C":"2"}},{"slug":"gri-mod-satm-algebra-1-23","n":23,"ans":"A","stem":"In the system 3x + 2y = 16 and x - 2y = 0, what is the value of x + y?","choices":{"B":"4","A":"6","C":"2","D":"8"},"why":"Add the equations: 4x = 16, x = 4; then y = 2, so x + y = 6."},{"n":24,"slug":"gri-mod-satm-algebra-1-24","why":"7 + 8 = 3x + 2x, so 15 = 5x and x = 3.","stem":"Solve for x: 7 - 2x = 3x - 8","choices":{"A":"-3","B":"3","C":"15","D":"1"},"ans":"B"},{"n":25,"slug":"gri-mod-satm-algebra-1-25","why":"20 + 5c ≤ 60 gives 5c ≤ 40, so c ≤ 8; the maximum is 8.","ans":"C","choices":{"B":"10","A":"6","C":"8","D":"12"},"stem":"A gym charges a $20 membership fee plus $5 per class. With a budget of $60, what is the greatest number of classes that can be taken?"},{"ans":"D","choices":{"C":"a/(c - b)","D":"(c - b)/a","B":"(c + b)/a","A":"(b - c)/a"},"stem":"If ax + b = c and a ≠ 0, which expression equals x?","why":"ax = c - b, so x = (c - b)/a.","slug":"gri-mod-satm-algebra-1-26","n":26},{"why":"15n = 200 - 50 = 150, so n = 10.","stem":"The cost of an order is C = 15n + 50 dollars, where n is the number of items. If C = 200, what is n?","choices":{"A":"10","B":"12","D":"8","C":"15"},"ans":"A","n":27,"slug":"gri-mod-satm-algebra-1-27"},{"why":"2x + 1 = -x + 7 gives 3x = 6, x = 2, then y = 2(2) + 1 = 5.","stem":"At what point do the lines y = 2x + 1 and y = -x + 7 intersect?","choices":{"C":"(-2, 5)","D":"(5, 2)","A":"(2, -5)","B":"(2, 5)"},"ans":"B","n":28,"slug":"gri-mod-satm-algebra-1-28"},{"slug":"gri-mod-satm-algebra-1-29","n":29,"choices":{"C":"-3/2","D":"-2/3","B":"3/2","A":"2/3"},"stem":"What is the slope of a line perpendicular to y = (2/3)x + 4?","ans":"C","why":"Perpendicular slope is the negative reciprocal of 2/3, which is -3/2."},{"slug":"gri-mod-satm-algebra-1-30","n":30,"ans":"D","choices":{"C":"25","D":"24","B":"23","A":"22"},"stem":"The sum of two consecutive integers is 47. What is the larger integer?","why":"n + (n + 1) = 47 gives 2n = 46, n = 23, so the larger integer is 24."}],"t":"mcqquiz"}],"name":"1. Algebra","group":"4 Konu","id":"algebra"},{"eyebrow":"Konu 2","id":"data","group":"4 Konu","name":"2. Problem Solving and Data","blocks":[{"t":"note","title":"Kural","lines":["Yüzde indirim: yeni fiyat = fiyat x (1 - indirim). %25 indirim = x 0.75.","Ortalama = toplam / adet. Toplam = ortalama x adet.","Oran problemlerinde birim değeri bul, sonra ölçekle."],"k":"karar"},{"k":"kapsam","t":"note","title":"Ne ölçülüyor","lines":["Problem Solving and Data Analysis, gerçek hayattan alınmış sayısal ilişkileri okuyup yorumlama becerini ölçer; saf denklem çözmekten çok veriyi anlamaya odaklanır.","Tipik sorular yüzde artış-azalış, oran-orantı kurma, ortalama-medyan-mod hesabı, olasılık, birim çevirme ve tablo/grafik okuma etrafında döner.","Bazı sorular iki değişken arasındaki ilişkiyi (doğrusal mı üstel mi, pozitif mi negatif korelasyon mu) saçılım grafiği veya büyüme modeli üzerinden sorar.","Çoğu soruda sayılar sade tutulur; asıl zorluk hesap değil, doğru oranı veya doğru tabanı seçip problemi doğru kurmaktır."]},{"k":"kavramlar","lines":["Yüzde değişim = (yeni değer - eski değer) / eski değer x 100; sonucun işareti pozitifse artışı, negatifse azalışı gösterir ve taban her zaman ESKİ değerdir.","Oran kurma: iki nicelik orantılıysa a/b = c/d yazılır ve çaprazdan a x d = b x c ile bilinmeyen bulunur; birimlerin karşılıklı aynı sırada olmasına dikkat edilir.","Aritmetik ortalama = tüm değerlerin toplamı / değer sayısı; buradan Toplam = ortalama x adet eşitliğini türetip eksik bir değeri geri bulabilirsin.","Medyan sıralanmış verinin tam ortasındaki değerdir (çift sayıda veride ortadaki iki değerin ortalaması); mod ise en sık tekrarlanan değerdir.","Olasılık = istenen (uygun) durum sayısı / tüm eşit olasılı durum sayısı; sonuç her zaman 0 ile 1 arasındadır ve yüzdeye çevrilebilir.","Birim çevirmenin mantığı çarpanı 1'e eşit kesirlerle işler: örneğin 1 km = 1000 m olduğundan (1000 m / 1 km) ile çarpıp istemediğin birimi sadeleştirirsin.","Doğrusal büyüme her adımda SABİT MİKTAR ekler (y = mx + b), üstel büyüme ise her adımda SABİT ORANLA çarpar (y = a x b üzeri x); doğrusal toplamsal, üstel çarpımsaldır."],"t":"note","title":"Temel kavramlar ve formüller"},{"title":"Karar prosedürü","t":"note","lines":["Önce soruyu sonuna kadar oku ve tam olarak neyin sorulduğuna karar ver: bir yüzde mi, bir oran mı, bir ortalama mı, yoksa bir olasılık mı isteniyor?","Verilen sayıların birimlerini ve neye ait olduklarını işaretle; özellikle yüzde sorularında tabanın hangi değer olduğunu netleştir.","Tabloda veya grafikte cevaba giden satırı, sütunu ya da ekseni bul ve yalnızca gerekli hücreyi oku; fazla veriyle dikkatini dağıtma.","Uygun formülü veya orantı kuruluşunu yaz, sayıları yerine koy ve işlemi adım adım yap; ara sonuçları yuvarlamadan tut.","Cevabı birimiyle birlikte yaz ve mantık kontrolü yap: sonuç büyüklük olarak makul mü, işaret doğru mu, seçenek aralığına uyuyor mu?","Sonuç sorulan birimde değilse (metre istenip santimetre bulunduysa) son adımda çevrimi yaparak düzelt."],"k":"prosedur"},{"k":"alttipler","t":"note","title":"Soru alt tipleri","lines":["Yüzde artış-azalış: bir değerin belirli bir yüzde artması veya azalması sonrası yeni değerini ya da toplam yüzde değişimini bulma.","Oran-orantı: verilen bir oranın farklı bir büyüklükteki karşılığını çaprazlama ile hesaplama (tarif, harita ölçeği, hız problemleri).","Tablo/grafik okuma: çok satırlı tablodan veya çubuk/çizgi grafikten belirli bir değeri ya da iki değer arasındaki farkı çıkarma.","Ortalama-medyan-mod: bir veri kümesinin merkezi eğilim ölçülerini hesaplama veya eksik bir veriyi verilen ortalamadan geri bulma.","Olasılık: bir tablodaki gruplardan rastgele seçilen bir öğenin belirli bir özelliği taşıma olasılığını oranla ifade etme.","Birim çevirme: uzunluk, kütle, zaman veya para birimlerini çarpan kesirleri kullanarak istenen birime dönüştürme.","İki değişken ilişkisi: saçılım grafiğindeki noktaların eğilimini (pozitif/negatif korelasyon, doğrusal/üstel) yorumlama ve en uygun modeli seçme.","Büyüme modeli: bir sürecin sabit miktarla mı yoksa sabit oranla mı değiştiğini ayırt edip doğrusal veya üstel ifadeyle eşleme."]},{"lines":["Problem: Bir mağazada 80 TL olan bir ürün önce yüzde 25 zamlanıp ardından yeni fiyatı üzerinden yüzde 20 indirime giriyor. Son fiyat kaç TL'dir?","Adım 1: Yüzde 25 zam için tabanımız ilk fiyat olan 80 TL'dir; zam miktarı 80 x 0,25 = 20 TL olur.","Adım 2: Zamlı fiyat 80 + 20 = 100 TL'dir; dikkat, ikinci işlemin tabanı artık 80 değil 100 TL'dir.","Adım 3: Yüzde 20 indirim için taban 100 TL olduğundan indirim miktarı 100 x 0,20 = 20 TL olur.","Adım 4: Son fiyat 100 - 20 = 80 TL olarak bulunur.","Sonuç: Ürün tekrar 80 TL'ye gelir; yüzde 25 artıp yüzde 20 azalmak başlangıca döndürür çünkü 1,25 x 0,80 = 1,00'dir.","Ders: Ard arda gelen yüzdeler DOĞRUDAN toplanıp çıkarılmaz; her adımda taban değiştiği için işlemler sırayla yapılır."],"title":"Çözümlü örnek","t":"note","k":"ornek"},{"title":"Sık hatalar","t":"note","lines":["Yüzde tabanını karıştırmak: ikinci yüzde değişimini hâlâ ilk tabana uygulamak; her adımda tabanın güncellenmesi gerektiği unutulur.","Ard arda yüzdeleri toplamak: yüzde 25 artış ile yüzde 20 azalışı net yüzde 5 artış sanmak; çarpımsal etki göz ardı edilir.","Medyan ile ortalamayı karıştırmak: özellikle aşırı büyük veya küçük bir değer varken ortalama yerine medyanın sorulduğunu (veya tersini) fark etmemek.","Medyan bulurken veriyi sıralamayı atlamak; sıralamadan ortadaki değeri almak yanlış sonuç verir.","Birim atlanması: cevabı metre yerine santimetre bırakmak ya da saat-dakika çevrimini yapmadan sayıyı olduğu gibi işaretlemek.","Olasılıkta yanlış paydayı kullanmak: istenen alt grubun sayısını tüm toplam yerine başka bir alt gruba bölmek."],"k":"hatalar"},{"k":"ipuclari","title":"İpuçları ve sınav stratejisi","t":"note","lines":["Grafiklerde önce eksen etiketlerini ve birimleri oku; ölçek bazen binlerle veya yüzdelerle verilir ve bu okuma değerini tümüyle değiştirir.","Yüzde sorularında küçük ve yuvarlak bir sayı (örneğin 100) seçip tahmin yürütmek, doğru seçeneği hızla ayırt etmeni sağlar.","Cevabı hesaplamadan önce büyüklük kestirimi yap: sonuç artmalıysa ilk değerden büyük, azalmalıysa küçük seçenekleri öne al.","Saçılım grafiği ve büyüme sorularında noktalar eşit aralıklarla sabit miktar artıyorsa doğrusal, gitgide hızlanarak katlanıyorsa üsteldir.","Şık eleme yap: birim, işaret veya büyüklük bakımından imkânsız seçenekleri işaretleyerek ele, böylece doğru cevaba daha güvenli yaklaş."]},{"items":[{"slug":"gri-mod-satm-data-1-1","why":"%25 indirim = %75 ödenir. 40 x 0.75 = $30.","ans":"A","stem":"A shirt that normally costs $40 is on sale for 25% off. What is the sale price?","n":1,"choices":{"C":"$10","D":"$35","B":"$15","A":"$30"}},{"slug":"gri-mod-satm-data-1-2","why":"Bir elma 1.50 / 3 = $0.50. 10 elma = $5.00.","stem":"If 3 apples cost $1.50, how much do 10 apples cost at the same rate?","ans":"D","n":2,"choices":{"A":"$4.00","B":"$4.50","C":"$6.00","D":"$5.00"}},{"why":"Hız = yol / süre = 150 / 3 = 50 mph.","ans":"D","choices":{"D":"50 mph","C":"60 mph","B":"45 mph","A":"30 mph"},"stem":"A car travels 150 miles in 3 hours. What is its average speed?","n":3,"slug":"gri-mod-satm-data-1-3"},{"why":"Toplam = ortalama x adet = 12 x 4 = 48.","choices":{"C":"48","D":"36","B":"16","A":"3"},"ans":"C","stem":"The average of four numbers is 12. What is their sum?","n":4,"slug":"gri-mod-satm-data-1-4"},{"why":"Erkek = 30 - 18 = 12. 12 / 30 = 0.40 = %40.","ans":"C","stem":"In a class of 30 students, 18 are girls. What percent of the class are boys?","choices":{"D":"30%","C":"40%","B":"60%","A":"12%"},"n":5,"slug":"gri-mod-satm-data-1-5"},{"slug":"gri-mod-satm-data-1-6","n":6,"choices":{"D":"25","C":"5","A":"9","B":"18"},"stem":"The ratio of cats to dogs is 3 to 5. If there are 15 cats, how many dogs are there?","ans":"D","why":"15 kedi = 3 x 5, yani ölçek 5. Köpek = 5 x 5 = 25."},{"n":7,"slug":"gri-mod-satm-data-1-7","why":"Red share is 3/(3+5) = 3/8. So 3/8 of 40 = 15 red tulips.","ans":"A","stem":"A garden has red and yellow tulips in the ratio 3:5. If there are 40 tulips in total, how many are red?","choices":{"A":"15","B":"24","C":"25","D":"8"}},{"n":8,"slug":"gri-mod-satm-data-1-8","why":"Unit price = 30/4 = $7.50 per pound. Then 10 x 7.50 = $75.","stem":"If 4 pounds of coffee cost $30, how much do 10 pounds of the same coffee cost?","choices":{"A":"$70","B":"$75","D":"$60","C":"$72"},"ans":"B"},{"why":"Speed = distance/time = 210/3.5 = 60 mph.","ans":"C","stem":"A car travels 210 miles in 3.5 hours at a constant rate. What is its average speed in miles per hour?","choices":{"A":"55","B":"70","D":"63","C":"60"},"n":9,"slug":"gri-mod-satm-data-1-9"},{"why":"0.35 x 80 = 28.","ans":"D","stem":"What is 35% of 80?","slug":"gri-mod-satm-data-1-10","choices":{"A":"24","B":"26","C":"30","D":"28"},"n":10},{"slug":"gri-mod-satm-data-1-11","n":11,"ans":"A","stem":"A shirt's price rose from $40 to $50. What is the percent increase?","choices":{"D":"15%","C":"10%","A":"25%","B":"20%"},"why":"Change = 50 - 40 = 10. Percent increase = 10/40 = 0.25 = 25%."},{"choices":{"D":"65","C":"17","B":"60","A":"55"},"stem":"The average (arithmetic mean) of 5 numbers is 12. What is the sum of the 5 numbers?","ans":"B","why":"Sum = mean x count = 12 x 5 = 60.","slug":"gri-mod-satm-data-1-12","n":12},{"slug":"gri-mod-satm-data-1-13","why":"Ordered: 2, 4, 5, 7, 9. The middle value is 5.","stem":"What is the median of the data set 4, 9, 2, 7, 5?","ans":"C","n":13,"choices":{"A":"7","B":"4","D":"9","C":"5"}},{"n":14,"choices":{"A":"3/10","B":"1/2","C":"2/5","D":"1/5"},"slug":"gri-mod-satm-data-1-14","why":"Total = 3+5+2 = 10. P(green) = 2/10 = 1/5.","ans":"D","stem":"A bag contains 3 red, 5 blue, and 2 green marbles. If one marble is drawn at random, what is the probability it is green?"},{"n":15,"slug":"gri-mod-satm-data-1-15","why":"Basketball fraction = 20/60 = 1/3.","stem":"A table shows how 60 students chose a favorite sport: 25 soccer, 20 basketball, and 15 tennis. What fraction of the students chose basketball?","choices":{"D":"5/12","C":"2/5","B":"1/4","A":"1/3"},"ans":"A"},{"slug":"gri-mod-satm-data-1-16","n":16,"choices":{"A":"80","B":"90","C":"110","D":"45"},"stem":"In a survey of 200 people, 45% said they prefer tea over coffee. How many people prefer tea?","ans":"B","why":"0.45 x 200 = 90 people."},{"why":"y = 5(6) + 60 = 30 + 60 = 90.","stem":"A line of best fit relating hours studied (x) to test score (y) is y = 5x + 60. What score does the model predict for a student who studies 6 hours?","choices":{"A":"80","B":"85","D":"95","C":"90"},"ans":"C","n":17,"slug":"gri-mod-satm-data-1-17"},{"n":18,"slug":"gri-mod-satm-data-1-18","why":"1.20 x n = 72, so n = 72/1.20 = 60.","choices":{"B":"90","A":"52","D":"60","C":"86.4"},"ans":"D","stem":"When a number is increased by 20%, the result is 72. What is the original number?"},{"n":19,"slug":"gri-mod-satm-data-1-19","why":"Each ratio unit = 14/2 = 7 animals. Dogs = 7 x 7 = 49.","choices":{"B":"28","A":"49","D":"63","C":"4"},"stem":"The ratio of cats to dogs at a shelter is 2:7. If there are 14 cats, how many dogs are there?","ans":"A"},{"n":20,"choices":{"C":"6","D":"4.5","B":"5","A":"4"},"slug":"gri-mod-satm-data-1-20","stem":"A recipe uses 3 cups of flour to make 12 cookies. At the same rate, how many cups of flour are needed for 20 cookies?","ans":"B","why":"Rate = 3/12 = 0.25 cup per cookie. Then 0.25 x 20 = 5 cups."},{"choices":{"B":"56","A":"48","D":"72","C":"64"},"n":21,"ans":"C","stem":"A printer prints 24 pages in 3 minutes at a constant rate. How many pages does it print in 8 minutes?","why":"Rate = 24/3 = 8 pages per minute. Then 8 x 8 = 64 pages.","slug":"gri-mod-satm-data-1-21"},{"n":22,"slug":"gri-mod-satm-data-1-22","why":"Pay 70% of 90: 0.70 x 90 = $63.","stem":"A jacket that normally costs $90 is on sale for 30% off. What is the sale price?","choices":{"D":"$63","C":"$70","B":"$27","A":"$60"},"ans":"D"},{"why":"Decrease = 100. Percent = 100/500 = 0.20 = 20%.","stem":"The population of a town fell from 500 to 400 in one year. What was the percent decrease?","ans":"A","choices":{"D":"15%","C":"10%","A":"20%","B":"25%"},"n":23,"slug":"gri-mod-satm-data-1-23"},{"slug":"gri-mod-satm-data-1-24","n":24,"stem":"The mean of the four numbers 4, 8, x, and 10 is 9. What is the value of x?","choices":{"C":"9","D":"16","A":"12","B":"14"},"ans":"B","why":"Sum must be 9 x 4 = 36. Known sum = 4+8+10 = 22, so x = 36 - 22 = 14."},{"n":25,"slug":"gri-mod-satm-data-1-25","why":"There are 7 ordered values; the 4th (middle) value is 8.","ans":"C","choices":{"A":"3","B":"5","C":"8","D":"6"},"stem":"What is the median of the data set 3, 3, 5, 8, 8, 8, 10?"},{"why":"Numbers greater than 5 are 6, 7, 8 (3 outcomes). P = 3/8.","ans":"D","choices":{"D":"3/8","C":"5/8","A":"1/2","B":"1/4"},"stem":"A spinner has 8 equal sections numbered 1 through 8. What is the probability of landing on a number greater than 5?","n":26,"slug":"gri-mod-satm-data-1-26"},{"stem":"A store recorded daily sales of 20, 30, 25, and 25 units from Monday to Thursday. What was the average number of sales per day?","ans":"A","why":"Sum = 20+30+25+25 = 100. Average = 100/4 = 25.","slug":"gri-mod-satm-data-1-27","choices":{"D":"27","C":"30","B":"20","A":"25"},"n":27},{"choices":{"D":"24","C":"18","B":"16","A":"20"},"n":28,"ans":"B","stem":"In a class the ratio of boys to girls is 5:4. If there are 36 students in all, how many are girls?","why":"Girls share = 4/(5+4) = 4/9. So 4/9 of 36 = 16 girls.","slug":"gri-mod-satm-data-1-28"},{"slug":"gri-mod-satm-data-1-29","n":29,"stem":"A quantity y is directly proportional to x, and y = 15 when x = 3. What is y when x = 8?","choices":{"A":"20","B":"30","D":"45","C":"40"},"ans":"C","why":"Constant k = 15/3 = 5, so y = 5x. When x = 8, y = 5 x 8 = 40."},{"why":"C = 20 + 0.10(150) = 20 + 15 = $35.","ans":"D","stem":"A phone plan charges a $20 monthly fee plus $0.10 per minute, modeled by C = 20 + 0.10m. What is the cost for 150 minutes?","choices":{"D":"$35","C":"$32","B":"$150","A":"$30"},"n":30,"slug":"gri-mod-satm-data-1-30"}],"t":"mcqquiz"}]},{"id":"advanced","group":"4 Konu","blocks":[{"t":"note","title":"Kural","lines":["x² = a ise x = +sqrt(a) veya -sqrt(a). İki kök unutulmaz.","Çarpanlara ayırma: x² + bx + c için çarpımı c, toplamı b olan iki sayı bul.","Fonksiyonda f(3), x yerine 3 koymaktır. Üslerde 2⁵ = 32 gibi değerleri bil."],"k":"karar"},{"title":"Ne ölçülüyor","t":"note","lines":["Advanced Math (Passport to Advanced Math) bölümü, ikinci derece denklemler, parabol grafikleri, polinomlar, rasyonel ifadeler, üslü-köklü ifadeler ve fonksiyon gösterimi gibi ileri cebir konularını ölçer.","Tipik sorular; bir ikinci derece denklemin köklerini bulma, diskriminant üzerinden kök sayısını yorumlama, parabolün tepe noktası veya x-kesişimlerini belirleme, f(x) türü fonksiyon değerlerini hesaplama ve üstel büyüme/azalma modellerini okuma etrafında döner.","Bazı sorular denklemi doğrudan çözmeni ister; bazıları ise bir ifadeyi eşdeğer başka bir biçime dönüştürmeni (ör. çarpanlarına ayrılmış hâle veya tepe noktası formuna) ister.","SAT bu bölümde hem kağıt-kalem cebiri hem de grafik yorumlama becerini birlikte test eder; yani hem işlem doğruluğu hem de kavramsal anlayış gereklidir."],"k":"kapsam"},{"k":"kavram-formul","title":"Temel kavramlar ve formüller","t":"note","lines":["Genel ikinci derece denklem ax² + bx + c = 0 biçimindedir; burada a ≠ 0 olmalıdır, aksi halde denklem birinci dereceye düşer.","İkinci derece (kök) formülü: x = (-b ± √(b² - 4ac)) / (2a). Buradaki ± işareti çoğu zaman iki ayrı kök verir, bu yüzden her iki işareti de hesaplamalısın.","Diskriminant Δ = b² - 4ac köklerin doğasını belirler: Δ > 0 ise iki farklı gerçek kök, Δ = 0 ise bir (çift) gerçek kök, Δ < 0 ise gerçek kök yoktur (iki karmaşık kök).","Çarpanlara ayırma: x² + (p+q)x + pq = (x + p)(x + q); yani sabit terimi verecek (çarpımı c) ve orta terimi verecek (toplamı b/a) iki sayı ararsın. Çarpım sıfırsa çarpanlardan biri sıfırdır (sıfır çarpım kuralı).","Parabolün formları: standart form y = ax² + bx + c, çarpan form y = a(x - r₁)(x - r₂) (r₁, r₂ kökler), tepe (vertex) form y = a(x - h)² + k (tepe noktası (h, k)).","Tepe noktasının x koordinatı h = -b / (2a); y koordinatı ise k = f(h) yani bu x değerini denklemde yerine koyarak bulunur. a > 0 ise parabol yukarı açılır (minimum), a < 0 ise aşağı açılır (maksimum).","Üs kuralları: xᵐ · xⁿ = x⁽ᵐ⁺ⁿ⁾, xᵐ / xⁿ = x⁽ᵐ⁻ⁿ⁾, (xᵐ)ⁿ = x⁽ᵐ·ⁿ⁾, x⁰ = 1 (x ≠ 0), x⁻ⁿ = 1 / xⁿ, x^(1/n) = ⁿ√x ve x^(m/n) = ⁿ√(xᵐ).","Rasyonel ifade P(x)/Q(x) ancak Q(x) ≠ 0 için tanımlıdır; sadeleştirmede pay ve paydayı çarpanlarına ayırıp ortak çarpanları götürürsün ama paydayı sıfır yapan değerler tanım dışı kalır."]},{"t":"note","title":"Karar prosedürü","lines":["1. Adım: Denklemi düzenle. Tüm terimleri bir tarafa toplayıp ax² + bx + c = 0 standart biçimine getir ve a, b, c katsayılarını net olarak belirle.","2. Adım: Çarpanlara ayrılabilir mi diye bak. Çarpımı a·c, toplamı b olan iki tam sayı kolayca bulunabiliyorsa çarpanlara ayır; bu en hızlı yoldur.","3. Adım: Kolay çarpan yoksa diskriminant Δ = b² - 4ac hesapla. Δ negatifse gerçek kök yoktur; sıfır veya pozitifse kök formülünü uygula.","4. Adım: Kök formülünü x = (-b ± √(b² - 4ac)) / (2a) ile uygula; karekök içini ve işaretleri dikkatle hesapla, ± ile iki kökü ayrı ayrı yaz.","5. Adım: Soru grafik istiyorsa tepe noktasını h = -b/(2a) ve k = f(h) ile, kesişimleri ise kökler (x-kesişim) ve c (y-kesişim, x=0'da) ile belirle.","6. Adım: Bulduğun kökü/değeri orijinal denklemde yerine koyarak kontrol et ve sorunun ne istediğini (kök mü, kök sayısı mı, bir katsayı mı) yeniden oku."],"k":"prosedur"},{"k":"alt-tipler","lines":["Çarpanlara ayırma: Verilen ikinci derece ifadeyi (x + p)(x + q) gibi iki çarpanın çarpımı biçiminde yazma.","Kök bulma: ax² + bx + c = 0 denkleminin x değerlerini çarpanlama veya kök formülüyle bulma.","Diskriminant yorumu: b² - 4ac işaretinden denklemin kaç gerçek çözümü olduğunu (0, 1 veya 2) söyleme.","Parabol tepe ve kesişim: Tepe noktası (h, k), x-kesişimleri (kökler) ve y-kesişimini belirleme veya grafikten katsayı okuma.","Fonksiyon değeri: f(x) tanımı verildiğinde f(3) gibi belirli bir değeri hesaplama veya f(a) = 0 koşulundan bilinmeyeni bulma.","Üstel büyüme/azalma: y = a·bˣ modelinde b > 1 büyüme, 0 < b < 1 azalma; başlangıç değeri a ve oranı yorumlama.","Rasyonel sadeleştirme: Pay ve paydayı çarpanlarına ayırıp ortak çarpanları sadeleştirme, tanımsız (paydayı sıfırlayan) değerleri dışlama.","Eşdeğer ifade / form dönüştürme: Bir ifadeyi standart, çarpan veya tepe noktası formu arasında dönüştürme."],"title":"Soru alt tipleri","t":"note"},{"lines":["Problem: 2x² - 4x - 6 = 0 denkleminin köklerini bul ve parabolün tepe noktasını yaz.","1. Adım: Tüm terimlerin ortak çarpanı 2'dir; 2 parantezine alalım: 2(x² - 2x - 3) = 0, yani x² - 2x - 3 = 0.","2. Adım: Çarpımı -3, toplamı -2 olan iki sayı ararız: -3 ve +1 uygundur, çünkü (-3)·(1) = -3 ve (-3)+(1) = -2.","3. Adım: Çarpanlara ayrılmış hâli (x - 3)(x + 1) = 0 olur; sıfır çarpım kuralıyla x - 3 = 0 veya x + 1 = 0.","4. Adım: Kökler x = 3 ve x = -1 bulunur. Kontrol: 2(3)² - 4(3) - 6 = 18 - 12 - 6 = 0 doğru.","5. Adım: Tepe noktasının x'i h = -b/(2a) = -(-4)/(2·2) = 4/4 = 1; y'si k = 2(1)² - 4(1) - 6 = 2 - 4 - 6 = -8.","Sonuç: Kökler x = -1 ve x = 3; tepe noktası (1, -8) ve a = 2 > 0 olduğu için parabol yukarı açılır, bu nokta minimumdur."],"title":"Çözümlü örnek","t":"note","k":"ornek"},{"title":"Sık hatalar","t":"note","lines":["İşaret hatası: Kök formülünde -b'yi yanlış almak. Örneğin b = -4 iken -b = +4'tür; eksinin eksisini artı yapmayı unutma.","Kökleri unutmak (±): Karekök alırken sadece pozitif kökü yazıp negatif kökü atlamak. √(b² - 4ac) ifadesi ± ile iki çözüm doğurur.","Diskriminant yanlış yorumu: Δ < 0 iken 'kök yok' yerine yanlışlıkla kök aramak veya Δ = 0'ı 'kök yok' sanmak. Δ = 0 tam olarak bir (çift) gerçek kök verir.","Rasyonel ifadede tanım kümesini unutmak: Sadeleştirdikten sonra bile paydayı orijinalinde sıfır yapan x değerleri tanımsızdır; bunları çözüme dahil etmek hatadır.","Üs kurallarını karıştırmak: (xᵐ)ⁿ = x⁽ᵐ·ⁿ⁾ iken xᵐ · xⁿ = x⁽ᵐ⁺ⁿ⁾'dir; çarpma ile üs alma kurallarını birbirine karıştırmak yaygın hatadır.","Ortak çarpanı atlamak: 2x² - 4x - 6 gibi ifadelerde önce 2'yi dışarı almadan çarpanlara ayırmaya çalışmak işlemi zorlaştırır ve hataya açık hâle getirir."],"k":"hatalar"},{"t":"note","title":"İpuçları ve sınav stratejisi","lines":["Şıkları yerine koy: Kökleri sorulan denklemde, verilen seçenekleri x yerine koyup denklemi sıfır yapan değeri hızla bulabilirsin; cebirle uğraşmaktan hızlı olabilir.","Çarpan tahmini: Sabit terimin tam sayı çarpanlarını (bölenlerini) düşün; SAT sorularında kökler genelde küçük tam sayılardır, bu yüzden çarpanlar hızla tahmin edilebilir.","Diskriminantla hız kazan: Soru yalnızca 'kaç çözüm var' diye soruyorsa kökleri bulma, sadece b² - 4ac işaretine bak; bu zaman kazandırır.","Grafik-cebir köprüsü: x-kesişimleri köklere, y-kesişimi x=0'daki değere (yani c'ye), tepe noktası h = -b/(2a)'ya karşılık gelir; bunları ezberlemek grafik sorularını hızlandırır.","Hesap makinesini akıllı kullan: İzin verilen bölümde köklerin ondalık değerini veya denklemin grafiğini makineyle doğrula, ama önce cebirsel yapıyı anla ki hangi değeri arayacağını bilesin."],"k":"ipuclari"},{"t":"mcqquiz","items":[{"n":1,"slug":"gri-mod-satm-advanced-1-1","why":"x² = 9, x = +3 veya -3. İki kök.","choices":{"D":"x = 3 or x = -3","C":"x = 9","A":"x = 3 only","B":"x = -3 only"},"stem":"What are the solutions to x² - 9 = 0?","ans":"D"},{"n":2,"slug":"gri-mod-satm-advanced-1-2","why":"f(3) = 2(3²) + 1 = 2 x 9 + 1 = 19.","ans":"B","stem":"If f(x) = 2x² + 1, what is f(3)?","choices":{"C":"7","D":"37","A":"13","B":"19"}},{"choices":{"D":"(x + 5)(x + 1)","C":"(x - 2)(x - 3)","B":"(x + 2)(x + 3)","A":"(x + 1)(x + 6)"},"ans":"B","stem":"Which of the following is the factored form of x² + 5x + 6?","why":"Çarpımı 6, toplamı 5 olan sayılar 2 ve 3. (x+2)(x+3).","slug":"gri-mod-satm-advanced-1-3","n":3},{"stem":"If 2ˣ = 32, what is the value of x?","choices":{"D":"16","C":"5","B":"6","A":"4"},"ans":"C","why":"2⁵ = 32, yani x = 5.","slug":"gri-mod-satm-advanced-1-4","n":4},{"slug":"gri-mod-satm-advanced-1-5","stem":"For x not equal to 2, the expression (x² - 4)/(x - 2) simplifies to:","ans":"A","why":"x² - 4 = (x - 2)(x + 2). (x-2) sadeleşir, x + 2 kalır.","n":5,"choices":{"D":"2","C":"x²","A":"x + 2","B":"x - 2"}},{"slug":"gri-mod-satm-advanced-1-6","n":6,"choices":{"B":"-3","A":"3","D":"5","C":"6"},"stem":"What is the x-coordinate of the vertex of y = x² - 6x + 5?","ans":"A","why":"Tepe noktası x = -b / (2a) = 6 / 2 = 3."},{"why":"Factor (x - 2)(x - 3) = 0, so x = 2 or x = 3.","stem":"Solve x² - 5x + 6 = 0.","ans":"C","slug":"gri-mod-satm-advanced-1-7","choices":{"D":"x = -1 or x = -6","C":"x = 2 or x = 3","A":"x = -2 or x = -3","B":"x = 1 or x = 6"},"n":7},{"ans":"A","stem":"Factor completely: x² - 7x + 12.","choices":{"A":"(x - 3)(x - 4)","B":"(x + 3)(x + 4)","D":"(x - 1)(x - 12)","C":"(x - 2)(x - 6)"},"why":"Need two numbers with product 12 and sum -7: -3 and -4.","slug":"gri-mod-satm-advanced-1-8","n":8},{"slug":"gri-mod-satm-advanced-1-9","n":9,"stem":"Simplify (2x²y³)(3x⁴y).","choices":{"A":"6x⁸y³","B":"5x⁶y⁴","C":"6x⁶y³","D":"6x⁶y⁴"},"ans":"D","why":"Multiply coefficients 2·3 = 6; add exponents: x²·x⁴ = x⁶, y³·y = y⁴."},{"why":"f(5) = 3(5) - 4 = 15 - 4 = 11.","choices":{"C":"19","D":"15","A":"1","B":"11"},"stem":"If f(x) = 3x - 4, what is f(5)?","ans":"B","n":10,"slug":"gri-mod-satm-advanced-1-10"},{"slug":"gri-mod-satm-advanced-1-11","stem":"Simplify √(50).","ans":"A","why":"50 = 25·2, and √25 = 5, so √50 = 5√2.","n":11,"choices":{"B":"25√2","A":"5√2","C":"2√5","D":"10√5"}},{"choices":{"B":"x = 8 or x = -8","A":"x = 16 only","D":"x = 4 or x = -4","C":"x = 4 only"},"ans":"D","stem":"What are the roots of x² - 16 = 0?","why":"x² = 16 gives x = ±4.","slug":"gri-mod-satm-advanced-1-12","n":12},{"why":"(x + 3)² = x² + 2·3·x + 9 = x² + 6x + 9.","stem":"Expand (x + 3)².","ans":"B","slug":"gri-mod-satm-advanced-1-13","choices":{"A":"x² + 9","B":"x² + 6x + 9","C":"x² + 3x + 9","D":"x² + 6x + 6"},"n":13},{"why":"Divide same base: subtract exponents 5 - 2 = 3.","ans":"C","stem":"Simplify (x⁵)/(x²), where x ≠ 0.","choices":{"C":"x³","D":"x¹⁰","A":"x^2.5","B":"x⁷"},"n":14,"slug":"gri-mod-satm-advanced-1-14"},{"n":15,"choices":{"B":"(2, -3)","A":"(-2, 3)","C":"(-2, -3)","D":"(2, 3)"},"slug":"gri-mod-satm-advanced-1-15","ans":"D","stem":"What is the vertex of y = (x - 2)² + 3?","why":"In vertex form y = (x - h)² + k, the vertex is (h, k) = (2, 3)."},{"slug":"gri-mod-satm-advanced-1-16","n":16,"ans":"A","stem":"Solve x² + 6x + 9 = 0.","choices":{"B":"x = 3","A":"x = -3","C":"x = -3 or x = 3","D":"x = 9"},"why":"x² + 6x + 9 = (x + 3)² = 0, so x = -3."},{"slug":"gri-mod-satm-advanced-1-17","n":17,"ans":"C","choices":{"A":"-9","B":"-6","C":"1/9","D":"9"},"stem":"Evaluate 3⁻².","why":"A negative exponent gives a reciprocal: 3⁻² = 1/3² = 1/9."},{"why":"g(-3) = (-3)² - 2(-3) = 9 + 6 = 15.","choices":{"A":"3","B":"15","C":"-15","D":"9"},"ans":"B","stem":"If g(x) = x² - 2x, find g(-3).","n":18,"slug":"gri-mod-satm-advanced-1-18"},{"slug":"gri-mod-satm-advanced-1-19","why":"32 = 2⁵, so x = 5.","stem":"Solve for x: 2ˣ = 32.","ans":"A","n":19,"choices":{"A":"5","B":"16","C":"6","D":"4"}},{"slug":"gri-mod-satm-advanced-1-20","why":"Need product -12 and sum -1: -4 and +3, giving (x - 4)(x + 3).","stem":"Factor x² - x - 12.","ans":"D","n":20,"choices":{"B":"(x + 4)(x - 3)","A":"(x - 6)(x + 2)","C":"(x - 12)(x + 1)","D":"(x - 4)(x + 3)"}},{"n":21,"choices":{"D":"8","C":"64","A":"4","B":"16"},"slug":"gri-mod-satm-advanced-1-21","why":"Take half of 8 and square it: (8/2)² = 16.","ans":"B","stem":"To complete the square, what constant makes x² + 8x + ? a perfect square?"},{"stem":"Simplify (3x)³.","ans":"C","why":"(3x)³ = 3³·x³ = 27x³.","slug":"gri-mod-satm-advanced-1-22","choices":{"B":"3x³","A":"9x³","D":"27x","C":"27x³"},"n":22},{"n":23,"choices":{"A":"x = -1 and x = -3","B":"x = 2 and x = 3","C":"x = -1 and x = 3","D":"x = 1 and x = 3"},"slug":"gri-mod-satm-advanced-1-23","stem":"At what x-values does y = x² - 4x + 3 cross the x-axis?","ans":"D","why":"Set 0 = (x - 1)(x - 3), so x = 1 or x = 3."},{"slug":"gri-mod-satm-advanced-1-24","n":24,"choices":{"C":"x²","D":"6x","B":"x¹²","A":"x³"},"stem":"Simplify √(x⁶), where x ≥ 0.","ans":"A","why":"√(x⁶) = x^(6/2) = x³."},{"why":"f(4) = 17 and f(2) = 5, so 17 - 5 = 12.","choices":{"B":"22","A":"10","D":"14","C":"12"},"stem":"If f(x) = x² + 1, find f(4) - f(2).","ans":"C","n":25,"slug":"gri-mod-satm-advanced-1-25"},{"choices":{"D":"(2, 2) and (-1, -1)","C":"(-2, 4) and (1, 1)","A":"(2, 4) and (1, 1)","B":"(2, 4) and (-1, 1)"},"ans":"B","stem":"Solve the system y = x² and y = x + 2.","why":"x² = x + 2 gives x² - x - 2 = (x - 2)(x + 1) = 0, so x = 2 or -1; then y = x².","slug":"gri-mod-satm-advanced-1-26","n":26},{"choices":{"A":"x + 2","B":"x - 2","D":"2","C":"x² - 2"},"stem":"Simplify (x² - 4)/(x - 2), where x ≠ 2.","ans":"A","why":"x² - 4 = (x - 2)(x + 2); cancel (x - 2) to get x + 2.","slug":"gri-mod-satm-advanced-1-27","n":27},{"stem":"Write y = x² - 6x + 5 in vertex form.","choices":{"D":"(x - 6)² - 4","C":"(x - 3)² - 4","A":"(x - 3)² + 5","B":"(x + 3)² - 4"},"ans":"C","why":"Half of -6 is -3: (x - 3)² = x² - 6x + 9, so subtract 4 to keep +5.","slug":"gri-mod-satm-advanced-1-28","n":28},{"slug":"gri-mod-satm-advanced-1-29","n":29,"stem":"Simplify (a^(1/2))(a^(1/2)), where a > 0.","choices":{"A":"a^(1/4)","B":"2a^(1/2)","C":"a²","D":"a"},"ans":"D","why":"Add exponents: 1/2 + 1/2 = 1, so the result is a."},{"n":30,"slug":"gri-mod-satm-advanced-1-30","why":"-16t(t - 2) = 0 gives t = 0 or t = 2; the positive solution is t = 2.","choices":{"C":"t = 32","D":"t = 16","A":"t = 1","B":"t = 2"},"stem":"A ball's height is h(t) = -16t² + 32t. For t > 0, when does it return to h = 0?","ans":"B"}]}],"name":"3. Advanced Math","eyebrow":"Konu 3"},{"eyebrow":"Konu 4","group":"4 Konu","id":"geometry","blocks":[{"k":"karar","t":"note","title":"Kural","lines":["Dik üçgende Pisagor: a² + b² = c² (c hipotenüs).","Çember: alan = pi r², çevre = 2 pi r = pi d. Üçgende iç açılar toplamı 180.","Temel trig: sin = karşı/hipotenüs, cos = komşu/hipotenüs, tan = karşı/komşu."]},{"lines":["Bu bölüm düzlem geometrisini (açılar, üçgenler, dörtgenler, çember) ve trigonometrinin temel oranlarını (sin, cos, tan) bir arada sınar; SAT Math'te toplam soruların yaklaşık %15'ini oluşturur.","Tipik sorular bir şekildeki bilinmeyen açıyı veya kenarı bulmanı, iki benzer üçgen arasında oran kurmanı ya da bir dik üçgende Pisagor teoremini uygulamanı ister.","Alan, çevre ve hacim hesapları; koordinat düzleminde iki nokta arası uzaklık; radyan-derece dönüşümü ve özel üçgenlerin kenar oranları da sık sorulur.","Sorular çoğu zaman formülü doğrudan vermez; senden şekli okumanı, doğru formülü seçmeni ve birden fazla adımı zincirleme uygulamanı bekler."],"title":"Ne ölçülüyor","t":"note","k":"kapsam"},{"lines":["Pisagor teoremi yalnızca dik üçgende geçerlidir: dik açının karşısındaki en uzun kenar hipotenüs olmak üzere a² + b² = c². Örneğin dik kenarları 3 ve 4 olan üçgenin hipotenüsü √(9+16) = 5 çıkar.","Bir üçgenin iç açılarının toplamı her zaman 180 derecedir; bir dörtgende ise iç açılar toplamı 360 derecedir. Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir.","Benzer üçgenlerde karşılıklı açılar eşit, karşılıklı kenarlar orantılıdır; kenar oranı k ise alanların oranı k² olur. Örneğin kenarları 2 kat büyükse alan 4 kat büyür.","Çemberde alan A = πr² ve çevre C = 2πr formülleriyle bulunur; çap d = 2r'dir. Bir yayın uzunluğu, merkez açının 360'a oranı çarpı çevre; dilim (sektör) alanı ise aynı oran çarpı πr²'dir.","45-45-90 üçgeninde kenar oranı 1 : 1 : √2'dir, yani hipotenüs bir dik kenarın √2 katıdır. 30-60-90 üçgeninde oran 1 : √3 : 2'dir; 30 karşısı kısa kenar, 60 karşısı √3 katı, 90 karşısı 2 katıdır.","Trigonometride SOH-CAH-TOA hatırlatıcısı kullanılır: sin = karşı / hipotenüs, cos = komşu / hipotenüs, tan = karşı / komşu. Ayrıca bir dik üçgende tan = sin / cos ilişkisi geçerlidir.","Birbirini 90 dereceye tamamlayan iki açıda birinin sinüsü diğerinin kosinüsüne eşittir: sin(x) = cos(90 - x). Radyan dönüşümünde 180 derece = π radyandır, yani derece × (π / 180) = radyan.","Hacim formülleri: dikdörtgenler prizması V = uzunluk × genişlik × yükseklik, silindir V = πr²h, küre V = (4/3)πr³, koni V = (1/3)πr²h. Alan iki boyutludur (birim²), hacim üç boyutludur (birim³)."],"title":"Temel kavramlar ve formüller","t":"note","k":"formuller"},{"lines":["1. Şekli oku ve verilenleri işaretle: hangi kenarlar ve açılar biliniyor, ne isteniyor? Şekil yoksa hızlıca kendi taslağını çiz.","2. Üçgenin türünü belirle: dik üçgen mi, özel üçgen (30-60-90 / 45-45-90) mi, yoksa benzer üçgen kurgusu mu var? Bu, kullanacağın aracı belirler.","3. Doğru aracı seç: kenar arıyorsan ve dik üçgen varsa Pisagor ya da trig oranı; açı arıyorsan iç açı toplamı ya da trig ters oranı; oran varsa benzerlik denklemi kur.","4. Formülü yaz ve bilinenleri yerine koy; birimlere dikkat et (yarıçap mı çap mı, derece mi radyan mı verilmiş?).","5. Denklemi çöz ve sonucu şekilde mantık kontrolünden geçir: hipotenüs en uzun kenar mı çıktı, açı 0-180 arasında mı, alan pozitif mi?","6. Cevabı istenen birim ve biçimde ver; örneğin 'π cinsinden' isteniyorsa π'yi ondalığa çevirmeden bırak."],"title":"Karar prosedürü","t":"note","k":"prosedur"},{"lines":["Açı bulma: iç açı toplamı, dış açı, doğrusal çift (180) veya paralel doğrularda ters/yöndeş açı ilişkileriyle bilinmeyen açıyı hesaplama.","Benzer üçgen oranı: karşılıklı kenarları orantılayıp çapraz çarpımla eksik kenarı bulma; alan oranının kenar oranının karesi olduğunu kullanma.","Pisagor uygulaması: dik üçgende iki kenardan üçüncüsünü bulma veya bir üçgenin dik olup olmadığını a² + b² = c² ile test etme.","Çember: yay uzunluğu, kiriş, sektör alanı ve merkez açı ilişkilerini kurma; teğet-yarıçap dikliğini kullanma.","Alan ve hacim: karma şekillerin alanını parçalara ayırarak bulma; prizma, silindir, küre, koni hacimlerini formülle hesaplama.","Koordinatta uzaklık: iki nokta arası mesafeyi d = √((x₂-x₁)² + (y₂-y₁)²) ile, orta noktayı koordinat ortalamasıyla bulma.","Trigonometri oranı: bir dik üçgende sin, cos veya tan değerini kenar oranından bulma ya da verilen orandan eksik kenarı çözme.","Radyan-derece dönüşümü: derece × (π/180) veya radyan × (180/π) ile iki birim arasında geçiş yapma."],"title":"Soru alt tipleri","t":"note","k":"alttipler"},{"k":"ornek","t":"note","title":"Çözümlü örnek","lines":["Problem: Bir dik üçgende dik açının bitişiğindeki bir açı 30 derecedir ve bu açının karşısındaki kenar 5 birimdir. Hipotenüsün uzunluğu kaçtır?","Adım 1: Üçgen dik olduğu ve bir açısı 30 derece olduğu için üçüncü açı 180 - 90 - 30 = 60 derecedir; yani bu bir 30-60-90 özel üçgenidir.","Adım 2: 30-60-90 üçgeninde kenar oranı 1 : √3 : 2'dir. 30 derecenin karşısındaki (en kısa) kenar '1' oranına karşılık gelir.","Adım 3: 30 derece karşısındaki kenar 5 verildiğine göre bu kenar '1' birimini temsil eder; hipotenüs ise '2' oranındadır.","Adım 4: O halde hipotenüs = 2 × 5 = 10 birimdir.","Kontrol: sin(30) = karşı / hipotenüs = 5 / 10 = 0,5 çıkar ve gerçekten sin(30) = 0,5'tir, sonuç tutarlıdır.","Sonuç: Hipotenüsün uzunluğu 10 birimdir."]},{"lines":["Hipotenüsü karıştırmak: Pisagor'da c her zaman dik açının karşısındaki en uzun kenardır; kenarları rastgele a² + b² = c²'ye yerleştirmek yanlış sonuç verir.","Derece ile radyanı karıştırmak: bir açı radyan verilmişse önce dereceye çevirmeden trig değerini ezberden yazmak hataya yol açar; 180 derece = π radyan ilişkisini kullan.","Yarıçap ile çapı karıştırmak: soruda çap verilmişse formüldeki r için çapın yarısını almalısın; çapı doğrudan r yerine koymak alanı 4 katına, çevreyi 2 katına şişirir.","Birim hatası: alanı birim² yerine birim, hacmi birim³ yerine birim² yazmak yaygın bir kayıptır; boyut sayısını daima kontrol et.","Benzerlikte alan oranını doğrudan kenar oranıyla eşitlemek: kenar oranı k ise alan oranı k²'dir; bunu unutmak alan sorularında hataya neden olur.","π'yi erken yuvarlamak: 'π cinsinden' istenen cevapta π'yi 3,14 ile değiştirmek ya da tersine, sayısal isteniyorken π bırakmak puan kaybettirir."],"title":"Sık hatalar","t":"note","k":"hatalar"},{"k":"ipuclari","lines":["Her zaman bir şekil çiz veya verilen şekli büyütüp üzerine bilinen değerleri işaretle; görselleştirmek doğru formülü seçmeyi kolaylaştırır.","Özel üçgenleri hızlı tanı: bir açı 45 veya 30/60 görünce kenar oranlarını (1:1:√2 ve 1:√3:2) doğrudan uygula, uzun hesaba girme.","SAT sana referans formül kartı verir; alan, hacim ve özel üçgen oranları oradadır, ama zaman kazanmak için en sık kullanılanları ezberle.","Cevabı mantık süzgecinden geçir: hipotenüs dik kenarlardan uzun mu, açı toplamı 180 mi, alan pozitif mi? Tutarsızlık varsa adımları geri izle.","Karmaşık şekilleri tanıdık parçalara böl (dikdörtgen + üçgen gibi) ve her parçanın alanını ayrı hesaplayıp topla; bu yaklaşım zor görünen soruları basitleştirir."],"title":"İpuçları ve sınav stratejisi","t":"note"},{"items":[{"slug":"gri-mod-satm-geometry-1-1","stem":"A right triangle has legs of length 3 and 4. What is the length of the hypotenuse?","ans":"B","why":"3² + 4² = 9 + 16 = 25, hipotenüs = sqrt(25) = 5.","n":1,"choices":{"D":"12","C":"7","B":"5","A":"6"}},{"stem":"What is the area of a circle with radius 5? (Use A = pi r²)","choices":{"C":"5 pi","D":"50 pi","A":"25 pi","B":"10 pi"},"ans":"A","why":"A = pi x 5² = 25 pi.","slug":"gri-mod-satm-geometry-1-2","n":2},{"choices":{"B":"80","A":"70","C":"90","D":"60"},"n":3,"stem":"Two angles of a triangle measure 50 and 60 degrees. What is the third angle?","ans":"A","why":"İç açılar toplamı 180. 180 - 50 - 60 = 70.","slug":"gri-mod-satm-geometry-1-3"},{"why":"Çevre = 2(uzunluk + genişlik) = 2(8 + 3) = 22.","choices":{"D":"24","C":"22","A":"11","B":"16"},"ans":"C","stem":"A rectangle has length 8 and width 3. What is its perimeter?","n":4,"slug":"gri-mod-satm-geometry-1-4"},{"choices":{"C":"0.75","D":"1.67","B":"0.6","A":"0.8"},"stem":"In a right triangle, the side opposite an angle is 6 and the hypotenuse is 10. What is the sine of that angle?","ans":"B","why":"sin = karşı / hipotenüs = 6 / 10 = 0.6.","slug":"gri-mod-satm-geometry-1-5","n":5},{"n":6,"slug":"gri-mod-satm-geometry-1-6","why":"C = pi x d = pi x 10 = 10 pi.","ans":"A","choices":{"A":"10 pi","B":"5 pi","C":"20 pi","D":"100 pi"},"stem":"What is the circumference of a circle with diameter 10? (Use C = pi d)"},{"slug":"gri-mod-satm-geometry-1-7","ans":"A","stem":"A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?","why":"By the Pythagorean theorem, c² = 6² + 8² = 36 + 64 = 100, so c = √100 = 10.","n":7,"choices":{"B":"14","A":"10","C":"√28","D":"48"}},{"slug":"gri-mod-satm-geometry-1-8","n":8,"choices":{"B":"34","A":"60","D":"24","C":"17"},"ans":"B","stem":"A rectangle has length 12 and width 5. What is its perimeter?","why":"Perimeter = 2(length + width) = 2(12 + 5) = 2(17) = 34. (60 is the area.)"},{"n":9,"slug":"gri-mod-satm-geometry-1-9","why":"Area = πr² = π(5²) = 25π. (10π is the circumference.)","ans":"B","stem":"A circle has a radius of 5. What is its area?","choices":{"B":"25π","A":"10π","D":"50π","C":"5π"}},{"why":"Circumference = πd = π(14) = 14π. (49π uses r² for area with r = 7.)","choices":{"C":"14π","D":"28π","B":"49π","A":"7π"},"stem":"A circle has a diameter of 14. What is its circumference?","ans":"C","n":10,"slug":"gri-mod-satm-geometry-1-10"},{"slug":"gri-mod-satm-geometry-1-11","n":11,"stem":"In a circle of radius 8, an arc is subtended by a central angle of 90°. What is the length of the arc?","choices":{"D":"4π","C":"8π","A":"2π","B":"16π"},"ans":"D","why":"Arc = (90/360)·2πr = (1/4)(16π) = 4π."},{"why":"Volume = πr²h = π(3²)(10) = π(9)(10) = 90π.","choices":{"A":"90π","B":"30π","C":"60π","D":"900π"},"stem":"A cylinder has radius 3 and height 10. What is its volume?","ans":"A","n":12,"slug":"gri-mod-satm-geometry-1-12"},{"slug":"gri-mod-satm-geometry-1-13","n":13,"ans":"B","stem":"A sphere has radius 3. What is its volume?","choices":{"B":"36π","A":"27π","C":"108π","D":"12π"},"why":"Volume = (4/3)πr³ = (4/3)π(27) = 36π."},{"choices":{"B":"192π","A":"144π","C":"48π","D":"96π"},"n":14,"why":"Volume = (1/3)πr²h = (1/3)π(36)(4) = (1/3)(144π) = 48π.","ans":"C","stem":"A cone has base radius 6 and height 4. What is its volume?","slug":"gri-mod-satm-geometry-1-14"},{"stem":"A rectangular box has dimensions 4 by 5 by 6. What is its volume?","choices":{"A":"60","B":"148","D":"120","C":"15"},"ans":"D","why":"Volume = length·width·height = 4·5·6 = 120. (148 is the surface area.)","slug":"gri-mod-satm-geometry-1-15","n":15},{"slug":"gri-mod-satm-geometry-1-16","n":16,"ans":"A","stem":"Triangle ABC has sides 3, 4, and 5. It is similar to triangle DEF whose shortest side is 9. What is the length of the longest side of triangle DEF?","choices":{"A":"15","B":"12","C":"20","D":"9"},"why":"Scale factor = 9/3 = 3. The longest side maps from 5, so it is 5·3 = 15."},{"n":17,"slug":"gri-mod-satm-geometry-1-17","why":"sin θ = opposite/hypotenuse = 3/5 = 0.6.","choices":{"A":"0.8","B":"0.75","C":"0.6","D":"1.67"},"stem":"In a right triangle, an acute angle θ has an opposite side of length 3 and a hypotenuse of length 5. What is sin θ?","ans":"C"},{"slug":"gri-mod-satm-geometry-1-18","n":18,"ans":"B","choices":{"B":"0.8","A":"0.6","D":"0.75","C":"1.25"},"stem":"In a 3-4-5 right triangle, an acute angle θ has an adjacent side of length 4 and a hypotenuse of length 5. What is cos θ?","why":"cos θ = adjacent/hypotenuse = 4/5 = 0.8."},{"n":19,"choices":{"B":"0.923","A":"0.417","D":"2.4","C":"0.385"},"slug":"gri-mod-satm-geometry-1-19","why":"tan θ = opposite/adjacent = 12/5 = 2.4.","ans":"D","stem":"In a right triangle, an acute angle θ has an opposite side of length 12 and an adjacent side of length 5. What is tan θ?"},{"n":20,"slug":"gri-mod-satm-geometry-1-20","why":"Degrees = radians·(180/π) = (π/3)(180/π) = 180/3 = 60°.","choices":{"B":"45°","A":"30°","D":"60°","C":"120°"},"ans":"D","stem":"Convert the angle π/3 radians to degrees."},{"why":"Radians = degrees·(π/180) = 45·(π/180) = π/4.","stem":"Convert 45° to radians.","choices":{"D":"π/2","C":"π/6","B":"π/3","A":"π/4"},"ans":"A","n":21,"slug":"gri-mod-satm-geometry-1-21"},{"choices":{"B":"45","A":"60","D":"90","C":"30"},"n":22,"why":"Supplementary angles sum to 180°, so x + 3x = 180, giving 4x = 180 and x = 45.","ans":"B","stem":"Two angles are supplementary. One angle measures x and the other measures 3x. What is the value of x?","slug":"gri-mod-satm-geometry-1-22"},{"ans":"C","stem":"In a triangle, two of the interior angles measure 50° and 60°. What is the measure of the third angle?","choices":{"A":"80°","B":"90°","C":"70°","D":"110°"},"why":"Angles of a triangle sum to 180°, so the third angle = 180 − 50 − 60 = 70°.","slug":"gri-mod-satm-geometry-1-23","n":23},{"choices":{"B":"√7","A":"7","D":"5","C":"25"},"n":24,"why":"Distance = √[(4−1)² + (6−2)²] = √(9 + 16) = √25 = 5.","stem":"What is the distance between the points (1, 2) and (4, 6) in the coordinate plane?","ans":"D","slug":"gri-mod-satm-geometry-1-24"},{"stem":"A 13-foot ladder leans against a vertical wall with its base 5 feet from the wall. How high up the wall does the ladder reach?","choices":{"A":"12 feet","B":"8 feet","C":"√194 feet","D":"18 feet"},"ans":"A","why":"Height = √(13² − 5²) = √(169 − 25) = √144 = 12 feet.","slug":"gri-mod-satm-geometry-1-25","n":25},{"n":26,"choices":{"C":"16","D":"15","A":"60","B":"30"},"slug":"gri-mod-satm-geometry-1-26","why":"Area = (1/2)·base·height = (1/2)(10)(6) = 30. (60 forgets the 1/2.)","ans":"B","stem":"A triangle has a base of 10 and a height of 6. What is its area?"},{"slug":"gri-mod-satm-geometry-1-27","ans":"C","stem":"A triangle has side lengths 7, 24, and 25. What is its perimeter?","why":"Perimeter = 7 + 24 + 25 = 56. (168 and 300 are related to area products.)","n":27,"choices":{"D":"31","C":"56","B":"300","A":"168"}},{"why":"Sector area = (60/360)·πr² = (1/6)(36π) = 6π.","stem":"In a circle of radius 6, a sector has a central angle of 60°. What is the area of the sector?","ans":"D","slug":"gri-mod-satm-geometry-1-28","choices":{"C":"3π","D":"6π","B":"12π","A":"36π"},"n":28},{"slug":"gri-mod-satm-geometry-1-29","ans":"A","stem":"A 45°-45°-90° right triangle has each leg equal to 5. What is the length of the hypotenuse?","why":"In a 45-45-90 triangle the hypotenuse equals a leg times √2, so it is 5√2.","n":29,"choices":{"B":"10","A":"5√2","D":"25","C":"5√3"}},{"ans":"C","stem":"In a 30°-60°-90° right triangle, the shorter leg (opposite the 30° angle) has length 4. What is the length of the longer leg (opposite the 60° angle)?","choices":{"C":"4√3","D":"12","A":"8","B":"4√2"},"why":"In a 30-60-90 triangle the longer leg equals the shorter leg times √3, so it is 4√3. (8 is the hypotenuse.)","slug":"gri-mod-satm-geometry-1-30","n":30}],"t":"mcqquiz"}],"name":"4. Geometry ve Trigonometri"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');

      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;

function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;

  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
