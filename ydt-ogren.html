<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1;max-height:42vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card-2,var(--card))}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}

h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}

.rule{height:0;margin:0}

p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}

.btn:active{transform:translateY(1px)}

.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}

.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--card)}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}

.reveal.open .body{display:block}

.drill .dq{margin-bottom:8px}

.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}

.qz{border-top:1px solid var(--line);padding:18px 0}

.qz .qzn{font-weight:700;color:var(--accent-deep)}

.qz input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}

.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:29px;height:29px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;transition:.15s}

.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}

.mcq .mfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}

.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}

.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
.rlink.done .dot{background:#5fd0a0}
.rlink.done::after{content:"\2713";margin-left:auto;color:#2fae7a;font-weight:800;font-size:12px;line-height:1;flex:none}
:root[data-theme="dark"] .rlink.done::after{color:#5fd0a0}
.pad>p{max-width:68ch}

r tedavi.","ans":"C"},{"stem":"The manager was praised for her ability to ______ conflicts among team members.","slug":"gri-mod-ydt-kelime-1-3","choices":{"C":"ignore","D":"delay","E":"predict","A":"resolve","B":"produce"},"n":3,"ans":"A","why":"resolve = çözmek. Çatışmaları çözmek."},{"ans":"B","why":"proceed with = devam etmek. Yağmura rağmen devam etmek. delay, postpone ve cancel 'despite' ile çelişir.","stem":"Despite the heavy rain, the organizers decided to ______ with the outdoor concert.","n":4,"choices":{"A":"prevent","C":"delay","D":"postpone","E":"cancel","B":"proceed"},"slug":"gri-mod-ydt-kelime-1-4"},{"why":"thorough = kapsamlı, ayrıntılı. Kapsamlı bir analiz. (brief zıt anlam)","ans":"A","n":5,"choices":{"B":"thoughtless","C":"reluctant","D":"temporary","E":"brief","A":"thorough"},"slug":"gri-mod-ydt-kelime-1-5","stem":"The report provides a ______ analysis of the country's economic problems."},{"why":"convincing = ikna edici. Komiteyi değiştirecek kadar ikna edici.","ans":"C","slug":"gri-mod-ydt-kelime-1-6","n":6,"choices":{"B":"confusing","A":"boring","C":"convincing","D":"doubtful","E":"careless"},"stem":"Her arguments were so ______ that the committee changed its decision."}],"t":"mcqquiz"}],"id":"kelime","group":"Drilller","eyebrow":"Drill"},{"id":"dilbilgisi","blocks":[{"t":"p","x":"Doğru zaman, edat veya yapıyı seç."},{"items":[{"stem":"She has been living in Ankara ______ 2015.","n":1,"choices":{"B":"for","D":"by","E":"in","C":"from","A":"since"},"slug":"gri-mod-ydt-dilbilgisi-1-1","ans":"A","why":"since + belirli başlangıç noktası (2015). for süre uzunluğu ile kullanılır."},{"why":"Type 2 koşul cümlesi: If + past simple, would + yalın fiil. had.","ans":"D","slug":"gri-mod-ydt-dilbilgisi-1-2","n":2,"choices":{"A":"have","C":"would have","D":"had","E":"have had","B":"will have"},"stem":"If I ______ more time, I would learn another language."},{"why":"Proje 'tamamlanır' (edilgen), gelecekte bir zamana kadar: will be completed.","ans":"A","slug":"gri-mod-ydt-dilbilgisi-1-3","choices":{"B":"will have completed","C":"will complete","E":"has completed","D":"completes","A":"will be completed"},"n":3,"stem":"The project ______ by the end of next month."},{"why":"interested in kalıbı. Ardından -ing gelir.","ans":"B","choices":{"B":"in","A":"on","C":"with","E":"for","D":"at"},"n":4,"slug":"gri-mod-ydt-dilbilgisi-1-4","stem":"He is interested ______ learning how to code."},{"choices":{"B":"has already started","A":"already started","D":"was already starting","E":"had already started","C":"already starts"},"n":5,"slug":"gri-mod-ydt-dilbilgisi-1-5","stem":"By the time we arrived, the film ______.","why":"Geçmişte bir andan önce biten eylem: past perfect. had already started.","ans":"E"},{"ans":"E","why":"make + nesne + yalın fiil (bare infinitive). make ... write.","stem":"The teacher made the students ______ the essay again.","choices":{"C":"written","E":"write","D":"wrote","A":"to write","B":"writing"},"n":6,"slug":"gri-mod-ydt-dilbilgisi-1-6"}],"t":"mcqquiz"}],"name":"Dilbilgisi","eyebrow":"Drill","group":"Drilller"},{"name":"Bağlaçlar ve Geçişler","blocks":[{"x":"İki cümle arasındaki ilişkiye uygun bağlacı seç. YDT'nin en çok soru sorduğu alan.","t":"p"},{"t":"mcqquiz","items":[{"slug":"gri-mod-ydt-baglac-1-1","choices":{"A":"Because","D":"Although","E":"In case","C":"So that","B":"Therefore"},"n":1,"stem":"______ he had studied hard, he failed the exam.","why":"Zıtlık: çalıştı ama kaldı. Although (rağmen).","ans":"D"},{"why":"Sonuç: yol kapalıydı, bu yüzden. so.","ans":"D","n":2,"choices":{"A":"because","C":"unless","E":"whereas","D":"so","B":"although"},"slug":"gri-mod-ydt-baglac-1-2","stem":"The road was closed, ______ we had to take a different route."},{"ans":"C","why":"in case = -e karşı, ihtimaline karşı. Yağma ihtimaline karşı şemsiye al.","stem":"Take an umbrella ______ it rains later.","choices":{"B":"so that","C":"in case","D":"despite","E":"unless","A":"although"},"n":3,"slug":"gri-mod-ydt-baglac-1-3"},{"choices":{"A":"Although","C":"Unless","E":"Despite","D":"So that","B":"Because of"},"n":4,"slug":"gri-mod-ydt-baglac-1-4","stem":"______ the high cost, many families still buy new phones every year.","why":"Despite + isim öbeği (the high cost). Although cümle isterdi. Zıtlık.","ans":"E"},{"stem":"He spoke slowly ______ everyone could understand him.","n":5,"choices":{"A":"so that","D":"in case","E":"whereas","C":"although","B":"because"},"slug":"gri-mod-ydt-baglac-1-5","ans":"A","why":"Amaç: herkes anlasın diye. so that (amaç bağlacı)."},{"why":"Karşıtlık/kıyas: bazıları kışı sever, buna karşın diğerleri. whereas.","ans":"B","slug":"gri-mod-ydt-baglac-1-6","choices":{"A":"because","D":"unless","E":"since","C":"so","B":"whereas"},"n":6,"stem":"Some people love winter, ______ others cannot wait for summer."}]}],"id":"baglac","group":"Drilller","eyebrow":"Drill"},{"name":"Cloze Test","blocks":[{"t":"p","x":"Paragrafı oku, her boşluğa bütüne en uygun seçeneği koy."},{"title":"Metin","x":"Bees play a vital role in agriculture. As they move from flower to flower, they carry pollen, (1) ______ allows plants to produce fruit and seeds. In recent years, (2) ______, bee populations have declined sharply. Scientists believe that pesticides are one of the main (3) ______ of this decline.","t":"given"},{"t":"mcqquiz","items":[{"why":"Önceki cümlenin tamamına atıf yapan which. Nesne için who/whose değil.","ans":"C","choices":{"A":"where","C":"which","D":"what","E":"whose","B":"who"},"n":1,"slug":"gri-mod-ydt-cloze-2-1","stem":"Boşluk (1): they carry pollen, ______ allows plants to produce fruit."},{"why":"Arıların faydası anlatıldı, sonra düşüş geliyor: zıtlık. however.","ans":"E","choices":{"C":"for example","E":"however","D":"in addition","A":"therefore","B":"as a result"},"n":2,"slug":"gri-mod-ydt-cloze-2-2","stem":"Boşluk (2): In recent years, ______, bee populations have declined."},{"stem":"Boşluk (3): pesticides are one of the main ______ of this decline.","choices":{"A":"results","C":"solutions","D":"examples","E":"benefits","B":"causes"},"n":3,"slug":"gri-mod-ydt-cloze-2-3","ans":"B","why":"Pesticidler düşüşün sebebidir. causes. (results sonuç olurdu)"}]}],"id":"cloze","group":"Drilller","eyebrow":"Drill"},{"id":"cumletam","blocks":[{"x":"Yarım cümleyi hem anlamca hem dilbilgisiyle tamamlayan şıkkı seç. Bütün şıklar makul görünür; zaman uyumu ve baştaki bağlaç doğru olanı belirler.","t":"p"},{"items":[{"stem":"Had I known about the heavy traffic this morning, ______","slug":"gri-mod-ydt-cumletam-1","n":1,"choices":{"B":"I am normally leaving the house fairly early","E":"so that everyone could still get to work on time","D":"the main road into the city had been closed","C":"I will certainly find a different route tomorrow","A":"I would have left home a good deal earlier"},"ans":"A","why":"Had I known = devrik Type 3 koşul. Ana cümle 'would have + V3' olur (geçmişe pişmanlık). Diğerleri zaman veya yapı olarak uymaz."},{"slug":"gri-mod-ydt-cumletam-2","choices":{"C":"so that it could cut its costs during the crisis","D":"unless the national economy suddenly gets better","E":"while most of the staff were away on holiday","A":"as soon as the newly appointed manager arrives","B":"even though its yearly profits were rising fast"},"n":2,"stem":"The company had to close several of its branches ______","why":"Şube kapatmanın amacı maliyet düşürmek: so that + could. B çelişir, A zaman uyumsuz, D/E anlamca kopuk.","ans":"C"},{"stem":"______, the volunteers managed to clean the entire beach in a single day.","choices":{"B":"So that the long beach would stay completely dirty","C":"Unless a great many more people had joined them","D":"In order to pollute the surrounding sea even further","E":"Despite having only a very small amount of equipment","A":"Because they were given almost no time at all"},"n":3,"slug":"gri-mod-ydt-cumletam-3","ans":"E","why":"Başta zıtlık öbeği: az ekipmana rağmen başardılar. Despite + -ing. Diğerleri ana cümleyle çelişir."},{"n":4,"choices":{"B":"the more confident you gradually tend to become","A":"you are going to feel a great deal more confident","E":"because you generally feel quite confident about it","D":"and so you slowly manage to become more confident","C":"your overall confidence just keeps getting higher"},"slug":"gri-mod-ydt-cumletam-4","stem":"The more regularly you practise speaking English, ______","why":"the + comparative ..., the + comparative ... kalıbı. İkinci kısım da 'the more' ile başlamalı.","ans":"B"},{"ans":"D","why":"such a ... that sonuç kalıbı: o kadar alçak sesle konuştu ki kimse duyamadı. Boşluk 'that' ister.","stem":"She spoke in such a low and quiet voice ______","choices":{"A":"so that everyone in the large hall heard her clearly","C":"as if she were actually shouting at the top of her voice","E":"although the microphone in front of her worked perfectly","D":"that no one sitting at the back could really hear her","B":"because the whole room had gone completely silent"},"n":5,"slug":"gri-mod-ydt-cumletam-5"},{"slug":"gri-mod-ydt-cumletam-6","choices":{"A":"In spite of","C":"As soon as","D":"So as to","E":"No sooner","B":"Because of"},"n":6,"stem":"______ the final report is completely finished, we will send it to all the department heads.","why":"Zaman bağlacı: rapor biter bitmez göndereceğiz. A/B isim öbeği, D fiil, E devrik yapı ister.","ans":"C"}],"t":"mcqquiz"}],"name":"Cümle Tamamlama","eyebrow":"Drill","group":"Drilller"},{"eyebrow":"Drill","group":"Drilller","id":"diyalog","blocks":[{"x":"Boş bırakılan konuşma sırasını, öncesi ve sonrasına anlamca uyan replikle tamamla. İpucu genelde bir sonraki repliktedir.","t":"p"},{"t":"mcqquiz","items":[{"why":"Ali'nin cevabı bir sebep veriyor (Mostly because...); demek ki Mehmet sebebi/kararı sordu.","ans":"D","n":1,"choices":{"A":"That honestly sounds quite expensive to me.","E":"Have you ever actually been abroad before?","D":"Really? What made you decide to do that?","C":"You should really try to book your flight early.","B":"I actually studied abroad two years ago myself."},"slug":"gri-mod-ydt-diyalog-1","stem":"Ali: I'm thinking of studying abroad next year. / Mehmet: ______ / Ali: Mostly because I want to improve my English in a native environment."},{"why":"Müşterinin 'that's a shame' (yazık) tepkisi olumsuz cevabı gösterir: tek beden kalmış.","ans":"E","slug":"gri-mod-ydt-diyalog-2","choices":{"B":"Certainly, and what size exactly would you like?","A":"Yes, of course, I will bring it to you right away.","D":"The fitting rooms are just over there on the right.","E":"I'm afraid that's the only size we have left.","C":"This particular shirt is actually on sale this week."},"n":2,"stem":"Customer: Excuse me, do you have this shirt in a larger size? / Assistant: ______ / Customer: Oh, that's a shame. Thank you anyway."},{"slug":"gri-mod-ydt-diyalog-3","choices":{"A":"You should honestly just give up driving completely.","D":"Driving tests are basically impossible for anyone to pass.","E":"Why do you even want to get a driving licence at all?","C":"Well, I actually passed mine on the very first try.","B":"Don't worry, maybe you just need a little more practice."},"n":3,"stem":"Emma: I failed my driving test again. / Jack: ______ / Emma: You're right. I'll book some more lessons before trying again.","why":"Emma 'haklısın, daha ders alacağım' diyor; demek ki Jack pratik önerip cesaret verdi.","ans":"B"},{"slug":"gri-mod-ydt-diyalog-4","choices":{"C":"I know, and I'm sorry. I had a family emergency.","E":"To be fair, I didn't actually write it myself.","D":"Why does the exact deadline even matter so much?","A":"Honestly, that is really not my problem at all.","B":"Almost everyone hands in their essays a bit late."},"n":4,"stem":"Teacher: Your essay was well written, but it was handed in two days late. / Student: ______","why":"Hem olumlu hem eleştirel yoruma uygun, kibar ve açıklayıcı cevap.","ans":"C"},{"stem":"Neighbour: Could you please turn the music down? It's quite late. / You: ______","n":5,"choices":{"C":"You are always complaining about almost everything.","D":"Honestly, the music isn't even that loud right now.","E":"Why exactly are you still awake at this late hour?","A":"Oh, I'm so sorry. I didn't realise the time.","B":"No, I actually paid a lot of money for these speakers."},"slug":"gri-mod-ydt-diyalog-5","ans":"A","why":"Kibar bir ricaya uygun özür ve düzeltme."}]}],"name":"Diyalog Tamamlama"},{"group":"Drilller","eyebrow":"Drill","name":"Restatement (Eşdeğer Cümle)","id":"restatement","blocks":[{"t":"p","x":"Verilen cümleyle anlamca en yakın (aynı) cümleyi seç. Kalıpların (should have, unless, would rather...) anlamını iyi bil; şıklar uzunlukça benzerdir."},{"items":[{"stem":"You should have told me about the meeting much earlier.","n":1,"choices":{"B":"You will probably tell me about the meeting a bit later.","E":"It was wrong of you not to inform me about the meeting sooner.","D":"You have to tell me about absolutely every single meeting.","C":"I clearly told you about that meeting much earlier on.","A":"You actually told me about the meeting right on time."},"slug":"gri-mod-ydt-restatement-1","ans":"E","why":"should have + V3 = geçmişte yapılmayan, yapılması gerekeni eleştirir."},{"why":"Hardly had ... when ... = -er -mez. Oyun başlar başlamaz yağmur başladı.","ans":"A","slug":"gri-mod-ydt-restatement-2","n":2,"choices":{"A":"As soon as the game started, it began to rain heavily.","D":"The game had started a long time before it began to rain.","E":"It very rarely rains during important football games.","C":"It rained a lot, so in the end the game did not start.","B":"The game only started because it was already raining."},"stem":"Hardly had the game started when it suddenly began to rain."},{"why":"unless = if not. Acele etmezsen kaçırırsın.","ans":"D","slug":"gri-mod-ydt-restatement-3","choices":{"A":"If you hurry up now, you will surely miss the train.","C":"You missed the train earlier because you hurried too much.","E":"Hurrying up now will not really help you catch the train.","D":"If you do not hurry up now, you will miss the train.","B":"You will still catch the train even if you are quite slow."},"n":3,"stem":"Unless you hurry up now, you will definitely miss the train."},{"ans":"B","why":"would rather X than Y = Y yerine X'i tercih ederim. Evde kalmayı tercih.","stem":"I would rather stay at home tonight than go to the party.","slug":"gri-mod-ydt-restatement-4","choices":{"B":"I prefer staying at home tonight to going to the party.","A":"I would honestly quite like to go to the party tonight.","C":"I prefer going to the party rather than staying at home.","D":"I will first go to the party and then stay at home tonight.","E":"There is nothing I dislike more than staying at home alone."},"n":4},{"why":"No matter how hard = however hard. Ne kadar uğraşsa da çözemedi.","ans":"C","n":5,"choices":{"A":"In the end she managed to solve the problem quite easily.","E":"She only solved the problem after getting a lot of help.","D":"The problem was not actually that difficult for her to solve.","C":"However hard she tried, she failed to solve the problem.","B":"She did not really make any effort to solve the problem."},"slug":"gri-mod-ydt-restatement-5","stem":"No matter how hard she tried, she couldn't solve the problem."},{"slug":"gri-mod-ydt-restatement-6","n":6,"choices":{"B":"The ice always melts at a completely constant, steady speed.","A":"When the temperature is low, the ice still melts quickly.","E":"The ice tends to melt long before the temperature even rises.","D":"As the temperature increases, the ice melts more and more quickly.","C":"Higher temperatures actually stop the ice from melting at all."},"stem":"The higher the temperature rises, the faster the ice melts.","why":"The higher..., the faster... = orantı. Sıcaklık arttıkça buz daha hızlı erir.","ans":"D"}],"t":"mcqquiz"}]},{"name":"Çeviri","id":"ceviri","blocks":[{"x":"İngilizce-Türkçe ve Türkçe-İngilizce en doğru çeviriyi seç. Anlamı bozan veya özne-nesne yer değiştiren şıklar tuzaktır; hepsi benzer uzunluktadır.","t":"p"},{"t":"mcqquiz","items":[{"n":1,"choices":{"A":"Hükümetler yenilenebilir enerjiyi azaltmak için hava kirliliğine yatırım yapmalıdır.","C":"Hükümetler hava kirliliğini azaltmak için yenilenebilir enerjiye daha çok yatırım yapmalıdır.","D":"Hükümetler hava kirliliğini artırmak amacıyla enerjiye daha çok yatırım yapmaktadır.","E":"Yenilenebilir enerji, hava kirliliğini azaltmak için hükümetlere ciddi biçimde ihtiyaç duyar.","B":"Hava kirliliği, hükümetlerin yenilenebilir enerjiye yatırım yapmasını engellemektedir."},"slug":"gri-mod-ydt-ceviri-1","stem":"En iyi çeviri: 'Governments should invest more in renewable energy to reduce air pollution.'","why":"Özne, fiil ve amaç (to reduce = azaltmak için) doğru aktarılmış tek şık C.","ans":"C"},{"choices":{"C":"Teknoloji çok pahalı olduğu için uzun vadede insana para kaybettirmektedir.","D":"Uzun vadede bu teknoloji giderek daha da pahalı bir hale gelmektedir.","E":"Bu teknoloji hem oldukça ucuz hem de son derece tasarruflu bir teknolojidir.","A":"Teknoloji oldukça ucuz olduğu için uzun vadede epeyce para kazandırmaktadır.","B":"Teknoloji pahalı olsa da uzun vadede ciddi bir para tasarrufu sağlar."},"n":2,"slug":"gri-mod-ydt-ceviri-2","stem":"En iyi çeviri: 'Although the technology is expensive, it saves money in the long run.'","why":"Although = -e rağmen (olsa da). Zıtlık ve 'uzun vadede tasarruf' doğru aktarılmış.","ans":"B"},{"ans":"E","why":"tend to = genellikle/eğilimindedir; larger vocabularies = daha geniş kelime dağarcığı.","stem":"En iyi çeviri: 'Children who read regularly tend to have larger vocabularies.'","choices":{"B":"Geniş kelime dağarcığı olan çocuklar genellikle pek fazla kitap okumamaktadır.","A":"Çocuklar düzenli olarak okursa zamanla kelime dağarcıkları küçülme eğilimindedir.","E":"Düzenli okuyan çocukların genellikle daha geniş bir kelime dağarcığı olur.","D":"Çocuklar zaman zaman oldukça büyük ve kalın kitapları merakla okumaktadır.","C":"Düzenli biçimde okumak çocukların kelime bilgisini azaltma eğilimi göstermektedir."},"n":3,"slug":"gri-mod-ydt-ceviri-3"},{"stem":"Best English translation: 'Trafik sıkışıklığı arttıkça insanlar toplu taşımayı daha çok tercih ediyor.'","slug":"gri-mod-ydt-ceviri-4","n":4,"choices":{"E":"Crowded public transport is clearly increasing traffic congestion for everyone.","D":"People rarely use public transport at all because of the heavy city traffic.","C":"Traffic congestion clearly decreases whenever people start using public transport.","A":"As traffic congestion increases, people increasingly prefer to use public transport.","B":"People strongly prefer public transport, so traffic congestion keeps increasing."},"ans":"A","why":"arttıkça = as ... increases; daha çok tercih ediyor = increasingly prefer."},{"stem":"Best English translation: 'Bu projeyi zamanında bitirebilmek için daha fazla çalışana ihtiyacımız var.'","slug":"gri-mod-ydt-ceviri-5","n":5,"choices":{"B":"This important project really should have been finished by many more workers.","C":"Many more workers are now needed because the whole project is already very late.","D":"We need more workers in order to finish this project on time.","E":"We already seem to have more than enough workers to finish the project.","A":"We managed to finish this whole project on time with far fewer workers."},"ans":"D","why":"-ebilmek için ... ihtiyacımız var = we need ... to finish ... on time. Amaç ve ihtiyaç doğru."},{"stem":"Best English translation: 'Yeni yasa, küçük işletmelerin vergi yükünü azaltmayı amaçlıyor.'","n":6,"choices":{"A":"Small businesses have clearly increased the tax burden created by the new law.","D":"Small businesses themselves are aiming to change the recently passed new tax law.","E":"The heavy tax burden eventually created a brand new law for small businesses.","C":"The new law is going to raise taxes for almost all small businesses in the country.","B":"The new law aims to reduce the tax burden on small businesses."},"slug":"gri-mod-ydt-ceviri-6","ans":"B","why":"amaçlıyor = aims to; vergi yükünü azaltmak = reduce the tax burden. Özne yeni yasa."}]}],"group":"Drilller","eyebrow":"Drill"},{"group":"Drilller","eyebrow":"Drill","name":"Paragraf","blocks":[{"t":"p","x":"Paragraf soruları: boş bırakılan cümleyi bul, akışı bozan cümleyi bul veya en yakın anlamı seç. Önce paragrafın konusunu belirle."},{"t":"mcqquiz","items":[{"why":"Boşluk dönüşümü açıklamalı ve 'sonuç olarak fikirler hızla yayıldı'ya bağlanmalı. Hızlı-çok üretim bunu sağlar.","ans":"B","slug":"gri-mod-ydt-paragraf-1","n":1,"choices":{"D":"Today, digital media has largely replaced most traditional printed books.","E":"Very few people were genuinely interested in reading during this early period.","C":"The early printing press was, in fact, extremely difficult to operate by hand.","A":"Most people at that time still clearly preferred handwritten manuscripts.","B":"It allowed books to be produced quickly and in large numbers for the first time."},"stem":"Boşluğa gelecek cümle: 'The invention of the printing press in the 15th century transformed European society. ______ As a result, ideas spread faster than ever before, and literacy rates began to rise.'"},{"stem":"Boşluğa gelecek sonuç cümlesi: 'Regular exercise has many benefits beyond physical fitness. Studies show that it reduces stress, improves mood, and helps people sleep better. ______'","slug":"gri-mod-ydt-paragraf-2","n":2,"choices":{"B":"In contrast, sleeping a lot less actually tends to improve one's fitness.","A":"However, regular exercise seems to have no real effect on mental health.","C":"Physical fitness is, in the end, the only real benefit of doing exercise.","E":"So far, very few studies have properly examined the real effects of exercise.","D":"For these reasons, doctors increasingly recommend physical activity for a healthy life."},"ans":"D","why":"Sonuç cümlesi faydaları özetleyip öneriye bağlanmalı. A/B/C önceki cümlelerle çelişir."},{"stem":"Akışı bozan cümle hangisi? '(I) Coffee is one of the most popular drinks in the world. (II) It is grown in more than fifty countries, mostly near the equator. (III) Tea, however, was first discovered in ancient China. (IV) The plant produces small red berries that contain the coffee beans. (V) After harvesting, the beans are dried, roasted and ground before brewing.'","slug":"gri-mod-ydt-paragraf-3","n":3,"choices":{"C":"III","D":"IV","E":"V","A":"I","B":"II"},"ans":"C","why":"Paragraf kahveyi anlatıyor; III çay hakkında, konudan sapıyor."},{"slug":"gri-mod-ydt-paragraf-4","n":4,"choices":{"B":"II","C":"III","D":"IV","E":"V","A":"I"},"stem":"Akışı bozan cümle hangisi? '(I) Sleep is essential for good health. (II) During deep sleep, the body repairs tissues and strengthens the immune system. (III) A lack of sleep is linked to memory problems and weight gain. (IV) Experts recommend seven to nine hours of sleep for most adults. (V) Many restaurants now offer late-night menus for their hungry customers.'","why":"Paragraf uyku hakkında; V restoran menüleri, alakasız.","ans":"E"},{"ans":"A","why":"Örnek fabrika emisyonunu, sonuç sanayi sınırlamalarını anlatıyor; açılış sanayinin kirliliğe katkısını söylemeli.","stem":"Boşluğa gelecek açılış cümlesi: '______ For example, a single large factory can release more carbon dioxide in a year than thousands of cars. Governments are therefore introducing stricter limits on industrial emissions.'","choices":{"B":"Private cars are really the only significant source of urban air pollution.","A":"Industry is one of the biggest single contributors to air pollution today.","C":"Overall air pollution has, in fact, steadily decreased over recent years.","D":"Large factories are usually built quite far away from major residential cities.","E":"Most people nowadays clearly prefer to travel around by their private cars."},"n":5,"slug":"gri-mod-ydt-paragraf-5"}]}],"id":"paragraf"},{"group":"Drilller","eyebrow":"Drill","name":"Koşul Cümleleri","id":"conditionals","blocks":[{"x":"Koşul cümlelerinin (conditionals) tüm tipleri tek sette: Type 0/1/2/3, Mixed Conditionals, devrik yapılar (Had I known, Were I, Should you), Unless / Provided that / As long as / In case, Wish ve If only, Without / But for ile imalı koşullar. 50 cümle tamamlama sorusu, her birinde ayrıntılı Türkçe açıklama.","t":"p"},{"items":[{"slug":"gri-mod-ydt-conditionals-1-1","choices":{"A":"boils","C":"would boil","D":"had boiled","E":"is boiling","B":"will boil"},"n":1,"stem":"Water ---- at exactly one hundred degrees Celsius at standard atmospheric pressure.","why":"Bilimsel/genel gerçek = Type 0 Conditional. Yapı: if + present simple, present simple. 'Water boils at 100°C' her zaman doğru olduğu için present simple.","ans":"A"},{"slug":"gri-mod-ydt-conditionals-1-2","n":2,"choices":{"A":"are","D":"were","E":"being","C":"would be","B":"had been"},"stem":"If the safety regulations ---- stricter, the recent industrial accident might have been entirely avoided last summer.","why":"Mixed Conditional: şu anki/sürekli durum (were) → geçmiş sonuç (might have been avoided). Kurallar şu anda daha sıkı olsa, geçen yazki kaza önlenmiş olabilirdi.","ans":"D"},{"why":"Type 3 Conditional: geçmiş hipotetik. Yapı: if + past perfect (had seen), could/would have + V3 (could have responded). 'Yesterday morning' = geçmiş.","ans":"C","slug":"gri-mod-ydt-conditionals-1-3","choices":{"B":"saw","C":"had seen","D":"would see","E":"has seen","A":"sees"},"n":3,"stem":"If she ---- the urgent email yesterday morning, she could have responded in time for the deadline."},{"slug":"gri-mod-ydt-conditionals-1-4","choices":{"B":"when","A":"if","C":"provided that","D":"supposing","E":"unless"},"n":4,"stem":"The construction project will not proceed ---- additional government funding becomes available within the next month.","why":"'Unless' = 'if not' (eğer ... olmazsa). Cümle 'will not proceed unless funding becomes available' = ek finansman gelmezse proje ilerlemeyecek.","ans":"E"},{"ans":"B","why":"Type 3'ün devrik yapısı (inversion). 'Had he known' = 'If he had known'. Sonuç cümlesi 'would have postponed' (Type 3) ile uyumlu.","stem":"---- about the severe storm forecast in time, the captain would have postponed the entire voyage immediately.","choices":{"A":"Knew he","C":"Did he know","D":"Should he know","E":"If knew he","B":"Had he known"},"n":5,"slug":"gri-mod-ydt-conditionals-1-5"},{"n":6,"choices":{"B":"melted","C":"would melt","E":"melts","D":"had melted","A":"will melt"},"why":"Type 1 Conditional: gerçeklikçi gelecek. Yapı: if + present simple, will + V1. Sıcaklıklar artmaya devam ederse, buz daha hızlı eriyecek.","slug":"gri-mod-ydt-conditionals-1-6","ans":"A","stem":"If global temperatures continue to rise at the current alarming rate, polar ice ---- much faster than scientists initially predicted."},{"stem":"The election candidate now wishes she ---- the campaign issues more thoroughly before the live televised debate.","choices":{"A":"studies","D":"had studied","E":"would study","C":"had studying","B":"studied"},"n":7,"slug":"gri-mod-ydt-conditionals-1-7","ans":"D","why":"Wish + past perfect = geçmişe yönelik pişmanlık. 'She wishes she had studied' = keşke (geçmişte) çalışsaydı. Tartışma geçmişte olduğu için."},{"stem":"The signed contract will be considered legally valid ---- both parties sign it in the presence of authorized witnesses.","n":8,"choices":{"B":"although","A":"unless","D":"supposing","E":"even though","C":"provided that"},"slug":"gri-mod-ydt-conditionals-1-8","ans":"C","why":"'Provided that' = '...şartıyla, ...koşuluyla'. Şart bildiren bağlaç, 'if' yerine kullanılır. 'Geçerli olacak, şu şartla ki ...'"},{"choices":{"A":"heeds","C":"would heed","E":"had heeded","D":"heeding","B":"heeded"},"n":9,"slug":"gri-mod-ydt-conditionals-1-9","stem":"If only the city council ---- the early warning signs about the bridge structure several years ago.","why":"'If only + past perfect' = geçmiş için derin pişmanlık. 'If only the council had heeded' = keşke konsey (geçmişte) dinleseydi.","ans":"E"},{"choices":{"B":"invested","A":"invests","D":"would invest","E":"is investing","C":"had invested"},"n":10,"slug":"gri-mod-ydt-conditionals-1-10","stem":"If the company ---- substantially in renewable energy now, it could secure significant tax benefits in the long run.","why":"Type 2 Conditional: şu anki hipotetik. Yapı: if + past simple, could/would + V1. 'Şirket şu an yatırım yapsa, vergi avantajı elde edebilir.'","ans":"B"},{"stem":"If the medical team ---- the patient's serious allergies earlier, the complications would not be quite so severe today.","ans":"D","slug":"gri-mod-ydt-conditionals-1-11","why":"Mixed Conditional: geçmiş şart (had known) → şimdiki sonuç (would not be ... today). 'Today' anahtar kelime — sonuç şu ana ait.","n":11,"choices":{"A":"knew","D":"had known","E":"would have known","C":"would know","B":"knows"}},{"stem":"---- more time available, the research team would conduct several further experiments in the field.","n":12,"choices":{"B":"Were there","A":"Had they","C":"If is there","D":"Should be","E":"Was it"},"slug":"gri-mod-ydt-conditionals-1-12","ans":"B","why":"Type 2'nin devrik yapısı: 'Were there more time' = 'If there were more time'. Sonuç 'would conduct' Type 2 ile uyumlu."},{"n":13,"choices":{"C":"supposing","E":"in case","D":"provided that","A":"unless","B":"although"},"slug":"gri-mod-ydt-conditionals-1-13","stem":"Travellers should always carry detailed emergency contact information ---- they need urgent assistance during their journey abroad.","why":"'In case' = '...ihtimaline karşı, ...olması durumunda'. Önlem amaçlı yapılan eylemler için kullanılır.","ans":"E"},{"stem":"If we ---- this important issue at the next board meeting, we can probably avoid several further misunderstandings.","ans":"A","slug":"gri-mod-ydt-conditionals-1-14","why":"Type 1 Conditional: gerçeklik ","choices":{"B":"although","C":"unless","D":"in case","E":"however","A":"as long as"},"n":19,"why":"'As long as' = '...sürece, ...koşuluyla'. 'Provided that' ile benzer anlam, koşul bildirir.","slug":"gri-mod-ydt-conditionals-1-19"},{"ans":"C","stem":"The devastating earthquake would not have caused such extensive damage if the residential buildings ---- to modern safety standards.","choices":{"B":"built","D":"would build","E":"building","C":"had been built","A":"build"},"n":20,"why":"Type 3 passive: if + had been + V3, would have + V3. Bina inşa edilmiş (pasif): 'had been built'.","slug":"gri-mod-ydt-conditionals-1-20"},{"ans":"B","why":"Wish + past simple = şu anki gerçekliğe karşıt istek. 'Wish the government paid attention' = keşke (şu anda) dikkat etse.","stem":"Many city residents wish the municipal government ---- closer attention to public transport and the cycling infrastructure.","choices":{"B":"paid","C":"had paid","E":"pays","D":"would pay","A":"pay"},"n":21,"slug":"gri-mod-ydt-conditionals-1-21"},{"ans":"E","why":"'Supposing' = 'Diyelim ki, farz et ki'. 'Suppose' ile aynı işlev, hipotetik durum kurmak için kullanılır.","stem":"---- you had to choose between studying abroad and starting a stable career immediately, which one would you ultimately prefer?","slug":"gri-mod-ydt-conditionals-1-22","choices":{"B":"Provided","A":"If only","D":"In case","E":"Supposing","C":"Unless"},"n":22},{"n":23,"choices":{"D":"however","E":"whereas","C":"unless","A":"if","B":"although"},"slug":"gri-mod-ydt-conditionals-1-23","stem":"The scholarship committee will officially inform applicants ---- their submissions meet the required academic standards.","why":"Type 1 Conditional: temel 'if' bağlacı. 'If their submissions meet ... will inform'. Standart şart cümlesi.","ans":"A"},{"slug":"gri-mod-ydt-conditionals-1-24","choices":{"B":"If","A":"Were","C":"Had","E":"Should","D":"Without"},"n":24,"stem":"---- it not been for the remarkable dedication of the volunteer team, the entire project would never have been completed on time.","why":"'Had it not been for X' = 'If it had not been for X' = 'X olmasaydı'. Type 3 inversion + 'But for' eşdeğeri yapı.","ans":"C"},{"n":25,"choices":{"B":"although","A":"unless","C":"whereas","D":"provided that","E":"supposing"},"slug":"gri-mod-ydt-conditionals-1-25","why":"'Provided that' = '...şartıyla'. Maaş beklentilerini karşılaması koşuluyla teklifi kabul edecek.","ans":"D","stem":"The new graduate will accept the corporate offer ---- the salary meets her significant financial expectations in the long term."},{"choices":{"A":"Without","E":"In case","D":"Provided","C":"If only","B":"Unless"},"n":26,"why":"'Without X, Y could have happened' = 'X olmasaydı, Y olabilirdi'. İmalı (implied) Type 3 yapı. 'Without' = 'If it had not been for'.","slug":"gri-mod-ydt-conditionals-1-26","ans":"A","stem":"---- the rapid intervention of the emergency services, the fire could have spread throughout the entire neighbourhood last night."},{"stem":"The economy may experience considerable growth in the coming years if the recent fiscal reforms ---- effective in the long run.","slug":"gri-mod-ydt-conditionals-1-27","n":27,"choices":{"C":"prove","E":"proved","D":"would prove","A":"had proved","B":"proves"},"ans":"C","why":"Type 1 Conditional: if + present simple, may + V1. 'Reforms' çoğul olduğu için 'prove' (s'siz). Gerçekçi gelecek."},{"choices":{"B":"adopts","C":"had adopted","D":"would adopt","E":"adopted","A":"adopt"},"n":28,"why":"Type 2 Conditional: if + past simple (adopted), would + V1 (would be). Şu anki hipotetik genel durum.","slug":"gri-mod-ydt-conditionals-1-28","ans":"E","stem":"If the manager ---- a more democratic management style on a daily basis, the entire team would be much more productive."},{"stem":"---- about the unexpected cancellation a little earlier, we would have arranged alternative transportation in time.","ans":"B","why":"Type 3 inversion: 'Had we heard' = 'If we had heard'. Geçmiş hipotetik, devrik yapı.","slug":"gri-mod-ydt-conditionals-1-29","n":29,"choices":{"B":"Had we heard","A":"Heard we","E":"If we hear","D":"Would we hear","C":"Did we hear"}},{"slug":"gri-mod-ydt-conditionals-1-30","choices":{"B":"had been","C":"being","E":"was","D":"were not","A":"is"},"n":30,"stem":"If the chairman ---- such a conservative person by nature, he would have approved the bold new corporate strategy immediately.","why":"Mixed Conditional: şu anki/sürekli durum (were not) → geçmiş sonuç (would have approved). 'Yapı itibarıyla muhafazakâr olmasa, stratejiyi onaylardı.'","ans":"D"},{"choices":{"A":"But","C":"Without","E":"Had it","D":"Were it","B":"If"},"n":31,"why":"'But for X' = 'X olmasaydı' = 'If it had not been for X'. İmalı Type 3. 'Without' ile eşdeğer ama daha edebi/formal.","slug":"gri-mod-ydt-conditionals-1-31","ans":"A","stem":"---- for the new tax incentives offered last year, many small local businesses would have closed during the economic downturn."},{"ans":"C","why":"'Unless' = 'if not'. 'Will not be delayed unless conditions deteriorate' = hava bozulmazsa ertelenmeyecek.","stem":"The international flight will not be delayed ---- the weather conditions deteriorate significantly within the next two hours.","slug":"gri-mod-ydt-conditionals-1-32","choices":{"B":"when","E":"supposing","D":"provided","C":"unless","A":"if"},"n":32},{"slug":"gri-mod-ydt-conditionals-1-33","choices":{"B":"be","C":"would be","E":"had been","D":"were","A":"are"},"n":33,"stem":"The escalating political crisis could be resolved much more quickly if the two opposing sides ---- more willing to compromise on key issues.","why":"Type 2 Conditional: if + past (were), could + V1 (could be resolved). Şu anki hipotetik durum.","ans":"D"},{"ans":"B","why":"'Provided that' = '...şartıyla'. Fon toplanması koşuluyla bina korunacak.","stem":"The historic stone building will be carefully preserved ---- sufficient public funds are raised by the end of this calendar year.","n":34,"choices":{"B":"provided that","A":"although","E":"whereas","D":"however","C":"unless"},"slug":"gri-mod-ydt-conditionals-1-34"},{"why":"'If only + past perfect' = geçmiş pişmanlık. 'Had discovered' = keşke (geçmişte) keşfetselerdi.","ans":"E","n":35,"choices":{"C":"discovering","D":"would discover","E":"had discovered","A":"discover","B":"discovered"},"slug":"gri-mod-ydt-conditionals-1-35","stem":"If only the structural engineers ---- the critical weakness much earlier, before the bridge collapsed during the severe storm last winter."},{"ans":"B","why":"Wish + past simple = şu anki duruma karşıt istek. 'Wish it did not pass' = keşke (şu anda) geçmese.","stem":"Most local residents now wish the new highway ---- through their quiet residential neighbourhoods quite so frequently.","n":36,"choices":{"E":"pass not","D":"would not pass","C":"had not passed","A":"does not pass","B":"did not pass"},"slug":"gri-mod-ydt-conditionals-1-36"},{"choices":{"B":"will be","A":"is","C":"was","E":"being","D":"had been"},"n":37,"why":"Type 0 Conditional: genel kural/gerçek. Yapı: if + present simple, present simple. 'Oda gece yarısı otomatik kilitlenir' — düzenli, kuralcı.","slug":"gri-mod-ydt-conditionals-1-37","ans":"A","stem":"The main conference room ---- automatically locked at exactly midnight if no one is still working inside the building."},{"slug":"gri-mod-ydt-conditionals-1-38","n":38,"choices":{"C":"is being","E":"had been","D":"would have been","A":"is","B":"would be"},"stem":"The natural disaster ---- significantly less devastating if proper warning systems had been firmly in place across the entire region.","why":"Type 3 Conditional: if + past perfect (had been in place), would have + V3 (would have been less devastating). Geçmiş hipotetik.","ans":"D"},{"stem":"If you ---- a chance to relocate to absolutely any country in the world right now, which one would you ultimately choose?","slug":"gri-mod-ydt-conditionals-1-39","n":39,"choices":{"D":"would have","E":"having","C":"had","A":"have",   app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});

  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));

  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}

var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
