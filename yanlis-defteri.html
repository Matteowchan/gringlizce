<style>
:root{--cream:#EFE7D8;--ink:#26201A;--muted:#8A7F6E;--line:#E3D8C5;--accent:#A8382F;--accent-deep:#7C2A23;--accent-soft:#F2E1DC;--panel:#F2E1DC;--paper:#FBF6EC;--card:#FCFAF4;--good:#2E6E4E;}
:root[data-theme="dark"]{--cream:#17130d;--ink:#E9E2D4;--muted:#9c9384;--line:#322b20;--accent-soft:#3a2420;--panel:#3a2420;--paper:#1e1a12;--card:#201c14;}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
.shell{max-width:940px;margin:0 auto;padding:26px 22px 90px}
.main{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:0 0 34px;overflow:hidden}
.pad{padding:0 34px}

.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px}

.lead{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.25rem;margin:24px 0 4px}
.rule{height:3px;width:52px;background:var(--accent);border-radius:2px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 16px;border-radius:22px;cursor:pointer;border:none}
.btn.ghost{color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent)}
.summary{font-family:Inter,sans-serif;font-size:14px;color:var(--accent-deep);background:var(--accent-soft);border:1px solid #E4C4BC;border-radius:12px;padding:12px 15px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mod{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 0 4px}
.item{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:12px;align-items:flex-start}
.item .qx{flex:1;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.45}
.item .ax{display:block;font-size:13px;color:var(--good);margin-top:4px}
.item .ax b{color:var(--good)}
.item .rm{flex:none;font-family:Inter,sans-serif;font-size:12px;color:var(--accent-deep);background:transparent;border:1.5px solid var(--line);border-radius:16px;padding:4px 11px;cursor:pointer}
.item .rm:hover{border-color:var(--accent)}
.empty{font-family:Inter,sans-serif;font-size:14px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.note{margin:14px 0;border-radius:12px;padding:12px 15px;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;background:var(--card);border:1px solid var(--line);color:var(--muted)}

<div class="launch-banner" data-site-banner></div>
<div class="shell"><div class="main" id="main"><div id="app"></div></div></div>
<script>
const app=document.getElementById('app');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function read(){try{return JSON.parse(localStorage.getItem('gri_errors')||'[]');}catch(e){return [];}}
function write(a){try{localStorage.setItem('gri_errors',JSON.stringify(a));}catch(e){}}
function render(){
  const errs=read();
  let h=`<div class="head"><div class="eyebrow">Kişisel</div><h1>Yanlış Defteri</h1><div class="lead">Bütün modüllerde kaçırdığın sorular burada toplanır. Doğru çözünce listeden düşer.</div></div><div class="pad">`;
  if(!errs.length){
    h+=`<div class="note" style="margin-top:16px">Bu defter senin tarayıcında tutulur, kimseyle paylaşılmaz.</div><div class="empty">Henüz yanlışın yok. Bir modülde soru çözüp Cevabı kontrol et'e bastıkça, kaçırdığın sorular otomatik buraya düşer.</div></div></body></html>`;
    app.innerHTML=h;return;
  }
  const byMod={};errs.forEach(e=>{(byMod[e.m]=byMod[e.m]||[]).push(e);});
  h+=`<div class="summary"><span>Toplam <b>${errs.length}</b> yanlış, <b>${Object.keys(byMod).length}</b> modülde.</span><button class="btn ghost" id="clearAll">Hepsini temizle</button></div>`;
  h+=`<div class="note">Kaçırdığın soruları burada gör, sonra ilgili modüle dönüp yeniden çöz. Doğru çözersen soru bu listeden otomatik silinir.</div>`;
  Object.keys(byMod).sort().forEach(m=>{
    h+=`<div class="mod">${esc(m)} . ${byMod[m].length}</div>`;
    byMod[m].forEach(e=>{
      h+=`<div class="item" data-key="${esc(e.key)}"><div class="qx">${esc(e.q)}<span class="ax">Doğru cevap: <b>${esc(e.a)}</b></span></div><button class="rm">Sil</button></div>`;
    });
  });
  h+=`</div>`;app.innerHTML=h;
  document.getElementById('clearAll').onclick=()=>{if(confirm('Bütün yanlışlar silinsin mi?')){write([]);render();}};
  app.querySelectorAll('.item .rm').forEach(b=>b.onclick=()=>{const key=b.closest('.item').getAttribute('data-key');write(read().filter(e=>e.key!==key));render();});
}
// GATE
(function(){
  const SB_U=(window.SUPABASE_URL||'https://vazbvbqgvtlaqkytfsbi.supabase.co');
  const SB_K=(window.SUPABASE_KEY||'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g');
  function showGate(){const ret=encodeURIComponent('/'+location.pathname.split('/').pop());
    app.innerHTML='<div class="head"><div class="eyebrow">Üyelere özel</div><h1>Bu içerik giriş gerektirir</h1></div>'+
      '<div class="pad"><p style="font-family:Inter,sans-serif;font-size:14px;color:var(--muted)">Yanlış defterini görmek için ücretsiz hesabınla giriş yap.</p>'+
      '<div style="display:flex;gap:10px;margin-top:14px"><a class="btn" href="giris.html?return='+ret+'">Giriş Yap</a>'+
      '<a class="btn ghost" href="giris.html#signup">Ücretsiz Hesap Aç</a></div></div>';}
  function boot(cb){if(window.supabase&&window.supabase.createClient)return cb();var t=0,iv=setInterval(function(){t++;if(window.supabase&&window.supabase.createClient){clearInterval(iv);cb();}else if(t>30){clearInterval(iv);cb();}},100);}
  app.innerHTML='<div class="head"><div class="eyebrow">Yükleniyor</div><h1>&nbsp;</h1></div>';
  boot(async function(){var ok=false;try{if(window.supabase&&window.supabase.createClient){var c=window.supabase.createClient(SB_U,SB_K);var r=await c.auth.getSession();ok=!!(r&&r.data&&r.data.session);}}catch(e){ok=false;}
    if(ok){render();}else{showGate();}});
})();
</script>
