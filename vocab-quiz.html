<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="google-adsense-account" content="ca-pub-5818550785641442">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Kelime Ödevi | Gri English</title>
  <meta name="theme-color" content="#2C5856">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/main.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/site-config.js" defer></script>
  <script src="assets/theme.js" defer></script>

  <style>
    :root {
      --bg: #F4EFE3;
      --bg-soft: #EFE8D9;
      --bg-card: #FFFFFF;
      --bg-card-soft: #FBF7EE;
      --text: #1A2230;
      --text-soft: #4A4A48;
      --text-muted: #6B6862;
      --teal: #2C5856;
      --teal-soft: #3A6F6C;
      --teal-dark: #1D4341;
      --teal-deep: #143231;
      --gold: #B89968;
      --gold-soft: #C9AC7E;
      --gold-deep: #8C6F44;
      --line: #D9D2C4;
      --line-soft: #E8E1D2;
      --success: #2C7A4E;
      --success-soft: #4A9A6C;
      --success-bg: #E8F3EC;
      --success-bg-deep: #D4EBD9;
      --error: #B33A3A;
      --error-soft: #C95555;
      --error-bg: #FBEAEA;
      --error-bg-deep: #F4D5D5;
      --shadow-sm: 0 1px 2px rgba(26, 34, 48, 0.04), 0 1px 3px rgba(26, 34, 48, 0.03);
      --shadow-md: 0 1px 2px rgba(26, 34, 48, 0.04), 0 4px 12px rgba(26, 34, 48, 0.06), 0 0 0 1px rgba(26, 34, 48, 0.03);
      --shadow-lg: 0 1px 2px rgba(26, 34, 48, 0.04), 0 8px 24px rgba(26, 34, 48, 0.08), 0 16px 48px rgba(26, 34, 48, 0.06);
      --shadow-xl: 0 2px 4px rgba(26, 34, 48, 0.06), 0 12px 32px rgba(26, 34, 48, 0.1), 0 24px 64px rgba(26, 34, 48, 0.08);
      --shadow-pressed: 0 1px 1px rgba(26, 34, 48, 0.06), inset 0 1px 2px rgba(26, 34, 48, 0.06);
      --shadow-correct: 0 1px 2px rgba(44, 122, 78, 0.12), 0 8px 20px rgba(44, 122, 78, 0.2), 0 0 0 3px rgba(44, 122, 78, 0.08);
      --shadow-wrong: 0 1px 2px rgba(179, 58, 58, 0.12), 0 4px 12px rgba(179, 58, 58, 0.12), inset 0 1px 2px rgba(179, 58, 58, 0.08);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-body: Georgia, 'Times New Roman', serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at top, rgba(184, 153, 104, 0.05), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(44, 88, 86, 0.04), transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .vq-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(244, 239, 227, 0.85);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .vq-brand {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .vq-brand em { color: var(--teal); font-style: italic; }

    .vq-exit {
      background: var(--bg-card);
      border: 1px solid var(--line);
      color: var(--text-soft);
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s var(--ease-out);
    }
    .vq-exit:hover {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .vq-exit:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    /* ========== SPLASH ========== */
    .vq-splash { text-align: center; padding: 2rem 1rem; width: 100%; }
    .vq-eyebrow {
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.7rem;
    }
    .vq-title {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 600;
      margin: 0 0 0.6rem;
      line-height: 1.15;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .vq-meta {
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .vq-meta span { margin: 0 0.4rem; }
    .vq-desc {
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-soft);
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    .vq-stats {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      margin: 0 auto 2.5rem;
      padding: 1.8rem 2.4rem;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      max-width: 480px;
      box-shadow: var(--shadow-md);
    }
    .vq-stat-box { text-align: center; }
    .vq-stat-label {
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .vq-stat-value {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--teal);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .vq-btn-primary, .vq-btn-secondary {
      display: inline-block;
      padding: 1rem 2.4rem;
      border: none;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s var(--ease-out);
      position: relative;
    }
    .vq-btn-primary {
      background: linear-gradient(180deg, var(--teal-soft) 0%, var(--teal) 50%, var(--teal-dark) 100%);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 1px 2px rgba(0, 0, 0, 0.1),
        0 6px 14px rgba(44, 88, 86, 0.3),
        0 0 0 1px rgba(20, 50, 49, 0.1);
    }
    .vq-btn-primary:hover {
      background: linear-gradient(180deg, var(--teal) 0%, var(--teal-dark) 50%, var(--teal-deep) 100%);
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 1px 2px rgba(0, 0, 0, 0.1),
        0 10px 24px rgba(44, 88, 86, 0.35),
        0 0 0 1px rgba(20, 50, 49, 0.1);
    }
    .vq-btn-primary:active {
      transform: translateY(0);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.15),
        0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .vq-btn-secondary {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        var(--shadow-sm);
    }
    .vq-btn-secondary:hover {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        var(--shadow-md);
      transform: translateY(-1px);
    }
    .vq-btn-secondary:active {
      transform: translateY(0);
      box-shadow: var(--shadow-pressed);
    }

    /* ========== QUIZ ========== */
    .vq-quiz { width: 100%; max-width: 560px; }

    .vq-progress { margin-bottom: 2rem; }
    .vq-progress-bar {
      width: 100%;
      height: 10px;
      background: linear-gradient(180deg, rgba(217, 210, 196, 0.65) 0%, rgba(217, 210, 196, 0.4) 100%);
      border-radius: 999px;
      overflow: hidden;
      box-shadow:
        inset 0 2px 4px rgba(26, 34, 48, 0.12),
        inset 0 -1px 1px rgba(255, 255, 255, 0.4),
        0 1px 0 rgba(255, 255, 255, 0.5);
      position: relative;
    }
    .vq-progress-fill {
      height: 100%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, transparent 40%, transparent 60%, rgba(0, 0, 0, 0.08) 100%),
        linear-gradient(90deg, var(--teal-dark) 0%, var(--teal) 35%, var(--teal-soft) 70%, var(--gold-soft) 100%);
      background-blend-mode: overlay, normal;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 1px rgba(0, 0, 0, 0.12),
        0 0 12px rgba(44, 88, 86, 0.4),
        0 0 0 1px rgba(44, 88, 86, 0.15);
      transition: width 0.5s var(--ease-out);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    .vq-progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 100%);
      border-radius: 999px 999px 0 0;
      pointer-events: none;
    }
    .vq-progress-text {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 0.8rem;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
    .vq-progress-text strong {
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .vq-prompt {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 2.8rem 2rem;
      text-align: center;
      margin-bottom: 1.4rem;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        var(--shadow-lg);
      position: relative;
    }
    .vq-prompt::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.4;
    }
    .vq-prompt-eyebrow {
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      font-weight: 700;
    }
    .vq-prompt-word {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
      margin: 0;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .vq-prompt-pos {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.25rem 0.8rem;
      background: linear-gradient(180deg, rgba(184, 153, 104, 0.18) 0%, rgba(184, 153, 104, 0.1) 100%);
      color: var(--gold-deep);
      font-family: var(--font-ui);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid rgba(184, 153, 104, 0.25);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(184, 153, 104, 0.15);
    }

    .vq-options {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .vq-option {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 1.15rem;
      color: var(--text);
      text-align: left;
      transition: all 0.18s var(--ease-out);
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 1px 2px rgba(26, 34, 48, 0.04),
        0 2px 6px rgba(26, 34, 48, 0.04);
      position: relative;
    }
    .vq-option:hover:not(.wrong):not(.correct) {
      background: linear-gradient(180deg, #FFFEFB 0%, #FAF5EB 100%);
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 1px 2px rgba(184, 153, 104, 0.1),
        0 8px 20px rgba(184, 153, 104, 0.15),
        0 0 0 1px rgba(184, 153, 104, 0.25);
    }
    .vq-option:active:not(.wrong):not(.correct) {
      transform: translateY(0);
      box-shadow:
        inset 0 2px 4px rgba(26, 34, 48, 0.08),
        0 1px 2px rgba(26, 34, 48, 0.04);
    }
    .vq-option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--bg-soft) 0%, var(--line-soft) 100%);
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      flex-shrink: 0;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 1px 2px rgba(26, 34, 48, 0.06);
      transition: all 0.18s var(--ease-out);
    }
    .vq-option:hover:not(.wrong):not(.correct) .vq-option-letter {
      background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 1px 2px rgba(140, 111, 68, 0.3),
        0 2px 6px rgba(184, 153, 104, 0.25);
    }
    .vq-option-text { flex: 1; }

    .vq-option.wrong {
      background: linear-gradient(180deg, var(--error-bg) 0%, var(--error-bg-deep) 100%);
      border-color: var(--error-soft);
      color: var(--error);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.85;
      box-shadow: var(--shadow-wrong);
      animation: shake 0.35s var(--ease-out);
    }
    .vq-option.wrong .vq-option-letter {
      background: linear-gradient(180deg, var(--error-soft) 0%, var(--error) 100%);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 1px 2px rgba(120, 30, 30, 0.3);
    }

    .vq-option.correct {
      background: linear-gradient(180deg, var(--success-bg) 0%, var(--success-bg-deep) 100%);
      border-color: var(--success-soft);
      color: var(--success);
      animation: pulse-correct 0.5s var(--ease-spring);
      box-shadow: var(--shadow-correct);
    }
    .vq-option.correct .vq-option-letter {
      background: linear-gradient(180deg, var(--success-soft) 0%, var(--success) 100%);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 1px 2px rgba(20, 80, 50, 0.3),
        0 0 0 3px rgba(44, 122, 78, 0.12);
    }

    @keyframes pulse-correct {
      0% { transform: scale(1); }
      30% { transform: scale(1.025); }
      60% { transform: scale(0.998); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }

    .vq-hint {
      text-align: center;
      font-family: var(--font-ui);
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-top: 1.2rem;
      min-height: 1.2rem;
      font-weight: 500;
      transition: color 0.18s var(--ease-out);
    }

    /* ========== RESULT ========== */
    .vq-result { text-align: center; padding: 2rem 1rem; width: 100%; }
    .vq-result-score {
      font-family: var(--font-display);
      font-size: 5.5rem;
      font-weight: 600;
      color: var(--teal);
      line-height: 1;
      margin: 1rem 0 0.3rem;
      letter-spacing: -0.04em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
    }
    .vq-result-score-out {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .vq-result-pct {
      font-family: var(--font-ui);
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .vq-new-best {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.6rem 1.4rem;
      background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 50%, var(--gold-deep) 100%);
      color: #fff;
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 999px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 1px 2px rgba(140, 111, 68, 0.2),
        0 8px 20px rgba(184, 153, 104, 0.35);
      animation: pulse-correct 0.6s var(--ease-spring);
    }
    .vq-result-stats {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .vq-result-stats span strong { color: var(--text); font-weight: 600; }

    .vq-result-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .vq-review {
      margin-top: 2.5rem;
      padding: 1.6rem;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      text-align: left;
      box-shadow: var(--shadow-md);
    }
    .vq-review-title {
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .vq-review-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.6rem;
    }
    .vq-review-item {
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      font-size: 0.88rem;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(26, 34, 48, 0.03);
    }
    .vq-review-item strong {
      display: block;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
    }
    .vq-review-item span {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* ========== MESSAGES ========== */
    .vq-msg {
      text-align: center;
      padding: 3rem 1rem;
      font-family: var(--font-body);
      color: var(--text-muted);
    }
    .vq-msg.error { color: var(--error); }

    /* ========== DARK THEME ========== */
    :root[data-theme="dark"] {
      --bg: #1A2230;
      --bg-soft: #232C3D;
      --bg-card: #283142;
      --bg-card-soft: #232C3D;
      --text: #F4EFE3;
      --text-soft: #C8C3B6;
      --text-muted: #8A8578;
      --line: #3A4356;
      --line-soft: #2F3848;
    }
    :root[data-theme="dark"] body {
      background-image:
        radial-gradient(ellipse at top, rgba(184, 153, 104, 0.06), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(44, 88, 86, 0.08), transparent 60%);
    }
    :root[data-theme="dark"] .vq-prompt-word {
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
    :root[data-theme="dark"] .vq-option-letter {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* Mobile */
    @media (max-width: 600px) {
      .vq-title { font-size: 1.8rem; }
      .vq-prompt { padding: 2.2rem 1.2rem; border-radius: 12px; }
      .vq-prompt-word { font-size: 2.3rem; }
      .vq-option { padding: 1rem 1.1rem; font-size: 1.05rem; border-radius: 8px; }
      .vq-option-letter { width: 28px; height: 28px; }
      .vq-stats { padding: 1.2rem 1.6rem; gap: 1.8rem; }
      .vq-stat-value { font-size: 1.9rem; }
      .vq-result-score { font-size: 3.8rem; }
    }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gri English">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .catch(function(err){ console.warn('[PWA] SW register failed:', err); });
      });
    }
  </script>
  <!-- APP MODE -->
  <link rel="stylesheet" href="/assets/app-mode.css">
  <script src="/assets/app-mode.js" defer></script>
  <!-- PWA INSTALL -->
  <link rel="stylesheet" href="/assets/pwa-install.css">
  <script src="/assets/pwa-install.js" defer></script>
</head>
<body>
<header class="vq-header">
  <a href="panelim.html" class="vq-brand">Gri <em>English</em></a>
  <a href="panelim.html" class="vq-exit">← Masama Dön</a>
</header>

<main>
  <div id="vq-root">
    <p class="vq-msg">Yükleniyor...</p>
  </div>
</main>

<script>
(async function () {
  var SUPABASE_URL = window.SUPABASE_URL || 'https://vazbvbqgvtlaqkytfsbi.supabase.co';
  var SUPABASE_KEY = window.SUPABASE_KEY || 'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g';
  if (!window.supabase || !window.supabase.createClient) {
    document.getElementById('vq-root').innerHTML = '<p class="vq-msg error">Supabase yüklenemedi.</p>';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var sess = await sb.auth.getSession();
  if (!sess.data.session) {
    window.location.href = 'giris.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  var params = new URLSearchParams(window.location.search);
  var assignmentId = params.get('id');
  if (!assignmentId) {
    document.getElementById('vq-root').innerHTML = '<p class="vq-msg error">Ödev ID eksik. <a href="panelim.html">Masama Dön</a></p>';
    return;
  }

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var quiz = {
    assignmentId: assignmentId,
    assignment: null,
    words: [],
    currentIdx: 0,
    score: 0,
    wrongWords: [],
    startTime: null
  };

  var root = document.getElementById('vq-root');
  try {
    var r = await sb.rpc('vocab_quiz_start', { p_assignment_id: assignmentId });
    if (r.error) throw r.error;
    var data = r.data || {};
    quiz.assignment = data.assignment || {};
    quiz.words = data.words || [];

    if (quiz.words.length < 2) {
      root.innerHTML = '<p class="vq-msg">Bu ödevde test için yeterli kelime yok (en az 2 gerekir). <a href="panelim.html">Masama Dön</a></p>';
      return;
    }

    renderSplash();
  } catch (err) {
    root.innerHTML = '<p class="vq-msg error">Yüklenemedi: ' + esc(err.message || err) + '</p>';
    return;
  }

  function renderSplash() {
    var a = quiz.assignment;
    var deadlineStr = '';
    if (a.deadline) {
      var d = new Date(a.deadline);
      deadlineStr = '<span>Son tarih: ' + d.toLocaleDateString('tr-TR') + '</span>';
    }
    var expiredBadge = a.is_expired
      ? '<div style="background:rgba(179,58,58,0.1); color:var(--error); padding:0.5rem 1rem; border-radius:4px; display:inline-block; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:1rem;">Süresi geçti</div>'
      : '';

    root.innerHTML = ''
      + '<div class="vq-splash">'
      + expiredBadge
      + '<div class="vq-eyebrow">Kelime Ödevi</div>'
      + '<h1 class="vq-title">' + esc(a.title || 'Kelime') + '</h1>'
      + '<div class="vq-meta">'
        + '<span>' + quiz.words.length + ' kelime</span>'
        + (deadlineStr ? '·' + deadlineStr : '')
      + '</div>'
      + (a.description ? '<p class="vq-desc">' + esc(a.description) + '</p>' : '')
      + '<div class="vq-stats">'
        + '<div class="vq-stat-box">'
          + '<div class="vq-stat-label">Toplam Kelime</div>'
          + '<div class="vq-stat-value">' + quiz.words.length + '</div>'
        + '</div>'
      + '</div>'
      + '<button class="vq-btn-primary" id="vq-start-btn">Başla</button>'
      + '<p style="margin-top:1.4rem; font-size:0.82rem; color:var(--text-muted); font-family:var(--font-ui);">İngilizce kelimenin Türkçe karşılığını bul. Yanlış cevaplar elenir. İlk denemede bilirsen puan kazanırsın.</p>'
      + '</div>';

    document.getElementById('vq-start-btn').addEventListener('click', startQuiz);
  }

  function startQuiz() {
    quiz.currentIdx = 0;
    quiz.score = 0;
    quiz.wrongWords = [];
    quiz.startTime = Date.now();
    quiz.words = shuffle(quiz.words);
    renderQuestion();
  }

  function buildOptions(word) {
    var others = quiz.words.filter(function (w) { return w.tr !== word.tr; });
    var uniqueTrs = [];
    var seen = {};
    others.forEach(function (w) {
      if (!seen[w.tr]) {
        seen[w.tr] = true;
        uniqueTrs.push(w.tr);
      }
    });
    var distractors = shuffle(uniqueTrs).slice(0, 3);
    return shuffle([word.tr].concat(distractors));
  }

  var qState = null;

  function renderQuestion() {
    var idx = quiz.currentIdx;
    var total = quiz.words.length;
    var word = quiz.words[idx];
    var options = buildOptions(word);
    var pct = Math.round(100 * idx / total);

    qState = {
      word: word,
      options: options,
      wrongCount: 0,
      answered: false
    };

    var letters = ['A', 'B', 'C', 'D'];

    root.innerHTML = ''
      + '<div class="vq-quiz">'
      + '<div class="vq-progress">'
        + '<div class="vq-progress-bar"><div class="vq-progress-fill" style="width:' + pct + '%"></div></div>'
        + '<div class="vq-progress-text">'
          + '<span><strong>' + (idx + 1) + '</strong> / ' + total + '</span>'
          + '<span>' + quiz.score + ' doğru</span>'
        + '</div>'
      + '</div>'

      + '<div class="vq-prompt">'
        + '<div class="vq-prompt-eyebrow">Türkçe Karşılığı</div>'
        + '<h2 class="vq-prompt-word">' + esc(word.en) + '</h2>'
        + (word.pos ? '<span class="vq-prompt-pos">' + esc(word.pos) + '</span>' : '')
      + '</div>'

      + '<div class="vq-options" id="vq-options">'
      + options.map(function (opt, i) {
          return '<button type="button" class="vq-option" data-tr="' + esc(opt) + '">'
            + '<span class="vq-option-letter">' + letters[i] + '</span>'
            + '<span class="vq-option-text">' + esc(opt) + '</span>'
          + '</button>';
        }).join('')
      + '</div>'
      + '<p class="vq-hint" id="vq-hint"></p>'
      + '</div>';

    document.querySelectorAll('.vq-option').forEach(function (btn) {
      btn.addEventListener('click', function () { handleOption(btn); });
    });
  }

  function handleOption(btn) {
    if (qState.answered) return;
    var picked = btn.dataset.tr;
    var correct = qState.word.tr;
    var hint = document.getElementById('vq-hint');

    if (picked === correct) {
      btn.classList.add('correct');
      qState.answered = true;

      if (qState.wrongCount === 0) {
        quiz.score += 1;
        hint.textContent = 'Doğru';
      } else {
        quiz.wrongWords.push(qState.word);
        hint.textContent = 'Doğru — ama ilk seferde değil';
      }

      setTimeout(function () {
        quiz.currentIdx += 1;
        if (quiz.currentIdx >= quiz.words.length) {
          submitQuiz();
        } else {
          renderQuestion();
        }
      }, 700);
    } else {
      btn.classList.add('wrong');
      qState.wrongCount += 1;
      hint.textContent = 'Yanlış. Tekrar dene.';
    }
  }

  async function submitQuiz() {
    root.innerHTML = '<p class="vq-msg">Sonuç kaydediliyor...</p>';
    var duration = Date.now() - quiz.startTime;

    try {
      var r = await sb.rpc('vocab_quiz_submit', {
        p_assignment_id: quiz.assignmentId,
        p_score: quiz.score,
        p_total: quiz.words.length,
        p_duration_ms: duration
      });
      if (r.error) throw r.error;
      var result = r.data || {};
      renderResult(result, duration);
    } catch (err) {
      root.innerHTML = '<p class="vq-msg error">Sonuç kaydedilemedi: ' + esc(err.message || err) + '</p>';
    }
  }

  function renderResult(result, duration) {
    var pct = result.pct || 0;
    var isNewBest = result.is_new_best;
    var bestScore = result.best_score;
    var durSec = Math.round(duration / 1000);
    var durStr = durSec < 60 ? durSec + ' sn' : Math.floor(durSec / 60) + ' dk ' + (durSec % 60) + ' sn';

    var congrats = pct >= 90 ? 'Mükemmel' : (pct >= 70 ? 'İyi iş' : (pct >= 50 ? 'Fena değil' : 'Tekrar dene'));

    var reviewHtml = '';
    if (quiz.wrongWords.length > 0) {
      reviewHtml = ''
        + '<div class="vq-review">'
        + '<div class="vq-review-title">Üzerinde Çalışılacak Kelimeler (' + quiz.wrongWords.length + ')</div>'
        + '<div class="vq-review-list">'
        + quiz.wrongWords.map(function (w) {
            return '<div class="vq-review-item"><strong>' + esc(w.en) + '</strong><span>' + esc(w.tr) + '</span></div>';
          }).join('')
        + '</div>'
        + '</div>';
    }

    root.innerHTML = ''
      + '<div class="vq-result">'
      + '<div class="vq-eyebrow">' + congrats + '</div>'
      + '<h2 class="vq-title" style="margin-bottom:0.4rem;">' + esc(quiz.assignment.title || 'Kelime') + '</h2>'
      + (isNewBest ? '<div class="vq-new-best">Yeni Rekor</div>' : '')
      + '<div class="vq-result-score">'
        + result.score
        + '<span class="vq-result-score-out"> / ' + result.total + '</span>'
      + '</div>'
      + '<div class="vq-result-pct">%' + pct + ' · ilk denemede doğru</div>'
      + '<div class="vq-result-stats">'
        + '<span>Süre: <strong>' + durStr + '</strong></span>'
        + (bestScore !== null && bestScore !== result.score ? '<span>·</span><span>En yüksek: <strong>' + bestScore + ' / ' + result.total + '</strong></span>' : '')
      + '</div>'
      + '<div class="vq-result-actions">'
        + '<button class="vq-btn-primary" id="vq-retry-btn">Tekrar Çöz</button>'
        + '<a href="panelim.html" class="vq-btn-secondary">Masama Dön</a>'
      + '</div>'
      + reviewHtml
      + '</div>';

    document.getElementById('vq-retry-btn').addEventListener('click', startQuiz);
  }

  window.addEventListener('beforeunload', function (e) {
    if (quiz.startTime && quiz.currentIdx > 0 && quiz.currentIdx < quiz.words.length) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

})();
</script>

</body>
</html>
