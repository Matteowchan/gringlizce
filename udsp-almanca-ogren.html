-udspde-basla-2"}, {"n": 3, "stem": "Her soruda kaç seçenek bulunur?", "choices": {"A": "2", "B": "3", "C": "4", "D": "5", "E": "6"}, "ans": "D", "why": "Her soruda A'dan E'ye 5 seçenek vardır.", "slug": "gri-mod-udspde-basla-3"}, {"n": 4, "stem": "Bu sınava aşağıdakilerden hangileri girer?", "choices": {"A": "Sadece üniversite öğrencileri", "B": "Doktora adayları", "C": "8. sınıf, hazırlık, 9 ve 10. sınıf öğrencileri", "D": "Sadece öğretmenler", "E": "Yüksek lisans adayları"}, "ans": "C", "why": "UDSP, uluslararası diploma/sertifika programları için 8. sınıf, hazırlık, 9 ve 10. sınıf öğrencilerine yöneliktir.", "slug": "gri-mod-udspde-basla-4"}, {"n": 5, "stem": "Geçmek için yaklaşık hangi başarı yüzdesi gerekir?", "choices": {"A": "%40", "B": "%50", "C": "%60", "D": "%70", "E": "%90"}, "ans": "D", "why": "Geçme eşiği yaklaşık %70 doğrudur.", "slug": "gri-mod-udspde-basla-5"}]}]}, {"id": "kelime", "group": "Bölümler", "name": "Wortschatz - Kelime", "eyebrow": "Wortschatz", "lead": "A2-B1 kelime, Kollokationen ve falsche Freunde", "blocks": [{"t": "p", "x": "Wortschatz-Lücke sorularında cümledeki boşluğa anlamca ve dilbilgisi olarak en uygun kelime gelir. Bol kelime bilmek yetmez; kelimenin hangi fiil ya da isimle birlikte kullanıldığını (Kollokation) da bilmek gerekir."}, {"t": "h", "x": "Tema kelimeleri (A2-B1)"}, {"t": "table", "head": ["Almanca", "Türkçe", "Tema"], "rows": [["die Schule / der Unterricht", "okul / ders", "Schule"], ["die Prüfung / die Note", "sınav / not", "Schule"], ["die Familie / die Verwandten", "aile / akrabalar", "Familie"], ["der Freund / die Freundin", "arkadaş (erkek/kız)", "Alltag"], ["das Frühstück / das Abendessen", "kahvaltı / akşam yemeği", "Alltag"], ["die Reise / der Ausflug", "seyahat / gezi", "Reisen"], ["gesund / krank", "sağlıklı / hasta", "Gesundheit"], ["billig / teuer", "ucuz / pahalı", "Einkaufen"]]}, {"t": "h", "x": "Kollokationen (kelime kalıpları)"}, {"t": "note", "k": "ipucu", "title": "Sık kalıplar", "lines": ["eine Rede halten = konuşma yapmak", "eine Entscheidung treffen = karar vermek", "eine Frage stellen = soru sormak", "Spaß machen = eğlenceli olmak / eğlendirmek", "sich interessieren für + Akk = ile ilgilenmek", "Hausaufgaben machen = ödev yapmak"]}, {"t": "h", "x": "Falsche Freunde (yalancı eşdostlar)"}, {"t": "note", "k": "dikkat", "title": "Aldatan kelimeler", "lines": ["bekommen = almak / edinmek (İngilizce 'become=olmak' değil!)", "das Gift = zehir (İngilizce 'gift=hediye' değil!)", "der Chef = patron, amir (İngilizce 'chef=aşçı' değil!)", "sensibel = duyarlı, hassas (İngilizce 'sensible=makul' değil!)"]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Wortschatz-Lücke - çözümlü", "x": "Soru: Zum Abschluss des Sprachkurses planen wir einen gemeinsamen ---- nach Heidelberg. A) Ausflug B) Fahrt C) Reise D) Fest E) Essen. Çözüm: gemeinsamen ... nach Heidelberg (Heidelberg'e ortak bir ...) ifadesi kısa, birlikte yapılan bir günübirlik gezi anlatır. Bunun Almancası der Ausflug'tur. die Reise daha uzun/uzak bir seyahattir, das Fest kutlama, das Essen yemektir. Doğru cevap: A) Ausflug."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Der Lehrer bittet die Schüler, in der Bibliothek ---- zu sein.", "choices": {"A": "laut", "B": "leise", "C": "schnell", "D": "müde", "E": "fertig"}, "ans": "B", "why": "Kütüphanede sessiz olunur: leise. laut = gürültülü (zıttı).", "slug": "gri-mod-udspde-kelime-1"}, {"n": 2, "stem": "Meine Mutter ---- jeden Morgen frisches Brot beim Bäcker.", "choices": {"A": "kauft", "B": "verkauft", "C": "kocht", "D": "schreibt", "E": "trinkt"}, "ans": "A", "why": "Fırından (beim Bäcker) ekmek satın alınır: kaufen. verkaufen = satmak.", "slug": "gri-mod-udspde-kelime-2"}, {"n": 3, "stem": "Ich interessiere mich sehr ---- Geschichte und Kunst.", "choices": {"A": "an", "B": "über", "C": "für", "D": "auf", "E": "mit"}, "ans": "C", "why": "Kalıp: sich interessieren FÜR + Akkusativ = ile ilgilenmek.", "slug": "gri-mod-udspde-kelime-3"}, {"n": 4, "stem": "Nach dem langen Spaziergang waren alle Kinder sehr ----.", "choices": {"A": "wach", "B": "fleißig", "C": "höflich", "D": "müde", "E": "neugierig"}, "ans": "D", "why": "Uzun yürüyüşün ardından yorgun düşülür: müde. wach = uyanık (zıttı).", "slug": "gri-mod-udspde-kelime-4"}, {"n": 5, "stem": "Zum Geburtstag ---- ich oft schöne Geschenke von meinen Freunden.", "choices": {"A": "werde", "B": "bekomme", "C": "gebe", "D": "mache", "E": "hole"}, "ans": "B", "why": "bekommen = almak, edinmek. Falscher Freund: 'become=olmak' değildir. geben = vermek (zıt yön).", "slug": "gri-mod-udspde-kelime-5"}, {"n": 6, "stem": "Der Film war so ----, dass ich fast eingeschlafen bin.", "choices": {"A": "spannend", "B": "lustig", "C": "langweilig", "D": "gefährlich", "E": "teuer"}, "ans": "C", "why": "Uyuyakalacak kadar → sıkıcı: langweilig. spannend = heyecanlı (zıttı).", "slug": "gri-mod-udspde-kelime-6"}]}]}, {"id": "dilbilgisi", "group": "Bölümler", "name": "Grammatik - Dilbilgisi", "eyebrow": "Grammatik", "lead": "Artikel, Kasus, Präpositionen, fiil çekimi, sıfat ekleri, Konjunktionen", "blocks": [{"t": "p", "x": "Grammatik-Lücke sorularında boşluğa dilbilgisi kuralına uyan biçim gelir. En çok Artikel (der/die/das), Kasus (hâller), Präpositionen, fiil çekimi ve Konjunktionen ölçülür."}, {"t": "h", "x": "Artikel: der / die / das"}, {"t": "table", "head": ["Kural", "Örnek", "Artikel"], "rows": [["-chen / -lein ekli sözcükler", "das Mädchen, das Brötchen", "das"], ["-ung / -heit / -keit / -schaft", "die Zeitung, die Freiheit", "die"], ["-er (çoğu meslek/araç, eril)", "der Lehrer, der Computer", "der"], ["Bilinmesi gereken istisnalar", "das Haus, die Familie, das Kind, die Leute", "-"]]}, {"t": "h", "x": "Kasus: Nominativ / Akkusativ / Dativ"}, {"t": "table", "head": ["Cins", "Nominativ", "Akkusativ", "Dativ"], "rows": [["eril (der)", "der", "den", "dem"], ["dişil (die)", "die", "die", "der"], ["nötr (das)", "das", "das", "dem"], ["çoğul (die)", "die", "die", "den"]]}, {"t": "note", "k": "ipucu", "title": "Nerede hangi hâl", "lines": ["Nominativ: özne (Wer? Was?).", "Akkusativ: düz nesne (Wen? Was?) - sehen, haben, kaufen fiilleri.", "Dativ: dolaylı nesne (Wem?) - helfen, danken, gefallen fiilleri."]}, {"t": "h", "x": "Präpositionen"}, {"t": "table", "head": ["Hâl", "Präpositionen"], "rows": [["Akkusativ", "durch, für, gegen, ohne, um"], ["Dativ", "aus, bei, mit, nach, seit, von, zu"], ["Wechsel (yer=Dativ / yön=Akkusativ)", "an, auf, in, über, unter, vor, hinter, neben, zwischen"]]}, {"t": "h", "x": "Fiil çekimi ve Konjunktionen"}, {"t": "note", "k": "protokol", "title": "Sinyal kelimeler", "lines": ["weil, dass, wenn, obwohl, damit → yan cümle, çekimli fiil SONA gider.", "deshalb, deswegen, trotzdem → ana cümle, fiil ikinci sırada kalır.", "sein: ich bin, du bist, er/sie/es ist, wir/sie sind, ihr seid.", "3. çoğul (sie / plural) fiili -en ile biter: sie gehen, meine Freunde gehen."]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Konjunktion - çözümlü", "x": "Soru: Ich bleibe heute zu Hause, ---- ich krank bin. A) weil B) obwohl C) dass D) wenn E) damit. Çözüm: Boşluktan sonra 'ich krank bin' geliyor; çekimli fiil (bin) cümlenin SONUNDA. Bu bir yan cümle. Ana cümleyle neden ilişkisi var (evde kalıyorum çünkü hastayım). Neden bildiren ve fiili sona atan bağlaç weil'dir. obwohl = -e rağmen (anlam ters), damit = amaç, dass = ki. Doğru cevap: A) weil. (denn de neden bildirir ama onunla söz dizimi 'denn ich bin krank' olurdu.)"}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "---- Mädchen liest ein Buch im Garten.", "choices": {"A": "Der", "B": "Die", "C": "Das", "D": "Den", "E": "Dem"}, "ans": "C", "why": "-chen ekli sözcükler daima das alır: das Mädchen (biyolojik cinsiyetten bağımsız).", "slug": "gri-mod-udspde-gram-1"}, {"n": 2, "stem": "---- Freiheit ist für alle Menschen sehr wichtig.", "choices": {"A": "Der", "B": "Das", "C": "Die", "D": "Dem", "E": "Den"}, "ans": "C", "why": "-heit ile biten sözcükler dişildir: die Freiheit.", "slug": "gri-mod-udspde-gram-2"}, {"n": 3, "stem": "Ich sehe ---- Mann an der Bushaltestelle.", "choices": {"A": "der", "B": "den", "C": "dem", "D": "das", "E": "die"}, "ans": "B", "why": "sehen Akkusativ ister; eril der Mann → Akkusativ den Mann.", "slug": "gri-mod-udspde-gram-3"}, {"n": 4, "stem": "Jeden Tag fahre ich mit ---- Bus zur Schule.", "choices": {"A": "der", "B": "das", "C": "den", "D": "dem", "E": "die"}, "ans": "D", "why": "mit daima Dativ ister; eril der Bus → mit dem Bus.", "slug": "gri-mod-udspde-gram-4"}, {"n": 5, "stem": "Die Kinder laufen fröhlich ---- den Park.", "choices": {"A": "durch", "B": "mit", "C": "aus", "D": "bei", "E": "seit"}, "ans": "A", "why": "durch Akkusativ ister ve 'içinden geçmek' anlamı verir: durch den Park. mit/aus/bei/seit Dativ ister.", "slug": "gri-mod-udspde-gram-5"}, {"n": 6, "stem": "Meine Freunde ---- am Samstag zusammen ins Kino.", "choices": {"A": "gehe", "B": "gehst", "C": "geht", "D": "gehen", "E": "gingt"}, "ans": "D", "why": "Özne 'meine Freunde' (3. çoğul, sie) → gehen.", "slug": "gri-mod-udspde-gram-6"}]}]}, {"id": "cloze", "group": "Bölümler", "name": "Lückentext - Cloze", "eyebrow": "Lückentext", "lead": "Paragraf boşluklarını bağlama ve dilbilgisine göre doldurma", "blocks": [{"t": "p", "x": "Lückentext (Cloze) sorularında bir paragrafta birden çok boşluk vardır. Her boşluk için hem anlam (paragrafın konusu) hem de dilbilgisi (fiil çekimi, Kasus, bağlaç) uymalıdır. Önce metnin tamamını oku, sonra boşlukları teker teker çöz."}, {"t": "note", "k": "ipucu", "title": "Cloze stratejisi", "lines": ["Boşluktan önceki ve sonraki kelimeye bak: fiil mi, isim mi, bağlaç mı gerekiyor?", "Ayrılabilir fiilleri unutma: 'steht ... auf' (aufstehen).", "Bağlaç boşluğunda fiilin yerine bak: fiil sonda ise weil/dass gibi yan cümle bağlacı gelir."]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Tek boşluk - çözümlü", "x": "Metin: Peter lernt jeden Abend fleißig, ---- er in der Prüfung eine gute Note bekommen möchte. A) weil B) aber C) oder D) deshalb E) und. Çözüm: Boşluktan sonra 'er ... bekommen möchte' var, çekimli fiil (möchte) sonda → yan cümle. Anlam: çalışıyor, çünkü iyi not istiyor (neden). deshalb ana cümle bağlacıdır ve fiili sona atmaz. Doğru cevap: A) weil."}, {"t": "h", "x": "Metin ve boşluklar"}, {"t": "given", "title": "Lückentext", "x": "Anna ist fünfzehn Jahre alt und geht in die neunte Klasse. Jeden Morgen (1) sie um sieben Uhr auf und fährt mit dem Fahrrad zur Schule. Ihr Lieblingsfach ist Biologie, (2) sie später Ärztin werden möchte. In der großen Pause trifft sie ihre (3) auf dem Schulhof. Nach dem Unterricht macht sie zuerst ihre (4) und danach spielt sie Tennis. Am Wochenende hilft sie ihren Eltern gern (5) Haushalt."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "(1) - Jeden Morgen ---- sie um sieben Uhr auf ...", "choices": {"A": "geht", "B": "steht", "C": "macht", "D": "bleibt", "E": "kommt"}, "ans": "B", "why": "aufstehen ayrılabilir fiildir; 'steht ... auf' = kalkar. Cümle sonundaki 'auf' ipucudur.", "slug": "gri-mod-udspde-cloze-1"}, {"n": 2, "stem": "(2) - ..., ---- sie später Ärztin werden möchte.", "choices": {"A": "weil", "B": "aber", "C": "oder", "D": "denn", "E": "und"}, "ans": "A", "why": "Fiil (möchte) sonda → yan cümle; neden bildirir: weil. denn ile fiil sona gitmezdi.", "slug": "gri-mod-udspde-cloze-2"}, {"n": 3, "stem": "(3) - In der Pause trifft sie ihre ---- auf dem Schulhof.", "choices": {"A": "Freunde", "B": "Lehrer", "C": "Bücher", "D": "Eltern", "E": "Autos"}, "ans": "A", "why": "Teneffüste okul bahçesinde arkadaşlarla buluşulur: ihre Freunde. Bağlam ipucu.", "slug": "gri-mod-udspde-cloze-3"}, {"n": 4, "stem": "(4) - Nach dem Unterricht macht sie zuerst ihre ----.", "choices": {"A": "Ferien", "B": "Hausaufgaben", "C": "Reise", "D": "Musik", "E": "Wäsche"}, "ans": "B", "why": "Dersten sonra önce ödev yapılır: Hausaufgaben machen kalıbı.", "slug": "gri-mod-udspde-cloze-4"}, {"n": 5, "stem": "(5) - Am Wochenende hilft sie ihren Eltern gern ---- Haushalt.", "choices": {"A": "am", "B": "im", "C": "zum", "D": "beim", "E": "vom"}, "ans": "B", "why": "Kalıp: jemandem im Haushalt helfen (in dem → im) = ev işlerinde yardım etmek.", "slug": "gri-mod-udspde-cloze-5"}]}]}, {"id": "tamamlama", "group": "Bölümler", "name": "Satzergänzung - Cümle Tamamlama", "eyebrow": "Satzergänzung", "lead": "Ana cümleyi ya da yan cümleyi anlamca doğru tamamlama", "blocks": [{"t": "p", "x": "Satzergänzung sorularında cümlenin bir yarısı verilir, sen anlamca ve dilbilgisi olarak en uygun devamı seçersin. Bağlaç (wenn, obwohl, sodass, bevor) ve ilgi zamiri (der/die/das) burada belirleyicidir."}, {"t": "note", "k": "ipucu", "title": "Neye dikkat", "lines": ["Bağlaca bak: obwohl karşıtlık, weil neden, sodass sonuç, bevor öncelik ister.", "İlgi cümlesinde zamirin cinsi ve hâli, öncülüne (isim) ve cümledeki görevine uyar.", "Zaman uyumunu kontrol et: 'gestern' geçmiş, 'morgen' gelecek ister."]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "İlgi cümlesi - çözümlü", "x": "Soru: Ich kenne eine Frau, ---- in Berlin als Ärztin arbeitet. A) der B) die C) den D) dem E) das. Çözüm: Öncül 'eine Frau' (dişil). İlgi cümlesinde bu zamir öznedir (arbeitet fiilinin öznesi) → Nominativ. Dişil Nominativ ilgi zamiri die'dir. Doğru cevap: B) die."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Wenn das Wetter morgen schön ist, ----.", "choices": {"A": "gehen wir an den Strand", "B": "blieben wir zu Hause", "C": "hat es stark geregnet", "D": "war ich gestern krank", "E": "gehen wir gestern schwimmen"}, "ans": "A", "why": "'wenn ... schön ist' gelecek koşul; sonuç şimdiki/gelecek ve olumlu olmalı: plaja gideriz. Diğerlerinde zaman ya da anlam uymuyor.", "slug": "gri-mod-udspde-satz-1"}, {"n": 2, "stem": "Das ist der Junge, ---- gestern den Wettbewerb gewonnen hat.", "choices": {"A": "der", "B": "den", "C": "dem", "D": "das", "E": "die"}, "ans": "A", "why": "Öncül 'der Junge' (eril); zamir 'gewonnen hat' fiilinin öznesi → Nominativ: der.", "slug": "gri-mod-udspde-satz-2"}, {"n": 3, "stem": "Ich konnte gestern Nacht nicht schlafen, obwohl ----.", "choices": {"A": "ich sehr müde war", "B": "ich zu viel Kaffee getrunken hatte", "C": "das Zimmer sehr laut war", "D": "die Nachbarn Musik hörten", "E": "es draußen sehr kalt war"}, "ans": "A", "why": "obwohl karşıtlık ister: yorgun olmasına rağmen uyuyamadı. Diğerleri uykusuzluğun NEDENİdir; onlar için weil gerekir.", "slug": "gri-mod-udspde-satz-3"}, {"n": 4, "stem": "Bevor ich abends ins Bett gehe, ----.", "choices": {"A": "putze ich mir die Zähne", "B": "habe ich schon gefrühstückt", "C": "stehe ich früh auf", "D": "esse ich zu Mittag", "E": "fahre ich zur Arbeit"}, "ans": "A", "why": "'yatmadan önce' mantıklı eylem: diş fırçalamak. Diğerleri sabah/gündüz eylemleri, anlamca uymaz.", "slug": "gri-mod-udspde-satz-4"}, {"n": 5, "stem": "Der Zug hatte große Verspätung, sodass ----.", "choices": {"A": "wir den Anschluss verpassten", "B": "wir viel zu früh ankamen", "C": "der Zug ganz pünktlich war", "D": "wir gar nicht warten mussten", "E": "alle sehr zufrieden waren"}, "ans": "A", "why": "sodass sonuç bildirir: tren gecikti, sonuç olarak aktarmayı kaçırdık. Diğer şıklar gecikmenin sonucu olamaz.", "slug": "gri-mod-udspde-satz-5"}]}]}, {"id": "diyalog", "group": "Bölümler", "name": "Dialog - Diyalog", "eyebrow": "Dialog", "lead": "Diyalogda eksik repliği bağlama ve kalıba göre tamamlama", "blocks": [{"t": "p", "x": "Dialogergänzung sorularında bir konuşmada eksik replik vardır. Doğru seçenek hem soruya/duruma uyar hem de nezaket düzeyine (Sie/du) denk düşer. Soru-cevap eşleşmesine ve selam-teşekkür kalıplarına dikkat et."}, {"t": "note", "k": "ipucu", "title": "Kalıplar", "lines": ["Yardım teklifi: 'Kann ich Ihnen helfen?' → 'Ja, bitte. Ich suche ...'", "Teşekküre yanıt: 'Vielen Dank!' → 'Gern geschehen!'", "Yol sorma: 'Wie komme ich zu ...?' → tarif verilir.", "Kibar ret: 'Möchtest du noch ...?' → 'Nein, danke, ich bin satt.'"]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Diyalog - çözümlü", "x": "Kellner: Guten Abend! Was möchten Sie bestellen? Gast: ---- Seçenekler: A) Ich hätte gern eine Suppe und einen Salat. B) Nein, ich wohne hier nicht. C) Der Tisch ist zu klein. D) Es ist schon zehn Uhr. E) Ich bin Lehrer von Beruf. Çözüm: Garson ne sipariş edileceğini soruyor. Uygun yanıt bir sipariştir: 'Ich hätte gern eine Suppe und einen Salat.' Diğerleri soruyla ilgisiz. Doğru cevap: A."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Verkäuferin: Guten Tag! Kann ich Ihnen helfen? Kundin: ----", "choices": {"A": "Ja, bitte. Ich suche eine warme Jacke.", "B": "Nein, ich heiße Lisa.", "C": "Es ist schon drei Uhr.", "D": "Das Wetter ist heute schön.", "E": "Ich wohne in Ankara."}, "ans": "A", "why": "Yardım teklifine uygun yanıt: ne aradığını söylemek (bir ceket arıyorum).", "slug": "gri-mod-udspde-dial-1"}, {"n": 2, "stem": "Tim: Wie war dein Wochenende? Lena: ----", "choices": {"A": "Es war toll, ich war am See.", "B": "Ja, sehr gern.", "C": "Um acht Uhr morgens.", "D": "Nein, danke schön.", "E": "Das macht zwei Euro."}, "ans": "A", "why": "'Nasıldı?' sorusuna değerlendirme yanıtı verilir: harikaydı, göldeydim.", "slug": "gri-mod-udspde-dial-2"}, {"n": 3, "stem": "Tourist: Entschuldigung, wie komme ich zum Bahnhof? Passant: ----", "choices": {"A": "Gehen Sie geradeaus und dann die zweite Straße links.", "B": "Ich mag Züge sehr.", "C": "Der Bahnhof ist ziemlich alt.", "D": "Ja, ich fahre auch mit dem Zug.", "E": "Danke schön, sehr nett."}, "ans": "A", "why": "Yol sorusuna tarif verilir: düz gidin, sonra ikinci sokaktan sola.", "slug": "gri-mod-udspde-dial-3"}, {"n": 4, "stem": "Oma: Möchtest du noch ein Stück Kuchen? Enkel: ----, ich bin schon satt.", "choices": {"A": "Nein, danke", "B": "Ja, bitte", "C": "Natürlich, gern", "D": "Sehr gut", "E": "Bis später"}, "ans": "A", "why": "'schon satt' (doydum) devamı → kibar ret: Nein, danke.", "slug": "gri-mod-udspde-dial-4"}, {"n": 5, "stem": "Anna: Vielen Dank für deine Hilfe! Ben: ----", "choices": {"A": "Gern geschehen!", "B": "Guten Appetit!", "C": "Herzlichen Glückwunsch!", "D": "Gute Reise!", "E": "Viel Glück!"}, "ans": "A", "why": "Teşekküre standart yanıt: Gern geschehen! = Rica ederim. Diğerleri farklı durumların kalıbı.", "slug": "gri-mod-udspde-dial-5"}]}]}, {"id": "okuma", "group": "Bölümler", "name": "Leseverstehen - Okuma", "eyebrow": "Leseverstehen", "lead": "Kısa metin: ana fikir, detay ve çıkarım soruları", "blocks": [{"t": "p", "x": "Leseverstehen sorularında kısa bir metin okur, ardından ana fikir, detay ve çıkarım sorularını yanıtlarsın. Cevaplar metinde bulunur; kendi bilgini değil, metnin söylediğini esas al."}, {"t": "note", "k": "ipucu", "title": "Okuma stratejisi", "lines": ["Önce soruları oku, sonra metinde ilgili yeri ara.", "Ana fikir sorusunda tek bir ayrıntıya değil, metnin bütününe bak.", "Detay sorusunda cevabı metinden birebir doğrula; şıklardaki küçük değişikliklere dikkat et."]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Detay sorusu - çözümlü", "x": "Örnek soru tipi: 'Wie kommt Marie zur Schule?' Metinde 'deshalb fährt Marie jeden Tag mit dem Bus' cümlesi var. Soru ulaşım aracını soruyor; metin açıkça 'mit dem Bus' (otobüsle) diyor. Bu yüzden doğru cevap 'Mit dem Bus' olur. Detay sorularında cevabı metindeki cümleyle birebir eşleştir."}, {"t": "h", "x": "Metin"}, {"t": "given", "title": "Lesetext", "x": "Marie wohnt in einem kleinen Dorf in den Bergen. Jeden Sommer kommen viele Touristen in ihr Dorf, denn die Natur dort ist wunderschön. Marie und ihre Familie haben einen Bauernhof mit Kühen, Hühnern und Ziegen. Am frühen Morgen hilft Marie ihrer Mutter im Stall, bevor sie zur Schule geht. Die Schule ist im Nachbardorf, deshalb fährt Marie jeden Tag mit dem Bus. Nach dem Unterricht macht sie ihre Hausaufgaben und danach spielt sie mit ihrem Hund im Garten. Marie mag ihr Leben auf dem Land sehr, weil es ruhig und gesund ist. Später möchte sie Tierärztin werden, denn sie liebt Tiere über alles."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Worum geht es in dem Text hauptsächlich?", "choices": {"A": "Um Maries Leben auf dem Land", "B": "Um einen Urlaub am Meer", "C": "Um Maries Schule in der Großstadt", "D": "Um ein wichtiges Fußballspiel", "E": "Um das kalte Wetter im Winter"}, "ans": "A", "why": "Metin bütünüyle Marie'nin köydeki/kırsaldaki yaşamını anlatır: ana fikir A.", "slug": "gri-mod-udspde-lese-1"}, {"n": 2, "stem": "Was macht Marie am frühen Morgen?", "choices": {"A": "Sie hilft ihrer Mutter im Stall.", "B": "Sie macht ihre Hausaufgaben.", "C": "Sie spielt mit dem Hund.", "D": "Sie fährt mit dem Fahrrad.", "E": "Sie kauft im Nachbardorf ein."}, "ans": "A", "why": "Metin: 'Am frühen Morgen hilft Marie ihrer Mutter im Stall.' Detay birebir.", "slug": "gri-mod-udspde-lese-2"}, {"n": 3, "stem": "Wie kommt Marie zur Schule?", "choices": {"A": "Mit dem Bus", "B": "Mit dem Fahrrad", "C": "Zu Fuß", "D": "Mit dem Auto", "E": "Mit dem Zug"}, "ans": "A", "why": "Metin: 'deshalb fährt Marie jeden Tag mit dem Bus.'", "slug": "gri-mod-udspde-lese-3"}, {"n": 4, "stem": "Warum kommen im Sommer viele Touristen in das Dorf?", "choices": {"A": "Weil die Natur dort wunderschön ist", "B": "Weil es dort ein großes Kino gibt", "C": "Weil die Schule sehr berühmt ist", "D": "Weil alles dort sehr billig ist", "E": "Weil dort ein großer Markt ist"}, "ans": "A", "why": "Metin: 'denn die Natur dort ist wunderschön.' Neden açıkça verilmiş.", "slug": "gri-mod-udspde-lese-4"}, {"n": 5, "stem": "Was möchte Marie später werden?", "choices": {"A": "Tierärztin", "B": "Lehrerin", "C": "Busfahrerin", "D": "Bäuerin", "E": "Ärztin für Menschen"}, "ans": "A", "why": "Metin: 'Später möchte sie Tierärztin werden.' (hayvan doktoru). E, insan doktoru olduğu için yanlış.", "slug": "gri-mod-udspde-lese-5"}]}]}, {"id": "restatement", "group": "Bölümler", "name": "Restatement ve Anlam Bütünlüğü", "eyebrow": "Restatement", "lead": "Anlamca en yakın cümle ve konuya uymayan cümle", "blocks": [{"t": "p", "x": "Bu bölümde iki soru tipi vardır. Restatement'ta verilen cümleye anlamca EN YAKIN cümleyi seçersin. Anlam bütünlüğü sorusunda ise bir paragrafta konuya uymayan, akışı bozan cümleyi bulursun."}, {"t": "note", "k": "ipucu", "title": "Nasıl çözülür", "lines": ["Restatement: verilen cümlenin anlamını koru; ekleme, çıkarma ya da anlamı tersine çeviren şıkları ele.", "obwohl / trotzdem karşıtlığı, weil / deshalb neden-sonucu paraphrase'te de korunmalı.", "Anlam bütünlüğü: paragrafın ortak konusunu belirle; farklı bir konuya atlayan tek cümle cevaptır."]}, {"t": "h", "x": "Çözümlü örnek"}, {"t": "given", "title": "Restatement - çözümlü", "x": "Cümle: Obwohl es stark regnete, gingen wir spazieren. En yakın anlam: 'Wir gingen spazieren, obwohl das Wetter schlecht war.' Çözüm: Orijinal cümle bir karşıtlık kurar: yağmura (kötü havaya) rağmen yürüdük. Doğru paraphrase aynı karşıtlığı korumalıdır. 'Weil es regnete, blieben wir zu Hause' anlamı tersine çevirir (yürümedik), bu yüzden yanlıştır. Anlamı bozmayan, aynı karşıtlığı veren şık doğrudur."}, {"t": "h", "x": "Kendini dene"}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Anlamca en yakın: 'Obwohl es stark regnete, gingen wir spazieren.'", "choices": {"A": "Wir gingen spazieren, obwohl das Wetter schlecht war.", "B": "Weil es regnete, blieben wir zu Hause.", "C": "Es regnete nicht, deshalb gingen wir spazieren.", "D": "Wir gingen nicht spazieren, weil es regnete.", "E": "Nach dem Spaziergang regnete es stark."}, "ans": "A", "why": "Aynı karşıtlık korunur: kötü havaya rağmen yürüdük. Diğer şıklar anlamı değiştirir ya da tersine çevirir.", "slug": "gri-mod-udspde-rest-1"}, {"n": 2, "stem": "Anlamca en yakın: 'Mein Bruder ist älter als ich.'", "choices": {"A": "Ich bin jünger als mein Bruder.", "B": "Mein Bruder ist so alt wie ich.", "C": "Ich bin älter als mein Bruder.", "D": "Mein Bruder ist jünger als ich.", "E": "Wir sind genau gleich alt."}, "ans": "A", "why": "'Ağabeyim benden büyük' = 'ben ağabeyimden küçüğüm'. Aynı ilişki.", "slug": "gri-mod-udspde-rest-2"}, {"n": 3, "stem": "Anlamca en yakın: 'Wenn du mehr lernst, bekommst du bessere Noten.'", "choices": {"A": "Bessere Noten bekommst du, indem du mehr lernst.", "B": "Wenn du weniger lernst, bekommst du bessere Noten.", "C": "Du hast schon gute Noten, weil du viel lernst.", "D": "Ohne zu lernen bekommst du gute Noten.", "E": "Bessere Noten sind gar nicht wichtig."}, "ans": "A", "why": "Aynı koşul-sonuç: daha çok çalışarak daha iyi not alırsın (indem = -erek/-arak).", "slug": "gri-mod-udspde-rest-3"}, {"n": 4, "stem": "Welcher Satz passt NICHT in den Textzusammenhang (Thema: gesundes Frühstück)?", "choices": {"A": "Ein gutes Frühstück ist wichtig für einen guten Start in den Tag.", "B": "Viele Ärzte empfehlen Obst, Vollkornbrot und Milch am Morgen.", "C": "Ein gesundes Frühstück gibt Kindern Energie für die Schule.", "D": "Wer morgens nichts isst, kann sich schlechter konzentrieren.", "E": "Am Wochenende spielt mein Bruder gern Fußball im Park."}, "ans": "E", "why": "Paragrafın konusu sağlıklı kahvaltı. E cümlesi hafta sonu futbolundan söz eder, konuya uymaz.", "slug": "gri-mod-udspde-rest-4"}, {"n": 5, "stem": "Welcher Satz passt NICHT in den Textzusammenhang (Thema: das Internet)?", "choices": {"A": "Das Internet hat unsere Kommunikation stark verändert.", "B": "Heute können wir mit Menschen weltweit schnell in Kontakt treten.", "C": "Über E-Mails und Nachrichten bleiben Freunde in Verbindung.", "D": "Der Winter in den Bergen ist oft sehr kalt und schneereich.", "E": "Auch für die Schule ist das Internet zu einer wichtigen Hilfe geworden."}, "ans": "D", "why": "Konu internet ve iletişim. D cümlesi dağlardaki kıştan söz eder, akışı bozar.", "slug": "gri-mod-udspde-rest-5"}]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Uppercase edilen etiketlerde İngilizce/Almanca terimleri lang="en" ile sar; noktalı İ oluşmasın. Türkçe metne dokunma.
const escDe=s=>esc(s).replace(/\b(Wortschatz|Grammatik|Lückentext|Lücke|Satzergänzung|Dialogergänzung|Dialoge|Dialog|Leseverstehen|Restatement|Kollokationen|Kollokation|Artikel|Präpositionen|Präposition|Konjunktionen|Konjunktion|Nominativ|Akkusativ|Dativ|Genitiv|Adjektivendungen|Adjektiv|Verbkonjugation|Kasus|collocation|restatement)\b/g,'<span lang="de">$1</span>');
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id,done:{}};
function _griSlugsOf(node,out){if(!node||typeof node!=='object')return;if(Array.isArray(node)){for(var i=0;i<node.length;i++)_griSlugsOf(node[i],out);return;}for(var k in node){if(!Object.prototype.hasOwnProperty.call(node,k))continue;var v=node[k];if(k==='slug'&&typeof v==='string'&&v)out.push(v);else if(v&&typeof v==='object')_griSlugsOf(v,out);}}
async function loadProgress(){try{if(!window.GRI_SB||!window.GRI_UID)return;var map={},pre=null,n=0;D.lessons.forEach(function(l){var s=[];_griSlugsOf(l.blocks||[],s);s.forEach(function(sl){map[sl]=l.id;n++;pre=(pre===null)?sl:(function(a,b){var m=Math.min(a.length,b.length),i=0;while(i<m&&a[i]===b[i])i++;return a.slice(0,i);})(pre,sl);});});if(!n)return;var q=window.GRI_SB.from('user_answers').select('question_slug').eq('user_id',window.GRI_UID);if(pre&&pre.length>=6)q=q.like('question_slug',pre+'%');var r=await q;if(r&&r.data&&r.data.length){var hit=false;r.data.forEach(function(row){var lid=map[row.question_slug];if(lid){S.done[lid]=true;hit=true;}});if(hit)renderRail();}}catch(e){}}
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''} ${S.done[l.id]?'done':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;

  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';

    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}

function renderEval(fb,data,tt){

  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
