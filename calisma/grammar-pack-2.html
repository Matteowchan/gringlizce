ause?", "underline": "The work, which had passed through several private collections before its disappearance, was authenticated", "choices": [{"label": "A", "text": "The work, which had passed through several private collections before its disappearance, was authenticated"}, {"label": "B", "text": "The work that had passed through several private collections before its disappearance was authenticated"}, {"label": "C", "text": "The work, that had passed through several private collections before its disappearance, was authenticated"}, {"label": "D", "text": "The work which had passed through several private collections, before its disappearance, was authenticated"}], "answer": "A", "explanation": "Since 'the work' refers to a specific, already-identified painting, the clause adds supplementary detail — making it non-restrictive, requiring 'which' and commas. B uses 'that' without commas, making the clause restrictive, which implies there are multiple works and this clause identifies which one — incorrect given the context. C incorrectly uses 'that' in a non-restrictive clause with commas. D misplaces the comma, creating confusion."}, {"n": 15, "type": "Relative Clauses & Subordination", "passage": "The laboratory developed a filtration method by which trace contaminants could be detected at concentrations as low as one part per billion. Previous techniques had been far less sensitive, limiting their usefulness in environmental monitoring. The new method was immediately adopted by regulatory agencies.", "question": "Which choice correctly uses a prepositional relative phrase to describe how the filtration method functions?", "underline": "a filtration method by which trace contaminants could be detected", "choices": [{"label": "A", "text": "a filtration method by which trace contaminants could be detected"}, {"label": "B", "text": "a filtration method by that trace contaminants could be detected"}, {"label": "C", "text": "a filtration method that trace contaminants could be detected by it"}, {"label": "D", "text": "a filtration method where trace contaminants could be detected"}], "answer": "A", "explanation": "'By which' correctly fronts the preposition in a formal relative clause. B incorrectly substitutes 'that' after a preposition — 'by that' is not standard English. C adds an unnecessary pronoun ('it') after the relative construction. D uses 'where,' which implies a location rather than a mechanism."}, {"n": 16, "type": "Relative Clauses & Subordination", "passage": "The analyst published a report in which she argued that supply chain disruptions were primarily responsible for the price increases. Industry groups disputed her conclusions, contending that regulatory costs played an equal if not greater role. The debate continued for months without resolution.", "question": "Which choice uses the correct prepositional relative construction to describe the contents of the report?", "underline": "a report in which she argued that supply chain disruptions were primarily responsible", "choices": [{"label": "A", "text": "a report in which she argued that supply chain disruptions were primarily responsible"}, {"label": "B", "text": "a report where she argued that supply chain disruptions were primarily responsible"}, {"label": "C", "text": "a report that she argued supply chain disruptions were primarily responsible in"}, {"label": "D", "text": "a report she argued supply chain disruptions were primarily responsible for"}], "answer": "A", "explanation": "'In which' correctly introduces the relative clause in formal prose, with the preposition fronted. B uses 'where' — a report is not a location in the literal sense, making this imprecise. C strands the preposition informally and also changes 'in' to an incorrect preposition. D omits the relative pronoun entirely and substitutes an incorrect preposition ('for' instead of 'in')."}, {"n": 17, "type": "Relative Clauses & Subordination", "passage": "The software platform provided a framework within which developers could build customized applications without modifying the underlying code. This architecture proved especially valuable for organizations requiring rapid deployment. Several competing platforms later adopted similar modular structures.", "question": "Which choice correctly uses 'within which' as a formal relative construction?", "underline": "a framework within which developers could build customized applications", "choices": [{"label": "A", "text": "a framework within which developers could build customized applications"}, {"label": "B", "text": "a framework that developers could build customized applications within"}, {"label": "C", "text": "a framework developers could build customized applications within it"}, {"label": "D", "text": "a framework where developers could build customized applications"}], "answer": "A", "explanation": "'Within which' fronts the preposition formally. B strands the preposition — acceptable informally but substandard in formal prose when revision is possible. C adds a double reference pronoun ('it'). D uses 'where,' which is acceptable colloquially for abstract containers but less precise than 'within which' in formal technical prose."}, {"n": 18, "type": "Relative Clauses & Subordination", "passage": "The policy created a framework under which smaller businesses could access government contracts previously reserved for larger firms. Advocates argued that the policy would stimulate competition and promote economic diversity. Critics, however, warned that implementation costs could outweigh the projected benefits.", "question": "Which choice best preserves formal register in the relative construction?", "underline": "a framework under which smaller businesses could access government contracts", "choices": [{"label": "A", "text": "a framework under which smaller businesses could access government contracts"}, {"label": "B", "text": "a framework smaller businesses could access government contracts under"}, {"label": "C", "text": "a framework that smaller businesses could access government contracts under it"}, {"label": "D", "text": "a framework in which smaller businesses could access government contracts"}], "answer": "A", "explanation": "'Under which' is precise — the policy creates conditions 'under' which access becomes possible. B strands the preposition informally. C strands the preposition and adds a double reference pronoun ('it'). D substitutes 'in which,' which is grammatically correct but changes the idiomatic meaning slightly — 'under which' suggests governed conditions; 'in which' suggests interior context."}, {"n": 19, "type": "Relative Clauses & Subordination", "passage": "The experiment yielded data from which several unexpected conclusions could be drawn. The lead researcher acknowledged that the results had challenged her initial hypotheses significantly. A follow-up study was subsequently designed to test whether the anomalous patterns would replicate.", "question": "Which choice correctly uses a prepositional relative to refer to the data?", "underline": "data from which several unexpected conclusions could be drawn", "choices": [{"label": "A", "text": "data from which several unexpected conclusions could be drawn"}, {"label": "B", "text": "data from that several unexpected conclusions could be drawn"}, {"label": "C", "text": "data that several unexpected conclusions could be drawn from it"}, {"label": "D", "text": "data several unexpected conclusions could be drawn from"}], "answer": "A", "explanation": "'From which' correctly fronts the preposition in formal prose. B incorrectly uses 'that' after a preposition. C adds a double reference pronoun ('it'). D omits the relative pronoun, making the sentence an acceptable but informal contact clause — not the standard for formal academic prose."}, {"n": 20, "type": "Relative Clauses & Subordination", "passage": "The coalition signed a declaration to which all member nations formally committed. The document outlined shared obligations regarding environmental protection and trade regulation. Signatories agreed to submit annual compliance reports to an independent monitoring body.", "question": "Which choice correctly uses 'to which' to show commitment in a formal clause?", "underline": "a declaration to which all member nations formally committed", "choices": [{"label": "A", "text": "a declaration to which all member nations formally committed"}, {"label": "B", "text": "a declaration which all member nations formally committed to"}, {"label": "C", "text": "a declaration that all member nations formally committed to it"}, {"label": "D", "text": "a declaration all member nations formally committed to"}], "answer": "A", "explanation": "'To which' fronts the preposition correctly in formal prose. B strands the preposition — acceptable in informal English but not preferred in formal writing when revision is available. C adds a double reference pronoun ('it'). D omits the relative pronoun entirely, forming a contact clause — grammatically passable informally but not appropriate for formal prose."}, {"n": 21, "type": "Relative Clauses & Subordination", "passage": "The architect designed a building the structural integrity of which had been validated through extensive seismic modeling. The project broke ground in spring and was expected to be completed within thirty months. Its distinctive curved facade had already attracted significant media attention before construction began.", "question": "Which choice uses the correct relative construction for a formal possessive reference to a thing?", "underline": "a building the structural integrity of which had been validated", "choices": [{"label": "A", "text": "a building the structural integrity of which had been validated"}, {"label": "B", "text": "a building whose structural integrity had been validated"}, {"label": "C", "text": "a building that its structural integrity had been validated"}, {"label": "D", "text": "a building which its structural integrity had been validated"}], "answer": "A", "explanation": "Both A and B are grammatically correct. A uses the formal 'the [noun] of which' construction, which is preferred in highly formal or academic prose. B uses 'whose,' which is widely accepted for inanimate objects but slightly less formal. C and D insert redundant possessives ('its') after the relative pronoun, creating double reference errors. A is preferred given the formal register of the passage."}, {"n": 22, "type": "Relative Clauses & Subordination", "passage": "The committee reviewed a proposal the feasibility of which had not been independently assessed. Members expressed concern that the cost projections relied heavily on optimistic assumptions. A second review was commissioned before any funding decision would be made.", "question": "Which choice correctly uses a formal 'of which' construction for an inanimate noun?", "underline": "a proposal the feasibility of which had not been independently assessed", "choices": [{"label": "A", "text": "a proposal the feasibility of which had not been independently assessed"}, {"label": "B", "text": "a proposal whose feasibility had not been independently assessed"}, {"label": "C", "text": "a proposal that its feasibility had not been independently assessed"}, {"label": "D", "text": "a proposal the feasibility that had not been independently assessed"}], "answer": "A", "explanation": "'The feasibility of which' is the formal possessive relative construction used for inanimate nouns in academic prose. B ('whose') is grammatically acceptable but less formal. C inserts a redundant possessive ('its'). D uses 'that' incorrectly — 'the feasibility that had not been assessed' makes 'feasibility' the antecedent of the relative clause, which changes the logical relationship."}, {"n": 23, "type": "Relative Clauses & Subordination", "passage": "The documentary explored the mechanisms through which misinformation spreads across social media platforms. Researchers interviewed for the film emphasized the role of algorithmic amplification. They argued that platform design choices, not individual user behavior, were the primary drivers of viral falsehoods.", "question": "Which choice correctly uses a relative clause to identify the mechanisms described?", "underline": "the mechanisms through which misinformation spreads across social media platforms", "choices": [{"label": "A", "text": "the mechanisms through which misinformation spreads across social media platforms"}, {"label": "B", "text": "the mechanisms that misinformation spreads across social media platforms through them"}, {"label": "C", "text": "the mechanisms misinformation spreads across social media platforms through"}, {"label": "D", "text": "the mechanisms where misinformation spreads across social media platforms"}], "answer": "A", "explanation": "'Through which' fronts the preposition correctly in formal prose. B adds a double reference pronoun ('them'). C omits the relative pronoun, forming an informal contact clause. D uses 'where,' which implies a location — mechanisms are processes, not places."}, {"n": 24, "type": "Relative Clauses & Subordination", "passage": "The judge delivered a verdict in accordance with which all seized assets would be returned to their original owners. The ruling was seen as a landmark decision in property rights litigation. Several similar cases pending in lower courts were expected to be influenced by its reasoning.", "question": "Which choice correctly maintains the formal prepositional relative construction?", "underline": "a verdict in accordance with which all seized assets would be returned", "choices": [{"label": "A", "text": "a verdict in accordance with which all seized assets would be returned"}, {"label": "B", "text": "a verdict that all seized assets would be returned in accordance with"}, {"label": "C", "text": "a verdict which all seized assets would be returned in accordance with it"}, {"label": "D", "text": "a verdict all seized assets would be returned in accordance with"}], "answer": "A", "explanation": "'In accordance with which' correctly fronts the entire prepositional phrase before the relative pronoun, as required in formal prose with compound prepositions. B strands the entire phrase at the end, informal but substandard here. C adds a double reference pronoun ('it'). D omits the relative pronoun entirely."}, {"n": 25, "type": "Relative Clauses & Subordination", "passage": "The grant supported a study for which the researchers had spent two years collecting preliminary data. The funding allowed them to scale their sample size significantly. Results from the expanded study were expected to produce findings with far greater statistical power than the pilot had achieved.", "question": "Which choice correctly uses a prepositional relative to indicate what the grant supported?", "underline": "a study for which the researchers had spent two years collecting preliminary data", "choices": [{"label": "A", "text": "a study for which the researchers had spent two years collecting preliminary data"}, {"label": "B", "text": "a study that the researchers had spent two years collecting preliminary data for"}, {"label": "C", "text": "a study the researchers had spent two years collecting preliminary data for it"}, {"label": "D", "text": "a study which the researchers had spent two years collecting preliminary data for it"}], "answer": "A", "explanation": "'For which' fronts the preposition correctly in formal prose. B strands the preposition — acceptable informally but not preferred in formal writing. C omits the relative pronoun and adds a double reference pronoun ('it'). D also adds a double reference pronoun ('it') alongside a stranded preposition."}]}, {"n": 9, "topic": "Subordinate Clauses", "diff": "Sentence Combining & Subordination", "qs": [{"n": 1, "type": "Sentence Combining & Subordination", "passage": "The researchers completed the initial phase of the study. They published their findings in a peer-reviewed journal. The publication attracted significant attention from the scientific community.", "question": "Which choice most effectively combines the first two sentences while preserving logical priority?", "underline": "N/A", "choices": [{"label": "A", "text": "After completing the initial phase of the study, the researchers published their findings in a peer-reviewed journal."}, {"label": "B", "text": "The researchers completed the initial phase of the study, and they published their findings in a peer-reviewed journal."}, {"label": "C", "text": "The researchers, who published their findings in a peer-reviewed journal, completed the initial phase of the study."}, {"label": "D", "text": "Having published their findings in a peer-reviewed journal, the researchers completed the initial phase of the study."}], "answer": "A", "explanation": "A uses a participial phrase to subordinate the first action and makes 'publishing' the main clause emphasis — logical because the publication is what attracted attention. B uses simple coordination (and), which treats both actions as equal — accurate but less precise. C inverts the sequence illogically (they cannot publish before completing). D reverses the chronological order, implying publication preceded completion."}, {"n": 2, "type": "Sentence Combining & Subordination", "passage": "The bridge had stood for over a century. Engineers determined it was structurally unsafe. The city ordered an immediate closure.", "question": "Which choice most effectively combines the first two sentences to show cause and effect?", "underline": "N/A", "choices": [{"label": "A", "text": "Although the bridge had stood for over a century, engineers determined it was structurally unsafe."}, {"label": "B", "text": "The bridge had stood for over a century, so engineers determined it was structurally unsafe."}, {"label": "C", "text": "The bridge had stood for over a century, and engineers determined it was structurally unsafe."}, {"label": "D", "text": "Because the bridge had stood for over a century, engineers determined it was structurally unsafe."}], "answer": "A", "explanation": "A correctly uses 'although' to show concession — the bridge's age is surprising given its unsafe condition. This is logically accurate: longevity does not guarantee safety. B uses 'so,' implying the age caused the determination of unsafety — a logical error. C uses neutral coordination. D uses 'because,' implying age directly caused the engineers' determination — also logically incorrect."}, {"n": 3, "type": "Sentence Combining & Subordination", "passage": "The company launched its new product line in March. Sales figures exceeded projections by forty percent. Investors responded with renewed confidence.", "question": "Which choice most effectively combines the first two sentences using subordination?", "underline": "N/A", "choices": [{"label": "A", "text": "When the company launched its new product line in March, sales figures exceeded projections by forty percent."}, {"label": "B", "text": "The company launched its new product line in March, but sales figures exceeded projections by forty percent."}, {"label": "C", "text": "Because sales figures exceeded projections by forty percent, the company launched its new product line in March."}, {"label": "D", "text": "The company launched its new product line in March, so that sales figures exceeded projections by forty percent."}], "answer": "A", "explanation": "A uses 'when' to establish a temporal relationship between the launch and the sales results — logical and precise. B uses 'but,' implying contrast, which misrepresents the relationship (exceeding projections is not a contrast to launching). C reverses the cause-and-effect relationship. D uses 'so that,' which implies the launch was deliberately designed to produce those exact figures — an overreach."}, {"n": 4, "type": "Sentence Combining & Subordination", "passage": "The novel was rejected by twelve publishers. It went on to sell more than ten million copies. It is now considered a defining work of its generation.", "question": "Which choice most effectively combines the first two sentences to express contrast?", "underline": "N/A", "choices": [{"label": "A", "text": "Although the novel was rejected by twelve publishers, it went on to sell more than ten million copies."}, {"label": "B", "text": "Because the novel was rejected by twelve publishers, it went on to sell more than ten million copies."}, {"label": "C", "text": "The novel was rejected by twelve publishers, so it went on to sell more than ten million copies."}, {"label": "D", "text": "When the novel was rejected by twelve publishers, it went on to sell more than ten million copies."}], "answer": "A", "explanation": "'Although' correctly signals concession — the rejections make the eventual success surprising. B uses 'because,' implying rejections caused success. C uses 'so,' implying rejections led logically to sales — both are illogical. D uses 'when,' treating rejection and success as simultaneous or sequentially neutral events, which misrepresents the irony of the situation."}, {"n": 5, "type": "Sentence Combining & Subordination", "passage": "The scientist had dedicated thirty years to the project. She was forced to retire before the final results were published. A junior colleague completed the analysis in her absence.", "question": "Which choice most effectively combines the first two sentences to emphasize the contrast between dedication and outcome?", "underline": "N/A", "choices": [{"label": "A", "text": "Despite having dedicated thirty years to the project, the scientist was forced to retire before the final results were published."}, {"label": "B", "text": "Because the scientist had dedicated thirty years to the project, she was forced to retire before the final results were published."}, {"label": "C", "text": "The scientist had dedicated thirty years to the project, and she was forced to retire before the final results were published."}, {"label": "D", "text": "The scientist had dedicated thirty years to the project, so she was forced to retire before the final results were published."}], "answer": "A", "explanation": "'Despite' signals concession — long dedication did not prevent early retirement. B implies dedication caused retirement — logically incorrect. C uses neutral coordination, losing the irony. D uses 'so,' implying dedication caused retirement — also incorrect."}, {"n": 6, "type": "Sentence Combining & Subordination", "passage": "The city installed new traffic signals at the intersection. Accident rates dropped by thirty percent in the following year. Urban planners called the intervention a model success.", "question": "Which choice most effectively combines the first two sentences to show cause and result?", "underline": "N/A", "choices": [{"label": "A", "text": "After the city installed new traffic signals at the intersection, accident rates dropped by thirty percent in the following year."}, {"label": "B", "text": "Although the city installed new traffic signals at the intersection, accident rates dropped by thirty percent in the following year."}, {"label": "C", "text": "Because accident rates dropped by thirty percent, the city installed new traffic signals at the intersection."}, {"label": "D", "text": "The city installed new traffic signals at the intersection, but accident rates dropped by thirty percent in the following year."}], "answer": "A", "explanation": "'After' establishes a clear temporal-causal relationship: installation preceded the drop. B uses 'although,' implying an unexpected contrast — but a drop after safety improvements is expected, not surprising. C reverses cause and effect. D uses 'but,' implying the drop was surprising or contradictory — which it is not."}, {"n": 7, "type": "Sentence Combining & Subordination", "passage": "The athlete trained for six months under extreme conditions. She suffered a knee injury two weeks before the competition. She withdrew from the event entirely.", "question": "Which choice most effectively combines the first two sentences using a participial phrase?", "underline": "N/A", "choices": [{"label": "A", "text": "Having trained for six months under extreme conditions, the athlete suffered a knee injury two weeks before the competition."}, {"label": "B", "text": "The athlete trained for six months under extreme conditions, so she suffered a knee injury two weeks before the competition."}, {"label": "C", "text": "Because she suffered a knee injury two weeks before the competition, the athlete had trained for six months."}, {"label": "D", "text": "Although training for six months under extreme conditions, the athlete suffered a knee injury two weeks before the competition."}], "answer": "A", "explanation": "A uses a perfect participial phrase to establish prior context (training) before the main clause event (injury). B uses 'so,' implying training directly caused injury — an unfair implication. C reverses chronology. D uses 'although,' implying the training made the injury unexpected — logically awkward since injury can occur despite training."}, {"n": 8, "type": "Sentence Combining & Subordination", "passage": "The administration announced a new scholarship program. Applications increased by sixty percent. Many students who had previously been unable to afford tuition enrolled.", "question": "Which choice most effectively combines the first two sentences?", "underline": "N/A", "choices": [{"label": "A", "text": "Once the administration announced a new scholarship program, applications increased by sixty percent."}, {"label": "B", "text": "The administration announced a new scholarship program, but applications increased by sixty percent."}, {"label": "C", "text": "Although the administration announced a new scholarship program, applications increased by sixty percent."}, {"label": "D", "text": "Because applications increased by sixty percent, the administration announced a new scholarship program."}], "answer": "A", "explanation": "'Once' correctly shows that the increase followed the announcement — a clear sequential-causal relationship. B uses 'but,' which implies an unexpected or contradictory result. C uses 'although,' implying contrast. D reverses cause and effect."}, {"n": 9, "type": "Sentence Combining & Subordination", "passage": "The documentary had a limited release in three cities. It won four major awards at international film festivals. Distributors subsequently expanded its release nationally.", "question": "Which choice most effectively combines the first two sentences while preserving both facts without implying causation?", "underline": "N/A", "choices": [{"label": "A", "text": "Although it had a limited release in three cities, the documentary won four major awards at international film festivals."}, {"label": "B", "text": "The documentary had a limited release in three cities, so it won four major awards at international film festivals."}, {"label": "C", "text": "Because the documentary won four major awards, it had a limited release in three cities."}, {"label": "D", "text": "The documentary, which won four major awards at international film festivals, had a limited release in three cities."}], "answer": "A", "explanation": "A uses 'although' to show that the limited release and the award wins are in tension — the success was surprising given the narrow distribution. B uses 'so,' implying the limited release caused the wins. C reverses the sequence. D (using a relative clause) merely places one fact inside another without expressing the contrast — acceptable but less effective than A."}, {"n": 10, "type": "Sentence Combining & Subordination", "passage": "The team spent three months refining their algorithm. The final model still produced errors in fifteen percent of cases. The engineers returned to the design phase.", "question": "Which choice most effectively combines the first two sentences to express that the effort did not fully succeed?", "underline": "N/A", "choices": [{"label": "A", "text": "Despite spending three months refining their algorithm, the team's final model still produced errors in fifteen percent of cases."}, {"label": "B", "text": "Because the team spent three months refining their algorithm, the final model produced errors in fifteen percent of cases."}, {"label": "C", "text": "After spending three months refining their algorithm, the team produced a final model that still produced errors in fifteen percent of cases."}, {"label": "D", "text": "The team spent three months refining their algorithm, so the final model still produced errors in fifteen percent of cases."}], "answer": "A", "explanation": "'Despite' signals that the extensive effort did not prevent the errors — the key concessive relationship. B implies refinement caused the errors. C uses 'after,' which is temporal but neutral — it doesn't convey that the effort was insufficient. D uses 'so,' implying the effort caused the errors."}, {"n": 11, "type": "Sentence Combining & Subordination", "passage": "The policy was initially praised by economists. It produced lower unemployment figures within its first year. Critics argued the gains were temporary and unsustainable.", "question": "Which choice most effectively combines the first two sentences using a relative clause?", "underline": "N/A", "choices": [{"label": "A", "text": "The policy, which was initially praised by economists, produced lower unemployment figures within its first year."}, {"label": "B", "text": "The policy was initially praised by economists, so it produced lower unemployment figures within its first year."}, {"label": "C", "text": "The policy that produced lower unemployment figures was initially praised by economists within its first year."}, {"label": "D", "text": "Because the policy was initially praised by economists, it produced lower unemployment figures within its first year."}], "answer": "A", "explanation": "A places the economists' praise in a non-restrictive relative clause (supplementary detail) and makes the unemployment outcome the main clause — the more significant finding given the critical context that follows. B implies praise caused the results. C uses a restrictive clause that changes the meaning — implying only the result-producing policy was praised. D implies praise caused the results."}, {"n": 12, "type": "Sentence Combining & Subordination", "passage": "The painting had been authenticated by three independent experts. A fourth expert disputed the findings upon closer examination. The museum suspended public display pending further review.", "question": "Which choice most effectively combines the first two sentences to highlight the conflict?", "underline": "N/A", "choices": [{"label": "A", "text": "Although the painting had been authenticated by three independent experts, a fourth expert disputed the findings upon closer examination."}, {"label": "B", "text": "Because the painting had been authenticated by three independent experts, a fourth expert disputed the findings."}, {"label": "C", "text": "The painting had been authenticated by three independent experts, so a fourth expert disputed the findings."}, {"label": "D", "text": "When the painting had been authenticated by three experts, a fourth expert disputed the findings."}], "answer": "A", "explanation": "'Although' correctly signals the contrast: the consensus authentication makes the fourth expert's dispute particularly significant. B and C imply authentication caused the dispute. D uses 'when,' treating both events as simultaneous or sequentially neutral."}, {"n": 13, "type": "Sentence Combining & Subordination", "passage": "The river flooded its banks. Agricultural land in the surrounding region was submerged. Farmers lost an estimated forty percent of their annual harvest.", "question": "Which choice most effectively combines the first two sentences using a participial phrase?", "underline": "N/A", "choices": [{"label": "A", "text": "When the river flooded its banks, agricultural land in the surrounding region was submerged."}, {"label": "B", "text": "Having flooded its banks, the river submerged agricultural land in the surrounding region."}, {"label": "C", "text": "The river flooded its banks, but agricultural land in the surrounding region was submerged."}, {"label": "D", "text": "Although the river flooded its banks, agricultural land in the surrounding region was submerged."}], "answer": "B", "explanation": "B uses a perfect participial phrase ('Having flooded') to show the river as the agent of submersion, combining both sentences efficiently. A is temporal but slightly passive — 'was submerged' hides the river's agency. C uses 'but,' incorrectly implying contrast. D uses 'although,' implying submerging was unexpected after flooding — illogical."}, {"n": 14, "type": "Sentence Combining & Subordination", "passage": "The author revised the manuscript seventeen times. Each revision added clarity and reduced redundancy. The final version was praised universally by reviewers.", "question": "Which choice most effectively combines the first two sentences to show a cumulative process?", "underline": "N/A", "choices": [{"label": "A", "text": "The author revised the manuscript seventeen times, each revision adding clarity and reducing redundancy."}, {"label": "B", "text": "The author revised the manuscript seventeen times, but each revision added clarity and reduced redundancy."}, {"label": "C", "text": "Although the author revised the manuscript seventeen times, each revision added clarity and reduced redundancy."}, {"label": "D", "text": "Because each revision added clarity and reduced redundancy, the author revised the manuscript seventeen times."}], "answer": "A", "explanation": "A uses an absolute phrase ('each revision adding') to describe the process in parallel with the main clause — elegant and precise. B uses 'but,' implying an unexpected contrast. C uses 'although,' implying the improvements were surprising given the revisions. D reverses the logical order — clarity per revision was the result, not the motivation for the number of revisions."}, {"n": 15, "type": "Sentence Combining & Subordination", "passage": "The government introduced strict emissions regulations. Several major manufacturers initially resisted compliance. Within two years, industry-wide emissions had fallen by twenty percent.", "question": "Which choice most effectively combines the first two sentences?", "underline": "N/A", "choices": [{"label": "A", "text": "After the government introduced strict emissions regulations, several major manufacturers initially resisted compliance."}, {"label": "B", "text": "The government introduced strict emissions regulations, so several major manufacturers initially resisted compliance."}, {"label": "C", "text": "Although the government introduced strict emissions regulations, several major manufacturers initially resisted compliance."}, {"label": "D", "text": "Because several major manufacturers initially resisted compliance, the government introduced strict emissions regulations."}], "answer": "A", "explanation": "'After' correctly establishes that resistance followed the introduction of regulations — a straightforward temporal-causal sequence. B uses 'so,' implying regulations logically caused resistance in a direct sense — too reductive. C uses 'although,' implying resistance was surprising — it is in fact a natural corporate response and not particularly unexpected. D reverses the sequence."}, {"n": 16, "type": "Sentence Combining & Subordination", "passage": "The linguist analyzed thousands of transcripts. She identified consistent patterns in how speakers signal disagreement without using explicit negation. The findings reshaped how pragmatics researchers studied indirect speech acts.", "question": "Which choice most effectively combines the first two sentences using subordination?", "underline": "N/A", "choices": [{"label": "A", "text": "By analyzing thousands of transcripts, the linguist identified consistent patterns in how speakers signal disagreement without explicit negation."}, {"label": "B", "text": "The linguist analyzed thousands of transcripts, so she identified consistent patterns in how speakers signal disagreement."}, {"label": "C", "text": "The linguist analyzed thousands of transcripts, but she identified consistent patterns in how speakers signal disagreement."}, {"label": "D", "text": "Although the linguist analyzed thousands of transcripts, she identified consistent patterns in how speakers signal disagreement."}], "answer": "A", "explanation": "A uses a 'by + gerund' construction to show the analysis as the method through which the discovery was made — precise and efficient. B uses 'so,' which is causal and accurate but less precise about the process-outcome relationship. C uses 'but,' implying identification was an unexpected result of analysis. D uses 'although,' which implies the same."}, {"n": 17, "type": "Sentence Combining & Subordination", "passage": "The exhibition opened to the public on a Thursday. Attendance figures for the first weekend were nearly double the museum's projection. The museum extended the exhibition by three weeks.", "question": "Which choice most effectively combines the second and third sentences?", "underline": "N/A", "choices": [{"label": "A", "text": "Because attendance figures for the first weekend were nearly double the museum's projection, the museum extended the exhibition by three weeks."}, {"label": "B", "text": "Although attendance figures were nearly double the projection, the museum extended the exhibition by three weeks."}, {"label": "C", "text": "The museum extended the exhibition by three weeks, so attendance figures were nearly double the projection."}, {"label": "D", "text": "Attendance figures were nearly double the projection, but the museum extended the exhibition by three weeks."}], "answer": "A", "explanation": "A correctly uses 'because' to show that high attendance caused the extension — a direct and logical cause-effect relationship. B uses 'although,' implying extension was surprising given high attendance — illogical. C reverses cause and effect. D uses 'but,' implying extension was an unexpected or contradictory response."}, {"n": 18, "type": "Sentence Combining & Subordination", "passage": "The surgeon operated for nine hours. The patient's condition had been considered critical before the procedure. The surgery was ultimately successful.", "question": "Which choice most effectively combines the first two sentences using a subordinate clause?", "underline": "N/A", "choices": [{"label": "A", "text": "Although the patient's condition had been considered critical before the procedure, the surgeon operated for nine hours."}, {"label": "B", "text": "The surgeon operated for nine hours on a patient whose condition had been considered critical before the procedure."}, {"label": "C", "text": "Because the surgeon operated for nine hours, the patient's condition had been considered critical."}, {"label": "D", "text": "The surgeon operated for nine hours, but the patient's condition had been considered critical before the procedure."}], "answer": "B", "explanation": "B uses a relative clause to embed the patient's critical condition into a description of the patient — the most efficient and logical construction. A uses 'although' with the wrong main clause — the duration of surgery is not the surprising result; success is. C reverses cause and effect absurdly. D uses 'but,' creating a false contrast."}, {"n": 19, "type": "Sentence Combining & Subordination", "passage": "The committee reviewed the evidence for three hours. No consensus was reached by the end of the session. A second meeting was scheduled for the following week.", "question": "Which choice most effectively combines the first two sentences to show that effort did not produce resolution?", "underline": "N/A", "choices": [{"label": "A", "text": "Despite reviewing the evidence for three hours, the committee reached no consensus by the end of the session."}, {"label": "B", "text": "Because the committee reviewed the evidence for three hours, no consensus was reached by the end of the session."}, {"label": "C", "text": "The committee reviewed the evidence for three hours, so no consensus was reached by the end of the session."}, {"label": "D", "text": "After reviewing the evidence for three hours, the committee reached no consensus by the end of the session."}], "answer": "A", "explanation": "'Despite' signals concession — extensive review time did not produce consensus. B implies review caused failure. C implies the same with 'so.' D uses 'after,' which is temporally accurate but does not convey the sense of effort-without-result that the context implies."}, {"n": 20, "type": "Sentence Combining & Subordination", "passage": "The program trained over five hundred participants. Most participants reported significant improvements in their professional skills. Retention rates in the participating organizations increased measurably.", "question": "Which choice most effectively combines the first two sentences using a relative clause?", "underline": "N/A", "choices": [{"label": "A", "text": "The program trained over five hundred participants, most of whom reported significant improvements in their professional skills."}, {"label": "B", "text": "The program trained over five hundred participants who all reported significant improvements in their professional skills."}, {"label": "C", "text": "The program trained over five hundred participants, so most reported significant improvements in their skills."}, {"label": "D", "text": "Most participants reported improvements because the program trained over five hundred of them."}], "answer": "A", "explanation": "A uses 'most of whom' — a partitive relative construction that accurately reflects 'most' (not all) participants. B uses 'who all,' implying every participant reported improvement, which contradicts 'most.' C uses 'so,' which implies training directly caused the improvements without distinguishing the proportion. D awkwardly reverses the sentence logic."}, {"n": 21, "type": "Sentence Combining & Subordination", "passage": "The engineers redesigned the cooling system. Energy consumption was reduced by eighteen percent. The company met its sustainability targets for the first time in a decade.", "question": "Which choice most effectively combines the first two sentences using a participial phrase?", "underline": "N/A", "choices": [{"label": "A", "text": "By redesigning the cooling system, the engineers reduced energy consumption by eighteen percent."}, {"label": "B", "text": "Redesigning the cooling system, energy consumption was reduced by eighteen percent."}, {"label": "C", "text": "The engineers redesigned the cooling system, so energy consumption was reduced by eighteen percent."}, {"label": "D", "text": "Although the engineers redesigned the cooling system, energy consumption was reduced by eighteen percent."}], "answer": "A", "explanation": "A uses 'by + gerund' to identify the method through which reduction was achieved — precise and grammatically correct. B creates a dangling modifier — 'redesigning' has no logical subject since 'energy consumption' did not redesign anything. C is acceptable but less economical. D uses 'although,' implying the reduction was unexpected."}, {"n": 22, "type": "Sentence Combining & Subordination", "passage": "The editorial board reviewed the article twice. Several factual inaccuracies were identified during the second review. The article was not published.", "question": "Which choice most effectively combines the second and third sentences?", "underline": "N/A", "choices": [{"label": "A", "text": "Because several factual inaccuracies were identified during the second review, the article was not published."}, {"label": "B", "text": "Several factual inaccuracies were identified during the second review, but the article was not published."}, {"label": "C", "text": "Although several factual inaccuracies were identified during the second review, the article was not published."}, {"label": "D", "text": "Several factual inaccuracies were identified during the second review, so the article was not eventually published."}], "answer": "A", "explanation": "A correctly uses 'because' to show inaccuracies as the direct cause of non-publication. B uses 'but,' implying non-publication was a surprising or contradictory response to finding errors. C uses 'although,' which would imply the article was published despite errors — then inverts with non-publication, creating confusion. D's 'so' is logically close to A but the phrase 'not eventually published' is awkward."}, {"n": 23, "type": "Sentence Combining & Subordination", "passage": "The astronauts completed their spacewalk in record time. Equipment malfunction had threatened to cut the mission short earlier. Ground control celebrated the successful completion.", "question": "Which choice most effectively combines the first two sentences to highlight the achievement given the difficulty?", "underline": "N/A", "choices": [{"label": "A", "text": "Despite an earlier equipment malfunction that had threatened to cut the mission short, the astronauts completed their spacewalk in record time."}, {"label": "B", "text": "Because an equipment malfunction had threatened to cut the mission short, the astronauts completed their spacewalk in record time."}, {"label": "C", "text": "The astronauts completed their spacewalk in record time, so an equipment malfunction had threatened to cut the mission short."}, {"label": "D", "text": "The astronauts completed their spacewalk in record time, and an equipment malfunction had threatened to cut the mission short."}], "answer": "A", "explanation": "A uses 'despite' and a relative clause to subordinate the obstacle and foreground the achievement. B implies the malfunction caused the record time — illogical. C reverses cause and effect. D coordinates both as equal facts, losing the sense of triumph over adversity."}, {"n": 24, "type": "Sentence Combining & Subordination", "passage": "The students submitted their final projects on the last day of the semester. Several projects demonstrated insights that went well beyond the requirements. The instructor offered three students the opportunity to expand their work into a publication.", "question": "Which choice most effectively combines the second and third sentences?", "underline": "N/A", "choices": [{"label": "A", "text": "Because several projects demonstrated insights that went well beyond the requirements, the instructor offered three students the opportunity to expand their work into a publication."}, {"label": "B", "text": "Several projects demonstrated insights that went well beyond the requirements, but the instructor offered three students the opportunity to expand their work."}, {"label": "C", "text": "Although several projects demonstrated insights beyond the requirements, the instructor offered three students the opportunity to expand their work."}, {"label": "D", "text": "The instructor offered three students the opportunity to expand their work because several projects were beyond requirements."}], "answer": "A", "explanation": "A uses 'because' to clearly identify the exceptional quality of the projects as the reason for the publication offer. B uses 'but,' implying the offer was unexpected or contradictory. C uses 'although,' also implying the offer was a surprising response to quality. D is logically similar to A but 'were beyond requirements' loses the specific wording 'insights that went well beyond,' which better justifies the publication offer."}, {"n": 25, "type": "Sentence Combining & Subordination", "passage": "The conservation team identified over two hundred plant species in the protected zone. Many species had not been recorded in the region for decades. The findings prompted calls for expanded protections.", "question": "Which choice most effectively combines the first two sentences using a partitive relative construction?", "underline": "N/A", "choices": [{"label": "A", "text": "The conservation team identified over two hundred plant species in the protected zone, many of which had not been recorded in the region for decades."}, {"label": "B", "text": "The conservation team identified over two hundred plant species in the protected zone, and many of them had not been recorded for decades."}, {"label": "C", "text": "The conservation team identified over two hundred plant species, all of which had not been recorded in the region for decades."}, {"label": "D", "text": "Many species that had not been recorded in the region for decades were identified by the conservation team in the protected zone."}], "answer": "A", "explanation": "A uses 'many of which' — a partitive relative clause — to embed the additional detail within a single integrated sentence. 'Many of which' is more formal than 'many of them' (B). C incorrectly substitutes 'all of which,' changing 'many' to 'all' — factually inconsistent. D restructures the sentence to lead with the rare species, shifting the emphasis away from the team's discovery — grammatically correct but thematically less aligned with the passage's purpose."}]}, {"n": 10, "topic": "Mixed Grammar Review II", "diff": "Mixed Advanced Grammar Review", "qs": [{"n": 1, "type": "Boundaries", "passage": "The committee convened three times before issuing a formal statement. Its members represented a wide range of professional backgrounds, including law, medicine, and academic research. The final document reflected weeks of careful deliberation and was issued without dissent.", "question": "Which choice correctly punctuates the boundary between two complete clauses?", "underline": "Its members represented a wide range of professional backgrounds, including law, medicine, and academic research, the final document reflected weeks of careful deliberation.", "choices": [{"label": "A", "text": "its members represented a wide range of professional backgrounds, including law, medicine, and academic research, the final document reflected weeks of careful deliberation."}, {"label": "B", "text": "Its members represented a wide range of professional backgrounds, including law, medicine, and academic research. The final document reflected weeks of careful deliberation."}, {"label": "C", "text": "Its members represented a wide range of professional backgrounds, including law, medicine, and academic research; the final document it reflected weeks of careful deliberation."}, {"label": "D", "text": "Its members represented a wide range of professional backgrounds; including law, medicine, and academic research, the final document reflected weeks of careful deliberation."}], "answer": "B", "explanation": "The two clauses are independent and must be separated by a period or semicolon. A creates a comma splice. B correctly uses a period. C adds a redundant pronoun ('it'). D incorrectly places the semicolon after 'backgrounds,' separating the introductory list from the clause it modifies."}, {"n": 2, "type": "Advanced Comma Usage", "passage": "The report, submitted three weeks after the original deadline, contained data that contradicted the committee's earlier conclusions. Reviewers noted that several of the appendices were missing and that key citations had not been formatted according to the required style guide.", "question": "Which choice correctly uses commas to set off a non-restrictive modifier?", "underline": "The report submitted three weeks after the original deadline contained data", "choices": [{"label": "A", "text": "The report submitted three weeks after the original deadline contained data"}, {"label": "B", "text": "The report, submitted three weeks after the original deadline, contained data"}, {"label": "C", "text": "The report, submitted three weeks after the original deadline contained data"}, {"label": "D", "text": "The report submitted, three weeks after the original deadline, contained data"}], "answer": "B", "explanation": "'Submitted three weeks after the original deadline' is a non-restrictive participial phrase that adds supplementary information — it must be enclosed in commas. A omits both commas, treating the phrase as essential (restrictive). C uses only the opening comma, breaking the sentence mid-phrase. D incorrectly places the comma after 'submitted,' splitting the phrase from its modifier head."}, {"n": 3, "type": "Subject-Verb Agreement", "passage": "The collection of artifacts discovered beneath the old courthouse has attracted considerable scholarly attention. Archaeologists from three universities have been collaborating on a comprehensive catalogue of the finds. Publication of their findings is expected within the next eighteen months.", "question": "Which choice maintains correct subject-verb agreement with a prepositional phrase between subject and verb?", "underline": "The collection of artifacts discovered beneath the old courthouse has attracted", "choices": [{"label": "A", "text": "The collection of artifacts discovered beneath the old courthouse has attracted"}, {"label": "B", "text": "The collection of artifacts discovered beneath the old courthouse have attracted"}, {"label": "C", "text": "The collection of artifacts, discovered beneath the old courthouse, have attracted"}, {"label": "D", "text": "The collection, of artifacts discovered beneath the old courthouse, has attracted"}], "answer": "A", "explanation": "The subject is 'collection' (singular), not 'artifacts.' The prepositional phrase 'of artifacts' does not change the subject. 'Has attracted' (singular) is correct. B uses 'have attracted,' agreeing with the closer noun 'artifacts' — a proximity agreement error. C also uses 'have attracted.' D is grammatically awkward and separates 'of artifacts' incorrectly."}, {"n": 4, "type": "Pronoun Reference", "passage": "The foundation awarded the grant to the institute, which was expected to use it to fund three new research positions. Members of the board had debated for weeks about which organization was best positioned to expand research in the relevant field.", "question": "Which choice ensures the pronoun clearly refers to the institute rather than the grant?", "underline": "which was expected to use it to fund three new research positions", "choices": [{"label": "A", "text": "which was expected to use it to fund three new research positions"}, {"label": "B", "text": "which was expected to use the grant to fund three new research positions"}, {"label": "C", "text": "that was expected to use it to fund three new research positions"}, {"label": "D", "text": "who was expected to use it to fund three new research positions"}], "answer": "B", "explanation": "'It' could refer ambiguously to either 'grant' or 'institute.' B replaces 'it' with 'the grant,' eliminating ambiguity. A retains the ambiguity. C uses 'that' in a non-restrictive clause (after a comma) — 'that' cannot introduce non-restrictive clauses. D uses 'who' for an organization, which is typically reserved for people."}, {"n": 5, "type": "Modifiers", "passage": "The researcher presented her findings to a panel of experts, having spent two years collecting and analyzing data from four continents. The panel's questions focused primarily on methodology and sample size. Several members expressed interest in collaborating on a follow-up study.", "question": "Which choice ensures the participial modifier is correctly attached to its subject?", "underline": "Having spent two years collecting and analyzing data from four continents, the panel questioned her methodology.", "choices": [{"label": "A", "text": "Having spent two years collecting and analyzing data from four continents, the panel questioned her methodology."}, {"label": "B", "text": "Having spent two years collecting and analyzing data from four continents, the researcher presented her findings to a panel of experts."}, {"label": "C", "text": "The researcher, having collected and analyzed data from four continents in two years, the panel questioned her methodology."}, {"label": "D", "text": "Having spent two years on four continents, the panel of experts analyzed the researcher's data."}], "answer": "B", "explanation": "'Having spent two years collecting data' modifies the researcher, not the panel. B correctly places 'the researcher' immediately after the participial phrase. A makes the panel the implied subject — a dangling modifier. C creates a double subject ('the researcher... the panel'). D makes the panel the modifier's subject, which is also incorrect."}, {"n": 6, "type": "Parallel Structure", "passage": "The executive's plan involved restructuring three departments, renegotiating key supplier contracts, and the reduction of overhead costs by fifteen percent. Analysts predicted that the combined measures would restore profitability within two fiscal quarters.", "question": "Which choice corrects the parallel structure error in the list?", "underline": "restructuring three departments, renegotiating key supplier contracts, and the reduction of overhead costs", "choices": [{"label": "A", "text": "restructuring three departments, renegotiating key supplier contracts, and the reduction of overhead costs"}, {"label": "B", "text": "restructuring three departments, renegotiating key supplier contracts, and reducing overhead costs"}, {"label": "C", "text": "the restructuring of three departments, renegotiating key supplier contracts, and reducing overhead costs"}, {"label": "D", "text": "to restructure three departments, renegotiating key supplier contracts, and reducing overhead costs"}], "answer": "B", "explanation": "The list must use parallel gerunds: restructuring, renegotiating, reducing. A uses a noun phrase ('the reduction') as the third item — not parallel. C and D mix different structures for the first item."}, {"n": 7, "type": "Verb Tense & Mood", "passage": "By the time the report was finalized, the team had already submitted three draft versions for internal review. Each draft had undergone significant revision in response to feedback from the senior editorial board. The final version required only minor formatting adjustments before publication.", "question": "Which choice uses the correct past perfect tense to establish sequence?", "underline": "the team already submitted three draft versions", "choices": [{"label": "A", "text": "the team already submitted three draft versions"}, {"label": "B", "text": "the team had already submitted three draft versions"}, {"label": "C", "text": "the team has already submitted three draft versions"}, {"label": "D", "text": "the team would already submit three draft versions"}], "answer": "B", "explanation": "'By the time the report was finalized' requires past perfect to show an earlier completed action. B ('had already submitted') correctly uses past perfect. A uses simple past — does not convey the temporal priority. C uses present perfect — inconsistent with the past-tense frame. D uses 'would submit' — a conditional or future-in-past, which does not fit the completed timeline."}, {"n": 8, "type": "Relative Clauses & Subordination", "passage": "The organization awarded grants to researchers with whom it had previously collaborated on funded projects. New applicants without prior collaboration history were considered only under exceptional circumstances. The selection committee defended this policy as a protection against untested research proposals.", "question": "Which choice correctly uses the object form of the relative pronoun after a preposition?", "underline": "researchers with whom it had previously collaborated on funded projects", "choices": [{"label": "A", "text": "researchers with whom it had previously collaborated on funded projects"}, {"label": "B", "text": "researchers with who it had previously collaborated on funded projects"}, {"label": "C", "text": "researchers that it had previously collaborated with on funded projects"}, {"label": "D", "text": "researchers which it had previously collaborated with on funded projects"}], "answer": "A", "explanation": "After a preposition, the object form 'whom' is required. 'With whom' correctly fronts the preposition in formal prose. B uses 'who' (subject form) after a preposition — incorrect. C uses 'that' and strands the preposition — acceptable informally but substandard in formal prose. D uses 'which' for people — incorrect."}, {"n": 9, "type": "Sentence Combining & Subordination", "passage": "The committee debated the proposal for over two hours. No agreement was reached. The chair postponed the vote until the following session.", "question": "Which choice most effectively combines the first two sentences to show that effort did not produce resolution?", "underline": "N/A", "choices": [{"label": "A", "text": "Despite debating the proposal for over two hours, the committee reached no agreement."}, {"label": "B", "text": "Because the committee debated the proposal for over two hours, no agreement was reached."}, {"label": "C", "text": "The committee debated the proposal for over two hours, so no agreement was reached."}, {"label": "D", "text": "After debating the proposal for over two hours, no agreement was reached."}], "answer": "A", "explanation": "'Despite' signals concession — extended debate did not produce resolution. B implies debate caused failure. C implies the same with 'so.' D creates a dangling modifier since 'no agreement' did not do the debating."}, {"n": 10, "type": "Boundaries", "passage": "The study's sample size was deliberately limited to reduce confounding variables. A larger group would have introduced logistical challenges that the research team was not equipped to manage within the given timeframe. Future replications may address this limitation with expanded resources.", "question": "Which choice correctly uses a semicolon to join two independent clauses?", "underline": "The study's sample size was deliberately limited to reduce confounding variables, a larger group would have introduced logistical challenges.", "choices": [{"label": "A", "text": "The study's sample size was deliberately limited to reduce confounding variables, a larger group would have introduced logistical challenges."}, {"label": "B", "text": "The study's sample size was deliberately limited to reduce confounding variables; a larger group would have introduced logistical challenges."}, {"label": "C", "text": "The study's sample size was deliberately limited to reduce confounding variables: a larger group would have introduced logistical challenges."}, {"label": "D", "text": "The study's sample size was deliberately limited; to reduce confounding variables, a larger group would have introduced logistical challenges."}], "answer": "B", "explanation": "A comma alone cannot join two independent clauses (comma splice). B correctly uses a semicolon. C uses a colon — acceptable if the second clause explains the first, but here the relationship is parallel contrast rather than elaboration. D misplaces the semicolon after 'limited,' separating 'to reduce confounding variables' from its governing verb — the infinitive phrase modifies 'limited.'"}, {"n": 11, "type": "Advanced Comma Usage", "passage": "The lead investigator, who had spent fifteen years studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate. Her dissent was well documented in the academic literature. Newer models developed in the past decade have begun to support her position.", "question": "Which choice correctly punctuates a non-restrictive relative clause?", "underline": "The lead investigator who had spent fifteen years studying the phenomenon believed that the existing theoretical models were fundamentally inadequate.", "choices": [{"label": "A", "text": "The lead investigator who had spent fifteen years studying the phenomenon believed that the existing theoretical models were fundamentally inadequate."}, {"label": "B", "text": "The lead investigator, who had spent fifteen years studying the phenomenon believed that the existing theoretical models were fundamentally inadequate."}, {"label": "C", "text": "The lead investigator, who had spent fifteen years studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate."}, {"label": "D", "text": "The lead investigator who had spent fifteen years, studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate."}], "answer": "C", "explanation": "'Who had spent fifteen years studying the phenomenon' adds supplementary information about a specific individual already identified — making it non-restrictive. It must be enclosed in commas. A omits both commas. B provides only the opening comma, leaving the clause unclosed. D places commas incorrectly around 'studying the phenomenon,' breaking the relative clause illogically."}, {"n": 12, "type": "Subject-Verb Agreement", "passage": "Neither the chief executive nor the department heads were informed of the policy change before its public announcement. This breakdown in communication prompted immediate calls for an internal review. Several recommendations from that review were subsequently implemented.", "question": "Which choice uses correct subject-verb agreement with a 'neither...nor' construction?", "underline": "Neither the chief executive nor the department heads was informed of the policy change", "choices": [{"label": "A", "text": "Neither the chief executive nor the department heads was informed of the policy change"}, {"label": "B", "text": "Neither the chief executive nor the department heads were informed of the policy change"}, {"label": "C", "text": "Neither the chief executive nor the department heads have been informed of the policy change"}, {"label": "D", "text": "Neither the chief executive nor the department heads is informed of the policy change"}], "answer": "B", "explanation": "With 'neither...nor,' the verb agrees with the noun closest to it — 'department heads' (plural). 'Were' is therefore correct. A uses 'was' (singular), agreeing with the more distant noun. C uses present perfect, inconsistent with the past-tense context. D uses 'is,' which is singular and present."}, {"n": 13, "type": "Pronoun Reference", "passage": "The museum returned the artifacts to the country from which they had been taken. Officials from both institutions signed the repatriation agreement at a ceremony attended by cultural leaders from both nations. The event was widely covered by international media.", "question": "Which choice ensures 'they' refers clearly to 'artifacts' rather than 'officials'?", "underline": "the country from which they had been taken", "choices": [{"label": "A", "text": "the country from which they had been taken"}, {"label": "B", "text": "the country from which the artifacts had been taken"}, {"label": "C", "text": "the country from which it had been taken"}, {"label": "D", "text": "the country which they had been taken from it"}], "answer": "B", "explanation": "'They' could refer to either 'artifacts' or 'officials' — both plural nouns recently mentioned. B replaces 'they' with 'the artifacts,' eliminating ambiguity. A retains the ambiguity. C uses 'it,' which is singular and incorrect for plural 'artifacts.' D adds a double reference pronoun ('it')."}, {"n": 14, "type": "Modifiers", "passage": "Presented with the evidence of climate change, urgent policy reform became the priority of the international summit. Delegates from forty nations convened to draft binding emissions commitments. The negotiations lasted three days beyond the original schedule.", "question": "Which choice corrects the dangling modifier error?", "underline": "Presented with the evidence of climate change, urgent policy reform became the priority of the international summit.", "choices": [{"label": "A", "text": "Presented with the evidence of climate change, urgent policy reform became the priority of the international summit."}, {"label": "B", "text": "Presented with the evidence of climate change, the delegates made urgent policy reform the priority of the summit."}, {"label": "C", "text": "Urgent policy reform, presented with the evidence of climate change, became the priority of the international summit."}, {"label": "D", "text": "With climate change evidence being presented, urgent policy reform became the priority."}], "answer": "B", "explanation": "'Presented with the evidence' modifies whoever received the evidence — the delegates, not 'urgent policy reform.' B correctly places 'the delegates' as the subject immediately after the participial phrase. A makes 'policy reform' the implied subject — it cannot be 'presented with evidence.' C places the phrase mid-sentence, still modifying 'policy reform.' D uses a different construction that avoids the error but is weaker stylistically."}, {"n": 15, "type": "Parallel Structure", "passage": "The proposed curriculum changes included adding a mandatory research methods course, to revise the grading rubrics for senior projects, and the elimination of two elective offerings. Faculty members were divided on whether the changes would improve academic outcomes.", "question": "Which choice corrects the parallel structure error?", "underline": "adding a mandatory research methods course, to revise the grading rubrics for senior projects, and the elimination of two elective offerings", "choices": [{"label": "A", "text": "adding a mandatory research methods course, to revise the grading rubrics for senior projects, and the elimination of two elective offerings"}, {"label": "B", "text": "adding a mandatory research methods course, revising the grading rubrics for senior projects, and eliminating two elective offerings"}, {"label": "C", "text": "to add a mandatory research methods course, revising the grading rubrics for senior projects, and eliminating two elective offerings"}, {"label": "D", "text": "the addition of a mandatory research methods course, the revision of the grading rubrics, and eliminating two elective offerings"}], "answer": "B", "explanation": "The list requires parallel gerunds: adding, revising, eliminating. A mixes gerund, infinitive, and noun phrase. C mixes infinitive and gerunds. D mixes noun phrases and a gerund. B maintains consistent gerund form throughout."}, {"n": 16, "type": "Verb Tense & Mood", "passage": "The negotiators proposed that all disputed territories be returned to their pre-conflict boundaries. This demand was rejected outright by the opposing delegation. Further talks were suspended for two weeks as both sides consulted with their respective governments.", "question": "Which choice correctly uses the subjunctive mood after a verb of demand?", "underline": "proposed that all disputed territories are returned to their pre-conflict boundaries", "choices": [{"label": "A", "text": "proposed that all disputed territories are returned to their pre-conflict boundaries"}, {"label": "B", "text": "proposed that all disputed territories be returned to their pre-conflict boundaries"}, {"label": "C", "text": "proposed that all disputed territories were returned to their pre-conflict boundaries"}, {"label": "D", "text": "proposed that all disputed territories will be returned to their pre-conflict boundaries"}], "answer": "B", "explanation": "After verbs of demand, request, or proposal (propose, demand, insist, require), the subjunctive form 'be' is required — not 'are,' 'were,' or 'will be.' This is the mandative subjunctive. A uses indicative present. C uses simple past. D uses future indicative. Only B uses the base form 'be' — the correct subjunctive."}, {"n": 17, "type": "Relative Clauses & Subordination", "passage": "The fund was established to support artists for whom commercial galleries offered few opportunities. Its mandate was to prioritize experimental work that challenged conventional aesthetic boundaries. In its first decade, the fund supported over three hundred emerging artists.", "question": "Which choice correctly uses the object form of the relative pronoun after a preposition referring to people?", "underline": "artists for whom commercial galleries offered few opportunities", "choices": [{"label": "A", "text": "artists for whom commercial galleries offered few opportunities"}, {"label": "B", "text": "artists for who commercial galleries offered few opportunities"}, {"label": "C", "text": "artists which commercial galleries offered few opportunities for"}, {"label": "D", "text": "artists that commercial galleries offered few opportunities for them"}], "answer": "A", "explanation": "After a preposition ('for'), 'whom' is required. 'For whom' correctly fronts the preposition and uses the object form. B uses 'who' (subject form) after a preposition — incorrect. C uses 'which' for people — incorrect. D uses 'that' with a stranded preposition and adds a double reference pronoun ('them')."}, {"n": 18, "type": "Sentence Combining & Subordination", "passage": "The biologist had catalogued over four hundred species in the region. Several species were previously unknown to science. Her findings attracted international media coverage.", "question": "Which choice most effectively combines the first two sentences using a partitive relative clause?", "underline": "N/A", "choices": [{"label": "A", "text": "The biologist catalogued over four hundred species in the region, several of which were previously unknown to science."}, {"label": "B", "text": "The biologist catalogued over four hundred species in the region, all of which were previously unknown to science."}, {"label": "C", "text": "The biologist catalogued over four hundred species in the region; several of them previously unknown to science."}, {"label": "D", "text": "The biologist catalogued over four hundred species, and several species were previously unknown to science."}], "answer": "A", "explanation": "A uses 'several of which' — a partitive relative clause — accurately representing that only some (not all) species were new. B replaces 'several' with 'all,' contradicting the original. C uses a semicolon with a fragment ('several of them previously unknown' has no verb). D coordinates the facts as equal clauses, losing the elegant subordination."}, {"n": 19, "type": "Boundaries", "passage": "The foundation's annual report documented a thirty percent increase in grant applications from underrepresented communities. This growth was attributed to a targeted outreach campaign launched two years earlier. The board voted to expand the campaign in the following fiscal year.", "question": "Which choice correctly punctuates the underlined section?", "underline": "This growth was attributed to a targeted outreach campaign it had been launched two years earlier.", "choices": [{"label": "A", "text": "This growth was attributed to a targeted outreach campaign it had been launched two years earlier."}, {"label": "B", "text": "This growth was attributed to a targeted outreach campaign; it had been launched two years earlier."}, {"label": "C", "text": "This growth was attributed to a targeted outreach campaign, launched two years earlier."}, {"label": "D", "text": "This growth was attributed to a targeted outreach campaign launched two years earlier."}], "answer": "D", "explanation": "D correctly uses a participial phrase ('launched two years earlier') as a modifier — no extra clause needed. A runs two sentences together without punctuation. B splits the information into two separate clauses — grammatically correct but unnecessarily wordy. C adds a comma before 'launched,' slightly separating the modifier from its noun — acceptable but less tight than D."}, {"n": 20, "type": "Advanced Comma Usage", "passage": "The delegate from Brazil, a seasoned diplomat who had participated in three previous summits, delivered the opening address. Her speech focused primarily on climate finance and technology transfer. Both issues had been contentious in prior negotiations.", "question": "Which choice correctly uses commas around an appositive phrase?", "underline": "The delegate from Brazil a seasoned diplomat who had participated in three previous summits delivered the opening address.", "choices": [{"label": "A", "text": "The delegate from Brazil a seasoned diplomat who had participated in three previous summits delivered the opening address."}, {"label": "B", "text": "The delegate from Brazil, a seasoned diplomat who had participated in three previous summits, delivered the opening address."}, {"label": "C", "text": "The delegate from Brazil, a seasoned diplomat, who had participated in three previous summits delivered the opening address."}, {"label": "D", "text": "The delegate from Brazil, a seasoned diplomat who had participated in three previous summits delivered the opening address."}], "answer": "B", "explanation": "'A seasoned diplomat who had participated in three previous summits' is an appositive phrase renaming 'the delegate from Brazil' — it must be enclosed in commas. A omits both commas. B correctly encloses the full appositive. C places the closing comma after 'diplomat,' separating the relative clause ('who had participated') from the appositive it belongs to. D omits the closing comma."}, {"n": 21, "type": "Subject-Verb Agreement", "passage": "The number of students enrolled in advanced science courses has increased significantly over the past five years. Educators attribute this growth to targeted recruitment efforts and curricular reforms. Many districts have since adopted similar strategies.", "question": "Which choice correctly uses 'the number of' with a singular verb?", "underline": "The number of students enrolled in advanced science courses have increased significantly", "choices": [{"label": "A", "text": "The number of students enrolled in advanced science courses have increased significantly"}, {"label": "B", "text": "The number of students enrolled in advanced science courses has increased significantly"}, {"label": "C", "text": "A number of students enrolled in advanced science courses has increased significantly"}, {"label": "D", "text": "The number of students enrolling in advanced science courses were increased significantly"}], "answer": "B", "explanation": "'The number of' takes a singular verb — 'has.' 'A number of' takes a plural verb. A uses 'have' with 'the number,' which is incorrect. C uses 'a number of' with 'has' — the opposite error. D uses 'were increased,' which is passive and inconsistent with the context."}, {"n": 22, "type": "Pronoun Reference", "passage": "When the mayor presented the budget to the city council, she noted that the previous administration had left a significant deficit. Council members questioned whether the figures accurately reflected the current fiscal situation. A full audit was subsequently requested.", "question": "Which choice ensures pronoun-antecedent agreement in number?", "underline": "When the mayor presented the budget to the city council, they noted that the previous administration had left a significant deficit.", "choices": [{"label": "A", "text": "When the mayor presented the budget to the city council, they noted that the previous administration had left a significant deficit."}, {"label": "B", "text": "When the mayor presented the budget to the city council, she noted that the previous administration had left a significant deficit."}, {"label": "C", "text": "When the mayor presented the budget to the city council, it noted that the previous administration had left a significant deficit."}, {"label": "D", "text": "When the mayor presented the budget to the city council, he or she noted that the previous administration had left a significant def
