<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="720" height="470" fill="#f7f4ec" rx="6"/>
<text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a2a2a">How sliced bread is made in a large bakery</text>
<rect x="22" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="38" cy="96" r="11" fill="#2E6E6A"/>
<text x="38.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
<text x="54.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Ingredients</text>
<text x="32.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Flour, water, yeast</text>
<text x="32.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">and salt measured</text>
<text x="32.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">automatically</text>
<rect x="198" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="214" cy="96" r="11" fill="#2E6E6A"/>
<text x="214.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
<text x="230.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Mixing</text>
<text x="208.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">High-speed mixer</text>
<text x="208.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">forms dough in</text>
<text x="208.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">about 3 minutes</text>
<rect x="374" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="390" cy="96" r="11" fill="#2E6E6A"/>
<text x="390.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
<text x="406.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Dividing</text>
<text x="384.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Dough cut into</text>
<text x="384.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">pieces of equal</text>
<text x="384.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">weight and rounded</text>
<rect x="550" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="566" cy="96" r="11" fill="#2E6E6A"/>
<text x="566.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
<text x="582.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">First proving</text>
<text x="560.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Pieces rest in a warm</text>
<text x="560.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">cabinet for 10 minutes</text>
<line x1="172.0" y1="123.0" x2="189.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="198.0,123.0 189.0,118.0 189.0,128.0" fill="#B78A2E"/>
<line x1="348.0" y1="123.0" x2="365.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="374.0,123.0 365.0,118.0 365.0,128.0" fill="#B78A2E"/>
<line x1="524.0" y1="123.0" x2="541.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="550.0,123.0 541.0,118.0 541.0,128.0" fill="#B78A2E"/>
<line x1="625.0" y1="166.0" x2="625.0" y2="261.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="625.0,270.0 630.0,261.0 620.0,261.0" fill="#B78A2E"/>
<rect x="550" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="566" cy="286" r="11" fill="#2E6E6A"/>
<text x="566.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
<text x="582.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Moulding</text>
<text x="560.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Each piece rolled</text>
<text x="560.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">and placed in a</text>
<text x="560.0" y="338.0" text-anchor="start" font-size="10" fill="#2a2a2a">baking tin</text>
<rect x="374" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="390" cy="286" r="11" fill="#2E6E6A"/>
<text x="390.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text>
<text x="406.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Final proving</text>
<text x="384.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">40 C for 50 minutes;</text>
<text x="384.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">dough doubles in size</text>
<rect x="198" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="214" cy="286" r="11" fill="#2E6E6A"/>
<text x="214.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>
<text x="230.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Baking</text>
<text x="208.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Oven at 230 C for</text>
<text x="208.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">25 minutes</text>
<rect x="22" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="38" cy="286" r="11" fill="#2E6E6A"/>
<text x="38.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<text x="54.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Cooling</text>
<text x="32.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Loaves cool on a</text>
<text x="32.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">conveyor for 2 hours</text>
<line x1="550.0" y1="313.0" x2="533.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="524.0,313.0 533.0,318.0 533.0,308.0" fill="#B78A2E"/>
<line x1="374.0" y1="313.0" x2="357.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="348.0,313.0 357.0,318.0 357.0,308.0" fill="#B78A2E"/>
<line x1="198.0" y1="313.0" x2="181.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="172.0,313.0 181.0,318.0 181.0,308.0" fill="#B78A2E"/>
<line x1="97.0" y1="356.0" x2="97.0" y2="377.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="97.0,386.0 102.0,377.0 92.0,377.0" fill="#B78A2E"/>
<rect x="22" y="386" width="150" height="46" rx="8" fill="#B78A2E"/>
<text x="97.0" y="406.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Slicing and packing</text>
<text x="97.0" y="422.0" text-anchor="middle" font-size="10" fill="#fff">delivered to shops</text>
<text x="20.0" y="458.0" text-anchor="start" font-size="10" font-style="italic" fill="#8A7F6E">Whole process from flour to packed loaf: about four hours.</text>
</svg>