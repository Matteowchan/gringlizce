hom' is correct.  A — 'who' is the subject form.  C — 'which' refers to things, not people.  D — 'that' can substitute in informal usage but 'whom' is more precise and formal.","ans":"B"},{"choices":{"B":"that","A":"which","D":"of which","C":"whose"},"n":9,"slug":"gri-mod-sat-g19-1-9","why":"C is correct. 'Whose molecular structure had not been documented' — 'whose' shows that the structure belongs to the compound. 'Whose' can be used for things.  A — 'which molecular structure' is grammatically incorrect.  B — 'that molecular structure' is grammatically incorrect.  D — 'of which molecular structure' is grammatically awkward.","stem":"The researchers discovered a compound ______ molecular structure had not been previously documented.  Which relative pronoun is correct?","ans":"C"},{"ans":"B","stem":"The documentary focuses on communities ______ traditional fishing practices have been disrupted by climate change.  Which relative pronoun is correct?","slug":"gri-mod-sat-g19-1-10","why":"B is correct. 'Whose traditional fishing practices have been disrupted' — 'whose' shows that the practices belong to the communities.  A — 'who' is the subject form and cannot show possession.  C — 'which' cannot show possession without restructuring.  D — 'that' cannot show possession.","n":10,"choices":{"D":"that","C":"which","B":"whose","A":"who"}},{"choices":{"D":"which","C":"that","B":"whose","A":"who"},"n":11,"slug":"gri-mod-sat-g19-1-11","why":"B is correct. 'Whose position on immigration reform shifted' — the position belongs to the senator. Non-restrictive clause about a person, using 'whose' for possession.  A — 'who' cannot show possession.  C — 'that' is not used in non-restrictive clauses.  D — 'which' refers to things, not people.","stem":"The senator, ______ position on immigration reform shifted significantly over her career, retired last year.  Which relative pronoun is correct?","ans":"B"},{"choices":{"C":"whom","D":"whose","A":"who","B":"that"},"n":12,"slug":"gri-mod-sat-g19-1-12","why":"B is correct. 'That dates back to the ninth century' is a restrictive relative clause modifying 'a collection of manuscripts.' 'That' is used for restrictive clauses about things.  A — 'who' refers to people.  C — 'whom' refers to people and is the object form.  D — 'whose' shows possession and would require a noun to follow.","stem":"The library holds a collection of manuscripts ______ dates back to the ninth century.  Which relative pronoun is correct?","ans":"B"},{"n":13,"choices":{"B":"whose","A":"that","C":"who","D":"which"},"ans":"D","why":"D is correct. Non-restrictive clause about a thing ('the proposal') — 'which' is required. The clause adds information without restricting which proposal is meant.  A — 'that' is not used in non-restrictive clauses.  B — 'whose' shows possession and would need a noun after it.  C — 'who' refers to people.","slug":"gri-mod-sat-g19-1-13","stem":"The proposal, ______ was submitted two weeks late, was nonetheless reviewed by the committee.  Which relative pronoun is correct?"},{"n":14,"choices":{"A":"that","B":"who","C":"whom","D":"whose"},"ans":"A","stem":"The painting ______ he had inherited from his grandmother was appraised at over a million dollars.  Which relative pronoun is correct?","why":"A is correct. 'That he had inherited' is a restrictive clause modifying 'the painting.' 'That' is correct for restrictive clauses about things.  B — 'who' refers to people.  C — 'whom' refers to people (object form).  D — 'whose' shows possession.","slug":"gri-mod-sat-g19-1-14"},{"stem":"The chemist, ______ laboratory was destroyed in the fire, rebuilt her research program from scratch.  Which relative pronoun is correct?","why":"D is correct. 'Whose laboratory was destroyed' — 'whose' shows possession. Non-restrictive clause about a person.  A — 'who' cannot show possession.  B — 'which' refers to things.  C — 'that' is not used with non-restrictive clauses.","slug":"gri-mod-sat-g19-1-15","ans":"D","choices":{"D":"whose","C":"that","B":"which","A":"who"},"n":15},{"choices":{"A":"whom","B":"who","C":"whose","D":"which"},"n":16,"slug":"gri-mod-sat-g19-1-16","why":"D is correct. 'Which pertains to intellectual property rights' is a relative clause modifying 'the clause in the contract' (a thing). 'Which' or 'that' can both be used, but 'which' is more formal.  A — 'whom' is the object form for people.  B — 'who' is for people.  C — 'whose' shows possession.","stem":"The clause in the contract ______ pertains to intellectual property rights has been disputed by both parties.  Which relative pronoun is correct?","ans":"D"},{"ans":"D","why":"D is correct. 'Whose work focused on underrepresented communities' — 'whose' shows that the work belongs to the researchers.  A — 'who' is the subject form and cannot show possession.  B — 'which' refers to things.  C — 'whom' is the object form for people.","slug":"gri-mod-sat-g19-1-17","stem":"The organization awarded grants to researchers ______ work focused on underrepresented communities.  Which relative pronoun is correct?","n":17,"choices":{"D":"whose","C":"whom","A":"who","B":"which"}},{"choices":{"C":"who","D":"whom","B":"that","A":"whose"},"n":18,"slug":"gri-mod-sat-g19-1-18","why":"A is correct. 'Whose essay was selected' — the essay belongs to the student. 'Whose' is the correct possessive relative pronoun.  B — 'that' cannot show possession.  C — 'who essay' is grammatically incorrect without a possessive.  D — 'whom' is the object form.","stem":"The student ______ essay was selected for publication had transferred to the program just one semester earlier.  Which relative pronoun is correct?","ans":"A"},{"n":19,"choices":{"D":"whose","C":"which","B":"who","A":"that"},"ans":"C","slug":"gri-mod-sat-g19-1-19","why":"C is correct. Non-restrictive clause about 'the rezoning plan' (a thing) — 'which' is required.  A — 'that' is not used in non-restrictive clauses.  B — 'who' refers to people.  D — 'whose' shows possession.","stem":"The council approved the rezoning plan, ______ had been the subject of community debate for over three years.  Which relative pronoun is correct?"},{"choices":{"C":"whose","D":"who","B":"which","A":"that"},"n":20,"stem":"The archaeologist found fragments of pottery ______ style matched examples from a civilization thought to be extinct.  Which relative pronoun is correct?","why":"C is correct. 'Whose style matched examples' — 'whose' shows that the style belongs to the pottery fragments. 'Whose' correctly indicates possession for a non-human noun.  A — 'that style matched' is grammatically incorrect.  B — 'which style matched' is grammatically incorrect.  D — 'who' refers to people.","slug":"gri-mod-sat-g19-1-20","ans":"C"},{"n":21,"choices":{"C":"who's","D":"which","A":"whose","B":"that"},"ans":"A","why":"A is correct. 'Whose effects were felt immediately' — 'whose' shows that the effects belong to the policy. Non-restrictive clause about a thing.  B — 'that' cannot show possession.  C — 'who's' is a contraction for 'who is,' not possessive.  D — 'which effects' is grammatically incorrect.","stem":"The policy, ______ effects were felt immediately, was repealed within six months of its passage.  Which relative pronoun is correct?","slug":"gri-mod-sat-g19-1-21"},{"ans":"C","slug":"gri-mod-sat-g19-1-22","why":"C is correct. 'The interview had not been conducted in their first language for the participants' — the participants are the indirect object of the preposition 'for.' 'For whom' correctly maintains the preposition and the object form.  A — 'who' is the subject form.  B — 'whose' shows possession.  D — 'that' is informal and loses the preposition.","stem":"The researchers relied on participants ______ the interview had not been conducted in their first language.  Which relative pronoun correctly completes this sentence?","n":22,"choices":{"A":"who","B":"whose","C":"for whom","D":"that"}},{"stem":"The foundation announced a new prize for scientists ______ discoveries have had measurable public health benefits.  Which relative pronoun is correct?","slug":"gri-mod-sat-g19-1-23","why":"A is correct. 'Whose discoveries have had measurable benefits' — 'whose' shows that the discoveries belong to the scientists.  B — 'who' cannot show possession.  C — 'whom' is the object form.  D — 'which' refers to things.","ans":"A","choices":{"A":"whose","B":"who","C":"whom","D":"which"},"n":23},{"choices":{"C":"that","D":"A or B","A":"where","B":"in which"},"n":24,"why":"D is correct. Both 'where' and 'in which' correctly introduce a relative clause of place. 'The neighborhood where...' and 'the neighborhood in which...' are both grammatically correct, with 'in which' being more formal.  A — 'where' alone is correct.  B — 'in which' alone is correct.  C — 'that the incident occurred' is missing the preposition 'in.'","stem":"The neighborhood ______ the incident occurred has since undergone significant revitalization.  Which relative phrase is correct?","ans":"D","slug":"gri-mod-sat-g19-1-24"},{"stem":"The manuscript, ______ pages had been damaged by moisture, required extensive conservation before it could be digitized.  Which relative pronoun is correct?","why":"A is correct. 'Whose pages had been damaged by moisture' — 'whose' shows that the pages belong to the manuscript. Non-restrictive clause about a thing.  B — 'which pages' is grammatically incorrect.  C — 'that' is not used in non-restrictive clauses and cannot show possession.  D — 'who' refers to people.","slug":"gri-mod-sat-g19-1-25","ans":"A","choices":{"D":"who","C":"that","B":"which","A":"whose"},"n":25}]}],"name":"Relative Clauses & Subordination","id":"g19"},{"id":"g110","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Mixed Grammar Review. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"n":1,"choices":{"C":"is","D":"have been","B":"were","A":"are"},"ans":"C","stem":"The collection of artifacts discovered at the site ______ now on display at the national museum.  Which verb form is correct?","why":"C is correct. Strip 'of artifacts discovered at the site.' The subject is 'collection' (singular). 'Is' is correct.  A — 'are' agrees with 'artifacts,' not the subject.  B — 'were' is past plural.  D — 'have been' is plural present perfect.","slug":"gri-mod-sat-g110-1-1"},{"choices":{"A":"No change needed.","B":"field, and collected","D":"field collecting","C":"field; they collected"},"n":2,"why":"C is correct. The original is a comma splice — two independent clauses joined by only a comma. A semicolon correctly separates them.  A — the original is a comma splice.  B — 'and collected' drops the subject 'they,' making the second clause not parallel.  D — 'field collecting' makes 'collecting' a participial phrase modifying 'team,' losing the original meaning.","slug":"gri-mod-sat-g110-1-2","stem":"The expedition team spent three weeks in the field, they collected over four hundred specimens for analysis.  Which revision corrects this sentence?","ans":"C"},{"n":3,"choices":{"B":"several inconsistencies were identified by the auditor.","A":"the auditor identified several inconsistencies.","C":"identification of several inconsistencies was made.","D":"several inconsistencies became apparent."},"ans":"A","slug":"gri-mod-sat-g110-1-3","why":"A is correct. 'Reviewing the budget carefully' is performed by the auditor. The main clause must open with 'the auditor.'  B — 'several inconsistencies' cannot review the budget.  C — 'identification' cannot review the budget.  D — 'several inconsistencies' cannot review the budget.","stem":"Reviewing the budget carefully, ______  Which choice avoids a dangling modifier?"},{"ans":"B","stem":"The curriculum was designed to challenge students intellectually, to develop their collaborative skills, ______.  Which choice maintains parallel structure?","why":"B is correct. The list uses 'to + verb' infinitives: 'to challenge,' 'to develop.' The third item must be 'to prepare.'  A — 'preparing' is a gerund.  C — 'preparation' is a noun phrase.  D — 'their preparation' is a noun phrase.","slug":"gri-mod-sat-g110-1-4","n":4,"choices":{"B":"and to prepare them for professional environments.","A":"and preparing them for professional environments.","D":"and their preparation for professional environments.","C":"and preparation for professional environments."}},{"why":"B is correct. 'By the time the new director arrived' signals that the budget deficits occurred before the arrival. Past perfect 'had experienced' is correct.  A — simple past does not clarify the sequence.  C — 'was experiencing' implies the deficits were ongoing at the time of arrival.  D — 'has experienced' is present perfect.","slug":"gri-mod-sat-g110-1-5","stem":"By the time the new director arrived, the organization ______ three consecutive years of budget deficits.  Which verb form is correct?","ans":"B","choices":{"A":"experienced","B":"had experienced","D":"has experienced","C":"was experiencing"},"n":5},{"slug":"gri-mod-sat-g110-1-6","choices":{"A":"it","B":"they","D":"one","C":"he"},"n":6,"stem":"The university announced that ______ would expand enrollment in its engineering programs by fifteen percent.  Which pronoun is correct?","why":"A is correct. 'The university' is a singular institutional entity. 'It' is the correct pronoun.  B — 'they' is plural.  C — 'he' has no antecedent.  D — 'one' is impersonal and does not refer back to 'the university.'","ans":"A"},{"why":"C is correct. 'Whose ratification required approval' — 'whose' shows that the ratification belongs to the treaty. Non-restrictive clause about a thing.  A — 'who's' is a contraction.  B — 'which ratification' is grammatically incorrect.  D — 'that' cannot show possession and is not used in non-restrictive clauses.","slug":"gri-mod-sat-g110-1-7","stem":"The treaty, ______ ratification required approval from twelve separate member states, took four years to enter into force.  Which relative pronoun is correct?","ans":"C","choices":{"B":"which","A":"who's","C":"whose","D":"that"},"n":7},{"stem":"The analysis revealed three significant trends: declining consumer confidence ______ rising production costs, and increasing regulatory pressure.  Which punctuation is correct?","slug":"gri-mod-sat-g110-1-8","why":"D is correct. In a list of three items following a colon, commas separate each item: 'declining consumer confidence, rising production costs, and increasing regulatory pressure.'  A — 'and' before the second item would make this appear to be a two-item list.  B — a semicolon in a simple list without internal commas is non-standard.  C — a dash before the second item disrupts the list structure.","ans":"D","choices":{"C":"confidence —","D":"confidence,","B":"confidence; and","A":"confidence and"},"n":8},{"choices":{"B":"were","A":"was","D":"has been","C":"is"},"n":9,"why":"B is correct. With 'neither...nor,' the verb agrees with the closest subject. 'Board members' is plural, so 'were' is correct.  A — 'was' agrees with 'CEO,' not the closer 'board members.'  C — 'is' is singular present.  D — 'has been' is singular present perfect.","slug":"gri-mod-sat-g110-1-9","stem":"Neither the CEO nor the board members ______ willing to accept responsibility for the data breach.  Which verb form is correct?","ans":"B"},{"n":10,"choices":{"B":"was","A":"is","D":"be","C":"will be"},"ans":"D","slug":"gri-mod-sat-g110-1-10","why":"D is correct. 'Moved that' triggers the subjunctive. The base form 'be' is required.  A — 'is' is indicative present.  B — 'was' is indicative past.  C — 'will be' is future indicative.","stem":"The committee moved that the motion ______ tabled until the next meeting.  Which verb form reflects the subjunctive mood?"},{"choices":{"D":"however, the sample size was larger than expected.","C":"the sample size, however was larger than expected.","A":"however the sample size was larger than expected.","B":"but, the sample size was larger than expected."},"n":11,"why":"D is correct. After a semicolon, a complete independent clause is required. 'However' as a conjunctive adverb needs a comma after it: 'however, the sample size was larger than expected.'  A — 'however the sample size' omits the required comma after 'however.'  B — 'but' cannot follow a semicolon; 'but' is a coordinating conjunction used with a comma.  C — 'the sample size, however was' omits the comma after 'however.'","stem":"The survey was conducted over three weeks; ______  Which choice correctly continues after the semicolon?","ans":"D","slug":"gri-mod-sat-g110-1-11"},{"ans":"A","stem":"The board presented its findings to investors ______.  Which revision correctly places 'only' to mean the findings were presented to investors and no one else?","slug":"gri-mod-sat-g110-1-12","why":"A is correct. 'Only to investors' modifies the recipients — the findings were shared exclusively with investors.  B — 'only presented' means presenting was the only thing the board did.  C — 'Only the board' means the board was the only entity that presented.  D — 'its only findings' means there was only one set of findings.","n":12,"choices":{"A":"The board presented its findings only to investors.","B":"The board only presented its findings to investors.","C":"Only the board presented its findings to investors.","D":"The board presented its only findings to investors."}},{"slug":"gri-mod-sat-g110-1-13","stem":"The firm and its subsidiary both submitted ______ quarterly reports to the regulatory agency on time.  Which form is correct?","why":"B is correct. 'The firm and its subsidiary' is a compound subject (two entities). The plural possessive 'their' is correct.  A — 'its' is singular.  C — 'it's' is a contraction.  D — 'there' is an adverb.","ans":"B","choices":{"A":"its","B":"their","D":"there","C":"it's"},"n":13},{"choices":{"A":"attending to detail","B":"her attention to detail","D":"having attention to detail","C":"the way she attends to detail"},"n":14,"stem":"The director is known for her commitment to the staff, ______, and dedication to the mission.  Which choice maintains parallel structure?","why":"B is correct. The list uses possessive noun phrases: 'her commitment,' 'her dedication.' The second item must also be a possessive noun phrase: 'her attention to detail.'  A — 'attending to detail' is a gerund.  C — 'the way she attends' is a noun clause.  D — 'having attention' is a participial phrase.","ans":"B","slug":"gri-mod-sat-g110-1-14"},{"slug":"gri-mod-sat-g110-1-15","why":"B is correct. A colon after 'the decision' (a complete clause) formally introduces the list of reasons.  A — a comma before a formal list following a complete clause is non-standard.  C — a semicolon cannot introduce a list that is not an independent clause.  D — a dash is informal.","stem":"The board cited three reasons for the decision ______ declining revenue, increased competition, and failure to meet quarterly targets.  Which punctuation is correct?","ans":"B","choices":{"B":"decision:","A":"decision,","C":"decision;","D":"decision —"},"n":15},{"choices":{"B":"have worked","A":"worked","C":"had been working","D":"were working"},"n":16,"stem":"The engineers ______ on the prototype for four months before the funding ran out.  Which verb form is correct?","why":"C is correct. Past perfect progressive 'had been working' shows an action in progress over time before a subsequent past event (funding running out).  A — simple past 'worked' does not show the duration.  B — 'have worked' is present perfect.  D — 'were working' is past progressive but does not emphasize prior duration.","slug":"gri-mod-sat-g110-1-16","ans":"C"},{"n":17,"choices":{"C":"have been","D":"was","A":"are","B":"were"},"ans":"D","stem":"Each of the submitted manuscripts ______ evaluated by at least two peer reviewers.  Which verb form is correct?","why":"D is correct. 'Each' is always singular. 'Was evaluated' agrees with 'each.'  A — 'are' is plural present.  B — 'were' is plural past.  C — 'have been' is plural present perfect.","slug":"gri-mod-sat-g110-1-17"},{"stem":"The artist's studio, which she had occupied for thirty years ______ was converted into a gallery after her death.  Which punctuation is correct?","why":"C is correct. The non-restrictive relative clause 'which she had occupied for thirty years' is enclosed in commas. The closing comma before 'was' is required.  A — no closing comma leaves the non-restrictive clause improperly enclosed.  B — a semicolon cannot close a relative clause.  D — a dash closing a comma-opened clause is mismatched.","slug":"gri-mod-sat-g110-1-18","ans":"C","choices":{"A":"years was","B":"years; was","D":"years — was","C":"years, was"},"n":18},{"n":19,"choices":{"D":"that","C":"whom","A":"whose","B":"who"},"ans":"A","why":"A is correct. 'Whose identities she had agreed to protect' — 'whose' shows that the identities belong to the sources.  B — 'who identities' is grammatically incorrect.  C — 'whom' is the object form and cannot show possession.  D — 'that identities' is grammatically incorrect.","slug":"gri-mod-sat-g110-1-19","stem":"The journalist spoke with sources ______ identities she had agreed to protect.  Which relative pronoun is correct?"},{"stem":"The study was praised for its rigor, it was criticized for its narrow sample.  Which revision corrects this sentence?","why":"A is correct. The original is a comma splice. A semicolon before 'however' and a comma after it correctly joins the contrasting independent clauses.  B — the original is a comma splice.  C — 'but criticized for its narrow sample' drops the subject 'it.'  D — 'but its narrow sample being criticized' is a grammatically incorrect phrase.","ans":"A","choices":{"D":"rigor, but its narrow sample being criticized.","C":"rigor, but criticized for its narrow sample.","A":"rigor; however, it was criticized for its narrow sample.","B":"No change needed."},"n":20,"slug":"gri-mod-sat-g110-1-20"},{"choices":{"B":"the city's new zoning code was shaped by the architect.","A":"the architect shaped the city's new zoning code.","C":"shaping the city's new zoning code was the architect's role.","D":"the new zoning code reflects the architect's innovation."},"n":21,"why":"A is correct. 'Known for her innovative approach' describes the architect. The main clause must open with 'the architect.'  B — 'the city's new zoning code' was not known for an innovative approach.  C — 'shaping the zoning code' was not known for an approach.  D — 'the new zoning code' was not known for an approach.","slug":"gri-mod-sat-g110-1-21","stem":"Known for her innovative approach to urban planning, ______  Which choice avoids a dangling modifier?","ans":"A"},{"ans":"A","stem":"Since the new regulations ______ effect, the number of workplace injuries has declined significantly.  Which verb form is correct?","why":"A is correct. 'Since the new regulations took effect' establishes a past starting point; 'the number of injuries has declined' uses the present perfect for the ongoing result. The 'since' clause uses simple past.  B — 'take' is present, inconsistent with the past event.  C — 'have taken' is present perfect, but 'since' clauses that introduce a specific starting point use simple past.  D — 'had taken' is past perfect, which is too complex for a simple starting point.","slug":"gri-mod-sat-g110-1-22","n":22,"choices":{"C":"have taken","D":"had taken","A":"took","B":"take"}},{"choices":{"B":", announced","A":"she announced","D":"announced","C":"— announced"},"n":23,"slug":"gri-mod-sat-g110-1-23","why":"D is correct. After the non-restrictive relative clause 'who founded the company in 1994' (enclosed in commas), the main verb follows directly: 'The CEO...announced her retirement.' No additional punctuation is needed before the verb.  A — 'she announced' repeats the subject, creating a run-on.  B — an extra comma before 'announced' is unnecessary.  C — a dash before the verb is non-standard.","stem":"The CEO, who founded the company in 1994, ______ her retirement last month.  Which choice correctly completes the sentence?","ans":"D"},{"ans":"C","stem":"The institute released a statement confirming that ______ would delay the launch until further testing was complete.  Which pronoun is correct?","why":"C is correct. 'The institute' is a singular institutional entity. 'It' is the correct pronoun.  A — 'they' is plural.  B — 'he' has no antecedent.  D — 'one' is impersonal.","slug":"gri-mod-sat-g110-1-24","n":24,"choices":{"A":"they","B":"he","C":"it","D":"one"}},{"ans":"D","why":"D is correct. A dash introduces an emphatic or abrupt explanation. On the SAT, the dash is preferred over the colon when the test signals 'emphasis' or dramatic introduction.  A — comma splice.  B — a semicolon implies two coordinate clauses; a dash signals the explanation more emphatically.  C — a colon is also grammatically correct but the dash is preferred when emphasis is the goal.","slug":"gri-mod-sat-g110-1-25","stem":"The plan had one critical flaw ______ it assumed that all stakeholders would agree voluntarily.  Which punctuation best introduces this explanatory clause for emphasis?","n":25,"choices":{"D":"plan — it","C":"plan: it","B":"plan; it","A":"plan, it"}}],"t":"mcqquiz"}],"name":"Mixed Grammar Review","group":"Dilbilgisi","eyebrow":"Gramer"},{"eyebrow":"Gramer","id":"g21","group":"Dilbilgisi","name":"Boundaries in Paragraph Context","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Boundaries in Paragraph Context. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"ans":"B","why":"B is correct. 'However' is a conjunctive adverb joining two independent clauses. It requires a semicolon before it and a comma after it: '; however, the evidence remains inconclusive.'  A — a comma before 'however' creates a comma splice.  C — a semicolon after 'however' (not before) is incorrect placement.  D — no punctuation before 'however' creates a run-on; the comma after 'remains' is also misplaced.","slug":"gri-mod-sat-g21-1-1","stem":"Marine biologists studying the migratory patterns of humpback whales in the North Atlantic have documented a striking behavioral shift over the past two decades. Whales that historically travelled in small, loosely organized pods have begun moving in larger, more coordinated groups. Researchers hypothesize that this change may be an adaptive response to increased shipping traffic, however the evidence remains inconclusive despite several years of observation.  Which choice corrects the underlined portion?","n":1,"choices":{"C":"however; the evidence remains inconclusive despite several years of observation","D":"however the evidence remains, inconclusive despite several years of observation","A":"however, the evidence remains inconclusive, despite several years of observation","B":"; however, the evidence remains inconclusive despite several years of observation"}},{"n":2,"choices":{"C":"meaningful progress has remained elusive, and local populations continue to face","D":"A or C","B":"meaningful progress has remained elusive — local populations continue to face","A":"meaningful progress has remained elusive; local populations continue to face"},"ans":"D","stem":"The restoration of the Aral Sea, once one of the world's largest lakes, has been the subject of intense international debate for more than thirty years. Engineers have proposed dozens of solutions, ranging from large-scale diversion projects to smaller, community-led water management initiatives. Despite this sustained attention, meaningful progress has remained elusive, local populations continue to face severe water shortages and deteriorating soil conditions.  Which choice corrects the underlined portion?","slug":"gri-mod-sat-g21-1-2","why":"D is correct. Both A and C correctly fix the comma splice. A semicolon alone correctly joins two independent clauses. A comma + coordinating conjunction ('and') also correctly joins two independent clauses. Both are grammatically valid.  A — semicolon correctly separates two independent clauses.  B — a dash could work but creates an informal/emphatic tone not signaled by the context.  C — comma + 'and' correctly joins two independent clauses.  D is correct because both A and C are valid."},{"slug":"gri-mod-sat-g21-1-3","choices":{"C":"Critics argue that nudge theory manipulates behavior without individuals' awareness and proponents counter","D":"Critics argue that nudge theory manipulates behavior without individuals awareness; proponents counter","A":"Critics argue that nudge theory manipulates behavior, without individuals' awareness, proponents counter","B":"Critics argue that nudge theory manipulates behavior without individuals' awareness; proponents counter"},"n":3,"why":"B is correct. Two independent clauses ('Critics argue...' and 'proponents counter...') must be separated by a semicolon. The apostrophe in 'individuals'' is also correctly placed.  A — comma alone between two independent clauses is a comma splice.  C — 'and' without a preceding comma joins two clauses as a run-on.  D — 'individuals awareness' omits the required possessive apostrophe.","stem":"The concept of 'nudge theory,' developed by behavioral economists Richard Thaler and Cass Sunstein, proposes that subtle changes in how choices are presented can significantly alter decision-making. For example, placing healthier foods at eye level in cafeterias increases their selection rate without restricting any options. Critics argue that nudge theory manipulates behavior without individuals' awareness, proponents counter that it simply makes beneficial choices easier to access.  Which choice corrects the underlined portion?","ans":"B"},{"why":"C is correct. The first independent clause is separated from the second by a semicolon. The second clause uses 'while' to correctly join the contrasting sub-clauses with a comma.  A — 'some researchers...an egalitarian society, others argue' is a comma splice within the second sentence.  B — a dash after 'community' then 'others argue' without a conjunction creates a run-on.  D — a comma after 'community' creates a comma splice between the first and second independent clauses.","slug":"gri-mod-sat-g21-1-4","stem":"Archaeological excavations at the site near Çatalhöyük have revealed evidence of a remarkably complex Neolithic society. Artifacts suggest that residents engaged in long-distance trade, produced sophisticated art, and maintained organized communal spaces within their settlements. What remains debated among scholars is the social hierarchy of the community, some researchers interpret the uniform housing structures as evidence of an egalitarian society, others argue that status distinctions were expressed through portable goods rather than architecture.  Which choice best corrects the underlined portion?","ans":"C","choices":{"B":"What remains debated among scholars is the social hierarchy of the community — some researchers interpret the uniform housing structures as evidence of an egalitarian society others argue","A":"What remains debated among scholars is the social hierarchy of the community. Some researchers interpret the uniform housing structures as evidence of an egalitarian society, others argue","C":"What remains debated among scholars is the social hierarchy of the community; some researchers interpret the uniform housing structures as evidence of an egalitarian society, while others argue","D":"What remains debated among scholars is the social hierarchy of the community, some researchers interpret the uniform housing structures as evidence of an egalitarian society; others argue"},"n":4},{"stem":"The annual review of pharmaceutical pricing regulations drew representatives from over forty countries to Geneva last spring. Delegations from lower-income nations argued for mandatory licensing provisions that would make essential medicines more affordable, wealthier nations resisted such measures, claiming they would undermine the financial incentives that drive research and development.  Which choice corrects the underlined portion?","why":"A is correct. 'While wealthier nations resisted...' turns the second clause into a subordinate clause joined to the first by the subordinating conjunction 'while,' eliminating the comma splice. The participial phrase 'claiming they would undermine' then correctly modifies 'wealthier nations.'  B — removing the comma after 'measures' creates a run-on.  C — a semicolon cannot precede a participial phrase ('claiming...'); semicolons join independent clauses.  D — 'resisting' and 'claiming' create two participial phrases with no main verb for 'wealthier nations.'","ans":"A","choices":{"B":"wealthier nations resisted such measures claiming they would undermine","A":"while wealthier nations resisted such measures, claiming they would undermine","C":"wealthier nations resisted such measures; claiming they would undermine","D":"wealthier nations, resisting such measures, claiming they would undermine"},"n":5,"slug":"gri-mod-sat-g21-1-5"},{"choices":{"C":"Some scholars place this homeland in the Pontic steppe while others propose Anatolia as the original site of dispersal, the debate has continued for over a century without resolution.","D":"Some scholars place this homeland in the Pontic steppe others propose Anatolia as the original site of dispersal; the debate has continued for over a century without resolution.","A":"Some scholars place this homeland in the Pontic steppe, others propose Anatolia as the original site of dispersal; the debate has continued for over a century without resolution.","B":"Some scholars place this homeland in the Pontic steppe; others propose Anatolia as the original site of dispersal, and the debate has continued for over a century without resolution."},"n":6,"stem":"Linguists studying the evolution of Proto-Indo-European have made considerable progress in reconstructing vocabulary related to agriculture and animal husbandry. This reconstruction suggests that early speakers of the language lived in a temperate region with distinct seasons. Some scholars place this homeland in the Pontic steppe, others propose Anatolia as the original site of dispersal, the debate has continued for over a century without resolution.  Which choice best corrects the underlined portion?","why":"B is correct. Three independent clauses are correctly punctuated: a semicolon separates the first from the second, and a comma + 'and' joins the second to the third.  A — a comma between the first and second clauses is a comma splice.  C — 'while others propose...dispersal, the debate' creates a comma splice between the second and third clauses.  D — no punctuation between the first and second clauses creates a run-on.","slug":"gri-mod-sat-g21-1-6","ans":"B"},{"why":"C is correct. A comma + coordinating conjunction 'but' correctly joins two contrasting independent clauses and signals the unexpected delay.  A — a semicolon correctly joins the clauses, but the comma before 'because' is non-standard and changes the meaning (making 'because of...' a non-restrictive modifier).  B — no punctuation between two independent clauses creates a run-on.  D — 'Funding...being allocated' is an absolute phrase that creates an awkward, incomplete structure.","slug":"gri-mod-sat-g21-1-7","stem":"The structural integrity of the coastal seawall had been a concern for municipal engineers since a partial collapse in 2018. A comprehensive assessment conducted the following year identified seventeen points of critical weakness along the barrier's northern section. Funding for the repairs was allocated in 2020, construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder.  Which choice corrects the underlined portion?","ans":"C","choices":{"A":"Funding for the repairs was allocated in 2020; construction did not begin until late 2023, because of extended contract disputes between the city and the winning bidder.","B":"Funding for the repairs was allocated in 2020 construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder.","D":"Funding for the repairs being allocated in 2020, construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder.","C":"Funding for the repairs was allocated in 2020, but construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder."},"n":7},{"n":8,"choices":{"D":"The newer models incorporate previously neglected feedback mechanisms and they yield projections that are, in some cases, twice as high as earlier estimates.","C":"A or B","B":"The newer models incorporate previously neglected feedback mechanisms; they yield projections that are, in some cases, twice as high as earlier estimates.","A":"The newer models incorporate previously neglected feedback mechanisms, yielding projections that are, in some cases, twice as high as earlier estimates."},"ans":"C","slug":"gri-mod-sat-g21-1-8","why":"C is correct. Both A and B correctly fix the comma splice. A converts the second clause into a participial phrase (A), and B separates the two independent clauses with a semicolon (B). Both are grammatically valid.  A — participial phrase 'yielding projections...' correctly modifies 'the newer models.'  B — semicolon correctly separates two independent clauses.  D — 'and they yield' without a preceding comma creates a run-on.  C is correct because both A and B are valid fixes.","stem":"Researchers at the Institute for Climate Studies published a meta-analysis of over two hundred peer-reviewed studies last October. Their synthesis revealed that projections for sea level rise had been consistently underestimated in models produced before 2015. The newer models incorporate previously neglected feedback mechanisms, they yield projections that are, in some cases, twice as high as earlier estimates.  Which choice corrects the underlined portion?"},{"n":9,"choices":{"D":"Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access — they often cannot adequately serve the populations they are meant to reach.","C":"Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access, and they often cannot adequately serve the populations they are meant to reach.","A":"All of the above","B":"Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access; they often cannot adequately serve the populations they are meant to reach."},"ans":"A","why":"A is correct. All three options correctly fix the run-on. A uses a semicolon, B uses comma + 'and,' C uses a dash (which is emphatic and appropriate here). All three are grammatically valid.  B — semicolon separates two independent clauses.  C — comma + 'and' joins two independent clauses.  D — dash before an emphatic explanation is grammatically correct.  A is correct because all three options are valid.","slug":"gri-mod-sat-g21-1-9","stem":"The expansion of community health clinics in rural areas has been widely praised as a cost-effective strategy for reducing hospital overcrowding. Advocates note that early intervention and preventive care — the primary services offered by such clinics — can dramatically reduce emergency room visits. Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access they often cannot adequately serve the populations they are meant to reach.  Which choice corrects the underlined portion?"},{"why":"B is correct. A colon after 'divide' introduces the explanation. 'While' correctly joins the two contrasting sub-clauses within the explanation.  A — three independent clauses separated by two semicolons is technically grammatical but unusual; the colon in A more clearly signals the explanatory relationship.  C — a comma after 'divide' creates a comma splice.  D — a dash introduces the explanation, but 'mainstream readers abandoned' is then joined only by a comma to the preceding clause, creating a comma splice.","stem":"The novelist's third book marked a significant departure from her earlier, more commercially accessible work. Critics who had praised her debut novel for its warmth and accessibility found the new book demanding and deliberately opaque. Sales reflected this divide, the literary community celebrated the work as a masterpiece, mainstream readers abandoned the author in large numbers.  Which choice best corrects the underlined portion?","ans":"B","choices":{"D":"Sales reflected this divide — the literary community celebrated the work as a masterpiece, mainstream readers abandoned the author in large numbers.","C":"Sales reflected this divide, the literary community celebrated the work as a masterpiece while mainstream readers abandoned the author in large numbers.","A":"Sales reflected this divide; the literary community celebrated the work as a masterpiece; mainstream readers abandoned the author in large numbers.","B":"Sales reflected this divide: the literary community celebrated the work as a masterpiece, while mainstream readers abandoned the author in large numbers."},"n":10,"slug":"gri-mod-sat-g21-1-10"},{"ans":"A","slug":"gri-mod-sat-g21-1-11","why":"A is correct. 'While others contend' converts the second main clause into a subordinate clause, correctly joining it to the first with a comma. A semicolon then separates the elaborating third clause.  B — a comma before 'others contend' (without 'while') creates a comma splice.  C — a comma before 'the net effect' creates a comma splice within the second clause.  D — 'others contending' is a participial phrase without a main verb; fragment.","stem":"Economists analyzing the long-term effects of automation on labor markets have reached divergent conclusions. Some predict catastrophic job displacement in sectors like manufacturing and transportation, others contend that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment has been neutral or even positive in most previous industrial transitions.  Which choice best corrects the underlined portion?","n":11,"choices":{"C":"others contend that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment being neutral or even positive in most previous industrial transitions.","D":"others contending that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment has been neutral or even positive.","B":"others contend that history suggests new technologies consistently generate as many positions as they eliminate; the net effect on employment has been neutral or even positive in most previous industrial transitions.","A":"while others contend that history suggests new technologies consistently generate as many positions as they eliminate; the net effect on employment has been neutral or even positive in most previous industrial transitions."}},{"slug":"gri-mod-sat-g21-1-12","ans":"D","why":"D is correct. All three options correctly fix the comma splice after 'detect them.' A semicolon, a comma + 'and,' and a dash all correctly join the two independent clauses.  A — semicolon is correct.  B — comma + 'and' is correct.  C — dash is correct.  D is correct because all three are grammatically valid.","stem":"The discovery of gravitational waves by the LIGO observatory in 2015 was hailed as one of the most significant scientific achievements of the century. Einstein had predicted their existence nearly a hundred years earlier, yet no instrument had previously been sensitive enough to detect them, the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.  Which choice corrects the underlined portion?","n":12,"choices":{"D":"All of the above","C":"yet no instrument had previously been sensitive enough to detect them — the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.","A":"yet no instrument had previously been sensitive enough to detect them; the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.","B":"yet no instrument had previously been sensitive enough to detect them, and the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved."}},{"why":"C is correct. A semicolon separates the first independent clause from the second. The introductory phrase 'without a unified reporting system' is correctly followed by a comma before the main clause.  A — a comma after 'agencies' creates a comma splice; additionally 'without a unified reporting system' lacks the required comma after it.  B — no punctuation after 'agencies' creates a run-on.  D is also correct — a period is always a valid fix for a comma splice — but A is more concise as a single sentence. On the SAT, when both are listed, the semicolon option (A) is typically preferred.","stem":"The international panel on pandemic preparedness released its final report after eighteen months of deliberation. The report outlined a series of systemic failures that had hampered the global response to recent outbreaks. Foremost among these was the lack of coordinated data-sharing between national health agencies, without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments.  Which choice corrects the underlined portion?","ans":"C","choices":{"D":"Foremost among these was the lack of coordinated data-sharing between national health agencies. Without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments.","C":"Foremost among these was the lack of coordinated data-sharing between national health agencies; without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments.","A":"Foremost among these was the lack of coordinated data-sharing between national health agencies, without a unified reporting system early warning signals were consistently overlooked or underreported by individual governments.","B":"Foremost among these was the lack of coordinated data-sharing between national health agencies without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments."},"n":13,"slug":"gri-mod-sat-g21-1-13"},{"slug":"gri-mod-sat-g21-1-14","why":"D is correct. All three options correctly fix the comma splice. A uses comma + 'but,' B uses semicolon + 'however,' C uses a semicolon alone. All are grammatically valid.  A — comma + 'but' signals contrast; correct.  B — semicolon + 'however' + comma signals contrast; correct.  C — semicolon alone separates two independent clauses; correct.  D is correct because all three are valid.","stem":"Urban planners in Copenhagen have developed a network of bicycle infrastructure that has dramatically reduced car traffic in the city center. Protected lanes, signal priority systems, and dedicated parking facilities now serve over sixty percent of commuters who choose to cycle. Other European cities have attempted to replicate this model, most lack the decades of political will and sustained investment that made Copenhagen's system viable.  Which choice corrects the underlined portion?","ans":"D","choices":{"D":"All of the above","C":"Other European cities have attempted to replicate this model; most lack the decades of political will and sustained investment that made Copenhagen's system viable.","B":"Other European cities have attempted to replicate this model; most, however, lack the decades of political will and sustained investment that made Copenhagen's system viable.","A":"Other European cities have attempted to replicate this model, but most lack the decades of political will and sustained investment that made Copenhagen's system viable."},"n":14},{"choices":{"B":"A or C","A":"the coalition's lead attorney filed for an emergency injunction because the construction timeline for two major projects had already been delayed by more than fourteen months.","C":"the coalition's lead attorney filed for an emergency injunction, and the construction timeline for two major projects had already been delayed by more than fourteen months.","D":"the coalition's lead attorney filed for an emergency injunction; the construction timeline for two major projects had already been delayed by more than fourteen months."},"n":15,"why":"B is correct. Both A and C correctly fix the comma splice. A uses 'because' to show causality, which fits the context. C uses a semicolon to separate two independent clauses. Both are grammatically valid.  A — 'because' correctly subordinates the second clause, showing the reason for the injunction.  D — semicolon correctly joins two independent clauses.  C — 'and' implies addition rather than causality; the relationship between the clauses is causal, making A more precise.  B is correct because A and C are both grammatically valid.","stem":"The legal challenge to the municipality's zoning ordinance was initiated by a coalition of property developers who argued that the new height restrictions violated existing building rights. After three hearings before the planning tribunal, the coalition's lead attorney filed for an emergency injunction, the construction timeline for two major projects had already been delayed by more than fourteen months.  Which choice corrects the underlined portion?","ans":"B","slug":"gri-mod-sat-g21-1-15"},{"slug":"gri-mod-sat-g21-1-16","n":16,"choices":{"D":"These findings have been applied in retail design, digital product interfaces, and policy nudges — critics note, however, that replication attempts have produced inconsistent results across different cultural contexts.","C":"These findings have been applied in retail design, digital product interfaces, and policy nudges, critics, however, note that replication attempts have produced inconsistent results.","A":"A or C","B":"These findings have been applied in retail design, digital product interfaces, and policy nudges; critics, however, note that replication attempts have produced inconsistent results across different cultural contexts."},"ans":"A","stem":"Psychologists studying the phenomenon of 'choice overload' have found that presenting consumers with too many options can paradoxically reduce purchasing decisions. A classic study involving jam varieties demonstrated that shoppers presented with twenty-four options were far less likely to buy than those given only six. These findings have been applied in retail design, digital product interfaces, and policy nudges, critics, however, note that replication attempts have produced inconsistent results across different cultural contexts.  Which choice corrects the underlined portion?","why":"A is correct. Both A and C correctly fix the comma splice. A uses a semicolon before 'critics'; C uses a dash before 'critics.' Both are grammatically valid fixes.  B — semicolon before the contrasting clause is correct; 'however' is correctly enclosed in commas.  D — a dash introduces the contrasting clause with emphasis; 'however' is correctly repositioned within the clause.  C — a comma after 'policy nudges' creates a comma splice.  A is correct because both A and C are valid."},{"choices":{"C":"Current models were developed in the 1990s and do not account for this feature; updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people.","D":"Because current models were developed in the 1990s and do not account for this feature, updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people.","A":"Current models, developed in the 1990s and not accounting for this feature, will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people when updated.","B":"Current models were developed in the 1990s, do not account for this feature, and updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people."},"n":17,"stem":"A team of geologists mapping the tectonic history of the Himalayan region has identified a previously unknown subduction zone beneath the southern edge of the Tibetan Plateau. The discovery has significant implications for earthquake risk modeling in northern India and Pakistan. Current models were developed in the 1990s and do not account for this feature, updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people.  Which choice corrects the underlined portion?","why":"C is correct. A semicolon separates the first independent clause from the second. The second clause 'updating them will require...' is a complete independent clause with a gerund subject.  A — restructures the sentence into a passive/complex form that changes the emphasis.  B — 'and updating them will require' adds a third parallel verb after 'developed' and 'do not account,' but 'updating them' is a gerund subject, not a parallel verb.  D — 'Because current models...do not account for this feature' is a valid causal structure but changes the relationship between the clauses.","slug":"gri-mod-sat-g21-1-17","ans":"C"},{"ans":"D","why":"D is correct. A colon after 'stricter mandates' correctly introduces the list of examples. 'And' before the final item correctly joins the two-item list within the colon's scope.  A — a semicolon before 'restaurants' is valid, but 'restaurants were required..., car washes were ordered' is still a comma splice within the second clause.  B — a dash introduces the examples but 'car washes were ordered' is joined by only a comma to 'restaurants were required,' creating a comma splice.  C — 'restaurants being required' and 'car washes ordered' are participial phrases that lack proper parallel structure.","slug":"gri-mod-sat-g21-1-18","stem":"The municipal water authority announced a series of emergency conservation measures in response to the unprecedented drought conditions that have persisted for the third consecutive summer. Residents in the affected zones were asked to limit outdoor watering and car washing. Businesses in the service sector faced stricter mandates, restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent.  Which choice best corrects the underlined portion?","n":18,"choices":{"D":"Businesses in the service sector faced stricter mandates: restaurants were required to serve water only upon request, and car washes were ordered to reduce operating hours by fifty percent.","C":"Businesses in the service sector faced stricter mandates, restaurants being required to serve water only upon request, and car washes ordered to reduce operating hours by fifty percent.","A":"Businesses in the service sector faced stricter mandates; restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent.","B":"Businesses in the service sector faced stricter mandates — restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent."}},{"choices":{"D":"She argued instead that one delegation had concealed its true demands throughout the talks — by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.","C":"All of the above","B":"She argued instead that one delegation had concealed its true demands throughout the talks: by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.","A":"She argued instead that one delegation had concealed its true demands throughout the talks; by the time the other party understood the terms it had accepted, the treaty had already been formally ratified."},"n":19,"slug":"gri-mod-sat-g21-1-19","why":"C is correct. All three options correctly fix the comma splice. A semicolon (A), colon (B), and dash (C) all correctly separate the two independent clauses. Each carries a slightly different nuance — semicolon is coordinate, colon is explanatory, dash is emphatic — but all are grammatically correct.  A — semicolon is correct.  B — colon is correct (the second clause explains 'by the time').  D — dash is correct.  C is correct because all three are valid.","stem":"The historian's account of the treaty negotiations drew on previously classified diplomatic cables obtained through a freedom of information request. Her analysis challenged the prevailing view that the agreement was reached through mutual compromise. She argued instead that one delegation had concealed its true demands throughout the talks, by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.  Which choice corrects the underlined portion?","ans":"C"},{"ans":"A","why":"A is correct. A semicolon separates the first clause from a second that lists two more findings joined by 'and.'  B — 'also spending' and 'their daytime alertness scores being' are absolute/participial phrases that create an awkward, incomplete structure.  C — a comma between the first and second clauses is a comma splice; the semicolon between the second and third clauses is correct but the opening splice remains.  D — a colon after 'screen use' incorrectly separates the subject from its predicate ('reported').","stem":"Neurologists studying sleep architecture have documented significant differences in slow-wave sleep patterns between individuals who regularly use screens in the hour before bed and those who do not. The blue light emitted by digital devices is believed to suppress melatonin production, delaying the onset of deeper sleep stages. Participants in the study who avoided screen use reported falling asleep faster, they also spent a greater proportion of the night in restorative slow-wave sleep, their daytime alertness scores were measurably higher.  Which choice best corrects the underlined portion?","n":20,"choices":{"D":"Participants in the study who avoided screen use: reported falling asleep faster, also spent a greater proportion of the night in restorative slow-wave sleep, and had measurably higher daytime alertness scores.","C":"Participants in the study who avoided screen use reported falling asleep faster, they also spent a greater proportion of the night in restorative slow-wave sleep; their daytime alertness scores were measurably higher.","A":"Participants in the study who avoided screen use reported falling asleep faster; they also spent a greater proportion of the night in restorative slow-wave sleep, and their daytime alertness scores were measurably higher.","B":"Participants in the study who avoided screen use reported falling asleep faster, also spending a greater proportion of the night in restorative slow-wave sleep, their daytime alertness scores being measurably higher."},"slug":"gri-mod-sat-g21-1-20"},{"stem":"The forensic accountant's report on the organization's financial irregularities ran to over four hundred pages. It identified a pattern of fraudulent invoices submitted by a single vendor over a period of seven years. The vendor's representative denied any wrongdoing, internal communications later obtained by investigators told a very different story, they showed a deliberate scheme to inflate contract values.  Which choice best corrects the underlined portion?","why":"D is correct. Both B and C correctly fix the comma splice. B uses comma + 'but' before the second clause and a colon to introduce the explanation. C uses a semicolon before the second clause and converts the third clause into a participial phrase.  A — 'however, showing' creates an awkward participial following a conjunctive adverb.  B — comma + 'but' signals contrast; colon introduces the elaboration. Correct.  C — semicolon separates the first two clauses; 'showing' converts the third to a participial phrase modifying 'internal communications.' Correct.  D is correct because both B and C are valid.","slug":"gri-mod-sat-g21-1-21","ans":"D","choices":{"D":"B or C","C":"The vendor's representative denied any wrongdoing; internal communications later obtained by investigators told a very different story, showing a deliberate scheme to inflate contract values.","A":"The vendor's representative denied any wrongdoing; internal communications later obtained by investigators told a very different story, however, showing a deliberate scheme to inflate contract values.","B":"The vendor's representative denied any wrongdoing, but internal communications later obtained by investigators told a very different story: they showed a deliberate scheme to inflate contract values."},"n":21},{"n":22,"choices":{"B":"When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors, a phenomenon known as 'information cascade.'","A":"When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors; this phenomenon is known as 'information cascade.'","D":"A, B, or C","C":"When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors — a phenomenon known as 'information cascade.'"},"ans":"D","stem":"The literature on organizational decision-making distinguishes between situations in which groups produce better outcomes than individuals and those in which individual judgment is more reliable. Research suggests that group deliberation tends to improve accuracy when members have access to diverse, independent information sources. When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors, this phenomenon is known as 'information cascade'.  Which choice corrects the underlined portion?","slug":"gri-mod-sat-g21-1-22","why":"D is correct. A uses a semicolon to separate two independent clauses. B converts the third element into an appositive phrase with a comma. C uses a dash before the appositive phrase for emphasis. All three correctly fix the comma splice.  A — semicolon is correct.  B — ', a phenomenon known as' is a non-restrictive appositive; correct.  C — dash before the appositive is emphatic and correct.  D is correct because all three are valid."},{"n":23,"choices":{"B":"B or C","A":"The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate, releasing greenhouse gases that create a feedback loop, further intensifying warming.","D":"The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate: this releases greenhouse gases that create a feedback loop, further intensifying warming.","C":"The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate; this releases greenhouse gases that create a feedback loop, further intensifying warming."},"ans":"B","slug":"gri-mod-sat-g21-1-23","why":"B is correct. Both B and C correctly fix the comma splice. B separates the two independent clauses with a semicolon. C uses a colon to introduce the explanation. Both are grammatically valid.  A — 'releasing greenhouse gases' converts the second clause into a participial phrase; also valid.  C — semicolon is correct.  D — colon introduces the explanation of what thawing does; correct.  B is correct because B and C are both valid. (A is also correct, but D as stated covers B and C.)","stem":"Climate scientists have long observed that the Arctic is warming at nearly four times the rate of the global average, a phenomenon referred to as 'Arctic amplification.' This accelerated warming is reshaping ecosystems, disrupting migration patterns, and raising sea levels at rates that exceed earlier projections. The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate, this releases greenhouse gases that create a feedback loop, further intensifying warming.  Which choice corrects the underlined portion?"},{"why":"A is correct. The first clause is complete: 'which are published and which are dismissed' are correctly joined by 'and' as a parallel pair. A semicolon then separates the second independent clause.  B — a semicolon inside the 'which are published, which are dismissed' pair breaks the parallel structure.  C — 'and questions about who controls' adds a third element that is not parallel to 'which findings are published' or 'which are dismissed.'  D — restructures the sentence awkwardly with a dash and creates ambiguity with 'which has become.'","slug":"gri-mod-sat-g21-1-24","stem":"Historians of science have increasingly focused on the role of institutional networks in shaping the development of scientific knowledge. Rather than treating discovery as the product of isolated genius, recent scholarship emphasizes the collaborative and often contentious social processes through which theories gain acceptance. Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed, questions about who controls these mechanisms have become central to the sociology of science.  Which choice best corrects the underlined portion?","ans":"A","choices":{"B":"Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed; questions about who controls these mechanisms have become central to the sociology of science.","A":"Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published and which are dismissed; questions about who controls these mechanisms have become central to the sociology of science.","D":"Peer review, funding structures, and disciplinary norms all play a role — determining which findings are published, which are dismissed, and raising questions about who controls these mechanisms, which has become central to the sociology of science.","C":"Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed, and questions about who controls these mechanisms have become central to the sociology of science."},"n":24},{"slug":"gri-mod-sat-g21-1-25","ans":"A","stem":"The introduction of autonomous vehicles into urban traffic systems presents both opportunities and significant regulatory challenges. Proponents argue that self-driving cars will dramatically reduce accidents caused by human error, improve fuel efficiency, and ease congestion. Skeptics point out that the technology is not yet reliable enough for widespread deployment, they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.  Which choice best corrects the underlined portion?","why":"A is correct. Both A and C correctly fix the comma splice. A uses a semicolon, C uses a dash. Both are grammatically valid.  B — semicolon correctly separates two independent clauses.  D — dash is emphatic and correct.  C — 'also raising concerns' is a participial phrase that correctly modifies 'skeptics'; this is also valid, but the question asks which choice 'best corrects' and D covers A and C.  A is correct because both A and C are valid.","n":25,"choices":{"D":"Skeptics point out that the technology is not yet reliable enough for widespread deployment — they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.","C":"Skeptics point out that the technology is not yet reliable enough for widespread deployment, also raising concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.","B":"Skeptics point out that the technology is not yet reliable enough for widespread deployment; they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.","A":"A or C"}}],"t":"mcqquiz"}]},{"eyebrow":"Gramer","group":"Dilbilgisi","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Commas — Advanced. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"stem":"The epidemiologist's report, which synthesized data from forty-three national health registries collected between 2010 and 2022, concluded that childhood vaccination rates had declined in twelve of the surveyed countries.  Which choice correctly handles the relative clause?","why":"B is correct. 'Which synthesized data from forty-three national health registries collected between 2010 and 2022' is a non-restrictive relative clause (it adds information about the specific report, not defining which report). It is enclosed in commas. 'Collected between 2010 and 2022' is a restrictive participial phrase modifying 'registries' — no commas needed there.  A — misplaces the closing comma after '2022' where one already exists; creates duplicate comma structure.  C — a comma before 'collected' incorrectly makes 'collected between 2010 and 2022' non-restrictive.  D — 'that' is used for restrictive clauses; this clause is non-restrictive (set off by commas).","slug":"gri-mod-sat-g22-1-1","ans":"B","choices":{"A":"which synthesized data from forty-three national health registries collected between 2010 and 2022,","B":"No change — the underlined portion is correct","C":"which synthesized data from forty-three national health registries, collected between 2010 and 2022","D":"that synthesized data from forty-three national health registries collected between 2010 and 2022"},"n":1},{"choices":{"D":"recommended that the case be settled out of court — citing the unpredictability of jury verdicts in cases involving complex financial instruments.","C":"No change — the underlined portion is correct","A":"recommended that the case be settled out of court; citing the unpredictability of jury verdicts in cases involving complex financial instruments.","B":"recommended that the case be settled out of court, citing the unpredictability of jury verdicts in cases involving complex financial instruments."},"n":2,"stem":"The legal team, having reviewed all submitted evidence and witness depositions, recommended that the case be settled out of court, citing the unpredictability of jury verdicts in cases involving complex financial instruments.  Which choice correctly handles the participial phrase at the end?","slug":"gri-mod-sat-g22-1-2","why":"C is correct. 'Citing the unpredictability of jury verdicts...' is a participial phrase that correctly modifies 'the legal team' and is separated from the main clause by a comma. This is the standard way to attach a participial reason or manner phrase.  A — a semicolon cannot precede a participial phrase; semicolons join independent clauses.  B — same as D; a comma before a trailing participial phrase is standard.  D — a dash is emphatic; possible but not more correct than a comma.  C is correct.","ans":"C"},{"n":3,"choices":{"C":"No change — the underlined portion is correct","D":"composed of representatives from seven member states and chaired by a senior diplomat from Brazil,","B":"composed of representatives from seven member states and chaired, by a senior diplomat from Brazil,","A":"composed of representatives from seven member states, and chaired by a senior diplomat from Brazil,"},"ans":"D","why":"D is correct. 'Composed of representatives...and chaired by a senior diplomat from Brazil' is a single non-restrictive participial phrase modifying 'the negotiating committee.' It must be closed with a comma before the main verb 'had been meeting.' A comma already precedes the phrase; the closing comma after 'Brazil' is missing in the original and is added in A.  A — a comma between 'member states' and 'and chaired' unnecessarily splits the compound participial phrase.  B — a comma after 'chaired' incorrectly interrupts the phrase.  C — the original lacks the closing comma needed to enclose the non-restrictive phrase.","slug":"gri-mod-sat-g22-1-3","stem":"The negotiating committee, composed of representatives from seven member states and chaired by a senior diplomat from Brazil had been meeting weekly since the beginning of the fiscal year.  Which choice correctly punctuates the participial phrase?"},{"slug":"gri-mod-sat-g22-1-4","why":"A is correct. 'Who had dark skin, blue eyes, and hunter-gatherer dietary habits' is a non-restrictive relative clause correctly enclosed in commas. The list within the clause ('dark skin, blue eyes, and hunter-gatherer dietary habits') is correctly punctuated with an Oxford comma.  B — omits the commas separating items in the list.  C — adds a second closing comma after 'habits,' creating a double comma before the main verb 'represents.'  D — missing the closing comma that encloses the non-restrictive clause.","stem":"Scientists studying ancient DNA extracted from a 7,000-year-old skeleton found in a cave in Spain have determined that the individual, who had dark skin, blue eyes, and hunter-gatherer dietary habits, represents a population that predates the arrival of agriculture in Western Europe.  Which choice is correct?","ans":"A","choices":{"A":"No change — the underlined portion is correct","B":"who had dark skin blue eyes and hunter-gatherer dietary habits","D":"who had dark skin, blue eyes, and hunter-gatherer dietary habits","C":"who had dark skin, blue eyes, and hunter-gatherer dietary habits,"},"n":4},{"choices":{"C":"approved the proposal to redirect funds from the parks maintenance budget to emergency infrastructure repairs, despite vocal opposition from three of its twelve members.","D":"B or C","A":"approved, despite vocal opposition from three of its twelve members, the proposal","B":"approved the proposal, despite vocal opposition from three of its twelve members, to redirect funds from the parks maintenance budget to emergency infrastructure repairs."},"n":5,"stem":"The council approved, despite vocal opposition from three of its twelve members, the proposal to redirect funds from the parks maintenance budget to emergency infrastructure repairs.  Which choice correctly punctuates this sentence?","why":"D is correct. Both B and C correctly reposition the parenthetical phrase. B places 'despite vocal opposition' after 'the proposal' and closes it before 'to redirect.' C moves 'despite vocal opposition' to the end, after the main object.  A — inserting 'despite vocal opposition from three of its twelve members' between 'approved' and 'the proposal' separates the verb from its direct object with a long interrupting phrase, which is grammatically awkward.  B — correctly encloses the parenthetical between commas after 'the proposal.'  C — places the parenthetical at the end, which is clear and correct.  D is correct because B and C are both valid.","slug":"gri-mod-sat-g22-1-5","ans":"D"},{"choices":{"A":"No change — the underlined portion is correct","B":"which would require all major corporations operating within the country to publish annual sustainability reports, and which critics argue is an undue burden on smaller enterprises that have recently incorporated","C":"which would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated","D":"that would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated"},"n":6,"stem":"The prime minister's proposal, which would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated, was tabled for a second reading.  Which choice correctly handles the compound relative clause?","slug":"gri-mod-sat-g22-1-6","why":"A is correct. The two 'which' clauses form a compound non-restrictive relative clause: 'which would require...and which critics argue...' No comma is needed between the two 'which' clauses because they are joined by 'and.' The outer commas (before 'which' and after 'incorporated') correctly enclose the entire compound clause.  B — adds a comma between the two 'which' clauses, incorrectly splitting the compound clause.  D — mixes 'that' (restrictive) with 'which' (non-restrictive) in a compound, which is grammatically inconsistent.  A is correct.","ans":"A"},{"ans":"A","why":"A is correct. 'Professor Elaine Morris' is a non-restrictive appositive for 'her mentor.' The relative clause 'who spent three decades...and whose seminal work...' further describes Morris and is also non-restrictive. A comma after 'Morris' opens the relative clause and a comma after 'linguists' closes the entire parenthetical before the period.  B — no comma after 'Morris' makes the relative clause appear restrictive.  C — no closing comma after 'linguists' leaves the non-restrictive element improperly enclosed.  D — no comma after 'Morris' is incorrect.","slug":"gri-mod-sat-g22-1-7","stem":"The author dedicated her book to her mentor, Professor Elaine Morris who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists.  Which choice correctly punctuates the appositive and relative clauses?","n":7,"choices":{"A":"Professor Elaine Morris, who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists,","B":"Professor Elaine Morris who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists,","D":"No change — the underlined portion is correct","C":"Professor Elaine Morris, who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists"}},{"n":8,"choices":{"A":"measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation,","B":"measured by the proportion of patients, who achieved full remission within twelve weeks of treatment initiation,","C":"No change — the underlined portion is correct","D":"measured by the proportion of patients who achieved full remission, within twelve weeks of treatment initiation,"},"ans":"C","stem":"The researchers noted that the drug's efficacy, measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation, was significantly higher in participants who had not previously undergone chemotherapy.  Which choice is correct?","slug":"gri-mod-sat-g22-1-8","why":"C is correct. 'Measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation' is a non-restrictive participial phrase modifying 'the drug's efficacy.' It is correctly enclosed in commas. The relative clause 'who achieved full remission within twelve
