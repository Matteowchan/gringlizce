  B is correct because A and B are both valid.","slug":"gri-mod-sat-g25-1-6"},{"n":7,"choices":{"D":"A or C","C":"Commentators from across the political spectrum, hailing the agreement as a landmark achievement, praised its scope and ambition.","A":"Hailed as a landmark achievement by commentators from across the political spectrum, the agreement was praised for its scope and ambition.","B":"Hailed as a landmark achievement, the agreement's scope and ambition were praised by commentators from across the political spectrum."},"ans":"D","slug":"gri-mod-sat-g25-1-7","why":"D is correct. Both A and C correctly fix the dangling modifier. A makes 'the agreement' the subject (it is hailed). C restructures so 'commentators' performs the action of 'hailing' in a participial phrase, with 'praised' as the main verb.  B — 'the agreement's scope and ambition' cannot be hailed as a landmark achievement.  D is correct.","stem":"After months of negotiations, the trade agreement was finally signed by representatives from all twelve member states. Hailed as a landmark achievement, commentators from across the political spectrum praised the agreement's scope and ambition.  Which revision corrects the dangling modifier?"},{"choices":{"C":"Having randomized participants into treatment and control groups, the researchers monitored their progress for eighteen months.","D":"The researchers, having been randomized into treatment and control groups, monitored participants' progress for eighteen months.","A":"A or B","B":"Having been randomized into treatment and control groups, the participants were monitored by researchers for eighteen months."},"n":8,"stem":"The clinical trial enrolled participants from fourteen hospitals across three countries. Having been randomized into treatment and control groups, researchers monitored the participants' progress for eighteen months.  Which revision correctly places the modifier?","why":"A is correct. Both A and B are grammatically correct and fix the dangling modifier. A uses the passive 'having been randomized' with 'the participants' as the subject (participants were randomized). B makes 'the researchers' the active subject who randomized participants.  D — 'the researchers' cannot be randomized into groups.  A is correct.","slug":"gri-mod-sat-g25-1-8","ans":"A"},{"ans":"C","slug":"gri-mod-sat-g25-1-9","why":"C is correct. 'Drawing on feedback' is performed by the firm (the people who drew on the feedback). The main clause must open with 'the firm' or a person equivalent.  A — 'the revised blueprints' cannot draw on feedback.  B — 'which drew on feedback' makes 'the planning committee' or 'the blueprints' the referent; 'the committee' is more likely, but committees draw on feedback in a different sense.  D — blueprints cannot draw on feedback.","stem":"The architect's firm submitted a revised design that addressed several structural concerns raised during the preliminary review. Drawing on feedback from the engineering team and the city's heritage preservation office, the revised blueprints were approved unanimously by the planning committee.  Which revision corrects the dangling modifier?","n":9,"choices":{"B":"The planning committee approved the revised blueprints unanimously, which drew on feedback from the engineering team and the heritage preservation office.","A":"The revised blueprints, drawing on feedback from the engineering team and the heritage preservation office, were approved unanimously by the planning committee.","C":"Drawing on feedback from the engineering team and the city's heritage preservation office, the firm produced revised blueprints that were approved unanimously by the planning committee.","D":"No change — the modifier correctly refers to the revised blueprints."}},{"ans":"A","why":"A is correct. 'Shocked by the evidence' must modify the person who is shocked and who takes action. A makes 'the general counsel' the shocked subject. C restructures with 'the general counsel' as an appositive. Both are valid.  C — 'the board was immediately convened' is passive; the board didn't convene itself while shocked — and the subject 'the board' may not be the one shocked (the counsel convened them).  A is correct.","slug":"gri-mod-sat-g25-1-10","stem":"The company's internal communications, obtained through a legal discovery process, revealed a pattern of deliberate misrepresentation. Shocked by the evidence, the board was immediately convened by the general counsel.  Which revision corrects the dangling modifier?","n":10,"choices":{"D":"The general counsel, shocked by the evidence, immediately convened the board.","C":"Shocked by the evidence, the board was immediately convened.","B":"Shocked by the evidence, the general counsel immediately convened the board.","A":"A or C"}},{"n":11,"choices":{"A":"The implementation timeline, citing budget constraints, was revised substantially.","B":"Budget constraints and shifting departmental priorities citing the revised implementation timeline.","C":"Citing budget constraints and shifting departmental priorities, senior officials revised the implementation timeline substantially.","D":"The implementation timeline was revised substantially by senior officials, who cited budget constraints and shifting departmental priorities."},"ans":"C","stem":"The policy brief was distributed to all department heads by the chief of staff on Thursday morning. Citing budget constraints and shifting departmental priorities, the implementation timeline was revised substantially.  Which revision is correct?","slug":"gri-mod-sat-g25-1-11","why":"C is correct. 'Citing budget constraints' is performed by senior officials (people who cite reasons). The main clause must open with a person subject.  A — 'the implementation timeline' cannot cite budget constraints.  B — fragment with no main verb.  D — also acceptable but A is the simplest fix. On the SAT, A is the primary correct answer."},{"ans":"A","why":"A is correct. Both A and C correctly fix the dangling modifier. A makes 'the project's eventual funding' the subject (the funding underscores significance). C restructures with 'the project' as subject and 'rejected' as a non-restrictive participial.  C — 'the project was recognized as significant by its eventual funding' is acceptable but awkward; 'funding' recognizing significance is strained.  A is correct because A and C are valid.","slug":"gri-mod-sat-g25-1-12","stem":"The research proposal had been submitted to three different funding agencies over a period of two years. Rejected twice before finally receiving approval, the significance of the project was underscored by its eventual funding.  Which revision is correct?","n":12,"choices":{"D":"The project, rejected twice before finally receiving approval, was ultimately funded, underscoring its significance.","C":"Rejected twice before finally receiving approval, the project was recognized as significant by its eventual funding.","B":"Rejected twice before finally receiving approval, the project's eventual funding underscored its significance.","A":"A or C"}},{"stem":"Several community members expressed concern about the proposed highway expansion at last month's public hearing. Having reviewed hundreds of noise and emissions studies, the case for the project was ultimately deemed insufficient by independent experts.  Which revision is correct?","slug":"gri-mod-sat-g25-1-13","why":"B is correct. 'Having reviewed hundreds of noise and emissions studies' is performed by the independent experts. The main clause must open with 'independent experts.'  A — 'the project's case' cannot review studies.  C — no main verb; fragment.  D — 'the case' cannot review studies.","ans":"B","choices":{"A":"Having reviewed hundreds of noise and emissions studies, the project's case was deemed insufficient by independent experts.","B":"Having reviewed hundreds of noise and emissions studies, independent experts ultimately found the case for the project insufficient.","C":"Independent experts, having reviewed hundreds of studies, and finding the case insufficient.","D":"The case for the project, having reviewed hundreds of noise and emissions studies, was deemed insufficient."},"n":13},{"slug":"gri-mod-sat-g25-1-14","ans":"D","why":"D is correct. Both A and C correctly fix the dangling modifier. A makes 'the system' the subject of the corrected sentence. C uses a non-restrictive relative clause to describe the system.  B — 'managers' cannot be intended to increase transparency (the system is intended to).  D is correct.","stem":"The new performance evaluation system was introduced companywide after a successful pilot in the eastern division. Intended to increase transparency and reduce bias in promotion decisions, managers initially resisted the change.  Which revision is correct?","n":14,"choices":{"B":"Intended to increase transparency and reduce bias in promotion decisions, managers initially resisted the system.","A":"Intended to increase transparency and reduce bias in promotion decisions, the system was initially resisted by managers.","C":"Managers initially resisted the system, which was intended to increase transparency and reduce bias in promotion decisions.","D":"A or C"}},{"ans":"D","stem":"The team of environmental engineers spent six months evaluating the contamination levels at the former industrial site. After completing a comprehensive assessment of soil and groundwater samples, a remediation plan was presented to the city council.  Which revision is correct?","why":"D is correct. Only A correctly fixes the dangling modifier. 'After completing a comprehensive assessment' is performed by the engineers. The main clause must open with 'the engineers.'  B — passive; 'the remediation plan' did not complete the assessment.  C — 'the remediation plan' cannot complete an assessment.  D is correct (A is the only valid fix).","n":15,"choices":{"D":"A is the only correct revision.","C":"The remediation plan, after completing a comprehensive assessment, was presented to the city council.","A":"After completing a comprehensive assessment of soil and groundwater samples, the engineers presented a remediation plan to the city council.","B":"After completing a comprehensive assessment, the remediation plan was presented by the engineers to the city council."},"slug":"gri-mod-sat-g25-1-15"},{"why":"B is correct. 'Working in collaboration' is performed by the logistics coordinator (a person). The main clause must open with 'the logistics coordinator.'  A — supplies cannot work in collaboration.  C — 'worked' is incorrect passive construction and supplies cannot collaborate.  D — no main verb; fragment.","slug":"gri-mod-sat-g25-1-16","stem":"The relief organization's logistics coordinator managed the distribution of supplies across twelve refugee camps. Working in collaboration with local NGOs and international donors, the supplies reached over forty thousand families within the first week.  Which revision is correct?","ans":"B","choices":{"B":"Working in collaboration with local NGOs and international donors, the logistics coordinator ensured that supplies reached over forty thousand families within the first week.","A":"Working in collaboration with local NGOs and international donors, the supplies reached over forty thousand families within the first week.","C":"The supplies, worked in collaboration with local NGOs and international donors, reached over forty thousand families.","D":"The logistics coordinator working in collaboration with local NGOs and international donors, and reaching over forty thousand families."},"n":16},{"slug":"gri-mod-sat-g25-1-17","why":"A is correct. 'Representing a significant diplomatic achievement' modifies 'the agreement' — this is the subject immediately following the participial phrase. The agreement represents the achievement. The modifier is correctly placed.  B — same as D; also correct.  C — the summit concluded, but the joint declaration (the agreement) represents the achievement, not the summit itself.  D — 'analysts' do not represent the diplomatic achievement.  D is the best answer.","stem":"The summit concluded with a joint declaration signed by all twenty-three participating governments. Representing a significant diplomatic achievement, the agreement was celebrated as a historic milestone by analysts who had followed the negotiations closely.  Is the modifier correctly placed?","ans":"A","choices":{"D":"No — 'representing a significant diplomatic achievement' dangling-modifies 'analysts.'","C":"No — 'representing a significant diplomatic achievement' modifies 'the summit'; the sentence should read: 'The summit, representing a significant diplomatic achievement, concluded with a joint declaration...'","A":"Yes — the agreement can represent a diplomatic achievement.","B":"Yes — 'representing a significant diplomatic achievement' correctly modifies 'the agreement.'"},"n":17},{"ans":"D","stem":"The pediatric hospital launched a campaign to increase vaccination rates in the region following a measles outbreak. Targeting schools, community centers, and local media outlets, awareness of the campaign spread quickly throughout the district.  Which revision is correct?","slug":"gri-mod-sat-g25-1-18","why":"D is correct. Both A and B correctly fix the modifier. A makes 'the hospital' the subject (it targeted). B makes 'the campaign' the subject (the campaign itself targeted outlets). Both are logically and grammatically valid.  C — 'awareness' cannot target schools or media outlets.  D is correct.","n":18,"choices":{"D":"A or B","C":"Awareness of the campaign, targeting schools, community centers, and local media outlets, spread quickly throughout the district.","A":"Targeting schools, community centers, and local media outlets, the hospital quickly spread awareness of the campaign throughout the district.","B":"Targeting schools, community centers, and local media outlets, the campaign quickly spread throughout the district."}},{"stem":"Completed after seven years of delays, the bridge immediately reduced commute times for over eighty thousand daily travelers.  Is the modifier correctly placed?","slug":"gri-mod-sat-g25-1-19","why":"C is correct. 'Completed after seven years of delays' is a past participial phrase modifying 'the bridge.' Bridges can be completed — this is a passive participial construction. The modifier is correctly placed because 'the bridge' immediately follows.  A — bridges are regularly the objects of completion; the passive participial is correct.  B — 'having been completed' is an alternative but not more correct.  D — the modifier precedes 'the bridge,' not 'commute times.'","ans":"C","choices":{"A":"No — 'completed after seven years of delays' dangles; the bridge cannot be completed.","B":"No — the modifier should read 'having been completed after seven years of delays.'","C":"Yes — 'completed after seven years of delays' correctly modifies 'the bridge.'","D":"No — 'completed after seven years of delays' modifies 'commute times.'"},"n":19},{"why":"A is correct. Both A and C correctly fix the dangling modifier by making 'the software engineers' or 'the engineers' the subject performing the working.  C — 'the application's launch' cannot work through rounds of debugging.  A is correct.","slug":"gri-mod-sat-g25-1-20","stem":"The software engineers stayed late every evening for two weeks to finalize the application before launch. Working through multiple rounds of debugging and user testing, the application's launch was delayed by only forty-eight hours despite the complexity of the issues encountered.  Which revision is correct?","ans":"A","choices":{"B":"Working through multiple rounds of debugging and user testing, the software engineers delayed the launch by only forty-eight hours despite the complexity of the issues encountered.","A":"A or C","C":"The application's launch, working through multiple rounds of debugging and user testing, was delayed by only forty-eight hours.","D":"Working through multiple rounds of debugging and user testing, the engineers ensured the launch was delayed by only forty-eight hours."},"n":20},{"ans":"A","stem":"The financial regulator released its quarterly enforcement bulletin last Thursday. Identifying widespread non-compliance with the new disclosure requirements, the bulletin was issued as a formal warning to all registered institutions.  Is the modifier correctly placed?","slug":"gri-mod-sat-g25-1-21","why":"A is correct. Both A and C are correct. A regulatory bulletin can 'identify' patterns — this is a common and accepted usage in institutional English. The bulletin is the document that identifies the non-compliance. 'Identifying widespread non-compliance with the new disclosure requirements' correctly modifies 'the bulletin.'  C — documents regularly 'identify,' 'reveal,' 'highlight,' and 'indicate' findings; the participial is grammatically acceptable.  A is correct.","n":21,"choices":{"B":"Yes — 'identifying widespread non-compliance' correctly modifies 'the bulletin.'","A":"A and C","D":"Yes — a bulletin can identify patterns of non-compliance; this is standard usage.","C":"No — 'identifying' dangles; the bulletin cannot identify non-compliance."}},{"choices":{"D":"The vehicle, awarded the highest safety rating in its category for three consecutive years, was praised by consumer advocates for its reliability and crashworthiness.","C":"All of the above","A":"Awarded the highest safety rating in its category for three consecutive years, the vehicle was praised by consumer advocates for its reliability and crashworthiness.","B":"Consumer advocates praised the vehicle, which had been awarded the highest safety rating in its category for three consecutive years, for its reliability and crashworthiness."},"n":22,"stem":"Awarded the highest safety rating in its category for three consecutive years, consumer advocates praised the vehicle for its reliability and crashworthiness. iling-to-detect action.  B — 'the board of trustees' could also have failed to detect; B is plausible but changes who makes the recommendation.  C is correct because A and C are both valid.","slug":"gri-mod-sat-g25-1-25","ans":"C"}]}]},{"name":"Modifiers — Advanced","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Modifiers — Advanced. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"ans":"A","slug":"gri-mod-sat-g26-1-1","why":"A is correct. The list uses 'to + verb' infinitives: 'to identify,' 'to provide.' The third item must be 'to connect.'  B — 'connect' without 'to' breaks the infinitive pattern.  C — 'connection' is a noun, breaking the pattern.  D — 'as well as to connect' uses a non-parallel connector.","stem":"The foundation's mission is to identify promising researchers at an early stage of their careers, to provide them with funding and mentorship, and connecting them with professional networks that can sustain their work over the long term.  Which choice maintains parallel structure?","n":1,"choices":{"D":"as well as to connect them with professional networks that can sustain their work over the long term.","C":"and connection with professional networks that can sustain their work over the long term.","B":"and connect them with professional networks that can sustain their work over the long term.","A":"and to connect them with professional networks that can sustain their work over the long term."}},{"choices":{"B":"misrepresenting financial projections, and to manipulate earnings data prior to the quarterly report.","A":"for misrepresenting financial projections, and for manipulating earnings data prior to the quarterly report.","C":"its misrepresentation of financial projections, and its manipulation of earnings data prior to the quarterly report.","D":"to misrepresent financial projections, and the manipulation of earnings data prior to the quarterly report."},"n":2,"stem":"The report criticized the company's failure to disclose material risks, misrepresenting financial projections, and the manipulation of earnings data prior to the quarterly report.  Which choice maintains parallel structure?","why":"C is correct. The list follows 'failure to disclose' — all three items should be parallel noun phrases functioning as objects of 'failure': 'failure to disclose material risks,' 'its misrepresentation,' 'its manipulation.' Among the options, C provides parallel possessive noun phrases.  A — shifts to prepositional phrases ('for misrepresenting'), breaking the pattern.  B — 'misrepresenting' (gerund) and 'to manipulate' (infinitive) are not parallel.  D — mixes infinitive and noun phrase.","slug":"gri-mod-sat-g26-1-2","ans":"C"},{"n":3,"choices":{"B":"clarity in complex interpretations, and meticulous documentation throughout the project.","A":"for the clarity she brought to complex interpretations, and for maintaining meticulous documentation throughout the project.","C":"A or C","D":"for clarity in complex interpretations, and for meticulous documentation throughout the project."},"ans":"C","stem":"The supervisor's annual review praised the analyst for her thoroughness in data collection, for the clarity she brought to complex interpretations, and maintaining meticulous documentation throughout the project.  Which choice maintains parallel structure?","why":"C is correct. The list uses 'for + noun phrase' or 'for + gerund phrase.' A provides 'for the clarity she brought' and 'for maintaining.' C provides 'for clarity' and 'for meticulous documentation.' Both maintain the 'for + [phrase]' pattern.  B — drops the 'for,' breaking the parallel structure.  C is correct because A and C are both valid.","slug":"gri-mod-sat-g26-1-3"},{"why":"A is correct. The list uses 'how + clause': 'how residents organized' and 'how communal decisions were made.' The third item must also be 'how + clause': 'how spiritual practices were integrated.'  B — 'spiritual practices' integration' is a noun phrase, breaking the 'how' clause pattern.  C — shifts to noun phrases entirely, losing the 'how + clause' pattern.  D — 'the integration of spiritual practices' is a noun phrase, breaking the pattern.","slug":"gri-mod-sat-g26-1-4","stem":"Ethnographers studying the community documented how residents organized their time around agricultural cycles, how communal decisions were made by consensus, and the way spiritual practices were integrated into daily routines.  Which choice maintains parallel structure?","ans":"A","choices":{"C":"communal decision-making by consensus, and spiritual practices integrated into daily routines.","D":"how communal decisions were made by consensus, and the integration of spiritual practices into daily routines.","B":"how communal decisions were made by consensus, and spiritual practices' integration into daily routines.","A":"how communal decisions were made by consensus, and how spiritual practices were integrated into daily routines."},"n":4},{"stem":"The expedition's success depended on the team's physical endurance, the precision with which they navigated the difficult terrain, and trusting the judgment of local guides who knew the mountain's changing conditions.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g26-1-5","why":"C is correct. The list uses possessive noun phrases: 'the team's physical endurance,' 'the precision with which they navigated.' The third item must continue with a noun phrase of similar form: 'the trust they placed in local guides.' B maintains the 'the + noun + subordinate element' structure.  A — 'precise navigation' drops the article 'the' and the relative structure.  B — shifts to gerund phrases.  D — changes to possessive pronouns ('their'), which slightly alters the structure from the opening 'the team's.'","ans":"C","choices":{"A":"precise navigation of difficult terrain, and trust in the judgment of local guides who knew the mountain's changing conditions.","B":"navigating difficult terrain with precision, and trusting the judgment of local guides who knew the mountain's changing conditions.","D":"their precise navigation of difficult terrain, and their trust in the judgment of local guides who knew the mountain's changing conditions.","C":"the precision with which they navigated the difficult terrain, and the trust they placed in local guides who knew the mountain's changing conditions."},"n":5},{"why":"D is correct. The list uses 'would not + verb' or 'would + verb': 'would not contaminate,' 'would not...disrupt.' The third item must follow the same modal pattern: 'would meet.'  A — 'meeting' is a gerund, breaking the modal verb pattern.  B — shifts to 'air quality standards would be met' (passive), breaking the active 'would' pattern.  C — 'would not significantly disrupting' is grammatically incorrect.","slug":"gri-mod-sat-g26-1-6","stem":"The environmental impact assessment required developers to demonstrate that the proposed facility would not contaminate local water sources, would not significantly disrupt wildlife migration patterns, and the air quality standards in the surrounding communities would be met.  Which choice maintains parallel structure?","ans":"D","choices":{"B":"would not significantly disrupt wildlife migration patterns, and air quality standards in the surrounding communities would be met.","A":"would not significantly disrupt wildlife migration patterns, and meeting air quality standards in the surrounding communities.","C":"would not significantly disrupting wildlife migration patterns, and would meet air quality standards in the surrounding communities.","D":"would not significantly disrupt wildlife migration patterns, and would meet air quality standards in the surrounding communities."},"n":6},{"choices":{"D":"strengthening the supply chain through vertical integration, and reducing the company's carbon footprint by forty percent before 2030.","C":"the strengthening of the supply chain through vertical integration, and to reduce the com lause; 'the cultural sensitivity it demonstrated' is a noun phrase; inconsistent.  D is correct — B is the only fully parallel option."},{"choices":{"A":"disabled the security cameras in the main corridor, and accessed the safe using a stolen keycard.","B":"had disabled the security cameras in the main corridor, and the safe was accessed using a stolen keycard.","C":"disabling the security cameras in the main corridor, and accessing the safe using a stolen keycard.","D":"had disabled the security cameras in the main corridor, and had accessed the safe using a stolen keycard."},"n":19,"stem":"The investigation revealed that the suspect had entered the building through an unlocked service entrance, had disabled the security cameras in the main corridor, and the safe was accessed using a stolen keycard.  Which choice maintains parallel structure?","why":"D is correct. The list uses 'had + past participle': 'had entered,' 'had disabled.' The third item must be 'had accessed.'  A — drops 'had,' using simple past; inconsistent with the sequence of actions.  B — shifts to passive voice with 'the safe was accessed.'  C — shifts to gerunds.","slug":"gri-mod-sat-g26-1-19","ans":"D"},{"ans":"A","slug":"gri-mod-sat-g26-1-20","why":"A is correct. The list uses 'to + verb' infinitives: 'to analyze,' 'to situate.' The third must be 'to construct.'  B — shifts to gerunds.  C — mixes infinitive 'to situate' with gerund 'constructing.'  D — 'the construction of' is a noun phrase.","stem":"The professor argued that the course would equip students to analyze primary sources critically, to situate historical events within their broader social and economic contexts, and they would learn to construct evidence-based arguments that engage with existing scholarship.  Which choice maintains parallel structure?","n":20,"choices":{"D":"to situate historical events within their broader social and economic contexts, and the construction of evidence-based arguments that engage with existing scholarship.","C":"to situate historical events within their broader social and economic contexts, and constructing evidence-based arguments that engage with existing scholarship.","A":"to situate historical events within their broader social and economic contexts, and to construct evidence-based arguments that engage with existing scholarship.","B":"situating historical events within their broader social and economic contexts, and constructing evidence-based arguments that engage with existing scholarship."}},{"slug":"gri-mod-sat-g26-1-21","why":"A is correct. The list follows a colon and uses gerunds: 'restoring,' 'protecting.' The third must also be a gerund: 'reducing.'  B — shifts to infinitives 'to protect' and bare 'reduce.'  C — shifts to infinitives 'to protect' and 'to reduce.'  D — shifts to noun phrases.","stem":"The conservation strategy outlines three priorities: restoring degraded ecosystems through targeted reforestation programs, protecting critically endangered species by expanding wildlife corridors, and to reduce illegal poaching through stricter enforcement and community-based monitoring.  Which choice maintains parallel structure?","ans":"A","choices":{"D":"the protection of critically endangered species by expanding wildlife corridors, and the reduction of illegal poaching through stricter enforcement and community-based monitoring.","C":"to protect critically endangered species by expanding wildlife corridors, and to reduce illegal poaching through stricter enforcement and community-based monitoring.","A":"protecting critically endangered species by expanding wildlife corridors, and reducing illegal poaching through stricter enforcement and community-based monitoring.","B":"to protect critically endangered species by expanding wildlife corridors, and reduce illegal poaching through stricter enforcement and community-based monitoring."},"n":21},{"ans":"B","stem":"The journalist's investigation uncovered evidence of three forms of misconduct: the falsification of expense reports, the acceptance of undisclosed payments from lobbyists, and that contracts were awarded to companies with which senior officials had undisclosed financial ties.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g26-1-22","why":"B is correct. The list follows a colon and uses 'the + noun phrase': 'the falsification of expense reports,' 'the acceptance of undisclosed payments.' The third must be 'the awarding of contracts.'  A — 'contracts were awarded' is an independent clause, breaking the noun phrase pattern.  C — shifts to gerunds.  D — 'the fact that' introduces a noun clause.","n":22,"choices":{"A":"the acceptance of undisclosed payments from lobbyists, and contracts were awarded to companies with which senior officials had undisclosed financial ties.","B":"the acceptance of undisclosed payments from lobbyists, and the awarding of contracts to companies with which senior officials had undisclosed financial ties.","C":"accepting undisclosed payments from lobbyists, and awarding contracts to companies with which senior officials had undisclosed financial ties.","D":"the acceptance of undisclosed payments from lobbyists, and the fact that contracts were awarded to companies with which senior officials had undisclosed financial ties."}},{"slug":"gri-mod-sat-g26-1-23","n":23,"choices":{"A":"and to vote for candidates who prioritize public interest over private gain.","B":"and vote for candidates who prioritize public interest over private gain.","C":"and the voting for candidates who prioritize public interest over private gain.","D":"and they should vote for candidates who prioritize public interest over private gain."},"ans":"A","stem":"The senator's speech called on citizens to hold their elected officials accountable, to demand transparency in government contracting, and voting for candidates who prioritize public interest over private gain.  Which choice maintains parallel structure?","why":"A is correct. The list uses 'to + verb' infinitives: 'to hold,' 'to demand.' The third must be 'to vote.'  B — 'vote' without 'to' breaks the infinitive pattern.  C — 'the voting for' is a noun phrase.  D — 'they should vote' is an independent clause."},{"ans":"C","stem":"The new library policy requires that all visitors sign in upon arrival, that personal electronic devices be kept on silent mode, and researchers must return all archival materials to the designated return desk before leaving.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g26-1-24","why":"C is correct. The list uses 'that + subject + verb' clauses: 'that all visitors sign in,' 'that personal electronic devices be kept.' The third must be 'that researchers return.'  A — 'returning all archival materials' is a gerund phrase.  B — 'the returning of' is a noun phrase.  D — 'all archival materials are to be returned' is a passive independent clause.","n":24,"choices":{"A":"and returning all archival materials to the designated return desk before leaving.","B":"and the returning of all archival materials to the designated return desk before leaving.","D":"and all archival materials are to be returned to the designated return desk by researchers before leaving.","C":"and that researchers return all archival materials to the designated return desk before leaving."}},{"stem":"The review board assessed the organization's performance on three dimensions: whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and the degree to which it had maintained stakeholder trust and transparency throughout the reporting period.  Which choice maintains parallel structure?","why":"B is correct. The list uses interrogative clauses: 'whether it had achieved' (yes/no type) and 'how efficiently it had deployed' (manner/degree type). The third item should also be an interrogative clause: 'how effectively it had maintained' maintains the 'how + adverb + clause' pattern and is more parallel than 'the degree to which,' which is a noun phrase.  A — 'whether it had maintained' is a yes/no clause; less parallel than a 'how' clause.  C — the original; 'the degree to which' is a noun phrase, breaking the clause pattern.  B — 'how effectively' maintains the 'how + adverb + clause' pattern.  D is incorrect; B preserves the original error.","slug":"gri-mod-sat-g26-1-25","ans":"B","choices":{"D":"C is the only correct answer.","C":"whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and the degree to which it had maintained stakeholder trust and transparency throughout the reporting period.","B":"whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and how effectively it had maintained stakeholder trust and transparency throughout the reporting period.","A":"whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and whether it had maintained stakeholder trust and transparency throughout the reporting period."},"n":25}],"t":"mcqquiz"}],"group":"Dilbilgisi","id":"g26","eyebrow":"Gramer"},{"eyebrow":"Gramer","id":"g27","group":"Dilbilgisi","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Parallel Structure II. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"choices":{"B":"Yes — 'extended' is the correct simple past in a reported speech context.","A":"A and C","D":"Yes — the backshifted past in reported speech ('suggested that...extended') is correct.","C":"No — 'had extended' is needed to show the extension preceded the report's submission."},"n":1,"stem":"The geologist's preliminary report, submitted in October, suggested that the mineral deposits extended well beyond the boundaries of the initial survey area. By the time the full study was published the following spring, more advanced imaging technology had confirmed that the deposits were nearly twice as large as originally estimated.  Is the underlined verb form correct in context?","slug":"gri-mod-sat-g27-1-1","why":"A is correct. In reported speech following a past reporting verb ('suggested'), the verb in the that-clause is backshifted: present becomes past. 'The deposits extended' (backshifted from 'extend') is correct. Both A and C express this correctly.  C — 'had extended' would imply the extension was completed before another past event, which changes the meaning; simple past is correct for reported speech backshift.  A is correct.","ans":"A"},{"n":2,"choices":{"B":"had malfunctioned","A":"malfunctioned","D":"has been malfunctioning","C":"was malfunctioning"},"ans":"B","stem":"When the inspection team arrived at the facility last Tuesday, they discovered that the cooling system malfunctioned for more than six hours before anyone on site had reported the issue to the maintenance department.  Which verb form is correct?","slug":"gri-mod-sat-g27-1-2","why":"B is correct. 'By the time the team arrived' implies a sequence: the malfunction happened (and had been ongoing) before the team arrived. The past perfect 'had malfunctioned' correctly shows this prior action.  A — simple past does not establish the prior sequence.  C — past progressive 'was malfunctioning' implies the malfunction was still ongoing when they arrived; possible but 'more than six hours before' requires the past perfect to show completion before the arrival.  D — 'has been malfunctioning' is present perfect progressive; incorrect for a past context."},{"choices":{"C":"'will submit' — future tense is needed to indicate an upcoming action.","D":"'submit' — the subjunctive requires the base form.","B":"'submitted' — past tense is required after 'required.'","A":"No change — 'submits' is correct in this context."},"n":3,"slug":"gri-mod-sat-g27-1-3","why":"D is correct. After 'required that,' the subjunctive mood is triggered, requiring the base form of the verb: 'that each government submit.' The base form is used regardless of the subject.  A — 'submits' is indicative third-person singular, not subjunctive.  B — 'submitted' is past tense, not subjunctive base form.  C — 'will submit' is future indicative.","stem":"The resolution required that each participating government submits a detailed implementation plan to the secretariat within ninety days of ratification.  Which verb form is correct?","ans":"D"},{"n":4,"choices":{"D":"No — 'identify' is needed for a general scientific statement.","C":"No — 'had identified' is needed to show completion before another event.","B":"No — 'identified' (simple past) is needed because the period of discovery is complete.","A":"Yes — 'have identified' correctly captures ongoing discovery within a period that began in the past and continues to the present."},"ans":"A","stem":"Astronomers working with data from the new orbital telescope have identified seventeen previously unknown exoplanets since the instrument was launched eighteen months ago.  Is the underlined verb form correct?","slug":"gri-mod-sat-g27-1-4","why":"A is correct. 'Since the instrument was launched eighteen months ago' establishes a time frame that started in the past and continues to the present. The present perfect 'have identified' correctly captures this ongoing relevance.  B — simple past 'identified' would imply the discovery period is complete, but 'since...eighteen months ago' indicates it is ongoing.  C — 'had identified' is past perfect, used for actions before another past event.  D — simple present 'identify' does not capture the relevance of the past-to-present timeframe."},{"n":5,"choices":{"C":"No — 'has implemented' is needed.","D":"Yes — 'had implemented' correctly forms the if-clause of a third conditional.","A":"No — 'implemented' (simple past) is needed for the if-clause of a third conditional.","B":"No — 'would have implemented' is needed for the if-clause."},"ans":"D","stem":"If the research team had implemented the revised protocols from the outset, the contamination of the control samples would have been avoided, and the entire study would not have needed to be repeated.  Is the verb form correct in the if-clause?","why":"D is correct. In a third conditional (hypothetical past), the if-clause uses past perfect ('had implemented') and the result clause uses 'would have + past participle.' Both parts of the sentence are correctly formed.  A — simple past 'implemented' is used in the second conditional (hypothetical present), not the third.  B — 'would have implemented' belongs in the result clause, not the if-clause.  C — 'has implemented' is present perfect.","slug":"gri-mod-sat-g27-1-5"},{"n":6,"choices":{"C":"'had been' — past perfect is needed to show prior completion.","D":"'has been' — present perfect is correct after a reporting verb.","A":"No change — 'will be' is correct as a direct quotation.","B":"'would be' — in reported speech after a past verb ('noted'), future 'will' is backshifted to 'would.'"},"ans":"B","slug":"gri-mod-sat-g27-1-6","why":"B is correct. 'Noted' is a past reporting verb. In reported speech, future 'will' is backshifted to 'would': 'she noted that the assessment would be completed.' This is standard sequence-of-tenses in indirect speech.  A — 'will be' is appropriate in direct speech but not in reported speech after a past verb.  C — 'had been' would imply the assessment was already completed before the memo was written.  D — 'has been' is present perfect; inappropriate after a past reporting verb.","stem":"The chief engineer noted in her final memo that the structural assessment will be completed before the building is opened to the public.  Which verb form correctly handles the reported speech context?"},{"why":"D is correct. 'Mandates that' triggers the subjunctive. The base form 'complete' is required regardless of the subject ('every employee').  A — 'completes' is indicative third-person singular, not subjunctive.  B — 'completed' is past tense.  C — 'will complete' is future indicative.","stem":"The policy mandates that every employee completes the mandatory training module within the first thirty days of their employment.  Which verb form is correct?","ans":"D","choices":{"D":"'complete' — after 'mandates that,' the subjunctive base form is required.","C":"'will complete' — future is required for a prospective action.","B":"'completed' — past tense is needed.","A":"No change — 'completes' is acceptable in a prescriptive policy statement."},"n":7,"slug":"gri-mod-sat-g27-1-7"},{"choices":{"A":"Yes — simple past 'filmed' is correct for an action completed in the past.","B":"No — 'had filmed' is needed because the filming was completed before the realization.","D":"No — 'were filming' is needed because the filming was still ongoing when they realized.","C":"Yes — simple past is correct because the two actions occurred at the same time."},"n":8,"stem":"The documentary crew filmed the entire migratory cycle before they realized that three of their cameras had malfunctioned during the first week, corrupting over forty hours of footage.  Is 'filmed' the correct verb form?","why":"B is correct. 'Before they realized' signals that the filming was completed prior to the realization. Past perfect 'had filmed' correctly captures this sequence.  A — simple past does not clarify that filming was complete before the realization.  C — the actions did not occur simultaneously; filming preceded the realization.  D — 'were filming' would imply the filming was still in progress when they realized.","slug":"gri-mod-sat-g27-1-8","ans":"B"},{"choices":{"A":"No change — 'have expected' is correct because analysts are still relevant.","B":"'had expected' — the expectation existed before the report was released; past perfect is needed.","D":"B or C","C":"'expected' — simple past is sufficient for past expectations."},"n":9,"stem":"The commission's final report was more damning than analysts have expected. It documented not only the regulatory failures that had allowed the crisis to develop but also the systematic suppression of early warning signals by three senior officials.  Which verb form is correct?","slug":"gri-mod-sat-g27-1-9","why":"D is correct. Both B and C are grammatically acceptable. 'Had expected' (past perfect) more precisely shows that the expectations preceded the report. 'Expected' (simple past) is also grammatically correct in this context, though less precise. The SAT accepts both for past comparisons.  A — 'have expected' (present perfect) implies the expectation is ongoing, which is unlikely after the report has already been released.  D is correct.","ans":"D"},{"why":"C is correct. 'It is imperative that' is a subjunctive trigger. The base form 'review' is required regardless of the subject.  A — 'reviews' is indicative third-person singular, not the subjunctive base form.  B — 'reviewed' is past tense.  D — 'will review' is future indicative.","stem":"It is imperative that the laboratory director reviews the safety protocols before any new technicians are allowed to operate the high-pressure equipment.  Which verb form is correct?","ans":"C","choices":{"D":"'will review' — future is needed.","C":"'review' — after 'it is imperative that,' the subjunctive base form is required.","A":"No change — 'reviews' is correct in a present-tense imperative context.","B":"'reviewed' — past tense is needed."},"n":10,"slug":"gri-mod-sat-g27-1-10"},{"ans":"A","stem":"By the time the final round of negotiations concludes next month, the two governments will negotiate for nearly three years.  Which verb form is correct?","why":"A is correct. 'By the time the final round concludes next month' signals a future perfect context. An action ongoing up to a specific future point requires the future perfect progressive: 'will have been negotiating.'  B — 'will negotiate' is simple future; does not express the ongoing duration.  C — 'have been negotiating' is present perfect progressive; incorrect for a future reference.  D — 'had been negotiating' is past perfect progressive; incorrect for a future context.","n":11,"choices":{"C":"'have been negotiating' — present perfect progressive is correct.","D":"'had been negotiating' — past perfect progressive is needed.","B":"No change — 'will negotiate' is correct as a future action.","A":"'will have been negotiating' — future perfect progressive is needed for an ongoing action up to a future point."},"slug":"gri-mod-sat-g27-1-11"},{"choices":{"A":"Yes — 'would be' is acceptable in a reported speech context after 'proposed.'","B":"A and C","D":"Yes — 'would be' captures the conditional/future nature of the proposal.","C":"No — 'be' is needed; 'proposed that' triggers the subjunctive."},"n":12,"stem":"The laboratory proposed that the trial would be extended by an additional six months to allow for a more robust assessment of the treatment's long-term side effects.  Is the verb form correct?","slug":"gri-mod-sat-g27-1-12","why":"B is correct. Both A and C are correct. 'Proposed that' can trigger either the subjunctive ('proposed that the trial be extended') or, in informal/semi-formal writing, the conditional 'would be.' The SAT accepts 'would be' after verbs like 'proposed' when the context implies a conditional future. Both A and C correctly describe why 'would be' is acceptable.  C — while the formal subjunctive 'be' is also correct, 'would be' is not incorrect here.  B is correct.","ans":"B"},{"slug":"gri-mod-sat-g27-1-13","ans":"D","stem":"Had the city council acts on the engineer's recommendation two years ago, the structural failure that collapsed the pedestrian bridge last spring might never have occurred.  Which verb form is correct?","why":"D is correct. 'Had the city council [verb]' uses the inversion of the past perfect (dropping 'if' and inverting): 'Had the city council acted on...' The past participle 'acted' is required.  A — 'acts' is present tense; incorrect for past perfect inversion.  B — 'acted' alone without the auxiliary 'had' would not form the inversion correctly.  C — 'have acted' would produce 'Had the city council have acted,' which is incorrect.  D is correct: 'acted' completes 'Had the city council acted...' as a past perfect inversion.","n":13,"choices":{"D":"'acted' with the inversion: 'Had the city council acted...' already uses past perfect inversion.","C":"'have acted' — the if-clause requires 'had + past participle.'","A":"No change — 'acts' is needed for a general statement.","B":"'acted' — simple past is needed in the if-clause of a third conditional."}},{"slug":"gri-mod-sat-g27-1-14","why":"C is correct. Both A and B are grammatically acceptable. 'Were misappropriated' (past passive) is acceptable for describing an ongoing past action. 'Had been misappropriated' (past perfect passive) more precisely shows that the misappropriation was completed/ongoing prior to the detection (another past event). Both are grammatically valid on the SAT.  D — 'had been misappropriating' uses an active voice construction; 'funds' cannot actively misappropriate themselves.  C is correct.","stem":"The auditors discovered that the funds were misappropriated over a period of seven years before the fraud was detected by an external review.  Which verb form is most precise?","ans":"C","choices":{"B":"'had been misappropriated' — past perfect passive is needed to show the action was completed before the detection.","A":"No change — 'were misappropriated' correctly describes the ongoing past action.","C":"A or B","D":"'had been misappropriating' — past perfect progressive active is needed."},"n":14},{"choices":{"B":"No change — 'will withdraw' is correct for a future obligation.","A":"B or C","C":"'would withdraw' — after 'stipulated' (past tense), future 'will' is backshifted to 'would' in reported speech.","D":"'withdraw' — subjunctive is needed after 'stipulated that.'"},"n":15,"slug":"gri-mod-sat-g27-1-15","why":"A is correct. Both B and C are grammatically correct. B applies the sequence-of-tenses rule (backshifting 'will' to 'would' after a past verb). C applies the subjunctive (base form 'withdraw') after a verb of stipulation. Both are standard grammatical choices.  B — 'will withdraw' is appropriate for direct speech but not standard in reported speech after a past verb.  A is correct.","stem":"The treaty stipulated that all signatory nations will withdraw their military forces from the disputed zone within ninety days of ratification.  Which verb form is correct in the indirect speech context?","ans":"A"},{"why":"C is correct. 'Since the algorithm was deployed' uses simple past in the 'since' clause to establish the starting point of a time period. The main clause then uses present perfect ('has decreased') to describe what has happened within that period. This is correct.  A — 'has been deployed' (present perfect) would be used if the deployment itself were the ongoing focus; but here the deployment is a completed starting point.  B — 'had been deployed' is past perfect; incorrect for a 'since' clause establishing a starting point.  D — passive voice is indeed appropriate; A is the best answer.","stem":"Since the new algorithm was deployed six months ago, processing time for complex queries has decreased by nearly forty percent.  Is 'was deployed' correct?","ans":"C","choices":{"B":"No — 'had been deployed' is needed to show the deployment preceded the decrease.","A":"No — 'has been deployed' is needed because the deployment is still ongoing.","D":"Yes — the passive voice is appropriate here.","C":"Yes — simple past 'was deployed' correctly establishes a starting point for the 'since' clause."},"n":16,"slug":"gri-mod-sat-g27-1-16"},{"ans":"A","stem":"The scientist insisted that the preliminary results were taken into account before the final methodology was approved.  Which verb form is correct?","why":"A is correct. 'Insisted that' triggers the subjunctive. The base form of 'be' is required: 'insisted that the results be taken into account.' The passive base form is 'be + past participle.'  B — 'were taken' is past passive indicative, not the subjunctive.  C — 'are' is present indicative.  D — 'had been taken' is past perfect passive.","n":17,"choices":{"B":"No change — 'were' is correct in indirect speech after 'insisted.'","A":"'be' — after 'insisted that,' the subjunctive base form is required.","C":"'are' — present tense is needed.","D":"'had been' — past perfect is needed."},"slug":"gri-mod-sat-g27-1-17"},{"n":18,"choices":{"D":"'had operated' — 'as of last December' sets a past reference point; past perfect is needed.","C":"'operated' — simple past is correct after 'as of last December.'","B":"'was operating' — past progressive is needed.","A":"No change — 'has operated' is correct for an action ongoing to the present."},"ans":"D","slug":"gri-mod-sat-g27-1-18","why":"D is correct. 'As of last December' establishes a specific past reference point. The action of operating had been ongoing up to that past point. Past perfect 'had operated' correctly captures duration up to a past moment.  A — 'has operated' is present perfect; incorrect when the reference point is explicitly in the past ('last December').  B — 'was operating' is past progressive, which does not express the duration.  C — 'operated' is simple past and does not express the ten-year duration.","stem":"As of last December, the organization has operated three regional offices in Southeast Asia for over a decade.  Which verb form is correct?"},{"ans":"C","stem":"The board requested that the external auditor presents a comprehensive summary of the firm's financial exposure at the next quarterly meeting.  Which verb form is correct?","why":"C is correct. 'Requested that' triggers the subjunctive. The base form 'present' is required regardless of the subject ('the external auditor').  A — 'presents' is indicative third-person singular.  B — 'presented' is past tense.  D — 'will present' is future indicative.","slug":"gri-mod-sat-g27-1-19","n":19,"choices":{"D":"'will present' — future is required.","C":"'present' — after 'requested that,' the subjunctive base form is required.","A":"No change — 'presents' is acceptable in a formal request context.","B":"'presented' — past tense is needed after 'requested.'"}},{"slug":"gri-mod-sat-g27-1-20","choices":{"B":"B or C","A":"No change — 'has slowed' is correct in this context.","C":"'had slowed' — the slowdown preceded the analysts' review; past perfect is needed.","D":"'slowed' — simple past is correct in reported speech after a past verb."},"n":20,"stem":"When the analysts reviewed the revised forecasts, they noted that the economic recovery has slowed significantly in the third quarter relative to initial projections.  Which verb form is correct?","why":"B is correct. Both B and C are grammatically acceptable. 'Had slowed' (past perfect) more precisely shows that the slowdown preceded the review. 'Slowed' (simple past backshifted from present perfect in reported speech) is also acceptable. Both are valid.  A — 'has slowed' (present perfect) is inappropriate in reported speech after a past verb ('noted').  B is correct.","ans":"B"},{"ans":"A","stem":"The professor proposed that the university establishes a dedicated research center to study the long-term social effects of social media use on adolescent development.  Which verb form is correct?","why":"A is correct. 'Proposed that' triggers the subjunctive. The base form 'establish' is required.  B — 'establishes' is indicative third-person singular.  C — 'established' is past tense.  D — 'will establish' is future indicative.","slug":"gri-mod-sat-g27-1-21","n":21,"choices":{"D":"'will establish' — future is needed for a prospective action.","C":"'established' — past tense is needed.","A":"'establish' — after 'proposed that,' the subjunctive base form is required.","B":"No change — 'establishes' is acceptable after 'proposed.'"}},{"n":22,"choices":{"D":"'had been' — past perfect is needed.","C":"'would be' — in reported speech after 'hoped' (past), 'will' is backshifted to 'would.'","A":"No change — 'will be' is appropriate for a future expectation.","B":"'were' — past tense is needed in reported speech."},"ans":"C","why":"C is correct. 'Hoped' is a past reporting verb. In reported speech, 'will' is backshifted to 'would': 'researchers hoped that results would be available.'  A — 'will be' is appropriate in direct speech but not in reported speech after a past verb.  B — 'were' is past; would imply the results already existed.  D — 'had been' is past perfect; incorrect.","slug":"gri-mod-sat-g27-1-22","stem":"The clinical trial, which began in 2019, was still in its third phase when the pandemic disrupted supply chains. Researchers hoped that results will be available by the end of the following year.  Which verb form is correct?"},{"stem":"It is crucial that the steering committee reached a consensus before the public consultation period opens next month.  Which verb form is correct?","why":"C is correct. 'It is crucial that' triggers the subjunctive. The base form 'reach' is required.  A — 'reached' is past tense.  B — 'reaches' is indicative third-person singular.  D — 'will reach' is future indicative.","slug":"gri-mod-sat-g27-1-23","ans":"C","choices":{"C":"'reach' — after 'it is crucial that,' the subjunctive base form is required.","D":"'will reach' — future is needed.","A":"No change — 'reached' is appropriate as a past reference.","B":"'reaches' — present indicative is needed."},"n":23},{"why":"B is correct. This is a third conditional. The if-clause uses past perfect inversion ('had the return been above twelve percent'), and the result clause uses 'would have + past participle': 'would have approved.' Both D and A are essentially the same reasoning, but A is the primary answer.  A — 'would approve' is the second conditional result clause form.  C — 'had approved' is past perfect and belongs in an if-clause, not the result clause.  B is correct.","slug":"gri-mod-sat-g27-1-24","stem":"The investment committee would have approved the proposal had the projected return on equity been above twelve percent, but the revised financial model fell just short of that threshold.  Is the underlined verb form correct?","ans":"B","choices":{"D":"Yes — 'would have approved' is correct because the condition was not met.","C":"No — 'had approved' is needed for the result clause.","B":"Yes — 'would have approved' correctly forms the result clause of a third conditional.","A":"No — 'would approve' is needed for a second conditional."},"n":24},{"ans":"A","stem":"The committee reviewed the proposal for weeks before reaching a final verdict. Several members argued that the entire funding structure needed to be reconsidered before any decision were finalized. The chair, however, insisted that time constraints made further deliberation impractical.  Which choice correctly completes the underlined portion of the sentence?","why":"The clause describes a real condition linked to past deliberation, not a hypothetical. The correct verb is the simple past \"was finalized\" agreeing with singular \"decision.\" The subjunctive \"were\" is reserved for counterfactual or hypothetical conditions (e.g., \"if a decision were made\"). \"Had finalized\" is intransitive and illogical. \"Is finalized\" introduces an inconsistent present tense.","slug":"gri-mod-sat-g27-1-25","n":25,"choices":{"A":"before any decision was finalized","B":"before any decision were finalized","C":"before any decision had finalized","D":"before any decision is finalized"}}]}],"name":"Parallel Structure II"},{"eyebrow":"Gramer","group":"Dilbilgisi","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Tense Consistency. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"choices":{"B":"a telescope that astronomers from around the world travel to it each year","A":"a telescope to which astronomers from around the world travel each year","D":"a telescope whom astronomers from around the world travel to each year","C":"a telescope which astronomers from around the world travel to each year"},"n":1,"stem":"The observatory atop Mount Palomar houses a telescope to which astronomers from around the world travel each year. The instrument, which was completed in 1948, remains one of the most productive research tools in modern astrophysics. Its design set the standard for large reflector telescopes built in subsequent decades.  Which choice correctly uses a relative construction to refer to the telescope in the passage?","slug":"gri-mod-sat-g28-1-1","why":"When a preposition governs the relative pronoun, formal usage requires the preposition to precede 'which': 'to which.' Choice B creates a pronoun double ('to it') after the relative clause, which is ungrammatical. Choice C strands the preposition informally and is inappropriate in formal writing when revision is possible. Choice D uses 'whom,' reserved for persons, not things.","ans":"A"},{"choices":{"C":"a chemical compound where the bacteria transmit resistance genes","D":"a chemical compound through which the bacteria transmit resistance genes","A":"a chemical compound that the bacteria transmit resistance genes through it","B":"a chemical compound which the bacteria transmit resistance genes through"},"n":2,"why":"'Through which' correctly places the preposition before the relative pronoun, as required in formal prose. B creates a double reference ('through it'). C strands the preposition, acceptable in speech but substandard in formal written English when revision is available. D uses 'where,' which refers to a place, not a compound.","slug":"gri-mod-sat-g28-1-2","stem":"The researcher identified a chemical compound through which the bacteria transmit resistance genes to neighboring cells. Understanding this mechanism was considered essential to developing effective treatments. Without this knowledge, pharmaceutical responses would remain largely reactive rather than preventive.  Which choice correctly expresses the prepositional relative construction in formal written English?","ans":"D"},{"stem":"The commission submitted its report to the council, by which all future zoning decisions would be governed. Local residents had waited months for the document, hoping it would address the longstanding conflicts between residential expansion and protected green spaces. The report ultimately satisfied neither faction completely.  Which choice uses the correct relative construction to refer to the report?","slug":"gri-mod-sat-g28-1-3","why":"In non-restrictive clauses (set off by commas), 'which' is required — not 'that.' A correctly uses 'by which' with the preposition fronted. B incorrectly uses 'that' in a non-restrictive clause. C creates a double reference error ('by it'). D also uses 'that' inappropriately in a non-restrictive clause and strands the preposition.","ans":"C","choices":{"C":"to the council, by which all future zoning decisions would be governed","D":"to the council, that all future zoning decisions would be governed by","A":"to the council, by that all future zoning decisions would be governed","B":"to the council, which all future zoning decisions would be governed by it"},"n":3},{"ans":"B","stem":"The architect selected a building material of which the thermal properties had been independently certified. This choice reflected her commitment to verifiable performance standards rather than manufacturer claims alone. The certification process, though time-consuming, added credibility to the final design proposal.  Which choice correctly expresses the relationship between the noun and the relative clause?","slug":"gri-mod-sat-g28-1-4","why":"Both A and B are grammatically acceptable. However, A uses the formal 'of which' construction appropriate to formal academic prose, while B uses 'whose,' which is correct but slightly less formal in reference to inanimate objects. C and D both insert a redundant possessive pronoun ('its') after the relative pronoun, creating double reference errors. Since the passage maintains a formal register throughout, A is the best choice.","n":4,"choices":{"C":"a building material that its thermal properties had been independently certified","D":"a building material which its thermal properties had been independently certified","A":"a building material whose thermal properties had been independently certified","B":"a building material of which the thermal properties had been independently certified"}},{"n":5,"choices":{"D":"three studies which her central argument depended upon","C":"three studies her central argument depended upon","A":"three studies that her central argument depended upon them","B":"three studies upon which her central argument depended"},"ans":"B","why":"'Upon which' fronts the preposition correctly in formal prose. B adds an unnecessary pronoun ('them'), creating a double reference error. C omits the relative pronoun entirely — acceptable informally but not in formal writing. D strands the preposition, which is acceptable in informal English but incorrect in formal academic prose when a fronted alternative is available.","slug":"gri-mod-sat-g28-1-5","stem":"The professor cited three studies upon which her central argument depended. Each study had been peer-reviewed and replicated across different populations. Despite this, several members of the audience questioned whether the combined evidence was sufficient to support the sweeping conclusions she had drawn.  Which choice correctly uses a prepositional relative construction in formal prose?"},{"n":6,"choices":{"D":"a ruling she distinguished between two categories of evidence in it","C":"a ruling that she distinguished between two categories of evidence in","B":"a ruling where she distinguished between two categories of evidence","A":"a ruling in which she distinguished between two categories of evidence"},"ans":"A","why":"'In which' correctly governs the relative clause in formal prose. B uses 'where,' which is restricted to location unless the noun genuinely refers to a place or situation. C strands the preposition informally. D adds an unnecessary pronoun ('it'), producing a double reference error.","slug":"gri-mod-sat-g28-1-6","stem":"The judge issued a ruling in which she distinguished between two categories of evidence. The first category included direct testimony from witnesses present at the scene. The second comprised documentary records assembled after the fact, which she treated with greater scrutiny due to their potential for retrospective distortion.  Which choice most correctly uses a relative clause to refer to the ruling?"},{"why":"'Under which' correctly fronts the preposition in formal prose. B strands the preposition, informal but substandard in formal written English. C strands the preposition and adds a pronoun ('it'), creating a double reference error. D uses 'where' incorrectly — an agreement is not a location.","slug":"gri-mod-sat-g28-1-7","stem":"The negotiators reached an agreement under which both parties would suspend hostilities for a period of thirty days. International observers praised the deal as a fragile but necessary first step. Whether the agreement would survive domestic opposition in both countries remained deeply uncertain.  Which choice correctly expresses the prepositional relative relationship in formal written English?","ans":"D","choices":{"D":"an agreement under which both parties would suspend hostilities","C":"an agreement where both parties would suspend hostilities","B":"an agreement which both parties would suspend hostilities under it","A":"an agreement that both parties would suspend hostilities under"},"n":7},{"ans":"D","slug":"gri-mod-sat-g28-1-8","why":"'Who' is the subject of the relative clause ('who had spent') and correctly refers to a person. 'Whom' is an object pronoun — incorrect here since the pronoun functions as the subject. 'Which' refers to things, not people. 'That' cannot introduce a non-restrictive clause (one set off by commas).","stem":"The historian documented the precise conditions under which the treaty was signed. Primary sources confirmed that both delegations had arrived exhausted after weeks of failed negotiation. The final terms, widely seen as a compromise, satisfied neither side fully but prevented the outbreak of renewed conflict.  Which choice uses the correct relative pronoun form for a person?","n":8,"choices":{"C":"The historian, that had spent fifteen years researching the period, documented the treaty's origins.","D":"The historian, who had spent fifteen years researching the period, documented the treaty's origins.","A":"The historian, whom had spent fifteen years researching the period, documented the treaty's origins.","B":"The historian, which had spent fifteen years researching the period, documented the treaty's origins."}},{"stem":"The award was presented to the scientist whom the committee had unanimously selected. Her research on quantum entanglement had produced results that challenged long-held assumptions about information transfer. The ceremony attracted international media attention, reflecting the global significance of her findings.  Which choice uses the correct relative pronoun case?","why":"'Whom' is correct because it functions as the direct object of 'selected' — the committee selected her, not she. To test: substitute 'him/her' (object) vs. 'he/she' (subject). 'The committee selected her' — object case = 'whom.' B uses 'who' (subject case) incorrectly. C ('that') is acceptable informally but less precise than 'whom' in formal prose. D ('which') refers to things, not people.","slug":"gri-mod-sat-g28-1-9","ans":"B","choices":{"D":"the scientist which the committee had unanimously selected","C":"the scientist that the committee had unanimously selected","B":"the scientist whom the committee had unanimously selected","A":"the scientist who the committee had unanimously selected"},"n":9},{"stem":"The foundation awarded grants to researchers with whom it had collaborated on previous projects. These ongoing relationships were seen as a strategic investment in long-term scientific progress. New applicants without prior collaboration history were considered only in exceptional circumstances.  Which choice correctly uses the object form of the relative pronoun after a preposition?","why":"After a preposition, 'whom' is required — 'with whom.' B incorrectly uses 'who' (subject form) after a preposition. C uses 'that' and strands the preposition, acceptable informally but not the best choice in formal prose when a fronted form is available. D uses 'which' for people, which is incorrect.","ans":"D","choices":{"A":"researchers with who it had collaborated on previous projects","B":"researchers that it had collaborated with on previous projects","D":"researchers with whom it had collaborated on previous projects","C":"researchers which it had collaborated with on previous projects"},"n":10,"slug":"gri-mod-sat-g28-1-10"},{"n":11,"choices":{"B":"several passages whom have been cited frequently in literary criticism","A":"several passages, which have been cited frequently in literary criticism,","C":"several passages that have been cited frequently in literary criticism","D":"several passages what have been cited frequently in literary criticism"},"ans":"C","stem":"The novel contains several passages that have been cited frequently in literary criticism. One passage, which appears in the third chapter, describes the protagonist's childhood in vivid detail. Critics disagree about whether this passage constitutes the thematic center of the work or functions merely as atmospheric background.  Which choice uses the correct relative pronoun to introduce a restrictive clause?","slug":"gri-mod-sat-g28-1-11","why":"'That' correctly introduces a restrictive relative clause — one that defines which passages are meant, without commas. B uses 'which' with commas, making it non-restrictive; this would imply all passages in the novel are frequently cited, changing the meaning. C uses 'whom,' reserved for people. D uses 'what,' which cannot introduce a relative clause modifying a noun."},{"n":12,"choices":{"A":"a route, which earlier explorers had abandoned due to extreme weather,","B":"a route which earlier explorers had abandoned due to extreme weather","D":"a route where earlier explorers had abandoned it due to extreme weather","C":"a route that earlier explorers had abandoned due to extreme weather"},"ans":"C","why":"'That' is correct for a restrictive clause — it specifies which route. B converts it to a non-restrictive clause with commas, implying the route is already known and the detail is supplementary — a meaning shift. C uses 'which' without commas in a restrictive clause, technically acceptable in British English but not the preferred SAT convention. D adds a double reference pronoun ('it').","slug":"gri-mod-sat-g28-1-12","stem":"The expedition followed a route that earlier explorers had abandoned due to extreme weather. Modern equipment allowed the team to navigate conditions that would have been prohibitive in previous centuries. The final summit attempt lasted eighteen hours and required careful rationing of oxygen supplies.  Which choice correctly identifies the relationship between the restrictive clause and its antecedent?"},{"choices":{"A":"only proposals that met all three criteria","B":"only proposals, which met all three criteria,","D":"only proposals whom met all three criteria","C":"only proposals meeting all three of them criteria"},"n":13,"stem":"The committee approved only proposals that met all three criteria. Projects that failed even one criterion were returned to applicants for revision. This rigorous filtering process ensured that funded projects maintained the highest standards of methodological integrity.  Which choice correctly uses a relative pronoun for a restrictive clause defining which proposals were approved?","why":"'That' introduces the restrictive clause specifying exactly which proposals were approved. B makes it non-restrictive, implying all proposals met the criteria — a logical contradiction with 'only.' C is grammatically awkward ('of them criteria' is nonstandard). D uses 'whom' for things, which is incorrect.","slug":"gri-mod-sat-g28-1-13","ans":"A"},{"stem":"The museum acquired a painting that had been missing for over sixty years. The work, which had passed through several private collections before its disappearance, was authenticated using advanced imaging technology. Its return to public display was celebrated by art historians and the general public alike.  Which choice correctly distinguishes between restrictive and non-restrictive usage for the second relative clause?","why":"Since 'the work' refers to a specific, already-identified painting, the clause adds supplementary detail — making it non-restrictive, requiring 'which' and commas. B uses 'that' without commas, making the clause restrictive, which implies there are multiple works and this clause identifies which one — incorrect given the context. C incorrectly uses 'that' in a non-restrictive clause with commas. D misplaces the comma, creating confusion.","slug":"gri-mod-sat-g28-1-14","ans":"A","choices":{"C":"The work, that had passed through several private collections before its disappearance, was authenticated","D":"The work which had passed through several private collections, before its disappearance, was authenticated","A":"The work, which had passed through several private collections before its disappearance, was authenticated","B":"The work that had passed through several private collections before its disappearance was authenticated"},"n":14},{"n":15,"choices":{"A":"a filtration method by that trace contaminants could be detected","B":"a filtration method that trace contaminants could be detected by it","D":"a filtration method where trace contaminants could be detected","C":"a filtration method by which trace contaminants could be detected"},"ans":"C","stem":"The laboratory developed a filtration method by which trace contaminants could be detected at concentrations as low as one part per billion. Previous techniques had been far less sensitive, limiting their usefulness in environmental monitoring. The new method was immediately adopted by regulatory agencies.  Which choice correctly uses a prepositional relative phrase to describe how the filtration method functions?","slug":"gri-mod-sat-g28-1-15","why":"'By which' correctly fronts the preposition in a formal relative clause. B incorrectly substitutes 'that' after a preposition — 'by that' is not standard English. C adds an unnecessary pronoun ('it') after the relative construction. D uses 'where,' which implies a location rather than a mechanism."},{"choices":{"C":"a report that she argued supply chain disruptions were primarily responsible in","D":"a report she argued supply chain disruptions were primarily responsible for","B":"a report in which she argued that supply chain disruptions were primarily responsible","A":"a report where she argued that supply chain disruptions were primarily responsible"},"n":16,"stem":"The analyst published a report in which she argued that supply chain disruptions were primarily responsible for the price increases. Industry groups disputed her conclusions, contending that regulatory costs played an equal if not greater role. The debate continued for months without resolution.  Which choice uses the correct prepositional relative construction to describe the contents of the report?","why":"'In which' correctly introduces the relative clause in formal prose, with the preposition fronted. B uses 'where' — a report is not a location in the literal sense, making this imprecise. C strands the preposition informally and also changes 'in' to an incorrect preposition. D omits the relative pronoun entirely and substitutes an incorrect preposition ('for' instead of 'in').","slug":"gri-mod-sat-g28-1-16","ans":"B"},{"choices":{"B":"a framework developers could build customized applications within it","A":"a framework that developers could build customized applications within","C":"a framework within which developers could build customized applications","D":"a framework where developers could build customized applications"},"n":17,"stem":"The software platform provided a framework within which developers could build customized applications without modifying the underlying code. This architecture proved especially valuable for organizations requiring rapid deployment. Several competing platforms later adopted similar modular structures.  Which choice correctly uses 'within which' as a formal relative construction?","slug":"gri-mod-sat-g28-1-17","why":"'Within which' fronts the preposition formally. B strands the preposition — acceptable informally but substandard in formal prose when revision is possible. C adds a double reference pronoun ('it'). D uses 'where,' which is acceptable colloquially for abstract containers but less precise than 'within which' in formal technical prose.","ans":"C"},{"ans":"B","why":"'Under which' is precise — the policy creates conditions 'under' which access becomes possible. B strands the preposition informally. C strands the preposition and adds a double reference pronoun ('it'). D substitutes 'in which,' which is grammatically correct but changes the idiomatic meaning slightly — 'under which' suggests governed conditions; 'in which' suggests interior context.","slug":"gri-mod-sat-g28-1-18","stem":"The policy created a framework under which smaller businesses could access government contracts previously reserved for larger firms. Advocates argued that the policy would stimulate competition and promote economic diversity. Critics, however, warned that implementation costs could outweigh the projected benefits.  Which choice best preserves formal register in the relative construction?","n"
