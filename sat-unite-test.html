<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

// ---- Ünite haritası (domain -> Supabase category + başlık + beceriler) ----
const UNITS = {
  info:        { cat:'information_and_ideas',        title:'Information and Ideas',        tr:'Bilgi ve Fikirler',
                 skills:['central_ideas_and_details','command_of_evidence','inferences'] },
  craft:       { cat:'craft_and_structure',          title:'Craft and Structure',          tr:'Kurgu ve Yapı',
                 skills:['words_in_context','text_structure_and_purpose','cross_text_connections'] },
  expression:  { cat:'expression_of_ideas',          title:'Expression of Ideas',          tr:'Fikirlerin İfadesi',
                 skills:['rhetorical_synthesis','transitions'] },
  conventions: { cat:'standard_english_conventions', title:'Standard English Conventions', tr:'Standart İngilizce Kuralları',
                 skills:['boundaries','form_structure_and_sense'] },
};

// ---- Yaklaşık ham->ölçekli puan dönüşümü (TAHMİN — resmi değil) ----
// Digital SAT R&W bölümü 54 soru, 200-800 ölçek. Upper yol tavana ulaşır, Lower yol kapaklıdır.
function scaledScore(raw, path){
  const r = Math.max(0, Math.min(54, raw));
  if (path === 'lower'){
    // Alt yol yaklaşık 200-610 ile kapaklı (gerçek testte alt modül tavanı düşüktür)
    return Math.round(200 + (410) * Math.pow(r/54, 0.92));
  }
  // Upper yol 300-800
  return Math.round(300 + (500) * Math.pow(r/54, 0.98));
}

function param(k){ return new URLSearchParams(location.search).get(k); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(((i*2654435761)%(i+1))); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const app = document.getElementById('st-app');
const unitKey = param('unite') || 'info';
const mode = param('mode') || 'checkpoint';   // checkpoint | final
const form = (param('form') || 'A').toUpperCase();
const U = UNITS[unitKey] || UNITS.info;

// Doğru şık, seçenekler arasında EN UZUN olan mı (öyleyse kaçın)
function longestIsCorrect(q){
  const opts = Array.isArray(q.options)?q.options:[];
  const co = opts.find(o=>o.letter===q.correct_answer);
  if (!co) return false;
  const cl = (co.text||'').length;
  return opts.every(o=>(o.text||'').length <= cl) && opts.some(o=>o.letter!==q.correct_answer && (o.text||'').length < cl);
}

// Form A/B kesişmesin (id'ye göre mod-4 disjoint partition) + zorluk kotası
// + cevap A/B/C/D dengesi + doğru-şık-en-uzun kaçınma
function buildSet(pool, n, offset){
  const sorted = pool.slice().sort((a,b)=> (a.id<b.id?-1:(a.id>b.id?1:0)));
  const part = sorted.filter((q,i)=> (i%4)===(offset%4));
  const src = part.length>=n ? part : sorted; // partition küçükse tüm havuz
  const by = { easy:[], medium:[], hard:[] };
  src.forEach(q=>{ (by[q.difficulty]||by.medium).push(q); });
  const want = { easy:Math.round(n*0.35), medium:Math.round(n*0.40) };
  want.hard = n - want.easy - want.medium;
  const chosen = []; const ac = { A:0,B:0,C:0,D:0 };
  function take(bucket, count){
    const avail = bucket.slice();
    for (let k=0; k<count && avail.length; k++){
      avail.sort((a,b)=>{
        const ba=longestIsCorrect(a)?1:0, bb=longestIsCorrect(b)?1:0;
        if (ba!==bb) return ba-bb;                                  // önce en-uzun-değil
        return (ac[a.correct_answer]||0)-(ac[b.correct_answer]||0); // sonra en az temsil edilen cevap
      });
      const q = avail.shift(); chosen.push(q); ac[q.correct_answer]=(ac[q.correct_answer]||0)+1;
    }
  }
  take(by.easy, want.easy); take(by.medium, want.medium); take(by.hard, want.hard);
  for (const q of src){ if (chosen.length>=n) break; if (!chosen.includes(q)) chosen.push(q); } // eksik doldur
  return chosen.slice(0, n);
}

async function fetchPool(cat, difficulties){
  let q = sb.from('questions').select('id,subcategory,difficulty,question_text,options,correct_answer,explanations,passage_id')
    .eq('active',true).eq('exam_type','sat').eq('section','rw').eq('category',cat);
  // Üniteye ait gerçek beceriler (yanlış kategorilenmiş soruları hariç tut, veriye dokunmadan)
  if (U.skills && U.skills.length) q = q.in('subcategory', U.skills);
  if (difficulties) q = q.in('difficulty', difficulties);
  const { data, error } = await q.range(0, 4999);
  if (error) throw error;
  return data || [];
}

async function fetchPassages(ids){
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return {};
  const { data } = await sb.from('passages').select('id,texts').in('id', uniq);
  const m = {}; (data||[]).forEach(p=>{ m[p.id]=p.texts; }); return m;
}
function passageHtml(texts){
  if (!Array.isArray(texts)) return '';
  return texts.map(t=>{
    const lbl = (t && t.label && texts.length>1) ? '<strong>'+esc(t.label)+'</strong><br>' : '';
    return '<div class="st-passage">'+lbl+esc(t && t.content)+'</div>';
  }).join('');
}

let STATE = { questions:[], answers:{}, submitted:false, module:1, m1raw:0, path:null };

function renderModuleHeader(){
  let rule='';
  if (mode==='checkpoint'){
    rule = '<div class="st-rulecard">Bu bir <strong>konu geçiş testidir</strong> (Form '+form+'). 27 sorudan <strong>19 veya üzeri</strong> (yüzde 70) doğru yaparsan bir sonraki bölüme geçebilirsin. 19 altında kalırsan öğretim bölümüne dön, tam tekrar et, sonra Form '+(form==='A'?'B':'A')+' testini çöz.</div>';
  } else {
    if (STATE.module===1) rule = '<div class="st-rulecard"><strong>Final — Modül 1 (27 soru).</strong> Sonuçta: <strong>18 veya üzeri</strong> doğru yaparsan zor Modül 2 (Upper) yoluna, altında kalırsan kolay Modül 2 (Lower) yoluna yönlendirilirsin. Toplam 54 soru sonunda tahmini 200-800 puanın hesaplanır.</div>';
    else rule = '<div class="st-rulecard"><strong>Final — Modül 2 ('+(STATE.path==='upper'?'Upper / zor':'Lower / kolay')+').</strong> Modül 1 sonucuna göre yönlendirildin. Bu modül bittiğinde toplam ham puanın 200-800 ölçeğine çevrilir (tahmin).</div>';
  }
  return rule;
}

function renderQuestions(passages){
  let h = renderModuleHeader();
  h += '<div class="st-bar"><span>'+esc(U.tr)+' · '+(mode==='checkpoint'?('Geçiş Testi '+form):('Final Modül '+STATE.module))+'</span><span class="st-timer" id="st-timer"></span></div>';
  STATE.questions.forEach((q,i)=>{
    const opts = Array.isArray(q.options)?q.options:[];
    const pass = q.passage_id && passages[q.passage_id] ? passageHtml(passages[q.passage_id]) : '';
    h += '<div class="st-q" data-qi="'+i+'"><span class="st-q-num">'+(i+1)+'</span>'+pass+
      '<div class="st-stem">'+esc(q.question_text)+'</div>';
    opts.forEach(o=>{
      h += '<label class="st-opt" data-letter="'+esc(o.letter)+'"><input type="radio" name="q'+i+'" value="'+esc(o.letter)+'"><span class="st-oletter">'+esc(o.letter)+'</span>'+esc(o.text)+'</label>';
    });
    h += '<div class="st-expl" id="expl'+i+'"></div></div>';
  });
  h += '<button class="st-btn" id="st-submit">Bitir ve Değerlendir</button>';
  app.innerHTML = h;
  app.querySelectorAll('.st-opt').forEach(l=>{
    l.addEventListener('click',()=>{
      if (STATE.submitted) return;
      const qi = l.closest('.st-q').dataset.qi;
      l.closest('.st-q').querySelectorAll('.st-opt').forEach(x=>x.classList.remove('sel'));
      l.classList.add('sel'); l.querySelector('input').checked=true;
      STATE.answers[qi]=l.dataset.letter;
    });
  });
  document.getElementById('st-submit').addEventListener('click', submitModule);
}

function explHtml(q){
  const e = q.explanations || {};
  const ca = q.correct_answer;
  let h = '';
  // 8-alanlı standart: mevcut alanlar + per-şık; eksikse başlıkla göster
  h += '<h5>Doğru cevap</h5>'+esc(ca)+(e[ca]?' — '+esc(e[ca]):'');
  const wrongs = (Array.isArray(q.options)?q.options:[]).map(o=>o.letter).filter(l=>l!==ca);
  if (wrongs.some(w=>e[w])){
    h += '<h5>Yanlış şıklar neden yanlış</h5>';
    wrongs.forEach(w=>{ if(e[w]) h += '<div><strong>'+esc(w)+'.</strong> '+esc(e[w])+'</div>'; });
  }
  if (e.type) h = '<h5>Soru tipi</h5>'+esc(e.type)+h;
  if (e.trick) h += '<h5>Tuzak / ipucu</h5>'+esc(e.trick);
  if (e.vocab) h += '<h5>Kelimeler (TR)</h5>'+esc(e.vocab);
  return h;
}

function submitModule(){
  if (STATE.submitted && !(mode==='final' && STATE.module===1)) return;
  let correct = 0;
  STATE.questions.forEach((q,i)=>{
    const ans = STATE.answers[i];
    const qEl = app.querySelector('.st-q[data-qi="'+i+'"]');
    qEl.querySelectorAll('.st-opt').forEach(l=>{
      const let_ = l.dataset.letter;
      if (let_===q.correct_answer) l.classList.add('correct');
      else if (let_===ans) l.classList.add('wrong');
    });
    if (ans===q.correct_answer) correct++;
    const ex = document.getElementById('expl'+i); ex.innerHTML = explHtml(q); ex.classList.add('show');
  });
  STATE.submitted = true;
  document.getElementById('st-submit').style.display='none';
  showResult(correct);
}

function convTable(path){
  let rows='';
  for (let r=0;r<=54;r+=6){ rows += '<tr><td>'+r+'</td><td>'+scaledScore(r,path)+'</td></tr>'; }
  return '<table class="st-conv"><tr><th>Ham</th><th>Tahmini Puan</th></tr>'+rows+'</table>';
}

function showResult(correct){
  const total = STATE.questions.length;
  if (mode==='checkpoint'){
    const pass = correct>=19;
    const moduleFile = {info:'sat-unite-1.html',craft:'sat-unite-2.html',expression:'sat-unite-3.html',conventions:'sat-unite-4.html'}[unitKey] || 'ogrenme-haritasi.html';
    let actions='';
    if (pass){
      actions='<div class="st-actions">'+
        '<a class="st-btn" href="'+moduleFile+'">Konu anlatımına dön</a>'+
        '<a class="st-btn gold" href="sat-unite-test.html?unite='+unitKey+'&mode=final">Final Denemeye Geç</a></div>';
    } else if (form==='A'){
      // Form A geçilemedi -> Form B ancak burada açılır
      actions='<div class="st-actions">'+
        '<a class="st-btn" href="'+moduleFile+'">Önce konuyu tekrar et</a>'+
        '<a class="st-btn gold" href="sat-unite-test.html?unite='+unitKey+'&mode=checkpoint&form=B">Form B ile tekrar dene</a></div>';
    } else {
      // Form B de geçilemedi
      actions='<div class="st-actions">'+
        '<a class="st-btn gold" href="'+moduleFile+'">Konu anlatımına dön, tam tekrar et</a></div>';
    }
    const note = pass
      ? 'Bu üniteyi geçtin. Final denemeyle puan tahminini görebilirsin.'
      : (form==='A'
          ? 'Baraja takıldın. Konuyu bir tur tekrar et, sonra <b>Form B</b> (aynı zorlukta, farklı sorular) ile yeniden dene.'
          : 'Form B\'de de baraja takıldın. Öğretim bölümüne dönüp eksik alt-becerileri çalış, sonra baştan dene.');
    const box='<div class="st-result"><div class="st-eyebrow">Geçiş Testi · Form '+form+'</div>'+
      '<div class="st-score">'+correct+' / 27</div>'+
      '<div class="st-pill '+(pass?'pass':'fail')+'">'+(pass?'GEÇTİN (yüzde 70+)':'GEÇEMEDİN (19 gerekli)')+'</div>'+
      '<p class="st-note">'+note+'</p>'+actions+'</div>';
    app.insertAdjacentHTML('afterbegin', box);
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  // FINAL
  if (STATE.module===1){
    STATE.m1raw = correct;
    STATE.path = correct>=18 ? 'upper' : 'lower';
    const box='<div class="st-result"><div class="st-eyebrow">Final · Modül 1</div>'+
      '<div class="st-score">'+correct+' / 27</div>'+
      '<div class="st-pill '+(STATE.path==='upper'?'pass':'fail')+'">Yönlendirme: Modül 2 '+(STATE.path==='upper'?'Upper (zor)':'Lower (kolay)')+'</div>'+
      '<p class="st-note">'+(STATE.path==='upper'?'18+ yaptın, zor yola gidiyorsun (tavana ulaşır).':'18 altında kaldın, kolay yola gidiyorsun (puan kapaklı).')+'</p>'+
      '<button class="st-btn" id="st-next">Modül 2\'ye Geç</button></div>';
    app.insertAdjacentHTML('afterbegin', box);
    window.scrollTo({top:0,behavior:'smooth'});
    document.getElementById('st-next').addEventListener('click', loadModule2);
    return;
  }
  // Modül 2 bitti -> toplam + puan
  const raw = STATE.m1raw + correct;
  const scaled = scaledScore(raw, STATE.path);
  const box='<div class="st-result"><div class="st-eyebrow">Final Sonucu · '+(STATE.path==='upper'?'Upper yol':'Lower yol')+'</div>'+
    '<div class="st-score">~'+scaled+'</div>'+
    '<div class="st-pill pass">Ham: '+raw+' / 54 (M1 '+STATE.m1raw+' + M2 '+correct+')</div>'+
    '<p class="st-note">Bu bir <strong>tahmindir</strong>, resmi puan değildir. Gerçek Digital SAT her forma göre eşitlenir.</p>'+
    convTable(STATE.path)+'</div>';
  app.insertAdjacentHTML('afterbegin', box);
  window.scrollTo({top:0,behavior:'smooth'});
}

async function loadModule2(){
  STATE.module=2; STATE.submitted=false; STATE.answers={}; document.querySelector('.st-result').remove();
  const diffs = STATE.path==='upper' ? ['medium','hard','hard'] : ['easy','easy','medium'];
  const pool = await fetchPool(U.cat, [...new Set(diffs)]);
  const set = buildSet(pool, 27, form==='A'?2:3);
  const passages = await fetchPassages(set.map(q=>q.passage_id));
  STATE.questions=set;
  renderQuestions(passages);
}

async function init(){
  try{
    const pool = await fetchPool(U.cat);
    if (!pool.length){ app.innerHTML='<div class="st-loading">Bu ünite için soru bulunamadı.</div>'; return; }
    const n = 27;
    const offset = mode==='checkpoint' ? (form==='A'?0:1) : 0;
    const set = buildSet(pool, n, offset);
    const passages = await fetchPassages(set.map(q=>q.passage_id));
    STATE.questions = set;
    document.title = U.tr+' · '+(mode==='checkpoint'?'Geçiş Testi':'Final')+' | Gri English';
    renderQuestions(passages);
  }catch(e){
    app.innerHTML='<div class="st-loading">Hata: '+esc(e.message||e)+'</div>';
  }
}
init();
</script>
