{no:6,skill:'listen',title:'Dinleme — TED: “How to Speak So That People Want to Listen” (Julian Treasure)',

 blocks:[

  {t:'h3',v:'Ödev Tekrarı (5’)'},
  {t:'p',v:'Öğrenci görüş yazısı ödevini sözlü özetler; öğretmen bir gerekçeye itiraz eder.'},
  {t:'video',id:'eIho2S0ZahI'},
  {t:'src',v:'~10 dakika · İngilizce altyazı mevcut'},
  {t:'box',bt:'Ön Kelime',items:['gossip, judging, negativity, complaining, register, timbre, prosody, pace, pitch, volume, silence, empathy']},
  {t:'h3',v:'Anlama Soruları'},
  {t:'qs',v:[
    'What are the “seven deadly sins of speaking”? (gossip, judging, negativity, complaining, excuses, exaggeration/lying, dogmatism)',
    'What does HAIL stand for? (Honesty, Authenticity, Integrity, Love)',
    'Name three vocal “tools” he mentions. (register, timbre, prosody, pace, pitch, volume)',
    'Why does he value silence?',
    'Konuşmanın sonundaki ısınma egzersizleri neydi? (ör. “ba-ba-ba”, dudak/dil egzersizleri)',
    'Which tip do you think is most useful for you, and why?']},
  {t:'h3',v:'Ses Araçları Alıştırması (14’)'},
  {t:'box',bt:'Aynı cümleyi farklı araçlarla söyle',items:['Pace: yavaş → hızlı','Pitch: alçak → yüksek','Volume: fısıltı → güçlü','Prosody: düz → vurgulu (anlamın nasıl değiştiğini fark et)']},
  {t:'p',v:'Öğrenci kısa bir parçayı (ör. kendini tanıtma) önce “düz”, sonra HAIL ilkesi + en az 2 vocal tool ile yeniden anlatır.'},

 ]},

{no:7,skill:'speak',title:'Anı Anlatma (Storytelling): Geçmiş Deneyimler',
 objective:'Öğrenci bir anıyı akıcı ve ilgi çekici anlatır; past simple/continuous ve zaman bağlaçlarını doğru kullanır.',
 timing:'Ödev tekrarı 5’ · Isınma 6’ · Hedef dil (zamanlar + bağlaçlar) 12’ · Model + analiz 8’ · Anlatı alıştırması 22’ · Hata düzeltme + kapanış 7’',
 blocks:[
  {t:'note',v:'Birebir: öğretmen dinleyici + soru soran rolünde. Öğrenci anlatırken zaman hatalarını (V2, was/were + -ing) not al.'},
  {t:'h3',v:'Ödev Tekrarı (5’)'},
  {t:'p',v:'Öğrenci konuşma hedefleri + 1 dakikalık metnini vocal tool’larla sözlü sunar.'},
  {t:'h3',v:'Isınma (6’)'},
  {t:'ul',v:['What’s a story your family always tells?','Do you prefer telling stories or listening to them?']},
  {t:'box',bt:'Anlatı Zamanları',items:['Arka plan (past continuous): “I was walking home when…”','Ana olaylar (past simple): “Suddenly, the lights went out.”','Öncesi (past perfect, kısa): “I had already left when it happened.”']},
  {t:'box',bt:'Sıralama bağlaçları',items:['“First… / then… / after that… / a moment later… / in the end… / eventually…”']},
  {t:'box',bt:'İlgiyi canlı tutma',items:['“You’ll never guess what happened. / Guess what? / The strangest thing was… / To cut a long story short…”']},
  {t:'box',bt:'Duyguları anlatma',items:['“I was terrified / relieved / thrilled / gutted. / It was such a relief.”']},
  {t:'h3',v:'Model + Analiz (8’)'},
  {t:'p',v:'Öğretmen 45-60 saniyelik kişisel bir anı anlatır; öğrenci hangi zamanların ve bağlaçların kullanıldığını işaretler.'},
  {t:'h3',v:'Ana Etkinlik — Anlatı Tetikleyicileri (22’)'},
  {t:'ul',v:['A time you were nervous but it went well.','A trip that didn’t go as planned.','A time technology saved or ruined your day.','A memorable first day (job / school / city).','The best or worst decision you ever made.']},
  {t:'p',v:'Öğrenci 2 prompt seçer, her birini 1,5-2 dk anlatır; öğretmen 3 takip sorusu sorar (“What happened next? How did you feel?”), sonra kısa düzeltme. İkinci anlatımda “ilgi canlı tutma” kalıplarından en az birini kullan.'},
  {t:'h3',v:'Hata Düzeltme + Kapanış (7’)'},
  {t:'p',v:'Zaman hataları birlikte düzeltilir; öğrenci en beğendiği anıyı tek cümlelik bir “teaser” ile özetler.'},
  {t:'hw',v:'<b>Yazı:</b> Bir anını 12-15 cümlelik bir hikâye olarak yaz: past continuous ile sahneyi kur, past simple ile olayları anlat, en az 4 sıralama bağlacı ve 2 duygu ifadesi kullan. Sözlü anlatmaya da hazır gel.'}
 ]},

{no:9,skill:'write',title:'Yazı — Profesyonel E-postalar',

  {t:'p',v:'<b>1. deneme:</b> Öğrenci 3-4 dk sunar; öğretmen 3 soru sorar. <b>2. deneme:</b> Geri bildirim sonrası aynı sunum, daha akıcı + en az 2 vocal tool ve signposting kalıplarıyla.'},
  {t:'h3',v:'Kurs Kapanışı (5’)'},
  {t:'p',v:'10 ders boyunca gelişim özeti: güçlü yönler + 2-3 odak alanı. Sonraki adımların planı.'},
  {t:'hw',v:'<b>Yazı:</b> (1) Sunumunun tam metnini/planını yaz (giriş-gelişme-sonuç, signposting kalıplarıyla). (2) Kurs boyunca öğrendiğin en yararlı 5 şeyi ve bundan sonra çalışmak istediğin 3 konuyu içeren kısa bir “öğrenme günlüğü” yaz.'}
 ]}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// NOTE: content strings intentionally allow inline <b>/<i> tags authored above.

function renderBlock(b){
  if(b.t==='p') return '<p>'+b.v+'</p>';
  if(b.t==='h3') return '<h3>'+b.v+'</h3>';
  if(b.t==='ul') return '<ul>'+b.v.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if(b.t==='qs') return '<ol class="oz-qs">'+b.v.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
  if(b.t==='box') return '<div class="oz-box"><div class="bt">'+b.bt+'</div><ul>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
  if(b.t==='qa') return '<div class="oz-qa"><div class="q">'+b.q+'</div><div class="a">'+b.a+'</div></div>';
  if(b.t==='hw') return '<div class="oz-hw"><b>Ödev.</b> '+b.v+'</div>';
  if(b.t==='note') return '<div class="oz-note">'+b.v+'</div>';
  if(b.t==='src') return '<div class="oz-src">'+b.v+'</div>';
  if(b.t==='video') return '<div class="oz-video"><iframe src="https://www.youtube-nocookie.com/embed/'+b.id+'?rel=0" title="TED" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
  if(b.t==='link') return '<a class="oz-link" href="'+b.url+'" target="_blank" rel="noopener noreferrer">'+b.label+' ↗</a>';
  return '';
}

function selectLesson(no){
  var L=null; for(var i=0;i<LESSONS.length;i++){ if(LESSONS[i].no===no){L=LESSONS[i];break;} }
  if(!L) return;
  var sk=SKILL[L.skill];
  var main=document.getElementById('ozMain');
  main.innerHTML='<div class="oz-mhead">'+
      '<span class="n">'+L.no+'</span>'+
      '<h2>'+esc(L.title)+'</h2>'+
      '<span class="oz-badge" style="background:'+sk.color+'">'+sk.label+'</span>'+
    '</div>'+
    '<div class="oz-obj">'+L.objective+'</div>'+
    '<div class="oz-time">⏱ '+L.timing+'</div>'+
    '<div class="oz-body">'+L.blocks.map(renderBlock).join('')+'</div>';
  // active state in nav
  var nav=document.getElementById('ozNav');
  nav.querySelectorAll('.oz-navitem').forEach(function(b){
    b.classList.toggle('active', parseInt(b.getAttribute('data-no'),10)===no);
  });
  try{ history.replaceState(null,'','#les'+no); }catch(e){}
  // scroll: on mobile bring content into view; on desktop scroll page top of main
  if(window.innerWidth<=820){ document.getElementById('ozMain').scrollIntoView({behavior:'smooth',block:'start'}); }
  else{ window.scrollTo({top:0,behavior:'smooth'}); }
}

function render(){
  var nav=document.getElementById('ozNav');
  nav.innerHTML=LESSONS.map(function(L){
    var sk=SKILL[L.skill];
    return '<button class="oz-navitem" data-no="'+L.no+'" title="'+esc(L.title)+'">'+
      '<span class="n">'+L.no+'</span>'+
      '<span class="ttl">'+esc(L.title)+'</span>'+
      '<span class="dot" style="background:'+sk.color+'"></span>'+
    '</button>';
  }).join('');
  nav.querySelectorAll('.oz-navitem').forEach(function(b){
    b.addEventListener('click',function(){ selectLesson(parseInt(b.getAttribute('data-no'),10)); });
  });
  document.getElementById('ozLoading').style.display='none';
  document.getElementById('ozWrap').style.display='';
  // open from hash or default to lesson 1
  var m=(location.hash||'').match(/les(\d+)/);
  selectLesson(m?parseInt(m[1],10):1);
}
</script>
