n bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Bamboo is one of the fastest-growing plants on Earth.\n- Some species can grow nearly a meter in a single day.\n- Bamboo is technically a type of grass.\n- It is used for construction, furniture, and food.", "stem": "The student wants to emphasize how fast bamboo grows. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bamboo can grow quickly even in poor, rocky soil.", "B": "Bamboo grows so fast that entire forests can appear within a few months.", "C": "Bamboo grows faster than any tree in the tropical rainforest.", "D": "Bamboo is among the fastest-growing plants on Earth, with some species growing nearly a meter in a single day."}, "correct": "D", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is bamboo's growth speed; A joins the 'fastest-growing' claim with the meter-a-day figure, both in the notes.", "why_wrong": {"B": "The claim about whole forests appearing in months is not in the notes.", "C": "The comparison to rainforest trees appears nowhere in the notes.", "A": "The claim about poor, rocky soil is not in the notes."}}, {"id": "u3-l2-f3-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The human brain contains around 86 billion neurons.\n- Neurons communicate through electrical and chemical signals.\n- The brain uses about 20 percent of the body's energy.\n- It makes up only about 2 percent of body weight.", "stem": "The student wants to emphasize how much energy the brain uses relative to its size. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Though it is only about 2 percent of body weight, the brain uses roughly 20 percent of the body's energy.", "B": "The brain uses more energy than any other organ in the human body.", "C": "The brain's energy demand rises sharply when a person is solving problems.", "D": "The brain burns most of its energy while a person sleeps."}, "correct": "A", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi"}, "why_correct": "The goal is energy relative to size; A pairs the 2 percent weight with the 20 percent energy, both from the notes.", "why_wrong": {"B": "The claim that it uses more than any other organ is not in the notes.", "C": "The claim about problem-solving is not in the notes.", "D": "The claim about sleep is not in the notes."}}, {"id": "u3-l2-f3-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Mount Everest is the highest mountain above sea level, at 8,849 meters.\n- Its summit was first reached in 1953.\n- Climbers face extreme cold and thin air near the top.\n- The 'death zone' above 8,000 meters has too little oxygen to survive for long.", "stem": "The student wants to explain the dangers climbers face near Everest's summit. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Near the summit, sudden avalanches are the leading cause of climber deaths.", "B": "Near the summit, climbers face extreme cold and, in the 'death zone' above 8,000 meters, air too thin to survive for long.", "C": "Climbers near the top must also contend with fierce, unpredictable winds.", "D": "The route to the summit is crowded with hundreds of climbers each season."}, "correct": "B", "choice_families": {"C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is the dangers near the summit; A joins the extreme cold with the low-oxygen death zone, both from the notes.", "why_wrong": {"C": "The claim about fierce winds is not in the notes.", "D": "The claim about crowding is not in the notes.", "A": "The claim about avalanches being the leading cause of death is not in the notes."}}, {"id": "u3-l2-f3-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Amazon rainforest produces a large share of the world's oxygen.\n- It is home to millions of species of plants and animals.\n- It spans nine countries in South America.\n- Large areas are cleared each year for farming.", "stem": "The student wants to convey the biological diversity of the Amazon. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Amazon shelters thousands of species still unknown to science.", "B": "The Amazon is home to more species of insects than anywhere else on Earth.", "C": "The Amazon, spanning nine countries, is home to millions of species of plants and animals.", "D": "The Amazon's rivers alone contain over 3,000 species of fish."}, "correct": "C", "choice_families": {"B": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is biological diversity; A pairs the nine-country span with the millions of species, both from the notes.", "why_wrong": {"B": "The claim about insects being the most anywhere is not in the notes.", "D": "The figure of 3,000 fish species is not in the notes.", "A": "The claim about thousands of unknown species is not in the notes."}}, {"id": "u3-l2-f3-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Sahara is the largest hot desert in the world.\n- It covers much of North Africa.\n- Daytime temperatures can exceed 45 degrees Celsius.\n- At night, temperatures can drop below freezing.", "stem": "The student wants to emphasize the Sahara's extreme temperature swings. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Sahara was once a green landscape with lakes and rivers.", "B": "In the Sahara, sandstorms can raise temperatures even higher during the day.", "C": "The Sahara's temperature swings are the widest of any desert on Earth.", "D": "In the Sahara, daytime temperatures can top 45 degrees Celsius, yet at night they can fall below freezing."}, "correct": "D", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is the temperature swing; A pairs the 45-degree days with the below-freezing nights, both from the notes.", "why_wrong": {"B": "The claim about sandstorms raising temperatures is not in the notes.", "C": "The claim that its swings are the widest of any desert is not in the notes.", "A": "The claim about a once-green Sahara is not in the notes."}}, {"id": "u3-l2-f3-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Eiffel Tower was completed in 1889.\n- It stands about 330 meters tall.\n- It was built for the World's Fair in Paris.\n- It was meant to be temporary but was kept for its use as a radio antenna.", "stem": "The student wants to explain why the Eiffel Tower was not torn down. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Though built as a temporary structure for the 1889 World's Fair, the Eiffel Tower was kept for its use as a radio antenna.", "B": "The Eiffel Tower was spared because Parisians had grown to love its silhouette.", "C": "The Eiffel Tower was kept because tearing down such a tall structure was too costly.", "D": "The Eiffel Tower survived because it quickly became a symbol of France."}, "correct": "A", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi"}, "why_correct": "The goal is why it was not torn down; A joins its temporary purpose with its retention as a radio antenna, both from the notes.", "why_wrong": {"B": "The claim that Parisians grew to love it is not in the notes.", "C": "The claim about demolition cost is not in the notes.", "D": "The claim that it became a symbol of France is not in the notes."}}, {"id": "u3-l2-f3-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Penguins are flightless birds.\n- Their wings have evolved into flippers for swimming.\n- Most species live in the Southern Hemisphere.\n- They huddle together in large groups to stay warm.", "stem": "The student wants to explain how penguins are adapted for life in water. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Penguins have a thick layer of blubber that keeps them warm in icy water.", "B": "Though penguins cannot fly, their wings have evolved into flippers that make them strong swimmers.", "C": "Penguins can dive to depths of more than 500 meters in search of food.", "D": "Penguins have webbed feet that help them steer while swimming."}, "correct": "B", "choice_families": {"C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is adaptation for water; A joins their flightlessness with the flippers that make them swimmers, both from the notes.", "why_wrong": {"C": "The diving-depth figure is not in the notes.", "D": "The claim about webbed feet is not in the notes.", "A": "The claim about blubber is not in the notes."}}, {"id": "u3-l2-f3-09", "unit": 3, "lesson": 2, "lesson_n     <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabi kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Dogru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlis.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazinda durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn ghost" data-action="start">Tekrar calis</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();}});
