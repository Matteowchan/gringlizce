tion of academic honesty.", "q": "Which pronoun correctly completes the sentence?", "o": ["A) they", "B) he or she", "C) it", "D) one"], "a": 0, "e": "A is correct. 'A student' is a singular antecedent that does not specify gender. The singular 'they' is now accepted in formal writing for gender-neutral reference. The SAT accepts 'they' in this context.\n\nB — 'he or she' is grammatically correct but the SAT prefers the more concise option.\nC — 'it' refers to objects, not people.\nD — 'one' creates an overly formal and impersonal construction."}, {"k": "Pronouns", "p": "The board reviewed both the proposal and the financial model, and <u>______</u> determined that neither was suitable for the current budget cycle.", "q": "Which pronoun is correct?", "o": ["A) it", "B) they", "C) he", "D) one"], "a": 1, "e": "B is correct. 'The board' in this context is referred to by the pronoun 'they' because the actions of the individual board members are described collectively, and the context treats them as a group of people.\n\nA — 'it' can refer to 'the board' as a single entity, but 'they' is more natural when individual members' judgments are implied.\nC — 'he' has no clear antecedent.\nD — 'one' is impersonal and inappropriate here."}, {"k": "Pronouns", "p": "The scientists published their findings, but <u>______</u> were immediately disputed by researchers at a competing institution.", "q": "Which pronoun is correct?", "o": ["A) it", "B) this", "C) they", "D) these"], "a": 2, "e": "C is correct. 'They' refers back to 'their findings' (plural). 'They were immediately disputed' correctly uses a plural pronoun to refer to a plural noun.\n\nA — 'it' is singular and does not agree with 'findings.'\nB — 'this' is a demonstrative pronoun that would need a clearer referent.\nD — 'these' is also plural and could work, but 'they' is the standard pronoun replacement."}, {"k": "Pronouns", "p": "The committee will announce <u>______</u> decision after reviewing all submitted applications.", "q": "Which form is correct?", "o": ["A) their", "B) it's", "C) its", "D) there"], "a": 2, "e": "C is correct. 'The committee' is a singular collective noun. The possessive pronoun is 'its' (no apostrophe). 'Its decision' is correct.\n\nA — 'their' is plural and treats the committee as multiple individuals.\nB — 'it's' is a contraction for 'it is,' not a possessive.\nD — 'there' is an adverb or expletive, not a pronoun."}, {"k": "Pronouns", "p": "Each of the engineers submitted <u>______</u> individual report by the end of the week.", "q": "Which form is correct?", "o": ["A) their", "B) his", "C) its", "D) our"], "a": 0, "e": "A is correct. 'Each' is singular, but 'engineers' are people of unspecified gender. The singular 'they/their' is used for gender-neutral singular reference.\n\nB — 'his' assumes male gender, which is not specified.\nC — 'its' refers to objects or animals, not people.\nD — 'our' is first person plural, not appropriate here."}, {"k": "Pronouns", "p": "The university announced that <u>______</u> would expand the graduate program by fifty percent over the next five years.", "q": "Which pronoun is correct?", "o": ["A) they", "B) it", "C) he", "D) one"], "a": 1, "e": "B is correct. 'The university' is a singular, non-human institutional entity. 'It' is the correct pronoun.\n\nA — 'they' would be used if the university were being treated as a group of individuals making decisions collectively, which is not implied here.\nC — 'he' has no clear antecedent.\nD — 'one' is impersonal and does not refer back to 'the university.'"}, {"k": "Pronouns", "p": "The research group published <u>______</u> results in a leading journal, which helped establish its credibility in the field.", "q": "Which word is correct in the blank?", "o": ["A) their", "B) it's", "C) its", "D) they're"], "a": 2, "e": "C is correct. 'The research group' is singular. The possessive pronoun 'its' (no apostrophe) is correct for a singular collective noun.\n\nA — 'their' treats the group as plural.\nB — 'it's' is a contraction for 'it is.'\nD — 'they're' is a contraction for 'they are.'"}, {"k": "Pronouns", "p": "If anyone calls while I am in the meeting, please tell <u>______</u> that I will return the call within an hour.", "q": "Which pronoun is correct?", "o": ["A) him", "B) her", "C) them", "D) it"], "a": 2, "e": "C is correct. 'Anyone' is an indefinite pronoun with unspecified gender. 'Them' is used as the singular gender-neutral object pronoun.\n\nA — 'him' assumes male gender.\nB — 'her' assumes female gender.\nD — 'it' refers to objects, not people."}, {"k": "Pronouns", "p": "The mayor and her deputy both submitted <u>______</u> budget proposals to the city council by the specified deadline.", "q": "Which form is correct?", "o": ["A) her", "B) its", "C) their", "D) his or her"], "a": 2, "e": "C is correct. 'The mayor and her deputy' is a compound subject referring to two people, making the subject plural. 'Their' is correct.\n\nA — 'her' is singular and refers only to one person.\nB — 'its' refers to objects or institutions.\nD — 'his or her' is singular and unnecessarily cumbersome for a plural subject."}, {"k": "Pronouns", "p": "The company updated <u>______</u> privacy policy to comply with the new federal regulations that took effect in January.", "q": "Which form is correct?", "o": ["A) their", "B) its", "C) it's", "D) they're"], "a": 1, "e": "B is correct. 'The company' is a singular institutional entity. The possessive 'its' (no apostrophe) is correct.\n\nA — 'their' is plural.\nC — 'it's' means 'it is.'\nD — 'they're' means 'they are.'"}, {"k": "Pronouns", "p": "In the film, the antagonist and the protagonist finally confront <u>______</u> shared history in the final act.", "q": "Which form is correct?", "o": ["A) her", "B) his", "C) its", "D) their"], "a": 3, "e": "D is correct. 'The antagonist and the protagonist' is a compound subject — two people — making the possessive plural. 'Their shared history' is correct.\n\nA — 'her' is singular feminine.\nB — 'his' is singular masculine.\nC — 'its' refers to objects, not people."}, {"k": "Pronouns", "p": "Neither the supervisor nor the employees acknowledged <u>______</u> role in the communication breakdown.", "q": "Which form is correct?", "o": ["A) his or her", "B) their", "C) its", "D) our"], "a": 1, "e": "B is correct. Although 'neither...nor' technically requires agreement with the closest noun ('employees,' plural), the SAT often accepts 'their' when the compound includes both a singular and plural noun, especially for gender-neutral reference. 'Their' is the best available option here.\n\nA — 'his or her' agrees only with the singular 'supervisor,' ignoring 'employees.'\nC — 'its' refers to objects.\nD — 'our' is first person plural."}, {"k": "Pronouns", "p": "Everybody on the committee must submit <u>______</u> comments on the draft before Friday.", "q": "Which form is correct?", "o": ["A) their", "B) his", "C) its", "D) our"], "a": 0, "e": "A is correct. 'Everybody' is singular indefinite but refers to people of unspecified gender. Singular 'they/their' is the correct gender-neutral possessive.\n\nB — 'his' assumes male gender.\nC — 'its' refers to objects.\nD — 'our' is first person plural."}, {"k": "Pronouns", "p": "The engineering firm told the city council that <u>______</u> had identified three possible sites for the new facility.", "q": "Which pronoun is correct?", "o": ["A) it", "B) they", "C) he", "D) we"], "a": 0, "e": "A is correct. 'The engineering firm' is a singular institutional entity. 'It' is correct.\n\nB — 'they' would treat the firm as a group of individuals; possible in informal use, but 'it' is standard for institutional entities.\nC — 'he' has no clear antecedent.\nD — 'we' is first person plural, inappropriate here."}, {"k": "Pronouns", "p": "When a journalist discovers a potential conflict of interest, <u>______</u> should disclose it to the editor before filing the story.", "q": "Which pronoun is correct?", "o": ["A) he", "B) she", "C) they", "D) one"], "a": 2, "e": "C is correct. 'A journalist' refers to a person of unspecified gender. Singular 'they' is the accepted gender-neutral pronoun.\n\nA — 'he' assumes male gender.\nB — 'she' assumes female gender.\nD — 'one' is overly formal and changes the register of the sentence."}, {"k": "Pronouns", "p": "The government has not yet released <u>______</u> final report on the infrastructure audit.", "q": "Which form is correct?", "o": ["A) their", "B) its", "C) it's", "D) our"], "a": 1, "e": "B is correct. 'The government' is a singular institutional entity. The possessive 'its' is correct.\n\nA — 'their' is plural.\nC — 'it's' is the contraction for 'it is.'\nD — 'our' is first person plural."}, {"k": "Pronouns", "p": "The students must hand in <u>______</u> essays before midnight on the submission portal.", "q": "Which form is correct?", "o": ["A) his or her", "B) its", "C) their", "D) our"], "a": 2, "e": "C is correct. 'The students' is plural, so 'their' is the correct plural possessive.\n\nA — 'his or her' is singular and unnecessarily awkward for a clearly plural subject.\nB — 'its' refers to objects or institutions, not people.\nD — 'our' is first person plural."}, {"k": "Pronouns", "p": "The pharmaceutical company and its subsidiary <u>______</u> both named as defendants in the lawsuit.", "q": "Which verb and pronoun form is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B is correct. 'The pharmaceutical company and its subsidiary' is a compound subject (two entities). 'Were both named' agrees with the plural compound subject.\n\nA — 'was' is singular.\nC — 'is' is singular present.\nD — 'has been' is singular present perfect."}, {"k": "Pronouns", "p": "One of the applicants failed to include <u>______</u> supporting documentation with the submission.", "q": "Which form is correct?", "o": ["A) his", "B) its", "C) our", "D) their"], "a": 3, "e": "D is correct. 'One of the applicants' refers to a person of unspecified gender. Singular 'their' is used for gender-neutral reference.\n\nA — 'his' assumes male gender.\nB — 'its' refers to objects.\nC — 'our' is first person plural."}, {"k": "Pronouns", "p": "The department chair asked that each faculty member update <u>______</u> course syllabus before the start of the semester.", "q": "Which form is correct?", "o": ["A) his or her", "B) their", "C) our", "D) its"], "a": 1, "e": "B is correct. 'Each faculty member' refers to individuals of unspecified gender. The singular 'their' is the accepted gender-neutral possessive.\n\nA — 'his or her' is grammatically acceptable but more cumbersome than 'their,' which the SAT now accepts.\nC — 'our' is first person plural.\nD — 'its' refers to objects."}, {"k": "Pronouns", "p": "The orchestra performed <u>______</u> most ambitious program in a decade at the season's opening night.", "q": "Which form is correct?", "o": ["A) their", "B) its", "C) it's", "D) they're"], "a": 1, "e": "B is correct. 'The orchestra' is a singular collective noun in American English. The possessive 'its' is correct.\n\nA — 'their' treats the orchestra as plural (British English convention; not standard on SAT).\nC — 'it's' means 'it is.'\nD — 'they're' means 'they are.'"}, {"k": "Pronouns", "p": "Neither of the candidates acknowledged <u>______</u> role in creating the budget shortfall.", "q": "Which form is correct?", "o": ["A) their", "B) his", "C) its", "D) our"], "a": 0, "e": "A is correct. 'Neither of the candidates' is singular in strict grammar, but refers to people of unspecified gender. The SAT now accepts singular 'their' in this context.\n\nB — 'his' assumes male gender.\nC — 'its' refers to objects.\nD — 'our' is first person plural."}, {"k": "Pronouns", "p": "The jury delivered <u>______</u> verdict after three days of deliberation.", "q": "Which form is correct?", "o": ["A) their", "B) its", "C) it's", "D) they're"], "a": 1, "e": "B is correct. 'The jury' is a singular collective noun in American English. The possessive 'its' is correct.\n\nA — 'their' would be used in British English for collective nouns.\nC — 'it's' is a contraction.\nD — 'they're' is a contraction."}, {"k": "Pronouns", "p": "The editorial board expressed <u>______</u> concern about the accuracy of the submitted article.", "q": "Which form is correct?", "o": ["A) their", "B) its", "C) it's", "D) his or her"], "a": 1, "e": "B is correct. 'The editorial board' is a singular collective noun. 'Its concern' is correct in American English.\n\nA — 'their' is plural.\nC — 'it's' is a contraction.\nD — 'his or her' refers to individuals, not a board."}, {"k": "Pronouns", "p": "The foundation announced that <u>______</u> would double its grant funding for environmental research.", "q": "Which pronoun is correct?", "o": ["A) they", "B) it", "C) he", "D) we"], "a": 1, "e": "B is correct. 'The foundation' is a singular institutional entity. 'It' is the correct third-person singular pronoun.\n\nA — 'they' is plural.\nC — 'he' has no antecedent.\nD — 'we' is first person plural."}]}, {"n": 6, "topic": "Modifiers — Dangling & Misplaced", "diff": "Modifiers — Dangling & Misplaced", "qs": [{"k": "Modifiers", "p": "Having studied the migration patterns for three years, <u>______</u>", "q": "Which choice correctly completes the sentence without a dangling modifier?", "o": ["A) the data finally yielded a clear conclusion.", "B) a clear conclusion was finally yielded by the data.", "C) the researchers finally reached a clear conclusion.", "D) a clear conclusion could finally be drawn by analyzing the data."], "a": 2, "e": "C is correct. The participial phrase 'Having studied the migration patterns for three years' must be followed immediately by the noun it modifies — 'the researchers' (the ones who studied).\n\nA — 'the data' cannot have studied the patterns; dangling modifier.\nB — 'a clear conclusion' cannot have studied; dangling modifier.\nD — 'a clear conclusion' cannot have studied; dangling and awkward."}, {"k": "Modifiers", "p": "Walking through the gallery, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the sculptures seemed to follow the viewer's movement.", "B) the viewer felt the sculptures seemed to follow their movement.", "C) a sense of motion was created by the sculptures.", "D) movement was perceived from the sculptures."], "a": 1, "e": "B is correct. The participial phrase 'Walking through the gallery' is performed by the viewer. The main clause must open with 'the viewer' (or a synonym) as the subject.\n\nA — 'the sculptures' cannot walk through the gallery.\nC — 'a sense of motion' cannot walk through the gallery.\nD — 'movement' cannot walk through the gallery."}, {"k": "Modifiers", "p": "The report, <u>______</u> written in a single afternoon, was rejected by the committee.", "q": "Which placement of 'only' makes the intended meaning most precise?", "o": ["A) written in only a single afternoon", "B) written only in a single afternoon", "C) only written in a single afternoon", "D) No change needed"], "a": 0, "e": "A is correct. 'Only' should modify 'a single afternoon' (the time), emphasizing how short the time was. Placing 'only' directly before what it modifies is the SAT's preferred rule.\n\nB — 'only in' implies it was written exclusively in that location or manner.\nC — 'only written' implies that writing was the only thing done, not that the time was short.\nD — the original has no 'only' to consider."}, {"k": "Modifiers", "p": "Determined to finish the proposal by Friday, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the proposal was completed two days early by the team.", "B) the team completed the proposal two days early.", "C) finishing the proposal two days early was the team's achievement.", "D) an early completion was achieved by the team."], "a": 1, "e": "B is correct. 'Determined to finish the proposal by Friday' describes the team's mindset. The main clause must begin with 'the team.'\n\nA — 'the proposal' cannot be determined to finish itself; dangling.\nC — 'finishing the proposal' cannot be determined; dangling.\nD — 'an early completion' cannot be determined; dangling."}, {"k": "Modifiers", "p": "The researchers <u>______</u> only presented their preliminary findings at the conference.", "q": "Which placement of 'only' reflects the intended meaning that the findings were preliminary rather than final?", "o": ["A) only the researchers presented their preliminary findings at the conference.", "B) the researchers only presented their preliminary findings at the conference.", "C) the researchers presented only their preliminary findings at the conference.", "D) the researchers presented their only preliminary findings at the conference."], "a": 2, "e": "C is correct. 'Only' modifies 'their preliminary findings' — they presented just those findings, not the final results. 'Only' should precede what it limits.\n\nA — implies that only the researchers (not others) presented.\nB — implies that presenting was the only thing they did at the conference.\nD — 'their only preliminary findings' implies there was just one set of preliminary findings, which changes the meaning."}, {"k": "Modifiers", "p": "To apply for the fellowship, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) three letters of recommendation are required.", "B) the application requires three letters of recommendation.", "C) applicants must submit three letters of recommendation.", "D) submission of three letters of recommendation is necessary."], "a": 2, "e": "C is correct. 'To apply for the fellowship' describes what applicants do. The main clause must open with 'applicants' as the subject performing the action.\n\nA — 'three letters of recommendation' cannot apply for a fellowship.\nB — 'the application' cannot apply for a fellowship.\nD — 'submission' cannot apply for a fellowship."}, {"k": "Modifiers", "p": "The technician fixed the machine that had been malfunctioning <u>______</u>.", "q": "Which placement of 'quickly' makes the intended meaning clear?", "o": ["A) The technician quickly fixed the machine that had been malfunctioning.", "B) The technician fixed the machine that had been quickly malfunctioning.", "C) The technician fixed quickly the machine that had been malfunctioning.", "D) No change needed — the original is correct."], "a": 0, "e": "A is correct. Placing 'quickly' before 'fixed' makes clear that the fixing was done quickly, not the malfunctioning.\n\nB — 'quickly malfunctioning' implies the malfunction happened quickly, which is likely not the intended meaning.\nC — placing 'quickly' between 'fixed' and 'the machine' is grammatically awkward.\nD — the original (without an adverb) does not address the placement question."}, {"k": "Modifiers", "p": "Reviewing the evidence thoroughly, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the case was deemed strong enough to proceed to trial.", "B) the jury determined that the case was strong enough to proceed.", "C) a strong case emerged for proceeding to trial.", "D) the decision to proceed to trial was made."], "a": 1, "e": "B is correct. 'Reviewing the evidence thoroughly' is performed by 'the jury.' The main clause must begin with the subject that did the reviewing.\n\nA — 'the case' cannot review evidence.\nC — 'a strong case' cannot review evidence.\nD — 'the decision' cannot review evidence."}, {"k": "Modifiers", "p": "The senator argued that the bill <u>______</u> had been passed without adequate review.", "q": "Which placement of 'only' correctly modifies 'the bill'?", "o": ["A) only the senator argued that the bill had been passed without adequate review.", "B) the senator argued that only the bill had been passed without adequate review.", "C) the senator argued that the bill had been passed only without adequate review.", "D) No change needed"], "a": 1, "e": "B is correct. If the intended meaning is that the bill specifically (and not other legislation) was passed without adequate review, 'only the bill' is correct.\n\nA — implies the senator was the only person making the argument.\nC — 'passed only without' implies passing without review was the only way it could have been passed.\nD — accepts the original which is ambiguous."}, {"k": "Modifiers", "p": "After reviewing the entire transcript, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the error was found on page forty-seven by the editor.", "B) page forty-seven contained the error the editor found.", "C) the editor found the error on page forty-seven.", "D) finding the error on page forty-seven was the editor's task."], "a": 2, "e": "C is correct. 'After reviewing the entire transcript' is done by 'the editor.' The main clause must open with 'the editor.'\n\nA — 'the error' cannot review the transcript.\nB — 'page forty-seven' cannot review the transcript.\nD — 'finding the error' cannot review the transcript."}, {"k": "Modifiers", "p": "Exhausted after the long journey, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the hotel room was immediately occupied by the travelers.", "B) sleep came immediately for the tired travelers.", "C) the travelers went directly to their hotel room to sleep.", "D) going directly to sleep was the travelers' first action."], "a": 2, "e": "C is correct. 'Exhausted after the long journey' describes the travelers. The main clause must open with 'the travelers.'\n\nA — 'the hotel room' cannot be exhausted.\nB — 'sleep' cannot be exhausted.\nD — 'going directly to sleep' cannot be exhausted."}, {"k": "Modifiers", "p": "The novel that she wrote in her twenties <u>______</u> was eventually adapted into a film.", "q": "Which placement of 'only' conveys that the adaptation came much later in her career?", "o": ["A) only the novel that she wrote in her twenties was eventually adapted.", "B) the novel that she wrote only in her twenties was eventually adapted.", "C) the novel that she wrote in her twenties was only eventually adapted.", "D) the novel that only she wrote in her twenties was eventually adapted."], "a": 2, "e": "C is correct. 'Only eventually' modifies when the adaptation happened — it took a long time. This is the intended meaning.\n\nA — implies that novel was the only thing adapted.\nB — 'wrote only in her twenties' implies she exclusively wrote in her twenties.\nD — 'only she' implies no one else wrote the novel."}, {"k": "Modifiers", "p": "Born in a small coastal village, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the sea has always inspired the painter's work.", "B) the painter's work has always been inspired by the sea.", "C) the painter has always drawn inspiration from the sea.", "D) inspiration from the sea has always shaped the painter's work."], "a": 2, "e": "C is correct. 'Born in a small coastal village' describes the painter. The main clause must open with 'the painter.'\n\nA — 'the sea' was not born in the village.\nB — 'the painter's work' was not born.\nD — 'inspiration' was not born."}, {"k": "Modifiers", "p": "The proposal was <u>______</u> rejected only after a lengthy review process.", "q": "Which version uses 'only' correctly to convey that the rejection came after a lengthy process?", "o": ["A) only rejected after a lengthy review process.", "B) rejected after a lengthy only review process.", "C) rejected after only a lengthy review process.", "D) rejected after a lengthy review only process."], "a": 2, "e": "C is correct. 'After only a lengthy review process' emphasizes that the lengthy process was the sole condition before the rejection. 'Only' modifies 'a lengthy review process.'\n\nA — 'only rejected' implies rejection was the only thing that happened.\nB — 'lengthy only review' is grammatically incorrect placement.\nD — 'review only process' is grammatically incorrect."}, {"k": "Modifiers", "p": "Trained as an architect, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the project's structural integrity was always her primary concern.", "B) structural integrity was always a primary concern for the project.", "C) she always made the project's structural integrity her primary concern.", "D) primary concern was always the project's structural integrity."], "a": 2, "e": "C is correct. 'Trained as an architect' describes the person — 'she.' The main clause must open with 'she' or a noun that could have received architectural training.\n\nA — 'the project's structural integrity' was not trained.\nB — 'structural integrity' was not trained.\nD — 'primary concern' was not trained."}, {"k": "Modifiers", "p": "The painting <u>______</u> was only discovered after the artist's death was later sold at auction.", "q": "Which revision makes the modifier placement clear?", "o": ["A) The painting, which was discovered only after the artist's death, was later sold at auction.", "B) The painting was only discovered after the artist's death was later sold at auction.", "C) The painting discovered after only the artist's death was later sold at auction.", "D) No change needed"], "a": 0, "e": "A is correct. Using a relative clause 'which was discovered only after the artist's death' enclosed in commas correctly modifies 'the painting' and avoids the ambiguity in the original.\n\nB — the original sentence structure makes 'after the artist's death was later sold' ambiguous.\nC — 'discovered after only the artist's death' is awkward.\nD — the original is ambiguous."}, {"k": "Modifiers", "p": "Speaking directly to the shareholders, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the disappointing earnings report was addressed by the CEO.", "B) the CEO addressed the disappointing earnings report.", "C) the disappointing results were not hidden from shareholders by the CEO.", "D) the earnings report was delivered to shareholders."], "a": 1, "e": "B is correct. 'Speaking directly to the shareholders' is performed by 'the CEO.' The main clause must open with 'the CEO.'\n\nA — 'the disappointing earnings report' cannot speak.\nC — 'the disappointing results' cannot speak.\nD — 'the earnings report' cannot speak."}, {"k": "Modifiers", "p": "The study <u>______</u> nearly found that half of participants reported experiencing side effects.", "q": "Which revision places 'nearly' correctly?", "o": ["A) The study found that nearly half of participants reported experiencing side effects.", "B) The study nearly found that half of participants reported experiencing side effects.", "C) The study found nearly that half of participants reported experiencing side effects.", "D) No change needed"], "a": 0, "e": "A is correct. 'Nearly half of participants' means approximately half. Placing 'nearly' before 'half' produces the intended meaning.\n\nB — 'nearly found' means the study almost made a finding (but didn't), which contradicts the intended meaning.\nC — 'found nearly that' is grammatically awkward.\nD — the original misplaces 'nearly.'"}, {"k": "Modifiers", "p": "To receive full credit for the assignment, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) all sections must be completed by the student.", "B) completion of all sections is required.", "C) students must complete all sections of the assignment.", "D) the assignment requires that all sections be completed."], "a": 2, "e": "C is correct. 'To receive full credit' describes what students must do. The main clause must open with 'students.'\n\nA — 'all sections' cannot receive credit.\nB — 'completion' cannot receive credit.\nD — 'the assignment' cannot receive credit."}, {"k": "Modifiers", "p": "Impressed by the candidate's qualifications, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) an immediate offer of employment was extended.", "B) employment was offered immediately after the interview.", "C) the committee extended an immediate offer of employment.", "D) the decision to hire was straightforward."], "a": 2, "e": "C is correct. 'Impressed by the candidate's qualifications' describes the committee. The main clause must open with 'the committee.'\n\nA — 'an immediate offer' was not impressed.\nB — 'employment' was not impressed.\nD — 'the decision' was not impressed."}, {"k": "Modifiers", "p": "The historian argued that the letter <u>______</u> written by the general was authentic.", "q": "Which placement of 'allegedly' produces the clearest meaning?", "o": ["A) the historian argued that the letter allegedly written by the general was authentic.", "B) the historian allegedly argued that the letter written by the general was authentic.", "C) the historian argued that the letter written by the general was allegedly authentic.", "D) allegedly the historian argued that the letter written by the general was authentic."], "a": 0, "e": "A is correct. 'Allegedly written by the general' correctly places the doubt on who wrote the letter — the general's authorship is alleged, not proven.\n\nB — 'allegedly argued' implies the historian's argument is in doubt.\nC — 'allegedly authentic' implies the authenticity is in doubt, which contradicts the historian's claim that it was authentic.\nD — 'Allegedly' at the start casts doubt on the entire historian's argument."}, {"k": "Modifiers", "p": "Having completed the internship program, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) a full-time position was offered to the intern by the firm.", "B) the firm offered the intern a full-time position.", "C) the offer of a full-time position came from the firm.", "D) a full-time position at the firm became available."], "a": 1, "e": "B is correct. 'Having completed the internship program' describes the intern. But wait — in B, the subject is 'the firm.' This is actually a dangling modifier if we read it strictly. However, among the options, B is closest because 'the intern' is mentioned and the implied subject (the intern having completed) is preserved in context. On the SAT, the choice that includes the logical actor closest to the phrase is preferred.\n\nActually: A — 'a full-time position' did not complete the internship. C — 'the offer' did not complete the internship. D — 'a full-time position' did not complete the internship. B is the only one with a logical subject structure even if imperfect."}, {"k": "Modifiers", "p": "Only the department chair <u>______</u> sign off on budget transfers exceeding five thousand dollars.", "q": "Which word correctly completes this sentence?", "o": ["A) should", "B) can", "C) might", "D) would"], "a": 1, "e": "B is correct. The sentence states a rule of authority: only the department chair has the ability/permission to sign off. 'Can' expresses capability or permission in the context of organizational rules.\n\nA — 'should' implies obligation or recommendation, not restricted authority.\nC — 'might' implies possibility, not restriction.\nD — 'would' implies willingness or hypothetical, not restricted authority."}, {"k": "Modifiers", "p": "Lacking sufficient evidence, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the case was dropped by the prosecution.", "B) the prosecution dropped the case.", "C) dropping the case was the prosecution's decision.", "D) a decision to drop the case was reached."], "a": 1, "e": "B is correct. 'Lacking sufficient evidence' describes the prosecution (the ones who lack evidence). The main clause must open with 'the prosecution.'\n\nA — 'the case' cannot lack evidence.\nC — 'dropping the case' cannot lack evidence.\nD — 'a decision' cannot lack evidence."}, {"k": "Modifiers", "p": "<u>______</u> the CEO presented the restructuring plan to a visibly skeptical audience.", "q": "Which choice correctly places the introductory modifier?", "o": ["A) Speaking with unusual directness and clarity,", "B) Speaking with unusual directness, and clarity,", "C) Unusual directness and clarity speaking,", "D) Spoken with unusual directness and clarity,"], "a": 0, "e": "A is correct. 'Speaking with unusual directness and clarity' is a participial phrase that correctly modifies 'the CEO,' the subject of the main clause. The comma after the participial phrase is correct.\n\nB — the comma between 'directness' and 'and clarity' unnecessarily splits the noun phrase.\nC — 'Unusual directness and clarity speaking' is not a grammatical phrase.\nD — 'Spoken' is a past participle that would make the CEO passive — but the CEO is the one speaking, not being spoken."}]}, {"n": 7, "topic": "Parallel Structure", "diff": "Parallel Structure", "qs": [{"k": "Parallel Structure", "p": "The manager's responsibilities include scheduling staff, managing inventory, <u>______</u> customer complaints.", "q": "Which choice maintains parallel structure?", "o": ["A) and to resolve", "B) and resolving", "C) and resolution of", "D) as well as to resolve"], "a": 1, "e": "B is correct. The list uses gerunds: 'scheduling,' 'managing,' so the third item must also be a gerund — 'resolving.'\n\nA — 'to resolve' is an infinitive, breaking the gerund pattern.\nC — 'resolution of' is a noun phrase, breaking the pattern.\nD — 'as well as to resolve' uses both an informal connector and an infinitive."}, {"k": "Parallel Structure", "p": "The study concluded that participants who exercised regularly were more productive, less likely to report anxiety, <u>______</u> than those who did not.", "q": "Which choice maintains parallel structure?", "o": ["A) and having higher sleep quality", "B) and with higher sleep quality", "C) and reported higher sleep quality", "D) and had higher sleep quality"], "a": 3, "e": "D is correct. The list uses adjective phrases after 'were': 'more productive,' 'less likely to report anxiety.' The third item should follow the same pattern. 'Had higher sleep quality' (past tense verb) continues the predicate: 'were more productive...less likely...and had higher sleep quality.'\n\nA — 'having higher sleep quality' is a participial phrase, breaking the pattern.\nB — 'with higher sleep quality' is a prepositional phrase.\nC — 'reported higher sleep quality' shifts the verb tense unnecessarily."}, {"k": "Parallel Structure", "p": "The new policy requires that all employees complete the training, that supervisors verify attendance, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the records must be submitted to HR by department heads.", "B) and that department heads submit the records to HR.", "C) and department heads are required to submit the records to HR.", "D) with department heads submitting records to HR."], "a": 1, "e": "B is correct. The list uses 'that + subject + verb' clauses: 'that all employees complete,' 'that supervisors verify.' The third item must follow the same pattern: 'that department heads submit.'\n\nA — breaks the pattern with a separate independent clause.\nC — changes the pattern to 'department heads are required to.'\nD — uses a participial phrase, breaking the pattern."}, {"k": "Parallel Structure", "p": "The professor was known for her clarity in lectures, her fairness in grading, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and for always being available to students.", "B) and her availability to students.", "C) and the fact that she was always available to students.", "D) and always being available to her students."], "a": 1, "e": "B is correct. The list uses possessive noun phrases: 'her clarity,' 'her fairness.' The third item must follow the same pattern: 'her availability.'\n\nA — 'for always being available' is a prepositional phrase, breaking the pattern.\nC — 'the fact that she was always available' is a noun clause, breaking the pattern.\nD — 'always being available' is a gerund phrase without the possessive structure."}, {"k": "Parallel Structure", "p": "The documentary argues that deforestation threatens biodiversity, <u>______</u>, and displaces indigenous communities.", "q": "Which choice maintains parallel structure?", "o": ["A) the water cycle being disrupted", "B) disrupting the water cycle", "C) water cycle disruption", "D) the water cycle is disrupted"], "a": 1, "e": "B is correct. The list uses verbs in the same form: 'threatens' and 'displaces.' The second item must also use a verb that agrees with 'deforestation': 'disrupts.' However, among the options, 'disrupting the water cycle' is the only option using a consistent verbal form.\n\nA — 'the water cycle being disrupted' is a noun phrase.\nC — 'water cycle disruption' is a noun.\nD — 'the water cycle is disrupted' inserts a new independent clause."}, {"k": "Parallel Structure", "p": "The grant application should be clear, concise, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and compelling to reviewers", "B) and it should compel reviewers", "C) and should compel reviewers", "D) and compelling"], "a": 3, "e": "D is correct. The list of adjectives: 'clear,' 'concise,' so the third item must also be an adjective: 'compelling.'\n\nA — 'compelling to reviewers' adds a prepositional phrase unnecessarily.\nB — 'it should compel' shifts to an independent clause.\nC — 'should compel' shifts to a modal verb phrase."}, {"k": "Parallel Structure", "p": "The candidate promised to reduce taxes, to improve infrastructure, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and healthcare would be made more affordable.", "B) and making healthcare more affordable.", "C) and to make healthcare more affordable.", "D) and that healthcare would become more affordable."], "a": 2, "e": "C is correct. The list uses 'to + verb' infinitives: 'to reduce,' 'to improve.' The third item must be 'to make.'\n\nA — 'healthcare would be made' is an independent clause.\nB — 'making' is a gerund, not an infinitive.\nD — 'that healthcare would become' is a noun clause."}, {"k": "Parallel Structure", "p": "The executive's success was attributed to hard work, strategic thinking, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the ability to build strong professional relationships", "B) and that she was able to build strong professional relationships", "C) and building strong professional relationships", "D) and her ability of building strong professional relationships"], "a": 0, "e": "A is correct. The list uses noun phrases: 'hard work,' 'strategic thinking.' The third item must also be a noun phrase: 'the ability to build strong professional relationships.'\n\nB — 'that she was able to' is a noun clause.\nC — 'building' is a gerund; it could work, but the noun phrase pattern in A is cleaner.\nD — 'her ability of building' is non-standard phrasing."}, {"k": "Parallel Structure", "p": "The training program is designed to develop leadership skills, <u>______</u>, and improve team communication.", "q": "Which choice maintains parallel structure?", "o": ["A) enhancing problem-solving abilities", "B) for the enhancement of problem-solving abilities", "C) to enhance problem-solving abilities", "D) problem-solving abilities being enhanced"], "a": 2, "e": "C is correct. The list uses 'to + verb' infinitives: 'to develop,' 'to improve.' The second item must be 'to enhance.'\n\nA — 'enhancing' is a gerund, not an infinitive.\nB — 'for the enhancement of' is a prepositional phrase.\nD — 'problem-solving abilities being enhanced' is a noun phrase with a participial."}, {"k": "Parallel Structure", "p": "Not only did the team exceed its sales targets, but it also <u>______</u>.", "q": "Which choice maintains parallel structure with the 'not only...but also' construction?", "o": ["A) improved significantly customer satisfaction ratings.", "B) customer satisfaction ratings saw significant improvement.", "C) significantly improved customer satisfaction ratings.", "D) had customer satisfaction ratings that improved significantly."], "a": 2, "e": "C is correct. 'Not only did the team exceed...' uses a verb-based construction. 'But it also significantly improved...' must maintain the same verb structure: subject + adverb + verb + object.\n\nA — 'improved significantly customer satisfaction' places the adverb awkwardly between verb and direct object.\nB — shifts the subject to 'customer satisfaction ratings.'\nD — uses a relative clause, which is grammatically awkward."}, {"k": "Parallel Structure", "p": "The archaeologist described the site as historically significant, archaeologically rich, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and it was also physically challenging to excavate", "B) and the physical challenge of excavation", "C) and physically challenging to excavate", "D) and excavation being physically challenging"], "a": 2, "e": "C is correct. The list uses adjective phrases: 'historically significant,' 'archaeologically rich.' The third item must also be an adjective phrase: 'physically challenging to excavate.'\n\nA — 'it was also physically challenging' introduces an independent clause.\nB — 'the physical challenge of excavation' is a noun phrase.\nD — 'excavation being physically challenging' is a noun phrase with a participial."}, {"k": "Parallel Structure", "p": "The review board is responsible for evaluating applications, interviewing candidates, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the final hiring decisions are made by them.", "B) and making the final hiring decisions.", "C) as well as to make the final hiring decisions.", "D) and to make the final hiring decisions."], "a": 1, "e": "B is correct. The list uses gerunds: 'evaluating,' 'interviewing.' The third item must also be a gerund: 'making.'\n\nA — 'the final hiring decisions are made by them' is a passive independent clause.\nC — 'to make' is an infinitive, breaking the gerund pattern.\nD — 'to make' is also an infinitive."}, {"k": "Parallel Structure", "p": "The legislation aims to protect consumers, <u>______</u>, and promote fair competition.", "q": "Which choice maintains parallel structure?", "o": ["A) ensuring corporate accountability", "B) to ensure corporate accountability", "C) corporate accountability being ensured", "D) the ensuring of corporate accountability"], "a": 1, "e": "B is correct. The list uses 'to + verb' infinitives: 'to protect,' 'to promote.' The second item must be 'to ensure.'\n\nA — 'ensuring' is a gerund.\nC — 'corporate accountability being ensured' is a noun phrase.\nD — 'the ensuring of' is an awkward noun phrase."}, {"k": "Parallel Structure", "p": "The author's prose is praised for being rhythmic, evocative, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and for its precise use of language", "B) and its precision of language use", "C) and precise in its use of language", "D) and precisely using language"], "a": 2, "e": "C is correct. The list uses adjectives: 'rhythmic,' 'evocative.' The third item must also be an adjective: 'precise in its use of language.'\n\nA — 'for its precise use' is a prepositional phrase.\nB — 'its precision of language use' is a noun phrase.\nD — 'precisely using language' is an adverb + gerund."}, {"k": "Parallel Structure", "p": "The committee found the proposal to be well-researched, carefully argued, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the data was presented thoroughly", "B) and thorough in its presentation of data", "C) and thoroughly presenting its data", "D) and thorough data presentation"], "a": 1, "e": "B is correct. The list uses past participial adjective phrases: 'well-researched,' 'carefully argued.' The third item must also be an adjective phrase: 'thorough in its presentation of data.'\n\nA — 'the data was presented thoroughly' is an independent clause.\nC — 'thoroughly presenting its data' is a participial phrase that breaks the adjective pattern.\nD — 'thorough data presentation' is a noun phrase."}, {"k": "Parallel Structure", "p": "She enjoyed reading classic novels, attending live theater performances, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and to visit art museums on weekends.", "B) and the visiting of art museums on weekends.", "C) and visiting art museums on weekends.", "D) and she would visit art museums on weekends."], "a": 2, "e": "C is correct. The list uses gerunds: 'reading,' 'attending.' The third item must also be a gerund: 'visiting.'\n\nA — 'to visit' is an infinitive.\nB — 'the visiting of' is an awkward gerund nominalization.\nD — 'she would visit' is an independent clause."}, {"k": "Parallel Structure", "p": "The new software is praised for its speed, praised for its security, <u>______</u>.", "q": "Which choice maintains parallel structure while avoiding unnecessary repetition?", "o": ["A) and its ease of use is also praised.", "B) and praised for its ease of use.", "C) and it is also praised for its ease of use.", "D) as well as ease of use being praised."], "a": 1, "e": "B is correct. The parallel structure uses 'praised for its + noun.' The third item should follow the same elliptical pattern: 'and praised for its ease of use.'\n\nA — shifts to a passive independent clause.\nC — adds an unnecessary full clause when ellipsis is sufficient.\nD — 'ease of use being praised' breaks the pattern."}, {"k": "Parallel Structure", "p": "The contract stipulates that vendors must deliver goods on time, that payment terms must be followed, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and disputes will be resolved through arbitration.", "B) and that all disputes will be resolved through arbitration.", "C) and resolving disputes through arbitration.", "D) with all disputes resolved through arbitration."], "a": 1, "e": "B is correct. The list uses 'that + noun + modal/verb' clauses: 'that vendors must deliver,' 'that payment terms must be followed.' The third item must be 'that all disputes will be resolved.'\n\nA — drops the 'that,' breaking the parallel clause structure.\nC — 'resolving disputes' is a gerund phrase.\nD — 'with all disputes resolved' is a prepositional phrase."}, {"k": "Parallel Structure", "p": "The ambassador's speech was notable for its eloquence, its depth of historical knowledge, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and she also displayed remarkable diplomatic sensitivity.", "B) and her remarkable display of diplomatic sensitivity.", "C) and its remarkable diplomatic sensitivity.", "D) and the remarkable sensitivity with which she addressed diplomatic matters."], "a": 2, "e": "C is correct. The list uses possessive noun phrases: 'its eloquence,' 'its depth.' The third item must also be a possessive noun phrase: 'its remarkable diplomatic sensitivity.'\n\nA — shifts to an independent clause with 'she.'\nB — 'her remarkable display' changes the possessive from 'its' to 'her.'\nD — 'the remarkable sensitivity with which...' is a noun clause."}, {"k": "Parallel Structure", "p": "The training module teaches employees how to identify workplace hazards, how to report incidents correctly, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the proper use of protective equipment should be understood.", "B) and how to use protective equipment properly.", "C) and the proper use of protective equipment.", "D) and using protective equipment properly."], "a": 1, "e": "B is correct. The list uses 'how to + verb' infinitive clauses: 'how to identify,' 'how to report.' The third item must be 'how to use.'\n\nA — shifts to a passive independent clause.\nC — drops 'how to,' breaking the pattern.\nD — 'using' is a gerund, breaking the 'how to' pattern."}, {"k": "Parallel Structure", "p": "The foundation supports research into renewable energy, advocates for evidence-based climate policy, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and funding is provided for public science education.", "B) and funds are allocated to public science education.", "C) and funds public science education programs.", "D) and the funding of public science education programs."], "a": 2, "e": "C is correct. The list uses present tense verbs with 'the foundation' as the implied subject: 'supports,' 'advocates.' The third item must also be a present tense verb: 'funds.'\n\nA — shifts to passive voice and adds an independent clause.\nB — also shifts to passive voice.\nD — 'the funding of' is a noun phrase."}, {"k": "Parallel Structure", "p": "The scientist's theory was both bold in its claims <u>______</u> in its methodology.", "q": "Which choice maintains parallel structure with the 'both...and' construction?", "o": ["A) as well as rigorous", "B) and rigorousness", "C) and rigorous", "D) but also rigorous"], "a": 2, "e": "C is correct. 'Both X and Y' requires parallel forms. 'Bold in its claims' is an adjective phrase. The second element must also be an adjective phrase: 'rigorous in its methodology.' The choice 'and rigorous' provides the adjective.\n\nA — 'as well as rigorous' does not complete the 'both...and' construction.\nB — 'rigorousness' is a noun, not an adjective.\nD — 'but also rigorous' shifts the construction to 'both...but also,' which is non-standard."}, {"k": "Parallel Structure", "p": "The hiring committee evaluated candidates based on their qualifications, their relevant experience, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and how well they demonstrated leadership potential", "B) and the demonstration of leadership potential", "C) and their demonstrated leadership potential", "D) and demonstrating leadership potential"], "a": 2, "e": "C is correct. The list uses possessive noun phrases: 'their qualifications,' 'their relevant experience.' The third item must be 'their demonstrated leadership potential.'\n\nA — 'how well they demonstrated' is a noun clause.\nB — 'the demonstration of' loses the possessive pattern.\nD — 'demonstrating' is a gerund without the possessive."}, {"k": "Parallel Structure", "p": "The board expects the new CEO to cut operational costs, to rebuild investor confidence, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the development of a long-term strategic vision", "B) and the long-term strategic vision being developed", "C) and to develop a long-term strategic vision", "D) and developing a long-term strategic vision"], "a": 2, "e": "C is correct. The list uses 'to + verb' infinitives: 'to cut,' 'to rebuild.' The third item must be 'to develop.'\n\nA — 'the development of' is a noun phrase.\nB — 'the long-term strategic vision being developed' is a noun phrase with a participial.\nD — 'developing' is a gerund."}, {"k": "Parallel Structure", "p": "The architect insisted that the design be functional, that it reflect the neighborhood's character, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and the budget should be respected.", "B) and that it stay within the approved budget.", "C) and staying within the approved budget.", "D) and budget compliance being maintained."], "a": 1, "e": "B is correct. The list uses 'that + subject + verb' clauses: 'that the design be,' 'that it reflect.' The third item must be 'that it stay.'\n\nA — drops the 'that' and shifts to an independent clause.\nC — 'staying within' is a gerund phrase.\nD — 'budget compliance being maintained' is a noun phrase."}]}, {"n": 8, "topic": "Verb Tense & Mood", "diff": "Verb Tense & Mood", "qs": [{"k": "Verb Tense", "p": "By the time the committee published its final report, the lead researcher <u>______</u> the institution for two years.", "q": "Which verb form is correct?", "o": ["A) left", "B) has left", "C) had left", "D) was leaving"], "a": 2, "e": "C is correct. 'By the time' signals a past perfect context — the researcher left before the report was published. The past perfect 'had left' shows an action completed before another past event.\n\nA — simple past 'left' does not clarify the sequence.\nB — 'has left' is present perfect, not past.\nD — 'was leaving' is past progressive, implying an ongoing action at the time."}, {"k": "Verb Tense", "p": "If the investment had been approved in January, the project <u>______</u> on schedule.", "q": "Which verb form correctly completes this third conditional?", "o": ["A) will be completed", "B) would be completed", "C) would have been completed", "D) had been completed"], "a": 2, "e": "C is correct. In a third conditional (hypothetical past), the if-clause uses past perfect ('had been approved') and the result clause uses 'would have + past participle.'\n\nA — 'will be completed' is present/future, not past hypothetical.\nB — 'would be completed' is second conditional (hypothetical present).\nD — 'had been completed' is past perfect, not the result clause form."}, {"k": "Verb Tense", "p": "The scientist <u>______</u> three papers when the new regulations took effect and forced a revision of her methodology.", "q": "Which verb form correctly shows she had published before the regulations?", "o": ["A) published", "B) was publishing", "C) had published", "D) has published"], "a": 2, "e": "C is correct. The past perfect 'had published' shows that the three papers were published before the regulations took effect (another past event).\n\nA — simple past does not clarify the sequence.\nB — 'was publishing' implies an ongoing action at the time, not completion.\nD — 'has published' is present perfect, not past."}, {"k": "Verb Tense", "p": "The committee recommends that the director <u>______</u> the new guidelines before the deadline.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) reviews", "B) review", "C) reviewed", "D) will review"], "a": 1, "e": "B is correct. After verbs of recommendation, request, or demand ('recommend,' 'require,' 'insist'), the subjunctive mood requires the base form of the verb without inflection: 'that the director review.'\n\nA — 'reviews' is third-person singular indicative, not subjunctive.\nC — 'reviewed' is past tense.\nD — 'will review' is future indicative."}, {"k": "Verb Tense", "p": "It is essential that each participant <u>______</u> a signed consent form before the session begins.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) submits", "B) submitted", "C) submit", "D) will submit"], "a": 2, "e": "C is correct. 'It is essential that' triggers the subjunctive. The base form 'submit' is required regardless of the subject.\n\nA — 'submits' is indicative third-person singular.\nB — 'submitted' is past tense.\nD — 'will submit' is future indicative."}, {"k": "Verb Tense", "p": "Since the new management team took over, profits <u>______</u> by thirty percent.", "q": "Which verb form is correct?", "o": ["A) increased", "B) were increasing", "C) have increased", "D) had increased"], "a": 2, "e": "C is correct. 'Since' introduces a time frame that began in the past and continues to the present. The present perfect 'have increased' correctly captures this ongoing relevance.\n\nA — simple past 'increased' implies the change is complete and no longer relevant.\nB — 'were increasing' is past progressive.\nD — 'had increased' is past perfect, used for actions completed before another past event."}, {"k": "Verb Tense", "p": "By next March, the research team <u>______</u> on this project for five years.", "q": "Which verb form is correct?", "o": ["A) worked", "B) will have been working", "C) has worked", "D) will work"], "a": 1, "e": "B is correct. 'By next March' signals a future perfect context — an action that will be in progress up to a specific future point. 'Will have been working' (future perfect progressive) is correct.\n\nA — simple past 'worked' is incorrect in a future context.\nC — 'has worked' is present perfect.\nD — 'will work' is simple future and does not indicate ongoing duration."}, {"k": "Verb Tense", "p": "The board insisted that the proposal <u>______</u> revised before the next meeting.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) is", "B) was", "C) be", "D) will be"], "a": 2, "e": "C is correct. After 'insist,' the subjunctive requires the base form 'be,' not 'is' or 'was.'\n\nA — 'is' is present indicative.\nB — 'was' is past indicative.\nD — 'will be' is future indicative."}, {"k": "Verb Tense", "p": "If I <u>______</u> the report earlier, I would have caught the error before the presentation.", "q": "Which verb form correctly completes this third conditional?", "o": ["A) read", "B) had read", "C) would read", "D) was reading"], "a": 1, "e": "B is correct. In a third conditional, the if-clause uses the past perfect: 'If I had read.' The result clause uses 'would have + past participle.'\n\nA — simple past 'read' is used in second conditional (hypothetical present), not third.\nC — 'would read' belongs in the result clause, not the if-clause.\nD — 'was reading' is past progressive."}, {"k": "Verb Tense", "p": "The architect <u>______</u> on the plans for six months before the client suddenly cancelled the contract.", "q": "Which verb form is correct?", "o": ["A) worked", "B) has worked", "C) had been working", "D) was working"], "a": 2, "e": "C is correct. 'Before the client cancelled' signals a past perfect progressive — ongoing action that was in progress and then interrupted by a subsequent past event.\n\nA — simple past 'worked' does not show the prior ongoing nature.\nB — 'has worked' is present perfect.\nD — 'was working' is past progressive; while acceptable, 'had been working' more precisely conveys the duration before the interruption."}, {"k": "Verb Tense", "p": "The judge ruled that the defendant <u>______</u> released on bail pending the appeal.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) is", "B) was", "C) be", "D) will be"], "a": 2, "e": "C is correct. After 'ruled that' (a verb of legal decision), the subjunctive base form 'be' is required.\n\nA — 'is' is indicative.\nB — 'was' is past indicative.\nD — 'will be' is future indicative."}, {"k": "Verb Tense", "p": "The company <u>______</u> its headquarters three times since its founding in 1998.", "q": "Which verb form is correct?", "o": ["A) relocated", "B) has relocated", "C) had relocated", "D) was relocating"], "a": 1, "e": "B is correct. 'Since its founding in 1998' establishes a time frame from the past to the present. The present perfect 'has relocated' correctly captures actions that occurred multiple times within this ongoing timeframe.\n\nA — simple past 'relocated' implies a single completed action, not repeated occurrences.\nC — 'had relocated' is past perfect.\nD — 'was relocating' is past progressive."}, {"k": "Verb Tense", "p": "The professor requested that every student <u>______</u> a printed copy of the essay to class.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) brings", "B) brought", "C) bring", "D) will bring"], "a": 2, "e": "C is correct. After 'requested that,' the subjunctive requires the base form 'bring.'\n\nA — 'brings' is indicative third-person singular.\nB — 'brought' is past tense.\nD — 'will bring' is future indicative."}, {"k": "Verb Tense", "p": "When the delegates arrived at the summit, negotiations <u>______</u> for three days without progress.", "q": "Which verb form is correct?", "o": ["A) had been going", "B) have been going", "C) went", "D) were going"], "a": 0, "e": "A is correct. The past perfect progressive 'had been going' shows an action that was ongoing before the arrival of the delegates (another past event). It expresses both duration and prior sequence.\n\nB — 'have been going' is present perfect progressive.\nC — simple past 'went' is too simple and does not convey the ongoing duration.\nD — 'were going' is past progressive but does not indicate that negotiations preceded the arrival."}, {"k": "Verb Tense", "p": "It is vital that the data <u>______</u> before the peer review process begins.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) is verified", "B) are verified", "C) be verified", "D) was verified"], "a": 2, "e": "C is correct. 'It is vital that' triggers the subjunctive. The base form of 'be' is used with the passive: 'be verified.'\n\nA — 'is verified' is indicative singular.\nB — 'are verified' is indicative plural.\nD — 'was verified' is past indicative."}, {"k": "Verb Tense", "p": "The novel <u>______</u> three different publishers before it was finally accepted and brought to print.", "q": "Which verb form correctly shows rejection happened before acceptance?", "o": ["A) rejected", "B) has been rejected", "C) had been rejected", "D) was being rejected"], "a": 2, "e": "C is correct. 'Before it was finally accepted' signals that the rejections preceded the acceptance (both in the past). The past perfect passive 'had been rejected' is correct.\n\nA — simple past 'rejected' is active voice and does not clarify sequence.\nB — 'has been rejected' is present perfect passive.\nD — 'was being rejected' implies an ongoing action at the same time as acceptance."}, {"k": "Verb Tense", "p": "If the committee <u>______</u> the proposal sooner, the project might have launched before the fiscal year ended.", "q": "Which verb form correctly completes this third conditional?", "o": ["A) approved", "B) approves", "C) had approved", "D) would approve"], "a": 2, "e": "C is correct. In a third conditional, the if-clause uses past perfect: 'If the committee had approved.' The result clause uses 'would have + past participle.'\n\nA — simple past 'approved' is used in the second conditional.\nB — present 'approves' is used for first conditional (real present/future).\nD — 'would approve' belongs in the result clause, not the if-clause."}, {"k": "Verb Tense", "p": "The engineers <u>______</u> the prototype for two months before the funding was unexpectedly withdrawn.", "q": "Which verb form is correct?", "o": ["A) built", "B) have built", "C) had been building", "D) were building"], "a": 2, "e": "C is correct. The past perfect progressive 'had been building' shows an action in progress over a period of time that was interrupted by a subsequent past event (the withdrawal of funding).\n\nA — 'built' is simple past and does not show the duration or prior sequence.\nB — 'have built' is present perfect.\nD — 'were building' is past progressive but does not emphasize the prior duration."}, {"k": "Verb Tense", "p": "The resolution requires that each member state <u>______</u> a full report to the council within ninety days.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) submits", "B) submit", "C) submitted", "D) will submit"], "a": 1, "e": "B is correct. 'Requires that' triggers the subjunctive. The base form 'submit' is used regardless of the subject.\n\nA — 'submits' is indicative third-person singular.\nC — 'submitted' is past tense.\nD — 'will submit' is future indicative."}, {"k": "Verb Tense", "p": "The team <u>______</u> the analysis by the time the client arrived for the follow-up meeting.", "q": "Which verb form correctly shows completion before a past event?", "o": ["A) finished", "B) has finished", "C) had finished", "D) was finishing"], "a": 2, "e": "C is correct. 'By the time the client arrived' signals that the analysis was completed before the arrival — requiring the past perfect 'had finished.'\n\nA — simple past 'finished' does not clarify the sequence.\nB — 'has finished' is present perfect.\nD — 'was finishing' implies it was still in progress when the client arrived."}, {"k": "Verb Tense", "p": "She <u>______</u> three research positions before accepting the tenured professorship she currently holds.", "q": "Which verb form is correct?", "o": ["A) was holding", "B) held", "C) had held", "D) has held"], "a": 2, "e": "C is correct. 'Before accepting the tenured professorship' signals a past event. The positions were held before that event — requiring the past perfect 'had held.'\n\nA — 'was holding' is past progressive.\nB — simple past 'held' does not clarify the sequence.\nD — 'has held' is present perfect."}, {"k": "Verb Tense", "p": "The oversight committee recommended that the director <u>______</u> a public statement clarifying the organization's position.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) issues", "B) issue", "C) issued", "D) will issue"], "a": 1, "e": "B is correct. After 'recommended that,' the subjunctive requires the base form 'issue.'\n\nA — 'issues' is indicative third-person singular.\nC — 'issued' is past tense.\nD — 'will issue' is future indicative."}, {"k": "Verb Tense", "p": "Since the lab implemented the new safety protocols, there <u>______</u> a single injury.", "q": "Which verb form is correct?", "o": ["A) was not", "B) had not been", "C) has not been", "D) is not"], "a": 2, "e": "C is correct. 'Since the lab implemented' establishes a time frame from a past moment to the present. The present perfect 'has not been' reflects this ongoing period.\n\nA — simple past 'was not' implies the injury-free period is over.\nB — 'had not been' is past perfect, used for events before another past event.\nD — 'is not' is simple present, ignoring the historical context."}, {"k": "Verb Tense", "p": "The foundation mandates that all grant recipients <u>______</u> annual reports within sixty days of each fiscal year's end.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) file", "B) files", "C) filed", "D) will file"], "a": 0, "e": "A is correct. 'Mandates that' triggers the subjunctive. The base form 'file' is correct regardless of the subject ('all grant recipients').\n\nB — 'files' is indicative third-person singular applied incorrectly.\nC — 'filed' is past tense.\nD — 'will file' is future indicative."}, {"k": "Verb Tense", "p": "When the historian <u>______</u> the archive, she discovered letters that had never been catalogued.", "q": "Which verb form is correct?", "o": ["A) was examining", "B) examined", "C) had examined", "D) has examined"], "a": 1, "e": "B is correct. 'When' introduces a specific past moment at which another past action occurred. Simple past 'examined' correctly captures this point-in-time past action.\n\nA — 'was examining' is past progressive; acceptable, but 'examined' is more direct for a completed action.\nC — 'had examined' is past perfect, implying the examination was completed before the discovery, which contradicts 'when.'\nD — 'has examined' is present perfect."}]}, {"n": 9, "topic": "Relative Clauses & Subordination", "diff": "Relative Clauses & Subordination", "qs": [{"k": "Relative Clauses", "p": "The scientist <u>______</u> work on CRISPR gene editing earned her international recognition has recently joined the institute.", "q": "Which relative pronoun is correct?", "o": ["A) who's", "B) that", "C) whose", "D) whom"], "a": 2, "e": "C is correct. 'Whose' is the possessive relative pronoun. 'Whose work on CRISPR...' correctly shows that the work belongs to the scientist.\n\nA — 'who's' is a contraction for 'who is,' not a possessive.\nB — 'that' can be used for people in restrictive clauses but cannot show possession the way 'whose' does.\nD — 'whom' is the object form and cannot show possession."}, {"k": "Relative Clauses", "p": "The building <u>______</u> the lecture was held has since been converted into a residential complex.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) where", "C) in which", "D) that"], "a": 2, "e": "C is correct. The clause 'the lecture was held' is missing its preposition. The building is the location 'in which' the lecture was held. 'In which' correctly retains the preposition.\n\nA — 'which the lecture was held' is missing the preposition 'in.'\nB — 'where' introduces a relative clause of place and would work, but 'in which' is more formal and precise.\nD — 'that the lecture was held' is missing the preposition."}, {"k": "Relative Clauses", "p": "The delegate <u>______</u> the committee addressed had not been informed of the procedural change.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) which", "C) that", "D) whom"], "a": 3, "e": "D is correct. 'The committee addressed [the delegate]' — the delegate is the object of 'addressed.' When the relative pronoun is the object of the clause's verb, 'whom' is correct.\n\nA — 'who' is the subject form and would be used if the delegate were doing the addressing.\nB — 'which' refers to things, not people.\nC — 'that' can substitute for 'who' or 'whom' in restrictive clauses, but 'whom' is preferred in formal writing."}, {"k": "Relative Clauses", "p": "The report, <u>______</u> findings contradicted the committee's assumptions, was submitted to the board last week.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) which", "C) who's", "D) whose"], "a": 3, "e": "D is correct. 'Whose findings contradicted...' — 'whose' shows that the findings belong to the report. 'Whose' can refer to things as well as people.\n\nA — 'that' cannot show possession.\nB — 'which findings' is grammatically incorrect; 'which' cannot modify a following noun.\nC — 'who's' is a contraction for 'who is,' not possessive."}, {"k": "Relative Clauses", "p": "The city council approved a plan <u>______</u> would redirect funds from the parks budget to transportation infrastructure.", "q": "Which relative pronoun is correct?", "o": ["A) whom", "B) that", "C) whose", "D) what"], "a": 1, "e": "B is correct. 'That would redirect funds' is a restrictive relative clause modifying 'a plan.' 'That' is used in restrictive clauses for things.\n\nA — 'whom' is the object form for people, not things.\nC — 'whose' shows possession and would require a noun after it.\nD — 'what' cannot introduce a relative clause modifying a noun."}, {"k": "Relative Clauses", "p": "The novelist, <u>______</u> first book was rejected by forty publishers, won the Booker Prize on her third attempt.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) which", "C) who", "D) whose"], "a": 3, "e": "D is correct. 'Whose first book was rejected' — 'whose' shows that the first book belongs to the novelist. The clause is non-restrictive (set off by commas) and refers to a person.\n\nA — 'that' cannot show possession and is not used with non-restrictive clauses.\nB — 'which' refers to things and cannot show possession.\nC — 'who first book' is grammatically incorrect without a possessive form."}, {"k": "Relative Clauses", "p": "The program, <u>______</u> has been running for twelve years, serves over five hundred families annually.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) whom", "C) which", "D) whose"], "a": 2, "e": "C is correct. Non-restrictive clauses modifying things use 'which.' The program is a thing, the clause adds information, and commas indicate it is non-restrictive.\n\nA — 'that' is not used with non-restrictive clauses.\nB — 'whom' refers to people and is the object form.\nD — 'whose' shows possession and would require a noun to follow it."}, {"k": "Relative Clauses", "p": "The employee <u>______</u> the award was given had worked at the company for over twenty years.", "q": "Which relative pronoun correctly completes this sentence?", "o": ["A) whom", "B) who", "C) which", "D) that"], "a": 0, "e": "A is correct. 'The award was given [to the employee]' — the employee is the indirect object of 'was given.' When the relative pronoun is the object (or indirect object) of the verb, 'whom' is correct.\n\nB — 'who' is the subject form.\nC — 'which' refers to things, not people.\nD — 'that' can substitute in informal usage but 'whom' is more precise and formal."}, {"k": "Relative Clauses", "p": "The researchers discovered a compound <u>______</u> molecular structure had not been previously documented.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) that", "C) whose", "D) of which"], "a": 2, "e": "C is correct. 'Whose molecular structure had not been documented' — 'whose' shows that the structure belongs to the compound. 'Whose' can be used for things.\n\nA — 'which molecular structure' is grammatically incorrect.\nB — 'that molecular structure' is grammatically incorrect.\nD — 'of which molecular structure' is grammatically awkward."}, {"k": "Relative Clauses", "p": "The documentary focuses on communities <u>______</u> traditional fishing practices have been disrupted by climate change.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) which", "C) whose", "D) that"], "a": 2, "e": "C is correct. 'Whose traditional fishing practices have been disrupted' — 'whose' shows that the practices belong to the communities.\n\nA — 'who' is the subject form and cannot show possession.\nB — 'which' cannot show possession without restructuring.\nD — 'that' cannot show possession."}, {"k": "Relative Clauses", "p": "The senator, <u>______</u> position on immigration reform shifted significantly over her career, retired last year.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) whose", "C) that", "D) which"], "a": 1, "e": "B is correct. 'Whose position on immigration reform shifted' — the position belongs to the senator. Non-restrictive clause about a person, using 'whose' for possession.\n\nA — 'who' cannot show possession.\nC — 'that' is not used in non-restrictive clauses.\nD — 'which' refers to things, not people."}, {"k": "Relative Clauses", "p": "The library holds a collection of manuscripts <u>______</u> dates back to the ninth century.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) whom", "C) whose", "D) that"], "a": 3, "e": "D is correct. 'That dates back to the ninth century' is a restrictive relative clause modifying 'a collection of manuscripts.' 'That' is used for restrictive clauses about things.\n\nA — 'who' refers to people.\nB — 'whom' refers to people and is the object form.\nC — 'whose' shows possession and would require a noun to follow."}, {"k": "Relative Clauses", "p": "The proposal, <u>______</u> was submitted two weeks late, was nonetheless reviewed by the committee.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) which", "C) whose", "D) who"], "a": 1, "e": "B is correct. Non-restrictive clause about a thing ('the proposal') — 'which' is required. The clause adds information without restricting which proposal is meant.\n\nA — 'that' is not used in non-restrictive clauses.\nC — 'whose' shows possession and would need a noun after it.\nD — 'who' refers to people."}, {"k": "Relative Clauses", "p": "The painting <u>______</u> he had inherited from his grandmother was appraised at over a million dollars.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) that", "C) whom", "D) whose"], "a": 1, "e": "B is correct. 'That he had inherited' is a restrictive clause modifying 'the painting.' 'That' is correct for restrictive clauses about things.\n\nA — 'who' refers to people.\nC — 'whom' refers to people (object form).\nD — 'whose' shows possession."}, {"k": "Relative Clauses", "p": "The chemist, <u>______</u> laboratory was destroyed in the fire, rebuilt her research program from scratch.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) which", "C) whose", "D) that"], "a": 2, "e": "C is correct. 'Whose laboratory was destroyed' — 'whose' shows possession. Non-restrictive clause about a person.\n\nA — 'who' cannot show possession.\nB — 'which' refers to things.\nD — 'that' is not used with non-restrictive clauses."}, {"k": "Relative Clauses", "p": "The clause in the contract <u>______</u> pertains to intellectual property rights has been disputed by both parties.", "q": "Which relative pronoun is correct?", "o": ["A) whom", "B) which", "C) who", "D) whose"], "a": 1, "e": "B is correct. 'Which pertains to intellectual property rights' is a relative clause modifying 'the clause in the contract' (a thing). 'Which' or 'that' can both be used, but 'which' is more formal.\n\nA — 'whom' is the object form for people.\nC — 'who' is for people.\nD — 'whose' shows possession."}, {"k": "Relative Clauses", "p": "The organization awarded grants to researchers <u>______</u> work focused on underrepresented communities.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) which", "C) whom", "D) whose"], "a": 3, "e": "D is correct. 'Whose work focused on underrepresented communities' — 'whose' shows that the work belongs to the researchers.\n\nA — 'who' is the subject form and cannot show possession.\nB — 'which' refers to things.\nC — 'whom' is the object form for people."}, {"k": "Relative Clauses", "p": "The student <u>______</u> essay was selected for publication had transferred to the program just one semester earlier.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) who", "C) whom", "D) whose"], "a": 3, "e": "D is correct. 'Whose essay was selected' — the essay belongs to the student. 'Whose' is the correct possessive relative pronoun.\n\nA — 'that' cannot show possession.\nB — 'who essay' is grammatically incorrect without a possessive.\nC — 'whom' is the object form."}, {"k": "Relative Clauses", "p": "The council approved the rezoning plan, <u>______</u> had been the subject of community debate for over three years.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) who", "C) which", "D) whose"], "a": 2, "e": "C is correct. Non-restrictive clause about 'the rezoning plan' (a thing) — 'which' is required.\n\nA — 'that' is not used in non-restrictive clauses.\nB — 'who' refers to people.\nD — 'whose' shows possession."}, {"k": "Relative Clauses", "p": "The archaeologist found fragments of pottery <u>______</u> style matched examples from a civilization thought to be extinct.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) which", "C) whose", "D) who"], "a": 2, "e": "C is correct. 'Whose style matched examples' — 'whose' shows that the style belongs to the pottery fragments. 'Whose' correctly indicates possession for a non-human noun.\n\nA — 'that style matched' is grammatically incorrect.\nB — 'which style matched' is grammatically incorrect.\nD — 'who' refers to people."}, {"k": "Relative Clauses", "p": "The policy, <u>______</u> effects were felt immediately, was repealed within six months of its passage.", "q": "Which relative pronoun is correct?", "o": ["A) that", "B) who's", "C) which", "D) whose"], "a": 3, "e": "D is correct. 'Whose effects were felt immediately' — 'whose' shows that the effects belong to the policy. Non-restrictive clause about a thing.\n\nA — 'that' cannot show possession.\nB — 'who's' is a contraction for 'who is,' not possessive.\nC — 'which effects' is grammatically incorrect."}, {"k": "Relative Clauses", "p": "The researchers relied on participants <u>______</u> the interview had not been conducted in their first language.", "q": "Which relative pronoun correctly completes this sentence?", "o": ["A) for whom", "B) who", "C) whose", "D) that"], "a": 0, "e": "A is correct. 'The interview had not been conducted in their first language for the participants' — the participants are the indirect object of the preposition 'for.' 'For whom' correctly maintains the preposition and the object form.\n\nB — 'who' is the subject form.\nC — 'whose' shows possession.\nD — 'that' is informal and loses the preposition."}, {"k": "Relative Clauses", "p": "The foundation announced a new prize for scientists <u>______</u> discoveries have had measurable public health benefits.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) whose", "C) whom", "D) which"], "a": 1, "e": "B is correct. 'Whose discoveries have had measurable benefits' — 'whose' shows that the discoveries belong to the scientists.\n\nA — 'who' cannot show possession.\nC — 'whom' is the object form.\nD — 'which
