<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Gri English</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Georgia, serif; background: #F4EFE3; color: #2C2A26; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 3rem; }
    h1 { font-size: 4rem; margin: 0; font-weight: 500; }
    .it { font-style: italic; color: #B5965A; }
    p { font-size: 1.1rem; color: #6B6862; margin-top: 1rem; letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gri <span class="it">English</span></h1>
    <p>Yakında açılıyor</p>
  </div>
</body>
</html>
