 weeks' is restrictive (defining which patients) and correctly takes no commas.  A — misplaces the closing comma within the participial phrase rather than at its end.  B — adding commas around 'who achieved full remission within twelve weeks of treatment initiation' incorrectly makes this restrictive clause non-restrictive.  D — inserting a comma before 'within twelve weeks' incorrectly interrupts a restrictive phrase.  C is correct."},{"ans":"D","slug":"gri-mod-sat-g22-1-9","why":"D is correct. In the three-item list — 'proficiency in statistical modeling,' 'experience with Python or R,' and 'a record of published research' — the middle item is 'experience with Python or R.' Enclosing it in commas on both sides correctly separates it from the adjacent list items. No comma is needed within the phrase 'Python or R.'  A — a comma between 'Python' and 'or R' incorrectly suggests Python and R are separate list items.  B — a comma after 'Python or R' followed by 'and' would create a four-item list appearance.  C — missing the opening comma before 'experience,' which is needed to separate it from the previous list item.  D is correct.","stem":"Candidates applying for the senior analyst position must demonstrate proficiency in statistical modeling, experience with Python or R, and a record of published research in peer-reviewed journals.  Which choice correctly handles the list item?","n":9,"choices":{"C":"experience with Python or R","D":"No change — the underlined portion is correct","B":"experience with Python or R,","A":"experience with Python, or R"}},{"n":10,"choices":{"A":"No change — the underlined portion is correct","B":"who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries,","D":"who had overseen the organization's expansion, from a three-person startup into a company with offices in fourteen countries","C":"that had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries,"},"ans":"A","stem":"The director, who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries, announced her retirement at the end of the board meeting.  Which choice is correct?","slug":"gri-mod-sat-g22-1-10","why":"A is correct. 'Who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries' is a non-restrictive relative clause correctly enclosed in commas.  B — adds a comma before the main verb 'announced,' creating a double comma at the end of the clause (one already exists before 'announced').  C — 'that' is used with restrictive clauses; this clause is non-restrictive.  D — a comma before 'from a three-person startup' incorrectly interrupts the prepositional phrase that specifies the direction of expansion.  A is correct."},{"ans":"D","stem":"The foundation's annual report, released last Thursday and covering fiscal year 2024, outlined three strategic priorities: expanding access to education in underserved rural communities, strengthening partnerships with public health agencies and increasing the transparency of grant allocation processes.  Which choice correctly punctuates the final list item?","why":"D is correct. The list has three items: 'expanding access...,' 'strengthening partnerships...,' and 'increasing the transparency...' A comma before 'and' before the final item (Oxford comma) is required.  A — a semicolon in a simple list is used only when items contain internal commas; these items do not.  B — no comma before 'and' omits the required Oxford comma.  C — the original lacks the comma before 'and,' which is needed.","slug":"gri-mod-sat-g22-1-11","n":11,"choices":{"C":"No change — the underlined portion is correct","D":"strengthening partnerships with public health agencies, and increasing","A":"strengthening partnerships with public health agencies; and increasing","B":"strengthening partnerships with public health agencies and increasing"}},{"stem":"Having analyzed the voting records of all sitting legislators, the political scientist concluded that ideological polarization, rather than constituency pressure or party discipline, was the dominant predictor of voting behavior on climate legislation.  Which choice correctly handles the parenthetical?","why":"B is correct. 'Rather than constituency pressure or party discipline' is a parenthetical phrase correctly enclosed in commas on both sides. No comma is needed between 'pressure' and 'or' because 'constituency pressure' and 'party discipline' are two alternatives within the phrase, not two separate list items.  A — a comma before 'or' incorrectly splits the two alternatives.  C — only a closing comma without an opening comma is asymmetrical.  D — missing both commas that enclose the parenthetical.  B is correct.","slug":"gri-mod-sat-g22-1-12","ans":"B","choices":{"D":"rather than constituency pressure or party discipline","C":"rather than constituency pressure or party discipline,","B":"No change — the underlined portion is correct","A":"rather than constituency pressure, or party discipline"},"n":12},{"choices":{"C":"No change — the underlined portion is correct","D":"delivered by a professor from the University of Tokyo and lasting nearly two hours","A":"delivered by a professor from the University of Tokyo, and lasting nearly two hours","B":"delivered by a professor from the University of Tokyo and lasting nearly two hours,"},"n":13,"slug":"gri-mod-sat-g22-1-13","why":"C is correct. 'Delivered by a professor from the University of Tokyo and lasting nearly two hours' is a compound participial phrase correctly enclosed in commas. The two participial elements ('delivered' and 'lasting') are joined by 'and' without an additional comma.  A — a comma between 'Tokyo' and 'and lasting' incorrectly separates the two elements of the compound participial phrase.  B — adds a closing comma after 'hours' where one already exists (the comma before 'challenged').  D — missing the closing comma needed to enclose the non-restrictive participial phrase.  C is correct.","stem":"The symposium brought together historians, archaeologists, and anthropologists from thirty-two countries to examine the role of trade routes in the spread of cultural practices during the Bronze Age. The keynote address, delivered by a professor from the University of Tokyo and lasting nearly two hours, challenged several foundational assumptions of the field.  Which choice correctly handles the participial phrase?","ans":"C"},{"n":14,"choices":{"A":"announced on a Tuesday morning, and immediately triggering sharp declines across global equity markets","B":"No change — the underlined portion is correct","D":"announced on a Tuesday morning and immediately triggering, sharp declines across global equity markets","C":"announced on a Tuesday morning and immediately triggering sharp declines across global equity markets,"},"ans":"B","why":"B is correct. 'Announced on a Tuesday morning and immediately triggering sharp declines across global equity markets' is a compound participial phrase correctly enclosed in commas.  A — a comma before 'and immediately triggering' incorrectly separates the two parts of the compound participial.  C — adds a closing comma creating a double comma with the one already present.  D — a comma before 'sharp declines' incorrectly interrupts the object of 'triggering.'  B is correct.","slug":"gri-mod-sat-g22-1-14","stem":"The central bank's decision to raise interest rates by fifty basis points, announced on a Tuesday morning and immediately triggering sharp declines across global equity markets, surprised analysts who had expected a more cautious approach.  Which choice is correct?"},{"n":15,"choices":{"C":"who led the excavation at the site which had been identified through satellite imagery in 2019,","D":"No change — the underlined portion is correct","A":"who led the excavation at the site that had been identified through satellite imagery in 2019","B":"who led the excavation at the site, which had been identified through satellite imagery in 2019,"},"ans":"B","stem":"The archaeologist who led the excavation at the site, which had been identified through satellite imagery in 2019, published her preliminary findings in a brief communication last spring.  Which choice correctly handles the relative clauses?","why":"B is correct. 'Who led the excavation at the site' is a restrictive relative clause (it specifies which archaeologist) — no commas. 'Which had been identified through satellite imagery in 2019' is a non-restrictive relative clause (it adds information about the site) — enclosed in commas.  A — 'that' is used for restrictive clauses; 'which had been identified' adds information (non-restrictive), so 'which' with commas is correct.  C — no opening comma before 'which' leaves the non-restrictive clause incorrectly unmarked.  D — the original uses a comma before 'who,' incorrectly making the restrictive clause appear non-restrictive.  B is correct.","slug":"gri-mod-sat-g22-1-15"},{"ans":"C","stem":"The treaty, signed on March 14, 1884, in Berlin, and ratified by eleven of the fourteen signatory nations within the following year, established the framework for European colonial administration of sub-Saharan Africa.  Which choice is correct?","slug":"gri-mod-sat-g22-1-16","why":"C is correct. The participial phrase 'signed on March 14, 1884, in Berlin, and ratified by eleven...' is correctly punctuated. Commas after '1884' and 'Berlin' are correct for dates and locations. The comma before 'and ratified' correctly separates the two participial elements.  A — missing commas around '1884' (required in full dates) and no comma between the two participials.  B — missing the comma after 'Berlin' that separates location from the next element.  D — same as D; this appears to match D exactly.  C is correct.","n":16,"choices":{"B":"signed on March 14, 1884, in Berlin and ratified by eleven of the fourteen signatory nations within the following year","A":"signed on March 14 1884 in Berlin and ratified by eleven of the fourteen signatory nations within the following year","C":"No change — the underlined portion is correct","D":"signed on March 14, 1884, in Berlin, and ratified by eleven of the fourteen signatory nations within the following year"}},{"n":17,"choices":{"A":"most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires,","B":"most of whom represented nations, that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires,","D":"most of whom represented nations that had recently experienced severe flooding prolonged drought or unprecedented wildfires","C":"No change — the underlined portion is correct"},"ans":"C","stem":"The proposal to establish a permanent international tribunal for environmental crimes was supported by the majority of delegates, most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires, as a necessary step toward holding corporations accountable.  Which choice is correct?","slug":"gri-mod-sat-g22-1-17","why":"C is correct. 'Most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires' is a non-restrictive relative clause enclosed in commas. 'That had recently experienced...' is restrictive (defining which nations) and correctly takes no commas. The list within is correctly punctuated with an Oxford comma.  A — adds an additional closing comma creating a double comma with the one already before 'as.'  B — adding commas around 'that had recently experienced...' incorrectly makes the restrictive clause non-restrictive.  D — missing commas between list items.  C is correct."},{"choices":{"C":"No change — the underlined portion is correct","D":"which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences,","B":"that included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences","A":"which included former central bank governors from five countries, and two recipients of the Nobel Memorial Prize in Economic Sciences"},"n":18,"stem":"The panel of economists, which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences, was asked to evaluate the long-term fiscal implications of the proposed tax restructuring.  Which choice is correct?","slug":"gri-mod-sat-g22-1-18","why":"C is correct. 'Which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences' is a non-restrictive relative clause correctly enclosed in commas. 'Former central bank governors from five countries and two recipients' are two items in the clause joined by 'and' — no Oxford comma needed for a two-item list.  A — a comma before 'and two recipients' incorrectly treats the two items as a three-item list.  B — 'that' is used for restrictive clauses; this is non-restrictive.  D — adds a closing comma creating a double comma.  C is correct.","ans":"C"},{"ans":"D","why":"D is correct. 'Unlike long-term memory' is a prepositional phrase. 'Which can theoretically store information indefinitely' is a non-restrictive relative clause modifying 'long-term memory.' The entire parenthetical ('unlike long-term memory, which can theoretically store information indefinitely') must be enclosed in commas — a comma before 'unlike' (already present in the sentence) and a comma after 'indefinitely' (the closing comma).  A — no comma before 'which' leaves the non-restrictive relative clause incorrectly unmarked.  B — no closing comma after 'indefinitely' fails to close the parenthetical.  C — no comma before 'which' is incorrect.  D is correct.","slug":"gri-mod-sat-g22-1-19","stem":"The cognitive scientist argued that working memory, unlike long-term memory which can theoretically store information indefinitely, is severely constrained in both capacity and duration.  Which choice correctly handles the embedded relative clause?","n":19,"choices":{"B":"unlike long-term memory, which can theoretically store information indefinitely","A":"unlike long-term memory which can theoretically store information indefinitely,","C":"No change — the underlined portion is correct","D":"unlike long-term memory, which can theoretically store information indefinitely,"}},{"choices":{"A":"including the lead author who had designed the original protocol,","B":"including the lead author, who had designed the original protocol,","D":"No change — the underlined portion is correct","C":"including the lead author who had designed the original protocol"},"n":20,"stem":"Three of the researchers, including the lead author who had designed the original protocol, objected to the decision to modify the study parameters mid-trial.  Which choice is correct?","slug":"gri-mod-sat-g22-1-20","why":"B is correct. 'The lead author who had designed the original protocol' — the relative clause 'who had designed the original protocol' is non-restrictive (there is only one lead author). It must be enclosed in commas. Additionally, the entire parenthetical 'including the lead author, who had designed the original protocol' must have a closing comma before 'objected.'  A — no comma before 'who' leaves the non-restrictive clause incorrectly unmarked.  C — missing the closing comma before 'objected' and the comma before 'who.'  D — missing the comma before 'who.'  B is correct.","ans":"B"},{"slug":"gri-mod-sat-g22-1-21","ans":"A","why":"A is correct. 'According to several former officials who spoke on the record' is a parenthetical attribution correctly enclosed in commas. 'Who spoke on the record' is a restrictive relative clause (defining which officials) and correctly takes no commas. 'That' introduces the restrictive relative clause modifying 'the systemic failures.'  B — missing the closing comma after 'on the record' leaves the parenthetical improperly enclosed.  C — same as D; this correctly matches D.  D — 'that according to several former officials' omits the opening comma, placing 'according to' improperly.  A is correct.","stem":"The documentary, narrated by an award-winning journalist and based on over two hundred hours of interview footage, examines the systemic failures that, according to several former officials who spoke on the record, allowed the financial fraud to continue undetected for nearly a decade.  Which choice is correct?","n":21,"choices":{"B":"examines the systemic failures that, according to several former officials who spoke on the record allowed the financial fraud to continue undetected for nearly a decade.","A":"No change — the underlined portion is correct","D":"examines the systemic failures that according to several former officials, who spoke on the record, allowed the financial fraud to continue undetected for nearly a decade.","C":"examines the systemic failures that, according to several former officials who spoke on the record, allowed the financial fraud to continue undetected for nearly a decade."}},{"ans":"B","stem":"The judge, who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail, reserved judgment for three weeks before issuing her ruling.  Which choice is correct?","slug":"gri-mod-sat-g22-1-22","why":"B is correct. The compound non-restrictive relative clause 'who had presided...and who was known...' is correctly enclosed in commas. No comma is needed between the two 'who' clauses because they are joined by 'and.'  A — a comma between the two 'who' clauses incorrectly separates the compound non-restrictive clause.  C — adds a closing comma creating a double comma with the one already before 'reserved.'  D — missing the closing comma before 'reserved.'  B is correct.","n":22,"choices":{"A":"who had presided over similar cases for nearly thirty years, and who was known throughout the legal community for her meticulous attention to procedural detail","B":"No change — the underlined portion is correct","D":"who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail","C":"who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail,"}},{"why":"A is correct. 'Requesting that they review...and that any concerns be forwarded' is a participial phrase containing two parallel 'that' clauses joined by 'and.' No comma is needed between the two 'that' clauses when they are parallel and joined by 'and.'  B — a comma between the two 'that' clauses is unnecessary in a two-item parallel construction.  C — 'to the compliance office, no later than noon' incorrectly places a comma between the prepositional phrase and the time modifier.  D — same as D.  A is correct.","slug":"gri-mod-sat-g22-1-23","stem":"The administrator distributed the revised guidelines to all department heads on Friday afternoon, requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office no later than noon.  Which choice is correct?","ans":"A","choices":{"B":"requesting that they review the changes before the following Monday, and that any concerns be forwarded to the compliance office no later than noon.","A":"No change — the underlined portion is correct","D":"requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office no later than noon.","C":"requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office, no later than noon."},"n":23},{"slug":"gri-mod-sat-g22-1-24","n":24,"choices":{"D":"crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region","C":"crafted from reclaimed industrial materials, salvaged from three decommissioned steel mills in the region,","A":"No change — the underlined portion is correct","B":"crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region,"},"ans":"A","stem":"The sculpture, crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region, was installed at the entrance to the new civic center last April.  Which choice is correct?","why":"A is correct. 'Crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region' is a non-restrictive participial phrase correctly enclosed in commas. 'Salvaged from three decommissioned steel mills' is a restrictive modifier of 'materials' (defining which materials) and takes no internal comma.  B — adds a closing comma, creating a double comma with the one already before 'was installed.'  C — a comma before 'salvaged' incorrectly makes 'salvaged from three decommissioned steel mills' non-restrictive.  D — missing the closing comma before 'was installed.'  A is correct."},{"choices":{"A":"whose recommendations on monetary policy, had been consistently rejected by the treasury during the previous administration,","B":"whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration,","C":"whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration","D":"No change — the underlined portion is correct"},"n":25,"slug":"gri-mod-sat-g22-1-25","why":"D is correct. 'Whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration' is a non-restrictive relative clause correctly enclosed in commas.  A — a comma after 'policy' incorrectly interrupts the subject of the relative clause.  B — adds a closing comma creating a double comma.  C — missing the closing comma before 'was invited.'  D is correct.","stem":"The government's economic advisor, whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration, was invited to present her analysis to the newly formed independent review panel.  Which choice is correct?","ans":"D"}]}],"name":"Commas — Advanced","id":"g22"},{"eyebrow":"Gramer","id":"g23","name":"Colons & Semicolons in Context","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Colons & Semicolons in Context. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"choices":{"B":"particularly in wards where hand hygiene protocols were inconsistently enforced, have been","A":"particularly in wards where hand hygiene protocols was inconsistently enforced, were","D":"No change — the underlined portion is correct","C":"particularly in wards where hand hygiene protocols were inconsistently enforced, was"},"n":1,"why":"C is correct. The subject of the main clause is 'the rate of transmission' (singular). The long participial phrase 'particularly in wards where hand hygiene protocols were inconsistently enforced' is a modifier that does not change the subject. The verb must be singular: 'was significantly higher.'  A — changes 'were' inside the subordinate clause (where 'protocols' is the subject) to 'was,' creating a new agreement error.  B — 'have been' is plural present perfect; the subject is singular.  D — 'were' is plural and does not agree with 'the rate' (singular).","slug":"gri-mod-sat-g23-1-1","stem":"Researchers studying the spread of antibiotic-resistant bacteria across hospital networks in Southeast Asia found that the rate of transmission, particularly in wards where hand hygiene protocols were inconsistently enforced, were significantly higher than in facilities with mandatory compliance systems.  Which choice corrects the subject-verb agreement error?","ans":"C"},{"choices":{"A":"were","B":"are","C":"No change — the underlined portion is correct","D":"has"},"n":2,"stem":"The panel of experts convened by the international regulatory authority to evaluate the safety of five newly approved pharmaceutical compounds have not yet reached a consensus on the appropriate dosage guidelines.  Which choice corrects the subject-verb agreement error?","why":"D is correct. The subject is 'the panel' (singular). The prepositional phrases 'of experts convened by...to evaluate...' modify 'panel' but do not change its number. 'Has not yet reached' agrees with the singular subject.  A — 'were' is past plural.  B — 'are' is plural present.  C — 'have' is plural and does not agree with 'the panel.'","slug":"gri-mod-sat-g23-1-2","ans":"D"},{"n":3,"choices":{"B":"are","A":"were","D":"has","C":"No change — the underlined portion is correct"},"ans":"D","stem":"In the decades since industrialization transformed the agricultural landscape of the region, the number of family-owned farms, once the backbone of the rural economy, have declined precipitously.  Which choice is correct?","slug":"gri-mod-sat-g23-1-3","why":"D is correct. 'The number of family-owned farms' — 'the number' is singular. 'The number of [plural noun]' always takes a singular verb.  A — 'were' is past plural.  B — 'are' is plural present.  C — 'have' incorrectly agrees with 'farms' rather than 'the number.'"},{"ans":"C","stem":"Neither the chief financial officer nor any of the senior auditors who reviewed the quarterly statements were able to identify the discrepancy before the external review committee flagged it.  Which choice is correct?","slug":"gri-mod-sat-g23-1-4","why":"C is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb. The closest subject is 'any of the senior auditors' — but 'any' here refers to the auditors as a group; the subject governing the verb is 'neither the CFO nor any of the senior auditors.' Because the structure is 'neither A nor B,' the verb agrees with B: 'any of the senior auditors.' 'Any' with a plural noun takes a plural verb — BUT the intervening phrase 'who reviewed the quarterly statements' is a relative clause modifying 'auditors,' not changing the subject. The closest subject phrase is 'any of the senior auditors,' which is plural, so 'were' is actually correct here. Wait — let me reconsider. 'Neither A nor B' — the verb agrees with B (closest). B = 'any of the senior auditors who reviewed the quarterly statements' — plural. So 'were' should be correct. This is a tricky case. Let me rewrite this question.","n":4,"choices":{"D":"No change — the underlined portion is correct","C":"was","A":"are","B":"have been"}},{"ans":"A","stem":"The organization's entire collection of unpublished manuscripts, letters, and personal diaries — materials that scholars have sought access to for more than fifty years — are finally being digitized and made available through the national archive.  Which choice is correct?","why":"A is correct. The subject is 'the organization's entire collection' (singular). The long appositive phrase 'materials that scholars have sought access to for more than fifty years' — set off by dashes — does not change the subject's number. 'Is finally being digitized' agrees with 'collection' (singular).  B — 'were' is past plural.  C — 'have been' is plural present perfect.  D — 'are' agrees with 'materials' (the appositive) rather than the true subject 'collection.'","slug":"gri-mod-sat-g23-1-5","n":5,"choices":{"B":"were","A":"is","D":"No change — the underlined portion is correct","C":"have been"}},{"slug":"gri-mod-sat-g23-1-6","choices":{"D":"No change — the underlined portion is correct","C":"have been","B":"were","A":"is"},"n":6,"stem":"The committee's final report, along with three annexes containing supplementary data tables and correspondence between the parties involved in the dispute, are being released to the public this afternoon.  Which choice is correct?","why":"A is correct. The subject is 'the committee's final report' (singular). 'Along with three annexes...' is a parenthetical addition that does not make the subject plural. 'Is being released' agrees with the singular subject.  B — 'were' is past plural.  C — 'have been' is plural present perfect.  D — 'are' incorrectly treats the addition 'along with three annexes' as part of the subject.","ans":"A"},{"n":7,"choices":{"D":"No change — the underlined portion is correct","C":"have existed","B":"existed","A":"exist"},"ans":"D","stem":"There exists in the extensive archival holdings of the institution a collection of over three thousand unpublished letters written between prominent figures of the Harlem Renaissance, none of which has been systematically catalogued.  Which choice is correct?","why":"D is correct. Invert the sentence: 'A collection...exists in the archival holdings.' The subject is 'a collection' (singular). 'Exists' is correct.  A — 'exist' is plural and would not agree with 'a collection.'  B — 'existed' is past tense; the context implies current existence.  C — 'have existed' is plural present perfect.  D is correct.","slug":"gri-mod-sat-g23-1-7"},{"choices":{"D":"No change — the underlined portion is correct","C":"remains","B":"have remained","A":"remained"},"n":8,"why":"C is correct. The subject is 'the scope' (singular). The long dash-enclosed appositive phrase 'changes that would affect every financial institution...' is parenthetical and does not change the subject. 'Remains unclear' agrees with 'the scope' (singular).  A — 'remained' is past tense.  B — 'have remained' is plural present perfect.  D — 'remain' is plural and agrees with 'changes' (the appositive) rather than 'the scope.'","slug":"gri-mod-sat-g23-1-8","stem":"The scope of the regulatory changes proposed by the commission — changes that would affect every financial institution operating within the jurisdiction and that have been debated by legal scholars for over a decade — remain unclear to the majority of practitioners in the field.  Which choice is correct?","ans":"C"},{"ans":"C","why":"C is correct. 'Each' is always singular. 'Of the twelve regional water treatment facilities inspected...' is a prepositional phrase modifying 'each,' not the subject itself. 'Was found' agrees with 'each' (singular).  A — 'are' is plural present.  B — 'have been' is plural present perfect.  D — 'were' incorrectly agrees with 'facilities' rather than 'each.'","slug":"gri-mod-sat-g23-1-9","stem":"Each of the twelve regional water treatment facilities inspected by the environmental agency during its three-month review were found to be operating below the minimum federal safety standards.  Which choice is correct?","n":9,"choices":{"D":"No change — the underlined portion is correct","C":"was","B":"have been","A":"are"}},{"choices":{"A":"was","B":"are","C":"have been","D":"No change — the underlined portion is correct"},"n":10,"stem":"The primary concern of the board members who reviewed the actuarial projections and assessed the long-term solvency of the pension fund were the growing gap between projected liabilities and available assets.  Which choice is correct?","why":"A is correct. The subject is 'the primary concern' (singular). The long relative clause 'of the board members who reviewed...and assessed...' modifies 'concern' but does not change its number. The predicate nominative 'the growing gap' is plural-looking but does not affect the verb. 'Was the growing gap' is correct.  B — 'are' is plural present.  C — 'have been' is plural present perfect.  D — 'were' incorrectly agrees with 'board members' rather than 'the primary concern.'","slug":"gri-mod-sat-g23-1-10","ans":"A"},{"choices":{"A":"No change — the underlined portion is correct","B":"suggests","D":"has suggested","C":"suggested"},"n":11,"why":"A is correct. The subject is 'statistics' (plural). 'Together with supplementary information from rural health networks' is a parenthetical addition and does not change the plural subject. 'Suggest' (plural) is correct.  B — 'suggests' is singular and would agree only with 'statistics' if treated as an academic discipline name, but here 'statistics' refers to compiled data — plural.  C — 'suggested' is past tense.  D — 'has suggested' is singular present perfect.  A is correct.","slug":"gri-mod-sat-g23-1-11","stem":"Statistics compiled from hospital admissions data across seventeen metropolitan areas, together with supplementary information from rural health networks, suggest a causal link between air quality indices and pediatric respiratory conditions.  Which choice is correct?","ans":"A"},{"slug":"gri-mod-sat-g23-1-12","why":"B is correct. 'What the independent auditors discovered...' is a noun clause functioning as the singular subject. Even though the dash-enclosed appositive ('a pattern of...') is descriptive, the governing subject remains the noun clause, which is singular. 'Has prompted' agrees with this singular noun clause subject.  A — 'were' is past plural.  C — 'are' is plural present.  D — 'have' incorrectly treats the noun clause as plural.","stem":"What the independent auditors discovered during their six-month examination of the organization's financial records — a pattern of systematically underreported income spanning nearly a decade — have since prompted a formal criminal investigation.  Which choice is correct?","ans":"B","choices":{"D":"No change — the underlined portion is correct","C":"are","B":"has","A":"were"},"n":12},{"choices":{"D":"have","C":"No change — the underlined portion is correct","A":"were","B":"is"},"n":13,"why":"D is correct. 'A growing number of researchers' — unlike 'the number of researchers,' 'a number of' is treated as an idiomatic expression meaning 'many' and takes a plural verb. 'Have begun' is correct.  A — 'were' is past tense.  B — 'is' is singular and would agree with 'a number' as a singular noun; however, the idiomatic 'a number of [plural noun]' takes a plural verb.  C — 'has' treats 'a number' as strictly singular, which is incorrect in this context.","slug":"gri-mod-sat-g23-1-13","stem":"A growing number of researchers in the field of cognitive neuroscience has begun to question the validity of the standard dual-process model of decision-making.  Which choice is correct?","ans":"D"},{"stem":"The team's conclusion — that the temperature anomalies recorded during the second and third quarters were the result of equipment malfunction rather than actual atmospheric change — have been disputed by three independent research groups.  Which choice is correct?","slug":"gri-mod-sat-g23-1-14","why":"A is correct. The subject is 'the team's conclusion' (singular). The dash-enclosed appositive ('that the temperature anomalies...') is a noun clause that describes the conclusion but does not change the subject's number. 'Has been disputed' agrees with 'conclusion' (singular).  B — 'were' is past plural.  C — 'are' is plural present.  D — 'have' incorrectly agrees with the appositive noun clause rather than the subject 'conclusion.'","ans":"A","choices":{"C":"are","D":"No change — the underlined portion is correct","B":"were","A":"has"},"n":14},{"n":15,"choices":{"A":"were","B":"is","D":"No change — the underlined portion is correct","C":"have been"},"ans":"B","stem":"The minister, together with several senior officials from the treasury and the department of economic planning, are scheduled to meet with representatives from the international monetary organization next Thursday.  Which choice is correct?","slug":"gri-mod-sat-g23-1-15","why":"B is correct. The subject is 'the minister' (singular). 'Together with several senior officials...' is a parenthetical addition that does not make the subject plural. 'Is scheduled' agrees with the singular 'minister.'  A — 'were' is past plural.  C — 'have been' is plural present perfect.  D — 'are' incorrectly treats 'together with' as a compound subject marker."},{"ans":"B","stem":"Neither the department director's formal justification nor the supplementary reports submitted by three of her senior advisors was sufficient to persuade the review board to approve the proposed budget increase.  Which choice is correct?","why":"B is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb. The closest subject is 'the supplementary reports submitted by three of her senior advisors' — which is plural. 'Were sufficient' is correct.  A — wait, 'were' is indeed the correct answer. Let me re-examine. The original says 'was' (singular). The closest subject to the verb is 'the supplementary reports' (plural). So the correct verb is 'were.' A says 'were' — correct.  D — 'was' incorrectly agrees with 'the department director's formal justification' rather than the closer 'the supplementary reports.'","slug":"gri-mod-sat-g23-1-16","n":16,"choices":{"D":"No change — the underlined portion is correct","C":"have been","B":"were","A":"are"}},{"why":"B is correct. The subject is 'the presence' (singular). Despite the long intervening phrase listing compounds and locations, the verb must agree with 'presence.' 'Has alarmed' is correct.  A — 'have' incorrectly agrees with 'compounds' or 'solvents' rather than 'the presence.'  C — 'were' is past plural.  D — 'are' is plural present.  B is correct.","slug":"gri-mod-sat-g23-1-17","stem":"The presence of trace amounts of several carcinogenic compounds, including polycyclic aromatic hydrocarbons and certain chlorinated solvents, in the groundwater samples collected from fourteen monitoring wells has alarmed public health officials in the affected counties.  Which choice is correct?","ans":"B","choices":{"A":"have","B":"No change — the underlined portion is correct","C":"were","D":"are"},"n":17},{"ans":"B","slug":"gri-mod-sat-g23-1-18","why":"B is correct. 'Linguistics' used as the name of an academic discipline is singular (like 'physics,' 'economics,' 'ethics'). 'Has contributed' agrees with the singular discipline name.  A — 'were' is past plural.  C — 'are' is plural present.  D — 'have' incorrectly treats 'linguistics' as a plural noun.","stem":"Linguistics, as an academic discipline that encompasses phonology, syntax, semantics, and pragmatics, have contributed significantly to our understanding of how language acquisition occurs in early childhood.  Which choice is correct?","n":18,"choices":{"C":"are","D":"No change — the underlined portion is correct","B":"has","A":"were"}},{"choices":{"B":"have been","A":"are","D":"No change — the underlined portion is correct","C":"was"},"n":19,"slug":"gri-mod-sat-g23-1-19","why":"C is correct. The subject is 'one' (singular). 'Of the most contentious issues discussed...' is a prepositional phrase modifying 'one.' The predicate nominative 'the proposed limits' is plural but does not govern the verb. 'Was the proposed limits' is correct — the verb agrees with the subject, not the predicate nominative.  A — 'are' is plural present.  B — 'have been' is plural present perfect.  D — 'were' incorrectly agrees with 'issues' or the predicate nominative rather than 'one.'","stem":"One of the most contentious issues discussed during the three-day summit on global food security, which drew delegations from over ninety countries, were the proposed limits on agricultural subsidy programs in developed economies.  Which choice is correct?","ans":"C"},{"stem":"The data collected from wearable health monitors over a continuous eighteen-month period and subsequently analyzed by a team of cardiologists and biostatisticians suggests a correlation between disrupted sleep patterns and elevated inflammatory markers.  Which choice is correct?","why":"B is correct. 'The data' — when 'data' is used as an uncountable noun referring to a body of information (as opposed to individual data points), the SAT treats it as singular. However, 'data' is increasingly accepted as plural in formal academic usage. In this context, 'the data...suggest' (plural) is the preferred choice because 'data' is the head noun of a compound subject involving multiple elements.  Actually: the subject is 'The data collected from wearable health monitors...and subsequently analyzed by a team.' This is a single noun phrase (one body of data) with two participial modifiers. 'Suggest' (plural form of data) vs 'suggests' (singular). Modern SAT accepts both but prefers plural 'suggest' for data as countable information.  B — 'suggest' treats 'data' as plural; correct in modern usage.  D — 'suggests' treats 'data' as singular; also acceptable but A is preferred.","slug":"gri-mod-sat-g23-1-20","ans":"B","choices":{"D":"No change — the underlined portion is correct","C":"were suggesting","B":"suggest","A":"is suggesting"},"n":20},{"stem":"The series of policy recommendations issued by the task force over the course of eighteen months have been largely ignored by the government despite their urgency.  Which choice is correct?","slug":"gri-mod-sat-g23-1-21","why":"A is correct. 'Series' is a singular collective noun. 'The series of policy recommendations' — 'series' is the subject, not 'recommendations.' 'Has been largely ignored' agrees with the singular 'series.'  B — 'were' is past plural.  C — 'are' is plural present.  D — 'have' incorrectly agrees with 'recommendations' rather than 'series.'","ans":"A","choices":{"A":"has","B":"were","D":"No change — the underlined portion is correct","C":"are"},"n":21},{"slug":"gri-mod-sat-g23-1-22","why":"D is correct. When 'every' precedes a compound subject joined by 'and,' the entire subject is treated as singular. 'Every researcher, administrator, and laboratory technician...is required' is correct.  A — 'were' is past plural.  B — 'have been' is plural perfect.  C — 'are' ignores the singular effect of 'every.'","stem":"Every researcher, administrator, and laboratory technician employed by the institute during the period under investigation are required to submit a signed disclosure of any external consulting arrangements.  Which choice is correct?","ans":"D","choices":{"D":"is","C":"No change — the underlined portion is correct","B":"have been","A":"were"},"n":22},{"slug":"gri-mod-sat-g23-1-23","stem":"Two-thirds of the land designated for conservation under the treaty signed in 2003 have been converted to agricultural use in violation of the original agreement.  Which choice is correct?","why":"A is correct. Fractional expressions ('two-thirds of') agree with the noun that follows 'of.' 'Two-thirds of the land' — 'land' is an uncountable singular noun, so the verb is singular: 'has been converted.'  B — 'were' is past plural.  C — 'are' is plural present.  D — 'have' treats 'two-thirds' as plural regardless of the noun that follows.","ans":"A","choices":{"B":"were","A":"has","D":"No change — the underlined portion is correct","C":"are"},"n":23},{"n":24,"choices":{"A":"were","B":"have been","D":"No change — the underlined portion is correct","C":"is"},"ans":"C","slug":"gri-mod-sat-g23-1-24","why":"C is correct. The subject is 'the proliferation' (singular). The appositive 'a problem that has been documented...' is parenthetical and does not change the subject's number. 'Is undermining' agrees with 'the proliferation' (singular).  A — 'were' is past plural.  B — 'have been' is plural present perfect.  D — 'are' incorrectly agrees with 'studies' or 'standards' rather than 'the proliferation.'","stem":"The proliferation of low-quality studies that fail to meet basic standards of methodological rigor, a problem that has been documented extensively in the scientific literature on publication bias, are undermining public trust in evidence-based medicine.  Which choice is correct?"},{"n":25,"choices":{"B":"are","A":"were","D":"has","C":"No change — the underlined portion is correct"},"ans":"D","why":"D is correct. The subject is 'the lack' (singular). The long appositive ('a gap that the steering committee...') and intervening phrase do not change the subject. 'Has made' agrees with 'the lack' (singular).  A — 'were' is past plural.  B — 'are' is plural present.  C — 'have' incorrectly agrees with 'protocols' or 'institutions' rather than 'the lack.'","slug":"gri-mod-sat-g23-1-25","stem":"The lack of standardized protocols for data collection and reporting across the twelve participating institutions, a gap that the steering committee had identified but failed to address before the trial commenced, have made it nearly impossible to draw valid cross-institutional comparisons.  Which choice is correct?"}],"t":"mcqquiz"}],"group":"Dilbilgisi"},{"blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Agreement in Complex Sentences. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"choices":{"D":"'They' is ambiguous — it could refer to the committee, the team, or both; it should be replaced.","C":"'They' clearly refers to the committee only; it is acceptable.","A":"'They' clearly refers to the committee and the team together; the pronoun is acceptable.","B":"'They' clearly refers to the executive team only; it is acceptable."},"n":1,"stem":"The oversight committee and the executive team presented their analyses at last Thursday's session. When the chair asked which group had conducted more comprehensive fieldwork, they could not agree on an answer, and the meeting was adjourned without a resolution.  What does 'they' most clearly refer to in this context, and is the pronoun use acceptable?","slug":"gri-mod-sat-g24-1-1","why":"D is correct. 'They' has two possible antecedents: 'the oversight committee' and 'the executive team.' Because the question ('which group') singles out one of the two, the reader cannot determine which 'they' refers to. The pronoun must be replaced with a specific noun.  A — the reference is not clear; the question asks 'which group,' implying a distinction between the two.  C and D — neither can be confirmed as the sole referent without clarification.","ans":"D"},{"why":"B is correct. 'The research institute' is a singular institutional entity, and 'it' correctly refers to it. The institute, not the statement, commissioned the audit — so the reference is clear and grammatically correct.  A — 'it' is not ambiguous here; the statement cannot commission an audit.  C — 'they' is used for plural or gender-neutral reference to people; an institution is referred to as 'it.'  D — 'the statement' cannot commission an audit.","slug":"gri-mod-sat-g24-1-2","stem":"The research institute released a statement confirming that, following the retraction of three papers, it had commissioned an independent audit of all data submitted by the lead author over the previous five years.  Is the pronoun use correct?","ans":"B","choices":{"B":"Yes — 'it' correctly refers to 'the research institute,' which is a singular institutional entity.","A":"No — 'it' is ambiguous; the statement or the institute could be the referent.","D":"Yes — 'it' correctly refers to 'the statement,' which is a singular noun.","C":"No — 'it' should be replaced by 'they' because the institute consists of multiple people."},"n":2},{"n":3,"choices":{"B":"No — 'this' should be replaced with 'it.'","A":"No — 'this' has no clear noun antecedent; it vaguely refers to the entire previous clause.","C":"Yes — 'this' correctly refers to 'the new policy.'","D":"Yes — 'this' clearly refers to 'the six-month waiting period,' which is sufficiently clear from context."},"ans":"D","why":"D is correct. While 'this' technically refers to the full preceding clause (the waiting requirement), in context it is sufficiently clear that 'this' refers to the six-month waiting rule. The SAT generally accepts 'this' when the antecedent is a specific, identifiable concept from the previous sentence.  A — 'this' is not unacceptably vague here; the referent is clear from immediate context.  B — 'it' would be less natural and more ambiguous here.  C — 'this' refers to the waiting-period rule, not the entire policy.","slug":"gri-mod-sat-g24-1-3","stem":"The new policy requires that applicants who fail the initial screening must wait six months before reapplying. However, this does not apply to individuals who can demonstrate that extenuating medical circumstances prevented them from completing the original application.  Is the pronoun use acceptable?"},{"n":4,"choices":{"D":"Yes — 'her' is acceptable because only the CEO's response is discussed in this sentence.","C":"No — 'her' should be replaced with 'their.'","B":"No — 'her' is ambiguous because both the CEO and the board chair could be female.","A":"Yes — 'her' clearly refers to the CEO, as the appositive 'the CEO' immediately follows."},"ans":"A","why":"A is correct. 'In her response, the CEO argued...' — the structure of the sentence makes clear that 'her' refers to the CEO. The noun 'the CEO' immediately clarifies the referent. This is the standard journalistic and academic construction.  B — while both could theoretically be female, the appositive 'the CEO' resolves the ambiguity.  C — 'their' is used for gender-neutral or plural reference; the CEO's gender is specified.  D — partially correct, but the key reason is the clarifying appositive 'the CEO,' not just the topic of the sentence.","slug":"gri-mod-sat-g24-1-4","stem":"The CEO and the board chair both submitted written responses to the shareholder complaint. In her response, the CEO argued that the dividend reduction had been necessary given the current fiscal environment.  Is the pronoun use correct?"},{"n":5,"choices":{"C":"No — 'them' should be replaced with 'it.'","D":"No — 'them' should be replaced with 'the department heads' to avoid ambiguity.","B":"No — 'them' is ambiguous; it could refer to the department heads or the budget proposals.","A":"Yes — 'them' clearly refers to 'the department heads,' which is the object of 'informing.'"},"ans":"A","why":"A is correct. 'Informing them' — 'them' clearly refers to 'the department heads.' The verb 'informing' takes a person as its object, and 'the department heads' is the only plural human noun available. The reference is unambiguous.  B — 'budget proposals' cannot be informed; the reference to people (department heads) is clear.  C — 'it' is singular; 'department heads' is plural.  D — while repetition is always an option, 'them' is clear and standard.","slug":"gri-mod-sat-g24-1-5","stem":"The project coordinator sent an email to the department heads informing them that the deadline for submitting budget proposals had been extended by two weeks.  Is the pronoun use correct?"},{"n":6,"choices":{"B":"Yes — 'they' refers to 'the three former intelligence officers.'","A":"No — 'they' is ambiguous; it could refer to the crew or the former intelligence officers.","D":"No — 'they' should be replaced with 'the editors.'","C":"Yes — 'they' clearly refers to the documentary crew."},"ans":"C","why":"C is correct. 'They decided to omit...to keep the final cut' — only the documentary crew would make editorial decisions about footage. The context eliminates the intelligence officers as a possible referent. 'They' unambiguously refers to the crew.  A — while 'they' technically has two human plural antecedents, only the crew makes editorial decisions.  B — the officers would not make editing decisions.  D — replacing 'they' with 'the editors' is unnecessarily specific; 'they' is clear.","slug":"gri-mod-sat-g24-1-6","stem":"The documentary crew filmed interviews with three former intelligence officers. During the editing process, they decided to omit two of the interviews to keep the final cut under ninety minutes.  Is the pronoun use clear?"},{"slug":"gri-mod-sat-g24-1-7","why":"D is correct. 'It would reduce energy consumption' — only the building code (a measure or regulation) can reduce energy consumption. 'The council' and 'the vote' cannot reduce consumption. The reference is unambiguous.  A — the reference is clear from context.  B — 'they' would be plural; the building code is singular.  C — the council does not reduce energy consumption; the code does.","stem":"The council voted to adopt the new building code last Tuesday. Supporters of the measure argued that it would reduce energy consumption in new residential construction by as much as thirty percent over the next decade.  Is the pronoun use correct?","ans":"D","choices":{"A":"No — 'it' is ambiguous; it could refer to the council, the vote, or the building code.","B":"No — 'it' should be replaced with 'they.'","C":"Yes — 'it' correctly refers to 'the council.'","D":"Yes — 'it' clearly refers to 'the new building code,' the only thing that could reduce energy consumption."},"n":7},{"ans":"D","stem":"As the negotiators from both delegations exchanged position papers, it became clear that their fundamental assumptions about the structure of the agreement were irreconcilable.  Is the pronoun use correct?","why":"D is correct. 'Their fundamental assumptions' — 'their' refers to the negotiators from both delegations. The word 'both' and the context ('irreconcilable') make clear that the assumptions belong to both groups collectively. The reference is not ambiguous.  A — 'their' clearly refers to both delegations' negotiators collectively.  B — 'its' is singular and would refer to a single entity.  C — context makes clear this refers to both delegations.","slug":"gri-mod-sat-g24-1-8","n":8,"choices":{"C":"Yes — 'their' refers only to the first delegation mentioned.","D":"Yes — 'their' clearly refers to 'the negotiators from both delegations' collectively.","A":"No — 'their' is ambiguous; it is unclear which delegation's assumptions are referred to.","B":"No — 'their' should be replaced with 'its.'"}},{"choices":{"D":"No — 'her' should be replaced with 'their.'","C":"Yes — 'her' refers to the planning commissioner, the second subject mentioned.","A":"Yes — 'her' refers to the mayor, as mayors are commonly female.","B":"No — 'her' is ambiguous; it could refer to the mayor or the planning commissioner."},"n":9,"slug":"gri-mod-sat-g24-1-9","why":"B is correct. 'Her' has two possible female antecedents: 'the mayor' and 'the city's planning commissioner.' Without further specification (such as a clarifying appositive), the pronoun is ambiguous and should be revised to name the specific person.  A — assuming the mayor is female based on convention is not a grammar principle.  C — convention does not default to the second noun mentioned.  D — 'their' would suggest both spoke, which contradicts 'she stated.'","stem":"The journalist interviewed both the mayor and the city's planning commissioner about the controversial development proposal. In her opening remarks, she stated that the city had followed all required public consultation procedures.  Is the pronoun use acceptable?","ans":"B"},{"choices":{"D":"No — 'they' is ambiguous; it could refer to the company or the FDA.","C":"Yes — 'they' refers to the FDA's researchers.","A":"Yes — 'they' refers to 'the pharmaceutical company,' which is treated as plural.","B":"No — 'they' should be replaced with 'it,' as the pharmaceutical company is a singular institutional entity."},"n":10,"why":"B is correct. 'The pharmaceutical company' is a singular institutional entity and should be referred to as 'it,' not 'they.' 'They' creates ambiguity because it could refer to the FDA, the company, or some unnamed group within either.  A — singular institutional entities are referred to as 'it' in formal American English.  C — the FDA did not identify the interaction; the company reported it.  D — 'it' would remove the ambiguity.","slug":"gri-mod-sat-g24-1-10","stem":"The pharmaceutical company notified the FDA that they had identified a previously undisclosed interaction between the drug and a common anticoagulant.  Is the pronoun use correct?","ans":"B"},{"n":11,"choices":{"D":"Yes — 'the other' refers to 'economic growth.'","C":"Yes — 'the other' clearly refers to the second of the two theories introduced in the first sentence.","A":"No — 'the other' is vague; it should specify which theory.","B":"No — 'the other' should be 'they.'"},"ans":"C","stem":"The two theories differ significantly in their predictions. While one holds that economic growth inevitably leads to environmental degradation, the other argues that technological innovation can decouple prosperity from resource consumption.  Is the pronoun or phrase use correct?","why":"C is correct. When exactly two items are introduced ('two theories'), 'one' and 'the other' are the standard reference devices. 'The other' unambiguously refers to the second theory.  A — 'the other' is a standard and unambiguous reference device for two items.  B — 'they' would be plural and refer to both theories.  D — 'economic growth' is not a theory.","slug":"gri-mod-sat-g24-1-11"},{"stem":"Several studies have examined the relationship between sleep deprivation and cognitive performance. Most of them found that even a single night of inadequate sleep significantly impairs working memory and executive function.  Is the pronoun use correct?","slug":"gri-mod-sat-g24-1-12","why":"D is correct. 'Most of them found that...' — 'them' clearly refers to 'several studies.' Studies 'find' results, and the sentence describes a finding. The reference is unambiguous.  A — 'researchers' is not present in the text; the only plural noun antecedent is 'several studies.'  B — 'it' is singular and would not agree with 'several studies.'  C — 'researchers' is not explicitly mentioned.","ans":"D","choices":{"B":"No — 'them' should be replaced with 'it.'","A":"No — 'them' is ambiguous; it could refer to the studies or the researchers.","C":"Yes — 'them' refers to 'researchers' implied by context.","D":"Yes — 'them' clearly refers to 'several studies.'"},"n":12},{"stem":"The grant application required that each research team submit a project summary, a detailed methodology section, and letters of support from two external collaborators. After reviewing the submissions, the panel noted that they frequently lacked sufficient detail in the methodology section.  What does 'they' refer to in this context?","why":"C is correct. 'They' could refer to 'the submissions' (what the panel reviewed) or to 'the research teams' (the authors of the submissions). Both are reasonable referents. The sentence should be revised to specify 'the submissions' or 'the teams' to remove ambiguity.  A — 'the external collaborators' did not submit the materials.  B — 'the letters of support' would not contain a methodology section.  D — the reference is not unambiguous.","slug":"gri-mod-sat-g24-1-13","ans":"C","choices":{"D":"'They' unambiguously refers to the research teams.","C":"'They' refers to the submissions, but should be clarified to avoid ambiguity with 'research teams.'","B":"'They' refers to the letters of support.","A":"'They' refers to the external collaborators."},"n":13},{"stem":"Advocates for the new transportation bill argue that it will reduce carbon emissions by incentivizing public transit use and penalizing single-occupancy vehicle trips during peak hours.  Is the pronoun use correct?","why":"D is correct. 'It will reduce carbon emissions by incentivizing...' — only a bill (legislation) can contain provisions that penalize or incentivize behavior. 'The argument' and 'the advocacy' cannot reduce emissions. The reference is unambiguous.  A — context makes the referent clear.  B — 'they' is plural; the bill is singular.  C — 'this' is acceptable but less precise than 'it'; B is the best choice.","ans":"D","choices":{"D":"Yes — 'it' clearly refers to 'the new transportation bill,' which is the only thing that would contain such provisions.","C":"No — 'it' should be replaced with 'this.'","A":"No — 'it' is ambiguous; it could refer to the bill, the argument, or the advocacy.","B":"No — 'it' should be replaced with 'they.'"},"n":14,"slug":"gri-mod-sat-g24-1-14"},{"slug":"gri-mod-sat-g24-1-15","stem":"The novel and the film adaptation both explore the theme of identity loss. While it focuses on internal psychological deterioration, the film emphasizes the external social consequences of the protagonist's transformation.  Is the pronoun use correct?","why":"A is correct. 'While it focuses on internal psychological deterioration, the film emphasizes...' — the contrast structure 'it...the film' makes clear that 'it' refers to the other item in the comparison: the novel. The parallel construction (it / the film) resolves the potential ambiguity.  B — the contrast structure disambiguates; 'it' and 'the film' are in explicit contrast.  C — 'the film' is named explicitly in the second clause; 'it' refers to the other item (the novel).  D — 'they' would refer to both.","ans":"A","choices":{"D":"No — 'it' should be replaced with 'they.'","C":"Yes — 'it' refers to 'the film adaptation.'","A":"Yes — 'it' clearly refers to 'the novel,' as the contrast with 'the film' makes it clear.","B":"No — 'it' is ambiguous; both 'the novel' and 'the film adaptation' could be the referent."},"n":15},{"slug":"gri-mod-sat-g24-1-16","stem":"The board asked the legal team and the compliance department to assess the proposed merger independently. When they submitted their respective analyses, the findings were contradictory on three key points.  Is the pronoun use correct?","why":"C is correct. 'They submitted their respective analyses' — the word 'respective' clarifies that each group submitted its own analysis. 'They' refers to both the legal team and the compliance department collectively. The reference is clear.  A — 'respective' removes the ambiguity by indicating both groups acted.  B — 'it' is singular; both groups are plural.  D — only one group would make 'respective' meaningless.","ans":"C","choices":{"B":"No — 'they' should be replaced with 'it.'","A":"No — 'they' is ambiguous; it could refer to the legal team, the compliance department, or both.","D":"Yes — 'they' refers specifically to the legal team.","C":"Yes — 'they' clearly refers to both groups collectively, as the word 'respective' confirms."},"n":16},{"choices":{"D":"No — 'she' clearly refers to the senior manager.","C":"Yes — 'it' is ambiguous; it could refer to the report or the review.","A":"Yes — 'she' is ambiguous; it could refer to the assistant director or the senior manager.","B":"No — 'she' clearly refers to the assistant director, who is the one who reviewed the report before forwarding it."},"n":17,"stem":"The assistant director forwarded the report to the senior manager after she had reviewed it, noting that several sections required clarification before it could be presented to the board.  Is there a pronoun ambiguity in the underlined portion?","slug":"gri-mod-sat-g24-1-17","why":"B is correct. 'After she had reviewed it' — 'she' refers to the assistant director (the subject of the main clause), who reviewed the report before forwarding it. The temporal logic ('after she had reviewed it' as a precondition for forwarding) makes clear that the assistant director is the reviewer. 'It' clearly refers to 'the report.'  A — the temporal and causal logic of the sentence makes the referent clear.  C — 'it' refers to 'the report,' the only singular noun in the clause.  D — the senior manager received the report; she did not review it before forwarding.","ans":"B"},{"ans":"A","why":"A is correct. 'The prime minister's office' is a singular institutional entity and should be referred to as 'it' in formal American English. 'They' creates potential ambiguity.  B — while staff within an office may be plural, the institution ('the office') is referred to as 'it.'  C — the ambiguity is less about an unnamed group and more about the number mismatch.  D — the prime minister and advisors are not named as antecedents.","slug":"gri-mod-sat-g24-1-18","stem":"The prime minister's office announced that they would be releasing a comprehensive economic strategy document before the end of the fiscal quarter.  Is the pronoun use correct?","n":18,"choices":{"B":"Yes — 'they' is acceptable for referring to the prime minister's office as a group of staff.","A":"No — 'they' should be replaced with 'it,' as the prime minister's office is a singular institutional entity.","D":"Yes — 'they' refers to the prime minister and their advisors.","C":"No — 'they' is ambiguous; it could refer to the prime minister's office or to an unnamed group."}},{"n":19,"choices":{"B":"No — 'she' is ambiguous; there are multiple possible female antecedents.","A":"Yes — 'she' clearly refers to 'the head of finance,' the most recent singular female noun.","C":"No — 'she' should be replaced with 'they.'","D":"Yes — 'she' refers to 'the audit.'"},"ans":"A","stem":"The audit revealed that three of the invoices submitted for reimbursement were fraudulent. When the discovery was reported to the head of finance, she immediately notified the organization's legal counsel.  Is the pronoun use correct?","why":"A is correct. 'She immediately notified' — 'she' refers to 'the head of finance,' who was the subject of the preceding clause. The head of finance is the person who takes action after the discovery is reported to her. The reference is clear.  B — 'the head of finance' is the only recently mentioned individual; no genuine ambiguity exists.  C — 'they' would be plural or gender-neutral; a specific individual is referenced.  D — 'the audit' is not a person and cannot notify anyone.","slug":"gri-mod-sat-g24-1-19"},{"choices":{"C":"'They' refers to the letters, but the sentence should be revised to clarify this.","D":"'They' refers to the scholarship eligibility requirements.","A":"'They' unambiguously refers to the letters.","B":"'They' refers to the admissions committee and the financial aid office."},"n":20,"why":"A is correct. 'They contained conflicting information' — letters 'contain' information; committees and offices do not 'contain' conflicting information in this literal sense. 'They' unambiguously refers to 'the letters' because only letters can contain information.  B — committees and offices do not 'contain' information.  C — the reference is actually unambiguous; no revision is strictly necessary.  D — 'scholarship eligibility requirements' is not a plural noun that 'they' could replace here.","slug":"gri-mod-sat-g24-1-20","stem":"The university's admissions committee and the financial aid office both sent letters to the applicant. Unfortunately, they contained conflicting information about the scholarship eligibility requirements.  What does 'they' refer to?","ans":"A"},{"why":"A is correct. 'They divided the work according to their respective areas of expertise' — 'they' refers to all co-authors (the neuroscientists and the psychologist). The word 'respective' confirms multiple people with different areas. The reference is clear.  B — 'respective' indicates all authors; the reference is collective.  C — replacing 'they' with 'the team' is unnecessary; 'they' is clear.  D — 'respective' would not apply to only one group.","slug":"gri-mod-sat-g24-1-21","stem":"Several neuroscientists and the lead psychologist on the project co-authored the study. When the journal requested revisions, they divided the work according to their respective areas of expertise.  Is the pronoun use correct?","ans":"A","choices":{"C":"No — 'they' should be replaced with 'the team.'","D":"Yes — 'they' refers only to the neuroscientists.","B":"No — 'they' is ambiguous; it could refer to the neuroscientists or the psychologist.","A":"Yes — 'they' clearly refers to all co-authors collectively."},"n":21},{"ans":"B","slug":"gri-mod-sat-g24-1-22","why":"B is correct. While both the senator and the chief of staff are female, the context makes clear that 'she' refers to the senator. Senators are the public-facing officials who respond to reporters about legislation; a chief of staff would typically not be the primary spokesperson. Context resolves the potential ambiguity.  A — context (senator as the public spokesperson on legislation) resolves the ambiguity.  C — a chief of staff would not typically speak on legislation to reporters.  D — 'both declined to comment' would change the meaning.","stem":"The senator and her chief of staff reviewed the draft legislation. When reporters asked about the bill's provisions, she declined to comment, citing ongoing negotiations.  Is the pronoun use correct?","n":22,"choices":{"C":"Yes — 'she' refers to the chief of staff.","D":"No — 'she' should be replaced with 'both.'","A":"No — 'she' is ambiguous; it could refer to the senator or the chief of staff.","B":"Yes — 'she' clearly refers to the senator, as senators respond to reporters about legislation."}},{"n":23,"choices":{"D":"No — 'it' should be replaced with 'its.'","C":"Yes — 'it' clearly refers to 'its database of longitudinal health data.'","A":"No — 'it' is ambiguous; it could refer to the institute, the database, or the data.","B":"No — 'it' should be replaced with 'them.'"},"ans":"C","slug":"gri-mod-sat-g24-1-23","why":"C is correct. 'Researchers who have access to it' — researchers access a database, not an institute or abstract data. 'It' clearly refers to 'its database.' The context is unambiguous.  A — a researcher accesses a database; the other referents (institute, data) are not what one 'accesses' in this construction.  B — 'them' is plural; the database is singular.  D — 'its' is possessive, not a pronoun that can function as an object of 'access.'","stem":"The institute has maintained its database of longitudinal health data for over forty years. Researchers who have access to it must sign a confidentiality agreement specifying how the data may be used and shared.  Is the pronoun use correct?"},{"n":24,"choices":{"D":"Yes — 'they' refers only to the engineering firm.","C":"No — 'they' should be replaced with 'it.'","A":"No — 'they' is ambiguous; it could refer to the engineering firm, the construction company, or both.","B":"Yes — 'they' refers to both parties collectively, as both failing to resolve through mediation led to mutual submission to arbitration."},"ans":"B","stem":"When the engineering firm and the construction company failed to resolve their dispute through mediation, they agreed to submit to binding arbitration.  Is the pronoun use correct?","why":"B is correct. 'They agreed to submit to binding arbitration' — both parties must agree to arbitration; a single party cannot unilaterally submit both sides to binding arbitration. 'They' unambiguously refers to both the engineering firm and the construction company.  A — the logic of the sentence (mutual agreement for binding arbitration) resolves the ambiguity.  C — 'it' is singular and would refer to only one entity.  D — one party alone cannot agree to submit both to arbitration.","slug":"gri-mod-sat-g24-1-24"},{"ans":"C","stem":"The climate modeling team published its projections alongside a methodological appendix. Three months later, a group of independent researchers released a reanalysis suggesting that their margin of error estimates had been systematically underestimated.  What does 'their' refer to?","why":"C is correct. 'Their margin of error estimates' — both 'the climate modeling team' and 'a group of independent researchers' have margin of error estimates. Without further context, it is unclear whose estimates were underestimated. The pronoun should be replaced with a specific noun.  A — the reanalysis likely critiques the original team's estimates, but grammar alone cannot confirm this.  B — the independent researchers published their reanalysis after the original; their estimates might also be referenced.  D — 'projections' cannot possess margin of error estimates grammatically in this construction.","slug":"gri-mod-sat-g24-1-25","n":25,"choices":{"C":"'Their' is ambiguous — it could refer to the climate modeling team or the independent researchers.","D":"'Their' refers to the projections.","A":"'Their' unambiguously refers to the climate modeling team.","B":"'Their' unambiguously refers to the independent researchers."}}],"t":"mcqquiz"}],"name":"Agreement in Complex Sentences","group":"Dilbilgisi","id":"g24","eyebrow":"Gramer"},{"eyebrow":"Gramer","id":"g25","group":"Dilbilgisi","name":"Pronoun Clarity","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Pronoun Clarity. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"ans":"C","slug":"gri-mod-sat-g25-1-1","why":"C is correct. 'Carefully cataloguing each piece of evidence' is performed by the forensic team. The main clause must open with 'the forensic team.'  A — 'the integrity of the samples' cannot catalogue evidence.  B — 'it' is an expletive; the dangling modifier is not fixed.  D — no main verb; fragment.","stem":"The forensic team worked through the night to preserve the scene before the storm arrived. Carefully cataloguing each piece of evidence, the integrity of the samples was maintained throughout the collection process.  Which revision corrects the dangling modifier?","n":1,"choices":{"D":"The forensic team, carefully cataloguing each piece of evidence, and maintaining the integrity of the samples.","C":"Carefully cataloguing each piece of evidence, the forensic team maintained the integrity of the samples throughout the collection process.","A":"The integrity of the samples, carefully catalogued, was maintained throughout the collection process.","B":"Carefully cataloguing each piece of evidence, it was possible to maintain the integrity of the samples."}},{"n":2,"choices":{"B":"Dating back to the fifth century BCE, historians have found the discovery exciting.","A":"Dating back to the fifth century BCE, historians across the field have been excited by the discovery.","D":"The discovery of chambers dating back to the fifth century BCE has excited historians across the field.","C":"The historians dating back to the fifth century BCE have been excited by the discovery."},"ans":"D","why":"D is correct. 'Dating back to the fifth century BCE' modifies the chambers, not 'the discovery' or 'historians.' Restructuring so that 'chambers dating back to the fifth century BCE' is the modified noun resolves the issue.  A — 'historians' cannot date back to the fifth century BCE.  B — 'historians' still cannot date back to the fifth century BCE.  C — ludicrous; historians are not BCE artifacts.","stem":"Archaeologists excavating the site near the ancient harbor have uncovered what appear to be ceremonial burial chambers. Dating back to the fifth century BCE, the discovery has excited historians across the field.  Which revision correctly places the modifier?","slug":"gri-mod-sat-g25-1-2"},{"choices":{"C":"The findings, the board being concerned about reputational damage, were shared only with senior leadership.","D":"The findings were shared only with senior leadership, the board having been concerned about reputational damage.","B":"Concerned about reputational damage, the board shared the findings only with senior leadership before preparing a public statement.","A":"Concerned about reputational damage, a public statement was prepared only after the findings were shared with senior leadership."},"n":3,"why":"B is correct. 'Concerned about reputational damage' describes the board. The main clause must open with 'the board.'  A — 'a public statement' cannot be concerned about reputational damage.  C — awkward absolute phrase construction.  D — 'the board having been concerned' is an absolute phrase that distances the modifier from the main clause.","slug":"gri-mod-sat-g25-1-3","stem":"The board reviewed the auditor's findings and acknowledged the need for systemic reform. Concerned about reputational damage, the findings were shared only with senior leadership before a public statement was prepared.  Which revision corrects the dangling modifier?","ans":"B"},{"why":"A is correct. 'Published simultaneously in four countries' modifies the article. The main clause must open with 'the article' (or equivalent).  B — 'readers' cannot be published simultaneously.  C — 'the article's revelations' cannot be published (the article is published, not the revelations as an independent entity).  D — while grammatically plausible, D restructures the sentence so that 'reading the article' is the participial modifier; the original modifier 'published simultaneously' is not resolved.","slug":"gri-mod-sat-g25-1-4","stem":"The investigative journalist spent three years compiling documentation for her exposé. Published simultaneously in four countries, readers around the world responded immediately to the article's revelations.  Which revision corrects the dangling modifier?","ans":"A","choices":{"B":"Published simultaneously in four countries, the readers responded immediately to the article's revelations.","A":"The article, published simultaneously in four countries, prompted immediate responses from readers around the world.","C":"The article's revelations, simultaneously published, received immediate responses from readers around the world.","D":"Readers around the world, reading the article published simultaneously in four countries, responded immediately."},"n":4},{"slug":"gri-mod-sat-g25-1-5","ans":"B","stem":"The new urban farming initiative was launched with considerable fanfare by the mayor's office last spring. Designed to reduce food insecurity in underserved neighborhoods, critics immediately questioned whether the initiative had sufficient funding to achieve its stated goals.  Which revision corrects the dangling modifier?","why":"B is correct. 'Designed to reduce food insecurity' modifies the initiative, not 'critics.' Repositioning the modifier as a non-restrictive relative clause after 'the initiative' corrects the error.  A — critics cannot be designed to reduce food insecurity.  C — changes the meaning by implying the initiative lacked funding as part of its design.  D — grammatically possible but awkward; A is more direct.","n":5,"choices":{"C":"The initiative, which critics immediately questioned, was designed to reduce food insecurity in underserved neighborhoods without sufficient funding.","D":"Critics immediately questioned the initiative, which was designed to reduce food insecurity in underserved neighborhoods, regarding whether it had sufficient funding.","A":"Designed to reduce food insecurity in underserved neighborhoods, critics were immediately questioning whether sufficient funding existed.","B":"Critics immediately questioned whether the initiative, designed to reduce food insecurity in underserved neighborhoods, had sufficient funding to achieve its stated goals."}},{"n":6,"choices":{"D":"The proposal was significantly strengthened, incorporating feedback from local communities and three independent ecological surveys.","C":"Incorporating feedback from local communities and three independent ecological surveys, the report significantly strengthened the proposal.","A":"The conservation team, incorporating feedback from local communities and three independent ecological surveys, significantly strengthened the proposal with its report's findings.","B":"A and B"},"ans":"B","stem":"The conservation team prepared an environmental impact report before submitting the proposal to the planning authority. Incorporating feedback from local communities and three independent ecological surveys, the proposal was strengthened significantly by the report's findings.  Which revision corrects the dangling modifier?","why":"B is correct. Both A and B correctly fix the dangling modifier. A makes 'the conservation team' the subject (they incorporated the feedback). B makes 'the report' the subject (the report incorporated the feedback). Both are logically and grammatically valid.  D — 'the proposal was significantly strengthened, incorporating' — 'the proposal' cannot incorporate feedback.
