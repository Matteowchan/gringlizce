<meta name="description" content="YDT hazirlik. Kelime, dilbilgisi, baglaclar, cloze test drilleri ve strateji. Bes sikli, gercek sinav formatinda.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#8A5A2C; --accent-deep:#5E3B18; --accent-soft:#EEDFC9; --panel:#F3E9D8;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:13px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:9px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:7px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>
<script src="assets/curriculum.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/site-config.js" defer></script>
<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}
/* modern refinements */
h2 svg{width:18px;height:18px;color:var(--accent);flex:none}
.head{position:relative}
/* Gri writing AI */
.griwz{margin:16px 0 4px}
.griask{background:linear-gradient(120deg,var(--accent),var(--accent-deep))}
.griq{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-left:10px}
.grifb{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#F7F8FA;font-family:Inter,sans-serif;font-size:14px;line-height:1.55}
.grifb.on{display:block}
.grifb.err{background:var(--wrong-soft);border-color:#F1D4CD;color:#8a382f}
.grifb .gscore{font-weight:800;font-size:1.1rem;color:var(--accent-deep);margin-bottom:10px}
.grifb .gcrit{border-top:1px solid var(--line);padding:9px 0}
.grifb .gcrit b{color:var(--accent-deep)}
.grifb .gsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.grifb .gmis{font-size:13.5px;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.grifb .gmis .o{color:var(--wrong);text-decoration:line-through}
.grifb .gmis .c{color:#166a4a;font-weight:700}
</style>

<script id="data" type="application/json">{"title": "YDT (Yabancı Dil)", "badge": "YDT", "groups": ["Öğren", "Drilller", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "YDT Yapısı", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "YDT (Yabancı Dil Testi) üniversite giriş sınavının İngilizce bölümüdür. Seksen soru, çoğunlukla beş şıklı. Soru tipleri sabittir, her birinin ayrı yöntemi var."}, {"t": "table", "head": ["Soru tipi", "Ne ister"], "rows": [["Kelime", "Cümleye anlamca en uygun kelime."], ["Dilbilgisi", "Doğru zaman, edat, bağlaç veya yapı."], ["Cloze test", "Paragraftaki boşluklara uygun kelime ve bağlaç."], ["Cümle tamamlama", "Yarım cümleyi anlam ve dilbilgisiyle tamamlayan şık."], ["Restatement", "Verilen cümleyle anlamca aynı olan cümle."], ["Çeviri", "İngilizce-Türkçe ve Türkçe-İngilizce en doğru çeviri."], ["Diyalog", "Konuşmadaki boş sırayı tamamlayan replik."], ["Paragraf", "Boş bırakılan cümle, akışı bozan cümle, en yakın anlam."]]}, {"t": "note", "k": "ipucu", "title": "Puanlama", "lines": ["YDT 80 sorudur. Yanlis cevap dogruyu goturmez, bu yuzden bos birakma, emin degilsen tahmin yaz.", "Ham dogru sayisi standart puana cevrilir."]}, {"t": "note", "k": "ipucu", "title": "Strateji", "lines": ["Kelime sorusunda boşluğa kendi kelimeni koy, sonra en yakın şıkkı bul.", "Bağlaç sorularında iki cümle arasındaki ilişkiyi (zıtlık, sebep, sonuç) belirle.", "Cloze'da her boşluğu tek tek değil, cümlenin bütününe göre çöz."]}]}, {"id": "kelime", "group": "Drilller", "name": "Kelime", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Cümleye anlamca en uygun kelimeyi seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "The new safety measures are expected to ______ the number of accidents at the factory.", "choices": {"A": "delay", "B": "increase", "C": "reveal", "D": "reduce", "E": "ignore"}, "ans": "D", "why": "reduce = azaltmak. Güvenlik önlemi kazayı azaltır.", "slug": "gri-mod-ydt-kelime-1-1"}, {"n": 2, "stem": "Scientists have not yet found a ______ cure for the common cold.", "choices": {"A": "reluctant", "B": "generous", "C": "reliable", "D": "curious", "E": "fluent"}, "ans": "C", "why": "reliable = güvenilir. Güvenilir bir tedavi.", "slug": "gri-mod-ydt-kelime-1-2"}, {"n": 3, "stem": "The manager was praised for her ability to ______ conflicts among team members.", "choices": {"A": "resolve", "B": "produce", "C": "ignore", "D": "delay", "E": "predict"}, "ans": "A", "why": "resolve = çözmek. Çatışmaları çözmek.", "slug": "gri-mod-ydt-kelime-1-3"}, {"n": 4, "stem": "Despite the heavy rain, the organizers decided to ______ with the outdoor concert.", "choices": {"A": "prevent", "B": "proceed", "C": "delay", "D": "postpone", "E": "cancel"}, "ans": "B", "why": "proceed with = devam etmek. Yağmura rağmen devam etmek. delay, postpone ve cancel 'despite' ile çelişir.", "slug": "gri-mod-ydt-kelime-1-4"}, {"n": 5, "stem": "The report provides a ______ analysis of the country's economic problems.", "choices": {"A": "thorough", "B": "thoughtless", "C": "reluctant", "D": "temporary", "E": "brief"}, "ans": "A", "why": "thorough = kapsamlı, ayrıntılı. Kapsamlı bir analiz. (brief zıt anlam)", "slug": "gri-mod-ydt-kelime-1-5"}, {"n": 6, "stem": "Her arguments were so ______ that the committee changed its decision.", "choices": {"A": "boring", "B": "confusing", "C": "convincing", "D": "doubtful", "E": "careless"}, "ans": "C", "why": "convincing = ikna edici. Komiteyi değiştirecek kadar ikna edici.", "slug": "gri-mod-ydt-kelime-1-6"}]}]}, {"id": "dilbilgisi", "group": "Drilller", "name": "Dilbilgisi", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Doğru zaman, edat veya yapıyı seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "She has been living in Ankara ______ 2015.", "choices": {"A": "since", "B": "for", "C": "from", "D": "by", "E": "in"}, "ans": "A", "why": "since + belirli başlangıç noktası (2015). for süre uzunluğu ile kullanılır.", "slug": "gri-mod-ydt-dilbilgisi-1-1"}, {"n": 2, "stem": "If I ______ more time, I would learn another language.", "choices": {"A": "have", "B": "will have", "C": "would have", "D": "had", "E": "have had"}, "ans": "D", "why": "Type 2 koşul cümlesi: If + past simple, would + yalın fiil. had.", "slug": "gri-mod-ydt-dilbilgisi-1-2"}, {"n": 3, "stem": "The project ______ by the end of next month.", "choices": {"A": "will be completed", "B": "will have completed", "C": "will complete", "D": "completes", "E": "has completed"}, "ans": "A", "why": "Proje 'tamamlanır' (edilgen), gelecekte bir zamana kadar: will be completed.", "slug": "gri-mod-ydt-dilbilgisi-1-3"}, {"n": 4, "stem": "He is interested ______ learning how to code.", "choices": {"A": "on", "B": "in", "C": "with", "D": "at", "E": "for"}, "ans": "B", "why": "interested in kalıbı. Ardından -ing gelir.", "slug": "gri-mod-ydt-dilbilgisi-1-4"}, {"n": 5, "stem": "By the time we arrived, the film ______.", "choices": {"A": "already started", "B": "has already started", "C": "already starts", "D": "was already starting", "E": "had already started"}, "ans": "E", "why": "Geçmişte bir andan önce biten eylem: past perfect. had already started.", "slug": "gri-mod-ydt-dilbilgisi-1-5"}, {"n": 6, "stem": "The teacher made the students ______ the essay again.", "choices": {"A": "to write", "B": "writing", "C": "written", "D": "wrote", "E": "write"}, "ans": "E", "why": "make + nesne + yalın fiil (bare infinitive). make ... write.", "slug": "gri-mod-ydt-dilbilgisi-1-6"}]}]}, {"id": "baglac", "group": "Drilller", "name": "Bağlaçlar ve Geçişler", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "İki cümle arasındaki ilişkiye uygun bağlacı seç. YDT'nin en çok soru sorduğu alan."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "______ he had studied hard, he failed the exam.", "choices": {"A": "Because", "B": "Therefore", "C": "So that", "D": "Although", "E": "In case"}, "ans": "D", "why": "Zıtlık: çalıştı ama kaldı. Although (rağmen).", "slug": "gri-mod-ydt-baglac-1-1"}, {"n": 2, "stem": "The road was closed, ______ we had to take a different route.", "choices": {"A": "because", "B": "although", "C": "unless", "D": "so", "E": "whereas"}, "ans": "D", "why": "Sonuç: yol kapalıydı, bu yüzden. so.", "slug": "gri-mod-ydt-baglac-1-2"}, {"n": 3, "stem": "Take an umbrella ______ it rains later.", "choices": {"A": "although", "B": "so that", "C": "in case", "D": "despite", "E": "unless"}, "ans": "C", "why": "in case = -e karşı, ihtimaline karşı. Yağma ihtimaline karşı şemsiye al.", "slug": "gri-mod-ydt-baglac-1-3"}, {"n": 4, "stem": "______ the high cost, many families still buy new phones every year.", "choices": {"A": "Although", "B": "Because of", "C": "Unless", "D": "So that", "E": "Despite"}, "ans": "E", "why": "Despite + isim öbeği (the high cost). Although cümle isterdi. Zıtlık.", "slug": "gri-mod-ydt-baglac-1-4"}, {"n": 5, "stem": "He spoke slowly ______ everyone could understand him.", "choices": {"A": "so that", "B": "because", "C": "although", "D": "in case", "E": "whereas"}, "ans": "A", "why": "Amaç: herkes anlasın diye. so that (amaç bağlacı).", "slug": "gri-mod-ydt-baglac-1-5"}, {"n": 6, "stem": "Some people love winter, ______ others cannot wait for summer.", "choices": {"A": "because", "B": "whereas", "C": "so", "D": "unless", "E": "since"}, "ans": "B", "why": "Karşıtlık/kıyas: bazıları kışı sever, buna karşın diğerleri. whereas.", "slug": "gri-mod-ydt-baglac-1-6"}]}]}, {"id": "cloze", "group": "Drilller", "name": "Cloze Test", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Paragrafı oku, her boşluğa bütüne en uygun seçeneği koy."}, {"t": "given", "title": "Metin", "x": "Bees play a vital role in agriculture. As they move from flower to flower, they carry pollen, (1) ______ allows plants to produce fruit and seeds. In recent years, (2) ______, bee populations have declined sharply. Scientists believe that pesticides are one of the main (3) ______ of this decline."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Boşluk (1): they carry pollen, ______ allows plants to produce fruit.", "choices": {"A": "where", "B": "who", "C": "which", "D": "what", "E": "whose"}, "ans": "C", "why": "Önceki cümlenin tamamına atıf yapan which. Nesne için who/whose değil.", "slug": "gri-mod-ydt-cloze-2-1"}, {"n": 2, "stem": "Boşluk (2): In recent years, ______, bee populations have declined.", "choices": {"A": "therefore", "B": "as a result", "C": "for example", "D": "in addition", "E": "however"}, "ans": "E", "why": "Arıların faydası anlatıldı, sonra düşüş geliyor: zıtlık. however.", "slug": "gri-mod-ydt-cloze-2-2"}, {"n": 3, "stem": "Boşluk (3): pesticides are one of the main ______ of this decline.", "choices": {"A": "results", "B": "causes", "C": "solutions", "D": "examples", "E": "benefits"}, "ans": "B", "why": "Pesticidler düşüşün sebebidir. causes. (results sonuç olurdu)", "slug": "gri-mod-ydt-cloze-2-3"}]}]}, {"id": "cumletam", "group": "Drilller", "name": "Cümle Tamamlama", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Yarım cümleyi hem anlamca hem dilbilgisiyle tamamlayan şıkkı seç. Bütün şıklar makul görünür; zaman uyumu ve baştaki bağlaç doğru olanı belirler."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Had I known about the heavy traffic this morning, ______", "choices": {"A": "I would have left home a good deal earlier", "B": "I am normally leaving the house fairly early", "C": "I will certainly find a different route tomorrow", "D": "the main road into the city had been closed", "E": "so that everyone could still get to work on time"}, "ans": "A", "why": "Had I known = devrik Type 3 koşul. Ana cümle 'would have + V3' olur (geçmişe pişmanlık). Diğerleri zaman veya yapı olarak uymaz.", "slug": "gri-mod-ydt-cumletam-1"}, {"n": 2, "stem": "The company had to close several of its branches ______", "choices": {"A": "as soon as the newly appointed manager arrives", "B": "even though its yearly profits were rising fast", "C": "so that it could cut its costs during the crisis", "D": "unless the national economy suddenly gets better", "E": "while most of the staff were away on holiday"}, "ans": "C", "why": "Şube kapatmanın amacı maliyet düşürmek: so that + could. B çelişir, A zaman uyumsuz, D/E anlamca kopuk.", "slug": "gri-mod-ydt-cumletam-2"}, {"n": 3, "stem": "______, the volunteers managed to clean the entire beach in a single day.", "choices": {"A": "Because they were given almost no time at all", "B": "So that the long beach would stay completely dirty", "C": "Unless a great many more people had joined them", "D": "In order to pollute the surrounding sea even further", "E": "Despite having only a very small amount of equipment"}, "ans": "E", "why": "Başta zıtlık öbeği: az ekipmana rağmen başardılar. Despite + -ing. Diğerleri ana cümleyle çelişir.", "slug": "gri-mod-ydt-cumletam-3"}, {"n": 4, "stem": "The more regularly you practise speaking English, ______", "choices": {"A": "you are going to feel a great deal more confident", "B": "the more confident you gradually tend to become", "C": "your overall confidence just keeps getting higher", "D": "and so you slowly manage to become more confident", "E": "because you generally feel quite confident about it"}, "ans": "B", "why": "the + comparative ..., the + comparative ... kalıbı. İkinci kısım da 'the more' ile başlamalı.", "slug": "gri-mod-ydt-cumletam-4"}, {"n": 5, "stem": "She spoke in such a low and quiet voice ______", "choices": {"A": "so that everyone in the large hall heard her clearly", "B": "because the whole room had gone completely silent", "C": "as if she were actually shouting at the top of her voice", "D": "that no one sitting at the back could really hear her", "E": "although the microphone in front of her worked perfectly"}, "ans": "D", "why": "such a ... that sonuç kalıbı: o kadar alçak sesle konuştu ki kimse duyamadı. Boşluk 'that' ister.", "slug": "gri-mod-ydt-cumletam-5"}, {"n": 6, "stem": "______ the final report is completely finished, we will send it to all the department heads.", "choices": {"A": "In spite of", "B": "Because of", "C": "As soon as", "D": "So as to", "E": "No sooner"}, "ans": "C", "why": "Zaman bağlacı: rapor biter bitmez göndereceğiz. A/B isim öbeği, D fiil, E devrik yapı ister.", "slug": "gri-mod-ydt-cumletam-6"}]}]}, {"id": "diyalog", "group": "Drilller", "name": "Diyalog Tamamlama", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Boş bırakılan konuşma sırasını, öncesi ve sonrasına anlamca uyan replikle tamamla. İpucu genelde bir sonraki repliktedir."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Ali: I'm thinking of studying abroad next year. / Mehmet: ______ / Ali: Mostly because I want to improve my English in a native environment.", "choices": {"A": "That honestly sounds quite expensive to me.", "B": "I actually studied abroad two years ago myself.", "C": "You should really try to book your flight early.", "D": "Really? What made you decide to do that?", "E": "Have you ever actually been abroad before?"}, "ans": "D", "why": "Ali'nin cevabı bir sebep veriyor (Mostly because...); demek ki Mehmet sebebi/kararı sordu.", "slug": "gri-mod-ydt-diyalog-1"}, {"n": 2, "stem": "Customer: Excuse me, do you have this shirt in a larger size? / Assistant: ______ / Customer: Oh, that's a shame. Thank you anyway.", "choices": {"A": "Yes, of course, I will bring it to you right away.", "B": "Certainly, and what size exactly would you like?", "C": "This particular shirt is actually on sale this week.", "D": "The fitting rooms are just over there on the right.", "E": "I'm afraid that's the only size we have left."}, "ans": "E", "why": "Müşterinin 'that's a shame' (yazık) tepkisi olumsuz cevabı gösterir: tek beden kalmış.", "slug": "gri-mod-ydt-diyalog-2"}, {"n": 3, "stem": "Emma: I failed my driving test again. / Jack: ______ / Emma: You're right. I'll book some more lessons before trying again.", "choices": {"A": "You should honestly just give up driving completely.", "B": "Don't worry, maybe you just need a little more practice.", "C": "Well, I actually passed mine on the very first try.", "D": "Driving tests are basically impossible for anyone to pass.", "E": "Why do you even want to get a driving licence at all?"}, "ans": "B", "why": "Emma 'haklısın, daha ders alacağım' diyor; demek ki Jack pratik önerip cesaret verdi.", "slug": "gri-mod-ydt-diyalog-3"}, {"n": 4, "stem": "Teacher: Your essay was well written, but it was handed in two days late. / Student: ______", "choices": {"A": "Honestly, that is really not my problem at all.", "B": "Almost everyone hands in their essays a bit late.", "C": "I know, and I'm sorry. I had a family emergency.", "D": "Why does the exact deadline even matter so much?", "E": "To be fair, I didn't actually write it myself."}, "ans": "C", "why": "Hem olumlu hem eleştirel yoruma uygun, kibar ve açıklayıcı cevap.", "slug": "gri-mod-ydt-diyalog-4"}, {"n": 5, "stem": "Neighbour: Could you please turn the music down? It's quite late. / You: ______", "choices": {"A": "Oh, I'm so sorry. I didn't realise the time.", "B": "No, I actually paid a lot of money for these speakers.", "C": "You are always complaining about almost everything.", "D": "Honestly, the music isn't even that loud right now.", "E": "Why exactly are you still awake at this late hour?"}, "ans": "A", "why": "Kibar bir ricaya uygun özür ve düzeltme.", "slug": "gri-mod-ydt-diyalog-5"}]}]}, {"id": "restatement", "group": "Drilller", "name": "Restatement (Eşdeğer Cümle)", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Verilen cümleyle anlamca en yakın (aynı) cümleyi seç. Kalıpların (should have, unless, would rather...) anlamını iyi bil; şıklar uzunlukça benzerdir."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "You should have told me about the meeting much earlier.", "choices": {"A": "You actually told me about the meeting right on time.", "B": "You will probably tell me about the meeting a bit later.", "C": "I clearly told you about that meeting much earlier on.", "D": "You have to tell me about absolutely every single meeting.", "E": "It was wrong of you not to inform me about the meeting sooner."}, "ans": "E", "why": "should have + V3 = geçmişte yapılmayan, yapılması gerekeni eleştirir.", "slug": "gri-mod-ydt-restatement-1"}, {"n": 2, "stem": "Hardly had the game started when it suddenly began to rain.", "choices": {"A": "As soon as the game started, it began to rain heavily.", "B": "The game only started because it was already raining.", "C": "It rained a lot, so in the end the game did not start.", "D": "The game had started a long time before it began to rain.", "E": "It very rarely rains during important football games."}, "ans": "A", "why": "Hardly had ... when ... = -er -mez. Oyun başlar başlamaz yağmur başladı.", "slug": "gri-mod-ydt-restatement-2"}, {"n": 3, "stem": "Unless you hurry up now, you will definitely miss the train.", "choices": {"A": "If you hurry up now, you will surely miss the train.", "B": "You will still catch the train even if you are quite slow.", "C": "You missed the train earlier because you hurried too much.", "D": "If you do not hurry up now, you will miss the train.", "E": "Hurrying up now will not really help you catch the train."}, "ans": "D", "why": "unless = if not. Acele etmezsen kaçırırsın.", "slug": "gri-mod-ydt-restatement-3"}, {"n": 4, "stem": "I would rather stay at home tonight than go to the party.", "choices": {"A": "I would honestly quite like to go to the party tonight.", "B": "I prefer staying at home tonight to going to the party.", "C": "I prefer going to the party rather than staying at home.", "D": "I will first go to the party and then stay at home tonight.", "E": "There is nothing I dislike more than staying at home alone."}, "ans": "B", "why": "would rather X than Y = Y yerine X'i tercih ederim. Evde kalmayı tercih.", "slug": "gri-mod-ydt-restatement-4"}, {"n": 5, "stem": "No matter how hard she tried, she couldn't solve the problem.", "choices": {"A": "In the end she managed to solve the problem quite easily.", "B": "She did not really make any effort to solve the problem.", "C": "However hard she tried, she failed to solve the problem.", "D": "The problem was not actually that difficult for her to solve.", "E": "She only solved the problem after getting a lot of help."}, "ans": "C", "why": "No matter how hard = however hard. Ne kadar uğraşsa da çözemedi.", "slug": "gri-mod-ydt-restatement-5"}, {"n": 6, "stem": "The higher the temperature rises, the faster the ice melts.", "choices": {"A": "When the temperature is low, the ice still melts quickly.", "B": "The ice always melts at a completely constant, steady speed.", "C": "Higher temperatures actually stop the ice from melting at all.", "D": "As the temperature increases, the ice melts more and more quickly.", "E": "The ice tends to melt long before the temperature even rises."}, "ans": "D", "why": "The higher..., the faster... = orantı. Sıcaklık arttıkça buz daha hızlı erir.", "slug": "gri-mod-ydt-restatement-6"}]}]}, {"id": "ceviri", "group": "Drilller", "name": "Çeviri", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "İngilizce-Türkçe ve Türkçe-İngilizce en doğru çeviriyi seç. Anlamı bozan veya özne-nesne yer değiştiren şıklar tuzaktır; hepsi benzer uzunluktadır."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "En iyi çeviri: 'Governments should invest more in renewable energy to reduce air pollution.'", "choices": {"A": "Hükümetler yenilenebilir enerjiyi azaltmak için hava kirliliğine yatırım yapmalıdır.", "B": "Hava kirliliği, hükümetlerin yenilenebilir enerjiye yatırım yapmasını engellemektedir.", "C": "Hükümetler hava kirliliğini azaltmak için yenilenebilir enerjiye daha çok yatırım yapmalıdır.", "D": "Hükümetler hava kirliliğini artırmak amacıyla enerjiye daha çok yatırım yapmaktadır.", "E": "Yenilenebilir enerji, hava kirliliğini azaltmak için hükümetlere ciddi biçimde ihtiyaç duyar."}, "ans": "C", "why": "Özne, fiil ve amaç (to reduce = azaltmak için) doğru aktarılmış tek şık C.", "slug": "gri-mod-ydt-ceviri-1"}, {"n": 2, "stem": "En iyi çeviri: 'Although the technology is expensive, it saves money in the long run.'", "choices": {"A": "Teknoloji oldukça ucuz olduğu için uzun vadede epeyce para kazandırmaktadır.", "B": "Teknoloji pahalı olsa da uzun vadede ciddi bir para tasarrufu sağlar.", "C": "Teknoloji çok pahalı olduğu için uzun vadede insana para kaybettirmektedir.", "D": "Uzun vadede bu teknoloji giderek daha da pahalı bir hale gelmektedir.", "E": "Bu teknoloji hem oldukça ucuz hem de son derece tasarruflu bir teknolojidir."}, "ans": "B", "why": "Although = -e rağmen (olsa da). Zıtlık ve 'uzun vadede tasarruf' doğru aktarılmış.", "slug": "gri-mod-ydt-ceviri-2"}, {"n": 3, "stem": "En iyi çeviri: 'Children who read regularly tend to have larger vocabularies.'", "choices": {"A": "Çocuklar düzenli olarak okursa zamanla kelime dağarcıkları küçülme eğilimindedir.", "B": "Geniş kelime dağarcığı olan çocuklar genellikle pek fazla kitap okumamaktadır.", "C": "Düzenli biçimde okumak çocukların kelime bilgisini azaltma eğilimi göstermektedir.", "D": "Çocuklar zaman zaman oldukça büyük ve kalın kitapları merakla okumaktadır.", "E": "Düzenli okuyan çocukların genellikle daha geniş bir kelime dağarcığı olur."}, "ans": "E", "why": "tend to = genellikle/eğilimindedir; larger vocabularies = daha geniş kelime dağarcığı.", "slug": "gri-mod-ydt-ceviri-3"}, {"n": 4, "stem": "Best English translation: 'Trafik sıkışıklığı arttıkça insanlar toplu taşımayı daha çok tercih ediyor.'", "choices": {"A": "As traffic congestion increases, people increasingly prefer to use public transport.", "B": "People strongly prefer public transport, so traffic congestion keeps increasing.", "C": "Traffic congestion clearly decreases whenever people start using public transport.", "D": "People rarely use public transport at all because of the heavy city traffic.", "E": "Crowded public transport is clearly increasing traffic congestion for everyone."}, "ans": "A", "why": "arttıkça = as ... increases; daha çok tercih ediyor = increasingly prefer.", "slug": "gri-mod-ydt-ceviri-4"}, {"n": 5, "stem": "Best English translation: 'Bu projeyi zamanında bitirebilmek için daha fazla çalışana ihtiyacımız var.'", "choices": {"A": "We managed to finish this whole project on time with far fewer workers.", "B": "This important project really should have been finished by many more workers.", "C": "Many more workers are now needed because the whole project is already very late.", "D": "We need more workers in order to finish this project on time.", "E": "We already seem to have more than enough workers to finish the project."}, "ans": "D", "why": "-ebilmek için ... ihtiyacımız var = we need ... to finish ... on time. Amaç ve ihtiyaç doğru.", "slug": "gri-mod-ydt-ceviri-5"}, {"n": 6, "stem": "Best English translation: 'Yeni yasa, küçük işletmelerin vergi yükünü azaltmayı amaçlıyor.'", "choices": {"A": "Small businesses have clearly increased the tax burden created by the new law.", "B": "The new law aims to reduce the tax burden on small businesses.", "C": "The new law is going to raise taxes for almost all small businesses in the country.", "D": "Small businesses themselves are aiming to change the recently passed new tax law.", "E": "The heavy tax burden eventually created a brand new law for small businesses."}, "ans": "B", "why": "amaçlıyor = aims to; vergi yükünü azaltmak = reduce the tax burden. Özne yeni yasa.", "slug": "gri-mod-ydt-ceviri-6"}]}]}, {"id": "paragraf", "group": "Drilller", "name": "Paragraf", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Paragraf soruları: boş bırakılan cümleyi bul, akışı bozan cümleyi bul veya en yakın anlamı seç. Önce paragrafın konusunu belirle."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Boşluğa gelecek cümle: 'The invention of the printing press in the 15th century transformed European society. ______ As a result, ideas spread faster than ever before, and literacy rates began to rise.'", "choices": {"A": "Most people at that time still clearly preferred handwritten manuscripts.", "B": "It allowed books to be produced quickly and in large numbers for the first time.", "C": "The early printing press was, in fact, extremely difficult to operate by hand.", "D": "Today, digital media has largely replaced most traditional printed books.", "E": "Very few people were genuinely interested in reading during this early period."}, "ans": "B", "why": "Boşluk dönüşümü açıklamalı ve 'sonuç olarak fikirler hızla yayıldı'ya bağlanmalı. Hızlı-çok üretim bunu sağlar.", "slug": "gri-mod-ydt-paragraf-1"}, {"n": 2, "stem": "Boşluğa gelecek sonuç cümlesi: 'Regular exercise has many benefits beyond physical fitness. Studies show that it reduces stress, improves mood, and helps people sleep better. ______'", "choices": {"A": "However, regular exercise seems to have no real effect on mental health.", "B": "In contrast, sleeping a lot less actually tends to improve one's fitness.", "C": "Physical fitness is, in the end, the only real benefit of doing exercise.", "D": "For these reasons, doctors increasingly recommend physical activity for a healthy life.", "E": "So far, very few studies have properly examined the real effects of exercise."}, "ans": "D", "why": "Sonuç cümlesi faydaları özetleyip öneriye bağlanmalı. A/B/C önceki cümlelerle çelişir.", "slug": "gri-mod-ydt-paragraf-2"}, {"n": 3, "stem": "Akışı bozan cümle hangisi? '(I) Coffee is one of the most popular drinks in the world. (II) It is grown in more than fifty countries, mostly near the equator. (III) Tea, however, was first discovered in ancient China. (IV) The plant produces small red berries that contain the coffee beans. (V) After harvesting, the beans are dried, roasted and ground before brewing.'", "choices": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "C", "why": "Paragraf kahveyi anlatıyor; III çay hakkında, konudan sapıyor.", "slug": "gri-mod-ydt-paragraf-3"}, {"n": 4, "stem": "Akışı bozan cümle hangisi? '(I) Sleep is essential for good health. (II) During deep sleep, the body repairs tissues and strengthens the immune system. (III) A lack of sleep is linked to memory problems and weight gain. (IV) Experts recommend seven to nine hours of sleep for most adults. (V) Many restaurants now offer late-night menus for their hungry customers.'", "choices": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "E", "why": "Paragraf uyku hakkında; V restoran menüleri, alakasız.", "slug": "gri-mod-ydt-paragraf-4"}, {"n": 5, "stem": "Boşluğa gelecek açılış cümlesi: '______ For example, a single large factory can release more carbon dioxide in a year than thousands of cars. Governments are therefore introducing stricter limits on industrial emissions.'", "choices": {"A": "Industry is one of the biggest single contributors to air pollution today.", "B": "Private cars are really the only significant source of urban air pollution.", "C": "Overall air pollution has, in fact, steadily decreased over recent years.", "D": "Large factories are usually built quite far away from major residential cities.", "E": "Most people nowadays clearly prefer to travel around by their private cars."}, "ans": "A", "why": "Örnek fabrika emisyonunu, sonuç sanayi sınırlamalarını anlatıyor; açılış sanayinin kirliliğe katkısını söylemeli.", "slug": "gri-mod-ydt-paragraf-5"}]}]}, {"eyebrow":"Drill","id":"conditionals","name":"Koşul Cümleleri","blocks":[{"t":"p","x":"Koşul cümlelerinin (conditionals) tüm tipleri tek sette: Type 0/1/2/3, Mixed Conditionals, devrik yapılar (Had I known, Were I, Should you), Unless / Provided that / As long as / In case, Wish ve If only, Without / But for ile imalı koşullar. 50 cümle tamamlama sorusu, her birinde ayrıntılı Türkçe açıklama."},{"t":"mcqquiz","items":[{"stem":"Water ---- at exactly one hundred degrees Celsius at standard atmospheric pressure.","slug":"gri-mod-ydt-conditionals-1-1","n":1,"ans":"A","choices":{"B":"will boil","E":"is boiling","C":"would boil","A":"boils","D":"had boiled"},"why":"Bilimsel/genel gerçek = Type 0 Conditional. Yapı: if + present simple, present simple. 'Water boils at 100°C' her zaman doğru olduğu için present simple."},{"slug":"gri-mod-ydt-conditionals-1-2","n":2,"stem":"If the safety regulations ---- stricter, the recent industrial accident might have been entirely avoided last summer.","ans":"D","choices":{"A":"are","D":"were","E":"being","B":"had been","C":"would be"},"why":"Mixed Conditional: şu anki/sürekli durum (were) → geçmiş sonuç (might have been avoided). Kurallar şu anda daha sıkı olsa, geçen yazki kaza önlenmiş olabilirdi."},{"stem":"If she ---- the urgent email yesterday morning, she could have responded in time for the deadline.","slug":"gri-mod-ydt-conditionals-1-3","n":3,"choices":{"C":"had seen","E":"has seen","B":"saw","A":"sees","D":"would see"},"ans":"C","why":"Type 3 Conditional: geçmiş hipotetik. Yapı: if + past perfect (had seen), could/would have + V3 (could have responded). 'Yesterday morning' = geçmiş."},{"slug":"gri-mod-ydt-conditionals-1-4","n":4,"stem":"The construction project will not proceed ---- additional government funding becomes available within the next month.","choices":{"B":"when","E":"unless","C":"provided that","D":"supposing","A":"if"},"ans":"E","why":"'Unless' = 'if not' (eğer ... olmazsa). Cümle 'will not proceed unless funding becomes available' = ek finansman gelmezse proje ilerlemeyecek."},{"choices":{"A":"Knew he","D":"Should he know","C":"Did he know","B":"Had he known","E":"If knew he"},"ans":"B","why":"Type 3'ün devrik yapısı (inversion). 'Had he known' = 'If he had known'. Sonuç cümlesi 'would have postponed' (Type 3) ile uyumlu.","stem":"---- about the severe storm forecast in time, the captain would have postponed the entire voyage immediately.","slug":"gri-mod-ydt-conditionals-1-5","n":5},{"stem":"If global temperatures continue to rise at the current alarming rate, polar ice ---- much faster than scientists initially predicted.","slug":"gri-mod-ydt-conditionals-1-6","n":6,"why":"Type 1 Conditional: gerçeklikçi gelecek. Yapı: if + present simple, will + V1. Sıcaklıklar artmaya devam ederse, buz daha hızlı eriyecek.","choices":{"C":"would melt","B":"melted","E":"melts","D":"had melted","A":"will melt"},"ans":"A"},{"stem":"The election candidate now wishes she ---- the campaign issues more thoroughly before the live televised debate.","slug":"gri-mod-ydt-conditionals-1-7","n":7,"ans":"D","choices":{"C":"had studying","E":"would study","B":"studied","D":"had studied","A":"studies"},"why":"Wish + past perfect = geçmişe yönelik pişmanlık. 'She wishes she had studied' = keşke (geçmişte) çalışsaydı. Tartışma geçmişte olduğu için."},{"why":"'Provided that' = '...şartıyla, ...koşuluyla'. Şart bildiren bağlaç, 'if' yerine kullanılır. 'Geçerli olacak, şu şartla ki ...'","choices":{"C":"provided that","E":"even though","B":"although","A":"unless","D":"supposing"},"ans":"C","stem":"The signed contract will be considered legally valid ---- both parties sign it in the presence of authorized witnesses.","slug":"gri-mod-ydt-conditionals-1-8","n":8},{"ans":"E","choices":{"A":"heeds","D":"heeding","B":"heeded","E":"had heeded","C":"would heed"},"why":"'If only + past perfect' = geçmiş için derin pişmanlık. 'If only the council had heeded' = keşke konsey (geçmişte) dinleseydi.","stem":"If only the city council ---- the early warning signs about the bridge structure several years ago.","slug":"gri-mod-ydt-conditionals-1-9","n":9},{"ans":"B","choices":{"C":"had invested","E":"is investing","B":"invested","D":"would invest","A":"invests"},"why":"Type 2 Conditional: şu anki hipotetik. Yapı: if + past simple, could/would + V1. 'Şirket şu an yatırım yapsa, vergi avantajı elde edebilir.'","stem":"If the company ---- substantially in renewable energy now, it could secure significant tax benefits in the long run.","n":10,"slug":"gri-mod-ydt-conditionals-1-10"},{"choices":{"B":"knows","E":"would have known","C":"would know","A":"knew","D":"had known"},"ans":"D","why":"Mixed Conditional: geçmiş şart (had r.","n":49,"choices":{"C":"whose","A":"who","B":"which","E":"where","D":"what"},"ans":"A","slug":"gri-mod-ydt-relative-1-49"},{"stem":"The picturesque alpine resort, ---- many famous Olympic skiers have trained over the years, offers some of the most challenging slopes in all of Europe.","why":"'Where' = yer. 'Skiers have trained where (at the resort)' yapısı. Kayak merkezi bir yer.","ans":"C","choices":{"E":"whose","D":"when","C":"where","A":"which","B":"what"},"n":50,"slug":"gri-mod-ydt-relative-1-50"}],"t":"mcqquiz"}],"name":"Ä°lgi CÃ¼mlecikleri (Relative Clauses)"},{"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "note", "k": "ipucu", "title": "Kelime ve dilbilgisi", "lines": ["Kelimede önce boşluğa kendi kelimeni koy, sonra şıkka bak. Tuzak şık genelde tanıdık ama anlamı ters.", "Bağlaçta despite/because of isim öbeği ister, although/because cümle ister. Bu ayrım çok soru kazandırır."]}, {"t": "note", "k": "ipucu", "title": "Cloze ve paragraf", "lines": ["Cloze'da boşluğu tek başına değil, önündeki ve arkasındaki cümleyle çöz.", "Akışı bozan cümlede paragrafın konusunu bul, konudan sapan cümle cevaptır."]}, {"t": "note", "k": "dikkat", "title": "Şık seçme tuzakları", "lines": ["'En uzun şık doğrudur' diye bir kural yoktur; her şıkkı gerekçesiyle ele.", "Cümle tamamlama ve restatement'ta önce cümledeki kalıbı (koşul, such...that, would rather) tanı, sonra ona uyan tek şıkkı bul."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  if(q.n>=2){fb.className='grifb on err';fb.textContent='Bugünlük Gri değerlendirme hakkın doldu (2/2). Yarın tekrar dene.';return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
