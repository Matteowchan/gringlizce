<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit": 3, "unit_title": "SAT Reading & Writing Kampı", "unit_accent": "warm", "lessons": [{"no": 1, "name": "Transitions", "teaching": {"ne_olculuyor": ["İki cümle arasında bir boşluk vardır. Görev: iki cümle arasındaki mantık ilişkisini doğru adlandıran geçiş kelimesini seçmek.", "Bu soru kelime bilgisi değil, MANTIK sorusudur. however, therefore, for example gibi kelimelerin ne anlama geldiğini değil, iki cümlenin BİRBİRİNE nasıl bağlı olduğunu ölçer.", "Kritik nokta: geçiş kelimesi iki cümle arasındaki gerçek ilişkiyi yansıtmalı. Yanlış yönü ya da yanlış türü seçen öğrenci puanı kaybeder."], "karar_proseduru": ["GEÇİŞ KELİMESİNE HENÜZ BAKMA. Önce iki cümleyi oku, arasındaki ilişkiyi kendi kelimenle söyle.  İkinci cümle birinciyle çelişiyor mu, onu mu sonuçlandırıyor, örnek mi veriyor, ekliyor mu.", "İlişkiyi bir kategoriye koy.  Zıtlık mi, sonuç mu, ekleme mi, örnek mi, açıklama mi. Önce kategoriyi bul.", "O kategoriye uyan geçişi ara.  Zıtlık ise however, yet, nevertheless. Sonuç ise therefore, thus. Ekleme ise moreover, in addition. Örnek ise for example.", "Yönü iki kez kontrol et.  En sık hata: zıtlık gerekirken sonuç bağlacı koymak. İkinci cümle birinciyle ÇELİŞİYORSA geçiş de zıtlık olmalı.", "Seçilen geçişi cümleye koy ve oku.  Mantık akıyor mu. Akmıyorsa yanlış kategoridesin."], "celdirici_aileleri": [{"ad": "Ters yön", "tanim": "Geçiş doğru olanın TERSİ yönü gösterir. İki cümle çelişiyorken sonuç bağlacı (therefore) koyar, ya da sonuç gerekirken zıtlık (however) koyar. En sık ve en ölümcül tuzak."}, {"ad": "Yanlış alt tür", "tanim": "Geçiş genel yönü doğru ama YANLIŞ alt türü. Ekleme gerekirken örnek (for example) koyar, ya da sonuç gerekirken açıklama (in other words). Yön yakın ama tür yanlış."}, {"ad": "Sebep sonuç ters", "tanim": "Neden ile sonuç yer değiştirir. İkinci cümle birincinin Sebebiyken sonuç gibi bağlar, ya da tam tersi. Ok yönü ters çevrilmiştir."}, {"ad": "İlgisiz geçiş", "tanim": "Geçişin anlamı iki cümleye HİÇ uymaz. Benzerlik yokken similarly, sıralama yokken meanwhile koyar. Tanıdık kelime ama yanlış ilişki."}], "top_tips": ["Önce ilişkiyi kendi kelimenle söyle, sonra seçeneklere bak. Geçiş kelimesinden bakarsan tanıdık olanı seçersin, mantığı değil.", "En sık tuzak ters yön. İki cümle çelişiyorsa (biri olumlu biri olumsuz sonuç) geçiş MUTLAKA zıtlık olmalı. therefore görünce dur, gerçekten sonuç mu diye sor.", "however ile therefore birbirinin tersi. Biri doğruysa öteki kesin yanlış. İki cümlenin çelişip çelişmediğine bak.", "for example koymadan önce sor: ikinci cümle birincinin ÖRNEĞİ mi, yoksa SONUCU ya da EKLEMESİ mi. Örnek değilse for example yanlıştır."], "kavramsal_temel": ["Transitions, iki cümle arasındaki MANTIK ilişkisini doğru adlandıran geçiş kelimesini seçmeni ister. Bu soru kelime bilgisi değil, mantık sorusudur.", "Görev however, therefore, for example gibi kelimelerin anlamını bilmek değil, iki cümlenin BİRBİRİNE nasıl bağlı olduğunu görmektir. Geçiş kelimesi bu gerçek ilişkiyi yansıtmalı.", "En sık ve en ölümcül tuzak ters yöndür: iki cümle çelişiyorken sonuç bağlacı (therefore) koymak, ya da sonuç gerekirken zıtlık (however) koymak. however ile therefore birbirinin tersidir, biri doğruysa öteki kesin yanlıştır.", "Bu yüzden geçiş kelimesine bakmadan önce iki cümleyi oku ve aralarındaki ilişkiyi kendi kelimenle söyle. İkinci cümle birinciyle çelişiyor mu, onu mu sonuçlandırıyor, örnek mi veriyor."], "cozumlu_ornekler": [{"passage": "The new policy was expected to cut the city's traffic sharply. ______, congestion in the downtown core actually rose in the months after it took effect.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Therefore", "C": "For example", "D": "Meanwhile"}, "correct": "A", "adimlar": ["İki cümleyi oku: birincide trafik düşecek bekleniyordu, ikincide trafik ARTTI.", "İlişki: ikinci cümle birinciyle çelişiyor. Beklenen olmadı.", "Çelişki zıtlık geçişi ister. However doğru.", "Therefore sonuç bağlacı, yanlış yön. For example örnek, değil. Meanwhile eş zamanlılık, değil."], "sonuc": "İki cümle çelişiyorsa geçiş MUTLAKA zıtlık olmalı. actually kelimesi de çelişkiyi işaret ediyordu."}, {"passage": "The city has invested heavily in public transit. It expanded the subway, added bus routes, and built bike lanes. ______, it installed hundreds of new streetlights to improve night safety.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In addition", "B": "For example", "C": "However", "D": "Therefore"}, "correct": "A", "adimlar": ["İki cümleyi oku: birincide yatırımlar sayılıyor, ikincide bir yatırım daha ekleniyor.", "İlişki: ekleme. Streetlight bir örnek değil, listeye eklenen ayrı bir yatırım.", "In addition ekleme geçişi, doğru.", "For example bunu örnek yapar, yanlış alt tür. However zıtlık, değil. Therefore sonuç, değil."], "sonuc": "Ekleme ile örnek karıştırılmamalı. Streetlight önceki maddelerin örneği değil, listeye eklenen yeni bir şey."}], "sik_hatalar": [{"hata": "Ters yön seçmek", "cozum": "İki cümle çelişiyorsa geçiş zıtlık olmalı. therefore görünce dur, gerçekten sonuç mu diye sor."}, {"hata": "Ekleme ile örnek karıştırmak", "cozum": "for example koymadan önce sor: ikinci cümle birincinin ÖRNEĞİ mi, yoksa ayrı bir EKLEME mi."}, {"hata": "Sebep sonucu ters kurmak", "cozum": "Neden mi sonuç mu, ok yönünü kontrol et. therefore sonuca, because nedene gider."}, {"hata": "İlgisiz geçiş seçmek", "cozum": "similarly benzerlik, meanwhile eş zamanlılık ister. Cümlede o ilişki yoksa bu geçişler yanlıştır."}], "strateji": ["Geçiş kelimesine bakmadan iki cümle arasındaki ilişkiyi kendi kelimenle söyle.", "İlişkiyi kategoriye koy: zıtlık, sonuç, ekleme, örnek, açıklama.", "O kategoriye uyan geçişi ara.", "Yönü iki kez kontrol et, ters yön en sık hata.", "Seçtiğin geçişi cümleye koyup oku, mantık akıyor mu bak."]}, "families": ["Ters yön", "Yanlış alt tür", "Sebep sonuç ters", "İlgisiz geçiş"], "fam_short": {"Ters yön": "Ters yön", "Yanlış alt tür": "Yanlış tür", "Sebep sonuç ters": "Sebep/sonuç", "İlgisiz geçiş": "İlgisiz"}, "main_ids": ["u3-l1-f1-01", "u3-l1-f2-01", "u3-l1-f3-01", "u3-l1-f4-01"], "questions": [{"id": "u3-l1-f1-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The new policy was expected to cut the city's traffic sharply. ______, congestion in the downtown core actually rose in the months after it took effect.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Therefore", "C": "For example", "D": "Meanwhile"}, "correct": "A", "choice_families": {"B": "Ters yön", "C": "Yanlış alt tür", "D": "İlgisiz geçiş"}, "why_correct": "The second sentence contradicts the expectation in the first (traffic rose instead of falling), so a contrast transition fits.", "why_wrong": {"B": "'Therefore' signals a result that follows, but the sentences conflict, so it points the wrong way.", "C": "'For example' introduces an illustration, but the second sentence is a contrast, not an example.", "D": "'Meanwhile' marks simultaneous events, which is not the relationship here."}}, {"id": "u3-l1-f1-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "Solar panels have become far cheaper over the past decade. ______, many households still hesitate to install them because of the upfront cost.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "Nevertheless", "C": "In other words", "D": "Similarly"}, "correct": "B", "choice_families": {"A": "Ters yön", "C": "Yanlış alt tür", "D": "İlgisiz geçiş"}, "why_correct": "Despite cheaper panels, households still hesitate; the second sentence runs against the first, so a contrast transition fits.", "why_wrong": {"A": "'As a result' signals a consequence, but hesitation contradicts the drop in price rather than following from it.", "C": "'In other words' restates a point, but the second sentence adds a contrasting fact, not a restatement.", "D": "'Similarly' marks likeness, but the two sentences oppose each other."}}, {"id": "u3-l1-f1-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The committee gathered months of detailed data on the proposal. ______, it reached its final decision without consulting any of it.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "For instance", "C": "Yet", "D": "Likewise"}, "correct": "C", "choice_families": {"A": "Ters yön", "D": "İlgisiz geçiş", "B": "Yanlış alt tür"}, "why_correct": "Gathering data then ignoring it is a contradiction, so a contrast transition fits.", "why_wrong": {"A": "'Consequently' signals a result, but ignoring the data does not follow logically from gathering it.", "D": "'Likewise' marks similarity, not the contrast present here.", "B": "'For instance' introduces an example, which the second sentence is not."}}, {"id": "u3-l1-f1-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The medication cleared the trial's safety checks with ease. ______, regulators delayed its approval for another full year.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Thus", "B": "Meanwhile", "C": "That is", "D": "Still"}, "correct": "D", "choice_families": {"A": "Ters yön", "C": "Yanlış alt tür", "B": "İlgisiz geçiş"}, "why_correct": "Passing safety checks would predict quick approval, but approval was delayed, so a contrast transition fits.", "why_wrong": {"A": "'Thus' signals a result, but the delay works against the smooth safety checks rather than following from them.", "C": "'That is' introduces a restatement, not the contrast the sentences require.", "B": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f1-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "Critics predicted the film would fail at the box office. ______, it became the highest-grossing release of the year.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In contrast", "B": "Accordingly", "C": "In addition", "D": "Finally"}, "correct": "A", "choice_families": {"B": "Ters yön", "C": "Yanlış alt tür", "D": "İlgisiz geçiş"}, "why_correct": "The film succeeded against the prediction of failure, so a contrast transition fits.", "why_wrong": {"B": "'Accordingly' signals a result in line with what came before, but success contradicts the prediction.", "C": "'In addition' adds a similar point, but the second sentence opposes the first.", "D": "'Finally' marks the last item in a sequence, which is not the relationship here."}}, {"id": "u3-l1-f1-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The two theories rest on completely different assumptions about how memory works. ______, they arrive at nearly identical predictions.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Therefore", "B": "Nonetheless", "C": "For example", "D": "Meanwhile"}, "correct": "B", "choice_families": {"A": "Ters yön", "C": "Yanlış alt tür", "D": "İlgisiz geçiş"}, "why_correct": "Different assumptions would predict different results, but the theories agree, so a contrast transition fits.", "why_wrong": {"A": "'Therefore' signals a consequence, but identical predictions do not follow from opposite assumptions.", "C": "'For example' introduces an illustration, which the second sentence is not.", "D": "'Meanwhile' marks simultaneity, not the contrast present here."}}, {"id": "u3-l1-f1-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The region receives abundant rainfall throughout the year. ______, its reservoirs run dangerously low each summer.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "In short", "C": "Even so", "D": "Similarly"}, "correct": "C", "choice_families": {"A": "Ters yön", "D": "İlgisiz geçiş", "B": "Yanlış alt tür"}, "why_correct": "Abundant rain would predict full reservoirs, but they run low, so a contrast transition fits.", "why_wrong": {"A": "'As a result' signals a consequence, but low reservoirs contradict abundant rainfall.", "D": "'Similarly' marks likeness, which is not the relationship here.", "B": "'In short' introduces a summary, not the contrast the sentences require."}}, {"id": "u3-l1-f1-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The author spent years researching the historical setting of her novel. ______, she chose to leave almost all of that detail out of the finished book.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Hence", "B": "Meanwhile", "C": "In fact", "D": "However"}, "correct": "D", "choice_families": {"A": "Ters yön", "C": "Yanlış alt tür", "B": "İlgisiz geçiş"}, "why_correct": "Extensive research then leaving it out is a contradiction, so a contrast transition fits.", "why_wrong": {"A": "'Hence' signals a result, but omitting the detail does not follow from researching it.", "C": "'In fact' intensifies or confirms a prior point, not the contrast present here.", "B": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f1-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "Early reviews of the restaurant were overwhelmingly negative. ______, it has been fully booked every night since it opened.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Despite this", "B": "Thus", "C": "For instance", "D": "Likewise"}, "correct": "A", "choice_families": {"C": "Yanlış alt tür", "D": "İlgisiz geçiş", "B": "Ters yön"}, "why_correct": "Negative reviews would predict empty tables, but the restaurant is fully booked, so a contrast transition fits.", "why_wrong": {"C": "'For instance' introduces an example, which the second sentence is not.", "D": "'Likewise' marks similarity, not the contrast present here.", "B": "'Thus' signals a result, but being fully booked contradicts the negative reviews."}}, {"id": "u3-l1-f1-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yön", "passage": "The species was declared extinct more than fifty years ago. ______, a small population was recently found living deep in the forest.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "However", "C": "In other words", "D": "Meanwhile"}, "correct": "B", "choice_families": {"A": "Ters yön", "C": "Yanlış alt tür", "D": "İlgisiz geçiş"}, "why_correct": "A recent living population contradicts the extinction declaration, so a contrast transition fits.", "why_wrong": {"A": "'Consequently' signals a result, but the discovery works against the extinction claim rather than following from it.", "C": "'In other words' restates a point, which the second sentence does not do.", "D": "'Meanwhile' marks simultaneity, not the contrast present here."}}, {"id": "u3-l1-f2-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The city has invested heavily in public transit in recent years. It has expanded the subway, added bus routes, and built new bike lanes. ______, it has installed hundreds of new streetlights to improve safety at night.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "In addition", "C": "However", "D": "Therefore"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Sebep sonuç ters", "A": "Yanlış alt tür"}, "why_correct": "The streetlights are one more item added to a list of investments, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues in the same direction.", "D": "'Therefore' signals a result, but the streetlights do not follow as a consequence.", "A": "'For example' would make the streetlights an illustration of the previous items, but they are a separate, added investment, not an example of transit expansion."}}, {"id": "u3-l1-f2-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "Many desert plants have developed ways to conserve water. ______, the barrel cactus stores moisture in its thick, ribbed stem for use during long droughts.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Nevertheless", "B": "In addition", "C": "For example", "D": "As a result"}, "correct": "C", "choice_families": {"B": "Yanlış alt tür", "D": "Sebep sonuç ters", "A": "Ters yön"}, "why_correct": "The barrel cactus is a specific illustration of the general point about water conservation, so an example transition fits.", "why_wrong": {"B": "'In addition' would add a separate point, but the cactus is an instance of the general claim, not a new one.", "D": "'As a result' signals a consequence, which the cactus example is not.", "A": "'Nevertheless' signals contrast, but the sentence supports the previous one."}}, {"id": "u3-l1-f2-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The report's findings were complex and easily misread. ______, its conclusion was that current methods, though imperfect, remain the best available.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Meanwhile", "B": "For example", "C": "However", "D": "In short"}, "correct": "D", "choice_families": {"B": "Yanlış alt tür", "C": "Ters yön", "A": "İlgisiz geçiş"}, "why_correct": "The second sentence sums up the complex findings in a single line, so a summary transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence condenses the findings rather than exemplifying them.", "C": "'However' signals contrast, but the sentence distills rather than opposes.", "A": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f2-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The professor's lectures were famous for their difficulty. Students often left them confused and overwhelmed. ______, her office hours were patient, warm, and unhurried.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "By contrast", "B": "In addition", "C": "Therefore", "D": "For example"}, "correct": "A", "choice_families": {"B": "Yanlış alt tür", "C": "Sebep sonuç ters", "D": "Yanlış alt tür"}, "why_correct": "The warm office hours are set against the difficult lectures, so a contrast transition fits.", "why_wrong": {"B": "'In addition' would add a similar point, but the office hours oppose the tone of the lectures.", "C": "'Therefore' signals a result, but the office hours do not follow as a consequence of the hard lectures.", "D": "'For example' introduces an illustration, but the office hours contrast with, rather than illustrate, the lectures."}}, {"id": "u3-l1-f2-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The museum wanted to make its collection more approachable. It rewrote its labels in plain language and added audio guides. ______, it lowered its ticket prices for students and families.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "Moreover", "C": "However", "D": "In conclusion"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Yanlış alt tür", "A": "Yanlış alt tür"}, "why_correct": "Lower ticket prices are another step added to the museum's efforts, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues the same effort.", "D": "'In conclusion' signals a closing summary, but this sentence adds a new action, not a wrap-up.", "A": "'For instance' would make the price cut an example of rewriting labels, but it is a separate measure."}}, {"id": "u3-l1-f2-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The bridge's design looked strange to many observers. ______, its unusual curves were what allowed it to withstand high winds.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Therefore", "B": "For example", "C": "In fact", "D": "Meanwhile"}, "correct": "C", "choice_families": {"B": "Yanlış alt tür", "D": "İlgisiz geçiş", "A": "Sebep sonuç ters"}, "why_correct": "The second sentence deepens and confirms the point with a striking detail, so an emphasis transition fits.", "why_wrong": {"B": "'For example' introduces an illustration of a general claim, but here the sentence intensifies rather than exemplifies.", "D": "'Meanwhile' marks simultaneity, which is not the relationship here.", "A": "'Therefore' signals a result, but the point about wind resistance is not a consequence of looking strange."}}, {"id": "u3-l1-f2-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "Coral reefs face many threats today. Warming seas cause bleaching, pollution smothers the coral, and overfishing removes key species. ______, coastal construction buries reefs under sediment.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "For example", "C": "Nevertheless", "D": "Furthermore"}, "correct": "D", "choice_families": {"B": "Yanlış alt tür", "C": "Ters yön", "A": "Sebep sonuç ters"}, "why_correct": "Coastal construction is one more threat added to a list, so an addition transition fits.", "why_wrong": {"B": "'For example' would make construction an illustration of the previous threats, but it is a separate threat added to them.", "C": "'Nevertheless' signals contrast, but the sentence continues the list.", "A": "'As a result' signals a consequence, which this added threat is not."}}, {"id": "u3-l1-f2-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The essay's language is dense and technical. ______, its central claim is simple: people remember stories better than facts.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Put simply", "B": "For example", "C": "Consequently", "D": "Similarly"}, "correct": "A", "choice_families": {"B": "Yanlış alt tür", "C": "Sebep sonuç ters", "D": "İlgisiz geçiş"}, "why_correct": "The second sentence restates the dense essay in plain terms, so a restatement transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence paraphrases the claim rather than giving an instance.", "C": "'Consequently' signals a result, but the simple claim does not follow as a consequence of dense language.", "D": "'Similarly' marks likeness, which is not the relationship here."}}, {"id": "u3-l1-f2-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The startup tried several ways to keep its employees. It raised salaries and offered flexible hours. ______, it began providing free childcare on site.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "In addition", "C": "However", "D": "Therefore"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Sebep sonuç ters", "A": "Yanlış alt tür"}, "why_correct": "On-site childcare is another retention measure added to the list, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues the same effort.", "D": "'Therefore' signals a result, which this added measure is not.", "A": "'For example' would make childcare an illustration of raising salaries, but it is a separate measure."}}, {"id": "u3-l1-f2-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlış alt tür", "passage": "The argument runs through many pages of statistics and qualifications. ______, it boils down to a single warning: act now or lose the chance.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "For example", "C": "In essence", "D": "Meanwhile"}, "correct": "C", "choice_families": {"B": "Yanlış alt tür", "D": "İlgisiz geçiş", "A": "Ters yön"}, "why_correct": "The second sentence condenses the long argument into its core, so a summary transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence sums up rather than exemplifies.", "D": "'Meanwhile' marks simultaneity, which is not the relationship here.", "A": "'However' signals contrast, but the sentence distills rather than opposes."}}, {"id": "u3-l1-f3-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "Heavy rain fell across the valley for three straight days. ______, the river burst its banks and flooded the low-lying farms.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "For this reason the rain fell, since", "C": "As a result", "D": "For example"}, "correct": "C", "choice_families": {"B": "Sebep sonuç ters", "D": "Yanlış alt tür", "A": "Ters yön"}, "why_correct": "The flooding is the consequence of the heavy rain, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This phrasing treats the flood as the cause of the rain, reversing the real order; the rain caused the flood, not the reverse.", "D": "'For example' introduces an illustration, which the flood is not.", "A": "'However' signals contrast, but the flood follows from the rain rather than opposing it."}}, {"id": "u3-l1-f3-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The factory switched to renewable power last year. ______, its carbon emissions dropped by nearly half.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "That drop is why the factory switched, as", "C": "Nevertheless", "D": "Consequently"}, "correct": "D", "choice_families": {"B": "Sebep sonuç ters", "C": "Ters yön", "A": "Yanlış alt tür"}, "why_correct": "The emissions drop is the effect of switching to renewables, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the emissions drop the reason for the switch, reversing the order; the switch caused the drop, not the reverse.", "C": "'Nevertheless' signals contrast, but the drop follows from the switch.", "A": "'For instance' introduces an example, which the drop is not."}}, {"id": "u3-l1-f3-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The team practiced together for months before the tournament. ______, their coordination on the court was seamless.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Thus", "B": "The seamless play is what led them to practice, because", "C": "In contrast", "D": "In other words"}, "correct": "A", "choice_families": {"B": "Sebep sonuç ters", "C": "Ters yön", "D": "Yanlış alt tür"}, "why_correct": "The seamless coordination results from months of practice, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the seamless play as the cause of the practice, reversing the order; practice produced the coordination, not the reverse.", "C": "'In contrast' signals opposition, but the coordination follows from the practice.", "D": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f3-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "A long drought dried out the forest floor over the summer. ______, even a small spark was enough to start a fast-moving wildfire.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "The wildfire is why the drought set in, since", "B": "As a result", "C": "However", "D": "For example"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Yanlış alt tür", "A": "Sebep sonuç ters"}, "why_correct": "The easily started fire is a consequence of the dry conditions, so a result transition fits, with cause before effect.", "why_wrong": {"C": "'However' signals contrast, but the fire risk follows from the drought.", "D": "'For example' introduces an illustration, which this is not.", "A": "This makes the wildfire the cause of the drought, reversing the order; the drought enabled the fire, not the reverse."}}, {"id": "u3-l1-f3-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The store moved to a busy corner near the train station. ______, its foot traffic more than doubled within a month.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Still", "B": "That rise in traffic is why it moved, as", "C": "Consequently", "D": "For instance"}, "correct": "C", "choice_families": {"B": "Sebep sonuç ters", "D": "Yanlış alt tür", "A": "Ters yön"}, "why_correct": "The rise in foot traffic is the effect of the move, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the traffic rise as the reason for the move, reversing the order; the move caused the rise, not the reverse.", "D": "'For instance' introduces an example, which this is not.", "A": "'Still' signals contrast, but the traffic rise follows from the move."}}, {"id": "u3-l1-f3-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The new vaccine reached remote villages for the first time this year. ______, cases of the disease there fell to record lows.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In short", "B": "Those low case numbers brought the vaccine, because", "C": "Nevertheless", "D": "As a result"}, "correct": "D", "choice_families": {"B": "Sebep sonuç ters", "C": "Ters yön", "A": "Yanlış alt tür"}, "why_correct": "The drop in cases results from the vaccine's arrival, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the low case numbers the cause of the vaccine's arrival, reversing the order; the vaccine reduced cases, not the reverse.", "C": "'Nevertheless' signals contrast, but the drop follows from the vaccine.", "A": "'In short' introduces a summary, which this is not."}}, {"id": "u3-l1-f3-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The company ignored years of warnings about its aging equipment. ______, a major breakdown finally shut the plant for weeks.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "The breakdown is why the warnings were ignored, since", "C": "However", "D": "Similarly"}, "correct": "A", "choice_families": {"B": "Sebep sonuç ters", "C": "Ters yön", "D": "İlgisiz geçiş"}, "why_correct": "The breakdown is the consequence of ignoring the warnings, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the breakdown as the cause of the ignored warnings, reversing the order; ignoring the warnings led to the breakdown, not the reverse.", "C": "'However' signals contrast, but the breakdown follows from the neglect.", "D": "'Similarly' marks likeness, which is not the relationship here."}}, {"id": "u3-l1-f3-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "Warm ocean water flowed into the bay all summer. ______, the fish that need cold water moved farther offshore.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "The fish leaving is what warmed the water, because", "B": "Thus", "C": "Yet", "D": "For example"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Yanlış alt tür", "A": "Sebep sonuç ters"}, "why_correct": "The fish moving offshore results from the warm water, so a result transition fits, with cause before effect.", "why_wrong": {"C": "'Yet' signals contrast, but the fish's move follows from the warming.", "D": "'For example' introduces an illustration, which this is not.", "A": "This makes the fish leaving the cause of the warming, reversing the order; the warm water drove the fish away, not the reverse."}}, {"id": "u3-l1-f3-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "The library extended its opening hours into the late evening. ______, student use of its study rooms rose sharply after dark.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "That late-night use is why the hours changed, as", "C": "As a result", "D": "In other words"}, "correct": "C", "choice_families": {"B": "Sebep sonuç ters", "D": "Yanlış alt tür", "A": "Ters yön"}, "why_correct": "The rise in evening use is the effect of longer hours, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the late-night use as the cause of the schedule change, reversing the order; the longer hours caused the use, not the reverse.", "D": "'In other words' restates a point, which this is not.", "A": "'However' signals contrast, but the use follows from the longer hours."}}, {"id": "u3-l1-f3-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuç ters", "passage": "A thick layer of ash settled over the fields after the eruption. ______, the following season's harvest was the richest in memory.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "The rich harvest is why the ash fell, since", "C": "Nevertheless", "D": "Consequently"}, "correct": "D", "choice_families": {"B": "Sebep sonuç ters", "C": "Ters yön", "A": "Yanlış alt tür"}, "why_correct": "The rich harvest results from the mineral-laden ash, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the harvest the cause of the ashfall, reversing the order; the ash enriched the soil, not the reverse.", "C": "'Nevertheless' signals contrast, but the harvest follows from the ash.", "A": "'For instance' introduces an example, which this is not."}}, {"id": "u3-l1-f4-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The first phase of the project focused on gathering data from local farms. ______, the second phase turned to analyzing that data for patterns.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "Similarly", "C": "In contrast", "D": "Next"}, "correct": "D", "choice_families": {"B": "İlgisiz geçiş", "C": "Ters yön", "A": "Yanlış alt tür"}, "why_correct": "The two phases follow one another in order, so a sequence transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentences describe successive stages, not similar ones.", "C": "'In contrast' signals opposition, but the phases follow in sequence rather than conflict.", "A": "'For example' introduces an illustration, which the second phase is not."}}, {"id": "u3-l1-f4-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The engineers finished testing the prototype in the lab. ______, they moved it outdoors to see how it performed in real weather.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Then", "B": "Likewise", "C": "However", "D": "In other words"}, "correct": "A", "choice_families": {"B": "İlgisiz geçiş", "C": "Ters yön", "D": "Yanlış alt tür"}, "why_correct": "Moving outdoors is the next step after lab testing, so a sequence transition fits.", "why_wrong": {"B": "'Likewise' marks similarity, but the sentences describe consecutive steps, not similar ones.", "C": "'However' signals contrast, but the outdoor test follows naturally from the lab test.", "D": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f4-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The recipe calls for chilling the dough for an hour. ______, you roll it out and cut it into shapes before baking.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Similarly", "B": "Afterward", "C": "Nevertheless", "D": "For instance"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Yanlış alt tür", "A": "İlgisiz geçiş"}, "why_correct": "Rolling out the dough comes after chilling, so a sequence transition fits.", "why_wrong": {"C": "'Nevertheless' signals contrast, but the rolling step follows the chilling naturally.", "D": "'For instance' introduces an example, which this step is not.", "A": "'Similarly' marks likeness, but the steps follow one another rather than resembling each other."}}, {"id": "u3-l1-f4-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "Sea otters and beavers both shape the habitats around them. ______, each is considered a keystone species whose loss would transform its ecosystem.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Meanwhile", "C": "Similarly", "D": "For example"}, "correct": "C", "choice_families": {"B": "İlgisiz geçiş", "D": "Yanlış alt tür", "A": "Ters yön"}, "why_correct": "The sentence draws a likeness between the two animals' roles, so a similarity transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneous events, but the sentence compares the two species rather than timing them.", "D": "'For example' introduces an illustration, but the sentence generalizes across both animals rather than giving one instance.", "A": "'However' signals contrast, but the sentence stresses their shared role."}}, {"id": "u3-l1-f4-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The northern trail climbs steeply through rocky terrain to the summit. ______, the southern trail winds gently through meadows to reach the same peak.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "Therefore", "C": "In short", "D": "By comparison"}, "correct": "D", "choice_families": {"B": "İlgisiz geçiş", "C": "Yanlış alt tür", "A": "Sebep sonuç ters"}, "why_correct": "The sentence sets the two trails side by side to compare them, so a comparison transition fits.", "why_wrong": {"B": "'Therefore' signals a result, but the southern trail is not a consequence of the northern one.", "C": "'In short' introduces a summary, but the sentence compares rather than sums up.", "A": "'As a result' signals a consequence, which the second trail is not."}}, {"id": "u3-l1-f4-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The orchestra tuned their instruments as the hall filled with people. ______, the conductor waited backstage, reviewing the score one last time.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Meanwhile", "B": "Similarly", "C": "Therefore", "D": "For example"}, "correct": "A", "choice_families": {"B": "İlgisiz geçiş", "C": "Sebep sonuç ters", "D": "Yanlış alt tür"}, "why_correct": "The two actions happen at the same time in different places, so a simultaneity transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentence describes two different things happening at once, not similar ones.", "C": "'Therefore' signals a result, but the conductor's waiting is not a consequence of the tuning.", "D": "'For example' introduces an illustration, which this is not."}}, {"id": "u3-l1-f4-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "First, the students brainstormed as many ideas as they could without judging them. ______, they grouped the ideas and chose the three strongest to develop.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Likewise", "B": "Second", "C": "However", "D": "For instance"}, "correct": "B", "choice_families": {"C": "Ters yön", "D": "Yanlış alt tür", "A": "İlgisiz geçiş"}, "why_correct": "The sentence marks the next step in an ordered process, so a sequence transition fits.", "why_wrong": {"C": "'However' signals contrast, but the grouping step follows the brainstorming naturally.", "D": "'For instance' introduces an example, which this step is not.", "A": "'Likewise' marks similarity, but the sentence moves to the next stage rather than a parallel one."}}, {"id": "u3-l1-f4-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "Solar power and wind power both draw energy from natural, renewable sources. ______, both produce electricity without burning fuel or releasing carbon.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Meanwhile", "C": "Likewise", "D": "Therefore"}, "correct": "C", "choice_families": {"B": "İlgisiz geçiş", "D": "Sebep sonuç ters", "A": "Ters yön"}, "why_correct": "The sentence adds a further shared trait of the two sources, drawing a parallel, so a similarity transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneity, but the sentence compares the two sources rather than timing them.", "D": "'Therefore' signals a result, which this shared trait is not.", "A": "'However' signals contrast, but the sentence stresses what they share."}}, {"id": "u3-l1-f4-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "The crew loaded the supplies onto the ship through the morning. ______, the captain reviewed the route with the navigation officer on the bridge.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In other words", "B": "Similarly", "C": "As a result", "D": "Meanwhile"}, "correct": "D", "choice_families": {"B": "İlgisiz geçiş", "C": "Sebep sonuç ters", "A": "Yanlış alt tür"}, "why_correct": "The two activities occur at the same time in different places, so a simultaneity transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentence describes two different tasks happening at once.", "C": "'As a result' signals a consequence, but the captain's review is not caused by the loading.", "A": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f4-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "İlgisiz geçiş", "passage": "A paper map never loses signal and needs no battery to work. ______, a phone's map updates in real time and can reroute you around traffic.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "By contrast", "B": "Meanwhile", "C": "Therefore", "D": "In short"}, "correct": "A", "choice_families": {"B": "İlgisiz geçiş", "C": "Sebep sonuç ters", "D": "Yanlış alt tür"}, "why_correct": "The sentence sets the phone map against the paper map to contrast their strengths, so a contrast transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneity, but the sentence compares the two tools rather than timing them.", "C": "'Therefore' signals a result, but the phone map is not a consequence of the paper map.", "D": "'In short' introduces a summary, but the sentence contrasts rather than sums up."}}]}, {"no": 2, "name": "Rhetorical Synthesis", "teaching": {"ne_olculuyor": ["Bir konu hakkında alınmış notlar listesi ve bir YAZMA AMACI verilir. Görev: o amacı en iyi karşılayan cümleyi seçmek.", "Bu soru dilbilgisi değil, AMAÇ uyumu ölçer. Cümle doğru olabilir, notlardan gelebilir, ama istenen amacı yapmıyorsa yanlıştır.", "Kritik nokta: önce AMACI oku, sonra cevap ara. Amaç neyi vurgulamanı istiyorsa cevap onu yapmalı. Çoğu tuzak doğru bilgiyi yanlış amaç için kullanır."], "karar_proseduru": ["ÖNCE AMACI OKU, notları değil. Soru kökündeki amacı tek cümleyle kendine söyle.  Örneğin iki şeyi karşılaştırmak, bir özelliği tanıtmak, bir sonuca varmak.", "Amacın anahtar sözünü işaretle.  compare, emphasize, introduce, describe. Bu kelime cevabın ne yapması gerektiğini söyler.", "Her seçeneği amaca göre test et.  Bu cümle amacı YAPIYOR mu. Sadece doğru olmak yetmez, amacı karşılamalı.", "Sentez gerekiyor mu bak.  Amaç karşılaştırma ya da bağlantı istiyorsa cevap BİRDEN ÇOK notu birleştirmeli. Tek nota dayanan cevap eksiktir.", "Notlarda olmayanı ele.  Cevaptaki her bilgi notlarda olmalı. Kulağa doğru gelen ama notta olmayan detay tuzaktır."], "celdirici_aileleri": [{"ad": "Amacı karşılamıyor", "tanim": "Cümle doğru ve notlardan gelir ama istenen AMACI yapmaz. Amaç karşılaştırma isterken sadece tanımlar, ya da vurgu isterken düz bilgi verir. Doğru bilgi, yanlış is."}, {"ad": "Tek not sentez yok", "tanim": "Amaç birden çok bilgiyi BİRLEŞTİRMEYİ isterken cümle tek nota dayanır. Karşılaştırma ya da bağlantı amacında tek unsur eksik kalır. Sentez yapılmamıştır."}, {"ad": "Notta olmayan bilgi", "tanim": "Cümle notlarda BULUNMAYAN bir bilgi ekler. Makul görünür ama dayanağı yoktur. Öğrenci dışarıdan bilgi kattığı için seçer, ama sentez notlara dayanmalı."}, {"ad": "Yanlış vurgu", "tanim": "Cümle notları kullanır ama amacın istediğinden BAŞKA şeyi öne çıkarır. Amaç bir özelliği vurgulamanı isterken cümle başka bir ayrıntıyı merkeze alır. Yön yanlıştır."}], "top_tips": ["Önce amacı oku, seçenekleri değil. Amacı bilmeden seçenek okursan en doğru görünen cümleyi seçersin, amacı karşılayanı değil.", "Amaçta compare, contrast, connection varsa cevap MUTLAKA iki bilgiyi birleştirmeli. Tek nota dayanan seçenek bu amacı karşılamaz.", "Her seçeneği amacın anahtar kelimesiyle test et. Amaç emphasize the difference diyorsa, cümle farkı gösteriyor mu diye sor.", "Cevaptaki her olguyu notlarda ara. Notta yoksa, ne kadar mantıklı olursa olsun, yanlıştır. Sentez dışarıdan bilgi katmaz."], "kavramsal_temel": ["Rhetorical Synthesis, notlar listesi ve bir YAZMA AMACI verir, o amacı en iyi karşılayan cümleyi seçmeni ister. Bu soru dilbilgisi değil, amaç uyumu ölçer.", "Cümle doğru olabilir, notlardan gelebilir, ama istenen amacı yapmıyorsa yanlıştır. Önce AMACI oku, sonra cevap ara. Amaç neyi vurgulamanı istiyorsa cevap onu yapmalı.", "Amaç karşılaştırma ya da bağlantı istiyorsa cevap BİRDEN ÇOK notu birleştirmeli. Tek nota dayanan cevap eksik kalır. Amaç emphasize the difference diyorsa cümle farkı göstermeli.", "Ayrıca cevaptaki her bilgi notlarda olmalı. Kulağa doğru gelen ama notta olmayan detay tuzaktır. Sentez dışarıdan bilgi katmaz, verilen notları amaca göre kullanır."], "cozumlu_ornekler": [{"passage": "While researching a topic, a student took the following notes:\n\n- The Aral Sea was once the fourth-largest lake in the world.\n- By 2010 it had shrunk to a tenth of its original size.\n- Rivers feeding it were diverted for cotton farming.", "stem": "The student wants to emphasize the scale of the Aral Sea's shrinkage. Which choice best accomplishes this goal?", "choices": {"A": "Once the world's fourth-largest lake, the Aral Sea had shrunk to a tenth of its original size by 2010.", "B": "The rivers feeding the Aral Sea were diverted for cotton farming.", "C": "The Aral Sea was once the fourth-largest lake in the world.", "D": "The Aral Sea has a long and interesting history."}, "correct": "A", "adimlar": ["Önce amacı oku: KÜÇÜLMENİN ÖLÇEĞİNİ vurgulamak.", "Ölçek göstermek için, eski büyüklükle şimdiki durumu yan yana koymak gerek.", "A tam bunu yapar: dördüncü en büyük göl, onda birine düşmüş. Büyüklüğü gösterir.", "B küçülmenin nedenini verir, ölçeğini değil. C sadece eski durumu verir. D notta yok, boş bir cümle."], "sonuc": "Amaç ölçeği vurgulamak. Doğru cevap eski ve yeni durumu birleştirip büyüklüğü gösterir."}, {"passage": "While researching, a student took the following notes:\n\n- The violin is played with a bow drawn across its strings.\n- The guitar is usually played by plucking its strings with the fingers.\n- Both produce sound from vibrating strings.", "stem": "The student wants to compare how the two instruments are played. Which choice best accomplishes this goal?", "choices": {"A": "While the violin is played with a bow, the guitar is usually plucked with the fingers.", "B": "The violin is played with a bow drawn across its strings.", "C": "Both instruments produce sound from vibrating strings.", "D": "The guitar is a popular instrument in many kinds of music."}, "correct": "A", "adimlar": ["Amacı oku: iki çalgıyı NASIL çalındığı açısından KARŞILAŞTIRMAK.", "Karşılaştırma iki bilgiyi birleştirmeyi gerektirir.", "A hem keman (yay) hem gitar (parmak) bilgisini birleştirir, karşılaştırır.", "B sadece kemanı verir, tek not, sentez yok. C ortak özelliği verir, çalınışı değil. D notta yok."], "sonuc": "Amaç karşılaştırma ise cevap iki notu birleştirmeli. Tek nota dayanan seçenek eksiktir."}], "sik_hatalar": [{"hata": "Amacı okumadan cevap seçmek", "cozum": "Önce amacı oku. Amacı bilmeden en doğru görünen cümleyi seçersin, amacı karşılayanı değil."}, {"hata": "Karşılaştırma amacında tek not kullanmak", "cozum": "compare, contrast, connection varsa cevap iki bilgiyi birleştirmeli. Tek nota dayanan seçenek amacı karşılamaz."}, {"hata": "Notta olmayan bilgi eklemek", "cozum": "Cevaptaki her olguyu notlarda ara. Notta yoksa, ne kadar mantıklı olsa da yanlıştır."}, {"hata": "Yanlış vurgu yapmak", "cozum": "Cümle notları kullanabilir ama amacın istediğinden başka şeyi öne çıkarıyorsa yanlıştır. Amacın anahtar kelimesiyle test et."}], "strateji": ["Önce amacı oku, notları değil. Amacın anahtar sözünü işaretle.", "Amaç karşılaştırma ya da bağlantı istiyorsa sentez ara, tek not yetmez.", "Her seçeneği amaca göre test et: bu cümle amacı YAPIYOR mu.", "Notta olmayan bilgi içeren seçeneği ele.", "Amacın istediğinden başka şeyi vurgulayan seçeneği ele."]}, "families": ["Amacı karşılamıyor", "Tek not sentez yok", "Notta olmayan bilgi", "Yanlış vurgu"], "fam_short": {"Amacı karşılamıyor": "Amaç dışı", "Tek not sentez yok": "Sentez yok", "Notta olmayan bilgi": "Notta yok", "Yanlış vurgu": "Yanlış vurgu"}, "main_ids": ["u3-l2-f1-01", "u3-l2-f2-01", "u3-l2-f3-01", "u3-l2-f4-01"], "questions": [{"id": "u3-l2-f1-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Aral Sea was once the fourth-largest lake in the world.\n- By 2010 it had shrunk to a tenth of its original size.\n- Rivers feeding it were diverted for cotton farming.\n- The exposed seabed became a source of toxic dust storms.", "stem": "The student wants to emphasize the scale of the Aral Sea's shrinkage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Once the world's fourth-largest lake, the Aral Sea had shrunk to just a tenth of its original size by 2010.", "B": "The rivers that once fed the Aral Sea were diverted to irrigate cotton farms.", "C": "The exposed seabed of the Aral Sea became a source of toxic dust storms.", "D": "The Aral Sea was once the fourth-largest lake in the world."}, "correct": "A", "choice_families": {"B": "Amacı karşılamıyor", "C": "Amacı karşılamıyor", "D": "Tek not sentez yok"}, "why_correct": "The goal is to emphasize the scale of shrinkage; A pairs the original rank with the tenth-size figure, showing the magnitude.", "why_wrong": {"B": "This gives a cause of the shrinkage, accurate but not a statement of its scale.", "C": "This names a consequence, not the scale of the shrinkage.", "D": "This states only the original size and never shows how much it shrank."}}, {"id": "u3-l2-f1-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- Bioluminescence is the production of light by living organisms.\n- Many deep-sea fish use it to attract prey.\n- Fireflies use it to attract mates.\n- Some fungi glow to attract insects that spread their spores.", "stem": "The student wants to illustrate the variety of purposes bioluminescence serves. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bioluminescence is the production of light by living organisms.", "B": "Organisms use bioluminescence for different ends: deep-sea fish lure prey, fireflies attract mates, and some fungi draw spore-spreading insects.", "C": "Many deep-sea fish use bioluminescence to attract prey.", "D": "Bioluminescence can be found in fish, insects, and fungi alike."}, "correct": "B", "choice_families": {"C": "Tek not sentez yok", "D": "Yanlış vurgu", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is to show the variety of purposes; A lists three distinct purposes across three organisms.", "why_wrong": {"C": "This gives a single purpose in a single organism, not the variety.", "D": "This emphasizes the range of organisms, not the range of purposes the goal asks for.", "A": "This only defines the term and names no purpose at all."}}, {"id": "u3-l2-f1-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- The printing press was introduced to Europe around 1450.\n- Before it, books were copied by hand, slowly and at great cost.\n- After it, the number of books in Europe rose enormously within decades.\n- Literacy rates began to climb in the following century.", "stem": "The student wants to highlight how quickly the press changed book production. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The printing press was introduced to Europe around 1450.", "B": "Literacy rates in Europe began to climb in the century after the press appeared.", "C": "Where books had once been copied slowly by hand, their numbers rose enormously within decades of the press's arrival.", "D": "Before the printing press, books were copied by hand, slowly and at great cost."}, "correct": "C", "choice_families": {"B": "Amacı karşılamıyor", "D": "Tek not sentez yok", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is to show the speed of change in book production; A contrasts slow hand-copying with the rapid rise in books after the press.", "why_wrong": {"B": "This concerns literacy, a later effect, not the speed of change in book production.", "D": "This describes only the earlier state without showing how quickly it changed.", "A": "This gives only a date and shows no change."}}, {"id": "u3-l2-f1-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- Honeybees communicate the location of food through a 'waggle dance.'\n- The angle of the dance signals the direction of the food.\n- The duration of the dance signals the distance.\n- Other bees follow the directions to reach the source.", "stem": "The student wants to explain how the waggle dance conveys specific information. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The waggle dance is one of the most studied behaviors in the insect world.", "B": "Honeybees communicate the location of food through a movement called the waggle dance.", "C": "Other bees follow the waggle dance's directions to reach the food source.", "D": "In the waggle dance, the angle signals the food's direction and the duration signals its distance."}, "correct": "D", "choice_families": {"B": "Amacı karşılamıyor", "C": "Amacı karşılamıyor", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is to explain how specific information is conveyed; A names both variables (angle to direction, duration to distance).", "why_wrong": {"B": "This states that the dance communicates location but not how the information is encoded.", "C": "This describes what other bees do, not how the dance conveys information.", "A": "This claim about how studied the dance is appears nowhere in the notes."}}, {"id": "u3-l2-f1-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Great Barrier Reef stretches over 2,300 kilometers.\n- It is home to more than 1,500 species of fish.\n- It can be seen from space.\n- It supports around 400 species of coral.", "stem": "The student wants to emphasize the reef's biological richness. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Great Barrier Reef supports more than 1,500 species of fish and around 400 species of coral.", "B": "The Great Barrier Reef stretches over 2,300 kilometers and can be seen from space.", "C": "The Great Barrier Reef can be seen from space.", "D": "The Great Barrier Reef stretches over 2,300 kilometers."}, "correct": "A", "choice_families": {"B": "Yanlış vurgu", "C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor"}, "why_correct": "The goal is biological richness; A combines the fish and coral species counts, both measures of life.", "why_wrong": {"B": "This emphasizes size and visibility, not biological richness.", "C": "This concerns visibility from space, unrelated to biological richness.", "D": "This concerns length, a measure of size rather than richness."}}, {"id": "u3-l2-f1-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- Venus is the second planet from the Sun.\n- Its surface temperature averages about 465 degrees Celsius.\n- A thick carbon-dioxide atmosphere traps heat.\n- It is hotter than Mercury, which is closer to the Sun.", "stem": "The student wants to explain why Venus is so hot despite not being the closest planet to the Sun. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Venus is the second planet from the Sun and averages about 465 degrees Celsius.", "B": "Though Mercury sits closer to the Sun, Venus is hotter because its thick carbon-dioxide atmosphere traps heat.", "C": "Venus is the second planet from the Sun.", "D": "Venus has a thick atmosphere made largely of carbon dioxide."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Tek not sentez yok", "A": "Amacı karşılamıyor"}, "why_correct": "The goal asks why Venus is hot despite not being closest; A links the trapped heat to being hotter than closer Mercury.", "why_wrong": {"C": "This gives only its position and no explanation.", "D": "This names the atmosphere but does not connect it to the puzzle of Venus being hotter than Mercury.", "A": "This states the temperature but never explains why, nor addresses the Mercury comparison."}}, {"id": "u3-l2-f1-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- Jane Goodall began studying chimpanzees in Tanzania in 1960.\n- She observed them using stripped twigs to fish termites from mounds.\n- This was the first record of tool use by nonhuman animals.\n- The finding forced scientists to rethink the definition of humans as the only toolmakers.", "stem": "The student wants to explain the significance of Goodall's observation for science. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Goodall observed chimpanzees using stripped twigs to fish termites from mounds.", "B": "Jane Goodall began studying chimpanzees in Tanzania in 1960.", "C": "Goodall's record of chimpanzees fishing for termites with twigs was the first evidence of animal tool use, forcing science to rethink humans as the only toolmakers.", "D": "Goodall spent many years living among the chimpanzees she studied."}, "correct": "C", "choice_families": {"B": "Amacı karşılamıyor", "D": "Notta olmayan bilgi", "A": "Tek not sentez yok"}, "why_correct": "The goal is the significance for science; A links the observation to its status as a first and to the rethinking it forced.", "why_wrong": {"B": "This gives only when she started, not the significance.", "D": "How long she lived among them appears nowhere in the notes.", "A": "This describes the observation alone without stating why it mattered."}}, {"id": "u3-l2-f1-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Dead Sea has a salt content of about 34 percent.\n- Ordinary seawater is about 3.5 percent salt.\n- The high salinity makes swimmers float easily.\n- Almost no fish or plants can survive in it.", "stem": "The student wants to emphasize how much saltier the Dead Sea is than ordinary seawater. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Dead Sea has a salt content of about 34 percent.", "B": "The Dead Sea's high salinity makes swimmers float easily on its surface.", "C": "Almost no fish or plants can survive in the Dead Sea.", "D": "At about 34 percent salt, the Dead Sea is nearly ten times as salty as ordinary seawater, which is around 3.5 percent."}, "correct": "D", "choice_families": {"B": "Amacı karşılamıyor", "C": "Amacı karşılamıyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is a comparison of saltiness; A puts the two figures side by side to show the gap.", "why_wrong": {"B": "This names an effect of the salinity, not the comparison.", "C": "This names another effect, not how much saltier the Dead Sea is.", "A": "This gives only the Dead Sea's figure with nothing to compare it to."}}, {"id": "u3-l2-f1-09", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Wright brothers made their first powered flight in 1903.\n- The flight lasted 12 seconds and covered 37 meters.\n- Within two years they were flying for over half an hour.\n- By 1908 they were demonstrating flights in Europe.", "stem": "The student wants to highlight how rapidly the brothers' flights improved. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "From a first flight of just 12 seconds in 1903, the Wrights were flying for over half an hour within two years.", "B": "By 1908 the Wright brothers were demonstrating their flights in Europe.", "C": "The Wright brothers made their first powered flight in 1903.", "D": "The Wright brothers' first flight lasted 12 seconds and covered 37 meters."}, "correct": "A", "choice_families": {"B": "Amacı karşılamıyor", "C": "Amacı karşılamıyor", "D": "Tek not sentez yok"}, "why_correct": "The goal is the speed of improvement; A contrasts the 12-second first flight with half-hour flights two years later.", "why_wrong": {"B": "This notes the European demonstrations but shows no improvement over time.", "C": "This gives only the starting date.", "D": "This describes only the first flight without showing progress."}}, {"id": "u3-l2-f1-10", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amacı karşılamıyor", "passage": "While researching a topic, a student took the following notes:\n\n- Octopuses have three hearts.\n- Two pump blood through the gills; one pumps it through the body.\n- Their blood is blue because it uses copper to carry oxygen.\n- They can change color in a fraction of a second.", "stem": "The student wants to explain how the octopus's circulatory system works. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "An octopus's blood is blue because it uses copper to carry oxygen.", "B": "An octopus has three hearts: two pump blood through the gills while the third pumps it through the body.", "C": "Octopuses can change color in a fraction of a second.", "D": "An octopus has three hearts."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Tek not sentez yok", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is how the circulatory system works; A explains the role of each of the three hearts.", "why_wrong": {"C": "This concerns color change, unrelated to circulation.", "D": "This states the number of hearts but not how they function.", "A": "This concerns blood color and chemistry, not how the system pumps."}}, {"id": "u3-l2-f2-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- The violin is played with a bow drawn across its strings.\n- The guitar is usually played by plucking its strings with the fingers.\n- Both instruments produce sound from vibrating strings.\n- Both are common in many kinds of music.", "stem": "The student wants to compare how the two instruments are played. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The violin is played with a bow drawn across its strings.", "B": "While the violin is played with a bow drawn across its strings, the guitar is usually plucked with the fingers.", "C": "Both the violin and the guitar are common in many kinds of music.", "D": "Both instruments produce sound from vibrating strings."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to compare how the two are played; A sets the bowing of the violin against the plucking of the guitar.", "why_wrong": {"C": "This notes a shared trait but not how they are played.", "D": "This notes another shared trait rather than contrasting playing methods.", "A": "This describes only the violin, so it makes no comparison."}}, {"id": "u3-l2-f2-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Arabica coffee beans have a mild, sweet flavor.\n- Robusta beans have a stronger, more bitter taste.\n- Arabica contains less caffeine than Robusta.\n- Both are grown in tropical regions.", "stem": "The student wants to contrast the flavor of the two bean types. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Both Arabica and Robusta are grown in tropical regions.", "B": "Arabica coffee beans have a mild, sweet flavor.", "C": "Arabica beans have a mild, sweet flavor, whereas Robusta beans taste stronger and more bitter.", "D": "Arabica contains less caffeine than Robusta."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Yanlış vurgu", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is to contrast flavor; A puts the mild Arabica against the bitter Robusta.", "why_wrong": {"B": "This gives only the Arabica flavor, with nothing to contrast.", "D": "This contrasts caffeine content rather than flavor, which the goal specifies.", "A": "This notes where they grow, not their flavor."}}, {"id": "u3-l2-f2-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Sharks have skeletons made entirely of cartilage.\n- Most other fish have skeletons made of bone.\n- Cartilage is lighter and more flexible than bone.\n- Sharks have existed for over 400 million years.", "stem": "The student wants to compare shark skeletons with those of most other fish. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Cartilage is lighter and more flexible than bone.", "B": "Sharks have skeletons made entirely of cartilage.", "C": "Sharks have existed for over 400 million years.", "D": "Unlike most fish, whose skeletons are made of bone, sharks have skeletons made entirely of cartilage."}, "correct": "D", "choice_families": {"B": "Tek not sentez yok", "C": "Amacı karşılamıyor", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is a comparison of skeletons; A sets shark cartilage against the bone of most fish.", "why_wrong": {"B": "This describes only sharks, so no comparison is drawn.", "C": "This concerns their age, not their skeletons.", "A": "This describes cartilage in general without comparing the two groups of fish."}}, {"id": "u3-l2-f2-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Renewable energy sources such as solar do not run out.\n- Fossil fuels are finite and will eventually be depleted.\n- Solar power produces no carbon emissions when generating electricity.\n- Both are used to generate electricity worldwide.", "stem": "The student wants to contrast the supply of renewable energy with that of fossil fuels. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Renewable sources such as solar do not run out, while fossil fuels are finite and will eventually be depleted.", "B": "Renewable energy sources such as solar do not run out.", "C": "Both renewables and fossil fuels are used to generate electricity worldwide.", "D": "Solar power produces no carbon emissions when generating electricity."}, "correct": "A", "choice_families": {"B": "Tek not sentez yok", "C": "Amacı karşılamıyor", "D": "Yanlış vurgu"}, "why_correct": "The goal is to contrast supply; A sets the inexhaustible renewables against the finite fossil fuels.", "why_wrong": {"B": "This describes only renewables, so no contrast is made.", "C": "This notes a shared use rather than a contrast in supply.", "D": "This emphasizes emissions rather than supply, which the goal specifies."}}, {"id": "u3-l2-f2-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- The marathon covers 42.2 kilometers.\n- The sprint events cover 100, 200, and 400 meters.\n- Marathon runners pace themselves over hours.\n- Sprinters run at maximum effort for seconds.", "stem": "The student wants to contrast the demands of marathon running and sprinting. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Marathon runners pace themselves over hours.", "B": "Marathon runners pace themselves over hours, whereas sprinters run at maximum effort for only seconds.", "C": "The marathon covers 42.2 kilometers.", "D": "Sprint events cover distances of 100, 200, and 400 meters."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to contrast the demands; A sets the paced hours of the marathon against the seconds of maximum sprinting.", "why_wrong": {"C": "This gives only the marathon distance.", "D": "This gives only the sprint distances without contrasting the demands.", "A": "This describes only the marathon, so no contrast is drawn."}}, {"id": "u3-l2-f2-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Watercolor paints are transparent and blend softly.\n- Oil paints are opaque and can be layered thickly.\n- Watercolor dries within minutes.\n- Oil paint can take days or weeks to dry.", "stem": "The student wants to contrast the drying times of the two paints. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Watercolor paints are transparent and blend softly.", "B": "Watercolor dries within minutes.", "C": "Watercolor dries within minutes, while oil paint can take days or even weeks.", "D": "Oil paints are opaque and can be layered thickly."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Yanlış vurgu", "A": "Yanlış vurgu"}, "why_correct": "The goal is to contrast drying times; A sets the minutes of watercolor against the days or weeks of oil.", "why_wrong": {"B": "This gives only watercolor's drying time, with nothing to contrast.", "D": "This describes oil's texture, not its drying time.", "A": "This contrasts transparency, not drying time."}}, {"id": "u3-l2-f2-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Alligators have broad, rounded snouts.\n- Crocodiles have narrower, more pointed snouts.\n- Alligators are usually found in freshwater.\n- Crocodiles can tolerate saltwater.", "stem": "The student wants to compare the snouts of alligators and crocodiles. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Crocodiles can tolerate saltwater.", "B": "Alligators have broad, rounded snouts.", "C": "Alligators are usually found in freshwater.", "D": "Alligators have broad, rounded snouts, while crocodiles have narrower, more pointed ones."}, "correct": "D", "choice_families": {"B": "Tek not sentez yok", "C": "Amacı karşılamıyor", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is to compare snouts; A sets the rounded alligator snout against the pointed crocodile snout.", "why_wrong": {"B": "This describes only the alligator, so no comparison is made.", "C": "This concerns habitat, not snouts.", "A": "This concerns saltwater tolerance, not snouts."}}, {"id": "u3-l2-f2-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Paperback books are cheaper and lighter to carry.\n- Hardcover books are more durable and long-lasting.\n- Paperbacks are printed on thinner paper.\n- Hardcovers usually appear first when a book is released.", "stem": "The student wants to contrast the durability of paperbacks and hardcovers. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Paperbacks are lighter but less durable, whereas hardcovers are sturdier and last longer.", "B": "Paperback books are cheaper and lighter to carry.", "C": "Hardcovers usually appear first when a book is released.", "D": "Paperbacks are printed on thinner paper than hardcovers."}, "correct": "A", "choice_families": {"B": "Yanlış vurgu", "C": "Amacı karşılamıyor", "D": "Yanlış vurgu"}, "why_correct": "The goal is to contrast durability; A sets the less durable paperback against the sturdier hardcover.", "why_wrong": {"B": "This emphasizes cost and weight rather than durability.", "C": "This concerns release timing, not durability.", "D": "This emphasizes paper thickness, not durability directly."}}, {"id": "u3-l2-f2-09", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Bactrian camels have two humps.\n- Dromedary camels have a single hump.\n- Bactrian camels live in the cold deserts of Central Asia.\n- Dromedaries live in the hot deserts of the Middle East and Africa.", "stem": "The student wants to compare the number of humps on the two camel types. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bactrian camels have two humps.", "B": "Bactrian camels have two humps, while dromedaries have only one.", "C": "Dromedaries live in the hot deserts of the Middle East and Africa.", "D": "Bactrian camels live in the cold deserts of Central Asia."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to compare hump number; A sets the two humps of the Bactrian against the single hump of the dromedary.", "why_wrong": {"C": "This concerns the dromedary's habitat, not humps.", "D": "This concerns the Bactrian's habitat, not humps.", "A": "This describes only the Bactrian, so no comparison is made."}}, {"id": "u3-l2-f2-10", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Digital clocks display the time as numbers.\n- Analog clocks show the time with moving hands on a dial.\n- Digital clocks are easy to read at a glance.\n- Analog clocks help show how much time remains until an hour.", "stem": "The student wants to contrast how the two clock types display the time. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Digital clocks are easy to read at a glance.", "B": "Digital clocks display the time as numbers.", "C": "Digital clocks display the time as numbers, whereas analog clocks show it with hands moving around a dial.", "D": "Analog clocks help show how much time remains until the hour."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Amacı karşılamıyor", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is to contrast how time is displayed; A sets the numbers of digital clocks against the moving hands of analog ones.", "why_wrong": {"B": "This describes only digital clocks, so no contrast is drawn.", "D": "This concerns a use of analog clocks, not how they display time.", "A": "This concerns ease of reading, not how time is displayed."}}, {"id": "u3-l2-f3-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Colosseum in Rome was completed around 80 CE.\n- It could hold an estimated 50,000 spectators.\n
