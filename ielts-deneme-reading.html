<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading | Gri English</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#1a2a28">
  <link rel="stylesheet" href="assets/main.css">
  <style>
    body { background: #fafaf7; margin: 0; }

    .timer-bar { position: sticky; top: 0; z-index: 99; background: #1a2a28; color: #fff; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    .timer-bar .timer { font-family: Georgia, serif; font-size: 1.05rem; flex: 1; }
    .timer-bar .timer strong { font-family: monospace; font-size: 1.25rem; margin-left: 0.4rem; }
    .timer-bar .timer.warning strong { color: #ff9090; }
    .timer-bar .timer.paused strong { color: #aaa; }
    .timer-toggle-btn { border: none; padding: 0.55rem 1.3rem; font-weight: 600; cursor: pointer; border-radius: 2px; font-family: inherit; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; }
    .timer-toggle-btn.start { background: #2c8a4d; }
    .timer-toggle-btn.start:hover { background: #34a05a; }
    .timer-toggle-btn.stop { background: #b33a3a; }
    .timer-toggle-btn.stop:hover { background: #c34646; }
    .timer-bar .submit-btn { background: var(--accent, #c89a3c); color: #fff; border: none; padding: 0.6rem 1.4rem; font-weight: 600; cursor: pointer; border-radius: 2px; }
    .timer-bar .submit-btn:hover { background: #d4a649; }

    .tab-bar { position: sticky; top: 56px; z-index: 98; background: #fff; border-bottom: 1px solid #d8d2c4; display: flex; overflow-x: auto; }
    .tab-btn { background: transparent; border: none; padding: 1rem 1.5rem; cursor: pointer; font-family: Georgia, serif; font-size: 1rem; color: #555; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 0.5rem; }
    .tab-btn:hover { color: #1a2a28; background: #fafaf7; }
    .tab-btn.active { color: #1a2a28; border-bottom-color: var(--accent, #c89a3c); font-weight: 700; }
    .tab-btn .tab-progress { font-size: 0.75rem; background: #f0ede5; color: #555; padding: 0.15rem 0.5rem; border-radius: 10px; font-family: monospace; }
    .tab-btn.active .tab-progress { background: var(--accent, #c89a3c); color: #fff; }
    .tab-btn.completed .tab-progress { background: #4a7a4a; color: #fff; }

    .passage-section { display: none; }
    .passage-section.active { display: block; }

    .passage-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: calc(100vh - 110px);
    }
    @media (max-width: 800px) {
      .passage-wrapper { grid-template-columns: 1fr; height: auto; }
    }
    .passage-left, .passage-right {
      overflow-y: auto;
      padding: 2rem 2.5rem;
      background: #fff;
      max-height: 100%;
    }
    .passage-left { border-right: 1px solid #d8d2c4; }
    @media (max-width: 800px) {
      .passage-left { border-right: none; border-bottom: 1px solid #d8d2c4; max-height: 50vh; }
      .passage-right { max-height: none; }
    }

    .passage-title {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      margin: 0 0 1rem;
      color: #1a2a28;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent, #c89a3c);
    }
    .passage-content { font-size: 1rem; line-height: 1.7; color: #2a2a2a; }
    .passage-content p { margin: 0.85rem 0; }
    .passage-content strong { color: #1a2a28; }

    .question-group { margin-bottom: 2.5rem; padding-top: 1rem; border-top: 1px dashed #ddd; }
    .question-group:first-of-type { border-top: none; padding-top: 0; }
    .group-header .q-range { font-family: Georgia, serif; font-size: 1.15rem; font-weight: 700; color: #1a2a28; margin-bottom: 0.4rem; }
    .group-header .instructions { font-style: italic; color: #555; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; }

    .q-num-prefix { display: inline-block; background: #1a2a28; color: #fff; padding: 0.15rem 0.5rem; border-radius: 3px; font-weight: 700; font-size: 0.85rem; margin-right: 0.4rem; min-width: 28px; text-align: center; }

    /* Matching (dropdown) */
    .match-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0.6rem 0;
      padding: 0.6rem 0.75rem;
      background: #fafaf7;
      border-left: 3px solid #d8d2c4;
    }
    .match-item .match-text { flex: 1; line-height: 1.4; font-size: 0.95rem; }
    .match-item select {
      border: 2px solid #1a2a28;
      background: #fff;
      padding: 0.35rem 0.5rem;
      font-size: 0.95rem;
      font-family: inherit;
      border-radius: 2px;
      min-width: 110px;
      cursor: pointer;
    }
    .match-item select.answered { background: #f0f5f0; }
    .match-item select:focus { outline: none; border-color: var(--accent, #c89a3c); }

    /* Sentence completion */
    .sentence-q { margin: 0.85rem 0; line-height: 1.9; font-size: 0.95rem; }
    .q-input { border: none; border-bottom: 2px solid #1a2a28; background: transparent; padding: 0.25rem 0.5rem; font-size: 1rem; font-family: inherit; min-width: 140px; }
    .q-input:focus { outline: none; border-bottom-color: var(--accent, #c89a3c); background: #fffae5; }
    .q-input.answered { background: #f0f5f0; }

    /* MCQ */
    .mcq-question { margin: 1.25rem 0; padding: 0.85rem 1rem; background: #fafaf7; border-left: 3px solid #d8d2c4; }
    .mcq-question .q-stem { font-weight: 600; margin-bottom: 0.6rem; line-height: 1.5; font-size: 0.95rem; }
    .mcq-options { list-style: none; padding: 0; margin: 0; }
    .mcq-options li { margin: 0.3rem 0; }
    .mcq-options label { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.35rem 0.6rem; cursor: pointer; border-radius: 3px; font-size: 0.95rem; }
    .mcq-options label:hover { background: #fff; }
    .mcq-options input { margin-top: 0.2rem; cursor: pointer; }
    .mcq-options .opt-letter { font-weight: 700; color: #1a2a28; min-width: 1.1rem; }

    /* Next passage button */
    .next-part-btn { display: block; margin: 2rem 0 1rem; background: #fff; border: 1px solid #1a2a28; color: #1a2a28; padding: 0.8rem 1.5rem; font-weight: 600; cursor: pointer; width: 100%; text-align: center; font-size: 0.95rem; border-radius: 2px; }
    .next-part-btn:hover { background: #1a2a28; color: #fff; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; padding: 2rem; max-width: 480px; width: 90%; border-radius: 4px; }
    .modal h3 { font-family: Georgia, serif; margin-top: 0; color: #1a2a28; }
    .modal p { color: #555; line-height: 1.5; }
    .modal .btn-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .modal button { flex: 1; padding: 0.7rem; border: none; border-radius: 2px; font-weight: 600; cursor: pointer; }
    .modal .btn-cancel { background: #f0ede5; color: #444; }
    .modal .btn-confirm { background: #1a2a28; color: #fff; }

    /* Start screen */
    .start-screen { background: #fff; max-width: 600px; margin: 4rem auto; padding: 3rem 2rem; border: 1px solid #d8d2c4; text-align: center; }
    .start-screen h1 { font-family: Georgia, serif; color: #1a2a28; }
    .start-screen .meta { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    .start-screen ul { text-align: left; max-width: 380px; margin: 1.5rem auto; color: #555; line-height: 1.8; }
    .start-screen .start-btn { background: #1a2a28; color: #fff; border: none; padding: 0.9rem 2.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 2px; }

    .loading { text-align: center; padding: 4rem 2rem; color: #888; }
  </style>

</head>

  <div id="loading" class="loading">Yükleniyor…</div>

  <div id="startScreen" style="display:none;">
    <div class="start-screen">
      <div class="meta" id="startTestName">—</div>
      <h1>Reading</h1>
      <p style="color:#555;">3 passage, 40 soru, 60 dakika. Her passage kendi sekmesinde. Solda metin, sağda sorular.</p>
      <ul>
        <li>Cevapların otomatik kaydedilir</li>
        <li>Süre dolunca otomatik gönderim yok</li>
        <li>Sayfa yenilenirse kaldığın yerden devam edersin</li>
      </ul>
      <button class="start-btn" id="startBtn">Sınava Başla</button>
    </div>
  </div>

  <div id="testContainer" style="display:none;">
    <div class="timer-bar">
      <div class="timer" id="timerDisplay">Süre: <strong>60:00</strong></div>
      <button class="timer-toggle-btn start" id="timerToggleBtn">Başlat</button>
      <button class="submit-btn" id="submitBtn">Bitir</button>
    </div>

    <div class="tab-bar" id="tabBar"></div>

    <div id="passagesContainer"></div>
  </div>

  <div class="modal-overlay" id="submitModal">
    <div class="modal">
      <h3>Sınavı bitirmek istediğine emin misin?</h3>
      <p id="submitModalText">—</p>
      <div class="btn-row">
        <button class="btn-cancel" onclick="document.getElementById('submitModal').classList.remove('show')">Devam et</button>
        <button class="btn-confirm" id="confirmSubmit">Bitir ve Gönder</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vazbvbqgvtlaqkytfsbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g';
    const params = new URLSearchParams(window.location.search);
    const TEST_SLUG = params.get('test') || 'ielts-mock-1';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = {
      test: null, section: null, parts: [], answers: {},
      startedAt: null, duration: 60 * 60, user: null,
      timerInterval: null, finished: false, currentPart: 1,
      // Timer kontrolü
      timerStartedAt: null,
      timerElapsed: 0,
      timerRunning: false,
    };

    async function loadTest() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.href = 'giris.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
      state.user = user;

      const { data: test } = await sb.from('ielts_tests').select('*').eq('slug', TEST_SLUG).eq('is_published', true).maybeSingle();
      if (!test) { document.getElementById('loading').textContent = 'Test bulunamadı.'; return; }
      state.test = test;

      const { data: section } = await sb.from('ielts_sections').select('*').eq('test_id', test.id).eq('section', 'reading').single();
      state.section = section;
      state.duration = (section.duration_minutes || 60) * 60;

      const { data: parts } = await sb.from('ielts_parts').select('*, question_groups:ielts_question_groups(*, questions:ielts_questions(*))').eq('section_id', section.id).order('part_number');
      parts.forEach(p => {
        p.question_groups.sort((a, b) => a.group_order - b.group_order);
        p.question_groups.forEach(g => g.questions.sort((a, b) => a.question_number - b.question_number));
      });
      state.parts = parts;

      const stored = localStorage.getItem('ielts_reading_' + TEST_SLUG);
      if (stored) {
        try {
          const p = JSON.parse(stored);
          if (p.answers) state.answers = p.answers;
          if (p.startedAt) state.startedAt = p.startedAt;
          if (p.currentPart) state.currentPart = p.currentPart;
          if (p.timerStartedAt) state.timerStartedAt = p.timerStartedAt;
          if (typeof p.timerElapsed === 'number') state.timerElapsed = p.timerElapsed;
          if (typeof p.timerRunning === 'boolean') state.timerRunning = p.timerRunning;
        } catch (e) {}
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('startTestName').textContent = test.name;
      if (state.startedAt) startTest();
      else document.getElementById('startScreen').style.display = 'block';
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      state.startedAt = Date.now();
      saveLocal();
      startTest();
    });

    function startTest() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('testContainer').style.display = 'block';
      renderPassages();
      setupTimer();
      buildTabs();
      setActivePart(state.currentPart);
    }

    function buildTabs() {
      const tb = document.getElementById('tabBar');
      let h = '';
      for (const p of state.parts) {
        const total = countQuestionsInPart(p);
        h += `<button class="tab-btn" data-part="${p.part_number}"><span>Passage ${p.part_number}</span><span class="tab-progress" id="tab-progress-${p.part_number}">0/${total}</span></button>`;
      }
      tb.innerHTML = h;
      tb.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => setActivePart(parseInt(b.dataset.part))));
    }

    function setActivePart(n) {
      state.currentPart = n;
      saveLocal();
      document.querySelectorAll('.passage-section').forEach(el => el.classList.toggle('active', el.dataset.partNumber == n));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.part == n));
      window.scrollTo(0, 0);
    }

    function countQuestionsInPart(p) {
      let c = 0;
      for (const g of p.question_groups) c += g.end_question_number - g.start_question_number + 1;
      return c;
    }

    function countAnsweredInPart(p) {
      let c = 0;
      for (const g of p.question_groups) {
        if (g.question_type === 'mcq_multi') {
          if (isPerQuestionMcqMulti(g)) {
            for (const q of g.questions) {
              if (state.answers[q.question_number] != null && (Array.isArray(state.answers[q.question_number]) ? state.answers[q.question_number].length : true)) c++;
            }
          } else {
            const u = state.answers[g.start_question_number];
            if (u && Array.isArray(u)) c += Math.min(u.length, g.end_question_number - g.start_question_number + 1);
          }
        } else if (g.question_type === 'multi_select_pool') {
          const u = state.answers[g.start_question_number];
          if (u && Array.isArray(u)) c += Math.min(u.length, g.end_question_number - g.start_question_number + 1);
        } else {
          for (let n = g.start_question_number; n <= g.end_question_number; n++) {
            if (state.answers[n] != null && state.answers[n] !== '') c++;
          }
        }
      }
      return c;
    }

    function updateTabProgress() {
      for (const p of state.parts) {
        const a = countAnsweredInPart(p);
        const t = countQuestionsInPart(p);
        const el = document.getElementById('tab-progress-' + p.part_number);
        if (el) el.textContent = a + '/' + t;
        const btn = document.querySelector(`.tab-btn[data-part="${p.part_number}"]`);
        if (btn) btn.classList.toggle('completed', a === t);
      }
    }

    function isPerQuestionMcqMulti(group) {
      if (group.questions.length <= 1) return false;
      const first = JSON.stringify(group.questions[0].options || []);
      return group.questions.some((q, i) => i > 0 && JSON.stringify(q.options || []) !== first);
    }

    function renderPassages() {
      const c = document.getElementById('passagesContainer');
      c.innerHTML = '';
      for (const part of state.parts) {
        const sec = document.createElement('section');
        sec.className = 'passage-section';
        sec.dataset.partNumber = part.part_number;
        sec.innerHTML = `
          <div class="passage-wrapper">
            <div class="passage-left">
              <h2 class="passage-title">Passage ${part.part_number}${part.title ? ' — ' + escapeHtml(part.title) : ''}</h2>
              <div class="passage-content">${part.passage_html || ''}</div>
            </div>
            <div class="passage-right">
              ${part.question_groups.map(g => renderGroup(g)).join('')}
              ${part.part_number < state.parts.length ? `<button class="next-part-btn" onclick="setActivePart(${part.part_number + 1})">Passage ${part.part_number + 1}'e Geç →</button>` : ''}
            </div>
          </div>`;
        c.appendChild(sec);
      }

      c.querySelectorAll('input.q-input, input[type="radio"], input[type="checkbox"], select').forEach(el => {
        el.addEventListener('change', handleAnswerChange);
        if (el.type === 'text') el.addEventListener('input', handleAnswerChange);
      });

      restoreAnswers();
    }

    function renderGroup(g) {
      const range = g.start_question_number === g.end_question_number ? `Question ${g.start_question_number}` : `Questions ${g.start_question_number}–${g.end_question_number}`;
      let h = `<div class="question-group"><div class="group-header"><div class="q-range">${range}</div><div class="instructions">${escapeHtml(g.instructions)}</div></div>`;
      switch (g.question_type) {
        case 'paragraph_matching':
        case 'heading_matching':
          h += renderParagraphMatching(g); break;
        case 'sentence_completion':
          h += renderSentence(g); break;
        case 'tfng':
          h += renderTfng(g); break;
        case 'multi_select_pool':
          h += renderMultiSelectPool(g); break;
        case 'mcq_multi':
          h += isPerQuestionMcqMulti(g) ? renderMcqMultiPerQ(g) : renderMcqMultiGroup(g); break;
        case 'mcq_single':
          h += renderMcqSingle(g); break;
        default:
          h += `<p style="color:#c63838;">Bilinmeyen tip: ${g.question_type}</p>`;
      }
      return h + `</div>`;
    }

    function renderParagraphMatching(g) {
      const sc = g.shared_content || {};
      const labels = sc.paragraph_labels || ['A','B','C','D','E','F','G','H'];
      let h = '';
      for (const q of g.questions) {
        const opts = labels.map(l => `<option value="${l}">${l}</option>`).join('');
        h += `<div class="match-item">
                <span class="q-num-prefix">${q.question_number}</span>
                <span class="match-text">${escapeHtml(q.stem)}</span>
                <select data-q="${q.question_number}" data-mode="dropdown">
                  <option value="">— Seç —</option>
                  ${opts}
                </select>
              </div>`;
      }
      return h;
    }

    function renderTfng(g) {
      let h = '';
      for (const q of g.questions) {
        h += `<div class="match-item">
                <span class="q-num-prefix">${q.question_number}</span>
                <span class="match-text">${escapeHtml(q.stem)}</span>
                <select data-q="${q.question_number}" data-mode="dropdown">
                  <option value="">— Seç —</option>
                  <option value="TRUE">TRUE</option>
                  <option value="FALSE">FALSE</option>
                  <option value="NOT GIVEN">NOT GIVEN</option>
                </select>
              </div>`;
      }
      return h;
    }

    function renderSentence(g) {
      let h = '';
      for (const q of g.questions) {
        const s = escapeHtml(q.stem || '');
        const inp = `<input type="text" class="q-input" data-q="${q.question_number}" autocomplete="off">`;
        const stemHtml = s.includes('___') ? s.replace('___', inp) : s + ' ' + inp;
        h += `<div class="sentence-q"><span class="q-num-prefix">${q.question_number}</span>${stemHtml}</div>`;
      }
      return h;
    }

    function renderMultiSelectPool(g) {
      const sc = g.shared_content || {};
      const opts = sc.options || [];
      const span = g.end_question_number - g.start_question_number + 1;
      let h = `<div class="mcq-question">
                <div class="q-stem">
                  <span class="q-num-prefix">${g.start_question_number}–${g.end_question_number}</span>
                  <span style="font-style:italic;color:#888;font-weight:normal;font-size:0.85rem;">(${span} adet doğru cevap seç, sıra önemli değil)</span>
                </div>
                <ul class="mcq-options">`;
      for (const o of opts) {
        h += `<li><label><input type="checkbox" name="pool${g.id}" value="${o.letter}" data-q="${g.start_question_number}" data-mode="pool" data-max="${span}" data-group="${g.id}"><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span></label></li>`;
      }
      return h + `</ul></div>`;
    }

    function renderMcqMultiGroup(g) {
      const span = g.end_question_number - g.start_question_number + 1;
      const q = g.questions[0];
      const cc = Array.isArray(q.correct_answer) ? q.correct_answer.length : span;
      const max = span === 1 ? cc : span;
      const inst = span > 1 ? `${span} cevap seç` : `${cc} cevap seç`;
      const range = g.start_question_number === g.end_question_number ? g.start_question_number : g.start_question_number + '–' + g.end_question_number;
      let h = `<div class="mcq-question"><div class="q-stem"><span class="q-num-prefix">${range}</span>${escapeHtml(q.stem || '')}<div style="margin-top:0.4rem;font-style:italic;font-size:0.8rem;color:#888;">(${inst})</div></div><ul class="mcq-options">`;
      for (const o of (q.options || [])) {
        h += `<li><label><input type="checkbox" name="g${g.id}" value="${o.letter}" data-group="${g.id}" data-q="${g.start_question_number}" data-mode="multi" data-max="${max}"><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span></label></li>`;
      }
      return h + `</ul></div>`;
    }

    function renderMcqMultiPerQ(g) {
      let h = '';
      for (const q of g.questions) {
        h += `<div class="mcq-question"><div class="q-stem"><span class="q-num-prefix">${q.question_number}</span>${escapeHtml(q.stem)}<div style="margin-top:0.4rem;font-style:italic;font-size:0.8rem;color:#888;">(Bir veya birden fazla cevap olabilir)</div></div><ul class="mcq-options">`;
        for (const o of (q.options || [])) {
          h += `<li><label><input type="checkbox" name="pq${q.question_number}" value="${o.letter}" data-q="${q.question_number}" data-mode="multi-perq"><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span></label></li>`;
        }
        h += `</ul></div>`;
      }
      return h;
    }

    function renderMcqSingle(g) {
      let h = '';
      for (const q of g.questions) {
        h += `<div class="mcq-question"><div class="q-stem"><span class="q-num-prefix">${q.question_number}</span>${escapeHtml(q.stem)}</div><ul class="mcq-options">`;
        for (const o of (q.options || [])) {
          h += `<li><label><input type="radio" name="q${q.question_number}" value="${o.letter}" data-q="${q.question_number}" data-mode="single"><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span></label></li>`;
        }
        h += `</ul></div>`;
      }
      return h;
    }

    function handleAnswerChange(e) {
      const el = e.target;
      const mode = el.dataset.mode;
      const qNum = parseInt(el.dataset.q, 10);

      if (el.tagName === 'SELECT' && mode === 'dropdown') {
        const v = el.value;
        if (v) state.answers[qNum] = v; else delete state.answers[qNum];
        el.classList.toggle('answered', !!v);
      } else if (el.type === 'text') {
        const v = el.value.trim();
        if (v) state.answers[qNum] = v; else delete state.answers[qNum];
        el.classList.toggle('answered', !!v);
      } else if (mode === 'single') {
        state.answers[qNum] = el.value;
      } else if (mode === 'multi' || mode === 'pool') {
        const gid = el.dataset.group;
        const max = parseInt(el.dataset.max, 10) || 99;
        const checks = document.querySelectorAll(`input[data-group="${gid}"]:checked`);
        const vals = Array.from(checks).map(c => c.value);
        if (vals.length > max) { el.checked = false; alert(`En fazla ${max} seçim.`); return; }
        if (vals.length > 0) state.answers[qNum] = vals; else delete state.answers[qNum];
      } else if (mode === 'multi-perq') {
        const checks = document.querySelectorAll(`input[type="checkbox"][data-q="${qNum}"]:checked`);
        const vals = Array.from(checks).map(c => c.value);
        if (vals.length > 0) state.answers[qNum] = vals; else delete state.answers[qNum];
      }

      saveLocal();
      updateTabProgress();
    }

    function restoreAnswers() {
      for (const [k, v] of Object.entries(state.answers)) {
        const n = parseInt(k, 10);
        if (typeof v === 'string') {
          const sel = document.querySelector(`select[data-q="${n}"]`);
          if (sel) { sel.value = v; sel.classList.add('answered'); continue; }
          const tx = document.querySelector(`input.q-input[data-q="${n}"]`);
          if (tx) { tx.value = v; tx.classList.add('answered'); continue; }
          const rad = document.querySelector(`input[type="radio"][data-q="${n}"][value="${v}"]`);
          if (rad) rad.checked = true;
        } else if (Array.isArray(v)) {
          v.forEach(letter => {
            const cb = document.querySelector(`input[type="checkbox"][data-q="${n}"][value="${letter}"]`);
            if (cb) cb.checked = true;
          });
        }
      }
      updateTabProgress();
    }

    function saveLocal() {
      localStorage.setItem('ielts_reading_' + TEST_SLUG, JSON.stringify({
        answers: state.answers,
        startedAt: state.startedAt,
        currentPart: state.currentPart,
        timerStartedAt: state.timerStartedAt,
        timerElapsed: state.timerElapsed,
        timerRunning: state.timerRunning
      }));
    }

    function currentElapsed() {
      if (state.timerRunning && state.timerStartedAt) {
        return Math.floor((Date.now() - state.timerStartedAt) / 1000);
      }
      return state.timerElapsed || 0;
    }

    function startTimer() {
      if (state.timerRunning) return;
      const elapsed = state.timerElapsed || 0;
      state.timerStartedAt = Date.now() - elapsed * 1000;
      state.timerRunning = true;
      saveLocal();
      updateTimerUI();
    }

    function pauseTimer() {
      if (!state.timerRunning) return;
      state.timerElapsed = currentElapsed();
      state.timerStartedAt = null;
      state.timerRunning = false;
      saveLocal();
      updateTimerUI();
    }

    function updateTimerUI() {
      const btn = document.getElementById('timerToggleBtn');
      const t = document.getElementById('timerDisplay');
      if (state.timerRunning) {
        btn.textContent = 'Durdur';
        btn.classList.remove('start');
        btn.classList.add('stop');
        t.classList.remove('paused');
      } else {
        btn.textContent = state.timerElapsed > 0 ? 'Devam' : 'Başlat';
        btn.classList.remove('stop');
        btn.classList.add('start');
        if (state.timerElapsed > 0) t.classList.add('paused');
      }
    }

    function setupTimer() {
      const d = document.getElementById('timerDisplay').querySelector('strong');
      const t = document.getElementById('timerDisplay');
      const btn = document.getElementById('timerToggleBtn');

      btn.addEventListener('click', () => {
        if (state.timerRunning) pauseTimer();
        else startTimer();
      });

      updateTimerUI();

      state.timerInterval = setInterval(() => {
        const elapsed = currentElapsed();
        const r = state.duration - elapsed;
        if (r <= 0) {
          d.textContent = '00:00';
          t.classList.add('warning');
          if (state.timerRunning) pauseTimer();
          return;
        }
        if (r <= 300) t.classList.add('warning');
        d.textContent = String(Math.floor(r/60)).padStart(2,'0') + ':' + String(r%60).padStart(2,'0');
      }, 1000);
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
      const a = Object.keys(state.answers).length;
      document.getElementById('submitModalText').innerHTML = `<strong>${a}/40</strong> cevapladın. Boşlar yanlış sayılır. Bitirdikten sonra değişiklik yok.`;
      document.getElementById('submitModal').classList.add('show');
    });

    document.getElementById('confirmSubmit').addEventListener('click', async () => {
      if (state.finished) return;
      state.finished = true;
      const btn = document.getElementById('confirmSubmit');
      btn.textContent = 'Gönderiliyor…';
      btn.disabled = true;

      const result = gradeTest();
      const elapsed = currentElapsed();

      const { data: attempt, error } = await sb.from('ielts_attempts').insert({
        user_id: state.user.id, test_id: state.test.id, section: 'reading',
        started_at: new Date(state.startedAt).toISOString(),
        completed_at: new Date().toISOString(),
        answers: state.answers, raw_score: result.score,
        total_questions: result.total, band: result.band,
        time_spent_seconds: elapsed,
      }).select().single();

      if (error) {
        alert('Gönderim hatası: ' + error.message);
        state.finished = false;
        btn.textContent = 'Bitir ve Gönder';
        btn.disabled = false;
        return;
      }

      localStorage.removeItem('ielts_reading_' + TEST_SLUG);
      window.location.href = 'ielts-deneme-sonuc.html?attempt=' + attempt.id;
    });

    function gradeTest() {
      let score = 0, total = 0;
      for (const part of state.parts) {
        for (const g of part.question_groups) {
          const span = g.end_question_number - g.start_question_number + 1;

          if (g.question_type === 'mcq_multi') {
            if (isPerQuestionMcqMulti(g)) {
              // Q23-26 style: each Q has own options, all-or-nothing
              for (const q of g.questions) {
                const cs = Array.isArray(q.correct_answer) ? [...q.correct_answer].sort() : [];
                const ua = Array.isArray(state.answers[q.question_number]) ? [...state.answers[q.question_number]].sort() : [];
                const exact = cs.length === ua.length && cs.every((v,i) => v === ua[i]);
                score += exact ? 1 : 0;
                total += 1;
              }
            } else {
              // Q6 or Q28-30 style
              const cs = Array.isArray(g.questions[0].correct_answer) ? g.questions[0].correct_answer : [];
              const ua = Array.isArray(state.answers[g.start_question_number]) ? state.answers[g.start_question_number] : [];
              const cp = ua.filter(l => cs.includes(l));
              const wp = ua.filter(l => !cs.includes(l));
              if (span === 1) { score += (cp.length === cs.length && wp.length === 0) ? 1 : 0; total += 1; }
              else { score += Math.min(cp.length, span); total += span; }
            }
          } else if (g.question_type === 'multi_select_pool') {
            const cs = g.shared_content?.correct_set || (Array.isArray(g.questions[0].correct_answer) ? g.questions[0].correct_answer : []);
            const ua = Array.isArray(state.answers[g.start_question_number]) ? state.answers[g.start_question_number] : [];
            const cp = ua.filter(l => cs.includes(l));
            score += Math.min(cp.length, span);
            total += span;
          } else {
            for (const q of g.questions) {
              const u = state.answers[q.question_number];
              let got = 0;
              if (['mcq_single','tfng','paragraph_matching','heading_matching'].includes(g.question_type)) {
                if (u === q.correct_answer) got = 1;
              } else if (['sentence_completion','form_completion','notes_completion','fill_blank_chart'].includes(g.question_type)) {
                if (u) {
                  const c = u.toString().toLowerCase().trim();
                  const ac = q.acceptable_answers || [q.correct_answer];
                  if (ac.some(a => a.toString().toLowerCase().trim() === c)) got = 1;
                }
              }
              score += got; total += 1;
            }
          }
        }
      }
      return { score, total, band: bandFromRaw(score) };
    }

    function bandFromRaw(r) {
      // Academic Reading band scale
      if (r >= 39) return 9.0; if (r >= 37) return 8.5; if (r >= 35) return 8.0;
      if (r >= 33) return 7.5; if (r >= 30) return 7.0; if (r >= 27) return 6.5;
      if (r >= 23) return 6.0; if (r >= 19) return 5.5; if (r >= 15) return 5.0;
      if (r >= 13) return 4.5; if (r >= 10) return 4.0; if (r >= 8) return 3.5;
      if (r >= 6) return 3.0; if (r >= 4) return 2.5; return 2.0;
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    window.addEventListener('beforeunload', function (e) {
      if (state.startedAt && !state.finished) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    loadTest();
  </script>
