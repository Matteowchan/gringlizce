 pollen types than hives in nearby suburban gardens. Nair argued that this diversity stems from the greater range of ornamental and wild plants scattered across city parks, balconies, and abandoned lots. If Nair's reasoning is correct, then relocating a suburban hive into a city center should ______","correct":"A","sonuc":"Nair'in nedeni polen cesitliligini artiran ortama isaret ettiginden dogru tamamlama A'dir.","adimlar":["Iddiayi bul: sehir merkezinde daha genis bitki cesitliligi oldugu icin bal daha cok cesit polen icerir.","Bosluk 'eger Nair hakliysa, suburban kovani sehre tasimak SUNU yapmali' mantigini tamamlamali; yani nedenin sonucunu tahmin ediyoruz.","Sehre tasima = daha cok bitki cesidi = mantiksal olarak balda daha cok polen cesidi; A bunu birebir soyluyor.","B (miktar), C (saldirganlik) ve D (etki yok) pasajdaki neden-sonuc zincirini desteklemez veya ona ters duser; sadece polen CESITLILIGI tartisiliyor."],"stem":"Which choice most logically completes the text?","choices":{"C":"make the bees more aggressive toward nearby residents.","B":"reduce the total amount of honey the hive is able to produce each season.","A":"increase the number of pollen types found in that hive's honey.","D":"have no measurable effect on the honey's pollen content."}},{"correct":"B","passage":"A team restoring a 17th-century painting claimed that the artist originally intended the sky to appear at dusk rather than at midday. As evidence, they pointed to a faint band of orange pigment they uncovered beneath a later layer of blue overpaint applied by a previous restorer. The team concluded that the current daytime-blue sky does not reflect the painter's ______","sonuc":"Kanit gunun saatine dair oldugundan bosluk B ile tamamlanir.","adimlar":["Ekibin bulgusu: mavinin altinda turuncu bir pigment seridi var; bu turuncu, gunbatimi/aksam gogunu isaret ediyor.","Sonuc cumlesi 'suanki mavi gok ressamin ___ yansitmiyor' diyor; boslugun mavinin ne ile celiskili oldugunu vermesi lazim.","Kanit dogrudan gunun saatiyle (aksam vs. ogle) ilgili; dolayisiyla mavi gok ressamin ORIJINAL zaman-dilimi tasarimini yansitmiyor.","A (yetenek), C (pahali pigment tercihi) ve D (itibar) kanitla baglantisiz; turuncu serit bunlarin hicbirini gostermez, sadece amaclanan sahne zamanini gosterir."],"choices":{"B":"original vision for the scene's time of day.","C":"preference for expensive imported pigments.","D":"reputation among wealthy patrons of the period.","A":"skill with the technical demands of large-scale composition."},"stem":"Which choice most logically completes the text?"},{"sonuc":"Karsilastirma yasama-batma uzerine oldugundan bosluk A ile tamamlanir.","choices":{"D":"official government recognition.","A":"long-term survival.","C":"total operating budget.","B":"geographic location within the city."},"stem":"Which choice most logically completes the text?","passage":"Sociologist Marcus Bell studied why some neighborhood tool-lending libraries thrive while others fail. He noticed that successful libraries almost always began with a small core of volunteers who personally knew one another before founding the library, whereas failed ones were typically launched by strangers responding to an online ad. Bell suggested that pre-existing social trust, rather than the number of tools available, best explains a library's ______","adimlar":["Bell'in kiyasi: yasayan kutuphaneler birbirini taniyan gonullulerle, basarisiz olanlar yabancilarla kurulmus.","Bell 'alet sayisi degil, onceden var olan sosyal guven ___ en iyi aciklar' diyor; bosluk basari/basarisizlik ekseninde olmali.","Metin acikca 'thrive vs. fail' (yasama vs. batma) ayrimi yapiyor; guven bu farki, yani kutuphanenin uzun vadeli AYAKTA KALMASINI aciklar.","B (konum), C (butce) ve D (resmi taninirlik) metinde olculen sonuc degil; Bell butce ve alet sayisini zaten dislamis, sadece hayatta kalma tartisiliyor."],"correct":"A"}],"sik_hatalar":[{"cozum":"Bir seçenek gerçek ve makul olabilir ama iddianın kurduğu belirli ilişkiye dokunmuyorsa yanlıştır. Her zaman iddianın tam noktasına dön.","hata":"Doğru ama ilgisiz seçeneği seçmek"},{"hata":"Destekle ile zayıflatı karıştırmak","cozum":"Soru destek mi zayıflatma mi istiyor önce onu işaretle. Ters yön seçeneği çoğu zaman en çekici çeldiricidir."},{"cozum":"İddia genellikle bir ilişki kurar. Sadece bir kelimeye ya da rakama değil, ilişkinin bütün yönüne bak.","hata":"Tek bir ayrıntıya aşırmak"},{"hata":"Çok genel seçeneği güçlü sanmak","cozum":"Geniş ve belirsiz seçenekler iddiayı doğrudan test etmez. En spesifik, en doğrudan ölçen seçenek kazanır."},{"cozum":"Once iddiayi ve kaniti kendi cumlenle ozetle, sonra boslugun bu mantigi nasil tamamladigini test et; siki en sona birak.","hata":"Bosluktan onceki cumlenin sadece son kelimesine bakip sik secmek; boylece yazarin kurdugu neden-sonuc zinciri gozden kaciyor."},{"hata":"Kulaga akilli/gercek gelen ama pasajda kaniti olmayan bir sik secmek (disaridan bilgi katmak).","cozum":"Her sik icin 'bunu pasajdaki hangi cumle destekliyor?' diye sor; destegi olmayan siki, dogru gorunse bile ele."}]},"no":1,"families":["Konuyla ilgili iddiayla ilgisiz","Ters yön","Tek unsur","Çok genel"]},{"questions":[{"choices":{"D":"Primrose, which flowers latest, produces the fewest seeds per plant at 190.","A":"Aster, which flowers latest at week 26, produces the most seeds per plant at 540.","B":"Primrose flowers earliest, at week 18.","C":"Aster produces 540 seeds per plant."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Doğru sayı yanlış iş","lesson":2,"id":"u1-l2-f1-01","correct":"A","unit":1,"passage":"In a study of four alpine plant species, a botanist claims that the species flowering latest in the season also produces the most seeds per plant, suggesting a trade-off between early flowering and reproductive output.","table":{"rows":[["Gentian","22","310"],["Aster","26","540"],["Primrose","18","190"],["Campion","24","420"]],"head":["Species","First flowering (week)","Seeds per plant"]},"lesson_name":"Command of Evidence: Quantitative","choice_families":{"D":"Satır sütun karışıklığı","C":"Kıyassız tek değer","B":"Doğru sayı yanlış iş"},"why_wrong":{"C":"Aster's seed count alone gives no comparison of flowering time, so it does not support the trade-off claim.","B":"That Primrose flowers earliest is accurate but does not address the latest-flowering, most-seeds link the claim makes.","D":"Primrose flowers earliest, not latest; this misreads the flowering column and states the count wrongly."},"why_correct":"The claim links latest flowering to the most seeds. Aster flowers latest (week 26) and has the most seeds (540), pairing both variables to support the claim."},{"why_correct":"The claim ties highest corrosion resistance to lowest stiffness. A2 is most resistant (88) and least stiff (150), pairing both to support the trade-off.","choice_families":{"C":"Kıyassız tek değer","A":"Doğru sayı yanlış iş","D":"Satır sütun karışıklığı"},"why_wrong":{"A":"A4's high stiffness is accurate but does not address the corrosion-versus-stiffness trade-off in the claim.","D":"A4 is the least corrosion-resistant, not the most; this misreads the resistance column.","C":"A2's resistance index on its own offers no stiffness comparison, so it cannot support the claim linking highest resistance to lowest stiffness."},"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Alloy","Corrosion resistance (index)","Stiffness (GPa)"],"rows":[["A1","62","210"],["A2","88","150"],["A3","74","190"],["A4","55","230"]]},"unit":1,"correct":"B","passage":"A materials scientist claims that among four alloys tested, the one that is most resistant to corrosion is also the least stiff, indicating that gains in corrosion resistance came at the cost of rigidity.","lesson":2,"id":"u1-l2-f1-02","target_family":"Doğru sayı yanlış iş","choices":{"C":"A2 records a corrosion-resistance index of 88, the single figure entered for that alloy in the table's resistance column.","B":"A2, the most corrosion-resistant at an index of 88, is the least stiff at 150 GPa.","A":"A4 has the highest stiffness, at 230 GPa.","D":"A4, the most corrosion-resistant, is also the least stiff."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"why_correct":"The claim links the most speakers to the fewest vowels. L1 has the most speakers (95M) and fewest vowels (5), pairing both to support the claim.","choice_families":{"A":"Kıyassız tek değer","D":"Satır sütun karışıklığı","B":"Doğru sayı yanlış iş"},"why_wrong":{"D":"L3 has the fewest speakers, not the most; this misreads the speakers column.","A":"L1's speaker count on its own gives no vowel comparison, so it cannot support the claim linking the most speakers to the fewest vowels.","B":"L3's high vowel count is accurate but does not address the speakers-to-vowels link the claim makes."},"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["L1","95","5"],["L2","40","9"],["L3","12","11"],["L4","28","7"]],"head":["Language","Speakers (millions)","Distinct vowels"]},"unit":1,"correct":"C","passage":"A linguist claims that among four languages surveyed, the one with the largest number of speakers has the fewest distinct vowel sounds, consistent with the idea that widely spoken languages tend toward simpler vowel systems.","lesson":2,"id":"u1-l2-f1-03","target_family":"Doğru sayı yanlış iş","choices":{"C":"L1, with the most speakers at 95 million, has the fewest distinct vowels, at 5.","B":"L3 has 11 distinct vowels, the most of the four.","D":"L3, with the most speakers, has the fewest distinct vowels.","A":"L1 is listed with 95 million speakers, the population figure recorded for that language in the survey's speaker column."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"why_wrong":{"C":"Cityton's commute figure alone offers no car-ownership comparison, so it cannot support the claim tying the longest commute to the lowest ownership.","B":"Riverside's high car ownership is accurate but does not address the commute-to-ownership link.","A":"Riverside has the shortest commute, not the longest; this misreads the commute column."},"choice_families":{"A":"Satır sütun karışıklığı","B":"Doğru sayı yanlış iş","C":"Kıyassız tek değer"},"why_correct":"The claim ties the longest commute to the lowest car ownership. Cityton has both (48 min, 41 percent), pairing the variables to support the claim.","lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Cityton","48","41"],["Riverside","33","72"],["Hillford","39","60"],["Baymouth","44","55"]],"head":["City","Avg commute (min)","Car ownership (%)"]},"id":"u1-l2-f1-04","lesson":2,"passage":"An economist claims that among four cities, the one with the highest average commute time also has the lowest rate of car ownership, supporting the idea that long commutes push residents toward public transit.","unit":1,"correct":"D","choices":{"D":"Cityton, with the longest average commute at 48 minutes, has the lowest car ownership, at 41 percent.","A":"Riverside, with the longest commute, has the lowest car ownership.","C":"Cityton's average commute comes to 48 minutes, the single travel-time figure the table records for that city among the four surveyed.","B":"Riverside has the highest car ownership, at 72 percent."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Doğru sayı yanlış iş"},{"why_correct":"The claim ties warmest water to lowest coral cover. Reef A has both (29.5 C, 22 percent), pairing the variables to support the claim.","why_wrong":{"D":"Reef D has the coolest water, not the warmest; this misreads the temperature column.","C":"Reef A's temperature alone offers no coral-cover comparison, so it cannot support the claim tying the warmest water to the lowest cover.","B":"Reef D's high coral cover is accurate but does not address the temperature-to-cover link."},"choice_families":{"B":"Doğru sayı yanlış iş","C":"Kıyassız tek değer","D":"Satır sütun karışıklığı"},"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Site","Water temp (C)","Coral cover (%)"],"rows":[["Reef A","29.5","22"],["Reef B","27.1","58"],["Reef C","28.3","41"],["Reef D","26.4","66"]]},"passage":"A marine biologist claims that among four reef sites, the one with the warmest water has the lowest coral cover, consistent with heat stress reducing coral growth.","unit":1,"correct":"A","id":"u1-l2-f1-05","lesson":2,"target_family":"Doğru sayı yanlış iş","choices":{"A":"Reef A, with the warmest water at 29.5 C, has the lowest coral cover, at 22 percent.","D":"Reef D, with the warmest water, has the lowest coral cover.","B":"Reef D has the highest coral cover, at 66 percent.","C":"Reef A's water temperature reads 29.5 C, the single reading logged for that site in the survey's water-temperature column."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Layer","Depth (m)","Metal artifacts"],"rows":[["I","1.2","54"],["II","2.0","31"],["III","3.1","9"],["IV","2.6","20"]]},"why_wrong":{"A":"Layer I's high artifact count is accurate but does not address the depth-to-artifacts link.","D":"Layer I is the shallowest, not the deepest; this misreads the depth column.","C":"Layer III's depth alone offers no artifact comparison, so it cannot support the claim tying the deepest layer to the fewest metal artifacts."},"choice_families":{"C":"Kıyassız tek değer","A":"Doğru sayı yanlış iş","D":"Satır sütun karışıklığı"},"why_correct":"The claim ties the deepest layer to the fewest metal artifacts. Layer III is deepest (3.1 m) and has the fewest artifacts (9), pairing both to support the claim.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"C":"Layer III lies at a depth of 3.1 meters, the single depth measurement recorded for that layer in the excavation table.","B":"Layer III, the deepest at 3.1 meters, contains the fewest metal artifacts, at 9.","D":"Layer I, the deepest, contains the fewest metal artifacts.","A":"Layer I contains 54 metal artifacts, the most of any layer."},"target_family":"Doğru sayı yanlış iş","id":"u1-l2-f1-06","lesson":2,"passage":"An archaeologist claims that among four excavation layers, the deepest layer contains the fewest metal artifacts, consistent with metalworking arriving late at the site.","unit":1,"correct":"B"},{"target_family":"Doğru sayı yanlış iş","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"D":"Older adults, who average the least sleep, report the highest fatigue.","A":"Teens average 6.4 hours of sleep a night, the single figure entered for that age group in the study's sleep-duration column.","B":"Older adults report the lowest fatigue score, at 44.","C":"Teens, who average the least sleep at 6.4 hours, report the highest fatigue score, at 72."},"passage":"A sleep researcher claims that among four age groups, the group averaging the least sleep also reports the highest daytime fatigue, supporting a link between short sleep and fatigue.","unit":1,"correct":"C","id":"u1-l2-f1-07","lesson":2,"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Group","Avg sleep (hr)","Fatigue score"],"rows":[["Teens","6.4","72"],["Young adults","7.1","55"],["Middle-aged","6.8","61"],["Older adults","7.5","44"]]},"why_correct":"The claim ties the least sleep to the highest fatigue. Teens have both (6.4 hr, score 72), pairing the variables to support the claim.","why_wrong":{"B":"Older adults' low fatigue is accurate but does not address the sleep-to-fatigue link.","A":"Teens' sleep figure alone offers no fatigue comparison, so it cannot support the claim tying the least sleep to the highest fatigue.","D":"Older adults average the most sleep, not the least; this misreads the sleep column."},"choice_families":{"B":"Doğru sayı yanlış iş","A":"Kıyassız tek değer","D":"Satır sütun karışıklığı"}},{"lesson":2,"id":"u1-l2-f1-08","unit":1,"correct":"D","passage":"A geographer claims that among four watersheds, the one with the most forest cover loses the least soil to erosion each year, consistent with forests stabilizing soil.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"B":"W4 loses the most soil, at 6.0 tonnes per hectare.","C":"W1 is recorded with 78 percent forest cover, the single figure the table gives for that watershed's share of forest.","D":"W1, with the most forest cover at 78 percent, loses the least soil, at 1.1 tonnes per hectare.","A":"W4, with the most forest cover, loses the least soil."},"target_family":"Doğru sayı yanlış iş","choice_families":{"A":"Satır sütun karışıklığı","B":"Doğru sayı yanlış iş","C":"Kıyassız tek değer"},"why_wrong":{"B":"W4's high soil loss is accurate but does not address the forest-to-erosion link.","C":"W1's forest figure alone offers no erosion comparison, so it cannot support the claim tying the most forest cover to the least soil loss.","A":"W4 has the least forest cover, not the most; this misreads the forest column."},"why_correct":"The claim ties the most forest cover to the least soil loss. W1 has both (78 percent, 1.1 t/ha), pairing the variables to support the claim.","lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["W1","78","1.1"],["W2","45","4.3"],["W3","61","2.6"],["W4","30","6.0"]],"head":["Watershed","Forest cover (%)","Soil loss (t/ha)"]}},{"table":{"head":["Farm","Elevation (m)","Power per panel (W)"],"rows":[["F1","320","280"],["F2","1450","365"],["F3","760","310"],["F4","1100","340"]]},"lesson_name":"Command of Evidence: Quantitative","why_correct":"The claim ties highest elevation to most power per panel. F2 has both (1,450 m, 365 W), pairing the variables to support the claim.","why_wrong":{"B":"F1's low output is accurate but does not address the elevation-to-power link.","C":"F2's elevation alone offers no power comparison, so it cannot support the claim tying the highest elevation to the most power per panel.","D":"F1 sits at the lowest elevation, not the highest; this misreads the elevation column."},"choice_families":{"C":"Kıyassız tek değer","B":"Doğru sayı yanlış iş","D":"Satır sütun karışıklığı"},"target_family":"Doğru sayı yanlış iş","choices":{"B":"F1 generates 280 watts per panel, the least of the four.","C":"F2 sits at an elevation of 1,450 meters, the single altitude figure the table lists for that solar farm among the four.","A":"F2, at the highest elevation of 1,450 meters, generates the most power per panel, at 365 watts.","D":"F1, at the highest elevation, generates the most power per panel."},"stem":"Which choice most effectively uses data from the table to support the claim?","passage":"An energy analyst claims that among four solar farms, the one at the highest elevation generates the most power per panel, consistent with thinner air letting more sunlight reach the panels.","correct":"A","unit":1,"id":"u1-l2-f1-09","lesson":2},{"choice_families":{"C":"Kıyassız tek değer","D":"Satır sütun karışıklığı","A":"Doğru sayı yanlış iş"},"why_wrong":{"C":"D2's clinic density alone offers no wait-time comparison, so it cannot support the claim tying the most clinics to the shortest wait.","D":"D4 has the fewest clinics per resident, not the most; this misreads the clinics column.","A":"D4's long wait is accurate but does not address the clinics-to-wait link."},"why_correct":"The claim ties the most clinics per resident to the shortest wait. D2 has both (5.4 per 10,000, 4 days), pairing the variables to support the claim.","table":{"head":["District","Clinics per 10,000","Avg wait (days)"],"rows":[["D1","3.1","12"],["D2","5.4","4"],["D3","4.0","8"],["D4","2.2","16"]]},"lesson_name":"Command of Evidence: Quantitative","lesson":2,"id":"u1-l2-f1-10","correct":"B","unit":1,"passage":"A public-health researcher claims that among four districts, the one with the most clinics per resident has the shortest average wait for care, supporting a link between clinic density and shorter waits.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"C":"D2 is listed with 5.4 clinics per 10,000 residents, the single density figure the table records for that district's clinics.","B":"D2, with the most clinics per resident at 5.4 per 10,000, has the shortest average wait, at 4 days.","D":"D4, with the most clinics per resident, has the shortest wait.","A":"D4 has the longest average wait, at 16 days."},"target_family":"Doğru sayı yanlış iş"},{"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["A","4.1","5.0"],["B","2.3","5.0"],["C","3.6","5.0"]],"head":["Coating","Water loss, treated (g)","Water loss, untreated (g)"]},"choice_families":{"A":"Satır sütun karışıklığı","D":"Yön tersine çevrilmiş","C":"Kıyassız tek değer"},"why_wrong":{"C":"Coating A's treated value on its own makes no comparison with the other coatings, so it cannot support the claim that Coating B reduced water loss the most.","A":"The 2.3-gram figure belongs to treated leaves, not untreated; this swaps the columns.","D":"Coating C's treated loss (3.6 g) is higher than B's, so it reduced loss less, reversing the comparison."},"why_correct":"The claim is that Coating B reduced loss most. Its treated leaves lost the least (2.3 g) against the common 5.0-g baseline, using the correct row and column to support the claim.","choices":{"A":"Under Coating B, untreated leaves lost 2.3 grams.","D":"Coating C reduced water loss more than Coating B did.","C":"Treated leaves under Coating A lost 4.1 grams, a single treated value recorded for Coating A alone with no figure set beside it for comparison.","B":"Treated leaves lost 2.3 grams under Coating B, the lowest of the treated values against the same 5.0-gram untreated baseline."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Satır sütun karışıklığı","lesson":2,"id":"u1-l2-f2-01","unit":1,"correct":"B","passage":"A researcher claims that of the three tested coatings, Coating B reduced water loss from the leaves more than the others did."},{"why_wrong":{"D":"The southern rise (50) is smaller than the northern rise (90), so this reverses the comparison.","A":"Central's summer count alone makes no comparison, so it cannot support the claim that the northern region saw the greatest rise.","B":"The 210 figure is the summer value and 120 the spring value; this swaps the season columns and reverses the change."},"choice_families":{"D":"Yön tersine çevrilmiş","A":"Kıyassız tek değer","B":"Satır sütun karışıklığı"},"why_correct":"The claim is that the north rose most. Its 120-to-210 gain of 90 exceeds central's 40 and southern's 50, using the correct columns to support the claim.","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Region","Spring sightings","Summer sightings"],"rows":[["Northern","120","210"],["Central","150","190"],["Southern","90","140"]]},"id":"u1-l2-f2-02","lesson":2,"passage":"A researcher claims that among the three regions, the northern region saw a greater rise in bird sightings from spring to summer than the others did.","unit":1,"correct":"C","choices":{"B":"In the northern region, sightings fell from 210 in spring to 120 in summer.","C":"In the northern region, sightings rose from 120 in spring to 210 in summer, a gain of 90, the largest of the three.","D":"The southern region saw a greater rise than the northern region did.","A":"The central region recorded 190 summer sightings, a single seasonal count entered for that region with no spring figure placed beside it here."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Satır sütun karışıklığı"},{"why_correct":"The claim is math rose more than reading. Math's 16-point gain exceeds reading's 9-point gain, using the correct before-and-after columns to support the claim.","choice_families":{"B":"Satır sütun karışıklığı","C":"Kıyassız tek değer","A":"Yön tersine çevrilmiş"},"why_wrong":{"B":"The 78 is the after value and 62 the before value; this swaps the columns and reverses the change.","C":"Reading's after-score alone makes no comparison, so it cannot support the claim that mathematics rose more than reading.","A":"Reading rose 9 points, less than math's 16, so this reverses the comparison."},"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Mathematics","62","78"],["Reading","70","79"],["Science","65","74"]],"head":["Subject","Score before","Score after"]},"unit":1,"correct":"D","passage":"A researcher claims that the new curriculum raised test scores more in mathematics than in reading.","lesson":2,"id":"u1-l2-f2-03","target_family":"Satır sütun karışıklığı","choices":{"C":"Reading scores reached 79 after the new curriculum, a single post-curriculum figure reported for reading with no before value set beside it.","B":"Mathematics scores rose from 78 to 62.","D":"Mathematics scores rose from 62 to 78, a gain of 16, larger than reading's rise from 70 to 79.","A":"Reading scores rose more than mathematics scores did."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"why_correct":"The claim concerns conductivity relative to weight. Aluminum's high conductivity (237) with low density (2,700) gives the best ratio, using both columns correctly.","why_wrong":{"B":"237 is aluminum's conductivity, not its density; this swaps the columns.","C":"Copper's conductivity alone ignores weight and makes no comparison, so it cannot support the claim about conductivity relative to weight.","D":"Steel's low conductivity (50) and high density give a worse ratio, reversing the comparison."},"choice_families":{"D":"Yön tersine çevrilmiş","C":"Kıyassız tek değer","B":"Satır sütun karışıklığı"},"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Aluminum","237","2700"],["Steel","50","7850"],["Copper","401","8960"]],"head":["Material","Conductivity (W/mK)","Density (kg/m3)"]},"passage":"A researcher claims that among three materials, aluminum conducts heat better than the others relative to its weight.","unit":1,"correct":"A","id":"u1-l2-f2-04","lesson":2,"target_family":"Satır sütun karışıklığı","choices":{"C":"Copper has a conductivity of 401, a single figure that reports how well copper conducts heat with no mention of its weight or of the other materials.","B":"Aluminum's density is 237 kilograms per cubic meter.","D":"Steel offers a better conductivity-to-weight ratio than aluminum does.","A":"Aluminum's conductivity of 237 against its low density of 2,700 gives it the best conductivity-to-weight ratio of the three."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"A":"Fruit count rose from 39 to 24.","D":"Fruit size increased by a greater proportion than fruit count did.","C":"Fertilized plants produced fruit averaging 61 grams, a single measure of fruit size under fertilizer with no matching figure for fruit count set beside it.","B":"Fruit count rose from 24 to 39, a gain of about 63 percent, far exceeding the rise in fruit size from 55 to 61 grams, about 11 percent."},"target_family":"Satır sütun karışıklığı","id":"u1-l2-f2-05","lesson":2,"passage":"A researcher claims that the fertilizer increased fruit count more than it increased fruit size.","unit":1,"correct":"B","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Measure","Control","Fertilized"],"rows":[["Fruit count","24","39"],["Fruit size (g)","55","61"]]},"why_wrong":{"C":"The fertilized fruit-size figure alone makes no comparison with fruit count, so it cannot support the claim that count rose more than size.","A":"39 is the fertilized value and 24 the control; this swaps the columns and reverses the change.","D":"Size rose proportionally far less than count, so this reverses the comparison."},"choice_families":{"C":"Kıyassız tek değer","A":"Satır sütun karışıklığı","D":"Yön tersine çevrilmiş"},"why_correct":"The claim is count rose more than size. Count's ~63 percent rise dwarfs size's ~11 percent, using the correct rows and columns to support the claim."},{"lesson":2,"id":"u1-l2-f2-06","correct":"C","unit":1,"passage":"A researcher claims that among three lakes, Lake Two showed the sharpest drop in oxygen from surface to deep water.","choices":{"A":"Lake One's surface oxygen measured 9.0, a single surface reading logged for Lake One with no deep-water figure recorded beside it for comparison.","D":"Lake Three showed a sharper oxygen drop than Lake Two did.","C":"In Lake Two, oxygen fell from 9.2 at the surface to 3.1 in deep water, a drop of 6.1, the sharpest of the three.","B":"In Lake Two, oxygen rose from 3.1 at the surface to 9.2 in deep water."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Satır sütun karışıklığı","choice_families":{"B":"Satır sütun karışıklığı","A":"Kıyassız tek değer","D":"Yön tersine çevrilmiş"},"why_wrong":{"D":"Lake Three's drop (2.9) is smaller than Lake Two's (6.1), reversing the comparison.","A":"Lake One's surface figure alone makes no comparison, so it cannot support the claim that Lake Two showed the sharpest drop.","B":"3.1 is the deep value and 9.2 the surface value; this swaps the columns and reverses the change."},"why_correct":"The claim is Lake Two dropped most. Its 9.2-to-3.1 fall of 6.1 exceeds the others' drops, using the correct surface and deep columns.","table":{"rows":[["One","9.0","6.5"],["Two","9.2","3.1"],["Three","8.8","5.9"]],"head":["Lake","Surface oxygen (mg/L)","Deep oxygen (mg/L)"]},"lesson_name":"Command of Evidence: Quantitative"},{"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Novices","14.8","13.5"],["Experienced","12.6","12.2"]],"head":["Group","Time before (s)","Time after (s)"]},"choice_families":{"A":"Yön tersine çevrilmiş","B":"Satır sütun karışıklığı","C":"Kıyassız tek değer"},"why_wrong":{"A":"Experienced runners improved only 0.4 seconds, less than novices' 1.3, reversing the comparison.","B":"13.5 is the after time and 14.8 the before time; this swaps the columns and reverses the change.","C":"The experienced runners' after-time alone makes no comparison, so it cannot support the claim that novices improved more."},"why_correct":"The claim is novices improved more. Their 1.3-second gain exceeds the experienced runners' 0.4, using the correct before-and-after columns.","choices":{"C":"Experienced runners finished in 12.2 seconds after training, a single post-training time reported for that group with no before value set beside it.","B":"Novices improved from 13.5 to 14.8 seconds.","D":"Novices improved from 14.8 to 13.5 seconds, a gain of 1.3, larger than the experienced runners' 0.4-second gain.","A":"Experienced runners improved more than novices did."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Satır sütun karışıklığı","lesson":2,"id":"u1-l2-f2-07","unit":1,"correct":"D","passage":"A researcher claims that the training program improved sprint times more for novices than for experienced runners."},{"stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"B":"Product Y listed at 62 dollars and sold for 90.","C":"Product Z sold for 48 dollars, a single selling price recorded for Product Z with no list price placed beside it to measure any gap.","A":"Product Y listed at 90 dollars but sold for 62, a gap of 28, the largest of the three.","D":"Product Z had a larger list-to-selling gap than Product Y did."},"target_family":"Satır sütun karışıklığı","id":"u1-l2-f2-08","lesson":2,"passage":"A researcher claims that among three products, Product Y had the largest gap between its list price and its actual selling price.","unit":1,"correct":"A","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Product","List price ($)","Selling price ($)"],"rows":[["X","40","36"],["Y","90","62"],["Z","55","48"]]},"why_wrong":{"B":"62 is the selling price and 90 the list price; this swaps the columns.","C":"Product Z's selling price alone makes no comparison, so it cannot support the claim that Product Y had the largest list-to-selling gap.","D":"Product Z's gap (7) is smaller than Y's (28), reversing the comparison."},"choice_families":{"C":"Kıyassız tek değer","B":"Satır sütun karışıklığı","D":"Yön tersine çevrilmiş"},"why_correct":"The claim is Y had the largest gap. Its 90-to-62 gap of 28 exceeds the others', using the correct list and selling columns."},{"choices":{"B":"Town B's recycling rate rose from 22 percent in 2010 to 58 percent in 2020, a gain of 36 points, the greatest of the three.","C":"Town C reached a 52 percent recycling rate in 2020, a single year's figure reported for Town C with no earlier rate set beside it to show a change.","A":"Town B's rate fell from 58 percent in 2010 to 22 percent in 2020.","D":"Town A's rate rose more than Town B's did."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Satır sütun karışıklığı","id":"u1-l2-f2-09","lesson":2,"passage":"A researcher claims that among three towns, Town B had the greatest increase in recycling rate over the decade.","unit":1,"correct":"B","lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["A","30","45"],["B","22","58"],["C","41","52"]],"head":["Town","Rate 2010 (%)","Rate 2020 (%)"]},"why_wrong":{"C":"Town C's 2020 rate alone makes no comparison over time, so it cannot support the claim that Town B rose the most across the decade.","D":"Town A rose 15 points, less than Town B's 36, reversing the comparison.","A":"58 is the 2020 value and 22 the 2010 value; this swaps the columns and reverses the change."},"choice_families":{"A":"Satır sütun karışıklığı","D":"Yön tersine çevrilmiş","C":"Kıyassız tek değer"},"why_correct":"The claim is Town B rose most. Its 22-to-58 gain of 36 points exceeds the others', using the correct 2010 and 2020 columns."},{"table":{"rows":[["One","31","69"],["Two","28","72"],["Three","42","58"]],"head":["Engine","Energy to motion (%)","Energy to heat (%)"]},"lesson_name":"Command of Evidence: Quantitative","choice_families":{"D":"Yön tersine çevrilmiş","A":"Kıyassız tek değer","B":"Satır sütun karışıklığı"},"why_wrong":{"B":"58 percent is Engine Three's heat figure, not its motion figure; this swaps the columns.","D":"Engine Two directed only 28 percent to motion, less than Engine Three's 42, reversing the comparison.","A":"Engine One's motion figure alone makes no comparison, so it cannot support the claim that Engine Three converted the most fuel to motion."},"why_correct":"The claim is Engine Three converted the most to motion. Its 42 percent leads the three, using the correct motion column.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"D":"Engine Two directed more energy to motion than Engine Three did.","A":"Engine One directed 31 percent of its fuel energy to motion, a single figure reported for Engine One with no matching values for the other engines placed beside it.","B":"Engine Three directed 58 percent of its energy to motion.","C":"Engine Three directed 42 percent of its fuel energy to motion, the highest of the three, against 58 percent lost to heat."},"target_family":"Satır sütun karışıklığı","lesson":2,"id":"u1-l2-f2-10","correct":"C","unit":1,"passage":"A researcher claims that among three engines, Engine Three converted the most of its fuel energy into motion rather than heat."},{"choices":{"C":"As group size rose from 4 to 16 across the sessions, the average score fell from 88 to 66.","B":"As group size rose from 4 to 16, the average score rose from 66 to 88.","D":"Session 1's group of 4 scored 88 while sessions with larger groups scored lower on some measures.","A":"The largest group, of 16, scored 66 on average."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Yön tersine çevrilmiş","lesson":2,"id":"u1-l2-f3-01","correct":"C","unit":1,"passage":"A researcher claims that as study group size increased across the four sessions, the average quiz score fell.","table":{"rows":[["1","4","88"],["2","8","81"],["3","12","74"],["4","16","66"]],"head":["Session","Group size","Avg quiz score"]},"lesson_name":"Command of Evidence: Quantitative","choice_families":{"B":"Yön tersine çevrilmiş","A":"Kıyassız tek değer","D":"Doğru sayı yanlış iş"},"why_wrong":{"B":"This states scores rising with group size, the opposite of the falling trend the claim describes.","A":"The largest group's score alone shows no trend across sizes, so it does not support the claim.","D":"This cites accurate figures but describes only session 1 vaguely, not the full falling trend."},"why_correct":"The claim is that larger groups scored lower. Scores fall from 88 to 66 as size rises from 4 to 16, matching the claimed direction."},{"target_family":"Yön tersine çevrilmiş","choices":{"D":"As insulation thickness rose from 5 to 20 centimeters, heating cost fell from 210 to 90 dollars.","A":"Home H1 had 5 centimeters of insulation and a relatively high cost.","B":"As insulation rose from 5 to 20 centimeters, heating cost rose from 90 to 210 dollars.","C":"The home with 20 centimeters of insulation paid 90 dollars."},"stem":"Which choice most effectively uses data from the table to support the claim?","passage":"A researcher claims that thicker insulation was associated with lower monthly heating cost across the four homes.","unit":1,"correct":"D","id":"u1-l2-f3-02","lesson":2,"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Home","Insulation (cm)","Heating cost ($)"],"rows":[["H1","5","210"],["H2","10","160"],["H3","15","120"],["H4","20","90"]]},"why_correct":"The claim is thicker insulation, lower cost. Cost falls from 210 to 90 as insulation rises from 5 to 20, matching the claimed direction.","why_wrong":{"A":"This cites one home's figures without tracing the full inverse trend the claim makes.","B":"This has cost rising with insulation, the opposite of the falling trend the claim describes.","C":"The thickest-insulation home's cost alone shows no trend, so it does not support the claim."},"choice_families":{"B":"Yön tersine çevrilmiş","C":"Kıyassız tek değer","A":"Doğru sayı yanlış iş"}},{"why_correct":"The claim is more acidity, fewer earthworms. Density rises as pH rises (less acidity), so higher acidity accompanies fewer earthworms, matching the claim.","why_wrong":{"C":"The least acidic plot's count alone shows no trend across the range of acidity, so it cannot support the claim linking higher acidity to fewer earthworms.","B":"This ties more acidity to more earthworms, reversing the relationship the claim describes.","D":"Identifying the most acidic plot alone cites a figure without tracing the trend."},"choice_families":{"C":"Kıyassız tek değer","B":"Yön tersine çevrilmiş","D":"Doğru sayı yanlış iş"},"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Plot","Soil pH","Earthworms per m2"],"rows":[["P1","4.8","12"],["P2","5.6","28"],["P3","6.4","51"],["P4","7.1","74"]]},"passage":"A researcher claims that higher soil acidity was associated with reduced earthworm density across the four plots.","unit":1,"correct":"A","id":"u1-l2-f3-03","lesson":2,"target_family":"Yön tersine çevrilmiş","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"A":"As soil pH rose from 4.8 to 7.1, becoming less acidic, earthworm density rose from 12 to 74, so greater acidity accompanied fewer earthworms.","D":"Plot P1 was the most acidic, at pH 4.8.","B":"As soil became more acidic, earthworm density rose from 12 to 74.","C":"The least acidic plot held 74 earthworms per square meter, a single count taken at one end of the acidity range with no figures from the other plots traced beside it."}},{"id":"u1-l2-f3-04","lesson":2,"passage":"A researcher claims that longer daily screen time was associated with shorter nightly sleep across the four groups.","unit":1,"correct":"B","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"D":"Group G1 had the least screen time of the four.","A":"As screen time rose from 2 to 8 hours, sleep rose from 6.0 to 8.1 hours.","B":"As screen time rose from 2 to 8 hours, sleep fell from 8.1 to 6.0 hours.","C":"The group with 8 hours of screen time slept 6.0 hours."},"target_family":"Yön tersine çevrilmiş","why_wrong":{"C":"The highest-screen-time group's sleep alone shows no trend, so it does not support the claim.","A":"This has sleep rising with screen time, the opposite of the falling trend the claim describes.","D":"Naming the lowest-screen-time group cites a figure without tracing the inverse trend."},"choice_families":{"D":"Doğru sayı yanlış iş","A":"Yön tersine çevrilmiş","C":"Kıyassız tek değer"},"why_correct":"The claim is more screen time, less sleep. Sleep falls from 8.1 to 6.0 as screen time rises, matching the claimed direction.","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Group","Screen time (hr)","Sleep (hr)"],"rows":[["G1","2","8.1"],["G2","4","7.4"],["G3","6","6.8"],["G4","8","6.0"]]}},{"table":{"head":["Event","Ticket price ($)","Attendance"],"rows":[["E1","10","900"],["E2","20","720"],["E3","30","540"],["E4","40","410"]]},"lesson_name":"Command of Evidence: Quantitative","why_correct":"The claim is higher price, lower attendance. Attendance falls from 900 to 410 as price rises, matching the claimed direction.","choice_families":{"B":"Yön tersine çevrilmiş","D":"Doğru sayı yanlış iş","A":"Kıyassız tek değer"},"why_wrong":{"B":"This has attendance rising with price, the opposite of the falling trend the claim describes.","D":"Naming the cheapest event cites a figure without tracing the inverse trend.","A":"The priciest event's attendance alone shows no trend, so it does not support the claim."},"target_family":"Yön tersine çevrilmiş","choices":{"A":"The 40-dollar event drew 410 attendees.","D":"Event E1 charged the lowest price of the four.","B":"As ticket price rose from 10 to 40 dollars, attendance rose from 410 to 900.","C":"As ticket price rose from 10 to 40 dollars, attendance fell from 900 to 410."},"stem":"Which choice most effectively uses data from the table to support the claim?","correct":"C","unit":1,"passage":"A researcher claims that as ticket price rose across the four events, attendance declined.","lesson":2,"id":"u1-l2-f3-05"},{"choices":{"D":"As altitude rose from 200 to 2,300 meters, average temperature fell from 18.5 to 5.1 degrees.","A":"Station S1 sat at the lowest altitude of the four.","B":"As altitude rose from 200 to 2,300 meters, temperature rose from 5.1 to 18.5 degrees.","C":"The highest station, at 2,300 meters, averaged 5.1 degrees."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Yön tersine çevrilmiş","lesson":2,"id":"u1-l2-f3-06","correct":"D","unit":1,"passage":"A researcher claims that as altitude increased across the four stations, average air temperature fell.","table":{"head":["Station","Altitude (m)","Avg temp (C)"],"rows":[["S1","200","18.5"],["S2","900","14.0"],["S3","1600","9.6"],["S4","2300","5.1"]]},"lesson_name":"Command of Evidence: Quantitative","choice_families":{"A":"Doğru sayı yanlış iş","B":"Yön tersine çevrilmiş","C":"Kıyassız tek değer"},"why_wrong":{"B":"This has temperature rising with altitude, the opposite of the falling trend the claim describes.","C":"The highest station's temperature alone shows no trend, so it does not support the claim.","A":"Naming the lowest station cites a figure without tracing the inverse trend."},"why_correct":"The claim is higher altitude, lower temperature. Temperature falls from 18.5 to 5.1 as altitude rises, matching the claimed direction."},{"why_correct":"The claim is that heating raised resistance. Resistance rises from 1.10 to 1.66 as temperature rises, matching the claimed direction.","choice_families":{"D":"Doğru sayı yanlış iş","C":"Kıyassız tek değer","B":"Yön tersine çevrilmiş"},"why_wrong":{"D":"Naming the coolest trial cites a figure without tracing the rising trend.","C":"The highest-temperature resistance alone shows no trend, so it does not support the claim.","B":"This has resistance falling as temperature rises, the opposite of the claimed trend."},"lesson_name":"Command of Evidence: Quantitative","table":{"head":["Trial","Temperature (C)","Resistance (ohm)"],"rows":[["T1","20","1.10"],["T2","60","1.28"],["T3","100","1.47"],["T4","140","1.66"]]},"unit":1,"correct":"A","passage":"A researcher claims that as a metal was heated across the four trials, its electrical resistance rose.","lesson":2,"id":"u1-l2-f3-07","target_family":"Yön tersine çevrilmiş","choices":{"D":"Trial T1 was conducted at the lowest temperature.","A":"As temperature rose from 20 to 140 degrees, resistance rose from 1.10 to 1.66 ohms.","C":"At 140 degrees, resistance measured 1.66 ohms.","B":"As temperature rose from 20 to 140 degrees, resistance fell from 1.66 to 1.10 ohms."},"stem":"Which choice most effectively uses data from the table to support the claim?"},{"correct":"B","unit":1,"passage":"A researcher claims that as a reservoir's water level fell across four months, the concentration of dissolved salts rose.","lesson":2,"id":"u1-l2-f3-08","target_family":"Yön tersine çevrilmiş","choices":{"A":"As the water level fell from 12.0 to 7.2 meters, salt concentration fell from 3.6 to 1.8 grams per liter.","D":"June had the highest water level of the four months.","C":"In September, salt concentration reached 3.6 grams per liter.","B":"As the water level fell from 12.0 to 7.2 meters, salt concentration rose from 1.8 to 3.6 grams per liter."},"stem":"Which choice most effectively uses data from the table to support the claim?","why_correct":"The claim is falling level, rising salt. As level drops from 12.0 to 7.2, salt rises from 1.8 to 3.6, matching the claimed inverse relationship.","choice_families":{"D":"Doğru sayı yanlış iş","A":"Yön tersine çevrilmiş","C":"Kıyassız tek değer"},"why_wrong":{"A":"This has salt falling as the level falls, reversing the relationship the claim describes.","D":"Naming the highest-level month cites a figure without tracing the trend.","C":"September's salt figure alone shows no trend, so it does not support the claim."},"table":{"rows":[["Jun","12.0","1.8"],["Jul","10.5","2.3"],["Aug","8.9","2.9"],["Sep","7.2","3.6"]],"head":["Month","Water level (m)","Salt conc. (g/L)"]},"lesson_name":"Command of Evidence: Quantitative"},{"id":"u1-l2-f3-09","lesson":2,"passage":"A researcher claims that as a plant received more shade across four plots, its stem grew taller in a reach for light.","correct":"C","unit":1,"stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"B":"As shade rose from 10 to 70 percent, stem height fell from 41 to 22 centimeters.","C":"As shade rose from 10 to 70 percent, stem height rose from 22 to 41 centimeters.","D":"Plot P1 received the least shade of the four.","A":"The most shaded plot produced stems 41 centimeters tall."},"target_family":"Yön tersine çevrilmiş","why_wrong":{"B":"This has height falling as shade rises, the opposite of the claimed trend.","A":"The most-shaded plot's height alone shows no trend, so it does not support the claim.","D":"Naming the least-shaded plot cites a figure without tracing the rising trend."},"choice_families":{"A":"Kıyassız tek değer","D":"Doğru sayı yanlış iş","B":"Yön tersi arget_family":"Kıyassız tek değer","lesson":2,"id":"u1-l2-f4-01","unit":1,"correct":"D","passage":"A researcher claims that the treated group scored higher on the memory test than the untreated group did.","lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Treated","82"],["Untreated","67"]],"head":["Group","Memory score"]},"choice_families":{"A":"Kıyassız tek değer","C":"Yön tersine çevrilmiş","B":"Kıyassız tek değer"},"why_wrong":{"C":"This says the untreated group scored higher, reversing the comparison.","B":"The treated score alone makes no comparison with the untreated group, so it does not support the claim.","A":"The untreated score alone makes no comparison, so it does not support the claim."},"why_correct":"The claim compares the two groups. Stating 82 above 67 makes the comparison the claim requires."},{"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Coastal","1420"],["Inland","870"]],"head":["Site","Annual rainfall (mm)"]},"choice_families":{"C":"Yön tersine çevrilmiş","B":"Kıyassız tek değer","D":"Kıyassız tek değer"},"why_wrong":{"D":"The inland figure alone makes no comparison, so it does not support the claim.","B":"The coastal figure alone makes no comparison with the inland site, so it cannot support the claim that the coast received more rain.","C":"This says the inland site received more, reversing the comparison."},"why_correct":"The claim compares the two sites. Stating 1,420 above 870 makes the comparison the claim requires.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"B":"The coastal site received 1,420 millimeters of rain, a single annual total recorded for the coast with no figure for the inland site placed beside it.","C":"The inland site received more rain than the coastal site.","A":"The coastal site received 1,420 millimeters, more than the inland site's 870.","D":"The inland site received 870 millimeters of rain."},"target_family":"Kıyassız tek değer","lesson":2,"id":"u1-l2-f4-02","unit":1,"correct":"A","passage":"A researcher claims that the coastal site received more annual rainfall than the inland site did."},{"target_family":"Kıyassız tek değer","choices":{"D":"Users spent 61 seconds on the old design.","A":"Users spent 96 seconds on the redesigned page, a single average time recorded for the new design with no figure for the old design set beside it.","C":"Users spent longer on the old design than on the redesigned page.","B":"Users spent 96 seconds on the redesigned page, longer than the 61 seconds on the old design."},"stem":"Which choice most effectively uses data from the table to support the claim?","correct":"B","unit":1,"passage":"A researcher claims that the redesigned website kept users on the page longer than the old design did.","lesson":2,"id":"u1-l2-f4-03","table":{"head":["Design","Avg time on page (s)"],"rows":[["Redesigned","96"],["Old","61"]]},"lesson_name":"Command of Evidence: Quantitative","why_correct":"The claim compares the two designs. Stating 96 above 61 makes the comparison the claim requires.","choice_families":{"C":"Yön tersine çevrilmiş","A":"Kıyassız tek değer","D":"Kıyassız tek değer"},"why_wrong":{"C":"This says users stayed longer on the old design, reversing the comparison.","A":"The redesigned-page time alone makes no comparison, so it cannot support the claim that the redesign kept users longer than the old design.","D":"The old-design time alone makes no comparison, so it does not support the claim."}},{"lesson":2,"id":"u1-l2-f4-04","correct":"C","unit":1,"passage":"A researcher claims that the enriched diet produced heavier fish than the standard diet did.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"C":"Fish on the enriched diet averaged 318 grams, heavier than the 247 grams on the standard diet.","B":"Fish on the enriched diet averaged 318 grams, a single mean mass recorded for the enriched group with no figure for the standard diet placed beside it.","A":"Fish on the standard diet were heavier than those on the enriched diet.","D":"Fish on the standard diet averaged 247 grams."},"target_family":"Kıyassız tek değer","choice_families":{"B":"Kıyassız tek değer","A":"Yön tersine çevrilmiş","D":"Kıyassız tek değer"},"why_wrong":{"A":"This says the standard diet produced heavier fish, reversing the comparison.","D":"The standard-diet mass alone makes no comparison, so it does not support the claim.","B":"The enriched-diet mass alone makes no comparison, so it cannot support the claim that the enriched diet produced heavier fish."},"why_correct":"The claim compares the two diets. Stating 318 above 247 makes the comparison the claim requires.","table":{"head":["Diet","Avg mass (g)"],"rows":[["Enriched","318"],["Standard","247"]]},"lesson_name":"Command of Evidence: Quantitative"},{"id":"u1-l2-f4-05","lesson":2,"passage":"A researcher claims that the morning shift completed more orders than the evening shift did.","correct":"D","unit":1,"choices":{"C":"The evening shift completed more orders than the morning shift.","B":"The morning shift completed 340 orders.","D":"The morning shift completed 340 orders, more than the evening shift's 275.","A":"The evening shift completed 275 orders."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Kıyassız tek değer","why_wrong":{"A":"The evening figure alone makes no comparison, so it does not support the claim.","C":"This says the evening shift completed more, reversing the comparison.","B":"The morning figure alone makes no comparison, so it does not support the claim."},"choice_families":{"B":"Kıyassız tek değer","C":"Yön tersine çevrilmiş","A":"Kıyassız tek değer"},"why_correct":"The claim compares the two shifts. Stating 340 above 275 makes the comparison the claim requires.","table":{"head":["Shift","Orders completed"],"rows":[["Morning","340"],["Evening","275"]]},"lesson_name":"Command of Evidence: Quantitative"},{"target_family":"Kıyassız tek değer","choices":{"D":"The sunlit plot yielded 9.2 kilograms of berries.","A":"The shaded plot yielded 14.6 kilograms, more than the sunlit plot's 9.2.","C":"The sunlit plot yielded more berries than the shaded plot.","B":"The shaded plot yielded 14.6 kilograms of berries."},"stem":"Which choice most effectively uses data from the table to support the claim?","passage":"A researcher claims that the shaded plot yielded more berries than the sunlit plot did.","unit":1,"correct":"A","id":"u1-l2-f4-06","lesson":2,"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Shaded","14.6"],["Sunlit","9.2"]],"head":["Plot","Berry yield (kg)"]},"why_correct":"The claim compares the two plots. Stating 14.6 above 9.2 makes the comparison the claim requires.","why_wrong":{"C":"This says the sunlit plot yielded more, reversing the comparison.","B":"The shaded-plot yield alone makes no comparison, so it does not support the claim.","D":"The sunlit-plot yield alone makes no comparison, so it does not support the claim."},"choice_families":{"D":"Kıyassız tek değer","C":"Yön tersine çevrilmiş","B":"Kıyassız tek değer"}},{"choice_families":{"C":"Yön tersine çevrilmiş","A":"Kıyassız tek değer","D":"Kıyassız tek değer"},"why_wrong":{"C":"This says virgin-pulp cost less, reversing the comparison.","D":"The virgin-pulp figure alone makes no comparison, so it does not support the claim.","A":"The recycled figure alone makes no comparison, so it cannot support the claim that recycled paper cost less than virgin-pulp paper."},"why_correct":"The claim compares the two papers. Stating 4.20 below 5.65 makes the comparison the claim requires.","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Paper","Cost per ream ($)"],"rows":[["Recycled","4.20"],["Virgin","5.65"]]},"lesson":2,"id":"u1-l2-f4-07","unit":1,"correct":"B","passage":"A researcher claims that the recycled-content paper cost less per ream than the virgin-pulp paper did.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"B":"Recycled-content paper cost 4.20 dollars per ream, less than the virgin-pulp paper's 5.65.","C":"Virgin-pulp paper cost less per ream than recycled-content paper.","A":"Recycled-content paper cost 4.20 dollars per ream, a single price recorded for that paper with no figure for the virgin-pulp paper set beside it to compare.","D":"Virgin-pulp paper cost 5.65 dollars per ream."},"target_family":"Kıyassız tek değer"},{"lesson":2,"id":"u1-l2-f4-08","unit":1,"correct":"C","passage":"A researcher claims that the northern colony produced more honey than the southern colony did.","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"D":"The southern colony produced 24.0 kilograms of honey.","A":"The southern colony produced more honey than the northern colony.","B":"The northern colony produced 31.5 kilograms of honey, a single yield recorded for that colony with no figure for the southern colony placed beside it.","C":"The northern colony produced 31.5 kilograms, more than the southern colony's 24.0."},"target_family":"Kıyassız tek değer","choice_families":{"D":"Kıyassız tek değer","A":"Yön tersine çevrilmiş","B":"Kıyassız tek değer"},"why_wrong":{"B":"The northern figure alone makes no comparison, so it cannot support the claim that the northern colony produced more honey.","A":"This says the southern colony produced more, reversing the comparison.","D":"The southern figure alone makes no comparison, so it does not support the claim."},"why_correct":"The claim compares the two colonies. Stating 31.5 above 24.0 makes the comparison the claim requires.","lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Northern","31.5"],["Southern","24.0"]],"head":["Colony","Honey (kg)"]}},{"why_correct":"The claim compares the two containers. Stating 9.4 above 3.1 makes the comparison the claim requires.","why_wrong":{"C":"This says the plain container lasted longer, reversing the comparison.","B":"The insulated figure alone makes no comparison, so it does not support the claim.","A":"The plain-container figure alone makes no comparison, so it cannot support the claim that the insulated container kept its contents cold longer."},"choice_families":{"A":"Kıyassız tek değer","B":"Kıyassız tek değer","C":"Yön tersine çevrilmiş"},"lesson_name":"Command of Evidence: Quantitative","table":{"rows":[["Insulated","9.4"],["Plain","3.1"]],"head":["Container","Time below 5 C (hr)"]},"passage":"A researcher claims that the insulated container kept its contents cold longer than the plain container did.","unit":1,"correct":"D","id":"u1-l2-f4-09","lesson":2,"target_family":"Kıyassız tek değer","stem":"Which choice most effectively uses data from the table to support the claim?","choices":{"C":"The plain container kept its contents cold longer than the insulated one.","B":"The insulated container held its contents below 5 degrees for 9.4 hours.","A":"The plain container held its contents below 5 degrees for 3.1 hours, a single duration recorded for the plain container with no figure for the insulated one set beside it.","D":"The insulated container held its contents below 5 degrees for 9.4 hours, longer than the plain container's 3.1."}},{"choice_families":{"D":"Kıyassız tek değer","C":"Yön tersine çevrilmiş","B":"Kıyassız tek değer"},"why_wrong":{"D":"The old-syllabus figure alone makes no comparison, so it does not support the claim.","C":"This says the old syllabus did better, reversing the comparison.","B":"The revised figure alone makes no comparison, so it cannot support the claim that the revised syllabus produced more on-time work than the old one."},"why_correct":"The claim compares the two syllabi. Stating 88 above 64 makes the comparison the claim requires.","lesson_name":"Command of Evidence: Quantitative","table":{"head":["Syllabus","On-time submissions (%)"],"rows":[["Revised","88"],["Old","64"]]},"lesson":2,"id":"u1-l2-f4-10","unit":1,"correct":"A","passage":"A researcher claims that the revised syllabus led students to submit more assignments on time than the old syllabus did.","choices":{"D":"Under the old syllabus, 64 percent of assignments arrived on time.","A":"Under the revised syllabus, 88 percent of assignments arrived on time, above the 64 percent under the old one.","C":"The old syllabus produced a higher on-time rate than the revised one.","B":"Under the revised syllabus, 88 percent of assignments arrived on time, a single figure reported for the revised syllabus with no rate for the old one set beside it."},"stem":"Which choice most effectively uses data from the table to support the claim?","target_family":"Kıyassız tek değer"}],"main_ids":["u1-l2-f1-01","u1-l2-f2-01","u1-l2-f3-01","u1-l2-f4-01"],"no":2,"families":["Doğru sayı yanlış iş","Satır sütun karışıklığı","Yön tersine çevrilmiş","Kıyassız tek değer"],"teaching":{"sik_hatalar":[{"cozum":"Rakamın doğru okunması yetmez. Cümlenin istediği karşılaştırmayı yapmalı.","hata":"Tabloda doğru ama iddiayla ilgisiz veri seçmek"},{"cozum":"Sırayı tersine çevir. Önce iddiayı anla, sonra ihtiyacın olan veriyi ara.","hata":"Önce tabloyu okuyup sonra iddiaya bakmak"},{"cozum":"Artış, kat, oran gibi iddialar en az iki değer ister. Tek rakam yeterli değildir.","hata":"Tek nokta ile oran iddiasını kanıtlamaya çalışmak"},{"hata":"En büyük ya da en dikkat çekici rakamı seçmek","cozum":"Dikkat çeken rakam değil, iddianın ihtiyaç duyduğu rakam doğrudur."},{"hata":"Veriyi dogru okuyup ama iddiayi desteklemeyen (ya da onunla alakasiz) bir gercegi secmek; sayi dogru diye siki dogru sanmak.","cozum":"Iki adimli kontrol yap: (1) sik veriyle tutuyor mu? (2) bu veri tam olarak yazarin IDDIASINI mi kanitliyor? Ikisi de 'evet' olmali."},{"cozum":"Egimin nerede degistigini isaretle; 'yavas donem', 'dik donem', 'tepe', 'dusus' gibi bolumleri ayirarak dogru araligi sec.","hata":"Trendi tek bir uc noktaya indirgemek (orn. tum artisi son yila baglamak) ya da 'surekli artiyor' gibi asiri genellemek."}],"cozumlu_ornekler":[{"choices":{"A":"uses 95 liters per person, the lowest of the four cities","D":"is one of four cities measured in the study","B":"uses 95 liters per person, more than City A","C":"uses less water than City B, which uses 210 liters"},"stem":"Which choice most effectively uses data from the table to support the claim?","sonuc":"Doğru seçenek hem veriyi doğru okur hem iddianın tam ihtiyacını (en düşük, yani en etkili) karşılar.","adimlar":["İddiayı oku: City C programı EN ETKİLİ. En etkili demek, en düşük kullanım demek.","Tabloya git: en düşük değer City C, 95 litre. Diğerleri 120, 210, 180.","A hem doğru okuyor (95, en düşük) hem iddiaya hizmet ediyor (en etkili = en düşük). Doğru.","B doğru rakam ama yanlış karşılaştırma, City A'dan fazla demek iddiayı desteklemez. C doğru ama sadece bir şehirle kıyaslar, en etkili iddiasını tam kanıtlamaz. D veri bile vermez."],"passage":"A table shows the average daily water use per person in four cities: City A 120 liters, City B 210 liters, City C 95 liters, City D 180 liters. A report claims that City C's conservation program is the most effective of the four. This claim is best supported by the fact that City C ______","correct":"A"},{"correct":"A","passage":"A graph shows a company's sales rising from 40 units in January to 100 units in April. A summary states that sales more than doubled over this period. This is supported because sales ______","adimlar":["İddia: satışlar iki kattan FAZLA arttı.","İki kattan fazla, başlangıcın iki katını geçmek demek. Başlangıç 40, iki katı 80. Nisan 100, yani 80'i geçiyor.","A hem başlangıç hem bitiş rakamını verir ve iki katı geçtiğini gösterir. İddiayı tam kanıtlar.","B ve C doğru ama sadece bir üç noktayı verir, iki kata çıkmayı göstermez. D değişimi söyler ama miktarını vermez."],"choices":{"A":"rose from 40 units to 100 units, more than twice the starting figure","D":"changed each month between January and April","C":"were higher in April than in January","B":"reached 100 units in April"},"stem":"Which choice most effectively uses data from the graph to support the statement?","sonuc":"Bir oranı ya da katı kanıtlamak için seçenek hem başlangıç hem bitiş değerini içermeli, tek nokta yetmez."},{"passage":"A table in a report compares average daily water use per person in four cities. City A uses 95 liters, City B uses 140 liters, City C uses 210 liters, and City D uses 155 liters. The report's author claims that City C's residents use more water per person each day than residents of any other listed city, a pattern the author attributes to City C's large number of private gardens. To support this claim with data from the table, the author could note that City C's per-person daily use ______","adimlar":["Iddiayi netlestir: City C, listedeki DIGER TUM sehirlerden kisi basi daha cok su kullaniyor.","Iddiayi destekleyen veri, C'yi tek tek digerleriyle degil, HEPSIYLE karsilastirmali (210 > 95, 140, 155).","B 'her diger sehri asiyor' diyerek 'any other city' iddiasini birebir dogruluyor; sayilar da bunu tutuyor (210 en yuksek).","A dogru bir kiyas ama sadece City A ile; iddia 'tum sehirler' oldugu icin eksik. C ve D iddiayla ilgisiz (yakinlik/zaman). Ustelik tabloda zaman verisi yok, D uydurma."],"correct":"B","stem":"Which choice most effectively uses data from the table to support the author's claim?","choices":{"C":"is closer to City D's than to City B's use.","B":"exceeds that of every other city listed in the table.","A":"is more than double that of City A, the lowest in the table.","D":"rose sharply over the previous ten-year period."},"sonuc":"Iddia 'tum digerlerinden fazla' dedigi icin en iyi destek, C'nin her sehri astigini soyleyen B'dir."},{"adimlar":["Grafigi oku: 2015-2019 yavas artis (2'den 6'ya), 2019-2023 dik artis (6'dan 22'ye).","Bosluk 'en keskin artis SUNE denk geldi' diyor; en dik egim 2019 sonrasi.","Arastirmaci istasyonlarin 2019'da kuruldugunu soyluyor; C hem veriyi (2019 sonrasi dik artis) hem baglami dogru birlestiriyor.","A tersini soyluyor (yavas donem), B veriyle celisiyor (sabit degil), D ise artisi tek yila indirgeyerek 2019-2022 arasindaki yukselisi yok sayiyor."],"stem":"Which choice most effectively uses data from the graph to complete the statement?","choices":{"A":"between 2015 and 2019, before charging stations existed.","D":"only in the single year between 2022 and 2023.","C":"in the years after 2019, following the arrival of charging stations.","B":"steadily and at the same slow rate throughout the entire eight-year period."},"passage":"A graph shows the percentage of households owning a home electric vehicle (EV) in a region from 2015 to 2023. The line rises slowly from 2 percent in 2015 to 6 percent in 2019, then climbs steeply to 22 percent by 2023. A researcher writes that EV adoption in the region remained modest for several years before accelerating dramatically, and that public charging stations, first installed in 2019, likely contributed to this shift. The data indicate that the sharpest increase in EV ownership occurred ______","correct":"C","sonuc":"En dik egim 2019 sonrasinda oldugundan veriyi dogru kullanan sik C'dir."},{"correct":"C","passage":"Researchers measured seed germination for a plant species at four soil temperatures. At 10 degrees C, 15 percent of seeds germinated; at 15 degrees C, 48 percent; at 20 degrees C, 71 percent; and at 25 degrees C, 40 percent. The researchers proposed that this species has an optimal germination temperature rather than simply germinating better as temperature rises. This conclusion is best supported by the observation that germination ______","adimlar":["Sonucu oku: tur, sicaklik arttikca 'surekli daha iyi' degil, bir OPTIMUM sicakliga sahip.","Optimum'u destekleyen veri, once artip sonra DUSEN bir desen olmali (yukselip tepe yapip inme).","Sayilar: 15, 48, 71, 40; 20 derecede tepe (71), 25'te dusus (40). C bunu birebir anlatiyor.","A yanlis (surekli artmiyor, 25'te dusuyor), B yanlis (en dusuk 10 derece, %15), D yanlis (degerler cok degisiyor). Sadece C 'optimum' iddiasini kanitlar."],"sonuc":"Veri tepe yapip dustugu icin optimum iddiasini destekleyen sik C'dir.","choices":{"D":"stayed roughly constant across all four temperatures tested.","A":"increased continuously as the soil temperature increased.","B":"was highest at the lowest tested temperature, 10 degrees C.","C":"peaked at 20 degrees C and then declined at 25 degrees C."},"stem":"Which choice most effectively uses data from the text to support the researchers' conclusion?"}],"kavramsal_temel":["Command of Evidence: Quantitative, bir grafik ya da tablodaki VERİYİ bir iddiayla eşleştirmeni ister. Metin bir boşluk bırakır, sen tablodan doğru veriyi seçip o boşluğu iddiayla tutarlı şekilde doldurursun.","Bu soru veri okumaktan çok, VERİ ile İDDİA arasındaki uyumu ölçer. Doğru seçenek hem tabloda doğru okunmuş olmalı hem de cümlenin kurduğu mantığa hizmet etmeli. İkisinden biri tutmazsa seçenek yanlıştır.","En sık tuzak, tabloda DOĞRU ama cümlenin İSTEDİĞİ karşılaştırmayla ilgisiz bir veri seçmektir. Örneğin cümle bir artış vurgularıken, seçenek doğru bir rakam verir ama artışı değil başka bir şeyi gösterir.","Bu yüzden önce cümlenin ne iddia ettiğine bak, sonra tabloya git. Tabloyu amaçsız okumak seni yanlış ama doğru görünen rakamlara sürüklersin.","Quantitative Command of Evidence sorularinda gorevin, bir grafik veya tablodaki sayisal olguyu bir yazili iddiaya baglamaktir. Kritik nokta sudur: dogru sik hem VERIYLE tutarli olmali hem de yazarin tam olarak o iddiasini desteklemelidir. Bir sik teknik olarak dogru bir sayi verse bile, eger iddiayla mantiksal baglantisi yoksa yanlistir. Bu yuzden soruyu cozerken once iddiayi bir cumleyle ozetle, sonra 'bu iddiayi kanitlamak icin grafikte hangi karsilastirmayi yapmam gerekir?' diye sor; ancak ondan sonra siklara don.","Bu ders turunde iki numara sik hata alani vardir: kapsam ve trend yorumu. Kapsam hatasi, iddia 'hepsinden fazla' derken sadece bir ogeyle kiyaslayan siki secmektir; iddianin nicel kapsami (bir, cogu, hepsi, iki katindan fazla) ile destegin kapsami birebir ortusmelidir. Trend hatasi ise egim degisimini yanlis okumaktir: SAT sik sik 'once yavas sonra hizli' ya da 'tepe yapip dusen' desenler kurar ve celdiriciler bunu 'surekli artan' veya 'tek yilda olan' diye carpitir. Veriyi bolgelere ayirarak okumak bu tuzaklari nötralize eder."],"alt_konular_intro":"Quantitative Command of Evidence'ta metnin yanında bir grafik ya da tablo vardır. Beceri iki katmanlıdır: önce veriyi DOĞRU OKUMAK, sonra o veriyi iddiaya BAĞLAMAK. Öğrencilerin çoğu ikinci katmanda değil, aslında birinci katmanda (veriyi yanlış okuyarak) hata yapar. Alt tipler bu iki katmanı ayrıştırır.","top_tips":["Şıkkın sayısını tabloda parmağını koyarak bul. Gözle taramak hata üretir. Bu bir sınav, hız değil doğruluk kazandırır.","Metinde however, but, yet varsa iddia bir KARŞITLIK kuruyordur. O zaman doğru şık da iki değeri KARŞILAŞTIRIR. Tek değer veren şık yanlıştır.","Metin bir grubun özelliğini söylüyorsa, doğru şık o grubun değerini vermekle kalmaz, en azından ikinci bir grupla KIYASLAR. Kıyas yoksa iddia kanıtlanmamıştır.","Tabloda birden fazla sütun varsa iddianın HANGİ sütunu ilgilendirdiğini işaretle. Çeldiriciler genelde yanlış sütundan doğru sayı getirir."],"karar_proseduru":["TABLOYA HENÜZ BAKMA. Önce metni oku.  Metnin iddiası ne. Bunu bilmeden tabloya bakarsan sayılar arasında kaybolursun. En sık yapılan hata budur.","İddiayı tek cümleye indir ve yönünü işaretle.  Örnek: A grubu B grubundan daha yüksek. Ok yönünü bil.","Tablonun başlığını ve birimlerini oku.  Yüzde mi, adet mi, kilogram mı. Satırlar ne, sütunlar ne. Otuz saniye harca, sonra bir dakika kazan.","Her şıkkı TEK TEK tabloda doğrula.  Sayı tabloda var mı, doğru satırdan mı geliyor. Yanlış sayı içeren şıkkı hemen ele.","Ayakta kalan şıklara ikinci testi uygula.  Bu veri metnin iddiasını DESTEKLİYOR mu. Sayı doğru olabilir ve yine de yanlış cevap olabilir."],"strateji":["Önce iddiayı oku: en yüksek mi, en düşük mu, artış mi, oran mi istiyor.","İddianın hangi veriye ihtiyacı olduğunu belirle.","Tabloya git ve o veriyi bul, doğru oku.","Seçenek hem doğru veriyi versin hem iddiaya hizmet etsin, ikisini de kontrol et.","Tek nokta oran kanıtlamaz, kat ve artış için iki değer ara."],"celdirici_aileleri":[{"tanim":"Sayı tabloda aynen var. Ama metnin iddiasını desteklemiyor, hatta bazen alakasız bir şeyi ölçüyor. En sık düşülen tuzak. Öğrenci sayıyı tabloda bulunca rahatlıyor ve işaretliyor.","ad":"Doğru sayı, yanlış iş"},{"tanim":"Sayı tabloda var ama başka bir satırdan ya da başka bir sütundan alınmış. Aceleyle okuyunca yakalanmaz. Parmağını satıra koy.","ad":"Satır sütun karışıklığı"},{"tanim":"Karşılaştırma doğru unsurları içeriyor ama büyük küçük ters yazılmış. greater than yerine less than. Tek kelime, tam puan.","ad":"Yön tersine çevrilmiş"},{"tanim":"Şık tabloda gerçekten var olan tek bir sayı verir ama hiçbir şeyle karşılaştırmaz. İddia bir KARŞILAŞTIRMA istiyorsa tek değer onu kanıtlamaz.","ad":"Kıyassız tek değer"},{"ad":"Eksik Kiyas","tanim":"Dogru yonde ama iddianin gerektirdiginden daha az veriyi kullanir; orn. iddia 'tum sehirlerden fazla' derken sadece tek bir sehirle karsilastirir. Iddianin kapsamiyla (bir mi, hepsi mi) destegin kapsami eslesmelidir."},{"tanim":"Tabloda/grafikte bulunmayan bir boyutu (orn. zaman icindeki degisim, gelir, sebep) varmis gibi kullanir. Sadece eksende/sutunda fiilen olcen veriye dayanan siki sec; olculmeyen degiskeni ekleyen siki ele.","ad":"Grafikte Olmayan Degisken"}],"alt_konular":[{"govde":["Seçeneğe bakmadan önce eksenleri, birimleri ve başlığı oku. Y ekseni yüzde mi, sayı mı? Tablo satırları neyi, sütunları neyi gösteriyor? Bu 15 saniye, soruların yarısını kurtarır.","En yaygın okuma hatası: iki veri noktasını karıştırmak ya da 'artış' ile 'daha yüksek değer'i birbirine karıştırmak. Grafikte bir eğrinin yükselmesi 'artış'tır; iki eğriden birinin diğerinden yukarıda olması 'daha yüksek'tir — ikisi farklı ifadelerdir.","Seçeneklerde geçen her sayısal iddiayı doğrudan grafik üstünde parmakla göster. Grafikte doğrulayamadığın hiçbir sayıyı seçme."],"kural":"Önce ekseni ve birimi oku; seçenekteki her sayıyı grafik üstünde bizzat doğrula.","baslik":"1) Grafiği / tabloyu doğru okuma"},{"baslik":"2) İddiayı destekleyen veriyi seçme","govde":["Soru kökü: \"Which choice most effectively uses data from the graph to support the claim?\" Doğru seçenek hem GRAFİKLE TUTARLI olmalı hem de iddiayı DESTEKLEMELİ. İki şart birden gerekir.","Dört tuzak deseni vardır: (a) grafikte doğru ama iddiayla alakasız veri, (b) iddiayı destekleyen ama grafikte olmayan/yanlış veri, (c) yönü ters okunmuş veri, (d) doğru veri ama yanlış gruba/yıla ait.","Strateji: önce iddianın ne söylediğini yaz, sonra her seçeneği 'grafikte doğru mu?' ve 'iddiayı destekliyor mu?' diye İKİ kez ele. İkisini de geçen tek seçenek doğrudur."],"kural":"Doğru cevap = grafikle tutarlı VE iddiayı destekleyen. Sadece birini sağlayan seçenek tuzaktır."},{"ornek":"Cümle 'en büyük artışı gösteren yıl' diyorsa, en yüksek değeri değil, bir önceki yıla göre farkı en büyük olan yılı bulmalısın.","govde":["Bazı sorularda metin yarım bir cümle kurar: \"The 2018 sample showed the highest value, at ____.\" Boşluğu grafikten okunan doğru rakamla tamamlayan seçeneği seçersin.","Burada iddia yorumu değil, hassas okuma ölçülür. Cümlenin gerektirdiği tam noktayı (hangi yıl, hangi grup, hangi eksen) belirle, ardından o değeri grafikten oku.","Tuzak: doğru rakam ama cümlenin gramerine/mantığına uymayan seçenek — örneğin 'en yüksek' derken ikinci en yüksek değeri veren şık."],"baslik":"3) Cümledeki boşluğu doğru veriyle tamamlama"}],"alt_konular_baslik":"Soru alt tipleri","ne_olculuyor":["Metin bir iddia kurar, yanında bir tablo ya da grafik verilir. Soru: hangi şık tablodaki veriyi kullanarak metni en iyi tamamlar?","Bu soru Türk öğrencinin en çok kaybettiği yerdir ve sebebi ilginçtir. Matematik kolaydır, ıngilizce kolaydır, ama İKİ AŞAMALI test yapmayı kimse öğretmez.","Her şık iki testten geçmek zorunda. Birinci test: sayılar tabloya UYUYOR mu. İkinci test: bu veri metnin İDDİASINI destekliyor mu. Bir şık birinci testi geçip ikinciden kalabilir. İşte tuzak orada."]},"name":"Command of Evidence: Quantitative","fam_short":{"Doğru sayı yanlış iş":"Yanlış is","Yön tersine çevrilmiş":"Ters yön","Kıyassız tek değer":"Kıyassız","Satır sütun karışıklığı":"Satır/sütun"}},{"questions":[{"stem":"Which choice best states the main idea of the text?","choices":{"A":"The Inca road network served not mainly a military function but a broad administrative one, binding the state together.","D":"Because the roads were so useful for administration, the Inca had little need for an army.","C":"The Inca built some of the most elaborate roads of the ancient world.","B":"Relay runners used the Inca roads to carry messages across the empire."},"target_family":"Çok dar","id":"u1-l3-f1-01","lesson":3,"passage":"For decades, scholars assumed that the elaborate roads built by the Inca served chiefly to move armies. More recent study complicates that picture. The same roads carried relay runners bearing messages, llama caravans moving goods, and officials conducting censuses. The network, it now appears, was less a military corridor than the connective tissue of an entire administrative state.","unit":1,"correct":"A","lesson_name":"Central Ideas and Details","why_wrong":{"B":"Relay runners are one example of the roads' varied uses, a detail too narrow to be the main idea.","C":"The elaborateness of the roads is a general aside, not the passage's argument about their function.","D":"The passage never claims the roads reduced the need for an army; this reverses the relationship."},"choice_families":{"D":"Ters ilişki","B":"Çok dar","C":"Çok geniş"},"why_correct":"The passage revises an older military reading, arguing the roads chiefly served administration. Choice A captures that central revision."},{"id":"u1-l3-f1-02","lesson":3,"passage":"The common view holds that a language's writing system simply records its sounds. The Chinese script complicates this. Its characters encode meaning as much as sound, so speakers of mutually unintelligible spoken varieties can read the same text. Writing, in this case, does not merely transcribe speech; it operates on a partly independent plane of meaning.","unit":1,"correct":"B","choices":{"D":"Because Chinese characters encode sound so precisely, readers can always tell how a word is pronounced.","A":"Speakers of different Chinese varieties can read the same written text.","B":"Chinese script shows that writing can encode meaning independently of sound, unlike the common view that writing merely records speech.","C":"Writing systems are among humanity's most important cultural inventions."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok dar","why_wrong":{"D":"The passage says characters encode meaning as much as sound, not that they fix pronunciation; this reverses the point.","A":"Mutual readability is one illustration, a detail too narrow to be the main idea.","C":"The general importance of writing systems is broader than the passage's specific argument."},"choice_families":{"D":"Ters ilişki","A":"Çok dar","C":"Çok geniş"},"why_correct":"The passage challenges the view that writing merely records sound, using Chinese to show writing can carry meaning independently. Choice A states that central point.","lesson_name":"Central Ideas and Details"},{"correct":"C","unit":1,"passage":"Fungi are often pictured as lone decomposers breaking down dead matter. Yet beneath many forests, fungal threads link the roots of different trees into a shared network. Through it, trees trade sugars and warning signals, and older trees can channel resources to struggling seedlings. Far from solitary, these fungi weave a forest in
