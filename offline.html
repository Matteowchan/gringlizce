<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website">

<meta property="og:description" content="Çevrimdışı — Gri English">

<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{ --teal:#2C5856; --cream:#faf7ee; --ink:#1A2230; --muted:#6B6862; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--cream);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;text-align:center}
  .card{max-width:420px;width:100%}
  .ic{width:88px;height:88px;margin:0 auto 22px;border-radius:50%;background:rgba(44,88,86,.09);
    display:flex;align-items:center;justify-content:center;color:var(--teal)}
  .ic svg{width:42px;height:42px}
  .brand{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;margin-bottom:6px;color:var(--teal)}
  .brand .it{font-style:italic}
  h1{font-family:Georgia,serif;font-size:26px;margin:14px 0 8px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:24px}
  button{background:var(--teal);color:#F4EFE3;border:none;padding:13px 30px;border-radius:10px;
    font:600 14px Inter,sans-serif;cursor:pointer;transition:.15s}
  button:hover{background:#234948;transform:translateY(-1px)}
  .hint{margin-top:18px;font-size:12.5px;color:var(--muted)}
  @media(prefers-color-scheme:dark){
    body{background:#151210;color:#F1E9D9}
    .brand,.ic{color:#6FB6AF}.ic{background:#22322f}
    p,.hint{color:#B7AB96}
    button{background:#6FB6AF;color:#151210}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <div class="brand">Gri <span class="it">English</span></div>
    <h1>Çevrimdışısın</h1>
    <p>İnternet bağlantısı yok gibi görünüyor. Bağlantın geri geldiğinde kaldığın yerden devam edebilirsin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
    <div class="hint">Daha önce açtığın bazı sayfalar çevrimdışı da açılabilir.</div>
  </div>
  <script>
    window.addEventListener('online', function(){ location.reload(); });
  </script>
</body>
</html>
