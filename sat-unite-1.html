-l2-f1-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A school reports that its reading scores improved more than its math scores from 2019 to 2023.", "table": {"head": ["Subject", "2019", "2023"], "rows": [["Reading", "480", "540"], ["Math", "500", "530"], ["Science", "470", "495"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Math scores improved by a greater amount than reading scores over the period.", "B": "Reading scores reached a level of 540 points in the year 2023 at the school.", "C": "Reading scores rose by 60 points while math scores rose by only 30 points.", "D": "Science scores rose from 470 to 495 over the period from 2019 to 2023 at the school."}, "correct": "C", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares reading with math. The 60-point versus 30-point gain supports reading improving more.", "why_wrong": {"A": "This reverses the comparison; reading improved by more, not math.", "B": "A single 2023 reading figure gives no math comparison and cannot show reading improved more.", "D": "Science figures are real but the claim is about reading versus math, not science."}}, {"id": "u1-l2-f1-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A researcher claims that Treatment 1 lowered the infection rate more than Treatment 2.", "table": {"head": ["Group", "Before (%)", "After (%)"], "rows": [["Treatment 1", "40", "12"], ["Treatment 2", "38", "25"], ["Placebo", "41", "39"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Treatment 1 cut infection by 28 points while Treatment 2 cut it by only 13 points.", "B": "The placebo group's infection rate moved only slightly, from 41 percent to 39 percent.", "C": "Treatment 2 lowered the infection rate by a greater amount than Treatment 1 did.", "D": "Treatment 1 brought the infection rate down to a level of 12 percent after treatment."}, "correct": "A", "choice_families": {"B": "Dogru sayi yanlis is", "C": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares the two treatments. The 28-point versus 13-point drop supports Treatment 1 lowering it more.", "why_wrong": {"B": "The placebo figures are real but the claim concerns the two treatments, not the placebo.", "C": "This reverses the comparison; Treatment 1 lowered infection by more, not Treatment 2.", "D": "A single after-figure for Treatment 1, with nothing for Treatment 2, does not support the comparison."}}, {"id": "u1-l2-f1-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A city reports that its cycling trips grew more than its walking trips from 2016 to 2021.", "table": {"head": ["Mode", "2016 (thousands)", "2021 (thousands)"], "rows": [["Cycling", "20", "44"], ["Walking", "60", "78"], ["Driving", "200", "210"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Cycling trips reached a level of 44,000 per day in the year 2021 across the city.", "B": "Driving trips rose from 200,000 to 210,000 per day across the same five-year period.", "C": "Walking trips grew by a greater amount than cycling trips did over the period.", "D": "Cycling trips rose by 24,000 while walking rose by only 18,000 over the period."}, "correct": "D", "choice_families": {"A": "Kiyassiz tek deger", "B": "Dogru sayi yanlis is", "C": "Yon tersine cevrilmis"}, "why_correct": "The claim compares cycling with walking. The 24,000 versus 18,000 gain supports cycling growing more.", "why_wrong": {"A": "A single 2021 cycling figure gives no walking comparison and cannot show cycling grew more.", "B": "Driving figures are real but the claim concerns cycling versus walking, not driving.", "C": "This reverses the comparison; cycling trips grew by more, not walking."}}, {"id": "u1-l2-f1-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A study claims that Lake P lost more fish species than Lake Q between 2000 and 2020.", "table": {"head": ["Lake", "2000", "2020"], "rows": [["P", "24", "14"], ["Q", "30", "25"], ["R", "18", "17"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Lake R fell from 18 species to 17 species between the years 2000 and 2020.", "B": "Lake P was found to hold a total of 14 fish species by the year 2020.", "C": "Lake Q lost a greater number of species than Lake P did over the same period.", "D": "Lake P dropped by 10 species while Lake Q dropped by only 5 in the same period."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis"}, "why_correct": "The claim compares the two lakes. The loss of 10 against 5 species supports Lake P losing more.", "why_wrong": {"A": "Lake R's figures are real but the claim concerns Lakes P and Q, not R.", "B": "A single 2020 figure for Lake P, with none for Q, does not support the comparison.", "C": "This reverses the comparison; Lake P lost more species, not Lake Q."}}, {"id": "u1-l2-f1-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A company reports that its online sales grew more than its store sales from 2018 to 2023.", "table": {"head": ["Channel", "2018 (m USD)", "2023 (m USD)"], "rows": [["Online", "30", "90"], ["Store", "120", "150"], ["Catalog", "10", "13"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Catalog sales rose from 10 million to 13 million dollars over the same period.", "B": "Online sales reached a total of 90 million dollars in the year 2023 for the company.", "C": "Store sales grew by a greater amount than online sales did over the period.", "D": "Online sales rose by 60 million dollars while store sales rose by only 30 million."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis"}, "why_correct": "The claim compares online with store sales. The 60 million versus 30 million gain supports online growing more.", "why_wrong": {"A": "Catalog figures are real but the claim concerns online versus store, not catalog.", "B": "A single 2023 online total, with no store figure, does not show online grew more.", "C": "This reverses the comparison; online sales grew by more, not store sales."}}, {"id": "u1-l2-f1-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A researcher claims that City A's air quality improved more than City B's from 2015 to 2022, where lower PM2.5 means cleaner air.", "table": {"head": ["City", "2015 (ug/m3)", "2022 (ug/m3)"], "rows": [["A", "60", "30"], ["B", "55", "45"], ["C", "40", "38"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "City A's PM2.5 fell by 30 units while City B's fell by only 10 in the period.", "B": "City C's PM2.5 level fell from 40 to 38 units over the same period from 2015 to 2022.", "C": "City A brought its PM2.5 level down to a reading of 30 units by the year 2022.", "D": "City B's air quality improved by a greater amount than City A's over the period."}, "correct": "A", "choice_families": {"B": "Dogru sayi yanlis is", "C": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim compares the two cities. A drop of 30 against 10 units supports City A improving more.", "why_wrong": {"B": "City C's figures are real but the claim concerns Cities A and B, not C.", "C": "A single 2022 reading for City A, with none for B, does not support the comparison.", "D": "This reverses the comparison; City A improved by more, not City B."}}, {"id": "u1-l2-f2-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that in 2022, Factory A produced more units than Factory B.", "table": {"head": ["Factory", "2021 (thousands)", "2022 (thousands)"], "rows": [["A", "300", "420"], ["B", "350", "390"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Factory B produced a total of 350,000 units during the earlier year of 2021.", "B": "In 2022, Factory A produced 300,000 units, compared with 350,000 for Factory B.", "C": "In 2022, Factory A produced 420,000 units, more than Factory B's 390,000 units.", "D": "In 2022, Factory A produced a total of 420,000 units across all of its lines."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Satir sutun karisikligi", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is about 2022. Factory A's 420,000 against B's 390,000 supports A producing more that year.", "why_wrong": {"A": "The 350,000 figure is real but it is B's 2021 total, which the claim does not concern.", "B": "These are the 2021 figures, not 2022; the choice reads the wrong column.", "D": "A single 2022 figure for A, with none for B, does not support the comparison."}}, {"id": "u1-l2-f2-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A clinic reports that in 2020 it treated more adults than children.", "table": {"head": ["Group", "2019", "2020"], "rows": [["Adults", "1200", "1500"], ["Children", "900", "1100"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In 2020, the clinic treated 1,500 adults, more than the 1,100 children it treated.", "B": "In 2020, the clinic treated 1,200 adults, more than the 900 children it treated.", "C": "In 2020, the clinic treated a total of 1,500 adults across all of its departments.", "D": "In 2020, the clinic treated a greater number of children than it did adults."}, "correct": "A", "choice_families": {"B": "Satir sutun karisikligi", "C": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim is about 2020. The 1,500 adults against 1,100 children supports treating more adults that year.", "why_wrong": {"B": "These are the 2019 figures, not 2020; the choice reads the wrong column.", "C": "A single 2020 adult figure, with none for children, does not support the comparison.", "D": "This reverses the comparison; the clinic treated more adults, not more children."}}, {"id": "u1-l2-f2-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A survey claims that Country X had a higher urban literacy rate than Country Y.", "table": {"head": ["Country", "Urban (%)", "Rural (%)"], "rows": [["X", "96", "84"], ["Y", "88", "80"], ["Z", "91", "86"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Country X recorded an urban literacy rate of 96 percent among its city population.", "B": "Country X's urban literacy was 96 percent, higher than Country Y's rural rate of 80 percent.", "C": "Country Z recorded an urban literacy rate of 91 percent among its city population.", "D": "Country X's urban literacy was 96 percent, higher than Country Y's urban rate of 88 percent."}, "correct": "D", "choice_families": {"A": "Kiyassiz tek deger", "B": "Satir sutun karisikligi", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim is about urban rates. X's 96 percent against Y's urban 88 percent supports X being higher.", "why_wrong": {"A": "A single figure for X, with none for Y, does not support the comparison.", "B": "This compares X's urban rate to Y's rural rate; the claim concerns urban rates, so it reads the wrong column for Y.", "C": "The 91 percent figure is real but it is Country Z's, which the claim does not concern."}}, {"id": "u1-l2-f2-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that in the 2023 season, Team A scored more goals than Team B.", "table": {"head": ["Team", "2022", "2023"], "rows": [["A", "40", "55"], ["B", "48", "50"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In 2023, Team B scored a greater number of goals than Team A managed to score.", "B": "In 2023, Team A scored 55 goals, more than the 50 goals scored by Team B.", "C": "In 2023, Team A scored 40 goals, more than the 48 goals scored by Team B.", "D": "In 2023, Team A scored a total of 55 goals across all of its league matches."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Satir sutun karisikligi", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is about 2023. Team A's 55 goals against B's 50 supports A scoring more that season.", "why_wrong": {"A": "This reverses the comparison; Team A scored more, not Team B.", "C": "These are the 2022 figures, not 2023; the choice reads the wrong column.", "D": "A single 2023 figure for A, with none for B, does not support the comparison."}}, {"id": "u1-l2-f2-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that the southern region received more rainfall in summer than in winter.", "table": {"head": ["Region", "Winter (mm)", "Summer (mm)"], "rows": [["North", "200", "150"], ["South", "120", "260"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The northern region received a total of 200 mm of rainfall over the winter season.", "B": "The southern region received 200 mm in winter, more than the 150 mm it received in summer.", "C": "The southern region received 260 mm in summer, more than the 120 mm it received in winter.", "D": "The southern region received a total of 260 mm of rainfall over the summer season."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Satir sutun karisikligi", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is about the south. Its 260 mm in summer against 120 mm in winter supports more summer rain.", "why_wrong": {"A": "The 200 mm figure is real but it is the north's, which the claim does not concern.", "B": "The 200 and 150 figures are the northern region's; the choice reads the wrong row.", "D": "A single summer figure, with no winter figure, does not support the seasonal comparison."}}, {"id": "u1-l2-f2-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that in 2022, the premium plan had more subscribers than the basic plan.", "table": {"head": ["Plan", "2021 (thousands)", "2022 (thousands)"], "rows": [["Premium", "120", "140"], ["Basic", "110", "130"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In 2022, the premium plan had 120,000 subscribers, more than the basic plan's 110,000.", "B": "In 2022, the premium plan had 140,000 subscribers, more than the basic plan's 130,000.", "C": "In 2022, the premium plan reached a total of 140,000 subscribers across the service.", "D": "In 2022, the basic plan had a greater number of subscribers than the premium plan."}, "correct": "B", "choice_families": {"A": "Satir sutun karisikligi", "C": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim is about 2022. Premium's 140,000 against basic's 130,000 supports premium being larger that year.", "why_wrong": {"A": "These are the 2021 figures, not 2022; the choice reads the wrong column.", "C": "A single 2022 premium figure, with none for basic, does not support the comparison.", "D": "This reverses the comparison; the premium plan had more, not the basic plan."}}, {"id": "u1-l2-f2-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that the eastern branch earned a higher Q4 profit than the western branch.", "table": {"head": ["Branch", "Q3 (k USD)", "Q4 (k USD)"], "rows": [["East", "260", "300"], ["West", "240", "280"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In Q4, the eastern branch earned 300,000, more than the western branch's 280,000.", "B": "In Q3, the western branch earned a profit totaling 240,000 dollars for the quarter.", "C": "In Q4, the eastern branch earned a profit totaling 300,000 dollars for the quarter.", "D": "In Q4, the eastern branch earned 260,000, more than the western branch's 240,000."}, "correct": "A", "choice_families": {"B": "Dogru sayi yanlis is", "C": "Kiyassiz tek deger", "D": "Satir sutun karisikligi"}, "why_correct": "The claim is about Q4. East's 300,000 against west's 280,000 supports east earning more that quarter.", "why_wrong": {"B": "The 240,000 figure is real but it is west's Q3 profit, which the claim does not concern.", "C": "A single Q4 figure for east, with none for west, does not support the comparison.", "D": "These are the Q3 figures, not Q4; the choice reads the wrong column."}}, {"id": "u1-l2-f2-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A survey claims that Product X had a higher approval rating than Product Y among adults.", "table": {"head": ["Product", "Teens (%)", "Adults (%)"], "rows": [["X", "90", "88"], ["Y", "84", "76"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Among adults, Product X had 90 percent approval, higher than Product Y's 84 percent.", "B": "Among adults, Product X had 88 percent approval, higher than Product Y's 76 percent.", "C": "Among adults, Product Y reached a higher approval rating than Product X did.", "D": "Among adults, Product X reached an approval rating of 88 percent in the survey."}, "correct": "B", "choice_families": {"A": "Satir sutun karisikligi", "C": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is about adults. X's 88 percent against Y's 76 percent supports X being higher among adults.", "why_wrong": {"A": "The 90 and 84 figures are the teen ratings; the choice reads the wrong column.", "C": "This reverses the comparison; Product X was higher among adults, not Product Y.", "D": "A single adult figure for X, with none for Y, does not support the comparison."}}, {"id": "u1-l2-f2-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that in 2021, the online store shipped more orders than the phone line.", "table": {"head": ["Channel", "2020 (thousands)", "2021 (thousands)"], "rows": [["Online", "500", "650"], ["Phone", "400", "420"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In 2021, the phone line shipped a greater number of orders than the online store.", "B": "In 2021, the online store shipped 500,000 orders, more than the phone line's 400,000.", "C": "In 2021, the online store shipped 650,000 orders, more than the phone line's 420,000.", "D": "In 2021, the online store shipped a total of 650,000 orders to its customers."}, "correct": "C", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Satir sutun karisikligi", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is about 2021. Online's 650,000 against phone's 420,000 supports online shipping more that year.", "why_wrong": {"A": "This reverses the comparison; the online store shipped more, not the phone line.", "B": "These are the 2020 figures, not 2021; the choice reads the wrong column.", "D": "A single 2021 online figure, with none for the phone line, does not support the comparison."}}, {"id": "u1-l2-f2-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satir sutun karisikligi", "passage": "A report claims that the evening class had higher attendance than the morning class in the spring term.", "table": {"head": ["Class", "Fall (%)", "Spring (%)"], "rows": [["Morning", "70", "78"], ["Evening", "85", "90"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "In spring, the evening class reached an attendance level of 90 percent for the term.", "B": "In spring, the evening class had 85 percent attendance, higher than the morning class's 70 percent.", "C": "In spring, the evening class had 90 percent attendance, higher than the morning class's 78 percent.", "D": "In the fall, the morning class reached an attendance level of 70 percent for the term."}, "correct": "C", "choice_families": {"A": "Kiyassiz tek deger", "B": "Satir sutun karisikligi", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is about spring. Evening's 90 percent against morning's 78 percent supports evening being higher that term.", "why_wrong": {"A": "A single spring figure for the evening class, with none for morning, does not support the comparison.", "B": "The 85 and 70 figures are the fall figures; the choice reads the wrong column.", "D": "The 70 percent figure is real but it is the morning class's fall figure, which the claim does not concern."}}, {"id": "u1-l2-f3-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A store reports that its monthly revenue rose after it moved to a new location.", "table": {"head": ["Item", "Old location (k USD)", "New location (k USD)"], "rows": [["Revenue", "80", "110"], ["Marketing", "20", "25"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Revenue fell from 110,000 at the old location to 80,000 at the new location.", "B": "Revenue rose from 80,000 at the old location to 110,000 at the new location.", "C": "Revenue at the new location reached a monthly total of 110,000 dollars.", "D": "Marketing spending rose from 20,000 to 25,000 dollars after the store moved."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that revenue rose. The 80,000 to 110,000 increase after the move supports it.", "why_wrong": {"A": "This reverses the direction; the table shows revenue rose from 80 to 110, not the reverse.", "C": "A single new-location figure gives no before value, so it does not show revenue rose.", "D": "Marketing spending is real but the claim is about revenue, not marketing."}}, {"id": "u1-l2-f3-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "An institute reports that enrollment increased after its new program launched.", "table": {"head": ["Item", "Before", "After"], "rows": [["Enrollment", "320", "410"], ["Staff", "15", "18"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Enrollment fell from 410 students before the launch to 320 students after it.", "B": "Enrollment rose from 320 students before the launch to 410 students after it.", "C": "Enrollment after the launch of the program reached a total of 410 students.", "D": "Staff numbers rose from 15 to 18 over the same period as the new launch."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that enrollment increased. The rise from 320 to 410 after the launch supports it.", "why_wrong": {"A": "This reverses the direction; enrollment rose from 320 to 410, not the reverse.", "C": "A single after-figure gives no before value, so it does not show enrollment increased.", "D": "Staff numbers are real but the claim is about enrollment, not staffing."}}, {"id": "u1-l2-f3-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that a glacier's area shrank between 1990 and 2020.", "table": {"head": ["Item", "1990", "2020"], "rows": [["Glacier area (km2)", "48", "31"], ["Snowfall (mm)", "200", "190"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The glacier shrank from 48 square kilometers in 1990 to 31 square in 2020.", "B": "The glacier covered an area of 31 square kilometers as measured in the year 2020.", "C": "The glacier grew from 31 square kilometers in 1990 to 48 square kilometers in 2020.", "D": "Snowfall fell from 200 to 190 millimeters over the same period from 1990 to 2020."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that the glacier shrank. The fall from 48 to 31 square kilometers supports it.", "why_wrong": {"B": "A single 2020 area gives no 1990 value, so it does not show the glacier shrank.", "C": "This reverses the direction and the years; the glacier shrank from 48 to 31, not the reverse.", "D": "Snowfall is real but the claim is about glacier area, not snowfall."}}, {"id": "u1-l2-f3-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A city reports that transit use rose after fares were lowered.", "table": {"head": ["Item", "Before", "After"], "rows": [["Daily rides (thousands)", "90", "130"], ["Fleet", "40", "42"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The bus fleet grew from 40 to 42 vehicles over the same period as the cut.", "B": "Daily rides after the fare cut reached a level of 130,000 across the city.", "C": "Daily rides rose from 90,000 before the fare cut to 130,000 after it.", "D": "Daily rides fell from 130,000 before the fare cut to 90,000 after it."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim is that transit use rose. The rise from 90,000 to 130,000 after the cut supports it.", "why_wrong": {"A": "Fleet size is real but the claim is about ridership, not the number of vehicles.", "B": "A single after-figure gives no before value, so it does not show transit use rose.", "D": "This reverses the direction; rides rose from 90 to 130, not the reverse."}}, {"id": "u1-l2-f3-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A hospital reports that average wait time fell after a new system was installed.", "table": {"head": ["Item", "Before", "After"], "rows": [["Wait time (min)", "22", "9"], ["Staff on duty", "8", "8"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Average wait fell from 22 minutes before the new system to 9 minutes after it.", "B": "Average wait after the new system settled at a level of 9 minutes per patient.", "C": "Average wait rose from 9 minutes before the new system to 22 minutes after it.", "D": "Staff on duty held steady at 8 people both before and after the new system."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that wait time fell. The drop from 22 to 9 minutes after the system supports it.", "why_wrong": {"B": "A single after-figure gives no before value, so it does not show wait time fell.", "C": "This reverses the direction; wait fell from 22 to 9, not the reverse.", "D": "Staffing is real but the claim is about wait time, not staff numbers."}}, {"id": "u1-l2-f3-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that the bird population grew after a wetland was restored.", "table": {"head": ["Item", "Before", "After"], "rows": [["Bird count", "140", "260"], ["Frog count", "30", "34"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The bird count fell from 260 before the restoration to 140 after it was done.", "B": "The bird count after the restoration reached a total of 260 individual birds.", "C": "The frog count rose from 30 to 34 over the same period as the restoration.", "D": "The bird count rose from 140 before the restoration to 260 after it was done."}, "correct": "D", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim is that the bird population grew. The rise from 140 to 260 after restoration supports it.", "why_wrong": {"A": "This reverses the direction; the bird count rose from 140 to 260, not the reverse.", "B": "A single after-figure gives no before value, so it does not show the population grew.", "C": "The frog count is real but the claim is about birds, not frogs."}}, {"id": "u1-l2-f3-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A school reports that test scores improved after a tutoring program began.", "table": {"head": ["Item", "Before", "After"], "rows": [["Average score", "62", "79"], ["Absences", "12", "10"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Absences fell from 12 to 10 over the same term as the tutoring program.", "B": "The average score rose from 62 before the tutoring to 79 after it began.", "C": "The average score dropped from 79 before the tutoring to 62 after it began.", "D": "The average score after the tutoring settled at a level of 79 points overall."}, "correct": "B", "choice_families": {"A": "Dogru sayi yanlis is", "C": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is that scores improved. The rise from 62 to 79 after tutoring supports it.", "why_wrong": {"A": "Absences are real but the claim is about scores, not attendance.", "C": "This reverses the direction; the score rose from 62 to 79, not the reverse.", "D": "A single after-figure gives no before value, so it does not show scores improved."}}, {"id": "u1-l2-f3-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that household energy use fell after insulation was added.", "table": {"head": ["Item", "Before", "After"], "rows": [["Energy (kWh/month)", "900", "640"], ["Water (units)", "12", "12"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Water use held steady at 12 units both before and after the insulation was added.", "B": "Energy use rose from 640 kWh before the insulation to 900 kWh after it was added.", "C": "Energy use after the insulation settled at a level of 640 kWh in a month.", "D": "Energy use fell from 900 kWh before the insulation to 640 kWh after it was added."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger"}, "why_correct": "The claim is that energy use fell. The drop from 900 to 640 kWh after insulation supports it.", "why_wrong": {"A": "Water use is real but the claim is about energy, not water.", "B": "This reverses the direction; energy use fell from 900 to 640, not the reverse.", "C": "A single after-figure gives no before value, so it does not show energy use fell."}}, {"id": "u1-l2-f3-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A firm reports that its debt decreased between 2018 and 2023.", "table": {"head": ["Item", "2018 (m USD)", "2023 (m USD)"], "rows": [["Debt", "240", "150"], ["Revenue", "300", "360"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Debt rose from 150 million dollars in 2018 to 240 million dollars in 2023.", "B": "Debt fell from 240 million dollars in 2018 to 150 million dollars in 2023.", "C": "Debt in the year 2023 stood at a recorded level of 150 million dollars.", "D": "Revenue rose from 300 million to 360 million dollars over the same period."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that debt decreased. The fall from 240 to 150 million supports it.", "why_wrong": {"A": "This reverses the direction and years; debt fell from 240 to 150, not the reverse.", "C": "A single 2023 figure gives no 2018 value, so it does not show debt decreased.", "D": "Revenue is real but the claim is about debt, not revenue."}}, {"id": "u1-l2-f3-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that coral cover increased after fishing was banned on a reef.", "table": {"head": ["Item", "Before", "After"], "rows": [["Coral cover (%)", "22", "41"], ["Fish species", "18", "26"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Coral cover rose from 22 percent before the ban to 41 percent after it took effect.", "B": "Coral cover after the ban settled at a recorded level of 41 percent of the reef.", "C": "Coral cover fell from 41 percent before the ban to 22 percent after it took effect.", "D": "The number of fish species rose from 18 to 26 over the same period as the ban."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that coral cover increased. The rise from 22 to 41 percent after the ban supports it.", "why_wrong": {"B": "A single after-figure gives no before value, so it does not show coral cover increased.", "C": "This reverses the direction; coral cover rose from 22 to 41, not the reverse.", "D": "Fish species count is real but the claim is about coral cover, not fish."}}, {"id": "u1-l2-f4-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that Store A had higher sales than Store B in 2023.", "table": {"head": ["Store", "2023 sales (k USD)"], "rows": [["A", "480"], ["B", "350"], ["C", "410"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Store C recorded 410,000 dollars in total sales during the 2023 calendar year.", "B": "Store B recorded higher total sales than Store A during the 2023 calendar year.", "C": "Store A recorded 480,000 dollars in sales, more than Store B's 350,000 dollars.", "D": "Store A recorded 480,000 dollars in total sales during the 2023 calendar year."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares A with B. Only the choice giving 480,000 against 350,000 supports A being higher.", "why_wrong": {"A": "Store C's figure is real but the claim concerns A and B, not C.", "B": "This reverses the comparison; Store A had higher sales, not Store B.", "D": "This gives only Store A's figure, with none for B, so it does not show A was higher."}}, {"id": "u1-l2-f4-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A trial claims that the new fertilizer produced a higher yield than the standard one.", "table": {"head": ["Fertilizer", "Yield (t/ha)", "Cost (per ha)"], "rows": [["New", "6.4", "40"], ["Standard", "4.9", "30"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The new fertilizer cost 40 dollars per hectare to apply across the trial fields.", "B": "The standard fertilizer produced a higher yield than the new fertilizer did.", "C": "The new fertilizer yielded 6.4 tons per hectare, more than the standard's 4.9 tons.", "D": "The new fertilizer yielded 6.4 tons per hectare across the fields in the trial."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares the two fertilizers. The 6.4 against 4.9 tons supports the new one yielding more.", "why_wrong": {"A": "Cost is real but the claim is about yield, not cost.", "B": "This reverses the comparison; the new fertilizer yielded more, not the standard.", "D": "This gives only the new fertilizer's yield, with none for the standard, so it shows no comparison."}}, {"id": "u1-l2-f4-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the morning shift completed more tasks than the night shift.", "table": {"head": ["Shift", "Tasks completed"], "rows": [["Morning", "220"], ["Night", "160"], ["Evening", "190"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The morning shift completed 220 tasks, more than the night shift's 160 tasks.", "B": "The night shift completed a greater number of tasks than the morning shift.", "C": "The evening shift completed a total of 190 tasks over the course of the day.", "D": "The morning shift completed a total of 220 tasks over the course of the day."}, "correct": "A", "choice_families": {"B": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares morning with night. The 220 against 160 tasks supports morning completing more.", "why_wrong": {"B": "This reverses the comparison; the morning shift completed more, not the night shift.", "C": "The evening figure is real but the claim concerns morning and night, not evening.", "D": "This gives only the morning figure, with none for night, so it shows no comparison."}}, {"id": "u1-l2-f4-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that in 2022, City A had a larger population than City B.", "table": {"head": ["City", "2022 population (thousands)"], "rows": [["A", "640"], ["B", "520"], ["C", "580"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "City C's population was recorded at 580,000 people in the year 2022.", "B": "City A's population was recorded at 640,000 people in the year 2022.", "C": "City B had a larger population than City A did in the year 2022.", "D": "City A's population was 640,000, larger than City B's population of 520,000."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis"}, "why_correct": "The claim compares A with B. The 640,000 against 520,000 supports A being larger.", "why_wrong": {"A": "City C's figure is real but the claim concerns A and B, not C.", "B": "This gives only City A's figure, with none for B, so it shows no comparison.", "C": "This reverses the comparison; City A was larger, not City B."}}, {"id": "u1-l2-f4-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A trial claims that the treated group had fewer relapses than the control group.", "table": {"head": ["Group", "Relapse (%)", "Dropout (%)"], "rows": [["Treated", "14", "5"], ["Control", "33", "6"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The treated group's relapse rate was 14 percent, lower than the control's 33.", "B": "The control group had fewer relapses than the treated group over the trial.", "C": "The treated group had a relapse rate of 14 percent over the course of the trial.", "D": "The control group had a dropout rate of 6 percent over the course of the trial."}, "correct": "A", "choice_families": {"B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares treated with control. The 14 against 33 percent supports the treated group having fewer.", "why_wrong": {"B": "This reverses the comparison; the treated group had fewer relapses, not the control.", "C": "This gives only the treated group's rate, with none for control, so it shows no comparison.", "D": "The dropout rate is real but the claim is about relapses, not dropouts."}}, {"id": "u1-l2-f4-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the east campus enrolled more students than the west campus.", "table": {"head": ["Campus", "Enrollment"], "rows": [["East", "1800"], ["West", "1300"], ["North", "1500"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The west campus enrolled a greater number of students than the east campus.", "B": "The east campus enrolled 1,800 students, more than the west campus's 1,300.", "C": "The north campus enrolled a total of 1,500 students for the academic year.", "D": "The east campus enrolled a total of 1,800 students for the academic year."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares east with west. The 1,800 against 1,300 supports east enrolling more.", "why_wrong": {"A": "This reverses the comparison; the east campus enrolled more, not the west.", "C": "The north figure is real but the claim concerns east and west, not north.", "D": "This gives only the east figure, with none for west, so it shows no comparison."}}, {"id": "u1-l2-f4-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A test claims that Model X was more fuel-efficient than Model Y, where higher km/L is better.", "table": {"head": ["Model", "Fuel economy (km/L)"], "rows": [["X", "18"], ["Y", "13"], ["Z", "15"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Model Z achieved a fuel economy of 15 kilometers per liter in the road test.", "B": "Model Y achieved a better fuel economy than Model X did in the road test.", "C": "Model X achieved a fuel economy of 18 kilometers per liter in the road test.", "D": "Model X achieved 18 km per liter, better than Model Y's 13 km per liter."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger"}, "why_correct": "The claim compares X with Y. The 18 against 13 km/L supports X being more efficient.", "why_wrong": {"A": "Model Z's figure is real but the claim concerns X and Y, not Z.", "B": "This reverses the comparison; Model X was more efficient, not Model Y.", "C": "This gives only Model X's figure, with none for Y, so it shows no comparison."}}, {"id": "u1-l2-f4-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the winter crop earned more revenue than the summer crop.", "table": {"head": ["Crop", "Revenue (k USD)"], "rows": [["Winter", "210"], ["Summer", "150"], ["Spring", "180"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The spring crop earned a total of 180,000 dollars over the course of the season.", "B": "The summer crop earned a greater amount of revenue than the winter crop did.", "C": "The winter crop earned 210,000 dollars, above the summer crop's 150,000.", "D": "The winter crop earned a total of 210,000 dollars over the course of the season."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares winter with summer. The 210,000 against 150,000 supports winter earning more.", "why_wrong": {"A": "The spring figure is real but the claim concerns winter and summer, not spring.", "B": "This reverses the comparison; the winter crop earned more, not the summer crop.", "D": "This gives only the winter figure, with none for summer, so it shows no comparison."}}, {"id": "u1-l2-f4-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A study claims that Method 1 detected more cases than Method 2.", "table": {"head": ["Method", "Cases detected", "False positives"], "rows": [["Method 1", "340", "12"], ["Method 2", "260", "20"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Method 1 detected a total of 340 cases over the full course of the study.", "B": "Method 1 detected 340 cases, more than the 260 cases detected by Method 2.", "C": "Method 2 produced a total of 20 false positives over the course of the study.", "D": "Method 2 detected a greater number of cases than Method 1 did in the study."}, "correct": "B", "choice_families": {"A": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim compares the two methods. The 340 against 260 cases supports Method 1 detecting more.", "why_wrong": {"A": "This gives only Method 1's count, with none for Method 2, so it shows no comparison.", "C": "The false-positive figure is real but the claim is about cases detected, not false positives.", "D": "This reverses the comparison; Method 1 detected more, not Method 2."}}, {"id": "u1-l2-f4-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the renovated library had more visitors than the unrenovated branch.", "table": {"head": ["Site", "Weekly visitors"], "rows": [["Renovated", "2400"], ["Unrenovated", "1600"], ["Mobile", "900"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The unrenovated branch had a greater number of visitors than the renovated one.", "B": "The renovated library had a total of 2,400 visitors over the course of a week.", "C": "The mobile unit had a total of 900 visitors over the course of a single week.", "D": "The renovated library had 2,400 weekly visitors, more than the branch's 1,600."}, "correct": "D", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim compares the renovated library with the unrenovated branch. The 2,400 against 1,600 supports it.", "why_wrong": {"A": "This reverses the comparison; the renovated library had more visitors, not the unrenovated branch.", "B": "This gives only the renovated figure, with none for the unrenovated branch, so it shows no comparison.", "C": "The mobile unit's figure is real but the claim concerns the two libraries, not the mobile unit."}}]}, {"no": 3, "name": "Central Ideas and Details", "teaching": {"ne_olculuyor": ["Bu ders iki ayrı soru tipini kapsar ve öğrenciler bunları karıştırır.", "ANA FİKİR sorusu metnin tamamını özetlemeni ister. Cevap metnin herhangi bir cümlesinde tek başına durmaz, metnin bütününden çıkar.", "DETAY sorusu tek bir olguyu sorar. Cevap metinde açıkça yazar. Metni tarar, bulur, işaretlersin.", "Soru köküne bakıp hangisi olduğunu anlamak zorundasın. Yanlış tipe çalışırsan yanlış yerde ararsın."], "karar_proseduru": ["Soru kokunu oku ve tipi belirle.  Main idea mı, detay mı. Bu ikisi farklı okuma gerektirir.", "Detay sorusuysa anahtar kelimeyi bul ve metinde ara.  Anahtar kelime genelde bir özel isim, bir sayı ya da bir terim. Metinde onu bul, etrafındaki cümleyi oku.", "Ana fikir sorusuysa metnin YÖNÜNÜ bul.  Metin bir iddia mı kuruyor, bir yanlışı mı düzeltiyor, iki görüşü mu karşılaştırıyor. Yön bulununca doğru şık kendini gösterir.", "Kendi cümleni kur, sonra şıklara bak.  Şıklardan önce kendi özetini yap. Yoksa ilk makul şık seni yakalar.", "Her şıkkı metne karşı test et.  Sorma: bu doğru mu. Sor: bu METİNDE var mı ve SORULANI cevaplıyor mu."], "celdirici_aileleri": [{"ad": "Çok dar", "tanim": "Metindeki gerçek bir detayı ana fikir diye sunar. Cümle doğru, ama metnin tamamını temsil etmiyor. En sık düşülen tuzak. Öğrenci metinde gördüğü bir cümleyi tanıyıp işaretler."}, {"ad": "Çok geniş", "tanim": "Metnin desteklediği şeyden fazlasını iddia eder. Genelde all, every, always, never kelimeleri taşır. Metin bir türden bahsediyorsa şık bütün türlere genelliyor demektir."}, {"ad": "Doğru ama alakasız", "tanim": "İfade doğrudur, hatta metinle uyumludur, ama SORULAN şey değildir. Bu tuzak için tek savunma soru köküne geri dönmektir."}, {"ad": "Ters ilişki", "tanim": "Metnin kelimelerini kullanır ama sebep ile sonucu, ya da iki tarafı yer değiştirir. Kelimeler tanıdık geldiği için doğru hissettirir. İlişkiyi kontrol et, kelimeleri değil."}], "top_tips": ["But, however, yet, although kelimelerinden SONRA gelen cümle genelde metnin asıl iddiasını taşır. Öncesi hazırlıktır. Ana fikir sorusunda önce oraya bak.", "Detay sorusunda şık metindeki kelimeyi aynen tekrarlıyorsa şüphelen. SAT doğru cevabı PARAFRAZ eder, çeldiriciyi kopyalar.", "İki şık birbirinin tersiyse doğru cevap genelde o ikisinden biridir. Üçüncü ve dördüncü şıkkı önce ele.", "Ana fikir sorusunda şıkkın fiiline bak. It describes, it argues, it contradicts. Fiil metnin yaptığı İŞİ doğru adlandırıyor mu."]}, "families": ["Cok dar", "Cok genis", "Dogru ama alakasiz", "Ters iliski"], "fam_short": {"Cok dar": "Cok dar", "Cok genis": "Cok genis", "Dogru ama alakasiz": "Alakasiz", "Ters iliski": "Ters iliski"}, "main_ids": ["u1-l3-f1-01", "u1-l3-f2-01", "u1-l3-f3-01", "u1-l3-f4-01"], "questions": [{"id": "u1-l3-f1-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The mechanical clock reshaped medieval life. Once towns installed public clocks, work, prayer, and markets came to follow fixed hours rather than the loose rhythm of daylight. Merchants scheduled deliveries and guilds set precise workdays. The device did more than measure time; it reorganized how communities lived.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The mechanical clock reorganized medieval daily life around fixed hours.", "B": "Every part of medieval society was completely controlled by the mechanical clock.", "C": "Setting fixed working hours is what led towns to install public mechanical clocks.", "D": "Merchants used the mechanical clock to schedule their deliveries around the town."}, "correct": "A", "choice_families": {"B": "Cok genis", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The text's central point is that the clock reorganized communal life around fixed hours, which this captures.", "why_wrong": {"B": "The text never claims the clock completely controlled every part of society; that overstates it.", "C": "The text says clocks led to fixed hours, not the reverse. The relationship is flipped.", "D": "Scheduling deliveries is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Bees do more than make honey. As they move between flowers gathering nectar, they transfer pollen, letting plants reproduce. Many crops people rely on, from apples to almonds, depend on this pollination. The insect's role in agriculture far outweighs its output of honey.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Bees gather nectar as they move between different flowers.", "B": "All plants on Earth would die at once without bees to pollinate them.", "C": "Plants transfer pollen to bees, allowing the bees themselves to reproduce.", "D": "Bees matter to agriculture chiefly by pollinating the crops people rely on."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Ters iliski"}, "why_correct": "The central point is that bees matter to agriculture mainly through pollination, which this captures.", "why_wrong": {"A": "Gathering nectar is one detail, too narrow to be the main idea.", "B": "The text does not claim all plants would die; that overstates its point.", "C": "The text says bees transfer pollen so plants reproduce, not the reverse. The sides are swapped."}}, {"id": "u1-l3-f1-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The printing press did not simply speed up copying. By making books cheap and plentiful, it let ideas spread across borders faster than authorities could control. Reformers and scientists reached wide audiences, and new ideas took hold in places their authors never visited. The press turned isolated thinkers into movements.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The printing press instantly ended all control over information everywhere.", "B": "By making books cheap, the press let ideas spread and form movements.", "C": "The printing press made books cheaper to produce than before.", "D": "The spread of ideas across borders is what made books cheap and plentiful."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that cheap books let ideas spread and become movements, which this captures.", "why_wrong": {"A": "The text does not claim all control ended instantly and everywhere; that overstates it.", "C": "Cheaper books is one detail, too narrow to be the main idea.", "D": "The text says cheap books caused ideas to spread, not the reverse. The relationship is flipped."}}, {"id": "u1-l3-f1-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Coral reefs support a quarter of all marine species despite covering less than one percent of the ocean floor. Their structures give fish shelter, spawning grounds, and hunting sites. When reefs die, the species that depend on them scatter or vanish. The reef is the foundation of an entire underwater community.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Coral reefs are essential because they sustain a vast marine community.", "B": "Every single fish in the ocean lives its whole life on a coral reef.", "C": "Coral reefs cover less than one percent of the ocean floor.", "D": "The marine species living on a reef are what build the reef's structure."}, "correct": "A", "choice_families": {"B": "Cok genis", "C": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that reefs sustain a huge marine community, which this captures.", "why_wrong": {"B": "The text does not claim every fish lives on a reef; that overstates it.", "C": "The reef's small area is one detail, too narrow to be the main idea.", "D": "The text says the reef shelters the species, not that the species build the reef. The sides are swapped."}}, {"id": "u1-l3-f1-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Sleep is not merely rest. During deep sleep, the brain consolidates memories, clearing the day's clutter and strengthening what matters. People who sleep after learning retain far more than those who stay awake. Far from idle, the sleeping brain is doing some of its most important work.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "People who sleep after learning retain more than those who stay awake.", "B": "Strengthening memories during the day is what causes the brain to enter deep sleep.", "C": "Sleep is the only thing that determines how well anyone remembers anything.", "D": "Sleep plays an active role in strengthening memory rather than being mere rest."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Ters iliski", "C": "Cok genis"}, "why_correct": "The central point is that sleep actively strengthens memory, which this captures.", "why_wrong": {"A": "The study result is one supporting detail, too narrow to be the main idea.", "B": "The text says sleep strengthens memory, not that daytime memory work causes sleep. The order is flipped.", "C": "The text does not claim sleep is the only factor; that overstates it."}}, {"id": "u1-l3-f1-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The Silk Road carried more than goods. Along with silk and spices, travelers exchanged languages, religions, and technologies across thousands of miles. Ideas about mathematics and medicine moved between distant civilizations that never met directly. Its lasting importance lay less in trade than in the mixing of cultures it made possible.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The Silk Road connected every civilization that has ever existed on Earth.", "B": "Silk and spices were among the goods carried along the Silk Road.", "C": "The mixing of distant cultures is what created the Silk Road trade routes.", "D": "The Silk Road mattered most for its exchange of ideas and cultures."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Ters iliski"}, "why_correct": "The central point is that the route's importance lay in cultural exchange, which this captures.", "why_wrong": {"A": "The text does not claim it connected every civilization ever; that overstates it.", "B": "Silk and spices are one detail, too narrow to be the main idea.", "C": "The text says the trade route enabled cultural mixing, not the reverse. The relationship is flipped."}}, {"id": "u1-l3-f1-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Volcanic ash can devastate crops in the short term, but over centuries it enriches soil. As ash breaks down, it releases minerals that plants need, making land near old volcanoes remarkably fertile. Farmers have long settled such regions despite the risk. The same force that destroys can, in time, sustain.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Volcanic ash can devastate crops in the short term.", "B": "All of the fertile soil in the world comes only from volcanic ash.", "C": "Volcanic ash harms crops at first but over time makes soil fertile.", "D": "Fertile soil near volcanoes is what produces the volcanic ash itself."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Cok genis", "D": "Ters iliski"}, "why_correct": "The central point is the shift from short-term harm to long-term fertility, which this captures.", "why_wrong": {"A": "Short-term harm is only half the point, too narrow to be the main idea.", "B": "The text does not claim all fertile soil comes from ash; that overstates it.", "D": "The text says ash enriches soil, not that fertile soil produces ash. The relationship is flipped."}}, {"id": "u1-l3-f1-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "One novelist kept revising her opening chapter, not because it was weak, but because it set the tone for everything after. A first chapter, she believed, teaches readers how to read the rest of the book. Get it wrong, and the reader misreads what follows. For her, the opening was a set of instructions.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The novelist saw the opening chapter as shaping the whole reading.", "B": "How readers understand a book is what determines how its opening is written.", "C": "Every novel ever written depends entirely on its very first chapter.", "D": "The novelist revised her opening chapter many times over."}, "correct": "A", "choice_families": {"B": "Ters iliski", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that the opening shapes how readers read the whole book, which this captures.", "why_wrong": {"B": "The text says the opening shapes the reading, not the reverse. The relationship is flipped.", "C": "The text does not claim every novel depends entirely on its first chapter; that overstates it.", "D": "That she revised often is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Urban trees do quiet work. Their leaves trap dust, their shade cools streets by several degrees, and their roots absorb storm water that would otherwise flood drains. City planners once treated trees as decoration. Increasingly, they are seen as essential infrastructure, as vital as pipes and roads.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The city's pipes and roads are what produce the cooling and cleaning trees do.", "B": "Urban trees are now valued as essential city infrastructure, not mere decoration.", "C": "Trees by themselves can solve every environmental problem a city faces.", "D": "The leaves of urban trees trap dust from the air."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that trees are now seen as vital infrastructure, which this captures.", "why_wrong": {"A": "The text credits the trees with the cooling and cleaning, not the pipes and roads. The sides are swapped.", "C": "The text does not claim trees solve every problem; that overstates it.", "D": "Trapping dust is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The discovery of penicillin was partly luck. A mold drifted into a forgotten dish and killed the bacteria around it. But luck alone was not enough; it took a trained eye to notice the clear ring and grasp its meaning. Chance opened the door, but preparation walked through it.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Every scientific discovery in all of history has happened purely by accident.", "B": "A mold drifted into a forgotten laboratory dish.", "C": "A trained eye is what caused the mold to drift into the dish.", "D": "Penicillin's discovery required both chance and a prepared, observant mind."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Ters iliski"}, "why_correct": "The central point is that discovery took both luck and a prepared mind, which this captures.", "why_wrong": {"A": "The text does not claim every discovery is accidental; that overstates it.", "B": "The drifting mold is one detail, too narrow to be the main idea.", "C": "The text says chance brought the mold, not that the observer caused it. The relationship is flipped."}}, {"id": "u1-l3-f2-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Regular exercise benefits the brain as well as the body. Physical activity increases blood flow to the brain and prompts the release of chemicals that support memory and mood. People who exercise often report clearer thinking and steadier emotions. The gains are real, though they vary from person to person.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Exercise increases blood flow to the brain.", "B": "Exercise also strengthens the muscles and bones of the body.", "C": "Regular exercise supports brain function, improving memory and mood for many people.", "D": "Exercise instantly cures every mental and emotional problem in absolutely everyone."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that exercise supports the brain for many people, which this captures.", "why_wrong": {"A": "Increased blood flow is one detail, too narrow to be the main idea.", "B": "Strengthening muscles is true and consistent, but it is not the brain-focused point the question asks about.", "D": "The text calls the gains real but varying; claiming an instant cure for everyone overstates it."}}, {"id": "u1-l3-f2-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Learning a second language reshapes the brain in measurable ways. Bilingual people often show greater skill at switching between tasks and ignoring distractions. Researchers link these gains to the constant effort of choosing between two languages. The advantages are modest but consistent across many studies.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Speaking two languages brings modest but consistent gains in mental control.", "B": "Many languages share words that were borrowed from one another.", "C": "Bilingual people are far smarter than everyone who speaks only a single language.", "D": "Bilingual people switch between two languages when they speak."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is the modest but consistent mental gains from bilingualism, which this captures.", "why_wrong": {"B": "Shared borrowed words may be true, but it is not the point about mental control the question asks about.", "C": "The text calls the gains modest; claiming bilinguals are far smarter than everyone overstates it.", "D": "Switching between languages is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f2-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "The Amazon rainforest influences weather far beyond its borders. Moisture rising from its trees forms clouds that carry rain to distant farmland. When large areas are cleared, rainfall patterns shift hundreds of miles away. The forest is part of a system that spans a continent.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The Amazon shapes weather across a whole continent, not just in its own region.", "B": "The Amazon is home to countless different species of insects.", "C": "Moisture rises from the trees of the Amazon.", "D": "The Amazon rainforest single-handedly controls all of the weather on the planet."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that the Amazon shapes weather across a continent, which this captures.", "why_wrong": {"B": "The Amazon's insect life is true but not the weather point the question asks about.", "C": "Rising moisture is one detail, too narrow to be the main idea.", "D": "The text describes continental influence; claiming it controls all weather on Earth overstates it."}}, {"id": "u1-l3-f2-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Ancient Roman roads were built to last. Engineers layered stone, gravel, and sand so that water drained away instead of pooling and cracking the surface. Some of these roads still bear traffic today. Their durability came not from luck but from careful design suited to the land.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Roman roads endured because of careful, well-drained engineering, not chance.", "B": "The Roman Empire spanned much of Europe and North Africa.", "C": "Roman roads were made from stone, gravel, and sand.", "D": "Every road in the modern world is built in exactly the same way as a Roman road."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that Roman roads lasted due to careful engineering, which this captures.", "why_wrong": {"B": "The empire's size is true but not the engineering point the question asks about.", "C": "The materials are one detail, too narrow to be the main idea.", "D": "The text does not claim all modern roads copy Roman ones; that overstates it."}}, {"id": "u1-l3-f2-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "A good museum label does more than name an object. It tells visitors why the object matters, what to notice, and how it connects to a larger story. A well-written label can turn a glance into genuine understanding. The best ones guide without lecturing.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Museum labels name the objects on display.", "B": "A single museum label can teach a visitor absolutely everything about all of history.", "C": "A good museum label deepens understanding by explaining an object's meaning and links.", "D": "Many museums charge an entrance fee to their visitors."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Cok genis", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that a good label builds understanding, which this captures.", "why_wrong": {"A": "Naming objects is one detail, too narrow to be the main idea.", "B": "The text describes deepened understanding; claiming a label teaches all of history overstates it.", "D": "Entrance fees are true but not the point about labels the question asks about."}}, {"id": "u1-l3-f2-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Rivers shape the land they cross. Over long spans of time, flowing water carves valleys, moves soil, and deposits it downstream, building fertile plains. Whole landscapes owe their form to the patient work of moving water. What looks permanent is still being shaped.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Rivers move soil downstream as they flow.", "B": "Rivers slowly shape landscapes by carving valleys and building fertile plains.", "C": "Many great cities were founded on the banks of rivers.", "D": "Rivers are responsible for the shape of absolutely every landform on all of Earth."}, "correct": "B", "choice_families": {"A": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that rivers slowly shape landscapes, which this captures.", "why_wrong": {"A": "Moving soil is one detail, too narrow to be the main idea.", "C": "Cities on rivers is true but not the shaping point the question asks about.", "D": "The text describes rivers shaping landscapes, not every landform on Earth; that overstates it."}}, {"id": "u1-l3-f2-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Vaccines work by training the immune system in advance. They expose the body to a harmless piece of a germ so that, if the real germ arrives, the body already knows how to fight it. This preparation prevents illness before it starts. The principle is simple, though the science is complex.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Vaccines make a person completely immune to every single disease that exists.", "B": "A vaccine exposes the body to a harmless piece of a germ.", "C": "Vaccines prevent illness by teaching the immune system to recognize a germ.", "D": "Vaccines are usually given by injection or by mouth."}, "correct": "C", "choice_families": {"A": "Cok genis", "B": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that vaccines train the immune system to prevent illness, which this captures.", "why_wrong": {"A": "The text describes preparing against a germ; claiming immunity to every disease overstates it.", "B": "Exposing the body to a germ piece is one detail, too narrow to be the main idea.", "D": "How vaccines are given is true but not the mechanism the question asks about."}}, {"id": "u1-l3-f2-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Folktales survive because they change. As stories pass from teller to teller, each adds a detail or drops one, shaping the tale to fit new listeners. A story that could not bend would be forgotten. Flexibility, not fixedness, keeps a folktale alive across generations.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Folktales endure because they are flexible and change with each retelling.", "B": "Tellers sometimes add a detail to a folktale.", "C": "Folktales are often told to children at bedtime.", "D": "Every folktale in existence has stayed exactly the same for thousands of years."}, "correct": "A", "choice_families": {"B": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that folktales endure through flexibility, which this captures.", "why_wrong": {"B": "Adding a detail is one detail, too narrow to be the main idea.", "C": "Bedtime telling is true but not the survival point the question asks about.", "D": "This overstates and contradicts the text, which says folktales survive by changing."}}, {"id": "u1-l3-f2-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "The design of a hospital affects how patients heal. Rooms with natural light, quiet, and views of greenery are linked to shorter recoveries and less need for pain medication. Architects now treat these features as part of care, not luxury. A building can help or hinder healing.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Hospitals employ doctors, nurses, and many other kinds of staff.", "B": "Hospital design can influence healing, so light and quiet count as care.", "C": "Hospital design alone can cure any illness without any medical treatment at all.", "D": "Some hospital rooms have views of greenery."}, "correct": "B", "choice_families": {"A": "Dogru ama alakasiz", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that design influences healing and counts as care, which this captures.", "why_wrong": {"A": "Hospital staffing is true but not the design point the question asks about.", "C": "The text says design influences healing, not that it cures illness alone; that overstates it.", "D": "Views of greenery is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f2-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Coral gets its color from tiny algae living in its tissue. When the water grows too warm, the coral expels the algae and turns white, a process called bleaching. Without the algae, the coral loses its main food source and may starve. The color signals a vital partnership.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Coral reefs are found in warm, shallow seas.", "B": "Coral turns white when it expels its algae.", "C": "All coral everywhere is permanently white and has never had any color at all.", "D": "Coral's color reflects a vital algae partnership it depends on to survive."}, "correct": "D", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "C": "Cok genis"}, "why_correct": "The central point is that coral's color reflects a vital algae partnership, which this captures.", "why_wrong": {"A": "Where reefs are found is true but not the partnership point the question asks about.", "B": "Bleaching is one detail, too narrow to be the main idea.", "C": "This overstates and contradicts the text, which says coral gets color from algae."}}, {"id": "u1-l3-f3-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The gardener argued that native plants make the best gardens. Adapted to local soil and rainfall, they need less water and care than imported species, and they feed local insects and birds. Her yard, full of natives, thrived with little effort while her neighbors struggled with thirsty ornamentals.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The gardener's own yard was full of native plants.", "B": "Native plants require absolutely no water or care of any kind.", "C": "Gardening is a popular hobby in many different countries.", "D": "Native plants make better gardens by suiting local conditions."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that native plants suit local conditions and so make better gardens, which this captures.", "why_wrong": {"A": "Her yard being full of natives is one detail, too narrow to be the main idea.", "B": "The text says less water and care, not none at all; that overstates it.", "C": "The popularity of gardening is true but not the point the question asks about."}}, {"id": "u1-l3-f3-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "Historians once dismissed oral traditions as unreliable. But recent work shows that carefully preserved oral histories can pass down accurate accounts across many generations. Some record events, from floods to migrations, that written sources missed. Spoken memory can be a serious historical record.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Some oral histories record floods and migrations.", "B": "Carefully kept oral traditions can be a reliable historical record.", "C": "Writing was invented thousands of years ago.", "D": "Oral traditions are always more accurate than any written source ever is."}, "correct": "B", "choice_families": {"A": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that oral traditions can be reliable historical records, which this captures.", "why_wrong": {"A": "Recording floods and migrations is one detail, too narrow to be the main idea.", "C": "The age of writing is true but not the point the question asks about.", "D": "The text does not claim oral sources are always more accurate; that overstates it."}}, {"id": "u1-l3-f3-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The engineer insisted that simpler bridges are often safer. Every added part, she noted, is another thing that can fail or be built wrong. A clean design leaves fewer chances for error and is easier to inspect. Complexity, she warned, can hide weakness.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The simplest possible bridge is always completely safe in absolutely every case.", "B": "Simpler bridge designs are often safer because they leave fewer chances for failure.", "C": "Bridges have been built by people for thousands of years.", "D": "Every added part is one more thing that can fail."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Dogru ama alakasiz", "D": "Cok dar"
