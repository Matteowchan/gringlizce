elation is the opposite.\nC — sustaining through pacing is related but kindle means to arouse, not sustain.\nD — preparing for a conclusion is a different narrative function.\n\nKelime: kindle — tutuşturmak, ateşlemek; harekete geçirmek"}, {"k": "vocab", "p": "The critic <u>lauded</u> the performance as a career-defining achievement, singling out the lead actor's controlled physicality and the director's willingness to allow long silences to carry emotional weight.", "q": "As used in the text, \"lauded\" most nearly means:", "o": ["A) selected for recognition by a professional awards body", "B) praised enthusiastically", "C) discussed at length in specialized critical contexts", "D) cited as an influence on subsequent works"], "a": 1, "e": "B is correct. Career-defining, singling out specific praised qualities = enthusiastic praise. \"Laud\" = to praise highly.\n\nA — selected for awards is formal institutional recognition.\nC — discussed at length in specialized contexts is critical attention.\nD — cited as an influence is a legacy function.\n\nKelime: laud — övmek, alkışlamak, yüceltmek"}, {"k": "vocab", "p": "The reception was <u>lavish</u> by any standard: three hundred guests, a twenty-piece orchestra, flowers flown in from the Netherlands, and a menu developed by a chef who had trained at three Michelin-starred restaurants.", "q": "As used in the text, \"lavish\" most nearly means:", "o": ["A) organized in a way that reflected the host's personal taste", "B) unnecessarily expensive relative to the occasion", "C) generous to a large extent; sumptuously rich", "D) designed to impress a specific group of high-status guests"], "a": 2, "e": "C is correct. Three hundred guests, orchestra, imported flowers, Michelin chef = sumptuously generous and rich. \"Lavish\" = sumptuously rich, elaborate, or luxurious.\n\nA — reflecting personal taste is a different quality.\nB — unnecessarily expensive is a judgment; lavish simply describes abundance.\nD — designed to impress specific guests describes purpose.\n\nKelime: lavish — cömert, savurgan; bol, gösterişli"}, {"k": "vocab", "p": "The company disputed the regulatory body's authority to impose the fine, arguing that the action fell outside the agency's <u>legitimate</u> jurisdiction under the statute that had created it.", "q": "As used in the text, \"legitimate\" most nearly means:", "o": ["A) consistent with the policy objectives of the administration", "B) conforming to the law or rules; valid and justifiable", "C) recognized as such by other regulatory bodies", "D) explicitly granted by the legislature rather than implied"], "a": 1, "e": "B is correct. Outside the lawful scope of authority = beyond what is valid and lawfully defined. \"Legitimate\" = conforming to the law or to rules; justifiable.\n\nA — consistent with administration policy describes alignment.\nC — recognized by other bodies describes external validation.\nD — explicitly granted versus implied is a legal distinction within legitimacy.\n\nKelime: legitimate — meşru, yasal, geçerli"}, {"k": "vocab", "p": "The judge's <u>lenient</u> sentence — three years' probation with no custodial element — was defended by the defense attorney as appropriate for a first-time offender but criticized by victim advocates as inadequate.", "q": "As used in the text, \"lenient\" most nearly means:", "o": ["A) unconventional in its application of sentencing guidelines", "B) more merciful than strict; not severe", "C) consistent with sentences given for comparable offenses", "D) motivated by an assessment of rehabilitation potential"], "a": 1, "e": "B is correct. Probation only, no custodial element = merciful, not severe. \"Lenient\" = more merciful or tolerant than expected.\n\nA — unconventional is a different characterization.\nC — consistent with comparable sentences would suggest it was standard.\nD — motivated by rehabilitation is a possible reason.\n\nKelime: lenient — müsamahakâr, hoşgörülü, yumuşak"}, {"k": "vocab", "p": "The firm's pivot toward corporate law proved <u>lucrative</u>: within three years, revenues had tripled, it had added forty associates, and the founding partners had each received distributions exceeding their prior decade's earnings.", "q": "As used in the text, \"lucrative\" most nearly means:", "o": ["A) strategically wise given the competitive landscape", "B) producing a great deal of profit or money", "C) widely respected within the professional community", "D) sustainable over a longer term than alternative specializations"], "a": 1, "e": "B is correct. Revenues tripled, exceptional distributions = producing a great deal of profit. \"Lucrative\" = producing a great deal of profit.\n\nA — strategically wise is a different quality.\nC — widely respected describes reputation.\nD — sustainable is a different economic consideration.\n\nKelime: lucrative — kazançlı, kârlı, gelir getiren"}, {"k": "vocab", "p": "Despite the bitterness of the rivalry, the champion was <u>magnanimous</u> in victory, praising her opponent's preparation and sportsmanship rather than dwelling on her own superiority or the errors that had cost her challenger the match.", "q": "As used in the text, \"magnanimous\" most nearly means:", "o": ["A) strategically generous to build a positive public image", "B) generous in spirit, especially toward a rival", "C) deliberately understated to avoid seeming arrogant", "D) emotionally mature in managing competitive relationships"], "a": 1, "e": "B is correct. Praising the rival despite bitter competition = generous in spirit toward a rival. \"Magnanimous\" = generous or forgiving, especially toward a rival.\n\nA — strategically generous implies calculated self-interest.\nC — deliberately understated describes a communication choice.\nD — emotionally mature is a broader quality.\n\nKelime: magnanimous — cömert kalpli, alicenap, kin gütmeyen"}, {"k": "vocab", "p": "The campaign was later found to have deliberately <u>manipulated</u> the algorithm's recommendations by flooding the platform with low-cost content designed to trigger engagement signals without genuine user interest.", "q": "As used in the text, \"manipulated\" most nearly means:", "o": ["A) bypassed through technical expertise", "B) controlled or influenced skillfully, especially in an unfair way", "C) replicated artificially to simulate organic growth", "D) improved in measurable ways by targeted interventions"], "a": 1, "e": "B is correct. Deliberately flooding with content to trigger artificial signals = skillfully controlling in an unfair, deceptive way. \"Manipulate\" = to control or influence cleverly or unscrupulously.\n\nA — bypassed through expertise describes circumventing.\nC — replicated artificially is what the manipulation involves.\nD — improved by targeted interventions is a benign framing.\n\nKelime: manipulate — manipüle etmek, yönlendirmek"}, {"k": "vocab", "p": "Despite years of effort, the survey yielded <u>meager</u> results: three ceramic fragments and a corroded coin — consistent with human habitation but insufficient to confirm the settlement the team had sought.", "q": "As used in the text, \"meager\" most nearly means:", "o": ["A) professionally disappointing but scientifically useful", "B) lacking in quantity or quality; insufficient", "C) limited in scope due to financial constraints", "D) produced under particularly difficult conditions"], "a": 1, "e": "B is correct. Three fragments after years of effort = lacking in quantity, insufficient. \"Meager\" = lacking in quantity or quality; not large enough.\n\nA — disappointing but useful is an assessment.\nC — limited due to financial constraints is a possible cause.\nD — difficult conditions is a circumstance.\n\nKelime: meager — yetersiz, az, kıt"}, {"k": "vocab", "p": "The exercise was a <u>mock</u> negotiation: students took assigned roles, the professor observed from the back, and the outcomes had no binding consequences — but the pressure felt real enough to produce authentic behavior.", "q": "As used in the text, \"mock\" most nearly means:", "o": ["A) conducted under professional supervision", "B) serving as a practice simulation; not genuine", "C) designed to reveal weaknesses in current strategies", "D) more demanding than the actual process it represented"], "a": 1, "e": "B is correct. Practice exercise, no binding consequences = serving as a simulation, not the real thing. \"Mock\" = not authentic; serving as an imitation of.\n\nA — professional supervision describes the setting.\nC — designed to reveal weaknesses is a possible purpose.\nD — more demanding than the actual process is a specific design choice.\n\nKelime: mock — sahte, yapay, gerçek olmayan"}, {"k": "vocab", "p": "In the weeks following the project's cancellation, the designer became visibly <u>morose</u>, speaking little at team meetings, declining lunch invitations, and spending most of his time at his desk without apparent purpose.", "q": "As used in the text, \"morose\" most nearly means:", "o": ["A) resentful toward the decision-makers responsible", "B) ill-tempered and gloomy; sullen", "C) unable to concentrate due to personal disappointment", "D) reluctant to begin new work before processing the setback"], "a": 1, "e": "B is correct. Speaking little, declining invitations, apparent purposelessness = gloomy, sullen. \"Morose\" = sullen and ill-tempered; gloomy.\n\nA — resentful implies directed anger; morose is generalized gloom.\nC — unable to concentrate describes a cognitive effect.\nD — reluctant to begin new work is a behavioral response.\n\nKelime: morose — asık suratlı, somurtkan, neşesiz"}, {"k": "vocab", "p": "The legal agreement included a clause stating that the pricing structure was <u>mutable</u> and subject to annual renegotiation, a provision that the supplier had initially resisted but ultimately accepted.", "q": "As used in the text, \"mutable\" most nearly means:", "o": ["A) open to legal challenge if disputed", "B) subject to change; not fixed", "C) conditional upon market performance", "D) determined by external regulatory standards"], "a": 1, "e": "B is correct. Subject to annual renegotiation = subject to change, not fixed. \"Mutable\" = liable to change; subject to alteration.\n\nA — open to legal challenge is a different kind of flexibility.\nC — conditional upon market performance describes a specific trigger.\nD — determined by external standards describes a different basis.\n\nKelime: mutable — değişebilir, değişken, dönüşebilir"}, {"k": "vocab", "p": "The investigation revealed a <u>nefarious</u> scheme involving shell companies, falsified invoices, and payments routed through multiple jurisdictions to conceal the movement of money from the organization's accounts.", "q": "As used in the text, \"nefarious\" most nearly means:", "o": ["A) highly complex due to deliberate obfuscation", "B) carried out without the knowledge of regulatory authorities", "C) wicked or criminal; morally wrong", "D) difficult to prosecute due to jurisdictional complications"], "a": 2, "e": "C is correct. Shell companies, falsified invoices, concealed money movement = wicked, criminal. \"Nefarious\" = wicked or criminal.\n\nA — complexity describes the scheme's design, not its moral character.\nB — without regulatory knowledge describes concealment.\nD — difficult to prosecute describes a legal challenge.\n\nKelime: nefarious — ahlaksız, kötü niyetli, suç olan"}, {"k": "vocab", "p": "The fee for the service was described as <u>nominal</u> — a symbolic charge intended not to generate revenue but to discourage casual use and ensure that those who scheduled the consultation were genuinely committed to attending.", "q": "As used in the text, \"nominal\" most nearly means:", "o": ["A) officially fixed by regulatory standards", "B) very small; existing in name only rather than in substance", "C) waived for participants meeting certain income thresholds", "D) applied uniformly across all categories of users"], "a": 1, "e": "B is correct. Symbolic charge not intended for revenue = very small, existing in name more than in substance. \"Nominal\" = very small; existing in name only.\n\nA — officially fixed by regulation describes a different basis.\nC — waived for low-income users describes a policy exception.\nD — applied uniformly describes consistent application.\n\nKelime: nominal — yalnızca isim olarak, sözde; çok küçük"}]}, {"n": 8, "topic": "Historical & Institutional Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The banker was <u>notorious</u> in financial circles for his willingness to approve high-risk loans that most institutions would have declined, a reputation that had made him many clients but ultimately contributed to the firm's insolvency.", "q": "As used in the text, \"notorious\" most nearly means:", "o": ["A) widely recognized for professional excellence", "B) famous or well-known, typically for something bad", "C) frequently discussed in specialist publications", "D) increasingly influential within a competitive field"], "a": 1, "e": "B is correct. Reputation for risky loans that contributed to insolvency = known for something bad. \"Notorious\" = famous or well-known, typically for some bad quality.\n\nA — recognized for excellence is the opposite.\nC — frequently discussed is neutral, not specifically notorious.\nD — increasingly influential is a different kind of recognition.\n\nKelime: notorious — kötü şöhretiyle tanınan, meşhur (olumsuz)"}, {"k": "vocab", "p": "The documentary's portrayal of the conflict was admirably <u>nuanced</u>, acknowledging competing narratives, showing internal divisions within each faction, and resisting the temptation to assign clear moral roles to either side.", "q": "As used in the text, \"nuanced\" most nearly means:", "o": ["A) sympathetic to the perspective of the less powerful party", "B) characterized by subtle distinctions; not simplistic", "C) historically accurate in its treatment of documented events", "D) presented in a way that was accessible to general audiences"], "a": 1, "e": "B is correct. Competing narratives, internal divisions, no clear moral roles = subtle distinctions, not simplistic. \"Nuanced\" = characterized by subtle distinctions; showing careful attention to fine points.\n\nA — sympathetic to the less powerful is a specific political stance.\nC — historically accurate is a different quality.\nD — accessible to general audiences describes communication, not complexity of perspective.\n\nKelime: nuanced — nüanslı, ayrıntılı, basit olmayan"}, {"k": "vocab", "p": "The panel sought to produce an <u>objective</u> assessment of the competing proposals, asking each evaluator to score the submissions against predetermined criteria rather than general impressions.", "q": "As used in the text, \"objective\" most nearly means:", "o": ["A) supported by the majority of the panel's members", "B) not influenced by personal feelings or opinions; impartial", "C) consistent with the original purpose of the program", "D) based on the most recent available data"], "a": 1, "e": "B is correct. Predetermined criteria rather than general impressions = not influenced by personal feelings, impartial. \"Objective\" = not influenced by personal feelings; impartial.\n\nA — supported by the majority is a consensus standard.\nC — consistent with the original purpose describes alignment.\nD — based on recent data is an empirical standard.\n\nKelime: objective — nesnel, tarafsız, kişisel görüşten arındırılmış"}, {"k": "vocab", "p": "Rather than addressing the criticism directly, the official offered only <u>oblique</u> responses, acknowledging that 'certain decisions could benefit from further review' without specifying which decisions or what changes were under consideration.", "q": "As used in the text, \"oblique\" most nearly means:", "o": ["A) diplomatically worded to protect institutional relationships", "B) not straightforward or explicit; indirect", "C) legally required to remain general until a process was complete", "D) informally communicated rather than placed in a formal statement"], "a": 1, "e": "B is correct. Acknowledging 'certain decisions' without specifics = not straightforward, indirect. \"Oblique\" = not directly addressed to the matter in hand; indirect.\n\nA — diplomatically worded describes a tone, not the directness.\nC — legally required to remain general is a possible constraint, not the definition.\nD — informally communicated is a channel distinction.\n\nKelime: oblique — dolaylı, dolambaçlı, doğrudan olmayan"}, {"k": "vocab", "p": "The negotiating team found the other party <u>obstinate</u> on the question of intellectual property rights, refusing to modify its position even as every other aspect of the agreement had been resolved to both sides' satisfaction.", "q": "As used in the text, \"obstinate\" most nearly means:", "o": ["A) protected by legal counsel from making further concessions", "B) stubbornly refusing to change one's opinion or course", "C) strategically committed to a position to maximize leverage", "D) genuinely uncertain about the value of the disputed asset"], "a": 1, "e": "B is correct. Refusing to modify its position even as everything else was resolved = stubbornly refusing to change. \"Obstinate\" = stubbornly refusing to change one's opinion or chosen course.\n\nA — protected by counsel describes a legal constraint.\nC — strategically committed describes a tactical choice, not the quality of obstinacy.\nD — genuinely uncertain is a different reason for not conceding.\n\nKelime: obstinate — inatçı, dik başlı, ikna edilmez"}, {"k": "vocab", "p": "The silence from the board in the days following the earnings report was <u>ominous</u>: senior analysts noted that the same silence had preceded the leadership transitions in two of the company's most turbulent years.", "q": "As used in the text, \"ominous\" most nearly means:", "o": ["A) carefully calculated to avoid premature disclosure", "B) giving the impression that something bad is about to happen", "C) consistent with the board's established communication patterns", "D) difficult to interpret without access to internal discussions"], "a": 1, "e": "B is correct. Preceded turbulent transitions previously = suggesting something bad is coming. \"Ominous\" = giving the impression that something bad or unpleasant is about to happen.\n\nA — carefully calculated is a possible explanation.\nC — consistent with established patterns would reduce the ominousness.\nD — difficult to interpret describes ambiguity, not the quality of being ominous.\n\nKelime: ominous — tehdit edici, uğursuz, kötü haber veren"}, {"k": "vocab", "p": "The release of the competing product at this moment proved <u>opportune</u> for our company: it validated the market category we had been developing, attracted new investor interest, and shifted analyst attention toward the space.", "q": "As used in the text, \"opportune\" most nearly means:", "o": ["A) unexpected given the competitive landscape", "B) favorable; occurring at a useful or favorable time", "C) likely to accelerate developments the company had hoped to delay", "D) consistent with the company's previously announced expansion plans"], "a": 1, "e": "B is correct. Validated the market, attracted investors, shifted attention = occurring at a useful, favorable time. \"Opportune\" = well-chosen or favorable; occurring at a favorable time.\n\nA — unexpected is a different quality from opportune.\nC — likely to accelerate unwanted developments is a negative consequence.\nD — consistent with expansion plans describes alignment.\n\nKelime: opportune — elverişli, uygun, tam zamanında"}, {"k": "vocab", "p": "The treatment protocol that the clinic developed was far from <u>orthodox</u>: it combined techniques from three distinct disciplines and arrived at dosages that most practitioners in the field would have considered outside the accepted range.", "q": "As used in the text, \"orthodox\" most nearly means:", "o": ["A) recommended by the most respected authorities in the field", "B) conforming to what is generally or traditionally accepted", "C) approved by the relevant regulatory body for clinical use", "D) supported by the most recent peer-reviewed research"], "a": 1, "e": "B is correct. Far from orthodox = far from what is generally or traditionally accepted. \"Orthodox\" = conforming to what is generally or traditionally accepted; standard.\n\nA — recommended by respected authorities is a prestige criterion.\nC — approved by a regulatory body is a formal certification.\nD — supported by recent research is an evidence standard.\n\nKelime: orthodox — geleneksel, yerleşik, standart"}, {"k": "vocab", "p": "The <u>ostensible</u> reason for the executive's visit was to review the regional sales figures, but the conversations she held with local managers suggested that the real purpose was assessing the viability of the regional office's closure.", "q": "As used in the text, \"ostensible\" most nearly means:", "o": ["A) stated or appearing to be true, but not necessarily so", "B) communicated through formal organizational channels", "C) understood as such by all parties involved", "D) consistent with the executive's prior visits to other regions"], "a": 0, "e": "A is correct. The stated reason was sales review, but the real purpose was different = appearing to be true, but not necessarily so. \"Ostensible\" = stated or appearing to be true, but not necessarily so.\n\nB — communicated through formal channels describes the medium.\nC — understood as such by all parties implies shared awareness.\nD — consistent with prior visits is a pattern observation.\n\nKelime: ostensible — görünürdeki, sözde, zahiren"}, {"k": "vocab", "p": "The scientist was among the most <u>outspoken</u> critics of the study's methodology, publishing a detailed rebuttal within days of the original paper's release and organizing a roundtable of peers to examine its statistical claims.", "q": "As used in the text, \"outspoken\" most nearly means:", "o": ["A) widely quoted in specialist and popular media", "B) frank in stating one's opinions; not holding back", "C) professionally motivated by a conflict of interest", "D) prepared to accept the reputational consequences of criticism"], "a": 1, "e": "B is correct. Published a detailed rebuttal quickly, organized peers = frank, not holding back opinions. \"Outspoken\" = frank in stating one's opinions; not holding back.\n\nA — widely quoted describes visibility, not the quality of speaking.\nC — motivated by conflict of interest implies ulterior motivation.\nD — prepared to accept consequences is a character quality separate from outspokenness.\n\nKelime: outspoken — açık sözlü, düşündüklerini söyleyen, sesi yüksek çıkan"}, {"k": "vocab", "p": "The foundation had developed a reputation for being <u>parsimonious</u> with its grants: proposals were evaluated over months, the awards were small relative to the organization's endowment, and overhead support was rarely included.", "q": "As used in the text, \"parsimonious\" most nearly means:", "o": ["A) methodical in its review process", "B) cautious about the political implications of funding decisions", "C) excessively unwilling to spend; overly frugal", "D) selective about the types of projects it chose to support"], "a": 2, "e": "C is correct. Long reviews, small awards relative to endowment, no overhead = excessively unwilling to spend. \"Parsimonious\" = unwilling to spend money or use resources; excessively frugal.\n\nA — methodical describes the process, not the spending disposition.\nB — politically cautious is a different concern.\nD — selective about projects describes a curatorial stance.\n\nKelime: parsimonious — cimri, eli sıkı, tutumlu (aşırı ölçüde)"}, {"k": "vocab", "p": "The report was criticized as <u>partisan</u> by representatives from the opposing party, who argued that its conclusions had been predetermined and that contrary evidence had been systematically excluded from the analysis.", "q": "As used in the text, \"partisan\" most nearly means:", "o": ["A) based on limited rather than comprehensive evidence", "B) prejudiced in favor of a particular cause; biased", "C) written by individuals with professional conflicts of interest", "D) released at a politically strategic moment"], "a": 1, "e": "B is correct. Conclusions predetermined, contrary evidence excluded = prejudiced in favor of a particular side. \"Partisan\" = prejudiced in favor of a particular cause or side; biased.\n\nA — based on limited evidence is an evidentiary critique.\nC — professional conflicts of interest is a specific bias source.\nD — released at a strategic moment describes timing, not the report's quality.\n\nKelime: partisan — tarafgir, parti yanlısı, tek taraflı"}, {"k": "vocab", "p": "The architect had a well-known <u>penchant</u> for structural contrasts: her most celebrated buildings paired materials that would conventionally be kept separate — stone next to glass, raw steel beside polished marble.", "q": "As used in the text, \"penchant\" most nearly means:", "o": ["A) a strong or habitual liking for something", "B) a principled theoretical commitment to a design philosophy", "C) a technical skill developed through extended practice", "D) an intention to challenge conventional architectural standards"], "a": 0, "e": "A is correct. Well-known for always doing something = a strong or habitual liking. \"Penchant\" = a strong or habitual liking for something.\n\nB — principled theoretical commitment implies a philosophical basis.\nC — technical skill describes ability, not preference.\nD — intention to challenge convention describes a goal.\n\nKelime: penchant — eğilim, düşkünlük, yatkınlık"}, {"k": "vocab", "p": "The statement the company released was <u>penitent</u> in tone — acknowledging that the data breach had resulted from negligence, expressing regret for the harm caused, and committing to a third-party security review.", "q": "As used in the text, \"penitent\" most nearly means:", "o": ["A) legally cautious in avoiding admissions that could increase liability", "B) feeling or showing regret for wrongdoing; repentant", "C) designed to satisfy the minimum requirements of the regulatory response", "D) strategically sincere to rebuild consumer confidence"], "a": 1, "e": "B is correct. Acknowledged negligence, expressed regret, committed to change = feeling and showing regret for wrongdoing. \"Penitent\" = feeling or showing sorrow and regret for having done wrong.\n\nA — legally cautious is a strategic approach that would produce a very different statement.\nC — minimum regulatory satisfaction is a compliance concern.\nD — strategically sincere implies calculation; penitent implies genuine regret.\n\nKelime: penitent — pişman, günahına tövbe eden, nedamet duyan"}, {"k": "vocab", "p": "The sense of uncertainty was <u>pervasive</u> across the organization: it showed up in how managers worded their emails, how staff approached new projects, and how often employees sought informal confirmation before taking initiative.", "q": "As used in the text, \"pervasive\" most nearly means:", "o": ["A) expressed differently depending on the individual's seniority", "B) spreading throughout; present in every part", "C) intensifying in proportion to the duration of the crisis", "D) invisible to senior leadership despite its effects on staff"], "a": 1, "e": "B is correct. Showed up in emails, project approaches, and behavior = spreading throughout, present everywhere. \"Pervasive\" = spreading widely throughout; present everywhere.\n\nA — varying by seniority describes differentiation.\nC — intensifying proportionally implies a trend.\nD — invisible to leadership is a specific observation about awareness.\n\nKelime: pervasive — yaygın, her yerde bulunan, işleyen"}, {"k": "vocab", "p": "The defense attorney presented a <u>plausible</u> alternative explanation for her client's presence near the scene: a dentist appointment three blocks away, confirmed by office records and consistent with the timing established by surveillance footage.", "q": "As used in the text, \"plausible\" most nearly means:", "o": ["A) legally sufficient to create reasonable doubt", "B) seeming reasonable or probable; believable", "C) independently verified by a reliable third party", "D) more convincing than the prosecution's account"], "a": 1, "e": "B is correct. Dentist appointment, office records, consistent timing = seeming reasonable and believable. \"Plausible\" = seeming reasonable or probable; giving an appearance of truth.\n\nA — legally sufficient to create doubt is a legal standard.\nC — independently verified is a corroboration standard.\nD — more convincing than the prosecution is a comparative judgment.\n\nKelime: plausible — makul, inandırıcı, olası görünen"}, {"k": "vocab", "p": "The proposal did not generate the measured debate its authors had hoped for — instead, it <u>polarized</u> the council immediately, with one bloc supporting the measure without qualification and another opposing it with equal firmness.", "q": "As used in the text, \"polarize\" most nearly means:", "o": ["A) confuse by presenting insufficient information", "B) generate passionate support that quickly subsides", "C) divide sharply into opposing groups", "D) overwhelm with a response the authors had not anticipated"], "a": 2, "e": "C is correct. One bloc fully supporting, another fully opposing = divided sharply into opposing camps. \"Polarize\" = to divide or cause to divide into two sharply contrasting groups.\n\nA — confuse by insufficient information is a different effect.\nB — passionate support that subsides describes a temporary reaction.\nD — overwhelm with an unexpected response is a different dynamic.\n\nKelime: polarize — kutuplaştırmak, keskin bir biçimde bölmek"}, {"k": "vocab", "p": "The announcement of the merger <u>precipitated</u> a wave of resignations, with senior staff citing uncertainty about their roles, changes to their reporting structures, and concerns about the acquiring company's culture.", "q": "As used in the text, \"precipitated\" most nearly means:", "o": ["A) followed as a predictable consequence", "B) caused suddenly; brought about quickly", "C) intensified beyond what the announcement had suggested", "D) delayed until the details of the merger became clearer"], "a": 1, "e": "B is correct. Announcement caused a wave of resignations immediately = caused suddenly. \"Precipitate\" (v.) = to cause an event or situation to happen suddenly or sooner than expected.\n\nA — followed as a predictable consequence describes an expected sequence; precipitate implies suddenness.\nC — intensified beyond expectations describes a degree, not a causation.\nD — delayed until details became clearer is the opposite of precipitate.\n\nKelime: precipitate — neden olmak, tetiklemek; acele eden, aceleci"}, {"k": "vocab", "p": "The organization's financial position had become <u>precarious</u>: its reserves covered only two months of operating costs, its largest funder had signaled it might not renew, and a key revenue stream was under legal challenge.", "q": "As used in the text, \"precarious\" most nearly means:", "o": ["A) deteriorating at a rate that would require intervention within a year", "B) not securely held; dependent on uncertain conditions", "C) privately acknowledged as serious but managed in public communications", "D) more severe than similar organizations had previously experienced"], "a": 1, "e": "B is correct. Reserves limited, funder uncertain, revenue challenged = not securely held, dependent on uncertain conditions. \"Precarious\" = not securely held; dependent on chance; uncertain.\n\nA — deteriorating at a specific rate is a temporal assessment.\nC — managed in public communications is a communications strategy.\nD — more severe than others have experienced is a comparative claim.\n\nKelime: precarious — tehlikeli, güvensiz, dengesiz"}, {"k": "vocab", "p": "The child's <u>precocious</u> mathematical ability was recognized when she solved a problem on the classroom board that her teacher had been using as an end-of-term challenge for students five years older.", "q": "As used in the text, \"precocious\" most nearly means:", "o": ["A) independently developed rather than formally taught", "B) having developed certain abilities earlier than is usual", "C) immediately visible to specialists but not to general observers", "D) likely to diminish as more advanced material was introduced"], "a": 1, "e": "B is correct. Solved a challenge for students five years older = ability developed earlier than is usual. \"Precocious\" = having developed certain abilities earlier than is usual.\n\nA — independently developed is a different quality.\nC — visible only to specialists is a different observation.\nD — likely to diminish is a speculative outcome.\n\nKelime: precocious — erken gelişen, yaşına göre ileri"}, {"k": "vocab", "p": "It seemed <u>presumptuous</u> for a first-year analyst to question the assumptions behind a model that the firm's senior partners had been refining for a decade, and several of her colleagues suggested she raise her concerns privately.", "q": "As used in the text, \"presumptuous\" most nearly means:", "o": ["A) uninformed due to limited professional experience", "B) failing to behave according to accepted conventions", "C) overstepping one's position; too bold or assuming", "D) motivated by a desire to attract attention from senior leadership"], "a": 2, "e": "C is correct. A first-year questioning a decade-old model from senior partners = overstepping one's position, too bold. \"Presumptuous\" = overstepping what is right or proper; failing to observe social boundaries.\n\nA — uninformed is a knowledge issue, not a presumption issue.\nB — failing to observe conventions describes social behavior broadly.\nD — desire to attract attention speculates about motivation.\n\nKelime: presumptuous — küstah, kendini fazla sayan, haddi olmayan"}, {"k": "vocab", "p": "The firm's founder had been generous to the point of being <u>prodigal</u> in the early years, funding every project that showed any promise and underwriting the personal research costs of staff who had no institutional budget to draw on.", "q": "As used in the text, \"prodigal\" most nearly means:", "o": ["A) recklessly extravagant with money or resources", "B) invested in the development of talented individuals", "C) excessive in its expectations of staff output", "D) indiscriminate in the quality of projects it supported"], "a": 0, "e": "A is correct. Funding every promising project, underwriting personal research = recklessly extravagant, spending without restraint. \"Prodigal\" = spending money or resources freely and recklessly; wastefully extravagant.\n\nB — invested in talented individuals implies intentional development.\nC — excessive expectations of output is a different characteristic.\nD — indiscriminate in quality describes curatorial judgment.\n\nKelime: prodigal — savurgan, müsrif; müsrif kişi"}, {"k": "vocab", "p": "Social media platforms have allowed misinformation to <u>proliferate</u> at a pace that outstrips the capacity of fact-checking organizations, which can typically address only a small fraction of the false claims that circulate in a given week.", "q": "As used in the text, \"proliferate\" most nearly means:", "o": ["A) evolve into more sophisticated forms over time", "B) increase rapidly in number and spread widely", "C) resist correction despite evidence to the contrary", "D) migrate across different communication channels"], "a": 1, "e": "B is correct. Outstripping fact-checking capacity, only a fraction addressed = increasing rapidly and spreading widely. \"Proliferate\" = to increase rapidly in number; to spread extensively.\n\nA — evolve into more sophisticated forms is a qualitative change.\nC — resist correction is a characteristic of misinformation but not what proliferate means.\nD — migrate across channels is a distribution pattern.\n\nKelime: proliferate — çoğalmak, yaygınlaşmak, hızla artmak"}, {"k": "vocab", "p": "The editorial's suggestion that the city should consider dissolving its public transit authority immediately <u>provoked</u> a public outcry, with transit unions, advocacy organizations, and several council members all issuing statements of opposition within twenty-four hours.", "q": "As used in the text, \"provoked\" most nearly means:", "o": ["A) confirmed the fears of those who had opposed the editorial", "B) stimulated a reaction; caused a response", "C) generated a debate that the editorial board had not intended", "D) attracted media coverage disproportionate to the editorial's readership"], "a": 1, "e": "B is correct. Immediately caused unions, organizations, and council members to respond = stimulated a reaction. \"Provoke\" = to stimulate or give rise to a reaction.\n\nA — confirmed fears describes a specific emotional response.\nC — generated an unintended debate implies the editorial board's surprise.\nD — attracted disproportionate coverage describes a media outcome.\n\nKelime: provoke — kışkırtmak, tahrik etmek, neden olmak"}, {"k": "vocab", "p": "The administration's announcement was intended to <u>quell</u> the mounting speculation about leadership changes, but by addressing only some of the concerns in circulation, it actually intensified interest in the ones it left unaddressed.", "q": "As used in the text, \"quell\" most nearly means:", "o": ["A) refute by presenting contradictory evidence", "B) put an end to; suppress or subdue", "C) redirect toward a more constructive topic", "D) satisfy through a transparent explanation"], "a": 1, "e": "B is correct. Intended to end the speculation, but failed because it only addressed some concerns = intended to suppress or put an end to. \"Quell\" = to put an end to; to suppress or subdue.\n\nA — refute by presenting evidence is a different approach.\nC — redirect toward constructive topics is a different communication strategy.\nD — satisfy through transparency is a different goal.\n\nKelime: quell — bastırmak, yatıştırmak, sona erdirmek"}]}, {"n": 9, "topic": "Rhetoric & Expression Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The engineering team was given thirty days to <u>rectify</u> the structural deficiencies identified in the inspection, after which a reinspection would determine whether the building was safe to occupy.", "q": "As used in the text, \"rectify\" most nearly means:", "o": ["A) document for future reference", "B) put right; correct a fault or error", "C) assess the cost of addressing", "D) formally disclose to affected parties"], "a": 1, "e": "B is correct. Given thirty days to correct deficiencies = put right, correct. \"Rectify\" = to put right; to correct.\n\nA — document is a different activity.\nC — assess the cost is an evaluation, not a correction.\nD — formally disclose is a transparency action.\n\nKelime: rectify — düzeltmek, gidermek, telafi etmek"}, {"k": "vocab", "p": "The new organizational structure <u>relegated</u> environmental compliance to a sub-department of operations, rather than maintaining it as a standalone function reporting directly to the executive team.", "q": "As used in the text, \"relegate\" most nearly means:", "o": ["A) merge with a similar department for efficiency", "B) assign to a lower position or less important role", "C) place under external rather than internal oversight", "D) restructure with reduced staffing and resources"], "a": 1, "e": "B is correct. Moved from a standalone direct-report to a sub-department = assigned to a lower, less important role. \"Relegate\" = to assign to an inferior position.\n\nA — merge for efficiency describes a different change.\nC — place under external oversight is a different structural shift.\nD — reduce staffing describes a resource change.\n\nKelime: relegate — düşürmek, geri plana itmek, alt seviyeye indirmek"}, {"k": "vocab", "p": "The senator publicly <u>repudiated</u> the document that had been circulating under her name, stating that she had never seen it, that it misrepresented her positions, and that she would seek legal advice regarding its origin.", "q": "As used in the text, \"repudiated\" most nearly means:", "o": ["A) acknowledged as authentic but disputed its interpretation", "B) refused to accept; rejected as false or wrong", "C) reported to the relevant authority for investigation", "D) corrected by releasing an updated version"], "a": 1, "e": "B is correct. Never seen it, misrepresents her positions = refused to accept, rejected as false. \"Repudiate\" = to refuse to accept; to reject as false.\n\nA — acknowledged but disputed interpretation is a different response.\nC — reported for investigation is a different action.\nD — corrected by releasing an update implies the original was hers.\n\nKelime: repudiate — reddetmek, kabul etmemek, inkar etmek"}, {"k": "vocab", "p": "What made the community <u>resilient</u> in the face of the economic disruption was not the absence of hardship but its dense social networks, which enabled residents to share resources, information, and emotional support across households.", "q": "As used in the text, \"resilient\" most nearly means:", "o": ["A) protected from the worst effects of economic disruption", "B) able to recover quickly from difficult conditions", "C) resourceful in finding alternative sources of income", "D) unified in its political response to external pressures"], "a": 1, "e": "B is correct. Dense networks enabling recovery = able to recover quickly from difficult conditions. \"Resilient\" = able to withstand or recover quickly from difficult conditions.\n\nA — protected from the worst effects implies prevention; resilient implies recovery.\nC — resourceful in finding income is a specific coping mechanism.\nD — unified in political response is a different expression of collective strength.\n\nKelime: resilient — dayanıklı, çabuk toparlanan, esnekliği olan"}, {"k": "vocab", "p": "The candidate's speech was long on <u>rhetoric</u> and short on specifics: it invoked values that virtually everyone shared — fairness, opportunity, community — while offering no concrete policy proposal on any of the issues it raised.", "q": "As used in the text, \"rhetoric\" most nearly means:", "o": ["A) language designed to have a persuasive or impressive effect but lacking substance", "B) a technique of public speaking developed in classical antiquity", "C) language that draws on widely shared cultural symbols", "D) political communication aimed at specific demographic groups"], "a": 0, "e": "A is correct. Invoked shared values without concrete proposals = language designed to be impressive but lacking substance. \"Rhetoric\" = language designed to have a persuasive or impressive effect, often perceived as lacking sincerity.\n\nB — classical speaking technique describes the academic discipline of rhetoric.\nC — drawing on cultural symbols is a specific technique within rhetoric.\nD — targeting demographic groups describes audience strategy.\n\nKelime: rhetoric — retorik, söylev sanatı; boş söz, lafazanlık"}, {"k": "vocab", "p": "The prototype was still <u>rudimentary</u>: it could perform the core function the team had designed it for, but the interface required manual input at every step, the processing was slow, and the error rate made it unusable in practice.", "q": "As used in the text, \"rudimentary\" most nearly means:", "o": ["A) promising in concept but not yet technically feasible", "B) involving only the most basic elements; undeveloped", "C) functional in controlled environments but not in the field", "D) limited by the resources available at the current project stage"], "a": 1, "e": "B is correct. Could perform the core function but with manual input, slow processing, high error rates = only the most basic elements, undeveloped. \"Rudimentary\" = involving or limited to basic principles; undeveloped.\n\nA — promising but not feasible is a different assessment.\nC — functional in controlled environments only describes a specific limitation.\nD — limited by resources describes a constraint.\n\nKelime: rudimentary — ilkel, temel, basit, gelişmemiş"}, {"k": "vocab", "p": "The board chose not to <u>sanction</u> the proposed acquisition, citing concerns about debt levels, the target company's pending litigation, and the strategic fit with the firm's existing business lines.", "q": "As used in the text, \"sanction\" most nearly means:", "o": ["A) impose penalties in response to prohibited behavior", "B) give official permission or approval for", "C) formally evaluate before committing resources", "D) publicly announce in a regulated filing"], "a": 1, "e": "B is correct. Chose not to approve the acquisition = refused to give official permission. \"Sanction\" (v.) = to give official permission or approval for.\n\nA — impose penalties is the other meaning of sanction; context here is about approval.\nC — formally evaluate is a prior step.\nD — publicly announce is a disclosure action.\n\nKelime: sanction — onaylamak, yetki vermek; yaptırım uygulamak"}, {"k": "vocab", "p": "The reviewer's <u>scathing</u> assessment of the novel spared nothing: the plot was described as contrived, the dialogue as wooden, the central metaphor as exhausted, and the book's conclusion as a failure of narrative courage.", "q": "As used in the text, \"scathing\" most nearly means:", "o": ["A) detailed and methodically organized", "B) devastatingly severe and critical", "C) biased by the reviewer's personal dislike of the genre", "D) likely to damage the author's prospects for future publication"], "a": 1, "e": "B is correct. Contrived plot, wooden dialogue, exhausted metaphor, failed conclusion = devastatingly severe and critical. \"Scathing\" = witheringly scornful; severely critical.\n\nA — detailed and methodical describes structure, not severity.\nC — biased by personal dislike is a possible explanation for scathing criticism.\nD — likely to damage future prospects is a consequence.\n\nKelime: scathing — yakıcı, sert, amansız eleştiren"}, {"k": "vocab", "p": "The scientist's healthy <u>skepticism</u> about the data proved valuable: by questioning assumptions the rest of the team had accepted, she identified a calibration error that had been distorting the results for six weeks.", "q": "As used in the text, \"skepticism\" most nearly means:", "o": ["A) a principled refusal to accept authority-based claims", "B) a questioning attitude; doubt regarding accepted conclusions", "C) the methodological practice of independent data verification", "D) professional disagreement expressed within established norms"], "a": 1, "e": "B is correct. Questioning assumptions the team accepted = a questioning attitude, doubting accepted conclusions. \"Skepticism\" = a questioning or doubting attitude.\n\nA — refusal to accept authority is a more extreme form.\nC — independent data verification is a methodological practice.\nD — professional disagreement within norms is a behavioral description.\n\nKelime: skepticism — şüphecilik, kuşkuculuk"}, {"k": "vocab", "p": "The argument was <u>specious</u>: it sounded convincing because it used the vocabulary of economic efficiency, but the underlying assumptions had been disproven by every major empirical study in the field.", "q": "As used in the text, \"specious\" most nearly means:", "o": ["A) based on outdated rather than current economic theory", "B) superficially plausible but actually wrong", "C) too abstract to be evaluated against empirical evidence", "D) deliberately constructed to mislead without explicitly lying"], "a": 1, "e": "B is correct. Sounded convincing but underlying assumptions were wrong = superficially plausible but actually wrong. \"Specious\" = superficially plausible, but actually wrong.\n\nA — outdated theory is a source of error, not the quality of speciousness.\nC — too abstract for evaluation is a different problem.\nD — deliberately misleading implies intent; specious can be unintentional.\n\nKelime: specious — yanıltıcı görünen ama yanlış olan, sahte ikna edici"}, {"k": "vocab", "p": "The correlation between ice cream sales and crime rates is <u>spurious</u>: both increase in summer because of the heat and increased outdoor activity, not because one causes the other.", "q": "As used in the text, \"spurious\" most nearly means:", "o": ["A) visible in the data but not explained by any theory", "B) not genuine; false or misleading", "C) widely reported despite being methodologically suspect", "D) suggestive of a relationship that requires further investigation"], "a": 1, "e": "B is correct. Both driven by a third variable (heat/summer), not a real relationship = false, not genuine. \"Spurious\" = not genuine; based on false or misleading reasoning.\n\nA — unexplained by any theory is a different scientific status.\nC — widely reported despite suspicion describes dissemination.\nD — requiring further investigation is a different scientific response.\n\nKelime: spurious — asılsız, sahte, temelsiz"}, {"k": "vocab", "p": "The region's economy had been <u>stagnant</u> for over a decade: GDP growth had averaged less than half a percent annually, unemployment had barely changed, and none of the infrastructure investment that had been proposed had materialized.", "q": "As used in the text, \"stagnant\" most nearly means:", "o": ["A) declining slowly due to structural disadvantages", "B) showing no activity, growth, or development", "C) performing below comparable regional economies", "D) dependent on sectors particularly vulnerable to external shocks"], "a": 1, "e": "B is correct. No GDP growth, unchanged unemployment, no infrastructure = no activity, growth, or development. \"Stagnant\" = having no activity, growth, or development.\n\nA — declining slowly implies negative trend; stagnant implies no movement.\nC — below comparable regions describes relative performance.\nD — dependent on vulnerable sectors describes structural risk.\n\nKelime: stagnant — durgun, hareketsiz, gelişmeyen"}, {"k": "vocab", "p": "Advocates argued that the legislation would <u>stigmatize</u> individuals seeking treatment for addiction, creating a public record that could affect employment and housing prospects long after the person had recovered.", "q": "As used in the text, \"stigmatize\" most nearly means:", "o": ["A) deter individuals from seeking available services", "B) mark as disgraceful; cause to be regarded with shame", "C) expose to legal liability for health-related decisions", "D) reduce access to insurance coverage for treatment"], "a": 1, "e": "B is correct. Creating a public record affecting future prospects = marking as disgraceful, causing to be viewed with shame. \"Stigmatize\" = to regard or treat as worthy of disgrace.\n\nA — deter from services is a consequence.\nC — expose to legal liability is a different concern.\nD — reduce insurance coverage is a financial consequence.\n\nKelime: stigmatize — damgalamak, damga vurmak, aşağılamak"}, {"k": "vocab", "p": "The commander's <u>stoic</u> response to the news — a single nod, then a quiet request to be given thirty minutes alone — was widely interpreted as a sign of profound self-control rather than an absence of feeling.", "q": "As used in the text, \"stoic\" most nearly means:", "o": ["A) trained to suppress emotional responses in professional contexts", "B) enduring pain or difficulty without showing feelings", "C) accustomed to delivering and receiving difficult news", "D) composed due to having anticipated the outcome"], "a": 1, "e": "B is correct. Single nod, quiet request = enduring difficulty without outwardly showing feelings. \"Stoic\" = enduring pain or hardship without showing feelings.\n\nA — trained to suppress is an explanation, not the quality itself.\nC — accustomed to difficult news describes experience.\nD — composed because of prior anticipation is a different explanation.\n\nKelime: stoic — stoik, acıya katlanmayı bilen, duygusunu belli etmeyen"}, {"k": "vocab", "p": "Evaluating the quality of creative writing is inevitably <u>subjective</u>: the same passage might be praised for its ambiguity by one reader and criticized for its obscurity by another, with neither judgment provably correct.", "q": "As used in the text, \"subjective\" most nearly means:", "o": ["A) based on personal feelings or opinions; not objective", "B) requiring specialized training to assess reliably", "C) influenced by the context in which the work is read", "D) valid only within a specific cultural framework"], "a": 0, "e": "A is correct. Praised by one, criticized by another with neither provably correct = based on personal feelings, not objective. \"Subjective\" = based on or influenced by personal feelings or opinions.\n\nB — requiring specialized training is a different epistemological issue.\nC — influenced by context is a different source of variability.\nD — valid only within a specific culture is cultural relativism.\n\nKelime: subjective — öznel, kişisel, bireysel"}, {"k": "vocab", "p": "The shift in the CEO's public messaging was <u>subtle</u> but significant: she no longer described the restructuring as 'strategic' and had replaced 'opportunity' with 'challenge' in two consecutive quarterly reports.", "q": "As used in the text, \"subtle\" most nearly means:", "o": ["A) deliberate and carefully designed to achieve a specific effect", "B) so delicate or precise as to be difficult to analyze", "C) not immediately obvious; requiring careful attention to notice", "D) acknowledged within the company but not reflected publicly"], "a": 2, "e": "C is correct. Changed word choices that required close reading to notice = not immediately obvious, requiring careful attention. \"Subtle\" = so delicate or precise as to be difficult to detect; not obvious.\n\nA — deliberate and carefully designed describes intent, not the quality of subtlety.\nB — difficult to analyze describes complexity, not the quality of subtlety.\nD — acknowledged internally but not public describes a different distinction.\n\nKelime: subtle — ince, nazik, fark edilmesi güç"}, {"k": "vocab", "p": "The final fundraising total <u>surpassed</u> all prior records for the organization, exceeding the previous high by thirty percent and reaching a level that had been considered unattainable when the campaign was first designed.", "q": "As used in the text, \"surpassed\" most nearly means:", "o": ["A) reached despite significant obstacles", "B) exceeded; went beyond in performance or achievement", "C) revealed to be more ambitious than the original target", "D) achieved earlier in the campaign timeline than anticipated"], "a": 1, "e": "B is correct. Exceeding the previous record by thirty percent = went beyond in performance. \"Surpass\" = to exceed; to be greater than or superior to.\n\nA — reached despite obstacles describes the achievement's difficulty.\nC — revealed to be more ambitious describes what the achievement showed.\nD — achieved earlier than anticipated describes timing.\n\nKelime: surpass — geçmek, aşmak, üstün gelmek"}, {"k": "vocab", "p": "Young children are especially <u>susceptible</u> to respiratory infections in crowded indoor environments, which is why pediatric guidelines recommend increased ventilation and reduced group sizes during peak illness seasons.", "q": "As used in the text, \"susceptible\" most nearly means:", "o": ["A) likely to experience more severe complications if infected", "B) easily influenced or harmed; lacking resistance", "C) unaware of the health risks associated with the environment", "D) frequently exposed due to school attendance and group activities"], "a": 1, "e": "B is correct. Especially vulnerable to infections = easily harmed, lacking resistance. \"Susceptible\" = likely to be influenced or harmed by a particular thing; vulnerable.\n\nA — more severe complications if infected is a different aspect of vulnerability.\nC — unaware of risks is a knowledge issue.\nD — frequently exposed describes opportunity for infection.\n\nKelime: susceptible — duyarlı, etkilenmeye açık, korunaksız"}, {"k": "vocab", "p": "The editorial board's response to the controversy was <u>temperate</u>: it acknowledged the legitimate concerns raised by critics, defended the decision to publish, and committed to a clearer editorial process going forward.", "q": "As used in the text, \"temperate\" most nearly means:", "o": ["A) legally cautious in avoiding language that could lead to litigation", "B) moderate in tone; showing restraint and reasonableness", "C) strategic in balancing transparency with institutional protection", "D) comprehensive in addressing all of the concerns that had been raised"], "a": 1, "e": "B is correct. Acknowledged concerns, defended decision, committed to change = moderate in tone, showing restraint. \"Temperate\" = showing moderation or self-restraint.\n\nA — legally cautious is a specific strategic quality.\nC — strategically balancing transparency describes a communication calculation.\nD — comprehensive in addressing all concerns describes thoroughness.\n\nKelime: temperate — ılımlı, dengeli, aşırıya kaçmayan"}, {"k": "vocab", "p": "The peace talks produced only a <u>tentative</u> agreement: both parties had initialed a framework document, but key provisions remained unresolved and any final deal required ratification by legislatures that had not yet reviewed the terms.", "q": "As used in the text, \"tentative\" most nearly means:", "o": ["A) proposed informally before being put in writing", "B) not certain or fixed; subject to further discussion", "C) agreed upon by negotiators but requiring public approval", "D) reduced in scope from what had originally been proposed"], "a": 1, "e": "B is correct. Key provisions unresolved, final ratification pending = not certain or fixed, subject to further discussion. \"Tentative\" = not certain or fixed; subject to change.\n\nA — proposed informally describes an earlier stage.\nC — agreed by negotiators but requiring approval describes a specific procedural status.\nD — reduced in scope describes the content, not the certainty.\n\nKelime: tentative — geçici, kesin olmayan, tereddütlü"}, {"k": "vocab", "p": "The professor's feedback on the essay was characteristically <u>terse</u>: three sentences identifying the structural flaw, one sentence on the strongest passage, and a grade with no further explanation.", "q": "As used in the text, \"terse\" most nearly means:", "o": ["A) technically precise at the expense of helpfulness", "B) efficiently brief; sparing with words", "C) delivered quickly due to a heavy marking load", "D) written informally rather than in the expected academic register"], "a": 1, "e": "B is correct. Three sentences, one sentence, grade with no further explanation = sparing with words, brief. \"Terse\" = sparing in the use of words; brief and abrupt.\n\nA — technically precise at the expense of helpfulness is a different quality.\nC — delivered quickly due to heavy load is a cause, not the definition.\nD — informal register is a different style observation.\n\nKelime: terse — kısa ve kuru, özlü, kesik cümleli"}, {"k": "vocab", "p": "The environmental organization sought to <u>thwart</u> the development project by challenging the environmental impact assessment in court, arguing that the review had failed to account for the effect on protected wetlands downstream.", "q": "As used in the text, \"thwart\" most nearly means:", "o": ["A) replace with a project that had broader community support", "B) delay until regulatory requirements had been properly satisfied", "C) prevent from succeeding; obstruct", "D) expose as legally and procedurally irregular"], "a": 2, "e": "C is correct. Challenging the project in court to stop it = preventing from succeeding, obstructing. \"Thwart\" = to prevent someone from accomplishing something.\n\nA — replace with another project is a different goal.\nB — delay until requirements are met is a less adversarial objective.\nD — expose as irregular is one method of thwarting.\n\nKelime: thwart — engellemek, bozmak, önlemek"}, {"k": "vocab", "p": "The speech drew polite applause but left many listeners unmoved: its appeals to unity and shared purpose were <u>trite</u>, having been used in similar form by so many speakers that they had lost whatever emotional force they might once have carried.", "q": "As used in the text, \"trite\" most nearly means:", "o": ["A) linguistically simple and unsuited to the formality of the occasion", "B) overused to the point of having lost its original force", "C) poorly delivered rather than poorly conceived", "D) strategically generic to avoid alienating any part of the audience"], "a": 1, "e": "B is correct. Used by so many speakers that emotional force was lost = overused, worn out. \"Trite\" = overused and consequently of little import; lacking originality.\n\nA — linguistically simple is a different quality.\nC — poorly delivered is a performance issue.\nD — strategically generic implies calculated blandness.\n\nKelime: trite — klişe, bayağı, sıradanlığa düşmüş"}, {"k": "vocab", "p": "The union representative arrived at the negotiation table in a <u>truculent</u> mood, immediately challenging the company's opening figures as fabricated and demanding an independent auditor before further discussions could proceed.", "q": "As used in the text, \"truculent\" most nearly means:", "o": ["A) strategically confrontational to gain early advantage", "B) eager or quick to argue; aggressively defiant", "C) unwilling to engage without prior procedural guarantees", "D) informed by prior experiences of bad-faith negotiation"], "a": 1, "e": "B is correct. Immediately challenged figures, demanded auditor = quick to argue, aggressively defiant. \"Truculent\" = eager or quick to argue; defiant.\n\nA — strategically confrontational implies calculation.\nC — unwilling without procedural guarantees describes a condition.\nD — informed by prior bad faith is a motivation.\n\nKelime: truculent — kavgacı, saldırgan, hırçın"}, {"k": "vocab", "p": "The project's most <u>turbulent</u> period came in its third year, when the lead architect resigned abruptly, two investors withdrew, and construction was halted for three months following a structural inspection.", "q": "As used in the text, \"turbulent\" most nearly means:", "o": ["A) most productive in terms of design decisions", "B) characterized by conflict, instability, or sudden change", "C) most visible to the public due to media coverage", "D) most consequential for the project's long-term outcomes"], "a": 1, "e": "B is correct. Resignation, investors withdrawing, construction halted = conflict, instability, sudden change. \"Turbulent\" = characterized by conflict, disorder, or confusion; not stable.\n\nA — most productive is the opposite.\nC — most visible to the public is a different quality.\nD — most consequential is a different assessment.\n\nKelime: turbulent — çalkantılı, karmaşık, istikrarsız"}]}, {"n": 10, "topic": "Mixed Review — Advanced Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The consultant's report, while accurate in its individual findings, <u>undermined</u> the team's confidence more than was warranted, presenting manageable problems as though they were disqualifying.", "q": "As used in the text, \"undermined\" most nearly means:", "o": ["A) questioned the validity of specific findings", "B) weakened or damaged by indirect means", "C) brought additional information to light", "D) delayed progress by introducing competing concerns"], "a": 1, "e": "B is correct. Damaged confidence beyond what data warranted = weakened indirectly. \"Undermine\" = to weaken gradually.\n\nA — questioned specific findings describes direct challenge.\nC — brought information to light is different.\nD — delayed progress is a consequence.\n\nKelime: undermine — zayıflatmak, gizlice yıkmak"}, {"k": "vocab", "p": "The company's <u>unilateral</u> decision to change the terms of the distribution agreement without consulting its partners triggered breach of contract claims from three of the five affected firms.", "q": "As used in the text, \"unilateral\" most nearly means:", "o": ["A) legally binding without affected parties' consent", "B) taken without the agreement or participation of the other party", "C) implemented gradually to reduce immediate disruption", "D) announced publicly before stakeholders had been informed"], "a": 1, "e": "B is correct. Changed terms without consulting partners = without agreement of the other parties. \"Unilateral\" = performed by or affecting only one side.\n\nA — legally binding without consent is a legal quality.\nC — implemented gradually is a rollout strategy.\nD — announced publicly first is a communication order.\n\nKelime: unilateral — tek taraflı, karşılıklı değil"}, {"k": "vocab", "p": "The scale of the public response was <u>unprecedented</u>: within forty-eight hours, donations had exceeded the organization's entire annual budget, and the volume of online engagement had crashed its server.", "q": "As used in the text, \"unprecedented\" most nearly means:", "o": ["A) larger than internal projections had estimated", "B) never having happened or existed before", "C) achieved through methods not previously used by the organization", "D) more widely covered by the media than any prior campaign"], "a": 1, "e": "B is correct. Exceeded the annual budget in 48 hours, crashed servers = never happened before. \"Unprecedented\" = never done or known before.\n\nA — larger than projections describes exceeded expectations.\nC — achieved through new methods describes technique.\nD — widely covered describes media treatment.\n\nKelime: unprecedented — benzersiz, daha önce hiç olmamış"}, {"k": "vocab", "p": "The investigation found evidence of <u>unscrupulous</u> practices throughout the supply chain: suppliers had falsified origin certifications, inspection officials had accepted payments to approve substandard products, and several intermediaries had destroyed records.", "q": "As used in the text, \"unscrupulous\" most nearly means:", "o": ["A) hidden from regulatory view due to structural complexity", "B) involving multiple parties across different jurisdictions", "C) having or showing no moral principles; dishonest", "D) motivated primarily by pressure from larger companies in the chain"], "a": 2, "e": "C is correct. Falsified certifications, bribery, destroyed records = no moral principles. \"Unscrupulous\" = having or showing no moral principles; not honest.\n\nA — hidden from regulation describes concealment.\nB — multiple parties describes the chain structure.\nD — pressure from larger companies is a causal explanation.\n\nKelime: unscrupulous — ahlaksız, vicdansız, ilkesiz"}, {"k": "vocab", "p": "Following the discovery of new evidence, the company's original position became <u>untenable</u>: it had claimed to have no knowledge of the defect, but internal emails showed engineers had flagged it eighteen months before release.", "q": "As used in the text, \"untenable\" most nearly means:", "o": ["A) likely to be challenged through litigation", "B) no longer defensible; impossible to maintain", "C) inconsistent with the company's prior public statements", "D) subject to regulatory review as a result of the evidence"], "a": 1, "e": "B is correct. Internal emails disproved the claim = no longer defensible. \"Untenable\" = not able to be maintained or defended.\n\nA — likely to be challenged is a process outcome.\nC — inconsistent with prior statements is what made it untenable.\nD — regulatory review is a consequence.\n\nKelime: untenable — savunulamaz, tutarsız, tutulması güç"}, {"k": "vocab", "p": "The proposed governance structure had become <u>unwieldy</u>: fifteen committees, four oversight boards, and a rotating executive that changed every ninety days had produced a system in which no single authority had clear responsibility.", "q": "As used in the text, \"unwieldy\" most nearly means:", "o": ["A) overly complex due to poorly coordinated design", "B) difficult to manage or control; not efficient", "C) lacking transparency in its decision-making processes", "D) insulated from accountability to external stakeholders"], "a": 1, "e": "B is correct. Multiple committees, boards, rotating executive, no clear authority = difficult to manage. \"Unwieldy\" = difficult to manage or control because of size or complexity.\n\nA — overly complex due to poor design is a cause.\nC — lacking transparency is a different deficiency.\nD — insulated from accountability is a governance problem.\n\nKelime: unwieldy — kullanışsız, hantal, yönetilmesi güç"}, {"k": "vocab", "p": "The appellate court voted to <u>uphold</u> the lower court's decision, finding that the trial judge had correctly applied the relevant statute and that there were no grounds for reversing the original outcome.", "q": "As used in the text, \"uphold\" most nearly means:", "o": ["A) reconsider in light of newly submitted evidence", "B) confirm; maintain the validity of a decision", "C) explain the legal reasoning underlying a finding", "D) suspend pending a review by a higher court"], "a": 1, "e": "B is correct. Voted to keep the original decision = confirm, maintain the validity. \"Uphold\" = to confirm or support something that has been questioned.\n\nA — reconsider in light of new evidence is the opposite.\nC — explain legal reasoning is a different function.\nD — suspend pending review is the opposite.\n\nKelime: uphold — desteklemek, onaylamak, devam ettirmek"}, {"k": "vocab", "p": "The deputy had effectively <u>usurped</u> the director's authority during the months of her illness, signing contracts, directing budgets, and representing the organization at formal functions — all without formal delegation.", "q": "As used in the text, \"usurp\" most nearly means:", "o": ["A) exercise authority in the absence of the designated holder", "B) take a position or role by force or without right", "C) expand the formal scope of an existing role", "D) act on behalf of another under an informal arrangement"], "a": 1, "e": "B is correct. Took over authority without formal delegation = took a role without right. \"Usurp\" = to take a position by force or without right.\n\nA — exercise authority in someone's absence could be legitimate delegation; usurp implies without right.\nC — expand formal scope is an authorized extension.\nD — informal arrangement implies some agreement; usurp implies none.\n\nKelime: usurp — zorla ele geçirmek, hakkı olmadan almak"}, {"k": "vocab", "p": "The clinical trial was designed not simply to show that the drug worked but to <u>validate</u> the theoretical model that had predicted its mechanism — confirming that the effect was occurring through the specific pathway the researchers had proposed.", "q": "As used in the text, \"validate\" most nearly means:", "o": ["A) demonstrate effectiveness in a large population", "B) demonstrate or confirm the truth or value of", "C) satisfy the evidentiary requirements of regulatory review", "D) provide the final data needed to proceed to the next phase"], "a": 1, "e": "B is correct. Confirming the theoretical model by showing the specific mechanism worked = demonstrate or confirm the truth of. \"Validate\" = to demonstrate or confirm the truth or value.\n\nA — demonstrate effectiveness in large populations describes efficacy trials.\nC — satisfy regulatory requirements is a compliance function.\nD — provide data to proceed is a development milestone.\n\nKelime: validate — doğrulamak, onaylamak, geçerli kılmak"}, {"k": "vocab", "p": "The college <u>venerated</u> its founder through an annual ceremony, a prominent statue in the main courtyard, and a scholarship fund bearing her name — gestures that the current generation of students sometimes found excessive.", "q": "As used in the text, \"venerated\" most nearly means:", "o": ["A) formally commemorated at institutional events", "B) regarded with deep respect or reverence", "C) credited with achievements that shaped the institution", "D) made the subject of a publicly accessible historical record"], "a": 1, "e": "B is correct. Annual ceremony, statue, named scholarship = regarded with deep respect. \"Venerate\" = to regard with great respect; to revere.\n\nA — formally commemorated describes the actions but not the feeling.\nC — credited with achievements describes what was recognized.\nD — subject of historical record is a documentation action.\n\nKelime: venerate — saygıyla anmak, ululamak, kutsamak"}, {"k": "vocab", "p": "The campaign literature had been designed to <u>vilify</u> the incumbent, portraying her in misleading contexts, attributing statements she had not made, and using cropped images that gave a false impression of her conduct.", "q": "As used in the text, \"vilify\" most nearly means:", "o": ["A) criticize in a way substantiated by evidence", "B) compare unfavorably to a competing candidate", "C) speak or write about in an abusively disparaging manner", "D) expose to public scrutiny regarding professional conduct"], "a": 2, "e": "C is correct. Misleading contexts, false attributions, cropped images = abusively disparaging, dishonest. \"Vilify\" = to speak or write about in an abusively disparaging manner.\n\nA — criticism substantiated by evidence is different from vilification.\nB — compare unfavorably is a gentler comparison.\nD — expose to public scrutiny is a different action.\n\nKelime: vilify — karalamak, iftira atmak, kötülemek"}, {"k": "vocab", "p": "The region's political situation remained <u>volatile</u>: a new set of elections had produced an inconclusive result, two factions were refusing to recognize the outcome, and street protests had turned violent in three cities.", "q": "As used in the text, \"volatile\" most nearly means:", "o": ["A) difficult to understand due to rapidly shifting alliances", "B) likely to change rapidly and unpredictably; unstable", "C) subject to external interference from neighboring countries", "D) resolved partially but likely to recur within months"], "a": 1, "e": "B is correct. Inconclusive elections, refusing factions, violent protests = likely to change rapidly, unstable. \"Volatile\" = liable to change rapidly and unpredictably.\n\nA — difficult to understand due to alliances describes interpretive difficulty.\nC — external interference is a geopolitical factor.\nD — resolved partially but likely to recur describes a different situation.\n\nKelime: volatile — dengesiz, değişken, patlayıcı"}, {"k": "vocab", "p": "The study found that elderly residents living alone were particularly <u>vulnerable</u> to extreme heat, lacking the social networks, financial resources, and mobility needed to access cooling centers during temperature emergencies.", "q": "As used in the text, \"vulnerable\" most nearly means:", "o": ["A) more likely to be affected by health conditions generally", "B) susceptible to harm; lacking protection against a threat", "C) insufficiently supported by the current social care system", "D) concentrated in areas without adequate infrastructure"], "a": 1, "e": "B is correct. Lacking networks, resources, and mobility = susceptible to harm, lacking protection. \"Vulnerable\" = susceptible to harm; lacking protection.\n\nA — generally more health-affected is a broader claim.\nC — insufficiently supported by social care is a systems critique.\nD — concentrated in underserved areas is a geographic observation.\n\nKelime: vulnerable — savunmasız, korunaksız, zarar görebilir"}, {"k": "vocab", "p": "The position conferred significant influence: its holder could <u>wield</u> veto power over departmental appointments, control the agenda of the monthly steering committee, and approve the annual budget allocation.", "q": "As used in the text, \"wield\" most nearly means:", "o": ["A) hold in reserve for use in critical situations", "B) exercise or exert power or authority", "C) acquire through formal appointment", "D) share with other members of the committee"], "a": 1, "e": "B is correct. Use veto power, control agendas, approve budgets = exercise or exert power. \"Wield\" = to hold and use; to exercise power.\n\nA — hold in reserve implies not using currently.\nC — acquire through appointment describes how power was obtained.\nD — share with other members is a different governance structure.\n\nKelime: wield — kullanmak, elde tutmak, elinde bulundurmak"}, {"k": "vocab", "p": "The court found that the company's failure to warn consumers had been <u>willful</u>, not negligent: internal documents showed that executives were aware of the risk for at least two years before any disclosure was made.", "q": "As used in the text, \"willful\" most nearly means:", "o": ["A) resulting from structural failures in the regulatory system", "B) intentional; done deliberately and knowingly", "C) motivated by financial rather than safety considerations", "D) shared across multiple levels of the organization"], "a": 1, "e": "B is correct. Executives knew for two years and made no disclosure = deliberately and knowingly done. \"Willful\" = done deliberately and intentionally.\n\nA — structural regulatory failures is a different explanation.\nC — financially motivated describes the motive.\nD — shared across levels describes organizational scope.\n\nKelime: willful — kasıtlı, inatçı, bilerek yapılan"}, {"k": "vocab", "p": "The alumni's <u>wistful</u> reminiscences about the old campus — the common rooms, the long library nights, the informal conversations with faculty — revealed a longing for a time and place they knew they could not return to.", "q": "As used in the text, \"wistful\" most nearly means:", "o": ["A) deeply satisfied with the long-term outcomes of that period", "B) having a feeling of vague or regretful longing", "C) critical of the ways academic culture had changed", "D) reluctant to discuss memories associated with difficulty"], "a": 1, "e": "B is correct. Longing for a time they could not return to = vague or regretful longing. \"Wistful\" = having a feeling of vague or regretful longing.\n\nA — deeply satisfied is different from wistful longing.\nC — critical of change is a different orientation.\nD — reluctant to discuss difficult memories is a different response.\n\nKelime: wistful — özlemli, hüzünlü bir şekilde"}, {"k": "vocab", "p": "The infrastructure was designed to <u>withstand</u> sustained winds of up to 120 miles per hour, based on historical data about the most severe storms the region had experienced in the previous century.", "q": "As used in the text, \"withstand\" most nearly means:", "o": ["A) measure accurately for engineering purposes", "B) reduce the impact of through protective design", "C) remain standing or functional in the face of", "D) exceed the performance standards required by regulation"], "a": 2, "e": "C is correct. Designed for winds up to 120 mph = remain standing in the face of the storm. \"Withstand\" = to remain undamaged; to resist.\n\nA — measure accurately is an assessment function.\nB — reduce the impact of implies partial protection; withstand implies full resistance.\nD — exceed regulatory standards is a quality benchmark.\n\nKelime: withstand — dayanmak, karşı koymak, direnmek"}, {"k": "vocab", "p": "The historian argued that the immigration restriction policies of that era were fundamentally <u>xenophobic</u>, targeting specific nationalities not because of any demonstrated security concern but because of cultural anxieties deliberately inflamed by media coverage.", "q": "As used in the text, \"xenophobic\" most nearly means:", "o": ["A) driven by economic concerns about job competition", "B) having or showing a dislike of or prejudice against foreigners", "C) focused on maintaining cultural cohesion within a national commu
