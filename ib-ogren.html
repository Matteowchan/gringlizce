<script id="data" type="application/json">{"title": "IB English B", "badge": "IB", "groups": ["Öğren", "Kişisel", "Profesyonel", "Kitle İletişim", "Writing", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "Paper 1 ve Kriterler", "eyebrow": "Öğren", "blocks": [{"x":"IB English B Nedir ve Bu Sınav Neyi Ölçer?","t":"h"},{"x":"IB Diploma Programı'nda English B, İngilizceyi ikinci dil olarak öğrenen öğrenciler için tasarlanmış bir dil edinimi (language acquisition) dersidir. Amacı seni akıcı bir anadili konuşucusu yapmak değil, gerçek bağlamlarda İngilizceyi anlaşılır, uygun ve etkili biçimde kullanabilen bir iletişimci yapmaktır. Bu ayrım sınavın mantığını çözmenin anahtarıdır: değerlendiriciler kusursuz dil değil, iletişimsel yeterlilik (communicative competence) ararlar. Yani doğru kelimeyi doğru kitleye, doğru amaçla ve doğru tonla söyleyebiliyor musun? Sınav baştan sona bu soruyu sorar.","t":"p"},{"x":"English B dört beceriyi geliştirir ve ölçer: okuma (reading), dinleme (listening), yazma (writing) ve konuşma (speaking). Bu beceriler soyut bir boşlukta değil, IB'nin belirlediği beş zorunlu tema (prescribed themes) etrafında öğretilir. Bu temalar tüm müfredatın ve tüm sınav metinlerinin çatısını kurar; hangi metin türünü yazarsan yaz, konun büyük olasılıkla bu beş temadan birine bağlanır. Temaları tanımak, hem üretim (yazma/konuşma) hem de alımlama (okuma/dinleme) görevlerinde bağlamı hızlı çözmeni sağlar.","t":"p"},{"rows":[["Identities","Kimlik, benlik, sağlık, inançlar, değerler, kültürel aidiyet","Ergenlikte kimlik arayışı, beslenme ve öz-imaj"],["Experiences","Deneyimler, aktiviteler, seyahat, geçiş dönemleri, anılar","Yurt dışında okumak, unutulmaz bir yolculuk"],["Human ingenuity","İnsan yaratıcılığı, teknoloji, bilim, sanat, iletişim, girişim","Yapay zeka, sosyal medyanın icadı, mimari"],["Social organization","Toplumsal düzen, ilişkiler, eğitim, iş dünyası, hukuk, topluluk","Okul kuralları, gönüllülük, çalışma hayatı"],["Sharing the planet","Gezegeni paylaşmak, çevre, barış, haklar, küreselleşme, etik","İklim değişikliği, sürdürülebilirlik, göç"]],"head":["Zorunlu Tema","Kapsadığı fikirler","Örnek konu"],"t":"table"},{"t":"h","x":"Sınavın Tamamı: Üç Değerlendirme Bileşeni"},{"x":"English B notunun tamamı üç bileşenden oluşur ve bunların ağırlıklarını bilmek çalışma zamanını doğru dağıtmanı sağlar. Paper 1 dış değerlendirmedir ve final notunun %25'ini oluşturur; burada yazma becerin ölçülür. Paper 2 de dış değerlendirmedir ve %50 ile en ağırlıklı bileşendir; iki bölümden oluşur: dinleme (listening) ve okuma (reading), yani tüm alımlama becerilerin. Individual Oral ise iç değerlendirmedir (öğretmenin uygular, IB moderasyon yapar) ve %25 ile konuşma becerini ölçer. Kısaca: yarısı anlama, çeyreği yazma, çeyreği konuşma. Bu ders senden dengeli bir dil kullanıcısı olmanı ister; tek beceride güçlü olmak yetmez.","t":"p"},{"x":"Paper 2'nin dinleme bölümünde üç ses kaydı ve toplam 25 puanlık soru bulunur; okuma bölümünde üç yazılı metin ve toplam 40 puanlık soru vardır. Metinler yine beş tema etrafında döner ve giderek zorlaşır. Individual Oral yaklaşık 12-15 dakika sürer ve üç aşamalıdır: bir sunum, sunumla ilgili bir tartışma ve farklı bir tema üzerine genel bir sohbet. Bu güncel yapıyı sınav döneminden önce mutlaka okulunun elindeki en son IB English B Guide'dan teyit et; IB zaman zaman ayrıntıları güncelleyebilir.","t":"p"},{"lines":["Paper 1 uzunluğu: SL'de 250-400 kelime yazarsın, HL'de 450-600 kelime. HL daha uzun ve daha gelişmiş fikir işleyişi bekler.","Individual Oral uyarıcısı: SL'de bir GÖRSEL (visual stimulus) üzerine konuşursun; HL'de okuduğun iki edebi eserden (two literary works) alınmış bir EDEBİ ALINTI (literary extract) üzerine konuşursun.","Edebiyat: HL'de iki edebi eser okumak ZORUNLUDUR; SL'de zorunlu edebiyat yoktur.","Paper 2 metinleri HL'de daha uzun, daha soyut ve daha yoğundur."],"k":"dikkat","t":"note","title":"SL ile HL arasındaki temel farklar"},{"t":"h","x":"Paper 1 Nasıl İşler?"},{"x":"Paper 1 sınavı 75 dakikadır. Önünde üç ayrı görev (prompt) bulunur ve bunlardan yalnızca BİRİNİ seçip yanıtlarsın. Her görev genellikle farklı bir prescribed theme'e ve farklı bir metin türüne yönlendirir. Görev sana üç kritik bilgiyi ya açıkça verir ya da ima eder: kime yazıyorsun (audience), neden yazıyorsun (purpose) ve hangi metin türünde yazıyorsun (text type). Bu üç unsuru doğru okumak, sınavın yarısını kazanmaktır. Görevi yanlış çözersen dilin ne kadar iyi olursa olsun Criterion C'den ciddi puan kaybedersin.","t":"p"},{"x":"Seçim yaparken en iyi İngilizce bildiğin konuyu değil, metin türü kurallarına en iyi hakim olduğun görevi seç. Fikir bolluğun olan ama türünü tanımadığın bir konu tuzaktır; çünkü mesaj güçlü olsa bile yanlış türde yazarsan kavramsal anlayış puanın düşer. Seçtikten sonra doğrudan yazmaya başlama: iki üç dakika plan yap. Kitleyi, amacı, türü ve türün gerektirdiği biçimsel öğeleri (başlık, hitap, imza, alt başlık gibi) bir kenara not et. Bu küçük yatırım, üç kriterde birden puan kazandırır.","t":"p"},{"x":"Üç Değerlendirme Kriterini Derinlemesine Anlamak","t":"h"},{"t":"p","x":"Paper 1'de yazın üç ayrı kritere göre puanlanır ve her biri 0-12 arası bir bant üzerinden değerlendirilir. Bu kriterleri ezberlemek değil, iç mantıklarını kavramak önemlidir; çünkü her yazma görevinde aynı üç soruyu kendine sorarsan puanını kendin yükseltebilirsin. Kriterler birbirinden bağımsız değildir ama her biri farklı bir şeyi ödüllendirir."},{"t":"p","x":"Criterion A: Language (Dil) senin dil dağarcığını ve doğruluğunu ölçer. Değerlendirici şunlara bakar: kelime çeşitliliği ne kadar geniş, dilbilgisi yapıları ne kadar çeşitli ve ne kadar doğru, cümleler ne kadar akıcı. Buradaki en önemli ilke şudur: basit ama doğru bir cümle, karmaşık ama hatalı bir cümleden daha çok puan getirir. Riskli yapılar kurup hata yapmaktansa, kontrol ettiğin yapıları çeşitlendirerek kullan. Aynı kelimeyi tekrar tekrar kullanma; eş anlamlılarla ve bağlaçlarla metnini zenginleştir. Ama süslü kelime avına da çıkma; yanlış yerde kullanılan ileri kelime hata sayılır."},{"t":"p","x":"Criterion B: Message (Mesaj) görevi ne ölçüde yerine getirdiğini ölçer. Üç alt soruya bakılır: fikirlerin göreve ne kadar ilgili (relevant), fikirlerini ne kadar geliştirdin (developed) ve fikirlerin ne kadar açık ve düzenli (organized). Yüzeysel kalmak buradaki en büyük puan kaybıdır. Her iddiayı bir örnek, bir ayrıntı veya bir gerekçeyle destekle. 'Sosyal medya kötüdür' demek yetmez; nasıl, kime, hangi örnekle kötü olduğunu göster. Ayrıca prompt'un istediği her şeyi karşıla; görev iki soru soruyorsa ikisini de yanıtla, aksi halde mesaj eksik kalır."},{"t":"p","x":"Criterion C: Conceptual understanding (Kavramsal anlayış) metin türünü, amacı, kitleyi, register'ı ve tonu doğru kavrayıp kavramadığını ölçer. Bu kriter English B'yi genel bir İngilizce yazma dersinden ayıran şeydir. Register, dilin resmiyet seviyesidir: resmi (formal), yarı resmi (semi-formal) ve gayriresmi (informal) arasında bir yerde durur. Bir iş başvurusu mektubu resmi, bir dergi makalesi yarı resmi, bir arkadaşa e-posta gayriresmi register ister. Ton ise yazının duygusal rengidir: ciddi, esprili, ikna edici, samimi. Doğru metin türünü seçip o türün açılışını, düzenini, biçimsel öğelerini ve register'ını tutturursan Criterion C'yi kazanırsın."},{"k":"protokol","t":"note","title":"Her Paper 1 görevinde uygulayacağın 6 adım","lines":["1. Görevi iki kez oku. Kitle (audience), amaç (purpose) ve metin türünü (text type) altını çizerek belirle.","2. Türün zorunlu biçimsel öğelerini not et: başlık mı, hitap mı, imza mı, alt başlık mı, tarih mi gerekiyor?","3. Register'a karar ver: resmi, yarı resmi yoksa gayriresmi? Bu kararı ilk cümleden son cümleye kadar tutarlı taşı.","4. Üç dört ana fikir seç ve her birini bir örnekle geliştirmeyi planla (Criterion B).","5. Yaz: türün açılış kalıbıyla başla, gövdeyi düzenli böl, türe uygun kapanışla bitir.","6. Son iki dakika kontrol et: tür doğru mu, register tutarlı mı, kelime hedefine ulaştın mı, göze çarpan dilbilgisi hataları var mı?"]},{"t":"p","x":"Criterion A'yı somutlaştıralım. Zayıf bir öğrenci şöyle yazar: 'Social media is bad. Social media is dangerous. Social media makes people sad.' Üç cümlede de aynı yapı, aynı kelime, sıfır çeşitlilik. Güçlü bir öğrenci aynı fikri şöyle kurar: 'While social media connects us instantly, it can also quietly erode our confidence, leaving many young people feeling isolated despite being constantly online.' Aynı fikir, ama çeşitli bağlaç (while, despite), çeşitli kelime (erode, isolated) ve tek akıcı cümle. İşte Criterion A farkı budur: doğruluğu korurken çeşitliliği artırmak. Ezberlenmiş kalıp cümleler yerine, bildiğin yapıları farklı biçimlerde bağlayarak bu bandı yükseltirsin."},{"x":"Kitle (audience) kavramı bütün kararlarının merkezindedir çünkü kime yazdığın ne söyleyeceğini ve nasıl söyleyeceğini belirler. Bir okul müdürüne yazıyorsan saygılı ve gerekçeli olursun; yaşıtlarına bir blogda yazıyorsan samimi ve doğrudan olursun; genel bir dergi okuruna yazıyorsan hem bilgilendirir hem ilgi çekersin. Kitleyi belirledikten sonra kendine sor: bu kişi neyi zaten biliyor, neyi bilmiyor, hangi tonu bekliyor, onu neyle ikna ederim? Bu sorulara verdiğin yanıtlar hem kelime seçimini hem de örneklerini şekillendirir. Kitleyi yok sayan bir yazı, dili iyi olsa bile hedefini ıskalar.","t":"p"},{"x":"Beş tema ile metin türleri arasındaki bağ da önemlidir. Aynı tema, farklı metin türleriyle işlenebilir: 'Sharing the planet' teması bir gazete makalesinde bilgilendirici, bir konuşmada ikna edici, bir bloga kişisel, bir resmi raporda çözüm odaklı biçimde ele alınabilir. Görev sana temayı verir; senin işin o temayı, istenen metin türünün mercekinden yeniden çerçevelemektir. Bu yüzden çalışırken her temayı en az iki üç farklı metin türünde denemen, sınavda hangi görev gelirse gelsin hazır olmanı sağlar.","t":"p"},{"k":"ipucu","t":"note","title":"Konuşma becerisi de aynı mantıkla çalışır","lines":["Individual Oral'da SL'de bir görsel, HL'de bir edebi alıntı üzerine 3-4 dakikalık bir sunum yaparsın; ardından tartışma ve genel sohbet gelir.","Yazmada olduğu gibi burada da kitle, amaç ve register önemlidir: görseli/alıntıyı betimle, yorumla ve bir prescribed theme ile ilişkilendir.","Konuşurken akıcılık ve etkileşim (soruları anlayıp gelişterek yanıtlama) puan getirir; ezber metin okumak değil, düşünerek konuşmak esastır.","Yazma derslerinde geliştirdiğin fikir işleme ve örnekle destekleme alışkanlığı doğrudan oral başarına da yansır."]},{"t":"h","x":"Sık Yapılan Hatalar ve Nasıl Kaçınılır"},{"x":"En yaygın hata metin türünü karıştırmaktır: öğrenci makale yazması gerekirken deneme yazar, blog yazması gerekirken resmi rapor tonuna kayar. Tür yanlış olduğunda mesaj mükemmel olsa bile Criterion C çöker. İkinci yaygın hata register kaymasıdır: resmi bir mektuba 'Hey!' diye başlayıp sonra resmi kapanış yapmak gibi. Register'ı baştan sona sabit tut. Üçüncü hata yüzeysellik: fikirleri sıralayıp geçmek ama hiçbirini derinleştirmemek. Dördüncü hata kelime hedefini tutturmamak; çok kısa yazı fikri geliştiremez, aşırı uzun yazı ise dil hatalarını çoğaltır ve süreni tüketir.","t":"p"},{"t":"p","x":"Son bir dürüstlük notu: bu ders sınav odaklıdır ama ezber değildir. Her metin türünün mantığını anlarsan, daha önce görmediğin bir görevle karşılaşsan bile doğru kararları verebilirsin. Aşağıdaki derslerde her metin türünü tek tek, kitle-amaç-register üçlüsüyle ve model örneklerle işleyeceğiz. Sınav yapısına dair tüm ayrıntıları (kelime sınırları, süreler, kriter bant açıklamaları) her zaman okulunun elindeki güncel resmi IB English B Guide'dan doğrula; burada verilen bilgiler öğretim amaçlıdır ve resmi kılavuz esas alınmalıdır."},{"t": "p", "x": "IB English B Paper 1'de üç görevden birini seçip belirli bir metin türünde (text type) yazarsın. Metin türünü doğru seçmek ve o türün kurallarına uymak, dilbilgisi kadar önemlidir."}, {"t": "table", "head": ["Kriter", "Ne ölçer", "Neye dikkat"], "rows": [["A. Language", "Dil: kelime çeşitliliği, dilbilgisi doğruluğu, akıcılık", "Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Kelime tekrarından kaçın."], ["B. Message", "Mesaj: göreve uygunluk, fikir gelişimi, ilgililik", "Prompt'un istediğini tam karşıla. Fikirleri örnekle geliştir, yüzeysel bırakma."], ["C. Conceptual understanding", "Kavramsal: metin türü, amaç, kitle, register, ton", "Seçtiğin türün kurallarına uy. Kitlene ve amaca uygun ton ve biçim kullan."]]}, {"t": "note", "k": "dikkat", "title": "En sık kaybedilen puan", "lines": ["Criterion C. Öğrenci makale yazacakken deneme yazar, blog yazacakken resmi rapor tonu kullanır. Tür yanlışsa mesaj iyi olsa bile C düşer.", "Her türün açılışı, düzeni ve register'ı farklıdır. Önce türü tanı, sonra yaz."]}]}, {"id": "karsilastirma", "group": "Öğren", "name": "Karşılaştırma Tablosu", "eyebrow": "Metin Türleri", "blocks": [{"x":"Metin Türü Neden Her Şeyin Merkezinde?","t":"h"},{"t":"p","x":"IB English B Paper 1'de yazın üç kritere göre değerlendirilir ve bunlardan biri, Criterion C, tamamen metin türü, kitle, amaç ve register üzerine kuruludur. Yani puanının üçte biri, doğru türü seçip o türün kurallarına uymana bağlıdır. Bu yüzden metin türlerini birbirinden ayırmayı öğrenmek, dilbilgisi çalışmak kadar önemlidir. Bir öğrenci en akıcı İngilizceyi yazsa bile, makale isteyen bir görevde deneme yazarsa, ya da resmi mektup isteyen bir görevde blog tonuna kayarsa, kavramsal anlayış puanı düşer. Bu ders sana türleri bir sistem içinde tanımayı öğretir: her türün kendine has amacı, kitlesi, register'ı ve tanınabilir biçimsel imzası vardır."},{"x":"Bir metin türünü tanımanın en pratik yolu üç soruyu sırayla sormaktır. Birincisi: bu metnin amacı ne (purpose)? Bilgilendirmek mi, ikna etmek mi, eğlendirmek mi, harekete geçirmek mi, kişisel duygu paylaşmak mı? İkincisi: kim okuyacak (audience)? Genel halk mı, belirli bir yetkili mi, yaşıtların mı, kendin mi? Üçüncüsü: hangi resmiyet seviyesi uygun (register)? Bu üç yanıt bir araya geldiğinde türü ve o türün gerektirdiği biçimi neredeyse otomatik olarak ortaya çıkarır. Örneğin amaç 'harekete geçirmek', kitle 'genel halk', register 'ikna edici ve doğrudan' ise, muhtemelen bir konuşma, broşür veya reklam yazıyorsundur.","t":"p"},{"x":"Register Yelpazesi: Resmiden Gayriresmiye","t":"h"},{"t":"p","x":"Register, dilin resmiyet derecesidir ve bir yelpaze üzerinde düşünülmelidir. En resmi uçta iş mektupları, resmi raporlar ve öneriler bulunur: burada tam cümleler, kısaltmasız yapılar (do not, cannot), nesnel ton ve saygılı hitaplar kullanılır. Orta bölgede, yarı resmi register'da makaleler, incelemeler ve görüş yazıları yer alır: bilgilendirici ama okurla ilişki kuran, yer yer soru soran, ama argo içermeyen bir dil. En gayriresmi uçta ise bloglar, günlükler, arkadaşa mektuplar ve sosyal medya gönderileri vardır: kısaltmalar (I'm, don't), doğrudan seslenme, ünlem, kişisel ton ve bazen mizah serbesttir. Türü belirledikten sonra register'ı bu yelpazede konumlandır ve baştan sona tutarlı taşı."},{"t":"table","head":["Register","Tipik türler","Dil özellikleri"],"rows":[["Resmi (formal)","Resmi mektup, rapor, öneri, yönerge","Kısaltma yok, nesnel ton, tam yapılar, saygılı hitap"],["Yarı resmi (semi-formal)","Makale, inceleme, görüş yazısı, röportaj, haber","Bilgilendirici ama sıcak, ara sıra okura soru, örnekler"],["Gayriresmi (informal)","Blog, günlük, arkadaşa mektup/e-posta, sosyal medya","Kısaltmalar, ünlem, doğrudan seslenme, kişisel ve samimi ton"]]},{"t":"h","x":"Türleri Ayırt Etmenin Pratik İpuçları"},{"t":"p","x":"Birbirine benzeyen türler öğrencileri en çok yanıltan tuzaktır. Makale ile deneme (essay) karıştırılır: makale bir dergi okuru için ilgi çekici ve alt başlıklıdır, deneme ise bir soruyu dengeli biçimde tartışan, daha akademik ve akıcı paragraflı bir metindir. Blog ile günlük (diary) karıştırılır: blog online bir okur kitlesine yazılır ve onları içine çeker, günlük ise yazarın kendisine yazdığı, en mahrem ve serbest türdür. Rapor ile makale karıştırılır: rapor bir yetkiliye bulgu ve öneri sunan, başlıklı ve nesnel bir belgedir; makale ise genel okuru bilgilendiren ve ilgilendiren bir yayın metnidir. Konuşma ile makale karıştırılır: konuşma canlı bir dinleyiciye hitap eder, doğrudan seslenir ('Ladies and gentlemen'), makale ise okunmak için yazılır."},{"t":"p","x":"Her türün bir 'imza öğesi' vardır; bu öğe metni ilk bakışta ele verir ve değerlendiriciye türü doğru anladığını gösterir. Mektupta hitap ve imza, makalede başlık ve alt başlıklar, konuşmada dinleyiciye seslenme ve retorik sorular, blogda kişisel ses ve okura çağrı, raporda başlıklar ve maddeler, günlükte tarih ve 'Dear Diary', röportajda soru-cevap düzeni, reklamda slogan ve harekete geçirici çağrı. Yazmaya başlamadan önce seçtiğin türün imza öğelerini not et ve mutlaka metnine dahil et. Bu öğeler Criterion C'nin en görünür kanıtlarıdır."},{"t":"note","k":"protokol","title":"Tür seçimi ve doğrulama akışı","lines":["1. Görevdeki anahtar kelimeleri bul: 'write an article', 'a letter to', 'a speech', 'a blog post' gibi ifadeler türü doğrudan söyler.","2. Türü kesinleştir; sonra amaç-kitle-register üçlüsünü yaz.","3. O türün imza öğelerini listele (başlık, hitap, imza, alt başlık, tarih vb.).","4. Register'a karar ver ve bir örnek açılış cümlesi kur.","5. Yazarken her paragrafta kendine sor: bu cümle bu türe ve bu kitleye uygun mu?"]},{"lines":["Makale yerine deneme yazmak: alt başlık ve çekici başlık yoksa makale değildir.","Resmi mektuba gayriresmi başlamak: 'Dear Sir/Madam' ile açıp 'Hey' tonuna kaymak register'ı bozar.","Blog yerine kişisel günlük yazmak: blog bir OKUR kitlesine seslenir, günlük yalnızca yazara."],"title":"En sık üç karışıklık","k":"dikkat","t":"note"},{"x":"Amaç: Metnin Ne Yapmaya Çalıştığı","t":"h"},{"x":"Her metnin bir amacı vardır ve bu amaç türü büyük ölçüde belirler. Başlıca amaçları tanımak, türü hızlı daraltmanı sağlar. Bilgilendirmek isteyen metinler makale, rapor ve haber gibi türlerdir; okura bir konuyu açıklar ve nesnel kalmaya çalışırlar. İkna etmek isteyen metinler görüş yazısı, konuşma ve reklamdır; okuru bir görüşe veya eyleme çekerler. Kişisel deneyim paylaşmak isteyen metinler blog, günlük ve gayriresmi mektuptur; samimi ve öznel bir ses taşırlar. Harekete geçirmek isteyen metinler broşür, reklam ve çağrı metinleridir; okuru somut bir adıma yöneltirler. Çoğu metin birden çok amacı birleştirir; örneğin makale hem bilgilendirir hem ilgilendirir, broşür hem bilgilendirir hem harekete geçirir. Amacı doğru okuduğunda, o amaca uygun türü ve tonu seçmek kolaylaşır.","t":"p"},{"t":"h","x":"Kitle: Kime Yazdığın Her Şeyi Değiştirir"},{"x":"Kitle, metnin en sık gözden kaçan ama en belirleyici unsurudur. Aynı konuyu bir okul müdürüne, bir yaşıtına veya genel bir dergi okuruna anlatmak tamamen farklı üç metin üretir. Kitleyi belirledikten sonra üç soru sor: bu kişi konuyu ne kadar biliyor, benden hangi tonu bekliyor ve onu neyle ikna ederim? Uzman olmayan bir okura teknik terimleri açıklaman gerekir; bir yetkiliye saygılı ve gerekçeli olmalısın; bir yaşıtına samimi ve doğrudan olabilirsin. Kitle, kelime seçiminden cümle uzunluğuna, örneklerden tona kadar her kararı yönlendirir. Kitleyi yok sayan bir metin, dili ne kadar iyi olursa olsun hedefini ıskalar ve Criterion C'de kaybeder. Yazmadan önce kitleni bir cümleyle tanımla ve tüm metni o kişiyle konuşuyormuş gibi kur.","t":"p"},{"t":"h","x":"Görevi Çözmek: Prompt'tan Türe"},{"x":"Paper 1'de her görev, türü, kitleyi ve amacı ya açıkça söyler ya da güçlü ipuçlarıyla ima eder. Görevdeki anahtar ifadeleri avlamak, çözümün ilk adımıdır. 'Write an article for your school magazine' cümlesi türü (makale), kitleyi (okul dergisi okuru) ve dolaylı olarak register'ı (yarı resmi) verir. 'Write a letter to the mayor' resmi mektup, bir yetkili kitle ve resmi register demektir. 'Write a blog post about your experience' blog, çevrimiçi okur ve gayriresmi register demektir. Bu ifadeleri altını çizerek belirle; sonra türün imza öğelerini ve register'ını not et. Görevi yanlış çözmek, en sık puan kaybının kaynağıdır; birkaç dakikalık dikkatli okuma, üç kriterde birden kazandırır.","t":"p"},{"x":"Tür, Kitle, Register ve Üç Kriter İlişkisi","t":"h"},{"x":"Metin türü bilgisi doğrudan Criterion C'ye (Conceptual understanding) hizmet eder çünkü bu kriter tam olarak türü, kitleyi, amacı ve register'ı doğru kavrayıp kavramadığını ölçer. Ama tür bilgisi diğer iki kritere de dolaylı katkı sağlar. Doğru türü seçtiğinde, o türün fikir işleme biçimini (makalede örnekleme, görüş yazısında argüman, blogda deneyim) kullanırsın ve bu Criterion B'yi (Message) güçlendirir. Doğru register'ı seçtiğinde, o register'a uygun kelime ve yapıları kullanırsın ve bu Criterion A'yı (Language) besler. Yani tür, kitle ve register üçlüsü sınavın bütününe yayılır; bu üçlüyü doğru kurmak, tek bir kriteri değil, üçünü birden yukarı çeker. İşte bu yüzden metin türlerini tanımak, English B'de dilbilgisi kadar temel bir beceridir.","t":"p"},{"lines":["İlk cümleni doğru register'da kur; tüm metnin tonu o cümleyi izler.","Kısaltma kararını baştan ver: resmi türde do not/cannot, gayriresmide don't/can't.","Metnin ortasında 'ton kaydı mı?' diye dur ve kontrol et; en sık kayma orta paragraflarda olur.","Kapanışı da açılışla aynı register'da bitir; çoğu öğrenci sonda gevşer ve tonu bozar."],"title":"Register'ı tutarlı taşımanın sırrı","t":"note","k":"ipucu"},{"t":"p","x":"Bir metin türünü daha yazmaya başlamadan görünür kılan en pratik test, imza öğesi testidir: 'Bu metnin ilk üç satırına bakan biri hangi türü okuduğunu anlar mı?' Resmi mektupta bu ilk satırlar hitap ve amaç cümlesidir; makalede çekici başlık ve kanca; konuşmada selamlama; blogda kişisel ve doğrudan bir açılış. İmza öğesi eksikse, tür belirsiz kalır ve Criterion C zayıflar. Bu yüzden yazmaya başlamadan önce seçtiğin türün ilk izlenim öğelerini planla; okur daha ilk satırda ne okuduğunu anlamalıdır."},{"x":"Türleri Üç Aileye Ayırmak","t":"h"},{"x":"Onlarca metin türünü ezberlemek yerine, onları amaç ve bağlamlarına göre üç aileye ayırmak işini kolaylaştırır. Kişisel türler (blog, günlük, gayriresmi mektup, sosyal medya gönderisi) yakın bir kitleye veya kendine yazılır; gayriresmi register, birinci tekil şahıs ve samimi ton taşırlar. Profesyonel türler (resmi mektup, rapor, öneri, yönerge) bir kuruma veya yetkiliye yazılır; resmi register, nesnel ton ve düzenli yapı isterler. Kitle iletişim türleri (makale, haber, konuşma, broşür, reklam, inceleme, röportaj, görüş yazısı) geniş bir kitleye seslenir; genellikle yarı resmi register kullanır ve okuru bilgilendirmeyi, ikna etmeyi veya harekete geçirmeyi amaçlarlar. Bir görevle karşılaştığında önce hangi aileye ait olduğunu belirle; bu, register ve ton kararlarının yarısını hemen çözer.","t":"p"},{"t":"p","x":"Bu aile mantığı, sınavda hızlı ve doğru karar vermeni sağlar. Örneğin görev seni bir yetkiliye yazmaya yönlendiriyorsa profesyonel aileyi düşün: resmi register, açık amaç, düzenli yapı. Bir yaşıtına veya çevrimiçi okura sesleniyorsan kişisel aileye geç: gayriresmi, samimi, doğrudan. Geniş bir okur veya dinleyici kitlesine hitap ediyorsan kitle iletişim ailesine bak: yarı resmi, ilgi çekici, bilgilendirici veya ikna edici. Aile belirlendikten sonra, o ailedeki türler arasındaki ince farklar (makale mi görüş yazısı mı, blog mu günlük mü) imza öğeleriyle çözülür. Bu iki aşamalı yaklaşım (önce aile, sonra tür) hem hızlı hem güvenilirdir."},{"t":"p","x":"Son olarak, tür tanıma bir ezber değil, bir düşünme alışkanlığıdır. Sınavda daha önce hiç çalışmadığın bir görev bile gelse, amaç-kitle-register üçlüsünü ve aile mantığını uygularsan doğru kararları verebilirsin. Her metin türünün neden o biçimde yazıldığını anladığında, kuralları körü körüne uygulamak yerine onların mantığını kullanırsın. Bu esneklik, seni sınavın sürprizlerine karşı hazırlıklı kılar. Bir sonraki adım, bu genel çerçeveyi her türe tek tek uygulamaktır; alt dersler bunun için vardır."},{"x":"Aşağıdaki her metin türü dersinde bu üç soruyu (amaç, kitle, register) tek tek uygulayacak, imza öğelerini, dil özelliklerini ve çözümlü model örnekleri inceleyeceğiz. Unutma: tür bilgisi ezber değil, mantıktır. Bir türün neden o biçimde yazıldığını anlarsan, sınavda daha önce hiç çalışmadığın bir görevle karşılaşsan bile doğru kararları verebilirsin. Sınavdaki güncel metin türü listesini ve beklentileri her zaman okulunun elindeki resmi IB English B Guide'dan teyit et.","t":"p"},{"t": "p", "x": "En sık çıkan metin türlerinin hızlı karşılaştırması. Ayrıntılar alt derslerde."}, {"t": "table", "head": ["Tür", "Amaç", "Kitle", "Register"], "rows": [["Makale (Article)", "Bilgilendir ve ilgi çek", "Genel dergi/gazete okuru", "Yarı resmi"], ["Blog / Günlük", "Kişisel düşünce ve deneyim paylaş", "Online okur veya kişinin kendisi", "Kişisel, samimi"], ["Konuşma (Speech)", "İkna et veya bilgilendir", "Canlı dinleyici kitlesi", "Hitabet, doğrudan seslenme"], ["Broşür (Brochure)", "Tanıt ve harekete geçir", "Potansiyel müşteri/halk", "İkna edici, kısa"], ["Görüş yazısı (Opinion column)", "Bir görüşü savun", "Gazete okuru", "İkna edici, kişisel görüş"], ["Resmi mektup/e-posta", "Talep, şikayet, başvuru", "Belirli bir muhatap", "Resmi"], ["İnceleme (Review)", "Değerlendir ve öner", "Karar vermeye çalışan okur", "Yarı resmi, öznel"], ["Yönerge (Instructions)", "Nasıl yapılacağını öğret", "Kullanıcı", "Nötr, net, emir kipi"]]}, {"t": "note", "k": "ipucu", "title": "Seçim kuralı", "lines": ["Prompt kitleyi ve amacı söyler. School magazine diyorsa makale, your friend diyorsa e-posta/blog, at an assembly diyorsa konuşma. Kitle + amaç türü belirler."]}]}, {"id": "t-article", "group": "Kitle İletişim", "name": "Makale (Article)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Makale (Article) Nedir ve Ne Zaman Karşına Çıkar?"},{"x":"Makale, bir dergi, gazete, okul yayını veya web sitesi için yazılan, bir konuyu hem bilgilendirici hem ilgi çekici biçimde ele alan bir metin türüdür. Paper 1'de en sık çıkan türlerden biridir çünkü beş prescribed theme'in her biriyle kolayca eşleşir: 'Human ingenuity' altında teknoloji, 'Sharing the planet' altında çevre, 'Identities' altında gençlik ve kimlik konuları makale için idealdir. Makalenin özü şudur: uzman olmayan ama meraklı bir okura, bir konuyu açıklarken onun ilgisini canlı tutmak. Ne kuru bir ansiklopedi maddesi, ne de kişisel bir günlük; ikisinin arasında, bilgilendirirken eğlendiren bir denge kurar.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"x":"Makalenin kitlesi genellikle bir yayının genel okurudur: konuyu belki hiç bilmeyen ama öğrenmeye açık kişiler. Bu yüzden teknik terimleri açıklaman, örneklerle somutlaştırman gerekir. Amaç ikili bir görevdir: bilgilendirmek ve ilgilendirmek. Yalnızca bilgi verirsen sıkıcı, yalnızca ilgi çekmeye çalışırsan boş olursun; ikisini dengelemelisin. Register yarı resmidir: ne akademik bir makale kadar mesafeli, ne de bir blog kadar samimi. Okura ara sıra 'you' ile seslenebilir, retorik soru sorabilirsin, ama argo ve aşırı kısaltma kullanmazsın. Bu yarı resmi denge, makaleyi hem güvenilir hem okunur kılar.","t":"p"},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Bir makalenin görünür bir iskeleti olmalıdır ve bu iskelet Criterion C'nin ilk kanıtıdır. Çekici bir başlık (headline) ile başlar; bu başlık genellikle bir soru ('Are We Losing the Art of Conversation?') veya kışkırtıcı bir ifade içerir. Girişte okuru içine çeken bir kanca (hook) bulunur: küçük bir sahne, çarpıcı bir istatistik veya doğrudan bir soru. Gövde iki üç bölüme ayrılır ve her bölüme bir ALT BAŞLIK (subheading) verilir; bu alt başlıklar hem düzeni gösterir hem okumayı kolaylaştırır. Kapanış toparlayıcıdır: okuru düşündüren bir soru, bir çağrı veya bir öngörüyle biter. Bazı makalelerde yazarın adı (byline) da bulunur."},{"x":"Açılışın gücü makalenin kaderini belirler. Zayıf bir açılış konuyu doğrudan duyurur: 'In this article I will talk about technology.' Bu okuru içine çekmez. Güçlü bir açılış ise okuru bir sahnenin ortasına bırakır: 'Walk into any cafe today and you will see the same scene: a table of friends, each staring at a screen.' Okur o kafeyi görür, kendini içeride hisseder ve okumaya devam eder. İlk iki cümlede merak uyandırmak, makale yazmanın en kritik becerisidir.","t":"p"},{"t":"h","x":"Dil ve Retorik Araçlar"},{"t":"p","x":"Makale, okurla bir bağ kuran dil araçlarını kullanır. Retorik sorular okuru düşünmeye davet eder ('But is technology really to blame?'). Doğrudan seslenme ('you', 'we') okuru sürecin içine alır. Somut örnekler ve mini anekdotlar soyut iddiaları elle tutulur kılar. Üçlü listeler ve karşıtlıklar ritim katar. Ancak makale bir görüş yazısı değildir; dengeli kalır, farklı açıları anar ve okuru kendi sonucuna yönlendirir. Criterion A için bu tür bir yazıda kelime çeşitliliği kolayca sergilenir: bir konuyu farklı açılardan anlatmak, doğal olarak farklı kelime alanlarını devreye sokar."},{"x":"Çözümlü Model Örnek","t":"h"},{"x":"Bu dersteki model cevabı ('Are We Losing the Art of Conversation?') şu yüzden güçlüdür: başlık bir soru olarak merak uyandırır; giriş bir kafe sahnesiyle okuru içine çeker ve hemen bir retorik soruyla düşünmeye iter. Gövde iki alt başlıkla ('The Comfort of the Screen', 'What We Lose') düzenli biçimde bölünmüştür ve her bölüm bir fikri örnekle geliştirir; 'we quietly tell the person opposite us that they are less interesting than a notification' cümlesi soyut bir fikri çarpıcı bir imgeye çevirir. Kapanış bir çağrıyla ('leave your phone in your bag') okuru harekete davet eder ve son cümle akılda kalıcı bir imge bırakır. İşte üç kriteri birden karşılayan bir makale böyle görünür: yarı resmi ama sıcak (C), fikirler örneklerle geliştirilmiş (B), dil çeşitli ve akıcı (A).","t":"p"},{"t":"h","x":"Makaleyi Benzer Türlerden Ayırmak"},{"x":"Öğrenciler makaleyi en çok denemeyle (essay) ve görüş yazısıyla (opinion column) karıştırır. Bu üç tür de bir konuyu ele alır ama amaçları ve biçimleri farklıdır. Makale bilgilendirir ve ilgilendirir; dengeli kalır ve alt başlıklarla görsel bir yapı kurar. Deneme bir soruyu akademik ve akıcı paragraflarla, alt başlıksız biçimde tartışır; daha resmi ve daha analitiktir. Görüş yazısı ise açıkça taraf tutar ve okuru ikna etmeye çalışır. Aynı konuyu (örneğin sosyal medya) her üç türde de yazabilirsin ama biçim ve ton tamamen değişir. Görevdeki 'article' kelimesini gördüğünde makale kurallarına geç: başlık, alt başlık, yarı resmi ton ve dengeli bakış.","t":"p"},{"rows":[["Makale (Article)","Bilgilendir ve ilgilendir","Başlık + alt başlıklar, dengeli, yarı resmi"],["Deneme (Essay)","Bir soruyu tartış","Akademik paragraflar, alt başlıksız, analitik"],["Görüş yazısı (Opinion)","İkna et, taraf tut","Net tez, gerekçeli argümanlar, ikna edici"]],"head":["Tür","Amaç","Ayırt edici biçim"],"t":"table"},{"x":"Fikri Derinleştirmek: Yüzeysellikten Kaçınmak","t":"h"},{"x":"Makalede en çok kaybedilen puan Criterion B'de, yüzeysellikten gelir. Yüzeysel bir yazar iddiaları sıralar ama hiçbirini geliştirmez: 'Social media affects our sleep. It also affects our mood. And it wastes our time.' Bu üç cümle üç ayrı iddiayı çıplak bırakır. Derinleştiren bir yazar tek bir iddiayı alır ve onu örnekle, sonuçla, ayrıntıyla işler: 'Scrolling late into the night does more than steal our sleep; the blue light tricks our brains into thinking it is still daytime, so even after we finally put the phone down, real rest refuses to come.' Aynı fikir, ama artık bir mekanizma, bir sonuç ve bir imge var. Her paragrafta bir fikri seç ve onu sonuna kadar götür; üç fikri yüzeysel geçmektense bir fikri derinlemesine işlemek daha çok puan getirir.","t":"p"},{"t":"p","x":"Bir fikri geliştirmenin pratik bir yöntemi 'iddia, açıklama, örnek, sonuç' zinciridir. Önce iddiayı söyle, sonra neden böyle olduğunu açıkla, ardından somut bir örnek ver ve son olarak bunun ne anlama geldiğini belirt. Bu dört adımlı zincir her paragrafı tam ve ikna edici kılar. Makalede bu zinciri iki üç kez kurduğunda, gövde hem bilgilendirici hem doyurucu olur ve okur her bölümden bir şey öğrenerek çıkar."},{"t":"h","x":"Makale Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"x":"Makale yazmayı öğrenmek yalnızca Paper 1'e yaramaz. Paper 2 okuma bölümünde önüne sıkça makaleler çıkar; makalenin yapısını (başlık, alt başlık, kanca, dengeli gövde) tanıyan bir öğrenci metni daha hızlı çözer ve soruları daha isabetli yanıtlar, çünkü yazarın nereye ne koyduğunu önceden bilir. Individual Oral'da ise bir görseli veya edebi alıntıyı yorumlarken makalede kazandığın 'iddia-örnek-sonuç' fikir işleme alışkanlığı doğrudan işe yarar: gözlemini söyler, örnekle destekler ve bir prescribed theme ile ilişkilendirirsin. Böylece bir türde geliştirdiğin beceri, sınavın üç bileşenine birden yayılır.","t":"p"},{"k":"ipucu","t":"note","title":"Makalede puan kazandıran küçük hamleler","lines":["Başlığı soru veya kelime oyunuyla çekici yap; düz bir konu adı yazma.","Her alt başlığı kısa ve merak uyandırıcı tut; paragrafın içeriğini özetlesin.","Girişte bir kanca kullan: sahne, istatistik veya doğrudan soru.","Her paragrafta iddia-açıklama-örnek-sonuç zincirini kur.","Kapanışta okura bir düşünce veya çağrı bırak, konuyu havada kesme."]},{"t":"p","x":"Sık yapılan hatalar makaleyi zayıflatır. En büyüğü yapısızlıktır: başlık ve alt başlık olmadan yazılan bir metin makale gibi görünmez ve Criterion C düşer. İkincisi register kaymasıdır: makaleyi çok akademik yapıp okuru sıkmak ya da çok gündelik yapıp ciddiyeti kaybetmek. Üçüncüsü yüzeyselliktir: 'Technology is bad for us' gibi iddiaları örneklemeden sıralamak. Her iddiayı bir örnek, bir ayrıntı veya bir istatistikle destekle. Dördüncüsü ise tek yanlılık: makale dengeli olmalı, bir görüş yazısına dönüşmemelidir. Bu ayrımı unutma; makale bilgilendirir ve ilgilendirir, dayatmaz."},{"x":"Temayı Makale Merceğinden Çerçevelemek","t":"h"},{"t":"p","x":"Sınavda makale görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı makale biçiminde yeniden çerçevelemektir. Örneğin 'Human ingenuity' teması altında yapay zeka konusu verildiğinde, bunu bir makaleye dönüştürmenin yolu şudur: önce okuru ilgilendiren bir açıdan yaklaş ('Yapay zeka işimizi elimizden mi alacak, yoksa bize yeni işler mi açacak?'), sonra iki üç alt başlıkla farklı boyutları göster (günlük hayat, iş dünyası, etik), her bölümde somut örnekler ver ve dengeli bir kapanışla okuru düşündür. Aynı tema bir konuşmada ikna edici, bir blogda kişisel, bir raporda çözüm odaklı işlenebilirdi; makale merceği ise bilgilendirici ve ilgi çekici bir denge ister. Bu çerçeveleme becerisi, hangi tema gelirse gelsin makaleyi güvenle yazmanı sağlar."},{"t":"p","x":"Makalede kapanış, girişte kurduğun kancayı tamamlayan bir çerçeve işlevi görebilir. Girişte bir soru sorduysan, kapanışta ona bir yanıt veya yeni bir bakış sun; girişte bir sahne çizdiysen, kapanışta o sahneye dönerek daireyi kapat. Örneğin kafe sahnesiyle açan bir makale, kapanışta 'Belki de bir dahaki sefere o kafede telefonunu çantanda bırakırsın' diyerek başladığı yere döner. Bu döngüsel yapı okurda bir tamlık ve doyum hissi bırakır ve metnin özenle kurulduğunu gösterir. Kapanışı asla havada kesme; makale bir düşünce, bir çağrı veya bir öngörüyle net biçimde sonlanmalıdır."},{"t":"p","x":"Zaman yönetimi de makale başarısının parçasıdır. 75 dakikanın ilk beş dakikasını planlamaya ayır: başlığını, iki üç alt başlığını ve her bölümde vereceğin örneği belirle. Ardından yaklaşık elli beş dakika yaz ve son on dakikayı kontrole sakla. Kontrolde şunlara bak: başlık ve alt başlıklar yerinde mi, register baştan sona yarı resmi mi, her iddia bir örnekle desteklenmiş mi, göze çarpan dilbilgisi hataları var mı ve kelime hedefine (SL için 250-400, HL için 450-600) ulaştın mı. Bu disiplinli akış, panik yazımın yol açtığı yapısal ve dilsel hataları büyük ölçüde önler."},{"t":"p","x":"Değerlendiricinin gözünden makale, görsel yapısı ve dengeli tonuyla tanınır. Criterion C için değerlendirici başlık, alt başlık ve yarı resmi register arar; Criterion B için fikirlerin örneklerle geliştirilip geliştirilmediğine bakar; Criterion A için ise dilin çeşitli ve doğru olup olmadığını inceler. Yazarken bu üç göz zihninde olsun ve her bölümü yazdıktan sonra kendine sor: bu makale gibi mi duruyor, fikir gelişti mi, dil zengin mi? Bu içsel denetim, panik yazımın gözden kaçırdığı boşlukları kapatır."},{"x":"Özetle makale, English B'nin en çok yönlü türüdür: doğru başlık, ilgi çekici giriş, alt başlıklı gövde ve yarı resmi ton dörtlüsünü tutturursan üç kriterde de güçlü durursun. Sınavda makale görevini seçtiğinde önce başlığını ve iki alt başlığını planla; iskelet hazır olduğunda yazı kendiliğinden akar. Kelime sınırlarını ve metin türü beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konu hakkında bilgilendirmek ve okuru ilgilendirmek."], ["Kitle", "Bir dergi, gazete veya okul yayınının genel okuru."], ["Register / Ton", "Yarı resmi. Ne akademik ne günlük konuşma."], ["Yapı", "Çekici başlık, ilgi çeken giriş, alt başlıklarla bölümlenmiş gövde, toparlayan kapanış."], ["Tipik özellikler", "Çekici başlık, doğrudan okura soru, örnekler, alt başlıklar, bazen yazarın adı (byline)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin açını belirle.", "2. Merak uyandıran, çekici bir başlık bul.", "3. Girişte okuru içine çek: bir soru, küçük bir sahne veya çarpıcı bir gerçek.", "4. Gövdeyi 2-3 bölüme ayır ve her birine bir ALT BAŞLIK ver.", "5. Fikirleri örnek ve ayrıntıyla geliştir; yer yer 'you' ile okura seslen.", "6. Toparlayan, düşündüren bir kapanış yaz.", "7. Son kontrol: başlık + ilgi çeken giriş + alt başlıklar + yarı resmi ton var mı?"]}, {"t": "given", "title": "Birinci örnek (teknoloji)", "x": "Are We Losing the Art of Conversation?\n\nWalk into any cafe today and you will see the same scene: a table of friends, each staring at a screen. But is technology really to blame?"}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "The Four-Day School Week: A Dream or a Disaster?\n\nImagine a school week with no Fridays. It sounds like every student's fantasy — but a handful of schools abroad have actually tried it, and the results are more surprising than you might think."}, {"t": "wizard", "wt": "article", "ptitle": "Görev", "prompt": "Okulunun dergisi için bir makale yaz: gençleri ilgilendiren bir konu (uyku, sosyal medya, sınav stresi, hobiler) hakkında. Çekici bir başlık, ilgi çeken giriş, alt başlıklı bölümler ve toparlayan bir kapanış kullan.", "target": 250, "check": ["Çekici bir başlık ve ilgi çeken bir giriş yazdım.", "Gövdeyi alt başlıklarla böldüm ve yarı resmi bir ton tutturdum (Criterion C).", "Fikirleri somut örneklerle geliştirdim ve okura seslendim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Toparlayan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (makale)", "x": "Are We Losing the Art of Conversation?\n\nWalk into any cafe today and you will see the same scene: a table of friends, each staring at a screen. But is technology really to blame, or have we simply forgotten how to talk?\n\nThe Comfort of the Screen\nPhones give us an easy escape from awkward silences. The moment a conversation slows, we reach for the glowing rectangle in our pocket. It feels harmless, yet every time we do it, we quietly tell the person opposite us that they are less interesting than a notification.\n\nWhat We Lose\nReal conversation is a skill, and like any skill it fades without practice. Listening, disagreeing kindly, sitting comfortably with a pause — these are muscles we are letting weaken.\n\nSo here is a small challenge: next time you meet a friend, leave your phone in your bag. You may find that the best conversation you have all week is the one nobody could scroll past."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Başlıksız veya alt başlıksız yazmak. Makalenin görünür bir yapısı olmalı (Criterion C).", "Çok akademik veya çok günlük dil. Makale yarı resmidir.", "Fikri örneklemeden yüzeysel bırakmak. Her iddiayı bir örnek/detayla destekle."]}]}, {"id": "t-blog", "group": "Kişisel", "name": "Blog", "eyebrow": "Metin Türü", "blocks": [{"x":"Blog Nedir ve Neyi Amaçlar?","t":"h"},{"t":"p","x":"Blog, çevrimiçi bir okur kitlesi için yazılan, kişisel bir sesi olan ama okurla ilişki kuran bir metin türüdür. Günlükten (diary) farkı şudur: günlük yalnızca yazarın kendisi içindir, blog ise bir OKUR topluluğuna seslenir. Makaleden farkı ise register ve tondur: blog daha samimi, daha kişisel, daha doğrudandır. Paper 1'de blog, 'Experiences' teması altında bir seyahat veya deneyim anlatısı, 'Identities' altında kişisel bir dönüşüm, 'Human ingenuity' altında teknolojiyle kişisel bir karşılaşma olarak sıkça çıkar. Blogun cazibesi, gerçek bir insanın kendi deneyiminden konuşuyormuş hissi vermesidir."},{"x":"Kitle, Amaç ve Register","t":"h"},{"x":"Blogun kitlesi, konuya ilgi duyan çevrimiçi okurlardır: takipçiler, benzer deneyimleri arayan insanlar, meraklılar. Amaç kişisel düşünce ve deneyim paylaşmak, bunu yaparken okurla bir bağ kurmak ve çoğu zaman onları da düşünmeye ya da katılmaya davet etmektir. Register gayriresmidir: kısaltmalar (I'm, don't, it's), ünlemler, doğrudan seslenme ('you know that feeling when...') ve kişisel ses serbesttir. Ama gayriresmi olmak özensiz olmak demek değildir; dil hâlâ doğru ve çeşitli olmalıdır (Criterion A). Blog, samimiyet ile ölçülü dil arasında bir denge kurar.","t":"p"},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Blogun bir başlığı olur ve bu başlık kişisel, merak uyandıran bir tondadır ('The Day I Deleted All My Apps'). Giriş genellikle doğrudan okura seslenir veya bir sahneyle başlar. Gövde katı alt başlıklara ihtiyaç duymaz; daha akışkan, düşünce zinciri gibi ilerler, ama yine de mantıklı bir sırası vardır: durum, deneyim, çıkarım. Blogun imza öğeleri kişisel ses, doğrudan seslenme ve çoğu zaman okura bir çağrı veya soruyla biten bir kapanıştır ('Have you ever tried it? Let me know in the comments.'). Bazı bloglar tarih veya yazar adıyla açılır. Bu okurla sohbet eden ton, blogu diğer türlerden ayıran şeydir."},{"x":"Açılışta okurla anında bağ kurmak esastır. Zayıf açılış mesafelidir: 'Today I want to write about social media.' Güçlü açılış okuru ortak bir deneyime davet eder: 'Be honest: how many times have you checked your phone since you started reading this?' İkinci açılış okuru gülümsetir, suçlu hissettirir ve içine çeker. Blog, okurla bir dost gibi konuşur; bu yakınlık ilk cümleden kurulmalıdır.","t":"p"},{"x":"Dil ve Üslup","t":"h"},{"t":"p","x":"Blogun dili kişisel ve canlıdır. Birinci tekil şahıs ('I felt', 'I realised') hakimdir. Kısaltmalar ve gündelik ifadeler tonu sıcak tutar. Retorik sorular okurla diyalog kurar. Kısa, çarpıcı cümleler ('And then it hit me.') vurgu yaratır. Mizah ve dürüstlük blogu çeker. Ancak Criterion A'yı unutma: samimi olmak, basit ve tekrarlı yazmak anlamına gelmez. Duygularını farklı kelimelerle ('overwhelmed', 'liberated', 'uneasy'), farklı cümle yapılarıyla anlatarak hem samimiyeti hem dil çeşitliliğini bir arada sergileyebilirsin."},{"t":"h","x":"Çözümlü Model Örnek"},{"t":"p","x":"İyi bir blog girişi düşünelim: 'I used to check my phone 96 times a day. I know that, because for one terrifying week, I counted.' Bu iki cümle blogun tüm imzasını taşır: kişisel ('I'), çarpıcı bir detay ('96 times'), dürüst ve biraz özeleştirel ('terrifying'), ve okuru merakta bırakan bir kurulum. Devamında yazar deneyimini anlatır, bir çıkarıma varır ve okura döner: 'So here is what one week without notifications taught me — and why you might want to try it too.' Bu kapanış okuru harekete çağırır ve blogu bir sohbete dönüştürür. Fikir örneklerle (sayılar, kişisel anlar) geliştirilmiş (B), ton baştan sona gayriresmi ve tutarlı (C), dil ise kısa-uzun cümle karışımıyla canlı (A)."},{"t":"h","x":"Blogu Günlük ve Makaleden Ayırmak"},{"x":"Blogun en tehlikeli komşusu günlüktür (diary). İkisi de kişisel ve birinci tekil şahıstır, ama kritik bir fark vardır: blog bir OKUR kitlesine seslenir, günlük yalnızca yazarın kendisine. Bir metin 'you' demiyor, okura hiç dönmüyor ve yalnızca yazarın iç dünyasını döküyorsa, o bir günlüktür, blog değil. Blogun ikinci komşusu makaledir: ikisi de bir konuyu ele alır ama makale yarı resmi ve dengelidir, blog ise gayriresmi ve kişiseldir. Aynı konuyu makale objektif ve alt başlıklı işlerken, blog kendi deneyiminden yola çıkar ve okurla sohbet eder. Görevde 'blog' kelimesini gördüğünde şu üçlüyü hatırla: kişisel ses, gayriresmi register ve okura doğrudan seslenme.","t":"p"},{"head":["Tür","Kime","Ayırt edici işaret"],"t":"table","rows":[["Blog","Çevrimiçi okur kitlesine","Kişisel ses + okura seslenme ('you')"],["Günlük (Diary)","Yalnızca yazarın kendisine","Mahrem, okura hiç dönmez, 'Dear Diary'"],["Makale (Article)","Genel yayın okuruna","Yarı resmi, dengeli, alt başlıklı"]]},{"t":"h","x":"Kişisel Deneyimi Anlamlı Kılmak"},{"x":"Blogun kalbi kişisel deneyimdir, ama iyi bir blog yalnızca 'ne oldu'yu anlatmaz; 'bu bana ne öğretti'yi de gösterir. Zayıf bir blog olayları sıralar: 'I went to camp. It was fun. Then I came home.' Güçlü bir blog deneyimi bir çıkarıma bağlar: 'That week at camp, without a single notification, I learned something no app had ever taught me: how to be bored, and how boredom slowly turns into imagination.' Fark, deneyimin bir anlama dönüşmesidir. Her blogda kendine sor: bu deneyim okura ne söylüyor, hangi ortak duyguyu uyandırıyor? Kişiseli evrensele bağladığında, okur kendi hayatından bir şey bulur ve yazı onun için anlam kazanır.","t":"p"},{"t":"p","x":"Blogda samimiyet ile özen dengesi Criterion A'nın sınandığı yerdir. Gayriresmi olmak, basit ve tekrarlı yazmak demek değildir. Duyguları çeşitli kelimelerle adlandır: yalnızca 'happy' değil, 'relieved', 'lighter', 'strangely free'. Cümle uzunluğunu değiştir: uzun, akan bir cümlenin ardından kısa ve çarpıcı bir cümle ('And I never looked back.') koy. Bu ritim blogu canlı tutar ve aynı anda dil çeşitliliğini sergiler. Böylece hem sıcak hem de dil açısından zengin bir metin ortaya çıkar."},{"t":"h","x":"Blog Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"t":"p","x":"Blog yazmayı öğrenmek, kişisel sesi ve okurla bağ kurmayı öğrenmektir; bu beceri sınavın diğer bölümlerine de taşınır. Paper 2 okuma bölümünde bloglar ve kişisel yazılar çıkabilir; blogun tonunu ve yapısını tanıyan öğrenci yazarın niyetini ve tonunu sorularda daha isabetli okur. Individual Oral'da ise kişisel deneyimden konuşmak sık gerekir: bir görseli veya alıntıyı kendi hayatınla ilişkilendirdiğinde, blogda geliştirdiğin 'deneyimi anlama bağlama' refleksi devreye girer. Böylece samimi ama düşünceli konuşabilir, ezber bir sunumun ötesine geçebilirsin."},{"lines":["Birinci tekil şahıs kullan ve gerçek bir deneyim anlat, soyut kalma.","Okura doğrudan seslen ve en az bir retorik soru sor.","Kısaltma ve gündelik ifadelerle sıcaklık kat, ama dilbilgisini bozma.","Kapanışta okura bir soru veya çağrı bırak; blog bir sohbettir."],"title":"Blogda tonu tutturmanın yolları","k":"ipucu","t":"note"},{"x":"Temayı Blog Merceğinden Çerçevelemek","t":"h"},{"t":"p","x":"Blog görevi de bir prescribed theme'e bağlanır ve senin işin o temayı kişisel bir deneyim üzerinden anlatmaktır. 'Experiences' teması altında bir seyahat verildiğinde, bunu bir makale gibi genel bilgiyle değil, kendi yaşadığın somut bir anla açarsın; 'Identities' altında kimlik konusu geldiğinde, kendi dönüşümünü bir hikaye gibi anlatırsın. Blogun gücü, büyük bir temayı küçük ve gerçek bir deneyime indirgemekten gelir: iklim değişikliği gibi devasa bir konuyu, 'geçen yaz kuruyan gölün kıyısında durduğum an' üzerinden anlatmak, okuru soyut bir tartışmadan çok daha fazla etkiler. Temayı daima kişisel bir pencereden çerçevele; blog, büyük fikirleri insan ölçeğine indirir."},{"x":"Blogda kapanış, okurla kurduğun sohbeti bir davete dönüştürür. En etkili blog kapanışları okura bir soru sorar ('Sen hiç denedin mi?'), bir çağrı yapar ('Belki sen de bir hafta dene') veya paylaşılan bir duyguyu adlandırır. Bu kapanış, blogu tek yönlü bir anlatıdan iki yönlü bir ilişkiye çevirir. Girişte kurduğun kişisel tonu kapanışta da koru; soğuk, özetleyici bir sonla bitirme. Blog bir insanın başka insanlarla konuşmasıdır ve iyi bir sohbet, karşındakine söz bırakarak biter.","t":"p"},{"x":"Zaman ve uzunluk yönetimi blogda da önemlidir. İlk birkaç dakikada anlatacağın deneyimi ve varacağın çıkarımı belirle; dağınık bir blog, okuru kaybettirir. Yazarken deneyim-duygu-çıkarım akışını koru ve son dakikalarda register'ı kontrol et: baştan sona gayriresmi ve kişisel mi, okura seslendin mi, dil samimi ama doğru mu? Kelime hedefini (SL 250-400, HL 450-600) tuttur; çok kısa bir blog deneyimi geliştiremez, aşırı uzun bir blog ise dağılır ve odağını kaybeder.","t":"p"},{"x":"Blogda Dil Zenginliği ve Değerlendirici Gözü","t":"h"},{"t":"p","x":"Blog gayriresmi olsa da Criterion A dil çeşitliliğini ve doğruluğunu ödüllendirmeye devam eder; bu yüzden samimi bir tonu zengin bir dille birleştirmek en yüksek puanı getirir. Aynı duyguyu farklı sözcüklerle adlandırmayı alışkanlık haline getir: 'good' yerine bağlama göre 'refreshing', 'reassuring', 'liberating' kullan. Bağlaçları çeşitlendir: 'and' yerine yer yer 'yet', 'meanwhile', 'even so' ile fikirleri bağla. Zaman kiplerini bilinçli kullan: geçmiş bir deneyimi anlatırken 'used to', 'would' gibi yapılar hem doğruluk hem çeşitlilik sergiler. Bu küçük seçimler bir araya geldiğinde, blog hem sıcak hem de dil açısından olgun bir metne dönüşür."},{"x":"Değerlendiricinin gözünden bakmak, blogda neyin puan getirdiğini görmeni sağlar. Değerlendirici Criterion C için şunu arar: bu metin gerçekten bir blog mu, yoksa kılık değiştirmiş bir makale ya da günlük mü? Kişisel ses, okura seslenme ve gayriresmi register bu soruya 'evet' dedirtir. Criterion B için şunu arar: fikirler yalnızca sıralanmış mı, yoksa gerçekten geliştirilmiş mi? Bir deneyimi bir çıkarıma bağlaman bu puanı yükseltir. Criterion A için ise dilin hem doğru hem çeşitli olup olmadığına bakar. Yazarken bu üç gözü zihninde tut; her paragrafı yazdıktan sonra kendine 'bu blog gibi mi, fikir gelişti mi, dil zengin mi?' diye sor.","t":"p"},{"x":"Son olarak, blogun okurla kurduğu bağ onun imzasıdır ve bu bağı canlı tutmak için okuru sürecin içinde tut. Ara ara ona dön ('Belki sen de bu duyguyu bilirsin'), bir soru sor, ortak bir deneyimi hatırlat. Bu doğrudan seslenmeler blogu bir sohbete çevirir ve okurun metinde kendini bulmasını sağlar. Unutma: iyi bir blog okuduğunda, okur yalnızca senin hikayeni değil, biraz da kendi hikayesini okuduğunu hisseder. İşte bu ortaklık duygusu, English B'de blogu güçlü kılan ve üç kriterde de fark yaratan şeydir.","t":"p"},{"t":"p","x":"En sık hata blogu kişisel günlüğe çevirmektir: okuru unutup yalnızca kendine yazmak. Blog daima bir okur kitlesine seslenir; 'you' ve doğrudan çağrılar olmadan blog, günlüğe kayar ve Criterion C zarar görür. İkinci hata aşırı resmiyet: blogu bir makale ya da denemeye benzetmek, register'ı soğutur. Üçüncü hata özensizlik: samimiyeti bahane edip basit, tekrarlı, hatalı cümleler kurmak Criterion A'yı düşürür. Doğru blog sıcak ama özenlidir. Kelime sınırlarını ve metin türü beklentilerini güncel resmi IB English B Guide'dan doğrulamayı unutma."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kişisel bir deneyimi, düşünceyi veya görüşü bir okur kitlesiyle paylaşmak ve onları etkilemek."], ["Kitle", "Blogu takip eden çevrimiçi okurlar."], ["Register / Ton", "Kişisel ve samimi ama düzgün. Birinci tekil şahıs, doğrudan 'you'."], ["Yapı", "Çekici başlık, okuru içine çeken giriş, kişisel anlatı/görüş, okura seslenme, düşündüren veya harekete geçiren kapanış."], ["Tipik özellikler", "Başlık, birinci şahıs, retorik sorular, duygu ifadeleri, gündelik ama düzgün dil, okura hitap, bazen yorum daveti."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin kişisel açını belirle: bu deneyim/görüş neden önemli?", "2. Merak uyandıran, kısa bir başlık bul.", "3. Girişte okuru içine çek: bir soru, çarpıcı bir cümle veya küçük bir sahne.", "4. Deneyimini veya görüşünü somut örneklerle anlat; 'you' ile okurla bağ kur.", "5. Sadece olayı değil, ne hissettiğini ve ne düşündüğünü de göster.", "6. Düşündüren ya da harekete geçiren bir kapanış yaz.", "7. Son kontrol: başlık, birinci şahıs, okura hitap ve kişisel bir ses var mı?"]}, {"t": "given", "title": "Birinci örnek (kişisel deneyim)", "x": "The Day I Deleted All My Apps\n\nLast month, on an ordinary Tuesday, I did something that terrified me: I deleted every social media app from my phone. Be honest — could you do it? For the first two days, I reached for my phone constantly, only to find nothing there."}, {"t": "given", "title": "İkinci örnek (görüş/tavsiye, farklı bağlam)", "x": "Why Failing My First Exam Was the Best Thing That Happened\n\nNobody tells you this, but failing can be a gift. When I saw that red mark last year, I wanted to disappear. Today, I am almost grateful for it. Here is what that failure taught me, and why I think every student needs one."}, {"t": "wizard", "wt": "blog", "ptitle": "Görev", "prompt": "Okulunun blogu için bir yazı yaz: seni değiştiren bir alışkanlık, deneyim veya karar hakkında. Kişisel anlat, okura seslen ve onları düşünmeye veya harekete geçmeye davet et.", "target": 250, "check": ["Çekici bir başlıkla açtım ve birinci tekil şahıs kişisel bir ses kullandım.", "Okura doğrudan seslendim ('you') ve en az bir retorik soru sordum (Criterion C).", "Deneyimimi somut örnekle anlattım ve duygumu gösterdim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Düşündüren/harekete geçiren bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (blog)", "x": "The Day I Deleted All My Apps\n\nLast month, on an ordinary Tuesday, I did something that genuinely scared me: I deleted every social media app from my phone. Be honest — could you last a week without yours?\n\nFor the first two days, it was miserable. My hand kept reaching for a screen that had nothing on it. I felt bored, restless, and weirdly lonely, as if I had switched off a part of my own brain.\n\nThen something shifted. I started noticing things again: the taste of my breakfast, the people on the bus, whole conversations I would once have missed. I read two books in a week. I called my grandmother for no reason. I slept.\n\nI am not telling you to delete everything forever. But I am asking you to try one screen-free weekend. You might discover, as I did, that the life you keep scrolling past is quietly waiting for you to look up."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Blogu kişisel bir günlüğe çevirmek. Blogun bir OKURU vardır; ona seslen ('you'), sadece kendine yazma.", "Sadece olay anlatıp duyguyu/anlamı atlamak. Okur 'ne hissettin, ne öğrendin' bilmek ister.", "Başlıksız veya düz akademik dille yazmak. Başlık ve samimi ses Criterion C'yi belirler."]}]}, {"id": "t-speech", "group": "Kitle İletişim", "name": "Konuşma (Speech)", "eyebrow": "Metin Türü", "blocks": [{"x":"Konuşma (Speech) Nedir ve Ne Zaman Yazılır?","t":"h"},{"t":"p","x":"Konuşma, canlı bir dinleyici kitlesinin önünde sesli sunulmak üzere yazılan bir metin türüdür. Diğer türlerden en büyük farkı budur: okunmak için değil, DUYULMAK için yazılır. Bu yüzden ritim, tekrar, doğrudan seslenme ve duygusal vurgu ön plandadır. Paper 1'de konuşma, bir okul toplantısında, bir törende, bir kampanyada veya bir yarışmada sunulacak biçimde çıkar ve genellikle 'Social organization' (topluluk, eğitim), 'Sharing the planet' (çevre, haklar) veya 'Identities' temalarıyla eşleşir. Konuşmanın amacı çoğunlukla ikna etmek veya harekete geçirmektir, bazen de bir olayı kutlamak ya da bilgilendirmektir."},{"x":"Kitle, Amaç ve Register","t":"h"},{"x":"Konuşmanın kitlesi karşında oturan somut bir topluluktur: öğrenciler, veliler, bir kulübün üyeleri, bir törenin katılımcıları. Onlara doğrudan seslenirsin ('Fellow students', 'Ladies and gentlemen'). Amaç genellikle ikna etmek, ilham vermek veya bir eyleme çağırmaktır. Register, konuşmanın bağlamına göre resmi ya da yarı resmi olabilir ama her durumda DOĞRUDAN ve KİŞİSELDİR; dinleyiciyle göz teması kurar gibi 'you' ve 'we' kullanır. Bir tören konuşması daha resmi, bir öğrenci kampanyası daha enerjik olur, ama ikisi de dinleyiciyi sürecin içine alır.","t":"p"},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"t":"p","x":"Konuşma bir selamlama ve hitapla açılır ('Good morning, everyone'). Güçlü bir açılış kancası dinleyicinin dikkatini ilk saniyelerde yakalar: bir soru, çarpıcı bir gerçek, kısa bir hikaye. Gövde birkaç net fikir etrafında kurulur ve her fikir dinleyicinin hatırlayabileceği kadar somuttur; yazılı metnin aksine dinleyici geri dönüp okuyamaz, bu yüzden tekrar ve özet önemlidir. Kapanış güçlü ve akılda kalıcıdır: bir çağrı, bir slogan veya ilham veren bir cümle. Konuşmayı bir teşekkürle ('Thank you') bitirmek yaygındır. İmza öğeleri: dinleyiciye hitap, retorik sorular, tekrarlar ve güçlü bir kapanış çağrısı."},{"x":"Konuşmanın gücü sesli araçlardan gelir. En etkilisi anafora, yani bir ifadenin ardışık cümlelerin başında tekrarıdır: 'We can change this. We can lead this. We can start today.' Bu tekrar hem ritim yaratır hem de mesajı dinleyicinin belleğine kazır. Üçlü listeler ('education, opportunity, and hope') doğal bir tamlık hissi verir. Retorik sorular dinleyiciyi düşünmeye davet eder. Bu araçlar konuşmayı bir yazıdan bir performansa dönüştürür.","t":"p"},{"t":"h","x":"Dil ve Retorik Araçlar"},{"x":"Konuşma dili, kulağa hitap eden araçlarla doludur. Doğrudan seslenme ('you', 'we', 'my friends') dinleyiciyle bağ kurar. Tekrar ve üçlemeler ritim ve vurgu sağlar. Retorik sorular dinleyiciyi ortak düşünmeye çeker. Kısa, güçlü cümleler vurgulu anlar yaratır; uzun cümlelerin ardından gelen kısa bir cümle ('And that must change.') çarpıcı olur. Duygusal dil (pathos) ve mantıklı gerekçe (logos) birlikte kullanılır. Criterion A açısından konuşma, çeşitli cümle uzunlukları ve retorik yapılarla dil ustalığını sergilemek için idealdir.","t":"p"},{"x":"Çözümlü Model Örnek","t":"h"},{"x":"Güçlü bir konuşma açılışı düşünelim: 'Good morning, everyone. Right now, as I speak, a plastic bottle you threw away last year is still lying on a beach somewhere. It will still be there when your children are your age.' Bu açılış dinleyiciyi doğrudan selamlar, çarpıcı ve kişisel bir gerçekle sarsar ve konuyu somutlaştırır. Gövdede konuşmacı sorunu, sonucu ve çözümü anlatır; her bölümde 'we' ile dinleyiciyi ortak eyleme çağırır. Kapanışta anafora devreye girer: 'We cannot wait for someone else. We cannot wait for next year. We must act, and we must act now.' Bu kapanış hem ritmik hem çağrı doludur. İkna edici ve doğrudan (C), fikir örneklerle geliştirilmiş (B), dil retorik olarak zengin (A).","t":"p"},{"x":"Konuşmayı Makale ve Görüş Yazısından Ayırmak","t":"h"},{"t":"p","x":"Konuşma, görüş yazısıyla amaç bakımından yakındır (ikisi de ikna eder) ama biçim bakımından tamamen farklıdır. Görüş yazısı okunmak için yazılır ve gözle taranır; konuşma duyulmak için yazılır ve kulakla takip edilir. Bu yüzden konuşmada dinleyiciye hitap ('Fellow students'), tekrar ve sesli ritim vazgeçilmezdir. Konuşmayı makaleden ayıran şey de budur: makale sessiz bir okura bilgi verir, konuşma canlı bir topluluğa seslenir. Görevde 'speech', 'talk', 'address' veya 'you are giving a speech' ifadelerini gördüğünde hemen sözlü moda geç: selamlama, doğrudan hitap, retorik sorular ve güçlü bir sözlü kapanış."},{"rows":[["Konuşma (Speech)","Kulakla, canlı dinlenir","Selamlama, hitap, tekrar, sözlü ritim"],["Görüş yazısı (Opinion)","Gözle okunur","Yazılı tez, alt başlıksız gerekçeli paragraflar"],["Makale (Article)","Gözle okunur","Başlık, alt başlık, dengeli bilgi"]],"head":["Tür","Nasıl alınır","Ayırt edici işaret"],"t":"table"},{"x":"Kulağa Yazmak: Ritim ve Hafıza","t":"h"},{"x":"Konuşmanın en büyük kısıtı şudur: dinleyici geri dönüp okuyamaz. Bir cümleyi kaçırırsa kaybolur. Bu yüzden konuşma dili kısa, net ve takip edilebilir olmalıdır; çok uzun, iç içe geçmiş cümleler dinleyiciyi kaybettirir. Ayrıca dinleyicinin hatırlaması için tekrar ve özet gerekir; ana fikri konuşmanın başında ve sonunda yinelemek, mesajı belleğe kazır. Ritim de bir hafıza aracıdır: üçlü listeler ('for ourselves, for our school, for our future') ve anafora ('We can. We must. We will.') hem kulağa hoş gelir hem akılda kalır. Konuşma yazarken cümleleri sesli oku; kulağa doğal ve güçlü gelmiyorsa dinleyici için de öyle olmaz.","t":"p"},{"t":"p","x":"Etos, patos ve logos üçlüsü konuşmanın ikna zeminidir. Etos güvenilirliktir: konuşmacının samimi ve inandırıcı olması ('As a student who has sat in these same seats...'). Patos duygudur: dinleyicinin kalbine dokunan imgeler ve hikayeler. Logos mantıktır: gerekçe, örnek ve kanıt. Güçlü bir konuşma üçünü dengeler; yalnızca duyguya yaslanırsa boş, yalnızca mantığa yaslanırsa soğuk olur. Bir kişisel dokunuş, bir çarpıcı örnek ve bir net gerekçe bir araya geldiğinde dinleyici hem ikna olur hem harekete geçer."},{"t":"h","x":"Konuşma Becerisinin Individual Oral'a Katkısı"},{"t":"p","x":"Konuşma yazmak, English B'nin sözlü değerlendirmesine en doğrudan hazırlıktır. Individual Oral'da 3-4 dakikalık bir sunum yaparsın; konuşma türünde öğrendiğin açılış kancası, net yapı, doğrudan hitap ve güçlü kapanış aynen işe yarar. Ayrıca konuşma yazarken kazandığın 'kulağa yazma' becerisi, sözlü sınavda akıcı ve takip edilebilir konuşmanı sağlar. Paper 2 dinleme bölümünde de konuşmalar ve sunumlar ses kaydı olarak çıkabilir; konuşma yapısını tanıyan öğrenci, konuşmacının nereye gittiğini önceden sezer ve soruları daha kolay yanıtlar. Böylece bu tür, yazma-konuşma-dinleme üçgeninin ortak paydası olur."},{"k":"ipucu","t":"note","title":"Konuşmayı canlı kılan hamleler","lines":["Dinleyiciye selam ve hitapla aç; kime konuştuğun ilk cümlede belli olsun.","Anafora ve üçlü liste kullan; tekrar konuşmanın ritmidir.","Retorik sorularla dinleyiciyi düşünmeye çek.","Güçlü, kısa bir çağrıyla ve teşekkürle bitir."]},{"x":"Temayı Konuşma Merceğinden Çerçevelemek","t":"h"},{"x":"Konuşma görevi bir prescribed theme'i ikna edici bir çağrıya dönüştürmeni ister. 'Sharing the planet' altında çevre konusu verildiğinde, kuru bilgi vermek yerine dinleyiciyi ortak bir sorumluluğa çağırırsın: sorunu somut ve kişisel kılar ('bu okulun bahçesindeki çöpler'), sonuçlarını canlandırır ve bir eyleme davet edersin. 'Social organization' altında bir okul konusu geldiğinde, dinleyiciyi 'biz' diliyle ortak bir amaç etrafında toplarsın. Konuşma merceği daima harekete geçirmeye yöneliktir; temayı bir tartışma değil, bir çağrı olarak çerçevele. Dinleyicinin salondan bir fikirle değil, bir kararla çıkmasını hedefle.","t":"p"},{"t":"p","x":"Konuşmanın açılışı ve kapanışı, bir çerçeve gibi birbirini tamamladığında en güçlü etkiyi yaratır. Açılışta çarpıcı bir imge veya soru kullandıysan, kapanışta ona geri dön ve onu bir karara bağla. Örneğin bir plastik şişe imgesiyle açan konuşma, kapanışta 'O şişeyi bugün son kez görmeyi seçebiliriz' diyerek daireyi kapatır. Bu döngüsel yapı dinleyicinin belleğinde iz bırakır. Kapanış ayrıca güçlü ve kısa olmalıdır; uzun, dağınık bir final konuşmanın enerjisini söndürür. Son cümlen bir slogan gibi akılda kalmalı ve dinleyiciyi harekete davet etmelidir."},{"t":"p","x":"Provanın önemini unutma: konuşma sözlü bir türdür, bu yüzden yazdıklarını sesli okumak yazının kalitesini doğrudan artırır. Dilin diline dolandığı, nefessiz kaldığın veya kulağa yapay geldiği yerler, dinleyici için de sorunlu olacaktır. Sesli okuduğunda doğal, ritmik ve güçlü akan bir metin, kağıt üzerinde de yüksek puan alır. Sınavda gerçekten sesli okuyamasan bile, yazarken cümleleri zihninde seslendir ve dinleyicinin onları nasıl duyacağını hayal et. Bu 'kulakla yazma' alışkanlığı, konuşmayı diğer tüm yazılı türlerden ayıran şeydir."},{"x":"Konuşmada Dil ve Değerlendirici Gözü","t":"h"},{"x":"Konuşma dili, yazılı dilden farklı bir ritim ister ve bu ritim Criterion A için zengin bir alan açar. Cümle uzunluğunu bilinçli değiştir: uzun, akan bir cümlenin ardından gelen kısa ve sert bir cümle ('And that must change.') dinleyiciyi sarsar. Paralel yapılar ('to learn, to grow, to lead') hem kulağa hoş gelir hem çeşitlilik gösterir. Doğrudan hitap ve kapsayıcı 'we' dinleyiciyle bağ kurar. Bu araçlar yapaylık için değil, mesajı güçlendirmek için kullanılır; her retorik hamlenin bir amacı olmalı, süs olsun diye serpiştirilmemelidir. Amaca hizmet eden retorik, dinleyiciyi hem etkiler hem de dil hakimiyetini kanıtlar.","t":"p"},{"t":"p","x":"Değerlendiricinin gözünden konuşma, dinleyiciye yönelmesiyle tanınır. Criterion C için değerlendirici şunu sorar: bu metin gerçekten sözlü sunulmak için mi yazılmış, yoksa sessiz bir okur için mi? Selamlama, doğrudan hitap, retorik sorular ve güçlü bir sözlü kapanış bu soruya olumlu yanıt verir. Criterion B için mesajın ikna edici biçimde geliştirilip geliştirilmediğine bakar; her fikrin somut ve akılda kalıcı olması gerekir. Yazarken karşında bir salon dolusu insan hayal et; onların dikkatini nasıl tutar, onları nasıl harekete geçirirsin? Bu zihinsel sahne, konuşmayı canlı ve gerçek kılar."},{"t":"p","x":"Son olarak, güçlü bir konuşma dinleyicide bir şeyi harekete geçirir: bir duygu, bir karar, bir eylem isteği. Bunu başarmanın yolu, soyut çağrılar değil, dinleyicinin kendi hayatına dokunan somut bağlantılardır. 'We must protect the planet' soyut ve zayıftır; 'The beach where you played as a child could be gone before your own children can play there' somut ve sarsıcıdır. Dinleyicinin dünyasına gir, ona kendi hikayesini göster ve onu o hikayenin kahramanı yap. İşte bu kişisel dokunuş, konuşmayı bir bilgi aktarımından bir ilham kaynağına çevirir ve English B'de en yüksek puanı getiren şeydir."},{"x":"En sık hata konuşmayı bir makale gibi yazmaktır: dinleyiciye hiç seslenmeden, retorik araç kullanmadan, kuru bilgi vererek. Konuşma DUYULMAK için yazılır; 'you', 'we' ve doğrudan hitap yoksa tür kaybolur ve Criterion C düşer. İkinci hata çok karmaşık, uzun cümleler kurmaktır; dinleyici geri dönüp okuyamaz, bu yüzden cümleler net ve takip edilebilir olmalıdır. Üçüncü hata zayıf bir kapanış: konuşma güçlü bir çağrıyla bitmezse etkisini kaybeder. Kelime sınırlarını ve metin türü beklentilerini güncel resmi IB English B Guide'dan teyit et.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Canlı bir kitleyi ikna etmek veya bilgilendirmek."], ["Kitle", "Bir toplantı, tören veya etkinlikteki dinleyiciler."], ["Register / Ton", "Hitabet dili. Doğrudan seslenme, güçlü ve ritmik."], ["Yapı", "Selamlama, dikkat çeken açılış, işaret cümleleriyle bölümler, güçlü kapanış çağrısı."], ["Tipik özellikler", "Ladies and gentlemen, retorik sorular, tekrar (anaphora), üçlemeler, doğrudan you."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kitleyi ve amacı belirle (ikna mı, bilgilendirme mi?).", "2. Bir selamlama ve dikkat çeken bir açılış yaz (soru veya çarpıcı iddia).", "3. Ana mesajını tek cümlede belirle.", "4. 2-3 noktayla geliştir; her birinde retorik soru, tekrar veya üçleme kullan.", "5. Doğrudan 'you' ile dinleyiciye seslen; kısa, ritmik cümleler kur.", "6. Güçlü, akılda kalan bir kapanış veya çağrıyla bitir.", "7. Son kontrol: selamlama + retorik araçlar + doğrudan hitap + güçlü kapanış var mı?"]}, {"t": "given", "title": "Birinci örnek (ilham)", "x": "Good morning, everyone. Let me begin with a simple question: when was the last time you did something for the first time? Today, I want to talk about why that matters."}, {"t": "given", "title": "İkinci örnek (ikna, farklı bağlam)", "x": "Fellow students, look around this room. In ten years, some of us will have changed this town for the better — and it will have started with one small decision made today. I am here to ask you for that decision: join the volunteer programme."}, {"t": "wizard", "wt": "speech", "ptitle": "Görev", "prompt": "Okul toplantısında (assembly) yapacağın bir konuşma yaz: öğrencileri bir konuda (gönüllülük, çevre, yeni bir şey denemek) harekete geçirmeye çağır. Selamlama, retorik sorular, tekrar/üçleme ve güçlü bir kapanış kullan.", "target": 250, "check": ["Bir selamlama ve dikkat çeken bir açılışla başladım.", "Retorik soru, tekrar (anaphora) ve doğrudan 'you' kullandım (Criterion C).", "Mesajımı örneklerle geliştirdim ve dinleyiciyi harekete çağırdım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Güçlü, akılda kalan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (konuşma)", "x": "Good morning, everyone. Let me begin with a simple question: when was the last time you did something for the first time?\n\nFor many of us, the honest answer is 'I can't remember.' We wake, we scroll, we follow the same safe path to the same familiar places. And slowly, without noticing, we stop growing.\n\nI am not asking you to climb a mountain tomorrow. I am asking for something smaller and braver: try one new thing this week. Speak to someone you have never spoken to. Raise your hand when you are unsure. Sign up for the club that scares you.\n\nBecause every skill you admire, every confident person you envy, began exactly where you are now — nervous, unsure, and doing it anyway.\n\nSo when you leave this hall today, do not go looking for the comfortable. Go looking for the first time. Thank you."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Selamlama ve doğrudan hitabı unutmak. Konuşma bir kitleye seslenir.", "Retorik araç kullanmamak. Retorik soru, tekrar ve üçleme konuşmayı konuşma yapar (Criterion C).", "Zayıf bitirmek. Konuşmanın en güçlü cümlesi kapanışta olmalı."]}]}, {"id": "t-brochure", "group": "Kitle İletişim", "name": "Broşür / Leaflet (Brochure)", "eyebrow": "Metin Türü", "blocks": [{"x":"Broşür / Leaflet (Brochure) Nedir?","t":"h"},{"t":"p","x":"Broşür, bir ürünü, hizmeti, etkinliği veya fikri tanıtmak ve okuru bir eyleme (katılmak, ziyaret etmek, desteklemek) yöneltmek için tasarlanan kısa, görsel ağırlıklı bir metin türüdür. Paper 1'de broşür, bir okul etkinliği, bir gönüllülük kampanyası, bir sağlık girişimi veya bir turizm tanıtımı için istenebilir ve 'Social organization', 'Sharing the planet' ya da 'Experiences' temalarıyla eşleşir. Broşürün ayırt edici özelliği, metnin görsel biçimde düzenlenmesidir: başlıklar, alt başlıklar, madde işaretleri ve bölümler. Okur broşürü baştan sona okumaz, göz gezdirir; bu yüzden bilgi hızlı taranabilir olmalıdır."},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Broşürün kitlesi, tanıtılan şeyle ilgilenebilecek potansiyel katılımcılar veya halktır. Amaç ikilidir: bilgilendirmek ve harekete geçirmek (call to action). Register bağlama göre değişir ama genellikle olumlu, davetkar ve doğrudandır; okura 'you' ile seslenir ve onu eyleme çağırır. Bir sağlık broşürü daha ciddi ve güven verici, bir etkinlik broşürü daha enerjik ve heyecanlı olabilir. Her durumda broşür net, çekici ve ikna edici bir dil kullanır; okurun zamanının kısıtlı olduğunu varsayar ve mesajını hızlı iletir."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"x":"Broşürün en belirgin imzası görsel düzenidir. Çekici bir ana başlık (title) ile açılır. Bilgi bölümlere ayrılır ve her bölüme bir alt başlık verilir ('Why join us?', 'What we offer', 'How to sign up'). Madde işaretleri (bullet points) faydaları veya bilgileri hızlı taranabilir kılar. Metin kısa paragraflar ve çarpıcı ifadeler kullanır. En kritik öğe, sona yakın yer alan harekete geçirici çağrıdır (call to action): 'Sign up today!', 'Visit our stand this Friday!'. Pratik bilgiler (tarih, yer, iletişim) genellikle net biçimde verilir. Bu görsel ve işlevsel düzen, broşürü ilk bakışta ele verir.","t":"p"},{"t":"p","x":"Broşürde başlıklar ve alt başlıklar okuru yönlendirir. Zayıf bir broşür uzun paragraflar halinde yazılır ve göz taramasına uygun değildir. Güçlü bir broşür bilgiyi parçalara böler: her alt başlık bir soruya yanıt verir, her madde bir faydayı öne çıkarır. Bu düzen hem Criterion C'yi (tür bilinci) hem de okurun deneyimini güçlendirir."},{"t":"h","x":"Dil ve İkna Araçları"},{"t":"p","x":"Broşürün dili ikna edicidir ama abartısız kalmalıdır. İmperatif (emir) cümleler okuru harekete çağırır: 'Join us', 'Discover', 'Don't miss'. Doğrudan seslenme ('you') okuru kişisel olarak hedefler. Olumlu, enerjik sıfatlar (exciting, rewarding, life-changing) çekicilik katar. Retorik sorular ilgi uyandırır ('Ready to make a difference?'). Kısa ve çarpıcı ifadeler sloganvari bir etki yaratır. Criterion A için broşür, kısa ama çeşitli ve etkili ifadeler kurma becerini gösterir; her kelime bir işe yaramalı, boş dolgu olmamalıdır."},{"x":"Çözümlü Model Örnek","t":"h"},{"x":"İyi bir broşür bölümü şöyle görünür: ana başlık 'Become a Beach Guardian This Summer!'; alt başlık 'Why It Matters' altında iki kısa cümle ve bir çarpıcı istatistik; alt başlık 'What You'll Do' altında üç madde ('Clean local beaches', 'Meet like-minded people', 'Earn a volunteer certificate'); ve sonda harekete geçirici çağrı: 'Spaces are limited — sign up at the student center by Friday!'. Bu yapı okurun gözünü yönlendirir, faydaları hızlı sıralar ve net bir eyleme çağırır. Bilgilendirici ve davetkar (C), faydalar somut örneklerle verilmiş (B), dil kısa ama etkili ve çeşitli (A). Broşürde 'az ama öz' ilkesi geçerlidir.","t":"p"},{"x":"Broşürü Reklam ve Makaleden Ayırmak","t":"h"},{"x":"Broşür, reklama (advertisement) çok benzer çünkü ikisi de tanıtır ve harekete geçirir. Fark ölçek ve içeriktedir: reklam tek bir çarpıcı mesaj ve slogan etrafında kurulur, kısadır ve genellikle tek bir görsel fikri satar; broşür ise daha uzundur, birden çok bölümde bilgi verir ('ne', 'neden', 'nasıl') ve okuru adım adım bilgilendirerek ikna eder. Broşür ayrıca makaleden ayrılır: makale akan paragraflarla bilgi verir, broşür ise bilgiyi görsel olarak parçalara böler (başlık, alt başlık, madde). Görevde 'brochure', 'leaflet' veya 'flyer' ifadelerini gördüğünde görsel-bölümlü düzene geç ve mutlaka bir harekete geçirici çağrı ekle.","t":"p"},{"rows":[["Broşür (Brochure)","Bölümlü, çok bilgili","Alt başlıklar + madde + call to action"],["Reklam (Advertisement)","Kısa, tek mesaj","Slogan + tek çarpıcı fikir"],["Makale (Article)","Akan paragraflar","Başlık + alt başlık, bilgilendirici"]],"head":["Tür","Uzunluk/İçerik","Ayırt edici işaret"],"t":"table"},{"x":"Okurun Gözünü Yönetmek","t":"h"},{"x":"Broşür yazarken en önemli soru şudur: okur bu metne yalnızca birkaç saniye ayırırsa, gözü nereye takılır? İyi bir broşür bilgiyi bir hiyerarşi içinde sunar: en büyük ve çekici öğe ana başlıktır; alt başlıklar okuru ilgilendiği bölüme yönlendirir; madde işaretleri faydaları tek bakışta taranabilir kılar; ve en sonda net bir harekete geçirici çağrı okuru eyleme iter. Bu düzen tesadüfi değildir; okurun sınırlı dikkatini yönetir. Bir broşürü uzun paragraflar halinde yazmak, bu yönetimi kaybetmek ve okuru yormak demektir. Her bölümü kısa tut, her maddeyi bir faydaya odakla.","t":"p"},{"x":"Broşürde ikna, abartıyla değil somut faydayla yapılır. Okur 'bu bana ne katar?' sorusunun yanıtını arar. 'Our club is amazing' demek boştur; 'Meet new friends, build your CV, and earn a certificate' demek somut faydalar sıralar. Her cümlede 'incredible', 'the best' gibi abartılı sıfatlara yaslanmak güvenilirliği azaltır. Bunun yerine gerçek, elle tutulur kazanımları öne çıkar ve okurun kendi çıkarını görmesini sağla. İmperatif fiiller ('Join', 'Discover', 'Save your spot') bu faydaları bir eyleme bağlar.","t":"p"},{"x":"Broşür Becerisinin Diğer Bölümlere Katkısı","t":"h"},{"x":"Broşür yazmak, bilgiyi görsel olarak düzenleme ve ikna edici ama öz bir dil kurma becerisi kazandırır. Paper 2 okuma bölümünde broşürler ve tanıtım metinleri sık çıkar; broşürün mantığını (başlık-bölüm-çağrı) tanıyan öğrenci, bilgiyi hızlı bulur ve soruları isabetle yanıtlar. Ayrıca broşürde öğrenilen 'faydayı öne çıkarma' becerisi, Individual Oral'da bir görseli tanıtırken veya bir fikri savunurken işe yarar: dinleyiciye somut, ikna edici noktalar sunmayı öğrenirsin. Böylece kısa ve etkili iletişim, tüm sınav bileşenlerinde değer kazanır.","t":"p"},{"lines":["Bilgiyi alt başlıklar ve madde işaretleriyle böl; uzun paragraf yazma.","İmperatif cümleler ve 'you' ile okuru doğrudan hedefle.","Somut faydaları öne çıkar: okur 'bana ne katar?' sorusunun yanıtını görsün.","Net bir harekete geçirici çağrı (call to action) ve pratik bilgi (tarih, yer) ekle."],"title":"Broşürde etki yaratmanın yolları","k":"ipucu","t":"note"},{"x":"Temayı Broşür Merceğinden Çerçevelemek","t":"h"},{"x":"Broşür görevi bir prescribed theme'i bir eyleme çağrısına dönüştürmeni ister. 'Sharing the planet' altında bir çevre girişimi, 'Social organization' altında bir gönüllülük programı, 'Experiences' altında bir kültürel etkinlik broşürü tipiktir. Temayı çerçevelerken okurun bakış açısını benimse: bu kişi neden ilgilensin, ona ne fayda sağlar, nasıl katılabilir? Broşür merceği bilgi vermekle kalmaz, okuru harekete geçirmeyi hedefler; bu yüzden temayı soyut bir açıklama olarak değil, okurun katılabileceği somut bir fırsat olarak sun. Her bölüm okurun bir sorusuna yanıt versin: 'Ne bu?', 'Bana ne katar?', 'Nasıl katılırım?'.","t":"p"},{"x":"Broşürde ton ile bilgi dengesi önemlidir. Çok fazla coşku ve slogan, broşürü boş ve güvenilmez kılar; çok fazla kuru bilgi ise sıkıcı yapar. İkisini dengele: her çekici başlığın altında gerçek, somut bilgi olsun; her faydanın arkasında bir dayanak bulunsun. Örneğin 'Change lives this summer!' başlığının altında 'Volunteers last year served 2,000 meals to families in need' gibi somut bir kanıt, hem heyecanı hem güveni birlikte kurar. Broşür ikna eder ama abartıyla değil, çekici sunulan gerçek faydalarla.","t":"p"},{"x":"Broşürün pratik işlevini asla unutma: okurun bir sonraki adımı atabilmesi için ne, ne zaman, nerede ve nasıl bilgilerini net vermelisin. En çekici broşür bile, okur nasıl katılacağını bilmiyorsa amacına ulaşamaz. Bu yüzden sona yakın bir yerde tarih, yer, iletişim ve kayıt yöntemini açıkça belirt ve güçlü bir harekete geçirici çağrıyla bağla: 'Sign up at the student center by Friday, June 3.' Bu netlik, broşürü bir bilgi metninden bir eylem aracına dönüştürür ve türün amacını tamamlar.","t":"p"},{"t":"h","x":"Broşürde Dil Ekonomisi ve Değerlendirici Gözü"},{"x":"Broşür kısa bir türdür, bu yüzden dil ekonomisi ustalık ister: az kelimeyle çok şey söylemek. Her cümle bir işe yaramalı, boş dolgu içermemelidir. Bu kısıt aslında Criterion A için bir fırsattır; çünkü kısa alanda çeşitli ve etkili yapılar kurmak dil hakimiyeti gösterir. İmperatif fiillerle enerji ('Join', 'Discover', 'Save your spot'), soru cümleleriyle merak ('Ready to make a difference?') ve kısa, çarpıcı ifadelerle vurgu yarat. Sıfatları özenle seç: her fayda için tek, güçlü bir sıfat, üç zayıf sıfattan iyidir. Broşürde her kelime bir işçidir; işe yaramayanı çıkar.","t":"p"},{"x":"Değerlendiricinin gözünden broşür, görsel düzeni ve harekete geçirici çağrısıyla ilk bakışta tanınır. Criterion C için değerlendirici şunu sorar: bu metin bir broşür gibi mi düzenlenmiş, yoksa düz bir makale mi? Başlıklar, alt başlıklar ve maddeler bu soruya olumlu yanıt verir. Criterion B için faydaların somut ve okur odaklı olup olmadığına bakar; 'bu okura ne katar?' sorusunun yanıtı net olmalıdır. Yazarken bir broşür tasarımcısı gibi düşün: okurun gözünün nereye takılacağını planla, en önemli bilgiyi en görünür yere koy ve onu bir eyleme çağırmadan bırakma.","t":"p"},{"x":"Son olarak, broşürün amacı okuru bir adım atmaya ikna etmektir ve bu amaç metnin her parçasına yön vermelidir. Başlık dikkat çeker, bölümler bilgilendirir ve ikna eder, çağrı ise eyleme
