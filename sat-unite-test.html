<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

// ---- Ünite haritası (domain -> Supabase category + başlık + beceriler) ----
const UNITS = {
  info:        { cat:'information_and_ideas',        title:'Information and Ideas',        tr:'Bilgi ve Fikirler',
                 skills:['central_ideas_and_details','command_of_evidence','inferences'] },
  craft:       { cat:'craft_and_structure',          title:'Craft and Structure',          tr:'Kurgu ve Yapı',
                 skills:['words_in_context','text_structure_and_purpose','cross_text_connections'] },
  expression:  { cat:'expression_of_ideas',          title:'Expression of Ideas',          tr:'Fikirlerin İfadesi',
                 skills:['rhetorical_synthesis','transitions'] },
  conventions: { cat:'standard_english_conventions', title:'Standard English Conventions', tr:'Standart İngilizce Kuralları',
                 skills:['boundaries','form_structure_and_sense'] },
  // Tüm R&W kapsayan final (4 kategori karışık)
  all:         { cat:null, title:'Reading & Writing', tr:'Reading & Writing',
                 skills:['central_ideas_and_details','command_of_evidence','inferences',
                         'words_in_context','text_structure_and_purpose','cross_text_connections',
                         'rhetorical_synthesis','transitions','boundaries','form_structure_and_sense'] },
};

// ---- Yaklaşık ham->ölçekli puan dönüşümü (TAHMİN — resmi değil) ----
// 2 modül × 27 = 54 soru, 200-800 ölçek. Modül 1 sonucu 2. modülün zorluğunu ve tavanını belirler.
function scaledScore(raw, path){
  const f = Math.max(0, Math.min(54, raw)) / 54;
  if (path === 'lower') return Math.round(200 + 380 * Math.pow(f, 0.90));  // kolay yol ~200-580
  return Math.round(300 + 500 * Math.pow(f, 0.98));                        // zor yol ~300-800
}

function param(k){ return new URLSearchParams(location.search).get(k); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(((i*2654435761)%(i+1))); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const app = document.getElementById('st-app');
const unitKey = param('unite') || 'info';
const mode = param('mode') || 'checkpoint';   // checkpoint | final
const form = (param('form') || 'A').toUpperCase();
const U = UNITS[unitKey] || UNITS.info;

// Doğru şık, seçenekler arasında EN UZUN olan mı (öyleyse kaçın)
function longestIsCorrect(q){
  const opts = Array.isArray(q.options)?q.options:[];
  const co = opts.find(o=>o.letter===q.correct_answer);
  if (!co) return false;
  const cl = (co.text||'').length;
  return opts.every(o=>(o.text||'').length <= cl) && opts.some(o=>o.letter!==q.correct_answer && (o.text||'').length < cl);
}

// Form A/B kesişmesin (id'ye göre mod-4 disjoint partition) + zorluk kotası
// + cevap A/B/C/D dengesi + doğru-şık-en-uzun kaçınma
function buildSet(pool, n, offset){
  const sorted = pool.slice().sort((a,b)=> (a.id<b.id?-1:(a.id>b.id?1:0)));
  const part = sorted.filter((q,i)=> (i%4)===(offset%4));
  const src = part.length>=n ? part : sorted; // partition küçükse tüm havuz
  const by = { easy:[], medium:[], hard:[] };
  src.forEach(q=>{ (by[q.difficulty]||by.medium).push(q); });
  const want = { easy:Math.round(n*0.35), medium:Math.round(n*0.40) };
  want.hard = n - want.easy - want.medium;
  const chosen = []; const ac = { A:0,B:0,C:0,D:0 };
  function take(bucket, count){
    const avail = bucket.slice();
    for (let k=0; k<count && avail.length; k++){
      avail.sort((a,b)=>{
        const ba=longestIsCorrect(a)?1:0, bb=longestIsCorrect(b)?1:0;
        if (ba!==bb) return ba-bb;                                  // önce en-uzun-değil
        return (ac[a.correct_answer]||0)-(ac[b.correct_answer]||0); // sonra en az temsil edilen cevap
      });
      const q = avail.shift(); chosen.push(q); ac[q.correct_answer]=(ac[q.correct_answer]||0)+1;
    }
  }
  take(by.easy, want.easy); take(by.medium, want.medium); take(by.hard, want.hard);
  for (const q of src){ if (chosen.length>=n) break; if (!chosen.includes(q)) chosen.push(q); } // eksik doldur
  return chosen.slice(0, n);
}

async function fetchPool(cat, difficulties){
  let q = sb.from('questions').select('id,slug,subcategory,difficulty,question_text,options,correct_answer,explanations,passage_id')
    .eq('active',true).eq('exam_type','sat').eq('section','rw');
  if (cat) q = q.eq('category',cat);   // cat yoksa (all) tüm R&W kategorileri
  // Üniteye ait gerçek beceriler (yanlış kategorilenmiş soruları hariç tut, veriye dokunmadan)
  if (U.skills && U.skills.length) q = q.in('subcategory', U.skills);
  if (difficulties) q = q.in('difficulty', difficulties);
  const { data, error } = await q.range(0, 4999);
  if (error) throw error;
  return data || [];
}

async function fetchPassages(ids){
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return {};
  const { data } = await sb.from('passages').select('id,texts').in('id', uniq);
  const m = {}; (data||[]).forEach(p=>{ m[p.id]=p.texts; }); return m;
}
function passageHtml(texts){
  if (!Array.isArray(texts)) return '';
  return texts.map(t=>{
    const lbl = (t && t.label && texts.length>1) ? '<strong>'+esc(t.label)+'</strong><br>' : '';
    const tbl = (t && t.table_html) ? '<div class="st-table">'+t.table_html+'</div>' : '';
    var cnt = String((t && t.content) || '')
      .replace(/<\s*\/?\s*(ul|ol)\s*>/gi, '')
      .replace(/<\s*li\s*>/gi, '\n• ')
      .replace(/<\s*\/\s*li\s*>/gi, '');
    return '<div class="st-passage" style="white-space:pre-line">'+lbl+tbl+esc(cnt)+'</div>';
  }).join('');
}

let STATE = { questions:[], answers:{}, submitted:false, module:1, m1raw:0, secondHard:false };
let UID = null;
function recAns(slug, status){
  try{
    if(!slug || !UID) return;
    sb.from('user_answers').upsert({ user_id:UID, question_slug:slug, status:status, answered_at:new Date().toISOString() }, { onConflict:'user_id,question_slug' }).then(function(){}, function(){});
  }catch(e){}
}

function renderModuleHeader(){
  let rule='';
  if (mode==='checkpoint'){
    rule = '<div class="st-rulecard">Bu bir <strong>konu geçiş testidir</strong> (Form '+form+'). 27 sorudan <strong>19 veya üzeri</strong> (yüzde 70) doğru yaparsan bir sonraki bölüme geçebilirsin. 19 altında kalırsan öğretim bölümüne dön, tam tekrar et, sonra Form '+(form==='A'?'B':'A')+' testini çöz.</div>';
  } else {
    if (STATE.module===1) rule = '<div class="st-rulecard"><strong>Final — Modül 1 / 2 (27 soru).</strong> <strong>19 veya üzeri</strong> (yüzde 70) doğru yaparsan <strong>zor 2. modüle</strong> (tavan 800), altında kalırsan <strong>kolay 2. modüle</strong> yönlendirilirsin. Gerçek Digital SAT gibi sadece 2 modül (54 soru) çözersin; sonunda tahmini 200-800 puanın hesaplanır.</div>';
    else rule = '<div class="st-rulecard"><strong>Final — Modül 2 / 2 ('+(STATE.secondHard?'zor':'kolay')+').</strong> Modül 1 sonucuna göre yönlendirildin. Bu son modül; bittiğinde toplam ham puanın (/54) 200-800 ölçeğine çevrilir (tahmin).</div>';
  }
  return rule;
}

function renderQuestions(passages){
  let h = renderModuleHeader();
  h += '<div class="st-bar"><span>'+esc(U.tr)+' · '+(mode==='checkpoint'?('Geçiş Testi '+form):('Final Modül '+STATE.module))+'</span><span class="st-timer" id="st-timer"></span></div>';
  STATE.questions.forEach((q,i)=>{
    const opts = Array.isArray(q.options)?q.options:[];
    const pass = q.passage_id && passages[q.passage_id] ? passageHtml(passages[q.passage_id]) : '';
    h += '<div class="st-q" data-qi="'+i+'"'+(q.slug?' data-bm-slug="'+esc(q.slug)+'"':'')+'><span class="st-q-num">'+(i+1)+'</span>'+pass+
      '<div class="st-stem">'+esc(q.question_text)+'</div>';
    opts.forEach(o=>{
      h += '<label class="st-opt" data-letter="'+esc(o.letter)+'"><input type="radio" name="q'+i+'" value="'+esc(o.letter)+'"><span class="st-oletter">'+esc(o.letter)+'</span>'+esc(o.text)+'</label>';
    });
    h += '<div class="st-expl" id="expl'+i+'"></div></div>';
  });
  h += '<button class="st-btn" id="st-submit">Bitir ve Değerlendir</button>';
  app.innerHTML = h;
  app.querySelectorAll('.st-opt').forEach(l=>{
    l.addEventListener('click',()=>{
      if (STATE.submitted) return;
      const qi = l.closest('.st-q').dataset.qi;
      l.closest('.st-q').querySelectorAll('.st-opt').forEach(x=>x.classList.remove('sel'));
      l.classList.add('sel'); l.querySelector('input').checked=true;
      STATE.answers[qi]=l.dataset.letter;
    });
  });
  document.getElementById('st-submit').addEventListener('click', submitModule);
}

// explanations per-şık bir OBJE olabilir: {steps:[{title,body,quote?}],status} — ya da düz string
function exNode(node){
  if (node==null) return '';
  if (typeof node==='string') return '<p class="ex-b">'+esc(node)+'</p>';
  const steps = Array.isArray(node.steps) ? node.steps : null;
  if (steps){
    return steps.map(s=>{
      let x='';
      if (s.title) x+='<div class="ex-t">'+esc(s.title)+'</div>';
      if (s.quote) x+='<blockquote class="ex-q">'+esc(s.quote)+'</blockquote>';
      if (s.body)  x+='<p class="ex-b">'+esc(s.body)+'</p>';
      return x;
    }).join('');
  }
  if (typeof node.body==='string') return '<p class="ex-b">'+esc(node.body)+'</p>';
  return '';
}
function explHtml(q){
  const e = q.explanations || {};
  const ca = q.correct_answer;
  let h = '';
  h += '<h5>Doğru cevap: '+esc(ca)+'</h5>'+exNode(e[ca]);
  const wrongs = (Array.isArray(q.options)?q.options:[]).map(o=>o.letter).filter(l=>l!==ca);
  const anyWrong = wrongs.some(w=>{ const n=e[w]; return n && (typeof n==='string' || (n.steps&&n.steps.length) || n.body); });
  if (anyWrong){
    h += '<h5>Yanlış şıklar neden yanlış</h5>';
    wrongs.forEach(w=>{ const b=exNode(e[w]); if(b) h += '<div class="ex-w"><strong>'+esc(w)+'.</strong> '+b+'</div>'; });
  }
  if (e.type)  h = '<h5>Soru tipi</h5><p class="ex-b">'+esc(e.type)+'</p>'+h;
  if (e.trick) h += '<h5>Tuzak / ipucu</h5><p class="ex-b">'+esc(e.trick)+'</p>';
  return h;
}

function submitModule(){
  if (STATE.submitted && !(mode==='final' && STATE.module<2)) return;
  let correct = 0;
  STATE.questions.forEach((q,i)=>{
    const ans = STATE.answers[i];
    const qEl = app.querySelector('.st-q[data-qi="'+i+'"]');
    qEl.querySelectorAll('.st-opt').forEach(l=>{
      const let_ = l.dataset.letter;
      if (let_===q.correct_answer) l.classList.add('correct');
      else if (let_===ans) l.classList.add('wrong');
    });
    const isCorrect = ans===q.correct_answer;
    if (isCorrect) correct++;
    if (q.slug && ans) recAns(q.slug, isCorrect ? 'correct' : 'incorrect');  // çözülen soruyu Çalışma Masası'na işle
    const ex = document.getElementById('expl'+i); ex.innerHTML = explHtml(q); ex.classList.add('show');
  });
  STATE.submitted = true;
  document.getElementById('st-submit').style.display='none';
  showResult(correct);
}

function convTable(path){
  let rows='';
  for (let r=0;r<=54;r+=6){ rows += '<tr><td>'+r+'</td><td>'+scaledScore(r,path)+'</td></tr>'; }
  return '<table class="st-conv"><tr><th>Ham</th><th>Tahmini Puan</th></tr>'+rows+'</table>';
}

function showResult(correct){
  const total = STATE.questions.length;
  if (mode==='checkpoint'){
    const pass = correct>=19;
    // Sonucu events'e yaz (ogrenme haritasi halkasi + admin zaman cizelgesi bunu okur)
    try{
      if (window.GRI_UID && sb){
        const unitNo = ({info:1,craft:2,expression:3,conventions:4})[unitKey] || 0;
        sb.from('events').insert({user_id:window.GRI_UID,event_type:'unit_test_done',event_data:{unit:unitNo,score:correct,total:total,mode:'checkpoint',form:form},page:'/sat-unite-test.html?unite='+unitKey}).then(function(){},function(){});
      }
    }catch(e){}
    const moduleFile = {info:'sat-unite-1.html',craft:'sat-unite-2.html',expression:'sat-unite-3.html',conventions:'sat-unite-4.html'}[unitKey] || 'ogrenme-haritasi.html';
    let actions='';
    if (pass){
      actions='<div class="st-actions">'+
        '<a class="st-btn" href="'+moduleFile+'">Konu anlatımına dön</a>'+
        '<a class="st-btn gold" href="sat-unite-test.html?unite='+unitKey+'&mode=final">Final Denemeye Geç</a></div>';
    } else if (form==='A'){
      // Form A geçilemedi -> Form B ancak burada açılır
      actions='<div class="st-actions">'+
        '<a class="st-btn" href="'+moduleFile+'">Önce konuyu tekrar et</a>'+
        '<a class="st-btn gold" href="sat-unite-test.html?unite='+unitKey+'&mode=checkpoint&form=B">Form B ile tekrar dene</a></div>';
    } else {
      // Form B de geçilemedi -> konuya dön + Form A ile yeniden dene (A<->B döngüsü)
      actions='<div class="st-actions">'+
        '<a class="st-btn" href="'+moduleFile+'">Konu anlatımına dön, tam tekrar et</a>'+
        '<a class="st-btn gold" href="sat-unite-test.html?unite='+unitKey+'&mode=checkpoint&form=A">Form A ile tekrar dene</a></div>';
    }
    const note = pass
      ? 'Bu üniteyi geçtin. Final denemeyle puan tahminini görebilirsin.'
      : (form==='A'
          ? 'Baraja takıldın. Konuyu bir tur tekrar et, sonra <b>Form B</b> (aynı zorlukta, farklı sorular) ile yeniden dene.'
          : 'Form B\'de de baraja takıldın. Öğretim bölümüne dönüp eksik alt-becerileri çalış, sonra baştan dene.');
    const box='<div class="st-result"><div class="st-eyebrow">Geçiş Testi · Form '+form+'</div>'+
      '<div class="st-score">'+correct+' / 27</div>'+
      '<div class="st-pill '+(pass?'pass':'fail')+'">'+(pass?'GEÇTİN (yüzde 70+)':'GEÇEMEDİN (19 gerekli)')+'</div>'+
      '<p class="st-note">'+note+'</p>'+actions+'</div>';
    app.insertAdjacentHTML('afterbegin', box);
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  // FINAL — 2 modül adaptif (M1 -> adaptif 2. modül), her modül 27 soru, %70 = 19/27
  if (STATE.module===1){
    STATE.m1raw = correct;
    STATE.secondHard = correct>=19;           // %70+ -> zor 2. modül (tavan 800)
    const box='<div class="st-result"><div class="st-eyebrow">Final · Modül 1 / 2</div>'+
      '<div class="st-score">'+correct+' / 27</div>'+
      '<div class="st-pill '+(STATE.secondHard?'pass':'fail')+'">Yönlendirme: 2. modül '+(STATE.secondHard?'zor (tavan 800)':'kolay')+'</div>'+
      '<p class="st-note">'+(STATE.secondHard?'%70+ yaptın — zor 2. modüle geçiyorsun, üst puanların yolu açık.':'%70 altında kaldın — kolay 2. modüle geçiyorsun (tavan sınırlı).')+'</p>'+
      '<button class="st-btn gold" id="st-next">2. Modüle Geç &rsaquo;</button></div>';
    app.insertAdjacentHTML('afterbegin', box);
    window.scrollTo({top:0,behavior:'smooth'});
    document.getElementById('st-next').addEventListener('click', ()=>loadModule(2, STATE.secondHard));
    return;
  }
  // 2. modül bitti -> toplam /54 + puan
  const raw = STATE.m1raw + correct;
  const path = STATE.secondHard ? 'upper' : 'lower';
  const yol = STATE.secondHard ? 'Zor yol (tavan 800)' : 'Kolay yol';
  const scaled = scaledScore(raw, path);
  const box='<div class="st-result"><div class="st-eyebrow">Final Sonucu · '+yol+'</div>'+
    '<div class="st-score">~'+scaled+'</div>'+
    '<div class="st-pill pass">Ham: '+raw+' / 54 (M1 '+STATE.m1raw+' + M2 '+correct+')</div>'+
    '<p class="st-note">Bu bir <strong>tahmindir</strong>, resmi puan değildir. Gerçek Digital SAT her forma göre eşitlenir.</p>'+
    convTable(path)+'</div>';
  app.insertAdjacentHTML('afterbegin', box);
  window.scrollTo({top:0,behavior:'smooth'});
}

async function loadModule(n, hard){
  STATE.module=n; STATE.submitted=false; STATE.answers={};
  const rc=document.querySelector('.st-result'); if(rc) rc.remove();
  const diffs = hard ? ['medium','hard','hard'] : ['easy','easy','medium'];
  const pool = await fetchPool(U.cat, [...new Set(diffs)]);
  const set = buildSet(pool, 27, n-1);        // offset n-1 (0,1,2) -> modüller ayrık sorular
  const passages = await fetchPassages(set.map(q=>q.passage_id));
  STATE.questions=set;
  renderQuestions(passages);
}

async function init(){
  try{
    try{ const s = await sb.auth.getSession(); if (s && s.data && s.data.session) UID = s.data.session.user.id; if (UID){ window.GRI_SB = sb; window.GRI_UID = UID; } }catch(e){}
    const pool = await fetchPool(U.cat);
    if (!pool.length){ app.innerHTML='<div class="st-loading">Bu ünite için soru bulunamadı.</div>'; return; }
    const n = 27;
    const offset = mode==='checkpoint' ? (form==='A'?0:1) : 0;
    const set = buildSet(pool, n, offset);
    const passages = await fetchPassages(set.map(q=>q.passage_id));
    STATE.questions = set;
    document.title = U.tr+' · '+(mode==='checkpoint'?'Geçiş Testi':'Final')+' | Gri English';
    renderQuestions(passages);
  }catch(e){
    app.innerHTML='<div class="st-loading">Hata: '+esc(e.message||e)+'</div>';
  }
}
init();
</script>

<style>
/* soru yer imi */
.mcq[data-slug],.qz[data-slug],[data-bm-slug]{position:relative}
.gribm{position:absolute;top:12px;right:2px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;z-index:2}
.gribm:hover{background:rgba(46,110,106,.12)}
.gribm:disabled{opacity:.5;cursor:default}
.gribm svg{width:17px;height:17px;fill:none;stroke:#8a8f9c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,fill .15s}
.gribm.on svg{fill:#2E6E6A;stroke:#2E6E6A}
.mcq[data-slug] .mstem,.qz[data-slug] .qzq{padding-right:40px}
.q[data-bm-slug] .ql{padding-right:40px}
.st-q[data-bm-slug] .gribm{top:.7rem;right:.7rem}
</style>
<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
