<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit": 4, "unit_title": "SAT Reading & Writing Kampı", "unit_accent": "warm", "lessons": [{"no": 1, "name": "Boundaries", "teaching": {"ne_olculuyor": ["Bu ders noktalama ve cümle sınırlarını ölçer. Boşluk, iki fikri nasıl ayırdığını ya da birleştirdiğini sorar.", "Anahtar kavram: bağımsız cümle (independent clause) tek başına cümle olur, bağımlı cümle (dependent clause) olmaz. Noktalama bu ikisini doğru ayırmalı.", "Kritik nokta: iki bağımsız cümle virgülle birleşemez (comma splice) ve noktasız birbirine yapışamaz (run-on). Doğru araçlar: nokta, noktalı virgül, ya da virgül artı bağlaç."], "karar_proseduru": ["Boşluğun iki yanını oku. Her yan tek başına cümle olur mu, yani bağımsız mi.  Özne ve yüklem var mi diye bak.", "İki yan da bağımsızsa, onları ayırman gerek.  Seçenekler: nokta, noktalı virgül, ya da virgül artı FANBOYS bağlacı (for, and, nor, but, or, yet, so). Tek başına virgül YANLIŞ, o comma splice.", "Bir yan bağımlı ise, virgül çoğu zaman doğrudur.  Bağımlı cümle başta ise arkasına virgül gelir.", "İki nokta (:) ve kısa çizgi (--) kontrolü.  İki nokta ancak solunda TAM bir bağımsız cümle varsa kullanılır ve bir liste ya da açıklama tanıtır. Kısa çizgi ek bilgiyi ayırır, çift olarak eşlenir.", "Seç ve oku.  Cümleyi seçilen noktalamayla oku. İki fikir doğru ayrılmış mi, yanlış yapışma var mi kontrol et."], "celdirici_aileleri": [{"ad": "Comma splice ve run-on", "tanim": "İki bağımsız cümleyi ya sadece virgülle (comma splice) ya da hiç noktalama olmadan (run-on) birleştirir. En sık hata. İki tam cümle asla sadece virgülle birleşmez."}, {"ad": "İki nokta noktalı virgül yanlış", "tanim": "İki nokta ya da noktalı virgül yanlış yerde. İki nokta solunda tam cümle istemediği yerde kullanılır, ya da noktalı virgül iki bağımsız cümle olmadığı halde konur."}, {"ad": "Gereksiz ya da eksik virgül", "tanim": "Virgül olmaması gereken yere konur (özne ile yüklem arası) ya da gerekli olduğu yerde (giriş ifadesi, ara cümle sonrası) eksik bırakılır."}, {"ad": "Kısa çizgi parantez yanlış eşleme", "tanim": "Ara bilgiyi ayıran işaretler yanlış eşlenir. Başta kısa çizgi sonda virgül ya da parantez, gibi. Aynı tür işaret çiftlenmelidir."}], "top_tips": ["Boşluğun iki yanından her biri tek başına cümle olabiliyorsa, onları ayırman gerek. Sadece virgül asla yeterli değil, comma splice olur.", "Nokta ve noktalı virgül burada aynı işi yapar: iki bağımsız cümleyi ayırır.", "İki noktadan (:) önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır.", "Özne ile yüklem arasına virgül girmez. The scientists who worked for years, published derse, o virgül yanlıştır."], "kavramsal_temel": ["Boundaries, iki fikri noktalamayla doğru ayırmayı ölçer. Anahtar kavram bağımsız cümledir: özne ve yüklemi olan, tek başına cümle olabilen yapı. Bağımlı cümle tek başına duramaz.", "En önemli kural: iki bağımsız cümle sadece virgülle birleşemez, buna comma splice denir, ve noktalamasız birbirine yapışamaz, buna run-on denir. İki tam cümleyi ayırmanın doğru yolları: nokta, noktalı virgül, ya da virgül artı bağlaç (for, and, nor, but, or, yet, so).", "İki nokta (:) özeldir: solunda TAM bir bağımsız cümle olmalı ve bir liste ya da açıklama tanıtmalı. Solu yarım cümleyse iki nokta yanlıştır. Kısa çizgi ek bilgiyi ayırır ve çift olarak eşlenir.", "Bu yüzden her soruda önce boşluğun iki yanına bak: her yan tek başına cümle olur mu. İkisi de bağımsızsa ayırman gerek, sadece virgül asla yeterli değildir."], "cozumlu_ornekler": [{"passage": "The storm knocked out power across the region ______ of homes stayed dark for two days.", "stem": "Which choice conforms to the conventions of Standard English?", "choices": {"A": ", and thousands", "B": ", thousands", "C": " thousands", "D": "; and thousands"}, "correct": "A", "adimlar": ["İki yana bak: The storm knocked out power across the region tam cümle. thousands of homes stayed dark for two days tam cümle.", "İki bağımsız cümle, ayırmak gerek.", "Doğru yollar: nokta, noktalı virgül, ya da virgül artı bağlaç. A virgül artı and, doğru.", "B sadece virgül, comma splice. C noktalamasız, run-on. D noktalı virgül zaten ayırır, üstüne and konmaz."], "sonuc": "İki bağımsız cümle sadece virgülle birleşemez. Virgül artı bağlaç ya da nokta ya da noktalı virgül gerek."}, {"passage": "The garden contained three kinds of herb ______ mint, and thyme.", "stem": "Which choice conforms to the conventions of Standard English?", "choices": {"A": ": basil,", "B": "; basil,", "C": ", basil,", "D": " basil,"}, "correct": "A", "adimlar": ["Sol tarafa bak: The garden contained three kinds of herb tam bir cümle.", "Sağda gelen basılı, mint, and thyme bir liste, üçü tanıtıyor.", "Tam cümle artı tanıtılan liste, iki nokta ister. A doğru.", "B noktalı virgül iki bağımsız cümle ister, liste değil. C virgül çok zayıf. D noktalamasız, liste cümleye yapışır."], "sonuc": "İki nokta solunda tam cümle, sağında liste ya da açıklama ister. Bu şart tutuyor."}], "sik_hatalar": [{"hata": "İki tam cümleyi virgülle birleştirmek", "cozum": "Comma splice en sık hata. İki bağımsız cümle için nokta, noktalı virgül, ya da virgül artı bağlaç gerek."}, {"hata": "İki noktayı yarım cümleden sonra kullanmak", "cozum": "İki noktadan önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır."}, {"hata": "Özne ile yüklem arasına virgül koymak", "cozum": "The scientists who worked for years, published derse o virgül yanlıştır. Özne ile fiil ayrılmaz."}, {"hata": "Kısa çizgi ve virgülü eşitlememek", "cozum": "Ara bilgiyi ayıran işaretler çift olmalı. Başta çizgi sonda çizgi, ya da ikisi de virgül."}], "strateji": ["Boşluğun iki yanını oku, her yan tek başına cümle olur mu.", "İkisi de bağımsızsa ayır: nokta, noktalı virgül, ya da virgül artı bağlaç.", "Bir yan bağımlı ise, giriş ifadesinden sonra virgül doğru.", "İki nokta için solda tam cümle, sağında liste ya da açıklama olmalı.", "Kısa çizgi ve parantezi çift eşle."]}, "families": ["Comma splice ve run-on", "İki nokta noktalı virgül yanlış", "Gereksiz ya da eksik virgül", "Kısa çizgi parantez yanlış eşleme"], "fam_short": {"Comma splice ve run-on": "Splice/run-on", "İki nokta noktalı virgül yanlış": "İki nokta/;", "Gereksiz ya da eksik virgül": "Virgül", "Kısa çizgi parantez yanlış eşleme": "Çizgi/parantez"}, "main_ids": ["u4-l1-f1-01", "u4-l1-f2-01", "u4-l1-f3-01", "u4-l1-f4-01"], "questions": [{"id": "u4-l1-f1-01", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "The storm knocked out power across the region ______ of homes stayed dark for two days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", and thousands", "B": ", thousands", "C": " thousands", "D": "; and thousands"}, "correct": "A", "choice_families": {"B": "Comma splice ve run-on", "C": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış"}, "why_correct": "Both sides are independent clauses, so a comma plus the conjunction 'and' correctly joins them.", "why_wrong": {"B": "A comma alone between two independent clauses is a comma splice.", "C": "No punctuation between two independent clauses is a run-on.", "D": "A semicolon already joins independent clauses on its own; adding 'and' after it is not standard."}}, {"id": "u4-l1-f1-02", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "The museum renovated its main hall last year ______ now displays twice as many works as before.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", it", "B": ". It", "C": " it", "D": ", it,"}, "correct": "B", "choice_families": {"C": "Comma splice ve run-on", "D": "Gereksiz ya da eksik virgül", "A": "Comma splice ve run-on"}, "why_correct": "Both clauses are independent, so a period correctly separates them into two sentences.", "why_wrong": {"C": "No punctuation between two independent clauses is a run-on.", "D": "The extra comma after 'it' wrongly separates the subject from its verb.", "A": "A comma alone between two independent clauses is a comma splice."}}, {"id": "u4-l1-f1-03", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "Bees are vital pollinators for many crops ______ decline worries farmers around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": " their", "B": ", their", "C": "; their", "D": ": their"}, "correct": "C", "choice_families": {"B": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış", "A": "Comma splice ve run-on"}, "why_correct": "Both clauses are independent, so a semicolon correctly links two closely related complete thoughts.", "why_wrong": {"B": "A comma alone between two independent clauses is a comma splice.", "D": "A colon should introduce a list or explanation, but the second clause does not explain the first.", "A": "No punctuation between two independent clauses is a run-on."}}, {"id": "u4-l1-f1-04", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "The report was released on Monday ______ Tuesday it had already been downloaded a million times.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "; and by", "B": ", by", "C": " by", "D": ", and by"}, "correct": "D", "choice_families": {"B": "Comma splice ve run-on", "C": "Comma splice ve run-on", "A": " esson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "The team practiced all summer ______ hard work paid off in the fall tournament.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "; their", "B": ", their", "C": " their", "D": ", so their,"}, "correct": "A", "choice_families": {"B": "Comma splice ve run-on", "C": "Comma splice ve run-on", "D": "Gereksiz ya da eksik virgül"}, "why_correct": "Both clauses are independent, so a semicolon correctly links two closely related thoughts.", "why_wrong": {"B": "A comma alone between two independent clauses is a comma splice.", "C": "No punctuation between two independent clauses is a run-on.", "D": "The comma after 'their' wrongly separates the possessive from the noun it introduces."}}, {"id": "u4-l1-f1-10", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Comma splice ve run-on", "passage": "The novel was published to little notice ______ later it was hailed as a masterpiece.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", decades", "B": ", but decades", "C": " decades", "D": ": but decades"}, "correct": "B", "choice_families": {"C": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış", "A": "Comma splice ve run-on"}, "why_correct": "Both clauses are independent, so a comma plus 'but' correctly joins them and marks the contrast.", "why_wrong": {"C": "No punctuation between two independent clauses is a run-on.", "D": "A colon cannot introduce a contrasting independent clause with 'but' this way.", "A": "A comma alone between two independent clauses is a comma splice."}}, {"id": "u4-l1-f2-01", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "İki nokta noktalı virgül yanlış", "passage": "The garden contained three kinds of herb ______ mint, and thyme.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "; basil,", "B": ": basil,", "C": ", basil,", "D": " basil,"}, "correct": "B", "choice_families": {"C": "Gereksiz ya da eksik virgül", "D": "Comma splice ve run-on", "A": "İki nokta noktalı virgül yanlış"}, "why_correct": "A complete clause is followed by a list naming the herbs, so a colon correctly introduces it.", "why_wrong": {"C": "A comma is too weak to introduce this list after a complete clause.", "D": "No punctuation runs the list into the clause without the needed introduction.", "A": "A semicolon needs an independent clause after it, but the list is not a clause."}}, {"id": "u4-l1-f2-02", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "İki nokta noktalı virgül yanlış", "passage": "The results pointed to one clear conclusion ______ new method was faster than the old one.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", the", "B": "; that the", "C": ": the", "D": " the"}, "correct": "C", "choice_families": {"B": "İki nokta noktalı virgül yanlış", "D": "Comma splice ve run-on", "A": "Gereksiz ya da eksik virgül"}, "why_correct": "The first part is complete and the second explains the 'conclusion,' so a colon introduces the explanation.", "why_wrong": {"B": "A semicolon plus 'that' creates a fragment rather than joining two independent clauses.", "D": "No punctuation runs the explanation into the clause without any break.", "A": "A comma is too weak to introduce this explanation after a complete clause."}}, {"id": "u4-l1-f2-03", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "İki nokta noktalı virgül yanlış", "passage": "The committee reached its decision quickly ______ vote was unanimous and took only minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": " the", "B": ": th sage": "After finishing the marathon ______ runners wrapped themselves in foil blankets.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ": the", "B": " the", "C": "; the", "D": ", the"}, "correct": "D", "choice_families": {"B": "Gereksiz ya da eksik virgül", "C": "Comma splice ve run-on", "A": "İki nokta noktalı virgül yanlış"}, "why_correct": "An introductory phrase precedes the main clause, so a comma correctly sets it off.", "why_wrong": {"B": "Without a comma, the introductory phrase runs into the main clause.", "C": "A semicolon needs an independent clause before it, but the opening phrase is not one.", "A": "A colon cannot follow an introductory phrase this way."}}, {"id": "u4-l1-f3-03", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Gereksiz ya da eksik virgül", "passage": "The old lighthouse ______ had guided ships for a century, was finally retired.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", which", "B": " which", "C": "; which", "D": ": which"}, "correct": "A", "choice_families": {"B": "Gereksiz ya da eksik virgül", "C": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış"}, "why_correct": "The nonessential clause 'which had guided ships for a century' is set off by a pair of commas, so a comma is needed before it.", "why_wrong": {"B": "Without the comma, the nonessential clause is not properly set off from the noun.", "C": "A semicolon would wrongly cut the sentence where a clause is merely inserted.", "D": "A colon cannot introduce a nonessential 'which' clause here."}}, {"id": "u4-l1-f3-04", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Gereksiz ya da eksik virgül", "passage": "The report examined trends in rainfall, temperature ______ wind over fifty years.", "stem": "Which choice completes the text so that it conforms to the conventions omma splice ve run-on", "A": "İki nokta noktalı virgül yanlış"}, "why_correct": "A dependent clause opens the sentence, so a comma separates it from the main clause.", "why_wrong": {"B": "Without a comma, the opening dependent clause runs into the main clause.", "C": "A semicolon needs an independent clause before it, but the 'Because' clause is dependent.", "A": "A colon cannot follow an opening dependent clause this way."}}, {"id": "u4-l1-f3-07", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Gereksiz ya da eksik virgül", "passage": "The author's latest novel ______ sweeping family saga, has topped the bestseller list.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", a", "B": " a", "C": "; a", "D": ": a"}, "correct": "A", "choice_families": {"B": "Gereksiz ya da eksik virgül", "C": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış"}, "why_correct": "The appositive 'a sweeping family saga' renames the novel and is set off by a pair of commas, so a comma is needed before it.", "why_wrong": {"B": "Without the comma, the appositive is not properly set off from the noun.", "C": "A semicolon would wrongly split the sentence where a phrase is merely inserted.", "D": "A colon cannot introduce a mid-sentence appositive that is closed later by a comma."}}, {"id": "u4-l1-f3-08", "unit": 4, "lesson": 1, "lesson_name": "Boundaries", "target_family": "Gereksiz ya da eksik virgül", "passage": "The volunteers who arrived earliest ______ up the tables before the crowd came.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": ", set", "B": " set", "C": "; set", "D": ": set"}, "correct": "B", "choice_families": {"C": "Comma splice ve run-on", "D": "İki nokta noktalı virgül yanlış", "A": "Gereksiz ya da eksik virgül"}, "why_correct": "No punctuation belongs between the subject and its verb; 'who arrived lmalı.", "Zamir boşluğu ise, gönderdiği ismi bul ve sayısına bak.  Tekil isim tekil zamir ister. A student ... their değil his or her ya da yeniden yapılandır.", "Cümle bir tanımlayanla başlıyorsa, hemen ardından gelen İSİM onun tanımladığı şey olmalı.  Walking home, the rain started YANLIŞ, çünkü yağmur yürümez.", "Liste ya da karşılaştırma varsa paralel yap.  Ögeler aynı formda olmalı: reading, writing, and drawing; to read değil."], "celdirici_aileleri": [{"ad": "Özne yüklem uyumsuzluğu", "tanim": "Fiil öznesiyle sayıda uyuşmaz. Araya giren ifadeler yüzünden yanlış kelimeyi özne sanmak en sık hata. Tekil özne tekil fiil, çoğul özne çoğul fiil ister."}, {"ad": "Fiil zamanı tutarsızlığı", "tanim": "Fiil cümlenin ya da paragrafın zamanına uymaz. Etraf geçmiş zamandayken boşluğa şimdiki ya da gelecek konur. Zaman tutarlı olmalı."}, {"ad": "Zamir uyumsuzluğu", "tanim": "Zamir gönderdiği isimle sayıda uyuşmaz ya da hangi ismi gönderdiği belirsizdir. Tekil isme çoğul zamir, ya da iki olası isme tek zamir."}, {"ad": "Modifier ve paralellik", "tanim": "Tanımlayan yanlış şeyi tanımlar (dangling ya da misplaced modifier), ya da liste ve karşılaştırmadaki ögeler aynı formda değildir (paralellik bozuk)."}], "top_tips": ["Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ... ifadesini elle kapat, gerçek özneyi gör.", "Zaman için etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı. Zaman kayması tuzaktır.", "their tek bir kişi için kullanılamaz (Standard English'te bu soru tipinde). A person ... their yerine his or her, ya da isim çoğul yapılır.", "Cümle -ing ya da -ed ile başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı. Yapmıyorsa modifier yanlış yerleşmiş."], "kavramsal_temel": ["Form, Structure, and Sense, cümlenin dilbilgisi yapısını ölçer: fiil uyumu ve zamanı, zamir uyumu, modifier yerleşimi ve paralellik. Boşluk çoğu zaman bir fiil, zamir ya da kelime formu ister.", "Fiil uyumunda en sık tuzak, öznenin fiile en yakın kelime OLMAMASIDIR. The box of old letters was derse, özne box (tekil), letters değil. Araya giren of ifadesini elle kapatıp gerçek özneyi bul.", "Zamir gönderdiği isimle sayıda uyuşmalı. Bu soru tipinde tekil isme çoğul their genelde yanlıştır, his or her ya da isim çoğul yapılır. Ayrıca cümle bir tanımlayanla başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı, yoksa modifier yanlış yerleşir.", "Paralellikte liste ve karşılaştırmadaki ögeler aynı formda olmalı: reading, writing, and drawing, arada to read olmaz. Önce yapının ne olduğunu belirle, sonra boşluğu ona uydur."], "cozumlu_ornekler": [{"passage": "The box of old photographs and letters ______ been sitting in the attic for decades.", "stem": "Which choice conforms to the conventions of Standard English?", "choices": {"A": "has", "B": "have", "C": "having", "D": "to have"}, "correct": "A", "adimlar": ["Gerçek özneyi bul: The box. of old photographs and letters araya giren ifade, özne değil.", "box tekil, o yüzden fiil tekil olmalı.", "has tekil, doğru.", "have çoğul, letters'a uyar ama gerçek özne box. having ve to have çekimli fiil değil, ana fiil olamaz."], "sonuc": "Araya giren of ... ifadesini kapat, gerçek özneyi (box, tekil) gör, fiili ona uydur."}, {"passage": "The internship taught her to code, to write clearly, and ______.", "stem": "Which choice conforms to the conventions of Standard English?", "choices": {"A": "to manage a team", "B": "managing a team", "C": "a team can be managed", "D": "how a team is managed"}, "correct": "A", "adimlar": ["Listenin yapısına bak: to code, to write, yani mastar formu (to + fiil).", "Paralellik için üçüncü öge de aynı formda olmalı.", "to manage a team mastar, paralel, doğru.", "managing gerund, formu bozar. c ve d birer cümle, mastar değil, paralellik kırılır."], "sonuc": "Listedeki ögeler aynı formda olmalı. İlk ikisi mastar ise üçüncü de mastar."}], "sik_hatalar": [{"hata": "Yanlış kelimeyi özne sanmak", "cozum": "Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ifadesini kapat."}, {"hata": "Zaman kayması", "cozum": "Etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı."}, {"hata": "Tekil isme çoğul zamir", "cozum": "Bu soru tipinde a person ... their yerine his or her, ya da ismi çoğul yap."}, {"hata": "Modifier ve paralellik bozmak", "cozum": "Cümle -ing ya da -ed ile başlıyorsa virgülden sonraki ilk isim o eylemi yapan olmalı. Listede ögeleri aynı formda tut."}], "strateji": ["Fiil boşluğunda gerçek özneyi bul, araya giren ifadeyi kapat.", "Zamana bak, cümlenin gerisiyle tutarlı fiili seç.", "Zamir boşluğunda gönderdiği ismi bul, sayısına uydur.", "Cümle tanımlayanla başlıyorsa, ardından gelen isim eylemi yapan olmalı.", "Liste ve karşılaştırmada ögeleri aynı formda tut."]}, "families": ["Özne yüklem uyumsuzluğu", "Fiil zamanı tutarsızlığı", "Zamir uyumsuzluğu", "Modifier ve paralellik"], "fam_short": {"Özne yüklem uyumsuzluğu": "Özne/yüklem", "Fiil zamanı tutarsızlığı": "Fiil zamanı", "Zamir uyumsuzluğu": "Zamir", "Modifier ve paralellik": "Modifier/paralel"}, "main_ids": ["u4-l2-f1-01", "u4-l2-f2-01", "u4-l2-f3-01", "u4-l2-f4-01"], "questions": [{"id": "u4-l2-f1-01", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "The box of old photographs and letters ______ been sitting in the attic for decades.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "has", "B": "have", "C": "having", "D": "to have"}, "correct": "A", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "C": "Fiil zamanı tutarsızlığı", "D": "Modifier ve paralellik"}, "why_correct": "The subject is the singular 'box,' not 'photographs and letters,' so the singular verb 'has' agrees.", "why_wrong": {"B": "'have' is plural, but the true subject 'box' is singular.", "C": "'having' is not a finite verb and cannot serve as the main verb here.", "D": "'to have' is an infinitive and cannot serve as the main verb of the sentence."}}, {"id": "u4-l2-f1-02", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "Each of the students in the advanced classes ______ required to submit a final project.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "are", "B": "is", "C": "were", "D": "being"}, "correct": "B", "choice_families": {"C": "Fiil zamanı tutarsızlığı", "D": "Modifier ve paralellik", "A": "Özne yüklem uyumsuzluğu"}, "why_correct": "The subject is 'Each,' which is singular, so the singular verb 'is' agrees.", "why_wrong": {"C": "'were' is plural and past, disagreeing with the singular subject and the present context.", "D": "'being' is not a finite verb and cannot serve as the main verb.", "A": "'are' is plural, but 'Each' is singular regardless of the plural nouns nearby."}}, {"id": "u4-l2-f1-03", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "The list of approved suppliers ______ updated at the start of every month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "were", "B": "are", "C": "is", "D": "have been"}, "correct": "C", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "D": "Özne yüklem uyumsuzluğu", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The subject is the singular 'list,' not 'suppliers,' so the singular verb 'is' agrees.", "why_wrong": {"B": "'are' is plural, but the true subject 'list' is singular.", "D": "'have been' is plural, disagreeing with the singular 'list.'", "A": "'were' is plural and shifts to past, disagreeing with the singular subject."}}, {"id": "u4-l2-f1-04", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "Neither the manager nor the employees ______ aware of the schedule change.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "has been", "B": "was", "C": "is", "D": "were"}, "correct": "D", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "C": "Özne yüklem uyumsuzluğu", "A": "Özne yüklem uyumsuzluğu"}, "why_correct": "With 'neither ... nor,' the verb agrees with the nearer subject 'employees,' which is plural, so 'were' agrees.", "why_wrong": {"B": "'was' is singular, but the nearer subject 'employees' is plural.", "C": "'is' is singular and present, disagreeing with the plural nearer subject.", "A": "'has been' is singular, disagreeing with the plural 'employees.'"}}, {"id": "u4-l2-f1-05", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "The committee ______ its decision after weeks of careful debate.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "announced", "B": "announce", "C": "have announced", "D": "announcing"}, "correct": "A", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "C": "Özne yüklem uyumsuzluğu", "D": "Modifier ve paralellik"}, "why_correct": "'Committee' is a singular collective noun acting as one unit, so the singular past verb 'announced' agrees.", "why_wrong": {"B": "'announce' fails to agree with the singular collective noun and shifts the sense to present.", "C": "'have announced' treats the singular committee as plural.", "D": "'announcing' is not a finite verb and cannot serve as the main verb."}}, {"id": "u4-l2-f1-06", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "One of the reasons for the project's success ______ its clear leadership.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "were", "B": "was", "C": "have been", "D": "being"}, "correct": "B", "choice_families": {"C": "Özne yüklem uyumsuzluğu", "D": "Modifier ve paralellik", "A": "Özne yüklem uyumsuzluğu"}, "why_correct": "The subject is 'One,' which is singular, so the singular verb 'was' agrees.", "why_wrong": {"C": "'have been' is plural, disagreeing with the singular 'One.'", "D": "'being' is not a finite verb and cannot serve as the main verb.", "A": "'were' is plural, but the true subject 'One' is singular, not 'reasons.'"}}, {"id": "u4-l2-f1-07", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "The data from the two surveys ______ a clear trend among younger voters.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "is revealing", "B": "reveals", "C": "reveal", "D": "to reveal"}, "correct": "C", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "D": "Modifier ve paralellik", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "'Data' is treated as plural here, so the plural verb 'reveal' agrees.", "why_wrong": {"B": "'reveals' is singular, disagreeing with the plural 'data.'", "D": "'to reveal' is an infinitive and cannot serve as the main verb.", "A": "'is revealing' is singular, disagreeing with the plural 'data.'"}}, {"id": "u4-l2-f1-08", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "A collection of rare coins ______ displayed in the museum's east wing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "have been", "B": "are", "C": "were", "D": "is"}, "correct": "D", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "C": "Fiil zamanı tutarsızlığı", "A": "Özne yüklem uyumsuzluğu"}, "why_correct": "The subject is the singular 'collection,' not 'coins,' so the singular verb 'is' agrees.", "why_wrong": {"B": "'are' is plural, but the true subject 'collection' is singular.", "C": "'were' is plural and past, disagreeing with the singular subject.", "A": "'have been' is plural, disagreeing with the singular 'collection.'"}}, {"id": "u4-l2-f1-09", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "Every one of the paintings in the gallery ______ carefully lit to bring out its colors.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "is", "B": "are", "C": "were", "D": "being"}, "correct": "A", "choice_families": {"B": "Özne yüklem uyumsuzluğu", "C": "Fiil zamanı tutarsızlığı", "D": "Modifier ve paralellik"}, "why_correct": "The subject is 'Every one,' which is singular, so the singular verb 'is' agrees.", "why_wrong": {"B": "'are' is plural, but 'Every one' is singular despite the plural 'paintings.'", "C": "'were' is plural and past, disagreeing with the singular subject.", "D": "'being' is not a finite verb and cannot serve as the main verb."}}, {"id": "u4-l2-f1-10", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Özne yüklem uyumsuzluğu", "passage": "The number of applicants for the scholarship ______ risen sharply this year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "have", "B": "has", "C": "are", "D": "having"}, "correct": "B", "choice_families": {"C": "Özne yüklem uyumsuzluğu", "D": "Modifier ve paralellik", "A": "Özne yüklem uyumsuzluğu"}, "why_correct": "'The number' is a singular subject, so the singular verb 'has' agrees.", "why_wrong": {"C": "'are' is plural, disagreeing with the singular 'The number.'", "D": "'having' is not a finite verb and cannot serve as the main verb.", "A": "'have' is plural, but 'The number' is singular, unlike 'a number,' which is plural."}}, {"id": "u4-l2-f2-01", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "The researchers gathered their samples in the morning and ______ them in the lab that afternoon.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "analyze", "B": "analyzed", "C": "will analyze", "D": "are analyzing"}, "correct": "B", "choice_families": {"C": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The first verb 'gathered' is past, so the parallel past 'analyzed' keeps the tense consistent.", "why_wrong": {"C": "'will analyze' shifts to future, inconsistent with the past 'gathered.'", "D": "'are analyzing' shifts to present, inconsistent with the past narrative.", "A": "'analyze' shifts to present, breaking the past-tense sequence begun by 'gathered.'"}}, {"id": "u4-l2-f2-02", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "By the time the guests arrived, the host ______ already prepared every dish on the menu.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "will have", "B": "has", "C": "had", "D": "is having"}, "correct": "C", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "An action completed before the past 'arrived' takes the past perfect, so 'had' is correct.", "why_wrong": {"B": "'has' is present perfect, inconsistent with the past-time frame set by 'arrived.'", "D": "'is having' is present progressive, inconsistent with the past-time frame.", "A": "'will have' points to the future, inconsistent with the past narrative."}}, {"id": "u4-l2-f2-03", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "Today many households rely on solar power, and each year even more ______ to it as costs fall.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "will have switched", "B": "switched", "C": "had switched", "D": "switch"}, "correct": "D", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "C": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The sentence is in the present ('rely,' 'fall'), so the present 'switch' keeps the tense consistent.", "why_wrong": {"B": "'switched' shifts to past, inconsistent with the present 'rely' and 'fall.'", "C": "'had switched' is past perfect, inconsistent with the present-time frame.", "A": "'will have switched' points to the future, inconsistent with the present context."}}, {"id": "u4-l2-f2-04", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "The novelist wrote her first draft by hand, then ______ it into a computer for editing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "typed", "B": "types", "C": "will type", "D": "is typing"}, "correct": "A", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "C": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı"}, "why_correct": "The first verb 'wrote' is past, so the past 'typed' keeps the sequence consistent.", "why_wrong": {"B": "'types' shifts to present, breaking the past sequence begun by 'wrote.'", "C": "'will type' shifts to future, inconsistent with the past 'wrote.'", "D": "'is typing' shifts to present, inconsistent with the past narrative."}}, {"id": "u4-l2-f2-05", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "Every spring the river rises, floods the fields, and then slowly ______ to its normal level by summer.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "receded", "B": "recedes", "C": "had receded", "D": "will have receded"}, "correct": "B", "choice_families": {"C": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The habitual present ('rises,' 'floods') calls for the present 'recedes' to stay consistent.", "why_wrong": {"C": "'had receded' is past perfect, inconsistent with the present-time frame.", "D": "'will have receded' points to the future, inconsistent with the present pattern.", "A": "'receded' shifts to past, inconsistent with the present 'rises' and 'floods.'"}}, {"id": "u4-l2-f2-06", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "The ancient city thrived for centuries before a series of earthquakes ______ it in ruins.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "will leave", "B": "leaves", "C": "left", "D": "has left"}, "correct": "C", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The past 'thrived' sets a past-time frame, so the past 'left' stays consistent.", "why_wrong": {"B": "'leaves' shifts to present, inconsistent with the past 'thrived.'", "D": "'has left' is present perfect, inconsistent with the completed past-time frame.", "A": "'will leave' shifts to future, inconsistent with the past narrative."}}, {"id": "u4-l2-f2-07", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "Right now the crew is loading the ship, and by nightfall they ______ every crate on board.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "stow", "B": "stowed", "C": "had stowed", "D": "will have stowed"}, "correct": "D", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "C": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "An action completed by a future point ('by nightfall') takes the future perfect 'will have stowed.'", "why_wrong": {"B": "'stowed' is simple past, inconsistent with the future point 'by nightfall.'", "C": "'had stowed' is past perfect, inconsistent with the future-time frame.", "A": "'stow' is simple present and does not express completion by the future point."}}, {"id": "u4-l2-f2-08", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "The students studied the map for a while, discussed the route, and finally ______ on a plan.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "agreed", "B": "agree", "C": "will agree", "D": "are agreeing"}, "correct": "A", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "C": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı"}, "why_correct": "The past verbs 'studied' and 'discussed' set a past sequence, so the past 'agreed' stays consistent.", "why_wrong": {"B": "'agree' shifts to present, breaking the past sequence.", "C": "'will agree' shifts to future, inconsistent with the past verbs.", "D": "'are agreeing' shifts to present, inconsistent with the past narrative."}}, {"id": "u4-l2-f2-09", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "These days the factory runs on renewable power, and its emissions ______ far lower than they were a decade ago.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "were", "B": "are", "C": "had been", "D": "will be"}, "correct": "B", "choice_families": {"C": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The present frame ('These days,' 'runs') calls for the present 'are' to stay consistent.", "why_wrong": {"C": "'had been' is past perfect, inconsistent with the present-time frame.", "D": "'will be' points to the future, inconsistent with the present context.", "A": "'were' shifts to past, inconsistent with the present 'runs.'"}}, {"id": "u4-l2-f2-10", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Fiil zamanı tutarsızlığı", "passage": "The explorer kept a detailed journal throughout the voyage and later ______ it into a bestselling book.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "will turn", "B": "turns", "C": "turned", "D": "is turning"}, "correct": "C", "choice_families": {"B": "Fiil zamanı tutarsızlığı", "D": "Fiil zamanı tutarsızlığı", "A": "Fiil zamanı tutarsızlığı"}, "why_correct": "The past 'kept' sets a past frame, so the past 'turned' stays consistent.", "why_wrong": {"B": "'turns' shifts to present, inconsistent with the past 'kept.'", "D": "'is turning' shifts to present, inconsistent with the past-time frame.", "A": "'will turn' shifts to future, inconsistent with the past narrative."}}, {"id": "u4-l2-f3-01", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "Each student must bring ______ own laptop to the coding workshop.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they're", "B": "their", "C": "his or her", "D": "there"}, "correct": "C", "choice_families": {"B": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The singular antecedent 'Each student' takes a singular pronoun, so 'his or her' agrees.", "why_wrong": {"B": "'their' is plural and does not agree with the singular 'Each student' in this convention.", "D": "'there' indicates place and is not a possessive pronoun.", "A": "'they're' means 'they are' and is not a possessive pronoun."}}, {"id": "u4-l2-f3-02", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "The company revised ______ policy after employees raised concerns about overtime.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they're", "B": "their", "C": "it's", "D": "its"}, "correct": "D", "choice_families": {"B": "Zamir uyumsuzluğu", "C": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The singular 'company' takes the singular possessive 'its.'", "why_wrong": {"B": "'their' is plural, disagreeing with the singular 'company.'", "C": "'it's' means 'it is' and is not a possessive.", "A": "'they're' means 'they are' and is not a possessive."}}, {"id": "u4-l2-f3-03", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "A good teacher adapts ______ methods to the needs of each class.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "his or her", "B": "their", "C": "its", "D": "they're"}, "correct": "A", "choice_families": {"B": "Zamir uyumsuzluğu", "C": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu"}, "why_correct": "The singular 'A good teacher' takes a singular pronoun, so 'his or her' agrees.", "why_wrong": {"B": "'their' is plural and does not agree with the singular 'A good teacher' in this convention.", "C": "'its' is used for things, not a person like a teacher.", "D": "'they're' means 'they are' and is not a possessive."}}, {"id": "u4-l2-f3-04", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "The two universities announced that ______ would merge their science departments.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "it", "B": "they", "C": "he", "D": "one"}, "correct": "B", "choice_families": {"C": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The plural antecedent 'two universities' takes the plural pronoun 'they.'", "why_wrong": {"C": "'he' is singular and refers to a person, not two institutions.", "D": "'one' is singular and does not match the plural antecedent.", "A": "'it' is singular, disagreeing with the plural 'two universities.'"}}, {"id": "u4-l2-f3-05", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "Neither of the sisters remembered where ______ had left the keys.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "it", "B": "they", "C": "she", "D": "one's"}, "correct": "C", "choice_families": {"B": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "'Neither' is singular, so the singular pronoun 'she' agrees.", "why_wrong": {"B": "'they' is plural, but 'Neither' is singular.", "D": "'one's' is a possessive and does not fit as the subject of 'had left.'", "A": "'it' does not refer to a person."}}, {"id": "u4-l2-f3-06", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "The orchestra tuned ______ instruments before the conductor arrived.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they're", "B": "their", "C": "it's", "D": "its"}, "correct": "D", "choice_families": {"B": "Zamir uyumsuzluğu", "C": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The singular collective noun 'orchestra,' acting as one unit, takes the singular 'its.'", "why_wrong": {"B": "'their' treats the singular collective noun as plural here.", "C": "'it's' means 'it is' and is not a possessive.", "A": "'they're' means 'they are' and is not a possessive."}}, {"id": "u4-l2-f3-07", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "Every applicant should proofread ______ essay before submitting it.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "his or her", "B": "their", "C": "its", "D": "your"}, "correct": "A", "choice_families": {"B": "Zamir uyumsuzluğu", "C": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu"}, "why_correct": "The singular 'Every applicant' takes a singular pronoun, so 'his or her' agrees.", "why_wrong": {"B": "'their' is plural and does not agree with the singular 'Every applicant' in this convention.", "C": "'its' is used for things, not a person.", "D": "'your' shifts to the second person, which the antecedent does not support."}}, {"id": "u4-l2-f3-08", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "The board reversed ______ earlier ruling once new evidence came to light.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "their", "B": "its", "C": "it's", "D": "they're"}, "correct": "B", "choice_families": {"C": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The singular collective 'board,' acting as one unit, takes the singular 'its.'", "why_wrong": {"C": "'it's' means 'it is' and is not a possessive.", "D": "'they're' means 'they are' and is not a possessive.", "A": "'their' treats the singular collective noun as plural."}}, {"id": "u4-l2-f3-09", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "One should always double-check ______ work before handing it in.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "his", "B": "their", "C": "one's", "D": "your"}, "correct": "C", "choice_families": {"B": "Zamir uyumsuzluğu", "D": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The pronoun 'One' is matched by the possessive 'one's' to keep person and number consistent.", "why_wrong": {"B": "'their' is plural and shifts away from the singular 'One.'", "D": "'your' shifts to the second person, breaking agreement with 'One.'", "A": "'his' narrows to one gender where 'one's' is the consistent form."}}, {"id": "u4-l2-f3-10", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Zamir uyumsuzluğu", "passage": "The herd moved slowly across the plain, following ______ leader toward the water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they're", "B": "their", "C": "it's", "D": "its"}, "correct": "D", "choice_families": {"B": "Zamir uyumsuzluğu", "C": "Zamir uyumsuzluğu", "A": "Zamir uyumsuzluğu"}, "why_correct": "The singular collective 'herd,' acting as one unit, takes the singular 'its.'", "why_wrong": {"B": "'their' treats the singular collective noun as plural.", "C": "'it's' means 'it is' and is not a possessive.", "A": "'they're' means 'they are' and is not a possessive."}}, {"id": "u4-l2-f4-01", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "Walking home in the rain, ______ soaked before reaching the door.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "her clothes were", "B": "the umbrella was", "C": "it was", "D": "she was"}, "correct": "D", "choice_families": {"B": "Modifier ve paralellik", "C": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The opening modifier 'Walking home' must describe the subject that follows; 'she' is the one walking, so 'she was' is correct.", "why_wrong": {"B": "'the umbrella' cannot be the one walking home, so it dangles the modifier.", "C": "'it' does not name the walker the modifier requires.", "A": "'her clothes' cannot be walking home, so the modifier dangles."}}, {"id": "u4-l2-f4-02", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "The internship taught her to code, to write clearly, and ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "to manage a team", "B": "managing a team", "C": "a team can be managed", "D": "how a team is managed"}, "correct": "A", "choice_families": {"B": "Modifier ve paralellik", "C": "Modifier ve paralellik", "D": "Modifier ve paralellik"}, "why_correct": "The list uses infinitives ('to code, to write'), so the parallel 'to manage a team' keeps the structure consistent.", "why_wrong": {"B": "'managing' is a gerund and breaks the parallel infinitive pattern.", "C": "'a team can be managed' is a clause, not a parallel infinitive phrase.", "D": "'how a team is managed' is a clause and breaks the parallel structure."}}, {"id": "u4-l2-f4-03", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "Covered in dust after the excavation, ______ carefully brushed off each artifact.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "the brushes", "B": "the archaeologists", "C": "it was", "D": "there were tools that"}, "correct": "B", "choice_families": {"C": "Modifier ve paralellik", "D": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The modifier 'Covered in dust' must describe the ones doing the brushing; the archaeologists are covered in dust, so they are the correct subject.", "why_wrong": {"C": "'it was' names no agent for the modifier to describe.", "D": "'there were tools that' leaves the modifier without the person it should describe.", "A": "'the brushes' being covered in dust cannot be the ones brushing off artifacts."}}, {"id": "u4-l2-f4-04", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "The coach valued players who trained hard, listened closely, and ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "were staying positive", "B": "staying positive", "C": "stayed positive", "D": "positivity"}, "correct": "C", "choice_families": {"B": "Modifier ve paralellik", "D": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The list uses past-tense verbs ('trained, listened'), so the parallel 'stayed positive' keeps the structure consistent.", "why_wrong": {"B": "'staying' breaks the parallel simple-past pattern.", "D": "'positivity' is a noun and does not match the verb pattern of the list.", "A": "'were staying' shifts the form and breaks the parallel with 'trained' and 'listened.'"}}, {"id": "u4-l2-f4-05", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "To improve the design, ______ tested three prototypes before choosing one.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "there was a plan that", "B": "the design", "C": "it was decided that", "D": "the engineers"}, "correct": "D", "choice_families": {"B": "Modifier ve paralellik", "C": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The opening infinitive phrase 'To improve the design' must describe the ones acting; the engineers did the testing, so they are the correct subject.", "why_wrong": {"B": "'the design' cannot be the one testing prototypes to improve itself.", "C": "'it was decided that' names no agent for the modifier.", "A": "'there was a plan that' leaves the modifier without an actor."}}, {"id": "u4-l2-f4-06", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "The new library is praised for being bright, spacious, and ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "quiet", "B": "it has quiet spaces", "C": "having quiet", "D": "quietness"}, "correct": "A", "choice_families": {"B": "Modifier ve paralellik", "C": "Modifier ve paralellik", "D": "Modifier ve paralellik"}, "why_correct": "The list uses adjectives ('bright, spacious'), so the parallel adjective 'quiet' keeps the structure consistent.", "why_wrong": {"B": "'it has quiet spaces' is a clause and breaks the parallel adjective pattern.", "C": "'having quiet' is a phrase that does not match the adjectives.", "D": "'quietness' is a noun and does not match the adjective pattern."}}, {"id": "u4-l2-f4-07", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "Ripe and heavy on the branch, ______ finally picked the apples.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "the basket", "B": "the farmer", "C": "it was time to have", "D": "there came a moment when someone"}, "correct": "B", "choice_families": {"C": "Modifier ve paralellik", "D": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The modifier 'Ripe and heavy on the branch' describes the apples, so the sentence must place the apples logically; only 'the farmer ... picked the apples' keeps the apples as what is ripe, avoiding a dangling modifier.", "why_wrong": {"C": "'it was time to have' leaves the modifier without a proper noun to describe.", "D": "'there came a moment when someone' buries the actor and mismatches the modifier.", "A": "'the basket' cannot be ripe and heavy on the branch."}}, {"id": "u4-l2-f4-08", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "The scholarship rewards students who show curiosity, who work hard, and ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "they help others", "B": "helping others", "C": "who help others", "D": "to help others"}, "correct": "C", "choice_families": {"B": "Modifier ve paralellik", "D": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The list uses 'who' clauses ('who show, who work'), so the parallel 'who help others' keeps the structure consistent.", "why_wrong": {"B": "'helping others' breaks the parallel 'who' clause pattern.", "D": "'to help others' is an infinitive and does not match the 'who' clauses.", "A": "'they help others' is an independent clause that breaks the pattern."}}, {"id": "u4-l2-f4-09", "unit": 4, "lesson": 2, "lesson_name": "Form, Structure, and Sense", "target_family": "Modifier ve paralellik", "passage": "Written in a single week, ______ still became the author's most beloved book.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": {"A": "it was a week that", "B": "the author", "C": "readers everywhere", "D": "the novel"}, "correct": "D", "choice_families": {"B": "Modifier ve paralellik", "C": "Modifier ve paralellik", "A": "Modifier ve paralellik"}, "why_correct": "The modifier 'Written in a single week' must describe what was written; the novel was written, so it is the correct subject.", "why_wrong": {"B": "'the author' was not written in a week, so the modifier dangles.", "C": "'readers everywhere' were not written, s const TEST_N=27;

function buildTest(){

  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);

    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
