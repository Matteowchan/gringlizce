yers in most countries.","B":"contribute to greater job satisfaction for some employees.","C":"lower the satisfaction of employees who use them."},"stem":"Which choice most logically completes the text?","correct":"B","unit":1,"passage":"A survey found that employees allowed to set their own start times reported higher job satisfaction than those on fixed schedules, though many other factors also shaped satisfaction. The finding suggests that flexible start times can ______","lesson":4,"id":"u1-l4-f1-06","lesson_name":"Inferences","why_correct":"Flexibility was linked to higher satisfaction among many factors, so it can contribute to satisfaction for some, the warranted inference.","choice_families":{"C":"Yön doğru derece yanlış","D":"Metnin dışına çıkma","A":"Çok güçlü"},"why_wrong":{"C":"Flexibility was tied to higher, not lower, satisfaction; this reverses the direction.","A":"Single-handedly determining satisfaction ignores the many other factors the passage names.","D":"Legal requirements are not mentioned; that goes outside the passage."}},{"lesson_name":"Inferences","why_correct":"Sheltered, lower-force sections held more variety, so reduced water force may help support greater diversity, the warranted inference.","why_wrong":{"B":"Being the sole cause of all diversity everywhere far overstates a single reef survey.","A":"Shelter was linked to more, not less, diversity; this reverses the direction.","D":"The passage implies currents do shape reefs, so claiming no role contradicts it."},"choice_families":{"B":"Çok güçlü","D":"Öncül sonuç karışıklığı","A":"Yön doğru derece yanlış"},"target_family":"Çok güçlü","choices":{"C":"help support a greater diversity of coral.","B":"be the sole cause of all coral diversity everywhere.","A":"reduce the diversity of coral in sheltered areas.","D":"prove that currents play no role in shaping reefs."},"stem":"Which choice most logically completes the text?","passage":"Divers surveying a reef found that sections sheltered from strong currents held a greater variety of coral than exposed sections did. Because sheltered coral is less likely to be broken apart by water movement, the survey suggests that reduced water force may ______","correct":"C","unit":1,"id":"u1-l4-f1-07","lesson":4},{"stem":"Which choice most logically completes the text?","choices":{"C":"narrowed to fewer and fewer homes over the century.","B":"became universal across every household in the town.","D":"widened beyond the wealthiest households over time.","A":"was made possible by a new sea route the town discovered."},"target_family":"Çok güçlü","lesson":4,"id":"u1-l4-f1-08","correct":"D","unit":1,"passage":"A historian examining household inventories from a port town found that imported spices, once listed only in the wealthiest homes, gradually appeared in more modest households over the century. The record suggests that access to such spices ______","lesson_name":"Inferences","choice_families":{"C":"Yön doğru derece yanlış","B":"Çok güçlü","A":"Metnin dışına çıkma"},"why_wrong":{"A":"A newly discovered sea route is not mentioned; that goes outside the passage.","B":"Universal access in every household overstates a gradual spread to more modest homes.","C":"Access broadened rather than narrowed; this reverses the trend."},"why_correct":"Spices spread from the wealthiest to more modest homes, so access widened beyond the wealthy, the warranted inference."},{"unit":1,"correct":"A","passage":"In trials, a robotic arm guided by a new control system completed assembly tasks with fewer errors than one using the older system, though it worked at about the same speed. The trials suggest that the new system offers an advantage mainly in ______","lesson":4,"id":"u1-l4-f1-09","target_family":"Çok güçlü","stem":"Which choice most logically completes the text?","choices":{"A":"accuracy rather than speed.","D":"reducing the cost of manufacturing the arm.","B":"every possible measure of performance at once.","C":"speed rather than accuracy."},"why_correct":"The new system cut errors at similar speed, so its advantage lies mainly in accuracy, not speed, the warranted inference.","choice_families":{"B":"Çok güçlü","C":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma"},"why_wrong":{"C":"The gain was in accuracy, not speed, which was unchanged; this reverses the finding.","B":"An advantage in every measure at once overstates a gain confined to accuracy.","D":"Manufacturing cost is not discussed; that goes outside the passage."},"lesson_name":"Inferences"},{"target_family":"Çok güçlü","stem":"Which choice most logically completes the text?","choices":{"A":"permanently eliminate all fish from the entire lake.","D":"be prevented only by removing fish from the lake.","B":"contribute to lower oxygen and fewer fish in deep water.","C":"raise oxygen levels in the lake's deep water."},"correct":"B","unit":1,"passage":"A study of a lake found that in years when a certain algae bloomed heavily, oxygen levels in the deep water dropped and fish were scarcer there. Because the decaying algae consumed oxygen as they sank, the pattern suggests that heavy algal blooms can ______","lesson":4,"id":"u1-l4-f1-10","lesson_name":"Inferences","why_correct":"Heavy blooms coincided with lower deep-water oxygen and fewer fish, and the mechanism is given, so blooms can contribute to that outcome, the warranted inference.","choice_families":{"A":"Çok güçlü","D":"Metnin dışına çıkma","C":"Yön doğru derece yanlış"},"why_wrong":{"C":"Blooms lowered oxygen, so raising it reverses the finding.","A":"Permanently eliminating all fish from the whole lake far overstates a seasonal, deep-water effect.","D":"Removing fish as the only prevention is not supported by the text."}},{"lesson_name":"Inferences","why_correct":"The researchers' proposal is that verbalizing forces organization of thought, so speaking aids solving by clarifying one's thoughts, the warranted inference.","choice_families":{"A":"Metnin dışına çıkma","D":"Yön doğru derece yanlış","C":"Çok güçlü"},"why_wrong":{"C":"That speaking replaces careful reasoning goes far beyond and against the proposal.","D":"The passage links speaking to better solving, not reduced focus; this reverses it.","A":"Raising overall verbal intelligence is a broader claim the passage never makes."},"target_family":"Metnin dışına çıkma","stem":"Which choice most logically completes the text?","choices":{"D":"making the person less able to focus on the task.","A":"improving the person's overall verbal intelligence.","C":"replacing the need for any careful reasoning.","B":"prompting a clearer arrangement of one's thoughts."},"correct":"B","unit":1,"passage":"A study found that people who spent a few minutes describing a problem aloud, even to no one, solved it more often than those who worked silently. The researchers proposed that putting thoughts into words forces a person to organize them. If so, then speaking through a problem may aid its solution by ______","lesson":4,"id":"u1-l4-f2-01"},{"passage":"Farmers who left strips of wildflowers along the edges of their fields reported fewer pest outbreaks than neighbors who did not. Researchers noted that the flowers attracted insects that prey on crop pests. The finding suggests that the flower strips reduced pests by ______","why_correct":"The passage says the flowers drew insects that prey on pests, so the strips reduced pests by supporting those predators, the warranted inference.","correct":"C","unit":1,"id":"u1-l4-f2-02","why_wrong":{"B":"Enriching the soil is a mechanism the passage never mentions.","A":"Blocking sunlight is not supported anywhere in the text.","D":"A poisonous chemical is not mentioned; the stated mechanism is predatory insects."},"lesson":4,"choice_families":{"B":"Metnin dışına çıkma","A":"Metnin dışına çıkma","D":"Metnin dışına çıkma"},"target_family":"Metnin dışına çıkma","lesson_name":"Inferences","stem":"Which choice most logically completes the text?","choices":{"A":"blocking sunlight that the pests require.","D":"releasing a chemical that poisons the pests directly.","C":"supporting predators that feed on the pests.","B":"enriching the soil with additional nutrients."}},{"why_wrong":{"C":"Removing labels altogether goes against the finding that good labels held attention.","B":"Who writes the labels is never discussed; that goes outside the passage.","A":"Translation into many languages is not addressed in the text."},"choice_families":{"A":"Metnin dışına çıkma","B":"Metnin dışına çıkma","C":"Çok güçlü"},"why_correct":"Visitors lingered at concise, accessible labels, so labels should be clear and brief to hold attention, the warranted inference.","lesson_name":"Inferences","id":"u1-l4-f2-03","lesson":4,"passage":"A museum found that visitors spent longer at exhibits accompanied by a short, plainly written label than at those with long, technical labels. The curators concluded that concise, accessible text held visitors' attention. It follows that, to keep visitors engaged, exhibit labels should generally be ______","correct":"D","unit":1,"choices":{"D":"clear and brief rather than long and technical.","A":"translated into as many languages as possible.","B":"written by the most senior curator on staff.","C":"removed from the exhibits altogether."},"stem":"Which choice most logically completes the text?","target_family":"Metnin dışına çıkma"},{"lesson":4,"id":"u1-l4-f2-04","unit":1,"correct":"A","passage":"Observers noted that a species of ant, when its usual trail was blocked, quickly formed a new trail along the shortest available detour. Because the ants lay down and follow chemical trails, this ability suggests that the colony can ______","stem":"Which choice most logically completes the text?","choices":{"D":"survive without any food for extended periods.","A":"adjust its routes in response to obstacles.","C":"remember the layout of its entire territory for years.","B":"communicate using sounds inaudible to humans."},"target_family":"Metnin dışına çıkma","choice_families":{"D":"Metnin dışına çıkma","C":"Metnin dışına çıkma","B":"Metnin dışına çıkma"},"why_wrong":{"C":"Long-term memory of the whole territory goes beyond what the observation shows.","B":"Sound communication is not mentioned; the passage describes chemical trails.","D":"Surviving without food is unrelated to the rerouting described."},"why_correct":"The ants rerouted around a block via the shortest detour, so the colony can adjust routes in response to obstacles, the warranted inference.","lesson_name":"Inferences"},{"why_wrong":{"D":"Storage safety is unrelated to the flavor-perception finding.","A":"The soup was identical, so the salt amount did not change; only perception did.","C":"Nutritional value is never discussed in the passage."},"choice_families":{"A":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma","C":"Metnin dışına çıkma"},"why_correct":"Identical soup tasted saltier when warm, so temperature can influence how strongly flavors are perceived, the warranted inference.","lesson_name":"Inferences","id":"u1-l4-f2-05","lesson":4,"passage":"In a taste test, participants rated a soup as saltier when it was served warm than when the identical soup was served cool. Because warmth is known to heighten the perception of certain flavors, the result suggests that a food's temperature can ______","unit":1,"correct":"B","choices":{"C":"determine how nutritious the food is overall.","B":"influence how strongly its flavors are perceived.","A":"change the actual amount of salt the food contains.","D":"affect how long the food can be safely stored."},"stem":"Which choice most logically completes the text?","target_family":"Metnin dışına çıkma"},{"why_wrong":{"B":"Advanced instruments are not mentioned; the passage cites daily watching.","D":"Length of family residence is not discussed in the passage.","A":"Formal meteorology training appears nowhere in the text."},"id":"u1-l4-f2-06","lesson":4,"choice_families":{"B":"Metnin dışına çıkma","D":"Metnin dışına çıkma","A":"Metnin dışına çıkma"},"passage":"A study of a coastal town found that residents who lived within sight of the harbor could more accurately estimate the day's weather than those living inland. The researchers noted that harbor residents watched the sky and sea daily. The result suggests that their accuracy came from ______","unit":1,"correct":"C","why_correct":"Harbor residents watched sky and sea daily, so their accuracy came from regular firsthand observation, the warranted inference.","choices":{"A":"formal training in meteorology at the harbor.","D":"a longer history of family residence in the town.","B":"access to more advanced forecasting instruments.","C":"regular firsthand observation of local conditions."},"stem":"Which choice most logically completes the text?","lesson_name":"Inferences","target_family":"Metnin dışına çıkma"},{"target_family":"Metnin dışına çıkma","stem":"Which choice most logically completes the text?","choices":{"B":"make the helmet significantly lighter to wear.","C":"extend the number of years the helmet can be used.","D":"reduce the force concentrated at the point of impact.","A":"lower the cost of manufacturing the helmet."},"passage":"Engineers testing a bicycle helmet found that a new inner layer spread the force of an impact over a wider area of the shell than the old layer did. Since a force spread over a wider area presses less hard on any one point, the new layer should ______","correct":"D","unit":1,"id":"u1-l4-f2-07","lesson":4,"lesson_name":"Inferences","why_correct":"Spreading force over a wider area lowers pressure at any point, so the new layer should reduce force concentrated at the impact point, the warranted inference.","why_wrong":{"A":"Manufacturing cost is unrelated to the force-spreading finding.","C":"The helmet's lifespan is not mentioned in the text.","B":"Weight is not discussed; the passage concerns force distribution."},"choice_families":{"B":"Metnin dışına çıkma","C":"Metnin dışına çıkma","A":"Metnin dışına çıkma"}},{"why_correct":"The proposal is that coherent sequence helps readers connect events, so order aids memory by linking events into a whole, the warranted inference.","choice_families":{"D":"Metnin dışına çıkma","C":"Metnin dışına çıkma","B":"Metnin dışına çıkma"},"why_wrong":{"D":"Reading time is not mentioned in the passage.","C":"Ease of pronunciation is unrelated to narrative order.","B":"Word count absorbed is not what the passage addresses."},"lesson_name":"Inferences","correct":"A","unit":1,"passage":"A researcher found that readers recalled the plot of a story better when its chapters were read in order than when the same chapters were shuffled. She proposed that a coherent sequence helps readers build connections between events. If so, then narrative order aids memory by ______","lesson":4,"id":"u1-l4-f2-08","target_family":"Metnin dışına çıkma","stem":"Which choice most logically completes the text?","choices":{"C":"making the individual sentences easier to pronounce.","B":"increasing the total number of words readers absorb.","A":"helping readers link events into a connected whole.","D":"reducing the time it takes to finish the story."}},{"choice_families":{"C":"Metnin dışına çıkma","D":"Metnin dışına çıkma","A":"Metnin dışına çıkma"},"why_wrong":{"C":"The number of exercises assigned is not addressed.","D":"Therapists' fees are unrelated to the follow-through finding.","A":"How long each exercise takes is not discussed in the passage."},"why_correct":"Understanding the purpose raised follow-through, so explaining the rationale may improve how consistently patients perform exercises, the warranted inference.","lesson_name":"Inferences","lesson":4,"id":"u1-l4-f2-09","unit":1,"correct":"B","passage":"A study found that patients who understood the reasons behind their prescribed exercises completed them more consistently than patients simply told to do them. The physical therapists concluded that understanding the purpose increased follow-through. It follows that explaining the rationale for an exercise may ______","stem":"Which choice most logically completes the text?","choices":{"D":"lower the fees the therapists are able to charge.","A":"shorten the time each exercise takes to complete.","C":"reduce the number of exercises a patient is given.","B":"improve how consistently patients perform it."},"target_family":"Metnin dışına çıkma"},{"target_family":"Metnin dışına çıkma","lesson_name":"Inferences","choices":{"C":"giving hikers a clearer sense of their location.","B":"making the physical hike less tiring to complete.","D":"improving the hikers' overall physical fitness.","A":"guaranteeing that hikers never take a wrong turn."},"stem":"Which choice most logically completes the text?","passage":"A survey of hikers found that those carrying detailed trail maps reported feeling less anxious on unfamiliar routes than those without them. The researchers suggested that a sense of knowing where one is eases worry. If so, then carrying a map may reduce anxiety chiefly by ______","why_correct":"The suggestion is that knowing one's location eases worry, so a map reduces anxiety chiefly by clarifying location, the warranted inference.","correct":"C","unit":1,"why_wrong":{"D":"Physical fitness is unrelated to the anxiety finding.","A":"Guaranteeing no wrong turns overstates and goes beyond the text.","B":"Physical tiredness is not what the passage addresses."},"id":"u1-l4-f2-10","choice_families":{"B":"Metnin dışına çıkma","A":"Çok güçlü","D":"Metnin dışına çıkma"},"lesson":4},{"choices":{"C":"universal, though attendance alone did not ensure a high score.","B":"the direct cause of every high score on the final, guaranteeing a top mark for anyone who simply showed up to the optional review sessions.","A":"rare, with few high scorers having attended.","D":"irrelevant to how students performed on the final."},"stem":"Which choice most logically completes the text?","target_family":"Öncül sonuç karışıklığı","id":"u1-l4-f3-01","lesson":4,"passage":"A study found that every student who scored above 90 on the final had attended the optional review sessions. It does not follow that attendance guaranteed a high score, since many students who attended the sessions scored below 90. The data show only that, among high scorers, attendance was ______","unit":1,"correct":"C","lesson_name":"Inferences","why_wrong":{"A":"All high scorers attended, so calling attendance rare among them contradicts the data.","D":"The passage does not show attendance was irrelevant; high scorers all attended.","B":"Treating attendance as the direct cause that guaranteed a high score reverses the logic, since many who attended still scored below 90."},"choice_families":{"D":"Metnin dışına çıkma","A":"Yön doğru derece yanlış","B":"Öncül sonuç karışıklığı"},"why_correct":"All high scorers attended, but many attendees scored low, so attendance was universal among high scorers without ensuring high scores, the careful inference."},{"lesson_name":"Inferences","choice_families":{"A":"Metnin dışına çıkma","C":"Yön doğru derece yanlış","B":"Öncül sonuç karışıklığı"},"why_wrong":{"A":"Low flow accompanied drought, not its ending; that goes outside the text.","B":"Calling low flow the cause of drought reverses the direction the passage states.","C":"The two are clearly linked, so calling them unrelated contradicts the passage."},"why_correct":"The passage has droughts reducing flow, so low flow was a consequence of drought, not its cause, the correct inference.","choices":{"D":"a consequence of the drought rather than its cause.","A":"a sign that droughts had ended in the region.","B":"the underlying cause of each severe drought.","C":"unrelated to the droughts in those years."},"stem":"Which choice most logically completes the text?","target_family":"Öncül sonuç karışıklığı","lesson":4,"id":"u1-l4-f3-02","correct":"D","unit":1,"passage":"In a region, every year with a severe drought was also a year of low river flow. A student concluded that low river flow must cause droughts. But the passage describes droughts reducing river flow, not the reverse, so the correct reading is that the low flow was ______"},{"target_family":"Öncül sonuç karışıklığı","stem":"Which choice most logically completes the text?","choices":{"B":"have no connection to each other whatsoever.","C":"proof beyond doubt that the vigorous singing directly triggers the nest-building that regularly follows it.","D":"occur at completely random and unrelated times.","A":"tend to occur in sequence, without showing that one causes the other."},"correct":"A","unit":1,"passage":"Researchers observed that a bird species sings most vigorously just before it begins building a nest. One might suppose that vigorous singing prompts nest-building, but the passage presents the singing merely as something that precedes it. The data establish only that the two behaviors ______","lesson":4,"id":"u1-l4-f3-03","lesson_name":"Inferences","why_correct":"The passage shows singing preceding nest-building without a causal link, so the two occur in sequence without established causation, the careful inference.","choice_families":{"C":"Öncül sonuç karışıklığı","B":"Yön doğru derece yanlış","D":"Metnin dışına çıkma"},"why_wrong":{"C":"Claiming the singing directly triggers nest-building asserts a causal link the passage, which presents singing as merely preceding it, does not establish.","B":"They occur in a regular sequence, so 'no connection whatsoever' understates the link.","D":"The behaviors occur in a consistent order, not at random times."}},{"lesson_name":"Inferences","choice_families":{"D":"Yön doğru derece yanlış","A":"Yön doğru derece yanlış","C":"Öncül sonuç karışıklığı"},"why_wrong":{"C":"Claiming coffee shops raise rents asserts a cause the report declines to establish.","A":"They move together, so calling them entirely independent understates the link.","D":"The passage does not show high rents blocking coffee shops; that reverses the picture."},"why_correct":"The report ties both to a common cause, so the data show association without one producing the other, the careful inference.","stem":"Which choice most logically completes the text?","choices":{"C":"prove that opening coffee shops raises local rents.","B":"are associated, without establishing that one produces the other.","D":"show that high rents prevent coffee shops from opening.","A":"are entirely independent of each other."},"target_family":"Öncül sonuç karışıklığı","lesson":4,"id":"u1-l4-f3-04","unit":1,"correct":"B","passage":"A report notes that neighborhoods with more coffee shops also tend to have higher rents. A reader might infer that coffee shops drive rents up, yet the report suggests both may simply follow from an area's growing popularity. The data alone show that the two ______"},{"lesson_name":"Inferences","why_wrong":{"A":"The records grew more frequent, so claiming none were kept contradicts the passage.","D":"The passage does not say shortages had no effect; that goes beyond the text.","B":"Treating scarcity as certainly the cause reads far more into the growing records than they establish, since the rise may reflect better record-keeping."},"choice_families":{"B":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma","A":"Yön doğru derece yanlış"},"why_correct":"More frequent reports could reflect better record-keeping, so the evidence shows reports rose, not necessarily shortages, the careful inference.","choices":{"B":"certain proof that food scarcity was the main cause of the decline the kingdom suffered in its final decades.","C":"reports of shortages increased, which need not mean shortages themselves did.","D":"grain shortages had no effect on the kingdom at all.","A":"the kingdom kept no records in its final decades."},"stem":"Which choice most logically completes the text?","target_family":"Öncül sonuç karışıklığı","id":"u1-l4-f3-05","lesson":4,"passage":"A historian notes that a kingdom's records of grain shortages grew more frequent in its final decades. It is tempting to read this as proof that food scarcity caused the kingdom's decline, but more frequent records might instead reflect better record-keeping. The evidence by itself shows only that ______","unit":1,"correct":"C"},{"passage":"A study found that children who slept more also tended to perform better in school. A newspaper reported that sleep boosts grades, but the study noted that better-organized households might produce both more sleep and better grades. The findings alone establish that sleep and performance ______","unit":1,"correct":"D","id":"u1-l4-f3-06","lesson":4,"target_family":"Öncül sonuç karışıklığı","choices":{"B":"had nothing to do with each other.","C":"conclusive proof that getting more sleep is what causes children to earn the better grades they receive.","D":"were linked, without proving that sleep itself raised performance.","A":"show that good grades cause children to sleep less."},"stem":"Which choice most logically completes the text?","why_correct":"A possible common cause means the data show a link, not that sleep raised performance, the careful inference.","why_wrong":{"A":"The passage does not show grades reducing sleep; that reverses and distorts the finding.","B":"They were linked, so 'nothing to do with each other' understates the association.","C":"Claiming the data conclusively show that sleep causes better grades asserts far more than a correlation shows, given a possible common cause."},"choice_families":{"C":"Öncül sonuç karışıklığı","B":"Yön doğru derece yanlış","A":"Yön doğru derece yanlış"},"lesson_name":"Inferences"},{"lesson_name":"Inferences","choice_families":{"C":"Yön doğru derece yanlış","B":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma"},"why_wrong":{"B":"Singling out the beetle spreading the fungus asserts one unproven explanation as fact.","C":"They occur together, so 'never in the same locations' contradicts the observation.","D":"The passage offers shared damp conditions as one explanation, so claiming they cannot both survive there is wrong."},"why_correct":"With several possible explanations unresolved, the co-occurrence shows only that the two are found together without revealing why, the careful inference.","choices":{"D":"cannot both survive in damp conditions.","A":"are found together, without revealing why.","B":"clearly demonstrate that the beetle spreads the fungus.","C":"are never found in the same locations."},"stem":"Which choice most logically completes the text?","target_family":"Öncül sonuç karışıklığı","lesson":4,"id":"u1-l4-f3-07","correct":"A","unit":1,"passage":"An ecologist observes that wherever a certain beetle is abundant, a particular fungus is also common. She cautions that the beetle may spread the fungus, the fungus may attract the beetle, or both may thrive in the same damp conditions. Until further study, the co-occurrence shows only that the two ______"},{"lesson_name":"Inferences","why_wrong":{"C":"Claiming the meetings make teams punctual asserts the very cause the passage questions, since well-organized teams may do both.","D":"The passage links meetings with punctuality, not their avoidance; this reverses it.","A":"They go together, so 'completely unrelated' understates the link."},"choice_families":{"C":"Öncül sonuç karışıklığı","D":"Yön doğru derece yanlış","A":"Yön doğru derece yanlış"},"why_correct":"A shared cause (good organization) means the data show the two go together, not that meetings cause punctuality, the careful inference.","stem":"Which choice most logically completes the text?","choices":{"D":"show that punctual teams avoid holding meetings.","A":"are completely unrelated to each other.","B":"tend to go together, without showing the meetings are the cause.","C":"clear proof that holding the brief daily meetings is what makes the teams finish their projects punctually."},"target_family":"Öncül sonuç karışıklığı","id":"u1-l4-f3-08","lesson":4,"passage":"A company finds that teams which hold brief daily meetings tend to finish projects on time. A manager concludes the meetings cause the punctuality, but the passage suggests that well-organized teams may both hold such meetings and finish on time. The data establish that the two ______","correct":"B","unit":1},{"lesson_name":"Inferences","target_family":"Öncül sonuç karışıklığı","choices":{"C":"coincided, without settling which, if either, shaped the other.","B":"firm proof that her time by the sea was the true source of the strongest writing of her whole career.","A":"never overlapped in her life.","D":"show her best work was written far from the coast."},"stem":"Which choice most logically completes the text?","passage":"Records show that the years a certain poet published her strongest work were also years she spent by the sea. A biographer warns against concluding the sea inspired her, since she may simply have retreated to the coast once a book was already going well. The record shows only that the two circumstances ______","unit":1,"correct":"C","why_correct":"With the direction of influence unclear, the record shows the two coincided without settling which shaped the other, the careful inference.","why_wrong":{"B":"Declaring the sea the source of her best work asserts an unproven cause, since she may have retreated to the coast only once a book was already going well.","A":"They coincided, so 'never overlapped' contradicts the record.","D":"The strong work coincided with time by the sea, so placing it far from the coast contradicts the passage."},"id":"u1-l4-f3-09","choice_families":{"B":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma","A":"Yön doğru derece yanlış"},"lesson":4},{"why_correct":"A shared trait (conscientiousness) means the data show association, not that the diary sped recovery, the careful inference.","choice_families":{"A":"Yön doğru derece yanlış","C":"Öncül sonuç karışıklığı","B":"Yön doğru derece yanlış"},"why_wrong":{"A":"The passage links diaries with faster recovery, not with discouraging them; this reverses it.","B":"They were associated, so 'no relationship of any kind' understates the link.","C":"Claiming the diary directly heals patients asserts more than a correlation shows, since conscientious patients may both keep diaries and follow treatment closely."},"lesson_name":"Inferences","correct":"D","unit":1,"passage":"A study reports that patients who kept a symptom diary recovered faster than those who did not. A blog claimed that diary-keeping speeds healing, but the study observed that more conscientious patients tend both to keep diaries and to follow treatment closely. The data show that diary-keeping and faster recovery ______","lesson":4,"id":"u1-l4-f3-10","target_family":"Öncül sonuç karışıklığı","choices":{"B":"had no relationship of any kind.","C":"solid proof that the act of keeping a symptom diary is itself what directly heals patients faster.","A":"show that faster recovery discourages diary-keeping.","D":"were associated, without proving the diary itself sped recovery."},"stem":"Which choice most logically completes the text?"},{"choice_families":{"B":"Yön doğru derece yanlış","C":"Yön doğru derece yanlış","A":"Metnin dışına çıkma"},"why_wrong":{"C":"Small amounts did help, so 'not at all' understates the effect.","B":"More was not always better, so 'ever-greater measure' overshoots the finding.","A":"Combining the mineral with several others is a condition the passage never mentions, so it goes outside the text."},"why_correct":"Small amounts helped, larger did not, very large harmed, so the mineral aids growth only in modest amounts, the precise inference.","lesson_name":"Inferences","lesson":4,"id":"u1-l4-f4-01","unit":1,"correct":"D","passage":"A trial found that adding a small amount of a mineral to livestock feed slightly improved the animals' growth, with larger amounts producing no further benefit and very large amounts causing harm. The results suggest that the mineral aids growth ______","stem":"Which choice most logically completes the text?","choices":{"B":"in ever-greater measure the more of it is added.","C":"not at all, at any amount tested.","D":"only in modest amounts, beyond which it stops helping or does harm.","A":"exclusively when it is combined with several other minerals also blended into the same livestock feed."},"target_family":"Yön doğru derece yanlış"},{"target_family":"Yön doğru derece yanlış","choices":{"D":"effective only for students who already speak the language.","A":"more effective than concentrating it into a single long session.","C":"slightly less effective than a single weekly session.","B":"the sole factor that determines whether learning succeeds."},"stem":"Which choice most logically completes the text?","unit":1,"correct":"A","passage":"In a study of a language program, students who practiced fifteen minutes a day made steady progress, while those who crammed for two hours once a week progressed more slowly despite the same total time. The results suggest that, for this kind of learning, spreading practice out is ______","lesson":4,"id":"u1-l4-f4-02","lesson_name":"Inferences","why_correct":"Daily practice beat weekly cramming at equal total time, so spreading practice out is more effective, the precise inference.","choice_families":{"C":"Yön doğru derece yanlış","B":"Çok güçlü","D":"Metnin dışına çıkma"},"why_wrong":{"C":"Spreading practice was more effective, not slightly less; this reverses the degree.","B":"Being the sole factor overstates a comparison of two schedules.","D":"Prior knowledge of the language is not addressed in the passage."}},{"choice_families":{"A":"Yön doğru derece yanlış","D":"Yön doğru derece yanlış","C":"Yön doğru derece yanlış"},"why_wrong":{"A":"Material as far above as possible caused frustration and little gain, so this overshoots.","D":"Material identical in difficulty offers no challenge, missing the point of the finding.","C":"Material below their level was not what produced gains; this undershoots the challenge."},"why_correct":"Moderate challenge helped but far-above material did not, so material helps most when somewhat above the student's level, the precise inference.","lesson_name":"Inferences","lesson":4,"id":"u1-l4-f4-03","correct":"B","unit":1,"passage":"A study found that moderate exposure to a difficult text improved students' reading skills, but texts far above their level left them frustrated and produced little gain. The results suggest that challenging material helps reading most when it is ______","stem":"Which choice most logically completes the text?","choices":{"B":"somewhat above a student's current level, not far beyond it.","C":"kept well below the student's current level.","A":"as far above the student's level as possible.","D":"identical in difficulty to what the student already reads."},"target_family":"Yön doğru derece yanlış"},{"why_correct":"Most shoppers had already switched, so beyond a point higher taxes yield only small further reductions, the precise inference.","why_wrong":{"A":"Higher taxes reduced use further, if slightly, so a rise reverses the direction.","D":"Eliminating every kind of bag entirely far overstates the modest additional effect.","B":"The passage says the additional drop was small, so 'just as sharply as before' overstates it."},"choice_families":{"D":"Çok güçlü","A":"Yön doğru derece yanlış","B":"Yön doğru derece yanlış"},"lesson_name":"Inferences","passage":"Researchers found that a modest tax on plastic bags sharply cut their use, but that raising the tax much higher produced only a small additional drop, since most shoppers had already switched to reusable bags. The results suggest that beyond a certain point, further increases in the tax would ______","correct":"C","unit":1,"id":"u1-l4-f4-04","lesson":4,"target_family":"Yön doğru derece yanlış","choices":{"C":"yield only small additional reductions in bag use.","B":"continue to cut bag use just as sharply as before.","A":"cause bag use to rise again among shoppers.","D":"eliminate the use of every kind of bag entirely."},"stem":"Which choice most logically completes the text?"},{"stem":"Which choice most logically completes the text?","choices":{"D":"nearly as effective as a near-total ban but far less costly.","A":"effective only if paired with a complete ban.","C":"harmful to the recovery of the fish stocks.","B":"far less effective than a near-total ban in every respect."},"target_family":"Yön doğru derece yanlış","lesson_name":"Inferences","lesson":4,"choice_families":{"A":"Çok güçlü","C":"Yön doğru derece yanlış","B":"Yön doğru derece yanlış"},"id":"u1-l4-f4-05","why_wrong":{"B":"The ban was only slightly faster, so 'far less effective in every respect' overstates the gap.","C":"The moderate limit did allow recovery, so calling it harmful reverses the finding.","A":"The passage shows the moderate limit working on its own, so requiring a complete ban misstates it."},"correct":"D","why_correct":"A moderate limit gave recovery nearly matching the ban at far lower cost, so it was nearly as effective but far less costly, the precise inference.","unit":1,"passage":"A study of a coastal fishery found that limiting the catch modestly allowed fish stocks to recover over several years, while a near-total ban produced only slightly faster recovery at a far greater cost to the fishing community. The results suggest that a moderate limit was ______"},{"choices":{"D":"solely during the winter months of the year.","A":"to a modest degree without harming performance.","B":"by any amount at all with no effect on performance.","C":"only if performance is allowed to suffer sharply."},"stem":"Which choice most logically completes the text?","target_family":"Yön doğru derece yanlış","id":"u1-l4-f4-06","lesson":4,"passage":"In a trial, dimming office lights slightly in the afternoon left workers' performance unchanged while cutting energy use, but dimming them heavily caused errors to rise. The results suggest that lighting can be reduced ______","correct":"A","unit":1,"lesson_name":"Inferences","why_wrong":{"C":"Modest dimming did not hurt performance, so requiring performance to suffer reverses it.","B":"Heavy dimming did raise errors, so 'any amount with no effect' overshoots the finding.","D":"Seasonality is not mentioned; that goes outside the passage."},"choice_families":{"C":"Yön doğru derece yanlış","B":"Yön doğru derece yanlış","D":"Metnin dışına çıkma"},"why_correct":"Slight dimming left performance unchanged while heavy dimming raised errors, so lighting can be cut modestly without harm, the precise inference."},{"lesson_name":"Inferences","why_correct":"A few targeted corrections helped while flooding did not, so feedback helps most when selective, the precise inference.","why_wrong":{"D":"Who gives the feedback is not addressed in the passage.","A":"Exhaustive feedback discouraged learners, so 'as exhaustive as possible' overshoots.","C":"Some feedback helped, so withholding it entirely undershoots the finding."},"choice_families":{"C":"Yön doğru derece yanlış","D":"Metnin dışına çıkma","A":"Yön doğru derece yanlış"},"target_family":"Yön doğru derece yanlış","choices":{"C":"withheld from learners entirely.","B":"selective rather than exhaustive.","A":"as exhaustive and detailed as possible.","D":"given only by the learners' closest friends."},"stem":"Which choice most logically completes the text?","passage":"A study of feedback found that offering learners a few targeted corrections improved their next attempt, whereas flooding them with corrections on every small error left them discouraged and no better off. The results suggest that feedback aids improvement most when it is ______","correct":"B","unit":1,"id":"u1-l4-f4-07","lesson":4},{"lesson_name":"Inferences","why_correct":"Quiet, simple music helped while loud or complex music disrupted, so music aids focus when quiet and simple but not otherwise, the precise inference.","choice_families":{"A":"Yön doğru derece yanlış","D":"Yön doğru derece yanlış","B":"Yön doğru derece yanlış"},"why_wrong":{"A":"Music helped on simple tasks, not demanding ones, so restricting its benefit to extremely demanding work reverses the condition.","D":"Music did help in some conditions, so 'no circumstances whatsoever' understates it.","B":"Loud or complex music disrupted focus, so 'regardless of loudness' overshoots."},"target_family":"Yön doğru derece yanlış","stem":"Which choice most logically completes the text?","choices":{"A":"only when the task at hand is itself extremely demanding and calls for total, unbroken concentration.","D":"in no circumstances whatsoever.","C":"when it is quiet and simple, but not when it is loud or complex.","B":"regardless of how loud or complex it becomes."},"correct":"C","unit":1,"passage":"Researchers found that a little background music helped people concentrate on simple tasks, but that loud or complex music disrupted concentration, especially on demanding work. The results suggest that music can aid focus ______","lesson":4,"id":"u1-l4-f4-08"},{"target_family":"Yön doğru derece yanlış","stem":"Which choice most logically completes the text?","choices":{"D":"up to a moderate density, beyond which gains taper off.","A":"regardless of how many trees are already present.","C":"only when the street is packed as densely as possible.","B":"without limit, the more trees the better."},"passage":"A study of urban trees found that planting a moderate number along a street noticeably cooled it in summer, but that packing in many more trees cooled it only marginally further while greatly raising maintenance costs. The results suggest that, for cooling, adding trees brings the greatest return ______","correct":"D","unit":1,"id":"u1-l4-f4-09","lesson":4,"lesson_name":"Inferences","why_correct":"Moderate density cooled noticeably while extra trees added little, so returns are greatest up to a moderate density, the precise inference.","why_wrong":{"A":"The effect depends on existing density, so 'regardless of how many' ignores the tapering.","C":"The greatest return came at moderate, not maximum, density; this reverses the point.","B":"Extra trees added only marginal cooling, so 'without limit' overshoots the finding."},"choice_families":{"B":"Yön doğru derece yanlış","C":"Yön doğru derece yanlış","A":"Öncül sonuç karışıklığı"}},{"passage":"In a reading study, pausing briefly to summarize after each section improved comprehension, but stopping to summarize after every sentence broke the flow and lowered it. The results suggest that summarizing aids comprehension when done ______","unit":1,"correct":"A","id":"u1-l4-f4-10","lesson":4,"target_family":"Yön doğru derece yanlış","stem":"Which choice most logically completes the text?","choices":{"D":"by every reader in exactly the same way.","A":"at reasonable intervals rather than after every sentence.","C":"only at the very end of the entire text.","B":"as frequently as could possibly be managed, ideally pausing to summarize after each and every sentence."},"why_correct":"Summarizing by section helped while summarizing every sentence hurt, so it aids comprehension at reasonable intervals, the precise inference.","why_wrong":{"C":"Section-by-section summarizing helped, so waiting only for the end undershoots it.","B":"Summarizing after every sentence lowered comprehension, so doing it as frequently as possible overshoots the finding.","D":"How individual readers summarize is not addressed in the passage."},"choice_families":{"D":"Metnin dışına çıkma","B":"Yön doğru derece yanlış","C":"Yön doğru derece yanlış"},"lesson_name":"Inferences"}],"fam_short":{"Yön doğru derece yanlış":"Derece","Çok güçlü":"Çok güçlü","Metnin dışına çıkma":"Metin dışı","Öncül sonuç karışıklığı":"Öncül-sonuç"},"name":"Inferences","teaching":{"alt_konular_intro":"Inferences soruları çoğunlukla metnin sonunda bir boşlukla gelir ve mantığı tamamlamanı ister. Ortak kural: doğru çıkarım, metnin SÖYLEDİKLERİNDEN kesin biçimde çıkar — bir adım fazlası (aşırı çıkarım) yanlıştır. Alt tipler, metnin boşluğa hangi mantıksal köprüyle bağlandığına göre ayrılır.","kavramsal_temel":["Inferences, metnin AÇIKÇA söylemediği ama mantıken zorunlu kıldığı sonucu bulmanı ister. Boşluk çoğu zaman bir cümlenin sonundadır ve sen metnin verdiği bilgiden en güvenli çıkarımı yaparsın.","Çıkarım tahmin değildir. Doğru cevap metnin bilgisinden MANTIKEN çıkan, başka türlü olamayacak sonuçtur. Metin dışı bilgi, geniş genelleme ya da olası ama zorunlu olmayan sonuç yanlıştır.","En sık tuzak, metinle uyumlu ama metnin garanti etmediği bir sonuca atlamaktır. Seçenek makul gelebilir ama metin onu zorunlu kılmıyorsa doğru değildir. Çıkarımda ölçüt makullük değil, zorunluluktur.","Bu yüzden her seçenek için sor: metin bunu KESİN kılıyor mu, yoksa sadece mümkün mu kılıyor. Sadece mümkün kılanlar çeldiricidir.","Inference (cikarim) sorularinda gorevin, metnin acikca soylemedigi ama verdigi bilgilerden MANTIKSAL OLARAK ZORUNLU biçimde cikan sonucu bulmaktir. Buradaki en kritik ayrim, cikarim ile tahmin arasindadir: tahmin, makul ama kanitla zorlanmayan bir devamdir; cikarim ise metnin verileri dogruysa dogru OLMAK ZORUNDA olan seydir. SAT dogru siki hep bu ikinci kategoriden secer. Bu yuzden her aday sik icin 'metindeki cumleler dogruyken bu sik yanlis olabilir mi?' diye sor; olabiliyorsa o bir cikarim degil, sadece bir olasiliktir ve yanlistir.","Cikarim sorularinda iki kalibi tanimak isini cok kolaylastirir. Birincisi 'kontrollu karsilastirma' kalibidir: metin iki durumu tek bir degisken disinda ayni tutar (ayni kalori, farkli saat gibi) ve sonuc farkini o tek degiskene baglamani ister; dogru cikarim bu izole degiskenin etkisini olculu bicimde ifade eder. Ikincisi 'varligin imasi' kalibidir: bir seyin var olmasi (gizli defter gibi) bir niyeti veya durumu ima eder; dogru cikarim o varligin en dogrudan sonucunu soyler, fazlasini degil. Her iki kalipta da tuzak, ya cok ileri gitmek (fazla guclu cikarim) ya da metnin susdugu bir alana bilgi eklemektir; guvenli yol, verinin izin verdigi en olculu ifadeyi secmektir."],"sik_hatalar":[{"cozum":"Seçenek metinle uyumlu olabilir ama metin onu KESİN kılmıyorsa yanlıştır. Ölçüt zorunluluktur.","hata":"Makul ama zorunlu olmayan sonuca atlamak"},{"hata":"Metin dışı bilgi eklemek","cozum":"Çıkarım sadece metnin verdiği bilgiye dayanmalı. Dışarıdan getirdiğin şey çıkarım değildir."},{"hata":"Çok güçlü genelleme yapmak","cozum":"her zaman, hiçbir zaman, herkes gibi mutlak seçenekler çoğu zaman metnin garanti ettiğinden fazlasını söyler."},{"hata":"Duygu ya da niyet uydurmak","cozum":"Metnin belirtmediği bir duygu ya da niyeti seçeneğe eklersen, o çıkarım değil tahmindir."},{"hata":"Cikarimi tahminle karistirip metinde olmayan bir 'devam hikayesi' uydurmak (orn. sonucta iflas etmis olmali).","cozum":"Kendine 'bu sonuc SADECE verilen cumlelerden zorunlu olarak cikiyor mu?' diye sor; zorunlu degilse, mantikli gorunse bile secme."},{"hata":"Mutlak/asiri kesin ifadeleri (garanti, herkes, asla, kesinlikle) gozden kacirip guclu ama desteksiz siki secmek.","cozum":"Cikarim sorularinda temkinli dil (olabilir, egilimindedir, bagli) genelde daha guvenlidir; siktaki kesinligin metindeki kanit gucuyle eslesip eslesmedigini olc."}],"alt_konular":[{"baslik":"1) Mantıksal tamamlama (logical completion)","kural":"Boşluktan önceki bağlaç (therefore/because/but) çıkarımın yönünü belirler — önce onu oku.","govde":["En sık görülen tiptir: \"...; therefore, researchers concluded that ____.\" Boşluğu, metnin verdiği öncüllerden zorunlu olarak çıkan sonuçla doldurursun.","Yöntem: boşluktan hemen önceki bağlacı yakala (therefore, thus, so, because). Bu bağlaç, boşluğun metinle nasıl bir ilişki kuracağını söyler. 'Therefore' varsa sonuç, 'because' varsa gerekçe beklenir.","Doğru seçenek öncüllerin izin verdiği kadar iddialıdır. 'Kesinlikle', 'her zaman', 'hiçbir' gibi mutlak ifadeler çoğu zaman aşırı çıkarımdır ve elenir."]},{"ornek":"\"Model laboratuvarda başarılıydı; ancak arazi koşullarında ____.\" Doğru çıkarım başarısızlığa/soruna işaret eder, çünkü 'ancak' ters yön ister.","govde":["Bazı metinlerde boşluktan önce bir karşıtlık bağlacı vardır: however, nevertheless, on the other hand. Bu, boşluğun önceki cümleyle TERS yönde bir fikir taşıması gerektiğini söyler.","Öğrenciler bu sinyali kaçırıp önceki cümleyle aynı yönde bir seçenek seçer — klasik tuzak. Karşıtlık bağlacı gördüğün an, beklentini tersine çevir.","Test: seçtiğin çıkarım, karşıtlık bağlacının kurduğu 'ama' ilişkisini gerçekten yaratıyor mu? Yaratmıyorsa yanlış yöndesin."],"baslik":"2) Karşıtlık göstergeleri (however / yet / but)"},{"kural":"İki aday arasında en az varsayım isteyen, metne en sıkı bağlı olan seçeneği seç.","govde":["Inferences'ın altın kuralı: metnin biraz ötesine geçen ama metne dayanmayan hiçbir şeyi ekleme. Doğru cevap çoğu zaman en 'iddiasız', en güvenli görünen seçenektir.","İki seçenek arasında kaldığında, hangisi daha AZ varsayım gerektiriyorsa onu seç. Metinde geçmeyen bir sebep, bir duygu ya da bir gelecek tahmini eklendiği an seçenek çürür.","Kendine sor: 'Bunu iddia etmek için metinde yazan neye dayanıyorum?' Cümleyi gösteremiyorsan, o bir çıkarım değil, bir hayaldir."],"baslik":"3) En güvenli çıkarım (over-inference tuzağı)"}],"top_tips":["Güçlü kelime testi. Şıklarda always, never, all, only, none, impossible, prevents, entirely, exclusively varsa o şıkkı önce şüphelen. SAT'de bu kelimeleri içeren şık onda dokuz yanlıştır. Bu tek kural sana sınavda iki üç soru kazandırır.","Boşluktan önceki cümlede however ya da but varsa çıkarım bir KARŞITLIK taşır. O zaman doğru şık beklentiyle çelişen bir şeyi söyler.","Metin iki grubu karşılaştırıyorsa çıkarım genelde İKİSİ hakkındadır. Sadece bir gruptan bahseden şık eksiktir.","Doğru cevabın fiiline bak. may, can, suggests, is likely to. Bu yumuşak fiiller SAT'ın imzasıdır."],"cozumlu_ornekler":[{"choices":{"A":"will not flower under its current conditions","D":"receives more water than the other plants","C":"should be moved outdoors immediately","B":"is the healthiest plant in the greenhouse"},"stem":"Which choice most logically completes the text?","adimlar":["Metnin verdiği kuralı oku: çiçek açmak için en az altı saat güneş gerekiyor.","Fern sadece üç saat alıyor, yani kurala ulaşmıyor.","Mantıken zorunlu sonuç: fern mevcut koşulda çiçek açamaz. A bunu söyler.","B, C, D metinden çıkmaz. Sağlıklı olması, dışarı taşınması, şu miktarı metinde yok, sadece tahmin."],"sonuc":"Çıkarım metnin kuralından mantıken zorunlu çıkan sonuçtur, makul tahmin değil.","passage":"Every plant in the greenhouse requires at least six hours of direct sunlight each day to flower. The fern in the north corner receives only three hours of direct sunlight. It can therefore be concluded that the fern ______","correct":"A"},{"stem":"Which choice most logically completes the text?","sonuc":"Güvenli çıkarım metnin garanti ettiği sonuçtur. Mümkün ama garanti olmayan seçenekler tuzaktır.","choices":{"B":"disliked all the other paintings","C":"will return every summer from now on","A":"had hoped to see that particular painting","D":"works at the museum"},"correct":"A","passage":"The museum's most valuable painting is displayed only during the summer months. A visitor who came in January was disappointed not to see it. From this it can be inferred that the visitor ______","adimlar":["Metin: ziyaretçi tabloyu göremediği için HAYAL KIRIKLIĞINA uğradı.","Hayal kırıklığı, o tabloyu görmeyi UMDUĞUNU zorunlu kılar.","A tam bunu söyler, metnin bilgisinden doğrudan çıkar.","B, C, D metinden çıkmaz. Diğer tabloları sevmemesi, her yaz gelmesi, müzede çalışması zorunlu değil."]},{"correct":"B","passage":"In a series of trials, a robotic arm was programmed to sort recycling by material. When items were clean and dry, the arm sorted them with near-perfect accuracy. However, when the same items were coated in food residue, the arm frequently misclassified them, apparently because the residue obscured the surface features its sensors relied on. This pattern suggests that the arm's sorting accuracy depends heavily on ______","adimlar":["Verilen desen: temiz-kuru = neredeyse kusursuz; besin artigiyla kapli = sik hata; cunku artik sensor ozelliklerini gizliyor.","Cikarim, dogruluk ile degiskan arasindaki iliskiyi genellemeli.","Tek degisen faktor yuzeyin temizligi oldugundan, dogruluk 'yuzeylerin ne kadar temiz oldugu'na bagli; B bunu soyluyor.","A (sayi), C (hiz) ve D (kutu rengi) metinde hic degismedi veya hic gecmedi; onlara dair veri yok, dolayisiyla gecerli cikarim degiller."],"sonuc":"Tek belirleyici degisken yuzey temizligi oldugundan mantikli cikarim B'dir.","choices":{"D":"the color of the recycling bins used in the trials.","A":"the total number of items it is asked to sort in one trial.","B":"how clean the surfaces of the items are when scanned.","C":"the speed at which the arm is programmed to move."},"stem":"Which choice most logically completes the text?"},{"stem":"Which choice most logically completes the text?","sonuc":"Gizli defterin varligi kasitli gizlemeye isaret ettiginden cikarim C'dir.","choices":{"A":"was the single largest and most profitable trading firm operating anywhere in the region at the time.","D":"eventually went bankrupt because of poor financial management.","B":"kept unusually detailed records compared with rival companies.","C":"was knowingly engaged in trade it wished to keep from the authorities."},"passage":"A historian examining letters from a 1780s trading company found that its ships almost always carried two sets of account books: one recording official cargo and another, kept hidden, listing goods that were never declared to port authorities. The very existence of the second, concealed ledger implies that the company ______","adimlar":["Kanit: iki defter var; biri resmi, biri GIZLI ve limana bildirilmeyen mallari listeliyor.","Cikarim, gizli defterin varliginin ne anlama geldigini soylemeli; niye biri kayitlari saklar?","Gizli tutulmasi ve bildirilmemesi, sirketin otoritelerden GIZLEMEK istedigi bir ticaret yaptigini ima eder; C bunu veriyor.","A (en buyuk firma), B (rakiplere gore detayli kayit) ve D (iflas) metinde kanit yok; gizli defter buyukluk, titizlik ya da iflasi kanitlamaz, sadece kasitli gizlemeyi."],"correct":"C"},{"correct":"A","passage":"A nutrition study tracked two groups of volunteers who ate identical diets, except that one group ate dinner at 6 p.m. and the other at 10 p.m. Although both groups consumed the same total calories, the late-dinner group gained more weight over twelve weeks. The researchers noted that no other lifestyle factors differed between the groups. These results suggest that, for weight change, ______","adimlar":["Kilit kontrol: iki grup AYNI kaloriyi aldi, tek fark yemek saati; gec yiyen daha cok kilo aldi; baska fark yok.","Cikarim, kalori sabitken bile SAATIN etkili olabilecegini soylemeli.","A tam bunu ifade ediyor: toplam kalori sabit tutulsa da ogun zamanlamasi kilo degisiminde onemli olabilir.","B metinle celisiyor (kalori onemsiz demiyor), C uydurma (uyuma sorunu yok), D asiri genelleme ('herkes icin garanti' cok guclu; metin sadece bir egilim gosteriyor)."],"stem":"Which choice most logically completes the text?","choices":{"B":"reducing total calorie intake has no effect on body weight.","C":"volunteers in controlled nutrition studies rarely follow their assigned diets closely enough to matter.","A":"the timing of meals can matter even when total calorie intake is held constant.","D":"eating dinner earlier guarantees rapid weight loss for everyone."},"sonuc":"Kalori sabitken saatin etkisini gosteren tek olculu cikarim A oldugundan cevap A'dir."}],"alt_konular_baslik":"Soru alt tipleri","ne_olculuyor":["Metnin SONUNDA bir boşluk vardır. Boşluğu dolduran şık metnin mantıksal sonucu olmalıdır.","Boşluk neredeyse her zaman bir sonuç işaretçisinden sonra gelir: therefore, thus, this suggests that, it can be concluded that, so.","Çıkarım demek, tahmin demek değildir. Çıkarım, metnin verdiği bilgiden ZORUNLU olarak çıkan şeydir. Metin bunu söylemez ama metin bunu gerektirir."],"celdirici_aileleri":[{"tanim":"Şık mutlak bir iddia kurar. always, never, all, only, prevents, impossible. SAT çıkarımı İHTİYATLIDIR. Doğru cevap genelde may, can, suggests, tend to, is likely to gibi yumuşak fiillerle gelir.","ad":"Çok güçlü"},{"tanim":"Şık makuldür, hatta gerçek hayatta doğrudur, ama metinde onu destekleyen hiçbir şey yoktur. Kendi bilgini kullanma. Metin ne diyorsa o.","ad":"Metnin dışına çıkma"},{"ad":"Öncül sonuç karışıklığı","tanim":"Şık metinde zaten SÖYLENMİŞ bir şeyi tekrar eder. Bu bir çıkarım değil, bir alıntıdır. Çıkarım metnin ÖTESİNE geçer. Metni tekrar eden şık yanlıştır."},{"tanim":"Şıkkın yönü doğrudur ama iddiayı metnin destekleyeceğinden fazla ileri götürür. Metin bir etkiden bahsediyorsa şık o etkinin TEK sebep olduğunu söylüyordur.","ad":"Yön doğru, derece yanlış"},{"ad":"Fazla Guclu Cikarim","tanim":"Metnin verdiginden cok daha kesin bir sonuc uretir (garanti eder, herkes icin gecerli kilar, kesinlikle der). Metin sadece bir egilim gosterirken 'her zaman/garanti' diyen siklari ele; gecerli cikarim verinin izin verdigi kadar temkinlidir."},{"ad":"Kanitsiz Ek Bilgi","tanim":"Metinde hic olcultmeyen bir boyut ekler (orn. firmanin en buyuk olmasi, iflas etmesi). Cikarim yalnizca metindeki kanitlardan turemeli; metnin sessiz kaldigi konularda hukum veren siki reddet."}],"karar_proseduru":["Boşluğun ÖNCESİNDEKİ cümleyi oku ve mantık yönünü bul.  Metin bir karşıtlık mı kuruyor, bir sebep mi veriyor, bir şaşırtıcı bulgu mu sunuyor.","Metnin verdiği bütün olguları say.  Çıkarım genelde İKİ olguyu birleştirir. Sadece birine dayanan şık eksiktir.","Kendi cümleni kur.  Şıklara bakmadan önce boşluğa ne geleceğini kendin yaz. Sonra en yakın şıkkı bul.","Güçlü kelime taraması yap.  always, never, all, only, impossible, prevents, must, exclusively içeren şıkları işaretle. Bunların çoğu yanlıştır."],"strateji":["Metnin verdiği bilgiyi ve varsa kuralı net oku.","Boşluktan önce dur, kendi zorunlu sonucunu tahmin et.","Her seçenek için sor: metin bunu kesin mi kılıyor, yoksa sadece mümkün mu.","Mümkün ama zorunlu olmayanları ele.","Mutlak ve aşırı genel seçenekleri dikkatle test et."]},"no":4,"families":["Çok güçlü","Metnin dışına çıkma","Öncül sonuç karışıklığı","Yön doğru derece yanlış"]}],"unit_title":"SAT Reading & Writing Kampı","unit_accent":"warm"}</script><script>

  saveFamily(unit,lesson,family,status){if(!this.client||!this.userId)return;
    this.client.from('sat_module_progress').upsert({user_id:this.userId,unit,lesson,family,status,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson,family'}).then(()=>{},()=>{});},
  saveState(unit,lesson,seen){if(!this.client||!this.userId)return;

  boot(){this._wait(async()=>{await this.init();const d=await this.load(D.unit);if(!d)return;
    d.fam.forEach(r=>{const i=r.lesson-1;if(S.lp[i]&&(r.family in S.lp[i].family))S.lp[i].family[r.family]=r.status;});

};

function setMode(m){S.phase=m;main.setAttribute('data-mode',m==='test'?'test':m);}
function tableHTML(t){if(!t)return'';
  const head=t.head.map(h=>`<th>${esc(h)}</th>`).join('');

function renderRail(){
  const cur=S.phase;
  const link=(id,label,lock)=>`<a data-action="nav" data-target="${id}" class="${cur===id?'cur':''} ${lp().phaseDone[id]?'ok':''} ${lock?'lock':''}"><span class="dot"></span>${label}${lock?' <span style="margin-left:auto;font-size:10px;opacity:.6">yakinda</span>':''}</a>`;

    const sub=active?`<div class="sub">${link('lesson','Konu anlatimi',false)}${akList}${link('practice','Alistirma',false)}${link('test','Ünite Testi',false)}</div>`:'';

  setMode('lesson');renderRail();const l=curL(),t=l.teaching;

  const secWEX=(t.cozumlu_ornekler&&t.cozumlu_ornekler.length)?`<h2>Çözümlü örnekler</h2><div class="rule"></div>${t.cozumlu_ornekler.map((e,i)=>`<div class="wex"><div class="wex-h">Ornek ${i+1}</div>${e.passage?`<div class="wex-p">${esc(e.passage).replace(/\n/g,"<br>")}</div>`:''}<p class="wex-stem">${esc(e.stem)}</p><div class="wex-opts">${L.map(x=>`<div class="wex-opt${e.correct===x?' ok':''}"><span class="wl">${x}</span><span>${esc(e.choices[x])}</span></div>`).join('')}</div><div class="wex-sol"><div class="wex-sl">Çözüm adımları</div><ol class="steps">${e.adimlar.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="wex-ans"><b>Doğru cevap ${e.correct}.</b> ${esc(e.sonuc||'')}</p></div></div>`).join('')}`:'';
  const secMISS=(t.sik_hatalar&&t.sik_hatalar.length)?`<h2>Sık hatalar</h2><div class="rule"></div>${t.sik_hatalar.map(m=>`<div class="miss"><b>${esc(m.hata)}</b><p style="margin:.4rem 0 0">${esc(m.cozum)}</p></div>`).join('')}`:'';
  const secSTR=(t.strateji&&t.strateji.length)?`<h2>Sınav stratejisi</h2><div class="rule"></div><ol class="steps">${t.strateji.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${l.no} . Konu anlatimi</div>
     <h1>${esc(l.name)}</h1>
     <div class="head-cta"><a class="back-hub" href="ogrenme-haritasi">&lsaquo; SAT modülüne dön</a><button class="next" data-action="start">Alıştırmaya geç &rsaquo;</button></div></div>
   <div class="pad">
   <h2>Ne ölçülüyor</h2><div class="rule"></div>${t.ne_olculuyor.map(x=>`<p>${esc(x)}</p>`).join('')}

   <h2>Karar prosedürü</h2><div class="rule"></div><ol class="steps">${t.karar_proseduru.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   ${secWEX}
   <h2>Çeldirici aileleri</h2><div class="rule"></div>${t.celdirici_aileleri.map(f=>`<div class="trap"><b>${esc(f.ad)}</b><p style="margin:.4rem 0 0">${esc(f.tanim)}</p></div>`).join('')}
   ${secMISS}
   <h2>Top tips</h2><div class="rule"></div><ul class="tips">${t.top_tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   ${secSTR}
   <div class="row"><button class="btn" data-action="start">Alıştırmaya başla</button></div></div>`;

function startPractice(){setMode('practice');S.queue=curL().main_ids.slice();S.idx=0;nextMain();}
function nextMain(){if(S.idx>=S.queue.length){return doneView();}S.remedFor=null;S.remedCount=0;showQ(qById(S.queue[S.idx]),'main');}
function showQ(q,kind){
  S.activeQ=q;S.picked=null;S.locked=false;lp().seen.add(q.id);renderRail();
  const remed=kind==='remed'?`<div class="remedbar">Telafi . hedef tuzak: ${esc(sf(S.remedFor))} . deneme ${S.remedCount}/2</div>`:'';

  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Alıştırma</div><h1>${esc(curL().name)}</h1>
     <button class="backbtn" data-action="nav" data-target="lesson">&lsaquo; Konu anlatımına dön</button></div>

    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>

function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Doğru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlış.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}

function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');

// ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
function startTest(){setMode('test');S.test={q:buildTest(),idx:0,pick:null,rec:[]};showTestQ();}
function showTestQ(){
  const T=S.test,q=T.q[T.idx];T.pick=null;
  main.setAttribute('data-mode','test');railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span><div class="ut">${esc(D.unit_title)}</div><div class="tprog"><div class="tprog-l">Ünite Testi</div><div class="tprog-bar"><div class="tprog-fill" style="width:${Math.round(T.idx/T.q.length*100)}%"></div></div><div class="tprog-n">Soru ${T.idx+1} / ${T.q.length}</div></div></div>`;
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . ${esc(q.lesson_name)}</div><h1>Soru ${T.idx+1}</h1>
     <button class="backbtn" data-action="test-quit">&lsaquo; Testten cik</button></div>
   <div class="pad">
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="test-pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="tnext" data-action="test-next" disabled>${T.idx===T.q.length-1?'Testi bitir':'Sonraki soru'}</button></div></div>`;
  window.scrollTo(0,0);
}
function testPick(x){const T=S.test;T.pick=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('tnext').disabled=false;}
function testNext(){const T=S.test;if(!T.pick)return;const q=T.q[T.idx];T.rec.push({q,picked:T.pick,ok:T.pick===q.correct});T.idx++;if(T.idx>=T.q.length)return testResult();showTestQ();}
function testResult(){
  const T=S.test,rec=T.rec,total=rec.length,score=rec.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  // weak areas by lesson and by family
  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hiçbir tuzak ailesinde zayıflık yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
