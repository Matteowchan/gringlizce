 table to support the claim?", "choices": {"A": "Species A survived at 82 percent, a higher rate than species B's 55 percent.", "B": "Species A survived at a rate of 82 percent after thirty days without any water.", "C": "Species B survived at a higher rate than species A did over the same period.", "D": "Species C survived at a rate of 70 percent after thirty days without any water."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares A with B. Only the choice giving 82 against 55 in the right direction supports it.", "why_wrong": {"B": "Species A's 82 percent alone, with no figure for B, does not show A tolerated drought better.", "C": "This reverses the comparison; species A survived at the higher rate, not B.", "D": "Seventy percent is real but it is species C's, which the claim does not concern."}}, {"id": "u1-l2-f1-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "An economist claims that Region X's exports grew faster than Region Y's from 2015 to 2022.", "table": {"head": ["Region", "2015 (bn USD)", "2022 (bn USD)"], "rows": [["X", "40", "72"], ["Y", "50", "70"], ["Z", "30", "39"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Region Z's exports rose from 30 billion to 39 billion dollars over the same period.", "B": "Region X's exports reached a total of 72 billion dollars by the year 2022.", "C": "Region X's exports rose by 32 billion against Region Y's rise of only 20 billion.", "D": "Region Y's exports grew by a greater amount than Region X's over the period."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim compares X with Y. The 32 billion versus 20 billion gain supports X growing faster.", "why_wrong": { nts after it.", "C": "Enrollment after the launch of the program reached a total of 410 students.", "D": "Staff numbers rose from 15 to 18 over the same period as the new launch."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that enrollment increased. The rise from 320 to 410 after the launch supports it.", "why_wrong": {"A": "This reverses the direction; enrollment rose from 320 to 410, not the reverse.", "C": "A single after-figure gives no before value, so it does not show enrollment increased.", "D": "Staff numbers are real but the claim is about enrollment, not staffing."}}, {"id": "u1-l2-f3-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that a glacier's area shrank between 1990 and 2020.", "table": {"head": ["Item", "1990", "2020"], "rows": [["Glacier area (km2)", "48", "31"], ["Snowfall (mm)", "200", "190"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The glacier shrank from 48 square kilometers in 1990 to 31 square in 2020.", "B": "The glacier covered an area of 31 square kilometers as measured in the year 2020.", "C": "The glacier grew from 31 square kilometers in 1990 to 48 square kilometers in 2020.", "D": "Snowfall fell from 200 to 190 millimeters over the same period from 1990 to 2020."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that the glacier shrank. The fall from 48 to 31 square kilometers supports it.", "why_wrong": {"B": "A single 2020 area gives no 1990 value, so it does not show the glacier shrank.", "C": "This reverses the direction and the years; the glacier shrank from 48 to 31, not the reverse.", "D": "Snowfall is real but the claim is about glacier area, not snowfall."}}, {"id": "u1-l2-f3-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A city reports that transit use rose after fares were lowered.", "table": {"head": ["Item", "Before", "After"], "rows": [["Daily rides (thousands)", "90", "130"], ["Fleet", "40", "42"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The bus fleet grew from 40 to 42 vehicles over the same period as the cut.", "B": "Daily rides after the fare cut reached a level of 130,000 across the city.", "C": "Daily rides rose from 90,000 before the fare cut to 130,000 after it.", "D": "Daily rides fell from 130,000 before the fare cut to 90,000 after it."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim is that transit use rose. The rise from 90,000 to 130,000 after the cut supports it.", "why_wrong": {"A": "Fleet size is real but the claim is about ridership, not the number of vehicles.", "B": "A single after-figure gives no before value, so it does not show transit use rose.", "D": "This reverses the direction; rides rose from 90 to 130, not the reverse."}}, {"id": "u1-l2-f3-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A hospital reports that average wait time fell after a new system was installed.", "table": {"head": ["Item", "Before", "After"], "rows": [["Wait time (min)", "22", "9"], ["Staff on duty", "8", "8"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Average wait fell from 22 minutes before the new system to 9 minutes after it.", "B": "Average wait after the new system settled at a level of 9 minutes per patient.", "C": "Average wait rose from 9 minutes before the new system to 22 minutes after it.", "D": "Staff on duty held steady at 8 people both before and after the new system."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that wait time fell. The drop from 22 to 9 minutes after the system supports it.", "why_wrong": {"B": "A single after-figure gives no before value, so it does not show wait time fell.", "C": "This reverses the direction; wait fell from 22 to 9, not the reverse.", "D": "Staffing is real but the claim is about wait time, not staff numbers."}}, {"id": "u1-l2-f3-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that the bird population grew after a wetland was restored.", "table": {"head": ["Item", "Before", "After"], "rows": [["Bird count", "140", "260"], ["Frog count", "30", "34"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The bird count fell from 260 before the restoration to 140 after it was done.", "B": "The bird count after the restoration reached a total of 260 individual birds.", "C": "The frog count rose from 30 to 34 over the same period as the restoration.", "D": "The bird count rose from 140 before the restoration to 260 after it was done."}, "correct": "D", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim is that the bird population grew. The rise from 140 to 260 after restoration supports it.", "why_wrong": {"A": "This reverses the direction; the bird count rose from 140 to 260, not the reverse.", "B": "A single after-figure gives no before value, so it does not show the population grew.", "C": "The frog count is real but the claim is about birds, not frogs."}}, {"id": "u1-l2-f3-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A school reports that test scores improved after a tutoring program began.", "table": {"head": ["Item", "Before", "After"], "rows": [["Average score", "62", "79"], ["Absences", "12", "10"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Absences fell from 12 to 10 over the same term as the tutoring program.", "B": "The average score rose from 62 before the tutoring to 79 after it began.", "C": "The average score dropped from 79 before the tutoring to 62 after it began.", "D": "The average score after the tutoring settled at a level of 79 points overall."}, "correct": "B", "choice_families": {"A": "Dogru sayi yanlis is", "C": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim is that scores improved. The rise from 62 to 79 after tutoring supports it.", "why_wrong": {"A": "Absences are real but the claim is about scores, not attendance.", "C": "This reverses the direction; the score rose from 62 to 79, not the reverse.", "D": "A single after-figure gives no before value, so it does not show scores improved."}}, {"id": "u1-l2-f3-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that household energy use fell after insulation was added.", "table": {"head": ["Item", "Before", "After"], "rows": [["Energy (kWh/month)", "900", "640"], ["Water (units)", "12", "12"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Water use held steady at 12 units both before and after the insulation was added.", "B": "Energy use rose from 640 kWh before the insulation to 900 kWh after it was added.", "C": "Energy use after the insulation settled at a level of 640 kWh in a month.", "D": "Energy use fell from 900 kWh before the insulation to 640 kWh after it was added."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger"}, "why_correct": "The claim is that energy use fell. The drop from 900 to 640 kWh after insulation supports it.", "why_wrong": {"A": "Water use is real but the claim is about energy, not water.", "B": "This reverses the direction; energy use fell from 900 to 640, not the reverse.", "C": "A single after-figure gives no before value, so it does not show energy use fell."}}, {"id": "u1-l2-f3-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A firm reports that its debt decreased between 2018 and 2023.", "table": {"head": ["Item", "2018 (m USD)", "2023 (m USD)"], "rows": [["Debt", "240", "150"], ["Revenue", "300", "360"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Debt rose from 150 million dollars in 2018 to 240 million dollars in 2023.", "B": "Debt fell from 240 million dollars in 2018 to 150 million dollars in 2023.", "C": "Debt in the year 2023 stood at a recorded level of 150 million dollars.", "D": "Revenue rose from 300 million to 360 million dollars over the same period."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that debt decreased. The fall from 240 to 150 million supports it.", "why_wrong": {"A": "This reverses the direction and years; debt fell from 240 to 150, not the reverse.", "C": "A single 2023 figure gives no 2018 value, so it does not show debt decreased.", "D": "Revenue is real but the claim is about debt, not revenue."}}, {"id": "u1-l2-f3-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yon tersine cevrilmis", "passage": "A study reports that coral cover increased after fishing was banned on a reef.", "table": {"head": ["Item", "Before", "After"], "rows": [["Coral cover (%)", "22", "41"], ["Fish species", "18", "26"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Coral cover rose from 22 percent before the ban to 41 percent after it took effect.", "B": "Coral cover after the ban settled at a recorded level of 41 percent of the reef.", "C": "Coral cover fell from 41 percent before the ban to 22 percent after it took effect.", "D": "The number of fish species rose from 18 to 26 over the same period as the ban."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim is that coral cover increased. The rise from 22 to 41 percent after the ban supports it.", "why_wrong": {"B": "A single after-figure gives no before value, so it does not show coral cover increased.", "C": "This reverses the direction; coral cover rose from 22 to 41, not the reverse.", "D": "Fish species count is real but the claim is about coral cover, not fish."}}, {"id": "u1-l2-f4-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that Store A had higher sales than Store B in 2023.", "table": {"head": ["Store", "2023 sales (k USD)"], "rows": [["A", "480"], ["B", "350"], ["C", "410"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Store C recorded 410,000 dollars in total sales during the 2023 calendar year.", "B": "Store B recorded higher total sales than Store A during the 2023 calendar year.", "C": "Store A recorded 480,000 dollars in sales, more than Store B's 350,000 dollars.", "D": "Store A recorded 480,000 dollars in total sales during the 2023 calendar year."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares A with B. Only the choice giving 480,000 against 350,000 supports A being higher.", "why_wrong": {"A": "Store C's figure is real but the claim concerns A and B, not C.", "B": "This reverses the comparison; Store A had higher sales, not Store B.", "D": "This gives only Store A's figure, with none for B, so it does not show A was higher."}}, {"id": "u1-l2-f4-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A trial claims that the new fertilizer produced a higher yield than the standard one.", "table": {"head": ["Fertilizer", "Yield (t/ha)", "Cost (per ha)"], "rows": [["New", "6.4", "40"], ["Standard", "4.9", "30"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The new fertilizer cost 40 dollars per hectare to apply across the trial fields.", "B": "The standard fertilizer produced a higher yield than the new fertilizer did.", "C": "The new fertilizer yielded 6.4 tons per hectare, more than the standard's 4.9 tons.", "D": "The new fertilizer yielded 6.4 tons per hectare across the fields in the trial."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares the two fertilizers. The 6.4 against 4.9 tons supports the new one yielding more.", "why_wrong": {"A": "Cost is real but the claim is about yield, not cost.", "B": "This reverses the comparison; the new fertilizer yielded more, not the standard.", "D": "This gives only the new fertilizer's yield, with none for the standard, so it shows no comparison."}}, {"id": "u1-l2-f4-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the morning shift completed more tasks than the night shift.", "table": {"head": ["Shift", "Tasks completed"], "rows": [["Morning", "220"], ["Night", "160"], ["Evening", "190"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The morning shift completed 220 tasks, more than the night shift's 160 tasks.", "B": "The night shift completed a greater number of tasks than the morning shift.", "C": "The evening shift completed a total of 190 tasks over the course of the day.", "D": "The morning shift completed a total of 220 tasks over the course of the day."}, "correct": "A", "choice_families": {"B": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares morning with night. The 220 against 160 tasks supports morning completing more.", "why_wrong": {"B": "This reverses the comparison; the morning shift completed more, not the night shift.", "C": "The evening figure is real but the claim concerns morning and night, not evening.", "D": "This gives only the morning figure, with none for night, so it shows no comparison."}}, {"id": "u1-l2-f4-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that in 2022, City A had a larger population than City B.", "table": {"head": ["City", "2022 population (thousands)"], "rows": [["A", "640"], ["B", "520"], ["C", "580"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "City C's population was recorded at 580,000 people in the year 2022.", "B": "City A's population was recorded at 640,000 people in the year 2022.", "C": "City B had a larger population than City A did in the year 2022.", "D": "City A's population was 640,000, larger than City B's population of 520,000."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis"}, "why_correct": "The claim compares A with B. The 640,000 against 520,000 supports A being larger.", "why_wrong": {"A": "City C's figure is real but the claim concerns A and B, not C.", "B": "This gives only City A's figure, with none for B, so it shows no comparison.", "C": "This reverses the comparison; City A was larger, not City B."}}, {"id": "u1-l2-f4-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A trial claims that the treated group had fewer relapses than the control group.", "table": {"head": ["Group", "Relapse (%)", "Dropout (%)"], "rows": [["Treated", "14", "5"], ["Control", "33", "6"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The treated group's relapse rate was 14 percent, lower than the control's 33.", "B": "The control group had fewer relapses than the treated group over the trial.", "C": "The treated group had a relapse rate of 14 percent over the course of the trial.", "D": "The control group had a dropout rate of 6 percent over the course of the trial."}, "correct": "A", "choice_families": {"B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares treated with control. The 14 against 33 percent supports the treated group having fewer.", "why_wrong": {"B": "This reverses the comparison; the treated group had fewer relapses, not the control.", "C": "This gives only the treated group's rate, with none for control, so it shows no comparison.", "D": "The dropout rate is real but the claim is about relapses, not dropouts."}}, {"id": "u1-l2-f4-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the east campus enrolled more students than the west campus.", "table": {"head": ["Campus", "Enrollment"], "rows": [["East", "1800"], ["West", "1300"], ["North", "1500"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The west campus enrolled a greater number of students than the east campus.", "B": "The east campus enrolled 1,800 students, more than the west campus's 1,300.", "C": "The north campus enrolled a total of 1,500 students for the academic year.", "D": "The east campus enrolled a total of 1,800 students for the academic year."}, "correct": "B", "choice_families": {"A": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares east with west. The 1,800 against 1,300 supports east enrolling more.", "why_wrong": {"A": "This reverses the comparison; the east campus enrolled more, not the west.", "C": "The north figure is real but the claim concerns east and west, not north.", "D": "This gives only the east figure, with none for west, so it shows no comparison."}}, {"id": "u1-l2-f4-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A test claims that Model X was more fuel-efficient than Model Y, where higher km/L is better.", "table": {"head": ["Model", "Fuel economy (km/L)"], "rows": [["X", "18"], ["Y", "13"], ["Z", "15"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Model Z achieved a fuel economy of 15 kilometers per liter in the road test.", "B": "Model Y achieved a better fuel economy than Model X did in the road test.", "C": "Model X achieved a fuel economy of 18 kilometers per liter in the road test.", "D": "Model X achieved 18 km per liter, better than Model Y's 13 km per liter."}, "correct": "D", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "C": "Kiyassiz tek deger"}, "why_correct": "The claim compares X with Y. The 18 against 13 km/L supports X being more efficient.", "why_wrong": {"A": "Model Z's figure is real but the claim concerns X and Y, not Z.", "B": "This reverses the comparison; Model X was more efficient, not Model Y.", "C": "This gives only Model X's figure, with none for Y, so it shows no comparison."}}, {"id": "u1-l2-f4-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the winter crop earned more revenue than the summer crop.", "table": {"head": ["Crop", "Revenue (k USD)"], "rows": [["Winter", "210"], ["Summer", "150"], ["Spring", "180"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The spring crop earned a total of 180,000 dollars over the course of the season.", "B": "The summer crop earned a greater amount of revenue than the winter crop did.", "C": "The winter crop earned 210,000 dollars, above the summer crop's 150,000.", "D": "The winter crop earned a total of 210,000 dollars over the course of the season."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Yon tersine cevrilmis", "D": "Kiyassiz tek deger"}, "why_correct": "The claim compares winter with summer. The 210,000 against 150,000 supports winter earning more.", "why_wrong": {"A": "The spring figure is real but the claim concerns winter and summer, not spring.", "B": "This reverses the comparison; the winter crop earned more, not the summer crop.", "D": "This gives only the winter figure, with none for summer, so it shows no comparison."}}, {"id": "u1-l2-f4-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A study claims that Method 1 detected more cases than Method 2.", "table": {"head": ["Method", "Cases detected", "False positives"], "rows": [["Method 1", "340", "12"], ["Method 2", "260", "20"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Method 1 detected a total of 340 cases over the full course of the study.", "B": "Method 1 detected 340 cases, more than the 260 cases detected by Method 2.", "C": "Method 2 produced a total of 20 false positives over the course of the study.", "D": "Method 2 detected a greater number of cases than Method 1 did in the study."}, "correct": "B", "choice_families": {"A": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim compares the two methods. The 340 against 260 cases supports Method 1 detecting more.", "why_wrong": {"A": "This gives only Method 1's count, with none for Method 2, so it shows no comparison.", "C": "The false-positive figure is real but the claim is about cases detected, not false positives.", "D": "This reverses the comparison; Method 1 detected more, not Method 2."}}, {"id": "u1-l2-f4-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kiyassiz tek deger", "passage": "A report claims that the renovated library had more visitors than the unrenovated branch.", "table": {"head": ["Site", "Weekly visitors"], "rows": [["Renovated", "2400"], ["Unrenovated", "1600"], ["Mobile", "900"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The unrenovated branch had a greater number of visitors than the renovated one.", "B": "The renovated library had a total of 2,400 visitors over the course of a week.", "C": "The mobile unit had a total of 900 visitors over the course of a single week.", "D": "The renovated library had 2,400 weekly visitors, more than the branch's 1,600."}, "correct": "D", "choice_families": {"A": "Yon tersine cevrilmis", "B": "Kiyassiz tek deger", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim compares the renovated library with the unrenovated branch. The 2,400 against 1,600 supports it.", "why_wrong": {"A": "This reverses the comparison; the renovated library had more visitors, not the unrenovated branch.", "B": "This gives only the renovated figure, with none for the unrenovated branch, so it shows no comparison.", "C": "The mobile unit's figure is real but the claim concerns the two libraries, not the mobile unit."}}]}, {"no": 3, "name": "Central Ideas and Details", "teaching": {"ne_olculuyor": ["Bu ders iki ayrı soru tipini kapsar ve öğrenciler bunları karıştırır.", "ANA FİKİR sorusu metnin tamamını özetlemeni ister. Cevap metnin herhangi bir cümlesinde tek başına durmaz, metnin bütününden çıkar.", "DETAY sorusu tek bir olguyu sorar. Cevap metinde açıkça yazar. Metni tarar, bulur, işaretlersin.", "Soru köküne bakıp hangisi olduğunu anlamak zorundasın. Yanlış tipe çalışırsan yanlış yerde ararsın."], "karar_proseduru": ["Soru kokunu oku ve tipi belirle.  Main idea mı, detay mı. Bu ikisi farklı okuma gerektirir.", "Detay sorusuysa anahtar kelimeyi bul ve metinde ara.  Anahtar kelime genelde bir özel isim, bir sayı ya da bir terim. Metinde onu bul, etrafındaki cümleyi oku.", "Ana fikir sorusuysa metnin YÖNÜNÜ bul.  Metin bir iddia mı kuruyor, bir yanlışı mı düzeltiyor, iki görüşü mu karşılaştırıyor. Yön bulununca doğru şık kendini gösterir.", "Kendi cümleni kur, sonra şıklara bak.  Şıklardan önce kendi özetini yap. Yoksa ilk makul şık seni yakalar.", "Her şıkkı metne karşı test et.  Sorma: bu doğru mu. Sor: bu METİNDE var mı ve SORULANI cevaplıyor mu."], "celdirici_aileleri": [{"ad": "Çok dar", "tanim": "Metindeki gerçek bir detayı ana fikir diye sunar. Cümle doğru, ama metnin tamamını temsil etmiyor. En sık düşülen tuzak. Öğrenci metinde gördüğü bir cümleyi tanıyıp işaretler."}, {"ad": "Çok geniş", "tanim": "Metnin desteklediği şeyden fazlasını iddia eder. Genelde all, every, always, never kelimeleri taşır. Metin bir türden bahsediyorsa şık bütün türlere genelliyor demektir."}, {"ad": "Doğru ama alakasız", "tanim": "İfade doğrudur, hatta metinle uyumludur, ama SORULAN şey değildir. Bu tuzak için tek savunma soru köküne geri dönmektir."}, {"ad": "Ters ilişki", "tanim": "Metnin kelimelerini kullanır ama sebep ile sonucu, ya da iki tarafı yer değiştirir. Kelimeler tanıdık geldiği için doğru hissettirir. İlişkiyi kontrol et, kelimeleri değil."}], "top_tips": ["But, however, yet, although kelimelerinden SONRA gelen cümle genelde metnin asıl iddiasını taşır. Öncesi hazırlıktır. Ana fikir sorusunda önce oraya bak.", "Detay sorusunda şık metindeki kelimeyi aynen tekrarlıyorsa şüphelen. SAT doğru cevabı PARAFRAZ eder, çeldiriciyi kopyalar.", "İki şık birbirinin tersiyse doğru cevap genelde o ikisinden biridir. Üçüncü ve dördüncü şıkkı önce ele.", "Ana fikir sorusunda şıkkın fiiline bak. It describes, it argues, it contradicts. Fiil metnin yaptığı İŞİ doğru adlandırıyor mu."], "kavramsal_temel": ["Central Ideas and Details, bir metnin ANA fikrini ya da o fikri destekleyen belirli bir AYRINTIYI bulmani ister. Ana fikir sorusu metnin butununu ozetleyen ifadeyi arar, ayrinti sorusu metnin acikca soyledigi belirli bir bilgiyi arar.", "Ana fikir, metnin en genis ve en kapsayici mesajidir. Bir cumlelik bir ayrinti degil, tum paragrafi cati altina alan fikirdir. Dogru cevap metnin bir kismini degil, agirlik merkezini yansitmalidir.", "En sik tuzak, metinde gecen dogru bir ayrintiyi ana fikir sanmaktir. O ayrinti dogrudur ama metnin sadece bir parcasini kapsar, butununu degil. Ana fikir sorusunda cok dar secenek yanlistir.", "Ayrinti sorusunda ise tam tersi risk vardir: metnin genel havasina uyan ama metinde ACIKCA soylenmeyen bir sey secmek. Ayrinti sorusunda cevap metinde birebir dayanagi olan bilgidir."], "cozumlu_ornekler": [{"passage": "Octopuses were long thought to be solitary and unintelligent. Recent research, however, has revealed remarkable abilities: they solve puzzles, use tools, and even appear to recognize individual human handlers. These findings have forced scientists to rethink long-held assumptions about invertebrate intelligence.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "New research on octopuses has overturned old assumptions about how intelligent invertebrates can be.", "B": "Octopuses can solve puzzles when given the chance.", "C": "Octopuses were once thought to be solitary animals.", "D": "Scientists study many kinds of invertebrates."}, "correct": "A", "adimlar": ["Metnin hareketini izle: eski varsayim vardi, yeni arastirma onu degistirdi.", "Ana fikir bu butun hareketi kapsamali: yeni bulgular eski varsayimlari yikiyor.", "A tam bunu soyler, metnin basindan sonuna kadarki mesaji ozetler.", "B ve C dogru ama sadece birer ayrinti, metnin bir parcasi. D metinde yok, cok genel."], "sonuc": "Ana fikir metnin butun hareketini kapsar. Dogru ama dar bir ayrinti ana fikir olamaz."}, {"passage": "The ancient library of Alexandria housed hundreds of thousands of scrolls. Scholars traveled from across the Mediterranean to study there. Its collection was so vast that ships docking at the port were reportedly required to surrender any books on board for copying.", "stem": "According to the text, why did ships surrender books at the port?", "choices": {"A": "so that the books could be copied for the library", "B": "because the scholars demanded payment", "C": "to reduce the weight of the ships", "D": "because books were illegal to own"}, "correct": "A", "adimlar": ["Bu bir ayrinti sorusu: metin ACIKCA ne diyor.", "Ilgili cumleyi bul: gemiler kitaplarini KOPYALANMAK icin teslim ediyordu.", "A birebir metne dayanir. Dogru.", "B, C, D metinde hic gecmez, disaridan uydurulmus makul gorunen secenekler."], "sonuc": "Ayrinti sorusunda cevap metinde birebir dayanagi olan bilgidir, makul tahmin degil."}], "sik_hatalar": [{"hata": "Dogru bir ayrintiyi ana fikir sanmak", "cozum": "Ana fikir sorusunda secenek metnin butununu kapsamali. Tek bir cumleyi ozetleyen secenek cok dardir."}, {"hata": "Ayrinti sorusunda metin disi bilgi secmek", "cozum": "Ayrinti sorusunda cevap metinde acikca yazmali. Genel havaya uyan ama yazilmayan sey yanlistir."}, {"hata": "Cok genis, metni asan secenegi ana fikir sanmak", "cozum": "Ana fikir metni ozetler, metnin otesine gecmez. Cok genel secenek de yanlistir."}, {"hata": "Ilk tanidik kelimeyi goren secenege atlamak", "cozum": "Metindeki kelimeyi tekrarlayan secenek dogru olmayabilir. Anlama bak, kelime eslesmesine degil."}], "strateji": ["Soru ana fikir mi ayrinti mi istiyor, once onu belirle.", "Ana fikir icin metnin butun hareketini tek cumlede ozetle.", "Ayrinti icin ilgili cumleyi metinde bul, birebir dayanak ara.", "Cok dar ya da cok genis secenekleri ele.", "Kelime eslesmesine degil, anlama gore sec."]}, "families": ["Cok dar", "Cok genis", "Dogru ama alakasiz", "Ters iliski"], "fam_short": {"Cok dar": "Cok dar", "Cok genis": "Cok genis", "Dogru ama alakasiz": "Alakasiz", "Ters iliski": "Ters iliski"}, "main_ids": ["u1-l3-f1-01", "u1-l3-f2-01", "u1-l3-f3-01", "u1-l3-f4-01"], "questions": [{"id": "u1-l3-f1-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The mechanical clock reshaped medieval life. Once towns installed public clocks, work, prayer, and markets came to follow fixed hours rather than the loose rhythm of daylight. Merchants scheduled deliveries and guilds set precise workdays. The device did more than measure time; it reorganized how communities lived.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The mechanical clock reorganized medieval daily life around fixed hours.", "B": "Every part of medieval society was completely controlled by the mechanical clock.", "C": "Setting fixed working hours is what led towns to install public mechanical clocks.", "D": "Merchants used the mechanical clock to schedule their deliveries around the town."}, "correct": "A", "choice_families": {"B": "Cok genis", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The text's central point is that the clock reorganized communal life around fixed hours, which this captures.", "why_wrong": {"B": "The text never claims the clock completely controlled every part of society; that overstates it.", "C": "The text says clocks led to fixed hours, not the reverse. The relationship is flipped.", "D": "Scheduling deliveries is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Bees do more than make honey. As they move between flowers gathering nectar, they transfer pollen, letting plants reproduce. Many crops people rely on, from apples to almonds, depend on this pollination. The insect's role in agriculture far outweighs its output of honey.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Bees gather nectar as they move between different flowers.", "B": "All plants on Earth would die at once without bees to pollinate them.", "C": "Plants transfer pollen to bees, allowing the bees themselves to reproduce.", "D": "Bees matter to agriculture chiefly by pollinating the crops people rely on."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Ters iliski"}, "why_correct": "The central point is that bees matter to agriculture mainly through pollination, which this captures.", "why_wrong": {"A": "Gathering nectar is one detail, too narrow to be the main idea.", "B": "The text does not claim all plants would die; that overstates its point.", "C": "The text says bees transfer pollen so plants reproduce, not the reverse. The sides are swapped."}}, {"id": "u1-l3-f1-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The printing press did not simply speed up copying. By making books cheap and plentiful, it let ideas spread across borders faster than authorities could control. Reformers and scientists reached wide audiences, and new ideas took hold in places their authors never visited. The press turned isolated thinkers into movements.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The printing press instantly ended all control over information everywhere.", "B": "By making books cheap, the press let ideas spread and form movements.", "C": "The printing press made books cheaper to produce than before.", "D": "The spread of ideas across borders is what made books cheap and plentiful."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that cheap books let ideas spread and become movements, which this captures.", "why_wrong": {"A": "The text does not claim all control ended instantly and everywhere; that overstates it.", "C": "Cheaper books is one detail, too narrow to be the main idea.", "D": "The text says cheap books caused ideas to spread, not the reverse. The relationship is flipped."}}, {"id": "u1-l3-f1-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Coral reefs support a quarter of all marine species despite covering less than one percent of the ocean floor. Their structures give fish shelter, spawning grounds, and hunting sites. When reefs die, the species that depend on them scatter or vanish. The reef is the foundation of an entire underwater community.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Coral reefs are essential because they sustain a vast marine community.", "B": "Every single fish in the ocean lives its whole life on a coral reef.", "C": "Coral reefs cover less than one percent of the ocean floor.", "D": "The marine species living on a reef are what build the reef's structure."}, "correct": "A", "choice_families": {"B": "Cok genis", "C": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that reefs sustain a huge marine community, which this captures.", "why_wrong": {"B": "The text does not claim every fish lives on a reef; that overstates it.", "C": "The reef's small area is one detail, too narrow to be the main idea.", "D": "The text says the reef shelters the species, not that the species build the reef. The sides are swapped."}}, {"id": "u1-l3-f1-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Sleep is not merely rest. During deep sleep, the brain consolidates memories, clearing the day's clutter and strengthening what matters. People who sleep after learning retain far more than those who stay awake. Far from idle, the sleeping brain is doing some of its most important work.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "People who sleep after learning retain more than those who stay awake.", "B": "Strengthening memories during the day is what causes the brain to enter deep sleep.", "C": "Sleep is the only thing that determines how well anyone remembers anything.", "D": "Sleep plays an active role in strengthening memory rather than being mere rest."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Ters iliski", "C": "Cok genis"}, "why_correct": "The central point is that sleep actively strengthens memory, which this captures.", "why_wrong": {"A": "The study result is one supporting detail, too narrow to be the main idea.", "B": "The text says sleep strengthens memory, not that daytime memory work causes sleep. The order is flipped.", "C": "The text does not claim sleep is the only factor; that overstates it."}}, {"id": "u1-l3-f1-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The Silk Road carried more than goods. Along with silk and spices, travelers exchanged languages, religions, and technologies across thousands of miles. Ideas about mathematics and medicine moved between distant civilizations that never met directly. Its lasting importance lay less in trade than in the mixing of cultures it made possible.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The Silk Road connected every civilization that has ever existed on Earth.", "B": "Silk and spices were among the goods carried along the Silk Road.", "C": "The mixing of distant cultures is what created the Silk Road trade routes.", "D": "The Silk Road mattered most for its exchange of ideas and cultures."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Ters iliski"}, "why_correct": "The central point is that the route's importance lay in cultural exchange, which this captures.", "why_wrong": {"A": "The text does not claim it connected every civilization ever; that overstates it.", "B": "Silk and spices are one detail, too narrow to be the main idea.", "C": "The text says the trade route enabled cultural mixing, not the reverse. The relationship is flipped."}}, {"id": "u1-l3-f1-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Volcanic ash can devastate crops in the short term, but over centuries it enriches soil. As ash breaks down, it releases minerals that plants need, making land near old volcanoes remarkably fertile. Farmers have long settled such regions despite the risk. The same force that destroys can, in time, sustain.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Volcanic ash can devastate crops in the short term.", "B": "All of the fertile soil in the world comes only from volcanic ash.", "C": "Volcanic ash harms crops at first but over time makes soil fertile.", "D": "Fertile soil near volcanoes is what produces the volcanic ash itself."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Cok genis", "D": "Ters iliski"}, "why_correct": "The central point is the shift from short-term harm to long-term fertility, which this captures.", "why_wrong": {"A": "Short-term harm is only half the point, too narrow to be the main idea.", "B": "The text does not claim all fertile soil comes from ash; that overstates it.", "D": "The text says ash enriches soil, not that fertile soil produces ash. The relationship is flipped."}}, {"id": "u1-l3-f1-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "One novelist kept revising her opening chapter, not because it was weak, but because it set the tone for everything after. A first chapter, she believed, teaches readers how to read the rest of the book. Get it wrong, and the reader misreads what follows. For her, the opening was a set of instructions.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The novelist saw the opening chapter as shaping the whole reading.", "B": "How readers understand a book is what determines how its opening is written.", "C": "Every novel ever written depends entirely on its very first chapter.", "D": "The novelist revised her opening chapter many times over."}, "correct": "A", "choice_families": {"B": "Ters iliski", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that the opening shapes how readers read the whole book, which this captures.", "why_wrong": {"B": "The text says the opening shapes the reading, not the reverse. The relationship is flipped.", "C": "The text does not claim every novel depends entirely on its first chapter; that overstates it.", "D": "That she revised often is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "Urban trees do quiet work. Their leaves trap dust, their shade cools streets by several degrees, and their roots absorb storm water that would otherwise flood drains. City planners once treated trees as decoration. Increasingly, they are seen as essential infrastructure, as vital as pipes and roads.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The city's pipes and roads are what produce the cooling and cleaning trees do.", "B": "Urban trees are now valued as essential city infrastructure, not mere decoration.", "C": "Trees by themselves can solve every environmental problem a city faces.", "D": "The leaves of urban trees trap dust from the air."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that trees are now seen as vital infrastructure, which this captures.", "why_wrong": {"A": "The text credits the trees with the cooling and cleaning, not the pipes and roads. The sides are swapped.", "C": "The text does not claim trees solve every problem; that overstates it.", "D": "Trapping dust is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f1-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok dar", "passage": "The discovery of penicillin was partly luck. A mold drifted into a forgotten dish and killed the bacteria around it. But luck alone was not enough; it took a trained eye to notice the clear ring and grasp its meaning. Chance opened the door, but preparation walked through it.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Every scientific discovery in all of history has happened purely by accident.", "B": "A mold drifted into a forgotten laboratory dish.", "C": "A trained eye is what caused the mold to drift into the dish.", "D": "Penicillin's discovery required both chance and a prepared, observant mind."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Ters iliski"}, "why_correct": "The central point is that discovery took both luck and a prepared mind, which this captures.", "why_wrong": {"A": "The text does not claim every discovery is accidental; that overstates it.", "B": "The drifting mold is one detail, too narrow to be the main idea.", "C": "The text says chance brought the mold, not that the observer caused it. The relationship is flipped."}}, {"id": "u1-l3-f2-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Regular exercise benefits the brain as well as the body. Physical activity increases blood flow to the brain and prompts the release of chemicals that support memory and mood. People who exercise often report clearer thinking and steadier emotions. The gains are real, though they vary from person to person.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Exercise increases blood flow to the brain.", "B": "Exercise also strengthens the muscles and bones of the body.", "C": "Regular exercise supports brain function, improving memory and mood for many people.", "D": "Exercise instantly cures every mental and emotional problem in absolutely everyone."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that exercise supports the brain for many people, which this captures.", "why_wrong": {"A": "Increased blood flow is one detail, too narrow to be the main idea.", "B": "Strengthening muscles is true and consistent, but it is not the brain-focused point the question asks about.", "D": "The text calls the gains real but varying; claiming an instant cure for everyone overstates it."}}, {"id": "u1-l3-f2-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Learning a second language reshapes the brain in measurable ways. Bilingual people often show greater skill at switching between tasks and ignoring distractions. Researchers link these gains to the constant effort of choosing between two languages. The advantages are modest but consistent across many studies.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Speaking two languages brings modest but consistent gains in mental control.", "B": "Many languages share words that were borrowed from one another.", "C": "Bilingual people are far smarter than everyone who speaks only a single language.", "D": "Bilingual people switch between two languages when they speak."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is the modest but consistent mental gains from bilingualism, which this captures.", "why_wrong": {"B": "Shared borrowed words may be true, but it is not the point about mental control the question asks about.", "C": "The text calls the gains modest; claiming bilinguals are far smarter than everyone overstates it.", "D": "Switching between languages is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f2-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "The Amazon rainforest influences weather far beyond its borders. Moisture rising from its trees forms clouds that carry rain to distant farmland. When large areas are cleared, rainfall patterns shift hundreds of miles away. The forest is part of a system that spans a continent.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The Amazon shapes weather across a whole continent, not just in its own region.", "B": "The Amazon is home to countless different species of insects.", "C": "Moisture rises from the trees of the Amazon.", "D": "The Amazon rainforest single-handedly controls all of the weather on the planet."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that the Amazon shapes weather across a continent, which this captures.", "why_wrong": {"B": "The Amazon's insect life is true but not the weather point the question asks about.", "C": "Rising moisture is one detail, too narrow to be the main idea.", "D": "The text describes continental influence; claiming it controls all weather on Earth overstates it."}}, {"id": "u1-l3-f2-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Ancient Roman roads were built to last. Engineers layered stone, gravel, and sand so that water drained away instead of pooling and cracking the surface. Some of these roads still bear traffic today. Their durability came not from luck but from careful design suited to the land.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Roman roads endured because of careful, well-drained engineering, not chance.", "B": "The Roman Empire spanned much of Europe and North Africa.", "C": "Roman roads were made from stone, gravel, and sand.", "D": "Every road in the modern world is built in exactly the same way as a Roman road."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that Roman roads lasted due to careful engineering, which this captures.", "why_wrong": {"B": "The empire's size is true but not the engineering point the question asks about.", "C": "The materials are one detail, too narrow to be the main idea.", "D": "The text does not claim all modern roads copy Roman ones; that overstates it."}}, {"id": "u1-l3-f2-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "A good museum label does more than name an object. It tells visitors why the object matters, what to notice, and how it connects to a larger story. A well-written label can turn a glance into genuine understanding. The best ones guide without lecturing.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Museum labels name the objects on display.", "B": "A single museum label can teach a visitor absolutely everything about all of history.", "C": "A good museum label deepens understanding by explaining an object's meaning and links.", "D": "Many museums charge an entrance fee to their visitors."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Cok genis", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that a good label builds understanding, which this captures.", "why_wrong": {"A": "Naming objects is one detail, too narrow to be the main idea.", "B": "The text describes deepened understanding; claiming a label teaches all of history overstates it.", "D": "Entrance fees are true but not the point about labels the question asks about."}}, {"id": "u1-l3-f2-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Rivers shape the land they cross. Over long spans of time, flowing water carves valleys, moves soil, and deposits it downstream, building fertile plains. Whole landscapes owe their form to the patient work of moving water. What looks permanent is still being shaped.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Rivers move soil downstream as they flow.", "B": "Rivers slowly shape landscapes by carving valleys and building fertile plains.", "C": "Many great cities were founded on the banks of rivers.", "D": "Rivers are responsible for the shape of absolutely every landform on all of Earth."}, "correct": "B", "choice_families": {"A": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that rivers slowly shape landscapes, which this captures.", "why_wrong": {"A": "Moving soil is one detail, too narrow to be the main idea.", "C": "Cities on rivers is true but not the shaping point the question asks about.", "D": "The text describes rivers shaping landscapes, not every landform on Earth; that overstates it."}}, {"id": "u1-l3-f2-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Vaccines work by training the immune system in advance. They expose the body to a harmless piece of a germ so that, if the real germ arrives, the body already knows how to fight it. This preparation prevents illness before it starts. The principle is simple, though the science is complex.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Vaccines make a person completely immune to every single disease that exists.", "B": "A vaccine exposes the body to a harmless piece of a germ.", "C": "Vaccines prevent illness by teaching the immune system to recognize a germ.", "D": "Vaccines are usually given by injection or by mouth."}, "correct": "C", "choice_families": {"A": "Cok genis", "B": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that vaccines train the immune system to prevent illness, which this captures.", "why_wrong": {"A": "The text describes preparing against a germ; claiming immunity to every disease overstates it.", "B": "Exposing the body to a germ piece is one detail, too narrow to be the main idea.", "D": "How vaccines are given is true but not the mechanism the question asks about."}}, {"id": "u1-l3-f2-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Folktales survive because they change. As stories pass from teller to teller, each adds a detail or drops one, shaping the tale to fit new listeners. A story that could not bend would be forgotten. Flexibility, not fixedness, keeps a folktale alive across generations.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Folktales endure because they are flexible and change with each retelling.", "B": "Tellers sometimes add a detail to a folktale.", "C": "Folktales are often told to children at bedtime.", "D": "Every folktale in existence has stayed exactly the same for thousands of years."}, "correct": "A", "choice_families": {"B": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that folktales endure through flexibility, which this captures.", "why_wrong": {"B": "Adding a detail is one detail, too narrow to be the main idea.", "C": "Bedtime telling is true but not the survival point the question asks about.", "D": "This overstates and contradicts the text, which says folktales survive by changing."}}, {"id": "u1-l3-f2-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "The design of a hospital affects how patients heal. Rooms with natural light, quiet, and views of greenery are linked to shorter recoveries and less need for pain medication. Architects now treat these features as part of care, not luxury. A building can help or hinder healing.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Hospitals employ doctors, nurses, and many other kinds of staff.", "B": "Hospital design can influence healing, so light and quiet count as care.", "C": "Hospital design alone can cure any illness without any medical treatment at all.", "D": "Some hospital rooms have views of greenery."}, "correct": "B", "choice_families": {"A": "Dogru ama alakasiz", "C": "Cok genis", "D": "Cok dar"}, "why_correct": "The central point is that design influences healing and counts as care, which this captures.", "why_wrong": {"A": "Hospital staffing is true but not the design point the question asks about.", "C": "The text says design influences healing, not that it cures illness alone; that overstates it.", "D": "Views of greenery is one detail, too narrow to be the main idea."}}, {"id": "u1-l3-f2-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Cok genis", "passage": "Coral gets its color from tiny algae living in its tissue. When the water grows too warm, the coral expels the algae and turns white, a process called bleaching. Without the algae, the coral loses its main food source and may starve. The color signals a vital partnership.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Coral reefs are found in warm, shallow seas.", "B": "Coral turns white when it expels its algae.", "C": "All coral everywhere is permanently white and has never had any color at all.", "D": "Coral's color reflects a vital algae partnership it depends on to survive."}, "correct": "D", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "C": "Cok genis"}, "why_correct": "The central point is that coral's color reflects a vital algae partnership, which this captures.", "why_wrong": {"A": "Where reefs are found is true but not the partnership point the question asks about.", "B": "Bleaching is one detail, too narrow to be the main idea.", "C": "This overstates and contradicts the text, which says coral gets color from algae."}}, {"id": "u1-l3-f3-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The gardener argued that native plants make the best gardens. Adapted to local soil and rainfall, they need less water and care than imported species, and they feed local insects and birds. Her yard, full of natives, thrived with little effort while her neighbors struggled with thirsty ornamentals.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The gardener's own yard was full of native plants.", "B": "Native plants require absolutely no water or care of any kind.", "C": "Gardening is a popular hobby in many different countries.", "D": "Native plants make better gardens by suiting local conditions."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that native plants suit local conditions and so make better gardens, which this captures.", "why_wrong": {"A": "Her yard being full of natives is one detail, too narrow to be the main idea.", "B": "The text says less water and care, not none at all; that overstates it.", "C": "The popularity of gardening is true but not the point the question asks about."}}, {"id": "u1-l3-f3-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "Historians once dismissed oral traditions as unreliable. But recent work shows that carefully preserved oral histories can pass down accurate accounts across many generations. Some record events, from floods to migrations, that written sources missed. Spoken memory can be a serious historical record.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Some oral histories record floods and migrations.", "B": "Carefully kept oral traditions can be a reliable historical record.", "C": "Writing was invented thousands of years ago.", "D": "Oral traditions are always more accurate than any written source ever is."}, "correct": "B", "choice_families": {"A": "Cok dar", "C": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that oral traditions can be reliable historical records, which this captures.", "why_wrong": {"A": "Recording floods and migrations is one detail, too narrow to be the main idea.", "C": "The age of writing is true but not the point the question asks about.", "D": "The text does not claim oral sources are always more accurate; that overstates it."}}, {"id": "u1-l3-f3-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The engineer insisted that simpler bridges are often safer. Every added part, she noted, is another thing that can fail or be built wrong. A clean design leaves fewer chances for error and is easier to inspect. Complexity, she warned, can hide weakness.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The simplest possible bridge is always completely safe in absolutely every case.", "B": "Simpler bridge designs are often safer because they leave fewer chances for failure.", "C": "Bridges have been built by people for thousands of years.", "D": "Every added part is one more thing that can fail."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Dogru ama alakasiz", "D": "Cok dar"}, "why_correct": "The central point is that simpler designs are often safer, which this captures.", "why_wrong": {"A": "The text says often safer, not always completely safe; that overstates it.", "C": "The age of bridge-building is true but not the point the question asks about.", "D": "Added parts failing is one supporting point, too narrow to be the main idea."}}, {"id": "u1-l3-f3-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The chef argued that good cooking starts with restraint. Too many ingredients, he said, drown out the flavors that matter. A dish with three well-chosen elements can taste richer than one with twelve. Knowing what to leave out is the mark of a skilled cook.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "A dish with fewer ingredients always tastes better than any other dish ever could.", "B": "Good cooking depends on restraint, using few well-chosen ingredients.", "C": "The chef said too many ingredients drown out key flavors.", "D": "Many people enjoy eating out at restaurants."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that restraint makes for good cooking, which this captures.", "why_wrong": {"A": "The text does not claim fewer ingredients always taste better; that overstates it.", "C": "The drowning-out point is one supporting idea, too narrow to be the main idea.", "D": "That people enjoy restaurants is true but not the point the question asks about."}}, {"id": "u1-l3-f3-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The teacher found that spacing lessons out works better than cramming. When students review material over several days, they remember it far longer than when they study it all at once. The effort of recalling a fading memory is what makes it stick.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Students review the material over several days.", "B": "Cramming never helps anyone remember anything at all, in any situation.", "C": "Students attend school for many years of their lives.", "D": "Spacing study across days aids retention far more than cramming."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that spaced study beats cramming for retention, which this captures.", "why_wrong": {"A": "Reviewing over several days is one detail, too narrow to be the main idea.", "B": "The text does not claim cramming never helps at all; that overstates it.", "C": "How long students attend school is true but not the point the question asks about."}}, {"id": "u1-l3-f3-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The naturalist claimed that wolves shape whole ecosystems. By controlling deer numbers, they let young trees grow, which shelter birds and stabilize riverbanks. Remove the wolves, she observed, and the effects ripple outward. A single predator can hold a landscape together.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Wolves can shape entire ecosystems, so removing them ripples widely.", "B": "Wolves are members of the dog family.", "C": "Wolves help to control deer numbers.", "D": "Wolves are the only animals that have any effect at all on any ecosystem."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that wolves shape whole ecosystems, which this captures.", "why_wrong": {"B": "That wolves are in the dog family is true but not the point the question asks about.", "C": "Controlling deer is one detail, too narrow to be the main idea.", "D": "The text does not claim wolves are the only animals that affect ecosystems; that overstates it."}}, {"id": "u1-l3-f3-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The archivist warned that digital records are more fragile than they seem. Files can be lost when formats become obsolete or storage devices fail, sometimes within a decade. Paper, by contrast, can last centuries untended. Preserving digital history takes constant, active effort.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "All digital files are destroyed within exactly ten years, with no exceptions.", "B": "Files can be lost when storage devices fail.", "C": "Computers are used in nearly every office today.", "D": "Digital records are fragile and require constant effort to preserve, unlike paper."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that digital records are fragile and need active preservation, which this captures.", "why_wrong": {"A": "The text says sometimes within a decade, not always exactly ten years; that overstates it.", "B": "Files lost to device failure is one detail, too narrow to be the main idea.", "C": "The prevalence of computers is true but not the point the question asks about."}}, {"id": "u1-l3-f3-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The economist argued that small businesses anchor local economies. Money spent at a neighborhood shop tends to stay in the area, paying local wages and suppliers, while money spent at distant chains often leaves. Strong local businesses keep a community's wealth circulating close to home.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Money spent at a neighborhood shop pays local wages.", "B": "Many businesses now accept payment by card.", "C": "Every large chain store harms every community it enters, with no exception.", "D": "Local businesses strengthen communities by keeping wealth circulating."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "C": "Cok genis"}, "why_correct": "The central point is that local businesses keep community wealth circulating, which this captures.", "why_wrong": {"A": "Paying local wages is one supporting point, too narrow to be the main idea.", "B": "That businesses accept cards is true but not the point the question asks about.", "C": "The text does not claim every chain harms every community; that overstates it."}}, {"id": "u1-l3-f3-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The astronomer explained that dark skies are a vanishing resource. Artificial light now washes out the stars for most city dwellers, who may never see the Milky Way. Beyond stargazing, this glow disrupts the rhythms of nocturnal animals. Protecting darkness matters for people and wildlife.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Artificial light washes out the stars for many city dwellers.", "B": "The Milky Way is a galaxy.", "C": "Light pollution erases dark skies, harming both stargazers and wildlife.", "D": "Artificial light has completely destroyed every star in the entire universe."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that light pollution harms both stargazing and wildlife, which this captures.", "why_wrong": {"A": "Washed-out stars is one detail, too narrow to be the main idea.", "B": "That the Milky Way is a galaxy is true but not the point the question asks about.", "D": "The text is about washed-out views, not destroyed stars; that overstates it absurdly."}}, {"id": "u1-l3-f3-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The linguist argued that slang is not lazy speech but invention. Young people constantly coin words to name new feelings and experiences, and some eventually enter standard dictionaries. What sounds like carelessness is often language renewing itself.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Some slang words enter standard dictionaries.", "B": "English is spoken in many countries around the world.", "C": "Slang is creative language renewal, not careless or lazy speech.", "D": "Every slang word ever invented has become a formal dictionary entry."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that slang is creative renewal, not laziness, which this captures.", "why_wrong": {"A": "Some slang entering dictionaries is one detail, too narrow to be the main idea.", "B": "Where English is spoken is true but not the point the question asks about.", "D": "The text says some slang enters dictionaries, not every word; that overstates it."}}, {"id": "u1-l3-f4-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The researcher found that trust builds cooperation, not the other way around. When people believe others will keep their word, they take the risk of working together, and success then deepens that trust. But the first step is trust; without it, cooperation never begins.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "People work together in many different kinds of groups and teams.", "B": "Successful cooperation can deepen the trust that already exists.", "C": "Trust comes first and makes cooperation possible, not the reverse.", "D": "Cooperation between people is what first creates the trust among them."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that trust comes first and enables cooperation, which this captures.", "why_wrong": {"A": "That people work in groups is true but not the point the question asks about.", "B": "Cooperation deepening trust is one sub-point, too narrow to be the main idea about order.", "D": "This flips the order; the text says trust enables cooperation, not the reverse."}}, {"id": "u1-l3-f4-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The biologist explained that shade from the forest canopy keeps the soil moist, and that this moisture in turn lets the tall canopy trees thrive. The relationship runs one way at the start: it is the canopy's shade that protects the moisture the whole system depends on.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Forests are found on every continent except Antarctica.", "B": "It is the soil's moisture that produces the shade of the forest canopy.", "C": "The canopy's shade preserves the moisture the tall trees depend on.", "D": "Moisture lets the tall canopy trees thrive."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that canopy shade preserves moisture that trees depend on, which this captures.", "why_wrong": {"A": "Where forests are found is true but not the point the question asks about.", "B": "This flips the relationship; the text says shade preserves moisture, not the reverse.", "D": "Moisture helping trees is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The historian argued that cheap paper enabled mass literacy, not the reverse. Once paper became affordable, books and pamphlets spread, and ordinary people gained reason and means to read. Demand for reading did not create cheap paper; cheap paper created the conditions for reading.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Paper can be made from wood or from cloth fibers.", "B": "Books and pamphlets spread once paper became affordable.", "C": "Cheap paper came first and enabled mass literacy, not the reverse.", "D": "A rise in mass literacy is what made paper become cheap."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that cheap paper preceded and enabled literacy, which this captures.", "why_wrong": {"A": "What paper is made of is true but not the point the question asks about.", "B": "Books spreading is one sub-point, too narrow to be the main idea about order.", "D": "This flips the order; the text says paper enabled literacy, not the reverse."}}, {"id": "u1-l3-f4-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The ecologist showed that otters protect kelp forests. Otters eat sea urchins, and urchins left unchecked devour kelp. Where otters thrive, urchin numbers stay low and kelp flourishes. The otter's presence, not the kelp's, sets the whole chain in motion.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Flourishing kelp forests are what cause otter populations to thrive.", "B": "Otters protect kelp forests by keeping the urchins that eat kelp in check.", "C": "Otters eat sea urchins.", "D": "Kelp is a kind of large seaweed."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that otters protect kelp by controlling urchins, which this captures.", "why_wrong": {"A": "This flips the chain; the text says otters set it in motion, not the kelp.", "C": "That otters eat urchins is one detail, too narrow to be the main idea.", "D": "That kelp is a seaweed is true but not the point the question asks about."}}, {"id": "u1-l3-f4-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The teacher observed that curiosity drives attention, not the reverse. When students genuinely wonder about something, they focus without being told to. Forcing attention onto a dull topic rarely works; sparking curiosity first is what makes the focus follow.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Forcing students to pay attention is what creates their curiosity.", "B": "Curiosity comes first and produces attention, not the reverse.", "C": "Students focus on the things they wonder about.", "D": "Classrooms often contain rows of desks and chairs."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that curiosity comes first and produces attention, which this captures.", "why_wrong": {"A": "This flips the order; the text says curiosity produces attention, not the reverse.", "C": "Focusing on wonder is one sub-point, too narrow to be the main idea.", "D": "What classrooms contain is true but not the point the question asks about."}}, {"id": "u1-l3-f4-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The economist argued that rising wages drove the town's recovery, not the reverse. As factories raised pay, workers spent more locally, which revived shops and drew new businesses in. The higher wages came first; the broader recovery followed from them.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Rising wages came first and drove the town's wider economic recovery.", "B": "Many towns have both factories and shops.", "C": "The town's economic recovery is what caused its wages to rise.", "D": "Workers spent more money at the local shops."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that rising wages preceded and drove the recovery, which this captures.", "why_wrong": {"B": "That towns have factories and shops is true but not the point the question asks about.", "C": "This flips the order; the text says wages drove recovery, not the reverse.", "D": "Workers spending locally is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The scientist explained that warming seas drive stronger storms, not the reverse. Warm water feeds energy into forming storms, making them more intense. The storms do not warm the sea; they draw on heat already there. The order of cause and effect is clear.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Strong storms are what cause the seas to become warmer.", "B": "Warm seas drive stronger storms, not the other way around.", "C": "Storms are given names by weather agencies.", "D": "Warm water feeds energy into forming storms."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Dogru ama alakasiz", "D": "Cok dar"}, "why_correct": "The central point is that warm seas drive stronger storms, not the reverse, which this captures.", "why_wrong": {"A": "This flips the cause and effect; the text says warm seas drive storms, not the reverse.", "C": "That storms are named is true but not the point the question asks about.", "D": "Warm water feeding storms is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The sociologist argued that strong friendships lead to good health, not merely the revers
