<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit_title":"SAT Reading & Writing Kampı","unit":2,"lessons":[{"questions":[{"unit":2,"choice_families":{"B":"Ters anlam","C":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı"},"choices":{"C":"obliterate","D":"mediate","B":"inflame","A":"ease"},"why_correct":"The word 'although ... instead deepened' signals that the committee expected the opposite of deepening, so the policy was meant to reduce tension. 'Ease' fits.","passage":"Although the committee had expected the new seating policy to ______ the tension between the two departments, it instead deepened their long-standing rivalry.","correct":"A","id":"u2-l1-f1-01","lesson":1,"why_wrong":{"B":"'Inflame' means to worsen, the opposite of what the committee expected before tension deepened.","C":"'Obliterate' points the right way (reducing) but is far too strong; wiping out tension entirely overshoots the sentence.","D":"'Mediate' belongs to the world of committees and disputes but does not fit the slot; one mediates a dispute, not 'mediate the tension' in this sense."},"lesson_name":"Words in Context","target_family":"Ters anlam","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"choices":{"A":"ornate","B":"spare","D":"fictional","C":"legible"},"choice_families":{"C":"İkincil sözlük anlamı","D":"Çağrışım tuzağı","A":"Ters anlam"},"unit":2,"id":"u2-l1-f1-02","correct":"B","passage":"The critic praised the novel for its ______ prose, noting that not a single sentence felt padded or unnecessary.","why_correct":"'Not a single sentence felt padded' means the prose is stripped down, so 'spare' (lean, economical) fits.","why_wrong":{"D":"'Fictional' is associated with a novel but does not describe the density of the prose the sentence is about.","C":"'Legible' concerns handwriting being readable, a different sense that does not describe a lean style.","A":"'Ornate' means heavily decorated, the opposite of prose with nothing padded."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ters anlam","lesson_name":"Words in Context"},{"id":"u2-l1-f1-03","why_correct":"'Far from being ___ ... blunt enough to offend' means the remarks were the opposite of tactful, so 'tactful' correctly names what they were NOT.","passage":"Far from being ______, the ambassador's remarks were blunt enough to offend several delegates in the room.","correct":"C","choices":{"C":"tactful","D":"diplomatic","B":"audible","A":"brutal"},"unit":2,"choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","target_family":"Ters anlam","why_wrong":{"B":"'Audible' means able to be heard, a real word but the wrong sense for describing tactfulness.","A":"'Brutal' matches the blunt, offensive remarks rather than the quality they lacked, so it reverses the logic.","D":"'Diplomatic' fits the ambassador setting by association but, like the answer, would need the 'far from' frame; placed alone it competes weakly and is the topical lure here."},"lesson":1},{"lesson":1,"why_wrong":{"B":"'Aggravate' means to worsen, which is what actually happened, not what was expected.","A":"'Eradicate' points the right way but is too absolute; wiping out symptoms entirely overshoots 'expected to reduce.'","C":"'Diagnose' is a medical-sounding word tied to the topic but names identifying an illness, not reducing symptoms."},"target_family":"Ters anlam","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"C":"Çağrışım tuzağı","A":"Ton ve derece uyumsuzluğu","B":"Ters anlam"},"unit":2,"choices":{"C":"diagnose","D":"alleviate","B":"aggravate","A":"eradicate"},"correct":"D","passage":"The medication was expected to ______ the patient's symptoms, but after a week they had grown noticeably more severe.","why_correct":"'But ... grown more severe' shows the medication was expected to do the opposite: reduce symptoms. 'Alleviate' fits.","id":"u2-l1-f1-04"},{"lesson":1,"why_wrong":{"B":"'Erode' means to wear away, matching the skepticism that grew rather than the intended repair.","D":"'Cement' points toward strengthening but is too strong for trust that must first be rebuilt; one cannot cement trust that is currently absent.","C":"'Audit' is associated with an agency but names a financial review, not the rebuilding of trust."},"target_family":"Ters anlam","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","unit":2,"choice_families":{"C":"Çağrışım tuzağı","D":"Ton ve derece uyumsuzluğu","B":"Ters anlam"},"choices":{"A":"restore","B":"erode","D":"cement","C":"audit"},"passage":"The reforms were meant to ______ public trust in the agency, yet each new scandal left citizens more skeptical than before.","why_correct":"'Yet ... more skeptical' signals the reforms were meant to do the opposite of eroding trust, so 'restore' fits.","correct":"A","id":"u2-l1-f1-05"},{"choices":{"B":"defusing","A":"escalating","C":"scheduling","D":"annihilating"},"choice_families":{"A":"Ters anlam","D":"Ton ve derece uyumsuzluğu","C":"Çağrışım tuzağı"},"unit":2,"id":"u2-l1-f1-06","correct":"B","passage":"Rather than ______ the debate, the moderator's pointed questions only sharpened the disagreement between the candidates.","why_correct":"'Rather than ___ ... only sharpened the disagreement' means the moderator failed to do the opposite: calm the debate. 'Defusing' fits.","why_wrong":{"C":"'Scheduling' is associated with a moderator's duties but does not fit calming a debate.","D":"'Annihilating' aims the right way but is wildly too strong for easing a debate.","A":"'Escalating' means intensifying, which is what happened, not the contrast the sentence sets up."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ters anlam","lesson_name":"Words in Context"},{"target_family":"Ters anlam","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Publish' is associated with theories and research but names releasing work, not weakening a theory.","B":"'Reinforce' means to strengthen, matching what the data actually did rather than what was expected.","D":"'Demolish' points the right way but is too extreme for the measured 'supposed to' setup, which implies casting doubt, not total destruction."},"passage":"The evidence was supposed to ______ the theory, but the new data instead confirmed it beyond reasonable doubt.","why_correct":"'But ... confirmed it' shows the evidence was expected to do the opposite of confirming, so 'undermine' (weaken) fits.","correct":"C","id":"u2-l1-f1-07","unit":2,"choice_families":{"D":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","B":"Ters anlam"},"choices":{"B":"reinforce","A":"publish","C":"undermine","D":"demolish"}},{"choice_families":{"A":"Ton ve derece uyumsuzluğu","B":"Ters anlam","C":"Çağrışım tuzağı"},"unit":2,"choices":{"C":"recruit","D":"invigorate","B":"deplete","A":"electrify"},"correct":"D","why_correct":"'Though ... worn them down further' signals the speech was intended to do the opposite, to energize tired players. 'Invigorate' fits.","passage":"The coach's speech was intended to ______ the exhausted players, though several admitted afterward that it had only worn them down further.","id":"u2-l1-f1-08","lesson":1,"why_wrong":{"A":"'Electrify' is the right direction but too intense for a speech meant simply to revive worn-out players.","B":"'Deplete' means to drain, which is what the speech did, not what it aimed to do.","C":"'Recruit' is associated with coaching but names signing new players, not re-energizing tired ones."},"lesson_name":"Words in Context","target_family":"Ters anlam","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"passage":"Critics feared the merger would ______ competition in the industry, but smaller firms actually multiplied in the years that followed.","why_correct":"'But smaller firms actually multiplied' shows the feared effect was the opposite of growth: to suppress competition. 'Stifle' fits.","correct":"A","id":"u2-l1-f1-09","unit":2,"choice_families":{"D":"Ton ve derece uyumsuzluğu","C":"Çağrışım tuzağı","B":"Ters anlam"},"choices":{"D":"annihilate","C":"regulate","A":"stifle","B":"foster"},"target_family":"Ters anlam","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Foster' means to encourage, matching the multiplication that occurred, not the feared harm.","C":"'Regulate' is associated with industry and mergers but names oversight, not the suppression the critics feared.","D":"'Annihilate' aims the right way but is too absolute; critics feared competition would be suppressed, not utterly destroyed."}},{"choice_families":{"C":"Çağrışım tuzağı","D":"Ton ve derece uyumsuzluğu","A":"Ters anlam"},"unit":2,"choices":{"C":"channel","D":"abolish","B":"lessen","A":"heighten"},"correct":"B","why_correct":"'Yet ... relying ... as heavily as ever' shows the system was designed to do the opposite of increasing dependence, so 'lessen' fits.","passage":"The new irrigation system was designed to ______ the region's dependence on seasonal rain, yet farmers found themselves relying on the rains as heavily as ever.","id":"u2-l1-f1-10","lesson":1,"why_wrong":{"A":"'Heighten' means to increase, the reverse of what an irrigation system built to reduce reliance would aim for.","C":"'Channel' is associated with irrigation and water but names directing flow, not reducing dependence.","D":"'Abolish' points the right way but is too absolute for a system meant to reduce, not entirely end, reliance on rain."},"lesson_name":"Words in Context","target_family":"Ters anlam","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"choices":{"C":"reckless","D":"archival","B":"disciplined","A":"novel"},"choice_families":{"A":"İkincil sözlük anlamı","C":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"id":"u2-l1-f2-01","correct":"B","why_correct":"'Keeps strictly to what the documents show, adds no speculation' describes controlled restraint, so 'disciplined' fits.","passage":"The historian's account is admirably ______: she keeps strictly to what the documents show and adds no speculation of her own.","why_wrong":{"A":"'Novel' can mean new or original, but that dictionary sense does not match staying strictly to evidence; the sentence is about restraint, not originality.","D":"'Archival' is associated with documents and history but describes records themselves, not the historian's restraint.","C":"'Reckless' is the opposite of the careful restraint described."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı"},{"correct":"C","passage":"Before the vote, the chair asked each member to ______ the proposal carefully, weighing its costs against its likely benefits.","why_correct":"'Weighing its costs against its benefits' calls for careful evaluation, so 'weigh' (consider) fits.","id":"u2-l1-f2-02","choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"choices":{"A":"dismiss","B":"table","D":"legislate","C":"weigh"},"target_family":"İkincil sözlük anlamı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Table' can mean to set aside a proposal, a real parliamentary sense, but here the members are asked to consider it, not shelve it.","A":"'Dismiss' is the opposite of the careful consideration the chair requests.","D":"'Legislate' is associated with votes and chairs but names making law, not evaluating a single proposal."}},{"choice_families":{"A":"Çağrışım tuzağı","B":"İkincil sözlük anlamı","C":"Ters anlam"},"unit":2,"choices":{"B":"current","A":"published","C":"disjointed","D":"coherent"},"correct":"D","why_correct":"'Each claim follows cleanly ... no gaps' describes tight logical connection, so 'coherent' fits.","passage":"The essay's argument is ______: each claim follows cleanly from the one before it, with no gaps in the reasoning.","id":"u2-l1-f2-03","lesson":1,"why_wrong":{"C":"'Disjointed' is the opposite of claims that follow cleanly.","A":"'Published' is associated with essays but describes release, not the internal logic of the argument.","B":"'Current' can mean up to date, a real sense, but that does not describe how claims connect; the sentence is about logical flow, not timeliness."},"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"lesson":1,"why_wrong":{"B":"'Stylish' captures the fashion sense of elegant but not the technical sense of simple and efficient the sentence requires.","C":"'Convoluted' means overly complex, the opposite of using the fewest parts.","D":"'Structural' is associated with engineering but describes what a thing relates to, not the simplicity of the solution."},"target_family":"İkincil sözlük anlamı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","B":"İkincil sözlük anlamı"},"unit":2,"choices":{"C":"convoluted","D":"structural","B":"stylish","A":"elegant"},"correct":"A","passage":"The engineer proposed a ______ solution, one that used the fewest possible parts to do the job reliably.","why_correct":"In technical writing an 'elegant' solution is one that is simple and efficient, matching 'fewest possible parts,' so 'elegant' fits.","id":"u2-l1-f2-04"},{"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Tidy' shares the neat sense of orderly but usually describes physical spaces, not the sequence of a spoken account.","D":"'Sworn' is associated with witnesses and testimony but describes an oath, not how the account is arranged.","C":"'Garbled' means confused and jumbled, the opposite of a clear sequence."},"correct":"B","why_correct":"'Each moment in the exact order it occurred' describes a well-sequenced account, so 'orderly' fits.","passage":"The witness gave a ______ account of the accident, describing each moment in the exact order it occurred.","id":"u2-l1-f2-05","choice_families":{"A":"İkincil sözlük anlamı","C":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"choices":{"A":"tidy","B":"orderly","D":"sworn","C":"garbled"}},{"why_wrong":{"D":"'Orchestral' is associated with composers but describes instrumentation, not memorability.","A":"'Forgettable' is the opposite of melodies people hum after one hearing.","B":"'Commemorative' shares the memory root but means honoring an event, not easy to remember."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"İkincil sözlük anlamı","lesson_name":"Words in Context","choices":{"D":"orchestral","C":"memorable","A":"forgettable","B":"commemorative"},"unit":2,"choice_families":{"A":"Ters anlam","B":"İkincil sözlük anlamı","D":"Çağrışım tuzağı"},"id":"u2-l1-f2-06","passage":"The composer was known for ______ melodies that listeners could hum after a single hearing.","why_correct":"'Listeners could hum after a single hearing' means the melodies stick in the mind, so 'memorable' fits.","correct":"C"},{"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Executive' is associated with leadership but names a role, not the openness described.","B":"'See-through' captures the literal, physical sense of transparent but not the figurative sense of open and candid the sentence needs.","C":"'Secretive' is the opposite of making decisions openly."},"why_correct":"'Made decisions openly and explained the reasons' describes openness, so 'transparent' (open, candid) fits.","passage":"Her leadership style was refreshingly ______: she made decisions openly and explained the reasons behind each one.","correct":"D","id":"u2-l1-f2-07","unit":2,"choice_families":{"C":"Ters anlam","B":"İkincil sözlük anlamı","A":"Çağrışım tuzağı"},"choices":{"C":"secretive","D":"transparent","B":"see-through","A":"executive"}},{"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Luminous' shares a light-giving root with lucid but means glowing, not clear in expression.","D":"'Editorial' is associated with reports and writing but names opinion content, not clarity.","C":"'Opaque' means hard to understand, the opposite of plainly laid out."},"correct":"A","why_correct":"'Laid out the findings plainly, without jargon' describes clarity, so 'lucid' (clear, easy to follow) fits.","passage":"The report was praised as ______: it laid out the findings plainly, without jargon that would confuse a general reader.","id":"u2-l1-f2-08","choice_families":{"B":"İkincil sözlük anlamı","C":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"choices":{"C":"opaque","D":"editorial","B":"luminous","A":"lucid"}},{"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Composite' shares the root with composed but means made of parts, an unrelated sense.","D":"'Contractual' is associated with negotiation but describes agreements, not the negotiator's calm.","C":"'Frantic' is the opposite of the calm control described."},"correct":"B","why_correct":"'Never raising her voice or losing focus' describes calm self-control, so 'composed' fits.","passage":"The negotiator stayed ______ throughout the tense meeting, never once raising her voice or losing her focus.","id":"u2-l1-f2-09","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","A":"İkincil sözlük anlamı"},"unit":2,"choices":{"C":"frantic","D":"contractual","B":"composed","A":"composite"}},{"correct":"C","why_correct":"'Helped students improve rather than discouraging them' describes helpful criticism, so 'constructive' fits.","passage":"The teacher's feedback was consistently ______: it pointed out weaknesses in a way that helped students improve rather than discouraging them.","id":"u2-l1-f2-10","choice_families":{"D":"Çağrışım tuzağı","A":"Ters anlam","B":"İkincil sözlük anlamı"},"unit":2,"choices":{"C":"constructive","D":"academic","B":"structural","A":"harsh"},"lesson_name":"Words in Context","target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"D":"'Academic' is associated with teachers but describes a field, not the helpful quality of the feedback.","B":"'Structural' shares the build root with constructive but means relating to structure, not helpful in intent.","A":"'Harsh' is the opposite of feedback that helps rather than discourages."}},{"target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Eliminated' is the right direction but too absolute; if it eliminated symptoms, the sentence could not add 'though a few reported no change.'","A":"'Worsened' reverses the direction the sentence needs.","D":"'Medicated' is associated with drugs and patients but names giving medicine, not the effect on symptoms."},"correct":"C","passage":"The study found that the drug ______ symptoms in most patients, though a few reported no change at all.","why_correct":"'In most patients, though a few reported no change' calls for a measured, partial effect, so 'reduced' fits.","id":"u2-l1-f3-01","choice_families":{"D":"Çağrışım tuzağı","A":"Ters anlam","B":"Ton ve derece uyumsuzluğu"},"unit":2,"choices":{"B":"eliminated","A":"worsened","C":"reduced","D":"medicated"}},{"lesson":1,"why_wrong":{"C":"'Dreadful' reverses the positive direction the praise establishes.","A":"'Cinematic' is associated with film but describes a visual quality, not the level of the reviewers' praise.","B":"'Flawless' overshoots; reviewers who stop short of 'masterpiece' would not call the film flawless."},"lesson_name":"Words in Context","target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"C":"Ters anlam","A":"Çağrışım tuzağı","B":"Ton ve derece uyumsuzluğu"},"unit":2,"choices":{"B":"flawless","A":"cinematic","C":"dreadful","D":"solid"},"correct":"D","why_correct":"'Stopping short of calling it a masterpiece' signals moderate praise, so 'solid' fits the measured tone.","passage":"Reviewers found the film ______, praising its steady craft while stopping short of calling it a masterpiece.","id":"u2-l1-f3-02"},{"lesson":1,"why_wrong":{"C":"'Outright' also overshoots, implying total and unconditional support, which the reservations contradict.","D":"'Legislative' is associated with senators and bills but describes lawmaking, not the degree of support.","B":"'Wholehearted' overshoots; support with reservations is not wholehearted."},"target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"C":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı","B":"Ton ve derece uyumsuzluğu"},"unit":2,"choices":{"C":"outright","D":"legislative","B":"wholehearted","A":"qualified"},"correct":"A","passage":"The senator expressed ______ support for the bill, backing its goals while noting several provisions she hoped to amend.","why_correct":"'Backing its goals while noting provisions she hoped to amend' describes limited, conditional support, so 'qualified' fits.","id":"u2-l1-f3-03"},{"target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Total' overshoots; protection that fails outdoors is not total.","D":"'Metallic' is associated with metal but describes a material quality, not the degree of protection.","C":"'Negligible' undershoots in the other direction; the coating does help indoors, so the protection is not negligible."},"correct":"B","passage":"The coating gives the metal ______ protection against rust, enough for indoor use but not for harsh outdoor exposure.","why_correct":"'Enough for indoor use but not for harsh outdoor exposure' describes limited protection, so 'modest' fits.","id":"u2-l1-f3-04","choice_families":{"A":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı","C":"Ters anlam"},"unit":2,"choices":{"D":"metallic","C":"negligible","A":"total","B":"modest"}},{"choices":{"A":"gentle","B":"savage","D":"vocal","C":"pointed"},"choice_families":{"A":"Ters anlam","B":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı"},"unit":2,"id":"u2-l1-f3-05","correct":"C","why_correct":"'Disagreed firmly but never insulted anyone' calls for sharp but controlled, so 'pointed' fits.","passage":"Her tone was ______ rather than hostile; she disagreed firmly but never insulted anyone in the room.","why_wrong":{"A":"'Gentle' undershoots; firm disagreement is stronger than gentle.","B":"'Savage' overshoots into hostility, which the sentence explicitly rules out.","D":"'Vocal' is associated with tone and speaking but describes loudness, not the controlled sharpness meant."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","target_family":"Ton ve derece uyumsuzluğu"},{"lesson":1,"why_wrong":{"C":"'Hostile' reverses the direction, since the board approved the proposal.","B":"'Boundless' overshoots; enthusiasm that trims the budget is not boundless.","A":"'Fiscal' is associated with budgets but describes finance, not the degree of enthusiasm."},"target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","unit":2,"choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","C":"Ters anlam"},"choices":{"A":"fiscal","B":"boundless","D":"tempered","C":"hostile"},"passage":"The proposal met with ______ enthusiasm: the board approved it but asked for a smaller budget than requested.","why_correct":"'Approved it but asked for a smaller budget' signals restrained enthusiasm, so 'tempered' fits.","correct":"D","id":"u2-l1-f3-06"},{"target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Dramatic' overshoots; the sentence calls the improvement small.","D":"'Mechanical' is associated with efficiency and machines but describes a manner, not the size of the improvement.","C":"'Ruinous' reverses direction, implying harm rather than improvement."},"correct":"A","passage":"The change produced a ______ improvement in efficiency, small but consistent across every trial.","why_correct":"'Small but consistent' points to a slight gain, so 'marginal' fits the degree.","id":"u2-l1-f3-07","choice_families":{"B":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı","C":"Ters anlam"},"unit":2,"choices":{"C":"ruinous","D":"mechanical","B":"dramatic","A":"marginal"}},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","why_wrong":{"A":"'Scathing' overshoots; raising a few concerns is far milder than a scathing attack.","D":"'Authorial' is associated with an author but describes writing itself, not an attitude.","C":"'Admiring' reverses the direction, since the author has concerns."},"lesson":1,"id":"u2-l1-f3-08","passage":"The author is ______ of the policy, raising a few concerns without rejecting it outright.","why_correct":"'A few concerns without rejecting it outright' describes mild caution, so 'wary' fits.","correct":"B","choices":{"C":"admiring","D":"authorial","B":"wary","A":"scathing"},"unit":2,"choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","A":"Ton ve derece uyumsuzluğu"}},{"lesson":1,"why_wrong":{"D":"'Municipal' is associated with a mayor but describes city government, not the quality of the apology.","B":"'Profound' overshoots; a brief acknowledgment is the opposite of a deep, heartfelt apology.","A":"'Defiant' reverses direction, since the mayor does apologize."},"lesson_name":"Words in Context","target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","unit":2,"choice_families":{"D":"Çağrışım tuzağı","B":"Ton ve derece uyumsuzluğu","A":"Ters anlam"},"choices":{"A":"defiant","B":"profound","D":"municipal","C":"perfunctory"},"why_correct":"'Acknowledging the error briefly before moving on' signals a token, minimal apology, so 'perfunctory' fits.","passage":"The mayor offered a ______ apology, acknowledging the error briefly before moving on to other business.","correct":"C","id":"u2-l1-f3-09"},{"why_wrong":{"C":"'Catastrophic' reverses direction, describing disaster rather than recovery.","B":"'Triumphant' overshoots; a slight uptick is not a triumphant recovery.","A":"'Commercial' is associated with sales but describes business, not the strength of the recovery."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ton ve derece uyumsuzluğu","lesson_name":"Words in Context","choices":{"C":"catastrophic","D":"tentative","B":"triumphant","A":"commercial"},"unit":2,"choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","C":"Ters anlam"},"id":"u2-l1-f3-10","passage":"Sales showed a ______ recovery, ticking upward slightly after months of steep decline.","why_correct":"'Ticking upward slightly' after decline describes a cautious, early recovery, so 'tentative' fits.","correct":"D"},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","target_family":"Çağrışım tuzağı","why_wrong":{"A":"'Stellar' evokes stars and can mean excellent, but the slot needs 'easy to follow,' not 'excellent'; it is the topical lure.","B":"'Celestial' is tied to astronomy by topic but describes the sky, not how easy the lecture was to follow.","C":"'Impenetrable' reverses the meaning, describing something impossible to understand."},"lesson":1,"id":"u2-l1-f4-01","why_correct":"'Even listeners with no background followed every point with ease' means the lecture was easy to grasp, so 'accessible' fits.","passage":"The astronomer's lecture was so ______ that even listeners with no science background followed every point with ease.","correct":"D","choices":{"C":"impenetrable","D":"accessible","B":"celestial","A":"stellar"},"unit":2,"choice_families":{"C":"Ters anlam","B":"Çağrışım tuzağı","A":"Çağrışım tuzağı"}},{"passage":"The chef's new menu was praised as ______, blending techniques from cuisines that rarely appear together.","why_correct":"'Blending techniques that rarely appear together' describes originality, so 'inventive' fits.","correct":"A","id":"u2-l1-f4-02","unit":2,"choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","B":"Çağrışım tuzağı"},"choices":{"D":"savory","C":"derivative","A":"inventive","B":"culinary"},"target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"C":"'Derivative' reverses the meaning, describing unoriginal work.","D":"'Savory' evokes food but describes a taste, not the originality of the menu; it is the topical lure.","B":"'Culinary' is tied to a chef and menu by topic but simply means relating to cooking, not original."}},{"choices":{"B":"impartial","A":"judicial","C":"biased","D":"legal"},"choice_families":{"A":"Çağrışım tuzağı","C":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"id":"u2-l1-f4-03","correct":"B","passage":"The judge's ruling was widely seen as ______, applying the same standard to both sides without favor.","why_correct":"'Applying the same standard to both sides without favor' describes fairness, so 'impartial' fits.","why_wrong":{"C":"'Biased' reverses the meaning, describing favoritism.","D":"'Legal' evokes the courtroom but means lawful, not even-handed; it is the topical lure.","A":"'Judicial' is tied to a judge by topic but means relating to courts, not fair."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Çağrışım tuzağı","lesson_name":"Words in Context"},{"target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"D":"'Structural' evokes construction but describes load and framework, not spatial economy; it is the topical lure.","A":"'Wasteful' reverses the meaning, describing poor use of space.","B":"'Architectural' is tied to an architect by topic but just means relating to buildings, not economical in space."},"correct":"C","passage":"The architect's design was admired for being ______, using every square meter of the small lot without feeling cramped.","why_correct":"'Using every square meter ... without feeling cramped' describes smart use of space, so 'efficient' fits.","id":"u2-l1-f4-04","choice_families":{"D":"Çağrışım tuzağı","A":"Ters anlam","B":"Çağrışım tuzağı"},"unit":2,"choices":{"D":"structural","C":"efficient","A":"wasteful","B":"architectural"}},{"choices":{"A":"narrative","B":"literary","D":"focused","C":"sprawling"},"unit":2,"choice_families":{"C":"Ters anlam","B":"Çağrışım tuzağı","A":"Çağrışım tuzağı"},"id":"u2-l1-f4-05","passage":"The novelist's later work grew more ______, stripping away subplots until only the central story remained.","why_correct":"'Stripping away subplots until only the central story remained' describes concentration, so 'focused' fits.","correct":"D","why_wrong":{"B":"'Literary' is tied to a novelist by topic but means relating to literature, not concentrated.","A":"'Narrative' evokes storytelling but names a type of writing, not the tightening described; it is the topical lure.","C":"'Sprawling' reverses the meaning, describing something that spreads out rather than narrows."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Çağrışım tuzağı","lesson_name":"Words in Context"},{"target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Economic' is tied to an economist by topic but means relating to the economy, not correct.","C":"'Mistaken' reverses the meaning, describing a wrong forecast.","D":"'Monetary' evokes economics but concerns money supply, not the forecast's correctness; it is the topical lure."},"correct":"A","passage":"The economist's forecast proved ______, matching the actual figures released months later almost exactly.","why_correct":"'Matching the actual figures almost exactly' describes correctness, so 'accurate' fits.","id":"u2-l1-f4-06","choice_families":{"B":"Çağrışım tuzağı","D":"Çağrışım tuzağı","C":"Ters anlam"},"unit":2,"choices":{"A":"accurate","B":"economic","D":"monetary","C":"mistaken"}},{"lesson_name":"Words in Context","target_family":"Çağrışım tuzağı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"A":"'Surgical' is tied to a surgeon by topic; though it can mean precise, here it is the circular topical lure, and 'precise' names the quality directly.","D":"'Medical' evokes the operating room but means relating to medicine, not exact; it is the topical lure.","C":"'Clumsy' reverses the meaning, describing a lack of control."},"why_correct":"'Each cut placed with control ... no room for error' describes exactness, so 'precise' fits.","passage":"The surgeon's movements were remarkably ______, each cut placed with control that left no room for error.","correct":"B","id":"u2-l1-f4-07","unit":2,"choice_families":{"C":"Ters anlam","D":"Çağrışım tuzağı","A":"Çağrışım tuzağı"},"choices":{"D":"medical","C":"clumsy","A":"surgical","B":"precise"}},{"why_wrong":{"A":"'Superficial' reverses the meaning, describing shallow work.","B":"'Historical' is tied to a historian by topic but means relating to history, not exhaustive in research.","D":"'Chronological' evokes history and biography but describes time order, not depth of research; it is the topical lure."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","choices":{"A":"superficial","B":"historical","D":"chronological","C":"thorough"},"unit":2,"choice_families":{"D":"Çağrışım tuzağı","B":"Çağrışım tuzağı","A":"Ters anlam"},"id":"u2-l1-f4-08","passage":"The historian's biography is admirably ______, drawing on letters and records that earlier accounts overlooked.","why_correct":"'Drawing on letters and records earlier accounts overlooked' describes completeness, so 'thorough' fits.","correct":"C"},{"passage":"The pianist's performance was ______, holding the audience in complete silence until the final note faded.","why_correct":"'Holding the audience in complete silence' describes a gripping performance, so 'captivating' fits.","correct":"D","id":"u2-l1-f4-09","unit":2,"choice_families":{"C":"Ters anlam","B":"Çağrışım tuzağı","A":"Çağrışım tuzağı"},"choices":{"D":"captivating","C":"tedious","A":"melodic","B":"musical"},"target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_wrong":{"B":"'Musical' is tied to a pianist by topic but just means relating to music, not spellbinding.","A":"'Melodic' evokes music but describes tunefulness, not the gripping effect on the audience; it is the topical lure.","C":"'Tedious' reverses the meaning, describing a dull performance."}},{"why_wrong":{"C":"'Narrow' reverses the meaning, describing limited scope.","D":"'Biological' evokes the natural science but describes the field, not the breadth of the report; it is the topical lure.","B":"'Ecological' is tied to an ecosystem by topic but means relating to ecology, not wide-ranging."},"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Çağrışım tuzağı","lesson_name":"Words in Context","choices":{"A":"comprehensive","B":"ecological","D":"biological","C":"narrow"},"choice_families":{"B":"Çağrışım tuzağı","C":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"id":"u2-l1-f4-10","correct":"A","passage":"The report on the ecosystem was praised as ______, tracing how a single species loss rippled through the whole food web.","why_correct":"'Tracing how a single loss rippled through the whole food web' describes wide coverage, so 'comprehensive' fits."}],"teaching":{"sik_hatalar":[{"cozum":"although, but, instead varsa boşluk beklentinin TERSİ yönde. Önce bağlaca bak.","hata":"Bağlacı atlayıp yönü ters okumak"},{"cozum":"SAT çok anlamlı kelimeleri sever. Kelimenin cümledeki anlamını kontrol et, ilk akla geleni değil.","hata":"Tanıdık kelimeyi doğru sanmak"},{"hata":"Doğru yön ama yanlış derece seçmek","cozum":"Cümle ölçülü ise (somewhat, tends to) cevap da ölçülü olmalı. obliterate, eliminate gibi mutlak kelimeler çoğu zaman ton tuzağıdır."},{"cozum":"Kelime konuya değil, cümlenin mantığına uymalı. Çağrışım tuzağı bu reflekse avlanır.","hata":"Konudan gelen kelimeye kanmak"}],"alt_konular_baslik":"Soru alt tipleri","alt_konular":[{"baslik":"1) Boşluğa en uygun kelime (fill the blank)","kural":"Seçeneklere bakmadan boşluğa kendi kelimeni yaz; sonra yön ve derece bakımından en yakın seçeneği seç.","govde":["Soru kökü: \"Which choice completes the text with the most logical and precise word or phrase?\" Boşluğun yerine dört kelime verilir; cümlenin mantığına en tam oturanı seçersin.","Yöntem: seçeneklere bakmadan önce boşluğa KENDİ kelimeni koy. Cümle olumlu mu olumsuz mu bir anlam istiyor? Güçlü mü ölçülü mü? Kendi tahminine en yakın seçeneği ara.","Tuzak: anlamı doğru ama tonu/derecesi yanlış kelime. Cümle 'hafif bir şaşkınlık' istiyorsa 'dehşet' fazla güçlüdür. Yön (olumlu/olumsuz) ve derece (hafif/güçlü) iki filtredir."]},{"baslik":"2) Kelimenin bağlamdaki anlamı (most nearly means)","govde":["Soru kökü: \"As used in the text, the word 'X' most nearly means...\" Burada kelimenin en bilinen anlamı çoğu zaman TUZAKTIR; soru ikincil ya da bağlama özgü anlamı ölçer.","Kelimeyi cümleden çıkar, yerine her seçeneği tek tek koy ve cümle hâlâ aynı anlamı veriyor mu diye oku. Sadece bağlamda cümleyi bozmayan seçenek doğrudur.","En sık hata: kelimenin ezberden bilinen birincil anlamını işaretlemek. 'Novel' hem 'roman' hem 'yeni/özgün' demektir; bağlam hangisini istiyorsa o doğrudur."],"ornek":"\"Her approach to the problem was quite novel.\" Burada 'novel' = yeni/özgün; 'roman' anlamı bağlama uymaz."},{"govde":["Doğru kelimeyi bağlam üç yolla ele verir: TANIM (kelime cümlede açıklanır), ZITLIK (but/however ile ters anlam kurulur), ÖRNEK (for instance ile somutlaşır). Önce hangi ipucunun devrede olduğunu bul.","Zıtlık ipucu en çok kaçırılanıdır: 'unlike', 'whereas', 'yet' gördüğünde boşluk, kıyaslanan şeyin TERSİ anlamı ister. Aynı yönde kelime seçen öğrenci burada düşer.","İpucunu bulduktan sonra seçenekleri elemek kolaylaşır: bağlamın istediği yönü taşımayan her seçenek gider."],"baslik":"3) Bağlam ipuçlarını kullanma (context clues)"}],"strateji":["Seçeneklere bakmadan cümleyi oku, boşluğun anlamını kendi kelimenle tahmin et.","Bağlacı bul: zıtlık mi, sonuç mu, örnek mi. Yönü belirle.","Tahminine en yakın seçeneği ara.","Yön ve derece kontrolü yap, çok güçlü ya da çok zayıfı ele.","Kalan seçenekleri cümleye koyup oku, mantık akıyor mu bak."],"karar_proseduru":["SEÇENEKLERE HENÜZ BAKMA. Önce cümleyi oku ve boşluğun anlamını KENDİ kelimenle tahmin et.  Bir yön belirle: olumlu mu olumsuz mu, artıran mi azaltan mi.","Bağlam ipucunu bul.  although, but, instead, because, so gibi bağlaçlar boşluğun yönünü belirler. Bu kelimeyi işaretle.","Kendi tahminini seçeneklerle eşle.  Tahminine en yakın kelimeyi ara. İlk tanıdık kelimeye atlamak en sık hatadır.","Yön ve derece kontrolü yap.  Seçenek doğru yönde mi. Çok mu güçlü, çok mu zayıf. Cümlenin tonuna uyuyor mu.","Kalan seçenekleri cümleye tek tek koy.  Kelimeyi boşlukta oku. Kulağa doğru gelmiyorsa ele."],"top_tips":["Boşluktan önceki bağlaca bak. although, but, yet, instead varsa boşluk beklentinin TERSİ yönde. Bu tek ipucu Ters anlam tuzağını çözer.","Kelimeyi tanıdın diye doğru sanma. SAT çok anlamlı kelimeleri sever. run, address, novel, check gibi kelimelerin cümledeki anlamını kontrol et, ilk akla geleni değil.","Cümle ölçülü bir dil kullanıyorsa (somewhat, tends to, often) doğru cevap da ölçülüdür. obliterate, eliminate, guarantee gibi mutlak kelimeler genelde ton tuzağıdır.","Konudan gelen tanıdık bir kelime görürsen dur. Kelime konuya değil, CÜMLENİN MANTIĞINA uymalı. Çağrışım tuzağı tam bu refleksi avlar."],"alt_konular_intro":"Words in Context iki yüzü olan bir beceridir: ya boşluğa en uygun kelimeyi seçersin, ya da metinde geçen bir kelimenin o bağlamdaki anlamını bulursun. Her ikisinde de cevabı kelimenin sözlük anlamı değil, CÜMLENİN kurduğu bağlam belirler. Bağlam ipuçlarını okumayı öğrenen öğrenci bu soruları neredeyse hiç kaçırmaz.","celdirici_aileleri":[{"ad":"Ters anlam","tanim":"Seçenek boşluğun ihtiyaç duyduğu anlamın TERSİNİ verir. Bağlaç ipucunu (although, instead, but) atlayan öğrenci yönü ters okur. Kelime konuya uyar ama mantık yönü yanlıştır."},{"tanim":"Çok anlamlı bir kelimenin GERÇEK ama bu cümleye uymayan bir anlamı. Kelime sözlükte vardır, öğrenci tanıdık gelince işaretler, ama burada kastedilen anlam değildir.","ad":"İkincil sözlük anlamı"},{"ad":"Ton ve derece uyumsuzluğu","tanim":"Seçenek doğru YÖNDE ama yanlış ŞİDDETTE. Cümle ölçülü bir şey söylerken seçenek mutlak ya da aşırı olur, ya da tam tersi. Yön doğru, derece yanlış."},{"tanim":"Seçenek metnin KONUSUYLA çağrışım yapar ama boşluğun mantığına oturmaz. Konu bilimsel bilimsel bir kelime konur, ama o kelime cümlenin istediği is değildir. Tanıdık alan, yanlış kelime.","ad":"Çağrışım tuzağı"}],"cozumlu_ornekler":[{"choices":{"B":"inflame","A":"ease","C":"obliterate","D":"mediate"},"adimlar":["Bağlaca bak: although ... instead deepened. Bu zıtlık kuruyor, yani beklenen şey gerçekleşenin TERSİ.","Gerçekleşen: rekabet derinleşti. Beklenen tersi: gerginlik azalacaktı.","Boşluk azaltma anlamında olmalı. ease (yatıştırmak) tam oturur.","inflame tersini söyler (körüklemek). obliterate yön doğru ama çok aşırı (tümden yok etmek). mediate konuya yakın ama boşluğun mantığına oturmaz."],"sonuc":"Bağlaç (although, instead) boşluğun yönünü belirledi. Yön azaltma, doğru kelime ease.","stem":"Which choice completes the text with the most logical and precise word?","passage":"Although the committee expected the new policy to ______ tensions between the departments, it instead deepened the rivalry.","correct":"A"},{"stem":"Which choice completes the text with the most logical and precise word?","adimlar":["İpucu cümlenin ikinci yarısında: hiçbir cümle fazlalık hissettirmiyor.","Demek üslup sade, yalın, gereksizden arınmış.","spare (yalın, ekonomik) tam bunu karşılar.","ornate tersi (süslü). legible el yazısı okunaklılığı, yanlış anlam. fictional konuya (roman) yakın ama üslubu tarif etmez."],"sonuc":"Boşluğun anlamını cümlenin ipucundan tahmin et, sonra en yakın kelimeyi ara.","correct":"B","passage":"The critic praised the novel for its ______ prose, noting that not a single sentence felt padded or unnecessary.","choices":{"D":"fictional","C":"legible","A":"ornate","B":"spare"}}],"kavramsal_temel":["Words in Context, bir boşluğu EN KESİN kelimeyle doldurmanı ister. Bu soru kelime bilgisini değil, BAĞLAM okumasını ölçer. Cümlenin kurduğu mantık hangi anlamı zorunlu kılıyor, önce onu bulursun.","Doğru kelime cümlenin yönüne, tonuna ve derecesine tam oturmalıdır. Bir kelime kabaca doğru anlamda olabilir ama tonu ya da şiddeti cümleye uymuyorsa yanlıştır. SAT bu ince farkı sever.","En güçlü ipucu bağlaçlardır. although, but, instead zıtlık kurar, so, therefore sonuç kurar, for example örnek verir. Bu kelimeler boşluğun yönünü belirler ve çoğu soruyu tek başına çözer.","Bu yüzden seçeneklere bakmadan önce cümleyi oku ve boşluğun anlamını kendi kelimenle tahmin et. İlk tanıdık kelimeye atlamak en sık ve en pahalı hatadır."],"ne_olculuyor":["Bir cümlede bir boşluk vardır ve dört kelime ya da kısa ifade verilir. Görev: boşluğu EN KESİN dolduran seçeneği bulmak.","Bu soru kelime bilgisinden çok BAĞLAM okuması ölçer. Doğru kelime, cümlenin kurduğu mantığa tam oturmalıdır.","Kritik nokta: bir seçenek doğru anlam ailesinden olabilir ama tonu, yönü ya da derecesi cümleye uymayabilir. Tuzak tam burada kurulur."]},"main_ids":["u2-l1-f1-01","u2-l1-f2-01","u2-l1-f3-01","u2-l1-f4-01"],"families":["Ters anlam","İkincil sözlük anlamı","Ton ve derece uyumsuzluğu","Çağrışım tuzağı"],"fam_short":{"Ters anlam":"Ters anlam","İkincil sözlük anlamı":"İkincil anlam","Ton ve derece uyumsuzluğu":"Ton/derece","Çağrışım tuzağı":"Çağrışım"},"no":1,"name":"Words in Context"},{"main_ids":["u2-l2-f1-01","u2-l2-f2-01","u2-l2-f3-01","u2-l2-f4-01"],"families":["Doğru konu yanlış işlev","Metnin bir kısmi bütünü değil","Ters işlev","Metinde olmayan işlev"],"fam_short":{"Ters işlev":"Ters işlev","Metnin bir kısmi bütünü değil":"Parça/bütün","Doğru konu yanlış işlev":"Konu/işlev","Metinde olmayan işlev":"Olmayan işlev"},"name":"Text Structure and Purpose","no":2,"questions":[{"why_wrong":{"D":"No two gardening methods are compared or recommended.","C":"The text does not dismiss the study; it treats the results as meaningful.","B":"This names the topic (soil and wildflowers) but not what the text does; it reads like a summary, not a description of structure."},"lesson":2,"stem":"Which choice best describes the overall structure of the text?","lesson_name":"Text Structure and Purpose","target_family":"Doğru konu yanlış işlev","choices":{"D":"Two competing gardening methods are compared and one is recommended.","C":"A study is described in detail and then dismissed as unreliable.","A":"A common assumption is presented, then challenged with a study whose results point to a more complicated conclusion.","B":"The text describes how soil nutrients affect the growth of native wildflowers."},"unit":2,"choice_families":{"C":"Ters işlev","D":"Metinde olmayan işlev","B":"Doğru konu yanlış işlev"},"id":"u2-l2-f1-01","why_correct":"The text states a common belief, then introduces a study that complicates it and draws a nuanced conclusion. Choice A captures that movement.","passage":"Many gardeners assume that richer soil always yields healthier plants. A recent study complicates this belief: in nutrient-heavy soil, several native wildflowers grew tall but produced far fewer blooms than the same species grown in leaner ground. The finding suggests that abundance can sometimes work against a plant's reproductive success.","correct":"A"},{"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Doğru konu yanlış işlev","why_wrong":{"C":"The text supports the value of her works rather than questioning it.","D":"No teaching career is mentioned or compared.","A":"Describing her life is the topic, not the purpose; the text builds toward an argument, not a biography."},"lesson":2,"id":"u2-l2-f1-02","why_correct":"The text moves toward the scholars' argument that her works deserve attention, so its purpose is to make that case. Choice A fits.","passage":"The composer Clara Schumann was celebrated as a performer in her lifetime, yet her compositions were long overlooked. Only in recent decades have scholars begun to examine her songs and piano works closely, arguing that they deserve a place beside those of her better-known contemporaries.","correct":"B","choices":{"C":"To question whether Clara Schumann's compositions have any lasting value.","D":"To compare Clara Schumann's performing career with her teaching career.","B":"To argue that a historically neglected composer's works merit renewed critical attention.","A":"To describe the life and career of the composer Clara Schumann."},"unit":2,"choice_families":{"C":"Ters işlev","D":"Metinde olmayan işlev","A":"Doğru konu yanlış işlev"}},{"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Doğru konu yanlış işlev","why_wrong":{"D":"Past and present reefs are mentioned but not systematically compared.","B":"Explaining temperature response is topic material, not the text's purpose, which is corrective.","A":"The text says reefs are threatened now, so it does not claim they are safe."},"lesson":2,"id":"u2-l2-f1-03","why_correct":"The text rejects the 'fragile' framing and pinpoints speed of change as the real threat, so its purpose is to correct and relocate the danger. Choice A fits.","passage":"Coral reefs are often described as fragile, but this framing can mislead. Reefs have survived dramatic swings in ocean temperature over millions of years. What threatens them now is not fragility but the unusual speed of current change, which outpaces the corals' capacity to adapt.","correct":"C","choices":{"C":"To correct a common characterization of reefs by locating the real source of their present danger.","D":"To compare modern reefs with the reefs of millions of years ago.","B":"To explain how coral reefs respond to changes in ocean temperature.","A":"To argue that coral reefs are not actually in any danger today."},"unit":2,"choice_families":{"D":"Metinde olmayan işlev","B":"Doğru konu yanlış işlev","A":"Ters işlev"}},{"id":"u2-l2-f1-04","passage":"The first photographs of Earth from space did more than document the planet. Circulated widely in the late 1960s, the images gave many viewers a sudden sense of the planet as small, whole, and shared, and historians credit them with helping to energize the emerging environmental movement.","why_correct":"The text explains how the images gained influence beyond documentation, energizing a movement. Choice A captures that purpose.","correct":"D","choices":{"A":"To compare early space photography with modern satellite imaging.","B":"To describe the first photographs of Earth taken from space.","D":"To explain how a set of images came to have an influence beyond their documentary value.","C":"To argue that the photographs had no real effect on public attitudes."},"unit":2,"choice_families":{"B":"Doğru konu yanlış işlev","A":"Metinde olmayan işlev","C":"Ters işlev"},"stem":"Which choice best states the main purpose of the text?","target_family":"Doğru konu yanlış işlev","lesson_name":"Text Structure and Purpose","why_wrong":{"B":"Describing the photographs is the topic; the text's aim is to explain their larger effect.","A":"Modern satellite imaging is never mentioned.","C":"The text credits the images with real influence, the opposite of claiming none."},"lesson":2},{"target_family":"Doğru konu yanlış işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"D":"No two measurement methods are contrasted.","C":"The text endorses the newer research rather than rejecting it.","B":"This states the topic (effects of commuting) rather than the text's structure."},"correct":"A","passage":"For years, economists treated commuting time as a minor cost. Newer research challenges that view, linking long daily commutes to measurable declines in well-being and even in job performance. The costs of distance, this work suggests, reach well beyond the hours spent in transit.","why_correct":"The text states the old view, then uses new research to widen the recognized costs. Choice A tracks that structure.","id":"u2-l2-f1-05","choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Doğru konu yanlış işlev"},"unit":2,"choices":{"A":"A long-held view is noted, then countered by research that broadens the understood costs of an activity.","B":"The text explains the effects of long commutes on workers' daily lives.","D":"Two methods of measuring commuting time are contrasted.","C":"A body of research is introduced and then rejected as overstated."}},{"choice_families":{"A":"Doğru konu yanlış işlev","D":"Metinde olmayan işlev","C":"Ters işlev"},"unit":2,"choices":{"D":"To compare this novel's narrator with narrators in other novels.","C":"To argue that the novel's narrator is fully reliable throughout.","A":"To describe the narrator of the novel and the events she recounts.","B":"To show how the novel uses a gradually unreliable narrator to raise a larger question."},"correct":"B","passage":"The novel's narrator seems, at first, entirely trustworthy. Only gradually do small contradictions accumulate in her account, until the reader begins to suspect that she has been concealing her own role in the events she describes. The unease is the point: the book asks how much any single narrator can be believed.","why_correct":"The text explains how the narrator's growing unreliability serves a larger question about belief. Choice A fits.","id":"u2-l2-f1-06","lesson":2,"why_wrong":{"A":"Describing the narrator is topic material, not the purpose, which is about the effect she creates.","D":"Other novels' narrators are not compared.","C":"The text argues the narrator is not fully reliable, the reverse of C."},"target_family":"Doğru konu yanlış işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?"},{"choices":{"D":"To compare literacy rates in urban and rural Europe.","C":"To qualify a single-cause explanation by placing one factor within a broader set of conditions.","A":"To argue that the printing press had nothing to do with rising literacy.","B":"To describe how the printing press was invented and spread."},"unit":2,"choice_families":{"D":"Metinde olmayan işlev","A":"Ters işlev","B":"Doğru konu yanlış işlev"},"id":"u2-l2-f1-07","why_correct":"The text tempers the 'press alone' explanation by embedding it among other conditions. Choice A fits.","passage":"It is tempting to see the printing press as the sole cause of the spread of literacy in Europe. Yet presses were useless without cheap paper, rising urban schools, and a growing class of readers. The press mattered, but it was one part of a wider set of conditions that made mass reading possible.","correct":"C","why_wrong":{"D":"Urban and rural literacy rates are not compared.","B":"How the press spread is topic material, not the corrective purpose.","A":"The text says the press mattered, so it does not dismiss its role."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Doğru konu yanlış işlev"},{"choices":{"A":"Two species of bees are compared in terms of cooperation.","B":"The text describes the social behavior of workers within a bee colony.","D":"An idealized view is stated, then complicated by evidence of tension beneath the cooperation.","C":"A popular view of bee colonies is presented and then fully confirmed."},"unit":2,"choice_families":{"B":"Doğru konu yanlış işlev","A":"Metinde olmayan işlev","C":"Ters işlev"},"id":"u2-l2-f1-08","passage":"Bee colonies are often praised as models of selfless cooperation. The reality is subtler. Workers do labor for the hive, but recent studies show they also compete, police one another, and occasionally lay their own eggs. Cooperation in the hive is real, yet it rests on constant internal negotiation.","why_correct":"The text states the idealized view, then complicates it with evidence of internal competition. Choice A captures the structure.","correct":"D","why_wrong":{"A":"No two bee species are compared.","B":"This names the topic (worker behavior) rather than the text's structure.","C":"The text complicates the popular view rather than confirming it."},"lesson":2,"stem":"Which choice best describes the overall structure of the text?","target_family":"Doğru konu yanlış işlev","lesson_name":"Text Structure and Purpose"},{"choices":{"B":"To describe the mural the painter made in her final years.","A":"To trace a shift in how a late work has come to be judged.","C":"To argue that the critics of the painter's time were correct.","D":"To compare the mural with murals by other painters."},"unit":2,"choice_families":{"B":"Doğru konu yanlış işlev","C":"Ters işlev","D":"Metinde olmayan işlev"},"id":"u2-l2-f1-09","why_correct":"The text moves from harsh contemporary judgment to a kinder later view, tracing a shift in reception. Choice A fits.","passage":"The painter spent her final years on a single mural, and critics at the time called the choice a waste of her talent. History has been kinder. The mural is now seen as the fullest expression of her style, the work in which every earlier experiment finally came together.","correct":"A","why_wrong":{"B":"Describing the mural is topic material, not the purpose, which concerns changing judgment.","C":"The text sides with the later, kinder view, not the original critics.","D":"Other painters' murals are not compared."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Doğru konu yanlış işlev"},{"lesson":2,"why_wrong":{"C":"The text presents the modern account as established, not doubtful.","D":"No two theories of why we sleep are weighed.","A":"This states the topic (brain during sleep) rather than the overturning structure."},"target_family":"Doğru konu yanlış işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","A":"Doğru konu yanlış işlev"},"choices":{"D":"Two theories about why humans need sleep are weighed against each other.","C":"A modern account of sleep is presented and then called into doubt.","A":"The text explains what the brain does during different stages of sleep.","B":"An outdated idea is stated, then replaced by a description of active processes that overturn it."},"passage":"Sleep was once thought to be a period of pure rest, the brain simply idling. That picture has been overturned. During sleep the brain replays the day's experiences, strengthens some memories, and clears away certain waste products. Rest, it turns out, is anything but idle.","why_correct":"The text states the old 'idling' idea, then overturns it with active processes. Choice A tracks that structure.","correct":"B","id":"u2-l2-f1-10"},{"why_correct":"The text moves problem, failed fixes, new solution and defense. Choice A covers the whole arc.","passage":"The engineer first outlines the problem: the bridge sways in high wind. She then walks through three failed fixes attempted over the years. Finally, she proposes a new damping system and explains why it should succeed where the others did not.","correct":"B","id":"u2-l2-f2-01","unit":2,"choice_families":{"A":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev","C":"Ters işlev"},"choices":{"B":"A problem is stated, past failed solutions are reviewed, and a new solution is proposed and defended.","A":"A problem with a bridge is described in detail.","C":"A new solution is proposed and then shown to fail like the others.","D":"Two damping systems are compared and rated equally effective."},"lesson_name":"Text Structure and Purpose","target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"A":"Describing the problem is only the first part; the question asks about the whole structure.","D":"Only one new system is proposed; two are not rated equally.","C":"The text defends the new solution rather than showing it fails."}},{"id":"u2-l2-f2-02","why_correct":"The text opens with a memory and widens into a broader claim about inheritance. Choice A captures the full movement.","passage":"The essay opens with a vivid childhood memory of the author's grandmother baking bread. It then widens outward, using that memory to reflect on how food carries family history, and closes by arguing that recipes are a form of inheritance as real as any heirloom.","correct":"C","choices":{"D":"Two family recipes are compared across generations.","C":"A personal memory opens the text and is then developed into a broader claim about food and inheritance.","A":"A broad claim is stated first and then narrowed to a single memory.","B":"The author recounts a childhood memory of a grandmother baking bread."},"unit":2,"choice_families":{"D":"Metinde olmayan işlev","B":"Metnin bir kısmi bütünü değil","A":"Ters işlev"},"stem":"Which choice best describes the overall structure of the text?","lesson_name":"Text Structure and Purpose","target_family":"Metnin bir kısmi bütünü değil","why_wrong":{"D":"No two recipes are compared.","B":"The memory is only the opening; the question asks about the whole structure.","A":"The order is reversed: the memory comes first, then the broad claim."},"lesson":2},{"target_family":"Metnin bir kısmi bütünü değil","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"C":"The order is wrong: explanations are rejected before the cause is named.","B":"Introducing the puzzle is only the opening; the question asks about the whole.","A":"Only one lake is discussed; two are not compared."},"passage":"The report begins by noting a puzzle: a lake that should be dying is instead thriving. It reviews and rejects two easy explanations, then identifies an overlooked underground spring as the likely cause, and ends by calling for further testing.","why_correct":"The text raises a puzzle, rejects weak explanations, names a cause, and calls for testing. Choice A covers all of it.","correct":"D","id":"u2-l2-f2-03","unit":2,"choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","B":"Metnin bir kısmi bütünü değil"},"choices":{"A":"Two lakes are compared to explain why one thrives.","B":"A puzzle about a thriving lake is introduced.","D":"A puzzle is raised, weak explanations are dismissed, a likely cause is identified, and further study is urged.","C":"A likely cause is named first and then two explanations are added to support it."}},{"unit":2,"choice_families":{"C":"Ters işlev","D":"Metinde olmayan işlev","B":"Metnin bir kısmi bütünü değil"},"choices":{"D":"An octopus and a crow are compared to decide which is smarter.","C":"Counterexamples are offered first and a definition is built from them.","A":"A standard definition is introduced, tested against counterexamples, and then judged inadequate.","B":"A standard definition of intelligence as problem-solving speed is presented."},"why_correct":"The text gives a definition, tests it with counterexamples, and finds it inadequate. Choice A covers the whole.","passage":"The lecture starts with a familiar definition of intelligence as problem-solving speed. It then presents cases, an octopus, a crow, that solve problems slowly but creatively, and concludes that speed is a poor measure of intelligence on its own.","correct":"A","id":"u2-l2-f2-04","lesson":2,"why_wrong":{"B":"The definition is only the opening; the question asks about the full structure.","C":"The definition comes first, not built from the examples afterward.","D":"The animals illustrate a point; they are not ranked against each other."},"lesson_name":"Text Structure and Purpose","target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?"},{"correct":"B","passage":"The article first celebrates the speed of a new translation tool. It then turns critical, showing how the tool flattens idioms and loses tone. It ends in the middle: useful for gist, it argues, but no substitute for a human translator.","why_correct":"The text praises, then criticizes, then lands on a balanced verdict. Choice A captures the arc.","id":"u2-l2-f2-05","choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","A":"Metnin bir kısmi bütünü değil"},"unit":2,"choices":{"B":"An initial praise is followed by criticism, leading to a balanced final judgment.","A":"The article praises the speed of a new translation tool.","C":"The article criticizes the tool and then withdraws every criticism.","D":"Two translation tools are compared feature by feature."},"target_family":"Metnin bir kısmi bütünü değil","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"A":"The praise is only the opening; the question asks about the whole.","C":"The criticisms stand in the final judgment rather than being withdrawn.","D":"Only one tool is discussed."}},{"lesson_name":"Text Structure and Purpose","target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"D":"Only one fossil is discussed.","A":"The order is reversed: the fossil opens the text, the reflection closes it.","B":"The discovery is only the opening; the question asks about the full structure."},"why_correct":"The text introduces the discovery, traces the reasoning, and closes with reflection. Choice A covers the whole.","passage":"The chapter opens with the discovery of a strange fossil. It then reconstructs, step by step, how researchers determined the animal's diet, gait, and habitat from a few bones. It closes by noting how much can be inferred from how little.","correct":"C","id":"u2-l2-f2-06","unit":2,"choice_families":{"A":"Ters işlev","B":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev"},"choices":{"B":"A strange fossil discovery is described.","A":"A reflection on scientific reasoning opens the text and a fossil is found at the end.","C":"A discovery is introduced, the reasoning drawn from it is traced, and a reflection on that reasoning closes the text.","D":"Two fossils are compared to determine which is older."}},{"id":"u2-l2-f2-07","passage":"The passage begins by describing the calm surface of a tidal pool. It then reveals the fierce competition beneath, crabs, snails, and anemones all vying for space, and ends by suggesting that stillness in nature often hides intense struggle.","why_correct":"The text describes calm, reveals hidden conflict, and draws a lesson. Choice A covers the whole.","correct":"D","choices":{"C":"A general lesson about nature opens the passage and a tidal pool illustrates it first.","D":"A calm appearance is described, the hidden conflict beneath it is revealed, and a general lesson is drawn.","B":"The calm surface of a tidal pool is described.","A":"Crabs and anemones are compared as competitors."},"unit":2,"choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","B":"Metnin bir kısmi bütünü değil"},"stem":"Which choice best describes the overall structure of the text?","target_family":"Metnin bir kısmi bütünü değil","lesson_name":"Text Structure and Purpose","why_wrong":{"A":"The animals illustrate competition; they are not ranked.","B":"The calm surface is only the opening; the question asks about the whole.","C":"The order is reversed: the description comes first, the lesson last."},"lesson":2},{"target_family":"Metnin bir kısmi bütünü değil","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","lesson":2,"why_wrong":{"D":"Only one inventor is discussed.","C":"The failures enable the success rather than preventing it.","B":"The failures are only the middle portion; the question asks about the whole frame."},"passage":"The biography's middle chapters dwell on the inventor's many failures. But the book frames these as necessary: it opens by promising to explain his eventual breakthrough and closes by showing that each failure taught a lesson the success required.","why_correct":"The text frames the failures within a promise to explain the success and shows they enabled it. Choice A covers the whole.","correct":"A","id":"u2-l2-f2-08","unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Metnin bir kısmi bütünü değil"},"choices":{"D":"Two inventors are compared by their number of failures.","C":"The book argues that the inventor's failures prevented his later success.","A":"A promise to explain a success frames an account of failures that are shown to make the success possible.","B":"The book describes the inventor's many failures in his middle years."}},{"why_wrong":{"A":"Admiring the visuals is only the opening; the question asks about the whole.","C":"It criticizes the script and praises the visuals, the reverse of C.","D":"Only one film is reviewed."},"lesson":2,"stem":"Which choice best describes the overall structure of the text?","lesson_name":"Text Structure and Purpose","target_family":"Metnin bir kısmi bütünü değil","choices":{"B":"Initial praise gives way to sustained criticism, ending in a narrow, qualified recommendation.","A":"The review admires the film's striking visuals.","C":"The review praises the script and criticizes the visuals.","D":"Two films by the same director are compared."},"choice_families":{"A":"Metnin bir kısmi bütünü değil","C":"Ters işlev","D":"Metinde olmayan işlev"},"unit":2,"id":"u2-l2-f2-09","correct":"B","why_correct":"The text opens with praise, shifts to sustained criticism, and ends with a narrow recommendation. Choice A covers the whole.","passage":"The review opens by admiring the film's visuals. It spends most of its length, however, on the weak script, arguing that no amount of beauty can rescue a story the audience cannot follow. It ends by recommending the film only to those who watch for images alone."},{"choice_families":{"B":"Metnin bir kısmi bütünü değil","A":"Ters işlev","D":"Metinde olmayan işlev"},"unit":2,"choices":{"D":"Two cities are compared to decide which wastes more food.","C":"A striking statistic leads into an analysis of causes and then to examples of successful solutions.","A":"Successful solutions are described first and the causes of waste are added last.","B":"A startling statistic about food waste is presented."},"correct":"C","passage":"The text starts with a startling statistic about food waste. It then explains the tangled causes, from cosmetic standards to confusing date labels, and finishes by describing several cities that have cut waste sharply, offering their methods as a model.","why_correct":"The text opens with a statistic, analyzes causes, then gives successful examples. Choice A covers the whole.","id":"u2-l2-f2-10","lesson":2,"why_wrong":{"A":"The order is reversed: causes come before the solutions.","B":"The statistic is only the opening; the question asks about the whole.","D":"The cities model solutions; they are not ranked by waste."},"target_family":"Metnin bir kısmi bütünü değil","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?"},{"id":"u2-l2-f3-01","why_correct":"The text states a claim, then gives evidence against it. Choice A names that function.","passage":"Some claim that background music helps students study. The evidence points the other way. In controlled trials, students who studied in silence recalled more than those exposed to music, even instrumental music without lyrics.","correct":"C","choices":{"D":"To propose a new method for testing memory.","C":"To present a claim and then offer evidence that undercuts it.","A":"To describe how background music affects studying.","B":"To present a claim and then supply evidence that supports it."},"unit":2,"choice_families":{"D":"Metinde olmayan işlev","A":"Doğru konu yanlış işlev","B":"Ters işlev"},"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Ters işlev","why_wrong":{"A":"This names the topic, not what the text does with the claim.","B":"The evidence undercuts the claim rather than supporting it, so B reverses the function.","D":"No new testing method is proposed."},"lesson":2},{"choice_families":{"A":"Metinde olmayan işlev","B":"Ters işlev","C":"Doğru konu yanlış işlev"},"unit":2,"choices":{"B":"To list the drawbacks of cities in order to argue against city life.","A":"To compare city life with rural life point by point.","C":"To describe the noise and crowding typical of large cities.","D":"To concede drawbacks and then argue that they are inseparable from a benefit."},"correct":"D","why_correct":"The text concedes drawbacks, then argues they produce a benefit, defending city life. Choice A fits.","passage":"The author begins by granting that cities are noisy, crowded, and expensive. But the essay is a defense of city life: those very pressures, it argues, force the mixing of people and ideas that makes cities engines of creativity.","id":"u2-l2-f3-02","lesson":2,"why_wrong":{"A":"Rural life is not systematically compared.","B":"The essay defends city life, so using the drawbacks to argue against it reverses the function.","C":"This names the topic, not the concede-then-defend move."},"lesson_name":"Text Structure and Purpose","target_family":"Ters işlev","stem":"Which choice best states the main purpose of the text?"},{"lesson":2,"why_wrong":{"C":"This names the topic, not the refuting move.","D":"The text debunks the myth rather than advising how to 'use more' of the brain.","B":"The text refutes the belief rather than confirming it, so B reverses the function."},"lesson_name":"Text Structure and Purpose","target_family":"Ters işlev","stem":"Which choice best states the main purpose of the text?","choice_families":{"D":"Metinde olmayan işlev","C":"Doğru konu yanlış işlev","B":"Ters işlev"},"unit":2,"choices":{"C":"To explain which parts of the brain are most active.","D":"To recommend ways of using more of the brain.","B":"To state a popular belief and then confirm it with evidence.","A":"To state a popular belief and then refute it with evidence."},"correct":"A","why_correct":"The text states the myth, then refutes it with scan evidence. Choice A fits.","passage":"A myth holds that we use only ten percent of our brains. The passage sets out to bury it: brain scans show activity across virtually the entire brain over the course of a day, leaving no vast unused reserve.","id":"u2-l2-f3-03"},{"choices":{"A":"It softens the warning developed earlier in the report.","B":"It intensifies the warning developed earlier rather than easing it.","D":"It introduces a solution the report had not mentioned.","C":"It summarizes the report's topic for the reader."},"choice_families":{"D":"Metinde olmayan işlev","C":"Doğru konu yanlış işlev","A":"Ters işlev"},"unit":2,"id":"u2-l2-f3-04","correct":"B","why_correct":"The paragraph hardens the warning and moves the deadline closer. Choice A names that intensifying function.","passage":"The final paragraph does not soften the report's warning. If anything, it hardens it, stating that the deadline for action is closer than the earlier sections implied and that delay now carries costs that cannot later be undone.","why_wrong":{"C":"It does more than summarize; it strengthens the warning.","D":"No new solution is introduced.","A":"The paragraph intensifies rather than softens, so B reverses the function."},"lesson":2,"stem":"Which choice best describes the function of the final paragraph in the text as a whole?","lesson_name":"Text Structure and Purpose","target_family":"Ters işlev"},{"stem":"Which choice best states the main purpose of the text?","target_family":"Ters işlev","lesson_name":"Text Structure and Purpose","why_wrong":{"D":"No other poems are compared.","B":"The text pushes against the interpretation rather than confirming it, so B reverses the function.","A":"This names the imagery topic, not the resisting move."},"lesson":2,"id":"u2-l2-f3-05","passage":"It would be easy to read the poem's storm imagery as a sign of despair. The poem resists that reading. By the final lines the storm has cleared, and the speaker greets the washed sky as a fresh beginning.","why_correct":"The text raises the 'despair' reading and then resists it, ending on renewal. Choice A fits.","correct":"C","choices":{"A":"To describe the storm imagery used in the poem.","B":"To raise an interpretation and then confirm it as correct.","D":"To compare this poem with others about storms.","C":"To raise a likely interpretation and then push against it."},"unit":2,"choice_families":{"A":"Doğru konu yanlış işlev","B":"Ters işlev","D":"Metinde olmayan işlev"}},{"choices":{"A":"It compares the diet with a rival diet plan.","B":"It promotes the benefits of the diet described earlier.","D":"It warns against the diet rather than promoting its benefits.","C":"It describes the meals the diet typically includes."},"choice_families":{"A":"Metinde olmayan işlev","B":"Ters işlev","C":"Doğru konu yanlış işlev"},"unit":2,"id":"u2-l2-f3-06","correct":"D","passage":"The second half of the article is not a list of the diet's benefits. It is a caution: the author details how the plan can cause nutrient gaps and warns readers to consult a doctor before beginning it.","why_correct":"The second half cautions about nutrient gaps and urges medical advice. Choice A names that warning function.","why_wrong":{"C":"It does not describe the diet's meals.","B":"The section warns rather than promotes, so B reverses the function.","A":"No rival diet is compared."},"lesson":2,"stem":"Which choice best describes the function of the second half of the article?","target_family":"Ters işlev","lesson_name":"Text Structure and Purpose"},{"choices":{"A":"To present a policy's supporting case and then argue against the policy.","B":"To present a policy's supporting case and then endorse the policy.","D":"To compare two competing tax proposals.","C":"To explain how the proposed tax cut would work."},"choice_families":{"B":"Ters işlev","C":"Doğru konu yanlış işlev","D":"Metinde olmayan işlev"},"unit":2,"id":"u2-l2-f3-07","correct":"A","passage":"The economist does not endorse the tax cut she describes. After laying out its supporters' case, she turn
