e. People with close ties feel less stress and take better care of themselves, which improves health over time. It is the social bond that supports the health, not simply healthy people making friends.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Strong friendships support good health, not merely the reverse.", "B": "People make friends at school, at work, and in other places.", "C": "Being in good health is the only reason people ever form strong friendships.", "D": "People with close ties tend to feel less stress."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that friendships support health, not just the reverse, which this captures.", "why_wrong": {"B": "Where people make friends is true but not the point the question asks about.", "C": "This flips the relationship; the text stresses that bonds support health, not only the reverse.", "D": "Less stress from close ties is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The engineer explained that good roads lower transport costs, which then lower the price of goods. The causal arrow points from roads to prices: build better roads, and delivery grows cheaper, so shelves fill at lower cost. Cheap goods do not build the roads; the roads make the goods cheap.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Cheap goods are what fund and build the better roads.", "B": "Better roads make delivery cheaper.", "C": "Roads are usually paved with asphalt or with concrete.", "D": "Better roads lower transport costs and so lower the price of goods, not the reverse."}, "correct": "D", "choice_families": {"A": "Ters iliski", "B": "Cok dar", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that roads lower costs and thus prices, not the reverse, which this captures.", "why_wrong": {"A": "This flips the cause and effect; the text says roads make goods cheap, not the reverse.", "B": "Cheaper delivery is one sub-point, too narrow to be the main idea.", "C": "What roads are paved with is true but not the point the question asks about."}}, {"id": "u1-l3-f4-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The researcher found that practice builds confidence, not the reverse. As musicians rehearse a piece until it is secure, their nerves fade and assurance grows. Waiting to feel confident before practicing gets the order backward; confidence is a product of practice, not its precondition.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Feeling confident in advance is what makes musicians willing to practice.", "B": "Musicians play many different kinds of instruments.", "C": "Practice builds confidence, so confidence follows from practice.", "D": "Musicians rehearse a piece until it is secure."}, "correct": "C", "choice_families": {"A": "Ters iliski", "B": "Dogru ama alakasiz", "D": "Cok dar"}, "why_correct": "The central point is that practice builds confidence, not the reverse, which this captures.", "why_wrong": {"A": "This flips the order; the text says practice builds confidence, not the reverse.", "B": "What instruments musicians play is true but not the point the question asks about.", "D": "Rehearsing until secure is one sub-point, too narrow to be the main idea."}}]}, {"no": 4, "name": "Inferences", "teaching": {"ne_olculuyor": ["Metnin SONUNDA bir boşluk vardır. Boşluğu dolduran şık metnin mantıksal sonucu olmalıdır.", "Boşluk neredeyse her zaman bir sonuç işaretçisinden sonra gelir: therefore, thus, this suggests that, it can be concluded that, so.", "Çıkarım demek, tahmin demek değildir. Çıkarım, metnin verdiği bilgiden ZORUNLU olarak çıkan şeydir. Metin bunu söylemez ama metin bunu gerektirir."], "karar_proseduru": ["Boşluğun ÖNCESİNDEKİ cümleyi oku ve mantık yönünü bul.  Metin bir karşıtlık mı kuruyor, bir sebep mi veriyor, bir şaşırtıcı bulgu mu sunuyor.", "Metnin verdiği bütün olguları say.  Çıkarım genelde İKİ olguyu birleştirir. Sadece birine dayanan şık eksiktir.", "Kendi cümleni kur.  Şıklara bakmadan önce boşluğa ne geleceğini kendin yaz. Sonra en yakın şıkkı bul.", "Güçlü kelime taraması yap.  always, never, all, only, impossible, prevents, must, exclusively içeren şıkları işaretle. Bunların çoğu yanlıştır."], "celdirici_aileleri": [{"ad": "Çok güçlü", "tanim": "Şık mutlak bir iddia kurar. always, never, all, only, prevents, impossible. SAT çıkarımı İHTİYATLIDIR. Doğru cevap genelde may, can, suggests, tend to, is likely to gibi yumuşak fiillerle gelir."}, {"ad": "Metnin dışına çıkma", "tanim": "Şık makuldür, hatta gerçek hayatta doğrudur, ama metinde onu destekleyen hiçbir şey yoktur. Kendi bilgini kullanma. Metin ne diyorsa o."}, {"ad": "Öncül sonuç karışıklığı", "tanim": "Şık metinde zaten SÖYLENMİŞ bir şeyi tekrar eder. Bu bir çıkarım değil, bir alıntıdır. Çıkarım metnin ÖTESİNE geçer. Metni tekrar eden şık yanlıştır."}, {"ad": "Yön doğru, derece yanlış", "tanim": "Şıkkın yönü doğrudur ama iddiayı metnin destekleyeceğinden fazla ileri götürür. Metin bir etkiden bahsediyorsa şık o etkinin TEK sebep olduğunu söylüyordur."}], "top_tips": ["Güçlü kelime testi. Şıklarda always, never, all, only, none, impossible, prevents, entirely, exclusively varsa o şıkkı önce şüphelen. SAT'de bu kelimeleri içeren şık onda dokuz yanlıştır. Bu tek kural sana sınavda iki üç soru kazandırır.", "Boşluktan önceki cümlede however ya da but varsa çıkarım bir KARŞITLIK taşır. O zaman doğru şık beklentiyle çelişen bir şeyi söyler.", "Metin iki grubu karşılaştırıyorsa çıkarım genelde İKİSİ hakkındadır. Sadece bir gruptan bahseden şık eksiktir.", "Doğru cevabın fiiline bak. may, can, suggests, is likely to. Bu yumuşak fiiller SAT'ın imzasıdır."], "kavramsal_temel": ["Inferences, metnin ACIKCA soylemedigi ama mantiken zorunlu kildigi sonucu bulmani ister. Bosluk cogu zaman bir cumlenin sonundadir ve sen metnin verdigi bilgiden en guvenli cikarimI yaparsin.", "Cikarim tahmin degildir. Dogru cevap metnin bilgisinden MANTIKEN cikan, baska turlu olamayacak sonuctur. Metin disi bilgi, genis genelleme ya da olasi ama zorunlu olmayan sonuc yanlistir.", "En sik tuzak, metinle uyumlu ama metnin garanti etmedigi bir sonuca atlamaktir. Secenek makul gelebilir ama metin onu zorunlu kilmiyorsa dogru degildir. Cikarimda olcut makullik degil, zorunluluktur.", "Bu yuzden her secenek icin sor: metin bunu KESIN kiliyor mu, yoksa sadece mumkun mu kiliyor. Sadece mumkun kilanlar celdiricidir."], "cozumlu_ornekler": [{"passage": "Every plant in the greenhouse requires at least six hours of direct sunlight each day to flower. The fern in the north corner receives only three hours of direct sunlight. It can therefore be concluded that the fern ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "will not flower under its current conditions", "B": "is the healthiest plant in the greenhouse", "C": "should be moved outdoors immediately", "D": "receives more water than the other plants"}, "correct": "A", "adimlar": ["Metnin verdigi kurali oku: cicek acmak icin en az alti saat gunes gerekiyor.", "Fern sadece uc saat aliyor, yani kurala ulasmiyor.", "Mantiken zorunlu sonuc: fern mevcut kosulda cicek acamaz. A bunu soyler.", "B, C, D metinden cikmaz. Saglikli olmasi, disari tasinmasi, su miktari metinde yok, sadece tahmin."], "sonuc": "Cikarim metnin kuralindan mantiken zorunlu cikan sonuctur, makul tahmin degil."}, {"passage": "The museum's most valuable painting is displayed only during the summer months. A visitor who came in January was disappointed not to see it. From this it can be inferred that the visitor ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "had hoped to see that particular painting", "B": "disliked all the other paintings", "C": "will return every summer from now on", "D": "works at the museum"}, "correct": "A", "adimlar": ["Metin: ziyaretci tabloyu goremedigi icin HAYAL KIRIKLIGINA ugradi.", "Hayal kirikligi, o tabloyu gormeyi UMDUGUNU zorunlu kilar.", "A tam bunu soyler, metnin bilgisinden dogrudan cikar.", "B, C, D metinden cikmaz. Diger tablolari sevmemesi, her yaz gelmesi, muzede calismasi zorunlu degil."], "sonuc": "Guvenli cikarim metnin garanti ettigi sonuctur. Mumkun ama garanti olmayan secenekler tuzaktir."}], "sik_hatalar": [{"hata": "Makul ama zorunlu olmayan sonuca atlamak", "cozum": "Secenek metinle uyumlu olabilir ama metin onu KESIN kilmiyorsa yanlistir. Olcut zorunluluktur."}, {"hata": "Metin disi bilgi eklemek", "cozum": "Cikarim sadece metnin verdigi bilgiye dayanmali. Disaridan getirdigin sey cikarim degildir."}, {"hata": "Cok guclu genelleme yapmak", "cozum": "her zaman, hicbir zaman, herkes gibi mutlak secenekler cogu zaman metnin garanti ettiginden fazlasini soyler."}, {"hata": "Duygu ya da niyet uydurmak", "cozum": "Metnin belirtmedigi bir duygu ya da niyeti secenege eklersen, o cikarim degil tahmindir."}], "strateji": ["Metnin verdigi bilgiyi ve varsa kurali net oku.", "Bosluktan once dur, kendi zorunlu sonucunu tahmin et.", "Her secenek icin sor: metin bunu kesin mi kiliyor, yoksa sadece mumkun mu.", "Mumkun ama zorunlu olmayanlari ele.", "Mutlak ve asiri genel secenekleri dikkatle test et."]}, "families": ["Cok guclu", "Metnin disina cikma", "Oncul sonuc karisikligi", "Yon dogru derece yanlis"], "fam_short": {"Cok guclu": "Cok guclu", "Metnin disina cikma": "Metin disi", "Oncul sonuc karisikligi": "Oncul-sonuc", "Yon dogru derece yanlis": "Derece"}, "main_ids": ["u1-l4-f1-01", "u1-l4-f2-01", "u1-l4-f3-01", "u1-l4-f4-01"], "questions": [{"id": "u1-l4-f1-01", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "In a study of note-taking, students who wrote notes by hand recalled more of a lecture a week later than those who typed. Researchers suggested that writing forces students to summarize in their own words, while typing lets them copy verbatim. This suggests that, for long-term recall, handwriting notes may", "stem": "Which choice most logically completes the text?", "choices": {"A": "force students to summarize a lecture in their own words.", "B": "offer some students an advantage over typing for later recall.", "C": "always be better than typing for every student without exception.", "D": "improve students' handwriting over the course of a term."}, "correct": "B", "choice_families": {"A": "Oncul sonuc karisikligi", "C": "Cok guclu", "D": "Metnin disina cikma"}, "why_correct": "The evidence supports a modest advantage for some students, so the hedged completion fits.", "why_wrong": {"A": "This restates a premise already given rather than drawing a new inference.", "C": "Always, every, and without exception overstate what a single study can support.", "D": "Improving handwriting is not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-02", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "A city planted trees along several bare streets. Over the next few summers, residents of those streets reported lower cooling bills than residents of nearby treeless streets. The planners concluded that the shade reduced the need for air conditioning. This suggests that adding street trees may", "stem": "Which choice most logically completes the text?", "choices": {"A": "help lower cooling costs on at least some city streets.", "B": "eliminate the need for air conditioning entirely on every street.", "C": "provide shade to the streets where they are planted.", "D": "raise the property values of the homes along them."}, "correct": "A", "choice_families": {"B": "Cok guclu", "C": "Oncul sonuc karisikligi", "D": "Metnin disina cikma"}, "why_correct": "The evidence supports lower cooling costs for some streets, so the hedged completion fits.", "why_wrong": {"B": "Eliminate entirely and every street overstate what the evidence shows.", "C": "This restates the given premise that trees provide shade rather than inferring.", "D": "Property values are not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-03", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "In an experiment, plants exposed to gentle recorded birdsong grew slightly taller than identical plants kept in silence. The researcher was careful to note that the effect was small and might not hold outside the lab. This suggests that sound may", "stem": "Which choice most logically completes the text?", "choices": {"A": "have produced slightly taller plants in this experiment.", "B": "have a modest effect on the growth of some plants.", "C": "always cause every plant to grow much taller than it otherwise would.", "D": "make plants more resistant to insect pests."}, "correct": "B", "choice_families": {"A": "Oncul sonuc karisikligi", "C": "Cok guclu", "D": "Metnin disina cikma"}, "why_correct": "The researcher stresses the effect is small and uncertain, so the hedged completion fits.", "why_wrong": {"A": "This restates the experiment's result rather than inferring beyond it.", "C": "Always and every plant overstate a small, uncertain effect.", "D": "Resistance to pests is not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-04", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "A bakery began labeling its breads with the farm where the wheat was grown. Sales of those breads rose over the following months, while unlabeled breads sold at their usual rate. The owner believed customers valued knowing the source. This suggests that origin labels may", "stem": "Which choice most logically completes the text?", "choices": {"A": "guarantee that all customers will always choose labeled bread.", "B": "appeal to at least some of the bakery's customers.", "C": "improve the nutritional quality of the bread itself.", "D": "show customers which farm grew the wheat."}, "correct": "B", "choice_families": {"A": "Cok guclu", "C": "Metnin disina cikma", "D": "Oncul sonuc karisikligi"}, "why_correct": "Rising sales support appeal to some customers, so the hedged completion fits.", "why_wrong": {"A": "Guarantee, all, and always overstate what the sales show.", "C": "Nutritional quality is not mentioned; this goes beyond the text.", "D": "This restates the given premise about what labels show rather than inferring."}}, {"id": "u1-l4-f1-05", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Drivers on a highway were shown signs displaying their current speed. In the weeks after the signs went up, average speeds in that stretch dropped. Officials thought seeing their own speed prompted drivers to slow down. This suggests that speed-display signs may", "stem": "Which choice most logically completes the text?", "choices": {"A": "reduce the cost of maintaining the highway surface.", "B": "display each driver's current speed to them.", "C": "force every driver to always obey the speed limit exactly.", "D": "encourage some drivers to reduce their speed."}, "correct": "D", "choice_families": {"A": "Metnin disina cikma", "B": "Oncul sonuc karisikligi", "C": "Cok guclu"}, "why_correct": "Lower average speeds support the idea that some drivers slowed, so the hedged completion fits.", "why_wrong": {"A": "Maintenance cost is not mentioned; this goes beyond the text.", "B": "This restates the given premise about what the signs display rather than inferring.", "C": "Force, every, and always exactly overstate the effect."}}, {"id": "u1-l4-f1-06", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Two groups of workers were given the same task; one worked in a room with a window and one     <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabi kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Dogru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlis.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazinda durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn ghost" data-action="start">Tekrar calis</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
// ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
function startTest(){setMode('test');S.test={q:buildTest(),idx:0,pick:null,rec:[]};showTestQ();}
function showTestQ(){
  const T=S.test,q=T.q[T.idx];T.pick=null;
  main.setAttribute('data-mode','test');railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span><div class="ut">${esc(D.unit_title)}</div><div class="tprog"><div class="tprog-l">Unite Testi</div><div class="tprog-bar"><div class="tprog-fill" style="width:${Math.round(T.idx/T.q.length*100)}%"></div></div><div class="tprog-n">Soru ${T.idx+1} / ${T.q.length}</div></div></div>`;
  app.innerHTML=`<div class="head"><div class="eyebrow">Unite Testi . ${esc(q.lesson_name)}</div><h1>Soru ${T.idx+1}</h1>
     <button class="backbtn" data-action="test-quit">&lsaquo; Testten cik</button></div>
   <div class="pad">
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="test-pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="tnext" data-action="test-next" disabled>${T.idx===T.q.length-1?'Testi bitir':'Sonraki soru'}</button></div></div>`;
  window.scrollTo(0,0);
}
function testPick(x){const T=S.test;T.pick=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('tnext').disabled=false;}
function testNext(){const T=S.test;if(!T.pick)return;const q=T.q[T.idx];T.rec.push({q,picked:T.pick,ok:T.pick===q.correct});T.idx++;if(T.idx>=T.q.length)return testResult();showTestQ();}
function testResult(){
  const T=S.test,rec=T.rec,total=rec.length,score=rec.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  // weak areas by lesson and by family
  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hicbir tuzak ailesinde zayiflik yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Dogru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Gectin':'Biraz daha calisma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Unite Testi . Sonuc</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazinda</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tikla, dogru cevabi ve aciklamayi gor.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn" data-action="nav" data-target="test">Testi tekrar coz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='test-pick')testPick(el.dataset.l);
  else if(a==='test-next')testNext();
  else if(a==='test-quit')lessonView();
  else if(a==='test-review')toggleReview(+el.dataset.i);
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();else if(t==='test')startTest();}});
