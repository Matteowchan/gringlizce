<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="google-adsense-account" content="ca-pub-5818550785641442">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Yazı Geri Bildirimi | Gri English</title>
  <meta name="theme-color" content="#2C5856">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/main.css">
  <script>document.documentElement.setAttribute('data-theme',(function(){try{var t=localStorage.getItem('gri-theme');if(t)return t;}catch(e){}return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';})());</script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/site-config.js" defer></script>
  <script src="assets/theme.js" defer></script>

  <style>
    :root {
      --bg: #F4EFE3; --bg-soft: #EFE8D9; --bg-card: #FFFFFF; --bg-card-soft: #FBF7EE;
      --text: #1A2230; --text-soft: #4A4A48; --text-muted: #6B6862;
      --teal: #2C5856; --teal-dark: #1D4341; --gold: #B89968; --line: #D9D2C4; --line-soft: #E8E1D2;
      --success: #2C7A4E; --error: #B33A3A;
      --cat-grammar: #B33A3A; --cat-grammar-bg: #FBEAEA;
      --cat-vocabulary: #8C5BB3; --cat-vocabulary-bg: #F1E9F8;
      --cat-cohesion: #B89968; --cat-cohesion-bg: #FAF3E5;
      --cat-task_response: #2C5856; --cat-task_response-bg: #E6EEEE;
      --cat-positive: #2C7A4E; --cat-positive-bg: #E8F3EC;
      --cat-other: #6B6862; --cat-other-bg: #EFE8D9;
      --shadow-sm: 0 1px 2px rgba(26,34,48,0.04), 0 1px 3px rgba(26,34,48,0.03);
      --shadow-md: 0 1px 2px rgba(26,34,48,0.04), 0 4px 12px rgba(26,34,48,0.06);
      --shadow-lg: 0 1px 2px rgba(26,34,48,0.04), 0 8px 24px rgba(26,34,48,0.08);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-body: Georgia, 'Times New Roman', serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100vh; }

    .wf-header {
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--line-soft);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(244,239,227,0.92); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 30;
    }
    .wf-brand { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--text); text-decoration: none; }
    .wf-brand em { color: var(--teal); font-style: italic; }
    .wf-back {
      font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-soft); text-decoration: none; padding: 0.5rem 0.9rem;
      border: 1px solid var(--line); border-radius: 5px; background: var(--bg-card); font-weight: 600;
    }
    .wf-back:hover { background: var(--bg-card-soft); color: var(--text); }

    .wf-main {
      display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem;
      max-width: 1200px; margin: 0 auto; padding: 1.5rem;
    }

    .wf-left { min-width: 0; }

    .wf-info {
      background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 10px;
      padding: 1.2rem 1.4rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm);
    }
    .wf-info-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 600; }
    .wf-info-title { font-family: var(--font-display); font-size: 1.55rem; font-weight: 600; color: var(--text); margin: 0 0 0.4rem; line-height: 1.2; }
    .wf-info-meta { font-family: var(--font-ui); font-size: 0.82rem; color: var(--text-muted); display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .wf-info-meta strong { color: var(--text); font-weight: 600; }
    .wf-info-meta-sep { color: var(--line); }

    .wf-prompt-box {
      background: var(--bg-card-soft); border: 1px solid var(--line-soft); border-radius: 8px;
      padding: 1rem 1.2rem; margin-bottom: 1rem;
      font-family: var(--font-body); font-size: 0.95rem; line-height: 1.55; color: var(--text-soft);
      white-space: pre-wrap;
    }
    .wf-prompt-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 0.5rem; }

    .wf-writing-box {
      background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
      padding: 1.8rem 2rem; box-shadow: var(--shadow-md);
    }
    .wf-writing-text {
      font-family: var(--font-body); font-size: 1.06rem; line-height: 1.75; color: var(--text);
      white-space: pre-wrap; word-wrap: break-word; user-select: text;
    }
    .wf-writing-text mark {
      padding: 1px 2px; border-radius: 2px; cursor: pointer;
      background-color: var(--cat-bg, #FAF3E5);
      border-bottom: 2px solid var(--cat-color, var(--gold));
      color: inherit; transition: filter 0.15s;
    }
    .wf-writing-text mark:hover { filter: brightness(0.94); }
    .wf-writing-text mark.active { box-shadow: 0 0 0 2px var(--cat-color); }

    /* Right rail */
    .wf-right { position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; }

    .wf-rubric-box {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-soft) 100%);
      border: 1px solid var(--line-soft); border-radius: 10px;
      padding: 1.4rem; box-shadow: var(--shadow-md); margin-bottom: 1rem;
      text-align: center;
    }
    .wf-rubric-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 0.4rem; }
    .wf-overall {
      font-family: var(--font-display); font-size: 3.6rem; font-weight: 600; color: var(--teal);
      line-height: 1; letter-spacing: -0.02em; margin: 0.6rem 0;
    }
    .wf-overall-unit { font-family: var(--font-ui); font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    .wf-rubric-table {
      width: 100%; border-top: 1px solid var(--line-soft); padding-top: 1rem; margin-top: 0.5rem;
      text-align: left;
    }
    .wf-rubric-row { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--line-soft); }
    .wf-rubric-row:last-child { border-bottom: none; }
    .wf-rubric-row-label { font-family: var(--font-ui); font-size: 0.84rem; color: var(--text-soft); }
    .wf-rubric-row-val { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--text); }

    .wf-summary-box {
      background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 10px;
      padding: 1.2rem; box-shadow: var(--shadow-sm); margin-bottom: 1rem;
    }
    .wf-summary-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 0.6rem; }
    .wf-summary-text { font-family: var(--font-body); font-size: 0.95rem; line-height: 1.55; color: var(--text); white-space: pre-wrap; }

    .wf-comments-box {
      background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 10px;
      padding: 1.2rem; box-shadow: var(--shadow-sm);
    }
    .wf-comments-title { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 0.8rem; }
    .wf-comment-item {
      padding: 0.7rem 0.8rem; margin-bottom: 0.5rem; border-radius: 6px;
      background: var(--bg); border-left: 3px solid var(--cat-color, var(--gold));
      cursor: pointer; transition: background 0.15s;
    }
    .wf-comment-item:hover { background: var(--bg-card-soft); }
    .wf-comment-item-cat {
      display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
      background: var(--cat-bg, var(--bg-soft)); color: var(--cat-color, var(--text-soft));
      font-family: var(--font-ui); font-size: 9px; letter-spacing: 0.12em;
      text-transform: uppercase; font-weight: 700; margin-bottom: 0.4rem;
    }
    .wf-comment-item-sel {
      font-family: var(--font-body); font-size: 0.82rem; font-style: italic;
      color: var(--text-muted); margin-bottom: 0.3rem;
    }
    .wf-comment-item-text { font-family: var(--font-body); font-size: 0.92rem; line-height: 1.5; color: var(--text); }

    .wf-pending {
      background: var(--bg-card-soft); border: 1px dashed var(--line); border-radius: 10px;
      padding: 1.6rem; text-align: center;
    }
    .wf-pending-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 0.5rem; }
    .wf-pending-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin: 0 0 0.5rem; color: var(--text); }
    .wf-pending-text { font-family: var(--font-body); font-size: 0.9rem; color: var(--text-muted); margin: 0; line-height: 1.5; }

    .wf-msg { text-align: center; padding: 3rem 1rem; font-family: var(--font-body); color: var(--text-muted); }
    .wf-msg.error { color: var(--error); }

    @media (max-width: 960px) {
      .wf-main { grid-template-columns: 1fr; }
      .wf-right { position: static; max-height: none; }
    }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gri English">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .catch(function(err){ console.warn('[PWA] SW register failed:', err); });
      });
    }
  </script>
</head>
<body>

<header class="wf-header">
  <a href="panelim.html" class="wf-brand">Gri <em>English</em></a>
  <a href="panelim.html" class="wf-back">← Masama Dön</a>
</header>

<main class="wf-main" id="wf-main">
  <div style="grid-column: 1 / -1;"><p class="wf-msg">Yükleniyor...</p></div>
</main>

<script>
(async function () {
  var SUPABASE_URL = window.SUPABASE_URL || 'https://vazbvbqgvtlaqkytfsbi.supabase.co';
  var SUPABASE_KEY = window.SUPABASE_KEY || 'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g';
  if (!window.supabase || !window.supabase.createClient) {
    document.getElementById('wf-main').innerHTML = '<div style="grid-column:1/-1;"><p class="wf-msg error">Supabase yüklenemedi.</p></div>';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var sess = await sb.auth.getSession();
  if (!sess.data.session) {
    window.location.href = 'giris.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  var params = new URLSearchParams(window.location.search);
  var writingId = params.get('id');
  if (!writingId) {
    document.getElementById('wf-main').innerHTML = '<div style="grid-column:1/-1;"><p class="wf-msg error">Yazı ID eksik.</p></div>';
    return;
  }

  function esc(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s);
    return d.toLocaleDateString('tr-TR', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  var RUBRIC_LABELS = {
    generic: { label: 'Genel', criteria: {}, unit: '' },
    ielts_task1: {
      label: 'IELTS Task 1',
      criteria: {
        task_achievement: 'Task Achievement',
        coherence_cohesion: 'Coherence & Cohesion',
        lexical_resource: 'Lexical Resource',
        grammar: 'Grammar'
      },
      unit: 'Band'
    },
    ielts_task2: {
      label: 'IELTS Task 2',
      criteria: {
        task_response: 'Task Response',
        coherence_cohesion: 'Coherence & Cohesion',
        lexical_resource: 'Lexical Resource',
        grammar: 'Grammar'
      },
      unit: 'Band'
    },
    ib_english_b: {
      label: 'IB English B',
      criteria: {
        language: 'Language',
        message: 'Message',
        conceptual: 'Conceptual Understanding'
      },
      unit: '/ 30'
    },
    toefl_writing: {
      label: 'TOEFL Writing',
      criteria: { overall: 'Holistic Score' },
      unit: '/ 5'
    }
  };

  function CAT_INFO(cat) {
    var info = {
      grammar: { label: 'Grammar', color: 'var(--cat-grammar)', bg: 'var(--cat-grammar-bg)' },
      vocabulary: { label: 'Vocabulary', color: 'var(--cat-vocabulary)', bg: 'var(--cat-vocabulary-bg)' },
      cohesion: { label: 'Cohesion', color: 'var(--cat-cohesion)', bg: 'var(--cat-cohesion-bg)' },
      task_response: { label: 'Task', color: 'var(--cat-task_response)', bg: 'var(--cat-task_response-bg)' },
      positive: { label: 'Pozitif', color: 'var(--cat-positive)', bg: 'var(--cat-positive-bg)' },
      other: { label: 'Diğer', color: 'var(--cat-other)', bg: 'var(--cat-other-bg)' }
    };
    return info[cat] || info.other;
  }

  var mainEl = document.getElementById('wf-main');
  try {
    var r = await sb.rpc('get_writing_detail', { p_writing_id: writingId });
    if (r.error) throw r.error;
    var data = r.data || {};
    var w = data.writing || {};
    var ev = data.evaluation;
    var comments = data.comments || [];

    var rubricInfo = RUBRIC_LABELS[ev ? ev.rubric_type : 'generic'] || RUBRIC_LABELS.generic;

    // Sol panel (yazı)
    var promptHtml = w.prompt_snapshot
      ? '<div class="wf-prompt-box"><div class="wf-prompt-eyebrow">Prompt</div>' + esc(w.prompt_snapshot) + '</div>'
      : '';

    // IELTS Task 1: görsel
    var ac = w.assignment_config;
    if (ac && ac.image_url) {
      if (ac.image_type === 'pdf') {
        promptHtml += '<div class="wf-prompt-box" style="border-left:3px solid var(--gold);">'
          + '<div class="wf-prompt-eyebrow">Görsel (PDF)</div>'
          + '<iframe src="' + ac.image_url + '" style="width:100%; height:420px; border:1px solid var(--line); border-radius:4px; margin-top:0.4rem;"></iframe>'
          + '<a href="' + ac.image_url + '" target="_blank" rel="noopener" style="display:inline-block; margin-top:0.5rem; font-family:var(--font-ui); font-size:0.82rem; color:var(--teal);">PDF\'yi yeni sekmede aç →</a>'
        + '</div>';
      } else {
        promptHtml += '<div class="wf-prompt-box" style="border-left:3px solid var(--gold);">'
          + '<div class="wf-prompt-eyebrow">Görsel</div>'
          + '<a href="' + ac.image_url + '" target="_blank" rel="noopener"><img src="' + ac.image_url + '" alt="Task 1 görseli" style="max-width:100%; height:auto; border:1px solid var(--line); border-radius:4px; display:block; margin-top:0.4rem;"></a>'
        + '</div>';
      }
    }

    // Yazı + yorumlar
    var text = w.text || '';
    var sortedComments = comments.slice().sort(function (a, b) { return a.start_offset - b.start_offset; });
    var chunks = [];
    var pos = 0;
    sortedComments.forEach(function (c) {
      if (c.start_offset > pos) chunks.push({ text: text.slice(pos, c.start_offset), comment: null });
      var s = Math.max(c.start_offset, pos);
      var e = c.end_offset;
      if (e > s) chunks.push({ text: text.slice(s, e), comment: c });
      pos = Math.max(pos, e);
    });
    if (pos < text.length) chunks.push({ text: text.slice(pos), comment: null });

    var textHtml = chunks.map(function (ch) {
      if (ch.comment) {
        var info = CAT_INFO(ch.comment.category);
        return '<mark data-comment-id="' + esc(ch.comment.id) + '" style="--cat-color:' + info.color + ';--cat-bg:' + info.bg + ';">' + esc(ch.text) + '</mark>';
      }
      return esc(ch.text);
    }).join('');

    // Sağ panel
    var rightHtml = '';
    if (ev) {
      rightHtml += ''
        + '<div class="wf-rubric-box">'
          + '<div class="wf-rubric-eyebrow">' + esc(rubricInfo.label) + '</div>'
          + '<div class="wf-overall">' + (ev.overall_band != null ? ev.overall_band : '—') + '</div>'
          + '<div class="wf-overall-unit">' + esc(rubricInfo.unit) + '</div>';

      var critKeys = Object.keys(rubricInfo.criteria);
      if (critKeys.length > 0 && ev.scores) {
        rightHtml += '<div class="wf-rubric-table">'
          + critKeys.map(function (k) {
              var v = ev.scores[k];
              return '<div class="wf-rubric-row">'
                + '<span class="wf-rubric-row-label">' + esc(rubricInfo.criteria[k]) + '</span>'
                + '<span class="wf-rubric-row-val">' + (v != null && v !== '' ? v : '—') + '</span>'
              + '</div>';
            }).join('')
          + '</div>';
      }
      rightHtml += '</div>';

      if (ev.summary_feedback) {
        rightHtml += '<div class="wf-summary-box">'
          + '<div class="wf-summary-eyebrow">Genel Geri Bildirim</div>'
          + '<div class="wf-summary-text">' + esc(ev.summary_feedback) + '</div>'
        + '</div>';
      }
    } else {
      rightHtml += ''
        + '<div class="wf-pending">'
          + '<div class="wf-pending-eyebrow">Bekliyor</div>'
          + '<h3 class="wf-pending-title">Henüz değerlendirilmedi</h3>'
          + '<p class="wf-pending-text">Öğretmenin yazını okuduktan sonra burada rubric skoru ve geri bildirim göreceksin.</p>'
        + '</div>';
    }

    // Yorumlar listesi (sağda)
    if (comments.length > 0) {
      rightHtml += '<div class="wf-comments-box">'
        + '<div class="wf-comments-title">Yorumlar (' + comments.length + ')</div>'
        + sortedComments.map(function (c) {
            var info = CAT_INFO(c.category);
            return '<div class="wf-comment-item" data-id="' + esc(c.id) + '" style="--cat-color:' + info.color + ';--cat-bg:' + info.bg + ';">'
              + '<span class="wf-comment-item-cat">' + info.label + '</span>'
              + (c.selected_text ? '<div class="wf-comment-item-sel">"' + esc(c.selected_text.slice(0, 60)) + (c.selected_text.length > 60 ? '…' : '') + '"</div>' : '')
              + '<div class="wf-comment-item-text">' + esc(c.body) + '</div>'
            + '</div>';
          }).join('')
      + '</div>';
    }

    mainEl.innerHTML = ''
      + '<div class="wf-left">'
        + '<div class="wf-info">'
          + '<div class="wf-info-eyebrow">' + esc((w.exam || '').toUpperCase()) + (w.text_type ? ' · <span lang="en">' + esc(w.text_type) + '</span>' : '') + '</div>'
          + '<h1 class="wf-info-title">' + esc(w.assignment_title || w.prompt_title || 'Yazım') + '</h1>'
          + '<div class="wf-info-meta">'
            + '<span><strong>' + (w.word_count || 0) + '</strong> kelime</span>'
            + '<span class="wf-info-meta-sep">·</span>'
            + '<span>' + esc(fmtDate(w.created_at)) + '</span>'
            + (ev ? '<span class="wf-info-meta-sep">·</span><span style="color:var(--success); font-weight:600;">Değerlendirildi</span>' : '')
          + '</div>'
        + '</div>'
        + promptHtml
        + '<div class="wf-writing-box">'
          + '<div class="wf-writing-text" id="wf-text">' + textHtml + '</div>'
        + '</div>'
      + '</div>'
      + '<aside class="wf-right">' + rightHtml + '</aside>';

    // Yorum tıklama → ilgili yorum item'ını highlight
    document.querySelectorAll('.wf-writing-text mark[data-comment-id]').forEach(function (m) {
      m.addEventListener('click', function () {
        var cid = m.dataset.commentId;
        var item = document.querySelector('.wf-comment-item[data-id="' + cid + '"]');
        if (item) {
          item.scrollIntoView({ behavior: 'smooth', block: 'center' });
          item.style.transition = 'background 0.3s';
          item.style.background = 'var(--bg-soft)';
          setTimeout(function () { item.style.background = ''; }, 1200);
        }
      });
    });
    document.querySelectorAll('.wf-comment-item').forEach(function (item) {
      item.addEventListener('click', function () {
        var cid = item.dataset.id;
        var mark = document.querySelector('mark[data-comment-id="' + cid + '"]');
        if (mark) {
          mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
          document.querySelectorAll('mark.active').forEach(function (m) { m.classList.remove('active'); });
          mark.classList.add('active');
          setTimeout(function () { mark.classList.remove('active'); }, 2000);
        }
      });
    });

  } catch (err) {
    mainEl.innerHTML = '<div style="grid-column:1/-1;"><p class="wf-msg error">Yüklenemedi: ' + esc(err.message || err) + '</p></div>';
  }

})();
</script>

</body>
</html>
