<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#6A3D7A; --accent-deep:#472651; --accent-soft:#E7DAEE; --panel:#EFE6F3;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
:root[data-theme="dark"]{--bg:#15151c;--ink:#ECEDF2;--muted:#9498a6;--line:#2b2b36;--paper:#1e1e27;--card:#1e1e27;--panel:#262633;--accent-soft:rgba(255,255,255,.07);--accent-deep:var(--accent);--good-soft:rgba(31,169,113,.16);--wrong-soft:rgba(216,80,63,.16);}
:root[data-theme="dark"] .note,:root[data-theme="dark"] .given,:root[data-theme="dark"] .task,:root[data-theme="dark"] .plan .pf,:root[data-theme="dark"] .rec,:root[data-theme="dark"] .grifb,:root[data-theme="dark"] .rlink:hover{background:#22232e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--card);opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--card)}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:13px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:9px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:7px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}

.grifb{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#F7F8FA;font-family:Inter,sans-serif;font-size:14px;line-height:1.55}

.grifb.err{background:var(--wrong-soft);border-color:#F1D4CD;color:#8a382f}

.grifb .gcrit b{color:var(--accent-deep)}
.grifb .gsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.grifb .gmis{font-size:13.5px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.grifb .gmis .o{color:var(--wrong);text-decoration:line-through}
.grifb .gmis .c{color:#166a4a;font-weight:700}

<script id="data" type="application/json">{"title": "YDS / YÖKDİL", "badge": "YDS", "groups": ["Öğren", "Drilller", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "YDS / YÖKDİL Yapısı", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "YDS ve YÖKDİL akademik İngilizce yeterlik sınavlarıdır. Seksen soru, beş şıklı. Kelime akademiktir, YÖKDİL'de Fen, Sosyal ve Sağlık alanlarına göre değişir. Soru tipleri YDT'ye benzer ama seviye daha yüksektir."}, {"t": "table", "head": ["Soru tipi", "Odak"], "rows": [["Kelime ve dilbilgisi", "Akademik kelime, edat, fiil yapıları."], ["Cloze test", "Akademik paragrafta boşluklar."], ["Cümle tamamlama", "Anlam ve dilbilgisiyle tutarlı tamamlama."], ["Çeviri", "İngilizce-Türkçe ve tersi."], ["Paragraf", "Boşluk, akışı bozan cümle, anlamca en yakın."], ["Diyalog tamamlama", "Konuşmadaki boşluğa en uygun cevap."]]}, {"t": "note", "k": "ipucu", "title": "Puanlama", "lines": ["YDS ve YOKDIL 80 sorudur, her soru 1.25 puan, toplam 100 uzerinden. Yanlisin cezasi yoktur.", "Kelime bilgisi belirleyicidir; sadece dilbilgisi yetmez."]}, {"t": "note", "k": "ipucu", "title": "Strateji", "lines": ["Akademik kelime YDS'nin belkemiğidir. Kelime bilmeden dilbilgisi tek başına yetmez.", "Bağlaç ve geçiş sorularında cümleler arası mantık ilişkisini bul.", "Cloze ve paragrafta bütünü gör, tek cümleye takılma."]}]}, {"id": "kelime", "group": "Drilller", "name": "Akademik Kelime", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Cümleye anlamca en uygun akademik kelimeyi seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "The findings of the new study are ______ with those of earlier research.", "choices": {"A": "consistent", "B": "reluctant", "C": "hostile", "D": "vague", "E": "scarce"}, "ans": "A", "why": "consistent with = ile tutarlı, uyumlu. Bulgular öncekiyle tutarlı.", "slug": "gri-mod-yds-kelime-1-1"}, {"n": 2, "stem": "The government introduced strict measures to ______ the spread of the disease.", "choices": {"A": "accelerate", "B": "reveal", "C": "curb", "D": "postpone", "E": "tolerate"}, "ans": "C", "why": "curb = dizginlemek, sınırlamak. Yayılmayı sınırlamak.", "slug": "gri-mod-yds-kelime-1-2"}, {"n": 3, "stem": "Access to clean drinking water remains ______ in many rural areas.", "choices": {"A": "abundant", "B": "durable", "C": "obvious", "D": "flexible", "E": "scarce"}, "ans": "E", "why": "scarce = kıt, az bulunur. Temiz suya erişim kıt.", "slug": "gri-mod-yds-kelime-1-3"}, {"n": 4, "stem": "The long-held theory was widely ______ after contradictory evidence emerged.", "choices": {"A": "accepted", "B": "confirmed", "C": "praised", "D": "repeated", "E": "challenged"}, "ans": "E", "why": "challenged = sorgulanmak, itiraz edilmek. Çelişen kanıtla teori sorgulandı.", "slug": "gri-mod-yds-kelime-1-4"}, {"n": 5, "stem": "Her work made a ______ contribution to the field of genetics.", "choices": {"A": "trivial", "B": "reluctant", "C": "significant", "D": "temporary", "E": "vague"}, "ans": "C", "why": "significant = önemli, kayda değer. Önemli katkı.", "slug": "gri-mod-yds-kelime-1-5"}, {"n": 6, "stem": "The two explanations are not mutually ______; both may be true at once.", "choices": {"A": "beneficial", "B": "exclusive", "C": "evident", "D": "abundant", "E": "reluctant"}, "ans": "B", "why": "mutually exclusive = birbirini dışlayan. İkisi aynı anda doğru olabiliyorsa birbirini dışlamaz.", "slug": "gri-mod-yds-kelime-1-6"}]}]}, {"id": "dilbilgisi", "group": "Drilller", "name": "Dilbilgisi", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Akademik yapılarda doğru seçeneği bul."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "The experiment ______ several times before reliable results were obtained.", "choices": {"A": "has repeated", "B": "had to be repeated", "C": "repeats", "D": "is repeating", "E": "will repeat"}, "ans": "B", "why": "Deney 'tekrarlanmak zorunda kaldı' (edilgen, geçmiş): had to be repeated.", "slug": "gri-mod-yds-dilbilgisi-1-1"}, {"n": 2, "stem": "It is essential that every sample ______ labelled correctly before analysis.", "choices": {"A": "is", "B": "being", "C": "was", "D": "will be", "E": "be"}, "ans": "E", "why": "essential that ... yapısında subjunctive: yalın fiil be.", "slug": "gri-mod-yds-dilbilgisi-1-2"}, {"n": 3, "stem": "The more we study the brain, ______ we realize how little we know.", "choices": {"A": "as more", "B": "more", "C": "the most", "D": "the more", "E": "than more"}, "ans": "D", "why": "the more ... the more karşılaştırma kalıbı. İkinci kısım da the more.", "slug": "gri-mod-yds-dilbilgisi-1-3"}, {"n": 4, "stem": "Not until the twentieth century ______ this phenomenon fully understood.", "choices": {"A": "did", "B": "had", "C": "was", "D": "has", "E": "is"}, "ans": "C", "why": "Not until ... başa gelince devrik yapı (inversion): was this phenomenon understood.", "slug": "gri-mod-yds-dilbilgisi-1-4"}, {"n": 5, "stem": "The results, ______ were unexpected, have since been published.", "choices": {"A": "that", "B": "which", "C": "who", "D": "what", "E": "whose"}, "ans": "B", "why": "Virgülle ayrılan (nonrestrictive) yan cümlede which. that virgülle kullanılmaz.", "slug": "gri-mod-yds-dilbilgisi-1-5"}, {"n": 6, "stem": "______ carefully, the data revealed a pattern no one had noticed.", "choices": {"A": "Analyzing", "B": "Analyzed", "C": "To analyze", "D": "Analyze", "E": "Analyzes"}, "ans": "B", "why": "Veri 'incelendi' (edilgen), geçmiş ortaç: Analyzed carefully, the data...", "slug": "gri-mod-yds-dilbilgisi-1-6"}]}]}, {"id": "baglac", "group": "Drilller", "name": "Bağlaçlar", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Cümleler arası mantık ilişkisine uygun bağlacı seç. YDS'nin en yoğun alanı."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "______ its high cost, the new treatment has become widely used.", "choices": {"A": "Despite", "B": "Because of", "C": "Although", "D": "Owing to", "E": "So that"}, "ans": "A", "why": "Despite + isim öbeği (its high cost), zıtlık. Although cümle isterdi.", "slug": "gri-mod-yds-baglac-1-1"}, {"n": 2, "stem": "The bridge was reinforced ______ it could withstand strong earthquakes.", "choices": {"A": "because of", "B": "although", "C": "despite", "D": "so that", "E": "unless"}, "ans": "D", "why": "Amaç bağlacı: so that (yapabilsin diye).", "slug": "gri-mod-yds-baglac-1-2"}, {"n": 3, "stem": "______ the sample size was small, the results were statistically significant.", "choices": {"A": "Although", "B": "Despite", "C": "Because of", "D": "Owing to", "E": "So as"}, "ans": "A", "why": "Although + cümle, zıtlık. Küçük örnekleme rağmen anlamlı.", "slug": "gri-mod-yds-baglac-1-3"}, {"n": 4, "stem": "The drug is highly effective; ______, it can cause serious side effects.", "choices": {"A": "however", "B": "therefore", "C": "thus", "D": "moreover", "E": "hence"}, "ans": "A", "why": "Zıtlık geçişi: however. Etkili ama yan etkili.", "slug": "gri-mod-yds-baglac-1-4"}, {"n": 5, "stem": "Sea levels are rising rapidly; ______, coastal cities face growing risks.", "choices": {"A": "however", "B": "nevertheless", "C": "whereas", "D": "consequently", "E": "although"}, "ans": "D", "why": "Sebep-sonuç: consequently (sonuç olarak).", "slug": "gri-mod-yds-baglac-1-5"}, {"n": 6, "stem": "______ growing public awareness, global plastic use continues to increase.", "choices": {"A": "Although", "B": "Because", "C": "Despite", "D": "Since", "E": "So that"}, "ans": "C", "why": "Despite + isim öbeği (growing awareness). Farkındalığa rağmen artıyor.", "slug": "gri-mod-yds-baglac-1-6"}]}]}, {"id": "cumletam", "group": "Drilller", "name": "Cümle Tamamlama", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Yarım akademik cümleyi hem anlamca hem dilbilgisiyle tamamlayan şıkkı seç. Bütün şıklar makul görünür; mantık ve baştaki bağlaç doğru olanı belirler."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Although the initial results appeared promising, ______", "choices": {"A": "because the funding was suddenly withdrawn last year", "B": "the researchers therefore published them without delay", "C": "subsequent trials failed to reproduce the same effect", "D": "so that the hypothesis could finally be confirmed", "E": "unless further data had been collected much earlier"}, "ans": "C", "why": "Although zıtlık ister: umut verici görünse de sonraki denemeler tekrarlayamadı. Tam bir ana cümle gerekir.", "slug": "gri-mod-yds-cumletam-1"}, {"n": 2, "stem": "The theory eventually gained wide acceptance ______", "choices": {"A": "only after decades of accumulated supporting evidence", "B": "although no one had ever tested its main predictions", "C": "because it was immediately rejected by leading experts", "D": "so that the original data could quietly be discarded", "E": "unless the underlying model was fundamentally flawed"}, "ans": "A", "why": "Kabul görme, biriken kanıtla mantıklı biçimde bağlanır. B/C çelişir, D/E mantıksız.", "slug": "gri-mod-yds-cumletam-2"}, {"n": 3, "stem": "______, the population of the species has declined sharply.", "choices": {"A": "Because the new habitat proved to be entirely safe", "B": "So that unregulated hunting could freely continue", "C": "Unless conservation efforts are finally abandoned", "D": "In order to protect the surrounding fragile ecosystem", "E": "Despite considerable international conservation efforts"}, "ans": "E", "why": "Başta zıtlık: çabalara rağmen azaldı. Despite + isim öbeği. Diğerleri ana cümleyle çelişir.", "slug": "gri-mod-yds-cumletam-3"}, {"n": 4, "stem": "Not only did the reform reduce administrative costs, ______", "choices": {"A": "but it also was improving the total annual budget", "B": "but it also improved the quality of public services", "C": "and it also has reduced the number of complaints", "D": "so it also had been widely criticised by the press", "E": "because it also raised several serious legal concerns"}, "ans": "B", "why": "Not only ... but also ... kalıbı. İkinci kısım 'but it also + geçmiş fiil' ile paralel gelir.", "slug": "gri-mod-yds-cumletam-4"}, {"n": 5, "stem": "The data were collected over a ten-year period ______", "choices": {"A": "so that the final sample remained extremely small", "B": "although the whole study lasted only a single week", "C": "because the available funding had already run out", "D": "in order to capture long-term seasonal variations", "E": "unless the participants suddenly withdrew consent"}, "ans": "D", "why": "On yıl toplama amacı: uzun vadeli değişimleri yakalamak (in order to). Diğerleri süreyle çelişir.", "slug": "gri-mod-yds-cumletam-5"}, {"n": 6, "stem": "______ the evidence remains inconclusive, many scientists still support the hypothesis.", "choices": {"A": "In spite of", "B": "Because of", "C": "Even though", "D": "So as to", "E": "No sooner"}, "ans": "C", "why": "Zıtlık cümlesi: kanıt yetersiz olsa da destekliyorlar. Even though + cümle. A/B isim öbeği ister.", "slug": "gri-mod-yds-cumletam-6"}]}]}, {"id": "restatement", "group": "Drilller", "name": "Restatement (Eşdeğer Cümle)", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Verilen akademik cümleyle anlamca en yakın (aynı) cümleyi seç. Kalıpların (would have, cannot rule out, far from...) anlamını iyi bil; şıklar benzer uzunluktadır."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "The project would have succeeded if it had received adequate funding.", "choices": {"A": "The project succeeded because it was very well funded.", "B": "A lack of adequate funding caused the project to fail.", "C": "The project will certainly succeed once it is funded.", "D": "The project failed even though it was well funded.", "E": "Adequate funding rarely leads to a successful project."}, "ans": "B", "why": "Type 3 koşul: yeterli fon almadı, bu yüzden başarısız oldu.", "slug": "gri-mod-yds-restatement-1"}, {"n": 2, "stem": "Scarcely had the ceremony begun when the power suddenly went out.", "choices": {"A": "The power went out long before the ceremony began.", "B": "The ceremony was cancelled because of the power cut.", "C": "The power rarely goes out during official ceremonies.", "D": "As soon as the ceremony began, the power went out.", "E": "The ceremony began only after the power had returned."}, "ans": "D", "why": "Scarcely had ... when ... = -er -mez. Tören başlar başlamaz elektrik gitti.", "slug": "gri-mod-yds-restatement-2"}, {"n": 3, "stem": "The results of the experiment are far from conclusive.", "choices": {"A": "The results of the experiment are not conclusive at all.", "B": "The results of the experiment are almost fully conclusive.", "C": "The results of the experiment are surprisingly conclusive.", "D": "The results of the experiment will soon become conclusive.", "E": "These are the most conclusive results obtained so far."}, "ans": "A", "why": "far from = hiç de değil. Sonuçlar hiç kesin değil.", "slug": "gri-mod-yds-restatement-3"}, {"n": 4, "stem": "Researchers cannot rule out the possibility of measurement error.", "choices": {"A": "Researchers have finally proven that no error exists.", "B": "Researchers strongly deny that any error is possible.", "C": "Researchers have already removed every single possible source of error.", "D": "Researchers are now certain the results contain errors.", "E": "Researchers admit that measurement error is still possible."}, "ans": "E", "why": "cannot rule out = ihtimalini dışlayamaz, yani hâlâ mümkün olduğunu kabul eder.", "slug": "gri-mod-yds-restatement-4"}, {"n": 5, "stem": "Had the warning been issued earlier, the damage could have been prevented.", "choices": {"A": "The warning was issued early, so no damage occurred at all.", "B": "The damage occurred although an early warning was issued.", "C": "Because the warning was issued late, the damage was not prevented.", "D": "The warning will certainly prevent the damage next time.", "E": "Early warnings rarely manage to prevent this particular kind of serious damage."}, "ans": "C", "why": "Devrik Type 3: uyarı geç yapıldı, bu yüzden hasar önlenemedi.", "slug": "gri-mod-yds-restatement-5"}, {"n": 6, "stem": "No sooner had the drug been approved than serious side effects were reported.", "choices": {"A": "As soon as the drug was approved, side effects were reported.", "B": "The drug was approved because no side effects were reported.", "C": "Side effects were reported long before the drug's approval.", "D": "The drug was never approved because of its side effects.", "E": "Side effects are rarely reported for newly approved drugs."}, "ans": "A", "why": "No sooner ... than ... = -er -mez. İlaç onaylanır onaylanmaz yan etkiler bildirildi.", "slug": "gri-mod-yds-restatement-6"}]}]}, {"id": "ceviri", "group": "Drilller", "name": "Çeviri", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Akademik cümlelerde İngilizce-Türkçe ve tersi en doğru çeviriyi seç. Anlamı bozan veya özne-nesne yer değiştiren şıklar tuzaktır; hepsi benzer uzunluktadır."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "En iyi çeviri: 'Recent studies suggest that sleep deprivation impairs long-term memory.'", "choices": {"A": "Son çalışmalar, uzun süreli hafızanın uyku yoksunluğuna yol açtığını öne sürüyor.", "B": "Uyku yoksunluğu, son çalışmalarda uzun süreli hafızayı belirgin biçimde güçlendirmektedir.", "C": "Son çalışmalar, uyku yoksunluğunun uzun süreli hafızayı zayıflattığını öne sürüyor.", "D": "Son çalışmalar, uzun süreli hafızanın uyku düzenini ciddi biçimde engellediğini gösteriyor.", "E": "Uzun süreli hafıza, son çalışmalara göre uyku yoksunluğunu giderek azaltmaktadır."}, "ans": "C", "why": "impairs = zayıflatır; suggest = öne sürüyor. Özne uyku yoksunluğu, nesne hafıza.", "slug": "gri-mod-yds-ceviri-1"}, {"n": 2, "stem": "En iyi çeviri: 'The correlation between the two variables does not imply causation.'", "choices": {"A": "İki değişken arasındaki nedensellik, aralarındaki korelasyonu zorunlu kılmaz.", "B": "İki değişken arasındaki korelasyon, aralarında nedensellik olduğunu ima etmez.", "C": "İki değişken arasında ne korelasyon ne de bir nedensellik ilişkisi vardır.", "D": "Nedensellik, iki değişken arasındaki güçlü korelasyonu kesin olarak kanıtlar.", "E": "İki değişken korele değilse aralarında hiçbir nedensellik ilişkisi bulunmaz."}, "ans": "B", "why": "correlation does not imply causation = korelasyon nedenselliği ima etmez. Klasik kalıp.", "slug": "gri-mod-yds-ceviri-2"}, {"n": 3, "stem": "En iyi çeviri: 'Critics argue that the policy disproportionately affects low-income families.'", "choices": {"A": "Eleştirmenler, düşük gelirli ailelerin bu politikayı orantısız biçimde etkilediğini savunuyor.", "B": "Düşük gelirli aileler, bu politikanın eleştirmenleri orantısız biçimde etkilediğini söylüyor.", "C": "Bu politika, düşük gelirli aileleri eleştirmenlerin baskısından etkili biçimde koruyor.", "D": "Eleştirmenlere göre bu politika bütün gelir gruplarını tamamen eşit biçimde etkiliyor.", "E": "Eleştirmenler, bu politikanın düşük gelirli aileleri orantısız biçimde etkilediğini savunuyor."}, "ans": "E", "why": "disproportionately affects = orantısız etkiler; özne politika, nesne düşük gelirli aileler.", "slug": "gri-mod-yds-ceviri-3"}, {"n": 4, "stem": "Best English translation: 'Kentleşme arttıkça tarım için kullanılabilir arazi giderek azalıyor.'", "choices": {"A": "As urbanisation increases, the land available for agriculture is steadily shrinking.", "B": "Agriculture steadily increases as the land available for urbanisation keeps shrinking.", "C": "Urbanisation gradually shrinks whenever agricultural land steadily begins to increase.", "D": "The land available for agriculture rarely shrinks despite the rapid urbanisation.", "E": "Increasing agricultural land greatly reduces the amount of urbanisation available."}, "ans": "A", "why": "arttıkça = as ... increases; azalıyor = is shrinking. Özne kentleşme.", "slug": "gri-mod-yds-ceviri-4"}, {"n": 5, "stem": "Best English translation: 'Araştırmacılar, elde edilen verilerin daha geniş bir örneklemle doğrulanması gerektiğini vurguluyor.'", "choices": {"A": "The researchers had already verified all the obtained data using a considerably smaller sample.", "B": "A wider sample was finally used because the researchers had verified the data.", "C": "The data clearly confirmed that a wider sample of researchers was truly needed.", "D": "The researchers stress that the data obtained must be verified with a wider sample.", "E": "The researchers already have more than enough data to verify the wider sample."}, "ans": "D", "why": "vurguluyor = stress; doğrulanması gerektiğini = must be verified; daha geniş örneklem = wider sample.", "slug": "gri-mod-yds-ceviri-5"}, {"n": 6, "stem": "Best English translation: 'Yeni yasa, üniversitelerin araştırma bütçelerini önemli ölçüde artırmayı amaçlıyor.'", "choices": {"A": "Universities have significantly increased the research budget created by the new law.", "B": "The new law aims to significantly increase the research budgets of universities.", "C": "The new law is expected to significantly reduce the research budgets of universities.", "D": "Universities themselves aim to change the research budget set by the recent new law.", "E": "The growing research budget eventually created a significant new law for universities."}, "ans": "B", "why": "amaçlıyor = aims to; artırmayı = increase; özne yeni yasa, nesne araştırma bütçeleri.", "slug": "gri-mod-yds-ceviri-6"}]}]}, {"id": "paragraf", "group": "Drilller", "name": "Paragraf", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Akademik paragraf soruları: boş bırakılan cümleyi bul, akışı bozan cümleyi bul veya en yakın anlamı seç. Önce paragrafın konusunu belirle."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Boşluğa gelecek cümle: 'The Industrial Revolution reshaped not only how goods were made but also where people lived. ______ As factories concentrated in cities, workers migrated from the countryside in unprecedented numbers.'", "choices": {"A": "Most early factory owners actually preferred to remain in rural areas.", "B": "Before it, the great majority of the population had worked on the land.", "C": "Today, relatively few people are employed in manufacturing at all.", "D": "Agriculture had never really played any role in the wider economy.", "E": "The cities of that period were almost entirely empty and deserted."}, "ans": "B", "why": "Boşluk, kırsaldan göçe zemin hazırlamalı: önceden çoğunluk toprakta çalışıyordu. Sonra fabrikalara göç mantıklı olur.", "slug": "gri-mod-yds-paragraf-1"}, {"n": 2, "stem": "Boşluğa gelecek sonuç cümlesi: 'Regular physical activity is now linked to better mental as well as physical health. Studies show that it reduces anxiety, improves mood and sharpens memory. ______'", "choices": {"A": "However, exercise appears to have no measurable benefits at all.", "B": "In contrast, physical health seems to be entirely unrelated to a person's mental health.", "C": "Memory is, in fact, the only mental faculty that exercise can improve.", "D": "For these reasons, doctors increasingly recommend exercise alongside treatment.", "E": "So far, almost no study has seriously examined the effects of exercise."}, "ans": "D", "why": "Sonuç cümlesi faydaları özetleyip öneriye bağlanmalı. A/B/C/E önceki cümlelerle çelişir.", "slug": "gri-mod-yds-paragraf-2"}, {"n": 3, "stem": "Akışı bozan cümle hangisi? '(I) Coral reefs are among the most diverse ecosystems on Earth. (II) They support roughly a quarter of all known marine species. (III) The tallest mountains, however, are all found on dry land. (IV) Rising sea temperatures are now causing widespread coral bleaching. (V) Without urgent action, many reefs may not survive this century.'", "choices": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "C", "why": "Paragraf mercan resifleri hakkında; III dağlardan söz ediyor, konudan sapıyor.", "slug": "gri-mod-yds-paragraf-3"}, {"n": 4, "stem": "Akışı bozan cümle hangisi? '(I) Vaccines train the immune system to recognise specific pathogens. (II) They have dramatically reduced deaths from diseases such as measles. (III) Public trust in vaccination remains essential for its long-term success. (IV) Global vaccination programmes have nearly eliminated polio worldwide. (V) Meanwhile, coffee consumption has risen steadily in many countries.'", "choices": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "E", "why": "Paragraf aşılar hakkında; V kahve tüketimi, alakasız.", "slug": "gri-mod-yds-paragraf-4"}, {"n": 5, "stem": "Boşluğa gelecek açılış cümlesi: '______ For instance, a single mistranslated word in a treaty can change its entire legal meaning. Professional translators must therefore balance accuracy with the subtle demands of context.'", "choices": {"A": "Translation is far more complex than simply replacing one word with another.", "B": "Machine translation has by now completely replaced human translators.", "C": "Most important legal documents are never translated into other languages.", "D": "International treaties are usually written in a single, universal language.", "E": "Very few people today are genuinely interested in learning a language."}, "ans": "A", "why": "Örnek çeviri hatasını, sonuç ise çevirmenin dengesini anlatıyor; açılış çevirinin karmaşıklığını söylemeli.", "slug": "gri-mod-yds-paragraf-5"}]}]}, {"id": "cloze", "group": "Drilller", "name": "Cloze Test", "eyebrow": "Drill", "blocks": [{"t": "p", "x": "Akademik paragrafı oku, her boşluğa bütüne en uygun seçeneği koy."}, {"t": "given", "title": "Metin", "x": "The human brain contains billions of neurons, (1) ______ communicate through electrical and chemical signals. For a long time, scientists believed that the adult brain could not generate new cells. (2) ______, recent research has shown that certain regions continue to produce neurons throughout life. This discovery has important (3) ______ for the treatment of brain injury. It suggests that, under the right conditions, the brain may be able to (4) ______ itself to some degree."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "Boşluk (1): billions of neurons, hy":"'Even though [açık destek verdi]' güçlü zıtlık ister; senatörün özelde aksine çekincesi olduğunu söyleyen C bu karşıtlığı kurar. Diğerleri yalnızca ek bağlam sunar, çelişki üretmez.","slug":"gri-mod-yds-deneme1-1-18"},{"slug":"gri-mod-yds-deneme1-1-19","why":"Orijinaldeki dört kritik unsur tam aktarılır: (1) 'was framed as' = sunulsa da, (2) 'warned that' = uyarıda bulundu, (3) 'could in fact be used' = aslında kullanılabilecek (modal + edilgen, OLASILIK), (4) 'several of its provisions' = bazı hükümleri. B 'kullanılmıştır' diyerek modal olasılığı GERÇEKLEŞMİŞ olarak verir. C ve D iddiayı kesinleşmiş gerçeğe dönüştürür. E öznel tonludur ve mevzuatın amacını çarpıtır.","n":19,"ans":"C","stem":"<b>Although the new legislation was framed as a measure to protect personal privacy, civil society groups warned that several of its provisions could in fact be used to monitor political dissent.</b>","choices":{"A":"Kişisel mahremiyeti korumayı amaçladığı söylenen yeni mevzuat, sivil toplum kuruluşlarının uyardığı gibi siyasi muhalefetin izlenmesinde kullanılmıştır.","C":"Yeni mevzuat her ne kadar kişisel mahremiyeti korumaya yönelik bir önlem olarak sunulsa da, sivil toplum kuruluşları bazı hükümlerinin aslında siyasi muhalefeti izlemek için kullanılabileceği konusunda uyarıda bulunmuştur.","D":"Sivil toplum kuruluşları, kişisel mahremiyet adı altında çıkarılan yeni mevzuatın siyasi muhalefeti izlemek için tasarlandığını açıkça belirtmiştir.","B":"Yeni mevzuatın kişisel mahremiyeti koruyucu nitelikte olduğu iddia edilmiş, ancak siyasi muhalefetin izlenmesinde kullanıldığına dair sivil toplum uyarıları gelmiştir.","E":"Mahremiyet bahanesiyle hazırlanan yeni mevzuat, siyasi muhalefeti izlemek isteyen hükümetin elinde bir araca dönüşmüştür."}},{"stem":"<b>Despite the substantial investment in renewable infrastructure over the past decade, fossil fuels continue to account for the majority of global energy consumption, a fact that complicates efforts to meet international climate targets.</b>","ans":"E","choices":{"E":"Son on yılda yenilenebilir altyapıya yapılan kayda değer yatırıma rağmen, fosil yakıtlar küresel enerji tüketiminin büyük çoğunluğunu oluşturmaya devam etmekte; bu durum uluslararası iklim hedeflerine ulaşma çabalarını güçleştirmektedir.","A":"Son on yıllarda yenilenebilir enerjiye büyük yatırım yapılmış olsa da fosil yakıtlar hâlâ kullanılmakta, bu da uluslararası iklim hedeflerini tehlikeye sokmaktadır.","C":"Küresel enerji tüketiminin büyük kısmı hâlâ fosil yakıtlardan karşılanırken, uluslararası iklim hedefleri yenilenebilir kaynaklarla desteklenmelidir.","B":"Yenilenebilir altyapıya rağmen fosil yakıtların payı azalmamış, bu da iklim hedeflerinin gerçekçi olmadığını göstermiştir.","D":"Fosil yakıtların küresel enerji tüketimindeki payı azaltılamadığı için, uluslararası iklim hedefleri son on yılda revize edilmek zorunda kalınmıştır."},"slug":"gri-mod-yds-deneme1-1-20","n":20,"why":"'Substantial investment' (kayda değer yatırım), 'over the past decade' (son on yıl, TEKİL), 'continue to account for the majority' (büyük çoğunluğu oluşturmaya devam) ve 'a fact that complicates efforts' (çabaları güçleştiren bir durum) unsurlarını eksiksiz verir. B 'on yıllar' (çoğul) ve tehlike öznelliği, C/D/E neden-sonuç ve odak değiştirir."},{"stem":"<b>Akademik özgürlüğün korunması, yalnızca araştırmacıların kişisel haklarının değil aynı zamanda bilginin kamusal bir mal olarak kalmasının da güvencesidir.</b>","ans":"C","choices":{"D":"Without the protection of academic freedom, neither researchers' personal rights nor knowledge as a public good can be preserved.","B":"Academic freedom should be protected to ensure that researchers are not deprived of their personal rights and that knowledge remains accessible to the public.","C":"The protection of academic freedom is the guarantee not merely of researchers' personal rights but also of knowledge remaining a public good.","A":"The protection of academic freedom safeguards not only the personal rights of researchers but also the standing of knowledge as a public good.","E":"Academic freedom protects researchers' personal rights as well as the public nature of knowledge."},"slug":"gri-mod-yds-deneme1-1-21","n":21,"why":"Orijinaldeki 'yalnızca ... değil aynı zamanda ... de güvencesidir' yapısı 'the guarantee not merely of X but also of Y' ile bire bir aktarılır. Ayrıca 'bilginin ... kalmasının' yapısı 'knowledge remaining a public good' gerund yapısıyla tam karşılanır. A 'standing' anlam kaymasıdır; B yorum ekler ('should be'); D koşul cümlesine çevirir; E özetleyici ve 'güvencesidir' vurgusunu kaybeder."},{"choices":{"E":"abandoning previously held moral commitments under social or financial pressure","A":"deliberately committing minor offences in order to balance major ethical achievements","C":"becoming, after a virtuous act, more inclined to behave in ways that contradict one's stated values","D":"refusing to acknowledge the ethical consequences of one's professional decisions","B":"feeling obligated to compensate for past wrongdoing through subsequent moral behaviour"},"ans":"C","stem":"<div class='passage'><p>The phenomenon known as \"moral licensing\" describes a paradoxical pattern in human behaviour: when individuals perform an action they perceive as ethically commendable, they often become more, rather than less, willing to behave in ways that contradict their professed values. A donor who has just contributed to a charity, for instance, may subsequently feel entitled to act selfishly in unrelated contexts; a consumer who buys an environmentally friendly product may later show reduced concern for the environmental consequences of other purchases.</p><p>Psychologists studying this effect suggest that the underlying mechanism is the accumulation of a kind of moral credit, which individuals tacitly draw upon to justify subsequent transgressions. Importantly, moral licensing operates largely below the level of conscious awareness, meaning that those affected by it would typically deny that any such trade-off has taken place.</p><p>The implications of these findings extend beyond personal ethics. In organisational settings, public displays of ethical commitment — diversity statements, sustainability pledges, or codes of conduct — may inadvertently make subsequent ethical lapses more rather than less likely, particularly if such displays are not coupled with accountability mechanisms. While critics caution against overstating the effect, the consistency with which it appears across cultures and contexts has led researchers to argue that any robust ethical framework must account for the limits of moral self-perception rather than rely on goodwill alone.</p></div><div class='qprompt'>According to the passage, moral licensing involves ----.</div>","why":"Pasajın 1. paragrafı tam olarak bunu söyler: erdemli bir eylemden sonra kişi değerlerine aykırı davranmaya daha istekli hale gelir. A 'deliberately' (bilinçli) yanlış — pasaj mekanizmanın bilinç altında işlediğini belirtir. C tam tersini söyler. D ve E pasajda yok.","n":22,"slug":"gri-mod-yds-deneme1-1-22"},{"choices":{"E":"have replaced more traditional forms of ethical regulation in most modern workplaces","A":"may produce unintended consequences if they are not paired with mechanisms for accountability","C":"tend to reduce unethical behaviour only when they involve significant financial costs","D":"are usually viewed with scepticism by employees who have witnessed organisational hypocrisy","B":"are most effective when designed by external consultants rather than internal staff"},"stem":"<div class='passage'><p>The phenomenon known as \"moral licensing\" describes a paradoxical pattern in human behaviour: when individuals perform an action they perceive as ethically commendable, they often become more, rather than less, willing to behave in ways that contradict their professed values. A donor who has just contributed to a charity, for instance, may subsequently feel entitled to act selfishly in unrelated contexts; a consumer who buys an environmentally friendly product may later show reduced concern for the environmental consequences of other purchases.</p><p>Psychologists studying this effect suggest that the underlying mechanism is the accumulation of a kind of moral credit, which individuals tacitly draw upon to justify subsequent transgressions. Importantly, moral licensing operates largely below the level of conscious awareness, meaning that those affected by it would typically deny that any such trade-off has taken place.</p><p>The implications of these findings extend beyond personal ethics. In organisational settings, public displays of ethical commitment — diversity statements, sustainability pledges, or codes of conduct — may inadvertently make subsequent ethical lapses more rather than less likely, particularly if such displays are not coupled with accountability mechanisms. While critics caution against overstating the effect, the consistency with which it appears across cultures and contexts has led researchers to argue that any robust ethical framework must account for the limits of moral self-perception rather than rely on goodwill alone.</p></div><div class='qprompt'>It can be inferred from the passage that public ethical commitments in organisations ----.</div>","ans":"A","why":"Pasajdaki son paragraf 'if such displays are not coupled with accountability mechanisms' ifadesiyle hesap verebilirlik mekanizmaları olmadan bu beyanların geri tepme ihtimaline işaret eder. A, B, D, E pasajda dayanak bulmaz.","n":23,"slug":"gri-mod-yds-deneme1-1-23"},{"choices":{"E":"emphasise that those affected by it are unlikely to recognise their own behaviour","B":"argue that conscious reasoning has no role in ethical decision-making","D":"explain why some cultures appear immune to the phenomenon","C":"suggest that the effect can be neutralised through self-awareness training","A":"demonstrate that the effect is too weak to be detected in controlled experiments"},"ans":"E","stem":"<div class='passage'><p>The phenomenon known as \"moral licensing\" describes a paradoxical pattern in human behaviour: when individuals perform an action they perceive as ethically commendable, they often become more, rather than less, willing to behave in ways that contradict their professed values. A donor who has just contributed to a charity, for instance, may subsequently feel entitled to act selfishly in unrelated contexts; a consumer who buys an environmentally friendly product may later show reduced concern for the environmental consequences of other purchases.</p><p>Psychologists studying this effect suggest that the underlying mechanism is the accumulation of a kind of moral credit, which individuals tacitly draw upon to justify subsequent transgressions. Importantly, moral licensing operates largely below the level of conscious awareness, meaning that those affected by it would typically deny that any such trade-off has taken place.</p><p>The implications of these findings extend beyond personal ethics. In organisational settings, public displays of ethical commitment — diversity statements, sustainability pledges, or codes of conduct — may inadvertently make subsequent ethical lapses more rather than less likely, particularly if such displays are not coupled with accountability mechanisms. While critics caution against overstating the effect, the consistency with which it appears across cultures and contexts has led researchers to argue that any robust ethical framework must account for the limits of moral self-perception rather than rely on goodwill alone.</p></div><div class='qprompt'>The author refers to moral licensing operating \"below the level of conscious awareness\" in order to ----.</div>","n":24,"why":"Bu ifadenin hemen ardından gelen cümle 'those affected by it would typically deny that any such trade-off has taken place' — yani bilinç altı işlediği için kişi farkındalığa sahip de hical commitment — diversity statements, sustainability pledges, or codes of conduct — may inadvertently make subsequent ethical lapses more rather than less likely, particularly if such displays are not coupled with accountability mechanisms. While critics caution against overstating the effect, the consistency with which it appears across cultures and contexts has led researchers to argue that any robust ethical framework must account for the limits of moral self-perception rather than rely on goodwill alone.</p></div><div class='qprompt'>Which of the following best describes the author's overall stance toward moral licensing research?</div>"},{"choices":{"B":"confirming the historical accuracy of oral traditions in indigenous communities","D":"providing high-resolution imagery of submerged archaeological sites","C":"reducing the financial cost of conventional excavation in remote regions","A":"revealing settlements and infrastructure hidden beneath dense forest cover","E":"accelerating the dating of organic material recovered from excavations"},"stem":"<div class='passage'><p>The widespread adoption of remote sensing technology has transformed archaeology in ways that few practitioners anticipated two decades ago. Where excavation once depended on surface clues, oral testimony, and laborious trial trenches, satellite imagery, ground-penetrating radar, and airborne lidar now allow researchers to detect buried structures across thousands of square kilometres in a single survey.</p><p>The most striking results have come from densely vegetated regions, particularly the rainforests of Central America and Southeast Asia, where lidar has revealed the outlines of cities, road networks, and agricultural terraces previously invisible beneath the canopy. These discoveries have prompted significant revisions to long-standing assumptions about the demographic scale and political complexity of pre-modern societies in such regions.</p><p>However, the new tools have also raised methodological and ethical questions. Detecting a feature is not the same as understanding it, and there is a real danger that researchers, dazzled by the volume of remotely sensed data, may neglect the slow contextual work — careful excavation, comparative study, dialogue with descendant communities — that gives such features meaning. Some indigenous groups have also expressed concern that large-scale remote surveys, which can be conducted without their knowledge or consent, threaten their sovereignty over heritage sites.</p><p>Most researchers now agree that remote sensing is best understood not as a replacement for traditional archaeological methods but as a complement that, if used responsibly, can enlarge the scope of inquiry while still respecting the limits of what aerial data alone can tell us.</p></div><div class='qprompt'>According to the passage, lidar has been particularly valuable in ----.</div>","ans":"A","why":"2. paragraf 'densely vegetated regions ... rainforests ... lidar has revealed the outlines of cities, road networks, and agricultural terraces previously invisible beneath the canopy' ifadesiyle bunu doğrudan belirtir. A, B, D, E pasajda yer almaz.","n":26,"slug":"gri-mod-yds-deneme1-1-26"},{"slug":"gri-mod-yds-deneme1-1-27","why":"Pasaj açıkça 'Detecting a feature is not the same as understanding it' der ve veri bolluğunun bağlamsal çalışmanın ihmaline yol açabileceği uyarısını yapar. A, C, D, E pasajda yer almıyor.","n":27,"stem":"<div class='passage'><p>The widespread adoption of remote sensing technology has transformed archaeology in ways that few practitioners anticipated two decades ago. Where excavation once depended on surface clues, oral testimony, and laborious trial trenches, satellite imagery, ground-penetrating radar, and airborne lidar now allow researchers to detect buried structures across thousands of square kilometres in a single survey.</p><p>The most striking results have come from densely vegetated regions, particularly the rainforests of Central America and Southeast Asia, where lidar has revealed the outlines of cities, road networks, and agricultural terraces previously invisible beneath the canopy. These discoveries have prompted significant revisions to long-standing assumptions about the demographic scale and political complexity of pre-modern societies in such regions.</p><p>However, the new tools have also raised methodological and ethical questions. Detecting a feature is not the same as understanding it, and there is a real danger that researchers, dazzled by the volume of remotely sensed data, may neglect the slow contextual work — careful excavation, comparative study, dialogue with descendant communities — that gives such features meaning. Some indigenous groups have also expressed concern that large-scale remote surveys, which can be conducted without their knowledge or consent, threaten their sovereignty over heritage sites.</p><p>Most researchers now agree that remote sensing is best understood not as a replacement for traditional archaeological methods but as a complement that, if used responsibly, can enlarge the scope of inquiry while still respecting the limits of what aerial data alone can tell us.</p></div><div class='qprompt'>One concern raised in the passage about remote sensing is that ----.</div>","ans":"D","choices":{"B":"the technology cannot distinguish between natural and human-made structures","D":"detection of features may be mistaken for genuine understanding of them","A":"the equipment required is too expensive for most archaeological institutions","C":"governments restrict the publication of high-resolution imagery","E":"the data produced is often incompatible with existing archaeological databases"}},{"slug":"gri-mod-yds-deneme1-1-28","n":28,"why":"Pasaj 'indigenous groups have also expressed concern that large-scale remote surveys, which can be conducted without their knowledge or consent' ifadesiyle bu meşru endişeyi tanır; yazarın 'used responsibly' vurgusu danışma yükümlülüğüyle örtüşür. A pasajla zıt; B/D/E yazarın tutumuyla çelişir.","stem":"<div class='passage'><p>The widespread adoption of remote sensing technology has transformed archaeology in ways that few practitioners anticipated two decades ago. Where excavation once depended on surface clues, oral testimony, and laborious trial trenches, satellite imagery, ground-penetrating radar, and airborne lidar now allow researchers to detect buried structures across thousands of square kilometres in a single survey.</p><p>The most striking results have come from densely vegetated regions, particularly the rainforests of Central America and Southeast Asia, where lidar has revealed the outlines of cities, road networks, and agricultural terraces previously invisible beneath the canopy. These discoveries have prompted significant revisions to long-standing assumptions about the demographic scale and political complexity of pre-modern societies in such regions.</p><p>However, the new tools have also raised methodological and ethical questions. Detecting a feature is not the same as understanding it, and there is a real danger that researchers, dazzled by the volume of remotely sensed data, may neglect the slow contextual work — careful excavation, comparative study, dialogue with descendant communities — that gives such features meaning. Some indigenous groups have also expressed concern that large-scale remote surveys, which can be conducted without their knowledge or consent, threaten their sovereignty over heritage sites.</p><p>Most researchers now agree that remote sensing is best understood not as a replacement for traditional archaeological methods but as a complement that, if used responsibly, can enlarge the scope of inquiry while still respecting the limits of what aerial data alone can tell us.</p></div><div class='qprompt'>It can be inferred from the passage that the author would most likely agree that ----.</div>","ans":"D","choices":{"D":"descendant communities should be consulted before large-scale remote surveys are conducted","B":"ethical questions about archaeological practice are now of secondary importance","A":"remote sensing should largely replace conventional excavation in tropical regions","C":"lidar surveys are most effective when conducted without the involvement of local authorities","E":"traditional archaeological methods are no longer relevant in the digital era"}},{"n":29,"why":"'Not as a replacement but as a complement' ifadesi yöntemin geleneksel yaklaşımlara EK olduğunu söyler; tek başına yetersiz, beraber kullanılınca değerlidir. B bunu birebir karşılar.","slug":"gri-mod-yds-deneme1-1-29","choices":{"A":"a flawed tool that should be used only as a last resort","C":"a temporary innovation likely to be superseded within a generation","D":"a method whose ethical implications outweigh its scientific benefits","B":"the single most important technological development in modern archaeology","E":"one of several methods that retains value when integrated with established practices"},"ans":"E","stem":"<div class='passage'><p>The widespread adoption of remote sensing technology has transformed archaeology in ways that few practitioners anticipated two decades ago. Where excavation once depended on surface clues, oral testimony, and laborious trial trenches, satellite imagery, ground-penetrating radar, and airborne lidar now allow researchers to detect buried structures across thousands of square kilometres in a single survey.</p><p>The most striking results have come from densely vegetated regions, particularly the rainforests of Central America and Southeast Asia, where lidar has revealed the outlines of cities, road networks, and agricultural terraces previously invisible beneath the canopy. These discoveries have prompted significant revisions to long-standing assumptions about the demographic scale and political complexity of pre-modern societies in such regions.</p><p>However, the new tools have also raised methodological and ethical questions. Detecting a feature is not the same as understanding it, and there is a real danger that researchers, dazzled by the volume of remotely sensed data, may neglect the slow contextual work — careful excavation, comparative study, dialogue with descendant communities — that gives such features meaning. Some indigenous groups have also expressed concern that large-scale remote surveys, which can be conducted without their knowledge or consent, threaten their sovereignty over heritage sites.</p><p>Most researchers now agree that remote sensing is best understood not as a replacement for traditional archaeological methods but as a complement that, if used responsibly, can enlarge the scope of inquiry while still respecting the limits of what aerial data alone can tell us.</p></div><div class='qprompt'>The phrase \"best understood not as a replacement... but as a complement\" suggests that the author views remote sensing as ----.</div>"},{"ans":"E","stem":"<div class='passage'><p>Recent advances in machine translation have led some commentators to predict the obsolescence of professional translators within a generation. While translation software has indeed improved dramatically — particularly for high-resource language pairs and routine textual genres such as technical manuals — claims of imminent replacement tend to underestimate what experienced translators actually do.</p><p>Beyond word-for-word substitution, professional translation involves negotiating cultural register, recognising irony and idiom, preserving the rhetorical structure of legal or literary texts, and making fine-grained judgements about audience expectation. Current systems struggle with all of these, particularly when source texts are short, ambiguous, or stylistically marked.</p><p>There is also growing evidence that overreliance on machine output produces what one researcher has termed \"post-editing fatigue\", in which human reviewers, faced with fluent but subtly inaccurate translations, gradually lose the inclination to flag problems. The result is a deceptive smoothness in the translated text that masks errors a human translator working from scratch would never have introduced.</p></div><div class='qprompt'>One can infer from the passage that ----.</div>","choices":{"E":"the apparent fluency of machine output can lead reviewers to overlook substantive errors","A":"machine translation systems perform equally well across all language pairs and genres","C":"literary translation is the only domain in which human translators remain essential","B":"professional translators are unlikely to retain economic relevance in the coming decade","D":"post-editing fatigue results primarily from poor working conditions rather than the technology itself"},"slug":"gri-mod-yds-deneme1-1-30","n":30,"why":"Pasaj 'deceptive smoothness ... masks errors' diyerek akıcı görünümün hataları örtmesine ve insan denetçilerin sorun bayraklama isteğini yitirmesine değinir. A yanlış (high-resource çiftler özellikle vurgulanır); B yazarın TEZİNE aykırı; D aşırı dar; E pasajda yok."},{"ans":"E","stem":"<div class='passage'><p>Recent advances in machine translation have led some commentators to predict the obsolescence of professional translators within a generation. While translation software has indeed improved dramatically — particularly for high-resource language pairs and routine textual genres such as technical manuals — claims of imminent replacement tend to underestimate what experienced translators actually do.</p><p>Beyond word-for-word substitution, professional translation involves negotiating cultural register, recognising irony and idiom, preserving the rhetorical structure of legal or literary texts, and making fine-grained judgements about audience expectation. Current systems struggle with all of these, particularly when source texts are short, ambiguous, or stylistically marked.</p><p>There is also growing evidence that ove rk historians use to organise them.","B":"Most of the disagreement comes from historians not having read the foundational economic theory of the period.","D":"Honestly, much of the disagreement reflects nationalist agendas rather than any genuine intellectual difference."},"slug":"gri-mod-yds-deneme1-1-33","why":"Sonraki replikteki 'isn't about facts but which factors deserve most weight' özetlemesi ve son repliğin 'basic chronology is well established ... each interpretive framework foregrounds different actors' devamı C'yi açıkça hazırlar: olaylar tartışmalı değil, yorum çerçevesi farklı. A/B/D/E sonraki repliklerle uyumsuz.","n":33},{"slug":"gri-mod-yds-deneme1-1-34","n":34,"why":"Sonraki replik 'aesthetic but also stake in the result' iki bileşeni özetler; B tam olarak 'units sometimes look austere' (estetik) ve 'residents feel excluded from planning' (söz hakkı) ikilisini sunar. Diğer seçenekler tek bileşeni ya da konu dışı bir gerekçeyi öne sürer.","stem":"<div class='dia'><p><b>Architect:</b><br>Many of the housing proposals in our region rely heavily on prefabricated modular units. Why do you think the public reception has been so mixed?</p><p><b>Urban planner:</b><br>----</p><p><b>Architect:</b><br>That makes sense. So part of the resistance is aesthetic but part is about whether residents feel they have a stake in the result?</p><p><b>Urban planner:</b><br>Right. People will tolerate a great deal architecturally if they feel the process respected their concerns, but when modular units are imposed top-down with little consultation, even well-designed schemes can generate hostility that is then read, mistakenly, as a rejection of the form itself.</p></div>","ans":"A","choices":{"C":"Honestly, the public would accept these units if construction were faster and less disruptive.","A":"Two things are at work: the units sometimes look austere, and residents often feel excluded from the planning process.","D":"Most opposition disappears once residents see that prices are substantially lower than conventional housing.","B":"The mixed reception is mostly a result of misinformation circulated by competing developers.","E":"Modular housing is rejected mainly because it lacks the long-term durability of traditional construction."}},{"stem":"<b>While the international agreement formally commits its signatories to reducing emissions by specified targets, the absence of robust enforcement mechanisms means that compliance ultimately depends on the political will of individual states.</b>","ans":"B","choices":{"E":"International agreements that set emission targets without strong enforcement mechanisms tend to fail, since signatories rarely demonstrate the political will required for genuine compliance.","C":"Despite establishing binding emission targets for its signatories, the international agreement has been criticised by many states for its weak enforcement provisions and uneven distribution of obligations.","A":"The international agreement obliges its signatories to meet specific emission targets, but because there are no enforcement mechanisms, very few states have actually achieved the necessary reductions.","B":"Although signatory states are bound by formal emission targets under the international agreement, the lack of strong enforcement provisions makes actual compliance contingent on each state's domestic political resolve.","D":"The political will of individual signatory states would not be necessary if the international agreement included robust enforcement mechanisms alongside its formal emission targets."},"slug":"gri-mod-yds-deneme1-1-35","why":"Orijinal cümlenin üç temel unsurunu korur: (1) anlaşmanın resmi yükümlülüğü, (2) güçlü uygulama mekanizmasının yokluğu, (3) bunun uyumu siyasi iradeye bağlı kılması. B gerçek başarı durumu ekler (orijinalde yok); C eleştiri unsurları getirir; D koşul cümlesi kurar; E genelleme ('tend to fail') yapar.","n":35},{"slug":"gri-mod-yds-deneme1-1-36","n":36,"why":"Orijinaldeki üç unsu at the informal sector would gradually shrink ... evidence of recent decades, however, has not borne this expectation out. Informal employment has proved remarkably durable' diyerek C'yi doğrudan ifade eder.","choices":{"C":"consists almost entirely of street vendors and small-scale retail","A":"has proved more durable than earlier development theories anticipated","B":"is gradually shrinking as economies modernise, as earlier theories had predicted","D":"is generally well-regulated by local rather than national authorities","E":"employs only marginal numbers compared with the formal economy"},"n":26,"ans":"A","stem":"<div class='passage'><p>In rapidly urbanising regions of the global South, the formal economy frequently accounts for only a fraction of total employment. The remainder is found in what economists somewhat awkwardly term the \"informal sector\": street vendors, small-scale repair workshops, domestic workers, and a vast array of micro-enterprises that operate outside official registration and taxation.</p><p>Policymakers have long viewed this sector with ambivalence. On the one hand, it absorbs labour that the formal economy cannot, providing livelihoods for millions who would otherwise face destitution. On the other, its workers typically lack legal protections, occupational safety standards, and access to social insurance, leaving them acutely vulnerable to economic shocks.</p><p>Earlier development theories tended to assume that the informal sector would gradually shrink as economies modernised, much as it had in the historical experience of Western Europe. The evidence of recent decades, however, has not borne this expectation out. Informal employment has proved remarkably durable, and in some cities has even expanded during periods of formal economic growth. This durability has prompted scholars to reconsider whether informality is best understood as a transitional phase or as a structural feature of contemporary capitalism in much of the world.</p
