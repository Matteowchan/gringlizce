<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gri SAT . Unite 2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
[data-mode="lesson"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}

.shell{max-width:1150px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:32px;align-items:flex-start}

@media(max-width:860px){.shell{flex-direction:column;gap:16px}.rail{width:100%;position:static}.pad{padding:0 20px}}
.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px;transition:background .45s,border-color .45s}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:1.95rem;margin:.3rem 0 .15rem;line-height:1.14;color:var(--ink)}

.backbtn:hover{background:var(--accent-soft)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.32rem;margin:26px 0 5px}

p{margin:0 0 12px}

.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--unit);font-weight:700;padding:3px 9px;border-radius:20px}

.les{border-top:1px solid var(--line)}
.les .lh{display:flex;align-items:center;gap:10px;padding:11px 2px;font-family:Inter,sans-serif;font-size:13.5px}

.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;background:var(--accent-soft);color:var(--accent-deep);border-radius:50%;font-family:Inter,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

.tips li{position:relative;padding:0 0 9px 20px}
.tips li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.passage{color:#3a352d;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:13px 16px;margin:0 0 14px;transition:background .4s}
.stem{font-weight:500;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:#fff;cursor:pointer;margin-bottom:9px;transition:.14s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}

.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.correct{border-color:var(--teal);background:var(--teal-soft)}
.opt.correct .ltr{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.wrong .ltr{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt.locked{cursor:default;pointer-events:none}
.btn{font-family:Inter,sans-serif;font-weight:600;font-size:15px;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;background:var(--accent);color:#fff;transition:.14s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--accent-deep);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}

.fb.ok{background:var(--teal-soft);color:var(--teal-deep)}

.tagline{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);margin-top:6px}
.remedbar{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.06em;color:var(--warm-deep);font-weight:700;text-transform:uppercase;background:var(--warm-soft);padding:5px 12px;border-radius:20px;margin-bottom:12px}
.qcount{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-bottom:10px}
.done .big{font-family:"Playfair Display",serif;font-size:2.3rem;color:var(--accent-deep);text-align:center}
.mrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 15px;background:#FCFAF4;margin-bottom:8px}
.st{font-family:Inter,sans-serif;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px}
.st.good{background:var(--teal);color:#fff}.st.warn{background:var(--gold);color:#fff}
.note{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin:30px 34px 0;padding-top:14px}

.les.locked .lh{opacity:1}
.les .lh{cursor:pointer}
.les.active .lh{cursor:default}

<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Unite 3 . Expression of Ideas . 2 ders tam (Transitions, Rhetorical Synthesis) . 80 soru . giris kilidi gomulu</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit": 3, "unit_title": "SAT Reading & Writing Kampi", "unit_accent": "warm", "lessons": [{"no": 1, "name": "Transitions", "teaching": {"ne_olculuyor": ["Iki cumle arasinda bir bosluk vardir. Gorev: iki cumle arasindaki mantik iliskisini dogru adlandiran gecis kelimesini secmek.", "Bu soru kelime bilgisi degil, MANTIK sorusudur. however, therefore, for example gibi kelimelerin ne anlama geldigini degil, iki cumlenin BIRBIRINE nasil bagli oldugunu olcer.", "Kritik nokta: gecis kelimesi iki cumle arasindaki gercek iliskiyi yansitmali. Yanlis yonu ya da yanlis turu secen ogrenci puani kaybeder."], "karar_proseduru": ["GECIS KELIMESINE HENUZ BAKMA. Once iki cumleyi oku, arasindaki iliskiyi kendi kelimenle soyle.  Ikinci cumle birinciyle celisiyor mu, onu mu sonuclandiriyor, ornek mi veriyor, ekliyor mu.", "Iliskiyi bir kategoriye koy.  Zitlik mi, sonuc mu, ekleme mi, ornek mi, aciklama mi. Once kategoriyi bul.", "O kategoriye uyan gecisi ara.  Zitlik ise however, yet, nevertheless. Sonuc ise therefore, thus. Ekleme ise moreover, in addition. Ornek ise for example.", "Yonu iki kez kontrol et.  En sik hata: zitlik gerekirken sonuc baglaci koymak. Ikinci cumle birinciyle CELISIYORSA gecis de zitlik olmali.", "Secilen gecisi cumleye koy ve oku.  Mantik akiyor mu. Akmiyorsa yanlis kategoridesin."], "celdirici_aileleri": [{"ad": "Ters yon", "tanim": "Gecis dogru olanin TERSI yonu gosterir. Iki cumle celisiyorken sonuc baglaci (therefore) koyar, ya da sonuc gerekirken zitlik (however) koyar. En sik ve en olumcul tuzak."}, {"ad": "Yanlis alt tur", "tanim": "Gecis genel yonu dogru ama YANLIS alt turu. Ekleme gerekirken ornek (for example) koyar, ya da sonuc gerekirken aciklama (in other words). Yon yakin ama tur yanlis."}, {"ad": "Sebep sonuc ters", "tanim": "Neden ile sonuc yer degistirir. Ikinci cumle birincinin SEBEBIyken sonuc gibi baglar, ya da tam tersi. Ok yonu ters cevrilmistir."}, {"ad": "Ilgisiz gecis", "tanim": "Gecisin anlami iki cumleye HIC uymaz. Benzerlik yokken similarly, siralama yokken meanwhile koyar. Tanidik kelime ama yanlis iliski."}], "top_tips": ["Once iliskiyi kendi kelimenle soyle, sonra seceneklere bak. Gecis kelimesinden basrsan tanidik olani secersin, mantigi degil.", "En sik tuzak ters yon. Iki cumle celisiyorsa (biri olumlu biri olumsuz sonuc) gecis MUTLAKA zitlik olmali. therefore gorunce dur, gercekten sonuc mu diye sor.", "however ile therefore birbirinin tersi. Biri dogruysa oteki kesin yanlis. Iki cumlenin celisip celismedigine bak.", "for example koymadan once sor: ikinci cumle birincinin ORNEGI mi, yoksa SONUCU ya da EKLEMESI mi. Ornek degilse for example yanlistir."]}, "families": ["Ters yon", "Yanlis alt tur", "Sebep sonuc ters", "Ilgisiz gecis"], "fam_short": {"Ters yon": "Ters yon", "Yanlis alt tur": "Yanlis tur", "Sebep sonuc ters": "Sebep/sonuc", "Ilgisiz gecis": "Ilgisiz"}, "main_ids": ["u3-l1-f1-01", "u3-l1-f2-01", "u3-l1-f3-01", "u3-l1-f4-01"], "questions": [{"id": "u3-l1-f1-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The new policy was expected to cut the city's traffic sharply. ______, congestion in the downtown core actually rose in the months after it took effect.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Therefore", "C": "For example", "D": "Meanwhile"}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Yanlis alt tur", "D": "Ilgisiz gecis"}, "why_correct": "The second sentence contradicts the expectation in the first (traffic rose instead of falling), so a contrast transition fits.", "why_wrong": {"B": "'Therefore' signals a result that follows, but the sentences conflict, so it points the wrong way.", "C": "'For example' introduces an illustration, but the second sentence is a contrast, not an example.", "D": "'Meanwhile' marks simultaneous events, which is not the relationship here."}}, {"id": "u3-l1-f1-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "Solar panels have become far cheaper over the past decade. ______, many households still hesitate to install them because of the upfront cost.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "Nevertheless", "C": "In other words", "D": "Similarly"}, "correct": "B", "choice_families": {"A": "Ters yon", "C": "Yanlis alt tur", "D": "Ilgisiz gecis"}, "why_correct": "Despite cheaper panels, households still hesitate; the second sentence runs against the first, so a contrast transition fits.", "why_wrong": {"A": "'As a result' signals a consequence, but hesitation contradicts the drop in price rather than following from it.", "C": "'In other words' restates a point, but the second sentence adds a contrasting fact, not a restatement.", "D": "'Similarly' marks likeness, but the two sentences oppose each other."}}, {"id": "u3-l1-f1-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The committee gathered months of detailed data on the proposal. ______, it reached its final decision without consulting any of it.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "For instance", "C": "Yet", "D": "Likewise"}, "correct": "C", "choice_families": {"A": "Ters yon", "D": "Ilgisiz gecis", "B": "Yanlis alt tur"}, "why_correct": "Gathering data then ignoring it is a contradiction, so a contrast transition fits.", "why_wrong": {"A": "'Consequently' signals a result, but ignoring the data does not follow logically from gathering it.", "D": "'Likewise' marks similarity, not the contrast present here.", "B": "'For instance' introduces an example, which the second sentence is not."}}, {"id": "u3-l1-f1-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The medication cleared the trial's safety checks with ease. ______, regulators delayed its approval for another full year.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Thus", "B": "Meanwhile", "C": "That is", "D": "Still"}, "correct": "D", "choice_families": {"A": "Ters yon", "C": "Yanlis alt tur", "B": "Ilgisiz gecis"}, "why_correct": "Passing safety checks would predict quick approval, but approval was delayed, so a contrast transition fits.", "why_wrong": {"A": "'Thus' signals a result, but the delay works against the smooth safety checks rather than following from them.", "C": "'That is' introduces a restatement, not the contrast the sentences require.", "B": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f1-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "Critics predicted the film would fail at the box office. ______, it became the highest-grossing release of the year.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In contrast", "B": "Accordingly", "C": "In addition", "D": "Finally"}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Yanlis alt tur", "D": "Ilgisiz gecis"}, "why_correct": "The film succeeded against the prediction of failure, so a contrast transition fits.", "why_wrong": {"B": "'Accordingly' signals a result in line with what came before, but success contradicts the prediction.", "C": "'In addition' adds a similar point, but the second sentence opposes the first.", "D": "'Finally' marks the last item in a sequence, which is not the relationship here."}}, {"id": "u3-l1-f1-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The two theories rest on completely different assumptions about how memory works. ______, they arrive at nearly identical predictions.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Therefore", "B": "Nonetheless", "C": "For example", "D": "Meanwhile"}, "correct": "B", "choice_families": {"A": "Ters yon", "C": "Yanlis alt tur", "D": "Ilgisiz gecis"}, "why_correct": "Different assumptions would predict different results, but the theories agree, so a contrast transition fits.", "why_wrong": {"A": "'Therefore' signals a consequence, but identical predictions do not follow from opposite assumptions.", "C": "'For example' introduces an illustration, which the second sentence is not.", "D": "'Meanwhile' marks simultaneity, not the contrast present here."}}, {"id": "u3-l1-f1-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The region receives abundant rainfall throughout the year. ______, its reservoirs run dangerously low each summer.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "In short", "C": "Even so", "D": "Similarly"}, "correct": "C", "choice_families": {"A": "Ters yon", "D": "Ilgisiz gecis", "B": "Yanlis alt tur"}, "why_correct": "Abundant rain would predict full reservoirs, but they run low, so a contrast transition fits.", "why_wrong": {"A": "'As a result' signals a consequence, but low reservoirs contradict abundant rainfall.", "D": "'Similarly' marks likeness, which is not the relationship here.", "B": "'In short' introduces a summary, not the contrast the sentences require."}}, {"id": "u3-l1-f1-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The author spent years researching the historical setting of her novel. ______, she chose to leave almost all of that detail out of the finished book.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Hence", "B": "Meanwhile", "C": "In fact", "D": "However"}, "correct": "D", "choice_families": {"A": "Ters yon", "C": "Yanlis alt tur", "B": "Ilgisiz gecis"}, "why_correct": "Extensive research then leaving it out is a contradiction, so a contrast transition fits.", "why_wrong": {"A": "'Hence' signals a result, but omitting the detail does not follow from researching it.", "C": "'In fact' intensifies or confirms a prior point, not the contrast present here.", "B": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f1-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "Early reviews of the restaurant were overwhelmingly negative. ______, it has been fully booked every night since it opened.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Despite this", "B": "Thus", "C": "For instance", "D": "Likewise"}, "correct": "A", "choice_families": {"C": "Yanlis alt tur", "D": "Ilgisiz gecis", "B": "Ters yon"}, "why_correct": "Negative reviews would predict empty tables, but the restaurant is fully booked, so a contrast transition fits.", "why_wrong": {"C": "'For instance' introduces an example, which the second sentence is not.", "D": "'Likewise' marks similarity, not the contrast present here.", "B": "'Thus' signals a result, but being fully booked contradicts the negative reviews."}}, {"id": "u3-l1-f1-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ters yon", "passage": "The species was declared extinct more than fifty years ago. ______, a small population was recently found living deep in the forest.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "However", "C": "In other words", "D": "Meanwhile"}, "correct": "B", "choice_families": {"A": "Ters yon", "C": "Yanlis alt tur", "D": "Ilgisiz gecis"}, "why_correct": "A recent living population contradicts the extinction declaration, so a contrast transition fits.", "why_wrong": {"A": "'Consequently' signals a result, but the discovery works against the extinction claim rather than following from it.", "C": "'In other words' restates a point, which the second sentence does not do.", "D": "'Meanwhile' marks simultaneity, not the contrast present here."}}, {"id": "u3-l1-f2-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The city has invested heavily in public transit in recent years. It has expanded the subway, added bus routes, and built new bike lanes. ______, it has installed hundreds of new streetlights to improve safety at night.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "In addition", "C": "However", "D": "Therefore"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Sebep sonuc ters", "A": "Yanlis alt tur"}, "why_correct": "The streetlights are one more item added to a list of investments, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues in the same direction.", "D": "'Therefore' signals a result, but the streetlights do not follow as a consequence.", "A": "'For example' would make the streetlights an illustration of the previous items, but they are a separate, added investment, not an example of transit expansion."}}, {"id": "u3-l1-f2-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "Many desert plants have developed ways to conserve water. ______, the barrel cactus stores moisture in its thick, ribbed stem for use during long droughts.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Nevertheless", "B": "In addition", "C": "For example", "D": "As a result"}, "correct": "C", "choice_families": {"B": "Yanlis alt tur", "D": "Sebep sonuc ters", "A": "Ters yon"}, "why_correct": "The barrel cactus is a specific illustration of the general point about water conservation, so an example transition fits.", "why_wrong": {"B": "'In addition' would add a separate point, but the cactus is an instance of the general claim, not a new one.", "D": "'As a result' signals a consequence, which the cactus example is not.", "A": "'Nevertheless' signals contrast, but the sentence supports the previous one."}}, {"id": "u3-l1-f2-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The report's findings were complex and easily misread. ______, its conclusion was that current methods, though imperfect, remain the best available.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Meanwhile", "B": "For example", "C": "However", "D": "In short"}, "correct": "D", "choice_families": {"B": "Yanlis alt tur", "C": "Ters yon", "A": "Ilgisiz gecis"}, "why_correct": "The second sentence sums up the complex findings in a single line, so a summary transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence condenses the findings rather than exemplifying them.", "C": "'However' signals contrast, but the sentence distills rather than opposes.", "A": "'Meanwhile' marks simultaneity, which is not the relationship here."}}, {"id": "u3-l1-f2-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The professor's lectures were famous for their difficulty. Students often left them confused and overwhelmed. ______, her office hours were patient, warm, and unhurried.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "By contrast", "B": "In addition", "C": "Therefore", "D": "For example"}, "correct": "A", "choice_families": {"B": "Yanlis alt tur", "C": "Sebep sonuc ters", "D": "Yanlis alt tur"}, "why_correct": "The warm office hours are set against the difficult lectures, so a contrast transition fits.", "why_wrong": {"B": "'In addition' would add a similar point, but the office hours oppose the tone of the lectures.", "C": "'Therefore' signals a result, but the office hours do not follow as a consequence of the hard lectures.", "D": "'For example' introduces an illustration, but the office hours contrast with, rather than illustrate, the lectures."}}, {"id": "u3-l1-f2-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The museum wanted to make its collection more approachable. It rewrote its labels in plain language and added audio guides. ______, it lowered its ticket prices for students and families.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "Moreover", "C": "However", "D": "In conclusion"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Yanlis alt tur", "A": "Yanlis alt tur"}, "why_correct": "Lower ticket prices are another step added to the museum's efforts, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues the same effort.", "D": "'In conclusion' signals a closing summary, but this sentence adds a new action, not a wrap-up.", "A": "'For instance' would make the price cut an example of rewriting labels, but it is a separate measure."}}, {"id": "u3-l1-f2-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The bridge's design looked strange to many observers. ______, its unusual curves were what allowed it to withstand high winds.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Therefore", "B": "For example", "C": "In fact", "D": "Meanwhile"}, "correct": "C", "choice_families": {"B": "Yanlis alt tur", "D": "Ilgisiz gecis", "A": "Sebep sonuc ters"}, "why_correct": "The second sentence deepens and confirms the point with a striking detail, so an emphasis transition fits.", "why_wrong": {"B": "'For example' introduces an illustration of a general claim, but here the sentence intensifies rather than exemplifies.", "D": "'Meanwhile' marks simultaneity, which is not the relationship here.", "A": "'Therefore' signals a result, but the point about wind resistance is not a consequence of looking strange."}}, {"id": "u3-l1-f2-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "Coral reefs face many threats today. Warming seas cause bleaching, pollution smothers the coral, and overfishing removes key species. ______, coastal construction buries reefs under sediment.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "For example", "C": "Nevertheless", "D": "Furthermore"}, "correct": "D", "choice_families": {"B": "Yanlis alt tur", "C": "Ters yon", "A": "Sebep sonuc ters"}, "why_correct": "Coastal construction is one more threat added to a list, so an addition transition fits.", "why_wrong": {"B": "'For example' would make construction an illustration of the previous threats, but it is a separate threat added to them.", "C": "'Nevertheless' signals contrast, but the sentence continues the list.", "A": "'As a result' signals a consequence, which this added threat is not."}}, {"id": "u3-l1-f2-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The essay's language is dense and technical. ______, its central claim is simple: people remember stories better than facts.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Put simply", "B": "For example", "C": "Consequently", "D": "Similarly"}, "correct": "A", "choice_families": {"B": "Yanlis alt tur", "C": "Sebep sonuc ters", "D": "Ilgisiz gecis"}, "why_correct": "The second sentence restates the dense essay in plain terms, so a restatement transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence paraphrases the claim rather than giving an instance.", "C": "'Consequently' signals a result, but the simple claim does not follow as a consequence of dense language.", "D": "'Similarly' marks likeness, which is not the relationship here."}}, {"id": "u3-l1-f2-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The startup tried several ways to keep its employees. It raised salaries and offered flexible hours. ______, it began providing free childcare on site.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "In addition", "C": "However", "D": "Therefore"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Sebep sonuc ters", "A": "Yanlis alt tur"}, "why_correct": "On-site childcare is another retention measure added to the list, so an addition transition fits.", "why_wrong": {"C": "'However' signals contrast, but the sentence continues the same effort.", "D": "'Therefore' signals a result, which this added measure is not.", "A": "'For example' would make childcare an illustration of raising salaries, but it is a separate measure."}}, {"id": "u3-l1-f2-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Yanlis alt tur", "passage": "The argument runs through many pages of statistics and qualifications. ______, it boils down to a single warning: act now or lose the chance.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "For example", "C": "In essence", "D": "Meanwhile"}, "correct": "C", "choice_families": {"B": "Yanlis alt tur", "D": "Ilgisiz gecis", "A": "Ters yon"}, "why_correct": "The second sentence condenses the long argument into its core, so a summary transition fits.", "why_wrong": {"B": "'For example' introduces an illustration, but this sentence sums up rather than exemplifies.", "D": "'Meanwhile' marks simultaneity, which is not the relationship here.", "A": "'However' signals contrast, but the sentence distills rather than opposes."}}, {"id": "u3-l1-f3-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "Heavy rain fell across the valley for three straight days. ______, the river burst its banks and flooded the low-lying farms.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "For this reason the rain fell, since", "C": "As a result", "D": "For example"}, "correct": "C", "choice_families": {"B": "Sebep sonuc ters", "D": "Yanlis alt tur", "A": "Ters yon"}, "why_correct": "The flooding is the consequence of the heavy rain, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This phrasing treats the flood as the cause of the rain, reversing the real order; the rain caused the flood, not the reverse.", "D": "'For example' introduces an illustration, which the flood is not.", "A": "'However' signals contrast, but the flood follows from the rain rather than opposing it."}}, {"id": "u3-l1-f3-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The factory switched to renewable power last year. ______, its carbon emissions dropped by nearly half.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "That drop is why the factory switched, as", "C": "Nevertheless", "D": "Consequently"}, "correct": "D", "choice_families": {"B": "Sebep sonuc ters", "C": "Ters yon", "A": "Yanlis alt tur"}, "why_correct": "The emissions drop is the effect of switching to renewables, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the emissions drop the reason for the switch, reversing the order; the switch caused the drop, not the reverse.", "C": "'Nevertheless' signals contrast, but the drop follows from the switch.", "A": "'For instance' introduces an example, which the drop is not."}}, {"id": "u3-l1-f3-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The team practiced together for months before the tournament. ______, their coordination on the court was seamless.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Thus", "B": "The seamless play is what led them to practice, because", "C": "In contrast", "D": "In other words"}, "correct": "A", "choice_families": {"B": "Sebep sonuc ters", "C": "Ters yon", "D": "Yanlis alt tur"}, "why_correct": "The seamless coordination results from months of practice, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the seamless play as the cause of the practice, reversing the order; practice produced the coordination, not the reverse.", "C": "'In contrast' signals opposition, but the coordination follows from the practice.", "D": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f3-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "A long drought dried out the forest floor over the summer. ______, even a small spark was enough to start a fast-moving wildfire.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "The wildfire is why the drought set in, since", "B": "As a result", "C": "However", "D": "For example"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Yanlis alt tur", "A": "Sebep sonuc ters"}, "why_correct": "The easily started fire is a consequence of the dry conditions, so a result transition fits, with cause before effect.", "why_wrong": {"C": "'However' signals contrast, but the fire risk follows from the drought.", "D": "'For example' introduces an illustration, which this is not.", "A": "This makes the wildfire the cause of the drought, reversing the order; the drought enabled the fire, not the reverse."}}, {"id": "u3-l1-f3-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The store moved to a busy corner near the train station. ______, its foot traffic more than doubled within a month.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Still", "B": "That rise in traffic is why it moved, as", "C": "Consequently", "D": "For instance"}, "correct": "C", "choice_families": {"B": "Sebep sonuc ters", "D": "Yanlis alt tur", "A": "Ters yon"}, "why_correct": "The rise in foot traffic is the effect of the move, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the traffic rise as the reason for the move, reversing the order; the move caused the rise, not the reverse.", "D": "'For instance' introduces an example, which this is not.", "A": "'Still' signals contrast, but the traffic rise follows from the move."}}, {"id": "u3-l1-f3-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The new vaccine reached remote villages for the first time this year. ______, cases of the disease there fell to record lows.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In short", "B": "Those low case numbers brought the vaccine, because", "C": "Nevertheless", "D": "As a result"}, "correct": "D", "choice_families": {"B": "Sebep sonuc ters", "C": "Ters yon", "A": "Yanlis alt tur"}, "why_correct": "The drop in cases results from the vaccine's arrival, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the low case numbers the cause of the vaccine's arrival, reversing the order; the vaccine reduced cases, not the reverse.", "C": "'Nevertheless' signals contrast, but the drop follows from the vaccine.", "A": "'In short' introduces a summary, which this is not."}}, {"id": "u3-l1-f3-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The company ignored years of warnings about its aging equipment. ______, a major breakdown finally shut the plant for weeks.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Consequently", "B": "The breakdown is why the warnings were ignored, since", "C": "However", "D": "Similarly"}, "correct": "A", "choice_families": {"B": "Sebep sonuc ters", "C": "Ters yon", "D": "Ilgisiz gecis"}, "why_correct": "The breakdown is the consequence of ignoring the warnings, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the breakdown as the cause of the ignored warnings, reversing the order; ignoring the warnings led to the breakdown, not the reverse.", "C": "'However' signals contrast, but the breakdown follows from the neglect.", "D": "'Similarly' marks likeness, which is not the relationship here."}}, {"id": "u3-l1-f3-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "Warm ocean water flowed into the bay all summer. ______, the fish that need cold water moved farther offshore.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "The fish leaving is what warmed the water, because", "B": "Thus", "C": "Yet", "D": "For example"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Yanlis alt tur", "A": "Sebep sonuc ters"}, "why_correct": "The fish moving offshore results from the warm water, so a result transition fits, with cause before effect.", "why_wrong": {"C": "'Yet' signals contrast, but the fish's move follows from the warming.", "D": "'For example' introduces an illustration, which this is not.", "A": "This makes the fish leaving the cause of the warming, reversing the order; the warm water drove the fish away, not the reverse."}}, {"id": "u3-l1-f3-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "The library extended its opening hours into the late evening. ______, student use of its study rooms rose sharply after dark.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "That late-night use is why the hours changed, as", "C": "As a result", "D": "In other words"}, "correct": "C", "choice_families": {"B": "Sebep sonuc ters", "D": "Yanlis alt tur", "A": "Ters yon"}, "why_correct": "The rise in evening use is the effect of longer hours, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This treats the late-night use as the cause of the schedule change, reversing the order; the longer hours caused the use, not the reverse.", "D": "'In other words' restates a point, which this is not.", "A": "'However' signals contrast, but the use follows from the longer hours."}}, {"id": "u3-l1-f3-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Sebep sonuc ters", "passage": "A thick layer of ash settled over the fields after the eruption. ______, the following season's harvest was the richest in memory.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For instance", "B": "The rich harvest is why the ash fell, since", "C": "Nevertheless", "D": "Consequently"}, "correct": "D", "choice_families": {"B": "Sebep sonuc ters", "C": "Ters yon", "A": "Yanlis alt tur"}, "why_correct": "The rich harvest results from the mineral-laden ash, so a result transition fits, with cause before effect.", "why_wrong": {"B": "This makes the harvest the cause of the ashfall, reversing the order; the ash enriched the soil, not the reverse.", "C": "'Nevertheless' signals contrast, but the harvest follows from the ash.", "A": "'For instance' introduces an example, which this is not."}}, {"id": "u3-l1-f4-01", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The first phase of the project focused on gathering data from local farms. ______, the second phase turned to analyzing that data for patterns.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "For example", "B": "Similarly", "C": "In contrast", "D": "Next"}, "correct": "D", "choice_families": {"B": "Ilgisiz gecis", "C": "Ters yon", "A": "Yanlis alt tur"}, "why_correct": "The two phases follow one another in order, so a sequence transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentences describe successive stages, not similar ones.", "C": "'In contrast' signals opposition, but the phases follow in sequence rather than conflict.", "A": "'For example' introduces an illustration, which the second phase is not."}}, {"id": "u3-l1-f4-02", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The engineers finished testing the prototype in the lab. ______, they moved it outdoors to see how it performed in real weather.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Then", "B": "Likewise", "C": "However", "D": "In other words"}, "correct": "A", "choice_families": {"B": "Ilgisiz gecis", "C": "Ters yon", "D": "Yanlis alt tur"}, "why_correct": "Moving outdoors is the next step after lab testing, so a sequence transition fits.", "why_wrong": {"B": "'Likewise' marks similarity, but the sentences describe consecutive steps, not similar ones.", "C": "'However' signals contrast, but the outdoor test follows naturally from the lab test.", "D": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f4-03", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The recipe calls for chilling the dough for an hour. ______, you roll it out and cut it into shapes before baking.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Similarly", "B": "Afterward", "C": "Nevertheless", "D": "For instance"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Yanlis alt tur", "A": "Ilgisiz gecis"}, "why_correct": "Rolling out the dough comes after chilling, so a sequence transition fits.", "why_wrong": {"C": "'Nevertheless' signals contrast, but the rolling step follows the chilling naturally.", "D": "'For instance' introduces an example, which this step is not.", "A": "'Similarly' marks likeness, but the steps follow one another rather than resembling each other."}}, {"id": "u3-l1-f4-04", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "Sea otters and beavers both shape the habitats around them. ______, each is considered a keystone species whose loss would transform its ecosystem.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Meanwhile", "C": "Similarly", "D": "For example"}, "correct": "C", "choice_families": {"B": "Ilgisiz gecis", "D": "Yanlis alt tur", "A": "Ters yon"}, "why_correct": "The sentence draws a likeness between the two animals' roles, so a similarity transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneous events, but the sentence compares the two species rather than timing them.", "D": "'For example' introduces an illustration, but the sentence generalizes across both animals rather than giving one instance.", "A": "'However' signals contrast, but the sentence stresses their shared role."}}, {"id": "u3-l1-f4-05", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The northern trail climbs steeply through rocky terrain to the summit. ______, the southern trail winds gently through meadows to reach the same peak.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "As a result", "B": "Therefore", "C": "In short", "D": "By comparison"}, "correct": "D", "choice_families": {"B": "Ilgisiz gecis", "C": "Yanlis alt tur", "A": "Sebep sonuc ters"}, "why_correct": "The sentence sets the two trails side by side to compare them, so a comparison transition fits.", "why_wrong": {"B": "'Therefore' signals a result, but the southern trail is not a consequence of the northern one.", "C": "'In short' introduces a summary, but the sentence compares rather than sums up.", "A": "'As a result' signals a consequence, which the second trail is not."}}, {"id": "u3-l1-f4-06", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The orchestra tuned their instruments as the hall filled with people. ______, the conductor waited backstage, reviewing the score one last time.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Meanwhile", "B": "Similarly", "C": "Therefore", "D": "For example"}, "correct": "A", "choice_families": {"B": "Ilgisiz gecis", "C": "Sebep sonuc ters", "D": "Yanlis alt tur"}, "why_correct": "The two actions happen at the same time in different places, so a simultaneity transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentence describes two different things happening at once, not similar ones.", "C": "'Therefore' signals a result, but the conductor's waiting is not a consequence of the tuning.", "D": "'For example' introduces an illustration, which this is not."}}, {"id": "u3-l1-f4-07", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "First, the students brainstormed as many ideas as they could without judging them. ______, they grouped the ideas and chose the three strongest to develop.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "Likewise", "B": "Second", "C": "However", "D": "For instance"}, "correct": "B", "choice_families": {"C": "Ters yon", "D": "Yanlis alt tur", "A": "Ilgisiz gecis"}, "why_correct": "The sentence marks the next step in an ordered process, so a sequence transition fits.", "why_wrong": {"C": "'However' signals contrast, but the grouping step follows the brainstorming naturally.", "D": "'For instance' introduces an example, which this step is not.", "A": "'Likewise' marks similarity, but the sentence moves to the next stage rather than a parallel one."}}, {"id": "u3-l1-f4-08", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "Solar power and wind power both draw energy from natural, renewable sources. ______, both produce electricity without burning fuel or releasing carbon.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "However", "B": "Meanwhile", "C": "Likewise", "D": "Therefore"}, "correct": "C", "choice_families": {"B": "Ilgisiz gecis", "D": "Sebep sonuc ters", "A": "Ters yon"}, "why_correct": "The sentence adds a further shared trait of the two sources, drawing a parallel, so a similarity transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneity, but the sentence compares the two sources rather than timing them.", "D": "'Therefore' signals a result, which this shared trait is not.", "A": "'However' signals contrast, but the sentence stresses what they share."}}, {"id": "u3-l1-f4-09", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "The crew loaded the supplies onto the ship through the morning. ______, the captain reviewed the route with the navigation officer on the bridge.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "In other words", "B": "Similarly", "C": "As a result", "D": "Meanwhile"}, "correct": "D", "choice_families": {"B": "Ilgisiz gecis", "C": "Sebep sonuc ters", "A": "Yanlis alt tur"}, "why_correct": "The two activities occur at the same time in different places, so a simultaneity transition fits.", "why_wrong": {"B": "'Similarly' marks likeness, but the sentence describes two different tasks happening at once.", "C": "'As a result' signals a consequence, but the captain's review is not caused by the loading.", "A": "'In other words' restates a point, which this is not."}}, {"id": "u3-l1-f4-10", "unit": 3, "lesson": 1, "lesson_name": "Transitions", "target_family": "Ilgisiz gecis", "passage": "A paper map never loses signal and needs no battery to work. ______, a phone's map updates in real time and can reroute you around traffic.", "stem": "Which choice completes the text with the most logical transition?", "choices": {"A": "By contrast", "B": "Meanwhile", "C": "Therefore", "D": "In short"}, "correct": "A", "choice_families": {"B": "Ilgisiz gecis", "C": "Sebep sonuc ters", "D": "Yanlis alt tur"}, "why_correct": "The sentence sets the phone map against the paper map to contrast their strengths, so a contrast transition fits.", "why_wrong": {"B": "'Meanwhile' marks simultaneity, but the sentence compares the two tools rather than timing them.", "C": "'Therefore' signals a result, but the phone map is not a consequence of the paper map.", "D": "'In short' introduces a summary, but the sentence contrasts rather than sums up."}}]}, {"no": 2, "name": "Rhetorical Synthesis", "teaching": {"ne_olculuyor": ["Bir konu hakkinda alinmis notlar listesi ve bir YAZMA AMACI verilir. Gorev: o amaci en iyi karsilayan cumleyi secmek.", "Bu soru dilbilgisi degil, AMAC uyumu olcer. Cumle dogru olabilir, notlardan gelebilir, ama istenen amaci yapmiyorsa yanlistir.", "Kritik nokta: once AMACI oku, sonra cevap ara. Amac neyi vurgulamani istiyorsa cevap onu yapmali. Cogu tuzak dogru bilgiyi yanlis amac icin kullanir."], "karar_proseduru": ["ONCE AMACI OKU, notlari degil. Soru kokundeki amaci tek cumleyle kendine soyle.  Ornegin iki seyi karsilastirmak, bir ozelligi tanitmak, bir sonuca varmak.", "Amacin anahtar sozunu isaretle.  compare, emphasize, introduce, describe. Bu kelime cevabin ne yapmasi gerektigini soyler.", "Her secenegi amaca gore test et.  Bu cumle amaci YAPIYOR mu. Sadece dogru olmak yetmez, amaci karsilamali.", "Sentez gerekiyor mu bak.  Amac karsilastirma ya da baglanti istiyorsa cevap BIRDEN COK notu birlestirmeli. Tek nota dayanan cevap eksiktir.", "Notlarda olmayani ele.  Cevaptaki her bilgi notlarda olmali. Kulaga dogru gelen ama notta olmayan detay tuzaktir."], "celdirici_aileleri": [{"ad": "Amaci karsilamiyor", "tanim": "Cumle dogru ve notlardan gelir ama istenen AMACI yapmaz. Amac karsilastirma isterken sadece tanimlar, ya da vurgu isterken duz bilgi verir. Dogru bilgi, yanlis is."}, {"ad": "Tek not sentez yok", "tanim": "Amac birden cok bilgiyi BIRLESTIRMEYI isterken cumle tek nota dayanir. Karsilastirma ya da baglanti amacinda tek unsur eksik kalir. Sentez yapilmamistir."}, {"ad": "Notta olmayan bilgi", "tanim": "Cumle notlarda BULUNMAYAN bir bilgi ekler. Makul gorunur ama dayanagi yoktur. Ogrenci disaridan bilgi kattigi icin secer, ama sentez notlara dayanmali."}, {"ad": "Yanlis vurgu", "tanim": "Cumle notlari kullanir ama amacin istediginden BASKA seyi one cikarir. Amac bir ozelligi vurgulamani isterken cumle baska bir ayrintiyi merkeze alir. Yon yanlistir."}], "top_tips": ["Once amaci oku, secenekleri degil. Amaci bilmeden secenek okursan en dogru gorunen cumleyi secersin, amaci karsilayani degil.", "Amacta compare, contrast, connection varsa cevap MUTLAKA iki bilgiyi birlestirmeli. Tek nota dayanan secenek bu amaci karsilamaz.", "Her secenegi amacin anahtar kelimesiyle test et. Amac emphasize the difference diyorsa, cumle farki gosteriyor mu diye sor.", "Cevaptaki her olguyu notlarda ara. Notta yoksa, ne kadar mantikli olursa olsun, yanlistir. Sentez disaridan bilgi katmaz."]}, "families": ["Amaci karsilamiyor", "Tek not sentez yok", "Notta olmayan bilgi", "Yanlis vurgu"], "fam_short": {"Amaci karsilamiyor": "Amac disi", "Tek not sentez yok": "Sentez yok", "Notta olmayan bilgi": "Notta yok", "Yanlis vurgu": "Yanlis vurgu"}, "main_ids": ["u3-l2-f1-01", "u3-l2-f2-01", "u3-l2-f3-01", "u3-l2-f4-01"], "questions": [{"id": "u3-l2-f1-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Aral Sea was once the fourth-largest lake in the world.\n- By 2010 it had shrunk to a tenth of its original size.\n- Rivers feeding it were diverted for cotton farming.\n- The exposed seabed became a source of toxic dust storms.", "stem": "The student wants to emphasize the scale of the Aral Sea's shrinkage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Once the world's fourth-largest lake, the Aral Sea had shrunk to just a tenth of its original size by 2010.", "B": "The rivers that once fed the Aral Sea were diverted to irrigate cotton farms.", "C": "The exposed seabed of the Aral Sea became a source of toxic dust storms.", "D": "The Aral Sea was once the fourth-largest lake in the world."}, "correct": "A", "choice_families": {"B": "Amaci karsilamiyor", "C": "Amaci karsilamiyor", "D": "Tek not sentez yok"}, "why_correct": "The goal is to emphasize the scale of shrinkage; A pairs the original rank with the tenth-size figure, showing the magnitude.", "why_wrong": {"B": "This gives a cause of the shrinkage, accurate but not a statement of its scale.", "C": "This names a consequence, not the scale of the shrinkage.", "D": "This states only the original size and never shows how much it shrank."}}, {"id": "u3-l2-f1-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- Bioluminescence is the production of light by living organisms.\n- Many deep-sea fish use it to attract prey.\n- Fireflies use it to attract mates.\n- Some fungi glow to attract insects that spread their spores.", "stem": "The student wants to illustrate the variety of purposes bioluminescence serves. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bioluminescence is the production of light by living organisms.", "B": "Organisms use bioluminescence for different ends: deep-sea fish lure prey, fireflies attract mates, and some fungi draw spore-spreading insects.", "C": "Many deep-sea fish use bioluminescence to attract prey.", "D": "Bioluminescence can be found in fish, insects, and fungi alike."}, "correct": "B", "choice_families": {"C": "Tek not sentez yok", "D": "Yanlis vurgu", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is to show the variety of purposes; A lists three distinct purposes across three organisms.", "why_wrong": {"C": "This gives a single purpose in a single organism, not the variety.", "D": "This emphasizes the range of organisms, not the range of purposes the goal asks for.", "A": "This only defines the term and names no purpose at all."}}, {"id": "u3-l2-f1-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- The printing press was introduced to Europe around 1450.\n- Before it, books were copied by hand, slowly and at great cost.\n- After it, the number of books in Europe rose enormously within decades.\n- Literacy rates began to climb in the following century.", "stem": "The student wants to highlight how quickly the press changed book production. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The printing press was introduced to Europe around 1450.", "B": "Literacy rates in Europe began to climb in the century after the press appeared.", "C": "Where books had once been copied slowly by hand, their numbers rose enormously within decades of the press's arrival.", "D": "Before the printing press, books were copied by hand, slowly and at great cost."}, "correct": "C", "choice_families": {"B": "Amaci karsilamiyor", "D": "Tek not sentez yok", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is to show the speed of change in book production; A contrasts slow hand-copying with the rapid rise in books after the press.", "why_wrong": {"B": "This concerns literacy, a later effect, not the speed of change in book production.", "D": "This describes only the earlier state without showing how quickly it changed.", "A": "This gives only a date and shows no change."}}, {"id": "u3-l2-f1-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- Honeybees communicate the location of food through a 'waggle dance.'\n- The angle of the dance signals the direction of the food.\n- The duration of the dance signals the distance.\n- Other bees follow the directions to reach the source.", "stem": "The student wants to explain how the waggle dance conveys specific information. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The waggle dance is one of the most studied behaviors in the insect world.", "B": "Honeybees communicate the location of food through a movement called the waggle dance.", "C": "Other bees follow the waggle dance's directions to reach the food source.", "D": "In the waggle dance, the angle signals the food's direction and the duration signals its distance."}, "correct": "D", "choice_families": {"B": "Amaci karsilamiyor", "C": "Amaci karsilamiyor", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is to explain how specific information is conveyed; A names both variables (angle to direction, duration to distance).", "why_wrong": {"B": "This states that the dance communicates location but not how the information is encoded.", "C": "This describes what other bees do, not how the dance conveys information.", "A": "This claim about how studied the dance is appears nowhere in the notes."}}, {"id": "u3-l2-f1-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Great Barrier Reef stretches over 2,300 kilometers.\n- It is home to more than 1,500 species of fish.\n- It can be seen from space.\n- It supports around 400 species of coral.", "stem": "The student wants to emphasize the reef's biological richness. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Great Barrier Reef supports more than 1,500 species of fish and around 400 species of coral.", "B": "The Great Barrier Reef stretches over 2,300 kilometers and can be seen from space.", "C": "The Great Barrier Reef can be seen from space.", "D": "The Great Barrier Reef stretches over 2,300 kilometers."}, "correct": "A", "choice_families": {"B": "Yanlis vurgu", "C": "Amaci karsilamiyor", "D": "Amaci karsilamiyor"}, "why_correct": "The goal is biological richness; A combines the fish and coral species counts, both measures of life.", "why_wrong": {"B": "This emphasizes size and visibility, not biological richness.", "C": "This concerns visibility from space, unrelated to biological richness.", "D": "This concerns length, a measure of size rather than richness."}}, {"id": "u3-l2-f1-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- Venus is the second planet from the Sun.\n- Its surface temperature averages about 465 degrees Celsius.\n- A thick carbon-dioxide atmosphere traps heat.\n- It is hotter than Mercury, which is closer to the Sun.", "stem": "The student wants to explain why Venus is so hot despite not being the closest planet to the Sun. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Venus is the second planet from the Sun and averages about 465 degrees Celsius.", "B": "Though Mercury sits closer to the Sun, Venus is hotter because its thick carbon-dioxide atmosphere traps heat.", "C": "Venus is the second planet from the Sun.", "D": "Venus has a thick atmosphere made largely of carbon dioxide."}, "correct": "B", "choice_families": {"C": "Amaci karsilamiyor", "D": "Tek not sentez yok", "A": "Amaci karsilamiyor"}, "why_correct": "The goal asks why Venus is hot despite not being closest; A links the trapped heat to being hotter than closer Mercury.", "why_wrong": {"C": "This gives only its position and no explanation.", "D": "This names the atmosphere but does not connect it to the puzzle of Venus being hotter than Mercury.", "A": "This states the temperature but never explains why, nor addresses the Mercury comparison."}}, {"id": "u3-l2-f1-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- Jane Goodall began studying chimpanzees in Tanzania in 1960.\n- She observed them using stripped twigs to fish termites from mounds.\n- This was the first record of tool use by nonhuman animals.\n- The finding forced scientists to rethink the definition of humans as the only toolmakers.", "stem": "The student wants to explain the significance of Goodall's observation for science. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Goodall observed chimpanzees using stripped twigs to fish termites from mounds.", "B": "Jane Goodall began studying chimpanzees in Tanzania in 1960.", "C": "Goodall's record of chimpanzees fishing for termites with twigs was the first evidence of animal tool use, forcing science to rethink humans as the only toolmakers.", "D": "Goodall spent many years living among the chimpanzees she studied."}, "correct": "C", "choice_families": {"B": "Amaci karsilamiyor", "D": "Notta olmayan bilgi", "A": "Tek not sentez yok"}, "why_correct": "The goal is the significance for science; A links the observation to its status as a first and to the rethinking it forced.", "why_wrong": {"B": "This gives only when she started, not the significance.", "D": "How long she lived among them appears nowhere in the notes.", "A": "This describes the observation alone without stating why it mattered."}}, {"id": "u3-l2-f1-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Dead Sea has a salt content of about 34 percent.\n- Ordinary seawater is about 3.5 percent salt.\n- The high salinity makes swimmers float easily.\n- Almost no fish or plants can survive in it.", "stem": "The student wants to emphasize how much saltier the Dead Sea is than ordinary seawater. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Dead Sea has a salt content of about 34 percent.", "B": "The Dead Sea's high salinity makes swimmers float easily on its surface.", "C": "Almost no fish or plants can survive in the Dead Sea.", "D": "At about 34 percent salt, the Dead Sea is nearly ten times as salty as ordinary seawater, which is around 3.5 percent."}, "correct": "D", "choice_families": {"B": "Amaci karsilamiyor", "C": "Amaci karsilamiyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is a comparison of saltiness; A puts the two figures side by side to show the gap.", "why_wrong": {"B": "This names an effect of the salinity, not the comparison.", "C": "This names another effect, not how much saltier the Dead Sea is.", "A": "This gives only the Dead Sea's figure with nothing to compare it to."}}, {"id": "u3-l2-f1-09", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- The Wright brothers made their first powered flight in 1903.\n- The flight lasted 12 seconds and covered 37 meters.\n- Within two years they were flying for over half an hour.\n- By 1908 they were demonstrating flights in Europe.", "stem": "The student wants to highlight how rapidly the brothers' flights improved. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "From a first flight of just 12 seconds in 1903, the Wrights were flying for over half an hour within two years.", "B": "By 1908 the Wright brothers were demonstrating their flights in Europe.", "C": "The Wright brothers made their first powered flight in 1903.", "D": "The Wright brothers' first flight lasted 12 seconds and covered 37 meters."}, "correct": "A", "choice_families": {"B": "Amaci karsilamiyor", "C": "Amaci karsilamiyor", "D": "Tek not sentez yok"}, "why_correct": "The goal is the speed of improvement; A contrasts the 12-second first flight with half-hour flights two years later.", "why_wrong": {"B": "This notes the European demonstrations but shows no improvement over time.", "C": "This gives only the starting date.", "D": "This describes only the first flight without showing progress."}}, {"id": "u3-l2-f1-10", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Amaci karsilamiyor", "passage": "While researching a topic, a student took the following notes:\n\n- Octopuses have three hearts.\n- Two pump blood through the gills; one pumps it through the body.\n- Their blood is blue because it uses copper to carry oxygen.\n- They can change color in a fraction of a second.", "stem": "The student wants to explain how the octopus's circulatory system works. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "An octopus's blood is blue because it uses copper to carry oxygen.", "B": "An octopus has three hearts: two pump blood through the gills while the third pumps it through the body.", "C": "Octopuses can change color in a fraction of a second.", "D": "An octopus has three hearts."}, "correct": "B", "choice_families": {"C": "Amaci karsilamiyor", "D": "Tek not sentez yok", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is how the circulatory system works; A explains the role of each of the three hearts.", "why_wrong": {"C": "This concerns color change, unrelated to circulation.", "D": "This states the number of hearts but not how they function.", "A": "This concerns blood color and chemistry, not how the system pumps."}}, {"id": "u3-l2-f2-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- The violin is played with a bow drawn across its strings.\n- The guitar is usually played by plucking its strings with the fingers.\n- Both instruments produce sound from vibrating strings.\n- Both are common in many kinds of music.", "stem": "The student wants to compare how the two instruments are played. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The violin is played with a bow drawn across its strings.", "B": "While the violin is played with a bow drawn across its strings, the guitar is usually plucked with the fingers.", "C": "Both the violin and the guitar are common in many kinds of music.", "D": "Both instruments produce sound from vibrating strings."}, "correct": "B", "choice_families": {"C": "Amaci karsilamiyor", "D": "Amaci karsilamiyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to compare how the two are played; A sets the bowing of the violin against the plucking of the guitar.", "why_wrong": {"C": "This notes a shared trait but not how they are played.", "D": "This notes another shared trait rather than contrasting playing methods.", "A": "This describes only the violin, so it makes no comparison."}}, {"id": "u3-l2-f2-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Arabica coffee beans have a mild, sweet flavor.\n- Robusta beans have a stronger, more bitter taste.\n- Arabica contains less caffeine than Robusta.\n- Both are grown in tropical regions.", "stem": "The student wants to contrast the flavor of the two bean types. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Both Arabica and Robusta are grown in tropical regions.", "B": "Arabica coffee beans have a mild, sweet flavor.", "C": "Arabica beans have a mild, sweet flavor, whereas Robusta beans taste stronger and more bitter.", "D": "Arabica contains less caffeine than Robusta."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Yanlis vurgu", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is to contrast flavor; A puts the mild Arabica against the bitter Robusta.", "why_wrong": {"B": "This gives only the Arabica flavor, with nothing to contrast.", "D": "This contrasts caffeine content rather than flavor, which the goal specifies.", "A": "This notes where they grow, not their flavor."}}, {"id": "u3-l2-f2-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Sharks have skeletons made entirely of cartilage.\n- Most other fish have skeletons made of bone.\n- Cartilage is lighter and more flexible than bone.\n- Sharks have existed for over 400 million years.", "stem": "The student wants to compare shark skeletons with those of most other fish. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Cartilage is lighter and more flexible than bone.", "B": "Sharks have skeletons made entirely of cartilage.", "C": "Sharks have existed for over 400 million years.", "D": "Unlike most fish, whose skeletons are made of bone, sharks have skeletons made entirely of cartilage."}, "correct": "D", "choice_families": {"B": "Tek not sentez yok", "C": "Amaci karsilamiyor", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is a comparison of skeletons; A sets shark cartilage against the bone of most fish.", "why_wrong": {"B": "This describes only sharks, so no comparison is drawn.", "C": "This concerns their age, not their skeletons.", "A": "This describes cartilage in general without comparing the two groups of fish."}}, {"id": "u3-l2-f2-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Renewable energy sources such as solar do not run out.\n- Fossil fuels are finite and will eventually be depleted.\n- Solar power produces no carbon emissions when generating electricity.\n- Both are used to generate electricity worldwide.", "stem": "The student wants to contrast the supply of renewable energy with that of fossil fuels. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Renewable sources such as solar do not run out, while fossil fuels are finite and will eventually be depleted.", "B": "Renewable energy sources such as solar do not run out.", "C": "Both renewables and fossil fuels are used to generate electricity worldwide.", "D": "Solar power produces no carbon emissions when generating electricity."}, "correct": "A", "choice_families": {"B": "Tek not sentez yok", "C": "Amaci karsilamiyor", "D": "Yanlis vurgu"}, "why_correct": "The goal is to contrast supply; A sets the inexhaustible renewables against the finite fossil fuels.", "why_wrong": {"B": "This describes only renewables, so no contrast is made.", "C": "This notes a shared use rather than a contrast in supply.", "D": "This emphasizes emissions rather than supply, which the goal specifies."}}, {"id": "u3-l2-f2-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- The marathon covers 42.2 kilometers.\n- The sprint events cover 100, 200, and 400 meters.\n- Marathon runners pace themselves over hours.\n- Sprinters run at maximum effort for seconds.", "stem": "The student wants to contrast the demands of marathon running and sprinting. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Marathon runners pace themselves over hours.", "B": "Marathon runners pace themselves over hours, whereas sprinters run at maximum effort for only seconds.", "C": "The marathon covers 42.2 kilometers.", "D": "Sprint events cover distances of 100, 200, and 400 meters."}, "correct": "B", "choice_families": {"C": "Amaci karsilamiyor", "D": "Amaci karsilamiyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to contrast the demands; A sets the paced hours of the marathon against the seconds of maximum sprinting.", "why_wrong": {"C": "This gives only the marathon distance.", "D": "This gives only the sprint distances without contrasting the demands.", "A": "This describes only the marathon, so no contrast is drawn."}}, {"id": "u3-l2-f2-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Watercolor paints are transparent and blend softly.\n- Oil paints are opaque and can be layered thickly.\n- Watercolor dries within minutes.\n- Oil paint can take days or weeks to dry.", "stem": "The student wants to contrast the drying times of the two paints. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Watercolor paints are transparent and blend softly.", "B": "Watercolor dries within minutes.", "C": "Watercolor dries within minutes, while oil paint can take days or even weeks.", "D": "Oil paints are opaque and can be layered thickly."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Yanlis vurgu", "A": "Yanlis vurgu"}, "why_correct": "The goal is to contrast drying times; A sets the minutes of watercolor against the days or weeks of oil.", "why_wrong": {"B": "This gives only watercolor's drying time, with nothing to contrast.", "D": "This describes oil's texture, not its drying time.", "A": "This contrasts transparency, not drying time."}}, {"id": "u3-l2-f2-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Alligators have broad, rounded snouts.\n- Crocodiles have narrower, more pointed snouts.\n- Alligators are usually found in freshwater.\n- Crocodiles can tolerate saltwater.", "stem": "The student wants to compare the snouts of alligators and crocodiles. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Crocodiles can tolerate saltwater.", "B": "Alligators have broad, rounded snouts.", "C": "Alligators are usually found in freshwater.", "D": "Alligators have broad, rounded snouts, while crocodiles have narrower, more pointed ones."}, "correct": "D", "choice_families": {"B": "Tek not sentez yok", "C": "Amaci karsilamiyor", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is to compare snouts; A sets the rounded alligator snout against the pointed crocodile snout.", "why_wrong": {"B": "This describes only the alligator, so no comparison is made.", "C": "This concerns habitat, not snouts.", "A": "This concerns saltwater tolerance, not snouts."}}, {"id": "u3-l2-f2-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Paperback books are cheaper and lighter to carry.\n- Hardcover books are more durable and long-lasting.\n- Paperbacks are printed on thinner paper.\n- Hardcovers usually appear first when a book is released.", "stem": "The student wants to contrast the durability of paperbacks and hardcovers. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Paperbacks are lighter but less durable, whereas hardcovers are sturdier and last longer.", "B": "Paperback books are cheaper and lighter to carry.", "C": "Hardcovers usually appear first when a book is released.", "D": "Paperbacks are printed on thinner paper than hardcovers."}, "correct": "A", "choice_families": {"B": "Yanlis vurgu", "C": "Amaci karsilamiyor", "D": "Yanlis vurgu"}, "why_correct": "The goal is to contrast durability; A sets the less durable paperback against the sturdier hardcover.", "why_wrong": {"B": "This emphasizes cost and weight rather than durability.", "C": "This concerns release timing, not durability.", "D": "This emphasizes paper thickness, not durability directly."}}, {"id": "u3-l2-f2-09", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Bactrian camels have two humps.\n- Dromedary camels have a single hump.\n- Bactrian camels live in the cold deserts of Central Asia.\n- Dromedaries live in the hot deserts of the Middle East and Africa.", "stem": "The student wants to compare the number of humps on the two camel types. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bactrian camels have two humps.", "B": "Bactrian camels have two humps, while dromedaries have only one.", "C": "Dromedaries live in the hot deserts of the Middle East and Africa.", "D": "Bactrian camels live in the cold deserts of Central Asia."}, "correct": "B", "choice_families": {"C": "Amaci karsilamiyor", "D": "Amaci karsilamiyor", "A": "Tek not sentez yok"}, "why_correct": "The goal is to compare hump number; A sets the two humps of the Bactrian against the single hump of the dromedary.", "why_wrong": {"C": "This concerns the dromedary's habitat, not humps.", "D": "This concerns the Bactrian's habitat, not humps.", "A": "This describes only the Bactrian, so no comparison is made."}}, {"id": "u3-l2-f2-10", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Tek not sentez yok", "passage": "While researching a topic, a student took the following notes:\n\n- Digital clocks display the time as numbers.\n- Analog clocks show the time with moving hands on a dial.\n- Digital clocks are easy to read at a glance.\n- Analog clocks help show how much time remains until an hour.", "stem": "The student wants to contrast how the two clock types display the time. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Digital clocks are easy to read at a glance.", "B": "Digital clocks display the time as numbers.", "C": "Digital clocks display the time as numbers, whereas analog clocks show it with hands moving around a dial.", "D": "Analog clocks help show how much time remains until the hour."}, "correct": "C", "choice_families": {"B": "Tek not sentez yok", "D": "Amaci karsilamiyor", "A": "Amaci karsilamiyor"}, "why_correct": "The goal is to contrast how time is displayed; A sets the numbers of digital clocks against the moving hands of analog ones.", "why_wrong": {"B": "This describes only digital clocks, so no contrast is drawn.", "D": "This concerns a use of analog clocks, not how they display time.", "A": "This concerns ease of reading, not how time is displayed."}}, {"id": "u3-l2-f3-01", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Colosseum in Rome was completed around 80 CE.\n- It could hold an estimated 50,000 spectators.\n- It was used for gladiatorial contests and public spectacles.\n- Parts of it were later damaged by earthquakes.", "stem": "The student wants to describe the Colosseum's capacity and use. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Colosseum drew visitors from across the entire Roman Empire for its games.", "B": "The Colosseum, built by thousands of enslaved workers, held some 50,000 spectators.", "C": "The Colosseum, which held some 50,000 spectators, was used for gladiatorial contests and public spectacles.", "D": "The Colosseum remains the most visited monument in Italy today."}, "correct": "C", "choice_families": {"B": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is capacity and use; A pairs the 50,000 figure with the contests and spectacles, both from the notes.", "why_wrong": {"B": "The claim about enslaved workers building it appears nowhere in the notes.", "D": "The claim that it is Italy's most visited monument today is not in the notes.", "A": "The claim that visitors came from across the empire is not in the notes."}}, {"id": "u3-l2-f3-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmaya
