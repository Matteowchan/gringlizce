{"listening":{"audio":"ielts-audio/gri-deneme-11.mp3","transcript":"SECTION 1 — MANOR FARM (fruit picking)\nMrs Chandler: Hello.\nBen: Hi there. I'd like to apply to do fruit picking this summer.\nMrs Chandler: Oh, hello. I'm Mrs. Chandler, my husband and I own Manor Farm. Let me take some details. What's your name?\nBen: It's Ben Miller.\nMrs Chandler: And where are you from?\nBen: I'm from the USA.\nMrs Chandler: Can I ask your age?\nBen: I'm 20.\nBen: I have a thing called a blue card. It's valid until November.\nMrs Chandler: That's fine. We'll need fruit pickers from the middle of June until the end of September. What's your availability?\nBen: I'd like to do July, August and September and could do October, if there's any work then.\nMrs Chandler: Did you find out about us through our website?\nBen: That's right. It's much easier than going through an agency.\nMrs Chandler: You need most pickers in September for apples and pears but the whole picking season can last about 16 weeks. It's a question of the weather that determines how much fruit we grow. That's why I can't give you exact picking dates now.\nBen: Can you tell me what pickers earn?\nMrs Chandler: That depends on age. The rate is four pounds 50 an hour for the under eighteens. But as you're over 18, it would rise to five pounds 60 an hour.\nBen: Your website says that you don't provide accommodation for pickers.\nMrs Chandler: Yes, there is no accommodation on the farm. But there is a campsite about 15 minutes away.\nBen: Is that walking distance?\nMrs Chandler: No. We always recommend that pickers bring a car but then find the roads rather narrow, and the bus is very infrequent. Maybe you should bring your bike to get around.\nMrs Chandler: Documentation is extremely important. We will need proof of age, so we'll expect to see your passport, because without one you won't be allowed to work. A driving licence isn't suitable.\nBen: Is lunch provided?\nMrs Chandler: I'm afraid not. You'll need to bring your own food for lunch and more importantly, enough water to last a full day. It can get very hot so drinking is vital.\n\nSECTION 2 — KARRARA SPORTS & LEISURE CENTRE\nManager: Welcome to Karrara's brand new sports and leisure Centre. As you can see from the map, we're sitting in our cafe. To one side of us and right in front of you as you enter the complex is the shop. On the other side of the cafe, ideally situated between the cafe and the childminding facilities, we have the playground. Let's talk about our heated swimming pool which is also near the entrance, on the other side from the cafe. In the corner nearest the changing rooms, we have a high tech hotspot/spa. The water is heated to 38 degrees centigrade. We have a large weights room located at the cafe end of the Administration block. Another place to get a good workout is in the gym, which is shown on the map to the right of the changing rooms. We also have a special area for massage. It's in the funny shaped room close to the administration area; its distinctive shape has led to the nickname of the bullet room.\nManager: Now, memberships. If you are a fitness freak, then choose our All-in membership; it's usually our most expensive option, but for a short time, we're offering 12 months for the price of nine. If you prefer just the gym classes, consider the Gym and Weights package at $10 a week. If you just want to swim, we recommend Swim Plus, with unlimited use of the pool and spa. The other package we've reduced for this month only is the off-peak, aimed at people who come at less busy times. And finally, we have the Family Pack.\nManager: Anyone who signs up for a new membership tonight will receive two presents. Not only are we going to give you a voucher for a session in our massage centre, but you'll also get this great device that measures your heart rate. And finally, just for turning up tonight, we'd like to give everyone here a drink bottle to take away.\n\nSECTION 4 — DRAMA ACTIVITIES IN THE CLASSROOM\nLecturer: We're going to look at reasons why it's beneficial to include drama activities, such as roleplay, in your teaching. Drama helps a child's personal development. Creating the space for children to express themselves freely in a group situation helps to give them confidence in their own opinions and ideas, and works especially well for shy children. Unscripted improvisation activities, where children work from their imagination, give children the opportunity to gain experience in taking risks.\nLecturer: Drama can also support educational development. The emphasis on cooperative activities means that group members must learn the value of listening to one another. Being involved in a performance helps children to be responsible not only for their learning, but for their general behaviour.\nLecturer: Roleplay is a valuable learning tool. Its value for children who are having difficulties, as a means of therapy, is now widely accepted. Roleplay also allows the teacher to explore potentially controversial or taboo subjects in a safe setting. Getting children to examine their thoughts can lead to a deeper self-knowledge and a stronger awareness of morality.\nLecturer: For history, bringing characters from the past to life by doing classroom drama activities is an easy way to improve the level of the children's participation in the lesson. Getting children to reenact scenes from history helps them to remember what happened and why it was important. Another way is to ask children to find solutions to historical problems using roleplay, which helps to focus attention on why certain decisions were taken.","note":"Not: Section 3 (soru 21-30) ses MP3'te olsa da transcript kaynak PDF'de bulunmadÄ±ÄÄ±ndan cevap anahtarÄ± doÄrulanamadÄ±; bu 10 soru bilerek eklenmedi. Puanlanan: Section 1-2-4 (30 soru).","sections":[{"sectionTitle":"Section 1 — Manor Farm","groups":[{"form":true,"type":"completion","instr":"Complete the form below. Write NO MORE THAN TWO WORDS for each answer.","questions":[{"stem":"Visa type: a ______","answer":"blue card","n":1,"why":"Ben 'I have a thing called a blue card' diyor.","accept":["a blue card"]},{"why":"Ben 'I'd like to do July, August and September' diyerek Temmuz'dan itibaren calisabilecegini soyluyor.","accept":["July"],"stem":"Availability for work: from ______","answer":"July","n":2},{"stem":"Heard about job: from the ______","n":3,"answer":"website","why":"'Did you find out about us through our website?' - Ben onayliyor.","accept":["website"]}]},{"questions":[{"accept":["September"],"why":"'you need most pickers in September for apples and pears'.","answer":"September","n":4,"stem":"Busiest month is ______"},{"answer":"weather","n":5,"stem":"Exact picking dates depend on the ______","accept":["weather"],"why":"'it's a question of the weather ... can't give you exact picking dates now.'"},{"accept":["5.60","5 pounds 60","five pounds 60"],"why":"'as you're over 18, it would rise to five pounds 60 an hour.'","n":6,"answer":"5.60","stem":"Pickers over 18 will earn £ ______ an hour"},{"why":"'there is a campsite about 15 minutes away.'","accept":["campsite","camp site"],"stem":"None on the farm but there is a ______ nearby","answer":"campsite","n":7},{"stem":"Pickers are advised to travel around by ______","n":8,"answer":"bike","why":"'Maybe you should bring your bike to get around'; otobus seyrek, yollar dar.","accept":["bike","bicycle"]},{"accept":["passport"],"why":"'we'll expect to see your passport, because without one you won't be allowed to work.'","n":9,"answer":"passport","stem":"Only pickers with a ______ will be allowed to work"},{"stem":"Pickers must bring lunch and a day's supply of ______","answer":"water","n":10,"why":"'enough water to last a full day.'","accept":["water"]}],"type":"completion","instr":"Complete the notes below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer."}]},{"groups":[{"questions":[{"stem":"Shop","n":11,"answer":"H","why":"'right in front of you as you enter the complex is the shop'."},{"stem":"Playground","n":12,"answer":"G","why":"'ideally situated between the cafe and the childminding facilities, we have the playground'."},{"stem":"Spa","answer":"I","n":13,"why":"'in the corner nearest the changing rooms we have a high tech hotspot/spa' (38°C)."},{"why":"'a large weights room located at the cafe end of the Administration block'.","answer":"D","n":14,"stem":"Weights room"},{"why":"'the gym ... to the right of the changing rooms'.","stem":"Gym","answer":"B","n":15},{"stem":"Massage room","n":16,"answer":"E","why":"'special area for massage ... funny shaped room close to the administration area' (bullet room)."}],"instr":"Label the plan. Choose the correct letter, A-I, for questions 11-16.","options":[{"text":"position A","k":"A"},{"text":"position B","k":"B"},{"text":"position C","k":"C"},{"k":"D","text":"position D"},{"k":"E","text":"position E"},{"k":"F","text":"position F"},{"text":"position G","k":"G"},{"text":"position H","k":"H"},{"k":"I","text":"position I"}],"type":"matching"},{"options":[{"k":"A","text":"off-peak"},{"text":"Gym and Weights","k":"B"},{"k":"C","text":"Swim Plus"},{"text":"All-in","k":"D"},{"text":"Family Pack","k":"E"}],"type":"multi","instr":"Choose TWO letters, A-E. Which TWO memberships have a special introductory price?","questions":[{"why":"All-in icin '12 months for the price of nine' ve off-peak icin 'reduced for this month only'.","n":"17-18","answer":["A","D"],"stem":"Which TWO memberships have a special introductory price?","marks":2}]},{"type":"multi","options":[{"k":"A","text":"sports towel"},{"k":"B","text":"heart monitor"},{"k":"C","text":"water bottle"},{"text":"sports socks","k":"D"},{"text":"free massage","k":"E"}],"instr":"Choose TWO letters, A-E. Which TWO free gifts will new members get tonight?","questions":[{"stem":"Which TWO free gifts will new members get tonight?","marks":2,"answer":["B","C"],"n":"19-20","why":"'device that measures your heart rate' (kalp monitoru) ve herkese verilen 'drink bottle' (su sisesi)."}]}],"sectionTitle":"Section 2 — Karrara Leisure Centre"},{"sectionTitle":"Section 4 — Drama in the classroom","groups":[{"questions":[{"accept":["confidence"],"why":"'helps to give them confidence in their own opinions and ideas.'","answer":"confidence","n":31,"stem":"Group participation develops ______ in own ideas"},{"why":"'gain experience in taking risks.'","accept":["risks","risk"],"stem":"Unscripted, imaginative activities allow children to take ______","answer":"risks","n":32},{"why":"'must learn the value of listening to one another.'","accept":["listening"],"stem":"Working as a group teaches the importance of ______ to others","answer":"listening","n":33},{"why":"'to be responsible not only for their learning, but for their general behaviour.'","accept":["responsible"],"stem":"Performing makes children ______ for their learning and behaviour","n":34,"answer":"responsible"},{"n":35,"answer":"therapy","stem":"Roleplay works as a form of ______ for children experiencing problems","accept":["therapy"],"why":"'as a means of therapy.'"},{"why":"'explore ... controversial or taboo subjects in a safe setting.'","accept":["safe"],"stem":"Roleplay lets a class explore controversial issues in a ______ environment","n":36,"answer":"safe"},{"n":37,"answer":"morality","stem":"It develops children's self-knowledge and understanding of ______","accept":["morality"],"why":"'a stronger awareness of morality.'"},{"why":"'improve the level of the children's participation in the lesson.'","accept":["participation"],"stem":"Drama activities increase children's ______ in class","answer":"participation","n":38},{"accept":["remember"],"why":"'helps them to remember what happened and why it was important.'","n":39,"answer":"remember","stem":"Reenacting scenes makes it easier for children to ______ historical events"},{"n":40,"answer":"problems","stem":"Children can find solutions to historical ______ to see why decisions were made","accept":["problems"],"why":"'find solutions to historical problems using roleplay ... why certain decisions were taken.'"}],"type":"completion","instr":"Complete the notes below. Write ONE WORD ONLY for each answer."}]}]},"number":11,"reading":{"passages":[{"groups":[{"type":"mcq","instr":"Choose the correct letter, A, B, C or D.","questions":[{"options":[{"k":"A","text":"Africa"},{"k":"B","text":"Eurasia"},{"text":"North America","k":"C"},{"k":"D","text":"South-east Asia"}],"stem":"In which region is the biggest range of bovids to be found?","n":1,"answer":"D","why":"Metin: Eurasia ve Southeast Asian adalarindan bahsedip 'by far the most numerous and diverse in the latter' diyor; 'latter' = Guneydogu Asya."},{"why":"'the majority of species favour open grassland, scrub or desert' - yani genis acik alanlar.","options":[{"text":"isolation","k":"A"},{"k":"B","text":"small groups"},{"k":"C","text":"tropical forest"},{"k":"D","text":"wide open spaces"}],"stem":"Most bovids have a preference for living in","n":2,"answer":"D"},{"n":3,"answer":"C","stem":"Which of the following features do all bovids have in common?","options":[{"k":"A","text":"Their horns are shed"},{"text":"They have upper incisors","k":"B"},{"k":"C","text":"They store food in the body"},{"k":"D","text":"Their hooves are undivided"}],"why":"Hepsi ruminant: 'they retain undigested food in their stomachs' - besini vucutta depolarlar; boynuzlar hic dokulmez, ust kesici disler yok, toynaklar yariktir."}]},{"instr":"Match each characteristic with the correct sub-family, A-D. You may use any letter more than once.","options":[{"text":"Antelope","k":"A"},{"k":"B","text":"Bovinae"},{"text":"Caprinae","k":"C"},{"text":"Cephalophinae","k":"D"}],"type":"matching","questions":[{"why":"Caprinae icin: 'Tolerance of extreme conditions is most marked in this group' - collerde, yuksek daglarda, arktik tundrada yasarlar.","answer":"C","n":4,"stem":"can endure very harsh environments"},{"why":"Bovinae buyuk bovidleri ve 'cattle' (sigir/okuz-inek) icerir.","stem":"includes the ox and the cow","n":5,"answer":"B"},{"n":6,"answer":"D","stem":"may supplement its diet with meat","why":"Cephalophinae (duiker): bazilari bocek yer, les yer ve kucuk hayvanlari oldurur."},{"why":"Antiloplar 'long-legged, fast-running species' - hizli kosan turler.","n":7,"answer":"A","stem":"can usually move at speed"},{"why":"Bovinae: 'Unlike most other bovids they are all non-territorial' - toprak savunmazlar.","answer":"B","n":8,"stem":"does not defend a particular area of land"}]},{"instr":"Answer the questions with NO MORE THAN TWO WORDS from the passage.","type":"completion","questions":[{"answer":"royal antelope","n":9,"stem":"What is the smallest species of Bovid called?","accept":["royal antelope","the royal antelope"],"why":"'the royal antelope of West Africa, which stands a mere 25 cm at the shoulder' - en kucuk tur."},{"accept":["auroch","the auroch","aurochs"],"why":"'the auroch ... is extinct' - Avrupa evcil sigirinin atasi, soyu tukenmis.","answer":"auroch","n":10,"stem":"Which species of Bovinae has now died out?"},{"n":11,"answer":"splayed hooves","stem":"What facilitates the movement of the sitatunga over wetland?","accept":["splayed hooves","long, splayed hooves","long splayed hooves","hooves"],"why":"'the sitatunga has long, splayed hooves that enable it to walk freely on swampy ground.'"},{"why":"Sitatunga'nin bataklikta yurumesini saglayan vucut kismi 'hooves' (toynaklar).","accept":["hooves","splayed hooves","its hooves"],"stem":"What body parts facilitate the movement of the sitatunga over wetland?","answer":"hooves","n":12},{"accept":["pronghorn","the pronghorn"],"why":"'The pronghorn is the sole survivor of ... the Antilocapridae' - tek yasayan uye.","n":13,"answer":"pronghorn","stem":"What is the only living member of the Antilocapridae sub-family?"}]}],"title":"Bovids","html":"<p>The family of mammals called bovids belongs to the Artiodactyl class, which also includes giraffes. Bovids are a highly diverse group consisting of 137 species, some of which are man's most important domestic animals.</p><p>Bovids are well represented in most parts of Eurasia and Southeast Asian islands, but they are by far the most numerous and diverse in the latter. Some species of bovid are solitary, but others live in large groups with complex social structures. Although bovids have adapted to a wide range of habitats, from arctic tundra to deep tropical forest, the majority of species favour open grassland, scrub or desert. This diversity of habitat is also matched by great diversity in size and form: at one extreme is the royal antelope of West Africa, which stands a mere 25 cm at the shoulder; at the other, the massively built bison of North America and Europe, growing to a shoulder height of 2.2m.</p><p>Despite differences in size and appearance, bovids are united by the possession of certain common features. All species are ruminants, which means that they retain undigested food in their stomachs, and regurgitate it as necessary. Bovids are almost exclusively herbivorous.</p><p>Typically their teeth are highly modified for browsing and grazing: grass or foliage is cropped with the upper lip and lower incisors (the upper incisors are usually absent), and then ground down by the cheek teeth. As well as having cloven, or split, hooves, the males of all bovid species and the females of most carry horns. Bovid horns have bony cores covered in a sheath of horny material that is constantly renewed from within; they are unbranched and never shed. They vary in shape and size: the relatively simple horns of a large Indian buffalo may measure around 4 m from tip to tip along the outer curve, while the various gazelles have horns with a variety of elegant curves.</p><p>Five groups, or sub-families, may be distinguished: Bovinae, Antelope, Caprinae, Cephalophinae and Antilocapridae. The sub-family <strong>Bovinae</strong> comprises most of the larger bovids, including the African bongo, and nilgae, eland, bison and cattle. Unlike most other bovids they are all non-territorial. The ancestors of the various species of domestic cattle, banteng, gaur, yak and water buffalo are generally rare and endangered in the wild, while the auroch (the ancestor of the domestic cattle of Europe) is extinct.</p><p>The term antelope is not a very precise zoological name; it is used to loosely describe a number of bovids that have followed different lines of development. <strong>Antelopes</strong> are typically long-legged, fast-running species, often with long horns that may be laid along the back when the animal is in full flight. There are two main sub-groups of antelope: Hippotraginae, which includes the oryx and the addax, and Antilopinae, which generally contains slighter and more graceful animals such as gazelle and the springbok. Antelopes are mainly grassland species, but many have adapted to flooded grasslands: pukus, waterbucks and lechwes are all good at swimming, usually feeding in deep water, while the sitatunga has long, splayed hooves that enable it to walk freely on swampy ground.</p><p>The sub-family <strong>Caprinae</strong> includes the sheep and the goat, together with various relatives such as the goral and the tahr. Most are woolly or have long hair. Several species, such as wild goats, chamois and ibex, are agile cliff- and mountain-dwellers. Tolerance of extreme conditions is most marked in this group: Barbary and bighorn sheep have adapted to arid deserts, while Rocky Mountain sheep survive high up in mountains and musk oxen in arctic tundra.</p><p>The duiker of Africa belongs to the <strong>Cephalophinae</strong> sub-family. It is generally small and solitary, often living in thick forest. Although mainly feeding on grass and leaves, some duikers, unlike most other bovids, are believed to eat insects and feed on dead animal carcasses, and even to kill small animals.</p><p>The pronghorn is the sole survivor of a New World sub-family of herbivorous ruminants, the Antilocapridae in North America. It is similar in appearance and habits to the Old World antelope. Although greatly reduced in numbers since the arrival of Europeans, and the subsequent enclosure of grasslands, the pronghorn is still found in considerable numbers throughout North America, from Washington State to Mexico. When alarmed by the approach of wolves or other predators, hairs on the pronghorn's rump stand erect, so showing and emphasizing the white patch there. At this signal, the whole herd gallops off at speed of over 60 km per hour.</p>"},{"groups":[{"type":"matching","options":[{"k":"A","text":"Paragraph A"},{"k":"B","text":"Paragraph B"},{"k":"C","text":"Paragraph C"},{"k":"D","text":"Paragraph D"},{"text":"Paragraph E","k":"E"},{"text":"Paragraph F","k":"F"},{"k":"G","text":"Paragraph G"},{"text":"Paragraph H","k":"H"},{"text":"Paragraph I","k":"I"}],"instr":"Which paragraph contains the following information? Write the correct letter A-I.","questions":[{"stem":"examples of countries where electricity use is greater during the day than at night","answer":"B","n":14,"why":"B paragrafı California ve Japonya'yi ornek verir: ofis/fabrikalarda gunduz klima yuku buyuk, ev isitma yuku kucuktur."},{"answer":"D","n":15,"stem":"a detailed description of an experiment that led to photovoltaics being promoted throughout the country","why":"D paragrafi Rokko Island test istasyonunu anlatir ve edinilen deneyimle Japonlarin ulke capinda buyuk kampanya baslattigini soyler."},{"why":"H paragrafi fosil yakitlarin hem mali maliyetini hem cevresel zararini ve sera etkisine katkisini belirtir.","stem":"the negative effects of using conventional means of generating electricity","n":16,"answer":"H"},{"why":"B paragrafi inverter, sebeke baglantisi ve gunduz/gece enerji akisiyla sistemin nasil calistigini aciklar.","stem":"an explanation of the photovoltaic system","n":17,"answer":"B"},{"stem":"the long-term benefits of using photovoltaics","n":18,"answer":"I","why":"I paragrafi ev sahibinin ilk maliyetinin enerji faturasi tasarrufuyla karsilandigini ve herkesin cevresel fayda saglayacagini soyler."},{"why":"G paragrafi Avrupa Komisyonu'nun 500.000'i gelismekte olan ulkelerde olmak uzere sistemleri subvanse etmesini belirtir.","answer":"G","n":19,"stem":"a reference to wealthy countries being prepared to help less wealthy countries have access to photovoltaics"}]},{"instr":"Do the following statements agree with the information in the passage? Write TRUE, FALSE or NOT GIVEN.","type":"tfng","questions":[{"why":"B paragrafi sahada depolama gerekmedigini, depolamayi sebekenin sagladigini soyler.","answer":"FALSE","n":20,"stem":"Photovoltaics are used to store electricity."},{"stem":"Since the 1970s, the US government has provided continuous support for the use of photovoltaics on homes.","n":21,"answer":"FALSE","why":"C paragrafi 1980'lerin basinda ABD hukumet onceliklerindeki degisimin programi durdurdugunu belirtir."},{"n":22,"answer":"TRUE","stem":"The solar-powered house on Rokko Island is uninhabited.","why":"D paragrafi evlerin 'var olmayan sakinler' (non-existent occupants) icin bir yasam simule ettigini soyler."},{"why":"F paragrafi 1994'te sistemlerin %50 hukumet subvansiyonuyla kuruldugunu belirtir; %50 = yarisi.","stem":"In 1994, the Japanese government was providing half the money required for installing photovoltaics on homes.","n":23,"answer":"TRUE"},{"n":24,"answer":"FALSE","stem":"Germany, Italy, the Netherlands and Australia all have strict goals with regard to greenhouse gas emissions.","why":"G paragrafi bu ulkelerin hedeflerinin sera gazi degil konut fotovoltaikleri icin oldugunu soyler."},{"why":"H paragrafi konut elektrik kullanimini kaynaklardan biri olarak sayar ama en buyuk kaynak oldugunu belirtmez.","stem":"Residential electricity use is the major source of greenhouse gas emission.","answer":"NOT GIVEN","n":25},{"stem":"Energy-saving measures must now be included in the design of all new homes and improvements to buildings.","answer":"FALSE","n":26,"why":"I paragrafi bunun gelecekte 'muhtemelen' olacagini soyler, su anda zorunlu oldugunu degil."}]}],"title":"Photovoltaics on the rooftop","html":"<p><strong>A</strong> In the past, urban homeowners have not always had much choice in the way electricity is supplied to their homes. Now, however, there is a choice, and a rapidly increasing number of households worldwide are choosing the solar energy option. Solar energy, the conversion of sunlight into energy, is made possible through the use of 'photovoltaics', which are simple appliances that fit onto the roof of a house.</p><p><strong>B</strong> The photovoltaics-powered home remains connected to the power lines, but no storage is required on-site, only a box of electronics (the inverter) to interface between the photovoltaics and the grid network. Figure 1 illustrates the system. During the day, when the home may not be using much electricity, excess power from the solar array is fed back to the grid, to factories and offices that need daytime power. At night, power flows the opposite way. The grid network effectively provides storage. If the demand for electricity is well matched to when the sun shines, solar energy is especially valuable. This occurs in places like California in the US and Japan, where air-conditioning loads for offices and factories are large but heating loads for homes are small.</p><p><strong>C</strong> The first systematic exploration of the use of photovoltaics on homes began in the US during the 1970s. A well-conceived program started with the siting of a number of residential 'experiment stations' at selected locations around the country, representing different climatic zones. These stations contained a number of 'dummy' houses, each with a different solar-energy system design. Homes within the communities close to these stations were monitored to see how well their energy use matched the energy generated by the stations' dummy roofs. A change in US government priorities in the early 1980s halted this program.</p><p><strong>D</strong> With the US effort dropping away, the Japanese Sunshine Project came to the fore. A large residential test station was installed on Rokko Island beginning in 1986. This installation consists of 18 'dummy' homes, each equipped with its own 2-5 kilowatt photovoltaic system. Some of these simulated homes have their own electrical appliances inside, such as TV sets, refrigerators and air conditioning units, which switch on and off under computer control providing a lavish lifestyle for the non-existent occupants. For the other systems, electronics simulate these household loads. This test station has allowed photovoltaics to be explored in a systematic way, under well-controlled test conditions. With no insurmountable problems identified, the Japanese have used the experience gained from this station to begin their own massive residential photovoltaics campaign.</p><p><strong>E</strong> Meanwhile, Germany began a very important '1,000 roof program' in 1990, aimed at installing photovoltaics on the roofs of 1,000 private homes. Large federal and regional government subsidies were involved, accounting in most cases for 70% of the total system costs. The program proved immensely popular, forcing its extension to over 2,000 homes scattered across Germany. The success of this program stimulated other European countries to launch a similar program.</p><p><strong>F</strong> Japan's 'one million roof program' was prompted by the experience gained in the Rokko Island test site and the success of the German 1,000 roof program. The initially quoted aims of the Japanese New Energy Development Organization were to have 70,000 homes equipped with photovoltaics by the year 2000, on the way to 1 million by 2010. The program made a modest start in 1994 when 539 systems were installed with a government subsidy of 50 percent. Under this program, entire new suburban developments are using photovoltaics.</p><p><strong>G</strong> The Japanese initiative in embracing residential photovoltaics on a large scale prompted responses in both Europe and the US. The European Commission has called for one million solar residential systems before the year 2010, with 500,000 in Europe and 500,000 in the developing world, to be subsidised by the Commission. In 1997, a similar one million roof target was announced in the US. Since then, several other countries including Germany, Italy, the Netherlands and Australia have announced their own targets for residential photovoltaics.</p><p><strong>H</strong> This is good news, not only for the photovoltaic industry but for everyone concerned with the environment. The use of fossil fuels to generate electricity is not only costly in financial terms, but also in terms of environmental damage. Gases produced by the burning of fossil fuels in the production of electricity are a major contributor to the greenhouse effect. To deal with this problem, many governments are now proposing stringent targets on the amount of greenhouse gas emissions permitted. These targets mean that all sources of greenhouse gas emissions including residential electricity use will receive closer attention in the future.</p><p><strong>I</strong> It is likely that in the future, governments will develop building codes that attempt to constrain the energy demands of new housing. For example, the use of photovoltaics or the equivalent may be stipulated to lessen demands on the grid network and hence reduce fossil fuel emissions. Approvals for building renovations may also be conditional upon taking such energy-saving measures. If this were to happen, everyone would benefit. Although there is an initial cost in attaching the system to the rooftop, the householder's outlay is soon compensated with the savings on energy bills. In addition, everyone living on the planet stands to gain from the more benign environmental impact.</p>"},{"groups":[{"questions":[{"answer":"iv","n":27,"stem":"Section B","accept":["iv"],"why":"B bölümü üç öğretim yöntemini (whole-word, phonics, whole-language) tanıtır."},{"why":"C bölümü, okurken sesletme yapılıp yapılmadığı üzerine görüş ayrılığını anlatır.","accept":["i"],"stem":"Section C","answer":"i","n":28},{"accept":["vii"],"why":"D bölümü üniversite öğrencileri ve öğrencilerle yapılan deneyleri anlatır.","n":29,"answer":"vii","stem":"Section D"},{"stem":"Section E","n":30,"answer":"ii","why":"E bölümü tartışmanın kökenini geleneksel-ilerici felsefi ayrılığa bağlar.","accept":["ii"]},{"stem":"Section F","answer":"iii","n":31,"why":"F bölümü phonics ile whole-language'in birleşiminin daha güçlü olduğunu savunur.","accept":["iii"]}],"instr":"Reading Passage 3 has six sections, A-F. Choose the correct heading for sections B-F from the list of headings below (i-ix).","type":"matching","options":[{"text":"Disagreement about the reading process","k":"i"},{"text":"The roots of the debate","k":"ii"},{"text":"A combined approach","k":"iii"},{"k":"iv","text":"Methods of teaching reading"},{"text":"A controversial approach","k":"v"},{"text":"Inconclusive research","k":"vi"},{"k":"vii","text":"Research with learners"},{"text":"Allowing teachers more control","k":"viii"},{"k":"ix","text":"A debate amongst educators"}]},{"instr":"Do the following statements agree with the information given in Reading Passage 3? Write TRUE, FALSE or NOT GIVEN.","type":"tfng","questions":[{"stem":"The whole-language approach relates letters to sounds.","answer":"FALSE","n":32,"why":"Harf-ses ilişkisi phonics'in yöntemidir; whole-language bağlamdan tahmin ettirir.","accept":["FALSE"]},{"why":"B bölümü: öğretmenler okumayı eğlenceli kıldığı için whole-language'i benimsedi; phonics sıkıcı görülür.","accept":["TRUE"],"stem":"Many educators believe the whole-language approach to be the most interesting way to teach children to read.","answer":"TRUE","n":33},{"accept":["FALSE"],"why":"Homofon deneyleri okurların harfleri sese çevirdiğini, yani tam tersini destekler.","n":34,"answer":"FALSE","stem":"Research supports the theory that we read without linking words to sounds."},{"stem":"Research has shown that the whole-word approach is less effective than the whole-language approach.","answer":"NOT GIVEN","n":35,"why":"Whole-word ile whole-language doğrudan karşılaştırılmaz; ikisi de phonics ile kıyaslanır.","accept":["NOT GIVEN"]},{"stem":"Research has shown that phonics is more successful than both the whole-word and whole-language approaches.","n":36,"answer":"TRUE","why":"D bölümü: phonics whole-word'den daha çok yeni kelime okuttu ve whole-language'e karşı daha yüksek puan aldı.","accept":["TRUE"]}],"labels":["TRUE","FALSE","NOT GIVEN"]},{"questions":[{"stem":"In the teaching community, ___ question the usefulness of research into methods of teaching reading.","n":37,"answer":"E","why":"E bölümü: ilericiler (progressives) laboratuvar ve sınıf araştırmalarının değerine kuşkuyla bakar.","accept":["E"]},{"accept":["A"],"why":"İlericiler phonics'in öğrenci merkezli öğrenmeyle bağdaşmadığını sanır; oysa bağdaştığını fark edemezler.","n":38,"answer":"A","stem":"These critics believe that ___ is incompatible with student-centred learning."},{"why":"F bölümü: öğretmenler okumayla ilgili dilbilim (linguistics) araştırmalarını öğrenmelidir.","accept":["F"],"stem":"In the future, teachers need to be aware of ___ so that they understand the importance of phonics.","answer":"F","n":39},{"why":"F bölümü: whole-language etkinlikleri okumayı eğlenceli ve anlamlı kılar, atılmamalı.","accept":["C"],"stem":"They should not, however, ignore the ideas of ___ which make reading enjoyable for learners.","n":40,"answer":"C"}],"instr":"Complete the summary of sections E and F using the list of words, A-G, below. Write the correct letter, A-G.","options":[{"text":"the phonics method","k":"A"},{"text":"the whole-word method","k":"B"},{"text":"the whole-language method","k":"C"},{"k":"D","text":"traditionalists"},{"k":"E","text":"progressives"},{"k":"F","text":"linguistics"},{"k":"G","text":"research studies"}],"type":"matching"}],"title":"How should reading be taught?","html":"<p><strong>A</strong> Learning to speak is automatic for almost all children, but learning to read requires elaborate instruction and conscious effort. Well aware of the difficulties, educators have given a great deal of thought to how they can best help children learn to read. No single method has triumphed. Indeed, heated arguments about the most appropriate form of reading instruction continue to polarize the teaching community.</p><p><strong>B</strong> Three general approaches have been tried. In one, called whole-word instruction, children learn by rote how to recognise at a glance a vocabulary of 50 to 100 words. Then they gradually acquire other words, often through seeing them used over and over again in the context of a story. Speakers of most languages learn the relationship between letters and the sounds associated with them (phonemes). That is, children are taught how to use their knowledge of the alphabet to sound out words. This procedure constitutes a second approach to teaching reading - phonics. Many schools have adopted a different approach: the whole-language method. The strategy here relies on the child's experience with the language. For example, students are offered engaging books and are encouraged to guess the words that they do not know by considering the context of the sentence or by looking for clues in the storyline and illustrations, rather than trying to sound them out. Many teachers adopted the whole-language approach because of its intuitive appeal. Making reading fun promises to keep children motivated, and learning to read depends more on what the student does than on what the teacher does. The presumed benefits of whole-language instruction - and the contrast to the perceived dullness of phonics - led to its growing acceptance across America during the 1990s and a movement away from phonics.</p><p><strong>C</strong> However, many linguists and psychologists objected strongly to the abandonment of phonics in American schools. Why was this so? In short, because research had clearly demonstrated that understanding how letters related to the component sounds in words is critically important in reading. This conclusion rests, in part, on knowledge of how experienced readers make sense of words on a page. Advocates of whole-language instruction have argued forcefully that people often derive meanings directly from print without ever determining the sound of the word. Some psychologists today accept this view, but most believe that reading is typically a process of rapidly sounding out words mentally. Compelling evidence for this comes from experiments which show that subjects often confuse homophones (words that sound the same, such as 'rose' and 'rows'). This supports the idea that readers convert strings of letters to sounds.</p><p><strong>D</strong> In order to evaluate different approaches to teaching reading, a number of experiments have been carried out, firstly with college students, then with school pupils. Investigators trained English-speaking college students to read using unfamiliar symbols such as Arabic letters (the phonics approach), while another group learned entire words associated with certain strings of Arabic letters (whole-word). Then both groups were required to read a new set of words constructed from the original characters. In general, readers who were taught the rules of phonics could read many more new words than those trained with a whole-word procedure. Classroom studies comparing phonics with either whole-word or whole-language instruction are also quite illuminating. One particularly persuasive study compared two programmes used in 20 first-grade classrooms. Half the students were offered traditional reading instruction, which included the use of phonics drills and applications. The other half were taught using an individualised method that drew from their experiences with languages; these children produced their own booklets of stories and developed sets of words to be recognised (common components of the whole-language approach). This study found that the first group scored higher at year's end on tests of reading and comprehension.</p><p><strong>E</strong> If researchers are so convinced about the need for phonics instruction, why does the debate continue? Because the controversy is enmeshed in the philosophical differences between traditional and progressive (or new) approaches, differences that have divided educators for years. The progressives challenge the results of laboratory tests and classroom studies on the basis of a broad philosophical skepticism about the value of such research. They champion student-centred learning and teacher empowerment. Sadly, they fail to realise that these very admirable educational values are equally consistent with the teaching of phonics.</p><p><strong>F</strong> If schools of education insisted that would-be reading teachers learned something about the vast research in linguistics and psychology that bears on reading, their graduates would be more eager to use phonics and would be prepared to do so effectively. They could allow their pupils to apply the principles of phonics while reading for pleasure. Using whole-language activities to supplement phonics instruction certainly helps to make reading fun and meaningful for children, so no one would want to see such tools discarded. Indeed, recent work has indicated that the combination of literature-based instruction and phonics is more powerful than either method used alone. Teachers need to strike a balance. But in doing so, we urge them to remember that reading must be grounded in a firm understanding of the connections between letters and sounds. Educators who deny this reality are neglecting decades of research. They are also neglecting the needs of their students.</p>"}]},"theme":"Akademik tam deneme Â· Reading + Listening + Writing","writing":{"task2":{"model":"In recent years, many educators have argued that requiring students to complete unpaid community service before graduating from high school would benefit both young people and society. I strongly agree with this proposal, as it cultivates civic responsibility and equips teenagers with valuable practical skills.\n\nThe primary reason for supporting compulsory community service is that it fosters empathy and a sense of social responsibility. Adolescents who spend time assisting the elderly, tutoring disadvantaged children or cleaning local parks gain first-hand exposure to social problems that they might otherwise ignore. This experience encourages them to become active, compassionate citizens rather than passive observers. A student who volunteers at a homeless shelter, for instance, is far more likely to appreciate the challenges faced by vulnerable groups and to contribute to solutions in adulthood.\n\nFurthermore, community service develops competencies that classrooms alone cannot provide. Working alongside strangers of different ages and backgrounds teaches teamwork, communication and problem-solving, all of which are highly prized by universities and employers. Such practical experience can also help young people discover their interests and clarify future career paths.\n\nOpponents contend that forcing students to volunteer is contradictory and may breed resentment. While this concern is understandable, well-designed programmes that offer a genuine choice of activities can transform reluctant participants into enthusiastic ones. Moreover, the long-term benefits to character and community clearly outweigh any short-term reluctance.\n\nIn conclusion, although compulsory volunteering may initially seem paradoxical, I firmly believe that integrating unpaid community service into high school curricula produces more responsible, capable and well-rounded individuals. Schools should therefore embrace it as an essential component of education.","minWords":250,"prompt":"Some people believe that unpaid community service should be a compulsory part of high school education programmes (for example, working for a charity, improving the neighbourhood or teaching sports to younger children).\n\nTo what extent do you agree or disagree?"},"task1":{"svg":"<svg viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial, sans-serif\"><text x=\"280\" y=\"20\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8A7F6E\" font-weight=\"bold\">Electricity generated from renewable sources (% of total)</text><line x1=\"55\" y1=\"45\" x2=\"530\" y2=\"45\" stroke=\"#eadfce\" stroke-width=\"1\"/><line x1=\"55\" y1=\"88\" x2=\"530\" y2=\"88\" stroke=\"#eadfce\" stroke-width=\"1\"/><line x1=\"55\" y1=\"131\" x2=\"530\" y2=\"131\" stroke=\"#eadfce\" stroke-width=\"1\"/><line x1=\"55\" y1=\"174\" x2=\"530\" y2=\"174\" stroke=\"#eadfce\" stroke-width=\"1\"/><line x1=\"55\" y1=\"217\" x2=\"530\" y2=\"217\" stroke=\"#eadfce\" stroke-width=\"1\"/><line x1=\"55\" y1=\"260\" x2=\"530\" y2=\"260\" stroke=\"#8A7F6E\" stroke-width=\"1\"/><line x1=\"55\" y1=\"45\" x2=\"55\" y2=\"260\" stroke=\"#8A7F6E\" stroke-width=\"1\"/><text x=\"47\" y=\"264\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">0</text><text x=\"47\" y=\"221\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">10</text><text x=\"47\" y=\"178\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">20</text><text x=\"47\" y=\"135\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">30</text><text x=\"47\" y=\"92\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">40</text><text x=\"47\" y=\"49\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">50</text><rect x=\"87\" y=\"183\" width=\"26\" height=\"77\" fill=\"#2E6E6A\"/><rect x=\"117\" y=\"230\" width=\"26\" height=\"30\" fill=\"#B78A2E\"/><rect x=\"147\" y=\"226\" width=\"26 </text></svg>","prompt":"The chart below shows the percentage of electricity generated from renewable sources in Canada, Germany and Australia in 2000, 2010 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.","model":"The grouped bar chart illustrates the proportion of electricity generated from renewable sources in Canada, Germany and Australia in 2000, 2010 and 2020, expressed as a percentage of the total.\n\nOverall, all three countries increased their reliance on renewables substantially across the two decades. The most striking feature is Germany's dramatic transformation: despite starting from the lowest point, it ultimately overtook both of the other nations.\n\nIn 2000, Canada led the group, generating 18% of its electricity from renewable sources, whereas Germany and Australia lagged well behind at just 7% and 8% respectively. Over the following decade, Canada maintained its lead, rising to 25%, while Germany more than doubled its figure to 17% and Australia climbed modestly to 12%.\n\nThe sharpest changes occurred by 2020. Germany surged to 40%, the highest figure anywhere on the chart, having risen from the lowest starting position. Canada also continued to grow steadily, reaching 34%, while Australia, though improving to 28%, remained the least reliant on renewables throughout the entire period.","minWords":150}}}

      document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t===b);});
      document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+b.dataset.sec);});
      window.scrollTo({top:0,behavior:'smooth'});
    });

    var band=function(raw){var t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4]];for(var i=0;i<t.length;i++){if(raw>=t[i][0])return t[i][1];}return '<4';};

    // ---- render a question group (shared reading/listening) ----
    function renderGroup(g,idprefix){
      var h='<div class="grp"><div class="instr">'+esc(g.instr)+'</div>';
      // matching options legend
      if(g.type==='matching'&&g.options){
        h+='<div style="font-size:13.5px;color:var(--muted);margin:0 0 12px">';
        g.options.forEach(function(o){h+='<div><b>'+esc(o.k)+'</b> &nbsp;'+esc(o.text)+'</div>';});
        h+='</div>';
      }
      (g.questions||[]).forEach(function(q){
        var qid=idprefix+'-'+q.n;
        var ansList=Array.isArray(q.answer)?q.answer.slice():[q.answer];
        if(q.accept)ansList=ansList.concat(q.accept);
        var marks=q.marks||1;
        h+='<div class="q" id="q-'+qid+'" data-ans="'+esc(ansList.join('|'))+'" data-marks="'+marks+'"'+(g.type==='multi'?' data-multi="1"':'')+'>';
        h+='<div class="stem"><span class="qn">'+q.n+'</span>'+esc(q.stem)+'</div>';
        if(g.type==='tfng'){
          var labels=g.labels||['TRUE','FALSE','NOT GIVEN'];
          h+='<div class="opts">';
          labels.forEach(function(o){h+='<label class="opt" data-v="'+esc(o)+'"><input type="radio" name="'+qid+'">'+esc(o)+'</label>';});
          h+='</div>';
        } else if(g.type==='mcq'){
          h+='<div class="opts">';
          (q.options||[]).forEach(function(o){h+='<label class="opt" data-v="'+esc(o.k)+'"><input type="radio" name="'+qid+'"><b style="margin-right:6px">'+esc(o.k)+'</b>'+esc(o.text)+'</label>';});
          h+='</div>';
        } else if(g.type==='multi'){
          h+='<div class="opts">';
          (g.options||[]).forEach(function(o){h+='<label class="opt" data-v="'+esc(o.k)+'"><input type="checkbox" name="'+qid+'"><b style="margin-right:6px">'+esc(o.k)+'</b>'+esc(o.text)+'</label>';});
          h+='</div>';
        } else if(g.type==='matching'){
          h+='<select class="gap" data-q="'+qid+'"><option value="">— seç —</option>';
          g.options.forEach(function(o){h+='<option value="'+esc(o.k)+'">'+esc(o.k)+' · '+esc(o.text)+'</option>';});
          h+='</select>';
        } else { // completion
          h+='<input class="gap" type="text" data-q="'+qid+'" placeholder="cevap" autocomplete="off">';
        }
        var acc=(q.accept&&q.accept.length)?q.accept.join(', '):(Array.isArray(q.answer)?q.answer.join(' / '):q.answer);
        h+='<div class="fb"><b>Doğru cevap:</b> '+esc(acc)+(q.why?' — '+esc(q.why):'')+'</div>';
        h+='</div>';
      });
      h+='</div>';
      return h;
    }

    function wireOpts(root){
      root.querySelectorAll('.opt').forEach(function(l){
        l.addEventListener('click',function(){
          var input=l.querySelector('input');
          if(input.type==='checkbox'){ input.checked=!input.checked; l.classList.toggle('sel',input.checked); }
          else { root.querySelectorAll('.opt input[name="'+input.name+'"]').forEach(function(i){i.closest('.opt').classList.remove('sel');}); l.classList.add('sel'); input.checked=true; }
        });
      });
    }

    function gradeSection(root,qids){
      var raw=0,total=0;
      qids.forEach(function(qid){
        var qel=document.getElementById('q-'+qid); if(!qel)return;
        var accepts=qel.getAttribute('data-ans').split('|').map(norm);
        var marks=+qel.getAttribute('data-marks')||1; total+=marks;
        qel.classList.remove('right','wrong','part');
        if(qel.getAttribute('data-multi')){
          var got=0;
          qel.querySelectorAll('.opt').forEach(function(o){
            var isC=accepts.indexOf(norm(o.dataset.v))>=0;
            o.classList.toggle('correct',isC);
            if(o.classList.contains('sel')&&isC)got++;
          });
          got=Math.min(got,marks); raw+=got;
          qel.classList.add(got>=marks?'right':(got>0?'part':'wrong'));
        } else {
          var val='';
          var sel=qel.querySelector('.opt.sel');
          var inp=qel.querySelector('input.gap,select.gap');
          if(sel){val=sel.dataset.v;} else if(inp){val=inp.value;}
          var ok=accepts.indexOf(norm(val))>=0;
          qel.classList.add(ok?'right':'wrong');
          if(sel){ qel.querySelectorAll('.opt').forEach(function(o){o.classList.toggle('correct',accepts.indexOf(norm(o.dataset.v))>=0);}); }
          if(ok)raw+=marks;
        }
      });
      return {raw:raw,total:total};
    }

    // ================= READING =================
    (function(){
      var R=D.reading; var el=document.getElementById('sec-reading');
      if(!R){el.innerHTML='<p class="note">Reading içeriği yükleniyor…</p>';return;}
      var qids=[];
      var h='';
      (R.passages||[]).forEach(function(p,pi){
        h+='<div class="passage"><h3>'+esc(p.title)+'</h3>'+p.html+'</div>';
        (p.groups||[]).forEach(function(g){ h+=renderGroup(g,'r'); (g.questions||[]).forEach(function(q){qids.push('r-'+q.n);}); });
      });
      h+='<div class="actions"><button class="btn" id="gradeR">Cevapları kontrol et</button><span class="score" id="scoreR"></span></div>';
      el.innerHTML=h; wireOpts(el);
      document.getElementById('gradeR').addEventListener('click',function(){
        var res=gradeSection(el,qids);
        document.getElementById('scoreR').innerHTML='Doğru <b>'+res.raw+' / '+res.total+'</b> · %'+Math.round(res.raw/res.total*100);
        document.getElementById('gradeR').scrollIntoView({behavior:'smooth',block:'center'});
      });
    })();

    // ================= LISTENING =================
    (function(){
      var L=D.listening; var el=document.getElementById('sec-listening');
      if(!L){el.innerHTML='<p class="note">Listening içeriği yükleniyor…</p>';return;}
      var qids=[]; var h='';
      h+='<div class="audio-wrap">';
      if(L.audio){ h+='<audio controls preload="none" src="'+esc(L.audio)+'"></audio>'; }
      else { h+='<div class="note">Ses dosyası yakında (MP3 bucket\'a eklenecek). Şimdilik aşağıdaki transcript ile test edebilirsin.</div>'; }
      if(L.note){ h+='<div class="note">'+esc(L.note)+'</div>'; }
      h+='<div class="reveal" style="margin-top:10px"><button class="btn ghost" data-reveal>Transcript\'i göster</button><div class="reveal-body transcript">'+esc(L.transcript||'')+'</div></div>';
      h+='</div>';
      (L.sections||[]).forEach(function(s){
        h+='<div style="font-family:\'Crimson Pro\',serif;font-size:1.15rem;margin:6px 0 10px">'+esc(s.sectionTitle||s.title||'Section')+'</div>';
        (s.groups||[]).forEach(function(g){ h+=renderGroup(g,'l'); (g.questions||[]).forEach(function(q){qids.push('l-'+q.n);}); });
      });
      h+='<div class="actions"><button class="btn" id="gradeL">Cevapları kontrol et</button><span class="score" id="scoreL"></span></div>';
      el.innerHTML=h; wireOpts(el);
      el.querySelectorAll('[data-reveal]').forEach(function(b){b.addEventListener('click',function(){b.closest('.reveal').classList.toggle('open');});});
      document.getElementById('gradeL').addEventListener('click',function(){
        var res=gradeSection(el,qids);
        document.getElementById('scoreL').innerHTML='Doğru <b>'+res.raw+' / '+res.total+'</b> · %'+Math.round(res.raw/res.total*100);
      });
    })();

    // ================= WRITING =================
    (function(){
      var W=D.writing; var el=document.getElementById('sec-writing');
      if(!W){el.innerHTML='<p class="note">Writing içeriği yükleniyor…</p>';return;}
      function task(t,label,idx){
        var h='<div class="wtask"><span class="eyebrow">'+label+'</span><h3>Task '+idx+'</h3>';
        h+='<p class="prompt">'+esc(t.prompt)+'</p>';
        if(t.svg){h+='<div class="figure">'+t.svg+'</div>';}
        h+='<textarea class="editor" data-target="'+(t.minWords||150)+'" placeholder="Cevabını buraya yaz…"></textarea>';
        h+='<div class="wc">0 kelime · hedef '+(t.minWords||150)+'</div>';
        h+='<div class="reveal"><button class="btn ghost" data-reveal>Model cevabı göster</button><div class="reveal-body">'+esc(t.model||'').replace(/\n/g,'<br>')+'</div></div>';
        h+='</div>';
        return h;
      }
      el.innerHTML=task(W.task1,'Rapor · en az 150 kelime',1)+task(W.task2,'Deneme · en az 250 kelime',2);
      el.querySelectorAll('.editor').forEach(function(t){
        var wc=t.nextElementSibling, tgt=+t.dataset.target;
        t.addEventListener('input',function(){var n=(t.value.trim().match(/\S+/g)||[]).length;wc.textContent=n+' kelime · hedef '+tgt;wc.classList.toggle('ok',n>=tgt);});
      });
      el.querySelectorAll('[data-reveal]').forEach(function(b){b.addEventListener('click',function(){b.closest('.reveal').classList.toggle('open');b.textContent=b.closest('.reveal').classList.contains('open')?'Model cevabı gizle':'Model cevabı göster';});});
    })();

    // header
    if(D.number)document.getElementById('exNum').textContent=D.number;
    if(D.theme)document.getElementById('exSub').textContent=D.theme+' · Reading · Listening · Writing';
  })();
  </script>
</body>
