t the time called the choice a waste of her talent. History has been kinder. The mural is now seen as the fullest expression of her style, the work in which every earlier experiment finally came together.","why_wrong":{"D":"Other painters' murals are not compared.","B":"Describing the mural is topic material, not the purpose, which concerns changing judgment.","C":"The text sides with the later, kinder view, not the original critics."},"id":"u2-l2-f1-09","stem":"Which choice best states the main purpose of the text?","choice_families":{"B":"Doğru konu yanlış işlev","C":"Ters işlev","D":"Metinde olmayan işlev"},"target_family":"Doğru konu yanlış işlev","lesson":2,"choices":{"B":"To describe the mural the painter made in her final years.","A":"To trace a shift in how a late work has come to be judged.","C":"To argue that the critics of the painter's time were correct.","D":"To compare the mural with murals by other painters."},"lesson_name":"Text Structure and Purpose","why_correct":"The text moves from harsh contemporary judgment to a kinder later view, tracing a shift in reception. Choice A fits.","unit":2},{"unit":2,"why_correct":"The text states the old 'idling' idea, then overturns it with active processes. Choice A tracks that structure.","lesson_name":"Text Structure and Purpose","choices":{"B":"An outdated idea is stated, then replaced by a description of active processes that overturn it.","A":"The text explains, stage by stage, what the brain does during sleep as it replays the day, strengthens memories, and clears waste.","C":"A modern account of sleep is presented and then called into doubt.","D":"Two theories about why humans need sleep are weighed against each other."},"lesson":2,"target_family":"Doğru konu yanlış işlev","choice_families":{"D":"Metinde olmayan işlev","A":"Doğru konu yanlış işlev","C":"Ters işlev"},"stem":"Which choice best describes the overall structure of the text?","id":"u2-l2-f1-10","why_wrong":{"C":"The text presents the modern account as established, not doubtful.","A":"This states the topic (brain during sleep) rather than the overturning structure.","D":"No two theories of why we sleep are weighed."},"correct":"B","passage":"Sleep was once thought to be a period of pure rest, the brain simply idling. That picture has been overturned. During sleep the brain replays the day's experiences, strengthens some memories, and clears away certain waste products. Rest, it turns out, is anything but idle."},{"choices":{"C":"A new solution is proposed and then shown to fail like the others.","B":"A problem is stated, past failed solutions are reviewed, and a new solution is proposed and defended.","A":"A recurring problem with a wind-swept bridge is described in careful detail, along with the three separate repairs attempted over the years.","D":"Two damping systems are compared and rated equally effective."},"lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the overall structure of the text?","choice_families":{"C":"Ters işlev","A":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev"},"why_correct":"The text moves problem, failed fixes, new solution and defense. Choice A covers the whole arc.","target_family":"Metnin bir kısmi bütünü değil","unit":2,"correct":"B","passage":"The engineer first outlines the problem: the bridge sways in high wind. She then walks through three failed fixes attempted over the years. Finally, she proposes a new damping system and explains why it should succeed where the others did not.","why_wrong":{"D":"Only one new system is proposed; two are not rated equally.","A":"Describing the problem is only the first part; the question asks about the whole structure.","C":"The text defends the new solution rather than showing it fails."},"id":"u2-l2-f2-01","lesson":2},{"why_wrong":{"D":"No two recipes are compared.","B":"The memory is only the opening; the question asks about the whole structure.","A":"The order is reversed: the memory comes first, then the broad claim."},"correct":"C","passage":"The essay opens with a vivid childhood memory of the author's grandmother baking bread. It then widens outward, using that memory to reflect on how food carries family history, and closes by arguing that recipes are a form of inheritance as real as any heirloom.","id":"u2-l2-f2-02","stem":"Which choice best describes the overall structure of the text?","target_family":"Metnin bir kısmi bütünü değil","choice_families":{"A":"Ters işlev","B":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev"},"lesson":2,"lesson_name":"Text Structure and Purpose","choices":{"C":"A personal memory opens the text and is then developed into a broader claim about food and inheritance.","A":"A broad claim is stated first and then narrowed to a single memory.","B":"The author recounts a vivid childhood memory of a grandmother baking bread and lingers on the warmth of that early family scene.","D":"Two family recipes are compared across generations."},"unit":2,"why_correct":"The text opens with a memory and widens into a broader claim about inheritance. Choice A captures the full movement."},{"why_correct":"The text raises a puzzle, rejects weak explanations, names a cause, and calls for testing. Choice A covers all of it.","unit":2,"choices":{"A":"Two lakes are compared to explain why one thrives.","B":"A puzzle about a thriving lake is introduced.","C":"A likely cause is named at the very start and then two easy explanations are added afterward to lend it further support.","D":"A puzzle is raised, weak explanations are dismissed, a likely cause is identified, and further study is urged."},"lesson_name":"Text Structure and Purpose","lesson":2,"choice_families":{"C":"Ters işlev","B":"Metnin bir kısmi bütünü değil","A":"Metinde olmayan işlev"},"target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?","id":"u2-l2-f2-03","correct":"D","passage":"The report begins by noting a puzzle: a lake that should be dying is instead thriving. It reviews and rejects two easy explanations, then identifies an overlooked underground spring as the likely cause, and ends by calling for further testing.","why_wrong":{"A":"Only one lake is discussed; two are not compared.","B":"Introducing the puzzle is only the opening; the question asks about the whole.","C":"The order is wrong: explanations are rejected before the cause is named."}},{"lesson":2,"why_correct":"The text gives a definition, tests it with counterexamples, and finds it inadequate. Choice A covers the whole.","unit":2,"choices":{"C":"Counterexamples are offered first and a definition is built from them.","A":"A standard definition is introduced, tested against counterexamples, and then judged inadequate.","B":"A standard definition of intelligence as sheer problem-solving speed is presented and illustrated at length before anything else.","D":"An octopus and a crow are compared to decide which is smarter."},"lesson_name":"Text Structure and Purpose","id":"u2-l2-f2-04","correct":"A","passage":"The lecture starts with a familiar definition of intelligence as problem-solving speed. It then presents cases, an octopus, a crow, that solve problems slowly but creatively, and concludes that speed is a poor measure of intelligence on its own.","why_wrong":{"B":"The definition is only the opening; the question asks about the full structure.","C":"The definition comes first, not built from the examples afterward.","D":"The animals illustrate a point; they are not ranked against each other."},"choice_families":{"C":"Ters işlev","B":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev"},"target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?"},{"why_correct":"The text praises, then criticizes, then lands on a balanced verdict. Choice A captures the arc.","unit":2,"choices":{"B":"An initial praise is followed by criticism, leading to a balanced final judgment.","A":"The article praises the speed of a new translation tool.","C":"The article first criticizes the new tool's many failings and then quietly withdraws every one of those criticisms by the end.","D":"Two translation tools are compared feature by feature."},"lesson_name":"Text Structure and Purpose","lesson":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","A":"Metnin bir kısmi bütünü değil"},"target_family":"Metnin bir kısmi bütünü değil","stem":"Which choice best describes the overall structure of the text?","id":"u2-l2-f2-05","passage":"The article first celebrates the speed of a new translation tool. It then turns critical, showing how the tool flattens idioms and loses tone. It ends in the middle: useful for gist, it argues, but no substitute for a human translator.","correct":"B","why_wrong":{"A":"The praise is only the opening; the question asks about the whole.","C":"The criticisms stand in the final judgment rather than being withdrawn.","D":"Only one tool is discussed."}},{"why_wrong":{"D":"Only one fossil is discussed.","A":"The order is reversed: the fossil opens the text, the reflection closes it.","B":"The discovery is only the opening; the question asks about the full structure."},"correct":"C","passage":"The chapter opens with the discovery of a strange fossil. It then reconstructs, step by step, how researchers determined the animal's diet, gait, and habitat from a few bones. It closes by noting how much can be inferred from how little.","id":"u2-l2-f2-06","stem":"Which choice best describes the overall structure of the text?","target_family":"Metnin bir kısmi bütünü değil","choice_families":{"A":"Ters işlev","B":"Metnin bir kısmi bütünü değil","D":"Metinde olmayan işlev"},"lesson":2,"lesson_name":"Text Structure and Purpose","choices":{"B":"A strange fossil discovery is described.","A":"A reflection on scientific reasoning opens the text and a fossil is found at the end.","C":"A discovery is introduced, the reasoning drawn from it is traced, and a reflection on that reasoning closes the text.","D":"Two remarkable fossils are compared feature by feature in order to determine which of the two specimens is the older one."},"unit":2,"why_correct":"The text introduces the discovery, traces the reasoning, and closes with reflection. Choice A covers the whole."},{"why_correct":"The text describes calm, reveals hidden conflict, and draws a lesson. Choice A covers the whole.","choice_families":{"B":"Metnin bir kısmi bütünü değil","A":"Metinde olmayan işlev","C":"Ters işlev"},"unit":2,"target_family":"Metnin bir kısmi bütünü değil","choices":{"D":"A calm appearance is described, the hidden conflict beneath it is revealed, and a general lesson is drawn.","A":"Crabs and anemones are compared as competitors.","B":"The calm surface of a tidal pool is described.","C":"A general lesson about nature opens the passage and a tidal pool illustrates it first."},"stem":"Which choice best describes the overall structure of the text?","lesson_name":"Text Structure and Purpose","id":"u2-l2-f2-07","lesson":2,"passage":"The passage begins by describing the calm surface of a tidal pool. It then reveals the fierce competition beneath, crabs, snails, and anemones all vying for space, and ends by suggesting that stillness in nature often hides intense struggle.","correct":"D","why_wrong":{"B":"The calm surface is only the opening; the question asks about the whole.","A":"The animals illustrate competition; they are not ranked.","C":"The order is reversed: the description comes first, the lesson last."}},{"unit":2,"why_correct":"The text frames the failures within a promise to explain the success and shows they enabled it. Choice A covers the whole.","lesson_name":"Text Structure and Purpose","choices":{"D":"Two inventors are compared by their number of failures.","C":"The book argues that the inventor's failures prevented his later success.","A":"A promise to explain a success frames an account of failures that are shown to make the success possible.","B":"The book describes the inventor's many failures in his middle years."},"lesson":2,"target_family":"Metnin bir kısmi bütünü değil","choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Metnin bir kısmi bütünü değil"},"stem":"Which choice best describes the overall structure of the text?","id":"u2-l2-f2-08","why_wrong":{"B":"The failures are only the middle portion; the question asks about the whole frame.","C":"The failures enable the success rather than preventing it.","D":"Only one inventor is discussed."},"passage":"The biography's middle chapters dwell on the inventor's many failures. But the book frames these as necessary: it opens by promising to explain his eventual breakthrough and closes by showing that each failure taught a lesson the success required.","correct":"A"},{"lesson":2,"choices":{"D":"Two films by the same director are compared.","B":"Initial praise gives way to sustained criticism, ending in a narrow, qualified recommendation.","A":"The review admires the film's striking visuals.","C":"The review praises the script and criticizes the visuals."},"lesson_name":"Text Structure and Purpose","why_correct":"The text opens with praise, shifts to sustained criticism, and ends with a narrow recommendation. Choice A covers the whole.","unit":2,"passage":"The review opens by admiring the film's visuals. It spends most of its length, however, on the weak script, arguing that no amount of beauty can rescue a story the audience cannot follow. It ends by recommending the film only to those who watch for images alone.","correct":"B","why_wrong":{"D":"Only one film is reviewed.","C":"It criticizes the script and praises the visuals, the reverse of C.","A":"Admiring the visuals is only the opening; the question asks about the whole."},"id":"u2-l2-f2-09","stem":"Which choice best describes the overall structure of the text?","choice_families":{"D":"Metinde olmayan işlev","A":"Metnin bir kısmi bütünü değil","C":"Ters işlev"},"target_family":"Metnin bir kısmi bütünü değil"},{"stem":"Which choice best describes the overall structure of the text?","choice_families":{"D":"Metinde olmayan işlev","A":"Ters işlev","B":"Metnin bir kısmi bütünü değil"},"target_family":"Metnin bir kısmi bütünü değil","passage":"The text starts with a startling statistic about food waste. It then explains the tangled causes, from cosmetic standards to confusing date labels, and finishes by describing several cities that have cut waste sharply, offering their methods as a model.","correct":"C","why_wrong":{"D":"The cities model solutions; they are not ranked by waste.","A":"The order is reversed: causes come before the solutions.","B":"The statistic is only the opening; the question asks about the whole."},"id":"u2-l2-f2-10","choices":{"D":"Two cities are compared to decide which wastes more food.","B":"A startling statistic about food waste is presented.","A":"Successful solutions are described first and the causes of waste are added last.","C":"A striking statistic leads into an analysis of causes and then to examples of successful solutions."},"lesson_name":"Text Structure and Purpose","why_correct":"The text opens with a statistic, analyzes causes, then gives successful examples. Choice A covers the whole.","unit":2,"lesson":2},{"lesson":2,"choices":{"C":"To present a claim and then offer evidence that undercuts it.","B":"To present a claim and then supply evidence that supports it.","A":"To describe how background music affects studying.","D":"To propose a new method for testing memory."},"lesson_name":"Text Structure and Purpose","why_correct":"The text states a claim, then gives evidence against it. Choice A names that function.","unit":2,"correct":"C","passage":"Some claim that background music helps students study. The evidence points the other way. In controlled trials, students who studied in silence recalled more than those exposed to music, even instrumental music without lyrics.","why_wrong":{"B":"The evidence undercuts the claim rather than supporting it, so B reverses the function.","A":"This names the topic, not what the text does with the claim.","D":"No new testing method is proposed."},"id":"u2-l2-f3-01","stem":"Which choice best states the main purpose of the text?","choice_families":{"D":"Metinde olmayan işlev","B":"Ters işlev","A":"Doğru konu yanlış işlev"},"target_family":"Ters işlev"},{"unit":2,"why_correct":"The text concedes drawbacks, then argues they produce a benefit, defending city life. Choice A fits.","lesson_name":"Text Structure and Purpose","choices":{"C":"To describe the noise and crowding typical of large cities.","B":"To list, one after another, the many drawbacks of city living in order to argue that people should avoid city life.","A":"To compare city life with rural life point by point.","D":"To concede drawbacks and then argue that they are inseparable from a benefit."},"lesson":2,"target_family":"Ters işlev","choice_families":{"C":"Doğru konu yanlış işlev","B":"Ters işlev","A":"Metinde olmayan işlev"},"stem":"Which choice best states the main purpose of the text?","id":"u2-l2-f3-02","why_wrong":{"C":"This names the topic, not the concede-then-defend move.","B":"The essay defends city life, so using the drawbacks to argue against it reverses the function.","A":"Rural life is not systematically compared."},"passage":"The author begins by granting that cities are noisy, crowded, and expensive. But the essay is a defense of city life: those very pressures, it argues, force the mixing of people and ideas that makes cities engines of creativity.","correct":"D"},{"lesson":2,"unit":2,"why_correct":"The text states the myth, then refutes it with scan evidence. Choice A fits.","lesson_name":"Text Structure and Purpose","choices":{"C":"To explain which parts of the brain are most active.","A":"To state a popular belief and then refute it with evidence.","B":"To state a popular belief and then confirm it with evidence.","D":"To recommend ways of using more of the brain."},"id":"u2-l2-f3-03","why_wrong":{"D":"The text debunks the myth rather than advising how to 'use more' of the brain.","B":"The text refutes the belief rather than confirming it, so B reverses the function.","C":"This names the topic, not the refuting move."},"correct":"A","passage":"A myth holds that we use only ten percent of our brains. The passage sets out to bury it: brain scans show activity across virtually the entire brain over the course of a day, leaving no vast unused reserve.","target_family":"Ters işlev","choice_families":{"D":"Metinde olmayan işlev","B":"Ters işlev","C":"Doğru konu yanlış işlev"},"stem":"Which choice best states the main purpose of the text?"},{"lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the function of the final paragraph in the text as a whole?","choices":{"B":"It intensifies the warning developed earlier rather than easing it.","A":"It gently softens the urgent warning developed in the earlier sections, easing the reader toward a calmer conclusion.","C":"It summarizes the report's topic for the reader.","D":"It introduces a solution the report had not mentioned."},"target_family":"Ters işlev","unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Doğru konu yanlış işlev","A":"Ters işlev"},"why_correct":"The paragraph hardens the warning and moves the deadline closer. Choice A names that intensifying function.","why_wrong":{"D":"No new solution is introduced.","A":"The paragraph intensifies rather than softens, so B reverses the function.","C":"It does more than summarize; it strengthens the warning."},"passage":"The final paragraph does not soften the report's warning. If anything, it hardens it, stating that the deadline for action is closer than the earlier sections implied and that delay now carries costs that cannot later be undone.","correct":"B","lesson":2,"id":"u2-l2-f3-04"},{"correct":"C","passage":"It would be easy to read the poem's storm imagery as a sign of despair. The poem resists that reading. By the final lines the storm has cleared, and the speaker greets the washed sky as a fresh beginning.","why_wrong":{"B":"The text pushes against the interpretation rather than confirming it, so B reverses the function.","A":"This names the imagery topic, not the resisting move.","D":"No other poems are compared."},"id":"u2-l2-f3-05","lesson":2,"choices":{"C":"To raise a likely interpretation and then push against it.","A":"To describe the storm imagery used in the poem.","B":"To raise an interpretation and then confirm it as correct.","D":"To compare this poem with others about storms."},"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","choice_families":{"A":"Doğru konu yanlış işlev","B":"Ters işlev","D":"Metinde olmayan işlev"},"why_correct":"The text raises the 'despair' reading and then resists it, ending on renewal. Choice A fits.","unit":2,"target_family":"Ters işlev"},{"unit":2,"target_family":"Ters işlev","choice_families":{"C":"Doğru konu yanlış işlev","B":"Ters işlev","A":"Metinde olmayan işlev"},"why_correct":"The second half cautions about nutrient gaps and urges medical advice. Choice A names that warning function.","stem":"Which choice best describes the function of the second half of the article?","lesson_name":"Text Structure and Purpose","choices":{"A":"It compares the diet with a rival diet plan.","B":"It enthusiastically promotes the many benefits of the diet described earlier in the first half of the article.","C":"It describes the meals the diet typically includes.","D":"It warns against the diet rather than promoting its benefits."},"lesson":2,"id":"u2-l2-f3-06","why_wrong":{"B":"The section warns rather than promotes, so B reverses the function.","A":"No rival diet is compared.","C":"It does not describe the diet's meals."},"passage":"The second half of the article is not a list of the diet's benefits. It is a caution: the author details how the plan can cause nutrient gaps and warns readers to consult a doctor before beginning it.","correct":"D"},{"stem":"Which choice best states the main purpose of the text?","target_family":"Ters işlev","choice_families":{"B":"Ters işlev","C":"Doğru konu yanlış işlev","D":"Metinde olmayan işlev"},"why_wrong":{"D":"Only one policy is discussed.","B":"The economist argues against the cut rather than endorsing it, so B reverses the function.","C":"Explaining how it works is topic material, not the argue-against move."},"correct":"A","passage":"The economist does not endorse the tax cut she describes. After laying out its supporters' case, she turns to its likely effects and argues that the promised growth rarely materializes and that deficits usually widen instead.","id":"u2-l2-f3-07","lesson_name":"Text Structure and Purpose","choices":{"D":"To compare two competing tax proposals.","A":"To present a policy's supporting case and then argue against the policy.","B":"To present a policy's supporting case and then endorse the policy.","C":"To explain how the proposed tax cut would work."},"unit":2,"why_correct":"The text lays out the supporters' case and then argues against the cut. Choice A fits.","lesson":2},{"id":"u2-l2-f3-08","lesson":2,"passage":"The closing anecdote is not there to lighten the mood. It lands as a rebuke: the cheerful company slogan is quoted just after the account of the layoffs, so that the slogan reads as hollow.","correct":"B","why_wrong":{"D":"No solution is introduced.","A":"It sharpens rather than lightens the tone, so B reverses the function.","C":"It does more than restate the slogan; it undercuts it."},"choice_families":{"C":"Doğru konu yanlış işlev","A":"Ters işlev","D":"Metinde olmayan işlev"},"why_correct":"The anecdote places the slogan against the layoffs so it reads as hollow, a rebuke. Choice A fits.","unit":2,"target_family":"Ters işlev","choices":{"D":"It introduces a solution to the layoffs described.","C":"It restates the company's official slogan for emphasis.","A":"It lightens the somber tone that follows the account of the layoffs, offering the reader a moment of relief.","B":"It undercuts the company's slogan rather than relieving the tone."},"stem":"Which choice best describes the function of the closing anecdote?","lesson_name":"Text Structure and Purpose"},{"id":"u2-l2-f3-09","why_wrong":{"B":"The passage tears the position down rather than supporting it, so B reverses the function.","A":"How tests are scored is topic material, not the dismantling move.","D":"No new test is recommended."},"correct":"C","passage":"The passage opens by seeming to agree that standardized tests measure ability fairly. That agreement is a setup. The rest of the passage dismantles it, showing how test scores track family income more closely than they track talent.","target_family":"Ters işlev","choice_families":{"A":"Doğru konu yanlış işlev","B":"Ters işlev","D":"Metinde olmayan işlev"},"stem":"Which choice best states the main purpose of the text?","lesson":2,"unit":2,"why_correct":"The apparent agreement is a setup that the passage then dismantles. Choice A fits.","lesson_name":"Text Structure and Purpose","choices":{"D":"To recommend a new kind of standardized test.","B":"To accept a position and then build further support for it.","A":"To explain how standardized tests are scored.","C":"To appear to accept a position in order to dismantle it."}},{"correct":"D","passage":"The example of the failed colony is not offered as a model to follow. The author presents it as a warning, tracing how ignoring local knowledge doomed the settlement within a single winter.","why_wrong":{"C":"It does not detail the settlement's geography.","B":"It is a cautionary case, not a model to imitate, so B reverses the function.","A":"Only one colony is discussed."},"id":"u2-l2-f3-10","lesson":2,"choices":{"C":"It describes the geography of the settlement in detail.","A":"It compares two colonies founded in the same year.","B":"It serves as a model of successful settlement to imitate.","D":"It serves as a cautionary case rather than a model to imitate."},"stem":"Which choice best describes the function of the example of the failed colony?","lesson_name":"Text Structure and Purpose","choice_families":{"B":"Ters işlev","A":"Metinde olmayan işlev","C":"Doğru konu yanlış işlev"},"why_correct":"The failed colony is presented as a warning about ignoring local knowledge. Choice A fits.","unit":2,"target_family":"Ters işlev"},{"lesson":2,"lesson_name":"Text Structure and Purpose","choices":{"A":"To explain how a natural feature can serve as a record of past climate.","B":"To weigh the advantages and disadvantages of using tree rings.","C":"To argue that tree rings are unreliable climate indicators.","D":"To describe how tree rings form and record climate."},"unit":2,"why_correct":"The passage describes how tree rings form and record climate, presenting it as a readable archive. Choice D fits.","why_wrong":{"C":"The passage treats tree rings as reliable, not unreliable, so C reverses the stance.","A":"The passage does more than a general claim about 'a natural feature'; and it never sets up the record as one option among several, which this phrasing implies.","B":"The passage never weighs advantages against disadvantages."},"passage":"The passage explains how tree rings record a region's climate history. Each ring's width reflects a year's growing conditions, so a cross-section becomes a readable archive of past wet and dry seasons.","correct":"D","id":"u2-l2-f4-01","stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","B":"Metinde olmayan işlev"}},{"id":"u2-l2-f4-02","why_wrong":{"D":"No competitor is compared.","C":"It follows her choices without criticizing them as reckless, so C misstates the stance.","B":"The article recounts a story; it never offers strategies for others to adopt."},"passage":"The article traces how a small bakery grew into a national chain. It follows the founder's decisions year by year, from her first rented oven to the opening of her hundredth store.","correct":"A","target_family":"Metinde olmayan işlev","choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Metinde olmayan işlev"},"stem":"Which choice best states the main purpose of the text?","lesson":2,"unit":2,"why_correct":"The article narrates the bakery's growth through the founder's year-by-year decisions. Choice B fits.","lesson_name":"Text Structure and Purpose","choices":{"D":"To compare the chain with its main competitor.","C":"To criticize the founder's choices as reckless.","A":"To narrate the growth of a business through its founder's decisions.","B":"To recommend a set of specific strategies that other neighborhood bakeries ought to adopt if they hope to grow."}},{"target_family":"Metinde olmayan işlev","unit":2,"choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","D":"Metinde olmayan işlev"},"why_correct":"The text describes the night-photosynthesis adaptation and its water-saving advantage. Choice A fits.","lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","choices":{"D":"To propose an experiment on desert plants.","C":"To argue that the adaptation is harmful to the plants.","B":"To describe an unusual adaptation and the advantage it provides.","A":"To rank desert plants by how much water they save."},"lesson":2,"id":"u2-l2-f4-03","why_wrong":{"D":"No experiment is proposed.","A":"The text never ranks plants by water saved.","C":"The adaptation is presented as beneficial, not harmful, so C reverses the stance."},"correct":"B","passage":"The text describes a curious property of certain desert plants: they photosynthesize at night, opening their pores in darkness to lose less water than they would under the noon sun."},{"stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","choice_families":{"B":"Ters işlev","A":"Metinde olmayan işlev","D":"Metinde olmayan işlev"},"why_wrong":{"A":"The passage reports the facts; it never stages an evaluation of who deserves credit.","B":"It presents the notebooks as significant, not worthless, so C reverses the stance.","D":"No detailed comparison with contemporaries is made."},"passage":"The passage recounts how a forgotten mathematician's notebooks were rediscovered in an attic and how their contents anticipated results credited to others decades later.","correct":"C","id":"u2-l2-f4-04","lesson_name":"Text Structure and Purpose","choices":{"B":"To argue that the notebooks contain nothing of value.","A":"To evaluate whether the mathematician deserves more credit than she received.","C":"To recount a rediscovery and note what the notebooks anticipated.","D":"To compare the mathematician with her contemporaries in detail."},"unit":2,"why_correct":"The passage recounts the rediscovery and notes what the notebooks anticipated. Choice B fits.","lesson":2},{"lesson":2,"lesson_name":"Text Structure and Purpose","choices":{"D":"To convey the experience of gradually acquiring a second language.","C":"To argue that adults cannot truly learn a second language.","B":"To compare two methods of language teaching.","A":"To offer step-by-step instructions for learning a language."},"unit":2,"why_correct":"The essay conveys the felt experience of acquiring a language over time. Choice B fits.","why_wrong":{"C":"It shows the language becoming one's own, the opposite of claiming adults cannot learn, so C reverses the stance.","A":"The essay evokes an experience; it never gives step-by-step instructions.","B":"No two teaching methods are compared."},"passage":"The essay describes the experience of learning a second language as an adult: the early stumbling, the slow gains, and the strange moment when the new language begins to feel like one's own.","correct":"D","id":"u2-l2-f4-05","stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","B":"Metinde olmayan işlev"}},{"why_wrong":{"C":"It defends swaying as useful, not dangerous, so C reverses the stance.","B":"The text never lists construction materials.","D":"No two bridge types are compared."},"passage":"The text explains why some bridges are built to sway. A degree of movement, it notes, lets a structure absorb wind and traffic forces that a perfectly rigid bridge would transmit straight into its joints.","correct":"A","id":"u2-l2-f4-06","stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","choice_families":{"D":"Metinde olmayan işlev","B":"Metinde olmayan işlev","C":"Ters işlev"},"lesson":2,"lesson_name":"Text Structure and Purpose","choices":{"D":"To compare suspension bridges with arch bridges.","A":"To explain why a seemingly undesirable feature is actually functional.","B":"To list the materials used in modern bridge construction.","C":"To argue that swaying bridges are dangerous and should be avoided."},"unit":2,"why_correct":"The text explains why sway, which sounds like a flaw, is actually functional. Choice A fits."},{"choices":{"A":"To predict how climate change will alter coral spawning.","B":"To describe a striking natural event and its timing.","C":"To argue that coral spawning is poorly understood.","D":"To compare spawning in corals with spawning in fish."},"lesson_name":"Text Structure and Purpose","why_correct":"The passage describes the synchronized spawning event and its lunar timing. Choice B fits.","unit":2,"lesson":2,"stem":"Which choice best states the main purpose of the text?","choice_families":{"D":"Metinde olmayan işlev","A":"Metinde olmayan işlev","C":"Ters işlev"},"target_family":"Metinde olmayan işlev","passage":"The passage describes how a coral spawning event unfolds: on a few nights each year, entire reefs release eggs and sperm at once, timed to the moon, in a synchronized burst that floods the water with life.","correct":"B","why_wrong":{"A":"The passage never turns to predictions about climate change.","C":"It presents the event as understood enough to describe, not as a mystery, so C misstates it.","D":"Fish spawning is not compared."},"id":"u2-l2-f4-07"},{"stem":"Which choice best states the main purpose of the text?","choice_families":{"A":"Metinde olmayan işlev","B":"Ters işlev","D":"Metinde olmayan işlev"},"target_family":"Metinde olmayan işlev","correct":"C","passage":"The text recounts how an old law, written to regulate horse-drawn carriages, was later stretched to cover automobiles, then bicycles, then electric scooters, as courts applied its language to vehicles its authors never imagined.","why_wrong":{"A":"The text describes a history; it never proposes a new law.","B":"It does not argue for repeal, so C adds a stance the text lacks.","D":"No cross-country comparison is made."},"id":"u2-l2-f4-08","choices":{"A":"To propose a new law covering electric scooters.","B":"To argue that the old law should be repealed.","C":"To trace how an old law was extended to new technologies over time.","D":"To compare traffic laws across different countries."},"lesson_name":"Text Structure and Purpose","why_correct":"The text traces how one old law was stretched to cover new vehicles over time. Choice B fits.","unit":2,"lesson":2},{"choices":{"B":"To compare salt mining with sea-salt evaporation.","A":"To assess whether salt is still economically important today.","C":"To argue that salt's historical value has been exaggerated.","D":"To explain how a common substance once shaped trade and settlement."},"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","choice_families":{"A":"Metinde olmayan işlev","B":"Metinde olmayan işlev","C":"Ters işlev"},"why_correct":"The passage explains how salt once shaped trade routes, taxes, and settlement. Choice B fits.","unit":2,"target_family":"Metinde olmayan işlev","correct":"D","passage":"The passage explains how salt was once so valuable that it shaped trade routes and taxes, and how roads and cities grew up around the places where it could be mined or evaporated from the sea.","why_wrong":{"C":"It affirms salt's historical value rather than calling it exaggerated, so C reverses the stance.","B":"The two extraction methods are mentioned, not systematically compared.","A":"The passage stays with the past; it never assesses salt's importance today."},"id":"u2-l2-f4-09","lesson":2},{"lesson":2,"id":"u2-l2-f4-10","why_wrong":{"D":"No two species' songs are compared.","C":"It shows learning is required, the opposite of 'entirely instinctive,' so C reverses the point.","B":"The text explains a process; it never recommends captive-rearing methods."},"passage":"The text describes the way certain birds learn their songs: hatched knowing only a rough template, they refine it by listening to adults, so that a young bird raised in silence never sings a full, normal song.","correct":"A","unit":2,"target_family":"Metinde olmayan işlev","why_correct":"The text explains that song develops from both an inborn template and learning from adults. Choice B fits.","choice_families":{"C":"Ters işlev","B":"Metinde olmayan işlev","D":"Metinde olmayan işlev"},"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","choices":{"A":"To explain how song develops through a mix of instinct and learning.","B":"To recommend methods for raising songbirds in captivity.","C":"To argue that birdsong is entirely instinctive.","D":"To compare the songs of two different bird species."}}]},{"no":3,"fam_short":{"İlişki yönü ters":"Yön ters","Metin dışı çıkarım":"Metin dışı","İlişkiyi yanlış kurma":"Yanlış ilişki","Tek metne dayanma":"Tek metin"},"families":["Tek metne dayanma","İlişki yönü ters","İlişkiyi yanlış kurma","Metin dışı çıkarım"],"main_ids":["u2-l3-f1-01","u2-l3-f2-01","u2-l3-f3-01","u2-l3-f4-01"],"teaching":{"strateji":["Her metnin pozisyonunu tek cümlede yaz.","İlişkiyi adlandır: katılıyor, çürütüyor, sınırlıyor, koşul ekliyor.","Yanıt sorusunda Text 2'nin gerçek sözlerine bak, genel değil spesifik noktaya.","İki metni de kullan, tek taraflı seçeneği ele.","Yönü iki kez kontrol et, ters okuma en sık hatadır."],"ne_olculuyor":["İki kısa metin verilir, Text 1 ve Text 2, aynı konuda. Görev: aralarındaki İLİŞKİYİ doğru kurmak.","İki biçimde gelir: Text 2 yazarı Text 1'e nasıl yanıt verirdi, ya da iki metin arasındaki ilişki nedir.","Kritik nokta: doğru cevap HER İKİ metni de kullanmalı ve ilişkinin yönünü doğru vermeli. Tek metne dayanmak ya da yönü ters okumak en sık hatadır."],"top_tips":["İlişki sorusunda doğru cevap HER İKİ metne dokunur. Sadece Text 1'i ya da sadece Text 2'yı özetleyen seçeneği hemen ele.","Kim ne diyor karıştırma. Text 1 A der, Text 2 B der. Seçenek bunları yer değiştirmiş olabilir. Yönü iki kez kontrol et.","Katılmak, cürütmek, sınırlamak, koşul eklemek farklı ilişkilerdir. Text 2 kısmen katılıyorsa tamamen cürütüyor demek yanlıştır.","Seçenekteki her iddianın metinde dayanağını bul. Dayanağı olmayan, kulağa mantıklı gelen seçenek metin dışı çıkarım tuzağıdır."],"alt_konular":[{"govde":["Soru kökü: \"Based on the texts, how would the author of Text 2 most likely respond to...\" ya da iki metnin aynı konuda nasıl bir ilişki kurduğunu sorar.","Önce her metnin ANA İDDİASINI ve TONUNU tek cümlede yaz. Text 2, Text 1 ile aynı fikirde mi, karşı mı, yoksa onu geliştiriyor/nüanslıyor mu? İlişki bu üç olasılıktan biridir.","Tuzak: iki metni de doğru özetleyen ama aralarındaki ilişkinin YÖNÜNÜ karıştıran seçenek (karşı çıkmayı 'destekleme' sanmak gibi)."],"kural":"Her metnin iddiasını tek cümleye indir; ilişki daima üçünden biridir: katılır / karşı çıkar / geliştirir.","baslik":"1) İki metnin ilişkisi (agree / disagree / build on)"},{"baslik":"2) Bir yazarın diğerine yanıtı (author's likely response)","govde":["Bu tipte Text 2 yazarının Text 1'deki belirli bir noktaya ne diyeceğini tahmin edersin. Cevap, Text 2'nin duruşundan MANTIKSAL olarak çıkmalı — metnin söylemediği bir görüşü ona atfetme.","Yöntem: Text 1'in ilgili iddiasını bul, sonra Text 2'nin bu konudaki kanıtını/duruşunu bul. Yanıt, Text 2'nin kanıtını Text 1'in iddiasına uygulamaktır.","En sık hata: kendi görüşünü ya da 'makul' bir tepkiyi seçmek. Yalnızca Text 2'de dayanağı olan yanıt doğrudur."],"ornek":"Text 1 bir yöntemi över, Text 2 o yöntemin bir sınırını gösterirse; Text 2 yazarının yanıtı 'yöntem işe yarar ama şu koşulda yetersiz' olur."}],"alt_konular_intro":"Cross-Text Connections tek metin değil, İKİ metin verir (Text 1 ve Text 2) ve aralarındaki ilişkiyi sorar. Zor görünmesinin nedeni iki metni birden tutmaktır. Çözüm: her metnin duruşunu tek cümleyle yaz, sonra ikisini karşılaştır. İş, okuma değil, iki duruşu hizalamaktır.","karar_proseduru":["Önce her metnin POZİSYONUNU tek cümlede yaz.  Text 1 ne savunuyor. Text 2 ne savunuyor. Kendi kelimenle, kısa.","İlişkiyi adlandır.  Aynı fikirdeler mi, Text 2 Text 1'i cürütüyor mu, sınırlıyor mu, örnekliyor mu, koşul mu ekliyor.","Text 2 yazarının GERÇEK sözlerine bak.  Yanıt sorusunda, Text 2'nin kendi iddiası Text 1'in tam neyine dokunuyor. Genel değil, spesifik noktaya.","Her iki metni de kullan.  Sadece bir metne uyan seçenek yanlıştır. Doğru cevap ilişkiyi kurar, tek tarafı özetlemez.","Yönü kontrol et.  Kim katılıyor kim katılmıyor. Seçenek bunu ters çevirmiş olabilir. Yön yanlışsa ele."],"sik_hatalar":[{"hata":"Tek metne dayanmak","cozum":"Sadece Text 1'i ya da Text 2'yı özetleyen seçenek ilişki kurmaz. Doğru cevap ikisine de dokunur."},{"hata":"İlişki yönünü ters okumak","cozum":"Kim katılıyor kim karşı çıkıyor karıştırma. Text 2'nin kendi sözlerine bak, yönü iki kez kontrol et."},{"hata":"İlişki türünü yanlış kurmak","cozum":"Kısmen katılıyorsa tamamen çürütüyor demek yanlıştır. Katılma, çürütme, sınırlama, koşul ekleme farklı ilişkilerdir."},{"hata":"Metin dışı görüş yüklemek","cozum":"İki yazardan hiçbirinin söylemediği bir görüşü seçenek eklemiş olabilir. Her iddianın metinde dayanağını ara."},{"hata":"İki metnin ilişkisini kurmadan, yalnızca bir metni doğru özetleyen şıkkı seçmek.","cozum":"Her metnin ana iddiasını tek cümlede kâğıda yaz. Sonra seçtiğin şıkkın İKİ metni de doğru yansıtıp yansıtmadığını kontrol et; tek metne uyan şık, ilişkiyi soran soruda yanlıştır."},{"cozum":"Ortak zemini ara: her iki metnin de açıkça kabul ettiği TEMEL varsayımı bul. Taraflardan yalnızca birine ait olan sonuç veya tercih ne kadar doğru görünse de 'anlaşılan nokta' olamaz.","hata":"'Yazarlar hangi noktada anlaşır' sorulduğunda, birinin savunduğu ama diğerinin katılmadığı iddiayı seçmek."}],"alt_konular_baslik":"Soru alt tipleri","cozumlu_ornekler":[{"adimlar":["Her metni özetle: Text 1 uzaktan çalışmanın faydasını övüyor (odaklanma, özgürlük). Text 2 gözden kaçan bir maliyeti gösteriyor (sınır hiç kapanmıyor).","İlişkiyi adlandır: Text 2, Text 1'in övdüğü faydayı karmaşıklaştırıyor.","A tam bunu söyler ve iki metni de kullanır.","B sadece Text 1'i tekrarlar, ilişki kurmaz. C yönü ters, Text 2 katılmıyor. D metinde yok."],"sonuc":"Doğru cevap iki metne de dokunur ve ilişkiyi (karmaşıklaştırma) doğru adlandırır.","passage":"Text 1: Remote work, supporters argue, frees employees from long commutes and lets them focus without office interruptions.\n\nText 2: In practice, many remote workers report that the boundary between job and home never closes; without an office to leave, they answer messages late into the night.","correct":"A","choices":{"D":"Text 2 argues that offices should be redesigned.","C":"Text 2 fully agrees with Text 1 that remote work reduces interruptions.","A":"Text 2 complicates the benefit Text 1 praises by pointing to a cost Text 1 overlooks.","B":"Text 2 explains that remote work frees employees from commutes."},"stem":"Which choice best describes the relationship between the two texts?"},{"correct":"A","passage":"Text 1: A researcher argues that city parks measurably improve residents' health through lower stress and more exercise.\n\nText 2: These benefits are real, a second researcher agrees, and adds that parks also cool neighborhoods and clean the air.","adimlar":["Text 1: parklar sağlığı iyileştirir. Text 2: bu doğru DER ve üstüne ekler (serinletme, hava temizleme).","İlişki yönü: katılıyor ve genişletiyor.","A tam bunu söyler.","B ve C yönü ters, Text 2 karşı çıkmıyor katılıyor. D metinde yok."],"sonuc":"Yönü iki kez kontrol et. Text 2 açıkça these benefits are real diyor, yani katılıyor.","choices":{"D":"Text 2 recommends replacing parks with gyms.","C":"Text 2 argues that parks provide no measurable benefits.","B":"Text 2 disputes Text 1's claim that parks improve health.","A":"Text 2 agrees with Text 1 and extends its case with additional benefits."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"stem":"Based on the texts, how would the researchers in Text 2 most likely respond to the argument presented in Text 1?","choices":{"B":"By agreeing that higher labor costs will inevitably force every business to reduce its hiring.","A":"By noting that the predicted job losses did not appear in the regions they studied.","C":"By arguing that minimum wage laws have no measurable effect on business profits at all.","D":"By suggesting that employment data is generally too unreliable to support any conclusion."},"sonuc":"Doğru cevap A. Text 2'nin verisi, Text 1'in öngördüğü iş kayıplarının gerçekleşmediğini gösterir; B iki metnin ilişkisini tersine çeviren tuzaktır.","adimlar":["Text 1'in ana iddiası: asgari ücret artışı zorunlu olarak istihdamı düşürür.","Text 2'nin bulgusu: ücret artıran bölgelerde istihdam sabit kaldı ya da hafif arttı — yani öngörülen kayıp gerçekleşmedi.","Soru, Text 2 araştırmacılarının Text 1'e nasıl yanıt vereceğini soruyor; onların kanıtı doğrudan 'iş kaybı olmadı' der.","B Text 1'e katılır (Text 2'nin bulgusuyla çelişir); C 'kâra hiç etkisi yok' der ama Text 2 bunu iddia etmez; D 'veri güvenilmez' der ama Text 2 verinin kendisine dayanır. A, Text 2'nin kanıtını Text 1'in tahminine karşı doğru kullanır."],"passage":"Text 1: Some economists argue that raising the minimum wage inevitably reduces employment. Because businesses facing higher labor costs must protect their profits, these economists claim, such businesses will hire fewer workers or cut existing positions.\n\nText 2: In several recent studies of regions that raised their minimum wage, employment levels remained stable or even rose slightly. Researchers suggest that better-paid workers stay in their jobs longer, which lowers the money businesses must spend on constantly hiring and training replacements.","correct":"A"},{"stem":"Which choice best describes the relationship between the two texts?","passage":"Text 1: Historian Ellen Cole contends that the Industrial Revolution improved the lives of ordinary people. She points to the steadily falling prices of cloth, tools, and other manufactured goods that had once been affordable only to the wealthy.\n\nText 2: Historian Raj Patel emphasizes that the earliest factory workers labored twelve or more hours a day in dangerous conditions for very low pay. Whatever goods became cheaper, Patel argues, the human cost of producing them in those early decades was severe.","choices":{"D":"Text 2 and Text 1 both ultimately conclude that industrialization was a mistake.","A":"Text 2 provides detailed statistical evidence that directly confirms the central claim made in Text 1.","B":"Text 2 restates the argument of Text 1 using slightly different historical terms.","C":"Text 2 emphasizes a drawback that Text 1's argument overlooks."},"correct":"C","sonuc":"Doğru cevap C. Text 2, Text 1'in olumlu tablosunun ihmal ettiği insani maliyeti vurgular; A ve D iki metnin görüş farkını yok sayan sahte-uzlaşma tuzaklarıdır.","adimlar":["Text 1: Sanayi Devrimi sıradan insanların hayatını iyileştirdi (ucuzlayan mallar).","Text 2: Erken fabrika işçileri ağır koşullarda çok düşük ücretle çalıştı; üretimin insani bedeli ağırdı.","İki metin aynı olayın farklı yüzlerine bakıyor: Text 2, Text 1'in görmezden geldiği bir olumsuz yönü (insani bedel) öne çıkarıyor.","A 'doğruluyor' der (aslında dengeliyor); B 'aynısını tekrar ediyor' der (farklı yön sunuyor); D 'ikisi de hata olduğunu söylüyor' der ama Text 1 olumlu bakıyor. C, 'gözden kaçan bir sakıncayı vurgular' ilişkisini doğru kurar."]},{"choices":{"A":"Mars is the single best target in the entire search for extraterrestrial life.","B":"The presence of liquid water is central to the search for life.","C":"Present-day life is far more likely to be found than ancient life.","D":"The icy moons of the outer planets deserve far more attention than Mars does."},"stem":"Based on the texts, on which point would Vasquez (Text 1) and Lund (Text 2) most likely agree?","passage":"Text 1: Astronomer Vasquez maintains that searching for microbial life on Mars is the most promising path in astrobiology. Mars, Vasquez notes, once had liquid water flowing across its surface and a far thicker atmosphere than it has today.\n\nText 2: Astronomer Lund focuses instead on the icy moons of the outer planets, such as Jupiter's moon Europa, whose subsurface oceans may still hold liquid water today. For Lund, these hidden oceans are the likelier home for life that exists right now.","correct":"B","adimlar":["Ortak noktayı bulmak için her yazarın dayanağını çıkar: Vasquez Mars'ı seçerken 'liquid water' vurgular; Lund Europa'yı seçerken 'liquid water' vurgular.","İki yazar HEDEF konusunda ayrılıyor (Mars vs. buzlu uydular) ama ikisi de yaşam aramasının merkezine sıvı suyu koyuyor.","Soru 'hangi noktada anlaşırlar' diyor; yani her ikisinin de kabul ettiği ortak varsayımı ara.","A yalnızca Vasquez'in, D yalnızca Lund'un görüşü; C yalnızca Lund'a ait (present-day). B, ikisinin de paylaştığı 'sıvı su yaşam aramasının merkezidir' varsayımıdır."],"sonuc":"Doğru cevap B. İki astronom hedefte ayrılsa da, ikisi de sıvı suyu yaşam aramasının merkezine koyar; A, C ve D taraflardan yalnızca birine ait iddialardır."}],"kavramsal_temel":["Cross-Text Connections, aynı konuda iki kısa metin verir ve aralarındaki İLİŞKİYİ doğru kurmanı ister. İki biçimde gelir: Text 2 yazarı Text 1'e nasıl yanıt verirdi, ya da iki metin arasındaki ilişki nedir.","Doğru cevap HER İKİ metni de kullanmalı ve ilişkinin yönünü doğru vermeli. Sadece bir metni özetleyen ya da ilişkinin yönünü ters okuyan seçenek yanlıştır.","En sık iki hata şudur: tek metne dayanmak, yani iki metni bağlamadan birini özetlemek, ve yönü ters okumak, yani kimin katıldığını kimin karşı çıktığını karıştırmak.","Bu yüzden önce her metnin pozisyonunu tek cümlede yaz. Text 1 ne savunuyor, Text 2 ne savunuyor. Sonra ilişkiyi adlandır: katılıyor mu, çürütüyor mu, sınırlıyor mu, koşul mu ekliyor.","Cross-Text Connections sorularının temel becerisi, iki ayrı metni tek bir tartışma gibi okuyabilmektir. İki yazar aynı konuyu ele alır ama farklı bir açıdan yaklaşır; senin görevin bu iki bakışın birbirine nasıl bağlandığını tespit etmektir. İlişki birkaç türde olabilir: bir metin diğerini DESTEKLEYEBİLİR (aynı sonuca ek kanıt getirir), NİTELENDİREBİLİR (kabul eder ama sınırlar veya bir istisna ekler), ÇÜRÜTEBİLİR (doğrudan karşı çıkar) ya da FARKLI BİR ODAK sunabilir (aynı konunun başka bir yönüne bakar). Metinleri okurken her birinin ana iddiasını tek cümleye indir; ilişki neredeyse her zaman bu iki cümleyi yan yana koyunca görünür hale gelir.","'Yazar X, Y'nin görüşüne nasıl yanıt verir' veya 'iki yazar hangi noktada anlaşır' tipi sorularda yöntem, her yazarın kanıtını ve varsayımını ayrıştırmaktır. Her yazar için iki soru sor: Ne iddia ediyor? Bu iddiayı hangi kanıta/varsayıma dayandırıyor? Yanıt sorularında, bir yazarın somut kanıtını (örneğin 'incelediğimiz bölgelerde iş kaybı olmadı') diğerinin tahminine (örneğin 'iş kaybı olur') karşı koyarsın. Uzlaşma sorularında ise iki yazarın PAYLAŞTIĞI temel varsayımı ararsın; hedefte veya sonuçta ayrılsalar bile çoğu zaman aynı zemine (örneğin 'sıvı su yaşam için gereklidir') basarlar. Bu ayrıştırma alışkanlığı, hem tek metne saplanan şıkları hem de ilişkiyi abartan sahte-uzlaşma şıklarını elemeni sağlar."],"celdirici_aileleri":[{"tanim":"Seçenek sadece BIR metni doğru özetler ama iki metin arasındaki ilişkiyi kurmaz. Genelde Text 1 ya da Text 2'nin tek başına söylediği bir şey. İlişki sorusuna tek taraflı cevap.","ad":"Tek metne dayanma"},{"ad":"İlişki yönü ters","tanim":"Seçenek ilişkinin YÖNÜNÜ ters okur. Text 2 katılmıyorsa katılıyor der, ya da kim hangi görüşü savunuyor karıştırır. İki metin de doğru anlaşılır ama yön yanlıştır."},{"ad":"İlişkiyi yanlış kurma","tanim":"İki görüş de doğru verilir ama ARALARINDAKİ ilişki yanlış adlandırılır. Text 2 aslında sınırlıyorken tamamen cürütüyor der, ya da katılıyorken karşı çıkıyor der. İlişkinin türü yanlıştır."},{"ad":"Metin dışı çıkarım","tanim":"Seçenek iki yazardan HİÇBİRİNİN söylemediği bir görüşü birine yükler. Makul görünür ama metinde dayanağı yoktur. Metin dışı bir iddia."},{"ad":"Tek Metin Şıkkı","tanim":"Yalnızca bir metne dayanan, diğer metnin bakış açısını hesaba katmayan şık. Cross-Text sorusu iki metin ARASINDAKİ ilişkiyi veya ortak/karşıt noktayı ister; bu çeldirici ise ilişkiyi kurmak yerine tek bir yazarın görüşünü doğru biçimde tekrarlar. Doğru gibi görünür çünkü söylediği bir metinde gerçekten geçer."},{"tanim":"İki yazarı gerçekte olduğundan daha çok anlaşır ya da daha çok çelişir gösteren şık. Metin 2 aslında bir yönü nitelendirirken şık 'tamamen aynı fikirde' ya da 'tümden reddediyor / ikisi de aynı sonuca varıyor' der. İlişkinin derecesini abartıp gerçek nüansı silen bir tuzaktır.","ad":"Sahte Uzlaşma / Sahte Karşıtlık Şıkkı"}]},"questions":[{"id":"u2-l3-f1-01","why_wrong":{"D":"Neither text proposes redesigning offices.","C":"Text 2 does not agree that remote work is all benefit; it raises a downside, so the direction is reversed.","B":"This restates only Text 1's point and ignores Text 2's contrast, so it fails to build the relationship."},"passage":"Text 1: Remote work, its supporters argue, frees employees from long commutes and lets them focus without the interruptions of a busy office.\n\nText 2: In practice, many remote workers report that the boundary between job and home never closes; without the office to leave, they find themselves answering messages late into the night.","correct":"A","target_family":"Tek metne dayanma","choice_families":{"D":"Metin dışı çıkarım","B":"Tek metne dayanma","C":"İlişki yönü ters"},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson":3,"unit":2,"why_correct":"Text 1 praises focus and freedom; Text 2 raises an overlooked cost (no boundary), complicating that benefit. Choice A captures the relationship.","lesson_name":"Cross-Text Connections","choices":{"C":"Text 2 fully agrees with Text 1 that remote work reduces the interruptions of a busy office and helps workers focus.","A":"Text 2 complicates the benefit Text 1 praises by pointing to a cost Text 1 overlooks.","B":"Text 2 explains that remote work frees employees from long commutes.","D":"Text 2 argues that offices should be redesigned to be quieter."}},{"why_wrong":{"D":"Neither text recommends larger enclosures.","A":"This restates Text 1's point, not Text 2's counter, so it does not build the relationship.","C":"Text 2 disagrees with Text 1, so 'agrees' reverses the direction."},"passage":"Text 1: Zoos, defenders say, play a vital role in conservation, breeding endangered species and educating the public about the need to protect them.\n\nText 2: Critics counter that most zoo animals belong to species in no danger of extinction, and that the money spent housing them could do more good protecting habitats in the wild.","correct":"B","lesson":3,"id":"u2-l3-f1-02","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choices":{"C":"Text 2 agrees with Text 1 that zoos are essential to conservation.","B":"Text 2 challenges Text 1's defense by questioning both its conservation and its spending priorities.","A":"Text 2 argues that zoos successfully educate the public about endangered species and the urgent need to protect them.","D":"Text 2 recommends building larger enclosures for zoo animals."},"target_family":"Tek metne dayanma","unit":2,"why_correct":"Text 1 defends zoos; Text 2 challenges that defense on conservation and spending. Choice A names the relationship.","choice_families":{"C":"İlişki yönü ters","A":"Tek metne dayanma","D":"Metin dışı çıkarım"}},{"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","target_family":"Tek metne dayanma","choice_families":{"A":"Metin dışı çıkarım","B":"Tek metne dayanma","D":"Metin dışı çıkarım"},"why_wrong":{"D":"Neither text suggests colleges stop admitting students.","B":"This restates Text 1's claim; it is not how Text 2 would respond.","A":"Text 2 never claims grades are 'completely objective'; that view is in neither text."},"passage":"Text 1: Standardized testing, supporters hold, gives colleges a single objective measure that lets them compare applicants from very different schools.\n\nText 2: Yet a test taken on one morning captures a narrow slice of a student. Grades earned over years, some argue, reveal persistence and growth that a single score cannot.","correct":"C","id":"u2-l3-f1-03","lesson_name":"Cross-Text Connections","choices":{"C":"By arguing that a single score misses qualities a longer record reveals.","A":"By claiming that grades earned over years are themselves a completely objective and unbiased measure of every applicant.","B":"By agreeing that standardized tests offer a single objective measure.","D":"By proposing that colleges stop admitting students altogether."},"unit":2,"why_correct":"Text 2 would push back on Text 1 by noting that a single test misses persistence and growth that grades reveal. Choice A fits.","lesson":3},{"passage":"Text 1: The historian argues that the revolution was driven mainly by economic hardship, as rising bread prices pushed ordinary people to the brink.\n\nText 2: Economic strain mattered, a second historian allows, but ideas mattered too; pamphlets and debates gave the hardship a language and a target it would otherwise have lacked.","correct":"D","why_wrong":{"B":"This restates Text 1's economic claim, not Text 2's addition.","A":"Text 2 does not claim there is no identifiable cause; it names two.","C":"Text 2 allows that economic strain mattered, so 'any role' reverses its stance."},"id":"u2-l3-f1-04","lesson":3,"choices":{"D":"Text 2 accepts part of Text 1's claim while adding a factor Text 1 downplays.","B":"Text 2 argues that rising bread prices pushed people to the brink.","A":"Text 2 claims that the revolution had no single identifiable cause and that historians will never agree on what drove it.","C":"Text 2 rejects the idea that economic hardship played any role."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","choice_families":{"C":"İlişki yönü ters","A":"Metin dışı çıkarım","B":"Tek metne dayanma"},"why_correct":"Text 2 grants the economic factor but adds the role of ideas that Text 1 downplays. Choice A captures the qualifying relationship.","unit":2,"target_family":"Tek metne dayanma"},{"passage":"Text 1: Social media, some argue, has widened the public square, giving ordinary people a platform that was once reserved for a few powerful outlets.\n\nText 2: But a louder square is not always a fairer one. On these platforms, researchers find, the most extreme voices travel fastest, drowning out the moderate majority.","correct":"A","why_wrong":{"D":"Neither text calls for shutting outlets down.","C":"Text 2 complicates rather than endorses Text 1, so the direction is off.","B":"This restates Text 1's point, not Text 2's qualification."},"id":"u2-l3-f1-05","lesson":3,"choices":{"B":"Text 2 explains that social media gives ordinary people a platform.","A":"Text 2 qualifies Text 1's optimism by describing a distortion in how attention spreads.","C":"Text 2 fully endorses Text 1's optimistic view that social media has widened the public square for ordinary people.","D":"Text 2 argues that traditional outlets should be shut down."},"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","why_correct":"Text 2 qualifies Text 1's optimism by noting extreme voices dominate. Choice A fits.","choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","B":"Tek metne dayanma"},"target_family":"Tek metne dayanma","unit":2},{"correct":"B","passage":"Text 1: A team reports that a new drug lowered blood pressure sharply in their trial, and they call for its rapid approval.\n\nText 2: A second group notes that the trial ran only eight weeks. Long-term safety, they caution, cannot be judged from so short a study, whatever the early numbers show.","why_wrong":{"C":"This restates Text 1's result, not Text 2's response.","A":"Text 2 urges caution rather than agreeing to rapid approval, so the direction is reversed.","D":"Text 2 says safety cannot yet be judged, not that the drug is certainly dangerous."},"id":"u2-l3-f1-06","lesson":3,"choices":{"D":"By claiming the drug is certainly dangerous over the long term.","C":"By reporting that the drug lowered blood pressure sharply.","B":"By arguing that the trial was too short to justify the confidence Text 1 expresses.","A":"By agreeing that the new drug worked well in the trial and therefore should be approved for use as rapidly as possible."},"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","choice_families":{"A":"İlişki yönü ters","C":"Tek metne dayanma","D":"Metin dışı çıkarım"},"why_correct":"Text 2 would respond that eight weeks is too short to support rapid approval. Choice A fits.","unit":2,"target_family":"Tek metne dayanma"},{"lesson":3,"why_correct":"Text 2 worries the screens 'do the looking for us,' targeting the feature Text 1 praised. Choice A fits.","unit":2,"choices":{"C":"Text 2 raises a concern about the very feature Text 1 praises.","B":"Text 2 praises the bright signs and interactive screens.","A":"Text 2 agrees that the screens make art more accessible to all.","D":"Text 2 suggests the museum should charge higher ticket prices."},"lesson_name":"Cross-Text Connections","id":"u2-l3-f1-07","correct":"C","passage":"Text 1: The critic praises the museum's new wing for making art accessible, with bright signs and interactive screens guiding every visitor.\n\nText 2: Another critic worries that the screens do the looking for us. Told what to notice, she argues, visitors stop discovering anything on their own.","why_wrong":{"A":"Text 2 does not agree the screens are a clear benefit, so 'agrees' is wrong.","B":"Text 2 criticizes the screens rather than praising them, reversing the direction.","D":"Neither text mentions ticket prices."},"choice_families":{"D":"Metin dışı çıkarım","B":"İlişki yönü ters","A":"İlişki yönü ters"},"target_family":"Tek metne dayanma","stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"id":"u2-l3-f1-08","lesson":3,"passage":"Text 1: Automation, its advocates argue, will free workers from dull, repetitive tasks and let them focus on more creative work.\n\nText 2: For that promise to hold, a labor economist notes, displaced workers must be retrained for the new roles, and history shows such retraining is often too slow to catch those left behind.","correct":"D","why_wrong":{"B":"This restates Text 1's promise, not Text 2's condition.","A":"Neither text calls for banning automation.","C":"Text 2 assumes automation changes work; it disputes the ease, not the fact."},"why_correct":"Text 2 makes Text 1's promise depend on retraining, a step Text 1 omits. Choice A fits.","choice_families":{"B":"Tek metne dayanma","A":"Metin dışı çıkarım","C":"İlişki yönü ters"},"unit":2,"target_family":"Tek metne dayanma","choices":{"B":"Text 2 argues that automation frees workers for creative work.","A":"Text 2 recommends banning automation across most industries to protect workers from losing their jobs to machines.","C":"Text 2 denies that automation will change the workplace at all.","D":"Text 2 makes Text 1's promise conditional on a step Text 1 leaves out."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections"},{"id":"u2-l3-f1-09","lesson":3,"passage":"Text 1: A biologist argues that a species' survival depends most on its genetic diversity, which lets some individuals withstand new threats.\n\nText 2: Genes are only part of it, another biologist responds. A population can be genetically rich yet still collapse if its habitat disappears faster than any individual can adapt.","correct":"A","why_wrong":{"D":"Text 2 says genes are 'only part of it,' not that they have no effect.","B":"Text 2 denies that genes are the single decisive factor, reversing Text 1.","C":"This restates Text 1's claim rather than Text 2's response."},"choice_families":{"D":"İlişki yönü ters","C":"Tek metne dayanma","B":"İlişki yönü ters"},"why_correct":"Text 2 responds that fast habitat loss can override genetic diversity. Choice A fits.","unit":2,"target_family":"Tek metne dayanma","choices":{"B":"By agreeing that genetic diversity is the single decisive factor.","A":"By arguing that habitat loss can override the genetic advantage Text 1 emphasizes.","C":"By restating Text 1's point that a population's genetic diversity lets some individuals withstand newly arriving threats.","D":"By claiming that genetic diversity has no effect on survival."},"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections"},{"lesson":3,"id":"u2-l3-f1-10","why_wrong":{"D":"Neither text calls for banning all tourism.","C":"Text 2 says the logic holds 'up to a point,' not never, so 'never' overstates it.","A":"This restates Text 1's claim, not Text 2's limit."},"correct":"B","passage":"Text 1: Ecotourism, supporters say, protects wild places by giving local communities a financial reason to keep them intact.\n\nText 2: The logic holds only up to a point. Beyond a certain number of visitors, one study warns, the very traffic drawn by ecotourism begins to erode the habitats it was meant to preserve.","unit":2,"target_family":"Tek metne dayanma","why_correct":"Text 2 accepts the benefit but caps it: past a threshold, traffic erodes habitats. Choice A fits.","choice_families":{"C":"İlişki yönü ters","A":"Tek metne dayanma","D":"Metin dışı çıkarım"},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","choices":{"B":"Text 2 sets a limit on the benefit Text 1 describes.","A":"Text 2 argues that ecotourism gives communities a reason to protect nature.","C":"Text 2 concludes that ecotourism never protects wild places.","D":"Text 2 recommends banning all tourism in natural areas."}},{"lesson_name":"Cross-Text Connections","choices":{"D":"Text 2 recommends replacing parks with indoor gyms.","A":"Text 2 disputes Text 1's central claim that living near green space measurably improves the health of nearby residents.","B":"Text 2 agrees with Text 1 and extends its case with additional benefits.","C":"Text 2 argues that parks provide no measurable benefits."},"unit":2,"why_correct":"Text 2 explicitly agrees ('these benefits are real') and adds cooling and air-cleaning. Choice A gives the correct direction.","lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişki yönü ters","choice_families":{"D":"Metin dışı çıkarım","A":"İlişki yönü ters","C":"İlişki yönü ters"},"why_wrong":{"A":"Text 2 agrees rather than disputes, so this reverses the direction.","C":"Text 2 affirms benefits and adds more, so 'no benefits' reverses its stance.","D":"Neither text suggests replacing parks with gyms."},"correct":"B","passage":"Text 1: A researcher argues that city parks measurably improve residents' health, pointing to lower stress and more exercise among people who live near green space.\n\nText 2: These benefits are real, a second researcher agrees, and adds that parks also cool neighborhoods and clean the air, strengthening the case for building more of them.","id":"u2-l3-f2-01"},{"correct":"C","passage":"Text 1: A critic contends that the poet's late work is his weakest, its images blurred and its rhythms slack.\n\nText 2: A second critic sees the same late poems as his richest, arguing that what looks like slackness is a deliberate loosening that lets feeling breathe.","why_wrong":{"D":"No contemporary novelist is mentioned.","A":"Both texts assume the late poems exist; neither denies it.","B":"Text 2 praises the late poems, so agreeing they are weakest reverses its view."},"id":"u2-l3-f2-02","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choice_families":{"B":"İlişki yönü ters","A":"Metin dışı çıkarım","D":"Metin dışı çıkarım"},"target_family":"İlişki yönü ters","lesson":3,"choices":{"C":"Text 2 defends the late work that Text 1 dismisses.","B":"Text 2 agrees that the late poems are the poet's weakest.","A":"Text 2 argues that the poet wrote no late poems at all.","D":"Text 2 compares the poet with a contemporary novelist."},"lesson_name":"Cross-Text Connections","why_correct":"Text 1 calls the late work weakest; Text 2 calls it richest, defending it. Choice A gives the direction.","unit":2},{"unit":2,"why_correct":"Text 2 offers studies finding little job loss, challenging Text 1's prediction. Choice A gives the direction.","lesson_name":"Cross-Text Connections","choices":{"D":"By presenting evidence that challenges Text 1's prediction of job losses.","C":"By agreeing that higher wages always reduce total employment.","B":"By confirming Text 1's prediction that minimum-wage increases force employers to cut staff in order to offset higher costs.","A":"By arguing that wages should never be regulated by law."},"lesson":3,"target_family":"İlişki yönü ters","choice_families":{"C":"İlişki yönü ters","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","id":"u2-l3-f2-03","why_wrong":{"C":"Text 2 cites possible gains, so 'always reduce employment' reverses its point.","A":"Text 2 discusses evidence, not whether wages should ever be regulated.","B":"Text 2 challenges the job-loss claim rather than confirming it."},"passage":"Text 1: One economist warns that raising the minimum wage will cost jobs, as employers cut staff to offset higher labor costs.\n\nText 2: Recent studies, another economist notes, find little job loss after modest increases; some even show slight employment gains as higher pay reduces turnover.","correct":"D"},{"choice_families":{"D":"Metin dışı çıkarım","C":"İlişkiyi yanlış kurma","B":"İlişki yönü ters"},"target_family":"İlişki yönü ters","stem":"Which choice best describes the relationship between Text 1 and Text 2?","id":"u2-l3-f2-04","correct":"A","passage":"Text 1: A teacher argues that homework reinforces learning and builds the discipline students will need later.\n\nText 2: Another teacher counters that for young children, research links heavy homework to stress and to a loss of interest in school, with little gain in achievement.","why_wrong":{"D":"Neither text proposes lengthening the school day.","C":"Text 2 reports specific effects, so 'no effect of any kind' misstates it.","B":"Text 2 opposes rather than supports Text 1, reversing the direction."},"why_correct":"Text 2 counters Text 1, citing stress and lost interest for young children. Choice A gives the direction.","unit":2,"choices":{"C":"Text 2 argues that homework has no effect of any kind.","A":"Text 2 opposes Text 1's endorsement, at least for young children.","B":"Text 2 supports Text 1's claim that homework builds discipline.","D":"Text 2 proposes lengthening the school day instead."},"lesson_name":"Cross-Text Connections","lesson":3},{"lesson":3,"why_correct":"Text 2 argues added capacity draws more drivers (induced demand), opposing Text 1. Choice A gives the direction.","unit":2,"choices":{"D":"By recommending that all existing roads be narrowed.","C":"By confirming that traffic has more room to flow on wider roads.","A":"By agreeing with the planner that building wider roads reliably eases congestion by giving traffic much more room to flow.","B":"By arguing that added road capacity tends to attract traffic rather than relieve it."},"lesson_name":"Cross-Text Connections","id":"u2-l3-f2-05","correct":"B","passage":"Text 1: A planner argues that wider roads ease congestion by giving traffic more room to flow.\n\nText 2: Wider roads, a transport scholar replies, tend to fill up again as the added capacity draws more drivers, a pattern known as induced demand.","why_wrong":{"C":"This restates Text 1's premise, not Text 2's response.","A":"Text 2 disputes that wider roads ease congestion, so agreeing reverses its view.","D":"Text 2 never recommends narrowing all roads."},"choice_families":{"C":"Tek metne dayanma","A":"İlişki yönü ters","D":"Metin dışı çıkarım"},"target_family":"İlişki yönü ters","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?"},{"id":"u2-l3-f2-06","lesson":3,"correct":"C","passage":"Text 1: A scholar claims that folktales spread mainly by migration, carried from place to place as people moved.\n\nText 2: Another scholar finds the same tales arising independently in distant cultures that never met, suggesting shared human concerns can produce similar stories on their own.","why_wrong":{"B":"Text 2 offers a different mechanism, so 'only through migration' reverses it.","A":"Text 2 assumes the tales resemble one another; that is the puzzle it addresses.","D":"Neither text claims a single culture invented all folktales."},"choice_families":{"D":"Metin dışı çıkarım","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"why_correct":"Text 2 proposes independent origin as an alternative to Text 1's migration account. Choice A gives the relationship.","target_family":"İlişki yönü ters","unit":2,"choices":{"D":"Text 2 claims that folktales were invented by a single culture.","B":"Text 2 confirms that folktales spread only through migration.","A":"Text 2 argues that folktales do not actually resemble one another.","C":"Text 2 offers an alternative to Text 1's explanation for how similar tales appear."},"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"target_family":"İlişki yönü ters","unit":2,"why_correct":"Text 2 agrees and supplies supporting studies. Choice A gives the direction.","choice_families":{"B":"İlişki yönü ters","A":"Metin dışı çıkarım","C":"İlişki yönü ters"},"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choices":{"A":"Text 2 recommends that schools stop teaching fiction.","B":"Text 2 disputes Text 1's claim that fiction builds empathy.","C":"Text 2 argues that fiction reduces readers' empathy.","D":"Text 2 supports Text 1's claim with experimental evidence."},"lesson":3,"id":"u2-l3-f2-07","why_wrong":{"A":"Neither text recommends dropping fiction.","B":"Text 2 supports rather than disputes Text 1, reversing the direction.","C":"Text 2 shows fiction improves emotion reading, so 'reduces empathy' reverses it."},"correct":"D","passage":"Text 1: A columnist argues that reading fiction builds empathy by letting readers inhabit lives unlike their own.\n\nText 2: A psychologist agrees, citing studies in which readers of literary fiction performed better on tests of reading others' emotions."},{"choice_families":{"B":"İlişki yönü ters","C":"İlişki yönü ters","D":"Metin dışı çıkarım"},"why_correct":"Text 2 notes returns have not emptied museums, countering Text 1's fear. Choice A gives the direction.","target_family":"İlişki yönü ters","unit":2,"choices":{"C":"By confirming that museums cannot survive any returns.","B":"By agreeing with Text 1 that returning artifacts to their countries of origin will eventually empty the world's great museums.","A":"By pointing to evidence that returns have not had the effect Text 1 fears.","D":"By arguing that no artifacts should ever be displayed."},"lesson_name":"Cross-Text Connections","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","id":"u2-l3-f2-08","lesson":3,"correct":"A","passage":"Text 1: A curator argues that returning artifacts to their countries of origin will empty the world's great museums.\n\nText 2: Returns have not emptied museums, a second curator observes; loans, replicas, and new donations have kept the halls full while artifacts went home.","why_wrong":{"D":"Neither text argues against all display.","B":"Text 2 disputes the emptying claim, so agreeing reverses it.","C":"Text 2 shows museums stayed full, so 'cannot survive returns' reverses its point."}},{"passage":"Text 1: A coach insists that natural talent is what separates elite athletes from the rest.\n\nText 2: Talent opens the door, a sports scientist responds, but tracking studies show that hours of deliberate practice predict elite performance far better than early talent does.","correct":"B","why_wrong":{"D":"Text 2 credits practice heavily, so 'no effect' reverses its point.","A":"Text 2 makes practice decisive, so agreeing talent is decisive reverses it.","C":"This restates Text 1's claim, not Text 2's response."},"id":"u2-l3-f2-09","lesson":3,"choices":{"B":"By arguing that practice predicts elite performance more than talent does.","A":"By agreeing that natural talent is the decisive factor.","C":"By confirming that talent alone separates elite athletes.","D":"By claiming that practice has no measurable effect on performance."},"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","why_correct":"Text 2 grants a role to talent but argues practice predicts performance better. Choice A gives the direction.","choice_families":{"D":"Metin dışı çıkarım","A":"İlişki yönü ters","C":"Tek metne dayanma"},"unit":2,"target_family":"İlişki yönü ters"},{"correct":"C","passage":"Text 1: One nutritionist warns that skipping breakfast slows metabolism and leads to overeating later in the day.\n\nText 2: Controlled trials, another nutritionist notes, find no metabolic slowdown from skipping breakfast, and some participants ate less overall, not more.","why_wrong":{"D":"Neither text recommends a five-meal schedule.","B":"Text 2 contradicts the slowdown claim, so agreeing reverses it.","A":"Text 2 found some ate less, so 'overeat later' reverses its finding."},"id":"u2-l3-f2-10","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choice_families":{"D":"Metin dışı çıkarım","B":"İlişki yönü ters","A":"İlişki yönü ters"},"target_family":"İlişki yönü ters","lesson":3,"choices":{"D":"By recommending that people eat five meals a day.","C":"By citing trials that contradict Text 1's warning about skipping breakfast.","B":"By agreeing that skipping breakfast slows metabolism.","A":"By confirming that breakfast-skippers overeat later in the day."},"lesson_name":"Cross-Text
