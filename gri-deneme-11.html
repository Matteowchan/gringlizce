{"listening":{"transcript":"WOMAN: Good morning, GreenLoop Community Eco Centre, Sophie speaking. How can I help you?\nMAN: Oh, hi. I'd like to join your city bike-share scheme. A neighbour of mine uses it and she really recommended it, so I thought I'd give it a go.\nWOMAN: That's great to hear. I can set up a membership for you over the phone right now, if you have a few minutes.\nMAN: Perfect, yes.\nWOMAN: Lovely. Let me just take some details. Can I start with your full name?\nMAN: It's David Foster.\nWOMAN: And could you spell the surname for me, just so I get it right?\nMAN: Sure. It's F-O-S-T-E-R.\nWOMAN: F-O-S-T-E-R. Thank you. And a mobile number where we can reach you?\nMAN: It's oh-seven-nine-four-four, three-one-two, five-eight-oh.\nWOMAN: Let me read that back to you: 07944 312580.\nMAN: That's exactly right.\nWOMAN: Great. And what's your home address?\nMAN: It's 14 Maple Street. That's Maple like the tree, M-A-P-L-E.\nWOMAN: Maple Street, got it. Now, all our memberships begin on a Monday. The next available start date would be the fifteenth of September. Does that suit you?\nMAN: The fifteenth of September is fine, yes.\nWOMAN: Wonderful. Now, there are two plans. Our standard membership is eight pounds a month, and we also do a student plan at five pounds. Are you a student, by any chance?\nMAN: No, I'm not, so I'll go with the standard one.\nWOMAN: No problem, so that's eight pounds a month, billed automatically. Now, when you come to collect your first bike, you'll need to bring some photo identification. A passport is ideal, if you have one handy.\nMAN: Yes, I'll bring my passport.\nWOMAN: Perfect. And don't worry about safety gear, because every new member is given a helmet completely free of charge. It's yours to keep.\nMAN: Oh, that's brilliant. I was going to ask about that.\nWOMAN: We do encourage everyone to wear it. Now, do you know where you'd like to pick the bikes up? There are a few docking stations near Maple Street.\nMAN: Not really, no. Which one is closest to me?\nWOMAN: Well, there's one outside the public library, and another over in the market square, but honestly the nearest to you is the one right next to the train station. It's only a couple of minutes' walk.\nMAN: Oh, next to the station, that's handy. I'll use that one.\nWOMAN: Great choice. And a useful thing to know: every trip is free for the first thirty minutes. After that, there's a small charge per additional half hour, but most people finish their journeys well within the free window.\nMAN: Thirty minutes free, that's plenty for me. I'm only cycling to work.\nWOMAN: Perfect. Now, there is one thing I'd recommend before your very first ride. A lot of new members ask us how the locks and the docking works. We do run training sessions, but really the quickest thing is just to read the short safety leaflet we email you when you join. It covers everything.\nMAN: So I should read the leaflet before I start?\nWOMAN: Yes, definitely have a look at it first. It only takes five minutes and it'll save you any confusion at the station.\nMAN: I'll do that. Thank you, that's really helpful.\nWOMAN: You're very welcome. I'll send the confirmation and the leaflet to you by email today. Welcome to GreenLoop, David.\nMAN: Thanks very much, Sophie. Bye.\nWOMAN: Bye now.","audio":null,"sections":[{"sectionTitle":"Section 1","groups":[{"form":true,"questions":[{"stem":"Surname: ______","answer":"Foster","why":"Adam soyadını 'F-O-S-T-E-R' diye harfliyor.","accept":["FOSTER"],"n":1},{"stem":"Mobile number: ______","n":2,"answer":"07944 312580","why":"Sophie numarayı '07944 312580' diye tekrar ediyor ve David onaylıyor.","accept":["07944312580","07944 312 580"]},{"n":3,"why":"David adresini '14 Maple Street' verir ve 'M-A-P-L-E' diye harfler.","answer":"Maple","accept":["MAPLE"],"stem":"Address: 14 ______ Street"},{"stem":"Membership start date: 15 ______","n":4,"answer":"September","why":"Bir sonraki başlangıç tarihi 'the fifteenth of September' olarak veriliyor.","accept":["Sept","Sep"]},{"stem":"Standard membership fee: £______ a month","accept":["eight"],"answer":"8","why":"Standart üyelik 'eight pounds a month'; David öğrenci olmadığı için bunu seçer.","n":5},{"stem":"Must bring as photo ID: ______","why":"Sophie foto kimlik olarak pasaport ister; David 'I'll bring my passport' der.","answer":"passport","accept":["a passport"],"n":6},{"stem":"Item given free to each member: ______","n":7,"accept":["a helmet"],"answer":"helmet","why":"Her yeni üyeye ücretsiz bir 'helmet' veriliyor."}],"type":"completion","instr":"Complete the form. Write ONE WORD AND/OR A NUMBER for each answer."},{"type":"mcq","questions":[{"n":8,"why":"Sophie kütüphane ve pazar meydanını sayar ama en yakınının tren istasyonu yanındaki olduğunu söyler.","answer":"B","options":[{"k":"A","text":"outside the public library."},{"k":"B","text":"next to the train station."},{"k":"C","text":"in the market square."}],"stem":"The docking station nearest to David's home is"},{"n":9,"why":"'Every trip is free for the first thirty minutes.'","answer":"B","options":[{"k":"A","text":"20 minutes."},{"text":"30 minutes.","k":"B"},{"k":"C","text":"45 minutes."}],"stem":"Each trip is free for the first"},{"n":10,"why":"Eğitim oturumları olsa da Sophie en pratik yolun gönderilen güvenlik broşürünü okumak olduğunu söyler.","options":[{"text":"download an app.","k":"A"},{"text":"attend a training session.","k":"B"},{"text":"read the safety leaflet.","k":"C"}],"answer":"C","stem":"Before his first ride, Sophie advises David to"}],"instr":"Choose the correct letter, A, B or C."}]}]},"number":11,"theme":"SÃ¼rdÃ¼rÃ¼lebilir Åehirler","reading":{"passages":[{"groups":[{"type":"tfng","questions":[{"answer":"TRUE","why":"Paragraf A: 'That attitude has shifted dramatically' ve doğanın eskiden kenara itildiği ifadeleri bu değişimi doğruluyor.","n":1,"stem":"Treating vegetation as infrastructure marks a break with how planners once thought about nature in cities."},{"stem":"The urban heat island is a problem purely because it makes people uncomfortable.","why":"Paragraf B: 'not merely uncomfortable... it contributes to increased mortality' — rahatsızlığın ötesinde ölüm oranını da artırıyor.","answer":"FALSE","n":2},{"stem":"A planted roof releases rainwater more slowly than a conventional roof does.","n":3,"why":"Paragraf C: konvansiyonel çatı suyu 'within minutes' akıtır, bitkili çatı ise 'releasing it gradually'.","answer":"TRUE"},{"n":4,"why":"Paragraf D: 'considerably more expensive than laying a conventional one' ifadesi tam tersini söylüyor.","answer":"FALSE","stem":"Green roofs have become cheaper to install than conventional roofs."},{"why":"Paragraf D yalnızca bazı Alman şehirlerinde çatıların zorunlu olduğunu söyler; ülkeler arası bir kıyas verilmez.","answer":"NOT GIVEN","n":5,"stem":"Germany has more green roofs than any other country in the world."}],"instr":"Do the following statements agree with the information in the passage? Write TRUE, FALSE or NOT GIVEN."},{"questions":[{"stem":"Plants cool the surrounding air through shading and through ______, a process that releases water vapour.","why":"Paragraf B: 'evapotranspiration, the process by which plants release water vapour'.","answer":"evapotranspiration","accept":["evapotranspiration"],"n":6},{"stem":"Economists use the term ______ for the shared benefits of green infrastructure that cannot be assigned to a single owner.","accept":["externalities"],"answer":"externalities","why":"Paragraf D: 'Economists describe such benefits as externalities'.","n":7},{"stem":"By blocking ultraviolet light, a green roof protects the waterproof ______ beneath it.","n":8,"answer":"membrane","why":"Paragraf C: 'extend the life of the waterproof membrane... shields it from ultraviolet light'.","accept":["membrane"]},{"stem":"Campaigners say greening programmes should start in ______ neighbourhoods rather than already comfortable areas.","accept":["poorer"],"why":"Paragraf E: 'poorer neighbourhoods are often the most heavily built up and the least green'.","answer":"poorer","n":9}],"instr":"Complete each sentence with ONE WORD ONLY from the passage.","type":"completion"},{"instr":"Choose the correct heading for each paragraph from the list of headings below.","questions":[{"why":"Paragraf B ısı adasını ve ısı dalgalarında artan ölüm oranını anlatır — sıcak şehirlerin ölümcül olabilmesi.","answer":"iii","n":10,"stem":"Paragraph B"},{"n":11,"answer":"vii","why":"Paragraf C yeşil çatıların yağmur suyunu tutup kademeli saldığını, drenaj yükünü azalttığını anlatır.","stem":"Paragraph C"},{"stem":"Paragraph D","n":12,"why":"Paragraf D maliyeti kimin üstlendiğini, faydanın komşuluğa yayıldığını ve 'externalities' kavramını işler.","answer":"iv"},{"answer":"ii","why":"Paragraf E yeşil alanın şehir içinde eşitsiz dağılımını (zengin/yoksul mahalleler) ele alır.","n":13,"stem":"Paragraph E"}],"options":[{"text":"A remedy that must not be mistaken for a cure","k":"i"},{"text":"The uneven spread of urban greenery","k":"ii"},{"k":"iii","text":"Why warmer cities can be deadly"},{"text":"Who pays and who benefits","k":"iv"},{"k":"v","text":"The history of the formal city park"},{"text":"Measuring the cooling power of a single tree","k":"vi"},{"text":"Rooftops that help to manage rainfall","k":"vii"}],"type":"matching"}],"title":"Rethinking Nature in the Modern City","html":"<p><strong>A</strong> For much of the twentieth century, urban planners regarded nature as something to be pushed to the margins of the city, confined to formal parks and ornamental gardens. That attitude has shifted dramatically. Faced with rising temperatures, worsening air quality and the loss of wildlife, a growing number of municipal authorities now treat vegetation as a form of infrastructure, as essential to a functioning city as roads or sewers. The term 'green infrastructure' captures this change in thinking. Rather than viewing trees, wetlands and planted rooftops as decorative extras, engineers increasingly design them to perform measurable tasks: cooling the air, absorbing storm water and filtering pollutants. The result is a quiet revolution in the way settlements are imagined and built.</p><p><strong>B</strong> Central to this rethinking is the phenomenon known as the urban heat island. Dense concentrations of concrete, asphalt and brick absorb solar radiation during the day and release it slowly after dark, so that city centres can remain several degrees warmer than the surrounding countryside. This temperature difference is not merely uncomfortable; during heatwaves it contributes to increased mortality, particularly among the elderly. Vegetation counteracts the effect through shading and through evapotranspiration, the process by which plants release water vapour and thereby cool the surrounding air. Studies in several European cities have found that a well-treed street can be noticeably cooler than a bare one only metres away.</p><p><strong>C</strong> Green roofs — layers of soil and hardy plants installed on top of buildings — have attracted particular attention. Beyond lowering the temperature of the structure beneath them, they intercept rainfall that would otherwise overwhelm drainage systems. A conventional roof sheds almost all the water that falls on it within minutes; a planted roof can retain a substantial proportion, releasing it gradually. In cities where ageing sewers struggle to cope with sudden downpours, this buffering capacity is valuable. Green roofs also extend the life of the waterproof membrane they cover, because the vegetation shields it from ultraviolet light and extreme temperature swings.</p><p><strong>D</strong> Despite these advantages, green infrastructure has been slow to spread, and cost is frequently blamed. Installing a green roof can be considerably more expensive than laying a conventional one, and the benefits — cooler air, cleaner water, healthier residents — are diffuse and difficult to attribute to any single owner. An individual developer bears the expense, yet the advantages are shared across the whole neighbourhood. Economists describe such benefits as externalities. To overcome this imbalance, some governments have introduced subsidies or regulations. In certain German cities, for instance, new buildings above a given size are required by law to incorporate planted roofs.</p><p><strong>E</strong> There is also a question of fairness. Green space is not distributed evenly within cities. Wealthier districts tend to enjoy more trees, larger parks and quieter, shadier streets, while poorer neighbourhoods are often the most heavily built up and the least green. Because these same neighbourhoods frequently suffer the worst air quality and the highest summer temperatures, the people most exposed to environmental harm are also those with the least access to its natural remedies. Campaigners argue that any serious greening programme must therefore begin in the districts that have historically been neglected, rather than adding further amenities to areas that are already comfortable.</p><p><strong>F</strong> Looking ahead, researchers caution that greenery alone cannot solve the problems of the modern city. Planting trees does not reduce the emissions that drive global warming, and poorly chosen species can demand scarce water or aggravate allergies. The most promising approach, most specialists agree, combines vegetation with other measures — reflective building materials, better public transport and denser, more walkable development. Used thoughtfully, green infrastructure is a powerful tool; treated as a substitute for deeper change, it risks becoming little more than an attractive distraction. The challenge for planners is to weave nature back into the urban fabric without losing sight of its limits.</p>"}]},"writing":{"task2":{"minWords":250,"prompt":"In many cities, private cars are a major cause of air pollution and traffic congestion. Some people believe that private vehicles should be banned from city centres.\n\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.","model":"Traffic congestion and poor air quality have become defining problems of modern urban life, and one increasingly popular solution is to prohibit private cars from city centres altogether. I largely agree with this proposal, provided that robust alternatives are put in place beforehand.\n\nThe most compelling argument in favour of a ban concerns public health and the environment. Private vehicles are a major source of the nitrogen dioxide and fine particulates that trigger respiratory illness, and they generate emissions that accelerate climate change. Removing them from densely populated centres would therefore deliver immediate benefits, as demonstrated by cities such as Oslo, where restricting cars has reduced pollution and freed up street space for pedestrians, cyclists and green areas. The outcome is a quieter, cleaner and considerably more pleasant environment.\n\nEqually important, such a ban tends to make cities more efficient rather than less. When roads are no longer clogged with private traffic, buses and trams move faster, deliveries become more reliable, and reclaimed space can be redesigned for people instead of parking. This frequently revitalises local businesses, since pedestrianised districts typically attract more visitors.\n\nNevertheless, this policy cannot succeed in isolation. Elderly residents, disabled people and those living in poorly connected suburbs often depend on cars, and banning them without affordable, frequent public transport would simply penalise the vulnerable. Sensible exemptions for emergency and accessibility needs are therefore essential.\n\nIn conclusion, although a blanket prohibition risks unfairness if introduced hastily, I believe that banning private cars from city centres is, on balance, a justified and forward-thinking measure, so long as governments invest heavily in reliable public transport first."},"task1":{"model":"The grouped bar chart illustrates the proportion of household waste that was recycled in Oslo, Vienna and Lisbon in 2010, 2015 and 2020.\n\nOverall, recycling rates climbed substantially in all three cities across the ten-year period. Oslo consistently outperformed the other two, whereas Lisbon remained the weakest performer throughout, despite recording the fastest relative progress.\n\nIn 2010, Oslo already recycled 32% of its household waste, compared with 28% in Vienna and just 18% in Lisbon. By 2015, every city had improved noticeably: Oslo's figure rose to 45%, Vienna reached 39%, and Lisbon increased to 27%, slightly narrowing the gap with its rivals.\n\nThis upward trend continued through to 2020, when Oslo peaked at 58%, meaning that well over half of its waste was being recycled. Vienna followed at 51%, having comfortably crossed the halfway mark, while Lisbon finished at 41%. Although Lisbon still trailed the other cities, its rate had more than doubled since 2010, representing the greatest overall improvement of the three.","prompt":"The chart below shows the percentage of household waste that was recycled in three European cities in 2010, 2015 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.","minWords":150,"svg":"<svg viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"inherit\"><text x=\"280\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8A7F6E\">Household waste recycled in three European cities, 2010–2020 (%)</text><rect x=\"120\" y=\"32\" width=\"12\" height=\"12\" fill=\"#2E6E6A\"/><text x=\"136\" y=\"42\" font-size=\"11\" fill=\"#8A7F6E\">Oslo</text><rect x=\"210\" y=\"32\" width=\"12\" height=\"12\" fill=\"#B78A2E\"/><text x=\"226\" y=\"42\" font-size=\"11\" fill=\"#8A7F6E\">Vienna</text><rect x=\"310\" y=\"32\" width=\"12\" height=\"12\" fill=\"#6E4A8E\"/><text x=\"326\" y=\"42\" font-size=\"11\" fill=\"#8A7F6E\">Lisbon</text><line x1=\"60\" y1=\"60\" x2=\"530\" y2=\"60\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"95\" x2=\"530\" y2=\"95\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"130\" x2=\"530\" y2=\"130\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"165\" x2=\"530\" y2=\"165\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"200\" x2=\"530\" y2=\"200\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"235\" x2=\"530\" y2=\"235\" stroke=\"#eadfce\"/><line x1=\"60\" y1=\"60\" x2=\"60\" y2=\"270\" stroke=\"#8A7F6E\"/><line x1=\"60\" y1=\"270\" x2=\"530\" y2=\"270\" stroke=\"#8A7F6E\"/><text x=\"52\" y=\"274\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">0</text><text x=\"52\" y=\"239\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">10</text><text x=\"52\" y=\"204\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">20</text><text x=\"52\" y=\"169\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">30</text><text x=\"52\" y=\"134\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">40</text><text x=\"52\" y=\"99\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">50</text><text x=\"52\" y=\"64\" text-anchor=\"end\" font-size=\"11\" fill=\"#8A7F6E\">60</text><text x=\"22\" y=\"165\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8A7F6E\" transform=\"rotate(-90 22 165)\">Recycling rate (%)</text><rect x=\"101\" y=\"158\" width=\"22\" height=\"112\" fill=\"#2E6E6A\"/><rect x=\"127\" y=\"172\" width=\"22\" height=\"98\" fill=\"#B78A2E\"/><rect x=\"153\" y=\"207\" width=\"22\" height=\"63\" fill=\"#6E4A8E\"/><text x=\"112\" y=\"153\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">32</text><text x=\"138\" y=\"167\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">28</text><text x=\"164\" y=\"202\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">18</text><rect x=\"258\" y=\"112\" width=\"22\" height=\"158\" fill=\"#2E6E6A\"/><rect x=\"284\" y=\"133\" width=\"22\" height=\"137\" fill=\"#B78A2E\"/><rect x=\"310\" y=\"175\" width=\"22\" height=\"95\" fill=\"#6E4A8E\"/><text x=\"269\" y=\"107\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">45</text><text x=\"295\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">39</text><text x=\"321\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">27</text><rect x=\"415\" y=\"67\" width=\"22\" height=\"203\" fill=\"#2E6E6A\"/><rect x=\"441\" y=\"91\" width=\"22\" height=\"179\" fill=\"#B78A2E\"/><rect x=\"467\" y=\"126\" width=\"22\" height=\"144\" fill=\"#6E4A8E\"/><text x=\"426\" y=\"62\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">58</text><text x=\"452\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">51</text><text x=\"478\" y=\"121\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8A7F6E\">41</text><text x=\"138\" y=\"286\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8A7F6E\">2010</text><text x=\"295\" y=\"286\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8A7F6E\">2015</text><text x=\"452\" y=\"286\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8A7F6E\">2020</text></svg>"}}}
  </script>

  <script>
  (function(){
    var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    var norm=function(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?]$/,'');};
    var D;
    try{ D=JSON.parse(document.getElementById('exam').textContent); }catch(e){ D={}; }

    // ---- tabs ----
    document.getElementById('tabs').addEventListener('click',function(e){
      var b=e.target.closest('.tab'); if(!b)return;
      document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t===b);});
      document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+b.dataset.sec);});
      window.scrollTo({top:0,behavior:'smooth'});
    });

    var band=function(raw){var t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4]];for(var i=0;i<t.length;i++){if(raw>=t[i][0])return t[i][1];}return '<4';};

    // ---- render a question group (shared reading/listening) ----
    function renderGroup(g,idprefix){
      var h='<div class="grp"><div class="instr">'+esc(g.instr)+'</div>';
      // matching options legend
      if(g.type==='matching'&&g.options){
        h+='<div style="font-size:13.5px;color:var(--muted);margin:0 0 12px">';
        g.options.forEach(function(o){h+='<div><b>'+esc(o.k)+'</b> &nbsp;'+esc(o.text)+'</div>';});
        h+='</div>';
      }
      (g.questions||[]).forEach(function(q){
        var qid=idprefix+'-'+q.n;
        var ansList=Array.isArray(q.answer)?q.answer.slice():[q.answer];
        if(q.accept)ansList=ansList.concat(q.accept);
        h+='<div class="q" id="q-'+qid+'" data-ans="'+esc(ansList.join('|'))+'">';
        h+='<div class="stem"><span class="qn">'+q.n+'</span>'+esc(q.stem)+'</div>';
        if(g.type==='tfng'){
          h+='<div class="opts">';
          ['TRUE','FALSE','NOT GIVEN'].forEach(function(o){h+='<label class="opt" data-v="'+o+'"><input type="radio" name="'+qid+'">'+o+'</label>';});
          h+='</div>';
        } else if(g.type==='mcq'){
          h+='<div class="opts">';
          (q.options||[]).forEach(function(o){h+='<label class="opt" data-v="'+esc(o.k)+'"><input type="radio" name="'+qid+'"><b style="margin-right:6px">'+esc(o.k)+'</b>'+esc(o.text)+'</label>';});
          h+='</div>';
        } else if(g.type==='matching'){
          h+='<select class="gap" data-q="'+qid+'"><option value="">— seç —</option>';
          g.options.forEach(function(o){h+='<option value="'+esc(o.k)+'">'+esc(o.k)+' · '+esc(o.text)+'</option>';});
          h+='</select>';
        } else { // completion
          h+='<input class="gap" type="text" data-q="'+qid+'" placeholder="cevap" autocomplete="off">';
        }
        var acc=(q.accept&&q.accept.length)?q.accept.join(', '):(Array.isArray(q.answer)?q.answer.join(' / '):q.answer);
        h+='<div class="fb"><b>Doğru cevap:</b> '+esc(acc)+(q.why?' — '+esc(q.why):'')+'</div>';
        h+='</div>';
      });
      h+='</div>';
      return h;
    }

    function wireOpts(root){
      root.querySelectorAll('.opt').forEach(function(l){
        l.addEventListener('click',function(){
          var name=l.querySelector('input').name;
          root.querySelectorAll('.opt input[name="'+name+'"]').forEach(function(i){i.closest('.opt').classList.remove('sel');});
          l.classList.add('sel'); l.querySelector('input').checked=true;
        });
      });
    }

    function gradeSection(root,qids){
      var raw=0,total=qids.length;
      qids.forEach(function(qid){
        var qel=document.getElementById('q-'+qid); if(!qel)return;
        var ansSpec=qel.getAttribute('data-ans');
        var accepts=ansSpec.split('|').map(norm);
        var val='';
        var sel=qel.querySelector('.opt.sel');
        var inp=qel.querySelector('input.gap,select.gap');
        if(sel){val=sel.dataset.v;} else if(inp){val=inp.value;}
        var ok=accepts.indexOf(norm(val))>=0;
        // also accept listed q.accept via data (already merged server-side into accept-> we only have answer; use accept in fb). For completion, check contains
        qel.classList.remove('right','wrong'); qel.classList.add(ok?'right':'wrong');
        if(sel){ // mark correct opt
          qel.querySelectorAll('.opt').forEach(function(o){o.classList.toggle('correct',accepts.indexOf(norm(o.dataset.v))>=0);});
        }
        if(ok)raw++;
      });
      return {raw:raw,total:total};
    }

    // ================= READING =================
    (function(){
      var R=D.reading; var el=document.getElementById('sec-reading');
      if(!R){el.innerHTML='<p class="note">Reading içeriği yükleniyor…</p>';return;}
      var qids=[];
      var h='';
      (R.passages||[]).forEach(function(p,pi){
        h+='<div class="passage"><h3>'+esc(p.title)+'</h3>'+p.html+'</div>';
        (p.groups||[]).forEach(function(g){ h+=renderGroup(g,'r'); (g.questions||[]).forEach(function(q){qids.push('r-'+q.n);}); });
      });
      h+='<div class="actions"><button class="btn" id="gradeR">Cevapları kontrol et</button><span class="score" id="scoreR"></span></div>';
      el.innerHTML=h; wireOpts(el);
      document.getElementById('gradeR').addEventListener('click',function(){
        var res=gradeSection(el,qids);
        document.getElementById('scoreR').innerHTML='Doğru <b>'+res.raw+' / '+res.total+'</b> · %'+Math.round(res.raw/res.total*100);
        document.getElementById('gradeR').scrollIntoView({behavior:'smooth',block:'center'});
      });
    })();

    // ================= LISTENING =================
    (function(){
      var L=D.listening; var el=document.getElementById('sec-listening');
      if(!L){el.innerHTML='<p class="note">Listening içeriği yükleniyor…</p>';return;}
      var qids=[]; var h='';
      h+='<div class="audio-wrap">';
      if(L.audio){ h+='<audio controls preload="none" src="'+esc(L.audio)+'"></audio>'; }
      else { h+='<div class="note">Ses dosyası yakında (MP3 bucket\'a eklenecek). Şimdilik aşağıdaki transcript ile test edebilirsin.</div>'; }
      h+='<div class="reveal" style="margin-top:10px"><button class="btn ghost" data-reveal>Transcript\'i göster</button><div class="reveal-body transcript">'+esc(L.transcript||'')+'</div></div>';
      h+='</div>';
      (L.sections||[]).forEach(function(s){
        h+='<div style="font-family:\'Crimson Pro\',serif;font-size:1.15rem;margin:6px 0 10px">'+esc(s.sectionTitle||s.title||'Section')+'</div>';
        (s.groups||[]).forEach(function(g){ h+=renderGroup(g,'l'); (g.questions||[]).forEach(function(q){qids.push('l-'+q.n);}); });
      });
      h+='<div class="actions"><button class="btn" id="gradeL">Cevapları kontrol et</button><span class="score" id="scoreL"></span></div>';
      el.innerHTML=h; wireOpts(el);
      el.querySelectorAll('[data-reveal]').forEach(function(b){b.addEventListener('click',function(){b.closest('.reveal').classList.toggle('open');});});
      document.getElementById('gradeL').addEventListener('click',function(){
        var res=gradeSection(el,qids);
        document.getElementById('scoreL').innerHTML='Doğru <b>'+res.raw+' / '+res.total+'</b> · %'+Math.round(res.raw/res.total*100);
      });
    })();

    // ================= WRITING =================
    (function(){
      var W=D.writing; var el=document.getElementById('sec-writing');
      if(!W){el.innerHTML='<p class="note">Writing içeriği yükleniyor…</p>';return;}
      function task(t,label,idx){
        var h='<div class="wtask"><span class="eyebrow">'+label+'</span><h3>Task '+idx+'</h3>';
        h+='<p class="prompt">'+esc(t.prompt)+'</p>';
        if(t.svg){h+='<div class="figure">'+t.svg+'</div>';}
        h+='<textarea class="editor" data-target="'+(t.minWords||150)+'" placeholder="Cevabını buraya yaz…"></textarea>';
        h+='<div class="wc">0 kelime · hedef '+(t.minWords||150)+'</div>';
        h+='<div class="reveal"><button class="btn ghost" data-reveal>Model cevabı göster</button><div class="reveal-body">'+esc(t.model||'').replace(/\n/g,'<br>')+'</div></div>';
        h+='</div>';
        return h;
      }
      el.innerHTML=task(W.task1,'Rapor · en az 150 kelime',1)+task(W.task2,'Deneme · en az 250 kelime',2);
      el.querySelectorAll('.editor').forEach(function(t){
        var wc=t.nextElementSibling, tgt=+t.dataset.target;
        t.addEventListener('input',function(){var n=(t.value.trim().match(/\S+/g)||[]).length;wc.textContent=n+' kelime · hedef '+tgt;wc.classList.toggle('ok',n>=tgt);});
      });
      el.querySelectorAll('[data-reveal]').forEach(function(b){b.addEventListener('click',function(){b.closest('.reveal').classList.toggle('open');b.textContent=b.closest('.reveal').classList.contains('open')?'Model cevabı gizle':'Model cevabı göster';});});
    })();

    // header
    if(D.number)document.getElementById('exNum').textContent=D.number;
    if(D.theme)document.getElementById('exSub').textContent=D.theme+' · Reading · Listening · Writing';
  })();
  </script>
</body>
</html>
