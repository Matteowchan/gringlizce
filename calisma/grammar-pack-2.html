<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
:root{--bg:#f0fdfa;--surface:#ffffff;--border:#0d9488;--blight:#ccfbf1;--text:#134e4a;--muted:#5eead4;--muted2:#6b7280;--teal:#0f766e;--tdark:#0d5e57;--tlight:#e6fffa;--taclight:#f0fdfa;--correct:#166534;--cbg:#f0fdf4;--wrong:#991b1b;--wbg:#fef2f2;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(155deg,#f0fdfa 50%,#ccfbf1 100%)}
.s-series{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#5eead4;margin-bottom:.6rem}
.s-badge{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1.1rem;border-radius:50px;margin-bottom:1.6rem}
.s-title{font-family:'Inter',sans-serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;line-height:1.2;margin-bottom:.7rem;color:var(--tdark)}
.s-desc{color:var(--muted2);font-size:.91rem;max-width:440px;line-height:1.65;margin-bottom:1.6rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.2rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.74rem;color:var(--teal);font-family:'DM Mono',monospace}
.btn-p{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.9rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.promo-card{background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.3rem;margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;max-width:320px;width:100%;text-align:center}
.promo-name{font-size:.77rem;color:var(--muted2);font-family:'DM Mono',monospace;letter-spacing:.04em}
.promo-sub{font-size:.68rem;color:var(--muted2);opacity:.7;font-family:'DM Mono',monospace}
.promo-exams{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:.12rem}
.promo-tag{background:transparent;border:1px solid var(--border);border-radius:4px;font-size:.61rem;font-family:'DM Mono',monospace;padding:.1rem .38rem;color:var(--teal);opacity:.85}
.promo-phone{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted2);opacity:.7;margin-top:.1rem}
#quiz{display:none;min-height:100vh;flex-direction:column}
.qbody{flex:1;max-width:680px;margin:0 auto;padding:1.8rem 1.2rem 2.5rem;width:100%}
.tracker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.15rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blight);border:1.5px solid var(--border);transition:all .2s;cursor:pointer}
.dot.ans{background:var(--teal);border-color:var(--teal)}
.dot.cur{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
.qtype-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blight);border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);padding:.25rem .65rem;margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pbox{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r);padding:1.15rem 1.35rem;margin-bottom:1.2rem;font-family:'Lora',serif;font-size:.95rem;line-height:1.78;color:#1c1917}
.pbox u{text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--teal);color:var(--tdark)}
.pbox .blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:60px;text-align:center;font-family:'DM Mono',monospace;font-size:.85rem;color:var(--teal);padding:0 .3rem}
.qt{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--tdark)}
.opts{display:flex;flex-direction:column;gap:.44rem;margin-bottom:1.4rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;background:var(--surface);border:1.5px solid var(--blight);border-radius:var(--r);padding:.65rem .95rem;cursor:pointer;transition:border-color .12s,background .12s;font-size:.91rem;color:var(--text);width:100%;text-align:left;font-family:'Lora',serif}
.opt:hover{border-color:var(--teal);background:var(--taclight)}
.opt.sel{border-color:var(--teal);background:var(--taclight)}
.ol{display:flex;align-items:center;justify-content:center;width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--border);font-size:.72rem;font-family:'DM Mono',monospace;font-weight:700;margin-top:1px;transition:all .12s;flex-shrink:0}
.opt.sel .ol{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center}
.btn-n{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:.55rem 1.1rem;font-size:.87rem;font-weight:600;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s}
.btn-n:hover{border-color:var(--tdark)}
.btn-n:disabled{opacity:.3;cursor:not-allowed}
.btn-sub{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.55rem 1.35rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-sub:hover{opacity:.85}
#results{display:none;background:var(--bg);min-height:100vh}
.rh{background:var(--teal);color:#fff;padding:2rem 1.5rem;text-align:center}
.rh h1{font-family:'Inter',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.rh p{opacity:.75;font-size:.82rem}
.rb{max-width:680px;margin:0 auto;padding:2rem 1.2rem 3rem}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.sc-big{text-align:center}
.sc-num{font-size:3.5rem;font-weight:700;color:var(--teal);font-family:'DM Mono',monospace;line-height:1}
.sc-den{font-size:.8rem;color:var(--muted2);font-family:'DM Mono',monospace}
.sc-pct{font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--tdark)}
.sc-rng{font-size:.8rem;color:var(--muted2);margin-bottom:.4rem}
.sc-tip{font-size:.8rem;color:var(--muted2);line-height:1.55}
.stitle{font-size:.65rem;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:.85rem;padding-bottom:.32rem;border-bottom:1px solid var(--border)}
.wi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.wh{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#fef2f2;border-bottom:1px solid #fecaca;cursor:pointer;user-select:none}
.wn{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--wrong);font-weight:700}
.wt{font-size:.8rem;color:var(--tdark);font-weight:600}
.wtog{margin-left:auto;font-size:.72rem;color:var(--muted2)}
.wb{padding:.9rem;display:none}
.wb.open{display:block}
.rpass{background:var(--bg);border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin-bottom:.7rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.72;color:#1c1917}
.rpass u{text-decoration:none;font-weight:700;color:var(--tdark)}
.ac{background:var(--cbg);color:var(--correct);font-size:.82rem;font-weight:600;padding:.33rem .7rem;border-radius:5px;margin-bottom:.25rem;font-family:'Lora',serif}
.aw{background:var(--wbg);color:var(--wrong);font-size:.82rem;padding:.33rem .7rem;border-radius:5px;margin-bottom:.55rem;text-decoration:line-through;font-family:'Lora',serif}
.expl{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.78rem .9rem;font-size:.82rem;line-height:1.7;color:#292524;white-space:pre-wrap}
.btn-rs{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.75rem 1.8rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:1rem;transition:opacity .15s}
.btn-rs:hover{opacity:.85}
.type-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.ts{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--teal)}
.ts.wrong{border-color:#fca5a5;background:var(--wbg);color:var(--wrong)}
@media(max-width:520px){.sc-card{grid-template-columns:1fr}.sc-num{font-size:2.7rem}}
  


  /* ── Pack Home ── */
  #pack-home{min-height:100vh;display:flex;flex-direction:column;background:var(--bg,#f0fdfa)}
  .ph-header{padding:2.5rem 2rem 2rem;text-align:center;background:var(--teal,#0d9488);color:#fff}

  const ALL_SETS=[null, {"n": 1, "topic": "Boundaries in Paragraph Context", "diff": "Boundaries in Paragraph Context", "qs": [{"k": "Boundaries", "p": "Marine biologists studying the migratory patterns of humpback whales in the North Atlantic have documented a striking behavioral shift over the past two decades. Whales that historically travelled in small, loosely organized pods have begun moving in larger, more coordinated groups. Researchers hypothesize that this change may be an adaptive response to increased shipping traffic, <u>however the evidence remains inconclusive despite several years of observation</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) however, the evidence remains inconclusive, despite several years of observation", "B) however; the evidence remains inconclusive despite several years of observation", "C) ; however, the evidence remains inconclusive despite several years of observation", "D) however the evidence remains, inconclusive despite several years of observation"], "a": 2, "e": "C is correct. 'However' is a conjunctive adverb joining two independent clauses. It requires a semicolon before it and a comma after it: '; however, the evidence remains inconclusive.'\n\nA — a comma before 'however' creates a comma splice.\nB — a semicolon after 'however' (not before) is incorrect placement.\nD — no punctuation before 'however' creates a run-on; the comma after 'remains' is also misplaced."}, {"k": "Boundaries", "p": "The restoration of the Aral Sea, once one of the world's largest lakes, has been the subject of intense international debate for more than thirty years. Engineers have proposed dozens of solutions, ranging from large-scale diversion projects to smaller, community-led water management initiatives. Despite this sustained attention, <u>meaningful progress has remained elusive, local populations continue to face severe water shortages and deteriorating soil conditions</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) meaningful progress has remained elusive; local populations continue to face", "B) meaningful progress has remained elusive — local populations continue to face", "C) meaningful progress has remained elusive, and local populations continue to face", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the comma splice. A semicolon alone correctly joins two independent clauses. A comma + coordinating conjunction ('and') also correctly joins two independent clauses. Both are grammatically valid.\n\nA — semicolon correctly separates two independent clauses.\nB — a dash could work but creates an informal/emphatic tone not signaled by the context.\nC — comma + 'and' correctly joins two independent clauses.\nD is correct because both A and C are valid."}, {"k": "Boundaries", "p": "The concept of 'nudge theory,' developed by behavioral economists Richard Thaler and Cass Sunstein, proposes that subtle changes in how choices are presented can significantly alter decision-making. For example, placing healthier foods at eye level in cafeterias increases their selection rate without restricting any options. <u>Critics argue that nudge theory manipulates behavior without individuals' awareness, proponents counter that it simply makes beneficial choices easier to access</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Critics argue that nudge theory manipulates behavior without individuals' awareness; proponents counter", "B) Critics argue that nudge theory manipulates behavior, without individuals' awareness, proponents counter", "C) Critics argue that nudge theory manipulates behavior without individuals' awareness and proponents counter", "D) Critics argue that nudge theory manipulates behavior without individuals awareness; proponents counter"], "a": 0, "e": "A is correct. Two independent clauses ('Critics argue...' and 'proponents counter...') must be separated by a semicolon. The apostrophe in 'individuals'' is also correctly placed.\n\nB — comma alone between two independent clauses is a comma splice.\nC — 'and' without a preceding comma joins two clauses as a run-on.\nD — 'individuals awareness' omits the required possessive apostrophe."}, {"k": "Boundaries", "p": "Archaeological excavations at the site near Çatalhöyük have revealed evidence of a remarkably complex Neolithic society. Artifacts suggest that residents engaged in long-distance trade, produced sophisticated art, and maintained organized communal spaces within their settlements. <u>What remains debated among scholars is the social hierarchy of the community, some researchers interpret the uniform housing structures as evidence of an egalitarian society, others argue that status distinctions were expressed through portable goods rather than architecture</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) What remains debated among scholars is the social hierarchy of the community; some researchers interpret the uniform housing structures as evidence of an egalitarian society, while others argue", "B) What remains debated among scholars is the social hierarchy of the community. Some researchers interpret the uniform housing structures as evidence of an egalitarian society, others argue", "C) What remains debated among scholars is the social hierarchy of the community — some researchers interpret the uniform housing structures as evidence of an egalitarian society others argue", "D) What remains debated among scholars is the social hierarchy of the community, some researchers interpret the uniform housing structures as evidence of an egalitarian society; others argue"], "a": 0, "e": "A is correct. The first independent clause is separated from the second by a semicolon. The second clause uses 'while' to correctly join the contrasting sub-clauses with a comma.\n\nB — 'some researchers...an egalitarian society, others argue' is a comma splice within the second sentence.\nC — a dash after 'community' then 'others argue' without a conjunction creates a run-on.\nD — a comma after 'community' creates a comma splice between the first and second independent clauses."}, {"k": "Boundaries", "p": "The annual review of pharmaceutical pricing regulations drew representatives from over forty countries to Geneva last spring. Delegations from lower-income nations argued for mandatory licensing provisions that would make essential medicines more affordable, <u>wealthier nations resisted such measures, claiming they would undermine the financial incentives that drive research and development</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) wealthier nations resisted such measures claiming they would undermine", "B) while wealthier nations resisted such measures, claiming they would undermine", "C) wealthier nations resisted such measures; claiming they would undermine", "D) wealthier nations, resisting such measures, claiming they would undermine"], "a": 1, "e": "B is correct. 'While wealthier nations resisted...' turns the second clause into a subordinate clause joined to the first by the subordinating conjunction 'while,' eliminating the comma splice. The participial phrase 'claiming they would undermine' then correctly modifies 'wealthier nations.'\n\nA — removing the comma after 'measures' creates a run-on.\nC — a semicolon cannot precede a participial phrase ('claiming...'); semicolons join independent clauses.\nD — 'resisting' and 'claiming' create two participial phrases with no main verb for 'wealthier nations.'"}, {"k": "Boundaries", "p": "Linguists studying the evolution of Proto-Indo-European have made considerable progress in reconstructing vocabulary related to agriculture and animal husbandry. This reconstruction suggests that early speakers of the language lived in a temperate region with distinct seasons. <u>Some scholars place this homeland in the Pontic steppe, others propose Anatolia as the original site of dispersal, the debate has continued for over a century without resolution</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Some scholars place this homeland in the Pontic steppe; others propose Anatolia as the original site of dispersal, and the debate has continued for over a century without resolution.", "B) Some scholars place this homeland in the Pontic steppe, others propose Anatolia as the original site of dispersal; the debate has continued for over a century without resolution.", "C) Some scholars place this homeland in the Pontic steppe while others propose Anatolia as the original site of dispersal, the debate has continued for over a century without resolution.", "D) Some scholars place this homeland in the Pontic steppe others propose Anatolia as the original site of dispersal; the debate has continued for over a century without resolution."], "a": 0, "e": "A is correct. Three independent clauses are correctly punctuated: a semicolon separates the first from the second, and a comma + 'and' joins the second to the third.\n\nB — a comma between the first and second clauses is a comma splice.\nC — 'while others propose...dispersal, the debate' creates a comma splice between the second and third clauses.\nD — no punctuation between the first and second clauses creates a run-on."}, {"k": "Boundaries", "p": "The structural integrity of the coastal seawall had been a concern for municipal engineers since a partial collapse in 2018. A comprehensive assessment conducted the following year identified seventeen points of critical weakness along the barrier's northern section. <u>Funding for the repairs was allocated in 2020, construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Funding for the repairs was allocated in 2020, but construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder.", "B) Funding for the repairs was allocated in 2020; construction did not begin until late 2023, because of extended contract disputes between the city and the winning bidder.", "C) Funding for the repairs was allocated in 2020 construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder.", "D) Funding for the repairs being allocated in 2020, construction did not begin until late 2023 because of extended contract disputes between the city and the winning bidder."], "a": 0, "e": "A is correct. A comma + coordinating conjunction 'but' correctly joins two contrasting independent clauses and signals the unexpected delay.\n\nB — a semicolon correctly joins the clauses, but the comma before 'because' is non-standard and changes the meaning (making 'because of...' a non-restrictive modifier).\nC — no punctuation between two independent clauses creates a run-on.\nD — 'Funding...being allocated' is an absolute phrase that creates an awkward, incomplete structure."}, {"k": "Boundaries", "p": "Researchers at the Institute for Climate Studies published a meta-analysis of over two hundred peer-reviewed studies last October. Their synthesis revealed that projections for sea level rise had been consistently underestimated in models produced before 2015. <u>The newer models incorporate previously neglected feedback mechanisms, they yield projections that are, in some cases, twice as high as earlier estimates</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) The newer models incorporate previously neglected feedback mechanisms, yielding projections that are, in some cases, twice as high as earlier estimates.", "B) The newer models incorporate previously neglected feedback mechanisms; they yield projections that are, in some cases, twice as high as earlier estimates.", "C) The newer models incorporate previously neglected feedback mechanisms and they yield projections that are, in some cases, twice as high as earlier estimates.", "D) A or B"], "a": 3, "e": "D is correct. Both A and B correctly fix the comma splice. A converts the second clause into a participial phrase (A), and B separates the two independent clauses with a semicolon (B). Both are grammatically valid.\n\nA — participial phrase 'yielding projections...' correctly modifies 'the newer models.'\nB — semicolon correctly separates two independent clauses.\nC — 'and they yield' without a preceding comma creates a run-on.\nD is correct because both A and B are valid fixes."}, {"k": "Boundaries", "p": "The expansion of community health clinics in rural areas has been widely praised as a cost-effective strategy for reducing hospital overcrowding. Advocates note that early intervention and preventive care — the primary services offered by such clinics — can dramatically reduce emergency room visits. <u>Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access they often cannot adequately serve the populations they are meant to reach</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access; they often cannot adequately serve the populations they are meant to reach.", "B) Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access, and they often cannot adequately serve the populations they are meant to reach.", "C) Opponents, however, argue that without sufficient staffing and supply chains, the clinics create an illusion of access — they often cannot adequately serve the populations they are meant to reach.", "D) All of the above"], "a": 3, "e": "D is correct. All three options correctly fix the run-on. A uses a semicolon, B uses comma + 'and,' C uses a dash (which is emphatic and appropriate here). All three are grammatically valid.\n\nA — semicolon separates two independent clauses.\nB — comma + 'and' joins two independent clauses.\nC — dash before an emphatic explanation is grammatically correct.\nD is correct because all three options are valid."}, {"k": "Boundaries", "p": "The novelist's third book marked a significant departure from her earlier, more commercially accessible work. Critics who had praised her debut novel for its warmth and accessibility found the new book demanding and deliberately opaque. <u>Sales reflected this divide, the literary community celebrated the work as a masterpiece, mainstream readers abandoned the author in large numbers</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Sales reflected this divide: the literary community celebrated the work as a masterpiece, while mainstream readers abandoned the author in large numbers.", "B) Sales reflected this divide; the literary community celebrated the work as a masterpiece; mainstream readers abandoned the author in large numbers.", "C) Sales reflected this divide, the literary community celebrated the work as a masterpiece while mainstream readers abandoned the author in large numbers.", "D) Sales reflected this divide — the literary community celebrated the work as a masterpiece, mainstream readers abandoned the author in large numbers."], "a": 0, "e": "A is correct. A colon after 'divide' introduces the explanation. 'While' correctly joins the two contrasting sub-clauses within the explanation.\n\nB — three independent clauses separated by two semicolons is technically grammatical but unusual; the colon in A more clearly signals the explanatory relationship.\nC — a comma after 'divide' creates a comma splice.\nD — a dash introduces the explanation, but 'mainstream readers abandoned' is then joined only by a comma to the preceding clause, creating a comma splice."}, {"k": "Boundaries", "p": "Economists analyzing the long-term effects of automation on labor markets have reached divergent conclusions. Some predict catastrophic job displacement in sectors like manufacturing and transportation, <u>others contend that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment has been neutral or even positive in most previous industrial transitions</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) while others contend that history suggests new technologies consistently generate as many positions as they eliminate; the net effect on employment has been neutral or even positive in most previous industrial transitions.", "B) others contend that history suggests new technologies consistently generate as many positions as they eliminate; the net effect on employment has been neutral or even positive in most previous industrial transitions.", "C) others contend that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment being neutral or even positive in most previous industrial transitions.", "D) others contending that history suggests new technologies consistently generate as many positions as they eliminate, the net effect on employment has been neutral or even positive."], "a": 0, "e": "A is correct. 'While others contend' converts the second main clause into a subordinate clause, correctly joining it to the first with a comma. A semicolon then separates the elaborating third clause.\n\nB — a comma before 'others contend' (without 'while') creates a comma splice.\nC — a comma before 'the net effect' creates a comma splice within the second clause.\nD — 'others contending' is a participial phrase without a main verb; fragment."}, {"k": "Boundaries", "p": "The discovery of gravitational waves by the LIGO observatory in 2015 was hailed as one of the most significant scientific achievements of the century. Einstein had predicted their existence nearly a hundred years earlier, <u>yet no instrument had previously been sensitive enough to detect them, the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) yet no instrument had previously been sensitive enough to detect them; the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.", "B) yet no instrument had previously been sensitive enough to detect them, and the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.", "C) yet no instrument had previously been sensitive enough to detect them — the LIGO team spent over a decade refining their measurement technology before the breakthrough was achieved.", "D) All of the above"], "a": 3, "e": "D is correct. All three options correctly fix the comma splice after 'detect them.' A semicolon, a comma + 'and,' and a dash all correctly join the two independent clauses.\n\nA — semicolon is correct.\nB — comma + 'and' is correct.\nC — dash is correct.\nD is correct because all three are grammatically valid."}, {"k": "Boundaries", "p": "The international panel on pandemic preparedness released its final report after eighteen months of deliberation. The report outlined a series of systemic failures that had hampered the global response to recent outbreaks. <u>Foremost among these was the lack of coordinated data-sharing between national health agencies, without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Foremost among these was the lack of coordinated data-sharing between national health agencies; without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments.", "B) Foremost among these was the lack of coordinated data-sharing between national health agencies, without a unified reporting system early warning signals were consistently overlooked or underreported by individual governments.", "C) Foremost among these was the lack of coordinated data-sharing between national health agencies without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments.", "D) Foremost among these was the lack of coordinated data-sharing between national health agencies. Without a unified reporting system, early warning signals were consistently overlooked or underreported by individual governments."], "a": 0, "e": "A is correct. A semicolon separates the first independent clause from the second. The introductory phrase 'without a unified reporting system' is correctly followed by a comma before the main clause.\n\nB — a comma after 'agencies' creates a comma splice; additionally 'without a unified reporting system' lacks the required comma after it.\nC — no punctuation after 'agencies' creates a run-on.\nD is also correct — a period is always a valid fix for a comma splice — but A is more concise as a single sentence. On the SAT, when both are listed, the semicolon option (A) is typically preferred."}, {"k": "Boundaries", "p": "Urban planners in Copenhagen have developed a network of bicycle infrastructure that has dramatically reduced car traffic in the city center. Protected lanes, signal priority systems, and dedicated parking facilities now serve over sixty percent of commuters who choose to cycle. <u>Other European cities have attempted to replicate this model, most lack the decades of political will and sustained investment that made Copenhagen's system viable</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Other European cities have attempted to replicate this model, but most lack the decades of political will and sustained investment that made Copenhagen's system viable.", "B) Other European cities have attempted to replicate this model; most, however, lack the decades of political will and sustained investment that made Copenhagen's system viable.", "C) Other European cities have attempted to replicate this model; most lack the decades of political will and sustained investment that made Copenhagen's system viable.", "D) All of the above"], "a": 3, "e": "D is correct. All three options correctly fix the comma splice. A uses comma + 'but,' B uses semicolon + 'however,' C uses a semicolon alone. All are grammatically valid.\n\nA — comma + 'but' signals contrast; correct.\nB — semicolon + 'however' + comma signals contrast; correct.\nC — semicolon alone separates two independent clauses; correct.\nD is correct because all three are valid."}, {"k": "Boundaries", "p": "The legal challenge to the municipality's zoning ordinance was initiated by a coalition of property developers who argued that the new height restrictions violated existing building rights. After three hearings before the planning tribunal, <u>the coalition's lead attorney filed for an emergency injunction, the construction timeline for two major projects had already been delayed by more than fourteen months</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) the coalition's lead attorney filed for an emergency injunction because the construction timeline for two major projects had already been delayed by more than fourteen months.", "B) the coalition's lead attorney filed for an emergency injunction, and the construction timeline for two major projects had already been delayed by more than fourteen months.", "C) the coalition's lead attorney filed for an emergency injunction; the construction timeline for two major projects had already been delayed by more than fourteen months.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the comma splice. A uses 'because' to show causality, which fits the context. C uses a semicolon to separate two independent clauses. Both are grammatically valid.\n\nA — 'because' correctly subordinates the second clause, showing the reason for the injunction.\nC — semicolon correctly joins two independent clauses.\nB — 'and' implies addition rather than causality; the relationship between the clauses is causal, making A more precise.\nD is correct because A and C are both grammatically valid."}, {"k": "Boundaries", "p": "Psychologists studying the phenomenon of 'choice overload' have found that presenting consumers with too many options can paradoxically reduce purchasing decisions. A classic study involving jam varieties demonstrated that shoppers presented with twenty-four options were far less likely to buy than those given only six. <u>These findings have been applied in retail design, digital product interfaces, and policy nudges, critics, however, note that replication attempts have produced inconsistent results across different cultural contexts</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) These findings have been applied in retail design, digital product interfaces, and policy nudges; critics, however, note that replication attempts have produced inconsistent results across different cultural contexts.", "B) These findings have been applied in retail design, digital product interfaces, and policy nudges, critics, however, note that replication attempts have produced inconsistent results.", "C) These findings have been applied in retail design, digital product interfaces, and policy nudges — critics note, however, that replication attempts have produced inconsistent results across different cultural contexts.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the comma splice. A uses a semicolon before 'critics'; C uses a dash before 'critics.' Both are grammatically valid fixes.\n\nA — semicolon before the contrasting clause is correct; 'however' is correctly enclosed in commas.\nC — a dash introduces the contrasting clause with emphasis; 'however' is correctly repositioned within the clause.\nB — a comma after 'policy nudges' creates a comma splice.\nD is correct because both A and C are valid."}, {"k": "Boundaries", "p": "A team of geologists mapping the tectonic history of the Himalayan region has identified a previously unknown subduction zone beneath the southern edge of the Tibetan Plateau. The discovery has significant implications for earthquake risk modeling in northern India and Pakistan. <u>Current models were developed in the 1990s and do not account for this feature, updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) Current models were developed in the 1990s and do not account for this feature; updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people.", "B) Current models, developed in the 1990s and not accounting for this feature, will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people when updated.", "C) Current models were developed in the 1990s, do not account for this feature, and updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people.", "D) Because current models were developed in the 1990s and do not account for this feature, updating them will require a complete reassessment of seismic hazard zones across a region home to over three hundred million people."], "a": 0, "e": "A is correct. A semicolon separates the first independent clause from the second. The second clause 'updating them will require...' is a complete independent clause with a gerund subject.\n\nB — restructures the sentence into a passive/complex form that changes the emphasis.\nC — 'and updating them will require' adds a third parallel verb after 'developed' and 'do not account,' but 'updating them' is a gerund subject, not a parallel verb.\nD — 'Because current models...do not account for this feature' is a valid causal structure but changes the relationship between the clauses."}, {"k": "Boundaries", "p": "The municipal water authority announced a series of emergency conservation measures in response to the unprecedented drought conditions that have persisted for the third consecutive summer. Residents in the affected zones were asked to limit outdoor watering and car washing. <u>Businesses in the service sector faced stricter mandates, restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Businesses in the service sector faced stricter mandates: restaurants were required to serve water only upon request, and car washes were ordered to reduce operating hours by fifty percent.", "B) Businesses in the service sector faced stricter mandates; restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent.", "C) Businesses in the service sector faced stricter mandates — restaurants were required to serve water only upon request, car washes were ordered to reduce operating hours by fifty percent.", "D) Businesses in the service sector faced stricter mandates, restaurants being required to serve water only upon request, and car washes ordered to reduce operating hours by fifty percent."], "a": 0, "e": "A is correct. A colon after 'stricter mandates' correctly introduces the list of examples. 'And' before the final item correctly joins the two-item list within the colon's scope.\n\nB — a semicolon before 'restaurants' is valid, but 'restaurants were required..., car washes were ordered' is still a comma splice within the second clause.\nC — a dash introduces the examples but 'car washes were ordered' is joined by only a comma to 'restaurants were required,' creating a comma splice.\nD — 'restaurants being required' and 'car washes ordered' are participial phrases that lack proper parallel structure."}, {"k": "Boundaries", "p": "The historian's account of the treaty negotiations drew on previously classified diplomatic cables obtained through a freedom of information request. Her analysis challenged the prevailing view that the agreement was reached through mutual compromise. <u>She argued instead that one delegation had concealed its true demands throughout the talks, by the time the other party understood the terms it had accepted, the treaty had already been formally ratified</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) She argued instead that one delegation had concealed its true demands throughout the talks; by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.", "B) She argued instead that one delegation had concealed its true demands throughout the talks: by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.", "C) She argued instead that one delegation had concealed its true demands throughout the talks — by the time the other party understood the terms it had accepted, the treaty had already been formally ratified.", "D) All of the above"], "a": 3, "e": "D is correct. All three options correctly fix the comma splice. A semicolon (A), colon (B), and dash (C) all correctly separate the two independent clauses. Each carries a slightly different nuance — semicolon is coordinate, colon is explanatory, dash is emphatic — but all are grammatically correct.\n\nA — semicolon is correct.\nB — colon is correct (the second clause explains 'by the time').\nC — dash is correct.\nD is correct because all three are valid."}, {"k": "Boundaries", "p": "Neurologists studying sleep architecture have documented significant differences in slow-wave sleep patterns between individuals who regularly use screens in the hour before bed and those who do not. The blue light emitted by digital devices is believed to suppress melatonin production, delaying the onset of deeper sleep stages. <u>Participants in the study who avoided screen use reported falling asleep faster, they also spent a greater proportion of the night in restorative slow-wave sleep, their daytime alertness scores were measurably higher</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Participants in the study who avoided screen use reported falling asleep faster; they also spent a greater proportion of the night in restorative slow-wave sleep, and their daytime alertness scores were measurably higher.", "B) Participants in the study who avoided screen use reported falling asleep faster, also spending a greater proportion of the night in restorative slow-wave sleep, their daytime alertness scores being measurably higher.", "C) Participants in the study who avoided screen use reported falling asleep faster, they also spent a greater proportion of the night in restorative slow-wave sleep; their daytime alertness scores were measurably higher.", "D) Participants in the study who avoided screen use: reported falling asleep faster, also spent a greater proportion of the night in restorative slow-wave sleep, and had measurably higher daytime alertness scores."], "a": 0, "e": "A is correct. A semicolon separates the first clause from a second that lists two more findings joined by 'and.'\n\nB — 'also spending' and 'their daytime alertness scores being' are absolute/participial phrases that create an awkward, incomplete structure.\nC — a comma between the first and second clauses is a comma splice; the semicolon between the second and third clauses is correct but the opening splice remains.\nD — a colon after 'screen use' incorrectly separates the subject from its predicate ('reported')."}, {"k": "Boundaries", "p": "The forensic accountant's report on the organization's financial irregularities ran to over four hundred pages. It identified a pattern of fraudulent invoices submitted by a single vendor over a period of seven years. <u>The vendor's representative denied any wrongdoing, internal communications later obtained by investigators told a very different story, they showed a deliberate scheme to inflate contract values</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) The vendor's representative denied any wrongdoing; internal communications later obtained by investigators told a very different story, however, showing a deliberate scheme to inflate contract values.", "B) The vendor's representative denied any wrongdoing, but internal communications later obtained by investigators told a very different story: they showed a deliberate scheme to inflate contract values.", "C) The vendor's representative denied any wrongdoing; internal communications later obtained by investigators told a very different story, showing a deliberate scheme to inflate contract values.", "D) B or C"], "a": 3, "e": "D is correct. Both B and C correctly fix the comma splice. B uses comma + 'but' before the second clause and a colon to introduce the explanation. C uses a semicolon before the second clause and converts the third clause into a participial phrase.\n\nA — 'however, showing' creates an awkward participial following a conjunctive adverb.\nB — comma + 'but' signals contrast; colon introduces the elaboration. Correct.\nC — semicolon separates the first two clauses; 'showing' converts the third to a participial phrase modifying 'internal communications.' Correct.\nD is correct because both B and C are valid."}, {"k": "Boundaries", "p": "The literature on organizational decision-making distinguishes between situations in which groups produce better outcomes than individuals and those in which individual judgment is more reliable. Research suggests that group deliberation tends to improve accuracy when members have access to diverse, independent information sources. <u>When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors, this phenomenon is known as 'information cascade'</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors; this phenomenon is known as 'information cascade.'", "B) When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors, a phenomenon known as 'information cascade.'", "C) When groups are exposed to the same initial information, however, they tend to amplify rather than correct each other's errors — a phenomenon known as 'information cascade.'", "D) A, B, or C"], "a": 3, "e": "D is correct. A uses a semicolon to separate two independent clauses. B converts the third element into an appositive phrase with a comma. C uses a dash before the appositive phrase for emphasis. All three correctly fix the comma splice.\n\nA — semicolon is correct.\nB — ', a phenomenon known as' is a non-restrictive appositive; correct.\nC — dash before the appositive is emphatic and correct.\nD is correct because all three are valid."}, {"k": "Boundaries", "p": "Climate scientists have long observed that the Arctic is warming at nearly four times the rate of the global average, a phenomenon referred to as 'Arctic amplification.' This accelerated warming is reshaping ecosystems, disrupting migration patterns, and raising sea levels at rates that exceed earlier projections. <u>The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate, this releases greenhouse gases that create a feedback loop, further intensifying warming</u>.", "q": "Which choice corrects the underlined portion?", "o": ["A) The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate, releasing greenhouse gases that create a feedback loop, further intensifying warming.", "B) The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate; this releases greenhouse gases that create a feedback loop, further intensifying warming.", "C) The permafrost — which stores vast amounts of carbon in frozen organic matter — is thawing at an accelerating rate: this releases greenhouse gases that create a feedback loop, further intensifying warming.", "D) B or C"], "a": 3, "e": "D is correct. Both B and C correctly fix the comma splice. B separates the two independent clauses with a semicolon. C uses a colon to introduce the explanation. Both are grammatically valid.\n\nA — 'releasing greenhouse gases' converts the second clause into a participial phrase; also valid.\nB — semicolon is correct.\nC — colon introduces the explanation of what thawing does; correct.\nD is correct because B and C are both valid. (A is also correct, but D as stated covers B and C.)"}, {"k": "Boundaries", "p": "Historians of science have increasingly focused on the role of institutional networks in shaping the development of scientific knowledge. Rather than treating discovery as the product of isolated genius, recent scholarship emphasizes the collaborative and often contentious social processes through which theories gain acceptance. <u>Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed, questions about who controls these mechanisms have become central to the sociology of science</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published and which are dismissed; questions about who controls these mechanisms have become central to the sociology of science.", "B) Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed; questions about who controls these mechanisms have become central to the sociology of science.", "C) Peer review, funding structures, and disciplinary norms all play a role in determining which findings are published, which are dismissed, and questions about who controls these mechanisms have become central to the sociology of science.", "D) Peer review, funding structures, and disciplinary norms all play a role — determining which findings are published, which are dismissed, and raising questions about who controls these mechanisms, which has become central to the sociology of science."], "a": 0, "e": "A is correct. The first clause is complete: 'which are published and which are dismissed' are correctly joined by 'and' as a parallel pair. A semicolon then separates the second independent clause.\n\nB — a semicolon inside the 'which are published, which are dismissed' pair breaks the parallel structure.\nC — 'and questions about who controls' adds a third element that is not parallel to 'which findings are published' or 'which are dismissed.'\nD — restructures the sentence awkwardly with a dash and creates ambiguity with 'which has become.'"}, {"k": "Boundaries", "p": "The introduction of autonomous vehicles into urban traffic systems presents both opportunities and significant regulatory challenges. Proponents argue that self-driving cars will dramatically reduce accidents caused by human error, improve fuel efficiency, and ease congestion. <u>Skeptics point out that the technology is not yet reliable enough for widespread deployment, they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally</u>.", "q": "Which choice best corrects the underlined portion?", "o": ["A) Skeptics point out that the technology is not yet reliable enough for widespread deployment; they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.", "B) Skeptics point out that the technology is not yet reliable enough for widespread deployment, also raising concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.", "C) Skeptics point out that the technology is not yet reliable enough for widespread deployment — they also raise concerns about liability frameworks, cybersecurity vulnerabilities, and the displacement of professional drivers who number in the millions globally.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the comma splice. A uses a semicolon, C uses a dash. Both are grammatically valid.\n\nA — semicolon correctly separates two independent clauses.\nC — dash is emphatic and correct.\nB — 'also raising concerns' is a participial phrase that correctly modifies 'skeptics'; this is also valid, but the question asks which choice 'best corrects' and D covers A and C.\nD is correct because both A and C are valid."}]}, {"n": 2, "topic": "Commas — Advanced", "diff": "Advanced Comma Usage", "qs": [{"k": "Commas", "p": "The epidemiologist's report, <u>which synthesized data from forty-three national health registries collected between 2010 and 2022</u>, concluded that childhood vaccination rates had declined in twelve of the surveyed countries.", "q": "Which choice correctly handles the relative clause?", "o": ["A) which synthesized data from forty-three national health registries collected between 2010 and 2022,", "B) which synthesized data from forty-three national health registries, collected between 2010 and 2022", "C) that synthesized data from forty-three national health registries collected between 2010 and 2022", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Which synthesized data from forty-three national health registries collected between 2010 and 2022' is a non-restrictive relative clause (it adds information about the specific report, not defining which report). It is enclosed in commas. 'Collected between 2010 and 2022' is a restrictive participial phrase modifying 'registries' — no commas needed there.\n\nA — misplaces the closing comma after '2022' where one already exists; creates duplicate comma structure.\nB — a comma before 'collected' incorrectly makes 'collected between 2010 and 2022' non-restrictive.\nC — 'that' is used for restrictive clauses; this clause is non-restrictive (set off by commas)."}, {"k": "Commas", "p": "The legal team, having reviewed all submitted evidence and witness depositions, <u>recommended that the case be settled out of court, citing the unpredictability of jury verdicts in cases involving complex financial instruments</u>.", "q": "Which choice correctly handles the participial phrase at the end?", "o": ["A) recommended that the case be settled out of court; citing the unpredictability of jury verdicts in cases involving complex financial instruments.", "B) recommended that the case be settled out of court, citing the unpredictability of jury verdicts in cases involving complex financial instruments.", "C) recommended that the case be settled out of court — citing the unpredictability of jury verdicts in cases involving complex financial instruments.", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Citing the unpredictability of jury verdicts...' is a participial phrase that correctly modifies 'the legal team' and is separated from the main clause by a comma. This is the standard way to attach a participial reason or manner phrase.\n\nA — a semicolon cannot precede a participial phrase; semicolons join independent clauses.\nB — same as D; a comma before a trailing participial phrase is standard.\nC — a dash is emphatic; possible but not more correct than a comma.\nD is correct."}, {"k": "Commas", "p": "The negotiating committee, <u>composed of representatives from seven member states and chaired by a senior diplomat from Brazil</u> had been meeting weekly since the beginning of the fiscal year.", "q": "Which choice correctly punctuates the participial phrase?", "o": ["A) composed of representatives from seven member states and chaired by a senior diplomat from Brazil,", "B) composed of representatives from seven member states, and chaired by a senior diplomat from Brazil,", "C) composed of representatives from seven member states and chaired, by a senior diplomat from Brazil,", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Composed of representatives...and chaired by a senior diplomat from Brazil' is a single non-restrictive participial phrase modifying 'the negotiating committee.' It must be closed with a comma before the main verb 'had been meeting.' A comma already precedes the phrase; the closing comma after 'Brazil' is missing in the original and is added in A.\n\nB — a comma between 'member states' and 'and chaired' unnecessarily splits the compound participial phrase.\nC — a comma after 'chaired' incorrectly interrupts the phrase.\nD — the original lacks the closing comma needed to enclose the non-restrictive phrase."}, {"k": "Commas", "p": "Scientists studying ancient DNA extracted from a 7,000-year-old skeleton found in a cave in Spain have determined that the individual, <u>who had dark skin, blue eyes, and hunter-gatherer dietary habits</u>, represents a population that predates the arrival of agriculture in Western Europe.", "q": "Which choice is correct?", "o": ["A) who had dark skin blue eyes and hunter-gatherer dietary habits", "B) who had dark skin, blue eyes, and hunter-gatherer dietary habits,", "C) who had dark skin, blue eyes, and hunter-gatherer dietary habits", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Who had dark skin, blue eyes, and hunter-gatherer dietary habits' is a non-restrictive relative clause correctly enclosed in commas. The list within the clause ('dark skin, blue eyes, and hunter-gatherer dietary habits') is correctly punctuated with an Oxford comma.\n\nA — omits the commas separating items in the list.\nB — adds a second closing comma after 'habits,' creating a double comma before the main verb 'represents.'\nC — missing the closing comma that encloses the non-restrictive clause."}, {"k": "Commas", "p": "The council <u>approved, despite vocal opposition from three of its twelve members, the proposal to redirect funds from the parks maintenance budget to emergency infrastructure repairs</u>.", "q": "Which choice correctly punctuates this sentence?", "o": ["A) approved, despite vocal opposition from three of its twelve members, the proposal", "B) approved the proposal, despite vocal opposition from three of its twelve members, to redirect funds from the parks maintenance budget to emergency infrastructure repairs.", "C) approved the proposal to redirect funds from the parks maintenance budget to emergency infrastructure repairs, despite vocal opposition from three of its twelve members.", "D) B or C"], "a": 3, "e": "D is correct. Both B and C correctly reposition the parenthetical phrase. B places 'despite vocal opposition' after 'the proposal' and closes it before 'to redirect.' C moves 'despite vocal opposition' to the end, after the main object.\n\nA — inserting 'despite vocal opposition from three of its twelve members' between 'approved' and 'the proposal' separates the verb from its direct object with a long interrupting phrase, which is grammatically awkward.\nB — correctly encloses the parenthetical between commas after 'the proposal.'\nC — places the parenthetical at the end, which is clear and correct.\nD is correct because B and C are both valid."}, {"k": "Commas", "p": "The prime minister's proposal, <u>which would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated</u>, was tabled for a second reading.", "q": "Which choice correctly handles the compound relative clause?", "o": ["A) which would require all major corporations operating within the country to publish annual sustainability reports, and which critics argue is an undue burden on smaller enterprises that have recently incorporated", "B) which would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated", "C) that would require all major corporations operating within the country to publish annual sustainability reports and which critics argue is an undue burden on smaller enterprises that have recently incorporated", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. The two 'which' clauses form a compound non-restrictive relative clause: 'which would require...and which critics argue...' No comma is needed between the two 'which' clauses because they are joined by 'and.' The outer commas (before 'which' and after 'incorporated') correctly enclose the entire compound clause.\n\nA — adds a comma between the two 'which' clauses, incorrectly splitting the compound clause.\nC — mixes 'that' (restrictive) with 'which' (non-restrictive) in a compound, which is grammatically inconsistent.\nD is correct."}, {"k": "Commas", "p": "The author dedicated her book to her mentor, <u>Professor Elaine Morris who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists</u>.", "q": "Which choice correctly punctuates the appositive and relative clauses?", "o": ["A) Professor Elaine Morris, who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists,", "B) Professor Elaine Morris who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists,", "C) Professor Elaine Morris, who spent three decades teaching at the University of Edinburgh and whose seminal work on discourse analysis shaped an entire generation of linguists", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Professor Elaine Morris' is a non-restrictive appositive for 'her mentor.' The relative clause 'who spent three decades...and whose seminal work...' further describes Morris and is also non-restrictive. A comma after 'Morris' opens the relative clause and a comma after 'linguists' closes the entire parenthetical before the period.\n\nB — no comma after 'Morris' makes the relative clause appear restrictive.\nC — no closing comma after 'linguists' leaves the non-restrictive element improperly enclosed.\nD — no comma after 'Morris' is incorrect."}, {"k": "Commas", "p": "The researchers noted that the drug's efficacy, <u>measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation</u>, was significantly higher in participants who had not previously undergone chemotherapy.", "q": "Which choice is correct?", "o": ["A) measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation,", "B) measured by the proportion of patients, who achieved full remission within twelve weeks of treatment initiation,", "C) measured by the proportion of patients who achieved full remission, within twelve weeks of treatment initiation,", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Measured by the proportion of patients who achieved full remission within twelve weeks of treatment initiation' is a non-restrictive participial phrase modifying 'the drug's efficacy.' It is correctly enclosed in commas. The relative clause 'who achieved full remission within twelve weeks' is restrictive (defining which patients) and correctly takes no commas.\n\nA — misplaces the closing comma within the participial phrase rather than at its end.\nB — adding commas around 'who achieved full remission within twelve weeks of treatment initiation' incorrectly makes this restrictive clause non-restrictive.\nC — inserting a comma before 'within twelve weeks' incorrectly interrupts a restrictive phrase.\nD is correct."}, {"k": "Commas", "p": "Candidates applying for the senior analyst position must demonstrate proficiency in statistical modeling, <u>experience with Python or R</u>, and a record of published research in peer-reviewed journals.", "q": "Which choice correctly handles the list item?", "o": ["A) experience with Python, or R", "B) experience with Python or R,", "C) experience with Python or R", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. In the three-item list — 'proficiency in statistical modeling,' 'experience with Python or R,' and 'a record of published research' — the middle item is 'experience with Python or R.' Enclosing it in commas on both sides correctly separates it from the adjacent list items. No comma is needed within the phrase 'Python or R.'\n\nA — a comma between 'Python' and 'or R' incorrectly suggests Python and R are separate list items.\nB — a comma after 'Python or R' followed by 'and' would create a four-item list appearance.\nC — missing the opening comma before 'experience,' which is needed to separate it from the previous list item.\nD is correct."}, {"k": "Commas", "p": "The director, <u>who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries</u>, announced her retirement at the end of the board meeting.", "q": "Which choice is correct?", "o": ["A) who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries,", "B) that had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries,", "C) who had overseen the organization's expansion, from a three-person startup into a company with offices in fourteen countries", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Who had overseen the organization's expansion from a three-person startup into a company with offices in fourteen countries' is a non-restrictive relative clause correctly enclosed in commas.\n\nA — adds a comma before the main verb 'announced,' creating a double comma at the end of the clause (one already exists before 'announced').\nB — 'that' is used with restrictive clauses; this clause is non-restrictive.\nC — a comma before 'from a three-person startup' incorrectly interrupts the prepositional phrase that specifies the direction of expansion.\nD is correct."}, {"k": "Commas", "p": "The foundation's annual report, released last Thursday and covering fiscal year 2024, <u>outlined three strategic priorities: expanding access to education in underserved rural communities, strengthening partnerships with public health agencies</u> and increasing the transparency of grant allocation processes.", "q": "Which choice correctly punctuates the final list item?", "o": ["A) strengthening partnerships with public health agencies, and increasing", "B) strengthening partnerships with public health agencies; and increasing", "C) strengthening partnerships with public health agencies and increasing", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The list has three items: 'expanding access...,' 'strengthening partnerships...,' and 'increasing the transparency...' A comma before 'and' before the final item (Oxford comma) is required.\n\nB — a semicolon in a simple list is used only when items contain internal commas; these items do not.\nC — no comma before 'and' omits the required Oxford comma.\nD — the original lacks the comma before 'and,' which is needed."}, {"k": "Commas", "p": "Having analyzed the voting records of all sitting legislators, the political scientist concluded that ideological polarization, <u>rather than constituency pressure or party discipline</u>, was the dominant predictor of voting behavior on climate legislation.", "q": "Which choice correctly handles the parenthetical?", "o": ["A) rather than constituency pressure, or party discipline", "B) rather than constituency pressure or party discipline,", "C) rather than constituency pressure or party discipline", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Rather than constituency pressure or party discipline' is a parenthetical phrase correctly enclosed in commas on both sides. No comma is needed between 'pressure' and 'or' because 'constituency pressure' and 'party discipline' are two alternatives within the phrase, not two separate list items.\n\nA — a comma before 'or' incorrectly splits the two alternatives.\nB — only a closing comma without an opening comma is asymmetrical.\nC — missing both commas that enclose the parenthetical.\nD is correct."}, {"k": "Commas", "p": "The symposium brought together historians, archaeologists, and anthropologists from thirty-two countries to examine the role of trade routes in the spread of cultural practices during the Bronze Age. The keynote address, <u>delivered by a professor from the University of Tokyo and lasting nearly two hours</u>, challenged several foundational assumptions of the field.", "q": "Which choice correctly handles the participial phrase?", "o": ["A) delivered by a professor from the University of Tokyo, and lasting nearly two hours", "B) delivered by a professor from the University of Tokyo and lasting nearly two hours,", "C) delivered by a professor from the University of Tokyo and lasting nearly two hours", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Delivered by a professor from the University of Tokyo and lasting nearly two hours' is a compound participial phrase correctly enclosed in commas. The two participial elements ('delivered' and 'lasting') are joined by 'and' without an additional comma.\n\nA — a comma between 'Tokyo' and 'and lasting' incorrectly separates the two elements of the compound participial phrase.\nB — adds a closing comma after 'hours' where one already exists (the comma before 'challenged').\nC — missing the closing comma needed to enclose the non-restrictive participial phrase.\nD is correct."}, {"k": "Commas", "p": "The central bank's decision to raise interest rates by fifty basis points, <u>announced on a Tuesday morning and immediately triggering sharp declines across global equity markets</u>, surprised analysts who had expected a more cautious approach.", "q": "Which choice is correct?", "o": ["A) announced on a Tuesday morning, and immediately triggering sharp declines across global equity markets", "B) announced on a Tuesday morning and immediately triggering sharp declines across global equity markets,", "C) announced on a Tuesday morning and immediately triggering, sharp declines across global equity markets", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Announced on a Tuesday morning and immediately triggering sharp declines across global equity markets' is a compound participial phrase correctly enclosed in commas.\n\nA — a comma before 'and immediately triggering' incorrectly separates the two parts of the compound participial.\nB — adds a closing comma creating a double comma with the one already present.\nC — a comma before 'sharp declines' incorrectly interrupts the object of 'triggering.'\nD is correct."}, {"k": "Commas", "p": "The archaeologist <u>who led the excavation at the site, which had been identified through satellite imagery in 2019</u>, published her preliminary findings in a brief communication last spring.", "q": "Which choice correctly handles the relative clauses?", "o": ["A) who led the excavation at the site that had been identified through satellite imagery in 2019", "B) who led the excavation at the site, which had been identified through satellite imagery in 2019,", "C) who led the excavation at the site which had been identified through satellite imagery in 2019,", "D) No change — the underlined portion is correct"], "a": 1, "e": "B is correct. 'Who led the excavation at the site' is a restrictive relative clause (it specifies which archaeologist) — no commas. 'Which had been identified through satellite imagery in 2019' is a non-restrictive relative clause (it adds information about the site) — enclosed in commas.\n\nA — 'that' is used for restrictive clauses; 'which had been identified' adds information (non-restrictive), so 'which' with commas is correct.\nC — no opening comma before 'which' leaves the non-restrictive clause incorrectly unmarked.\nD — the original uses a comma before 'who,' incorrectly making the restrictive clause appear non-restrictive.\nB is correct."}, {"k": "Commas", "p": "The treaty, <u>signed on March 14, 1884, in Berlin, and ratified by eleven of the fourteen signatory nations within the following year</u>, established the framework for European colonial administration of sub-Saharan Africa.", "q": "Which choice is correct?", "o": ["A) signed on March 14 1884 in Berlin and ratified by eleven of the fourteen signatory nations within the following year", "B) signed on March 14, 1884, in Berlin and ratified by eleven of the fourteen signatory nations within the following year", "C) signed on March 14, 1884, in Berlin, and ratified by eleven of the fourteen signatory nations within the following year", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. The participial phrase 'signed on March 14, 1884, in Berlin, and ratified by eleven...' is correctly punctuated. Commas after '1884' and 'Berlin' are correct for dates and locations. The comma before 'and ratified' correctly separates the two participial elements.\n\nA — missing commas around '1884' (required in full dates) and no comma between the two participials.\nB — missing the comma after 'Berlin' that separates location from the next element.\nC — same as D; this appears to match D exactly.\nD is correct."}, {"k": "Commas", "p": "The proposal to establish a permanent international tribunal for environmental crimes was supported by the majority of delegates, <u>most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires</u>, as a necessary step toward holding corporations accountable.", "q": "Which choice is correct?", "o": ["A) most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires,", "B) most of whom represented nations, that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires,", "C) most of whom represented nations that had recently experienced severe flooding prolonged drought or unprecedented wildfires", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Most of whom represented nations that had recently experienced severe flooding, prolonged drought, or unprecedented wildfires' is a non-restrictive relative clause enclosed in commas. 'That had recently experienced...' is restrictive (defining which nations) and correctly takes no commas. The list within is correctly punctuated with an Oxford comma.\n\nA — adds an additional closing comma creating a double comma with the one already before 'as.'\nB — adding commas around 'that had recently experienced...' incorrectly makes the restrictive clause non-restrictive.\nC — missing commas between list items.\nD is correct."}, {"k": "Commas", "p": "The panel of economists, <u>which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences</u>, was asked to evaluate the long-term fiscal implications of the proposed tax restructuring.", "q": "Which choice is correct?", "o": ["A) which included former central bank governors from five countries, and two recipients of the Nobel Memorial Prize in Economic Sciences", "B) that included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences", "C) which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences,", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Which included former central bank governors from five countries and two recipients of the Nobel Memorial Prize in Economic Sciences' is a non-restrictive relative clause correctly enclosed in commas. 'Former central bank governors from five countries and two recipients' are two items in the clause joined by 'and' — no Oxford comma needed for a two-item list.\n\nA — a comma before 'and two recipients' incorrectly treats the two items as a three-item list.\nB — 'that' is used for restrictive clauses; this is non-restrictive.\nC — adds a closing comma creating a double comma.\nD is correct."}, {"k": "Commas", "p": "The cognitive scientist argued that working memory, <u>unlike long-term memory which can theoretically store information indefinitely</u>, is severely constrained in both capacity and duration.", "q": "Which choice correctly handles the embedded relative clause?", "o": ["A) unlike long-term memory, which can theoretically store information indefinitely,", "B) unlike long-term memory which can theoretically store information indefinitely,", "C) unlike long-term memory, which can theoretically store information indefinitely", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Unlike long-term memory' is a prepositional phrase. 'Which can theoretically store information indefinitely' is a non-restrictive relative clause modifying 'long-term memory.' The entire parenthetical ('unlike long-term memory, which can theoretically store information indefinitely') must be enclosed in commas — a comma before 'unlike' (already present in the sentence) and a comma after 'indefinitely' (the closing comma).\n\nB — no comma before 'which' leaves the non-restrictive relative clause incorrectly unmarked.\nC — no closing comma after 'indefinitely' fails to close the parenthetical.\nD — no comma before 'which' is incorrect.\nA is correct."}, {"k": "Commas", "p": "Three of the researchers, <u>including the lead author who had designed the original protocol</u>, objected to the decision to modify the study parameters mid-trial.", "q": "Which choice is correct?", "o": ["A) including the lead author, who had designed the original protocol,", "B) including the lead author who had designed the original protocol,", "C) including the lead author who had designed the original protocol", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'The lead author who had designed the original protocol' — the relative clause 'who had designed the original protocol' is non-restrictive (there is only one lead author). It must be enclosed in commas. Additionally, the entire parenthetical 'including the lead author, who had designed the original protocol' must have a closing comma before 'objected.'\n\nB — no comma before 'who' leaves the non-restrictive clause incorrectly unmarked.\nC — missing the closing comma before 'objected' and the comma before 'who.'\nD — missing the comma before 'who.'\nA is correct."}, {"k": "Commas", "p": "The documentary, narrated by an award-winning journalist and based on over two hundred hours of interview footage, <u>examines the systemic failures that, according to several former officials who spoke on the record, allowed the financial fraud
