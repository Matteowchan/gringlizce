<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#3B4E8A; --accent-deep:#26356B; --accent-soft:#DBE1F2; --panel:#E8ECF7;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
:root[data-theme="dark"]{--bg:#15151c;--ink:#ECEDF2;--muted:#9498a6;--line:#2b2b36;--paper:#1e1e27;--card:#1e1e27;--panel:#262633;--accent-soft:rgba(255,255,255,.07);--accent-deep:var(--accent);--good-soft:rgba(31,169,113,.16);--wrong-soft:rgba(216,80,63,.16);}
:root[data-theme="dark"] .note,:root[data-theme="dark"] .given,:root[data-theme="dark"] .task,:root[data-theme="dark"] .plan .pf,:root[data-theme="dark"] .rec,:root[data-theme="dark"] .grifb,:root[data-theme="dark"] .rlink:hover{background:#22232e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--card);opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--card)}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:18px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:15.5px;line-height:1.6;margin-bottom:12px;font-weight:500}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:15px;padding:12px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:240px;transition:border-color .15s,box-shadow .15s}
.qz input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:18px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:15.5px;line-height:1.6;margin-bottom:13px;font-weight:500}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:9px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14.5px;display:flex;gap:13px;align-items:center;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--card);box-shadow:0 1px 2px rgba(20,30,50,.03);transition:border-color .15s,background .15s,box-shadow .15s,transform .1s}
.mcq .opts label:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,30,50,.08);transform:translateY(-1px)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:29px;height:29px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;transition:.15s}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff;transform:scale(1.05)}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}

/* Gri writing AI */
.griwz{margin:16px 0 4px}

.griq{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-left:10px}
.grifb{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#F7F8FA;font-family:Inter,sans-serif;font-size:14px;line-height:1.55}
.grifb.on{display:block}
.grifb.err{background:var(--wrong-soft);border-color:#F1D4CD;color:#8a382f}

.grifb .gsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.grifb .gmis{font-size:13.5px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.grifb .gmis .o{color:var(--wrong);text-decoration:line-through}
.grifb .gmis .c{color:#166a4a;font-weight:700}

<script id="data" type="application/json">{"title": "IB English B", "badge": "IB", "groups": ["Öğren", "Kişisel", "Profesyonel", "Kitle İletişim", "Writing", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "Paper 1 ve Kriterler", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "IB English B Paper 1'de üç görevden birini seçip belirli bir metin türünde (text type) yazarsın. Metin türünü doğru seçmek ve o türün kurallarına uymak, dilbilgisi kadar önemlidir."}, {"t": "table", "head": ["Kriter", "Ne ölçer", "Neye dikkat"], "rows": [["A. Language", "Dil: kelime çeşitliliği, dilbilgisi doğruluğu, akıcılık", "Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Kelime tekrarından kaçın."], ["B. Message", "Mesaj: göreve uygunluk, fikir gelişimi, ilgililik", "Prompt'un istediğini tam karşıla. Fikirleri örnekle geliştir, yüzeysel bırakma."], ["C. Conceptual understanding", "Kavramsal: metin türü, amaç, kitle, register, ton", "Seçtiğin türün kurallarına uy. Kitlene ve amaca uygun ton ve biçim kullan."]]}, {"t": "note", "k": "dikkat", "title": "En sık kaybedilen puan", "lines": ["Criterion C. Öğrenci makale yazacakken deneme yazar, blog yazacakken resmi rapor tonu kullanır. Tür yanlışsa mesaj iyi olsa bile C düşer.", "Her türün açılışı, düzeni ve register'ı farklıdır. Önce türü tanı, sonra yaz."]}]}, {"id": "karsilastirma", "group": "Öğren", "name": "Karşılaştırma Tablosu", "eyebrow": "Metin Türleri", "blocks": [{"t": "p", "x": "En sık çıkan metin türlerinin hızlı karşılaştırması. Ayrıntılar alt derslerde."}, {"t": "table", "head": ["Tür", "Amaç", "Kitle", "Register"], "rows": [["Makale (Article)", "Bilgilendir ve ilgi çek", "Genel dergi/gazete okuru", "Yarı resmi"], ["Blog / Günlük", "Kişisel düşünce ve deneyim paylaş", "Online okur veya kişinin kendisi", "Kişisel, samimi"], ["Konuşma (Speech)", "İkna et veya bilgilendir", "Canlı dinleyici kitlesi", "Hitabet, doğrudan seslenme"], ["Broşür (Brochure)", "Tanıt ve harekete geçir", "Potansiyel müşteri/halk", "İkna edici, kısa"], ["Görüş yazısı (Opinion column)", "Bir görüşü savun", "Gazete okuru", "İkna edici, kişisel görüş"], ["Resmi mektup/e-posta", "Talep, şikayet, başvuru", "Belirli bir muhatap", "Resmi"], ["İnceleme (Review)", "Değerlendir ve öner", "Karar vermeye çalışan okur", "Yarı resmi, öznel"], ["Yönerge (Instructions)", "Nasıl yapılacağını öğret", "Kullanıcı", "Nötr, net, emir kipi"]]}, {"t": "note", "k": "ipucu", "title": "Seçim kuralı", "lines": ["Prompt kitleyi ve amacı söyler. School magazine diyorsa makale, your friend diyorsa e-posta/blog, at an assembly diyorsa konuşma. Kitle + amaç türü belirler."]}]}, {"id": "t-article", "group": "Kitle İletişim", "name": "Makale (Article)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konu hakkında bilgilendirmek ve okuru ilgilendirmek."], ["Kitle", "Bir dergi, gazete veya okul yayınının genel okuru."], ["Register / Ton", "Yarı resmi. Ne akademik ne günlük konuşma."], ["Yapı", "Çekici başlık, ilgi çeken giriş, alt başlıklarla bölümlenmiş gövde, toparlayan kapanış."], ["Tipik özellikler", "Çekici başlık, doğrudan okura soru, örnekler, alt başlıklar, bazen yazarın adı (byline)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin açını belirle.", "2. Merak uyandıran, çekici bir başlık bul.", "3. Girişte okuru içine çek: bir soru, küçük bir sahne veya çarpıcı bir gerçek.", "4. Gövdeyi 2-3 bölüme ayır ve her birine bir ALT BAŞLIK ver.", "5. Fikirleri örnek ve ayrıntıyla geliştir; yer yer 'you' ile okura seslen.", "6. Toparlayan, düşündüren bir kapanış yaz.", "7. Son kontrol: başlık + ilgi çeken giriş + alt başlıklar + yarı resmi ton var mı?"]}, {"t": "given", "title": "Birinci örnek (teknoloji)", "x": "Are We Losing the Art of Conversation?\n\nWalk into any cafe today and you will see the same scene: a table of friends, each staring at a screen. But is technology really to blame?"}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "The Four-Day School Week: A Dream or a Disaster?\n\nImagine a school week with no Fridays. It sounds like every student's fantasy — but a handful of schools abroad have actually tried it, and the results are more surprising than you might think."}, {"t": "wizard", "wt": "article", "ptitle": "Görev", "prompt": "Okulunun dergisi için bir makale yaz: gençleri ilgilendiren bir konu (uyku, sosyal medya, sınav stresi, hobiler) hakkında. Çekici bir başlık, ilgi çeken giriş, alt başlıklı bölümler ve toparlayan bir kapanış kullan.", "target": 250, "check": ["Çekici bir başlık ve ilgi çeken bir giriş yazdım.", "Gövdeyi alt başlıklarla böldüm ve yarı resmi bir ton tutturdum (Criterion C).", "Fikirleri somut örneklerle geliştirdim ve okura seslendim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Toparlayan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (makale)", "x": "Are We Losing the Art of Conversation?\n\nWalk into any cafe today and you will see the same scene: a table of friends, each staring at a screen. But is technology really to blame, or have we simply forgotten how to talk?\n\nThe Comfort of the Screen\nPhones give us an easy escape from awkward silences. The moment a conversation slows, we reach for the glowing rectangle in our pocket. It feels harmless, yet every time we do it, we quietly tell the person opposite us that they are less interesting than a notification.\n\nWhat We Lose\nReal conversation is a skill, and like any skill it fades without practice. Listening, disagreeing kindly, sitting comfortably with a pause — these are muscles we are letting weaken.\n\nSo here is a small challenge: next time you meet a friend, leave your phone in your bag. You may find that the best conversation you have all week is the one nobody could scroll past."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Başlıksız veya alt başlıksız yazmak. Makalenin görünür bir yapısı olmalı (Criterion C).", "Çok akademik veya çok günlük dil. Makale yarı resmidir.", "Fikri örneklemeden yüzeysel bırakmak. Her iddiayı bir örnek/detayla destekle."]}]}, {"id": "t-blog", "group": "Kişisel", "name": "Blog", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kişisel bir deneyimi, düşünceyi veya görüşü bir okur kitlesiyle paylaşmak ve onları etkilemek."], ["Kitle", "Blogu takip eden çevrimiçi okurlar."], ["Register / Ton", "Kişisel ve samimi ama düzgün. Birinci tekil şahıs, doğrudan 'you'."], ["Yapı", "Çekici başlık, okuru içine çeken giriş, kişisel anlatı/görüş, okura seslenme, düşündüren veya harekete geçiren kapanış."], ["Tipik özellikler", "Başlık, birinci şahıs, retorik sorular, duygu ifadeleri, gündelik ama düzgün dil, okura hitap, bazen yorum daveti."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin kişisel açını belirle: bu deneyim/görüş neden önemli?", "2. Merak uyandıran, kısa bir başlık bul.", "3. Girişte okuru içine çek: bir soru, çarpıcı bir cümle veya küçük bir sahne.", "4. Deneyimini veya görüşünü somut örneklerle anlat; 'you' ile okurla bağ kur.", "5. Sadece olayı değil, ne hissettiğini ve ne düşündüğünü de göster.", "6. Düşündüren ya da harekete geçiren bir kapanış yaz.", "7. Son kontrol: başlık, birinci şahıs, okura hitap ve kişisel bir ses var mı?"]}, {"t": "given", "title": "Birinci örnek (kişisel deneyim)", "x": "The Day I Deleted All My Apps\n\nLast month, on an ordinary Tuesday, I did something that terrified me: I deleted every social media app from my phone. Be honest — could you do it? For the first two days, I reached for my phone constantly, only to find nothing there."}, {"t": "given", "title": "İkinci örnek (görüş/tavsiye, farklı bağlam)", "x": "Why Failing My First Exam Was the Best Thing That Happened\n\nNobody tells you this, but failing can be a gift. When I saw that red mark last year, I wanted to disappear. Today, I am almost grateful for it. Here is what that failure taught me, and why I think every student needs one."}, {"t": "wizard", "wt": "blog", "ptitle": "Görev", "prompt": "Okulunun blogu için bir yazı yaz: seni değiştiren bir alışkanlık, deneyim veya karar hakkında. Kişisel anlat, okura seslen ve onları düşünmeye veya harekete geçmeye davet et.", "target": 250, "check": ["Çekici bir başlıkla açtım ve birinci tekil şahıs kişisel bir ses kullandım.", "Okura doğrudan seslendim ('you') ve en az bir retorik soru sordum (Criterion C).", "Deneyimimi somut örnekle anlattım ve duygumu gösterdim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Düşündüren/harekete geçiren bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (blog)", "x": "The Day I Deleted All My Apps\n\nLast month, on an ordinary Tuesday, I did something that genuinely scared me: I deleted every social media app from my phone. Be honest — could you last a week without yours?\n\nFor the first two days, it was miserable. My hand kept reaching for a screen that had nothing on it. I felt bored, restless, and weirdly lonely, as if I had switched off a part of my own brain.\n\nThen something shifted. I started noticing things again: the taste of my breakfast, the people on the bus, whole conversations I would once have missed. I read two books in a week. I called my grandmother for no reason. I slept.\n\nI am not telling you to delete everything forever. But I am asking you to try one screen-free weekend. You might discover, as I did, that the life you keep scrolling past is quietly waiting for you to look up."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Blogu kişisel bir günlüğe çevirmek. Blogun bir OKURU vardır; ona seslen ('you'), sadece kendine yazma.", "Sadece olay anlatıp duyguyu/anlamı atlamak. Okur 'ne hissettin, ne öğrendin' bilmek ister.", "Başlıksız veya düz akademik dille yazmak. Başlık ve samimi ses Criterion C'yi belirler."]}]}, {"id": "t-speech", "group": "Kitle İletişim", "name": "Konuşma (Speech)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Canlı bir kitleyi ikna etmek veya bilgilendirmek."], ["Kitle", "Bir toplantı, tören veya etkinlikteki dinleyiciler."], ["Register / Ton", "Hitabet dili. Doğrudan seslenme, güçlü ve ritmik."], ["Yapı", "Selamlama, dikkat çeken açılış, işaret cümleleriyle bölümler, güçlü kapanış çağrısı."], ["Tipik özellikler", "Ladies and gentlemen, retorik sorular, tekrar (anaphora), üçlemeler, doğrudan you."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kitleyi ve amacı belirle (ikna mı, bilgilendirme mi?).", "2. Bir selamlama ve dikkat çeken bir açılış yaz (soru veya çarpıcı iddia).", "3. Ana mesajını tek cümlede belirle.", "4. 2-3 noktayla geliştir; her birinde retorik soru, tekrar veya üçleme kullan.", "5. Doğrudan 'you' ile dinleyiciye seslen; kısa, ritmik cümleler kur.", "6. Güçlü, akılda kalan bir kapanış veya çağrıyla bitir.", "7. Son kontrol: selamlama + retorik araçlar + doğrudan hitap + güçlü kapanış var mı?"]}, {"t": "given", "title": "Birinci örnek (ilham)", "x": "Good morning, everyone. Let me begin with a simple question: when was the last time you did something for the first time? Today, I want to talk about why that matters."}, {"t": "given", "title": "İkinci örnek (ikna, farklı bağlam)", "x": "Fellow students, look around this room. In ten years, some of us will have changed this town for the better — and it will have started with one small decision made today. I am here to ask you for that decision: join the volunteer programme."}, {"t": "wizard", "wt": "speech", "ptitle": "Görev", "prompt": "Okul toplantısında (assembly) yapacağın bir konuşma yaz: öğrencileri bir konuda (gönüllülük, çevre, yeni bir şey denemek) harekete geçirmeye çağır. Selamlama, retorik sorular, tekrar/üçleme ve güçlü bir kapanış kullan.", "target": 250, "check": ["Bir selamlama ve dikkat çeken bir açılışla başladım.", "Retorik soru, tekrar (anaphora) ve doğrudan 'you' kullandım (Criterion C).", "Mesajımı örneklerle geliştirdim ve dinleyiciyi harekete çağırdım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Güçlü, akılda kalan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (konuşma)", "x": "Good morning, everyone. Let me begin with a simple question: when was the last time you did something for the first time?\n\nFor many of us, the honest answer is 'I can't remember.' We wake, we scroll, we follow the same safe path to the same familiar places. And slowly, without noticing, we stop growing.\n\nI am not asking you to climb a mountain tomorrow. I am asking for something smaller and braver: try one new thing this week. Speak to someone you have never spoken to. Raise your hand when you are unsure. Sign up for the club that scares you.\n\nBecause every skill you admire, every confident person you envy, began exactly where you are now — nervous, unsure, and doing it anyway.\n\nSo when you leave this hall today, do not go looking for the comfortable. Go looking for the first time. Thank you."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Selamlama ve doğrudan hitabı unutmak. Konuşma bir kitleye seslenir.", "Retorik araç kullanmamak. Retorik soru, tekrar ve üçleme konuşmayı konuşma yapar (Criterion C).", "Zayıf bitirmek. Konuşmanın en güçlü cümlesi kapanışta olmalı."]}]}, {"id": "t-brochure", "group": "Kitle İletişim", "name": "Broşür / Leaflet (Brochure)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir yeri, ürünü veya etkinliği tanıtmak ve okuru harekete geçirmek (ziyaret et, katıl, satın al)."], ["Kitle", "Potansiyel ziyaretçi/müşteri veya ilgilenen halk."], ["Register / Ton", "İkna edici, enerjik, sıcak. Kısa cümleler, doğrudan 'you'."], ["Yapı", "Büyük başlık + slogan, alt başlıklı 2-3 bölüm, madde işaretleri, iletişim/çağrı kutusu."], ["Format (A4)", "Katlanır: trifold (3 sütun) veya bifold (2 sütun). Elle yazımda her bölümü bir alt başlıkla temsil et."], ["Tipik özellikler", "Çekici başlık, alt başlıklar, madde imleri, emir kipi (Discover, Join, Book), [Image: ...] yer tutucu, çağrı (call to action)."]]}, {"t": "note", "k": "protokol", "title": "A4'e nasıl yerleştirilir?", "lines": ["Sınav elle yazılır; yerleşimi KELİME ve DÜZENLE göster, çizim yapma.", "En üste büyük, akılda kalan bir BAŞLIK ve altına tek satır slogan koy.", "Görsel yerini parantezle belirt: [Image: a photo of hikers at sunrise].", "Gövdeyi 2-3 kısa bölüme ayır; her birine bir ALT BAŞLIK ver (Why visit? / What to bring / Plan your visit).", "Her bölümde 2-4 kısa madde (•) kullan; cümleler kısa ve çekici olsun.", "En alta bir bilgi/çağrı kutusu koy: açılış saati, fiyat, adres, telefon, web ve net bir çağrı.", "Trifold düşünüyorsan üç bölümü üç sütun gibi kurgula: sol=tanıtım, orta=detay, sağ=iletişim."]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Prompt'u çöz: kim yazıyor, kime, neyi tanıtmak için? Yer/etkinlik/ürün ne?", "2. Akılda kalıcı bir BAŞLIK ve tek satırlık bir slogan bul.", "3. Gövdeyi 2-3 bölüme ayır ve her birine bir ALT BAŞLIK ver (Why? / What? / Plan your visit).", "4. Her bölüme 2-4 somut, çekici madde yaz; abartma, ayrıntı ver.", "5. Bilgi/çağrı kutusunu doldur: saat, fiyat, adres, web ve net bir çağrı (Book now).", "6. Baştan sona emir kipi ve doğrudan 'you' kullan; cümleleri kısa tut.", "7. Son kontrol: başlık + slogan + alt başlıklar + madde işaretleri + kutu + çağrı hepsi var mı?"]}, {"t": "given", "title": "Birinci örnek (doğa yürüyüşü, yerleşim işaretli)", "x": "DISCOVER THE GREEN VALLEY TRAIL\nEscape the city. Breathe the mountain air.\n\n[Image: hikers on a green mountain path at sunrise]\n\nWHY GREEN VALLEY?\n• 12 km of well-marked, family-friendly trails\n• Stunning views over three hidden waterfalls\n• Rare birds, wild flowers and total silence\n\nWHAT TO BRING\n• Comfortable shoes and a light jacket\n• Water and a small snack\n• Your camera — you will definitely need it!\n\nPLAN YOUR VISIT\nOpen daily, 8 a.m. to 6 p.m. · Entry free for students\nJust two hours from the city centre\nBook a guided tour: www.greenvalley.example · 0212 000 00 00\n\nCome and rediscover nature. Your adventure starts this weekend!"}, {"t": "given", "title": "İkinci örnek (okul açık günü — farklı bağlam)", "x": "COME AND SEE YOUR FUTURE SCHOOL\nGreen Valley High Open Day — everyone welcome!\n\n[Image: smiling students showing visitors around a bright science lab]\n\nWHAT YOU CAN DO\n• Tour our labs, library and sports hall\n• Watch live science and music demonstrations\n• Meet our teachers and current students\n\nWHY GREEN VALLEY?\n• Small classes and genuinely friendly staff\n• Clubs for everyone, from robotics to drama\n• A strong record of students reaching top universities\n\nVISIT US\nSaturday 5 October, 10 a.m. to 3 p.m.\nNo booking needed — just turn up\n15 Valley Road (bus lines 12 and 34)\nQuestions? Email us at openday@greenvalley.example\n\nCome and picture yourself here. We can't wait to meet you!"}, {"t": "wizard", "wt": "brochure", "ptitle": "Görev", "prompt": "Şehrindeki bir yeri (bir park, müze, festival veya spor tesisi) tanıtan bir broşür/leaflet yaz. Çekici bir başlık, alt başlıklı bölümler, madde işaretleri ve bir iletişim/çağrı kutusu kullan.", "target": 220, "check": ["Büyük bir başlık ve bir slogan ile açtım.", "2-3 alt başlıklı bölüm ve madde işaretleri kullandım (Criterion C).", "Emir kipi, doğrudan 'you' ve net bir çağrı (call to action) koydum.", "Bir iletişim/bilgi kutusu (saat, fiyat, adres) ekledim.", "İkna edici, kısa ve enerjik bir dil kullandım (Criterion A/B).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (broşür)", "x": "COME ALIVE AT THE RIVERSIDE ARTS FESTIVAL\nThree days of music, colour and unforgettable moments.\n\n[Image: a crowd dancing in front of a bright outdoor stage]\n\nWHAT'S ON?\n• Live bands on two open-air stages\n• Street food from over thirty local kitchens\n• Free workshops in painting, dance and photography\n\nWHY YOU CAN'T MISS IT\nWhere else can you learn to paint at noon, taste the world at six, and dance under the stars at midnight? For one weekend, the Riverside Festival turns our quiet town into the most exciting place in the region.\n\nPLAN YOUR WEEKEND\nFriday to Sunday, 14–16 June · 10 a.m. until late\nTickets: 50 lira for the weekend, free for under-12s\nRiverside Park, next to the old bridge\nBook now: www.riversidefest.example · 0212 111 22 33\n\nBring your friends, bring your appetite, and bring your dancing shoes. We'll see you by the river!"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Broşürü düz bir denemeye çevirmek. Başlık, alt başlık ve madde işaretleri olmadan Criterion C düşer.", "Abartılı, inandırıcılıktan uzak övgü. Somut ayrıntı (saat, fiyat, ne var) güveni artırır.", "Çağrıyı (call to action) ve iletişim bilgisini unutmak. Broşürün amacı harekete geçirmektir."]}]}, {"id": "t-opinion", "group": "Kitle İletişim", "name": "Görüş Yazısı (Opinion Column)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir görüşü gerekçeli biçimde savunmak."], ["Kitle", "Bir gazete veya derginin okurları."], ["Register / Ton", "İkna edici, kişisel görüş, yer yer duygusal."], ["Yapı", "Net bir tez, gerekçelerle gelişen paragraflar, karşı görüşe kısa değinme, güçlü kapanış."], ["Tipik özellikler", "Birinci şahıs görüş, retorik sorular, örnekler, ikna edici dil."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir görüş/tez belirle: neyi savunuyorsun?", "2. Çarpıcı bir açılışla tezini hemen ortaya koy.", "3. Her paragrafta bir gerekçe ver ve örnekle destekle.", "4. Karşı görüşe kısaca değin (Critics will say...), sonra çürüt.", "5. İkna edici dil ve retorik sorular kullan.", "6. Güçlü, akılda kalan bir kapanış yaz.", "7. Son kontrol: net tez + gerekçeler + karşı görüş + ikna edici ton var mı?"]}, {"t": "given", "title": "Birinci örnek (sınav baskısı)", "x": "It is time we admitted an uncomfortable truth: our obsession with exam results is failing the very students it claims to help."}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Everyone keeps telling young people to 'follow their passion.' It sounds inspiring on a poster. In reality, it may be the most useless advice we ever give them — and here is why."}, {"t": "wizard", "wt": "opinion_column", "ptitle": "Görev", "prompt": "Bir gazetenin görüş köşesi için bir yazı yaz: gençleri ilgilendiren tartışmalı bir konuda (sosyal medya, sınavlar, teknoloji, çevre) net bir görüş savun. Tezini açıkça ver, gerekçelendir, karşı görüşe değin ve güçlü bir kapanış yap.", "target": 250, "check": ["Girişte net bir tez/görüş verdim.", "Görüşümü gerekçe ve örneklerle geliştirdim; retorik soru kullandım (Criterion C).", "Karşı görüşe değindim ve onu dengeledim/çürüttüm (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Güçlü bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (görüş yazısı)", "x": "It is time we admitted an uncomfortable truth: our obsession with exam results is failing the very students it claims to help.\n\nOf course grades matter. They open doors, and pretending otherwise would be dishonest. But when a fourteen-year-old cannot sleep for fear of a test, something has gone badly wrong. We have taken a useful measure and turned it into the only thing that counts.\n\nCritics will say that pressure builds character. Perhaps a little does. Yet the students I know are not becoming stronger; they are becoming exhausted, anxious, and convinced that their worth is a number on a page.\n\nImagine, instead, a school that valued curiosity, kindness and effort alongside marks. Would our students really learn less? Or would they finally learn to love learning?\n\nWe cannot change the exam system overnight. But we can change the story we tell our children about it. Let us start by telling them the truth: you are so much more than your results."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Görüş yazısı NET bir taraf tutar; 'her iki görüş de doğru' zayıftır.", "Karşı görüşü hiç anmamak. Ona değinip çürütmek yazını olgunlaştırır.", "Sadece duyguya yaslanmak. Duygu + gerekçe + örnek birlikte ikna eder."]}]}, {"id": "t-letter", "group": "Profesyonel", "name": "Resmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Talep etmek, şikayet etmek, başvurmak veya resmi bilgi vermek."], ["Kitle", "Belirli bir kişi veya kurum (müdür, yetkili, şirket)."], ["Register / Ton", "Resmi ve nazik. Kısaltma (I'm) yok, net ve saygılı."], ["Yapı", "Selamlama (Dear ...), amacı belirten açılış, gerekçeli gövde, istenen sonuç, resmi kapanış."], ["Kapanış kuralı", "İsim biliniyorsa 'Yours sincerely'; bilinmiyorsa (Dear Sir/Madam) 'Yours faithfully'."], ["Tipik özellikler", "Resmi hitap, net amaç cümlesi (I am writing to...), nazik ton, gerekçe, imza formülü."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle: adını biliyor musun? Selamlama ve kapanışı buna göre seç.", "2. 'Dear Mr/Ms [soyad],' veya 'Dear Sir or Madam,' ile başla.", "3. Açılış cümlesinde amacı net söyle: I am writing to...", "4. Gövdede gerekçeni nazik ama net paragraflarla açıkla.", "5. Ne istediğini/beklediğini açıkça belirt (talep, çözüm).", "6. Nazik bir kapanış + doğru formül (Yours sincerely/faithfully) + adın.", "7. Son kontrol: resmi hitap, kısaltma yok, net amaç, doğru kapanış formülü var mı?"]}, {"t": "given", "title": "Birinci örnek (şikayet)", "x": "Dear Mr Thompson,\n\nI am writing to express my concern about the recent changes to the school bus timetable, which have affected many students in my neighbourhood."}, {"t": "given", "title": "İkinci örnek (başvuru, farklı bağlam)", "x": "Dear Sir or Madam,\n\nI am writing to apply for the position of summer volunteer at the city library, which was advertised on your website. As a keen reader and a reliable, organised student, I believe I could contribute a great deal to your team.\n\nI would welcome the chance to discuss my application further. Thank you for considering my request.\n\nYours faithfully,\nAlex Carter"}, {"t": "wizard", "wt": "formal_letter", "ptitle": "Görev", "prompt": "Yerel belediyeye veya okul yönetimine, seni etkileyen bir sorun (bir tesisin kapatılması, bir kural değişikliği) hakkında resmi bir şikayet veya talep mektubu yaz. Amacını net belirt, gerekçelendir ve bir çözüm iste.", "target": 250, "check": ["Doğru resmi selamlama (Dear ...) ve doğru kapanış formülünü (sincerely/faithfully) kullandım.", "Açılışta amacımı net belirttim (I am writing to...) ve kısaltma kullanmadım (Criterion C).", "Gerekçemi nazik ama net paragraflarla açıkladım ve bir çözüm/talep sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (resmi mektup)", "x": "Dear Mr Thompson,\n\nI am writing to express my concern about the recent changes to the school bus timetable, which have made it very difficult for students in the Riverside area to arrive on time.\n\nSince the earlier service was removed, many of us must now take a bus that reaches school ten minutes after the first lesson begins. As a result, students are regularly marked late through no fault of their own, and some have stopped attending the optional morning study sessions altogether.\n\nI would be very grateful if the school could consider restoring the earlier service, or arranging a short grace period for affected students. A small adjustment would solve the problem for a large number of families.\n\nThank you for taking the time to consider this matter. I look forward to your reply.\n\nYours sincerely,\nAlex Carter"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kısaltma (I'm, don't) veya günlük ifade kullanmak. Resmi mektup samimi olmaz.", "Yanlış kapanış formülü: isim biliniyorsa 'sincerely', bilinmiyorsa 'faithfully'.", "Amacı geç söylemek. İlk cümlede 'I am writing to...' ile amacı net ver."]}]}, {"id": "t-informal", "group": "Kişisel", "name": "Gayriresmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir arkadaşa veya aile üyesine haber vermek, davet etmek, teşekkür etmek."], ["Kitle", "Yakın bir arkadaş veya aile üyesi."], ["Register / Ton", "Samimi, sıcak, kişisel. Kasılmalar (I'm, don't) serbest."], ["Yapı", "Hi/Dear + isim, hâl hatır sorma, gövde (asıl haber), sıcak kapanış (Love/Take care) + isim."], ["Tipik özellikler", "Kasılmalar, sorular, ünlemler, günlük ifadeler, doğrudan you, kişisel ayrıntılar."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle (arkadaş/aile) ve tonu ona göre ayarla.", "2. Samimi bir selamla başla (Hi/Hey + isim).", "3. Kısa bir hâl hatır sorma ile aç (It's been ages! How are you?).", "4. Asıl haberi veya amacı sıcak, kişisel bir dille anlat.", "5. Sorular sor; kasılma (I'm, don't) ve ünlem kullan.", "6. Sıcak bir kapanış (Love / Take care / Write back soon) + adın.", "7. Son kontrol: samimi selam ve kapanış, kasılmalar, kişisel ton var mı?"]}, {"t": "given", "title": "Birinci örnek (haber verme)", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share with you, and honestly I've been grinning about it all week."}, {"t": "given", "title": "İkinci örnek (davet, farklı bağlam)", "x": "Hey Can,\n\nGuess what — I'm finally having that birthday barbecue, and it wouldn't be the same without you! It's this Saturday at ours, from around four. Bring nothing but yourself and maybe that playlist you keep bragging about. Oh, and my little brother still wants a rematch at table tennis, so consider yourself warned. Let me know you can make it!\n\nCan't wait,\nEcem"}, {"t": "wizard", "wt": "informal_letter", "ptitle": "Görev", "prompt": "Yurt dışında bir yaz kampına katıldın. Yakın bir arkadaşına, kamptaki deneyimini anlatan ve onu gelecek yıl katılmaya teşvik eden gayriresmi bir e-posta yaz.", "target": 250, "check": ["Samimi bir selamlama (Hi + isim) ve sıcak bir kapanış (Love/Take care + isim) kullandım.", "Kasılmalar, sorular ve günlük ifadelerle samimi bir ton tutturdum (Criterion C).", "Prompt'un istediğini karşıladım: deneyimi anlattım ve arkadaşımı teşvik ettim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (gayriresmi e-posta)", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share: I spent three weeks at a summer camp in Wales, and it honestly changed how I see myself.\n\nThe first days were terrifying. I knew nobody, my English felt clumsy, and I nearly called home twice. But by the end of the first week, I was hiking with people from six different countries and laughing at jokes I couldn't have understood a month earlier. We cooked together, got hopelessly lost on a mountain, and stayed up far too late talking about everything.\n\nWhat surprised me most was how quickly I stopped being shy. When you have to speak English to ask for breakfast, you just do it.\n\nYou would absolutely love it, and they open applications in January. Promise me you'll think about it? I really want us to go together next year.\n\nMiss you loads,\nEcem"}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Register'ı görünür yap: kasılmalar, bir-iki soru ve doğrudan you. Değerlendirici Criterion C'yi buradan okur.", "Resmi mektup kalıplarına (I am writing to inform you) kaçma; bu tür samimidir."]}]}, {"id": "t-diary", "group": "Kişisel", "name": "Günlük (Diary)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Günün olaylarını ve kişisel duyguları özel olarak kaydetmek, yansıtmak."], ["Kitle", "Yalnızca yazan kişi (özel, mahrem)."], ["Register / Ton", "Çok kişisel, samimi ve düşünsel. Birinci tekil şahıs."], ["Yapı", "Tarih, günün olayı (geçmiş zaman anlatı), o an hissedilenler, geleceğe dair umut veya kaygı."], ["Tipik özellikler", "Tarih, birinci şahıs, geçmiş anlatı + şimdiki duygular, iç ses, samimi ve dağınık düşünceler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Tarihi yaz (Tuesday, 14 May gibi).", "2. Günün seni en çok etkileyen olayını seç.", "3. Ne olduğunu geçmiş zamanla kısaca anlat.", "4. O AN ne hissettiğini yansıt (şaşkınlık, korku, sevinç).", "5. İçindeki çelişkiyi veya çatışmayı göster (hem sevindim hem korktum).", "6. Geleceğe dair bir umut veya kaygıyla bitir.", "7. Son kontrol: tarih + birinci şahıs + olay + duygu + yansıtma var mı?"]}, {"t": "given", "title": "Birinci örnek (mutlu sürpriz)", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't quite know how I feel about it."}, {"t": "given", "title": "İkinci örnek (zor bir gün, farklı bağlam)", "x": "Thursday, 2 November\n\nI don't even want to write tonight, but I promised myself I would. Today I said goodbye to this house for the last time. The empty rooms looked so strange, like a photograph of a place I only dreamed. I keep telling myself a new city means a new start, and part of me almost believes it. But right now, sitting on a box in a bare room, all I can feel is the shape of everything I am leaving behind."}, {"t": "wizard", "wt": "diary", "ptitle": "Görev", "prompt": "Hayatında önemli bir kararın verildiği veya beklenmedik bir şeyin olduğu bir günü düşün. O günkü olayları ve o an hissettiklerini yansıtan bir günlük girişi yaz.", "target": 250, "check": ["Tarihle başladım ve birinci tekil şahıs kişisel bir ses kullandım.", "Sadece olayları değil, o an hissettiklerimi ve iç düşüncelerimi yansıttım (Criterion C).", "Prompt'un istediği günü ve kararı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (günlük)", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't know whether to laugh or cry.\n\nIt started like any other Tuesday. I was half asleep in maths when the office called me down. My first thought was that I was in trouble. Instead, they told me my short story had won the national competition, the one I entered months ago and had completely forgotten about.\n\nI think I just stood there. Someone shook my hand. Later, on the bus home, it finally hit me and I had to hide my face so nobody would see me grinning like a fool.\n\nWhat scares me is what comes next. There's a ceremony, a reading, an actual audience. The old me would have said no immediately. But tonight, for the first time, a small voice inside me is saying: maybe you can do this.\n\nI hope I still feel that brave in the morning."}}, {"t": "note", "k": "ipucu", "title": "Blogdan farkı", "lines": ["Günlük özeldir, kendine yazarsın; blog bir okur kitlesine yazılır. Günlükte 'you' ile okura seslenmezsin.", "İç dünyayı, çelişkili duyguları göster. Sadece olay anlatımı değil, yansıtma (reflection) beklenir."]}]}, {"id": "t-interview", "group": "Kitle İletişim", "name": "Röportaj (Interview)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kişiden bilgi veya görüş almak ve okura aktarmak."], ["Kitle", "Bir dergi, gazete veya sitenin okuru."], ["Register / Ton", "Yarı resmi. Sorular net; cevaplar doğal, konuşma dilinde."], ["Yapı", "Kişiyi tanıtan kısa giriş paragrafı, ardından soru-cevap dizisi, kısa kapanış."], ["Tipik özellikler", "Röportajcı ve konuşan belirtilir, doğrudan konuşma, konu odaklı sorular, kişisel cevaplar."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Röportaj yapılan kişiyi ve konuyu kısa bir girişle tanıt.", "2. Sorular konuya odaklansın; açık uçlu olsun (What/Why/How).", "3. Soru-cevap biçimini kur: 'Interviewer:' / 'İsim:'.", "4. Cevapları doğal, konuşma dilinde yaz (birinci şahıs).", "5. Bir soru bir öncekinden doğsun (akış olsun).", "6. Kısa bir kapanış cümlesiyle bitir.", "7. Son kontrol: tanıtım + net sorular + doğal cevaplar + soru-cevap biçimi var mı?"]}, {"t": "given", "title": "Birinci örnek (biyolog)", "x": "We sat down with Dr. Elif Kaya, a marine biologist, to talk about the plastic quietly filling our oceans.\n\nInterviewer: What first drew you to the sea?\nDr. Kaya: Honestly, a childhood holiday. I found a turtle tangled in a net, and I never forgot it."}, {"t": "given", "title": "İkinci örnek (kısa, farklı kişi)", "x": "This week we spoke to Selin Arslan, captain of the school basketball team, about leadership.\n\nInterviewer: What makes a good captain?\nSelin: Not being the best player, honestly. It's about noticing the person who's struggling and lifting them up before anyone else does.\n\nInterviewer: What's the hardest part?\nSelin: Losing. Anyone can lead a winning team. Keeping people together after a bad defeat — that's the real test."}, {"t": "wizard", "wt": "interview", "ptitle": "Görev", "prompt": "Okulunun dergisi için ilham veren biriyle (bir öğretmen, sporcu, gönüllü veya mezun) röportaj yap. Kısa bir tanıtım paragrafı, ardından soru-cevap biçiminde yaz.", "target": 250, "check": ["Kişiyi tanıtan kısa bir giriş yazdım, sonra soru-cevap biçimini kullandım.", "Sorular net; cevaplar doğal ve konuşma dilinde (Criterion C).", "Konuya odaklı, prompt'un istediği kişiyi ve amacı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (röportaj)", "x": "Every school has a quiet hero. Ours is Mr. Demir, the caretaker who has run our recycling scheme for twelve years. We asked him why he bothers.\n\nInterviewer: Most people walk past the bins without a thought. Why do you care so much?\nMr. Demir: Because someone has to. When I started, we threw everything away. It broke my heart. Now the students actually sort their rubbish. That is a small revolution.\n\nInterviewer: Has it been hard to change habits?\nMr. Demir: Very. For two years, nobody listened. I just kept going, one bin at a time. Change is slow, but it is real.\n\nInterviewer: What would you say to a student reading this?\nMr. Demir: Do not wait to be important before you do something useful. Start today, where you are, with what you have.\n\nAs he picked up his gloves and walked off, we understood exactly what he meant."}}, {"t": "note", "k": "ipucu", "title": "Biçim", "lines": ["Konuşan kişilerin isimlerini her replikte belirt (Interviewer: / Mr. Demir:). Bu Criterion C'yi güçlendirir.", "Cevapları konuşma dilinde tut; röportaj bir denemenin resmi diline kaçmamalı."]}]}, {"id": "t-news", "group": "Kitle İletişim", "name": "Haber (News Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel, doğru ve tarafsız biçimde haber vermek."], ["Kitle", "Bir gazete veya haber sitesinin okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Başlık (headline), ilk cümlede 5N1K, önemliden az önemliye (ters piramit), alıntılar."], ["Tipik özellikler", "Başlık, byline, geçmiş zaman, alıntılar (said/added), nesnel dil, isim-tarih-yer."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kısa, bilgilendirici bir başlık (headline) yaz.", "2. İlk cümlede 5N1K'yı ver: kim, ne, ne zaman, nerede.", "3. Ters piramit: en önemli bilgi başta, ayrıntılar sonra.", "4. Nesnel, üçüncü şahıs ve geçmiş zaman kullan.", "5. En az bir doğrudan alıntı ekle (said/added).", "6. Kendi görüşünü katma; görüşler yalnızca alıntılarda.", "7. Son kontrol: başlık + 5N1K + nesnellik + alıntı var mı?"]}, {"t": "given", "title": "Birinci örnek (bağış)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised over 5,000 lira for an animal shelter last Saturday, organisers confirmed on Monday."}, {"t": "given", "title": "İkinci örnek (kısa, farklı olay)", "x": "School Play Wins Regional Drama Award\n\nGreen Valley High School's production of 'The Long Night' won first prize at the regional drama festival on Friday, beating twelve other schools. The cast of thirty students had rehearsed for four months.\n\n'I am incredibly proud of them,' said drama teacher Ms. Aydin. 'They earned every second of this.' The school will now represent the region at the national final in June."}, {"t": "wizard", "wt": "news_report", "ptitle": "Görev", "prompt": "Okulunda gerçekleşen bir etkinliği (bir yarışma, gösteri, bağış kampanyası veya beklenmedik bir olay) haber yap. Bir başlık ve ters piramit yapısında nesnel bir haber yaz; en az bir alıntı ekle.", "target": 250, "check": ["Bir başlık yazdım ve ilk cümlede kim/ne/ne zaman/nerede bilgisini verdim.", "Nesnel, tarafsız, üçüncü şahıs bir dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı prompt'a uygun işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (haber)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised more than 5,000 lira for a local animal shelter last Saturday, organisers confirmed on Monday. The total is the highest the school has ever collected in a single day.\n\nThe money was raised through a charity fair held in the main hall, where students sold baked goods, ran games and organised a small concert. More than three hundred visitors attended during the afternoon.\n\n'We expected maybe half this amount,' said Ayse Yildiz, the student who led the campaign. 'People were incredibly generous.'\n\nThe shelter, which currently cares for over forty animals, said the donation would be used to buy food and medical supplies for the winter. Its director thanked the students and described the support as a real lifeline.\n\nOrganisers said they hoped to make the fair an annual event."}}, {"t": "note", "k": "ipucu", "title": "Nesnellik", "lines": ["Kendi görüşünü katma; haber tarafsızdır. Görüşler yalnızca alıntılarda yer alır.", "En önemli bilgiyi başa koy (ters piramit). Okur ilk cümlede olayı anlamalı."]}]}, {"id": "t-review", "group": "Kitle İletişim", "name": "İnceleme (Review)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran veya etkinliği değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan (izleyecek/okuyacak mı diye) okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (sürprizsiz), güçlü ve zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, birinci şahıs görüş, dengeli değerlendirme."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Neyi incelediğini (film, kitap, restoran) baştan belli et.", "2. Kısa, sürprizleri açık etmeyen bir özet ver.", "3. Güçlü yönleri gerekçele (ne iyiydi, neden?).", "4. Zayıf yönleri de dürüstçe belirt (denge kurar).", "5. Değerlendirici ama gerekçeli sıfatlar kullan.", "6. Net bir öneriyle veya puanla bitir (kime uygun?).", "7. Son kontrol: özet + güçlü/zayıf + denge + net öneri var mı?"]}, {"t": "given", "title": "Birinci örnek (film)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Almost."}, {"t": "given", "title": "İkinci örnek (restoran, farklı ürün)", "x": "Warm Food, Cold Service: The New Corner Cafe\n\nThe Corner Cafe has been the talk of our street for weeks, and the food mostly lives up to the hype. The soups are rich and generous, and the bread is baked fresh every morning.\n\nThe service, sadly, is another story. We waited twenty minutes just to order. If the owners can fix the slow service, this could become a favourite. For now, go for the food, but bring your patience. Three stars out of five."}, {"t": "wizard", "wt": "review", "ptitle": "Görev", "prompt": "Yakın zamanda izlediğin bir film veya okuduğun bir kitabı incele. Kısa bir özet (sürprizleri açık etmeden), güçlü ve zayıf yönler ve net bir öneri içeren bir inceleme yaz.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Değerlendirici, çeşitli kelimeler kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (inceleme)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Set in a crumbling seaside town, it follows a young lighthouse keeper who discovers a mysterious light at sea. The premise is simple, but the film wraps it in some of the most beautiful images I have seen this year.\n\nVisually, it is stunning. Every frame looks like a painting, and the sound design makes you feel the cold wind and crashing waves.\n\nThe problem is the story. Halfway through, the plot slows to a crawl, and the characters stop making believable choices. By the end, I admired the film without ever really caring about anyone in it.\n\nSo is it worth watching? If you love atmosphere and can forgive a thin plot, yes. If you need a story that grips you, you may leave a little cold. I would give it three stars out of five: gorgeous, but hollow."}}, {"t": "note", "k": "ipucu", "title": "Denge", "lines": ["Sadece övme veya sadece yerme; güçlü ve zayıf yönleri birlikte ver. Dengeli görüş üst puan getirir.", "Kararsız kalma; sonunda net bir öneri (izle/izleme, kime uygun) ver."]}]}, {"id": "t-report", "group": "Profesyonel", "name": "Resmi Rapor (Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (müdür, yönetim, kurul)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Başlık, To/From/Date, giriş (amaç), başlıklı bulgular, öneriler, kısa kapanış."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (It is recommended that)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlık ve To / From / Date bilgisini yaz.", "2. Girişte raporun amacını tek cümleyle belirt.", "3. Bulgular bölümünde sorunu nesnel ve veriye dayalı anlat (başlık kullan).", "4. Her bulguyu kısa ve tarafsız ver; kişisel görüş katma.", "5. Öneriler bölümünde çözümleri 'It is recommended that...' kalıbıyla sırala.", "6. Kısa bir sonuç/kapanışla bitir.", "7. Son kontrol: başlık + bölüm başlıkları + nesnel dil + öneriler var mı?"]}, {"t": "given", "title": "Birinci örnek (kantin)", "x": "Report on the School Cafeteria\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine student concerns about the cafeteria and to suggest practical improvements."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Report on After-School Club Provision\nTo: The Vice Principal\nFrom: The Student Council\nDate: 3 April\n\nFindings\nA survey of 200 students showed that clubs are popular but limited. The most requested activities — coding, debating and film — are currently not offered. Many students also reported that clubs clash with the late bus.\n\nRecommendations\nIt is recommended that three new clubs be introduced next term. It is further recommended that club times be aligned with the bus timetable so that no student is excluded."}, {"t": "wizard", "wt": "report", "ptitle": "Görev", "prompt": "Okul yönetimi için bir sorunu (kütüphane saatleri, kantin, ulaşım veya kulüpler) araştıran ve çözüm öneren resmi bir rapor yaz. Başlık, To/From/Date, bulgular ve öneriler bölümlerini kullan.", "target": 280, "check": ["Başlık ve To/From/Date bilgisiyle resmi rapor biçimini kullandım.", "Başlıklı bölümler (giriş, bulgular, öneriler) ve nesnel bir dil kullandım (Criterion C).", "Bulguları verdim ve prompt'un istediği çözüm önerilerini sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (rapor)", "x": "Report on the School Library\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine students' concerns about the school library and to recommend improvements to its opening hours and study space.\n\nFindings\nA survey of 150 students revealed two main problems. First, the library closes at 3 p.m., which prevents students who stay for clubs from using it. Second, during exam periods, there are not enough quiet seats, and many students are turned away.\n\nSeveral students also noted that the study area is often disturbed by group work taking place in the same room.\n\nRecommendations\nIt is recommended that the library remain open until 5 p.m. on weekdays. It is also recommended that a separate silent zone be created for individual study, especially before examinations.\n\nConclusion\nThese changes would be low in cost but would greatly improve students' ability to study effectively at school."}}, {"t": "note", "k": "ipucu", "title": "Resmilik", "lines": ["Kişisel ton yok; nesnel ve veri odaklı yaz. It is recommended that... kalıbı Criterion C'yi güçlendirir.", "Bölüm başlıkları kullan (Introduction, Findings, Recommendations). Yapı görünür olmalı."]}]}, {"id": "t-proposal", "group": "Profesyonel", "name": "Öneri / Teklif (Proposal, HL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri veya planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (yönetim, kurul, sponsor)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi."], ["Yapı", "Başlık, giriş (önerinin özeti), gerekçe ve faydalar, uygulama planı, maliyet, kapanış çağrısı."], ["Tipik özellikler", "Bölüm başlıkları, gelecek zaman, fayda vurgusu, gerçekçi plan, ölçülü ikna dili. (Sadece HL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlıkta öneriyi adlandır (Proposal: ...).", "2. Girişte fikri tek paragrafta özetle: ne öneriyorsun ve neden?", "3. Faydalar bölümünde kime, nasıl fayda sağlayacağını göster.", "4. Uygulama planında gerçekçi adımlar ver (kim, ne zaman, nasıl).", "5. Maliyet/kaynak konusunu dürüstçe ele al (düşük maliyet güven verir).", "6. Kapanışta ölçülü ama net bir onay çağrısı yap.", "7. Son kontrol: başlık + öneri + fayda + plan + gerçekçilik var mı?"]}, {"t": "given", "title": "Birinci örnek (akran mentorluğu)", "x": "Proposal: A Peer Tutoring Programme\n\nThis proposal outlines a student-led tutoring scheme designed to support learners who are struggling in core subjects, at no cost to the school."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Proposal: A School Recycling Scheme\n\nIntroduction\nThis proposal recommends placing clearly labelled recycling bins in every classroom and corridor.\n\nBenefits\nThe scheme would cut waste, save the school money on collection, and teach students habits that last a lifetime.\n\nImplementation\nEco-club volunteers would empty and monitor the bins weekly, and a short assembly would launch the scheme.\n\nCosts\nThe only cost is the bins themselves, which a local supplier has offered to sponsor. I respectfully ask the school to approve a one-month trial."}, {"t": "wizard", "wt": "proposal", "ptitle": "Görev", "prompt": "Okulunda yeni bir kulüp, etkinlik veya sistem için yönetimden onay isteyen bir öneri (proposal) yaz. Fikri, faydalarını ve gerçekçi bir uygulama planını açıkla. (HL)", "target": 300, "check": ["Başlık ve girişte öneriyi net özetledim.", "Gerekçe/faydaları ve gerçekçi bir uygulama planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille prompt'un istediğini karşıladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (öneri)", "x": "Proposal: A Peer Tutoring Programme\n\nIntroduction\nThis proposal recommends setting up a peer tutoring programme in which older students help younger ones who are struggling in core subjects. The scheme would run twice a week after school and would cost the school almost nothing.\n\nBenefits\nThe programme would help weaker students improve their grades in a relaxed, less intimidating setting. Just as importantly, the tutors themselves would deepen their own understanding and develop leadership skills valued by universities. Over time, it could also build a stronger sense of community across year groups.\n\nImplementation\nEach term, volunteer tutors would be matched with younger students by subject teachers. Sessions would take place in the library from 3 to 4 p.m. on Tuesdays and Thursdays. A teacher would supervise, but the sessions would be led by students.\n\nCosts\nThe only real cost is supervision, which existing staff could share on a rota. No new materials or funding would be required.\n\nConclusion\nFor almost no cost, this programme could raise achievement and bring students together. I respectfully ask the school to trial it for one term."}}, {"t": "note", "k": "ipucu", "title": "Rapordan farkı", "lines": ["Rapor mevcut durumu inceler; öneri (proposal) gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-instructions", "group": "Profesyonel", "name": "Yönerge (Set of Instructions)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net, doğrudan. Emir kipi (imperative)."], ["Yapı", "Başlık, gerekli malzemeler/ön koşullar, numaralı adımlar, ipuçları veya uyarılar."], ["Tipik özellikler", "Emir kipi (Take, Add, Do not), numaralı adımlar, sıra bağlaçları (First, Next, Finally), kısa net cümleler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir başlık yaz (How to ...).", "2. Gerekli malzemeleri/ön koşulları listele.", "3. Adımları mantıksal sıraya koy; her adım tek bir eylem olsun.", "4. Her adımı emir kipiyle başlat (Chop, Add, Press).", "5. Sıra bağlaçları kullan (First, Next, Then, Finally).", "6. Gerekirse bir ipucu veya uyarı ekle (Do not...).", "7. Son kontrol: başlık + malzemeler + numaralı adımlar + emir kipi var mı?"]}, {"t": "given", "title": "Birinci örnek (balkon bahçesi)", "x": "How to Start a Small Balcony Garden\n\nYou will need: two or three pots, potting soil, seeds, a small trowel and water.\n\n1. Choose a spot on your balcony that gets at least four hours of sunlight a day."}, {"t": "given", "title": "İkinci örnek (dijital, farklı bağlam)", "x": "How to Set Up Your New Email Account\n\nYou will need: a phone or computer, an internet connection and a strong password.\n\n1. First, open the app store and download the email app.\n2. Tap 'Create account' and enter your name and date of birth.\n3. Next, choose a username and a password of at least eight characters.\n4. Enter your phone number so the app can send a verification code.\n5. Type in the code when it arrives.\n6. Finally, add a profile photo if you wish, and tap 'Done'. Tip: never share your password with anyone."}, {"t": "wizard", "wt": "instructions", "ptitle": "Görev", "prompt": "Bir beceriyi (basit bir yemek, bir uygulamayı kurmak veya bir el işi) yeni başlayan birine öğreten bir yönerge yaz. Bir malzeme/ön koşul listesi ve numaralı adımlar kullan.", "target": 220, "check": ["Başlık ve gerekli malzemeler/ön koşullar listesi ekledim.", "Numaralı adımlar, emir kipi ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz; prompt'un istediği beceriyi kapsıyor (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (yönerge)", "x": "How to Make a Simple Turkish Menemen\n\nYou will need: three eggs, two tomatoes, one green pepper, a little olive oil, salt and a slice of bread to serve.\n\n1. First, wash the tomatoes and pepper. Chop the pepper into small pieces and grate or finely dice the tomatoes.\n\n2. Heat a little olive oil in a pan over medium heat. Add the pepper and cook for two to three minutes until it softens.\n\n3. Next, add the tomatoes and a pinch of salt. Let the mixture simmer for about five minutes, stirring now and then, until most of the liquid has gone.\n\n4. Crack the eggs directly into the pan. Do not stir straight away; wait a few seconds, then gently fold them into the tomato mixture.\n\n5. Cook for another minute or two, until the eggs are just set but still soft.\n\n6. Finally, serve hot with fresh bread. Tip: do not overcook the eggs, or the dish will become dry."}}, {"t": "note", "k": "ipucu", "title": "Netlik", "lines": ["Her adım tek bir eylem olsun ve emir kipiyle başlasın (Chop, Add, Serve).", "Sıra bağlaçları (First, Next, Finally) ve bir malzeme listesi Criterion C'yi güçlendirir."]}]}, {"id": "t-essay", "group": "Profesyonel", "name": "Deneme (Essay, SL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Giriş (konu + tez), her biri bir fikri işleyen gövde paragrafları (gerekçe + örnek), sonuç."], ["Tipik özellikler", "Net tez, bağlaçlar (however, therefore, for example), gerekçeli argüman, dengeli değerlendirme, sonuç. (Genelde SL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Soruyu çöz: seni ne hakkında görüş bildirmeye çağırıyor?", "2. Net bir tez belirle (görüşün ne?).", "3. Girişte konuyu tanıt ve tezini son cümlede ver.", "4. Her gövde paragrafında bir fikri işle: iddia + gerekçe + örnek.", "5. Karşı görüşe de değin (however...), sonra kendi görüşünle dengele.", "6. Sonuçta tezi toparla; yeni bilgi ekleme.", "7. Son kontrol: tez + gerekçeli paragraflar + bağlaçlar + denge + sonuç var mı?"]}, {"t": "given", "title": "Birinci örnek (sosyal medya)", "x": "Should Social Media Be Part of School Life?\n\nSocial media is often blamed for distracting students, yet it also offers real opportunities for learning. This essay argues that, used carefully, it belongs in the classroom."}, {"t": "given", "title": "İkinci örnek (giriş + tez, farklı konu)", "x": "Should Schools Ban Mobile Phones?\n\nFew objects divide a classroom like the mobile phone. To some it is a powerful learning tool; to others, the single biggest source of distraction in a student's day. While phones certainly have their uses, this essay argues that schools are right to restrict them during lessons, because the cost to concentration outweighs the convenience."}, {"t": "wizard", "wt": "essay", "ptitle": "Görev", "prompt": "Şu soruya bir deneme (essay) yaz: 'Should students be required to do community service?' Net bir tez, gerekçeli gövde paragrafları ve dengeli bir sonuç kullan.", "target": 280, "check": ["Girişte konuyu tanıttım ve net bir tez cümlesi yazdım.", "Her gövde paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve sonunda görüşümü toparladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (deneme)", "x": "Should Students Be Required to Do Community Service?\n\nMany schools now ask students to spend a set number of hours helping their community. Some see this as an unfair burden, but I believe that required community service, if handled sensibly, does far more good than harm.\n\nThe strongest argument in its favour is what students learn. Helping at a shelter or tutoring a younger child teaches responsibility and empathy in a way no textbook can. A friend of mine who volunteered at a care home says it completely changed how she sees older people.\n\nCritics argue that forcing people to help removes the kindness from the act. There is some truth in this. However, many students would never volunteer on their own, and once they start, they often continue by choice. The requirement simply opens a door.\n\nOf course, the hours must be reasonable, so that service does not harm students' studies or become a box-ticking exercise.\n\nIn conclusion, while it should be applied with care, required community service benefits both students and society, and I believe schools are right to include it."}}, {"t": "note", "k": "ipucu", "title": "Argüman", "lines": ["Girişte net bir tez ver; sonuç bu tezi toparlasın. Değerlendirici Criterion B'yi buradan okur.", "Karşı görüşe de değin (however...), sonra kendi görüşünle dengele. Bu olgunluk gösterir."]}]}, {"id": "t-social", "group": "Kişisel", "name": "Sosyal Medya Gönderisi", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kısa ve etkili biçimde bilgilendirmek, ikna etmek veya farkındalık yaratmak."], ["Kitle", "Bir platformun takipçileri veya kullanıcıları."], ["Register / Ton", "Kısa, canlı ve samimi; amaca uygun."], ["Yapı", "Dikkat çeken kısa mesaj, gerekirse maddeler, hashtag'ler, harekete geçirici çağrı."], ["Tipik özellikler", "Kısalık, hashtag (#), bahsetme (@), doğrudan hitap, net bir çağrı (Share, Sign up, Link below)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Amacı ve platformu belirle (bilgilendirme, davet, farkındalık).", "2. İlk satırda dikkat çek: bir soru veya çarpıcı ifade.", "3. Mesajı kısa ve net tut; tek bir ana fikir.", "4. Gerekli bilgiyi (tarih, yer, fiyat) kısa maddelerle ver.", "5. 2-4 ilgili hashtag ekle.", "6. Net bir çağrı koy (Tag a friend, Sign up, Link in bio).", "7. Son kontrol: kısa mı, hashtag ve çağrı var mı, ton platforma uygun mu?"]}, {"t": "given", "title": "Birinci örnek (farkındalık)", "x": "Every plastic bottle you skip is a small win for the planet.\n\nThis week, our school is going bottle-free. Bring a reusable one and we'll refill it for free at any fountain.\n\nSmall habit, big difference. Who's in?\n#GreenValley #PlasticFree #SmallSteps"}, {"t": "given", "title": "İkinci örnek (etkinlik, farklı bağlam)", "x": "THREE NIGHTS ONLY\n\nOur drama club presents 'The Long Night' — a story you won't forget.\n\n- 12 to 14 June, 7 pm\n- Tickets 20 lira at the door\n\nTag the friend you're bringing below.\n#GVHSDrama #SchoolPlay"}, {"t": "wizard", "wt": "social", "ai": false, "ptitle": "Görev", "prompt": "Okulunun bir kampanyası veya etkinliği için bir sosyal medya gönderisi yaz. Dikkat çeken kısa bir mesaj, gerekli bilgiler, uygun hashtag'ler ve net bir çağrı kullan.", "target": 120, "check": ["İlk satırda dikkat çektim ve mesajı kısa tuttum.", "Gerekli bilgiyi (tarih/yer/çağrı) net verdim (Criterion B).", "Uygun hashtag ve doğrudan bir çağrı kullandım (Criterion C).", "Ton platforma ve kitleye uygun.", "Kelime çeşitliliği kullandım (Criterion A)."], "model": {"title": "Model cevap (sosyal medya)", "x": "Exams are close, but you are not alone.\n\nThis week we're launching Study Buddies: free peer study sessions every lunchtime in the library. Bring your toughest subject; we'll bring the tea.\n\nNo pressure, no judgement, just people getting through it together.\n\nDrop by, or tag a friend who needs this below.\n#GreenValley #StudyBuddies #YouGotThis"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Uzun paragraflar yazmak. Sosyal medya kısadır; her kelime çalışsın.", "Hashtag veya çağrıyı unutmak. Bunlar türün imzasıdır (Criterion C).", "Yanlış ton. Resmi bir rapor dili sosyal medyada garip durur."]}]}, {"id": "t-ad", "group": "Kitle İletişim", "name": "Reklam (Advertisement)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir ürünü, hizmeti veya etkinliği tanıtıp okuru satın almaya/harekete geçmeye ikna etmek."], ["Kitle", "Hedeflenen müşteri veya katılımcı."], ["Register / Ton", "İkna edici, çarpıcı, kısa ve enerjik."], ["Yapı", "Akılda kalan slogan/başlık, ana fayda, bir teklif/detay, güçlü çağrı, iletişim."], ["Format", "Görsel ağırlıklı; elle yazımda slogan + kısa metin + [Image: ...] + çağrı ile temsil et."], ["Tipik özellikler", "Slogan, çekici dil, fayda vurgusu, emir kipi, teklif/fiyat, [Image] yer tutucu, çağrı."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Ürünü/teklifi ve hedef kitleyi belirle.", "2. Akılda kalan bir slogan veya başlık bul.", "3. Ana faydayı vurgula: bu neden alınmalı?", "4. Bir teklif veya detay ekle (fiyat, indirim, özellik).", "5. [Image: ...] ile görsel yerini belirt.", "6. Güçlü bir çağrı ve iletişim bilgisi koy (Order now, Visit...).", "7. Son kontrol: slogan + fayda + teklif + çağrı var mı?"]}, {"t": "given", "title": "Birinci örnek (ürün)", "x": "TIRED OF COLD MORNINGS? MEET THE POCKET WARMER.\n\nOne click, twelve hours of heat. Small enough for your pocket, powerful enough for the coldest bus stop.\n\n[Image: a student smiling in the snow, holding the warmer]\n\nToday only: buy one, get one free. Just 199 lira.\nOrder now at www.pocketwarmer.example."}, {"t": "given", "title": "İkinci örnek (hizmet, farklı bağlam)", "x": "LEARN TO SWIM THIS SUMMER.\n\nAfraid of water? Our patient coaches have taught over 2,000 nervous beginners to swim with real confidence.\n\nSmall groups. Warm pool. Genuine results.\n\n[Image: a child laughing while floating beside an instructor]\n\nYour first lesson is free. Book today: 0212 555 44 33."}, {"t": "wizard", "wt": "advertisement", "ai": false, "ptitle": "Görev", "prompt": "Bir ürün, hizmet veya etkinlik için bir reklam yaz. Akılda kalan bir slogan, ana faydayı, bir teklif ([Image] yer tutucu dahil) ve güçlü bir çağrı kullan.", "target": 150, "check": ["Akılda kalan bir slogan/başlıkla açtım.", "Ana faydayı ve bir teklif/detayı vurguladım (Criterion B).", "[Image: ...] yer tutucu ve güçlü bir çağrı kullandım (Criterion C).", "İkna edici, kısa ve enerjik bir dil kullandım (Criterion A).", "İletişim/çağrı bilgisini ekledim."], "model": {"title": "Model cevap (reklam)", "x": "STILL SCROLLING FOR SOMETHING TO DO THIS WEEKEND?\n\nStop. The Riverside Skate Park is open, and your first session is on us.\n\nWhether you've never touched a board or you're chasing your next trick, our friendly instructors will have you rolling in no time. Helmets and boards provided — just bring your courage.\n\n[Image: teenagers laughing on ramps under a bright sky]\n\nThis Saturday, 10 am to 6 pm. First hour free for students.\nFind us at Riverside Park, next to the old bridge. Come and roll with us."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Slogansız, düz bir tanıtım yazmak. Reklamın kalbi akılda kalan bir slogandır.", "Faydayı değil sadece özelliği anlatmak. Okur 'bu bana ne katar' bilmek ister.", "Çağrıyı unutmak. Reklam mutlaka bir eyleme çağırır (Buy, Book, Visit)."]}]}, {"id": "t-webpage", "group": "Kitle İletişim", "name": "Web Sayfası (Web Page)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değe
