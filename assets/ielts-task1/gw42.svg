<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="720" height="420" fill="#f7f4ec" rx="6"/>
<text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a2a2a">How a hydroelectric power station generates electricity</text>
<rect x="20" y="120" width="250" height="150" fill="#bcd8ea"/>
<text x="140.0" y="150.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a7a">Reservoir</text>
<text x="140.0" y="166.0" text-anchor="middle" font-size="9" fill="#2a5a7a">water stored behind the dam</text>
<polygon points="270,100 330,100 390,300 270,300" fill="#9a9a9a" stroke="#2a2a2a"/>
<text x="310.0" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Dam</text>
<text x="310.0" y="216.0" text-anchor="middle" font-size="9" fill="#fff">concrete, 80 m high</text>
<rect x="20" y="270" width="250" height="60" fill="#c9b48a"/>
<rect x="390" y="300" width="310" height="40" fill="#c9b48a"/>
<rect x="240" y="230" width="30" height="30" fill="#fff" stroke="#2a2a2a"/>
<text x="232.0" y="226.0" text-anchor="end" font-size="9" font-weight="bold" fill="#2a2a2a">1 Intake (with screen)</text>
<path d="M270,245 L440,245 L440,330" fill="none" stroke="#2a5a7a" stroke-width="14"/>
<text x="455.0" y="270.0" text-anchor="start" font-size="9" font-weight="bold" fill="#2a2a2a">2 Penstock (pipe):</text>
<text x="455.0" y="282.0" text-anchor="start" font-size="9" font-weight="bold" fill="#2a2a2a">water falls 80 m</text>
<circle cx="440" cy="340" r="26" fill="#fff" stroke="#2a2a2a" stroke-width="2"/>
<line x1="440" y1="340" x2="462.0" y2="340.0" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="455.6" y2="355.6" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="440.0" y2="362.0" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="424.4" y2="355.6" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="418.0" y2="340.0" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="424.4" y2="324.4" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="440.0" y2="318.0" stroke="#2a2a2a" stroke-width="3"/>
<line x1="440" y1="340" x2="455.6" y2="324.4" stroke="#2a2a2a" stroke-width="3"/>
<text x="440.0" y="384.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#2a2a2a">3 Turbine spins</text>
<line x1="466" y1="340" x2="520" y2="340" stroke="#2a2a2a" stroke-width="4"/>
<text x="493.0" y="334.0" text-anchor="middle" font-size="8" fill="#2a2a2a">shaft</text>
<rect x="520" y="316" width="70" height="48" rx="6" fill="#B78A2E"/>
<text x="555.0" y="336.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4 Generator</text>
<text x="555.0" y="350.0" text-anchor="middle" font-size="9" fill="#fff">electricity</text>
<rect x="600" y="230" width="90" height="40" rx="6" fill="#6E4A8E"/>
<text x="645.0" y="246.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5 Transformer</text>
<text x="645.0" y="260.0" text-anchor="middle" font-size="9" fill="#fff">raises voltage</text>
<line x1="555.0" y1="316.0" x2="594.2" y2="268.9" stroke="#B78A2E" stroke-width="2"/>
<polygon points="600.0,262.0 590.4,265.7 598.1,272.1" fill="#B78A2E"/>
<polygon points="630,230 660,230 650,160 640,160" fill="#9a9a9a"/>
<line x1="600" y1="170" x2="700" y2="170" stroke="#2a2a2a" stroke-width="2"/>
<text x="645.0" y="150.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#2a2a2a">6 Power lines to grid</text>
<rect x="466" y="300" width="60" height="14" fill="#bcd8ea"/>
<line x1="470.0" y1="307.0" x2="601.0" y2="307.0" stroke="#2a5a7a" stroke-width="3"/>
<polygon points="610.0,307.0 601.0,302.0 601.0,312.0" fill="#2a5a7a"/>
<text x="640.0" y="311.0" text-anchor="start" font-size="9" fill="#2a2a2a">river downstream</text>
<path d="M440,300 C 480,120 200,80 160,118" fill="none" stroke="#5a8f4a" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="160.0" y1="118.0" x2="157.7" y2="119.4" stroke="#5a8f4a" stroke-width="2"/>
<polygon points="150.0,124.0 160.3,123.7 155.1,115.1" fill="#5a8f4a"/>
<text x="420.0" y="92.0" text-anchor="start" font-size="9" fill="#5a8f4a">at night, cheap surplus electricity pumps</text>
<text x="420.0" y="104.0" text-anchor="start" font-size="9" fill="#5a8f4a">water back up to the reservoir (pumped storage)</text>
<text x="20.0" y="408.0" text-anchor="start" font-size="10" font-style="italic" fill="#8A7F6E">Simplified cross-section; not to scale.</text>
</svg>