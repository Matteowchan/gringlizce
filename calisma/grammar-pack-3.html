": "Which choice correctly completes the comparison?", "o": ["A) our competitors'", "B) our competitors' machines", "C) that of our competitors", "D) B or C"], "a": 3, "e": "D doğrudur. Hem C ('that of our competitors' = 'rakiplerimizin hata oranı') doğru karşılaştırma kurar. B ('our competitors' machines') da makul ama biraz daha az kesin.\n\nA — 'our competitors'' iyelikli ama isim yok — eksik.\nC — doğru."}, {"k": "comp", "p": "The language in this statute is more ambiguous than <u>most other laws</u> passed by the legislature.", "q": "Which revision corrects the faulty comparison?", "o": ["A) most other laws", "B) that of most other laws", "C) those of most other laws", "D) what most other laws say"], "a": 1, "e": "B doğrudur. Language (tekil) diğer yasaların diliyle karşılaştırılmalı. 'That of most other laws' = 'diğer yasaların dili.'\n\nA — dili yasalarla karşılaştırır — mantıksız.\nC — 'those' çoğuldur; language tekildir.\nD — gereksiz uzun."}, {"k": "comp", "p": "His understanding of thermodynamics is more advanced than <u>his classmates</u>.", "q": "Which revision is correct?", "o": ["A) his classmates", "B) that of his classmates", "C) his classmates' understanding", "D) B or C"], "a": 3, "e": "D doğrudur. Hem B ('that of his classmates' = 'sınıf arkadaşlarının anlayışı') hem C ('his classmates' understanding') anlayışı anlayışla doğru şekilde karşılaştırır.\n\nA — anlayışı insanlarla karşılaştırır — mantıksız.\nB — doğru.\nC — doğru."}]}, {"n": 7, "topic": "Sentence Combining — Reduction & Subordination", "diff": "Sentence Combining", "qs": [{"k": "comb", "p": "The committee reviewed the proposal. The committee found several inconsistencies.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The committee reviewed the proposal, and the committee found several inconsistencies.", "B) Reviewing the proposal, the committee found several inconsistencies.", "C) The committee reviewed the proposal and finding several inconsistencies.", "D) The committee found several inconsistencies, they reviewed the proposal."], "a": 1, "e": "B doğrudur. İlk eylemi katılımcı öbeğe dönüştürmek ('reviewing the proposal') özneyi tekrar etmeden iki cümleyi birleştirir.\n\nA — 'the committee' tekrar ediyor; iki tam yan cümle kullanıyor.\nC — 'reviewed...and finding' paralel yapı bozuyor.\nD — comma splice (virgül ile yanlış birleştirme hatası)."}, {"k": "comb", "p": "She completed the project ahead of schedule. This gave her time to review the final draft.", "q": "Which choice most effectively combines these sentences?", "o": ["A) She completed the project ahead of schedule, and this gave her time to review the final draft.", "B) Having completed the project ahead of schedule, she had time to review the final draft.", "C) She completed the project ahead of schedule, time was given to her to review the final draft.", "D) Completing the project, she was ahead of schedule and reviewing the final draft."], "a": 1, "e": "B doğrudur. 'Having completed the project ahead of schedule' mükemmel katılımcı öbeği önceki eylemi ve sonucunu verimli şekilde aktarır.\n\nA — dilbilgisel olarak doğru ama B'den daha uzun.\nC — comma splice.\nD — anlamı ve yapıyı bozuyor."}, {"k": "comb", "p": "The documentary was critically acclaimed. It failed to attract a wide commercial audience.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The documentary was critically acclaimed, it failed to attract a wide commercial audience.", "B) Although the documentary was critically acclaimed, it failed to attract a wide commercial audience.", "C) The documentary was critically acclaimed, however failing to attract a wide commercial audience.", "D) The documentary was critically acclaimed but wide commercial audience was not attracted."], "a": 1, "e": "B doğrudur. 'Although' zıtlığı bağımlı bir yan cümleyle doğru şekilde kurar.\n\nA — comma splice.\nC — 'however failing' dilbilgisel değildir.\nD — pasif yapı doğal değildir."}, {"k": "comb", "p": "The bridge was built in 1893. It still carries commuter traffic every day.", "q": "Which choice most effectively combines these sentences using a relative clause?", "o": ["A) The bridge, that was built in 1893, still carries commuter traffic every day.", "B) The bridge, which was built in 1893, still carries commuter traffic every day.", "C) The bridge which was built in 1893 still carries commuter traffic every day.", "D) Built in 1893, commuter traffic still crosses the bridge every day."], "a": 1, "e": "B doğrudur. Kısıtlayıcı olmayan ilgi yan cümlesi ('which was built in 1893') köprü hakkında ek bilgi verir ve virgüllerle doğru şekilde ayrılır.\n\nA — 'that' nonrestrictive (virgüllü) yan cümlelerde kullanılmaz.\nC — 'which' virgülsüz SAT'ta standart değildir.\nD — sarkan belirteç: 'built in 1893' köprüyü değil 'commuter traffic'i niteliyor."}, {"k": "comb", "p": "The government launched the initiative in 2019. The initiative aimed to reduce plastic waste.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The government launched the initiative in 2019, and the initiative aimed to reduce plastic waste.", "B) Launched in 2019, the initiative aimed to reduce plastic waste.", "C) In 2019 the government launched the initiative aiming to reduce plastic waste in 2019.", "D) The government launched the initiative, which aimed to reduce plastic waste, in 2019."], "a": 3, "e": "D doğrudur. Kısıtlayıcı olmayan ilgi yan cümlesi ('which aimed to reduce plastic waste') ikinci cümlenin bilgisini entegre ederken 'in 2019'u doğru yerinde tutar.\n\nA — 'the initiative' tekrar ediyor.\nB — hükümetin onu başlattığı bilgisini kaybeder.\nC — '2019'u iki kez tekrarlıyor."}, {"k": "comb", "p": "The professor is an expert in behavioral economics. She was invited to speak at the conference.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The professor is an expert in behavioral economics, and she was invited to speak at the conference.", "B) The professor, an expert in behavioral economics, was invited to speak at the conference.", "C) Being an expert in behavioral economics, the conference invited the professor to speak.", "D) An expert in behavioral economics the professor was invited to speak at the conference."], "a": 1, "e": "B doğrudur. Açıklayıcı öbek (appositive) ilk cümlenin bilgisini gereksiz tekrar olmadan entegre eder.\n\nA — iki tam yan cümle; daha az özlü.\nC — sarkan belirteç: konferans davranışsal ekonomide uzman değil.\nD — appositive'den sonra virgül eksik."}, {"k": "comb", "p": "The law was passed in 2018. It has since reduced emissions by thirty percent.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The law, passed in 2018, has since reduced emissions by thirty percent.", "B) The law was passed in 2018, and it has since reduced emissions by thirty percent.", "C) Having been passed in 2018, the law reduced emissions by thirty percent since.", "D) Since the law was passed in 2018, and it reduced emissions by thirty percent."], "a": 0, "e": "A doğrudur. İndirgenmiş ilgi yan cümlesi ('passed in 2018') zaman bilgisini verimli şekilde entegre eder.\n\nB — dilbilgisel olarak doğru ama iki tam yan cümle kullanıyor.\nC — 'since' sona gelemiyor.\nD — 'and' 'since'tan sonra bir bileşik oluşturuyor; cümle parçası (fragment) oluşuyor."}, {"k": "comb", "p": "The team worked through the night. They wanted to meet the launch deadline.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The team worked through the night wanting to meet the launch deadline.", "B) The team worked through the night in order to meet the launch deadline.", "C) The team worked through the night, and they wanted to meet the launch deadline.", "D) Working through the night, the launch deadline was met."], "a": 1, "e": "B doğrudur. 'In order to' amacı açık ve özlü şekilde ifade eder.\n\nA — 'worked through the night wanting' belirsiz.\nC — iki tam yan cümle gereksiz.\nD — sarkan belirteç: 'the launch deadline' gece çalışmadı."}, {"k": "comb", "p": "The scientist discovered a new compound. The compound can dissolve plastic in seawater.", "q": "Which choice most effectively combines these sentences using a relative clause?", "o": ["A) The scientist discovered a new compound that can dissolve plastic in seawater.", "B) The scientist discovered a new compound, which can dissolve plastic in seawater.", "C) A new compound was discovered by the scientist, it can dissolve plastic in seawater.", "D) Discovering a new compound, the scientist found it can dissolve plastic in seawater."], "a": 0, "e": "A doğrudur. Kısıtlayıcı ilgi yan cümlesi ('that can dissolve plastic in seawater') hangi bileşik olduğunu belirtir.\n\nB — 'which' ve virgüller nonrestrictive yapar; bilim insanının keşfettiği her bileşiğin plastiği çözdüğünü ima eder.\nC — comma splice.\nD — 'it can dissolve' garip ikinci bağımsız yan cümle yaratıyor."}, {"k": "comb", "p": "The merger was announced on Tuesday. The announcement surprised industry analysts.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The merger was announced on Tuesday, and it surprised industry analysts.", "B) The merger announcement on Tuesday surprised industry analysts.", "C) Announcing the merger on Tuesday, industry analysts were surprised.", "D) The merger was announced on Tuesday, surprising industry analysts."], "a": 3, "e": "D doğrudur. Katılımcı öbek ('surprising industry analysts') duyurunun etkisini gereksiz tekrar olmadan aktarıyor.\n\nA — dilbilgisel olarak doğru ama D'den az özlü.\nB — 'merger announcement on Tuesday' biraz belirsiz.\nC — sarkan belirteç: analistler duyuruyu yapmadı."}, {"k": "comb", "p": "The study was peer-reviewed. It was published in a prestigious journal. It had significant implications for treatment.", "q": "Which choice most effectively combines these three sentences?", "o": ["A) The peer-reviewed study, published in a prestigious journal, had significant implications for treatment.", "B) The study was peer-reviewed and published in a prestigious journal and it had significant implications.", "C) Peer-reviewed and published, the study had significant implications in a prestigious journal.", "D) The study was peer-reviewed. Published in a prestigious journal, it had significant implications."], "a": 0, "e": "A doğrudur. İki indirgenmiş niteleyici ('peer-reviewed' sıfat, 'published in a prestigious journal' katılımcı öbek) üç cümlenin bilgisini verimli şekilde birleştirir.\n\nB — üç 'and' yan cümlesi gereksiz uzun.\nC — 'in a prestigious journal' yanlış yerde ('implications'dan sonra).\nD — üç cümleyi tam olarak birleştirmiyor."}, {"k": "comb", "p": "She is an accomplished violinist. She plays in the city orchestra. She also teaches at the conservatory.", "q": "Which choice most effectively combines these three sentences?", "o": ["A) An accomplished violinist, she plays in the city orchestra and teaches at the conservatory.", "B) She is an accomplished violinist who plays in the city orchestra and who also teaches at the conservatory.", "C) She is accomplished and plays violin in the city orchestra and teaches at the conservatory.", "D) Playing violin, she teaches at the conservatory and is also in the orchestra."], "a": 0, "e": "A doğrudur. Açıklayıcı öbek ('an accomplished violinist') kimliğini tanıtırken iki eşgüdümlü fiil ('plays' ve 'teaches') son iki cümleyi birleştirir.\n\nB — dilbilgisel olarak doğru ama daha uzun.\nC — 'accomplished and plays violin' garip bir yapı.\nD — olgular arasındaki ilişkileri bozuyor."}, {"k": "comb", "p": "The policy was controversial. It was nonetheless adopted by a majority of the council.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The policy was controversial, it was nonetheless adopted by a majority of the council.", "B) Although controversial, the policy was nonetheless adopted by a majority of the council.", "C) The policy was controversial; being nonetheless adopted by a majority.", "D) Controversial though it was, the policy was nonetheless adopted by a majority of the council."], "a": 3, "e": "D doğrudur. 'Controversial though it was' zarif bir taviz inversiyonudur. B de doğrudur ama D daha stilistik açıdan kesindir.\n\nA — comma splice.\nB — doğru ama D'den biraz daha az özlü.\nC — noktalı virgül bir cümle parçasının (fragment) ardından geliyor."}, {"k": "comb", "p": "The architect submitted the blueprints. She then waited three months for approval.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The architect submitted the blueprints and she waited three months for approval.", "B) After submitting the blueprints, the architect waited three months for approval.", "C) Submitting the blueprints, and then waiting three months, the architect received approval.", "D) Having submitted the blueprints and having waited three months for approval, the architect was done."], "a": 1, "e": "B doğrudur. 'After submitting the blueprints' olayların sırasını açıkça gösterirken ilk yan cümleyi bağımlıya indirger.\n\nA — özneyi tekrarlıyor ve gereksiz 'and' kullanıyor.\nC — anlamı bozuyor; mimar burada onay almıyor.\nD — 'having waited' beklemenin onaydan önce tamamlandığını ima ediyor; belirsiz."}, {"k": "comb", "p": "The study examined three variables. These variables were income, education, and health outcomes.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The study examined three variables, and these were income, education, and health outcomes.", "B) The study examined three variables: income, education, and health outcomes.", "C) The study examined three variables which were income, education, and health outcomes.", "D) Income, education, and health outcomes were the three variables that the study examined."], "a": 1, "e": "B doğrudur. Tam bir yan cümleden sonra iki nokta üst üste (colon) listeyi verimli ve resmi şekilde sunar.\n\nA — 'and these were' gereksiz uzun.\nC — 'which were' gereksiz ilgi yan cümlesi; virgül yok.\nD — dilbilgisel olarak doğru ama ayrıntıları bağlamdan önce sunar."}, {"k": "comb", "p": "The medication is effective. However, it has significant side effects.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The medication is effective; however, it has significant side effects.", "B) Although the medication is effective, it has significant side effects.", "C) The medication is effective, but it has significant side effects.", "D) All of the above are correct."], "a": 3, "e": "D doğrudur. Üç seçeneğin hepsi zıtlığı doğru ifade eder: A noktalı virgül + bağlaç zarfı, B bağımlılık bağlacı, C eşgüdüm bağlacı kullanıyor.\n\nA — doğru.\nB — doğru.\nC — doğru."}, {"k": "comb", "p": "The CEO announced the restructuring plan. Many employees were alarmed by the announcement.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The CEO announced the restructuring plan, alarming many employees.", "B) The CEO announced the restructuring plan and many employees were alarmed.", "C) Alarmed by the restructuring plan, the CEO made an announcement.", "D) The restructuring plan announced by the CEO alarmed many employees being there."], "a": 0, "e": "A doğrudur. Katılımcı öbek ('alarming many employees') duyurunun sonucunu verimli şekilde aktarıyor.\n\nB — iki tam yan cümle; daha az özlü.\nC — sarkan belirteç: CEO alarmed değildi.\nD — 'being there' garip ve belirsiz."}, {"k": "comb", "p": "The expedition lasted six months. It was the longest in the organization's history.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The expedition, lasting six months, was the longest in the organization's history.", "B) Lasting six months, the expedition was the longest in the organization's history.", "C) The expedition lasted six months, and it was the longest in the organization's history.", "D) A and B are both effective."], "a": 3, "e": "D doğrudur. Hem A hem de B cümleleri etkin şekilde birleştiriyor. A 'lasting six months'ı kısıtlayıcı olmayan bir katılımcı öbek olarak, B ise giriş katılımcı öbeği olarak kullanıyor.\n\nA — doğru.\nB — doğru.\nC — dilbilgisel olarak iyi ama iki tam yan cümle kullanıyor."}, {"k": "comb", "p": "The company lost market share last year. This was due to increased competition from overseas.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The company lost market share last year, due to increased competition from overseas.", "B) The company lost market share last year because of increased competition from overseas.", "C) Due to increased competition from overseas, the company lost market share last year.", "D) B and C are both effective."], "a": 3, "e": "D doğrudur. Hem B hem de C nedeni doğru şekilde entegre ediyor.\n\nA — 'due to'dan önce virgül bu kullanımda standart değildir.\nB — doğru.\nC — doğru."}, {"k": "comb", "p": "The article was poorly researched. It was also poorly written.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The article was poorly researched, and it was also poorly written.", "B) The article was both poorly researched and poorly written.", "C) The article was poorly researched and it was poorly written as well.", "D) Poorly researched and poorly written, the article was flawed."], "a": 1, "e": "B doğrudur. 'Both...and' iki paralel öbek ('poorly researched and poorly written') ile temiz bir yapı kurar.\n\nA — özneyi tekrarlıyor ve 'also' gereksiz.\nC — 'as well' sonda gereksiz.\nD — dilbilgisel olarak doğru ama 'flawed' orijinal cümlelerde olmayan yeni bir sonuç ekliyor."}, {"k": "comb", "p": "The report was submitted on time. It met all the specified requirements.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The report was submitted on time and met all the specified requirements.", "B) Submitted on time, the report met all the specified requirements.", "C) On time, the report was submitted and met requirements.", "D) The report, submitted on time, met all the specified requirements."], "a": 0, "e": "A doğrudur. Bileşik yüklem ('was submitted on time and met all the specified requirements') iki eylemi aynı özne altında verimli şekilde birleştiriyor.\n\nB — katılımcı öbek de doğru.\nD — da kabul edilebilir. A en doğal ve doğrudan birleştirme."}, {"k": "comb", "p": "The defendant entered the courtroom. The defendant appeared calm and composed.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The defendant entered the courtroom, and the defendant appeared calm and composed.", "B) Entering the courtroom, the defendant appeared calm and composed.", "C) The defendant entered the courtroom appearing calm and composed.", "D) Both B and C are effective."], "a": 3, "e": "D doğrudur. Hem B hem de C cümleleri doğru birleştiriyor. B giriş katılımcı öbeği, C ise sonda katılımcı öbek kullanıyor.\n\nA — 'the defendant' tekrarlanıyor.\nB — doğru.\nC — doğru."}, {"k": "comb", "p": "The committee has reviewed the application. The committee has also contacted the references.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The committee has reviewed the application and has also contacted the references.", "B) The committee has reviewed the application and contacted the references.", "C) Having reviewed the application, the committee has contacted the references.", "D) The committee reviewed the application. The committee contacted the references."], "a": 1, "e": "B doğrudur. Bileşik yüklem ('has reviewed...and contacted') yardımcı fiili paylaşarak en özlü birleştirmeyi sağlıyor.\n\nA — 'has' gereksiz tekrar ediyor ('has also contacted').\nC — incelemenin önce tamamlandığını ima ediyor; bu sıra her zaman geçerli değil.\nD — iki ayrı cümle kalıyor."}, {"k": "comb", "p": "The volcano erupted in 1980. The eruption destroyed thousands of acres of forest.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The volcano erupted in 1980 and destroyed thousands of acres of forest.", "B) When the volcano erupted in 1980, it destroyed thousands of acres of forest.", "C) Erupting in 1980, the volcano destroyed thousands of acres of forest.", "D) All three are effective."], "a": 3, "e": "D doğrudur. Üç seçeneğin hepsi doğru şekilde birleştiriyor: A bileşik yüklem, B zamansal bağımlı yan cümle, C giriş katılımcı öbeği kullanıyor.\n\nA — doğru.\nB — doğru.\nC — doğru."}, {"k": "comb", "p": "The government announced new measures. These measures were intended to reduce unemployment.", "q": "Which choice most effectively combines these sentences?", "o": ["A) The government announced new measures, and these were intended to reduce unemployment.", "B) The government announced new measures intended to reduce unemployment.", "C) New measures intended to reduce unemployment were announced by the government.", "D) The government announced new measures which were intended to reduce unemployment."], "a": 1, "e": "B doğrudur. İndirgenmiş ilgi yan cümlesi ('intended to reduce unemployment') 'measures'ı doğrudan ve özlü şekilde niteler.\n\nA — 'and these were' gereksiz uzun.\nC — pasif yapı daha az doğrudan.\nD — 'which were intended' dilbilgisel olarak doğru ama B'den daha uzun."}]}, {"n": 8, "topic": "Style, Register & Tone Consistency", "diff": "Style & Register", "qs": [{"k": "style", "p": "The committee's annual report detailed significant achievements in environmental sustainability and outlined several key areas for improvement. <u>Basically, they totally crushed it this year.</u>", "q": "Which choice maintains the formal register of the passage?", "o": ["A) Basically, they totally crushed it this year.", "B) Overall, the committee demonstrated considerable progress across multiple performance indicators.", "C) So the committee really did amazing work.", "D) In sum, they nailed all their goals."], "a": 1, "e": "B doğrudur. Pasaj resmi, profesyonel bir dil kullanıyor. 'Demonstrated considerable progress across multiple performance indicators' bu register (dil düzeyi) ile uyumludur.\n\nA, C, D — 'crushed it,' 'nailed,' 'really did amazing work' gibi günlük dil kullanıyor; resmi register ile uyumsuz."}, {"k": "style", "p": "The artist's early work explored themes of displacement and cultural hybridity through fragmented imagery and non-linear narrative structures. <u>Later, she started doing totally different stuff.</u>", "q": "Which choice is consistent with the analytical tone of the passage?", "o": ["A) Later, she started doing totally different stuff.", "B) As her career progressed, her work shifted toward more minimalist approaches.", "C) After a while, she went in a completely other direction.", "D) She then changed her style quite a bit."], "a": 1, "e": "B doğrudur. 'As her career progressed, her work shifted toward more minimalist approaches' analitik ve resmi tonu korur.\n\nA, C, D — 'totally different stuff,' 'went in a completely other direction,' 'quite a bit' gibi günlük ifadeler register ile uyumsuz."}, {"k": "style", "p": "The merger negotiations were conducted over a period of eight months and involved representatives from three continents. <u>It was a pretty long process, to be honest.</u>", "q": "Which choice maintains the formal, informative register?", "o": ["A) It was a pretty long process, to be honest.", "B) The extended duration of the negotiations reflected the complexity of the cross-continental agreement.", "C) The whole thing took way longer than expected.", "D) Honestly, eight months is a lot."], "a": 1, "e": "B doğrudur. 'The extended duration of the negotiations reflected the complexity of the cross-continental agreement' resmi ve analitiktir.\n\nA, C, D — 'pretty,' 'to be honest,' 'way longer,' 'Honestly' gibi günlük işaretçiler resmi tonu bozuyor."}, {"k": "style", "p": "Studies have consistently demonstrated that regular physical activity reduces the risk of cardiovascular disease, improves cognitive function, and enhances overall psychological well-being. <u>So yeah, working out is good for you.</u>", "q": "Which choice is consistent with the scientific register?", "o": ["A) So yeah, working out is good for you.", "B) These findings underscore the multidimensional health benefits of sustained physical activity.", "C) Bottom line: exercise makes you healthier.", "D) Everyone basically knows exercise is important."], "a": 1, "e": "B doğrudur. 'These findings underscore the multidimensional health benefits of sustained physical activity' bilimsel register ile uyumludur.\n\nA, C, D — 'So yeah,' 'Bottom line,' 'basically knows' gibi günlük ifadeler bilimsel bağlamla uyumsuz."}, {"k": "style", "p": "The nineteenth-century novel frequently engaged with questions of social mobility, class conflict, and the moral dimensions of economic aspiration. <u>People back then were really into whether rich folks deserved their money.</u>", "q": "Which choice is consistent with the literary-critical register?", "o": ["A) People back then were really into whether rich folks deserved their money.", "B) Contemporary readers were deeply preoccupied with the ethical legitimacy of wealth accumulation.", "C) Rich people and poor people had lots of drama.", "D) It was a time when money and class were a big deal."], "a": 1, "e": "B doğrudur. 'Preoccupied with the ethical legitimacy of wealth accumulation' akademik, edebi-eleştirel tona uygundur.\n\nA, C, D — 'really into,' 'rich folks,' 'lots of drama,' 'big deal' gibi günlük sözcükler register ile uyumsuz."}, {"k": "style", "p": "The pharmaceutical trial employed a double-blind, placebo-controlled methodology to minimize the influence of bias on the measured outcomes. <u>They didn't tell anyone what they were taking, which is a smart move.</u>", "q": "Which choice maintains the technical, scientific register?", "o": ["A) They didn't tell anyone what they were taking, which is a smart move.", "B) This methodology ensured that neither participants nor researchers were aware of treatment assignments during data collection.", "C) Nobody knew who had the real drug, which is the point.", "D) The blind approach kept things fair, basically."], "a": 1, "e": "B doğrudur. 'Neither participants nor researchers were aware of treatment assignments' yöntemi bilimsel dilde doğru şekilde ifade eder.\n\nA, C, D — 'didn't tell,' 'nobody knew,' 'smart move,' 'basically' gibi günlük ifadeler teknik register ile uyumsuz."}, {"k": "style", "p": "The architectural firm's proposal was praised for its innovative integration of passive solar design principles with the site's existing topographical features. <u>The design was really cool and creative.</u>", "q": "Which choice maintains the formal, professional tone?", "o": ["A) The design was really cool and creative.", "B) The proposal was lauded for its creative and technically sophisticated approach to sustainable design.", "C) Everyone loved how neat and inventive the design was.", "D) Honestly, it was one of the better designs they'd seen."], "a": 1, "e": "B doğrudur. 'Lauded for its creative and technically sophisticated approach' profesyonel register'ı korur.\n\nA, C, D — 'really cool,' 'Everyone loved,' 'neat,' 'Honestly' gibi günlük dil resmi tonu bozuyor."}, {"k": "style", "p": "The economic downturn of the 1930s fundamentally restructured the relationship between the state and the market, as governments across the industrialized world assumed unprecedented regulatory authority over financial institutions. <u>Back then, the government got really involved in money stuff.</u>", "q": "Which choice maintains the historical, academic register?", "o": ["A) Back then, the government got really involved in money stuff.", "B) This period marked a decisive shift toward state intervention in economic governance.", "C) The government basically started controlling everything.", "D) Things changed a lot for everyone in terms of economic policy."], "a": 1, "e": "B doğrudur. 'A decisive shift toward state intervention in economic governance' tarihsel ve analitik tona uygundur.\n\nA, C, D — 'money stuff,' 'basically,' 'a lot,' 'everyone' gibi günlük dil akademik register ile uyumsuz."}, {"k": "style", "p": "Primatological research has documented sophisticated forms of social learning among chimpanzees, including the transmission of tool-use behaviors across generations. <u>Chimps are pretty smart and learn from each other.</u>", "q": "Which choice is consistent with the scientific register?", "o": ["A) Chimps are pretty smart and learn from each other.", "B) These observations suggest that cultural transmission of knowledge is not exclusively a human phenomenon.", "C) Basically, chimpanzees can teach skills to younger ones.", "D) It turns out animals can be more clever than we thought."], "a": 1, "e": "B doğrudur. 'Cultural transmission of knowledge is not exclusively a human phenomenon' bilimsel dile uygundur.\n\nA, C, D — 'pretty smart,' 'Basically,' 'more clever than we thought' gibi günlük ifadeler bilimsel bağlamla uyumsuz."}, {"k": "style", "p": "The legislative debate centered on the constitutionality of the proposed surveillance measures, with opponents arguing that the legislation violated foundational principles of civil liberties. <u>A lot of people were really mad about the new spy stuff.</u>", "q": "Which choice maintains the formal, analytical register?", "o": ["A) A lot of people were really mad about the new spy stuff.", "B) Critics contended that the measures represented an unconstitutional infringement on individual rights.", "C) People didn't like it because it felt like an invasion of privacy.", "D) The surveillance thing made many folks upset."], "a": 1, "e": "B doğrudur. 'Critics contended that the measures represented an unconstitutional infringement on individual rights' resmi ve hukuki açıdan kesindir.\n\nA, C, D — 'really mad,' 'spy stuff,' 'felt like,' 'folks' gibi günlük ifadeler yasal bağlamla uyumsuz."}, {"k": "style", "p": "The play examines the psychological deterioration of its protagonist through a series of increasingly fragmented interior monologues. The audience <u>gets kind of confused as the character goes more and more crazy</u>.", "q": "Which choice is consistent with the literary-critical register?", "o": ["A) gets kind of confused as the character goes more and more crazy", "B) is drawn into the protagonist's disintegrating psychological landscape alongside the character", "C) basically can't follow what's happening because the character is losing it", "D) watches the character fall apart, which is a little hard to follow"], "a": 1, "e": "B doğrudur. 'Drawn into the protagonist's disintegrating psychological landscape' eleştirel ve analitiktir.\n\nA, C, D — 'kind of confused,' 'losing it,' 'fall apart,' 'basically' gibi günlük dil edebi-eleştirel register ile uyumsuz."}, {"k": "style", "p": "The treaty established a framework for multilateral cooperation on climate adaptation, including provisions for technology transfer to developing nations. <u>It was a good deal that helped poorer countries with climate stuff.</u>", "q": "Which choice maintains the formal, diplomatic register?", "o": ["A) It was a good deal that helped poorer countries with climate stuff.", "B) The agreement represented a significant advance in international solidarity on climate resilience.", "C) Everyone seemed happy because developing countries got help.", "D) It worked out well for the countries that needed the most help."], "a": 1, "e": "B doğrudur. 'A significant advance in international solidarity on climate resilience' resmi diplomatik dile uygundur.\n\nA, C, D — 'good deal,' 'climate stuff,' 'Everyone seemed happy,' 'worked out well' gibi günlük ifadeler diplomatik register ile uyumsuz."}, {"k": "style", "p": "Neuroimaging studies have identified structural differences in the prefrontal cortex associated with impulse control deficits in adolescents. <u>Teen brains aren't fully grown, so they can't control themselves as well.</u>", "q": "Which choice maintains the scientific register?", "o": ["A) Teen brains aren't fully grown, so they can't control themselves as well.", "B) These structural differences may contribute to the diminished inhibitory capacity observed in adolescent populations.", "C) Teenagers have less developed brains, which affects how they make decisions.", "D) Young people's brains being less mature explains a lot of their behavior."], "a": 1, "e": "B doğrudur. 'Diminished inhibitory capacity observed in adolescent populations' nörobilimsel dile kesin olarak uygundur.\n\nA, C, D — 'Teen brains aren't fully grown,' 'explains a lot,' 'can't control themselves' gibi ifadeler bilimsel register ile uyumsuz."}, {"k": "style", "p": "The curator argued that the exhibition's unconventional spatial arrangement was intended to challenge visitors' assumptions about the relationship between object and context. <u>Basically, the museum layout was weird on purpose.</u>", "q": "Which choice is consistent with the analytical, critical register?", "o": ["A) Basically, the museum layout was weird on purpose.", "B) This deliberate subversion of conventional display practices invited a reexamination of curatorial assumptions.", "C) The unusual setup was meant to make people think differently.", "D) The weird arrangement was supposed to be confusing for visitors."], "a": 1, "e": "B doğrudur. 'Deliberate subversion of conventional display practices' resmi eleştirel dile uygundur.\n\nA, C, D — 'basically,' 'weird,' 'think differently,' 'confusing' gibi günlük ifadeler analitik register ile uyumsuz."}, {"k": "style", "p": "The audit revealed significant discrepancies between the reported figures and the actual financial records, prompting an investigation by the regulatory authority. <u>They found that the numbers were totally off, and the regulators got involved.</u>", "q": "Which choice maintains the formal register?", "o": ["A) They found that the numbers were totally off, and the regulators got involved.", "B) The identified discrepancies necessitated the intervention of the relevant regulatory body.", "C) The accounting was a mess, so the government had to step in.", "D) Things didn't add up, so investigators had to look into it."], "a": 1, "e": "B doğrudur. 'The identified discrepancies necessitated the intervention of the relevant regulatory body' resmi ve mesleki register ile uyumludur.\n\nA, C, D — 'totally off,' 'a mess,' 'step in,' 'Things didn't add up' gibi günlük ifadeler resmi denetim bağlamıyla uyumsuz."}, {"k": "style", "p": "The study's limitations include a relatively small sample size and the exclusive reliance on self-reported data, which may have introduced response bias. <u>But the study wasn't perfect, honestly.</u>", "q": "Which choice is consistent with the scientific, methodological register?", "o": ["A) But the study wasn't perfect, honestly.", "B) These constraints may affect the generalizability of the findings to broader populations.", "C) So the results might not apply to everyone.", "D) The study had problems that could mess up the results."], "a": 1, "e": "B doğrudur. 'These constraints may affect the generalizability of the findings to broader populations' metodolojik dile kesin olarak uygundur.\n\nA, C, D — 'wasn't perfect,' 'honestly,' 'mess up' gibi günlük ifadeler metodolojik register ile uyumsuz."}, {"k": "style", "p": "The poet employs fragmented syntax and dissonant imagery to mirror the fractured consciousness of the speaker, creating a textual experience of psychological disorientation. <u>The poem sounds broken-up because the speaker feels messed up inside.</u>", "q": "Which choice is consistent with the literary-analytical register?", "o": ["A) The poem sounds broken-up because the speaker feels messed up inside.", "B) The formal fragmentation of the text enacts the speaker's internal disorder at the level of language itself.", "C) The writing style is confusing, like the speaker's state of mind.", "D) The poem's style reflects how messed up the speaker is emotionally."], "a": 1, "e": "B doğrudur. 'The formal fragmentation of the text enacts the speaker's internal disorder at the level of language itself' kesin olarak analitiktir.\n\nA, C, D — 'sounds broken-up,' 'messed up,' 'confusing,' 'style' gibi günlük ifadeler edebi-analitik register ile uyumsuz."}, {"k": "style", "p": "The company's revised corporate social responsibility framework reflects an increased emphasis on stakeholder engagement and transparent governance. <u>They're trying harder to be good and honest.</u>", "q": "Which choice maintains the corporate, formal register?", "o": ["A) They're trying harder to be good and honest.", "B) These revisions signal a strategic commitment to accountability and inclusive organizational governance.", "C) The company wants to do better in terms of ethical behavior.", "D) They're making changes to show they care about ethics."], "a": 1, "e": "B doğrudur. 'A strategic commitment to accountability and inclusive organizational governance' kurumsal dile uygundur.\n\nA, C, D — 'trying harder to be good,' 'do better,' 'show they care' gibi günlük ifadeler kurumsal register ile uyumsuz."}, {"k": "style", "p": "Epidemiological data suggest a strong correlation between socioeconomic disadvantage and elevated rates of chronic disease across demographic groups. <u>Poor people get sick more, basically.</u>", "q": "Which choice is consistent with the epidemiological register?", "o": ["A) Poor people get sick more, basically.", "B) These patterns indicate that socioeconomic vulnerability is a significant determinant of population health outcomes.", "C) People with less money tend to have more health problems, studies show.", "D) Low-income groups are more likely to be sick than rich ones."], "a": 1, "e": "B doğrudur. 'Socioeconomic vulnerability is a significant determinant of population health outcomes' epidemiyolojik dile kesin olarak uygundur.\n\nA, C, D — 'Poor people get sick more,' 'basically,' 'more likely to be sick' gibi ifadeler bilimsel register ile uyumsuz."}, {"k": "style", "p": "The Renaissance marked a profound reorientation of European intellectual culture toward classical antiquity, with humanist scholars championing individual reason and empirical inquiry. <u>Back then, smart people got really into ancient Greek and Roman stuff.</u>", "q": "Which choice is consistent with the historical, academic register?", "o": ["A) Back then, smart people got really into ancient Greek and Roman stuff.", "B) This intellectual movement prioritized the recovery of classical knowledge as a foundation for renewed scholarly inquiry.", "C) Scholars at the time were very interested in ancient history and philosophy.", "D) People in this era liked looking at old texts from Greece and Rome."], "a": 1, "e": "B doğrudur. 'Prioritized the recovery of classical knowledge as a foundation for renewed scholarly inquiry' akademik tarihsel dile uygundur.\n\nA, C, D — 'got really into,' 'stuff,' 'liked looking' gibi günlük ifadeler akademik register ile uyumsuz."}, {"k": "style", "p": "The defendant's motion to suppress the evidence was denied on the grounds that the search had been conducted pursuant to a valid warrant. <u>The judge said no because the search was legal.</u>", "q": "Which choice maintains the formal, legal register?", "o": ["A) The judge said no because the search was legal.", "B) The court upheld the admissibility of the evidence, affirming the constitutional validity of the search.", "C) The judge rejected the motion since the search followed the law.", "D) They weren't allowed to throw out the evidence because everything was done legally."], "a": 1, "e": "B doğrudur. 'The court upheld the admissibility of the evidence, affirming the constitutional validity of the search' kesin hukuki dile uygundur.\n\nA, C, D — 'said no,' 'throw out,' 'done legally' gibi günlük ifadeler hukuki register ile uyumsuz."}, {"k": "style", "p": "The algorithm's performance was evaluated using a cross-validation methodology applied to a dataset of over two million entries. <u>They tested the algorithm on a ton of data, and it worked pretty well.</u>", "q": "Which choice maintains the technical, academic register?", "o": ["A) They tested the algorithm on a ton of data, and it worked pretty well.", "B) The evaluation methodology demonstrated robust algorithmic performance across a large-scale dataset.", "C) The algorithm did well when tested on millions of data points.", "D) It turned out the algorithm handled a lot of data just fine."], "a": 1, "e": "B doğrudur. 'Robust algorithmic performance across a large-scale dataset' teknik dile uygundur.\n\nA, C, D — 'a ton of data,' 'pretty well,' 'just fine' gibi günlük ifadeler teknik register ile uyumsuz."}, {"k": "style", "p": "Proponents of the reform argue that existing zoning regulations perpetuate residential segregation and limit economic mobility for lower-income households. <u>People who want change say the rules keep poor folks stuck where they are.</u>", "q": "Which choice is consistent with the analytical, policy-oriented register?", "o": ["A) People who want change say the rules keep poor folks stuck where they are.", "B) Advocates contend that the existing regulatory framework sustains structural inequities that constrain socioeconomic mobility.", "C) Reformers say the current rules make it hard for low-income people to improve their situation.", "D) Supporters argue that the laws are unfair to people who don't have much money."], "a": 1, "e": "B doğrudur. 'The existing regulatory framework sustains structural inequities that constrain socioeconomic mobility' resmi ve analitik politika diline uygundur.\n\nA, C, D — 'poor folks,' 'stuck where they are,' 'don't have much money' gibi günlük ifadeler politika register ile uyumsuz."}, {"k": "style", "p": "The satellite's onboard sensors detected elevated concentrations of methane in the atmosphere above the target region, consistent with the predicted emissions profile. <u>The satellite found a lot of methane up there, which is what they expected.</u>", "q": "Which choice maintains the scientific register?", "o": ["A) The satellite found a lot of methane up there, which is what they expected.", "B) The sensor data corroborated the projected atmospheric methane concentrations for the target region.", "C) The satellite picked up high methane levels, which matched the predictions.", "D) Methane was found in large amounts, as scientists had predicted."], "a": 1, "e": "B doğrudur. 'The sensor data corroborated the projected atmospheric methane concentrations' kesin bilimsel dil kullanıyor.\n\nA, C, D — 'a lot,' 'up there,' 'picked up,' 'large amounts' gibi günlük ifadeler bilimsel register ile uyumsuz."}, {"k": "style", "p": "The foundation's grant program has supported over three hundred independent research projects across seventeen countries since its inception in 2001. <u>They've funded a bunch of projects worldwide, which is great.</u>", "q": "Which choice maintains the formal register?", "o": ["A) They've funded a bunch of projects worldwide, which is great.", "B) Since its establishment, the program has provided sustained financial support for independent scholarly inquiry at an international scale.", "C) The foundation has given money to lots of researchers around the world.", "D) They've supported many projects globally, which shows how committed they are."], "a": 1, "e": "B doğrudur. 'Sustained financial support for independent scholarly inquiry at an international scale' resmi ve kesindir.\n\nA, C, D — 'a bunch,' 'which is great,' 'lots of researchers,' 'shows how committed' gibi günlük ifadeler resmi register ile uyumsuz."}]}, {"n": 9, "topic": "Pronoun Case — Who/Whom & Reflexives", "diff": "Pronoun Case", "qs": [{"k": "pcase", "p": "The prize will be awarded to <u>whoever</u> submits the most innovative proposal.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 0, "e": "A doğrudur. 'Whoever' bağımlı cümlenin öznesidir ('whoever submits...'). 'To' edat olmasına rağmen zamir kendi cümlesinin öznesidir — 'whoever' kullanılır.\n\nB — 'whomever' nesne formudur; burada zamir 'submits'in öznesi.\nC — 'who' bu cümle yapısında tek başına çalışmaz.\nD — 'whom' nesne formudur."}, {"k": "pcase", "p": "The award was given to <u>whomever</u> the committee deemed most deserving.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 1, "e": "B doğrudur. 'Whomever the committee deemed most deserving' cümlesinde zamir 'deemed'in nesnesidir (the committee deemed whomever). Nesne formu: 'whomever.'\n\nA — 'whoever' özne formudur; burada zamir nesne.\nC — 'who' basit özne formudur.\nD — 'whom' bu yapıda 'whomever'ın yerini tutmaz."}, {"k": "pcase", "p": "The manager asked <u>who</u> was responsible for the error in the report.", "q": "Which pronoun is correct?", "o": ["A) who", "B) whom", "C) whoever", "D) whomever"], "a": 0, "e": "A doğrudur. 'Who' gömülü cümlenin öznesidir ('who was responsible'). 'Was' yardımcı fiili özne zamiri gerektirir.\n\nB — 'whom' nesne formudur; burada zamir 'was'ın öznesi.\nC — 'whoever' belirli olmayan her kişiyi kasteder.\nD — 'whomever' nesne formudur."}, {"k": "pcase", "p": "The investigator could not determine <u>whom</u> the anonymous tip had been directed at.", "q": "Which pronoun is correct?", "o": ["A) who", "B) whom", "C) whoever", "D) whomever"], "a": 1, "e": "B doğrudur. Yeniden yaz: 'the tip had been directed at ___.' Zamir 'at' edatının nesnesidir — 'whom' kullanılır.\n\nA — 'who' özne formudur; burada zamir nesne.\nC — 'whoever' belirli olmayan her kişiyi kasteder.\nD — 'whomever' bağımlı cümle içinde nesne formu için kullanılır; burada 'whom' doğru basit nesne zamiridir."}, {"k": "pcase", "p": "The contract was signed by the two attorneys <u>who</u> had negotiated the terms.", "q": "Which pronoun is correct?", "o": ["A) who", "B) whom", "C) that", "D) whoever"], "a": 0, "e": "A doğrudur. 'Who' ilgi yan cümlesinin öznesidir ('who had negotiated'). Avukatlar eylemi gerçekleştiriyor — özne formu gerekli.\n\nB — 'whom' nesne formudur; burada zamir 'had negotiated'ın öznesi.\nC — 'that' insanlar için kısıtlayıcı yan cümlelerde kullanılabilir ama cümle nonrestrictive (virgüllü); 'who' tercih edilir.\nD — 'whoever' belirli olmayan her kişiyi kasteder."}, {"k": "pcase", "p": "Please forward the message to <u>whoever</u> is managing the project this week.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 0, "e": "A doğrudur. 'Whoever' gömülü cümlenin öznesidir ('whoever is managing'). Tüm cümle 'to'nun nesnesi olsa da zamir kendi cümlesi içinde öznedir.\n\nB — 'whomever' nesne formudur; zamir 'is managing'ın öznesi.\nC — 'who' bu yapıda cümle içinde çalışmaz.\nD — 'whom' nesne formudur."}, {"k": "pcase", "p": "The researchers interviewed participants <u>whom</u> they had recruited from three different cities.", "q": "Which pronoun is correct?", "o": ["A) who", "B) whom", "C) that", "D) whose"], "a": 1, "e": "B doğrudur. Yeniden yaz: 'they had recruited ___.' Zamir 'recruited'ın nesnesidir — 'whom' kullanılır.\n\nA — 'who' özne formudur; burada zamir nesne.\nC — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'whom' insanlar için daha kesindir.\nD — 'whose' iyelik formudur."}, {"k": "pcase", "p": "She is the one <u>whom</u> I believe will lead the department most effectively.", "q": "Which pronoun is correct?", "o": ["A) whom", "B) who", "C) whoever", "D) whomever"], "a": 1, "e": "B doğrudur. 'I believe' parantez içi ek (parenthetical). Zamir 'will lead'in öznesidir. Test: 'she will lead' (özne) → 'who' kullanılır.\n\nA — 'whom' nesne formu; 'I believe' bir eklemedir ve zamir 'will lead'in öznesidir.\nC — 'whoever' belirli olmayan her kişiyi kasteder.\nD — 'whomever' nesne formudur."}, {"k": "pcase", "p": "The director <u>whom</u> won the award gave a lengthy acceptance speech.", "q": "Which pronoun is correct?", "o": ["A) whom", "B) who", "C) that", "D) whose"], "a": 1, "e": "B doğrudur. Zamir 'won'un öznesidir — özne formu 'who' kullanılır. Test: 'she won' (özne değil 'her won').\n\nA — 'whom' nesne formu; burada zamir 'won'un öznesi.\nC — 'that' insanlar için kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' tercih edilir.\nD — 'whose' iyelik formudur."}, {"k": "pcase", "p": "The report was submitted by a consultant <u>whom</u> specializes in regulatory compliance.", "q": "Which pronoun is correct?", "o": ["A) whom", "B) who", "C) that", "D) which"], "a": 1, "e": "B doğrudur. Zamir 'specializes'ın öznesidir — özne formu 'who' kullanılır. Test: 'she specializes' (özne).\n\nA — 'whom' nesne formu; burada zamir özne.\nC — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' insanlar için tercih edilir.\nD — 'which' nesnelere atıfta bulunur."}, {"k": "pcase", "p": "The CEO hired <u>whom</u> she considered the most qualified candidate.", "q": "Which pronoun is correct?", "o": ["A) whom", "B) who", "C) whoever", "D) whomever"], "a": 0, "e": "A doğrudur. Yeniden yaz: 'she considered ___ the most qualified.' Zamir 'considered'ın nesnesidir — 'whom' kullanılır.\n\nB — 'who' özne formudur; burada zamir nesne.\nC — 'whoever' özne formu için gömülü cümlelerde kullanılır.\nD — 'whomever' gömülü cümle içinde nesne formu için kullanılır; bu yapıda 'whom' daha uygun."}, {"k": "pcase", "p": "The committee will invite <u>whoever</u> demonstrates the most thorough understanding of the issues.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 0, "e": "A doğrudur. 'Whoever' gömülü cümlenin öznesidir ('whoever demonstrates'). 'Invite' fiilinin ardından gelse de zamir kendi cümlesinde öznedir.\n\nB — 'whomever' nesne formu; zamir 'demonstrates'ın öznesi.\nC — 'who' gömülü cümlelerde 'whoever'ın yerini tutmaz.\nD — 'whom' nesne formudur."}, {"k": "pcase", "p": "The professor gave extra credit to students <u>whom</u> she felt had worked especially hard.", "q": "Which pronoun is correct?", "o": ["A) whom", "B) who", "C) which", "D) that"], "a": 1, "e": "B doğrudur. 'She felt' parantez içi ek. Zamir 'had worked'ın öznesidir. 'She felt'i çıkar: 'students who had worked' → özne formu 'who.'\n\nA — 'whom' nesne olduğunda kullanılır; burada zamir 'had worked'ın öznesidir.\nC — 'which' nesnelere atıfta bulunur.\nD — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' insanlar için tercih edilir."}, {"k": "pcase", "p": "The scholarship will be granted to <u>whomever</u> the selection committee recommends.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 1, "e": "B doğrudur. 'Whomever the selection committee recommends' gömülü cümlesinde zamir 'recommends'in nesnesidir. Nesne formu: 'whomever.'\n\nA — 'whoever' özne formudur; burada zamir nesne.\nC — 'who' basit özne formudur.\nD — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır."}, {"k": "pcase", "p": "The athlete <u>herself</u> was surprised by the record-breaking performance.", "q": "Which choice correctly uses a reflexive or intensive pronoun?", "o": ["A) herself", "B) her", "C) she", "D) hers"], "a": 0, "e": "A doğrudur. 'Herself' burada yoğunlaştırıcı (intensive pronoun) olarak kullanılıyor — sporcunun bizzat şaşırdığını vurguluyor.\n\nB — 'her' nesne zamiridir; yoğunlaştırıcı işlevi göremez.\nC — 'she' özne zamiridir; yoğunlaştırıcı değil.\nD — 'hers' iyelik zamiridir."}, {"k": "pcase", "p": "The director and <u>myself</u> reviewed the final budget projections before the board meeting.", "q": "Which pronoun is correct?", "o": ["A) myself", "B) me", "C) I", "D) mine"], "a": 2, "e": "C doğrudur. 'The director and I' bileşik öznedir — 'I' özne zamiridir. Dönüşlü zamirler (myself) bileşik öznelerde özne zamirinin yerini tutamaz.\n\nA — 'myself' bileşik özne olamaz; yaygın bir hatadır.\nB — 'me' nesne zamiridir.\nD — 'mine' iyelik zamiridir."}, {"k": "pcase", "p": "The award was presented to my colleague and <u>I</u> at the annual conference.", "q": "Which pronoun is correct?", "o": ["A) I", "B) me", "C) myself", "D) mine"], "a": 1, "e": "B doğrudur. 'The award was presented to my colleague and me' — 'me' 'to' edatının nesnesidir. Test: 'my colleague and'ı çıkar → 'presented to me' (I değil).\n\nA — 'I' özne zamiridir; bu bir nesne konumudur.\nC — 'myself' basit nesne zamirinin yerini tutamaz.\nD — 'mine' iyelik zamiridir."}, {"k": "pcase", "p": "Between you and <u>I</u>, the project was managed poorly from the start.", "q": "Which pronoun is correct?", "o": ["A) I", "B) me", "C) myself", "D) mine"], "a": 1, "e": "B doğrudur. 'Between you and me' — 'me' 'between' edatının nesnesidir. Edatlar her zaman nesne zamiri alır.\n\nA — 'I' özne zamiridir; edatlar nesne zamiri gerektirir.\nC — 'myself' edatın basit nesnesi olarak kullanılamaz.\nD — 'mine' iyelik zamiridir."}, {"k": "pcase", "p": "The manager <u>himself</u> admitted that the scheduling error was avoidable.", "q": "Which choice correctly uses a reflexive or intensive pronoun?", "o": ["A) himself", "B) him", "C) his", "D) hers"], "a": 0, "e": "A doğrudur. 'Himself' burada yoğunlaştırıcı olarak kullanılıyor — müdürün bizzat itiraf ettiğini vurguluyor.\n\nB — 'him' nesne zamiridir; özneyi yoğunlaştıramaz.\nC — 'his' iyelik zamiridir.\nD — 'hers' başka bir kişiye atıfta bulunur."}, {"k": "pcase", "p": "The students should ask <u>whomever</u> they see in the office for a copy of the form.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 1, "e": "B doğrudur. 'Whomever they see in the office' gömülü cümlesinde zamir 'see'nin nesnesidir (they see whomever). Nesne formu: 'whomever.'\n\nA — 'whoever' özne formu; burada zamir 'see'nin nesnesi.\nC — 'who' basit özne formudur.\nD — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır."}, {"k": "pcase", "p": "It was <u>her</u> who discovered the discrepancy in the financial records.", "q": "Which pronoun is correct?", "o": ["A) her", "B) she", "C) herself", "D) hers"], "a": 1, "e": "B doğrudur. 'It was she who discovered...' — resmi dilbilgisi standardı 'she' gerektirir çünkü ilgi yan cümlesinin öznesidir ('who discovered'). 'It was' den sonra 'to be' fiilinin tamamlayıcısı özne formunda olmalıdır.\n\nA — 'her' nesne formu; resmi dilbilgisi özne formu gerektirir.\nC — 'herself' dönüşlü/yoğunlaştırıcı; burada yanlış.\nD — 'hers' iyelik zamiridir."}, {"k": "pcase", "p": "The scholarship committee invited the finalist and <u>her</u> to present before the full board.", "q": "Which pronoun is correct?", "o": ["A) her", "B) she", "C) herself", "D) hers"], "a": 0, "e": "A doğrudur. 'Invited the finalist and her' — 'her' 'invited'ın nesnesidir. Test: 'the finalist and'ı çıkar → 'the committee invited her.' Nesne zamiri.\n\nB — 'she' özne zamiridir; bu bir nesne konumudur.\nC — 'herself' basit nesne zamirinin bileşik nesne konumunda yerini tutamaz.\nD — 'hers' iyelik zamiridir."}, {"k": "pcase", "p": "The board members expressed <u>themself</u> confidently during the press conference.", "q": "Which pronoun is correct?", "o": ["A) themself", "B) themselves", "C) theirself", "D) theirselves"], "a": 1, "e": "B doğrudur. 'The board members' çoğuldur — dönüşlü zamir çoğul olmalı: 'themselves.'\n\nA — 'themself' tekil cinsiyet nötr dönüşlü zamir olarak kullanılabilir ama açıkça çoğul bir özne için yanlış.\nC — 'theirself' standart İngilizcede yoktur.\nD — 'theirselves' standart İngilizcede yoktur."}, {"k": "pcase", "p": "No one but <u>she</u> could have solved the problem in under two minutes.", "q": "Which pronoun is correct?", "o": ["A) she", "B) her", "C) herself", "D) hers"], "a": 0, "e": "A doğrudur. Bu yapıda 'but' 'except' anlamına gelir ve özne konumunda olduğundan SAT özne formu 'she'yi kabul eder. Test: 'she could have solved' (özne-fiil uyumu) → özne formu.\n\nB — 'her' bir nesne konumunda kullanılırdı: 'No one but her was present' (nesne). Burada zamir 'could have solved'un anlaşılan öznesidir.\nC — 'herself' dönüşlü; burada yanlış.\nD — 'hers' iyelik zamiridir."}, {"k": "pcase", "p": "The firm promoted <u>whoever</u> the senior partners had unanimously endorsed for the partnership track.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 1, "e": "B doğrudur. 'Whomever the senior partners had unanimously endorsed' gömülü cümlesinde zamir 'endorsed'ın nesnesidir (the senior partners endorsed whomever). Nesne formu: 'whomever.'\n\nA — 'whoever' özne formu; burada zamir 'endorsed'ın nesnesidir.\nC — 'who' basit özne formudur.\nD — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır."}]}, {"n": 10, "topic": "Mixed Grammar Review III", "diff": "Mixed Grammar Review III", "qs": [{"k": "mix3", "p": "The company's <u>its</u> new headquarters was designed by a renowned architect from Barcelona.", "q": "Which choice is correct?", "o": ["A) company's its", "B) company's", "C) companies' its", "D) companies its"], "a": 1, "e": "B doğrudur. 'The company's new headquarters' — 'company's' iyeliği yeterlidir. 'Its' gereksiz ikinci iyelik oluşturur.\n\nA — iki iyelik formu gereksizdir.\nC — çoğul iyelik + gereksiz zamir.\nD — çoğul ama iyelik işareti yok + gereksiz zamir."}, {"k": "mix3", "p": "The report was criticized by <u>whoever</u> had read it most carefully — and that was her.", "q": "Which pronoun is correct?", "o": ["A) whoever", "B) whomever", "C) who", "D) whom"], "a": 0, "e": "A doğrudur. 'Whoever had read it most carefully' — zamir 'had read'in öznesidir. Tüm cümle 'by' edatının ardından gelse de zamir kendi cümlesinde öznedir. 'Whoever' doğrudur.\n\nB — 'whomever' nesne formu; burada zamir 'had read'in öznesidir — YANLIŞ. Bu soru öğrencilerin edattan sonra yanlışlıkla 'whomever' kullanıp kullanmadığını test ediyor.\nC — 'who' gömülü cümle yapısında yetersiz.\nD — 'whom' nesne formudur."}, {"k": "mix3", "p": "Each of the participants <u>have</u> been assigned to a different research group.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) are", "D) were"], "a": 1, "e": "B doğrudur. 'Each' her zaman tekildir. 'Each of the participants has been assigned.' Edat öbeğini çıkarın.\n\nA — 'have' 'participants'a uyuyor, özne 'each'e değil.\nC — 'are' çoğul geniş zamandır.\nD — 'were' geçmiş çoğuldur."}, {"k": "mix3", "p": "The attorney advised the client <u>not revealing</u> any additional information to the opposing counsel.", "q": "Which verb form is correct?", "o": ["A) not revealing", "B) to not reveal", "C) not to reveal", "D) not to be revealing"], "a": 2, "e": "C doğrudur. 'Advise someone to do something' — olumsuz mastar 'not'u 'to'dan önce koyar: 'advised the client not to reveal.'\n\nA — 'not revealing' bu yapıda standart değildir.\nB — 'to not reveal' bölünmüş mastar (split infinitive); 'not to reveal' tercih edilir.\nD — 'not to be revealing' süregelen mastar gereksizdir."}, {"k": "mix3", "p": "The data collected over five years <u>suggest</u> that dietary habits are more influential than previously assumed.", "q": "Which verb form is correct?", "o": ["A) suggest", "B) suggests", "C) are suggesting", "D) have been suggesting"], "a": 1, "e": "B doğrudur. 'Data' modern SAT kullanımında tekil sayılır ('information' gibi). 'The data suggests.'\n\nA — 'suggest' 'data'yı çoğul sayar — bazı akademik stillerde kabul edilebilir ama SAT 'data'yı tekil kullanır.\nC — geniş zaman süregelen burada uygun değildir.\nD — present perfect süregelen genel bir bulgu için uygun değildir."}, {"k": "mix3", "p": "The discovery <u>which</u> the expedition team made was entirely unexpected.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) that", "C) who", "D) whose"], "a": 1, "e": "B doğrudur. 'That the expedition team made' hangi keşif olduğunu belirten kısıtlayıcı yan cümledir. 'That' kullanılır; 'which' virgülsüz SAT'ta standart değildir.\n\nA — 'which' virgülsüz kısıtlayıcı yan cümleler için SAT'ta standart değildir.\nC — 'who' insanlara atıfta bulunur.\nD — 'whose' iyelik formudur."}, {"k": "mix3", "p": "Neither the new policy nor the existing regulations <u>are</u> sufficient to address the emerging issue.", "q": "Which verb is correct?", "o": ["A) are", "B) is", "C) were", "D) was"], "a": 0, "e": "A doğrudur. 'Neither...nor' yapısında en yakın özneyle uyuşulur. 'The existing regulations' çoğul → 'are.'\n\nB — 'is' 'the new policy'ye uyuyor, en yakın 'existing regulations'a değil.\nC — 'were' geçmiş çoğuldur.\nD — 'was' geçmiş tekildir."}, {"k": "mix3", "p": "The novel <u>published</u> in 1851, Moby-Dick initially received poor reviews from contemporary critics.", "q": "Which choice correctly handles the nonrestrictive element?", "o": ["A) The novel published in 1851, Moby-Dick initially received", "B) The novel, published in 1851, Moby-Dick initially received", "C) Moby-Dick, published in 1851, initially received", "D) Published in 1851, Moby-Dick's initial reviews were poor"], "a": 2, "e": "C doğrudur. 'Moby-Dick, published in 1851, initially received...' — 'published in 1851' katılımcı öbeği nitelediği ismin (Moby-Dick) hemen yanında ve virgüllerle doğru şekilde kapatılmış.\n\nA — 'The novel published in 1851, Moby-Dick' belirsiz appositive yapısı.\nB — 'Moby-Dick'i appositive olarak sonraya koyuyor; garip.\nD — 'Moby-Dick'in initial reviews were poor' özneyi ve sesi değiştiriyor."}, {"k": "mix3", "p": "The study's conclusions are more persuasive than <u>previous studies</u> on the same topic.", "q": "Which revision corrects the faulty comparison?", "o": ["A) previous studies", "B) those of previous studies", "C) that of previous studies", "D) previous studies' conclusions"], "a": 1, "e": "B doğrudur. 'Conclusions' (çoğul) çalışmalarla değil, önceki çalışmaların sonuçlarıyla karşılaştırılmalı. 'Those of previous studies' çoğuldur.\n\nA — sonuçları çalışmalarla karşılaştırır — mantıksız.\nC — 'that' tekildir; sonuçlar çoğuldur.\nD — dilbilgisel olarak doğru ama B'den uzun."}, {"k": "mix3", "p": "Having reviewed all the applications, <u>a decision was made by the committee</u>.", "q": "Which choice avoids the dangling modifier?", "o": ["A) a decision was made by the committee", "B) the committee made a decision", "C) the decision was the committee's", "D) the committee's decision was made"], "a": 1, "e": "B doğrudur. 'Having reviewed all the applications' komite tarafından yapılıyor. Ana cümle 'the committee' ile başlamalı.\n\nA — 'a decision' başvuruları inceleyemez; sarkan belirteç (dangling modifier).\nC — garip yapı; dilbilgisel olarak eşdeğer değil.\nD — pasif; belirteç sorunu devam ediyor."}, {"k": "mix3", "p": "The engineer suggested <u>to redesign</u> the interface to reduce user errors.", "q": "Which verb form is correct?", "o": ["A) to redesign", "B) redesigning", "C) having redesigned", "D) redesign"], "a": 1, "e": "B doğrudur. 'Suggest' gerund alır: 'suggested redesigning.'\n\nA — 'suggested to redesign' standart değildir.\nC — 'having redesigned' önceden tamamlanmışlık ima eder.\nD — 'suggest redesign' dilbilgisel değildir."}, {"k": "mix3", "p": "The task force was asked to evaluate both the cost <u>and assessing the feasibility</u> of the proposed expansion.", "q": "Which choice maintains parallel structure?", "o": ["A) and assessing the feasibility", "B) and the feasibility", "C) and also feasibility assessment", "D) in addition to feasibility"], "a": 1, "e": "B doğrudur. 'Both the cost and the feasibility' — paralel isim öbekleri.\n\nA — 'both the cost and assessing the feasibility' ismi gerund öbeğiyle karıştırıyor; paralel değil.\nC — 'also feasibility assessment' garip ve paralel değil.\nD — 'in addition to' 'both...and' yapısını bozuyor."}, {"k": "mix3", "p": "<u>Whomever</u> leaves the office last is responsible for locking up.", "q": "Which pronoun is correct?", "o": ["A) Whomever", "B) Whoever", "C) Whom", "D) Who"], "a": 1, "e": "B doğrudur. 'Whoever leaves the office last' — zamir 'leaves'in öznesidir. Özne formu: 'whoever.' Hem ana cümlenin öznesi hem de 'leaves'in öznesi olarak zamir kendi cümlesinde özne olduğundan belirleyici.\n\nA — 'Whomever' nesne formu; burada zamir 'leaves'in öznesidir.\nC — 'Whom' basit nesne formudur.\nD — 'Who' basit özne formudur; gömülü cümlelerde 'whoever' kullanılır."}, {"k": "mix3", "p": "The professor <u>which</u> wrote the textbook is retiring at the end of the academic year.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) that", "C) who", "D) whom"], "a": 2, "e": "C doğrudur. 'Who' insanlara atıfta bulunur. 'The professor who wrote the textbook' — profesör bir insandır; 'who' kullanılır.\n\nA — 'which' nesnelere atıfta bulunur.\nB — 'that' kısıtlayıcı yan cümlelerde insanlar için kullanılabilir ama 'who' tercih edilir.\nD — 'whom' nesne formu; burada zamir 'wrote'un öznesidir."}, {"k": "mix3", "p": "The decision to <u>not pursue</u> the acquisition was supported by a majority of the board.", "q": "Which choice is correct?", "o": ["A) not pursue", "B) not to pursue", "C) pursue not", "D) not pursuing"], "a": 0, "e": "A doğrudur. 'The decision to not pursue' bölünmüş mastar (split infinitive) kullanır; modern İngilizce'de geniş çapta kabul edilmektedir.\n\nB — 'not to pursue' geleneksel bölünmemiş form; da doğrudur.\nC — 'pursue not' standart değildir.\nD — 'not pursuing' gerund yapısını değiştirir."}, {"k": "mix3", "p": "Everyone on the committee is expected to bring <u>their</u> notes to the annual review session.", "q": "Which pronoun is correct?", "o": ["A) his", "B) her", "C) their", "D) its"], "a": 2, "e": "C doğrudur. 'Everyone' cinsiyeti belirsiz tekil belirsiz zamirdir. SAT cinsiyet nötr tekil 'they/their' kullanımını kabul eder.\n\nA — 'his' erkek cinsiyet varsayar.\nB — 'her' kadın cinsiyet varsayar.\nD — 'its' nesnelere atıfta bulunur."}, {"k": "mix3", "p": "The company's environmental record is better than <u>our competitors</u>.", "q": "Which revision corrects the faulty comparison?", "o": ["A) our competitors", "B) those of our competitors", "C) that of our competitors", "D) our competitors' records"], "a": 2, "e": "C doğrudur. 'Environmental record' (tekil) rakiplerin çevre siciliyle karşılaştırılmalı. 'That of our competitors' = 'rakiplerimizin çevre sicili.'\n\nA — sicili şirketlerle karşılaştırır — mantıksız.\nB — 'those' çoğuldur; sicil tekildir.\nD — dilbilgisel olarak doğru ama C'den uzun."}, {"k": "mix3", "p": "The board was <u>very unique</u> in its approach to governance, blending traditional oversight with innovative transparency measures.", "q": "Which choice is most concise and correct?", "o": ["A) very unique", "B) extremely unique", "C) unique", "D) exceptionally one-of-a-kind"], "a": 2, "e": "C doğrudur. 'Unique' tek türünde anlamına gelir; 'very' veya 'extremely' ile nitelendirilemez. Mutlak sıfattır.\n\nA — 'very unique' gereksiz tekrardır.\nB — 'extremely unique' de gereksiz tekrardır.\nD — 'one-of-a-kind' 'unique'in zaten söylediğini tekrar eder."}, {"k": "mix3", "p": "The analyst, <u>who's</u> report was leaked to the press, was placed on administrative leave.", "q": "Which word is correct?", "o": ["A) who's", "B) whose", "C) whos", "D) whos'"], "a": 1, "e": "B doğrudur. 'Whose' iyelik ilgi zamiridir — 'whose report' = 'analistin raporu.' 'Who's' = 'who is' demektir; burada anlamsız olur.\n\nA — 'who's' = 'who is'; 'the analyst, who is report' saçmadır.\nC — 'whos' bir sözcük değildir.\nD — 'whos'' bir sözcük değildir."}, {"k": "mix3", "p": "The two divisions must coordinate <u>between themselves</u> to ensure consistent implementation of the policy.", "q": "Which choice is correct?", "o": ["A) between themselves", "B) between each other", "C) among themselves", "D) with themselves"], "a": 0, "e": "A doğrudur. 'Between themselves' iki birim için doğrudur. 'Between' iki şey için, 'among' üç veya daha fazla şey için kullanılır.\n\nB — 'between each other' da kabul edilebilir ama biraz gayri resmi.\nC — 'among themselves' üç veya daha fazla tarafı ima eder.\nD — 'with themselves' deyimsel değildir."}, {"k": "mix3", "p": "The lab technician <u>who</u> the supervisor trained became the department's most reliable analyst.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) whom", "C) whose", "D) which"], "a": 1, "e": "B doğrudur. Yeniden yaz: 'the supervisor trained ___.' Zamir 'trained'ın nesnesidir — nesne formu 'whom' kullanılır.\n\nA — 'who' özne formu; burada zamir nesne.\nC — 'whose' iyelik formudur.\nD — 'which' nesnelere atıfta bulunur."}, {"k": "mix3", "p": "Having finished the draft, <u>the printer was out of ink</u>, which delayed the submission.", "q": "Which choice avoids the dangling modifier?", "o": ["A) the printer was out of ink", "B) the researcher discovered the printer was out of ink", "C) it was discovered that the printer was out of ink", "D) a lack of ink in the printer caused a delay"], "a": 1, "e": "B doğrudur. 'Having finished the draft' bir araştırmacı tarafından yapılıyor (ima edilmiş). Ana cümle o kişiyle başlamalı. 'The researcher discovered' sarkan belirteci düzeltiyor.\n\nA — 'the printer' taslak bitiremez; sarkan belirteç.\nC — 'it was discovered' taslak bitiremez; kişisiz özne.\nD — 'a lack of ink' taslak bitiremez; sarkan belirteç."}, {"k": "mix3", "p": "The committee decided to <u>not accepting</u> any late applications for the grant cycle.", "q": "Which verb form is correct?", "o": ["A) not accepting", "B) not accept", "C) not to accept", "D) not have accepted"], "a": 1, "e": "B doğrudur. 'Decided to' mastar alır: 'decided not to accept' veya 'decided to not accept.' Her iki durumda da yalın fiil kullanılır.\n\nA — 'to not accepting' mastar işaretçisini gerundla karıştırıyor.\nC — 'decided to not to accept' gereksiz çift 'to' olurdu; 'not to accept' 'decided'dan sonra standart değil.\nD — 'not have accepted' önceden tamamlanmış eylemi ima eder."}, {"k": "mix3", "p": "The new regulations apply to all organizations <u>which</u> employ more than one hundred full-time workers.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) that", "C) who", "D) whom"], "a": 1, "e": "B doğrudur. 'That employ more than one hundred full-time workers' hangi organizasyonları kapsadığını belirten kısıtlayıcı yan cümledir. 'That' kullanılır.\n\nA — 'which' virgülsüz kısıtlayıcı yan cümleler için SAT'ta standart değildir.\nC — 'who' insanlara atıfta bulunur; organizasyonlar tüzel kişiliklerdir.\nD — 'whom' insanlar için nesne formudur."}, {"k": "mix3", "p": "Each of the four seasons <u>have</u> its own distinct characteristics that appeal to different preferences.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) are", "D) were"], "a": 1, "e": "B doğrudur. 'Each' her zaman tekildir. 'Each of the four seasons has its own distinct characteristics.'\n\nA — 'have' 'seasons'a uyuyor, özne 'each'e değil.\nC — 'are' çoğul geniş zamandır.\nD — 'were' geçmiş çoğuldur."}]}];

  // ── State ──
  var curSet=null, idx=0, ANS=[];
  var completed={};

  // ── Pack home ──
  function showPackHome(){
    var _ph=document.getElementById('pack-home');_ph.style.display='flex';_ph.style.flexDirection='column';
    document.getElementById('quiz-wrapper').style.display='none';
    document.getElementById('set-complete').classList.remove('show');
    window.scrollTo(0,0);
    renderPackHome();
  }

  function renderPackHome(){
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    var done=Object.keys(completed).length;
    var fill=document.getElementById('ph-fill');
    var lbl=document.getElementById('ph-prog-label');
    if(fill)fill.style.width=(done*10)+'%';
    if(lbl)lbl.textContent=done+' / 10 Set Tamamland\u0131';
    var grid=document.getElementById('set-grid');
    if(!grid)return;
    grid.innerHTML='';
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    for(var i=1;i<=10;i++){
      var s=ALL_SETS[i];var c=completed[i];
      var pct=c?Math.round(c.score/c.total*100):null;
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 14px;background:'+(c?'#ccfbf1':'#fff')+';border-radius:12px;margin-bottom:8px;cursor:pointer;border:1.5px solid '+(c?'#0d9488':'#ccfbf1')+';box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s;';
      row.onmouseenter=function(){this.style.boxShadow='0 4px 14px rgba(0,0,0,.12)';};
      row.onmouseleave=function(){this.style.boxShadow='0 1px 4px rgba(0,0,0,.05)';};
      var numDiv=document.createElement('div');
      numDiv.style.cssText='width:40px;height:40px;min-width:40px;border-radius:50%;background:'+(c?'#0d5e57':'#0d9488')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:monospace;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);';
      numDiv.textContent=c?'\u2713':i;
      var body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0;';
      var topicEl=document.createElement('div');
      topicEl.style.cssText='font-size:14px;font-weight:700;color:#134e4a;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;';
      topicEl.textContent=s.topic;
      var diffEl=document.createElement('span');
      diffEl.style.cssText='display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0d9488;background:#ccfbf1;border-radius:50px;padding:2px 8px;margin-top:4px;';
      diffEl.textContent=DIFFS[i-1];
      body.appendChild(topicEl);body.appendChild(diffEl);
      var right=document.createElement('div');
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;';
      if(c){
        var scoreEl=document.createElement('span');
        scoreEl.style.cssText='font-size:11px;font-weight:800;color:#fff;background:#0d9488;padding:2px 8px;border-radius:50px;white-space:nowrap;';
        scoreEl.textContent=c.score+'/'+c.total+' \u00b7 '+pct+'%';
        right.appendChild(scoreEl);
      }
      var ctaEl=document.createElement('span');
      ctaEl.style.cssText='font-size:11px;font-weight:700;color:#0d9488;border:1.5px solid #0d9488;border-radius:6px;padding:3px 10px;white-space:nowrap;';
      ctaEl.textContent=c?'Tekrar \u2192':'Ba\u015fla \u2192';
      right.appendChild(ctaEl);
      row.appendChild(numDiv);row.appendChild(body);row.appendChild(right);
      (function(n,r){
        r.addEventListener('click',function(){startSet(n);});
        r.addEventListener('touchend',function(e){e.preventDefault();startSet(n);});
      })(i,row);
      grid.appendChild(row);
    }
  }
  // ── Quiz engine ──
  function startSet(n){
    curSet=n;
    idx=0;
    ANS=new Array(ALL_SETS[n].qs.length).fill(null);
    document.getElementById('pack-home').style.display='none';
    document.getElementById('quiz-wrapper').style.display='flex';
    document.getElementById('set-complete').classList.remove('show');
    document.getElementById('tb-setlabel').textContent='SAT Reading & Writing · Grammar Pack 3 · Set '+n+' · '+ALL_SETS[n].topic;
    render();
  }

  var qarea=null,qnum=null,prog=null;
  function render(){
    if(!qarea){qarea=document.getElementById('qarea');qnum=document.getElementById('qnum');prog=document.getElementById('prog');}
    var q=ALL_SETS[curSet].qs[idx];
    var qs=ALL_SETS[curSet].qs;
    prog.style.width=((idx+1)/qs.length*100)+'%';
    qnum.textContent='Q '+(idx+1)+' / '+qs.length;
    var tracker=document.getElementById('tracker');
    tracker.innerHTML='';
    qs.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='dot'+(ANS[i]!==null?' ans':'')+(i===idx?' cur':'');
      (function(ii){d.onclick=function(){idx=ii;render();}}) (i);
      tracker.appendChild(d);
    });
    qarea.innerHTML='';
    var pbox=document.createElement('div');pbox.className='pbox';
    if(q.p!==undefined){
      var txt=q.p;
      if(txt.indexOf('___')!==-1){
        txt='<span style="font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;display:block;margin-bottom:.7rem">'+
          (q.k||'')+'</span>'+txt.replace('___','<span style="display:inline-block;width:140px;border-bottom:2px solid currentColor;vertical-align:bottom;margin:0 4px"></span>');
      }
      pbox.innerHTML=txt;
    } else if(q.passage!==undefined){pbox.innerHTML=q.passage;}
    qarea.appendChild(pbox);
    // Support both formats: q.question (new) or q.q (old)
    var questionText=q.question||q.q;
    if(questionText){var qt=document.createElement('div');qt.className='qtxt';qt.textContent=questionText;qarea.appendChild(qt);}
    // Support: q.choices (new obj array), q.opts (old string array), q.o (old string array)
    var choices=q.choices||q.opts||q.o;
    if(choices){
      choices.forEach(function(c,i){
        var btn=document.createElement('button');
        // Old format: answer is numeric index; new format: answer is letter
        var isSelected=(q.a!==undefined)?ANS[idx]===i:ANS[idx]===i;
        btn.className='opt'+(ANS[idx]===i?' sel':'');
        var lbl=(typeof c==='object')?c.label:c.charAt(0);
        var txt=(typeof c==='object')?c.text:c.slice(3);
        btn.innerHTML='<span class="ol">'+lbl+'</span><span>'+txt+'</span>';
        (function(ii){btn.onclick=function(){ANS[idx]=ii;render();}}) (i);
        qarea.appendChild(btn);
      });
    }
    var nav=document.createElement('div');nav.className='nav-row';
    var prev=document.createElement('button');prev.className='btn-n';prev.textContent='Previous';prev.disabled=idx===0;
    prev.onclick=function(){idx--;render();};
    nav.appendChild(prev);
    var done=ANS.filter(function(a){return a!==null;}).length;
    if(idx===qs.length-1){
      var sub=document.createElement('button');sub.className='btn-sub';
      sub.textContent='Submit ('+done+'/'+qs.length+')';sub.onclick=showSetComplete;nav.appendChild(sub);
    } else {
      var next=document.createElement('button');next.className='btn-n';next.textContent='Next';
      next.onclick=function(){idx++;render();};nav.appendChild(next);
    }
    qarea.appendChild(nav);
  }

  function getChoices(q){return q.choices||q.opts||q.o;}
  function isCorrect(q,selectedIdx){
    // Old format: q.a is numeric index
    if(q.a!==undefined&&typeof q.a==='number') return selectedIdx===q.a;
    // New format: q.answer is a letter
    var choices=getChoices(q);
    if(!choices||selectedIdx===null||selectedIdx===undefined)return false;
    var c=choices[selectedIdx];
    var selectedLabel=(typeof c==='object')?c.label:c.charAt(0);
    return selectedLabel===(q.answer||'A');
  }
  function getCorrectChoice(q){
    var choices=getChoices(q);
    if(!choices)return null;
    if(q.a!==undefined&&typeof q.a==='number') return choices[q.a];
    var lbl=q.answer||'A';
    return choices.find(function(c){return (typeof c==='object'?c.label:c.charAt(0))===lbl;});
  }
  function choiceText(c){
    if(!c)return '';
    return (typeof c==='object')?c.text:c.slice(3);
  }
  function showSetComplete(){
    var qs=ALL_SETS[curSet].qs;
    var score=0;
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))score++;
    });
    completed[curSet]={score:score,total:qs.length};
    var pct=Math.round(score/qs.length*100);
    var msg=pct>=80?'Mükemmel!':pct>=60?'Gayet iyi!':'Tekrar dene.';
    document.getElementById('quiz-wrapper').style.display='none';
    var sc=document.getElementById('set-complete');
    sc.classList.add('show');
    document.getElementById('scc-setnum').textContent=curSet;
    document.getElementById('scc-score').textContent=score;
    document.getElementById('scc-total').textContent=qs.length;
    document.getElementById('scc-pct').textContent=pct+'% — '+msg;
    var nextBtn=document.getElementById('scc-next');
    nextBtn.style.display=curSet<10?'':'none';
    // Review
    var rev=document.getElementById('scc-review');rev.innerHTML='';
    var title=document.createElement('div');title.className='scc-review-title';
    title.textContent='Yanlış Cevaplar';rev.appendChild(title);
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))return;
      var choices=getChoices(q);
      var selected=choices&&ANS[i]!==null?choices[ANS[i]]:null;
      var correctChoice=getCorrectChoice(q);
      var correctText=choiceText(correctChoice);
      var wrongText=selected?choiceText(selected):'Cevap verilmedi';
      var wi=document.createElement('div');wi.className='wi';
      var pText=(q.p||q.passage||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().substring(0,70);
      var expl=q.explanation||q.e||'';
      wi.innerHTML='<div class="wh"><span class="wh-n">Q'+(i+1)+'</span><span class="wh-q">'+pText+'...</span><span class="wh-badge w">✗</span></div>'+
        '<div class="wb" style="display:none;padding:.8rem .9rem">'+
        '<div class="aw">'+wrongText+'</div>'+
        '<div class="ac">Doğru: '+correctText+'</div>'+
        (expl?'<div class="expl"><div class="expl-head"><img class="expl-cat" src="'+griCat()+'" alt="Gri"/><span class="expl-label">Gri diyor ki:</span></div><div class="expl-body">'+expl+'</div></div>':'')+'</div>';
      wi.querySelector('.wh').onclick=function(){var wb=wi.querySelector('.wb');wb.style.display=wb.style.display==='block'?'none':'block';};
      rev.appendChild(wi);
    });
    if(rev.children.length<=1){title.textContent='Tüm cevaplar doğru! ✓';}
    window.scrollTo(0,0);
  }

  function retakeSet(){startSet(curSet);}
  function goNextSet(){if(curSet<10)startSet(curSet+1);}


    (function(){
    var dg=document.getElementById('cv-dots-inner');
    if(dg){for(var i=0;i<25;i++){var s=document.createElement('span');dg.appendChild(s);}}
  })();

  showPackHome();

</script>
