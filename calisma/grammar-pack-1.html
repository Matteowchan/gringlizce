' refers to things."}, {"k": "Relative Clauses", "p": "The neighborhood <u>______</u> the incident occurred has since undergone significant revitalization.", "q": "Which relative phrase is correct?", "o": ["A) where", "B) in which", "C) that", "D) A or B"], "a": 3, "e": "D is correct. Both 'where' and 'in which' correctly introduce a relative clause of place. 'The neighborhood where...' and 'the neighborhood in which...' are both grammatically correct, with 'in which' being more formal.\n\nA — 'where' alone is correct.\nB — 'in which' alone is correct.\nC — 'that the incident occurred' is missing the preposition 'in.'"}, {"k": "Relative Clauses", "p": "The manuscript, <u>______</u> pages had been damaged by moisture, required extensive conservation before it could be digitized.", "q": "Which relative pronoun is correct?", "o": ["A) which", "B) that", "C) whose", "D) who"], "a": 2, "e": "C is correct. 'Whose pages had been damaged by moisture' — 'whose' shows that the pages belong to the manuscript. Non-restrictive clause about a thing.\n\nA — 'which pages' is grammatically incorrect.\nB — 'that' is not used in non-restrictive clauses and cannot show possession.\nD — 'who' refers to people."}]}, {"n": 10, "topic": "Mixed Grammar Review", "diff": "Mixed Grammar Review", "qs": [{"k": "Subject-Verb", "p": "The collection of artifacts discovered at the site <u>______</u> now on display at the national museum.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. Strip 'of artifacts discovered at the site.' The subject is 'collection' (singular). 'Is' is correct.\n\nA — 'are' agrees with 'artifacts,' not the subject.\nB — 'were' is past plural.\nD — 'have been' is plural present perfect."}, {"k": "Boundaries", "p": "The expedition team spent three weeks in the field, they collected over four hundred specimens for analysis.", "q": "Which revision corrects this sentence?", "o": ["A) No change needed.", "B) field; they collected", "C) field, and collected", "D) field collecting"], "a": 1, "e": "B is correct. The original is a comma splice — two independent clauses joined by only a comma. A semicolon correctly separates them.\n\nA — the original is a comma splice.\nC — 'and collected' drops the subject 'they,' making the second clause not parallel.\nD — 'field collecting' makes 'collecting' a participial phrase modifying 'team,' losing the original meaning."}, {"k": "Modifiers", "p": "Reviewing the budget carefully, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) several inconsistencies were identified by the auditor.", "B) the auditor identified several inconsistencies.", "C) identification of several inconsistencies was made.", "D) several inconsistencies became apparent."], "a": 1, "e": "B is correct. 'Reviewing the budget carefully' is performed by the auditor. The main clause must open with 'the auditor.'\n\nA — 'several inconsistencies' cannot review the budget.\nC — 'identification' cannot review the budget.\nD — 'several inconsistencies' cannot review the budget."}, {"k": "Parallel Structure", "p": "The curriculum was designed to challenge students intellectually, to develop their collaborative skills, <u>______</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and preparing them for professional environments.", "B) and to prepare them for professional environments.", "C) and preparation for professional environments.", "D) and their preparation for professional environments."], "a": 1, "e": "B is correct. The list uses 'to + verb' infinitives: 'to challenge,' 'to develop.' The third item must be 'to prepare.'\n\nA — 'preparing' is a gerund.\nC — 'preparation' is a noun phrase.\nD — 'their preparation' is a noun phrase."}, {"k": "Verb Tense", "p": "By the time the new director arrived, the organization <u>______</u> three consecutive years of budget deficits.", "q": "Which verb form is correct?", "o": ["A) experienced", "B) was experiencing", "C) had experienced", "D) has experienced"], "a": 2, "e": "C is correct. 'By the time the new director arrived' signals that the budget deficits occurred before the arrival. Past perfect 'had experienced' is correct.\n\nA — simple past does not clarify the sequence.\nB — 'was experiencing' implies the deficits were ongoing at the time of arrival.\nD — 'has experienced' is present perfect."}, {"k": "Pronouns", "p": "The university announced that <u>______</u> would expand enrollment in its engineering programs by fifteen percent.", "q": "Which pronoun is correct?", "o": ["A) they", "B) it", "C) he", "D) one"], "a": 1, "e": "B is correct. 'The university' is a singular institutional entity. 'It' is the correct pronoun.\n\nA — 'they' is plural.\nC — 'he' has no antecedent.\nD — 'one' is impersonal and does not refer back to 'the university.'"}, {"k": "Relative Clauses", "p": "The treaty, <u>______</u> ratification required approval from twelve separate member states, took four years to enter into force.", "q": "Which relative pronoun is correct?", "o": ["A) who's", "B) which", "C) whose", "D) that"], "a": 2, "e": "C is correct. 'Whose ratification required approval' — 'whose' shows that the ratification belongs to the treaty. Non-restrictive clause about a thing.\n\nA — 'who's' is a contraction.\nB — 'which ratification' is grammatically incorrect.\nD — 'that' cannot show possession and is not used in non-restrictive clauses."}, {"k": "Commas", "p": "The analysis revealed three significant trends: declining consumer confidence <u>______</u> rising production costs, and increasing regulatory pressure.", "q": "Which punctuation is correct?", "o": ["A) confidence and", "B) confidence,", "C) confidence; and", "D) confidence —"], "a": 1, "e": "B is correct. In a list of three items following a colon, commas separate each item: 'declining consumer confidence, rising production costs, and increasing regulatory pressure.'\n\nA — 'and' before the second item would make this appear to be a two-item list.\nC — a semicolon in a simple list without internal commas is non-standard.\nD — a dash before the second item disrupts the list structure."}, {"k": "Subject-Verb", "p": "Neither the CEO nor the board members <u>______</u> willing to accept responsibility for the data breach.", "q": "Which verb form is correct?", "o": ["A) was", "B) is", "C) were", "D) has been"], "a": 2, "e": "C is correct. With 'neither...nor,' the verb agrees with the closest subject. 'Board members' is plural, so 'were' is correct.\n\nA — 'was' agrees with 'CEO,' not the closer 'board members.'\nB — 'is' is singular present.\nD — 'has been' is singular present perfect."}, {"k": "Verb Tense", "p": "The committee moved that the motion <u>______</u> tabled until the next meeting.", "q": "Which verb form reflects the subjunctive mood?", "o": ["A) is", "B) was", "C) be", "D) will be"], "a": 2, "e": "C is correct. 'Moved that' triggers the subjunctive. The base form 'be' is required.\n\nA — 'is' is indicative present.\nB — 'was' is indicative past.\nD — 'will be' is future indicative."}, {"k": "Boundaries", "p": "The survey was conducted over three weeks; <u>______</u>", "q": "Which choice correctly continues after the semicolon?", "o": ["A) however the sample size was larger than expected.", "B) however, the sample size was larger than expected.", "C) but, the sample size was larger than expected.", "D) the sample size, however was larger than expected."], "a": 1, "e": "B is correct. After a semicolon, a complete independent clause is required. 'However' as a conjunctive adverb needs a comma after it: 'however, the sample size was larger than expected.'\n\nA — 'however the sample size' omits the required comma after 'however.'\nC — 'but' cannot follow a semicolon; 'but' is a coordinating conjunction used with a comma.\nD — 'the sample size, however was' omits the comma after 'however.'"}, {"k": "Modifiers", "p": "The board presented its findings to investors <u>______</u>.", "q": "Which revision correctly places 'only' to mean the findings were presented to investors and no one else?", "o": ["A) The board only presented its findings to investors.", "B) The board presented its findings only to investors.", "C) Only the board presented its findings to investors.", "D) The board presented its only findings to investors."], "a": 1, "e": "B is correct. 'Only to investors' modifies the recipients — the findings were shared exclusively with investors.\n\nA — 'only presented' means presenting was the only thing the board did.\nC — 'Only the board' means the board was the only entity that presented.\nD — 'its only findings' means there was only one set of findings."}, {"k": "Pronouns", "p": "The firm and its subsidiary both submitted <u>______</u> quarterly reports to the regulatory agency on time.", "q": "Which form is correct?", "o": ["A) its", "B) their", "C) it's", "D) there"], "a": 1, "e": "B is correct. 'The firm and its subsidiary' is a compound subject (two entities). The plural possessive 'their' is correct.\n\nA — 'its' is singular.\nC — 'it's' is a contraction.\nD — 'there' is an adverb."}, {"k": "Parallel Structure", "p": "The director is known for her commitment to the staff, <u>______</u>, and dedication to the mission.", "q": "Which choice maintains parallel structure?", "o": ["A) her attention to detail", "B) attending to detail", "C) the way she attends to detail", "D) having attention to detail"], "a": 0, "e": "A is correct. The list uses possessive noun phrases: 'her commitment,' 'her dedication.' The second item must also be a possessive noun phrase: 'her attention to detail.'\n\nB — 'attending to detail' is a gerund.\nC — 'the way she attends' is a noun clause.\nD — 'having attention' is a participial phrase."}, {"k": "Colons", "p": "The board cited three reasons for the decision <u>______</u> declining revenue, increased competition, and failure to meet quarterly targets.", "q": "Which punctuation is correct?", "o": ["A) decision,", "B) decision;", "C) decision:", "D) decision —"], "a": 2, "e": "C is correct. A colon after 'the decision' (a complete clause) formally introduces the list of reasons.\n\nA — a comma before a formal list following a complete clause is non-standard.\nB — a semicolon cannot introduce a list that is not an independent clause.\nD — a dash is informal."}, {"k": "Verb Tense", "p": "The engineers <u>______</u> on the prototype for four months before the funding ran out.", "q": "Which verb form is correct?", "o": ["A) worked", "B) have worked", "C) had been working", "D) were working"], "a": 2, "e": "C is correct. Past perfect progressive 'had been working' shows an action in progress over time before a subsequent past event (funding running out).\n\nA — simple past 'worked' does not show the duration.\nB — 'have worked' is present perfect.\nD — 'were working' is past progressive but does not emphasize prior duration."}, {"k": "Subject-Verb", "p": "Each of the submitted manuscripts <u>______</u> evaluated by at least two peer reviewers.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) was", "D) have been"], "a": 2, "e": "C is correct. 'Each' is always singular. 'Was evaluated' agrees with 'each.'\n\nA — 'are' is plural present.\nB — 'were' is plural past.\nD — 'have been' is plural present perfect."}, {"k": "Commas", "p": "The artist's studio, which she had occupied for thirty years <u>______</u> was converted into a gallery after her death.", "q": "Which punctuation is correct?", "o": ["A) years was", "B) years, was", "C) years; was", "D) years — was"], "a": 1, "e": "B is correct. The non-restrictive relative clause 'which she had occupied for thirty years' is enclosed in commas. The closing comma before 'was' is required.\n\nA — no closing comma leaves the non-restrictive clause improperly enclosed.\nC — a semicolon cannot close a relative clause.\nD — a dash closing a comma-opened clause is mismatched."}, {"k": "Relative Clauses", "p": "The journalist spoke with sources <u>______</u> identities she had agreed to protect.", "q": "Which relative pronoun is correct?", "o": ["A) who", "B) whose", "C) whom", "D) that"], "a": 1, "e": "B is correct. 'Whose identities she had agreed to protect' — 'whose' shows that the identities belong to the sources.\n\nA — 'who identities' is grammatically incorrect.\nC — 'whom' is the object form and cannot show possession.\nD — 'that identities' is grammatically incorrect."}, {"k": "Boundaries", "p": "The study was praised for its rigor, it was criticized for its narrow sample.", "q": "Which revision corrects this sentence?", "o": ["A) No change needed.", "B) rigor; however, it was criticized for its narrow sample.", "C) rigor, but criticized for its narrow sample.", "D) rigor, but its narrow sample being criticized."], "a": 1, "e": "B is correct. The original is a comma splice. A semicolon before 'however' and a comma after it correctly joins the contrasting independent clauses.\n\nA — the original is a comma splice.\nC — 'but criticized for its narrow sample' drops the subject 'it.'\nD — 'but its narrow sample being criticized' is a grammatically incorrect phrase."}, {"k": "Modifiers", "p": "Known for her innovative approach to urban planning, <u>______</u>", "q": "Which choice avoids a dangling modifier?", "o": ["A) the city's new zoning code was shaped by the architect.", "B) the architect shaped the city's new zoning code.", "C) shaping the city's new zoning code was the architect's role.", "D) the new zoning code reflects the architect's innovation."], "a": 1, "e": "B is correct. 'Known for her innovative approach' describes the architect. The main clause must open with 'the architect.'\n\nA — 'the city's new zoning code' was not known for an innovative approach.\nC — 'shaping the zoning code' was not known for an approach.\nD — 'the new zoning code' was not known for an approach."}, {"k": "Verb Tense", "p": "Since the new regulations <u>______</u> effect, the number of workplace injuries has declined significantly.", "q": "Which verb form is correct?", "o": ["A) take", "B) took", "C) have taken", "D) had taken"], "a": 1, "e": "B is correct. 'Since the new regulations took effect' establishes a past starting point; 'the number of injuries has declined' uses the present perfect for the ongoing result. The 'since' clause uses simple past.\n\nA — 'take' is present, inconsistent with the past event.\nC — 'have taken' is present perfect, but 'since' clauses that introduce a specific starting point use simple past.\nD — 'had taken' is past perfect, which is too complex for a simple starting point."}, {"k": "Commas", "p": "The CEO, who founded the company in 1994, <u>______</u> her retirement last month.", "q": "Which choice correctly completes the sentence?", "o": ["A) she announced", "B) announced", "C) , announced", "D) — announced"], "a": 1, "e": "B is correct. After the non-restrictive relative clause 'who founded the company in 1994' (enclosed in commas), the main verb follows directly: 'The CEO...announced her retirement.' No additional punctuation is needed before the verb.\n\nA — 'she announced' repeats the subject, creating a run-on.\nC — an extra comma before 'announced' is unnecessary.\nD — a dash before the verb is non-standard."}, {"k": "Pronouns", "p": "The institute released a statement confirming that <u>______</u> would delay the launch until further testing was complete.", "q": "Which pronoun is correct?", "o": ["A) they", "B) it", "C) he", "D) one"], "a": 1, "e": "B is correct. 'The institute' is a singular institutional entity. 'It' is the correct pronoun.\n\nA — 'they' is plural.\nC — 'he' has no antecedent.\nD — 'one' is impersonal."}, {"k": "Dashes", "p": "The plan had one critical flaw <u>______</u> it assumed that all stakeholders would agree voluntarily.", "q": "Which punctuation best introduces this explanatory clause for emphasis?", "o": ["A) plan, it", "B) plan; it", "C) plan: it", "D) plan — it"], "a": 3, "e": "D is correct. A dash introduces an emphatic or abrupt explanation. On the SAT, the dash is preferred over the colon when the test signals 'emphasis' or dramatic introduction.\n\nA — comma splice.\nB — a semicolon implies two coordinate clauses; a dash signals the explanation more emphatically.\nC — a colon is also grammatically correct but the dash is preferred when emphasis is the goal."}]}];

  function renderPackHome(){
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    var done=Object.keys(completed).length;
    var fill=document.getElementById('ph-fill');
    var lbl=document.getElementById('ph-prog-label');
    if(fill)fill.style.width=(done*10)+'%';
    if(lbl)lbl.textContent=done+' / 10 Set Tamamland\u0131';
    var grid=document.getElementById('set-grid');
    if(!grid)return;
    grid.innerHTML='';
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    for(var i=1;i<=10;i++){
      var s=ALL_SETS[i];var c=completed[i];
      var pct=c?Math.round(c.score/c.total*100):null;
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 14px;background:'+(c?'#ccfbf1':'#fff')+';border-radius:12px;margin-bottom:8px;cursor:pointer;border:1.5px solid '+(c?'#0d9488':'#ccfbf1')+';box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s;';
      row.onmouseenter=function(){this.style.boxShadow='0 4px 14px rgba(0,0,0,.12)';};
      row.onmouseleave=function(){this.style.boxShadow='0 1px 4px rgba(0,0,0,.05)';};
      var numDiv=document.createElement('div');
      numDiv.style.cssText='width:40px;height:40px;min-width:40px;border-radius:50%;background:'+(c?'#0d5e57':'#0d9488')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:monospace;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);';
      numDiv.textContent=c?'\u2713':i;
      var body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0;';
      var topicEl=document.createElement('div');
      topicEl.style.cssText='font-size:14px;font-weight:700;color:#134e4a;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;';
      topicEl.textContent=s.topic;
      var diffEl=document.createElement('span');
      diffEl.style.cssText='display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0d9488;background:#ccfbf1;border-radius:50px;padding:2px 8px;margin-top:4px;';
      diffEl.textContent=DIFFS[i-1];
      body.appendChild(topicEl);body.appendChild(diffEl);
      var right=document.createElement('div');
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;';
      if(c){
        var scoreEl=document.createElement('span');
        scoreEl.style.cssText='font-size:11px;font-weight:800;color:#fff;background:#0d9488;padding:2px 8px;border-radius:50px;white-space:nowrap;';
        scoreEl.textContent=c.score+'/'+c.total+' \u00b7 '+pct+'%';
        right.appendChild(scoreEl);
      }
      var ctaEl=document.createElement('span');
      ctaEl.style.cssText='font-size:11px;font-weight:700;color:#0d9488;border:1.5px solid #0d9488;border-radius:6px;padding:3px 10px;white-space:nowrap;';
      ctaEl.textContent=c?'Tekrar \u2192':'Ba\u015fla \u2192';
      right.appendChild(ctaEl);
      row.appendChild(numDiv);row.appendChild(body);row.appendChild(right);
      (function(n,r){
        r.addEventListener('click',function(){startSet(n);});
        r.addEventListener('touchend',function(e){e.preventDefault();startSet(n);});
      })(i,row);
      grid.appendChild(row);
    }
  }
  // ── Quiz engine ──
  function startSet(n){
    curSet=n;
    idx=0;
    ANS=new Array(ALL_SETS[n].qs.length).fill(null);
    document.getElementById('pack-home').style.display='none';
    document.getElementById('quiz-wrapper').style.display='flex';
    document.getElementById('set-complete').classList.remove('show');
    document.getElementById('tb-setlabel').textContent='SAT Reading & Writing · Grammar Pack 1 · Set '+n+' · '+ALL_SETS[n].topic;
    render();
  }

  var qarea=null,qnum=null,prog=null;
  function render(){
    if(!qarea){qarea=document.getElementById('qarea');qnum=document.getElementById('qnum');prog=document.getElementById('prog');}
    var q=ALL_SETS[curSet].qs[idx];
    var qs=ALL_SETS[curSet].qs;
    prog.style.width=((idx+1)/qs.length*100)+'%';
    qnum.textContent='Q '+(idx+1)+' / '+qs.length;
    var tracker=document.getElementById('tracker');
    tracker.innerHTML='';
    qs.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='dot'+(ANS[i]!==null?' ans':'')+(i===idx?' cur':'');
      (function(ii){d.onclick=function(){idx=ii;render();}}) (i);
      tracker.appendChild(d);
    });
    qarea.innerHTML='';
    var pbox=document.createElement('div');pbox.className='pbox';
    if(q.p!==undefined){
      var txt=q.p;
      if(txt.indexOf('___')!==-1){
        txt='<span style="font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;display:block;margin-bottom:.7rem">'+
          (q.k||'')+'</span>'+txt.replace('___','<span style="display:inline-block;width:140px;border-bottom:2px solid currentColor;vertical-align:bottom;margin:0 4px"></span>');
      }
      pbox.innerHTML=txt;
    } else if(q.passage!==undefined){pbox.innerHTML=q.passage;}
    qarea.appendChild(pbox);
    // Support both formats: q.question (new) or q.q (old)
    var questionText=q.question||q.q;
    if(questionText){var qt=document.createElement('div');qt.className='qtxt';qt.textContent=questionText;qarea.appendChild(qt);}
    // Support: q.choices (new obj array), q.opts (old string array), q.o (old string array)
    var choices=q.choices||q.opts||q.o;
    if(choices){
      choices.forEach(function(c,i){
        var btn=document.createElement('button');
        // Old format: answer is numeric index; new format: answer is letter
        var isSelected=(q.a!==undefined)?ANS[idx]===i:ANS[idx]===i;
        btn.className='opt'+(ANS[idx]===i?' sel':'');
        var lbl=(typeof c==='object')?c.label:c.charAt(0);
        var txt=(typeof c==='object')?c.text:c.slice(3);
        btn.innerHTML='<span class="ol">'+lbl+'</span><span>'+txt+'</span>';
        (function(ii){btn.onclick=function(){ANS[idx]=ii;render();}}) (i);
        qarea.appendChild(btn);
      });
    }
    var nav=document.createElement('div');nav.className='nav-row';
    var prev=document.createElement('button');prev.className='btn-n';prev.textContent='Previous';prev.disabled=idx===0;
    prev.onclick=function(){idx--;render();};
    nav.appendChild(prev);
    var done=ANS.filter(function(a){return a!==null;}).length;
    if(idx===qs.length-1){
      var sub=document.createElement('button');sub.className='btn-sub';
      sub.textContent='Submit ('+done+'/'+qs.length+')';sub.onclick=showSetComplete;nav.appendChild(sub);
    } else {
      var next=document.createElement('button');next.className='btn-n';next.textContent='Next';
      next.onclick=function(){idx++;render();};nav.appendChild(next);
    }
    qarea.appendChild(nav);
  }

  function getChoices(q){return q.choices||q.opts||q.o;}
  function isCorrect(q,selectedIdx){
    // Old format: q.a is numeric index
    if(q.a!==undefined&&typeof q.a==='number') return selectedIdx===q.a;
    // New format: q.answer is a letter
    var choices=getChoices(q);
    if(!choices||selectedIdx===null||selectedIdx===undefined)return false;
    var c=choices[selectedIdx];
    var selectedLabel=(typeof c==='object')?c.label:c.charAt(0);
    return selectedLabel===(q.answer||'A');
  }
  function getCorrectChoice(q){
    var choices=getChoices(q);
    if(!choices)return null;
    if(q.a!==undefined&&typeof q.a==='number') return choices[q.a];
    var lbl=q.answer||'A';
    return choices.find(function(c){return (typeof c==='object'?c.label:c.charAt(0))===lbl;});
  }
  function choiceText(c){
    if(!c)return '';
    return (typeof c==='object')?c.text:c.slice(3);
  }
  function showSetComplete(){
    var qs=ALL_SETS[curSet].qs;
    var score=0;
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))score++;
    });
    completed[curSet]={score:score,total:qs.length};
    var pct=Math.round(score/qs.length*100);
    var msg=pct>=80?'Mükemmel!':pct>=60?'Gayet iyi!':'Tekrar dene.';
    document.getElementById('quiz-wrapper').style.display='none';
    var sc=document.getElementById('set-complete');
    sc.classList.add('show');
    document.getElementById('scc-setnum').textContent=curSet;
    document.getElementById('scc-score').textContent=score;
    document.getElementById('scc-total').textContent=qs.length;
    document.getElementById('scc-pct').textContent=pct+'% — '+msg;
    var nextBtn=document.getElementById('scc-next');
    nextBtn.style.display=curSet<10?'':'none';
    // Review
    var rev=document.getElementById('scc-review');rev.innerHTML='';
    var title=document.createElement('div');title.className='scc-review-title';
    title.textContent='Yanlış Cevaplar';rev.appendChild(title);
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))return;
      var choices=getChoices(q);
      var selected=choices&&ANS[i]!==null?choices[ANS[i]]:null;
      var correctChoice=getCorrectChoice(q);
      var correctText=choiceText(correctChoice);
      var wrongText=selected?choiceText(selected):'Cevap verilmedi';
      var wi=document.createElement('div');wi.className='wi';
      var pText=(q.p||q.passage||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().substring(0,70);
      var expl=q.explanation||q.e||'';
      wi.innerHTML='<div class="wh"><span class="wh-n">Q'+(i+1)+'</span><span class="wh-q">'+pText+'...</span><span class="wh-badge w">✗</span></div>'+
        '<div class="wb" style="display:none;padding:.8rem .9rem">'+
        '<div class="aw">'+wrongText+'</div>'+
        '<div class="ac">Doğru: '+correctText+'</div>'+
        (expl?'<div class="expl"><div class="expl-head"><img class="expl-cat" src="'+griCat()+'" alt="Gri"/><span class="expl-label">Gri diyor ki:</span></div><div class="expl-body">'+expl+'</div></div>':'')+'</div>';
      wi.querySelector('.wh').onclick=function(){var wb=wi.querySelector('.wb');wb.style.display=wb.style.display==='block'?'none':'block';};
      rev.appendChild(wi);
    });
    if(rev.children.length<=1){title.textContent='Tüm cevaplar doğru! ✓';}
    window.scrollTo(0,0);
  }

  function retakeSet(){startSet(curSet);}
  function goNextSet(){if(curSet<10)startSet(curSet+1);}


    (function(){
    var dg=document.getElementById('cv-dots-inner');
    if(dg){for(var i=0;i<25;i++){var s=document.createElement('span');dg.appendChild(s);}}
  })();

  showPackHome();

</script>
