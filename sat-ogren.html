<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gri SAT</title>
<meta name="description" content="SAT Reading & Writing hazirlik. Dilbilgisi ve kelime drilleri, dort sikli, gercek Digital SAT formatinda, aciklamali.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#8A5A2C; --accent-deep:#5E3B18; --accent-soft:#EEDFC9; --panel:#F3E9D8;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:13px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:9px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:7px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}

/* Gri writing AI */
.griwz{margin:16px 0 4px}
.griask{background:linear-gradient(120deg,var(--accent),var(--accent-deep))}
.griq{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-left:10px}
.grifb{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#F7F8FA;font-family:Inter,sans-serif;font-size:14px;line-height:1.55}
.grifb.on{display:block}
.grifb.err{background:var(--wrong-soft);border-color:#F1D4CD;color:#8a382f}
.grifb .gscore{font-weight:800;font-size:1.1rem;color:var(--accent-deep);margin-bottom:10px}
.grifb .gcrit{border-top:1px solid var(--line);padding:9px 0}
.grifb .gcrit b{color:var(--accent-deep)}
.grifb .gsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.grifb .gmis{font-size:13.5px;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.grifb .gmis .o{color:var(--wrong);text-decoration:line-through}
.grifb .gmis .c{color:#166a4a;font-weight:700}

<script id="data" type="application/json">{"badge":"SAT","lessons":[{"eyebrow":"Öğren","id":"basla","name":"SAT R&W Yapısı","blocks":[{"x":"Digital SAT'ın Reading & Writing bölümü iki modülden oluşur; sorular kısa pasajlara dayanır ve dört şıklıdır. Bu modülde SAT R&W dilbilgisi (Standard English Conventions) ve kelime (vocabulary in context) konularını konu konu, gerçek sınav formatında çalışırsın. Açıklamalar İngilizce ve Türkçe set bazında verilmiştir.","t":"p"},{"rows":[["Sentence Boundaries","İki bağımsız cümleyi doğru noktalama veya bağlaçla ayırma."],["Punctuation","Virgül, noktalı virgül, iki nokta ve tire kullanımı."],["Agreement","Özne-yüklem ve zamir uyumu."],["Modifiers","Sarkık ve yanlış yerleştirilmiş niteleyiciler."],["Parallel & Tense","Paralel yapı, zaman ve kip tutarlılığı."],["Vocabulary","Bağlama anlamca en uygun kelime."]],"t":"table","head":["Alan","Ne ister"]},{"lines":["Her soruda önce boşluğun iki yanındaki dilbilgisi ilişkisini belirle, sonra şıkları ele.","Şıklar çoğunlukla aynı ifadenin farklı noktalama/biçimidir; farkı yaratan tek kuralı bul.","Kelime sorusunda boşluğa kendi kelimeni koy, sonra en yakın şıkkı seç."],"k":"ipucu","t":"note","title":"Yöntem"}],"group":"Öğren"},{"eyebrow":"Gramer","id":"g11","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Sentence Boundaries. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"choices":{"B":"schedule; additionally, this","A":"schedule, and this","D":"schedule and","C":"schedule this"},"n":1,"stem":"The research team completed the survey ahead of schedule, ______ the early completion allowed them to begin data analysis before the grant period expired.  Which choice most effectively combines the sentences and maintains clarity?","slug":"gri-mod-sat-g11-1-1","why":"B is correct. Two independent clauses must be separated by a semicolon (or period). A semicolon followed by an adverbial connector (additionally) handles both the grammatical boundary and the logical connection.  A — a comma before 'and this' works only if 'and' joins two independent clauses, but the comma-and combination creates a weak connection here.  C — a comma alone between two independent clauses is a comma splice.  D — no punctuation or conjunction creates a run-on sentence.","ans":"B"},{"choices":{"D":"However,","C":"Consequently,","A":"Therefore,","B":"In addition,"},"n":2,"stem":"The documentary received widespread critical acclaim. ______ it failed to attract a large commercial audience despite its strong festival run.  Which choice correctly introduces the second sentence as a contrasting idea?","why":"D is correct. 'However' signals contrast — acclaim but no commercial audience. The two independent clauses are already separated by a period, so the transition simply needs to reflect the logical relationship.  A — therefore signals a result, not a contrast.  B — in addition signals continuation, not contrast.  C — consequently signals a cause-effect result, not contrast.","slug":"gri-mod-sat-g11-1-2","ans":"D"},{"stem":"The professor assigned three papers, two presentations, and a final exam, ______ several students requested a meeting to discuss the workload.  Which choice creates a grammatically correct sentence?","why":"B is correct. Both clauses are independent. A semicolon separates them correctly; the transition 'as a result' explains the causal relationship and is followed by a comma.  A — no punctuation between two independent clauses creates a run-on.  C — a comma before 'as a result' alone (without a semicolon) creates a comma splice.  D — 'as a result of which' is a relative construction that would require restructuring the second clause.","slug":"gri-mod-sat-g11-1-3","ans":"B","choices":{"C":"as a result,","D":"as a result of which","B":"; as a result,","A":"as a result"},"n":3},{"ans":"C","why":"C is correct. The sentence lists three coordinate events. A comma before 'and' before the final independent clause is correct in a series of this complexity.  A — 'and' without a comma leaves ambiguity about whether the third clause is coordinate.  B — 'and,' is not correct punctuation (the comma follows and, not precedes it).  D — 'however' signals contrast, which is not the relationship here.","slug":"gri-mod-sat-g11-1-4","stem":"The satellite was launched successfully, its solar panels deployed, ______ initial telemetry confirmed that all systems were functioning within expected parameters.  Which choice correctly joins the sentence?","n":4,"choices":{"D":"however,","C":", and","A":"and","B":"and,"}},{"choices":{"B":"; and","A":", and","D":", and so","C":"and"},"n":5,"why":"A is correct. A comma followed by a coordinating conjunction (and) correctly joins two independent clauses.  B — a semicolon followed by 'and' is redundant; use one or the other.  C — no comma before a coordinating conjunction joining two independent clauses is a common error.  D — 'and so' is acceptable informally but creates a slightly awkward double conjunction.","slug":"gri-mod-sat-g11-1-5","stem":"Dr. Okonkwo published her findings in a peer-reviewed journal ______ the study attracted attention from researchers in three related fields.  Which choice correctly joins the two independent clauses?","ans":"A"},{"n":6,"choices":{"C":"however,","D":", however","A":", however,","B":"; however,"},"ans":"B","slug":"gri-mod-sat-g11-1-6","why":"B is correct. 'However' is a conjunctive adverb — it cannot join two independent clauses with only a comma. A semicolon before it and a comma after it is the correct pattern.  A — comma before 'however' creates a comma splice.  C — no punctuation before 'however' creates a run-on.  D — 'however' without a trailing comma leaves the sentence grammatically incomplete.","stem":"The bridge reconstruction project was estimated to take eighteen months ______ unexpected complications with the foundational supports extended the timeline to nearly three years.  Which choice correctly punctuates the sentence?"},{"why":"C is correct. This is a complete independent clause with a subject (Property owners) and predicate (found).  A — a participial phrase without a main clause is a sentence fragment.  B — a relative clause beginning with 'which' cannot stand alone as a sentence.  D — a subordinate clause beginning with 'because' requires a main clause to be grammatically complete.","stem":"The new zoning ordinance restricted building heights in the historic district. ______  Which choice creates a complete sentence that could follow?","ans":"C","choices":{"D":"Because renovation had become more complicated for property owners.","C":"Property owners found that renovation had become more complicated.","B":"Which made renovation more complicated for property owners.","A":"Making renovation more complicated for property owners."},"n":7,"slug":"gri-mod-sat-g11-1-7"},{"stem":"The engineers tested the prototype under four different conditions: extreme heat, sub-zero temperatures, high humidity, and full solar exposure, ______ it performed within acceptable limits in all four scenarios.  Which choice correctly punctuates this sentence?","slug":"gri-mod-sat-g11-1-8","why":"C is correct. After a long introductory clause ending with a list, the comma before 'and' signals the main result clause. The comma here clarifies the sentence structure.  A — without the comma, the 'and' appears to add 'full solar exposure' to the list rather than introducing a new clause.  B — a semicolon before 'and' is redundant.  D — 'and,' places the comma after the conjunction, which is incorrect.","ans":"C","choices":{"B":"; and","A":"and","C":", and","D":"and,"},"n":8},{"ans":"A","stem":"The clinical trial enrolled five hundred participants, ______ each was randomly assigned to either the treatment or control group.  Which is correct?","why":"A is correct. Two independent clauses joined by 'and' with a comma is the standard coordinating conjunction pattern.  B — no conjunction between two independent clauses creates a run-on.  C — comma alone between two independent clauses is a comma splice.  D — a semicolon without a connector is acceptable but the comma+and is more natural here.","slug":"gri-mod-sat-g11-1-9","n":9,"choices":{"B":"each","A":"and each","C":", each","D":"; each"}},{"n":10,"choices":{"B":"the committee deemed the audit incomplete.","A":"the audit was deemed incomplete by the committee.","D":"it was the committee's finding that the audit was incomplete.","C":"an incomplete audit was what the committee found."},"ans":"B","why":"B is correct. The participial phrase 'Having reviewed the financial statements carefully' modifies the subject of the main clause, which must be the committee (the ones doing the reviewing).  A — 'the audit' cannot have reviewed the statements; this is a dangling modifier.  C — 'an incomplete audit' cannot have reviewed the statements; dangling modifier.  D — 'it' cannot have reviewed the statements; dangling modifier.","slug":"gri-mod-sat-g11-1-10","stem":"Having reviewed the financial statements carefully, ______  Which choice correctly completes the sentence with a grammatical main clause?"},{"n":11,"choices":{"C":"Similarly,","D":"For example,","B":"Therefore,","A":"Nevertheless,"},"ans":"A","why":"A is correct. Fast composition but long delay before premiere = an unexpected contrast. 'Nevertheless' signals that the delay happened despite the quick completion.  B — therefore signals a logical result of the fast composition; delay is not a logical result.  C — similarly signals that the second sentence parallels the first.  D — for example introduces an illustration of the previous point.","slug":"gri-mod-sat-g11-1-11","stem":"The composer wrote the symphony in six weeks. ______ the premiere was delayed by more than a year due to scheduling conflicts with the orchestra.  Which transition correctly reflects the logical relationship?"},{"ans":"D","stem":"The city council passed the revised parking ordinance, ______ the mayor vetoed it the following afternoon.  Which choice creates a grammatically correct sentence that signals contrast?","why":"D is correct. Two independent clauses with a contrasting relationship — comma + coordinating conjunction 'but' is the correct form.  A — 'however' is a conjunctive adverb that needs a semicolon before it.  B — 'but' without a comma before it is a run-on.  C — semicolon + 'and' signals addition, not contrast.","slug":"gri-mod-sat-g11-1-12","n":12,"choices":{"B":"but","A":"however","C":"; and","D":", but"}},{"slug":"gri-mod-sat-g11-1-13","ans":"C","stem":"______ the researchers decided to extend the study by six months.  Which choice creates a grammatically complete sentence with a correct subordinate clause?","why":"C is correct. A subordinate clause beginning with 'because' followed by a comma, then the main clause, is grammatically complete.  A — an absolute phrase with 'being' is acceptable but awkward; A is more direct.  B — a noun phrase without a verb is not a grammatical clause.  D — a prepositional phrase cannot substitute for a full subordinate clause.","n":13,"choices":{"C":"Because the initial results were inconclusive,","D":"With the initial results being inconclusive about the question,","B":"Initial results inconclusive,","A":"The initial results being inconclusive,"}},{"n":14,"choices":{"C":"well-organized, and it","D":"and it was well-organized; however, it","A":"and well-organized, however it","B":"it was well-organized, but it"},"ans":"D","stem":"The grant proposal was submitted on time, it was well-organized, ______ it exceeded the page limit by four pages.  Which choice corrects the grammatical errors in this sentence?","why":"D is correct. Three independent clauses cannot be strung together with commas only. The best structure is: [clause], [clause]; however, [clause].  A — still uses a comma before 'however' which is a comma splice.  B — 'it was well-organized, but it' uses a comma with 'but' which is correct for two clauses but the opening 'submitted on time, it' is still a comma splice.  C — 'well-organized, and it' loses the subject of the second clause.","slug":"gri-mod-sat-g11-1-14"},{"n":15,"choices":{"B":";","A":"and","D":", and,","C":"— and"},"ans":"B","why":"B is correct. After a long sentence with an internal list, a semicolon separates the first independent clause from the second without requiring a conjunction.  A — 'and' alone creates a run-on after the comma following 'inspection'.  C — a dash before 'and' is unconventional and grammatically awkward.  D — commas flanking 'and' is not standard punctuation.","slug":"gri-mod-sat-g11-1-15","stem":"The manufacturing process involves three distinct stages: raw material preparation, component assembly, and quality inspection, ______ each stage is carried out by a specialized team.  Which choice correctly punctuates this sentence?"},{"choices":{"D":"Therefore,","C":"Similarly,","B":"Moreover,","A":"However,"},"n":16,"why":"A is correct. Well-structured BUT limited evidence = a qualification or contrast. 'However' signals this limitation.  B — moreover adds supporting or escalating information.  C — similarly signals parallel ideas.  D — therefore signals a conclusion or result.","slug":"gri-mod-sat-g11-1-16","stem":"The student's argument was well-structured. ______ her evidence was drawn exclusively from secondary sources.  Which transition reflects that the next sentence adds a qualification?","ans":"A"},{"ans":"C","stem":"The architect submitted the final blueprints three weeks early ______ this gave the contractors time to source materials before ground-breaking.  Which choice correctly joins the clauses?","why":"C is correct. Two independent clauses separated by a semicolon — the second explains the result of the first. No conjunction is needed with a semicolon.  A — comma + 'and' is acceptable but 'this' still needs to be the subject of the second clause, which it is; however D is more precise.  B — 'and so' is informal and somewhat redundant.  D — a comma before 'this' creates a comma splice.","slug":"gri-mod-sat-g11-1-17","n":17,"choices":{"B":", and so","A":", and","C":"; this","D":", this"}},{"choices":{"C":"Despite this,","D":"During that time,","A":"In contrast,","B":"Nevertheless,"},"n":18,"stem":"The exhibit was open to the public for three months. ______ it attracted over ninety thousand visitors.  Which choice correctly introduces the second sentence as showing a result?","slug":"gri-mod-sat-g11-1-18","why":"D is correct. Ninety thousand visitors over three months = a result of being open during that time. 'During that time' connects the result to the period mentioned.  A — in contrast signals opposition, which is not appropriate here.  B — nevertheless signals a concessive result (unexpected despite prior conditions).  C — despite this signals that the result happened in spite of something negative.","ans":"D"},{"stem":"The forensic accountant identified three fraudulent transactions. ______ the pattern she uncovered suggested that dozens more had gone undetected.  Which transition correctly signals that the second finding is more significant?","slug":"gri-mod-sat-g11-1-19","why":"C is correct. Three found, possibly dozens more undetected = a more important or escalating finding. 'More importantly' signals that the second point matters more.  A — however signals contrast; the second sentence extends rather than contradicts.  B — for example introduces an illustration.  D — in other words signals a restatement.","ans":"C","choices":{"D":"In other words,","C":"More importantly,","A":"However,","B":"For example,"},"n":19},{"n":20,"choices":{"A":", and","B":"and","C":"; furthermore,","D":"however,"},"ans":"A","slug":"gri-mod-sat-g11-1-20","why":"A is correct. Comma + 'and' joins two independent clauses and signals that the second point adds to the first.  B — 'and' without a comma before a second independent clause is a run-on.  C — semicolon + 'furthermore' is grammatically correct but more formal than necessary.  D — 'however' signals contrast; the second clause adds to, not contradicts, the first.","stem":"The new policy was designed to reduce energy consumption in commercial buildings, ______ preliminary assessments suggest it may also lower operating costs significantly.  Which choice correctly joins the clauses and signals addition?"},{"choices":{"A":"Because it was complex,","B":"Complexity being present,","C":"Despite being complex,","D":"As a complex undertaking,"},"n":21,"why":"D is correct. 'As a complex undertaking' is a prepositional phrase that correctly modifies the subject 'the renovation project' in the main clause.  A — 'because it was complex' implies the complexity caused the approval requirements, but 'it' is ambiguous.  B — 'Complexity being present' is an absolute phrase that is awkward and imprecise.  C — 'Despite being complex' implies the complexity made the approval requirements surprising, which changes the meaning.","slug":"gri-mod-sat-g11-1-21","stem":"______ the renovation project required approval from five separate city departments, which caused significant delays.  Which choice creates a correct sentence?","ans":"D"},{"choices":{"B":"they","A":"who","D":", who","C":"and who"},"n":22,"why":"D is correct. A relative clause 'who represented five different countries' modifies 'speakers' and requires a comma before 'who' because it is non-restrictive (all of them represented different countries).  A — 'who' without a comma makes the clause restrictive, implying only some speakers represented five countries.  B — 'they' creates a second independent clause without proper punctuation (comma splice).  C — 'and who' suggests a parallel relative clause but disrupts the grammar.","slug":"gri-mod-sat-g11-1-22","stem":"The conference speakers included economists, historians, and sociologists, ______ represented five different countries.  Which choice is correct?","ans":"D"},{"ans":"B","stem":"The laboratory's funding was not renewed. ______  Which choice creates a grammatically complete and meaningful follow-up sentence?","why":"B is correct. Subject (The team) + predicate (dissolved) + coordinating clause = a grammatically complete sentence.  A — a participial phrase fragment; no main clause.  C — two gerund phrases without a main verb; fragment.  D — a subordinate clause beginning with 'As' without a main clause; fragment.","n":23,"choices":{"A":"Forcing the team to dissolve and all equipment sold.","B":"The team dissolved, and all equipment was sold.","D":"As the team dissolved and all equipment sold.","C":"The team dissolving and equipment being sold."},"slug":"gri-mod-sat-g11-1-23"},{"ans":"A","stem":"The policy was unpopular with residents, businesses, and community organizations alike ______ the council passed it by a narrow margin.  Which choice correctly punctuates and signals the relationship?","why":"A is correct. Two independent clauses with a concessive relationship — unpopular but passed. Semicolon before 'nevertheless' and comma after it is the correct pattern.  B — comma before 'nevertheless' is a comma splice.  C — same issue; comma splice and missing comma after 'nevertheless'.  D — no punctuation before 'nevertheless' creates a run-on.","n":24,"choices":{"D":"nevertheless,","C":", nevertheless","B":", nevertheless,","A":"; nevertheless,"},"slug":"gri-mod-sat-g11-1-24"},{"slug":"gri-mod-sat-g11-1-25","why":"A is correct. Two independent clauses in contrast — a hypothesis contradicted by results. Semicolon + however + comma is standard.  B — 'however' without preceding semicolon creates a run-on.  C — comma before 'however' is a comma splice.  D — using both 'but' and 'however' is redundant.","stem":"The scientist had hypothesized that the temperature increase would accelerate bacterial growth ______ the experimental results showed the opposite effect.  Which choice correctly joins the sentences and signals contrast?","ans":"A","choices":{"A":"; however,","B":"however","D":"but, however,","C":", however"},"n":25}]}],"name":"Sentence Boundaries","group":"Dilbilgisi"},{"eyebrow":"Gramer","group":"Dilbilgisi","name":"Punctuation — Commas","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Punctuation — Commas. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"slug":"gri-mod-sat-g12-1-1","n":1,"choices":{"C":"which,","D":"that","B":", which","A":"which"},"ans":"B","stem":"The committee, ______ had been working on the proposal for three months, submitted its final recommendation to the board.  Which choice correctly punctuates the relative clause?","why":"B is correct. The relative clause 'which had been working on the proposal for three months' is non-restrictive — it adds information rather than defining which committee. Non-restrictive clauses are set off by commas on both sides. Since there is already a comma before the blank, the opening of the clause should be ', which'.  A — 'which' without a comma makes the clause appear restrictive.  C — 'which,' adds a comma in the wrong position.  D — 'that' is used only with restrictive clauses."},{"n":2,"choices":{"C":"which,","D":", which","A":"which","B":"that"},"ans":"C","stem":"The manuscript, ______ has been revised seventeen times, is finally ready for submission.  Which choice correctly punctuates the sentence?","slug":"gri-mod-sat-g12-1-2","why":"C is correct. The non-restrictive clause 'which has been revised seventeen times' is embedded between two commas: 'The manuscript, which has been revised seventeen times, is finally ready.' The blank follows the first comma, so 'which,' (which followed by the closing comma) is the correct form here.  A — 'which' without the closing comma leaves the clause improperly punctuated.  B — 'that' introduces restrictive clauses; this is non-restrictive.  D — ', which' would create a second opening comma where one already exists."},{"ans":"D","stem":"The novel explores themes of identity, displacement, ______ belonging, and memory.  Which choice is correct?","slug":"gri-mod-sat-g12-1-3","why":"D is correct. In a list of four items — identity, displacement, belonging, and memory — commas separate each item and 'and' precedes the last. No additional punctuation is needed between 'displacement' and 'belonging' because the existing comma after 'displacement' already separates the items.  A — an extra comma creates an unnecessary pause.  B — 'and' between each item is not standard list punctuation.  C — 'and,' after displacement changes the list structure incorrectly.","n":3,"choices":{"B":"and","A":",","D":"No change — no punctuation needed","C":"and,"}},{"slug":"gri-mod-sat-g12-1-4","why":"A is correct. 'The department chair' is a non-restrictive appositive that must be set off by commas on both sides. Since a comma appears before it, a comma must follow it: 'Dr. Lee, the department chair, delivered...'  B — a comma after 'delivered' is incorrect; the closing comma of the appositive belongs after 'chair'.  C — no comma after 'chair' leaves the appositive improperly punctuated.  D — a dash is used for emphatic appositives, not standard non-restrictive appositives.","stem":"Dr. Lee, the department chair ______ delivered the opening remarks at the annual conference.  Which choice correctly punctuates the appositive?","ans":"A","choices":{"C":"delivered","D":"— delivered","B":", delivered,","A":", delivered"},"n":4},{"slug":"gri-mod-sat-g12-1-5","ans":"D","stem":"When the results of the third trial were finally published ______ the scientific community responded with widespread skepticism.  Which choice correctly punctuates the sentence?","why":"D is correct. A subordinate clause at the beginning of a sentence ('When the results...were finally published') is followed by a comma before the main clause. The comma goes after the last word of the introductory clause.  A — comma before 'published' cuts into the introductory clause incorrectly.  B — no comma after 'published' omits the required pause after an introductory clause.  C — a semicolon cannot follow a subordinate clause; semicolons join independent clauses.","n":5,"choices":{"B":"published","A":", published","D":"published,","C":"; published,"}},{"slug":"gri-mod-sat-g12-1-6","stem":"The museum's newest acquisition, a bronze sculpture from the fourteenth century, ______ visitors from around the world.  Which choice correctly completes the sentence?","why":"A is correct. The appositive ('a bronze sculpture from the fourteenth century') is already enclosed in commas. The main verb 'attracts' follows directly after the closing comma with no additional punctuation needed.  B — 'attracts, surprisingly,' creates an unnecessary interrupting phrase that disrupts the predicate.  C — 'surprisingly attracts' is grammatically fine but the adverb placement is unusual; B is cleaner.  D — 'attracts, surprisingly' places an unneeded comma after the verb.","ans":"A","choices":{"C":"surprisingly attracts","D":"attracts, surprisingly","A":"attracts","B":"attracts, surprisingly,"},"n":6},{"choices":{"D":"Fitzgerald; Woolf","C":"Fitzgerald","A":"Fitzgerald,","B":", Fitzgerald,"},"n":7,"stem":"The professor assigned readings from three authors: Fitzgerald ______ Woolf, and Achebe.  Which choice is correct?","why":"A is correct. In a three-item list following a colon, commas separate the items: Fitzgerald, Woolf, and Achebe.  B — a comma before 'Fitzgerald' follows the colon, which is not needed.  C — no comma after 'Fitzgerald' means the list lacks proper separation between the first and second items.  D — semicolons in a list are used only when the items themselves contain commas.","ans":"A","slug":"gri-mod-sat-g12-1-7"},{"ans":"C","slug":"gri-mod-sat-g12-1-8","why":"C is correct. An introductory subordinate clause ('Although...reduced') is separated from the main clause by a comma.  A — a semicolon cannot follow a subordinate clause; it joins two independent clauses.  B — no comma after the introductory clause omits required punctuation.  D — a dash is emphatic and non-standard in this context.","stem":"Although the budget was significantly reduced ______ the team managed to complete the project without sacrificing quality.  Which punctuation correctly follows the introductory clause?","n":8,"choices":{"C":"reduced, the","D":"reduced — the","A":"reduced; the","B":"reduced the"}},{"stem":"The report, ______ outlined three major findings: increased carbon levels, declining biodiversity, and rising sea temperatures.  Which choice correctly punctuates the parenthetical?","why":"D is correct. 'Released in March' is a participial phrase modifying 'the report.' Since a comma already precedes it, a comma must follow it before the main verb: 'The report, released in March, outlined...'  A — 'which was released in March,' adds unnecessary words; the participial form is more concise, but A would also be grammatically correct.  C — 'which was released in March' without a closing comma leaves the non-restrictive clause improperly punctuated.  B — 'released in March' without a closing comma omits the second required comma.","slug":"gri-mod-sat-g12-1-9","ans":"D","choices":{"C":"which was released in March","D":"released in March,","B":"released in March","A":"which was released in March,"},"n":9},{"n":10,"choices":{"D":"applications — ultimately","C":"applications; ultimately","A":"applications, ultimately","B":"applications ultimately"},"ans":"A","why":"A is correct. A participial phrase that adds information to a complete clause ('ultimately selecting twelve candidates') is separated from the main clause by a comma.  B — no comma omits the required pause before the participial phrase.  C — a semicolon cannot precede a participial phrase; it joins two independent clauses.  D — a dash could work for emphasis but is less conventional here.","stem":"The hiring committee reviewed over two hundred applications ______ ultimately selecting twelve candidates for interviews.  Which punctuation is correct before the participial phrase?","slug":"gri-mod-sat-g12-1-10"},{"choices":{"D":"building, constructed in 1892, was","C":"building constructed in 1892, was","A":"building constructed in 1892 was","B":"building, constructed in 1892 was"},"n":11,"stem":"The building ______ constructed in 1892 ______ was designated a national landmark last year.  Which choice correctly punctuates the embedded participial phrase?","why":"D is correct. 'Constructed in 1892' is a non-restrictive participial phrase modifying 'the building' and must be set off by commas on both sides.  A — no commas make the phrase restrictive (implying there are other buildings that were not constructed in 1892).  B — opening comma but no closing comma leaves the phrase improperly enclosed.  C — closing comma without an opening comma is asymmetrical and incorrect.","slug":"gri-mod-sat-g12-1-11","ans":"D"},{"ans":"B","why":"B is correct. In a list of three items ('maintain...complete...submit'), a comma before 'and' before the final item is the Oxford comma, which is required on the SAT to prevent ambiguity.  A — no comma before 'and' omits the Oxford comma and can create ambiguity.  C — a semicolon before 'and' in a simple list is incorrect; semicolons in lists are reserved for items containing internal commas.  D — a dash before 'and' is not standard in a parallel list.","stem":"To qualify for the scholarship, students must maintain a minimum GPA of 3.5, complete thirty hours of community service ______ and submit two letters of recommendation.  Which choice is correct?","n":12,"choices":{"A":"service and","B":"service, and","C":"service; and","D":"service —  and"},"slug":"gri-mod-sat-g12-1-12"},{"choices":{"C":"award, presented annually since 1978, recognizes","D":"award presented annually since 1978, recognizes","B":"award, presented annually since 1978 recognizes","A":"award presented annually since 1978 recognizes"},"n":13,"why":"C is correct. 'Presented annually since 1978' is a non-restrictive participial phrase that must be set off with commas on both sides.  A — no commas make the phrase restrictive.  B — opening comma but no closing comma is asymmetrical.  D — closing comma without opening comma is incorrect.","slug":"gri-mod-sat-g12-1-13","stem":"The award ______ presented annually since 1978 ______ recognizes outstanding contributions to public education.  Which choice correctly punctuates the non-restrictive phrase?","ans":"C"},{"ans":"B","why":"B is correct. 'Quietly, slowly, deliberately, and without...' is a four-item list of adverbs/phrases. A comma after each item (including 'slowly') maintains the parallel list structure.  A — no comma after 'slowly' breaks the parallel list pattern.  C — semicolon before 'and' is used only when list items contain internal commas.  D — 'slowly and' without a comma joins only 'slowly' and 'deliberately,' disrupting the four-item list.","slug":"gri-mod-sat-g12-1-14","stem":"She spoke quietly, ______ deliberately, and without the emotional intensity the audience had expected.  Which choice is correct?","n":14,"choices":{"A":"slowly","B":"slowly,","D":"slowly and","C":"slowly; and"}},{"slug":"gri-mod-sat-g12-1-15","stem":"The foundation established in 2001 ______ has provided grants to over five hundred organizations.  Which choice correctly punctuates this sentence?","why":"B is correct. 'Established in 2001' is a non-restrictive participial phrase modifying 'the foundation.' It requires commas on both sides: 'The foundation, established in 2001, has...'  A — no commas makes the phrase appear restrictive.  C — 'which,' introduces a relative clause, not a participial phrase; this changes the grammar.  D — a comma after '2001' without a preceding comma is asymmetrical.","ans":"B","choices":{"B":"2001, has","A":"2001 has","D":"2001,","C":"2001, which,"},"n":15},{"n":16,"choices":{"A":"weeks involved","B":"weeks, involved,","D":"weeks; involved","C":"weeks, involved"},"ans":"C","stem":"The trial lasted three weeks ______ involved testimony from forty-two witnesses, and concluded with a unanimous verdict.  Which choice correctly punctuates the verb list?","why":"C is correct. 'Lasted, involved, and concluded' is a parallel list of predicates. Commas separate them: 'lasted three weeks, involved testimony..., and concluded...'  A — no comma between 'weeks' and 'involved' runs together the first and second items.  B — an extra comma after 'involved' where a comma already precedes the list item is incorrect.  D — a semicolon in a simple predicate list is not appropriate.","slug":"gri-mod-sat-g12-1-16"},{"stem":"The researcher noted that several variables, ______ had not been controlled in the original study.  Which choice correctly inserts the non-restrictive element?","why":"C is correct. 'Including sample size and time of day' is a non-restrictive phrase explaining which variables. It needs a closing comma before the verb 'had not been controlled.'  A — no closing comma leaves the non-restrictive phrase improperly set off.  B — 'such as sample size, and time of day,' uses an unnecessary comma inside a two-item phrase.  D — 'sample size and time of day being included' is an awkward absolute phrase.","slug":"gri-mod-sat-g12-1-17","ans":"C","choices":{"D":"sample size and time of day being included,","C":"including sample size and time of day,","B":"such as sample size, and time of day,","A":"including sample size and time of day"},"n":17},{"stem":"In the decades following the invention of the printing press ______ literacy rates across Europe began to rise significantly.  Which choice correctly punctuates this sentence?","slug":"gri-mod-sat-g12-1-18","why":"C is correct. A long introductory prepositional phrase ('In the decades...printing press') is followed by a comma before the main clause.  A — no comma omits the required punctuation after a long introductory phrase.  B — a semicolon cannot follow a prepositional phrase.  D — a dash is emphatic and non-standard after a straightforward introductory phrase.","ans":"C","choices":{"C":"press, literacy","D":"press — literacy","A":"press literacy","B":"press; literacy"},"n":18},{"n":19,"choices":{"C":", though","D":", though,","B":"though","A":"though,"},"ans":"D","why":"D is correct. 'Though compelling in its structure' is a parenthetical element inserted into the sentence. It must be set off by commas on both sides: 'Her argument, though compelling in its structure, failed...'  A — 'though,' opens the parenthetical but needs a comma before it; a comma already precedes the blank, so the element should begin with 'though' and end with a comma.  B — 'though' without a closing comma leaves the parenthetical improperly closed.  C — ', though' has only one comma where two are needed.","slug":"gri-mod-sat-g12-1-19","stem":"Her argument, ______ compelling in its structure, failed to account for the most recent empirical data.  Which choice correctly punctuates the inserted adverb?"},{"slug":"gri-mod-sat-g12-1-20","why":"B is correct. 'As the team found' is a parenthetical comment inserted mid-sentence. It should be read as: 'The survey results, as the team found, suggested...' The word 'as' correctly introduces this parenthetical.  A — 'which' creates a relative clause 'which the team found' that changes the meaning.  C — 'which,' is incomplete and grammatically unclear.  D — '— which' uses a dash to set off a relative clause, which changes the meaning.","stem":"The survey results, ______ the team found, suggested a significant shift in consumer preferences over the past five years.  Which choice correctly handles the parenthetical?","ans":"B","choices":{"D":"— which","C":"which,","B":"as","A":"which"},"n":20},{"choices":{"D":"more efficient —  and","C":"more efficient; and","A":"more efficient, and","B":"more efficient and"},"n":21,"why":"A is correct. 'Faster, more efficient, and significantly less expensive' is a three-item list of adjectives. A comma before 'and' before the last item is required.  B — no comma before 'and' omits the Oxford comma, creating potential ambiguity.  C — a semicolon in a simple adjective list is not appropriate.  D — a dash before 'and' is not standard in a parallel adjective list.","slug":"gri-mod-sat-g12-1-21","stem":"The company's new manufacturing process is faster, more efficient ______ and significantly less expensive than the previous method.  Which choice is correct?","ans":"A"},{"stem":"The scientist who discovered the compound ______ was awarded the Nobel Prize in Chemistry.  Which choice is correct?","slug":"gri-mod-sat-g12-1-22","why":"B is correct. 'Who discovered the compound' is a restrictive relative clause — it specifies which scientist. Restrictive clauses take no commas.  A — commas around a restrictive clause make it non-restrictive, implying there is only one scientist.  C — a comma after the clause without one before it is asymmetrical.  D — a comma only before the clause is asymmetrical and inconsistent.","ans":"B","choices":{"A":", who discovered the compound,","B":"who discovered the compound","D":", who discovered the compound","C":"who discovered the compound,"},"n":22},{"choices":{"C":"once considered experimental,","D":"which was once considered experimental","B":"once considered experimental","A":"which was once considered experimental,"},"n":23,"stem":"By the end of the decade, the technology, ______ had become standard in most research institutions.  Which choice correctly completes the non-restrictive clause?","slug":"gri-mod-sat-g12-1-23","why":"A is correct. 'Which was once considered experimental' is a non-restrictive relative clause. With a comma already before 'which', the clause needs a closing comma: '...the technology, which was once considered experimental, had become...'  B — 'once considered experimental' without the closing comma leaves the participial phrase improperly set off.  C — 'once considered experimental,' is a participial phrase that also requires an opening comma — but a comma already precedes the blank; this creates ambiguity.  D — no closing comma after 'experimental' leaves the non-restrictive clause improperly enclosed.  D correctly uses both the relative pronoun and the closing comma.","ans":"A"},{"n":24,"choices":{"B":"which is extensive","A":"which is extensive,","D":"extensive","C":"extensive,"},"ans":"A","stem":"The city's transportation network, ______ includes buses, subway lines, commuter rail, and a recently expanded bike-share program.  Which is correct?","why":"A is correct. 'Which is extensive' is a non-restrictive relative clause describing the network. With a comma before 'which', a comma after 'extensive' closes the clause before the main verb 'includes'.  B — no closing comma leaves the non-restrictive clause improperly enclosed.  C — 'extensive,' alone is a participial adjective; it needs a preceding comma which already exists, so this could work, but A is cleaner.  D — 'extensive' without any comma is incorrect.","slug":"gri-mod-sat-g12-1-24"},{"n":25,"choices":{"D":"3rd; the","C":"3rd — the","B":"3rd, the","A":"3rd the"},"ans":"D","slug":"gri-mod-sat-g12-1-25","why":"D is correct. Two independent clauses without a coordinating conjunction must be separated by a semicolon.  A — no punctuation between two independent clauses is a run-on.  B — a comma alone between two independent clauses is a comma splice.  C — a dash can separate independent clauses in informal or emphatic writing but is not preferred on the SAT.","stem":"The first draft was submitted on April 3rd ______ the final version was not approved until June.  Which choice correctly punctuates this compound sentence?"}],"t":"mcqquiz"}],"id":"g12"},{"blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Punctuation — Colons, Semicolons & Dashes. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"n":1,"choices":{"C":"preparation:","D":"preparation —","A":"preparation;","B":"preparation,"},"ans":"C","slug":"gri-mod-sat-g13-1-1","why":"C is correct. A colon introduces a list or explanation when a grammatically complete clause precedes it. 'The expedition required three types of preparation' is a complete clause, so a colon correctly introduces the list.  A — a semicolon joins two independent clauses; it cannot introduce a list that is not an independent clause.  B — a comma before a formal list following a complete clause is non-standard.  D — a dash can introduce a list but a colon is preferred in formal writing.","stem":"The expedition required three types of preparation ______ physical conditioning, equipment procurement, and route planning.  Which punctuation correctly introduces the list?"},{"stem":"The results were unambiguous ______ the treatment group showed a forty percent reduction in symptoms compared to the control group.  Which punctuation introduces the explanatory clause?","slug":"gri-mod-sat-g13-1-2","why":"D is correct. A colon introduces an explanation or elaboration of a complete clause. The second clause explains what 'unambiguous' means in this context.  A — a semicolon would work if both clauses were truly independent and coordinate; here the second clause explains the first, making a colon more precise.  B — a comma before an independent explanatory clause is too weak.  C — a dash is informal and less precise than a colon.","ans":"D","choices":{"B":"unambiguous,","A":"unambiguous;","D":"unambiguous:","C":"unambiguous —"},"n":2},{"choices":{"B":"complex: its","A":"complex,","D":"complex; its","C":"complex — its"},"n":3,"stem":"The novel's plot is complex ______ its structure, however, is surprisingly accessible to first-time readers.  Which punctuation correctly joins these clauses?","why":"D is correct. Two independent clauses in a contrastive relationship — a semicolon correctly joins them. 'However' is a conjunctive adverb that follows the semicolon and is set off by a comma.  A — a comma alone between two independent clauses is a comma splice.  B — a colon suggests the second clause explains the first; a contrastive relationship calls for a semicolon.  C — a dash works but is more informal than a semicolon.","slug":"gri-mod-sat-g13-1-3","ans":"D"},{"stem":"The committee reviewed the annual report ______ it found several inconsistencies in the financial projections.  Which punctuation is correct?","why":"C is correct. Two independent clauses with a causal relationship — a semicolon correctly separates them without requiring a conjunction.  A — a comma splice.  B — a colon works only if the second clause directly explains or defines the first; 'several inconsistencies' is a result, not a definition.  D — a dash is informal.","slug":"gri-mod-sat-g13-1-4","ans":"C","choices":{"A":"report, it","B":"report: it","C":"report; it","D":"report — it"},"n":4},{"stem":"The discovery ______ made by a graduate student working alone late at night ______ overturned sixty years of accepted theory.  Which choice correctly uses dashes to set off the parenthetical?","why":"A is correct. Dashes come in pairs to set off a parenthetical phrase. Both dashes must be present and must enclose the entire phrase.  B — commas are the standard way to set off a non-restrictive phrase; dashes are used for greater emphasis.  C — only one dash is used, leaving the phrase incorrectly closed.  D — the dashes set off 'working alone late at night' rather than the full parenthetical about the graduate student.","ans":"A","choices":{"B":"discovery, made by a graduate student working alone late at night, overturned","A":"discovery — made by a graduate student working alone late at night — overturned","D":"discovery made by a graduate student — working alone late at night — overturned","C":"discovery — made by a graduate student working alone late at night overturned"},"n":5,"slug":"gri-mod-sat-g13-1-5"},{"choices":{"C":"thing;","D":"thing —","A":"thing:","B":"thing,"},"n":6,"stem":"She had always wanted only one thing ______ to write a novel that would outlast her.  Which punctuation introduces the infinitive phrase?","why":"A is correct. A colon after a complete clause introduces a phrase that explains or specifies what was mentioned. 'To write a novel that would outlast her' specifies the 'one thing.'  B — a comma is too weak to introduce a specifying phrase following a complete clause.  C — a semicolon cannot introduce a non-independent phrase.  D — a dash is acceptable but less formal than a colon.","slug":"gri-mod-sat-g13-1-6","ans":"A"},{"choices":{"A":"The summit however was declared inconclusive by most observers.","B":"However the summit was declared inconclusive by most observers.","D":"The summit, however, was declared inconclusive by most observers.","C":"The summit was declared inconclusive, however by most observers."},"n":7,"why":"D is correct. 'However' as a parenthetical adverb within a sentence is set off by commas on both sides.  A — 'however' without commas is not properly punctuated as a parenthetical.  B — 'however' at the start of a sentence needs a comma after it.  C — 'however' followed by only one comma places it incorrectly within the sentence.","slug":"gri-mod-sat-g13-1-7","stem":"The delegates arrived from twelve countries; the agenda included trade, climate, and security. ______  Which sentence could logically follow, using correct punctuation?","ans":"D"},{"choices":{"A":"departments, engineering, finance, and operations, each","B":"departments: engineering, finance, and operations, each","D":"departments engineering, finance, and operations, each","C":"departments — engineering, finance, and operations — each"},"n":8,"slug":"gri-mod-sat-g13-1-8","why":"C is correct. When a list contains commas internally, dashes (rather than commas) should be used to set off the parenthetical list, preventing confusion between the list commas and the enclosing punctuation.  A — using commas around a list that already contains commas creates ambiguity.  B — a colon introduces a list but cannot also set off a parenthetical this way.  D — no punctuation around the parenthetical list is incorrect.","stem":"The three largest departments ______ engineering, finance, and operations ______ each submitted separate budget proposals.  Which choice is correct?","ans":"C"},{"slug":"gri-mod-sat-g13-1-9","why":"C is correct. A colon after a complete clause introduces the content that the clause announces. 'The chef's philosophy was simple' announces the philosophy; the colon delivers it.  A — a comma before an independent explanatory clause is non-standard.  B — a semicolon implies the two clauses are coordinate, but here the second delivers the content of the first.  D — a dash could work but a colon is more precise.","stem":"The chef's philosophy was simple ______ fresh ingredients, prepared with minimal interference, always produce the best results.  Which punctuation is correct?","ans":"C","choices":{"A":"simple,","B":"simple;","C":"simple:","D":"simple —"},"n":9},{"n":10,"choices":{"B":"areas, subsequent","A":"areas; subsequent","D":"areas however,","C":"areas: subsequent"},"ans":"A","stem":"The first wave of immigrants settled primarily in urban areas ______ subsequent generations, however, moved to suburban and rural communities.  Which punctuation correctly joins these clauses?","why":"A is correct. Two independent clauses in a contrastive relationship, with 'however' as the conjunctive adverb. Semicolon before the first clause's end + however + comma after 'however'.  B — comma splice.  C — a colon implies the second clause explains the first; the contrastive 'however' makes a semicolon more appropriate.  D — 'however' without preceding semicolon makes a run-on.","slug":"gri-mod-sat-g13-1-10"},{"choices":{"D":"chair, who had served on the board for eleven years — announced","C":"chair — who had served on the board for eleven years, announced","A":"chair — who had served on the board for eleven years — announced","B":"chair, who had served on the board for eleven years, announced"},"n":11,"slug":"gri-mod-sat-g13-1-11","why":"A is correct. Dashes must be used in pairs to enclose a parenthetical. Both dashes are required, surrounding the entire relative clause.  B — commas are correct for non-restrictive relative clauses; both are grammatically acceptable, but A uses dashes for emphasis.  C — one dash opens but a comma closes the parenthetical; mismatched punctuation.  D — comma opens but a dash closes; also mismatched.","stem":"The committee chair ______ who had served on the board for eleven years ______ announced her resignation at the end of the meeting.  Which choice correctly uses dashes?","ans":"A"},{"n":12,"choices":{"B":"policy:","A":"policy,","D":"policy —","C":"policy;"},"ans":"B","stem":"The report recommended several changes to current policy ______ raising the minimum wage, expanding childcare subsidies, and increasing funding for vocational training.  Which punctuation is correct?","why":"B is correct. A colon after 'policy' introduces the list of changes that the report recommended. The clause before the colon is grammatically complete.  A — a comma is too weak to formally introduce a list following a complete clause.  C — a semicolon cannot introduce a list that is not an independent clause.  D — a dash works but a colon is preferred in formal writing.","slug":"gri-mod-sat-g13-1-12"},{"stem":"The funding was distributed across five divisions ______ each received an equal allocation based on headcount.  Which choice is correct?","slug":"gri-mod-sat-g13-1-13","why":"D is correct. Two independent clauses; the second elaborates on the first. A semicolon correctly separates them.  A — comma splice.  B — a colon works only when the second clause directly defines or explains a specific term in the first.  C — no punctuation between two independent clauses is a run-on.","ans":"D","choices":{"B":"divisions: each","A":"divisions, each","D":"divisions; each","C":"divisions each"},"n":13},{"choices":{"B":"flaw,","A":"flaw —","C":"flaw:","D":"flaw;"},"n":14,"stem":"Her argument had one fatal flaw ______ it assumed that all participants had access to the same information.  Which punctuation best introduces this single explanatory clause for emphasis?","why":"A is correct. A dash introduces an explanation with emphasis or dramatic effect. While a colon is also correct, the SAT often uses a dash to signal an abrupt or emphatic explanation.  B — a comma is too weak to introduce an independent explanatory clause.  C — a colon is also grammatically correct but the dash is the stronger answer here when emphasis is specified.  D — a semicolon implies two coordinate, equally weighted clauses.","ans":"A","slug":"gri-mod-sat-g13-1-14"},{"slug":"gri-mod-sat-g13-1-15","why":"B is correct. After a semicolon, an independent clause is required. 'New methodologies are emerging regularly' is a complete independent clause.  A — 'however, with new methodologies emerging regularly' is a prepositional phrase fragment, not a complete clause.  C — 'new methodologies, emerging regularly' lacks a main verb; fragment.  D — 'emerging new methodologies regularly' lacks a subject and main verb; fragment.","stem":"Research in this area has accelerated rapidly over the past decade; ______  Which choice correctly continues after the semicolon?","ans":"B","choices":{"B":"new methodologies are emerging regularly.","A":"however, with new methodologies emerging regularly.","C":"new methodologies, emerging regularly.","D":"emerging new methodologies regularly."},"n":15},{"stem":"Only one factor distinguished the winning teams from the others ______ the ability to maintain composure under sustained pressure.  Which punctuation is correct?","slug":"gri-mod-sat-g13-1-16","why":"B is correct. 'Only one factor distinguished...' is a complete clause announcing that one factor will be named. The colon delivers the specific factor.  A — a comma cannot introduce an identifying appositive after a full clause.  C — a semicolon would imply the second element is an independent clause, but 'the ability...' is a noun phrase.  D — a dash is acceptable but the colon is the preferred formal choice.","ans":"B","choices":{"C":"others;","D":"others —","B":"others:","A":"others,"},"n":16},{"ans":"B","why":"B is correct. A parenthetical list with internal commas should be enclosed in dashes, not commas, to prevent confusion. Both dashes must be present.  A — using commas around a list that already contains commas creates ambiguity.  C — mismatched punctuation (colon opens, dash closes) is incorrect.  D — one dash opens and a comma closes; mismatched punctuation.","stem":"The artist used unexpected materials in her sculptures ______ reclaimed wood, industrial wire, and broken glass ______ to create works that commented on urban decay.  Which choice correctly punctuates the parenthetical list?","n":17,"choices":{"C":"sculptures: reclaimed wood, industrial wire, and broken glass — to","D":"sculptures — reclaimed wood, industrial wire, and broken glass, to","A":"sculptures, reclaimed wood, industrial wire, and broken glass, to","B":"sculptures — reclaimed wood, industrial wire, and broken glass — to"},"slug":"gri-mod-sat-g13-1-17"},{"n":18,"choices":{"A":"as a result,","B":"as a result, ridership","C":"as a result","D":"as a result ridership"},"ans":"B","why":"B is correct. After a semicolon, a complete independent clause is required. 'As a result, ridership increased...' includes the conjunctive adverb followed by a comma and then the full clause.  A — 'as a result,' without a subject and verb is a fragment.  C — same issue; no subject or verb follows.  D — 'as a result ridership' omits the required comma after the conjunctive adverb.","slug":"gri-mod-sat-g13-1-18","stem":"The city invested heavily in public transit; ______ ridership increased by twenty-two percent within the first year.  Which choice correctly continues after the semicolon?"},{"ans":"C","stem":"The documentary focuses on one central question ______ what drives individuals to sacrifice personal safety for the benefit of strangers?  Which punctuation introduces the question?","why":"C is correct. A colon can introduce a question that specifies or explains what has been referred to in the preceding clause. 'The central question' announces that a question will follow.  A — a comma before an embedded question following a full clause is too weak.  B — a semicolon cannot introduce a non-independent question.  D — a dash could work but a colon is more precise.","n":19,"choices":{"A":"question,","B":"question;","D":"question —","C":"question:"},"slug":"gri-mod-sat-g13-1-19"},{"n":20,"choices":{"C":"season: her","D":"season her","B":"season; her","A":"season, her"},"ans":"B","stem":"The athlete trained for eight hours each day during the off-season ______ her dedication eventually earned her a place on the national team.  Which punctuation is correct?","why":"B is correct. Two independent clauses — a semicolon separates them. The second clause explains the result of the first.  A — comma splice.  C — a colon works if the second clause directly defines something named in the first; here the second clause is a result, not a definition.  D — no punctuation is a run-on.","slug":"gri-mod-sat-g13-1-20"},{"ans":"A","why":"A is correct. A dash is the most emphatic punctuation for introducing a short, dramatic direct statement or quotation after a complete clause. On the SAT, when 'emphasis' or 'drama' is specified, the dash is preferred over the colon.  B — a colon is also grammatically correct but less emphatic.  C — a semicolon would require the second element to be an independent clause without a direct quotation function.  D — a comma is too weak.","slug":"gri-mod-sat-g13-1-21","stem":"His advice was blunt ______ quit while you still can.  Which punctuation correctly introduces the quoted advice for emphasis?","n":21,"choices":{"C":"blunt;","D":"blunt,","A":"blunt —","B":"blunt:"}},{"choices":{"A":"factors;","B":"factors,","D":"factors:","C":"factors —"},"n":22,"why":"D is correct. A colon after a complete clause formally introduces the list of four factors.  A — a semicolon cannot introduce a list that is not an independent clause.  B — a comma before a formal list following a complete clause is non-standard.  C — a dash is informal; a colon is preferred in formal contexts.","stem":"The study identified four primary risk factors ______ sedentary lifestyle, poor diet, chronic stress, and inadequate sleep.  Which punctuation is correct?","ans":"D","slug":"gri-mod-sat-g13-1-22"},{"ans":"A","why":"A is correct. After a semicolon, a complete independent clause is required. 'Others point to...' is a clean, complete clause. No additional punctuation is needed here since 'others' simply introduces the contrasting subject.  B — a comma after 'others' is not needed since no parenthetical follows.  C — 'others, however,' would be correct if 'however' were used, but 'however' is unnecessary when the contrast is already established by 'some...others.'  D — same issue; 'however' without commas is also incorrect.","slug":"gri-mod-sat-g13-1-23","stem":"Some economists argue that automation will eliminate millions of jobs; ______ point to the historical pattern of technology creating more employment than it destroys.  Which choice correctly completes the sentence after the semicolon?","n":23,"choices":{"D":"others however","C":"others, however,","A":"others","B":"others,"}},{"why":"C is correct. 'Its ability to make inhabitants...' is a noun phrase that defines what the architect described as the most important quality. A colon introduces this defining or specifying element after a complete clause.  A — a comma before a complex noun phrase following a complete clause is non-standard.  B — a semicolon cannot introduce a noun phrase.  D — a dash works but a colon is the formal preference.","stem":"The architect described the building's most important quality ______ its ability to make inhabitants feel both sheltered and connected to the outside world simultaneously.  Which punctuation correctly introduces the description?","ans":"C","choices":{"C":"quality:","D":"quality —","A":"quality,","B":"quality;"},"n":24,"slug":"gri-mod-sat-g13-1-24"},{"ans":"D","stem":"The candidate promised meaningful reform ______ a promise she would spend the next four years struggling to fulfill.  Which punctuation correctly introduces the appended comment?","why":"D is correct. A dash before an appended comment at the end of a sentence signals an abrupt addition or afterthought. 'A promise she would spend the next four years struggling to fulfill' is an emphatic addition to the main clause.  A — a colon works when the second element defines or explains something in the first clause; 'a promise' is more of an appended ironic comment.  B — a comma before a long appended appositive is too weak.  C — a semicolon requires the appended element to be an independent clause; 'a promise she would...' is a noun phrase.","n":25,"choices":{"B":"reform,","A":"reform:","D":"reform —","C":"reform;"},"slug":"gri-mod-sat-g13-1-25"}]}],"name":"Punctuation — Colons, Semicolons & Dashes","group":"Dilbilgisi","id":"g13","eyebrow":"Gramer"},{"eyebrow":"Gramer","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Subject–Verb Agreement. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"ans":"D","slug":"gri-mod-sat-g14-1-1","why":"D is correct. The subject is 'the committee' (singular). Phrases beginning with 'along with,' 'as well as,' or 'together with' that are inserted between the subject and verb do not change the subject's number. The verb must be singular: 'is.'  A — 'are' treats 'committee' as plural.  B — 'were' is past tense and plural; the sentence is present.  C — 'have been' is plural and present perfect; the subject is singular.","stem":"The committee, along with its three subcommittees, ______ expected to deliver a final report by the end of the quarter.  Which verb form is correct?","n":1,"choices":{"A":"are","B":"were","C":"have been","D":"is"}},{"choices":{"B":"were","A":"was","D":"has been","C":"is"},"n":2,"stem":"Neither the lead researcher nor her assistants ______ able to explain the anomaly in the data.  Which verb form is correct?","why":"B is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb (the assistants = plural). 'Were' is correct.  A — 'was' agrees with the singular 'researcher,' not the closest subject 'assistants.'  C — 'is' is singular and present; incorrect.  D — 'has been' is singular present perfect; incorrect.","ans":"B","slug":"gri-mod-sat-g14-1-2"},{"slug":"gri-mod-sat-g14-1-3","stem":"Each of the submitted proposals ______ reviewed by a panel of three independent judges.  Which verb form is correct?","why":"D is correct. 'Each' is always singular. The subject is 'each' (not 'proposals'). 'Was reviewed' is correct.  A — 'were' agrees with 'proposals' rather than 'each.'  B — 'are' is plural present; 'each' is singular.  C — 'have been' is plural present perfect; 'each' is singular.","ans":"D","choices":{"D":"was","C":"have been","B":"are","A":"were"},"n":3},{"ans":"A","stem":"The results of the experiment ______ published in three separate peer-reviewed journals.  Which verb form is correct?","why":"A is correct. Strip the prepositional phrase 'of the experiment.' The subject is 'results' (plural). 'Were published' is correct.  B — 'was' agrees with 'experiment,' not the subject 'results.'  C — 'is' is singular present; incorrect.  D — 'has been' is singular present perfect; incorrect.","n":4,"choices":{"A":"were","B":"was","D":"has been","C":"is"},"slug":"gri-mod-sat-g14-1-4"},{"slug":"gri-mod-sat-g14-1-5","ans":"A","why":"A is correct. 'The number' (as opposed to 'a number') is singular. 'The number of applications...has exceeded' is correct.  B — 'have' treats 'number' as plural.  C — 'were' is past plural; 'the number' is singular.  D — 'are' is plural present; incorrect.","stem":"The number of applications received this year ______ exceeded all previous records.  Which verb form is correct?","n":5,"choices":{"D":"are","C":"were","B":"have","A":"has"}},{"n":6,"choices":{"A":"have","B":"were","D":"are","C":"has"},"ans":"C","stem":"Statistics, as a discipline, ______ undergone significant methodological changes over the past two decades.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-6","why":"C is correct. 'Statistics' used as the name of an academic discipline is treated as singular, like 'physics' or 'economics.' 'Has undergone' is correct.  A — 'have' treats statistics as a plural noun.  B — 'were' is past plural.  D — 'are' is plural present."},{"n":7,"choices":{"C":"have been","D":"is","A":"are","B":"were"},"ans":"D","why":"D is correct. 'One' is singular. Strip 'of the most significant challenges facing the organization.' The subject is 'one.' 'Is' is correct.  A — 'are' agrees with 'challenges,' not the subject 'one.'  B — 'were' is plural past.  C — 'have been' is plural present perfect.","slug":"gri-mod-sat-g14-1-7","stem":"One of the most significant challenges facing the organization ______ the lack of consistent funding from year to year.  Which verb form is correct?"},{"choices":{"A":"are","B":"were","D":"is","C":"have been"},"n":8,"slug":"gri-mod-sat-g14-1-8","why":"D is correct. With 'either...or,' the verb agrees with the subject closest to the verb. 'Executive director' is singular, so 'is required' is correct.  A — 'are' agrees with 'board members' rather than the closest subject.  B — 'were' is past and plural.  C — 'have been' is plural present perfect.","stem":"Either the board members or the executive director ______ required to sign the revised agreement.  Which verb form is correct?","ans":"D"},{"choices":{"A":"support","B":"supports","C":"have supported","D":"are supporting"},"n":9,"stem":"The data collected over twelve years of fieldwork ______ the researchers' initial hypothesis.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-9","why":"B is correct. 'Data' in academic and scientific writing is now commonly treated as singular (like 'information'). The SAT generally treats 'data' as singular when it is used as an uncountable noun.  A — 'support' is correct only if treating 'data' as plural, which the SAT does not consistently do.  C — 'have supported' is plural present perfect.  D — 'are supporting' is plural present progressive.","ans":"B"},{"ans":"B","stem":"The team of analysts ______ three months to complete the full audit.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-10","why":"B is correct. 'Team' is a collective noun treated as singular in American English. 'Takes' is correct.  A — 'take' treats 'team' as plural.  C — 'have taken' is plural present perfect.  D — 'were taking' is past plural.","n":10,"choices":{"B":"takes","A":"take","D":"were taking","C":"have taken"}},{"choices":{"B":"is","A":"was","D":"has been","C":"were"},"n":11,"stem":"Neither the funding proposal nor the supporting documents ______ submitted before the deadline.  Which verb form is correct?","why":"C is correct. With 'neither...nor,' agree with the subject closest to the verb. 'Documents' is plural, so 'were submitted' is correct.  A — 'was' agrees with 'proposal,' not the closer 'documents.'  B — 'is' is singular present.  D — 'has been' is singular present perfect.","slug":"gri-mod-sat-g14-1-11","ans":"C"},{"ans":"D","stem":"There ______ significant differences between the two methodologies that must be addressed before the study proceeds.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-12","why":"D is correct. Invert the sentence: 'Significant differences are there.' The subject is 'differences' (plural). 'Are' is correct.  A — 'is' agrees with 'there' rather than the real subject 'differences.'  B — 'was' is past singular.  C — 'has been' is singular present perfect.","n":12,"choices":{"B":"was","A":"is","C":"has been","D":"are"}},{"ans":"C","stem":"The professor as well as h
