<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
:root{--bg:#f0fdfa;--surface:#ffffff;--border:#0d9488;--blight:#ccfbf1;--text:#134e4a;--muted:#5eead4;--muted2:#6b7280;--teal:#0f766e;--tdark:#0d5e57;--tlight:#e6fffa;--taclight:#f0fdfa;--correct:#166534;--cbg:#f0fdf4;--wrong:#991b1b;--wbg:#fef2f2;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(155deg,#f0fdfa 50%,#ccfbf1 100%)}
.s-series{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#5eead4;margin-bottom:.6rem}
.s-badge{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1.1rem;border-radius:50px;margin-bottom:1.6rem}
.s-title{font-family:'Inter',sans-serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;line-height:1.2;margin-bottom:.7rem;color:var(--tdark)}
.s-desc{color:var(--muted2);font-size:.91rem;max-width:440px;line-height:1.65;margin-bottom:1.6rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.2rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.74rem;color:var(--teal);font-family:'DM Mono',monospace}
.btn-p{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.9rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.promo-card{background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.3rem;margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;max-width:320px;width:100%;text-align:center}
.promo-name{font-size:.77rem;color:var(--muted2);font-family:'DM Mono',monospace;letter-spacing:.04em}
.promo-sub{font-size:.68rem;color:var(--muted2);opacity:.7;font-family:'DM Mono',monospace}
.promo-exams{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:.12rem}
.promo-tag{background:transparent;border:1px solid var(--border);border-radius:4px;font-size:.61rem;font-family:'DM Mono',monospace;padding:.1rem .38rem;color:var(--teal);opacity:.85}
.promo-phone{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted2);opacity:.7;margin-top:.1rem}
#quiz{display:none;min-height:100vh;flex-direction:column}
.qbody{flex:1;max-width:680px;margin:0 auto;padding:1.8rem 1.2rem 2.5rem;width:100%}
.tracker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.15rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blight);border:1.5px solid var(--border);transition:all .2s;cursor:pointer}
.dot.ans{background:var(--teal);border-color:var(--teal)}
.dot.cur{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
.qtype-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blight);border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);padding:.25rem .65rem;margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pbox{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r);padding:1.15rem 1.35rem;margin-bottom:1.2rem;font-family:'Lora',serif;font-size:.95rem;line-height:1.78;color:#1c1917}
.pbox u{text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--teal);color:var(--tdark)}
.pbox .blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:60px;text-align:center;font-family:'DM Mono',monospace;font-size:.85rem;color:var(--teal);padding:0 .3rem}
.qt{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--tdark)}
.opts{display:flex;flex-direction:column;gap:.44rem;margin-bottom:1.4rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;background:var(--surface);border:1.5px solid var(--blight);border-radius:var(--r);padding:.65rem .95rem;cursor:pointer;transition:border-color .12s,background .12s;font-size:.91rem;color:var(--text);width:100%;text-align:left;font-family:'Lora',serif}
.opt:hover{border-color:var(--teal);background:var(--taclight)}
.opt.sel{border-color:var(--teal);background:var(--taclight)}
.ol{display:flex;align-items:center;justify-content:center;width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--border);font-size:.72rem;font-family:'DM Mono',monospace;font-weight:700;margin-top:1px;transition:all .12s;flex-shrink:0}
.opt.sel .ol{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center}
.btn-n{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:.55rem 1.1rem;font-size:.87rem;font-weight:600;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s}
.btn-n:hover{border-color:var(--tdark)}
.btn-n:disabled{opacity:.3;cursor:not-allowed}
.btn-sub{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.55rem 1.35rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-sub:hover{opacity:.85}
#results{display:none;background:var(--bg);min-height:100vh}
.rh{background:var(--teal);color:#fff;padding:2rem 1.5rem;text-align:center}
.rh h1{font-family:'Inter',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.rh p{opacity:.75;font-size:.82rem}
.rb{max-width:680px;margin:0 auto;padding:2rem 1.2rem 3rem}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.sc-big{text-align:center}
.sc-num{font-size:3.5rem;font-weight:700;color:var(--teal);font-family:'DM Mono',monospace;line-height:1}
.sc-den{font-size:.8rem;color:var(--muted2);font-family:'DM Mono',monospace}
.sc-pct{font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--tdark)}
.sc-rng{font-size:.8rem;color:var(--muted2);margin-bottom:.4rem}
.sc-tip{font-size:.8rem;color:var(--muted2);line-height:1.55}
.stitle{font-size:.65rem;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:.85rem;padding-bottom:.32rem;border-bottom:1px solid var(--border)}
.wi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.wh{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#fef2f2;border-bottom:1px solid #fecaca;cursor:pointer;user-select:none}
.wn{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--wrong);font-weight:700}
.wt{font-size:.8rem;color:var(--tdark);font-weight:600}
.wtog{margin-left:auto;font-size:.72rem;color:var(--muted2)}
.wb{padding:.9rem;display:none}
.wb.open{display:block}
.rpass{background:var(--bg);border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin-bottom:.7rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.72;color:#1c1917}
.rpass u{text-decoration:none;font-weight:700;color:var(--tdark)}
.ac{background:var(--cbg);color:var(--correct);font-size:.82rem;font-weight:600;padding:.33rem .7rem;border-radius:5px;margin-bottom:.25rem;font-family:'Lora',serif}
.aw{background:var(--wbg);color:var(--wrong);font-size:.82rem;padding:.33rem .7rem;border-radius:5px;margin-bottom:.55rem;text-decoration:line-through;font-family:'Lora',serif}
.expl{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.78rem .9rem;font-size:.82rem;line-height:1.7;color:#292524;white-space:pre-wrap}
.btn-rs{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.75rem 1.8rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:1rem;transition:opacity .15s}
.btn-rs:hover{opacity:.85}
.type-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.ts{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--teal)}
.ts.wrong{border-color:#fca5a5;background:var(--wbg);color:var(--wrong)}
@media(max-width:520px){.sc-card{grid-template-columns:1fr}.sc-num{font-size:2.7rem}}
  


  /* ── Pack Home ── */
  #pack-home{min-height:100vh;display:flex;flex-direction:column;background:var(--bg,#f0fdfa)}
  .ph-header{padding:2.5rem 2rem 2rem;text-align:center;background:var(--teal,#0d9488);color:#fff}
  .ph-series{font-size:.65rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;opacity:.7;margin-bottom:.4rem}

  const ALL_SETS=[null, {"n": 1, "topic": "Sentence Boundaries", "diff": "Sentence Boundaries", "qs": [{"k": "Boundaries", "p": "The research team completed the survey ahead of schedule, <u>______</u> the early completion allowed them to begin data analysis before the grant period expired.", "q": "Which choice most effectively combines the sentences and maintains clarity?", "o": ["A) schedule, and this", "B) schedule; additionally, this", "C) schedule this", "D) schedule and"], "a": 1, "e": "B is correct. Two independent clauses must be separated by a semicolon (or period). A semicolon followed by an adverbial connector (additionally) handles both the grammatical boundary and the logical connection.\n\nA — a comma before 'and this' works only if 'and' joins two independent clauses, but the comma-and combination creates a weak connection here.\nC — a comma alone between two independent clauses is a comma splice.\nD — no punctuation or conjunction creates a run-on sentence."}, {"k": "Boundaries", "p": "The documentary received widespread critical acclaim. <u>______</u> it failed to attract a large commercial audience despite its strong festival run.", "q": "Which choice correctly introduces the second sentence as a contrasting idea?", "o": ["A) However,", "B) Therefore,", "C) In addition,", "D) Consequently,"], "a": 0, "e": "A is correct. 'However' signals contrast — acclaim but no commercial audience. The two independent clauses are already separated by a period, so the transition simply needs to reflect the logical relationship.\n\nB — therefore signals a result, not a contrast.\nC — in addition signals continuation, not contrast.\nD — consequently signals a cause-effect result, not contrast."}, {"k": "Boundaries", "p": "The professor assigned three papers, two presentations, and a final exam, <u>______</u> several students requested a meeting to discuss the workload.", "q": "Which choice creates a grammatically correct sentence?", "o": ["A) as a result", "B) as a result,", "C) as a result of which", "D) ; as a result,"], "a": 3, "e": "D is correct. Both clauses are independent. A semicolon separates them correctly; the transition 'as a result' explains the causal relationship and is followed by a comma.\n\nA — no punctuation between two independent clauses creates a run-on.\nB — a comma before 'as a result' alone (without a semicolon) creates a comma splice.\nC — 'as a result of which' is a relative construction that would require restructuring the second clause."}, {"k": "Boundaries", "p": "The satellite was launched successfully, its solar panels deployed, <u>______</u> initial telemetry confirmed that all systems were functioning within expected parameters.", "q": "Which choice correctly joins the sentence?", "o": ["A) and", "B) and,", "C) however,", "D) , and"], "a": 3, "e": "D is correct. The sentence lists three coordinate events. A comma before 'and' before the final independent clause is correct in a series of this complexity.\n\nA — 'and' without a comma leaves ambiguity about whether the third clause is coordinate.\nB — 'and,' is not correct punctuation (the comma follows and, not precedes it).\nC — 'however' signals contrast, which is not the relationship here."}, {"k": "Boundaries", "p": "Dr. Okonkwo published her findings in a peer-reviewed journal <u>______</u> the study attracted attention from researchers in three related fields.", "q": "Which choice correctly joins the two independent clauses?", "o": ["A) , and", "B) ; and", "C) and", "D) , and so"], "a": 0, "e": "A is correct. A comma followed by a coordinating conjunction (and) correctly joins two independent clauses.\n\nB — a semicolon followed by 'and' is redundant; use one or the other.\nC — no comma before a coordinating conjunction joining two independent clauses is a common error.\nD — 'and so' is acceptable informally but creates a slightly awkward double conjunction."}, {"k": "Boundaries", "p": "The bridge reconstruction project was estimated to take eighteen months <u>______</u> unexpected complications with the foundational supports extended the timeline to nearly three years.", "q": "Which choice correctly punctuates the sentence?", "o": ["A) , however,", "B) ; however,", "C) however,", "D) , however"], "a": 1, "e": "B is correct. 'However' is a conjunctive adverb — it cannot join two independent clauses with only a comma. A semicolon before it and a comma after it is the correct pattern.\n\nA — comma before 'however' creates a comma splice.\nC — no punctuation before 'however' creates a run-on.\nD — 'however' without a trailing comma leaves the sentence grammatically incomplete."}, {"k": "Boundaries", "p": "The new zoning ordinance restricted building heights in the historic district. <u>______</u>", "q": "Which choice creates a complete sentence that could follow?", "o": ["A) Making renovation more complicated for property owners.", "B) Property owners found that renovation had become more complicated.", "C) Which made renovation more complicated for property owners.", "D) Because renovation had become more complicated for property owners."], "a": 1, "e": "B is correct. This is a complete independent clause with a subject (Property owners) and predicate (found).\n\nA — a participial phrase without a main clause is a sentence fragment.\nC — a relative clause beginning with 'which' cannot stand alone as a sentence.\nD — a subordinate clause beginning with 'because' requires a main clause to be grammatically complete."}, {"k": "Boundaries", "p": "The engineers tested the prototype under four different conditions: extreme heat, sub-zero temperatures, high humidity, and full solar exposure, <u>______</u> it performed within acceptable limits in all four scenarios.", "q": "Which choice correctly punctuates this sentence?", "o": ["A) and", "B) , and", "C) ; and", "D) and,"], "a": 1, "e": "B is correct. After a long introductory clause ending with a list, the comma before 'and' signals the main result clause. The comma here clarifies the sentence structure.\n\nA — without the comma, the 'and' appears to add 'full solar exposure' to the list rather than introducing a new clause.\nC — a semicolon before 'and' is redundant.\nD — 'and,' places the comma after the conjunction, which is incorrect."}, {"k": "Boundaries", "p": "The clinical trial enrolled five hundred participants, <u>______</u> each was randomly assigned to either the treatment or control group.", "q": "Which is correct?", "o": ["A) and each", "B) each", "C) , each", "D) ; each"], "a": 0, "e": "A is correct. Two independent clauses joined by 'and' with a comma is the standard coordinating conjunction pattern.\n\nB — no conjunction between two independent clauses creates a run-on.\nC — comma alone between two independent clauses is a comma splice.\nD — a semicolon without a connector is acceptable but the comma+and is more natural here."}, {"k": "Boundaries", "p": "Having reviewed the financial statements carefully, <u>______</u>", "q": "Which choice correctly completes the sentence with a grammatical main clause?", "o": ["A) the audit was deemed incomplete by the committee.", "B) the committee deemed the audit incomplete.", "C) an incomplete audit was what the committee found.", "D) it was the committee's finding that the audit was incomplete."], "a": 1, "e": "B is correct. The participial phrase 'Having reviewed the financial statements carefully' modifies the subject of the main clause, which must be the committee (the ones doing the reviewing).\n\nA — 'the audit' cannot have reviewed the statements; this is a dangling modifier.\nC — 'an incomplete audit' cannot have reviewed the statements; dangling modifier.\nD — 'it' cannot have reviewed the statements; dangling modifier."}, {"k": "Boundaries", "p": "The composer wrote the symphony in six weeks. <u>______</u> the premiere was delayed by more than a year due to scheduling conflicts with the orchestra.", "q": "Which transition correctly reflects the logical relationship?", "o": ["A) Therefore,", "B) Similarly,", "C) Nevertheless,", "D) For example,"], "a": 2, "e": "C is correct. Fast composition but long delay before premiere = an unexpected contrast. 'Nevertheless' signals that the delay happened despite the quick completion.\n\nA — therefore signals a logical result of the fast composition; delay is not a logical result.\nB — similarly signals that the second sentence parallels the first.\nD — for example introduces an illustration of the previous point."}, {"k": "Boundaries", "p": "The city council passed the revised parking ordinance, <u>______</u> the mayor vetoed it the following afternoon.", "q": "Which choice creates a grammatically correct sentence that signals contrast?", "o": ["A) however", "B) but", "C) , but", "D) ; and"], "a": 2, "e": "C is correct. Two independent clauses with a contrasting relationship — comma + coordinating conjunction 'but' is the correct form.\n\nA — 'however' is a conjunctive adverb that needs a semicolon before it.\nB — 'but' without a comma before it is a run-on.\nD — semicolon + 'and' signals addition, not contrast."}, {"k": "Boundaries", "p": "<u>______</u> the researchers decided to extend the study by six months.", "q": "Which choice creates a grammatically complete sentence with a correct subordinate clause?", "o": ["A) Because the initial results were inconclusive,", "B) The initial results being inconclusive,", "C) Initial results inconclusive,", "D) With the initial results being inconclusive about the question,"], "a": 0, "e": "A is correct. A subordinate clause beginning with 'because' followed by a comma, then the main clause, is grammatically complete.\n\nB — an absolute phrase with 'being' is acceptable but awkward; A is more direct.\nC — a noun phrase without a verb is not a grammatical clause.\nD — a prepositional phrase cannot substitute for a full subordinate clause."}, {"k": "Boundaries", "p": "The grant proposal was submitted on time, it was well-organized, <u>______</u> it exceeded the page limit by four pages.", "q": "Which choice corrects the grammatical errors in this sentence?", "o": ["A) and well-organized, however it", "B) it was well-organized, but it", "C) and it was well-organized; however, it", "D) well-organized, and it"], "a": 2, "e": "C is correct. Three independent clauses cannot be strung together with commas only. The best structure is: [clause], [clause]; however, [clause].\n\nA — still uses a comma before 'however' which is a comma splice.\nB — 'it was well-organized, but it' uses a comma with 'but' which is correct for two clauses but the opening 'submitted on time, it' is still a comma splice.\nD — 'well-organized, and it' loses the subject of the second clause."}, {"k": "Boundaries", "p": "The manufacturing process involves three distinct stages: raw material preparation, component assembly, and quality inspection, <u>______</u> each stage is carried out by a specialized team.", "q": "Which choice correctly punctuates this sentence?", "o": ["A) and", "B) — and", "C) ;", "D) , and,"], "a": 2, "e": "C is correct. After a long sentence with an internal list, a semicolon separates the first independent clause from the second without requiring a conjunction.\n\nA — 'and' alone creates a run-on after the comma following 'inspection'.\nB — a dash before 'and' is unconventional and grammatically awkward.\nD — commas flanking 'and' is not standard punctuation."}, {"k": "Boundaries", "p": "The student's argument was well-structured. <u>______</u> her evidence was drawn exclusively from secondary sources.", "q": "Which transition reflects that the next sentence adds a qualification?", "o": ["A) Moreover,", "B) However,", "C) Similarly,", "D) Therefore,"], "a": 1, "e": "B is correct. Well-structured BUT limited evidence = a qualification or contrast. 'However' signals this limitation.\n\nA — moreover adds supporting or escalating information.\nC — similarly signals parallel ideas.\nD — therefore signals a conclusion or result."}, {"k": "Boundaries", "p": "The architect submitted the final blueprints three weeks early <u>______</u> this gave the contractors time to source materials before ground-breaking.", "q": "Which choice correctly joins the clauses?", "o": ["A) , and", "B) , and so", "C) , this", "D) ; this"], "a": 3, "e": "D is correct. Two independent clauses separated by a semicolon — the second explains the result of the first. No conjunction is needed with a semicolon.\n\nA — comma + 'and' is acceptable but 'this' still needs to be the subject of the second clause, which it is; however D is more precise.\nB — 'and so' is informal and somewhat redundant.\nC — a comma before 'this' creates a comma splice."}, {"k": "Boundaries", "p": "The exhibit was open to the public for three months. <u>______</u> it attracted over ninety thousand visitors.", "q": "Which choice correctly introduces the second sentence as showing a result?", "o": ["A) In contrast,", "B) During that time,", "C) Nevertheless,", "D) Despite this,"], "a": 1, "e": "B is correct. Ninety thousand visitors over three months = a result of being open during that time. 'During that time' connects the result to the period mentioned.\n\nA — in contrast signals opposition, which is not appropriate here.\nC — nevertheless signals a concessive result (unexpected despite prior conditions).\nD — despite this signals that the result happened in spite of something negative."}, {"k": "Boundaries", "p": "The forensic accountant identified three fraudulent transactions. <u>______</u> the pattern she uncovered suggested that dozens more had gone undetected.", "q": "Which transition correctly signals that the second finding is more significant?", "o": ["A) However,", "B) More importantly,", "C) For example,", "D) In other words,"], "a": 1, "e": "B is correct. Three found, possibly dozens more undetected = a more important or escalating finding. 'More importantly' signals that the second point matters more.\n\nA — however signals contrast; the second sentence extends rather than contradicts.\nC — for example introduces an illustration.\nD — in other words signals a restatement."}, {"k": "Boundaries", "p": "The new policy was designed to reduce energy consumption in commercial buildings, <u>______</u> preliminary assessments suggest it may also lower operating costs significantly.", "q": "Which choice correctly joins the clauses and signals addition?", "o": ["A) and", "B) , and", "C) ; furthermore,", "D) however,"], "a": 1, "e": "B is correct. Comma + 'and' joins two independent clauses and signals that the second point adds to the first.\n\nA — 'and' without a comma before a second independent clause is a run-on.\nC — semicolon + 'furthermore' is grammatically correct but more formal than necessary.\nD — 'however' signals contrast; the second clause adds to, not contradicts, the first."}, {"k": "Boundaries", "p": "<u>______</u> the renovation project required approval from five separate city departments, which caused significant delays.", "q": "Which choice creates a correct sentence?", "o": ["A) Because it was complex,", "B) As a complex undertaking,", "C) Complexity being present,", "D) Despite being complex,"], "a": 1, "e": "B is correct. 'As a complex undertaking' is a prepositional phrase that correctly modifies the subject 'the renovation project' in the main clause.\n\nA — 'because it was complex' implies the complexity caused the approval requirements, but 'it' is ambiguous.\nC — 'Complexity being present' is an absolute phrase that is awkward and imprecise.\nD — 'Despite being complex' implies the complexity made the approval requirements surprising, which changes the meaning."}, {"k": "Boundaries", "p": "The conference speakers included economists, historians, and sociologists, <u>______</u> represented five different countries.", "q": "Which choice is correct?", "o": ["A) who", "B) they", "C) and who", "D) , who"], "a": 3, "e": "D is correct. A relative clause 'who represented five different countries' modifies 'speakers' and requires a comma before 'who' because it is non-restrictive (all of them represented different countries).\n\nA — 'who' without a comma makes the clause restrictive, implying only some speakers represented five countries.\nB — 'they' creates a second independent clause without proper punctuation (comma splice).\nC — 'and who' suggests a parallel relative clause but disrupts the grammar."}, {"k": "Boundaries", "p": "The laboratory's funding was not renewed. <u>______</u>", "q": "Which choice creates a grammatically complete and meaningful follow-up sentence?", "o": ["A) Forcing the team to dissolve and all equipment sold.", "B) The team dissolved, and all equipment was sold.", "C) The team dissolving and equipment being sold.", "D) As the team dissolved and all equipment sold."], "a": 1, "e": "B is correct. Subject (The team) + predicate (dissolved) + coordinating clause = a grammatically complete sentence.\n\nA — a participial phrase fragment; no main clause.\nC — two gerund phrases without a main verb; fragment.\nD — a subordinate clause beginning with 'As' without a main clause; fragment."}, {"k": "Boundaries", "p": "The policy was unpopular with residents, businesses, and community organizations alike <u>______</u> the council passed it by a narrow margin.", "q": "Which choice correctly punctuates and signals the relationship?", "o": ["A) ; nevertheless,", "B) , nevertheless,", "C) , nevertheless", "D) nevertheless,"], "a": 0, "e": "A is correct. Two independent clauses with a concessive relationship — unpopular but passed. Semicolon before 'nevertheless' and comma after it is the correct pattern.\n\nB — comma before 'nevertheless' is a comma splice.\nC — same issue; comma splice and missing comma after 'nevertheless'.\nD — no punctuation before 'nevertheless' creates a run-on."}, {"k": "Boundaries", "p": "The scientist had hypothesized that the temperature increase would accelerate bacterial growth <u>______</u> the experimental results showed the opposite effect.", "q": "Which choice correctly joins the sentences and signals contrast?", "o": ["A) however", "B) ; however,", "C) , however", "D) but, however,"], "a": 1, "e": "B is correct. Two independent clauses in contrast — a hypothesis contradicted by results. Semicolon + however + comma is standard.\n\nA — 'however' without preceding semicolon creates a run-on.\nC — comma before 'however' is a comma splice.\nD — using both 'but' and 'however' is redundant."}]}, {"n": 2, "topic": "Punctuation — Commas", "diff": "Punctuation — Commas", "qs": [{"k": "Commas", "p": "The committee, <u>______</u> had been working on the proposal for three months, submitted its final recommendation to the board.", "q": "Which choice correctly punctuates the relative clause?", "o": ["A) which", "B) which,", "C) , which", "D) that"], "a": 2, "e": "C is correct. The relative clause 'which had been working on the proposal for three months' is non-restrictive — it adds information rather than defining which committee. Non-restrictive clauses are set off by commas on both sides. Since there is already a comma before the blank, the opening of the clause should be ', which'.\n\nA — 'which' without a comma makes the clause appear restrictive.\nB — 'which,' adds a comma in the wrong position.\nD — 'that' is used only with restrictive clauses."}, {"k": "Commas", "p": "The manuscript, <u>______</u> has been revised seventeen times, is finally ready for submission.", "q": "Which choice correctly punctuates the sentence?", "o": ["A) which", "B) which,", "C) that", "D) , which"], "a": 1, "e": "B is correct. The non-restrictive clause 'which has been revised seventeen times' is embedded between two commas: 'The manuscript, which has been revised seventeen times, is finally ready.' The blank follows the first comma, so 'which,' (which followed by the closing comma) is the correct form here.\n\nA — 'which' without the closing comma leaves the clause improperly punctuated.\nC — 'that' introduces restrictive clauses; this is non-restrictive.\nD — ', which' would create a second opening comma where one already exists."}, {"k": "Commas", "p": "The novel explores themes of identity, displacement, <u>______</u> belonging, and memory.", "q": "Which choice is correct?", "o": ["A) ,", "B) and", "C) and,", "D) No change — no punctuation needed"], "a": 3, "e": "D is correct. In a list of four items — identity, displacement, belonging, and memory — commas separate each item and 'and' precedes the last. No additional punctuation is needed between 'displacement' and 'belonging' because the existing comma after 'displacement' already separates the items.\n\nA — an extra comma creates an unnecessary pause.\nB — 'and' between each item is not standard list punctuation.\nC — 'and,' after displacement changes the list structure incorrectly."}, {"k": "Commas", "p": "Dr. Lee, the department chair <u>______</u> delivered the opening remarks at the annual conference.", "q": "Which choice correctly punctuates the appositive?", "o": ["A) , delivered", "B) , delivered,", "C) delivered", "D) — delivered"], "a": 0, "e": "A is correct. 'The department chair' is a non-restrictive appositive that must be set off by commas on both sides. Since a comma appears before it, a comma must follow it: 'Dr. Lee, the department chair, delivered...'\n\nB — a comma after 'delivered' is incorrect; the closing comma of the appositive belongs after 'chair'.\nC — no comma after 'chair' leaves the appositive improperly punctuated.\nD — a dash is used for emphatic appositives, not standard non-restrictive appositives."}, {"k": "Commas", "p": "When the results of the third trial were finally published <u>______</u> the scientific community responded with widespread skepticism.", "q": "Which choice correctly punctuates the sentence?", "o": ["A) , published", "B) published,", "C) published", "D) ; published,"], "a": 1, "e": "B is correct. A subordinate clause at the beginning of a sentence ('When the results...were finally published') is followed by a comma before the main clause. The comma goes after the last word of the introductory clause.\n\nA — comma before 'published' cuts into the introductory clause incorrectly.\nC — no comma after 'published' omits the required pause after an introductory clause.\nD — a semicolon cannot follow a subordinate clause; semicolons join independent clauses."}, {"k": "Commas", "p": "The museum's newest acquisition, a bronze sculpture from the fourteenth century, <u>______</u> visitors from around the world.", "q": "Which choice correctly completes the sentence?", "o": ["A) attracts, surprisingly,", "B) attracts", "C) surprisingly attracts", "D) attracts, surprisingly"], "a": 1, "e": "B is correct. The appositive ('a bronze sculpture from the fourteenth century') is already enclosed in commas. The main verb 'attracts' follows directly after the closing comma with no additional punctuation needed.\n\nA — 'attracts, surprisingly,' creates an unnecessary interrupting phrase that disrupts the predicate.\nC — 'surprisingly attracts' is grammatically fine but the adverb placement is unusual; B is cleaner.\nD — 'attracts, surprisingly' places an unneeded comma after the verb."}, {"k": "Commas", "p": "The professor assigned readings from three authors: Fitzgerald <u>______</u> Woolf, and Achebe.", "q": "Which choice is correct?", "o": ["A) , Fitzgerald,", "B) Fitzgerald,", "C) Fitzgerald", "D) Fitzgerald; Woolf"], "a": 1, "e": "B is correct. In a three-item list following a colon, commas separate the items: Fitzgerald, Woolf, and Achebe.\n\nA — a comma before 'Fitzgerald' follows the colon, which is not needed.\nC — no comma after 'Fitzgerald' means the list lacks proper separation between the first and second items.\nD — semicolons in a list are used only when the items themselves contain commas."}, {"k": "Commas", "p": "Although the budget was significantly reduced <u>______</u> the team managed to complete the project without sacrificing quality.", "q": "Which punctuation correctly follows the introductory clause?", "o": ["A) reduced; the", "B) reduced, the", "C) reduced the", "D) reduced — the"], "a": 1, "e": "B is correct. An introductory subordinate clause ('Although...reduced') is separated from the main clause by a comma.\n\nA — a semicolon cannot follow a subordinate clause; it joins two independent clauses.\nC — no comma after the introductory clause omits required punctuation.\nD — a dash is emphatic and non-standard in this context."}, {"k": "Commas", "p": "The report, <u>______</u> outlined three major findings: increased carbon levels, declining biodiversity, and rising sea temperatures.", "q": "Which choice correctly punctuates the parenthetical?", "o": ["A) which was released in March,", "B) released in March", "C) which was released in March", "D) released in March,"], "a": 3, "e": "D is correct. 'Released in March' is a participial phrase modifying 'the report.' Since a comma already precedes it, a comma must follow it before the main verb: 'The report, released in March, outlined...'\n\nA — 'which was released in March,' adds unnecessary words; the participial form is more concise, but A would also be grammatically correct.\nC — 'which was released in March' without a closing comma leaves the non-restrictive clause improperly punctuated.\nB — 'released in March' without a closing comma omits the second required comma."}, {"k": "Commas", "p": "The hiring committee reviewed over two hundred applications <u>______</u> ultimately selecting twelve candidates for interviews.", "q": "Which punctuation is correct before the participial phrase?", "o": ["A) applications ultimately", "B) applications, ultimately", "C) applications; ultimately", "D) applications — ultimately"], "a": 1, "e": "B is correct. A participial phrase that adds information to a complete clause ('ultimately selecting twelve candidates') is separated from the main clause by a comma.\n\nA — no comma omits the required pause before the participial phrase.\nC — a semicolon cannot precede a participial phrase; it joins two independent clauses.\nD — a dash could work for emphasis but is less conventional here."}, {"k": "Commas", "p": "The building <u>______</u> constructed in 1892 <u>______</u> was designated a national landmark last year.", "q": "Which choice correctly punctuates the embedded participial phrase?", "o": ["A) building constructed in 1892 was", "B) building, constructed in 1892, was", "C) building, constructed in 1892 was", "D) building constructed in 1892, was"], "a": 1, "e": "B is correct. 'Constructed in 1892' is a non-restrictive participial phrase modifying 'the building' and must be set off by commas on both sides.\n\nA — no commas make the phrase restrictive (implying there are other buildings that were not constructed in 1892).\nC — opening comma but no closing comma leaves the phrase improperly enclosed.\nD — closing comma without an opening comma is asymmetrical and incorrect."}, {"k": "Commas", "p": "To qualify for the scholarship, students must maintain a minimum GPA of 3.5, complete thirty hours of community service <u>______</u> and submit two letters of recommendation.", "q": "Which choice is correct?", "o": ["A) service and", "B) service, and", "C) service; and", "D) service —  and"], "a": 1, "e": "B is correct. In a list of three items ('maintain...complete...submit'), a comma before 'and' before the final item is the Oxford comma, which is required on the SAT to prevent ambiguity.\n\nA — no comma before 'and' omits the Oxford comma and can create ambiguity.\nC — a semicolon before 'and' in a simple list is incorrect; semicolons in lists are reserved for items containing internal commas.\nD — a dash before 'and' is not standard in a parallel list."}, {"k": "Commas", "p": "The award <u>______</u> presented annually since 1978 <u>______</u> recognizes outstanding contributions to public education.", "q": "Which choice correctly punctuates the non-restrictive phrase?", "o": ["A) award presented annually since 1978 recognizes", "B) award, presented annually since 1978 recognizes", "C) award, presented annually since 1978, recognizes", "D) award presented annually since 1978, recognizes"], "a": 2, "e": "C is correct. 'Presented annually since 1978' is a non-restrictive participial phrase that must be set off with commas on both sides.\n\nA — no commas make the phrase restrictive.\nB — opening comma but no closing comma is asymmetrical.\nD — closing comma without opening comma is incorrect."}, {"k": "Commas", "p": "She spoke quietly, <u>______</u> deliberately, and without the emotional intensity the audience had expected.", "q": "Which choice is correct?", "o": ["A) slowly,", "B) slowly", "C) slowly; and", "D) slowly and"], "a": 0, "e": "A is correct. 'Quietly, slowly, deliberately, and without...' is a four-item list of adverbs/phrases. A comma after each item (including 'slowly') maintains the parallel list structure.\n\nB — no comma after 'slowly' breaks the parallel list pattern.\nC — semicolon before 'and' is used only when list items contain internal commas.\nD — 'slowly and' without a comma joins only 'slowly' and 'deliberately,' disrupting the four-item list."}, {"k": "Commas", "p": "The foundation established in 2001 <u>______</u> has provided grants to over five hundred organizations.", "q": "Which choice correctly punctuates this sentence?", "o": ["A) 2001 has", "B) 2001, has", "C) 2001, which,", "D) 2001,"], "a": 1, "e": "B is correct. 'Established in 2001' is a non-restrictive participial phrase modifying 'the foundation.' It requires commas on both sides: 'The foundation, established in 2001, has...'\n\nA — no commas makes the phrase appear restrictive.\nC — 'which,' introduces a relative clause, not a participial phrase; this changes the grammar.\nD — a comma after '2001' without a preceding comma is asymmetrical."}, {"k": "Commas", "p": "The trial lasted three weeks <u>______</u> involved testimony from forty-two witnesses, and concluded with a unanimous verdict.", "q": "Which choice correctly punctuates the verb list?", "o": ["A) weeks, involved", "B) weeks involved", "C) weeks, involved,", "D) weeks; involved"], "a": 0, "e": "A is correct. 'Lasted, involved, and concluded' is a parallel list of predicates. Commas separate them: 'lasted three weeks, involved testimony..., and concluded...'\n\nB — no comma between 'weeks' and 'involved' runs together the first and second items.\nC — an extra comma after 'involved' where a comma already precedes the list item is incorrect.\nD — a semicolon in a simple predicate list is not appropriate."}, {"k": "Commas", "p": "The researcher noted that several variables, <u>______</u> had not been controlled in the original study.", "q": "Which choice correctly inserts the non-restrictive element?", "o": ["A) including sample size and time of day,", "B) including sample size and time of day", "C) such as sample size, and time of day,", "D) sample size and time of day being included,"], "a": 0, "e": "A is correct. 'Including sample size and time of day' is a non-restrictive phrase explaining which variables. It needs a closing comma before the verb 'had not been controlled.'\n\nB — no closing comma leaves the non-restrictive phrase improperly set off.\nC — 'such as sample size, and time of day,' uses an unnecessary comma inside a two-item phrase.\nD — 'sample size and time of day being included' is an awkward absolute phrase."}, {"k": "Commas", "p": "In the decades following the invention of the printing press <u>______</u> literacy rates across Europe began to rise significantly.", "q": "Which choice correctly punctuates this sentence?", "o": ["A) press literacy", "B) press, literacy", "C) press; literacy", "D) press — literacy"], "a": 1, "e": "B is correct. A long introductory prepositional phrase ('In the decades...printing press') is followed by a comma before the main clause.\n\nA — no comma omits the required punctuation after a long introductory phrase.\nC — a semicolon cannot follow a prepositional phrase.\nD — a dash is emphatic and non-standard after a straightforward introductory phrase."}, {"k": "Commas", "p": "Her argument, <u>______</u> compelling in its structure, failed to account for the most recent empirical data.", "q": "Which choice correctly punctuates the inserted adverb?", "o": ["A) though,", "B) though", "C) , though,", "D) , though"], "a": 2, "e": "C is correct. 'Though compelling in its structure' is a parenthetical element inserted into the sentence. It must be set off by commas on both sides: 'Her argument, though compelling in its structure, failed...'\n\nA — 'though,' opens the parenthetical but needs a comma before it; a comma already precedes the blank, so the element should begin with 'though' and end with a comma.\nB — 'though' without a closing comma leaves the parenthetical improperly closed.\nD — ', though' has only one comma where two are needed."}, {"k": "Commas", "p": "The survey results, <u>______</u> the team found, suggested a significant shift in consumer preferences over the past five years.", "q": "Which choice correctly handles the parenthetical?", "o": ["A) which", "B) which,", "C) — which", "D) as"], "a": 3, "e": "D is correct. 'As the team found' is a parenthetical comment inserted mid-sentence. It should be read as: 'The survey results, as the team found, suggested...' The word 'as' correctly introduces this parenthetical.\n\nA — 'which' creates a relative clause 'which the team found' that changes the meaning.\nB — 'which,' is incomplete and grammatically unclear.\nC — '— which' uses a dash to set off a relative clause, which changes the meaning."}, {"k": "Commas", "p": "The company's new manufacturing process is faster, more efficient <u>______</u> and significantly less expensive than the previous method.", "q": "Which choice is correct?", "o": ["A) more efficient and", "B) more efficient, and", "C) more efficient; and", "D) more efficient —  and"], "a": 1, "e": "B is correct. 'Faster, more efficient, and significantly less expensive' is a three-item list of adjectives. A comma before 'and' before the last item is required.\n\nA — no comma before 'and' omits the Oxford comma, creating potential ambiguity.\nC — a semicolon in a simple adjective list is not appropriate.\nD — a dash before 'and' is not standard in a parallel adjective list."}, {"k": "Commas", "p": "The scientist who discovered the compound <u>______</u> was awarded the Nobel Prize in Chemistry.", "q": "Which choice is correct?", "o": ["A) , who discovered the compound,", "B) who discovered the compound,", "C) who discovered the compound", "D) , who discovered the compound"], "a": 2, "e": "C is correct. 'Who discovered the compound' is a restrictive relative clause — it specifies which scientist. Restrictive clauses take no commas.\n\nA — commas around a restrictive clause make it non-restrictive, implying there is only one scientist.\nB — a comma after the clause without one before it is asymmetrical.\nD — a comma only before the clause is asymmetrical and inconsistent."}, {"k": "Commas", "p": "By the end of the decade, the technology, <u>______</u> had become standard in most research institutions.", "q": "Which choice correctly completes the non-restrictive clause?", "o": ["A) once considered experimental", "B) once considered experimental,", "C) which was once considered experimental", "D) which was once considered experimental,"], "a": 3, "e": "D is correct. 'Which was once considered experimental' is a non-restrictive relative clause. With a comma already before 'which', the clause needs a closing comma: '...the technology, which was once considered experimental, had become...'\n\nA — 'once considered experimental' without the closing comma leaves the participial phrase improperly set off.\nB — 'once considered experimental,' is a participial phrase that also requires an opening comma — but a comma already precedes the blank; this creates ambiguity.\nC — no closing comma after 'experimental' leaves the non-restrictive clause improperly enclosed.\nD correctly uses both the relative pronoun and the closing comma."}, {"k": "Commas", "p": "The city's transportation network, <u>______</u> includes buses, subway lines, commuter rail, and a recently expanded bike-share program.", "q": "Which is correct?", "o": ["A) which is extensive,", "B) which is extensive", "C) extensive,", "D) extensive"], "a": 0, "e": "A is correct. 'Which is extensive' is a non-restrictive relative clause describing the network. With a comma before 'which', a comma after 'extensive' closes the clause before the main verb 'includes'.\n\nB — no closing comma leaves the non-restrictive clause improperly enclosed.\nC — 'extensive,' alone is a participial adjective; it needs a preceding comma which already exists, so this could work, but A is cleaner.\nD — 'extensive' without any comma is incorrect."}, {"k": "Commas", "p": "The first draft was submitted on April 3rd <u>______</u> the final version was not approved until June.", "q": "Which choice correctly punctuates this compound sentence?", "o": ["A) 3rd the", "B) 3rd, the", "C) 3rd; the", "D) 3rd — the"], "a": 2, "e": "C is correct. Two independent clauses without a coordinating conjunction must be separated by a semicolon.\n\nA — no punctuation between two independent clauses is a run-on.\nB — a comma alone between two independent clauses is a comma splice.\nD — a dash can separate independent clauses in informal or emphatic writing but is not preferred on the SAT."}]}, {"n": 3, "topic": "Punctuation — Colons, Semicolons & Dashes", "diff": "Punctuation — Colons, Semicolons & Dashes", "qs": [{"k": "Colons", "p": "The expedition required three types of preparation <u>______</u> physical conditioning, equipment procurement, and route planning.", "q": "Which punctuation correctly introduces the list?", "o": ["A) preparation:", "B) preparation;", "C) preparation,", "D) preparation —"], "a": 0, "e": "A is correct. A colon introduces a list or explanation when a grammatically complete clause precedes it. 'The expedition required three types of preparation' is a complete clause, so a colon correctly introduces the list.\n\nB — a semicolon joins two independent clauses; it cannot introduce a list that is not an independent clause.\nC — a comma before a formal list following a complete clause is non-standard.\nD — a dash can introduce a list but a colon is preferred in formal writing."}, {"k": "Colons", "p": "The results were unambiguous <u>______</u> the treatment group showed a forty percent reduction in symptoms compared to the control group.", "q": "Which punctuation introduces the explanatory clause?", "o": ["A) unambiguous:", "B) unambiguous;", "C) unambiguous,", "D) unambiguous —"], "a": 0, "e": "A is correct. A colon introduces an explanation or elaboration of a complete clause. The second clause explains what 'unambiguous' means in this context.\n\nB — a semicolon would work if both clauses were truly independent and coordinate; here the second clause explains the first, making a colon more precise.\nC — a comma before an independent explanatory clause is too weak.\nD — a dash is informal and less precise than a colon."}, {"k": "Semicolons", "p": "The novel's plot is complex <u>______</u> its structure, however, is surprisingly accessible to first-time readers.", "q": "Which punctuation correctly joins these clauses?", "o": ["A) complex,", "B) complex; its", "C) complex: its", "D) complex — its"], "a": 1, "e": "B is correct. Two independent clauses in a contrastive relationship — a semicolon correctly joins them. 'However' is a conjunctive adverb that follows the semicolon and is set off by a comma.\n\nA — a comma alone between two independent clauses is a comma splice.\nC — a colon suggests the second clause explains the first; a contrastive relationship calls for a semicolon.\nD — a dash works but is more informal than a semicolon."}, {"k": "Semicolons", "p": "The committee reviewed the annual report <u>______</u> it found several inconsistencies in the financial projections.", "q": "Which punctuation is correct?", "o": ["A) report, it", "B) report: it", "C) report; it", "D) report — it"], "a": 2, "e": "C is correct. Two independent clauses with a causal relationship — a semicolon correctly separates them without requiring a conjunction.\n\nA — a comma splice.\nB — a colon works only if the second clause directly explains or defines the first; 'several inconsistencies' is a result, not a definition.\nD — a dash is informal."}, {"k": "Dashes", "p": "The discovery <u>______</u> made by a graduate student working alone late at night <u>______</u> overturned sixty years of accepted theory.", "q": "Which choice correctly uses dashes to set off the parenthetical?", "o": ["A) discovery — made by a graduate student working alone late at night — overturned", "B) discovery, made by a graduate student working alone late at night, overturned", "C) discovery — made by a graduate student working alone late at night overturned", "D) discovery made by a graduate student — working alone late at night — overturned"], "a": 0, "e": "A is correct. Dashes come in pairs to set off a parenthetical phrase. Both dashes must be present and must enclose the entire phrase.\n\nB — commas are the standard way to set off a non-restrictive phrase; dashes are used for greater emphasis.\nC — only one dash is used, leaving the phrase incorrectly closed.\nD — the dashes set off 'working alone late at night' rather than the full parenthetical about the graduate student."}, {"k": "Colons", "p": "She had always wanted only one thing <u>______</u> to write a novel that would outlast her.", "q": "Which punctuation introduces the infinitive phrase?", "o": ["A) thing,", "B) thing:", "C) thing;", "D) thing —"], "a": 1, "e": "B is correct. A colon after a complete clause introduces a phrase that explains or specifies what was mentioned. 'To write a novel that would outlast her' specifies the 'one thing.'\n\nA — a comma is too weak to introduce a specifying phrase following a complete clause.\nC — a semicolon cannot introduce a non-independent phrase.\nD — a dash is acceptable but less formal than a colon."}, {"k": "Semicolons", "p": "The delegates arrived from twelve countries; the agenda included trade, climate, and security. <u>______</u>", "q": "Which sentence could logically follow, using correct punctuation?", "o": ["A) The summit however was declared inconclusive by most observers.", "B) The summit, however, was declared inconclusive by most observers.", "C) However the summit was declared inconclusive by most observers.", "D) The summit was declared inconclusive, however by most observers."], "a": 1, "e": "B is correct. 'However' as a parenthetical adverb within a sentence is set off by commas on both sides.\n\nA — 'however' without commas is not properly punctuated as a parenthetical.\nC — 'however' at the start of a sentence needs a comma after it.\nD — 'however' followed by only one comma places it incorrectly within the sentence."}, {"k": "Dashes", "p": "The three largest departments <u>______</u> engineering, finance, and operations <u>______</u> each submitted separate budget proposals.", "q": "Which choice is correct?", "o": ["A) departments — engineering, finance, and operations — each", "B) departments, engineering, finance, and operations, each", "C) departments: engineering, finance, and operations, each", "D) departments engineering, finance, and operations, each"], "a": 0, "e": "A is correct. When a list contains commas internally, dashes (rather than commas) should be used to set off the parenthetical list, preventing confusion between the list commas and the enclosing punctuation.\n\nB — using commas around a list that already contains commas creates ambiguity.\nC — a colon introduces a list but cannot also set off a parenthetical this way.\nD — no punctuation around the parenthetical list is incorrect."}, {"k": "Colons", "p": "The chef's philosophy was simple <u>______</u> fresh ingredients, prepared with minimal interference, always produce the best results.", "q": "Which punctuation is correct?", "o": ["A) simple,", "B) simple;", "C) simple:", "D) simple —"], "a": 2, "e": "C is correct. A colon after a complete clause introduces the content that the clause announces. 'The chef's philosophy was simple' announces the philosophy; the colon delivers it.\n\nA — a comma before an independent explanatory clause is non-standard.\nB — a semicolon implies the two clauses are coordinate, but here the second delivers the content of the first.\nD — a dash could work but a colon is more precise."}, {"k": "Semicolons", "p": "The first wave of immigrants settled primarily in urban areas <u>______</u> subsequent generations, however, moved to suburban and rural communities.", "q": "Which punctuation correctly joins these clauses?", "o": ["A) areas, subsequent", "B) areas: subsequent", "C) areas; subsequent", "D) areas however,"], "a": 2, "e": "C is correct. Two independent clauses in a contrastive relationship, with 'however' as the conjunctive adverb. Semicolon before the first clause's end + however + comma after 'however'.\n\nA — comma splice.\nB — a colon implies the second clause explains the first; the contrastive 'however' makes a semicolon more appropriate.\nD — 'however' without preceding semicolon makes a run-on."}, {"k": "Dashes", "p": "The committee chair <u>______</u> who had served on the board for eleven years <u>______</u> announced her resignation at the end of the meeting.", "q": "Which choice correctly uses dashes?", "o": ["A) chair — who had served on the board for eleven years — announced", "B) chair, who had served on the board for eleven years, announced", "C) chair — who had served on the board for eleven years, announced", "D) chair, who had served on the board for eleven years — announced"], "a": 0, "e": "A is correct. Dashes must be used in pairs to enclose a parenthetical. Both dashes are required, surrounding the entire relative clause.\n\nB — commas are correct for non-restrictive relative clauses; both are grammatically acceptable, but A uses dashes for emphasis.\nC — one dash opens but a comma closes the parenthetical; mismatched punctuation.\nD — comma opens but a dash closes; also mismatched."}, {"k": "Colons", "p": "The report recommended several changes to current policy <u>______</u> raising the minimum wage, expanding childcare subsidies, and increasing funding for vocational training.", "q": "Which punctuation is correct?", "o": ["A) policy,", "B) policy;", "C) policy:", "D) policy —"], "a": 2, "e": "C is correct. A colon after 'policy' introduces the list of changes that the report recommended. The clause before the colon is grammatically complete.\n\nA — a comma is too weak to formally introduce a list following a complete clause.\nB — a semicolon cannot introduce a list that is not an independent clause.\nD — a dash works but a colon is preferred in formal writing."}, {"k": "Semicolons", "p": "The funding was distributed across five divisions <u>______</u> each received an equal allocation based on headcount.", "q": "Which choice is correct?", "o": ["A) divisions, each", "B) divisions: each", "C) divisions; each", "D) divisions each"], "a": 2, "e": "C is correct. Two independent clauses; the second elaborates on the first. A semicolon correctly separates them.\n\nA — comma splice.\nB — a colon works only when the second clause directly defines or explains a specific term in the first.\nD — no punctuation between two independent clauses is a run-on."}, {"k": "Dashes", "p": "Her argument had one fatal flaw <u>______</u> it assumed that all participants had access to the same information.", "q": "Which punctuation best introduces this single explanatory clause for emphasis?", "o": ["A) flaw,", "B) flaw:", "C) flaw —", "D) flaw;"], "a": 2, "e": "C is correct. A dash introduces an explanation with emphasis or dramatic effect. While a colon is also correct, the SAT often uses a dash to signal an abrupt or emphatic explanation.\n\nA — a comma is too weak to introduce an independent explanatory clause.\nB — a colon is also grammatically correct but the dash is the stronger answer here when emphasis is specified.\nD — a semicolon implies two coordinate, equally weighted clauses."}, {"k": "Semicolons", "p": "Research in this area has accelerated rapidly over the past decade; <u>______</u>", "q": "Which choice correctly continues after the semicolon?", "o": ["A) however, with new methodologies emerging regularly.", "B) new methodologies are emerging regularly.", "C) new methodologies, emerging regularly.", "D) emerging new methodologies regularly."], "a": 1, "e": "B is correct. After a semicolon, an independent clause is required. 'New methodologies are emerging regularly' is a complete independent clause.\n\nA — 'however, with new methodologies emerging regularly' is a prepositional phrase fragment, not a complete clause.\nC — 'new methodologies, emerging regularly' lacks a main verb; fragment.\nD — 'emerging new methodologies regularly' lacks a subject and main verb; fragment."}, {"k": "Colons", "p": "Only one factor distinguished the winning teams from the others <u>______</u> the ability to maintain composure under sustained pressure.", "q": "Which punctuation is correct?", "o": ["A) others,", "B) others;", "C) others:", "D) others —"], "a": 2, "e": "C is correct. 'Only one factor distinguished...' is a complete clause announcing that one factor will be named. The colon delivers the specific factor.\n\nA — a comma cannot introduce an identifying appositive after a full clause.\nB — a semicolon would imply the second element is an independent clause, but 'the ability...' is a noun phrase.\nD — a dash is acceptable but the colon is the preferred formal choice."}, {"k": "Dashes", "p": "The artist used unexpected materials in her sculptures <u>______</u> reclaimed wood, industrial wire, and broken glass <u>______</u> to create works that commented on urban decay.", "q": "Which choice correctly punctuates the parenthetical list?", "o": ["A) sculptures — reclaimed wood, industrial wire, and broken glass — to", "B) sculptures, reclaimed wood, industrial wire, and broken glass, to", "C) sculptures: reclaimed wood, industrial wire, and broken glass — to", "D) sculptures — reclaimed wood, industrial wire, and broken glass, to"], "a": 0, "e": "A is correct. A parenthetical list with internal commas should be enclosed in dashes, not commas, to prevent confusion. Both dashes must be present.\n\nB — using commas around a list that already contains commas creates ambiguity.\nC — mismatched punctuation (colon opens, dash closes) is incorrect.\nD — one dash opens and a comma closes; mismatched punctuation."}, {"k": "Semicolons", "p": "The city invested heavily in public transit; <u>______</u> ridership increased by twenty-two percent within the first year.", "q": "Which choice correctly continues after the semicolon?", "o": ["A) as a result,", "B) as a result", "C) as a result, ridership", "D) as a result ridership"], "a": 2, "e": "C is correct. After a semicolon, a complete independent clause is required. 'As a result, ridership increased...' includes the conjunctive adverb followed by a comma and then the full clause.\n\nA — 'as a result,' without a subject and verb is a fragment.\nB — same issue; no subject or verb follows.\nD — 'as a result ridership' omits the required comma after the conjunctive adverb."}, {"k": "Colons", "p": "The documentary focuses on one central question <u>______</u> what drives individuals to sacrifice personal safety for the benefit of strangers?", "q": "Which punctuation introduces the question?", "o": ["A) question,", "B) question:", "C) question;", "D) question —"], "a": 1, "e": "B is correct. A colon can introduce a question that specifies or explains what has been referred to in the preceding clause. 'The central question' announces that a question will follow.\n\nA — a comma before an embedded question following a full clause is too weak.\nC — a semicolon cannot introduce a non-independent question.\nD — a dash could work but a colon is more precise."}, {"k": "Semicolons", "p": "The athlete trained for eight hours each day during the off-season <u>______</u> her dedication eventually earned her a place on the national team.", "q": "Which punctuation is correct?", "o": ["A) season, her", "B) season; her", "C) season: her", "D) season her"], "a": 1, "e": "B is correct. Two independent clauses — a semicolon separates them. The second clause explains the result of the first.\n\nA — comma splice.\nC — a colon works if the second clause directly defines something named in the first; here the second clause is a result, not a definition.\nD — no punctuation is a run-on."}, {"k": "Dashes", "p": "His advice was blunt <u>______</u> quit while you still can.", "q": "Which punctuation correctly introduces the quoted advice for emphasis?", "o": ["A) blunt:", "B) blunt;", "C) blunt,", "D) blunt —"], "a": 3, "e": "D is correct. A dash is the most emphatic punctuation for introducing a short, dramatic direct statement or quotation after a complete clause. On the SAT, when 'emphasis' or 'drama' is specified, the dash is preferred over the colon.\n\nA — a colon is also grammatically correct but less emphatic.\nB — a semicolon would require the second element to be an independent clause without a direct quotation function.\nC — a comma is too weak."}, {"k": "Colons", "p": "The study identified four primary risk factors <u>______</u> sedentary lifestyle, poor diet, chronic stress, and inadequate sleep.", "q": "Which punctuation is correct?", "o": ["A) factors;", "B) factors:", "C) factors,", "D) factors —"], "a": 1, "e": "B is correct. A colon after a complete clause formally introduces the list of four factors.\n\nA — a semicolon cannot introduce a list that is not an independent clause.\nC — a comma before a formal list following a complete clause is non-standard.\nD — a dash is informal; a colon is preferred in formal contexts."}, {"k": "Semicolons", "p": "Some economists argue that automation will eliminate millions of jobs; <u>______</u> point to the historical pattern of technology creating more employment than it destroys.", "q": "Which choice correctly completes the sentence after the semicolon?", "o": ["A) others", "B) others,", "C) others, however,", "D) others however"], "a": 0, "e": "A is correct. After a semicolon, a complete independent clause is required. 'Others point to...' is a clean, complete clause. No additional punctuation is needed here since 'others' simply introduces the contrasting subject.\n\nB — a comma after 'others' is not needed since no parenthetical follows.\nC — 'others, however,' would be correct if 'however' were used, but 'however' is unnecessary when the contrast is already established by 'some...others.'\nD — same issue; 'however' without commas is also incorrect."}, {"k": "Colons", "p": "The architect described the building's most important quality <u>______</u> its ability to make inhabitants feel both sheltered and connected to the outside world simultaneously.", "q": "Which punctuation correctly introduces the description?", "o": ["A) quality,", "B) quality;", "C) quality:", "D) quality —"], "a": 2, "e": "C is correct. 'Its ability to make inhabitants...' is a noun phrase that defines what the architect described as the most important quality. A colon introduces this defining or specifying element after a complete clause.\n\nA — a comma before a complex noun phrase following a complete clause is non-standard.\nB — a semicolon cannot introduce a noun phrase.\nD — a dash works but a colon is the formal preference."}, {"k": "Dashes", "p": "The candidate promised meaningful reform <u>______</u> a promise she would spend the next four years struggling to fulfill.", "q": "Which punctuation correctly introduces the appended comment?", "o": ["A) reform:", "B) reform,", "C) reform;", "D) reform —"], "a": 3, "e": "D is correct. A dash before an appended comment at the end of a sentence signals an abrupt addition or afterthought. 'A promise she would spend the next four years struggling to fulfill' is an emphatic addition to the main clause.\n\nA — a colon works when the second element defines or explains something in the first clause; 'a promise' is more of an appended ironic comment.\nB — a comma before a long appended appositive is too weak.\nC — a semicolon requires the appended element to be an independent clause; 'a promise she would...' is a noun phrase."}]}, {"n": 4, "topic": "Subject–Verb Agreement", "diff": "Subject-Verb Agreement", "qs": [{"k": "Subject-Verb", "p": "The committee, along with its three subcommittees, <u>______</u> expected to deliver a final report by the end of the quarter.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. The subject is 'the committee' (singular). Phrases beginning with 'along with,' 'as well as,' or 'together with' that are inserted between the subject and verb do not change the subject's number. The verb must be singular: 'is.'\n\nA — 'are' treats 'committee' as plural.\nB — 'were' is past tense and plural; the sentence is present.\nD — 'have been' is plural and present perfect; the subject is singular."}, {"k": "Subject-Verb", "p": "Neither the lead researcher nor her assistants <u>______</u> able to explain the anomaly in the data.", "q": "Which verb form is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb (the assistants = plural). 'Were' is correct.\n\nA — 'was' agrees with the singular 'researcher,' not the closest subject 'assistants.'\nC — 'is' is singular and present; incorrect.\nD — 'has been' is singular present perfect; incorrect."}, {"k": "Subject-Verb", "p": "Each of the submitted proposals <u>______</u> reviewed by a panel of three independent judges.", "q": "Which verb form is correct?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C is correct. 'Each' is always singular. The subject is 'each' (not 'proposals'). 'Was reviewed' is correct.\n\nA — 'were' agrees with 'proposals' rather than 'each.'\nB — 'are' is plural present; 'each' is singular.\nD — 'have been' is plural present perfect; 'each' is singular."}, {"k": "Subject-Verb", "p": "The results of the experiment <u>______</u> published in three separate peer-reviewed journals.", "q": "Which verb form is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B is correct. Strip the prepositional phrase 'of the experiment.' The subject is 'results' (plural). 'Were published' is correct.\n\nA — 'was' agrees with 'experiment,' not the subject 'results.'\nC — 'is' is singular present; incorrect.\nD — 'has been' is singular present perfect; incorrect."}, {"k": "Subject-Verb", "p": "The number of applications received this year <u>______</u> exceeded all previous records.", "q": "Which verb form is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B is correct. 'The number' (as opposed to 'a number') is singular. 'The number of applications...has exceeded' is correct.\n\nA — 'have' treats 'number' as plural.\nC — 'were' is past plural; 'the number' is singular.\nD — 'are' is plural present; incorrect."}, {"k": "Subject-Verb", "p": "Statistics, as a discipline, <u>______</u> undergone significant methodological changes over the past two decades.", "q": "Which verb form is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B is correct. 'Statistics' used as the name of an academic discipline is treated as singular, like 'physics' or 'economics.' 'Has undergone' is correct.\n\nA — 'have' treats statistics as a plural noun.\nC — 'were' is past plural.\nD — 'are' is plural present."}, {"k": "Subject-Verb", "p": "One of the most significant challenges facing the organization <u>______</u> the lack of consistent funding from year to year.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. 'One' is singular. Strip 'of the most significant challenges facing the organization.' The subject is 'one.' 'Is' is correct.\n\nA — 'are' agrees with 'challenges,' not the subject 'one.'\nB — 'were' is plural past.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "Either the board members or the executive director <u>______</u> required to sign the revised agreement.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. With 'either...or,' the verb agrees with the subject closest to the verb. 'Executive director' is singular, so 'is required' is correct.\n\nA — 'are' agrees with 'board members' rather than the closest subject.\nB — 'were' is past and plural.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "The data collected over twelve years of fieldwork <u>______</u> the researchers' initial hypothesis.", "q": "Which verb form is correct?", "o": ["A) support", "B) supports", "C) have supported", "D) are supporting"], "a": 1, "e": "B is correct. 'Data' in academic and scientific writing is now commonly treated as singular (like 'information'). The SAT generally treats 'data' as singular when it is used as an uncountable noun.\n\nA — 'support' is correct only if treating 'data' as plural, which the SAT does not consistently do.\nC — 'have supported' is plural present perfect.\nD — 'are supporting' is plural present progressive."}, {"k": "Subject-Verb", "p": "The team of analysts <u>______</u> three months to complete the full audit.", "q": "Which verb form is correct?", "o": ["A) take", "B) takes", "C) have taken", "D) were taking"], "a": 1, "e": "B is correct. 'Team' is a collective noun treated as singular in American English. 'Takes' is correct.\n\nA — 'take' treats 'team' as plural.\nC — 'have taken' is plural present perfect.\nD — 'were taking' is past plural."}, {"k": "Subject-Verb", "p": "Neither the funding proposal nor the supporting documents <u>______</u> submitted before the deadline.", "q": "Which verb form is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B is correct. With 'neither...nor,' agree with the subject closest to the verb. 'Documents' is plural, so 'were submitted' is correct.\n\nA — 'was' agrees with 'proposal,' not the closer 'documents.'\nC — 'is' is singular present.\nD — 'has been' is singular present perfect."}, {"k": "Subject-Verb", "p": "There <u>______</u> significant differences between the two methodologies that must be addressed before the study proceeds.", "q": "Which verb form is correct?", "o": ["A) is", "B) was", "C) are", "D) has been"], "a": 2, "e": "C is correct. Invert the sentence: 'Significant differences are there.' The subject is 'differences' (plural). 'Are' is correct.\n\nA — 'is' agrees with 'there' rather than the real subject 'differences.'\nB — 'was' is past singular.\nD — 'has been' is singular present perfect."}, {"k": "Subject-Verb", "p": "The professor as well as her graduate students <u>______</u> been invited to present at the international conference.", "q": "Which verb form is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B is correct. The subject is 'the professor' (singular). 'As well as her graduate students' is a parenthetical addition, not a compound subject. 'Has been invited' is correct.\n\nA — 'have' treats the professor as plural.\nC — 'were' is past plural.\nD — 'are' is plural present."}, {"k": "Subject-Verb", "p": "Measles, unlike many other infectious diseases, <u>______</u> preventable through a widely available vaccine.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. 'Measles' is a disease name ending in -s that is treated as singular (like 'mumps' or 'rabies'). 'Is preventable' is correct.\n\nA — 'are' incorrectly treats 'measles' as plural.\nB — 'were' is past plural.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "A large proportion of the research funding <u>______</u> allocated to projects in the early stages of development.", "q": "Which verb form is correct?", "o": ["A) were", "B) are", "C) is", "D) have been"], "a": 2, "e": "C is correct. 'Proportion' governs the verb, and 'of the research funding' is a prepositional phrase. 'Funding' is uncountable and the subject 'proportion' can be singular. 'Is' is correct.\n\nA — 'were' treats the subject as plural.\nB — 'are' is plural present.\nD — 'have been' is plural perfect."}, {"k": "Subject-Verb", "p": "Every student, teacher, and administrator <u>______</u> required to complete the annual training module.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. When 'every' precedes a series joined by 'and,' the entire subject is treated as singular. 'Is required' is correct.\n\nA — 'are' ignores the singular effect of 'every.'\nB — 'were' is past plural.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "The collection of manuscripts discovered in the monastery <u>______</u> now housed in the national archive.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. Strip the prepositional phrase. The subject is 'collection' (singular). 'Is housed' is correct.\n\nA — 'are' agrees with 'manuscripts' rather than the subject 'collection.'\nB — 'were' is past plural.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "The majority of the evidence presented at trial <u>______</u> circumstantial in nature.", "q": "Which verb form is correct?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C is correct. 'Evidence' is an uncountable noun, making the subject phrase singular in effect. 'Was' is correct.\n\nA — 'were' is past plural.\nB — 'are' is plural present.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "The research team's findings, which were published last month, <u>______</u> drawn significant attention from the international scientific community.", "q": "Which verb form is correct?", "o": ["A) has", "B) have", "C) was", "D) is"], "a": 1, "e": "B is correct. The subject is 'findings' (plural). The relative clause 'which were published last month' is parenthetical and does not change the subject. 'Have drawn' is correct.\n\nA — 'has' treats 'findings' as singular.\nC — 'was' is past singular.\nD — 'is' is singular present."}, {"k": "Subject-Verb", "p": "Two thousand dollars <u>______</u> the minimum amount required to open an account at the institution.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. Sums of money are treated as singular even when they appear plural in form. 'Two thousand dollars is' is correct.\n\nA — 'are' treats the amount as plural.\nB — 'were' is past plural.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "The number of errors detected in the final manuscript <u>______</u> surprisingly low given the complexity of the text.", "q": "Which verb form is correct?", "o": ["A) were", "B) are", "C) is", "D) have been"], "a": 2, "e": "C is correct. 'The number' is singular. 'The number of errors...is' is correct.\n\nA — 'were' agrees with 'errors' rather than 'the number.'\nB — 'are' is plural present.\nD — 'have been' is plural present perfect."}, {"k": "Subject-Verb", "p": "What concerns the board most <u>______</u> the projected cost overruns for the next fiscal year.", "q": "Which verb form is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C is correct. 'What concerns the board most' is a noun clause functioning as the singular subject. 'Is' agrees with this singular subject.\n\nA — 'are' treats the noun clause as plural.\nB — 'were' is past plural.\nD — 'have been' is plural perfect."}, {"k": "Subject-Verb", "p": "The series of lectures on medieval architecture <u>______</u> been well-attended since its introduction three years ago.", "q": "Which verb form is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B is correct. 'Series' is singular. Strip the prepositional phrase: the subject is 'series.' 'Has been' is correct.\n\nA — 'have' treats 'series' as plural.\nC — 'were' is past plural.\nD — 'are' is plural present."}, {"k": "Subject-Verb", "p": "Both the original manuscript and the annotated translation <u>______</u> available in the rare books room.", "q": "Which verb form is correct?", "o": ["A) is", "B) was", "C) are", "D) has been"], "a": 2, "e": "C is correct. 'Both...and' creates a compound subject, which is always plural. 'Are available' is correct.\n\nA — 'is' treats the compound subject as singular.\nB — 'was' is past singular.\nD — 'has been' is singular present perfect."}, {"k": "Subject-Verb", "p": "The company's board of directors <u>______</u> voted unanimously to approve the merger.", "q": "Which verb form is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B is correct. 'Board' is a collective noun treated as singular in American English. 'Has voted' is correct.\n\nA — 'have' treats 'board' as plural (acceptable in British English but not American English usage tested on the SAT).\nC — 'were' is past plural.\nD — 'are' is plural present."}]}, {"n": 5, "topic": "Pronoun Reference & Agreement", "diff": "Pronoun Reference & Agreement", "qs": [{"k": "Pronouns", "p": "When a student submits their thesis, <u>______</u> must include a signed declara
