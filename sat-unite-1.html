<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alistirma seni her tuzak ailesiyle sinar. Yanlis yaptikca o tuzaktan daha fazla soru gelir, dogru yaptikca sonraki aileye gecersin. Butun soru havuzunu karisik ve puanli gormek icin Unite Testi ni ac.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit": 1, "unit_title": "SAT Reading & Writing Kampi", "unit_accent": "warm", "lessons": [{"no": 1, "name": "Command of Evidence: Textual", "teaching": {"ne_olculuyor": ["Metin bir hipotez, iddia ya da tahmin sunar. Soru sana dört bulgu verir ve sorar: hangisi bu iddiayı en çok destekler? Bazen tersini sorar: hangisi zayıflatır?", "Bu soru gerçek bir mantık sorusudur. Okuma sorusu gibi görünür ama değildir.", "Kritik nokta: şıkkın DOĞRU olması yetmez. Şıkkın İDDİAYI destekliyor olması gerekir. Bu ikisi aynı şey değil ve soru tam olarak burada tuzak kurar."], "karar_proseduru": ["İddiayı bul ve TEK CÜMLEYE indir.  Genelde metnin son cümlesindedir ya da hypothesize, propose, argue, suggest fiilinden sonra gelir. Kendi kelimelerinle yaz.", "İddianın KAÇ unsuru var, say.  Çoğu iddia iki unsurludur. Örnek: X arttığında Y azalır. İki unsur var: X'in artması ve Y'nin azalması.", "Her şıkkı iddiaya karşı test et.  Şık iddianın BÜTÜN unsurlarını içeriyor mu. Tek unsuru içeren şık tuzaktır.", "Yön kontrolü yap.  Destekleme sorusunda şık iddiayla aynı yönde olmalı. Zayıflatma sorusunda ters yönde."], "celdirici_aileleri": [{"ad": "Konuyla ilgili, iddiayla ilgisiz", "tanim": "Şık aynı konudan bahseder, aynı terimleri kullanır, ama iddiayı ne destekler ne çürütür. En yaygın çeldirici. Tanıdık kelimeler gören öğrenci işaretler."}, {"ad": "Ters yön", "tanim": "Şık aslında iddianın tersini destekler. Destekleme sorusunda bu ölümcül. Aceleyle okuyan öğrenci ilgiyi görür, yönü görmez."}, {"ad": "Tek unsur", "tanim": "İddianın iki unsuru varsa şık sadece birini karşılar. Yarım destek destek değildir. Bu tuzak en incesidir ve Advanced seviyede çok çıkar."}, {"ad": "Çok genel", "tanim": "İddia spesifiktir, şık geneldir. Genel bir ifade spesifik bir iddiayı kanıtlamaz. Örnek: iddia bu turun bu bölgede azaldığını söylüyor, şık bütün kuşların azaldığını söylüyor."}], "top_tips": ["İddiayı bir eşitlik gibi yaz. Örnek: gece ışığı artar ise böcek sayısı azalır. Şimdi her şıkkın bu eşitliğin iki tarafına da dokunup dokunmadığını kontrol et. Sadece bir tarafa dokunan şık yanlıştır.", "Zayıflatma sorusunda doğru cevap genelde iddianın ÖNERDİĞİ sebep yerine BAŞKA bir sebep sunar. Alternatif açıklama arayan şık doğru cevaptır.", "if true ifadesi önemlidir. Şıkkın gerçekten doğru olup olmadığını tartışma. Doğru VARSAY, sonra iddiaya ne yaptığını sor.", "Alıntı sorularında iddianın OLUMSUZ yarısını tekrar eden şık tuzaktır. Bir iddiayı kendisiyle destekleyemezsin."], "kavramsal_temel": ["Command of Evidence: Textual, bir iddiayi ya da sonucu DESTEKLEYEN ya da ZAYIFLATAN kaniti secmeni ister. Soru sana bir arastirma bulgusu, bir hipotez ya da bir gorus verir, sonra dort secenekten hangisinin o iddiaya en dogrudan etki ettigini sorar.", "Bu soru okudugunu anlamaktan cok MANTIKSAL ILISKI kurmayi olcer. Dogru cevap her zaman dogru bir cumle degildir. Onemli olan, iddianin TAM olarak neyi one surdugunu bulmak ve secenegin o noktaya dokunup dokunmadigina bakmaktir.", "Kritik ayrim sudur: bir secenek konuyla ilgili, hatta dogru olabilir ama iddianin one surdugu belirli iliskiyi desteklemiyorsa yanlistir. Ogrenci cogu zaman tanidik ya da makul geleni secer, oysa gorev iddiayi test etmektir.", "Bu yuzden once iddiayi tek cumlede kendi kelimenle yaz. Iddia neyi soyluyor, hangi degiskenler arasinda nasil bir bag kuruyor. Bunu netlestirmeden secenege bakma."], "cozumlu_ornekler": [{"passage": "A researcher hypothesized that a certain songbird sings more frequently at dawn because the cooler, denser morning air carries its song farther. To support this claim, the researcher would need evidence that ______", "stem": "Which finding, if true, would most directly support the researcher's hypothesis?", "choices": {"A": "the birds sing at several times during the day, not only at dawn", "B": "the birds' songs travel measurably farther in the cool morning air than in the warm afternoon air", "C": "the birds have brightly colored feathers that stand out at dawn", "D": "other species of birds also sing in the early morning"}, "correct": "B", "adimlar": ["Iddiayi tek cumlede yaz: kus safakta daha cok otuyor CUNKU serin sabah havasi sesi daha uzaga tasiyor. Yani iddia hava ile ses mesafesi arasinda bir bag kuruyor.", "Dogru kanit tam bu bagi test etmeli: serin havada ses gercekten daha uzaga gidiyor mu.", "B tam bu iliskiyi olcuyor: sabah serin havada ses olcuolebilir sekilde daha uzaga gidiyor. Iddianin mekanizmasini dogruluyor.", "A iddiayi zayiflatir, cunku sadece safakta otmuyor demek. C ve D konuyla ilgili ama hava-mesafe bagina dokunmaz."], "sonuc": "Dogru kanit iddianin kurdugu belirli iliskiyi (serin hava, daha uzak ses) dogrudan test eder. Konuyla ilgili olmak yetmez."}, {"passage": "A historian argues that a medieval town grew wealthy mainly because it sat at the crossing of two major trade routes. A skeptic wants to challenge this explanation.", "stem": "Which finding, if true, would most directly weaken the historian's argument?", "choices": {"A": "the town held a large annual fair that drew merchants", "B": "several nearby towns on the same trade routes remained poor", "C": "the town's population grew steadily over two centuries", "D": "the town minted its own coins"}, "correct": "B", "adimlar": ["Iddia: sehir zengin oldu CUNKU iki ticaret yolunun kesisiminde. Yani konum tek basina zenginligi acikliyor.", "Zayiflatmak icin, ayni konum avantajina sahip baska yerlerin zengin OLMADIGINI gostermek gerekir.", "B tam bunu yapiyor: ayni yollardaki komsu kasabalar yoksul kaldi. Demek konum tek basina yeterli degil, baska etken var.", "A ve D zenginligi aciklayabilir ama iddiayi curutmez, hatta destekler gibidir. C sadece buyumeyi soyler, nedenine dokunmaz."], "sonuc": "Bir aciklamayi zayiflatmanin en guclu yolu, ayni nedenin baska yerde ayni sonucu vermedigini gostermektir."}], "sik_hatalar": [{"hata": "Dogru ama ilgisiz secenegi secmek", "cozum": "Bir secenek gercek ve makul olabilir ama iddianin kurdugu belirli iliskiye dokunmuyorsa yanlistir. Her zaman iddianin tam noktasina don."}, {"hata": "Destekle ile zayiflati karistirmak", "cozum": "Soru destek mi zayiflatma mi istiyor once onu isaretle. Ters yon secenegi cogu zaman en cekici celdiricidir."}, {"hata": "Tek bir ayrintiya asirmak", "cozum": "Iddia genellikle bir iliski kurar. Sadece bir kelimeye ya da rakama degil, iliskinin butun yonune bak."}, {"hata": "Cok genel secenegi guclu sanmak", "cozum": "Genis ve belirsiz secenekler iddiayi dogrudan test etmez. En spesifik, en dogrudan olcen secenek kazanir."}], "strateji": ["Iddiayi tek cumlede kendi kelimenle yaz. Hangi degiskenler arasinda nasil bir bag var.", "Soru destek mi zayiflatma mi istiyor, isaretle.", "Her secenegi iddianin tam noktasina goturup test et: bu iliskiyi dogruluyor ya da yikiyor mu.", "Konuyla ilgili ama iliskiye dokunmayanlari ele.", "En dogrudan ve spesifik olcen secenegi sec."]}, "families": ["Konuyla ilgili iddiayla ilgisiz", "Ters yon", "Tek unsur", "Cok genel"], "fam_short": {"Konuyla ilgili iddiayla ilgisiz": "Ilgisiz", "Ters yon": "Ters yon", "Tek unsur": "Tek unsur", "Cok genel": "Cok genel"}, "main_ids": ["u1-l1-f1-01", "u1-l1-f2-01", "u1-l1-f3-01", "u1-l1-f4-01"], "questions": [{"id": "u1-l1-f1-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Archaeologist Priya Nandakumar has proposed that a cluster of Bronze Age storage pits at a settlement in the Indus Valley was used communally rather than by individual households, citing the pits' uniform construction and their placement along a shared central path rather than beside particular dwellings.", "stem": "Which finding, if true, would most directly support Nandakumar's proposal?", "choices": {"A": "Residue analysis shows that the grain stored in each pit came from fields cultivated jointly by the whole settlement rather than by single families.", "B": "The pits were dug to a greater depth than storage pits at neighboring settlements of the same period.", "C": "The settlement's dwellings were built from mud brick fired at consistently high temperatures.", "D": "Bronze Age communities across the region are known to have stored surplus grain against seasonal shortages."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Nandakumar's claim is that the pits were used communally. Grain drawn from jointly cultivated fields directly indicates shared, not household, use, supporting the communal-use claim.", "why_wrong": {"B": "Greater depth speaks to the pits' capacity, not to whether they were used communally or by individual households.", "C": "The firing of the dwellings' mud brick concerns building technique, a settlement detail unrelated to how the pits were used.", "D": "That regional communities stored surplus grain is a general backdrop that does not distinguish communal from household use at this site."}}, {"id": "u1-l1-f1-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Linguist Tomas Vaillant argues that a decline in the use of a regional dialect in southern France was driven mainly by the spread of standardized schooling in the early twentieth century, when instruction was delivered exclusively in the national language and pupils were discouraged from speaking the dialect.", "stem": "Which finding, if true, would most directly support Vaillant's argument?", "choices": {"A": "The regional dialect had been documented by folklorists several decades before compulsory schooling was introduced.", "B": "In districts where compulsory schooling arrived earliest, dialect use declined most sharply within a single generation, whereas isolated districts without schools retained the dialect far longer.", "C": "Standardized schooling in the same period also raised literacy rates throughout southern France.", "D": "Many regional languages across Europe have lost speakers over the past century."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Vaillant's claim ties decline specifically to schooling. Sharper decline exactly where schooling arrived first, and persistence where it was absent, links the mechanism to the outcome.", "why_wrong": {"C": "Rising literacy is a parallel effect of schooling but does not show that schooling drove the dialect's decline.", "D": "A continent-wide pattern of language loss is too general to confirm this specific cause at this site.", "A": "Earlier documentation of the dialect says nothing about whether schooling caused its later decline."}}, {"id": "u1-l1-f1-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Ecologist Dara Okonkwo hypothesizes that a species of fig wasp times its emergence to the flowering of a single fig species by detecting a volatile chemical the figs release, rather than by responding to temperature or day length as many insects do.", "stem": "Which finding, if true, would most directly support Okonkwo's hypothesis?", "choices": {"A": "The wasps complete their entire life cycle inside the figs they pollinate.", "B": "The fig species flowers within a narrow window each year across its entire range.", "C": "Wasps exposed in the laboratory to the fig's volatile compound emerged on schedule even when kept at constant temperature and light, while wasps shielded from the compound did not.", "D": "Many insect species are known to synchronize their activity with the plants they depend on."}, "correct": "C", "choice_families": {"B": "Tek unsur", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim is that the chemical cue, not temperature or light, triggers emergence. Emergence tracking the compound while temperature and light are held constant isolates the chemical cue as the trigger.", "why_wrong": {"B": "A narrow flowering window shows the timing to be matched but not that a chemical cue rather than temperature drives it.", "D": "A general tendency of insects to synchronize with host plants does not establish the specific cue proposed here.", "A": "That the wasps develop inside the figs concerns their life cycle, not the trigger for emergence."}}, {"id": "u1-l1-f1-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Art historian Lucia Marchetti contends that a series of unsigned frescoes in a Tuscan chapel was produced by a workshop of several painters working simultaneously, not by a single master, pointing to abrupt shifts in brushwork from one figure to the next within the same scene.", "stem": "Which finding, if true, would most directly support Marchetti's contention?", "choices": {"A": "The frescoes depict scenes drawn from a widely circulated devotional text.", "B": "The chapel was completed within a single year according to surviving construction records.", "C": "Workshops of collaborating painters were common in Tuscany during the period the chapel was decorated.", "D": "Chemical analysis reveals that adjacent figures in a single scene were painted with pigments ground to different specifications, consistent with several hands mixing paint separately at the same time."}, "correct": "D", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Marchetti claims multiple painters worked simultaneously. Different pigment preparations in adjacent figures point to separate hands mixing paint at once, directly supporting the workshop claim.", "why_wrong": {"B": "A one-year completion speaks to speed, not to whether one or several painters were responsible.", "C": "That such workshops were common is general context, not evidence about this chapel specifically.", "A": "The source of the scenes concerns subject matter, not the number of painters."}}, {"id": "u1-l1-f1-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Economist Hassan Farouk proposes that a medieval port city's prosperity depended less on the volume of goods passing through it than on its role as a place where merchants settled disputes, arguing that the city's courts drew traders who might otherwise have avoided the region.", "stem": "Which finding, if true, would most directly support Farouk's proposal?", "choices": {"A": "Records show that many merchants who used the city's courts conducted their actual buying and selling elsewhere, traveling to the city chiefly to have contracts adjudicated.", "B": "The city's harbor could accommodate more ships than any other port on the coast.", "C": "The volume of goods passing through the city rose steadily over two centuries.", "D": "Medieval ports generally grew wealthy through a mix of trade and services."}, "correct": "A", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Ters yon", "D": "Cok genel"}, "why_correct": "Farouk claims prosperity rested on the city's role in dispute resolution, not trade volume. Merchants coming mainly to use the courts while trading elsewhere directly supports that the courts, not throughput, drew them.", "why_wrong": {"B": "Harbor capacity bears on trade volume, the factor Farouk downplays, not on the courts.", "C": "Rising trade volume points to the very explanation Farouk argues against.", "D": "A general claim about ports mixing trade and services does not single out dispute resolution here."}}, {"id": "u1-l1-f1-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Astronomer Wei Lin suggests that a faint, slowly fading glow observed after a distant stellar explosion came from dust in the surrounding space reheated by the blast, rather than from the explosion's own cooling debris, noting that the glow persisted far longer than debris alone would allow.", "stem": "Which finding, if true, would most directly support Lin's suggestion?", "choices": {"A": "The explosion was among the brightest recorded in that region of the sky.", "B": "The wavelengths of the lingering glow match those emitted by heated interstellar dust and differ from those expected of the explosion's cooling debris.", "C": "Stellar explosions of this type are observed several times each year across the galaxy.", "D": "The distant galaxy hosting the explosion contains many young, massive stars."}, "correct": "B", "choice_families": {"C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Lin claims the glow came from reheated dust, not cooling debris. A spectral match to heated dust, and mismatch to debris, directly distinguishes the two sources in Lin's favor.", "why_wrong": {"C": "How often such explosions occur is general background, not evidence about this glow's source.", "D": "The galaxy's stellar population is unrelated to what produced this particular afterglow.", "A": "The explosion's brightness does not indicate whether dust or debris produced the later glow."}}, {"id": "u1-l1-f1-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Historian Amara Belet argues that a nineteenth-century reformer's influence came less from her published pamphlets, which circulated modestly, than from the network of correspondence she maintained with officials, through which her proposals reached lawmakers directly.", "stem": "Which finding, if true, would most directly support Belet's argument?", "choices": {"A": "The reformer corresponded in three languages over the course of her career.", "B": "The reformer's pamphlets were reprinted twice during her lifetime.", "C": "Several laws of the period contain provisions closely echoing wording found only in the reformer's private letters to officials, not in her published pamphlets.", "D": "Reformers of the era commonly relied on both publications and personal connections."}, "correct": "C", "choice_families": {"B": "Ters yon", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Belet claims the letters, not the pamphlets, carried the reformer's influence to lawmakers. Laws echoing wording unique to her letters directly ties her impact to the correspondence.", "why_wrong": {"B": "Reprinting of the pamphlets points to the channel Belet argues was less important.", "D": "A general reliance on both means does not single out the correspondence in this case.", "A": "The languages she wrote in concern her range, not how her influence reached lawmakers."}}, {"id": "u1-l1-f1-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Biologist Sofia Ferreira hypothesizes that a cave-dwelling salamander lost its eyes over evolutionary time not simply because vision was useless in the dark but because the energy saved by not building eyes was redirected to other senses, predicting that eyeless populations invest more in touch-sensitive organs than sighted relatives do.", "stem": "Which finding, if true, would most directly support Ferreira's hypothesis?", "choices": {"A": "The salamander's surface-dwelling relatives rely heavily on vision to find food.", "B": "The cave environment the salamanders inhabit is completely dark year-round.", "C": "Several unrelated cave animals have also lost their eyes over time.", "D": "Eyeless cave populations develop markedly denser arrays of touch receptors along their skin than closely related surface populations that retain eyes."}, "correct": "D", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Ferreira's specific claim is an energy trade-off: savings from eye loss go into other senses. Denser touch receptors in eyeless populations than sighted relatives directly supports that redirection.", "why_wrong": {"B": "Total darkness explains why vision is useless but not the trade-off toward other senses that Ferreira proposes.", "C": "Eye loss in other cave animals is general context, not evidence for the energy trade-off here.", "A": "That surface relatives rely on vision does not speak to investment in other senses underground."}}, {"id": "u1-l1-f1-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Musicologist Ren Takahashi proposes that a set of anonymous eighteenth-century sonatas was written for teaching rather than public performance, arguing that their steadily increasing technical difficulty across the set mirrors the order in which skills were introduced in period instruction manuals.", "stem": "Which finding, if true, would most directly support Takahashi's proposal?", "choices": {"A": "Each sonata in the set introduces exactly one new technique not required by the sonatas before it, in the same sequence taught in surviving lesson books of the time.", "B": "The sonatas were copied into a manuscript alongside works by well-known composers.", "C": "Public concerts in the period often featured sonatas of comparable length.", "D": "Teaching pieces were widely produced in the eighteenth century."}, "correct": "A", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Ters yon", "D": "Cok genel"}, "why_correct": "Takahashi claims the sonatas were pedagogical, their difficulty tracking a teaching sequence. One new technique per sonata in the exact order of lesson books directly links the set to instruction.", "why_wrong": {"B": "Being copied alongside famous works speaks to the manuscript's contents, not to a teaching purpose.", "C": "That concerts featured similar sonatas points toward performance, the use Takahashi argues against.", "D": "The general prevalence of teaching pieces does not tie this set to instruction."}}, {"id": "u1-l1-f1-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Geologist Nadia Popescu contends that a layer of fine ash found across a wide region settled from a single volcanic eruption rather than accumulating from many smaller events, citing the layer's uniform thickness over hundreds of kilometers.", "stem": "Which finding, if true, would most directly support Popescu's contention?", "choices": {"A": "Volcanic ash layers are found at many depths in the region's sediments.", "B": "The ash throughout the layer shares an identical chemical signature that matches one specific eruption and no others in the region's record.", "C": "The region has experienced numerous eruptions over the past million years.", "D": "Fine ash can be carried great distances by high-altitude winds."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Ters yon"}, "why_correct": "Popescu claims a single eruption produced the layer. An identical chemical signature matching one eruption throughout directly indicates a single source.", "why_wrong": {"C": "A history of numerous eruptions is background that does not tie this layer to one event.", "D": "That ash travels far explains the layer's spread but not whether one or many eruptions produced it.", "A": "Many ash layers at many depths suggests multiple events, working against a single-eruption origin."}}, {"id": "u1-l1-f2-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Paleontologist Idris Kaya hypothesizes that a group of long-necked dinosaurs fed mainly on low-growing vegetation, despite their height, arguing that the structure of their neck vertebrae limited how far upward they could raise their heads.", "stem": "Which finding, if true, would most directly support Kaya's hypothesis?", "choices": {"A": "Fossilized stomach contents from the dinosaurs consist largely of leaves from the crowns of tall conifers.", "B": "Microscopic wear patterns on the dinosaurs' teeth match the abrasion produced by ground-level plants rich in grit, not by foliage from tall trees.", "C": "The dinosaurs shared their habitat with shorter species that grazed on ferns.", "D": "Long-necked dinosaurs are among the largest land animals ever to have lived."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Ters yon"}, "why_correct": "Kaya claims the dinosaurs fed low. Tooth wear matching gritty ground-level plants directly indicates a low-browsing diet.", "why_wrong": {"C": "The presence of other grazers concerns the ecosystem, not this species' feeding height.", "D": "The animals' great size is general background unrelated to what they ate.", "A": "Stomach contents of high conifer foliage indicate the opposite, high feeding, undercutting rather than supporting the claim."}}, {"id": "u1-l1-f2-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Sociologist Mei-Ling Zhou argues that a city's decision to convert several downtown streets into pedestrian-only zones increased business for local shops, contending that foot traffic, not vehicle access, drives sales in dense commercial districts.", "stem": "Which finding, if true, would most directly support Zhou's argument?", "choices": {"A": "The city added bicycle parking near the converted streets at the same time.", "B": "Several shops on the converted streets closed within a year of the change, citing lost customers who had driven in.", "C": "Shops along the converted streets reported higher revenue in the year after the change than in the year before, while comparable shops on unchanged streets saw no such rise.", "D": "Pedestrian zones have been introduced in many cities around the world."}, "correct": "C", "choice_families": {"B": "Ters yon", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Zhou claims the change raised business. A revenue rise on converted streets but not on comparable unchanged streets directly ties the gain to the conversion.", "why_wrong": {"B": "Closures blamed on lost drive-in customers point to a decline, contradicting the claim.", "D": "The worldwide spread of pedestrian zones is too general to bear on this city's outcome.", "A": "Added bicycle parking is a coinciding change that muddies rather than supports the specific claim."}}, {"id": "u1-l1-f2-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Chemist Olamide Bello proposes that a newly synthesized coating slows corrosion in steel by forming a barrier that blocks oxygen from reaching the metal's surface, rather than by neutralizing acids as older coatings do.", "stem": "Which finding, if true, would most directly support Bello's proposal?", "choices": {"A": "Corrosion is a costly problem across many industries that rely on steel.", "B": "Steel treated with the coating corrodes markedly more slowly in acidic conditions than untreated steel does.", "C": "The coating can be applied to steel at room temperature.", "D": "Steel treated with the coating corrodes no faster in acidic conditions than in neutral ones, but corrodes rapidly once the coating is scratched to expose bare metal to air."}, "correct": "D", "choice_families": {"B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Bello claims the coating works by blocking oxygen, not neutralizing acid. Indifference to acidity plus rapid corrosion once air reaches scratched metal points precisely to an oxygen barrier.", "why_wrong": {"B": "Better performance specifically in acidic conditions suggests acid neutralization, the mechanism Bello rules out.", "C": "Ease of application is a practical trait unrelated to the corrosion mechanism.", "A": "The general cost of corrosion does not bear on how this coating works."}}, {"id": "u1-l1-f2-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Historian Paulo Rivas contends that a colonial-era road was built primarily to move troops rapidly between garrisons, not to promote trade, pointing to its straight course through sparsely populated terrain that bypassed the region's market towns.", "stem": "Which finding, if true, would most directly support Rivas's contention?", "choices": {"A": "Surviving military dispatches from the period repeatedly describe using the road to reinforce distant garrisons on short notice, with no mention of commercial use.", "B": "Merchants' account books from the era record frequent shipments of goods along the road between market towns.", "C": "The road was paved with stone quarried near its midpoint.", "D": "Roads served many purposes in colonial administration."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Rivas claims a military purpose over trade. Dispatches describing troop movement and no commerce directly supports the military-first reading.", "why_wrong": {"B": "Records of frequent commercial shipments point to the trade purpose Rivas argues against.", "C": "The paving material concerns construction, not the road's purpose.", "D": "That roads served many purposes is too general to establish this road's primary aim."}}, {"id": "u1-l1-f2-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Neuroscientist Hana Vogel hypothesizes that a bird species' remarkable spatial memory for thousands of hidden food caches arises from an enlarged brain region devoted to spatial processing, which she predicts grows seasonally as caching begins.", "stem": "Which finding, if true, would most directly support Vogel's hypothesis?", "choices": {"A": "The birds retrieve fewer of their caches in years when food is abundant and caching is reduced.", "B": "The spatial-processing region of the birds' brains expands measurably each autumn as caching starts and contracts again after the caches are recovered.", "C": "The birds belong to a family known for complex vocalizations.", "D": "Many animals rely on memory to locate stored or hidden resources."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Tek unsur"}, "why_correct": "Vogel's specific prediction is seasonal growth of the spatial region tied to caching. Measured autumn expansion at caching onset and later contraction directly confirms it.", "why_wrong": {"C": "The family's vocal complexity is unrelated to spatial memory.", "D": "A general reliance on memory across animals does not test the seasonal mechanism proposed.", "A": "Retrieving fewer caches when caching is reduced concerns behavior, not the seasonal brain change Vogel predicts."}}, {"id": "u1-l1-f2-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Literary scholar Bianca Rossi argues that an anonymous medieval poem was composed to be sung rather than read silently, citing its regular refrains and its heavy use of sound patterns that reward the ear more than the eye.", "stem": "Which finding, if true, would most directly support Rossi's argument?", "choices": {"A": "The poem's earliest readers are known to have prized silent, private reading.", "B": "The poem survives in more manuscript copies than any other work of its period.", "C": "Musical notation for a melody appears in the margins of the earliest surviving manuscript of the poem, aligned line by line with its verses.", "D": "Medieval poems often addressed themes of love and loss."}, "correct": "C", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Ters yon"}, "why_correct": "Rossi claims the poem was meant to be sung. Melody notation aligned to its verses in the earliest manuscript directly indicates musical performance.", "why_wrong": {"B": "The number of surviving copies speaks to the poem's popularity, not to singing.", "D": "The common themes of medieval poems are too general to bear on how this one was used.", "A": "Readers prizing silent reading points toward the opposite of oral performance."}}, {"id": "u1-l1-f2-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Agronomist Yusuf Demir proposes that intercropping beans with maize raises total yield because the beans enrich the soil with nitrogen that the maize can then use, rather than because the two crops simply occupy space more efficiently.", "stem": "Which finding, if true, would most directly support Demir's proposal?", "choices": {"A": "Intercropping is practiced by farmers on several continents.", "B": "Fields intercropping beans and maize produce more total plant matter per hectare than fields of maize alone.", "C": "Beans and maize have been grown together in the region for centuries.", "D": "Maize grown beside beans shows elevated nitrogen levels in its tissues and outyields maize given the same spacing but paired with a non-nitrogen-fixing plant."}, "correct": "D", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Demir's mechanism is nitrogen enrichment, not mere spacing. Higher nitrogen in maize beside beans, plus a gain over maize paired with a non-fixing plant at equal spacing, isolates nitrogen as the cause.", "why_wrong": {"B": "Greater total plant matter shows a yield gain but not whether nitrogen or spacing produced it.", "C": "The long local tradition of the practice does not identify the mechanism.", "A": "The worldwide use of intercropping is too general to test Demir's specific claim."}}, {"id": "u1-l1-f2-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Anthropologist Selin Aydar contends that a set of shell beads found far inland reached the site through long-distance trade rather than seasonal migration by the site's inhabitants, noting that the beads come from a coastal species the inhabitants are not known to have traveled to collect.", "stem": "Which finding, if true, would most directly support Aydar's contention?", "choices": {"A": "The beads appear at the inland site alongside other goods traceable to the same distant coast, in the quantities typical of exchanged goods rather than personally gathered ones.", "B": "Isotopic analysis of the inhabitants' remains shows they spent part of each year on the coast where the shells originate.", "C": "Shell beads were valued ornaments in many ancient societies.", "D": "The inland site was occupied for several centuries."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Aydar claims trade, not migration, brought the beads. Their appearance with other coast-traceable goods in exchange-typical quantities supports arrival through trade.", "why_wrong": {"B": "Evidence that the inhabitants themselves spent time on the coast supports migration, the explanation Aydar rejects.", "C": "The general value of shell beads does not distinguish trade from migration.", "D": "The length of occupation is unrelated to how the beads arrived."}}, {"id": "u1-l1-f2-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Physiologist Grace Mwangi hypothesizes that a desert rodent survives without drinking by producing metabolic water from the dry seeds it eats, rather than by minimizing water loss through unusually concentrated urine.", "stem": "Which finding, if true, would most directly support Mwangi's hypothesis?", "choices": {"A": "The rodents produce urine far more concentrated than that of any related species.", "B": "Rodents fed only dry seeds maintain stable body water even when their urine is no more concentrated than that of related species that must drink.", "C": "The rodents are active mainly at night, when desert air is cooler.", "D": "Many desert animals have adaptations that reduce their need for water."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Ters yon"}, "why_correct": "Mwangi's claim is metabolic water production, not water conservation via concentrated urine. Stable body water on dry seeds despite ordinary urine concentration points to internal water generation.", "why_wrong": {"C": "Nighttime activity reduces heat exposure but does not show water is made from seeds.", "D": "A general note about desert adaptations does not test the specific mechanism.", "A": "Exceptionally concentrated urine supports the water-conservation mechanism Mwangi rules out."}}, {"id": "u1-l1-f2-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "Political historian Diego Salas argues that a nineteenth-century newspaper shaped public opinion less through its editorials than through its choice of which events to report at all, contending that its selective coverage set the agenda readers debated.", "stem": "Which finding, if true, would most directly support Salas's argument?", "choices": {"A": "The newspaper employed more reporters than any of its competitors.", "B": "The newspaper's editorials were quoted approvingly in political speeches of the period.", "C": "Topics the newspaper chose to cover, regardless of the stance its editorials took, became the subjects most discussed in readers' letters and rival papers in the following weeks.", "D": "Newspapers were a leading source of public information in the nineteenth century."}, "correct": "C", "choice_families": {"B": "Ters yon", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Salas claims influence came from selection of topics, not editorials. Covered topics driving later debate regardless of editorial stance directly supports agenda-setting through selection.", "why_wrong": {"B": "Editorials quoted in speeches points to editorial influence, the channel Salas downplays.", "D": "The general importance of newspapers is too broad to establish this mechanism.", "A": "The size of the reporting staff concerns capacity, not agenda-setting."}}, {"id": "u1-l1-f3-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Marine biologist Renata Cho proposes that a coral species survives warming seas better than its relatives both because it hosts unusually heat-tolerant algae and because it can expel and quickly replace those algae when stressed, minimizing the time it spends without them.", "stem": "Which finding, if true, would most strongly support Cho's proposal?", "choices": {"A": "The coral occupies the same reef zones as several of its more vulnerable relatives.", "B": "The algae hosted by the coral tolerate temperatures several degrees higher than those tolerated by the algae of related species.", "C": "The coral hosts algae that withstand higher temperatures than the algae of related species, and it reacquires expelled algae within days rather than the weeks its relatives require.", "D": "Coral species worldwide vary in their sensitivity to rising sea temperatures."}, "correct": "C", "choice_families": {"B": "Tek unsur", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Cho's claim has two parts: heat-tolerant algae and rapid replacement. Only the finding showing both the algae's superior tolerance and the days-not-weeks recovery supports the full proposal.", "why_wrong": {"B": "Superior algal tolerance addresses only the first part and says nothing about rapid replacement.", "D": "A general statement about varying coral sensitivity does not support this specific two-part claim.", "A": "Sharing reef zones with vulnerable relatives is on topic but tests neither part of the claim."}}, {"id": "u1-l1-f3-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Historian Nkechi Obi argues that a guild in a medieval city maintained its dominance over cloth production both by controlling who could be trained in the craft and by securing exclusive rights to sell finished cloth in the region's markets.", "stem": "Which finding, if true, would most strongly support Obi's argument?", "choices": {"A": "Craft guilds were a common feature of medieval urban economies.", "B": "The guild's charter granted its members the sole right to sell finished cloth throughout the region.", "C": "The guild maintained a hall in the city center where members gathered.", "D": "Surviving records show the guild both set strict limits on the number of apprentices admitted each year and held a charter barring non-members from selling cloth at regional markets."}, "correct": "D", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Obi names two mechanisms: control of training and exclusive sales rights. Only the finding documenting both apprenticeship limits and the sales charter supports the full argument.", "why_wrong": {"B": "The exclusive sales right covers one mechanism but leaves control of training unaddressed.", "C": "The guild hall concerns its premises, not either mechanism of dominance.", "A": "The general prevalence of guilds does not support this specific two-part claim."}}, {"id": "u1-l1-f3-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Engineer Priyanka Rao proposes that a new bridge design withstands earthquakes both by allowing its deck to slide slightly on flexible bearings and by channeling the resulting motion into dampers that absorb the energy before it stresses the supports.", "stem": "Which finding, if true, would most strongly support Rao's proposal?", "choices": {"A": "In shake-table tests, the deck slid smoothly on its bearings during simulated quakes, and sensors confirmed that the dampers absorbed most of the motion's energy before it reached the supports.", "B": "During simulated quakes, the deck slid smoothly on its flexible bearings without binding.", "C": "The bridge's supports are anchored in bedrock beneath the riverbed.", "D": "Earthquake-resistant designs have become standard for large bridges in seismic regions."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Rao's design has two working parts: sliding bearings and energy-absorbing dampers. Only the finding confirming both the sliding and the dampers' absorption supports the full proposal.", "why_wrong": {"B": "Smooth sliding confirms the bearings alone and says nothing about the dampers absorbing energy.", "C": "How the supports are anchored is on topic but tests neither part of the mechanism.", "D": "The general adoption of quake-resistant designs does not support this specific claim."}}, {"id": "u1-l1-f3-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Botanist Emre Kaplan argues that a wildflower thrives on nutrient-poor slopes both because its roots partner with fungi that extract scarce minerals and because its seeds germinate only after the fires that periodically clear competing vegetation.", "stem": "Which finding, if true, would most strongly support Kaplan's argument?", "choices": {"A": "The wildflower's roots are consistently colonized by fungi that draw scarce minerals from the soil.", "B": "The wildflower's roots consistently host mineral-gathering fungi, and its seeds fail to germinate in the laboratory unless first exposed to heat or smoke of the kind produced by wildfire.", "C": "The slopes where the wildflower grows receive little rainfall for much of the year.", "D": "Many plants form beneficial partnerships with soil fungi."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Tek unsur"}, "why_correct": "Kaplan names two factors: fungal partnership and fire-triggered germination. Only the finding showing both the fungi and the heat-or-smoke germination requirement supports the full argument.", "why_wrong": {"C": "Low rainfall is on topic for the habitat but tests neither named factor.", "D": "A general statement about plant-fungi partnerships does not support this specific two-part claim.", "A": "The fungal partnership addresses one factor and leaves the fire-dependent germination untested."}}, {"id": "u1-l1-f3-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Economist Leila Nasser proposes that a region's rapid recovery from a downturn owed both to public investment that put people back to work and to a fall in the local currency's value that made the region's exports cheaper abroad.", "stem": "Which finding, if true, would most strongly support Nasser's proposal?", "choices": {"A": "The region's population grew modestly over the years of the recovery.", "B": "Employment in the region rose sharply once the public investment projects were under way.", "C": "Employment rose sharply as public projects began, and in the same period the currency's decline coincided with a marked jump in orders for the region's exports from foreign buyers.", "D": "Economic recoveries generally depend on several reinforcing factors."}, "correct": "C", "choice_families": {"B": "Tek unsur", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Nasser names two drivers: public investment and a cheaper currency boosting exports. Only the finding showing both the employment jump and the export surge tied to the currency's fall supports the full proposal.", "why_wrong": {"B": "Rising employment addresses the investment driver alone, not the export effect.", "D": "A general claim that recoveries have several causes does not support this specific two-part proposal.", "A": "Modest population growth is on topic but tests neither driver."}}, {"id": "u1-l1-f3-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Zoologist Tunde Bassey proposes that a frog species avoids predators both by secreting a bitter toxin through its skin and by displaying bright coloration that warns experienced predators to keep away.", "stem": "Which finding, if true, would most strongly support Bassey's proposal?", "choices": {"A": "Bright coloration serves a warning function in a wide range of animals.", "B": "Chemical analysis confirms that the frog's skin secretes a distinctly bitter compound.", "C": "The frog is most active during the cooler hours of the early morning.", "D": "The frog's skin secretions taste bitter enough to deter predators, and predators that have once tasted the frog thereafter avoid others sharing its bright coloration."}, "correct": "D", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Bassey names two defenses: a bitter toxin and warning coloration that predators learn. Only the finding showing both the deterrent secretion and predators avoiding the color after tasting supports the full proposal.", "why_wrong": {"B": "Confirming the bitter secretion addresses one defense and leaves the warning-color function untested.", "C": "The frog's activity time is on topic but tests neither defense.", "A": "A general statement about warning coloration does not support this specific two-part claim."}}, {"id": "u1-l1-f3-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Historian Camille Fournier argues that a printing house came to dominate the book trade in its city both because it obtained a royal privilege shielding its titles from copying and because it built a distribution network reaching booksellers in distant towns.", "stem": "Which finding, if true, would most strongly support Fournier's argument?", "choices": {"A": "Records show the printing house held a royal privilege against unauthorized reprints and maintained standing accounts with booksellers in a dozen distant towns.", "B": "A royal privilege protected the printing house's titles from being reprinted by rivals.", "C": "The printing house operated several presses under one roof.", "D": "Printing houses of the era competed for advantages of many kinds."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Fournier names two sources of dominance: legal protection and a distribution network. Only the finding documenting both the privilege and the distant bookseller accounts supports the full argument.", "why_wrong": {"B": "The royal privilege covers legal protection alone, not the distribution network.", "C": "The number of presses concerns capacity, not either named source of dominance.", "D": "A general statement about competition among printers does not support this specific claim."}}, {"id": "u1-l1-f3-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Climate scientist Ingrid Halvorsen proposes that a coastal marsh limits flooding in the town behind it both by absorbing storm water into its spongy soil and by slowing incoming waves as they pass through its dense grasses.", "stem": "Which finding, if true, would most strongly support Halvorsen's proposal?", "choices": {"A": "During storms, the marsh's soil absorbs large volumes of incoming storm water.", "B": "During storms, the marsh soil takes up large volumes of water, and wave-height sensors show waves losing much of their force as they cross the marsh's grasses before reaching the town.", "C": "The marsh is home to several species of wading birds.", "D": "Coastal wetlands are widely recognized for reducing flood risk."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Tek unsur"}, "why_correct": "Halvorsen names two protections: soil absorption and wave slowing. Only the finding showing both the water uptake and the measured loss of wave force supports the full proposal.", "why_wrong": {"C": "The marsh's bird life is on topic but tests neither protection.", "D": "A general statement about wetlands and flood risk does not support this specific two-part claim.", "A": "Soil absorption addresses one protection and leaves the wave-slowing effect untested."}}, {"id": "u1-l1-f3-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Literary scholar Daniel Wexler argues that a novelist revised her manuscript both to sharpen the moral ambiguity of her protagonist and to compress a sprawling timeline into a single decisive season.", "stem": "Which finding, if true, would most strongly support Wexler's argument?", "choices": {"A": "The novelist kept detailed notebooks throughout the years she spent writing the book.", "B": "Across successive drafts, the protagonist's motives become steadily more difficult to judge as simply good or bad.", "C": "Across successive drafts, the protagonist's choices grow harder to judge as clearly right or wrong, and events once spread over several years are drawn together into the span of one summer.", "D": "Novelists frequently revise their manuscripts substantially before publication."}, "correct": "C", "choice_families": {"B": "Tek unsur", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Wexler names two aims: deepening moral ambiguity and compressing the timeline. Only the finding showing both the harder-to-judge protagonist and the collapse of years into one season supports the full argument.", "why_wrong": {"B": "The protagonist's growing ambiguity addresses one aim and leaves the timeline compression untested.", "D": "A general statement that novelists revise heavily does not support this specific two-part claim.", "A": "The novelist's notebooks concern her process, not either named revision aim."}}, {"id": "u1-l1-f3-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "Physicist Aya Nakamura proposes that a proposed telescope design produces sharper images both by using a wider mirror that gathers more light and by correcting, in real time, the blurring that the atmosphere introduces.", "stem": "Which finding, if true, would most strongly support Nakamura's proposal?", "choices": {"A": "Larger mirrors have long been used to improve astronomical images.", "B": "In trials, the design's wider mirror collected substantially more light than standard mirrors did.", "C": "The telescope is intended for a site at high altitude in a dry climate.", "D": "In trials, the wider mirror collected substantially more light than standard mirrors, and the real-time correction system measurably reduced atmospheric blurring in the resulting images."}, "correct": "D", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Nakamura names two contributors to sharpness: a wider light-gathering mirror and real-time atmospheric correction. Only the finding confirming both supports the full proposal.", "why_wrong": {"B": "The wider mirror's light gathering addresses one contributor and leaves the atmospheric correction untested.", "C": "The intended site is on topic but tests neither part of the design.", "A": "A general statement about larger mirrors does not support this specific two-part claim."}}, {"id": "u1-l1-f4-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Ornithologist Sabine Roux proposes that a particular warbler population, unlike neighboring populations of the same species, has begun migrating a month earlier in response to warmer springs at its breeding grounds.", "stem": "Which finding, if true, would most directly support Roux's proposal?", "choices": {"A": "Spring temperatures have risen, on average, across the warbler's entire range.", "B": "Migratory birds around the world are adjusting the timing of their movements as the climate warms.", "C": "The warbler species as a whole occupies a broad range across the continent.", "D": "Over the past two decades, this population's departure date has advanced in step with rising spring temperatures at its breeding grounds, while neighboring populations' dates have not shifted."}, "correct": "D", "choice_families": {"B": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "A": "Cok genel"}, "why_correct": "Roux's claim is specific: this population, unlike its neighbors, shifted its timing with local warming. The population's advancing departure tracking local temperature while neighbors stay put confirms exactly that contrast.", "why_wrong": {"B": "A worldwide trend among migratory birds is too general to establish this population's specific, distinctive shift.", "C": "The species' broad range is general background unrelated to this population's timing.", "A": "Range-wide average warming does not show that this particular population responded while others did not."}}, {"id": "u1-l1-f4-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Historian Marcus Feld argues that one specific pamphlet, published in a single city in 1775, was the decisive spark for a local uprising, rather than the broader unrest already spreading through the wider region.", "stem": "Which finding, if true, would most directly support Feld's argument?", "choices": {"A": "In that city, organized protest began within days of the pamphlet's appearance, though the same unrest did not reach neighboring towns until months afterward.", "B": "Political pamphlets circulated widely and shaped opinion throughout the region in the 1770s.", "C": "The 1770s were a decade of mounting tension across the wider region.", "D": "Printed material played an important role in the politics of the era."}, "correct": "A", "choice_families": {"B": "Cok genel", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Feld credits one specific pamphlet in one city. Protest beginning there within days, while neighboring towns lagged by months, isolates the pamphlet's local effect from the broader regional unrest.", "why_wrong": {"B": "A region-wide role for pamphlets is too general to single out this one pamphlet's decisive effect.", "C": "Mounting regional tension points to the broad explanation Feld sets aside, not the specific spark.", "D": "The general importance of print in the era does not establish this pamphlet's particular role."}}, {"id": "u1-l1-f4-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Epidemiologist Ravi Menon proposes that a decline in a specific town's rate of a waterborne illness after 2015 resulted from the town's new filtration plant in particular, not from the general improvement in regional water quality over the same years.", "stem": "Which finding, if true, would most directly support Menon's proposal?", "choices": {"A": "Rates of waterborne illness declined across the region as a whole after 2010.", "B": "After 2015, the illness fell sharply in this town but stayed roughly constant in nearby towns that drew from the same regional water sources but lacked new filtration plants.", "C": "Modern filtration technology has improved considerably over the past several decades.", "D": "Clean water is essential to preventing many waterborne illnesses."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Cok genel"}, "why_correct": "Menon credits this town's specific plant over general regional improvement. A sharp local drop absent in nearby towns sharing the same water but lacking new plants isolates the plant's effect.", "why_wrong": {"C": "General progress in filtration technology does not establish this town's particular outcome.", "D": "The general importance of clean water does not tie the decline to this specific plant.", "A": "A region-wide decline is the general explanation Menon argues against, not evidence for the specific plant."}}, {"id": "u1-l1-f4-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Musicologist Clara Nwosu argues that one particular composer, rather than her contemporaries generally, pioneered a distinctive rhythmic technique that later became widespread.", "stem": "Which finding, if true, would most directly support Nwosu's argument?", "choices": {"A": "The period saw a great deal of experimentation with rhythm among many composers.", "B": "The rhythmic technique became common among composers across the following generation.", "C": "The technique appears in this composer's works dated years before any surviving example by her contemporaries, several of whom are known to have studied her scores.", "D": "Rhythm is a fundamental element of nearly all musical composition."}, "correct": "C", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Cok genel"}, "why_correct": "Nwosu credits one specific composer as the pioneer. The technique appearing in her work years before any contemporary's, with contemporaries known to have studied her, directly supports her priority.", "why_wrong": {"B": "That the technique later spread is on topic but does not show this composer originated it.", "D": "The general importance of rhythm does not establish this composer's specific priority.", "A": "Widespread experimentation among many composers points away from a single pioneer."}}, {"id": "u1-l1-f4-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Ecologist Bruno Alves proposes that the return of a specific predator, the otter, to one river, in particular, restored that river's fish populations, rather than the general cleanup of the river system that occurred in the same years.", "stem": "Which finding, if true, would most directly support Alves's proposal?", "choices": {"A": "Healthy rivers generally support larger and more varied fish populations.", "B": "Pollution levels fell throughout the river system over the years in question.", "C": "Otters are known to shape the ecosystems of many rivers they inhabit.", "D": "Fish numbers rebounded on the stretch of river where otters returned but remained low on an equally clean stretch of the same river where otters were still absent."}, "correct": "D", "choice_families": {"B": "Cok genel", "C": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Alves credits the otters' return over the general cleanup. Fish rebounding where otters returned but not on an equally clean otterless stretch isolates the otters' specific effect.", "why_wrong": {"B": "A system-wide fall in pollution is the general explanation Alves argues against.", "C": "A general statement about otters shaping rivers does not establish their effect on this river.", "A": "The general link between clean rivers and fish does not tie the rebound to the otters."}}, {"id": "u1-l1-f4-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Historian Yara Haddad argues that one specific trade route, rather than long-distance commerce in general, carried a particular craft technique from one civilization to another.", "stem": "Which finding, if true, would most directly support Haddad's argument?", "choices": {"A": "The technique appears at sites along this route in a clear sequence from the source civilization outward, and is absent from sites connected only by other trade routes.", "B": "Long-distance trade linked many distant civilizations during the period.", "C": "Craft techniques have spread between cultures throughout recorded history.", "D": "The two civilizations exchanged a wide variety of goods over many centuries."}, "correct": "A", "choice_families": {"B": "Cok genel", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Haddad credits one specific route. The technique appearing in sequence along that route and absent where only other routes connected sites isolates this route as the path of transmission.", "why_wrong": {"B": "The general existence of long-distance trade is the broad explanation Haddad narrows down from.", "C": "That techniques spread across cultures generally does not identify this specific route.", "D": "A broad exchange of goods does not show this particular route carried the technique."}}, {"id": "u1-l1-f4-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Neuroscientist Petra Lindqvist proposes that one specific brain region, not the broad network active during memory tasks generally, is essential for recalling the order in which events occurred.", "stem": "Which finding, if true, would most directly support Lindqvist's proposal?", "choices": {"A": "A broad network of brain regions becomes active whenever people perform memory tasks.", "B": "Patients with damage confined to that single region can recall which events happened but not their sequence, while patients with damage elsewhere in the network retain the sequence.", "C": "Memory is among the most intensively studied functions in neuroscience.", "D": "Different memory tasks draw on overlapping sets of brain regions."}, "correct": "B", "choice_families": {"C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel", "A": "Cok genel"}, "why_correct": "Lindqvist credits one specific region for sequence memory. Damage to just that region sparing event recall but destroying sequence, while other damage spares sequence, isolates the region's specific role.", "why_wrong": {"C": "The intensity of memory research is unrelated to this specific region's role.", "D": "Overlapping regions across tasks does not single out this region for sequence memory.", "A": "The broad active network is the general explanation Lindqvist narrows down from."}}, {"id": "u1-l1-f4-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Economist Sara Villanueva argues that one specific policy, a targeted tax credit, rather than the general economic growth of the period, was responsible for a rise in a region's small-business formation.", "stem": "Which finding, if true, would most directly support Villanueva's argument?", "choices": {"A": "Small businesses are widely regarded as important engines of employment.", "B": "The region's overall economy expanded steadily throughout the years in question.", "C": "New business registrations jumped just after the credit took effect and only among the specific firms eligible for it, while ineligible firms of similar size showed no such increase.", "D": "Tax policy can influence economic activity in many different ways."}, "correct": "C", "choice_families": {"B": "Cok genel", "D": "Cok genel", "A": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Villanueva credits one specific credit over general growth. A jump confined to eligible firms right after the credit, absent among similar ineligible firms, isolates the policy's specific effect.", "why_wrong": {"B": "General economic expansion is the broad explanation Villanueva argues against.", "D": "A general statement about tax policy's influence does not establish this credit's specific effect.", "A": "The general importance of small business does not tie the rise to this policy."}}, {"id": "u1-l1-f4-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Archaeologist Kwame Asante proposes that one particular settlement, rather than the region's population generally, first adopted a new pottery style, later spreading it to neighboring communities.", "stem": "Which finding, if true, would most directly support Asante's proposal?", "choices": {"A": "The region supported many settlements of varying size during the period.", "B": "The pottery style eventually became common throughout the region.", "C": "Pottery styles have changed continually across human history.", "D": "The style appears in this settlement's layers a full generation before it shows up anywhere else in the region, and the earliest examples elsewhere closely copy this settlement's forms."}, "correct": "D", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel", "A": "Cok genel"}, "why_correct": "Asante credits one specific settlement as the origin. The style appearing there a generation earlier, with later examples elsewhere copying its forms, directly supports that settlement's priority and role in spreading it.", "why_wrong": {"B": "That the style became common regionally is on topic but does not show where it began.", "C": "The general fact that pottery styles change does not identify this settlement's priority.", "A": "The presence of many settlements is background that does not single out this one."}}, {"id": "u1-l1-f4-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "Physiologist Omar Khoury argues that one specific muscle adaptation, rather than improved fitness in general, explains why a group of high-altitude residents tires less quickly during exertion than lowland visitors do.", "stem": "Which finding, if true, would most directly support Khoury's argument?", "choices": {"A": "The high-altitude residents' muscles contain a distinctive density of energy-producing structures not found in lowlanders, and this specific difference predicts their endurance better than overall fitness measures do.", "B": "People who exercise regularly tend to tire less quickly than sedentary people.", "C": "High-altitude environments pose many physiological challenges to the human body.", "D": "Physical endurance depends on numerous interacting factors."}, "correct": "A", "choice_families": {"B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel", "D": "Cok genel"}, "why_correct": "Khoury credits one specific muscle adaptation over general fitness. A distinctive density of energy structures absent in lowlanders, predicting endurance better than fitness measures, isolates that specific adaptation.", "why_wrong": {"B": "The general link between exercise and endurance is the broad explanation Khoury argues against.", "C": "The many challenges of altitude are general background, not evidence for this specific adaptation.", "D": "That endurance has many causes does not single out this muscle adaptation."}}]}, {"no": 2, "name": "Command of Evidence: Quantitative", "teaching": {"ne_olculuyor": ["Metin bir iddia kurar, yanında bir tablo ya da grafik verilir. Soru: hangi şık tablodaki veriyi kullanarak metni en iyi tamamlar?", "Bu soru Türk öğrencinin en çok kaybettiği yerdir ve sebebi ilginçtir. Matematik kolaydır, ıngilizce kolaydır, ama İKİ AŞAMALI test yapmayı kimse öğretmez.", "Her şık iki testten geçmek zorunda. Birinci test: sayılar tabloya UYUYOR mu. İkinci test: bu veri metnin İDDİASINI destekliyor mu. Bir şık birinci testi geçip ikinciden kalabilir. İşte tuzak orada."], "karar_proseduru": ["TABLOYA HENÜZ BAKMA. Önce metni oku.  Metnin iddiası ne. Bunu bilmeden tabloya bakarsan sayılar arasında kaybolursun. En sık yapılan hata budur.", "İddiayı tek cümleye indir ve yönünü işaretle.  Örnek: A grubu B grubundan daha yüksek. Ok yönünü bil.", "Tablonun başlığını ve birimlerini oku.  Yüzde mi, adet mi, kilogram mı. Satırlar ne, sütunlar ne. Otuz saniye harca, sonra bir dakika kazan.", "Her şıkkı TEK TEK tabloda doğrula.  Sayı tabloda var mı, doğru satırdan mı geliyor. Yanlış sayı içeren şıkkı hemen ele.", "Ayakta kalan şıklara ikinci testi uygula.  Bu veri metnin iddiasını DESTEKLİYOR mu. Sayı doğru olabilir ve yine de yanlış cevap olabilir."], "celdirici_aileleri": [{"ad": "Doğru sayı, yanlış iş", "tanim": "Sayı tabloda aynen var. Ama metnin iddiasını desteklemiyor, hatta bazen alakasız bir şeyi ölçüyor. En sık düşülen tuzak. Öğrenci sayıyı tabloda bulunca rahatlıyor ve işaretliyor."}, {"ad": "Satır sütun karışıklığı", "tanim": "Sayı tabloda var ama başka bir satırdan ya da başka bir sütundan alınmış. Aceleyle okuyunca yakalanmaz. Parmağını satıra koy."}, {"ad": "Yön tersine çevrilmiş", "tanim": "Karşılaştırma doğru unsurları içeriyor ama büyük küçük ters yazılmış. greater than yerine less than. Tek kelime, tam puan."}, {"ad": "Kıyassız tek değer", "tanim": "Şık tabloda gerçekten var olan tek bir sayı verir ama hiçbir şeyle karşılaştırmaz. İddia bir KARŞILAŞTIRMA istiyorsa tek değer onu kanıtlamaz."}], "top_tips": ["Şıkkın sayısını tabloda parmağını koyarak bul. Gözle taramak hata üretir. Bu bir sınav, hız değil doğruluk kazandırır.", "Metinde however, but, yet varsa iddia bir KARŞITLIK kuruyordur. O zaman doğru şık da iki değeri KARŞILAŞTIRIR. Tek değer veren şık yanlıştır.", "Metin bir grubun özelliğini söylüyorsa, doğru şık o grubun değerini vermekle kalmaz, en azından ikinci bir grupla KIYASLAR. Kıyas yoksa iddia kanıtlanmamıştır.", "Tabloda birden fazla sütun varsa iddianın HANGİ sütunu ilgilendirdiğini işaretle. Çeldiriciler genelde yanlış sütundan doğru sayı getirir."], "kavramsal_temel": ["Command of Evidence: Quantitative, bir grafik ya da tablodaki VERIYI bir iddiayla eslestirmeni ister. Metin bir bosluk birakir, sen tablodan dogru veriyi secip o boslugu iddiayla tutarli sekilde doldurursun.", "Bu soru veri okumaktan cok, VERI ile IDDIA arasindaki uyumu olcer. Dogru secenek hem tabloda dogru okunmus olmali hem de cumlenin kurdugu mantiga hizmet etmeli. Ikisinden biri tutmazsa secenek yanlistir.", "En sik tuzak, tabloda DOGRU ama cumlenin ISTEDIGI karsilastirmayla ilgisiz bir veri secmektir. Ornegin cumle bir artis vurgulariken, secenek dogru bir rakam verir ama artisi degil baska bir seyi gosterir.", "Bu yuzden once cumlenin ne iddia ettigine bak, sonra tabloya git. Tabloyu amacsiz okumak seni yanlis ama dogru gorunen rakamlara suruklersin."], "cozumlu_ornekler": [{"passage": "A table shows the average daily water use per person in four cities: City A 120 liters, City B 210 liters, City C 95 liters, City D 180 liters. A report claims that City C's conservation program is the most effective of the four. This claim is best supported by the fact that City C ______", "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "uses 95 liters per person, the lowest of the four cities", "B": "uses 95 liters per person, more than City A", "C": "uses less water than City B, which uses 210 liters", "D": "is one of four cities measured in the study"}, "correct": "A", "adimlar": ["Iddiayi oku: City C programi EN ETKILI. En etkili demek, en dusuk kullanim demek.", "Tabloya git: en dusuk deger City C, 95 litre. Digerleri 120, 210, 180.", "A hem dogru okuyor (95, en dusuk) hem iddiaya hizmet ediyor (en etkili = en dusuk). Dogru.", "B dogru rakam ama yanlis karsilastirma, City A'dan fazla demek iddiayi desteklemez. C dogru ama sadece bir sehirle kiyaslar, en etkili iddiasini tam kanitlamaz. D veri bile vermez."], "sonuc": "Dogru secenek hem veriyi dogru okur hem iddianin tam ihtiyacini (en dusuk, yani en etkili) karsilar."}, {"passage": "A graph shows a company's sales rising from 40 units in January to 100 units in April. A summary states that sales more than doubled over this period. This is supported because sales ______", "stem": "Which choice most effectively uses data from the graph to support the statement?", "choices": {"A": "rose from 40 units to 100 units, more than twice the starting figure", "B": "reached 100 units in April", "C": "were higher in April than in January", "D": "changed each month between January and April"}, "correct": "A", "adimlar": ["Iddia: satislar iki kattan FAZLA artti.", "Iki kattan fazla, baslangicin iki katini gecmek demek. Baslangic 40, iki kati 80. Nisan 100, yani 80'i geciyor.", "A hem baslangic hem bitis rakamini verir ve iki kati gectigini gosterir. Iddiayi tam kanitlar.", "B ve C dogru ama sadece bir uc noktayi verir, iki kata cikmayi gostermez. D degisimi soyler ama miktarini vermez."], "sonuc": "Bir orani ya da kati kanitlamak icin secenek hem baslangic hem bitis degerini icermeli, tek nokta yetmez."}], "sik_hatalar": [{"hata": "Tabloda dogru ama iddiayla ilgisiz veri secmek", "cozum": "Rakamin dogru okunmasi yetmez. Cumlenin istedigi karsilastirmayi yapmali."}, {"hata": "Once tabloyu okuyup sonra iddiaya bakmak", "cozum": "Sirayi tersine cevir. Once iddiayi anla, sonra ihtiyacin olan veriyi ara."}, {"hata": "Tek nokta ile oran iddiasini kanitlamaya calismak", "cozum": "Artis, kat, oran gibi iddialar en az iki deger ister. Tek rakam yeterli degildir."}, {"hata": "En buyuk ya da en dikkat cekici rakami secmek", "cozum": "Dikkat ceken rakam degil, iddianin ihtiyac duydugu rakam dogrudur."}], "strateji": ["Once iddiayi oku: en yuksek mi, en dusuk mu, artis mi, oran mi istiyor.", "Iddianin hangi veriye ihtiyaci oldugunu belirle.", "Tabloya git ve o veriyi bul, dogru oku.", "Secenek hem dogru veriyi versin hem iddiaya hizmet etsin, ikisini de kontrol et.", "Tek nokta oran kanitlamaz, kat ve artis icin iki deger ara."]}, "families": ["Dogru sayi yanlis is", "Satir sutun karisikligi", "Yon tersine cevrilmis", "Kiyassiz tek deger"], "fam_short": {"Dogru sayi yanlis is": "Yanlis is", "Satir sutun karisikligi": "Satir/sutun", "Yon tersine cevrilmis": "Ters yon", "Kiyassiz tek deger": "Kiyassiz"}, "main_ids": ["u1-l2-f1-01", "u1-l2-f2-01", "u1-l2-f3-01", "u1-l2-f4-01"], "questions": [{"id": "u1-l2-f1-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A researcher claims that a new fertilizer raised wheat yield more than it raised corn yield.", "table": {"head": ["Crop", "Yield increase (%)"], "rows": [["Wheat", "18"], ["Corn", "7"], ["Barley", "12"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Wheat yield rose by 18 percent after the fertilizer was applied to the field.", "B": "Corn yield rose by a greater amount than wheat yield after the fertilizer.", "C": "Barley yield rose by 12 percent after the fertilizer was applied to the field.", "D": "Wheat yield rose by 18 percent, compared with a 7 percent rise for corn."}, "correct": "D", "choice_families": {"A": "Kiyassiz tek deger", "B": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim compares wheat with corn. Only the choice giving both figures, 18 against 7, in the right direction supports it.", "why_wrong": {"A": "Eighteen percent is wheat's real rise, but with no corn figure it does not show wheat rose more.", "B": "This reverses the comparison; the data show wheat rose more, not corn.", "C": "Twelve percent is a real figure but it is barley's, which the claim does not mention."}}, {"id": "u1-l2-f1-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A study claims that a city's weekday bus ridership grew more than its weekend ridership from 2018 to 2023.", "table": {"head": ["Day type", "2018 (thousands)", "2023 (thousands)"], "rows": [["Weekday", "120", "168"], ["Weekend", "60", "78"], ["Holiday", "40", "44"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Weekday ridership reached 168,000 riders in the year 2023 across the city.", "B": "Weekday ridership rose by 48,000 while weekend ridership rose by only 18,000.", "C": "Weekend ridership grew by a greater amount than weekday ridership over the period.", "D": "Holiday ridership rose from 40,000 to 44,000 riders over the period from 2018 to 2023."}, "correct": "B", "choice_families": {"A": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares weekday with weekend growth. The 48,000 versus 18,000 gain supports weekday growing more.", "why_wrong": {"A": "A single 2023 figure gives no weekend comparison, so it cannot show weekday grew more.", "C": "This reverses the comparison; weekday ridership grew by more, not weekend.", "D": "Holiday figures are real but the claim is about weekday versus weekend, not holidays."}}, {"id": "u1-l2-f1-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A biologist argues that species A tolerated the drought better than species B.", "table": {"head": ["Species", "Survival after 30 days (%)"], "rows": [["A", "82"], ["B", "55"], ["C", "70"]]}, "stem": "Which choice most effectively uses data from the
