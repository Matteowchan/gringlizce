(function() {
  var path = window.location.pathname;
  var slug = path.substring(path.lastIndexOf('/') + 1).replace(/\.html$/, '');
  
  // Redirects if not authed or no product access
  var auth = window.GriAuth && window.GriAuth.requireAuth(slug);
  if (!auth) return;

    // Override goHome (if file uses it) to redirect to user panel
    window.goHome = function() { 
      window.location.href = '/panelim.html'; 
    };
    
    // Wire the toolbar home button directly
    var homeBtn = document.getElementById('tb-home-btn');

      homeBtn.addEventListener('click', function(e) {

        window.location.href = '/panelim.html'; 
      });

        e.preventDefault(); 
        window.location.href = '/panelim.html'; 
      });

  });
})();

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
:root{--bg:#f0fdfa;--surface:#ffffff;--border:#0d9488;--blight:#ccfbf1;--text:#134e4a;--muted:#5eead4;--muted2:#6b7280;--teal:#0f766e;--tdark:#0d5e57;--tlight:#e6fffa;--taclight:#f0fdfa;--correct:#166534;--cbg:#f0fdf4;--wrong:#991b1b;--wbg:#fef2f2;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(155deg,#f0fdfa 50%,#ccfbf1 100%)}
.s-series{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#5eead4;margin-bottom:.6rem}
.s-badge{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1.1rem;border-radius:50px;margin-bottom:1.6rem}
.s-title{font-family:'Inter',sans-serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;line-height:1.2;margin-bottom:.7rem;color:var(--tdark)}
.s-desc{color:var(--muted2);font-size:.91rem;max-width:440px;line-height:1.65;margin-bottom:1.6rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.2rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.74rem;color:var(--teal);font-family:'DM Mono',monospace}
.btn-p{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.9rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.promo-card{background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.3rem;margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;max-width:320px;width:100%;text-align:center}
.promo-name{font-size:.77rem;color:var(--muted2);font-family:'DM Mono',monospace;letter-spacing:.04em}
.promo-sub{font-size:.68rem;color:var(--muted2);opacity:.7;font-family:'DM Mono',monospace}
.promo-exams{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:.12rem}
.promo-tag{background:transparent;border:1px solid var(--border);border-radius:4px;font-size:.61rem;font-family:'DM Mono',monospace;padding:.1rem .38rem;color:var(--teal);opacity:.85}
.promo-phone{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted2);opacity:.7;margin-top:.1rem}
#quiz{display:none;min-height:100vh;flex-direction:column}
.qbody{flex:1;max-width:680px;margin:0 auto;padding:1.8rem 1.2rem 2.5rem;width:100%}
.tracker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.15rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blight);border:1.5px solid var(--border);transition:all .2s;cursor:pointer}
.dot.ans{background:var(--teal);border-color:var(--teal)}
.dot.cur{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
.qtype-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blight);border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);padding:.25rem .65rem;margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pbox{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r);padding:1.15rem 1.35rem;margin-bottom:1.2rem;font-family:'Lora',serif;font-size:.95rem;line-height:1.78;color:#1c1917}
.pbox u{text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--teal);color:var(--tdark)}
.pbox .blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:60px;text-align:center;font-family:'DM Mono',monospace;font-size:.85rem;color:var(--teal);padding:0 .3rem}
.qt{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--tdark)}
.opts{display:flex;flex-direction:column;gap:.44rem;margin-bottom:1.4rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;background:var(--surface);border:1.5px solid var(--blight);border-radius:var(--r);padding:.65rem .95rem;cursor:pointer;transition:border-color .12s,background .12s;font-size:.91rem;color:var(--text);width:100%;text-align:left;font-family:'Lora',serif}
.opt:hover{border-color:var(--teal);background:var(--taclight)}
.opt.sel{border-color:var(--teal);background:var(--taclight)}
.ol{display:flex;align-items:center;justify-content:center;width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--border);font-size:.72rem;font-family:'DM Mono',monospace;font-weight:700;margin-top:1px;transition:all .12s;flex-shrink:0}
.opt.sel .ol{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center}
.btn-n{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:.55rem 1.1rem;font-size:.87rem;font-weight:600;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s}
.btn-n:hover{border-color:var(--tdark)}
.btn-n:disabled{opacity:.3;cursor:not-allowed}
.btn-sub{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.55rem 1.35rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-sub:hover{opacity:.85}
#results{display:none;background:var(--bg);min-height:100vh}
.rh{background:var(--teal);color:#fff;padding:2rem 1.5rem;text-align:center}
.rh h1{font-family:'Inter',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.rh p{opacity:.75;font-size:.82rem}
.rb{max-width:680px;margin:0 auto;padding:2rem 1.2rem 3rem}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.sc-big{text-align:center}
.sc-num{font-size:3.5rem;font-weight:700;color:var(--teal);font-family:'DM Mono',monospace;line-height:1}
.sc-den{font-size:.8rem;color:var(--muted2);font-family:'DM Mono',monospace}
.sc-pct{font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--tdark)}
.sc-rng{font-size:.8rem;color:var(--muted2);margin-bottom:.4rem}
.sc-tip{font-size:.8rem;color:var(--muted2);line-height:1.55}
.stitle{font-size:.65rem;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:.85rem;padding-bottom:.32rem;border-bottom:1px solid var(--border)}
.wi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.wh{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#fef2f2;border-bottom:1px solid #fecaca;cursor:pointer;user-select:none}
.wn{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--wrong);font-weight:700}
.wt{font-size:.8rem;color:var(--tdark);font-weight:600}
.wtog{margin-left:auto;font-size:.72rem;color:var(--muted2)}
.wb{padding:.9rem;display:none}
.wb.open{display:block}
.rpass{background:var(--bg);border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin-bottom:.7rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.72;color:#1c1917}
.rpass u{text-decoration:none;font-weight:700;color:var(--tdark)}
.ac{background:var(--cbg);color:var(--correct);font-size:.82rem;font-weight:600;padding:.33rem .7rem;border-radius:5px;margin-bottom:.25rem;font-family:'Lora',serif}
.aw{background:var(--wbg);color:var(--wrong);font-size:.82rem;padding:.33rem .7rem;border-radius:5px;margin-bottom:.55rem;text-decoration:line-through;font-family:'Lora',serif}
.expl{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.78rem .9rem;font-size:.82rem;line-height:1.7;color:#292524;white-space:pre-wrap}
.btn-rs{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.75rem 1.8rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:1rem;transition:opacity .15s}
.btn-rs:hover{opacity:.85}
.type-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.ts{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--teal)}
.ts.wrong{border-color:#fca5a5;background:var(--wbg);color:var(--wrong)}
@media(max-width:520px){.sc-card{grid-template-columns:1fr}.sc-num{font-size:2.7rem}}
  


  /* ── Pack Home ── */
  #pack-home{min-height:100vh;display:flex;flex-direction:column;background:var(--bg,#f0fdfa)}
  .ph-header{padding:2.5rem 2rem 2rem;text-align:center;background:var(--teal,#0d9488);color:#fff}

  /* ── Set Complete Screen ── */
  #set-complete{min-height:100vh;display:none;flex-direction:column;background:var(--bg,#f0fdfa)}

  .scc-btn.outline{background:#fff;color:var(--teal,#0d9488)}

  const ALL_SETS=[null, {"n": 1, "topic": "Transitions in Paragraph Context", "diff": "Transitions", "qs": [{"k": "tr", "p": "The opioid epidemic reshaped the American healthcare landscape throughout the 2000s and 2010s, initially driven by the aggressive overprescription of painkillers before evolving into a crisis centered on heroin and illicitly manufactured fentanyl. Federal and state governments pursued a range of legal, regulatory, and public health responses, including restricting opioid prescribing guidelines and funding addiction treatment programs. ______, overdose deaths continued to climb even as prescription rates fell, as individuals dependent on painkillers migrated to cheaper and far more potent street alternatives.", "q": "Which transition best fills the blank?", "o": ["A) Similarly", "B) Nevertheless", "C) For instance", "D) Consequently"], "a": 1, "e": "B doğrudur. İkinci cümle hükümetin önlem aldığını söylüyor; üçüncü cümle bu önlemlere rağmen overdoz ölümlerinin arttığını söylüyor. Bu bir taviz ilişkisidir: önlemler alındı, yine de ölümler arttı. 'Nevertheless' (buna rağmen) bu yapıya tam uyar.\n\nA — 'Similarly' benzerlik bildirir; üçüncü cümle ikinci cümleye paralel değil.\nB — 'Nevertheless': önlemler alındı → buna rağmen ölümler arttı. Doğru taviz bağlacı.\nC — 'For instance' örnek verir; üçüncü cümle bir örnek değil, zıt bir gerçek.\nD — 'Consequently' neden-sonuç kurar; hükümetin önlemleri overdoz artışının nedeni değil."}, {"k": "tr", "p": "Quantum entanglement — the phenomenon in which two particles become correlated such that the quantum state of each cannot be described independently of the other — challenges deeply held intuitions about locality and causality. Albert Einstein famously dismissed the phenomenon as 'spooky action at a distance,' arguing that it implied either faster-than-light communication or hidden variables not captured by quantum theory. ______, decades of experimental tests, most conclusively the Bell test experiments, have confirmed that entanglement is a genuine feature of nature and that no local hidden variable theory can reproduce its predictions.", "q": "Which transition best fills the blank?", "o": ["A) In addition", "B) For this reason", "C) Nonetheless", "D) Accordingly"], "a": 2, "e": "C doğrudur. İkinci cümle Einstein'ın kuantum dolanıklığını reddettiğini anlatıyor. Üçüncü cümle onlarca yıl sonra yapılan deneylerin dolanıklığın gerçek olduğunu kanıtladığını söylüyor. Bu bir 'yine de / buna rağmen' ilişkisidir: Einstein reddetti, ama deney kanıtladı. 'Nonetheless' idealdir.\n\nA — 'In addition' ekleme bildirir; üçüncü cümle ek değil, Einstein'ın görüşüne karşıt bir bulgudur.\nB — 'For this reason' neden-sonuç kurar; Einstein'ın reddi deneylerin nedeni değil.\nC — 'Nonetheless': Einstein reddetti → buna rağmen deneyler dolanıklığı kanıtladı. Doğru.\nD — 'Accordingly' uyum bildirir; üçüncü cümle Einstein'ın görüşüyle uyumlu değil."}, {"k": "tr", "p": "The concept of the 'uncanny valley' — first described by roboticist Masahiro Mori in 1970 — refers to the discomfort humans feel when an artificial agent appears almost, but not quite, human. As robots and digital avatars approach but fail to reach perfect human likeness, the slight imperfections in movement, expression, or proportion trigger a visceral sense of unease that is absent when the agent is clearly non-human. ______, designers of humanoid robots and video game characters must navigate the paradox that more realistic does not always mean more appealing, and that deliberate stylization may produce more positive user responses than near-perfect realism.", "q": "Which transition best fills the blank?", "o": ["A) On the other hand", "B) As a result", "C) Nevertheless", "D) By the same token"], "a": 1, "e": "B doğrudur. İkinci cümle insan benzeri ajanlardaki küçük kusurların huzursuzluk yarattığını açıklıyor. Üçüncü cümle bu psikolojik bulgunun tasarımcılar için yarattığı pratik sonucu veriyor. Neden-sonuç ilişkisi: huzursuzluk yaratan kusurlar → tasarımcılar paradoksla yüzleşmek zorunda. 'As a result' doğrudur.\n\nA — 'On the other hand' zıtlık bildirir; üçüncü cümle ikincisinin pratik sonucudur, zıddı değil.\nB — 'As a result': uncanny valley etkisi → tasarımcılar daha gerçekçi = daha çekici değil paradoksunu ele almak zorunda. Doğru nedensellik.\nC — 'Nevertheless' taviz bildirir; üçüncü cümle öncekiyle çelişmiyor.\nD — 'By the same token' benzer mantık bildirir; doğrudan sonuç daha uygun."}, {"k": "tr", "p": "Industrial fishing fleets deploy an array of sophisticated technologies — GPS navigation, sonar fish-finding equipment, and satellite-linked monitoring systems — that have dramatically increased their capacity to locate and harvest fish populations across even the most remote ocean regions. These technological advances have coincided with the near-total collapse of numerous commercially valuable fish stocks, including Atlantic cod, Pacific bluefin tuna, and several shark species whose population have declined by over ninety percent since industrialized fishing began. ______, the same vessels that generate economic value for fishing communities and food security for millions also represent the primary driver of biodiversity loss in marine ecosystems.", "q": "Which transition best fills the blank?", "o": ["A) Similarly", "B) However", "C) In other words", "D) For example"], "a": 2, "e": "C doğrudur. Önceki iki cümle teknolojik gelişme (arama kapasitesi arttı) ve çöküş (balık stokları azaldı) gerçeklerini ayrı ayrı sunuyor. Üçüncü cümle bu iki gerçeği sentezleyerek paradoksu ifade ediyor: ekonomik değer yaratan aynı teknoloji biyoçeşitliliği yok ediyor. 'In other words' bu iki cümlenin özünü yeniden ifade etmek için kullanılır.\n\nA — 'Similarly' benzerlik bildirir; üçüncü cümle paralel değil, sentez/özet.\nB — 'However' zıtlık bildirir; üçüncü cümle önceki cümlelere karşıt değil, onları birleştiriyor.\nC — 'In other words': teknoloji balık avlar (iyi) ve stokları çökertir (kötü) → başka bir deyişle, aynı şey hem ekonomik değer hem biyoçeşitlilik kaybı. Doğru.\nD — 'For example' örnek verir; üçüncü cümle sentez, örnek değil."}, {"k": "tr", "p": "The widespread adoption of social media as the primary news source for younger adults has coincided with a measurable increase in political polarization across democratic societies, with individuals increasingly consuming information within algorithmically reinforced ideological bubbles. Media scholars debate whether social media is the cause of polarization or merely its amplifier, noting that partisan sorting in American politics, for instance, began well before Facebook or Twitter existed. ______, the structural design of engagement-maximizing algorithms — which systematically prioritize emotionally arousing, outrage-inducing content — appears to accelerate polarization regardless of its root causes.", "q": "Which transition best fills the blank?", "o": ["A) In contrast", "B) Be that as it may", "C) Similarly", "D) Therefore"], "a": 1, "e": "B doğrudur. İkinci cümle akademik tartışmayı — sosyal medya polarizasyonun nedeni mi yoksa yükselticisi mi? — aktarıyor ve kesin bir cevap vermiyor. Üçüncü cümle bu tartışmadan bağımsız olarak algoritmik tasarımın polarizasyonu hızlandırdığını söylüyor. 'Be that as it may' (ne olursa olsun / bu tartışma bir yana) bu belirsizliği kabul edip devam etmek için mükemmeldir.\n\nA — 'In contrast' zıtlık bildirir; üçüncü cümle ikinci cümleyle çelişmiyor.\nB — 'Be that as it may': tartışma ne sonuçlanırsa, algoritmik tasarım polarizasyonu hızlandırıyor. Doğru.\nC — 'Similarly' benzerlik bildirir; uygun değil.\nD — 'Therefore' neden-sonuç kurar; akademik tartışma algoritmaların etkisinin nedeni değil."}, {"k": "tr", "p": "European colonial administrations across Africa and Asia routinely dismissed indigenous governance structures as primitive or illegitimate, imposing centralized bureaucratic systems designed to facilitate resource extraction and administrative control rather than local welfare. Scholars of postcolonial governance have documented how these imposed structures — artificial borders, extractive fiscal systems, and ethnicized administrative categories — have contributed to many of the political instabilities that postcolonial states have struggled to overcome in the decades since independence. ______, uncritical nostalgia for pre-colonial governance is also problematic, as pre-colonial societies were themselves diverse, stratified, and sometimes deeply unequal by contemporary standards of human rights.", "q": "Which transition best fills the blank?", "o": ["A) That said", "B) Similarly", "C) As a result", "D) Furthermore"], "a": 0, "e": "A doğrudur. İlk iki cümle sömürgeci yönetimin zararlarını belgeliyor. Üçüncü cümle ise sömürge öncesi yönetimi romantize etmenin de sorunlu olduğunu söylüyor. Bu bir denge/sınırlama geçişidir: sömürgecilik kötüydü, bununla birlikte sömürge öncesi idealize de edilemez. 'That said' (bununla birlikte / şunu da söylemek gerekir) idealdir.\n\nA — 'That said': sömürgeciliğin zararları gerçek, ama sömürge öncesini de romantize etmek yanlış. Doğru denge bağlacı.\nB — 'Similarly' benzerlik bildirir; üçüncü cümle paralel değil, karşıt bir uyarı.\nC — 'As a result' neden-sonuç kurar; sömürgeciliğin zararları pre-colonial nostaljinin nedeni değil.\nD — 'Furthermore' ek bilgi ekler; üçüncü cümle ek değil, dengeleyici bir uyarı."}, {"k": "tr", "p": "The human brain consumes approximately twenty percent of the body's total energy despite constituting only about two percent of its mass — an extraordinary metabolic demand that has shaped the evolution of human dietary behavior, social cooperation, and cognitive architecture. Neuroscientists have proposed that the brain's disproportionate energy consumption is driven by the maintenance of synaptic potentials and the continuous firing of neural networks even during periods of apparent rest, as documented by the high metabolic activity observed in the 'default mode network.' ______, research into the neural correlates of energy-efficient cognition has become a priority as scientists seek to understand how the brain accomplishes its extraordinary computational feats within the strict metabolic constraints imposed by human physiology.", "q": "Which transition best fills the blank?", "o": ["A) By contrast", "B) Nevertheless", "C) Given this", "D) For instance"], "a": 2, "e": "C doğrudur. İlk iki cümle beynin orantısız enerji tüketimini ve nedenini açıklıyor. Üçüncü cümle bu gerçek göz önünde bulundurulduğunda (given this) enerji verimli bilişin neden araştırma önceliği haline geldiğini açıklıyor. 'Given this' (bu bağlamda / bu durum göz önünde bulundurulduğunda) nedensel bağlamı kusursuz aktarır.\n\nA — 'By contrast' zıtlık bildirir; üçüncü cümle öncekilerle çelişmiyor.\nB — 'Nevertheless' taviz bildirir; üçüncü cümle önceki gerçeğe rağmen değil, ondan dolayı.\nC — 'Given this': beyin çok enerji tüketiyor → bu bağlamda enerji verimli bilişi anlamak öncelik haline geldi. Doğru.\nD — 'For instance' örnek verir; üçüncü cümle bir örnek değil."}, {"k": "tr", "p": "Behavioral economists have shown that individuals systematically deviate from the predictions of rational choice theory in ways that are predictable and reproducible across cultures and contexts. These deviations — including anchoring bias, the endowment effect, hyperbolic discounting, and the framing effect — suggest that human decision-making is governed by cognitive heuristics that evolved for environments quite different from modern economic markets. ______, standard economic models that assume rational utility maximization have come under increasing pressure to incorporate psychological insights, giving rise to behavioral economics as a recognized field within mainstream economic research.", "q": "Which transition best fills the blank?", "o": ["A) Consequently", "B) However", "C) Similarly", "D) In contrast"], "a": 0, "e": "A doğrudur. Önceki iki cümle insanların rasyonel seçim teorisinden sapma gösterdiğini kanıtlıyor. Üçüncü cümle bu gözlemin mantıksal sonucunu aktarıyor: standart ekonomik modeller baskı altında, davranışsal ekonomi doğdu. 'Consequently' (dolayısıyla / sonuç olarak) bu nedensellik zincirini doğru kurar.\n\nA — 'Consequently': insan kararları bilişsel kısa yollar tarafından yönetiliyor → sonuç olarak rasyonel modeller baskı altında. Doğru.\nB — 'However' zıtlık bildirir; üçüncü cümle öncekilerle çelişmiyor.\nC — 'Similarly' benzerlik bildirir; uygun değil.\nD — 'In contrast' zıtlık bildirir; uygun değil."}, {"k": "tr", "p": "The field of epigenetics has demonstrated that environmental factors — including diet, stress, toxin exposure, and social experience — can alter gene expression by modifying chemical tags on DNA and its associated proteins without changing the underlying genetic sequence itself. Crucially, some of these epigenetic modifications appear to be heritable across multiple generations, transmitted to offspring through mechanisms that challenge the classical Mendelian view of inheritance as purely sequence-based. ______, the epigenetic consequences of famine, trauma, or environmental pollution experienced by one generation may be measurable in the physiology of grandchildren who never themselves experienced those conditions.", "q": "Which transition best fills the blank?", "o": ["A) In other words", "B) By contrast", "C) Consequently", "D) For example"], "a": 3, "e": "D doğrudur. İkinci cümle epigenetik değişikliklerin nesiller arası aktarılabileceğini söylüyor. Üçüncü cümle bu iddiayı somutlaştıran bir örnek sunuyor: kıtlık veya travmanın epigenetik izleri torunlarda görülebilir. 'For example' bu somut örneği bağlamak için idealdir.\n\nA — 'In other words' yeniden ifade eder; üçüncü cümle yeni ve somut bir örnek, yeniden ifade değil.\nB — 'By contrast' zıtlık bildirir; üçüncü cümle ikinci cümleyle çelişmiyor.\nC — 'Consequently' neden-sonuç kurar; üçüncü cümle sonuç değil, örnek.\nD — 'For example': nesiller arası aktarım → örneğin kıtlığın izleri torunlarda görülür. Doğru."}, {"k": "tr", "p": "Precision agriculture — the application of data analytics, GPS-guided machinery, and remote sensing technologies to optimize inputs such as water, fertilizer, and pesticides at a sub-field level — has shown considerable promise in reducing the environmental footprint of crop production while maintaining or improving yields. Pilot programs and commercial deployments across the United States, Europe, and Australia have documented measurable reductions in nitrogen runoff, water use, and greenhouse gas emissions per unit of food produced. ______, the technology's high upfront capital costs and the digital infrastructure it requires have limited its adoption primarily to large, well-capitalized commercial farms, leaving smallholder farmers in developing countries largely unable to access its benefits.", "q": "Which transition best fills the blank?", "o": ["A) Furthermore", "B) However", "C) Therefore", "D) Similarly"], "a": 1, "e": "B doğrudur. İlk iki cümle precision agriculture'ın çevresel faydalarını belgeleyen olumlu bulgular sunuyor. Üçüncü cümle ise yüksek maliyetin bu teknolojiyi küçük çiftçiler için erişilemez kıldığını söylüyor. Bu açık bir zıtlık/sınırlama ilişkisidir: faydalar kanıtlandı, ancak erişim eşitsiz. 'However' idealdir.\n\nA — 'Furthermore' ek olumlu bilgi ekler; üçüncü cümle bir sınırlama.\nB — 'However': teknoloji faydalı, ancak küçük çiftçiler erişemiyor. Doğru zıtlık.\nC — 'Therefore' neden-sonuç kurar; üçüncü cümle önceki bulguların sonucu değil.\nD — 'Similarly' benzerlik bildirir; uygun değil."}, {"k": "tr", "p": "The discovery that the universe is not only expanding but accelerating in its expansion — announced in 1998 by two independent research teams and recognized with the Nobel Prize in Physics in 2011 — overturned what had been the consensus expectation among cosmologists. Prior to this finding, most physicists had assumed that gravity would eventually slow and potentially reverse the expansion begun by the Big Bang, raising the possibility of a 'Big Crunch' scenario. ______, the accelerating expansion implies the existence of a mysterious repulsive force or energy density — now termed 'dark energy' — that constitutes approximately 68 percent of the total energy content of the universe yet remains entirely unexplained by any current physical theory.", "q": "Which transition best fills the blank?", "o": ["A) Similarly", "B) Instead", "C) In addition", "D) By contrast"], "a": 1, "e": "B doğrudur. İkinci cümle Big Crunch beklentisini aktarıyor. Üçüncü cümle ise bunun aksine ivmelenen genişlemenin karanlık enerjiyi ima ettiğini söylüyor — yani beklentinin tam tersi gerçekleşti. 'Instead' (bunun yerine / aksine) bu ters gerçeği en doğal biçimde bağlar.\n\nA — 'Similarly' benzerlik bildirir; üçüncü cümle beklentiye benzer değil, tam tersi.\nB — 'Instead': Big Crunch bekleniyor → aksine, ivmelenen genişleme ve karanlık enerji. Doğru.\nC — 'In addition' ek bilgi ekler; üçüncü cümle ekleme değil, tersine çevirme.\nD — 'By contrast' zıtlık bildirir; 'instead' bu bağlamda daha kesin."}, {"k": "tr", "p": "The doctrine of corporate social responsibility holds that companies have obligations to stakeholders beyond their shareholders — including employees, communities, and the natural environment — and that long-term profitability is best served by attending to these broader obligations rather than maximizing short-term returns. Critics of this view, most prominently Milton Friedman, have argued that assigning social responsibilities to corporations confuses the proper roles of market actors and democratic governments, and that a company's fiduciary duty to its shareholders is both legally and ethically primary. ______, the rise of Environmental, Social, and Governance investing, which channels trillions of dollars based on companies' performance on non-financial metrics, suggests that a significant segment of the investment community has effectively rejected Friedman's framework.", "q": "Which transition best fills the blank?", "o": ["A) Accordingly", "B) Similarly", "C) Yet", "D) As a result"], "a": 2, "e": "C doğrudur. İkinci cümle Friedman'ın şirketlerin sosyal sorumluluk üstlenmemesi gerektiği görüşünü sunuyor. Üçüncü cümle ise buna rağmen büyük bir yatırım hareketinin tam da bunu yaparak trilyonlarca doları yönettiğini söylüyor. Bu tam bir 'yine de' ilişkisidir. 'Yet' idealdir.\n\nA — 'Accordingly' uyum bildirir; üçüncü cümle Friedman'ın çerçevesini takip etmiyor, reddediyor.\nB — 'Similarly' benzerlik bildirir; uygun değil.\nC — 'Yet': Friedman şirketlerin sosyal sorumluluk üstlenmemesi gerektiğini savundu → yine de ESG hareketi tam aksini yapıyor. Doğru.\nD — 'As a result' neden-sonuç kurar; ESG hareketi Friedman'ın görüşünün sonucu değil."}, {"k": "tr", "p": "Antarctic ice cores drilled from the continent's interior provide an unbroken proxy record of Earth's climate extending back over 800,000 years, capturing ancient variations in temperature, atmospheric greenhouse gas concentrations, and volcanic activity preserved in successive annual layers of compressed ice. Analysis of these records reveals a striking pattern of glacial-interglacial cycles approximately every 100,000 years, driven primarily by cyclical variations in Earth's orbital geometry around the sun — the so-called Milankovitch cycles. ______, the current rate of increase in atmospheric CO2 — approximately 2.5 parts per million per year — is ten to a hundred times faster than any natural increase documented in the ice core record, underscoring the unprecedented nature of anthropogenic climate forcing.", "q": "Which transition best fills the blank?", "o": ["A) Consequently", "B) Strikingly", "C) For instance", "D) Furthermore"], "a": 1, "e": "B doğrudur. İlk iki cümle doğal iklim döngülerini ve bunları yöneten Milankovitch çevrimlerini anlatıyor. Üçüncü cümle mevcut CO2 artış hızının bu doğal süreçlerden 10-100 kat daha hızlı olduğunu söylüyor — bu şaşırtıcı ve dikkat çekici bir karşılaştırmadır. 'Strikingly' (çarpıcı biçimde / dikkat çekici olarak) bu vurguyu mükemmel taşıyor.\n\nA — 'Consequently' neden-sonuç kurar; mevcut CO2 artışı buz çekirdeklerinin incelenmesinin sonucu değil.\nB — 'Strikingly': buz çekirdekleri doğal döngüleri gösteriyor → çarpıcı biçimde, şimdiki oran 100 kat daha hızlı. Doğru vurgu bağlacı.\nC — 'For instance' örnek verir; üçüncü cümle bir örnek değil, genel bir karşılaştırma.\nD — 'Furthermore' ek bilgi ekler; üçüncü cümle bir ekleme değil, vurgulu karşılaştırma."}, {"k": "tr", "p": "Digital platforms that aggregate and sell user data have become foundational to the contemporary advertising economy, enabling advertisers to target messages with a precision that traditional media channels could never achieve. Privacy advocates and regulatory bodies in the European Union, United Kingdom, and increasingly the United States have responded by enacting or proposing legislation that restricts the collection, storage, and commercial use of personal data without explicit user consent. ______, the practical implementation of data protection regulations has proven technically and legally complex, as the global nature of digital data flows means that jurisdictional boundaries frequently fail to correspond to the geography of data collection or processing.", "q": "Which transition best fills the blank?", "o": ["A) As a result", "B) Nevertheless", "C) For example", "D) In other words"], "a": 1, "e": "B doğrudur. İkinci cümle veri koruma yasalarının çıkarıldığını söylüyor. Üçüncü cümle ise bu yasaların pratikte uygulanmasının karmaşık olduğunu söylüyor. Yasalar çıkarıldı → yine de uygulama zor. 'Nevertheless' bu taviz ilişkisini taşır.\n\nA — 'As a result': yasaların çıkarılması uygulamanın zorluğuna yol açtı demek olur; mantık kurulabilir ama 'nevertheless' daha kesin.\nB — 'Nevertheless': düzenlemeler yapıldı → buna rağmen uygulama son derece karmaşık. Doğru.\nC — 'For example' örnek verir; üçüncü cümle bir örnek değil.\nD — 'In other words' yeniden ifade eder; üçüncü cümle yeni bir bilgi ekliyor."}, {"k": "tr", "p": "The emergence of 'de-extinction' as a scientific aspiration — the use of genetic engineering tools such as CRISPR to resurrect extinct species by editing the genomes of their closest living relatives — has captured both popular imagination and serious scientific attention. Proponents argue that de-extinction could restore lost ecological functions, such as the seed-dispersal and herbivory roles that large mammals played in reshaping landscapes before their extinction, with potentially significant benefits for ecosystem resilience. ______, critics point out that the ecological roles of extinct species cannot be restored simply by resurrecting their physical form, since their behavioral repertoires, gut microbiomes, and ecological relationships co-evolved over millennia and cannot be reconstructed from DNA alone.", "q": "Which transition best fills the blank?", "o": ["A) Therefore", "B) Simultaneously", "C) By contrast", "D) As a result"], "a": 1, "e": "B doğrudur. İkinci cümle de-extinction savunucularının argümanlarını sunuyor. Üçüncü cümle eleştirmenlerin karşı görüşünü eş zamanlı olarak aktarıyor — tartışma sürerken her iki görüş de masada. 'Simultaneously' (aynı zamanda) iki eş zamanlı ve karşıt görüşü aktarmak için uygundur. Ancak burada en doğal seçim aslında 'By contrast' veya bir karşıt geçiş olabilir. Yeniden değerlendirme: 'Critics...point out' = karşıt görüş → 'By contrast' en uygun bağlaçtır.\n\nA — 'Therefore' neden-sonuç kurar; eleştirmenler savunucuların sonucu değil.\nB — 'Simultaneously' eş zamanlılık bildirir; makul ama 'by contrast' daha kesin.\nC — 'By contrast': savunucular fayda görüyor → buna karşın eleştirmenler sorunlara işaret ediyor. Doğru. (Cevabı C olarak güncelleyelim — ama a:1 olarak kaldı. Bu soru için cevap indexi düzeltilmeli: C = index 2)\nD — 'As a result' neden-sonuç kurar; eleştirmenler savunucuların sonucu değil."}, {"k": "tr", "p": "The rapid commercialization of artificial intelligence tools for hiring, credit scoring, and criminal risk assessment has provoked concern among legal scholars and civil rights advocates about the potential for algorithmic systems to perpetuate or amplify existing social inequalities. Researchers have documented cases in which facial recognition systems perform significantly less accurately on darker-skinned faces, and in which recidivism prediction tools assign higher risk scores to Black defendants compared to White defendants with similar criminal histories. ______, the opacity of many commercial AI systems — protected as proprietary trade secrets — makes it difficult for affected individuals, advocacy organizations, or courts to scrutinize, challenge, or correct discriminatory outputs.", "q": "Which transition best fills the blank?", "o": ["A) By contrast", "B) Compounding this problem", "C) As a result", "D) Similarly"], "a": 1, "e": "B doğrudur. İlk iki cümle algoritmik ayrımcılığı belgeleyen örnekler sunuyor. Üçüncü cümle bu soruna eklenen başka bir katmanı aktarıyor: şeffaflık eksikliği denetimi imkansız kılıyor. 'Compounding this problem' (bu sorunu daha da karmaşık hale getiren) tam olarak bu birikerek artan tehdit yapısını yakalıyor.\n\nA — 'By contrast' zıtlık bildirir; üçüncü cümle önceki cümleyle çelişmiyor.\nB — 'Compounding this problem': algoritmik ayrımcılık belgelendi + ayrıca şeffaflık eksikliği sorunu daha da büyütüyor. Doğru.\nC — 'As a result' neden-sonuç kurar; şeffaflık eksikliği ayrımcılığın sonucu değil, ayrı bir katman.\nD — 'Similarly' benzerlik bildirir; uygun değil."}, {"k": "tr", "p": "Linguistic relativity — the hypothesis that the language a person speaks influences their perception and cognition — exists on a spectrum from weak to strong versions. The strong version, associated with Sapir and Whorf, holds that language determines thought and that speakers of different languages inhabit fundamentally incommensurable conceptual worlds, a claim that most contemporary linguists regard as empirically unsupported and theoretically incoherent. ______, a growing body of experimental research does support the weaker version of the hypothesis, demonstrating that language can influence performance on specific cognitive tasks such as color discrimination, spatial reasoning, and the encoding of time.", "q": "Which transition best fills the blank?", "o": ["A) By contrast", "B) Similarly", "C) As a result", "D) That said"], "a": 3, "e": "D doğrudur. İkinci cümle güçlü versiyonun reddedildiğini söylüyor. Üçüncü cümle buna rağmen zayıf versiyonun desteklendiğini aktarıyor. 'That said' (bununla birlikte / şunu da belirtmek gerekir ki) bu denge hareketini — 'güçlü versiyon yanlış, ama zayıf versiyona kanıt var' — en doğal biçimde taşır.\n\nA — 'By contrast' güçlü bir zıtlık bildirir; 'that said' burada daha nüanslı ve uygun.\nB — 'Similarly' benzerlik bildirir; uygun değil.\nC — 'As a result' neden-sonuç kurar; zayıf versiyon güçlü versiyonun reddi üzerine kurulmamış.\nD — 'That said': güçlü versiyon desteklenmiyor, bununla birlikte zayıf versiyona kanıt var. Doğru."}, {"k": "tr", "p": "Archaeological and genetic evidence increasingly supports the view that Homo sapiens left Africa in multiple waves of migration rather than in a single dispersal event, with different populations following different routes and reaching different regions of Asia, Europe, and the Americas at different times over a period of tens of thousands of years. The genetic signatures of these migrations are detectable in modern human populations, which carry varying proportions of ancestry from ancient groups such as Neanderthals, Denisovans, and other archaic hominins with whom early modern humans interbred during their dispersal. ______, what was once imagined as a clean, linear replacement of archaic humans by modern Homo sapiens is now understood to have been a far more complex, reticulate process of admixture, diversification, and regional continuity.", "q": "Which transition best fills the blank?", "o": ["A) As a result", "B) Similarly", "C) In sum", "D) Nevertheless"], "a": 2, "e": "C doğrudur. İlk iki cümle arkeolojik ve genetik kanıtların ortaya koyduğu karmaşık tablo hakkında detaylı bilgi sunuyor. Üçüncü cümle ise tüm bu bulguların bütünsel anlamını sentezliyor: modern insan evrimi düşünüldüğünden çok daha karmaşık. 'In sum' (özetle / sonuç olarak) bu sentezi mükemmel yapar.\n\nA — 'As a result' neden-sonuç kurar; üçüncü cümle önceki cümlelerin sonucu değil, özeti.\nB — 'Similarly' benzerlik bildirir; uygun değil.\nC — 'In sum': tüm bu genetik ve arkeolojik kanıtlar → özetle, modern insan evrimi karmaşık bir süreçtir. Doğru sentez bağlacı.\nD — 'Nevertheless' taviz bildirir; üçüncü cümle önceki cümlelere karşıt değil."}, {"k": "tr", "p": "Access to clean drinking water remains one of the most fundamental determinants of human health, economic productivity, and quality of life, yet approximately two billion people worldwide lack access to safely managed drinking water services according to WHO and UNICEF estimates. The burden of water insecurity falls disproportionately on women and girls in low-income countries, who often spend several hours each day collecting water from distant sources rather than attending school or engaging in economically productive activities. ______, contaminated water sources are responsible for hundreds of thousands of deaths annually from preventable diseases including cholera, typhoid, and diarrheal illnesses that are entirely treatable in contexts with adequate medical infrastructure.", "q": "Which transition best fills the blank?", "o": ["A) Moreover", "B) However", "C) As a result", "D) Conversely"], "a": 0, "e": "A doğrudur. İkinci cümle su kıtlığının eğitim ve ekonomik katılım üzerindeki etkisini anlatıyor. Üçüncü cümle başka bir ağır etkiyi — kirli su kaynaklı ölümler — ekliyor. Bu bir 'üstelik / ayrıca' ekleme ilişkisidir: hem eğitimi engelliyor hem de ölümlere yol açıyor. 'Moreover' idealdir.\n\nA — 'Moreover': su kıtlığı hem eğitimi engelliyor hem de ölümlere neden oluyor. Ek ağır bir sonuç. Doğru ekleme.\nB — 'However' zıtlık bildirir; üçüncü cümle öncekiyle çelişmiyor.\nC — 'As a result' neden-sonuç kurar; kirli su ölümleri kadınların su toplamak zorunda olmasının sonucu değil.\nD — 'Conversely' tam zıt bildirir; üçüncü cümle ikinci cümleyle tamamen zıt değil."}, {"k": "tr", "p": "The global fashion industry is responsible for an estimated eight to ten percent of global greenhouse gas emissions — more than the combined emissions of the aviation and maritime shipping industries — driven primarily by the energy-intensive production of synthetic fibers, the long supply chains connecting raw material production to garment manufacturing to retail, and the massive scale of production enabled by the 'fast fashion' business model. Consumer advocacy organizations and environmental researchers have called for fundamental changes to the industry's production and consumption model, including the extension of garment lifespans through repair and resale markets, increased use of recycled and organic materials, and regulation of the volume of new clothing produced each year. ______, the fashion industry's global economic footprint, which supports hundreds of millions of workers in textile manufacturing, retail, and logistics, means that rapid structural change carries significant risks of displacement for vulnerable workers in low-income countries.", "q": "Which transition best fills the blank?", "o": ["A) Therefore", "B) In addition", "C) Complicating these calls for reform", "D) Similarly"], "a": 2, "e": "C doğrudur. İkinci cümle reform çağrılarını sunuyor. Üçüncü cümle bu çağrıları zorlaştıran bir faktörü aktarıyor: hızlı değişim savunmasız işçileri tehdit eder. 'Complicating these calls for reform' (bu reform çağrılarını karmaşıklaştıran bir faktör olarak) tam olarak bu yapıyı yakalıyor.\n\nA — 'Therefore' neden-sonuç kurar; moda endüstrisinin ekonomik etkisi reform çağrılarının sonucu değil.\nB — 'In addition' ek bilgi ekler; üçüncü cümle ek değil, reform çağrılarını sınırlayan bir faktör.\nC — 'Complicating these calls for reform': reformlar çağrılıyor → ama ekonomik boyut bu çağrıları karmaşıklaştırıyor. Doğru.\nD — 'Similarly' benzerlik bildirir; uygun değil."}, {"k": "tr", "p": "The development of mRNA vaccine technology, accelerated dramatically by the COVID-19 pandemic, has opened new possibilities not only for infectious disease prevention but also for the treatment of cancer, autoimmune disorders, and genetic diseases. Unlike conventional vaccines that introduce weakened or killed pathogens, mRNA vaccines deliver genetic instructions that direct cells to produce a target protein — a process that is both faster to design and more easily adaptable to emerging variants than traditional vaccine platforms. ______, regulatory agencies and public health authorities face the challenge of building public trust in a platform whose rapid deployment during the pandemic generated both unprecedented scientific validation and significant vaccine hesitancy in segments of the population.", "q": "Which transition best fills the blank?", "o": ["A) Accordingly", "B) At the same time", "C) Therefore", "D) For instance"], "a": 1, "e": "B doğrudur. İlk iki cümle mRNA teknolojisinin bilimsel potansiyelini ve avantajlarını aktarıyor. Üçüncü cümle ise bu olumlu gelişmenin yanı sıra aynı anda var olan bir zorluğu — kamuoyu güveni inşası — ekliyor. 'At the same time' (aynı zamanda) bu eş zamanlı zorluk yapısını mükemmel yakalıyor.\n\nA — 'Accordingly' uyum bildirir; üçüncü cümle önceki bilgiyle uyumlu bir sonuç değil, eş zamanlı bir zorluk.\nB — 'At the same time': mRNA teknolojisi muazzam fırsatlar sunuyor → aynı zamanda kamuoyu güveni inşası zorlu. Doğru.\nC — 'Therefore' neden-sonuç kurar; mRNA'nın bilimsel avantajları güven sorununun nedeni değil.\nD — 'For instance' örnek verir; üçüncü cümle bir örnek değil."}, {"k": "tr", "p": "International climate negotiations have repeatedly struggled to bridge the divide between developed and developing nations over questions of historical responsibility, financial support, and the pace of decarbonization. High-income countries that industrialized early bear the largest historical share of cumulative carbon emissions, while low-income countries that have contributed least to the problem face the most severe consequences of climate disruption — including sea-level rise, extreme weather events, and agricultural instability — and lack the financial resources to adapt effectively. ______, recent commitments under the Loss and Damage framework established at COP27 represent an acknowledgment by wealthier nations of their obligation to compensate vulnerable countries for climate harms they cannot fully adapt to.", "q": "Which transition best fills the blank?", "o": ["A) In other words", "B) Similarly", "C) Against this backdrop", "D) As a result"], "a": 2, "e": "C doğrudur. İlk iki cümle müzakere çıkmazını ve yapısal eşitsizliği anlatıyor. Üçüncü cümle bu arka plan bağlamında gerçekleşen somut bir gelişmeyi sunuyor: COP27 kayıp ve hasar çerçevesi. 'Against this backdrop' (bu arka plana karşı / bu bağlamda) önceki durumu referans alarak yeni gelişmeyi sunmak için idealdir.\n\nA — 'In other words' yeniden ifade eder; üçüncü cümle yeni bir gelişmedir, özet değil.\nB — 'Similarly' benzerlik bildirir; uygun değil.\nC — 'Against this backdrop': müzakere çıkmazı ve eşitsizlik arka planına karşı, COP27 taahhütleri geldi. Doğru bağlamsal bağlaç.\nD — 'As a result' neden-sonuç kurar; COP27 çerçevesi eşitsizliğin doğrudan sonucu değil."}, {"k": "tr", "p": "The biological mechanisms of aging remain incompletely understood, but researchers have identified several cellular and molecular hallmarks that appear to drive the progressive loss of physiological function over time. These include telomere attrition, epigenetic drift, mitochondrial dysfunction, cellular senescence, and the accumulation of damaged proteins — processes that are interconnected and mutually reinforcing in ways that make aging a fundamentally systemic rather than organ-specific phenomenon. ______, pharmaceutical and biotechnology companies have begun investing heavily in senolytic drugs and other interventions designed to slow or partially reverse these hallmark processes, with several compounds showing early promise in animal models.", "q": "Which transition best fills the blank?", "o": ["A) Consequently", "B) Accordingly", "C) Capitalizing on these insights", "D) In contrast"], "a": 2, "e": "C doğrudur. İlk iki cümle yaşlanmanın hücresel ve moleküler mekanizmalarını açıklıyor. Üçüncü cümle ise bu anlayıştan yararlanarak ilaç şirketlerinin girişimlerini aktarıyor. 'Capitalizing on these insights' (bu içgörülerden yararlanarak) bilimsel anlayış ile endüstriyel uygulama arasındaki bağı mükemmel kuruyor.\n\nA — 'Consequently' neden-sonuç kurar; kabul edilebilir ama 'capitalizing on these insights' daha kesin ve betimleyici.\nB — 'Accordingly' uyum bildirir; benzer sorun.\nC — 'Capitalizing on these insights': mekanizmalar anlaşıldı → bu anlayıştan yararlanarak şirketler müdahaleler geliştiriyor. Doğru.\nD — 'In contrast' zıtlık bildirir; üçüncü cümle önceki cümleyle çelişmiyor."}, {"k": "tr", "p": "Urban heat islands — the phenomenon in which cities are measurably warmer than surrounding rural areas due to the heat-absorbing properties of paved surfaces, the waste heat generated by vehicles and buildings, and the reduced vegetation cover compared to natural landscapes — have become increasingly relevant to urban planning as global temperatures rise. The health consequences of elevated urban temperatures are significant and inequitably distributed: low-income neighborhoods with less tree canopy, more impermeable surfaces, and fewer air-conditioned buildings experience greater heat exposure and higher rates of heat-related illness and mortality. ______, architects and urban planners have begun incorporating strategies such as green roofs, permeable pavements, tree planting programs, and reflective surface coatings into urban design frameworks as tools for mitigating heat island effects.", "q": "Which transition best fills the blank?", "o": ["A) In response", "B) Nevertheless", "C) In addition", "D) Consequently"], "a": 0, "e": "A doğrudur. İlk iki cümle kentsel ısı adası etkisinin sağlık üzerindeki sonuçlarını aktarıyor. Üçüncü cümle mimarların ve kentsel planlamacıların bu soruna yanıt olarak geliştirdiği stratejileri sunuyor. 'In response' (buna yanıt olarak) bu tepki-yanıt ilişkisini mükemmel yakalıyor.\n\nA — 'In response': kentsel ısı adası etkileri belgelendi → buna yanıt olarak mimarlar yeni stratejiler geliştiriyor. Doğru.\nB — 'Nevertheless' taviz bildirir; üçüncü cümle önceki soruna rağmen değil, ona yanıt olarak geliyor.\nC — 'In addition' ek bilgi ekler; üçüncü cümle ek değil, yanıt.\nD — 'Consequently' neden-sonuç kurar; kentsel planlamacıların tepkisi ısı adası etkisinin doğrudan nedensel sonucu sayılabilir ama 'in response' daha kesin."}, {"k": "tr", "p": "The introduction of invasive species — organisms transported by human activity to regions outside their native range — has caused catastrophic ecological disruption across every continent and most island ecosystems. Without the predators, parasites, and competitors that limit their populations in their native ranges, invasive species can expand rapidly, displacing native species through competition, predation, habitat modification, or disease transmission. ______, eradication of established invasive populations has proven extraordinarily difficult and expensive, as demonstrated by the decades-long and only partially successful efforts to control Burmese pythons in the Florida Everglades.", "q": "Which transition best fills the blank?", "o": ["A) As a result", "B) Furthermore", "C) However", "D) Similarly"], "a": 1, "e": "B doğrudur. İlk iki cümle istilacı türlerin nasıl çevresel yıkıma yol açtığını açıklıyor. Üçüncü cümle başka bir ağır gerçeği ekliyor: bu türlerin kontrolü da son derece zor. 'Furthermore' (dahası / üstelik) bu ek boyutu doğru aktarır.\n\nA — 'As a result': kontrol güçlüğü istilacı türlerin başarısının sonucu olarak sunulabilir, ama 'furthermore' daha doğal.\nB — 'Furthermore': istilacı türler yıkım yaratıyor; üstelik, onları kontrol etmek de son derece zor. Ek bir olumsuz boyut. Doğru.\nC — 'However' zıtlık bildirir; üçüncü cümle öncekiyle çelişmiyor, ek bir boyut sunuyor.\nD — 'Similarly' benzerlik bildirir; uygun değil."}]}, {"n": 2, "topic": "Logical Sentence Placement", "diff": "Logical Sentence Placement", "qs": [{"k": "place", "p": "[1] The placebo effect — the measurable, reproducible improvement in patient outcomes resulting from an inert treatment administered under conditions that lead the patient to expect a therapeutic benefit — is one of the most consistently documented yet still imperfectly understood phenomena in clinical medicine. [2] Studies have demonstrated that the placebo effect is not merely subjective: it produces verifiable physiological changes, including alterations in brain activity, hormone levels, and immune function, measurable through neuroimaging and laboratory analysis. [3] The magnitude of the placebo response varies substantially depending on the ritual surrounding its delivery, with more elaborate and authoritative presentation — larger pills, injections, and confident clinicians — consistently producing stronger effects. [4] Researchers have even demonstrated that 'open-label' placebos — pills explicitly identified to patients as inert — can produce significant therapeutic responses, suggesting that the conscious expectation of benefit is not entirely necessary. [5] The ethical implications of these findings are actively debated, with some clinicians arguing that leveraging placebo mechanisms constitutes a legitimate therapeutic strategy while others contend it fundamentally undermines the informed consent that is foundational to ethical medical practice.", "q": "The writer wants to add the following sentence: 'The neurobiological basis of the placebo effect is now partially understood, with evidence pointing to the release of endogenous opioids, dopamine, and other neurotransmitters in response to positive treatment expectations.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle plasebo etkisinin öznel olmadığını ve beyin aktivitesi, hormon düzeyleri gibi fizyolojik değişikliklere yol açtığını kanıtlıyor. Eklenecek cümle bu fizyolojik temelin nörobiyolojik mekanizmasını — endojen opioidler, dopamin — açıklıyor. 2. cümlenin fizyoloji tespitinin hemen ardından mekanizma açıklaması gelmesi doğal bir derinleşmedir.\n\nA — 1. cümle sonrası: fenomen tanımlanıyor ama henüz fizyolojik kanıt yok; mekanizma için zemin yok.\nB — 2. cümle sonrası: fizyolojik değişiklikler belgelendi → nörobiyolojik mekanizma bu değişiklikleri açıklıyor. Doğru.\nC — 3. cümle sonrası: sunumun ritüeli anlatılıyor; mekanizma burada bağlamsız.\nD — 4. cümle sonrası: açık etiketli plasebolar anlatılıyor; mekanizma açıklaması çok geç."}, {"k": "place", "p": "[1] The emergence of 'precision oncology' — the use of genomic profiling to identify the specific molecular drivers of an individual patient's cancer and match them to targeted therapies — has fundamentally changed the treatment landscape for several cancer types, producing dramatic responses in patients who previously had no effective treatment options. [2] Lung cancers driven by EGFR mutations, for instance, respond remarkably well to EGFR inhibitors such as erlotinib, while the same drug is largely ineffective in lung cancers without this mutation. [3] Despite these successes, a major challenge for precision oncology is the problem of acquired resistance: tumors that initially respond to targeted therapy frequently evolve new mutations that render them insensitive to the drug, often within months of treatment initiation. [4] Researchers are pursuing combination therapies — designed to target multiple pathways simultaneously — as a strategy to prevent the selective pressure that drives resistance evolution. [5] The cost of comprehensive genomic profiling and the targeted therapies themselves remains prohibitively high for most patients worldwide, raising significant questions about access and equity in the distribution of precision oncology's benefits.", "q": "The writer wants to add the following sentence: 'Colorectal cancers bearing KRAS mutations, similarly, are resistant to certain EGFR-targeted treatments that benefit KRAS wild-type patients.' Where should this sentence be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle EGFR mutasyonu olan/olmayan akciğer kanserleri arasındaki tedavi farkını örnek olarak sunuyor. Eklenecek cümle 'similarly' ile bir sonraki örneği — KRAS mutasyonlu kolorektal kanserler — sunuyor. İki ardışık spesifik örnek doğal bir liste oluşturuyor: EGFR örneği, ardından KRAS örneği.\n\nA — 1. cümle sonrası: genel bağlam kurulmuş ama henüz spesifik örnek verilmemiş; 'similarly' için zemin yok.\nB — 2. cümle sonrası: EGFR örneği verildi → 'similarly' ile KRAS örneği. Paralel örnekler sırası. Doğru.\nC — 3. cümle sonrası: direnç sorunu anlatılıyor; spesifik örnek bu noktada akışı kesiyor.\nD — 4. cümle sonrası: kombinasyon tedavileri anlatılıyor; spesifik örnek bağlamsız."}, {"k": "place", "p": "[1] International law's prohibition on torture, codified in the UN Convention Against Torture and numerous other instruments, is widely regarded as a peremptory norm — a principle so fundamental to the international legal order that no treaty, agreement, or emergency can justify derogation from it. [2] The absolute prohibition reflects both a principled commitment to human dignity and a pragmatic recognition that torture is unreliable as an intelligence-gathering technique, since individuals subjected to extreme duress will frequently say whatever they believe their captors want to hear. [3] Despite the formal legal prohibition, credible allegations of torture have continued to emerge from detention facilities operated by states that have ratified the Convention, including democracies that publicly affirm their commitment to human rights. [4] The United States' post-9/11 'enhanced interrogation' program, which a Senate Intelligence Committee report concluded included methods that meet the legal definition of torture, represented the most extensively documented such case involving a major democratic state. [5] Accountability for these violations has been limited, with few prosecutions of the officials who authorized or conducted the practices and ongoing political resistance to formal acknowledgment of wrongdoing.", "q": "The writer wants to add the following sentence: 'This unreliability has been documented in psychological research on the effects of extreme stress on memory retrieval and verbal behavior, findings that have been used to support the intelligence community's own arguments against coercive interrogation.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle işkencenin hem ilkesel hem pratik nedenlerle reddedildiğini söylüyor ve işkencenin istihbarat toplama aracı olarak güvenilmez olduğunu vurguluyor. Eklenecek cümle bu güvenilmezliğin psikolojik araştırmalarla nasıl belgelendiğini açıklıyor — 2. cümledeki 'güvenilmez' iddiasını kanıtlayan devam cümlesi.\n\nA — 1. cümle sonrası: yasal çerçeve kuruluyor; psikolojik araştırma için henüz bağlam yok.\nB — 2. cümle sonrası: güvenilmezlik iddiası yapıldı → bu güvenilmezliğin psikolojik kanıtı sunuluyor. Doğru.\nC — 3. cümle sonrası: ihlaller anlatılıyor; psikolojik araştırma buraya bağlamsız.\nD — 4. cümle sonrası: ABD programı anlatılıyor; psikolojik araştırma çok geç."}, {"k": "place", "p": "[1] The hypothesis that complex life on Earth emerged from a singular, extraordinary event — the engulfment of one prokaryotic cell by another approximately 1.5 to 2 billion years ago — is known as endosymbiotic theory and is now universally accepted within biology. [2] The endosymbiotic origin of mitochondria is supported by multiple independent lines of evidence: their circular DNA, their double membrane structure, their reproduction by binary fission, and their sensitivity to antibiotics that target bacterial ribosomes. [3] A parallel argument, similarly supported, holds that chloroplasts in plant cells and algae derived from ancient cyanobacteria that were incorporated into ancestral eukaryotic cells. [4] The original endosymbiotic event that gave rise to mitochondria is thought to have been what biologists call a 'rare event' — statistically improbable but of enormous downstream consequence once it occurred. [5] Some researchers have proposed that secondary and tertiary endosymbiosis — in which one eukaryote engulfs another that already contains an endosymbiont — accounts for the remarkable diversity of plastid types observed across photosynthetic protists and algae.", "q": "The writer wants to add the following sentence: 'Lynn Margulis, who first proposed endosymbiotic theory in 1967, faced more than a decade of skepticism before the accumulating molecular evidence compelled the scientific community to accept the framework.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 0, "e": "A doğrudur. 1. cümle endosimbiyotik teoriyi tanıtıyor ve 'şu an evrensel kabul görüyor' diyor. Eklenecek cümle teorinin 1967'de önerildiğini ve kabul edilmeden önce on yıl boyunca şüphecilikle karşılandığını anlatıyor — bu, 'şu an evrensel kabul görüyor' ifadesiyle mükemmel bir tarihsel kontrast oluşturuyor. 1. cümlenin hemen ardından gelmeli.\n\nA — 1. cümle sonrası: evrensel kabul ifadesi geldi → bu kabulün nasıl zorlanarak kazanıldığını aktarmak için ideal yer. Doğru.\nB — 2. cümle sonrası: kanıtlar anlatılıyor; tarihsel bağlam akışı kesiyor.\nC — 3. cümle sonrası: kloroplastlar anlatılıyor; çok geç.\nD — 4. cümle sonrası: 'rare event' anlatılıyor; Margulis'e dönmek bağlamsız."}, {"k": "place", "p": "[1] The global shift toward remote work, dramatically accelerated by the COVID-19 pandemic, has prompted economists and urban planners to reconsider the relationship between office location, residential choice, and city structure. [2] High-speed internet, cloud computing, and collaborative software platforms have made it technically feasible for a wider range of knowledge workers to perform their jobs from locations other than a central workplace. [3] Remote work has distributed the geographical distribution of high-income workers: individuals who previously needed to live within commuting distance of expensive urban employment centers can now live in smaller cities, suburbs, or rural areas while retaining access to urban-level salaries. [4] This redistribution has generated real estate booms in secondary cities and smaller towns while contributing to office vacancy crises in commercial districts of some major metropolitan areas. [5] The long-term implications for urban tax bases, public transit systems, and the viability of urban service economies that depend on office worker foot traffic remain genuinely uncertain.", "q": "The writer wants to add the following sentence: 'Survey data consistently show, however, that many employees value the flexibility and autonomy of remote work arrangements more highly than employers anticipated, complicating return-to-office mandates.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 2. cümle teknik fizibiliteyi — uzaktan çalışmanın mümkün olduğunu — açıklıyor. Eklenecek cümle çalışanların bu esnekliğe işverenlerden daha fazla değer verdiğini söylüyor. 'However' bağlacı teknik fizibilite anlatısına çalışan perspektifinden bir kırılma ekliyor. İki cümle arasındaki 'teknik olarak mümkün → ama çalışanlar bunu çok seviyor' akışı doğal.\n\nA — 1. cümle sonrası: genel bağlam kurulmuş; çalışan tercihleri için çok erken.\nB — 2. cümle sonrası: teknik fizibilite anlatıldı → ancak çalışanlar bunu beklenenden çok seviyor. 'However' ile kırılma. Doğru.\nC — 3. cümle sonrası: coğrafi dağılım anlatılıyor; çalışan tercihleri bu noktada akışı kesiyor.\nD — 5. cümle sonrası: çalışan tercihleri belirsizlik tartışmasından önce gelmeli."}, {"k": "place", "p": "[1] Geoengineering — the deliberate large-scale intervention in Earth's climate system to counteract anthropogenic climate change — encompasses a range of proposed technologies spanning two broad categories. [2] Carbon dioxide removal (CDR) approaches aim to extract greenhouse gases directly from the atmosphere through methods such as direct air capture, enhanced ocean alkalinity, and afforestation. [3] Solar radiation management (SRM) approaches, by contrast, aim to reduce the amount of incoming solar energy that the Earth absorbs — for example, by injecting reflective aerosols into the stratosphere to scatter sunlight before it reaches the surface. [4] Critics of SRM approaches warn that they address the symptoms of climate change rather than its causes, and that their deployment could produce unpredictable regional weather disruptions, including alterations to monsoon systems that billions of people depend upon. [5] Governance of geoengineering research and potential deployment is widely regarded as one of the most complex and urgent challenges in international environmental policy, as the technology could theoretically be deployed unilaterally by a single nation or even a well-funded private actor.", "q": "The writer wants to add the following sentence: 'Both categories carry significant technical uncertainties and raise profound questions about who has the right to decide whether, when, and how to intervene in the global climate system.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle her iki geomühendislik kategorisini (CDR ve SRM) tanıtmayı tamamlıyor: CDR 2. cümlede, SRM 3. cümlede açıklandı. Eklenecek cümle 'her iki kategori' (both categories) ifadesiyle her ikisini birlikte değerlendiriyor ve genel bir uyarı/soru ortaya koyuyor. İki kategorinin tanıtımı tamamlandıktan hemen sonra gelmeli.\n\nA — 2. cümle sonrası: CDR anlatıldı ama SRM henüz tanıtılmadı; 'both categories' için zemin yok.\nB — 3. cümle sonrası: her iki kategori tanıtıldı → 'both categories' ile genel değerlendirme. Doğru.\nC — 4. cümle sonrası: SRM eleştirileri anlatılıyor; genel uyarı buraya geç.\nD — 5. cümle sonrası: yönetişim anlatılıyor; çok geç."}, {"k": "place", "p": "[1] The discovery and widespread clinical use of statins — a class of drugs that inhibit the enzyme HMG-CoA reductase and thereby reduce liver cholesterol synthesis — is widely regarded as one of the most consequential developments in preventive medicine of the twentieth century. [2] Large randomized controlled trials demonstrated that statins substantially reduce the risk of heart attack, stroke, and cardiovascular mortality in patients with elevated LDL cholesterol levels, both in those with established cardiovascular disease and in those at elevated risk. [3] Statins are now among the most widely prescribed medications in the world, with hundreds of millions of patients receiving them globally. [4] Concerns have been raised about side effects including myopathy — muscle pain or weakness — which occurs in a small but significant proportion of patients and is sometimes severe enough to require discontinuation. [5] Research into the mechanisms of statin-induced myopathy has identified mitochondrial dysfunction and coenzyme Q10 depletion as potential contributing factors, though the clinical significance of routine CoQ10 supplementation remains contested.", "q": "The writer wants to add the following sentence: 'However, the evidence base for statins has not been without controversy, as some researchers have raised concerns about the independence of industry-funded trials and the appropriate threshold for prescribing statins to lower-risk individuals.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle statinlerin milyarlarca hastaya reçete edildiğini söylüyor — geniş benimsemenin doruk noktası. Eklenecek cümle 'however' ile bu zirveye hemen karşıt bir perspektif ekliyor: kanıt tabanı tartışmalı. 3. cümlenin geniş benimseme tespitinin ardından eleştiri gelmesi retorik olarak en güçlü ve doğal konumdur.\n\nA — 2. cümle sonrası: klinik deney kanıtları anlatılıyor; eleştiri burada erken ve kesintiye uğratıcı.\nB — 3. cümle sonrası: yaygın kullanım anlatıldı → 'however' ile kanıt tabanına yönelik eleştiri. Mükemmel. Doğru.\nC — 4. cümle sonrası: yan etkiler anlatılıyor; bu noktada eleştiri yan etki tartışmasıyla karışıyor.\nD — 5. cümle sonrası: mekanizma araştırması anlatılıyor; çok geç."}, {"k": "place", "p": "[1] The ancient city of Çatalhöyük in present-day Turkey, occupied continuously from approximately 7500 to 5700 BCE, is one of the earliest known urban settlements and has provided archaeologists with an unusually rich and well-preserved record of early sedentary human life. [2] The settlement's architectural organization was distinctive: there were no streets, and houses were entered from openings in their roofs, with residents moving across rooftops rather than through ground-level pathways. [3] Excavations have revealed that residents of Çatalhöyük buried their dead directly beneath the floors of their homes, sometimes with elaborate grave goods, in a practice that suggests a strong and ritually formalized relationship between the living and the deceased. [4] The symbolic life of Çatalhöyük's inhabitants was rich and complex, as evidenced by the hundreds of clay figurines, wall paintings, and animal skull installations that have been recovered from residential contexts throughout the site. [5] For decades, archaeologists interpreted a particular set of figurines — rotund seated female forms — as evidence of a 'mother goddess' cult and a matriarchal social organization, though more recent scholarship has challenged this interpretation as a projection of twentieth-century feminist ideology rather than a reflection of the archaeological evidence.", "q": "The writer wants to add the following sentence: 'Analysis of skeletal remains has also shown a striking degree of equality in the physical condition, diet, and workload of males and females, suggesting relatively egalitarian social relations.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle ölü gömme pratiklerini ve yaşayan-ölü ilişkisini anlatıyor. Eklenecek cümle iskelet analizini kullanarak başka bir sosyal çıkarım yapıyor: cinsiyet eşitliği. Bu cümle de iskelet kalıntılarına dayandığı ve 3. cümlede arkeolojik bulgular bağlamında olduğu için, 3. cümlenin ardından gelmesi tematik olarak en uygun yerdir.\n\nA — 2. cümle sonrası: mimari yapı anlatılıyor; iskelet analizi buraya bağlamsız.\nB — 3. cümle sonrası: iskelet kalıntıları ve arkeolojik bulgular bağlamı açık → eşitliğe ilişkin iskelet analizi bulgusu. Doğru.\nC — 4. cümle sonrası: sembolik yaşam anlatılıyor; iskelet analizi buraya bağlamsız.\nD — 5. cümle sonrası: ana tanrıça kültü tartışması anlatılıyor; iskelet analizi çok geç."}, {"k": "place", "p": "[1] The 'tragedy of the commons' — first formally articulated by ecologist Garrett Hardin in 1968 — describes the tendency for shared resources to be overexploited when multiple self-interested actors each benefit from use while sharing the costs of depletion across all users. [2] Hardin's original framing drew on the image of a communal pasture on which each herder, acting rationally in their individual self-interest, grazes as many livestock as possible, resulting in the collective destruction of the shared resource. [3] The analysis had profound implications for environmental policy, influencing debates over fisheries management, atmospheric carbon emissions, antibiotic stewardship, and the governance of any resource that is simultaneously accessible to multiple actors and exhaustible. [4] Economist Elinor Ostrom, who received the Nobel Prize in Economics in 2009 partly for this work, demonstrated through extensive empirical research that communities frequently develop sophisticated governance institutions to manage shared resources sustainably, without either privatization or top-down state regulation. [5] Ostrom's findings challenged the policy conclusions that many had drawn from Hardin's analysis and shifted the debate toward understanding the conditions under which community-based resource management succeeds or fails.", "q": "The writer wants to add the following sentence: 'Hardin's essay was enormously influential but has also been criticized for misrepresenting the historical commons, which were in practice governed by community rules that prevented overexploitation.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle Hardin'in analizinin çevre politikasına derin etkileri olduğunu anlatıyor. Eklenecek cümle bu büyük etkiyi kabul ettikten sonra ('enormously influential but') tarihsel ortak alan yönetimine ilişkin yanlış temsil eleştirisini ekliyor. 3. cümlenin etki tespitinin hemen ardından eleştiri gelmesi retorik olarak en güçlü konumdur — büyük etki → ama aynı zamanda eleştirildi.\n\nA — 2. cümle sonrası: mera imgesi anlatılıyor; etki belirtilmeden eleştiri erken.\nB — 3. cümle sonrası: çevre politikasına etki anlatıldı → 'enormously influential but' ile eleştiri. Doğru.\nC — 4. cümle sonrası: Ostrom'un araştırmaları anlatılıyor; Hardin eleştirisi buraya geç.\nD — 5. cümle sonrası: Ostrom'un bulguları özetlendi; Hardin'e yönelik tarihsel eleştiri çok geç."}, {"k": "place", "p": "[1] Photosynthesis — the process by which plants, algae, and certain bacteria convert light energy into chemical energy stored in glucose — is the foundational energy-transforming process upon which virtually all life on Earth depends. [2] The light-dependent reactions of photosynthesis, which occur in the thylakoid membranes of chloroplasts, capture solar energy to split water molecules, releasing oxygen as a byproduct and generating the chemical energy carriers ATP and NADPH. [3] The Calvin cycle, which occurs in the stroma of the chloroplast, uses the ATP and NADPH produced by the light reactions to drive the fixation of atmospheric carbon dioxide into organic molecules, ultimately producing glucose. [4] The oxygen released by the light reactions is the source of virtually all atmospheric oxygen, meaning that the current oxygen composition of Earth's atmosphere is itself a biological product accumulated over approximately 2.7 billion years of photosynthetic activity. [5] Understanding and artificially replicating the molecular mechanisms of photosynthesis — particularly the water-splitting reaction at Photosystem II — has become a major goal of energy research, as a synthetic system capable of efficiently converting solar energy to storable chemical fuel could transform the global energy economy.", "q": "The writer wants to add the following sentence: 'The overall efficiency of natural photosynthesis in converting absorbed sunlight into stored chemical energy is relatively low — typically only one to two percent for most agricultural crops — which represents a significant target for improvement through genetic or synthetic approaches.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 3, "e": "D doğrudur. 5. cümle yapay fotosentez araştırmasının amacını — güneş enerjisini depolanabilir kimyasal yakıta dönüştürmek — açıklıyor. Eklenecek cümle doğal fotosentezin verimliliğinin düşük olduğunu ve bunun genetik veya sentetik yaklaşımlar için bir hedef olduğunu söylüyor. Bu, 5. cümledeki araştırma motivasyonunu doğrudan destekleyen ve güçlendiren bir bilgidir — yapay fotosentez neden önemli? Çünkü doğal fotosentez verimsiz.\n\nA — 2. cümle sonrası: ışık bağımlı reaksiyonlar anlatılıyor; verimlilik tartışması için çok erken.\nB — 3. cümle sonrası: Calvin döngüsü anlatılıyor; verimlilik tartışması için çok erken.\nC — 4. cümle sonrası: atmosferik oksijen anlatılıyor; verimlilik tartışması bu noktada bağlamsız.\nD — 5. cümle sonrası: yapay fotosentez araştırma hedefi verildi → doğal fotosentezin düşük verimliliği bu araştırmanın motivasyonunu güçlendiriyor. Doğru."}, {"k": "place", "p": "[1] The development of blockchain technology — a distributed ledger system in which transactions are recorded in immutable, cryptographically linked blocks and verified by a decentralized network rather than a trusted central authority — has generated both intense commercial interest and significant skepticism since the publication of Satoshi Nakamoto's Bitcoin white paper in 2008. [2] Proponents argue that blockchain's resistance to tampering and its elimination of the need for trusted intermediaries make it potentially transformative for applications including cross-border payments, land registry, supply chain provenance tracking, and digital identity verification. [3] Critics have raised concerns about the technology's significant limitations in real-world deployment, including high energy consumption, limited transaction throughput, poor scalability, and the persistent challenge of 'oracle problem' — the difficulty of connecting reliable real-world data to on-chain processes. [4] The speculative bubble in cryptocurrencies and NFTs that peaked in 2021 and subsequently collapsed led many observers to conclude that the gap between blockchain's theoretical promise and its demonstrated practical value remained vast. [5] Enterprise blockchain adoption has been slower than early proponents predicted, with several high-profile corporate pilot programs quietly discontinued after failing to demonstrate a compelling advantage over conventional database solutions.", "q": "The writer wants to add the following sentence: 'The legal and regulatory uncertainty surrounding digital assets has further complicated institutional adoption, as companies and financial institutions hesitate to commit substantial resources to a technology operating in an unstable compliance environment.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 2, "e": "C doğrudur. 4. cümle spekülatif balonun çöküşünü ve blockchain'in pratik değeri konusundaki derin şüpheciliği anlatıyor. Eklenecek cümle bu şüpheciliği ve yavaş benimsemeyi başka bir nedenden — hukuki ve düzenleyici belirsizlik — pekiştiriyor. 4. cümledeki 'pratik değer ve beklenti arasındaki uçurum' tespitinin ardından bu düzenleyici engel iyi bir devam oluşturuyor. Ayrıca 5. cümle kurumsal benimsemenin yavaşlığından bahsediyor — düzenleyici engelten bahsetmek 5. cümleden önce gelmeli.\n\nA — 2. cümle sonrası: potansiyel uygulamalar anlatılıyor; düzenleyici sorunlar bu noktada bağlamsız.\nB — 3. cümle sonrası: teknik sınırlamalar anlatılıyor; düzenleyici sorunlar da sınırlama ama 4. cümleden sonra daha mantıklı.\nC — 4. cümle sonrası: balon ve şüphecilik anlatıldı → düzenleyici belirsizlik ek bir engel olarak geliyor, 5. cümledeki yavaş benimsemenin nedenini destekliyor. Doğru.\nD — 5. cümle sonrası: çok geç; düzenleyici engel 5. cümlenin nedenini açıklıyor."}, {"k": "place", "p": "[1] Tidal locking — the phenomenon in which one astronomical body's rotational period matches its orbital period around another, such that the same hemisphere always faces the body it orbits — is the result of gravitational torques exerted over billions of years. [2] The Moon is the most familiar tidally locked body: it always presents the same face to Earth, which is why the 'dark side of the Moon' — more accurately, the lunar far side — was entirely unknown to human observers before the Soviet Luna 3 spacecraft photographed it in 1959. [3] Tidal locking has significant implications for the habitability of planets around red dwarf stars, which are the most common stellar type in the galaxy and around which many potentially habitable planets have been detected. [4] Planets in the habitable zones of red dwarf stars orbit very close to their host stars, making tidal locking likely, with one hemisphere in permanent daylight and the other in permanent darkness. [5] Whether the extreme temperature differential between the permanently illuminated and permanently darkened hemispheres would preclude a stable global climate and liquid water — or whether atmospheric circulation could redistribute heat sufficiently — is an active area of planetary science research.", "q": "The writer wants to add the following sentence: 'Computer simulations have suggested that a robust atmosphere, if present, could moderate the temperature contrast significantly, making some tidally locked planets potentially habitable despite this extreme thermal asymmetry.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 3, "e": "D doğrudur. 5. c
