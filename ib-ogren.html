e is slow, but it is real.\n\nInterviewer: What would you say to a student reading this?\nMr. Demir: Do not wait to be important before you do something useful. Start today, where you are, with what you have.\n\nAs he picked up his gloves and walked off, we understood exactly what he meant."}}, {"t": "note", "k": "ipucu", "title": "Biçim", "lines": ["Konuşan kişilerin isimlerini her replikte belirt (Interviewer: / Mr. Demir:). Bu Criterion C'yi güçlendirir.", "Cevapları konuşma dilinde tut; röportaj bir denemenin resmi diline kaçmamalı."]}]}, {"id": "t-news", "group": "Kitle İletişim", "name": "Haber (News Report)", "eyebrow": "Metin Türü", "blocks": [{"x":"Haber Nedir ve Ne Zaman Karşına Çıkar?","t":"h"},{"x":"Haber (news report), gerçekleşmiş bir olayı nesnel, doğru ve tarafsız biçimde aktaran bir metin türüdür. Bir gazete, haber sitesi veya okul bülteni için yazılır ve okurun 'ne oldu?' sorusuna hızla yanıt vermesini amaçlar. Paper 1'de kitle iletişim türleri arasında sık çıkar çünkü birçok prescribed theme'e kolayca bağlanır: 'Sharing the planet' altında bir çevre olayı, 'Social organization' altında bir okul veya toplum etkinliği, 'Human ingenuity' altında bir bilim ya da teknoloji gelişmesi habere dönüşür. Haberin özü, kişisel görüşü tamamen dışarıda bırakıp olayın kendisini konuşturmaktır.","t":"p"},{"t":"h","x":"Kitle, Amaç ve Register"},{"x":"Haberin kitlesi bir yayının genel okurudur: olayı henüz bilmeyen, kısa sürede bilgilenmek isteyen kişiler. Amaç tektir ve nettir: bilgilendirmek. İkna etmek, eğlendirmek veya kişisel duygu paylaşmak haberin işi değildir. Register resmidir ve nesneldir: üçüncü şahıs kullanılır ('the students', 'organisers'), olaylar geçmiş zamanda anlatılır ve yazar kendini metne katmaz. 'Bence', 'ne yazık ki', 'harika bir şekilde' gibi değer yüklü ifadeler haberde yer almaz; bunlar ancak birinin ağzından, doğrudan alıntı içinde geçebilir. Bu mesafeli ton, haberi güvenilir kılan şeydir.","t":"p"},{"x":"Yapı: Ters Piramit ve İmza Öğeleri","t":"h"},{"x":"Haberin iskeleti 'ters piramit' (inverted pyramid) mantığıyla kurulur: en önemli bilgi en üstte, ayrıntılar giderek aşağıda. Metin bir başlıkla (headline) açılır; hemen ardından gelen ilk cümle, yani spot (lead), okura 5N1K'yı verir: kim, ne, ne zaman, nerede ve mümkünse neden ve nasıl. Gövde bu çekirdeği açar: arka plan, sayısal ayrıntılar ve tanık ya da yetkili alıntıları önem sırasına göre dizilir. Kapanış ise çoğu zaman bir sonraki adımı ya da beklentiyi anar. Bu yapı, okur ilk cümlede bile ayrılsa olayın özünü almış olsun diye tasarlanmıştır.","t":"p"},{"t":"p","x":"Başlık ve spot haberin kaderini belirler. İyi bir başlık kısadır, güçlü bir fiil taşır ve olayı özetler: 'Students Raise Record Sum for Local Shelter'. İngilizce haber başlıklarında çoğu zaman geniş zaman kalıbı ('raise', 'win') kullanılır, bu bir tür sözleşmedir. Spot cümlesi ise bilgiyi sıkıştırır: 'Students at Green Valley High School raised over 5,000 lira for an animal shelter last Saturday, organisers confirmed on Monday.' Tek cümlede kim (öğrenciler), ne (bağış topladı), ne kadar (5.000 lira), nerede ve ne zaman (geçen cumartesi) ve kaynak (organizatörler) verilmiştir. Bu yoğunluk, haber yazımının en kritik becerisidir."},{"x":"Dil ve Tarafsızlık Araçları","t":"h"},{"t":"p","x":"Haberin dili sade ve doğrulanabilirdir. Aktarım fiilleri (reporting verbs) omurgayı kurar: 'said', 'added', 'confirmed', 'announced', 'reported'. Her önemli iddia bir kaynağa bağlanır (attribution): olay kendiliğinden değil, birinin ifadesiyle aktarılır ('organisers confirmed', 'the director said'). Sayılar, tarihler, yer adları ve özel isimler habere somutluk ve güvenilirlik katar. Süslü, duygusal sıfatlardan kaçınılır çünkü onlar tarafsızlığı bozar: 'the incredible students' yerine 'the students, who raised more than 5,000 lira' denir; rakam zaten etkileyicidir, yorumu okura bırakırsın. Criterion A için bu türde çeşitlilik, aktarım fiillerini ve cümle kalıplarını değiştirmekten gelir."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"Bu dersteki barınak modeli ('Students Raise Record Sum for Local Shelter') güçlüdür çünkü ters piramidi kusursuz izler. Başlık olayı tek bakışta verir. Spot cümlesi 5N1K'yı bir kaynakla ('organisers confirmed') sunar ve rekor vurgusuyla haber değerini yükseltir. Gövde önce nasıl toplandığını (hayır çarşısı, satışlar, konser), sonra kaç kişinin katıldığını açıklar; ardından kampanyayı yöneten öğrencinin doğrudan alıntısı gelir ('People were incredibly generous'). Görüş yalnızca bu tırnak içinde vardır, yazarın kendi cümlelerinde değil. Kapanış paranın nasıl kullanılacağını ve etkinliğin gelecekte tekrarlanma ihtimalini anar. İşte üç kriteri birden karşılayan bir haber: nesnel ve resmi (C), olay ayrıntı ve alıntılarla geliştirilmiş (B), dil doğru ve çeşitli (A).","t":"p"},{"x":"Haberi Benzer Türlerden Ayırmak","t":"h"},{"t":"p","x":"Öğrenciler haberi en çok görüş yazısıyla (opinion column) ve raporla (report) karıştırır. Üçü de bir konuyu ciddi bir dille ele alır ama amaçları ayrıdır. Haber, olmuş bir olayı tarafsızca aktarır ve yorum içermez. Görüş yazısı ise açıkça taraf tutar, yazarın sesini öne çıkarır ve okuru ikna etmeye çalışır. Rapor bir durumu inceler, verileri analiz eder ve çoğu zaman öneriyle biter; başlıklı bölümlere ayrılır. Aynı olay (örneğin okulda geri dönüşüm kampanyası) üç türde de yazılabilir, ama haberde 'ne oldu' anlatılır, görüşte 'ben ne düşünüyorum' savunulur, raporda 'durum nedir ve ne yapılmalı' çözümlenir."},{"rows":[["Haber (News report)","Olayı tarafsızca aktar","Ters piramit, 5N1K, alıntı, yorumsuz"],["Görüş yazısı (Opinion)","İkna et, taraf tut","Net tez, birinci şahıs, değer yüklü dil"],["Rapor (Report)","Durumu incele, öneri sun","Başlıklı bölümler, analiz, tavsiye"]],"t":"table","head":["Tür","Amaç","Ayırt edici işaret"]},{"t":"h","x":"Tarafsızlığı Korumak: Görüş Sızıntısından Kaçınmak"},{"x":"Haberde en sık kaybedilen puan, farkında olmadan araya sızan görüşten gelir; bu Criterion C'yi (register/tür) zayıflatır. Görüş çoğu zaman sıfatlarla sızar: 'the brave students', 'this wonderful event', 'sadly, few people came'. Bu kelimeler okuru yönlendirir ve tarafsızlığı bozar. Çözüm iki yönlüdür: birincisi, değer yargısını rakam ve olguya çevir ('few people came' yerine 'about thirty people attended'); ikincisi, herhangi bir değerlendirme gerekliyse onu bir kaynağa yükle ('the head teacher called the turnout disappointing'). Böylece görüş metinde vardır ama yazarın değil, kaynağın görüşü olarak durur. Bu ayrım haber yazımının kalbidir.","t":"p"},{"x":"Alıntılar haberi canlandırır ve güvenilir kılar, ama doğru kullanılmalıdır. Doğrudan alıntı kişinin tam sözlerini tırnak içinde verir ve olaya insani bir ses katar; dolaylı alıntı ise sözü özetler ('The director said the money would buy winter supplies'). İyi bir haberde ikisi dengelenir ve aktarım fiilleri çeşitlendirilir: 'said', 'explained', 'warned', 'added'. Her alıntının sahibi net olmalıdır; kimin konuştuğu belirsiz kalırsa haber güvenilirliğini yitirir. En az bir doğrudan alıntı, olayı yaşayan birinin sesini metne taşıdığı için neredeyse zorunludur.","t":"p"},{"x":"Haber Becerisinin Paper 2 ve Individual Oral'a Katkısı","t":"h"},{"x":"Haber yazmayı öğrenmek yalnızca Paper 1'e yaramaz. Paper 2 okuma bölümünde önüne sık sık haber metinleri çıkar; ters piramidi ve aktarım dilini tanıyan öğrenci metnin ana bilgisini ilk cümleden yakalar ve ayrıntı sorularını daha hızlı yanıtlar, çünkü bilginin nereye yerleştirildiğini bilir. Individual Oral'da ise bir görseli betimlerken kazandığın nesnellik işe yarar: önce ne gördüğünü olgusal biçimde aktarır (kim, nerede, ne yapıyor), sonra yorumunu ekler ve bir prescribed theme ile ilişkilendirirsin. Olguyu yorumdan ayırma disiplini, sınavın üç bileşenine birden değer katar.","t":"p"},{"k":"ipucu","lines":["Başlığı kısa, fiil odaklı ve olayı özetleyen bir kalıpta yaz.","İlk cümlede 5N1K'yı sıkıştır: kim, ne, ne zaman, nerede.","Değer yüklü sıfatları rakam ve olguya çevir; nesnel kal.","Her önemli iddiayı bir kaynağa bağla (said/confirmed/reported).","En az bir doğrudan alıntı ekle; olaya insani bir ses ver.","Görüşünü yalnızca alıntı içinde bırak; kendi cümlende yorum yapma."],"title":"Haberde puan kazandıran küçük hamleler","t":"note"},{"t":"p","x":"Sık yapılan hatalar haberi zayıflatır. En büyüğü tarafsızlığı yitirmektir: yazarın 'bence' der gibi yorum katması haberi görüş yazısına çevirir ve Criterion C düşer. İkincisi ters piramidi bozmaktır: olayı kronolojik anlatıp en önemli bilgiyi sona saklamak, okurun özü hemen almasını engeller. Üçüncüsü alıntısız yazmaktır; kaynak ve tanık sesi olmayan haber kuru ve inandırıcılıktan uzak kalır. Dördüncüsü zaman kaymasıdır: gövdeyi geniş zamanda yazmak yerine gerçekleşmiş olay geçmiş zamanda anlatılmalıdır (başlık kalıbı bunun istisnasıdır)."},{"x":"Haber Değeri ve Kaynak Güvenilirliği","t":"h"},{"x":"Bir olayı habere dönüştürmeden önce onun neden haber değeri taşıdığını düşünmek işini kolaylaştırır. Gazetecilikte bir olayı haber yapan şeyler bellidir: yenilik (ilk kez olan bir şey), yakınlık (okuru doğrudan ilgilendiren bir olay), büyüklük (çok kişiyi etkileyen bir gelişme), çatışma ya da beklenmediklik. Sınavda sana verilen konuyu bu mercekten bakarak seçtiğinde, spot cümlen kendiliğinden güçlenir: 'rekor bağış', 'ilk kez düzenlenen tören', 'beklenmedik zafer' gibi bir haber değeri, başlığı ve ilk cümleyi çarpıcı kılar. Olayın hangi yönünün en dikkat çekici olduğunu bulmak, ters piramidin tepesine ne koyacağını da belirler.","t":"p"},{"x":"Kaynak, haberin güvenilirliğini taşır. Her önemli bilgi bir yere dayanmalı, hiçbir iddia havada kalmamalıdır. İyi bir haberde kaynaklar çeşitlidir: bir yetkili, bir katılımcı ve mümkünse bir tanık. Bu farklı sesler olaya farklı açılardan bakar ve haberi tek bir kişinin anlatısı olmaktan çıkarır. Örneğin bir bağış haberinde hem kampanyayı yöneten öğrenci hem de bağışı alan kurumun yetkilisi konuşursa, olay iki yönlü ve inandırıcı olur. Kaynağı belirtmek aynı zamanda yazarın kendi görüşünü gizleme yoludur: 'organizatörlere göre' demek, bilgiyi yazarın değil kaynağın sırtına yükler.","t":"p"},{"x":"Haberde zaman ve mekân çıpaları güven verir. Okur bir olayın ne zaman ve nerede gerçekleştiğini bilmek ister; 'geçen cumartesi', 'okulun ana salonunda', 'pazartesi günü doğrulandı' gibi belirteçler haberi somut bir gerçekliğe bağlar. Belirsiz zaman ifadeleri ('recently', 'the other day') haberi zayıflatır ve profesyonellikten uzaklaştırır. Aynı biçimde, sayılar tahmin değil kesinlik taşımalıdır; 'over 5,000 lira', 'more than three hundred visitors' gibi somut veriler, 'a lot of money' gibi belirsiz ifadelerden çok daha güçlüdür. Zaman, mekân ve rakam üçlüsü, haberin nesnel dokusunu örer.","t":"p"},{"x":"Temayı Haber Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda haber görevi çoğu zaman bir prescribed theme'e bağlanır ve senin işin o temayı somut bir olaya dönüştürmektir. Örneğin 'Sharing the planet' teması altında çevre konusu verildiğinde, bunu soyut bir tartışma olarak değil, belirli bir olay olarak kurgula: 'Okul geçen hafta bahçesine yüz ağaç dikti' gibi. Sonra 5N1K'yı doldur, katılımcı sayısı ve alıntılarla geliştir ve gelecekteki planla kapat. Aynı tema bir görüş yazısında tartışılabilir, bir blogda kişisel anlatılabilirdi; haber merceği ise onu tarih, yer ve kaynakla çerçevelenmiş nesnel bir olaya indirger. Bu çerçeveleme becerisi, hangi tema gelirse gelsin haberi güvenle yazmanı sağlar.","t":"p"},{"x":"Zaman yönetimi haber başarısının parçasıdır. 75 dakikanın ilk beş dakikasını olayı ve 5N1K'yı netleştirmeye ayır: başlığını, spot cümleni ve gövdeye koyacağın iki alıntıyı belirle. Ardından yaklaşık elli beş dakika yaz ve son on dakikayı kontrole sakla. Değerlendiricinin gözünden haber, ters piramit yapısı ve nesnel tonuyla tanınır: Criterion C için başlık, resmi register ve yorumsuzluk aranır; Criterion B için olayın ayrıntı ve alıntılarla geliştirilip geliştirilmediğine bakılır; Criterion A için dilin doğru ve çeşitli olduğu incelenir. Kelime sınırlarını (SL için 250-400, HL için 450-600) ve metin türü beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel, doğru ve tarafsız biçimde haber vermek."], ["Kitle", "Bir gazete veya haber sitesinin okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Başlık (headline), ilk cümlede 5N1K, önemliden az önemliye (ters piramit), alıntılar."], ["Tipik özellikler", "Başlık, byline, geçmiş zaman, alıntılar (said/added), nesnel dil, isim-tarih-yer."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kısa, bilgilendirici bir başlık (headline) yaz.", "2. İlk cümlede 5N1K'yı ver: kim, ne, ne zaman, nerede.", "3. Ters piramit: en önemli bilgi başta, ayrıntılar sonra.", "4. Nesnel, üçüncü şahıs ve geçmiş zaman kullan.", "5. En az bir doğrudan alıntı ekle (said/added).", "6. Kendi görüşünü katma; görüşler yalnızca alıntılarda.", "7. Son kontrol: başlık + 5N1K + nesnellik + alıntı var mı?"]}, {"t": "given", "title": "Birinci örnek (bağış)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised over 5,000 lira for an animal shelter last Saturday, organisers confirmed on Monday."}, {"t": "given", "title": "İkinci örnek (kısa, farklı olay)", "x": "School Play Wins Regional Drama Award\n\nGreen Valley High School's production of 'The Long Night' won first prize at the regional drama festival on Friday, beating twelve other schools. The cast of thirty students had rehearsed for four months.\n\n'I am incredibly proud of them,' said drama teacher Ms. Aydin. 'They earned every second of this.' The school will now represent the region at the national final in June."}, {"t": "wizard", "wt": "news_report", "ptitle": "Görev", "prompt": "Okulunda gerçekleşen bir etkinliği (bir yarışma, gösteri, bağış kampanyası veya beklenmedik bir olay) haber yap. Bir başlık ve ters piramit yapısında nesnel bir haber yaz; en az bir alıntı ekle.", "target": 250, "check": ["Bir başlık yazdım ve ilk cümlede kim/ne/ne zaman/nerede bilgisini verdim.", "Nesnel, tarafsız, üçüncü şahıs bir dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı prompt'a uygun işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (haber)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised more than 5,000 lira for a local animal shelter last Saturday, organisers confirmed on Monday. The total is the highest the school has ever collected in a single day.\n\nThe money was raised through a charity fair held in the main hall, where students sold baked goods, ran games and organised a small concert. More than three hundred visitors attended during the afternoon.\n\n'We expected maybe half this amount,' said Ayse Yildiz, the student who led the campaign. 'People were incredibly generous.'\n\nThe shelter, which currently cares for over forty animals, said the donation would be used to buy food and medical supplies for the winter. Its director thanked the students and described the support as a real lifeline.\n\nOrganisers said they hoped to make the fair an annual event."}}, {"t": "note", "k": "ipucu", "title": "Nesnellik", "lines": ["Kendi görüşünü katma; haber tarafsızdır. Görüşler yalnızca alıntılarda yer alır.", "En önemli bilgiyi başa koy (ters piramit). Okur ilk cümlede olayı anlamalı."]}]}, {"id": "t-review", "group": "Kitle İletişim", "name": "İnceleme (Review)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"İnceleme Nedir ve Ne Zaman Karşına Çıkar?"},{"t":"p","x":"İnceleme (review), bir film, kitap, restoran, konser, ürün veya etkinliği değerlendirip okura gerekçeli bir öneri sunan bir metin türüdür. Bir dergi, gazete veya web sitesi için yazılır ve okurun 'bunu izlemeli/okumalı/denemeli miyim?' sorusuna yardımcı olmayı amaçlar. Paper 1'de sık çıkar çünkü birçok prescribed theme'e bağlanabilir: 'Experiences' altında bir seyahat veya etkinlik deneyimi, 'Human ingenuity' altında bir sanat eseri ya da teknolojik ürün, 'Identities' altında kültürel bir yapıt incelenebilir. İncelemenin özü, kişisel bir yargıyı keyfi bir beğeni olmaktan çıkarıp gerekçelerle destekleyerek okura güvenilir bir rehber sunmaktır."},{"t":"h","x":"Kitle, Amaç ve Register"},{"x":"İncelemenin kitlesi karar aşamasındaki okurdur: bir esere zaman veya para ayırmadan önce fikir edinmek isteyen kişiler. Amaç ikilidir: değerlendirmek ve yönlendirmek. Yalnızca özet verirsen incelemiş olmazsın; yalnızca 'çok güzeldi' dersen kararına güven vermezsin. Register yarı resmidir ve öznel ama gerekçelidir: birinci şahıs görüşe izin vardır ('I found the pace slow') ama her görüş bir nedene bağlanır. Ton canlı ve okunur olabilir, hatta zekice bir söz oyunu barındırabilir, ama argoya ve özensizliğe kaymaz. Bu denge, incelemeyi hem kişisel hem güvenilir kılar.","t":"p"},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"t":"p","x":"İncelemenin görünür bir iskeleti vardır. Genellikle çekici, çoğu zaman bir söz oyunu ya da yargı ipucu taşıyan bir başlıkla açılır ('A Feast for the Eyes, If Not the Heart'). Girişte neyin incelendiği ve genel bir izlenim verilir. Ardından sürprizleri açık etmeyen (spoiler'sız) kısa bir tanıtım gelir: konu, tür veya bağlam. Gövde güçlü ve zayıf yönleri gerekçeleriyle tartar; iyi bir inceleme tek yanlı değildir, dengelidir. Kapanış net bir öneriye ya da puana bağlanır: kime uygun, kime değil. Bazı incelemeler yıldız veya not verir. Bu 'değerlendir ve öner' yapısı, incelemeyi tanıtım yazısından ayırır."},{"t":"p","x":"Açılış incelemenin tonunu kurar. Zayıf bir açılış yargısızdır ve düz özet verir: 'This film is about a lighthouse keeper.' Güçlü bir açılış ise daha ilk cümlede bir duruş sezdirir: 'The Blue Lantern promises a lot, and for its first hour it almost delivers. Almost.' Bu iki cümle hem merak uyandırır hem de gelecek eleştirinin tohumunu atar; okur incelemenin dengeli olacağını sezer. İlk cümlede bir izlenim vermek, incelemeyi kuru bir konu anlatımından koruyan en etkili hamledir."},{"t":"h","x":"Dil ve Değerlendirme Araçları"},{"x":"İncelemenin dili değerlendirici sıfatlar ve gerekçe bağlaçlarıyla örülür. 'Stunning', 'thin', 'gripping', 'hollow' gibi sıfatlar bir yargı taşır; ama her sıfat bir nedenle desteklenmelidir ('visually stunning, because every frame looks like a painting'). Karşıtlık ve taviz yapıları dengeyi kurar: 'gorgeous, but hollow'; 'if you love atmosphere... but if you need a story...'. Değerlendirmeyi okura bağlayan koşullu öneriler ('If you can forgive a thin plot, yes') incelemeyi kişiselleştirir. Criterion A için bu tür, doğal olarak zengin bir sıfat ve değerlendirme dağarcığı sergilemene fırsat verir; aynı 'good' kelimesini tekrarlamak yerine farklı tonlarda övgü ve eleştiri sözcükleri kullan.","t":"p"},{"x":"Çözümlü Model Örnek","t":"h"},{"t":"p","x":"Bu dersteki film modeli ('A Feast for the Eyes, If Not the Heart') güçlüdür çünkü değerlendirmeyi baştan sona gerekçelendirir. Başlık bir söz oyunuyla hem merak uyandırır hem yargıyı sezdirir. Giriş filmi tanıtır ama hemen bir çekince koyar ('almost'). Gövde önce güçlü yönü işler ('Visually, it is stunning') ve bunu somut kanıtla destekler ('every frame looks like a painting'); sonra zayıf yönü dürüstçe verir ('The problem is the story') ve nedenini açar (olayın yavaşlaması, inandırıcılığını yitiren karakterler). Kapanış koşullu bir öneriyle ('If you love atmosphere... yes') ve net bir puanla ('three stars out of five') okuru yönlendirir. İşte dengeli inceleme böyle görünür: öznel ama gerekçeli (C), güçlü/zayıf yönler örneklerle geliştirilmiş (B), dil çeşitli ve değerlendirici (A)."},{"x":"İncelemeyi Benzer Türlerden Ayırmak","t":"h"},{"t":"p","x":"Öğrenciler incelemeyi en çok reklamla (advertisement) ve makaleyle (article) karıştırır. Reklam yalnızca över ve satmaya çalışır; incelemenin dürüstlüğü ve dengesi yoktur. İnceleme ise eleştirebilir, uyarır ve zayıf yönleri açıkça söyler; bu dürüstlük onu güvenilir kılar. Makale bir konuyu bilgilendirici biçimde ele alır ama bir esere puan vermez ya da öneri sunmaz. Aynı film hakkında reklam 'Kaçırmayın, yılın en iyisi!' der, makale sinema endüstrisini tartışır, inceleme ise 'güzel ama boş, üç yıldız' diyerek gerekçeli bir karar verir. Görevde 'review' kelimesini gördüğünde şu üçlüyü hatırla: değerlendir, gerekçelendir, öner."},{"head":["Tür","Amaç","Ayırt edici işaret"],"t":"table","rows":[["İnceleme (Review)","Değerlendir ve öner","Güçlü/zayıf denge, gerekçeli yargı, puan/öneri"],["Reklam (Advertisement)","Sat, ikna et","Yalnızca övgü, çağrı (call to action), abartı"],["Makale (Article)","Bilgilendir ve ilgilendir","Dengeli bilgi, alt başlık, puan/öneri yok"]]},{"t":"h","x":"Dengeyi Kurmak: Salt Övgü ve Salt Yergiden Kaçınmak"},{"t":"p","x":"İncelemede en çok kaybedilen puan dengesizlikten gelir ve bu Criterion B'yi (fikir geliştirme) düşürür. Bir eseri baştan sona övmek ya da baştan sona yermek okura güven vermez; gerçek bir değerlendirici hem beğendiğini hem beğenmediğini görür. Denge, iki yönü de gerekçelendirmekle kurulur: 'Yemekler zengin ve taze (güçlü yön, kanıtlı), ama servis çok yavaş (zayıf yön, kanıtlı).' Bu iki yönü bir arada tutmak, incelemeyi olgun ve inandırıcı yapar. Küçük bir çekince eklemek bile mutlak bir övgüyü daha güvenilir kılar; hiçbir eser kusursuz değildir ve okur bunu bilir."},{"x":"Değerlendirmeyi derinleştirmenin yolu 'yargı, gerekçe, örnek' zinciridir. Önce yargını söyle ('the pace is too slow'), sonra nedenini açıkla ('the plot stops moving halfway through'), ardından somut bir örnek ver (belirli bir sahne ya da an). Bu üç adımlı zincir her yargıyı çıplak bir beğeni olmaktan çıkarıp savunulabilir bir değerlendirmeye dönüştürür. 'It was boring' demek bir görüştür; 'It dragged because the middle forty minutes repeat the same conflict three times' demek bir incelemedir. Her önemli yargıyı bu zincirle destekle; incelemenin gücü buradan gelir.","t":"p"},{"x":"İnceleme Becerisinin Paper 2 ve Individual Oral'a Katkısı","t":"h"},{"t":"p","x":"İnceleme yazmayı öğrenmek, gerekçelendirilmiş değerlendirme yapmayı öğrenmektir ve bu beceri sınavın her yerinde işe yarar. Paper 2 okuma bölümünde incelemeler ve değerlendirici metinler çıkabilir; övgü ile eleştiriyi ve yazarın tonunu ayırt eden öğrenci soruları daha isabetli yanıtlar. Individual Oral'da ise bir görsel ya da edebi alıntıyı yorumlarken incelemede kazandığın 'yargı-gerekçe-örnek' refleksi doğrudan devreye girer: bir gözlemini söyler, nedenini açıklar ve somut bir ayrıntıyla desteklersin. Böylece ezber bir beğeni ifadesinin ötesine geçer, düşüncelerini gerekçelendirerek değerlendirici gibi konuşursun."},{"t":"note","lines":["Başlığı bir yargı ipucu ya da söz oyunuyla çekici yap.","Girişte neyi incelediğini ve genel izlenimini hemen belli et.","Özeti spoilersız tut; okurun deneyimini bozma.","Her yargıyı bir gerekçeyle destekle: neden iyi, neden zayıf?","Hem güçlü hem zayıf yönü ver; denge güven kazandırır.","Net bir öneriyle veya puanla bitir: kime uygun, kime değil?"],"title":"İncelemede puan kazandıran küçük hamleler","k":"ipucu"},{"x":"Sık yapılan hatalar incelemeyi zayıflatır. En büyüğü değerlendirmeyi unutup düz özet yazmaktır: eserin konusunu baştan sona anlatıp yorum katmamak, incelemeyi bir tanıtım metnine çevirir. İkincisi dengesizliktir: yalnızca övmek ya da yalnızca yermek. Üçüncüsü gerekçesiz yargıdır: 'harikaydı' ya da 'berbattı' demek ama nedenini göstermemek. Dördüncüsü kararsızlıktır: sonunda net bir öneri vermeyip okuru boşlukta bırakmak. Beşincisi ise sürprizleri açık etmektir; iyi bir inceleme okurun deneyimini bozmaz. Her yargıyı gerekçele ve mutlaka net bir tavsiyeyle kapat.","t":"p"},{"t":"h","x":"Okuru Tanımak ve Beklentiyi Yönetmek"},{"x":"İyi bir inceleme, okurun ne aradığını bilir ve yargısını ona göre çerçeveler. Aynı film bir izleyici için 'yavaş ve sıkıcı', bir başkası için 'sakin ve düşündürücü' olabilir; usta bir değerlendirici bu farkı tanır ve önerisini koşula bağlar: 'Aksiyon arıyorsan bu film seni yorar; ama atmosferden hoşlanıyorsan bir şölen.' Bu koşullu öneri, incelemeyi tek bir mutlak yargıdan kurtarır ve farklı okurlara yol gösterir. Okuru tanımak, incelemeyi keyfi bir beğeni olmaktan çıkarıp gerçek bir rehbere dönüştürür; çünkü okur, kendi zevkine göre karar verebileceği bir çerçeve bulur.","t":"p"},{"x":"Puanlama ve öneri, okurun beklentisini yöneten araçlardır. Bir yıldız notu ya da net bir tavsiye ('üç yıldız', 'okumaya değer ama sabır ister') okura hızlı bir özet sunar, ama bu not metindeki gerekçelerle tutarlı olmalıdır. Baştan sona öven bir metnin sonunda düşük puan vermek ya da tersi, okuru şaşırtır ve güveni sarsar. Değerlendirmen ile puanın aynı yöne bakmalıdır. Ayrıca öneriyi netleştirmek, incelemeyi tamamlar: 'belki', 'kararsızım' gibi bitişler okuru boşlukta bırakır. İnceleme bir karar aracıdır; sonunda okurun eline tutması gereken net bir sonuç bırakmalıdır.","t":"p"},{"x":"İncelemede ton, güvenilirliğin bir parçasıdır. Aşırı coşkulu bir dil ('the best film ever made') okuru kuşkuya iter, çünkü hiçbir eser kusursuz değildir. Ölçülü ama canlı bir ton daha inandırıcıdır: hayranlığını göster ama gerekçelendir, eleştirini yap ama insaflı ol. Zekice bir gözlem ya da ince bir mizah incelemeyi keyifli kılar, ama alaycılık ya da yıkıcılık okuru rahatsız eder ve profesyonellikten uzaklaştırır. İyi bir eleştirmen, sevdiği ya da sevmediği şeyi anlatırken bile eseri ciddiye alır. Bu saygılı ve dengeli ton, incelemenin hem Criterion C hem de okurla kurduğu güven açısından değerini artırır.","t":"p"},{"t":"h","x":"Temayı İnceleme Merceğinden Çerçevelemek"},{"t":"p","x":"Sınavda inceleme görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı somut bir esere ya da deneyime bağlamaktır. Örneğin 'Human ingenuity' teması altında teknoloji verildiğinde, bunu soyut tartışmak yerine belirli bir ürünü ya da uygulamayı incele: yeni bir uygulamayı dene, güçlü ve zayıf yönlerini gerekçelendir, kime uygun olduğuna karar ver. Aynı tema bir makalede bilgilendirici, bir görüş yazısında iddialı işlenebilirdi; inceleme merceği ise onu değerlendirilebilir somut bir örneğe indirir ve gerekçeli bir yargıya bağlar. Bu çerçeveleme becerisi, hangi tema gelirse gelsin incelemeyi güvenle yazmanı sağlar."},{"t":"p","x":"Zaman yönetimi incelemede de belirleyicidir. İlk beş dakikada neyi inceleyeceğini seç, iki güçlü ve bir zayıf yön (ya da tersi) belirle ve vereceğin puanı ya da öneriyi baştan kararlaştır; böylece yazı bir yöne akar. Ardından yaz ve son on dakikayı kontrole ayır. Değerlendiricinin gözünden inceleme, dengeli tonu ve gerekçeli yargılarıyla tanınır: Criterion C için yarı resmi register ve öznel-ama-gerekçeli duruş aranır; Criterion B için güçlü/zayıf yönlerin örneklerle geliştirilip geliştirilmediğine bakılır; Criterion A için dilin değerlendirici ve çeşitli olduğu incelenir. Kelime sınırlarını (SL için 250-400, HL için 450-600) ve tür beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran veya etkinliği değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan (izleyecek/okuyacak mı diye) okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (sürprizsiz), güçlü ve zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, birinci şahıs görüş, dengeli değerlendirme."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Neyi incelediğini (film, kitap, restoran) baştan belli et.", "2. Kısa, sürprizleri açık etmeyen bir özet ver.", "3. Güçlü yönleri gerekçele (ne iyiydi, neden?).", "4. Zayıf yönleri de dürüstçe belirt (denge kurar).", "5. Değerlendirici ama gerekçeli sıfatlar kullan.", "6. Net bir öneriyle veya puanla bitir (kime uygun?).", "7. Son kontrol: özet + güçlü/zayıf + denge + net öneri var mı?"]}, {"t": "given", "title": "Birinci örnek (film)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Almost."}, {"t": "given", "title": "İkinci örnek (restoran, farklı ürün)", "x": "Warm Food, Cold Service: The New Corner Cafe\n\nThe Corner Cafe has been the talk of our street for weeks, and the food mostly lives up to the hype. The soups are rich and generous, and the bread is baked fresh every morning.\n\nThe service, sadly, is another story. We waited twenty minutes just to order. If the owners can fix the slow service, this could become a favourite. For now, go for the food, but bring your patience. Three stars out of five."}, {"t": "wizard", "wt": "review", "ptitle": "Görev", "prompt": "Yakın zamanda izlediğin bir film veya okuduğun bir kitabı incele. Kısa bir özet (sürprizleri açık etmeden), güçlü ve zayıf yönler ve net bir öneri içeren bir inceleme yaz.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Değerlendirici, çeşitli kelimeler kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (inceleme)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Set in a crumbling seaside town, it follows a young lighthouse keeper who discovers a mysterious light at sea. The premise is simple, but the film wraps it in some of the most beautiful images I have seen this year.\n\nVisually, it is stunning. Every frame looks like a painting, and the sound design makes you feel the cold wind and crashing waves.\n\nThe problem is the story. Halfway through, the plot slows to a crawl, and the characters stop making believable choices. By the end, I admired the film without ever really caring about anyone in it.\n\nSo is it worth watching? If you love atmosphere and can forgive a thin plot, yes. If you need a story that grips you, you may leave a little cold. I would give it three stars out of five: gorgeous, but hollow."}}, {"t": "note", "k": "ipucu", "title": "Denge", "lines": ["Sadece övme veya sadece yerme; güçlü ve zayıf yönleri birlikte ver. Dengeli görüş üst puan getirir.", "Kararsız kalma; sonunda net bir öneri (izle/izleme, kime uygun) ver."]}]}, {"id": "t-report", "group": "Profesyonel", "name": "Resmi Rapor (Report)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Rapor Nedir ve Ne Zaman Karşına Çıkar?"},{"x":"Rapor (report), bir durumu, sorunu veya olayı sistematik biçimde inceleyen, bulguları düzenli bölümlerde sunan ve çoğu zaman öneriyle biten resmi bir metin türüdür. Bir okul yönetimine, bir kuruluşa, bir komiteye ya da bir yetkiliye yazılır ve okurun bilinçli bir karar vermesini amaçlar. Paper 1'de profesyonel türler arasında çıkar ve birçok prescribed theme'e bağlanır: 'Social organization' altında bir okul veya toplum sorunu, 'Sharing the planet' altında bir çevre durumu, 'Human ingenuity' altında bir teknoloji değerlendirmesi rapora dönüşür. Raporun özü, kişisel bir anlatı değil, olgulara dayalı düzenli bir inceleme ve makul bir tavsiye sunmaktır.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"x":"Raporun kitlesi çoğu zaman bir otoritedir: müdür, yönetim kurulu, öğrenci konseyi ya da bir kurum. Amaç bilgilendirmek ve karar vermeye zemin hazırlamaktır; iyi bir rapor durumu netleştirir ve bir sonraki adımı önerir. Register resmidir ve nesneldir: üçüncü şahıs ağırlıktadır, ton mesafeli ve ölçülüdür, duygusal dil ve argo yoktur. Yine de rapor tamamen kuru değildir; bulgularını yorumlar ve bir tavsiyeye bağlar, ama bunu olgulara dayandırır. Bu ölçülü, düzenli ton, raporu güvenilir bir karar aracı yapar ve onu kişisel mektuptan ya da denemeden ayırır.","t":"p"},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"x":"Raporun en belirgin imzası başlıklı bölümlere ayrılmış olmasıdır; bu görsel düzen Criterion C'nin ilk kanıtıdır. Tipik olarak özetleyici bir başlıkla açılır ve çoğu zaman bir amaç cümlesi ya da 'Introduction / Giriş' bölümüyle raporun neyi incelediğini belirtir. Ardından 'Findings / Bulgular' bölümü gelir; burada durum olgularla, gerektiğinde alt başlıklar ya da maddelerle sunulur. Sonra 'Recommendations / Öneriler' bölümü, bulgulardan mantıklı biçimde çıkan tavsiyeleri sıralar. Kimi rapor bir 'Conclusion / Sonuç' ile toparlar. Kısa, açıklayıcı bölüm başlıkları okuru yönlendirir ve raporu tarayarak okumayı kolaylaştırır.","t":"p"},{"t":"p","x":"Raporda bulgular ile öneriler arasındaki mantıksal köprü kritiktir. Giriş 'neden bu rapor yazıldı' sorusunu yanıtlar: 'This report examines the causes of low attendance at the school library and suggests ways to improve it.' Bulgular bölümü durumu kanıtlarla ortaya koyar (kullanım sayıları, anket sonuçları, gözlemler). Öneriler bölümü ise havadan gelmez; her tavsiye bir bulguya dayanmalıdır. Örneğin 'öğrenciler açılış saatlerini bilmiyor' bulgusu 'saatleri sınıflara asın' önerisini doğurur. Bu neden-öneri zinciri, raporu inandırıcı ve uygulanabilir kılar; öneriler bulgularla desteklenmediğinde rapor bir dilek listesine dönüşür."},{"x":"Dil ve Nesnellik Araçları","t":"h"},{"t":"p","x":"Raporun dili net, nesnel ve düzenlidir. Bulgular bölümünde olgusal, çoğu zaman geçmiş ya da geniş zaman kullanılır ve nicel veriler ('nearly half of students', '30% reported') güven verir. Öneriler bölümünde ise ölçülü öneri kalıpları öne çıkar: 'The school should consider...', 'It is recommended that...', 'One option would be to...'. Bağlaçlar mantığı görünür kılar: 'as a result', 'therefore', 'in order to'. Duygusal ve abartılı ifadelerden ('terrible', 'amazing') kaçınılır; yerine ölçülü değerlendirme ('inadequate', 'satisfactory') kullanılır. Criterion A için bu tür, kalıplaşmış rapor dilini doğru ve çeşitli biçimde kullanmanı ister; aynı öneri kalıbını tekrarlamak yerine farklı yapılarla tavsiye vermeyi öğren."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"Güçlü bir rapor modeli düşünelim: başlık durumu özetler ('Report on Canteen Waste at Green Valley High School'). Giriş amacı belirtir ('This report examines the amount of food waste in the school canteen and recommends practical solutions'). Bulgular bölümü olgularla konuşur: günde atılan yemek miktarı, en çok israf edilen öğün, öğrenci anketinin sonuçları; gerektiğinde maddelenir. Öneriler bölümü her bulguyu bir tavsiyeye bağlar: porsiyon seçeneği sunmak, artıkları bağışlamak, farkındalık panosu kurmak. Sonuç bölümü değişimin küçük ama ölçülebilir olacağını vurgular. İşte üç kriteri karşılayan bir rapor: başlıklı, resmi ve nesnel (C), bulgular ve öneriler mantıkla geliştirilmiş (B), dil ölçülü ve çeşitli (A).","t":"p"},{"x":"Raporu Benzer Türlerden Ayırmak","t":"h"},{"t":"p","x":"Öğrenciler raporu en çok denemeyle (essay) ve öneriyle (proposal) karıştırır. Deneme bir soruyu akademik paragraflarla, başlıksız ve tartışmacı biçimde ele alır; rapor ise başlıklı bölümlere ayrılır ve bir durumu inceleyip tavsiye verir. Öneri (proposal) tek bir somut fikri savunur ve ikna odaklıdır; rapor ise daha geniş bir durumu tarafsızca inceler ve birden çok öneri sunabilir. Haberden farkı ise raporun yalnızca olayı aktarmakla kalmayıp onu analiz etmesi ve tavsiyeye bağlamasıdır. Görevde 'report' kelimesini gördüğünde şu üçlüyü hatırla: başlıklı bölümler, olgusal bulgular ve bulgulara dayalı öneriler."},{"t":"table","head":["Tür","Amaç","Ayırt edici işaret"],"rows":[["Rapor (Report)","İncele ve öner","Başlıklı bölümler, bulgular + öneriler, nesnel"],["Deneme (Essay)","Bir soruyu tartış","Akademik paragraflar, başlıksız, tartışmacı"],["Öneri (Proposal)","Tek fikri savun, ikna et","Somut öneri, fayda-maliyet, ikna edici ton"]]},{"t":"h","x":"Bölümleri ve Bulguları Düzenlemek"},{"x":"Raporun gücü düzeninden gelir ve bu düzen Criterion C'de doğrudan puana dönüşür. Bölüm başlıkları okurun raporu tarayarak istediği bilgiye ulaşmasını sağlar; başlıksız bir metin ne kadar iyi yazılsa da rapor gibi durmaz. Bulguları düzenlerken benzer bilgileri gruplandır ve gerektiğinde maddeleme kullan; bir dizi sayı ya da neden, düz paragraf yerine listede daha okunur olur. Ancak maddeleme rastgele değildir: her madde tam ve bilgi taşıyan bir ifade olmalı, tek kelimelik notlar bırakılmamalıdır. Düzenli bölümler ve amaca uygun maddeleme, raporun profesyonel görünmesini sağlar.","t":"p"},{"x":"Önerileri güçlendirmenin yolu onları uygulanabilir ve gerekçeli kılmaktır. Zayıf bir öneri belirsizdir: 'The school should do something about waste.' Güçlü bir öneri somut, gerekçeli ve ölçülebilirdir: 'The canteen should offer two portion sizes, which would let students take less when they are not very hungry and cut plate waste.' Burada ne yapılacağı (iki porsiyon seçeneği), neden işe yarayacağı (az yiyenler az alır) ve beklenen sonuç (israf azalır) birlikte verilmiştir. Her öneriyi bu netlikte kur; değerlendirici, tavsiyelerin bulgulardan mantıkla çıkıp çıkmadığına ve gerçekçi olup olmadığına bakar.","t":"p"},{"t":"h","x":"Rapor Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"x":"Rapor yazmayı öğrenmek, bilgiyi düzenleme ve olgudan sonuca ilerleme becerisidir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde raporlar ve resmi metinler çıkabilir; bölüm yapısını ve bulgu-öneri mantığını tanıyan öğrenci, bir bilginin nerede aranacağını bilir ve soruları hızlı yanıtlar. Individual Oral'da ise bir görseli ya da konuyu bir prescribed theme etrafında yapılandırırken raporda kazandığın düzen işe yarar: önce gözlemini olgusal biçimde sunar, sonra bundan bir çıkarım ve öneri türetirsin. Dağınık bir konuşma yerine, giriş-gözlem-çıkarım sırasıyla ilerleyen düzenli bir sunum yaparsın.","t":"p"},{"k":"ipucu","lines":["Metni başlıklı bölümlere ayır: Giriş, Bulgular, Öneriler, Sonuç.","Girişte raporun amacını tek cümlede net biçimde belirt.","Bulguları olgu ve rakamla ver; gerektiğinde madde listesi kullan.","Her öneriyi bir bulguya bağla; havadan tavsiye verme.","Ölçülü öneri kalıpları kullan: 'should consider', 'it is recommended that'.","Duygusal dil yerine nesnel değerlendirme sözcükleri seç."],"title":"Raporda puan kazandıran küçük hamleler","t":"note"},{"t":"p","x":"Sık yapılan hatalar raporu zayıflatır. En büyüğü bölüm başlıklarını atlamaktır: başlıksız, akan bir metin rapor gibi durmaz ve Criterion C düşer. İkincisi bulgu ile öneriyi karıştırmaktır; durumu betimlemeden öneriye atlamak ya da öneri vermeden yalnızca betimlemek raporu yarım bırakır. Üçüncüsü öznellik ve duygusal dildir: 'the canteen is disgusting' gibi ifadeler nesnelliği bozar, yerine 'hygiene standards were found to be inadequate' denir. Dördüncüsü belirsiz önerilerdir; 'bir şeyler yapılmalı' demek değil, ne yapılacağını somut biçimde söylemek gerekir."},{"x":"Veriyi Yorumlamak ve Nesnellik Sınırı","t":"h"},{"t":"p","x":"Rapor yalnızca veri sıralamaz; onu yorumlar ve anlamlandırır, ama bunu nesnellik sınırları içinde yapar. Çıplak bir rakam tek başına az şey söyler ('30% of students'); iyi bir rapor bu rakamı bir bağlama oturtur ('nearly a third of students said they never use the library, which suggests a serious awareness problem'). Burada yazar veriyi yorumlar ama bir çıkarım olarak, kişisel bir öfke ya da beğeni olarak değil. Yorum, olgudan mantıkla türetildiği sürece nesnelliği bozmaz; asıl tehlike, veriyi atlayıp doğrudan duygusal bir yargıya atlamaktır. Rapor, olguyu konuşturan ama ondan makul sonuçlar çıkaran ölçülü bir sestir."},{"x":"Bulguları sunarken kaynak ve yöntem güven verir. Bir raporda 'öğrenciler şikâyetçi' demek zayıftır; 'yapılan ankete katılan 120 öğrencinin yarısı memnuniyetsizlik bildirdi' demek güçlüdür, çünkü bilginin nereden geldiğini gösterir. Verinin nasıl toplandığını kısaca belirtmek (anket, gözlem, kayıt) raporu inandırıcı kılar. Aynı biçimde, kesin olmayan bilgileri ölçülü ifade etmek gerekir: 'this may indicate', 'the figures suggest' gibi kalıplar, olguyla yorumu birbirinden ayırır ve yazarı aşırı genellemeden korur. Kaynağı belli, yöntemi şeffaf bulgular, raporun karar vericinin gözündeki ağırlığını artırır.","t":"p"},{"t":"p","x":"Raporun nesnelliği, dilin ölçülülüğünde de görünür. Duygusal ve abartılı sıfatlar ('shocking', 'terrible', 'fantastic') raporu bir görüş yazısına yaklaştırır ve güvenilirliğini düşürür. Yerine ölçülü değerlendirme sözcükleri seçilir: 'inadequate', 'satisfactory', 'concerning', 'promising'. Bu sözcükler bir değerlendirme taşır ama sakin ve profesyonel kalır. Öneri bölümünde bile ton mütevazıdır: 'the school should consider' demek, 'the school must immediately' demekten daha uygundur, çünkü rapor dayatmaz, karar vericiye seçenek sunar. Ölçülü dil, raporu duygudan arındırıp bir karar aracına dönüştürür ve Criterion C'de doğrudan değer kazandırır."},{"x":"Temayı Rapor Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda rapor görevi çoğu zaman bir prescribed theme'e bağlanır ve senin işin o temayı incelenebilir somut bir duruma dönüştürmektir. Örneğin 'Sharing the planet' teması altında çevre verildiğinde, bunu geniş bir tartışma olarak değil, belirli bir durum olarak kurgula: 'okulun geri dönüşüm uygulamasının etkinliği' gibi. Sonra bulguları (mevcut kutular, kullanım oranı, sorunlar) sun ve önerileri (daha çok kutu, bilgilendirme, denetim) bunlara bağla. Aynı tema bir görüş yazısında tartışılabilir, bir haberde olay olarak aktarılabilirdi; rapor merceği ise onu başlıklı bölümlerde incelenen ve tavsiyeye bağlanan bir duruma indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin raporu güvenle yazmanı sağlar.","t":"p"},{"t":"p","x":"Zaman yönetimi raporda özellikle önemlidir çünkü yapı önceden planlanmalıdır. İlk beş dakikada bölümleri belirle: giriş, iki üç bulgu ve her bulgudan çıkan öneri. Bu iskelet çıkınca yazı düzenli akar. Ardından yaz ve son on dakikada bölümlerin eksiksiz olduğunu, her önerinin bir bulguya dayandığını ve register'ın baştan sona resmi kaldığını kontrol et. Değerlendiricinin gözünden rapor, düzeni ve olgusal tonuyla tanınır: Criterion C için başlıklı bölümler ve resmi register, Criterion B için bulgu-öneri mantığı, Criterion A için ölçülü ve çeşitli dil aranır. Kelime sınırlarını (SL için 250-400, HL için 450-600) ve tür beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (müdür, yönetim, kurul)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Başlık, To/From/Date, giriş (amaç), başlıklı bulgular, öneriler, kısa kapanış."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (It is recommended that)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlık ve To / From / Date bilgisini yaz.", "2. Girişte raporun amacını tek cümleyle belirt.", "3. Bulgular bölümünde sorunu nesnel ve veriye dayalı anlat (başlık kullan).", "4. Her bulguyu kısa ve tarafsız ver; kişisel görüş katma.", "5. Öneriler bölümünde çözümleri 'It is recommended that...' kalıbıyla sırala.", "6. Kısa bir sonuç/kapanışla bitir.", "7. Son kontrol: başlık + bölüm başlıkları + nesnel dil + öneriler var mı?"]}, {"t": "given", "title": "Birinci örnek (kantin)", "x": "Report on the School Cafeteria\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine student concerns about the cafeteria and to suggest practical improvements."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Report on After-School Club Provision\nTo: The Vice Principal\nFrom: The Student Council\nDate: 3 April\n\nFindings\nA survey of 200 students showed that clubs are popular but limited. The most requested activities — coding, debating and film — are currently not offered. Many students also reported that clubs clash with the late bus.\n\nRecommendations\nIt is recommended that three new clubs be introduced next term. It is further recommended that club times be aligned with the bus timetable so that no student is excluded."}, {"t": "wizard", "wt": "report", "ptitle": "Görev", "prompt": "Okul yönetimi için bir sorunu (kütüphane saatleri, kantin, ulaşım veya kulüpler) araştıran ve çözüm öneren resmi bir rapor yaz. Başlık, To/From/Date, bulgular ve öneriler bölümlerini kullan.", "target": 280, "check": ["Başlık ve To/From/Date bilgisiyle resmi rapor biçimini kullandım.", "Başlıklı bölümler (giriş, bulgular, öneriler) ve nesnel bir dil kullandım (Criterion C).", "Bulguları verdim ve prompt'un istediği çözüm önerilerini sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (rapor)", "x": "Report on the School Library\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine students' concerns about the school library and to recommend improvements to its opening hours and study space.\n\nFindings\nA survey of 150 students revealed two main problems. First, the library closes at 3 p.m., which prevents students who stay for clubs from using it. Second, during exam periods, there are not enough quiet seats, and many students are turned away.\n\nSeveral students also noted that the study area is often disturbed by group work taking place in the same room.\n\nRecommendations\nIt is recommended that the library remain open until 5 p.m. on weekdays. It is also recommended that a separate silent zone be created for individual study, especially before examinations.\n\nConclusion\nThese changes would be low in cost but would greatly improve students' ability to study effectively at school."}}, {"t": "note", "k": "ipucu", "title": "Resmilik", "lines": ["Kişisel ton yok; nesnel ve veri odaklı yaz. It is recommended that... kalıbı Criterion C'yi güçlendirir.", "Bölüm başlıkları kullan (Introduction, Findings, Recommendations). Yapı görünür olmalı."]}]}, {"id": "t-proposal", "group": "Profesyonel", "name": "Öneri / Teklif (Proposal, HL)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Öneri / Teklif Nedir ve Ne Zaman Karşına Çıkar?"},{"t":"p","x":"Öneri ya da teklif (proposal), somut bir fikri bir karar vericiye 'satmak', yani onu belirli bir eylemi onaylamaya ikna etmek için yazılan resmi bir metin türüdür. HL öğrencilerinin karşısına çıkan bu tür, bir okul yönetimine, bir kuruma ya da bir komiteye hitap eder ve 'şunu yapalım, çünkü şu faydaları var' der. Paper 1'de birçok prescribed theme'e bağlanır: 'Social organization' altında bir okul girişimi, 'Sharing the planet' altında bir sürdürülebilirlik projesi, 'Human ingenuity' altında bir teknoloji yatırımı öneri konusu olabilir. Önerinin özü, tek bir net fikri hem nesnel bir otoriteyle hem de ölçülü bir hevesle savunarak okuru 'evet' demeye götürmektir."},{"t":"h","x":"Kitle, Amaç ve Register"},{"t":"p","x":"Önerinin kitlesi karar verme yetkisi olan bir muhataptır: müdür, yönetim, sponsor ya da komite. Amaç ikna etmektir, ama bu ikna olgulara dayanır; öneri hem bir fikri savunur hem de onun uygulanabilir olduğunu gösterir. Register resmidir, ancak yarı resmi bir hevesle yumuşatılır: nesnel bir otorite tonu ('This proposal outlines...') ile öznel bir coşku ('This project would transform...') dengelenir. Fazla duygusal olursan güvenilirliğini, fazla kuru olursan ikna gücünü kaybedersin. Bu 'nesnel otorite artı ölçülü heves' dengesi, öneriyi hem ciddiye alınır hem cazip kılar."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"x":"Önerinin görünür bir iskeleti vardır ve çoğu zaman başlıklı bölümlere ayrılır; bu düzen Criterion C'nin kanıtıdır. Özetleyici bir başlıkla açılır ('Proposal: A Peer Mentoring Scheme for Year 9'). Giriş sorunu ya da fırsatı tanıtır ve önerinin amacını belirtir. Gövde fikri açar: ne önerildiği, nasıl işleyeceği (uygulama adımları), faydaları ve gerektiğinde maliyet ya da olası itirazların yanıtı. Alt başlıklar bu bölümleri ayırır. Sonuç, kararı çağıran ölçülü ama güçlü bir kapanışla biter ('I am confident this scheme would benefit both mentors and mentees'). Bu 'sorun, çözüm, fayda, çağrı' akışı önerinin imzasıdır.","t":"p"},{"t":"p","x":"Önerinin kalbi fayda ile uygulanabilirliğin birlikte sunulmasıdır. Yalnızca 'bu iyi bir fikir' demek yetmez; okur 'peki nasıl?' ve 'bize ne kazandırır?' sorularının yanıtını arar. Bu yüzden iyi bir öneri hem somut adımlar verir ('Volunteers would meet mentees once a week during lunch') hem de faydaları gösterir ('New students would settle in faster, and mentors would develop leadership skills'). Karar vericiyi asıl ikna eden şey, fikrin hem değerli hem de gerçekçi olduğunu görmesidir. Maliyet ya da olası itiraza kısaca değinip yanıtlamak ('The scheme would need no budget, only a coordinator's time') güveni artırır."},{"x":"Dil ve İkna Araçları","t":"h"},{"t":"p","x":"Önerinin dili ölçülü ama ikna edicidir. Koşullu ve gelecek kipleri olası faydayı canlandırır: 'This would allow...', 'Students could...', 'The result would be...'. Fayda odaklı fiiller ('improve', 'reduce', 'enable', 'strengthen') öneriyi cazip kılar. Ölçülü öneri kalıpları ('I propose that...', 'I would recommend...') otorite kurar. İkna, üçlü listeler ve karşıtlıklarla ('Not only... but also...') güçlenir. Ancak abartıdan ve boş vaatten kaçınılır; her iddia makul olmalıdır. Criterion A için bu tür, koşullu yapıları, fayda dilini ve resmi öneri kalıplarını doğru ve çeşitli biçimde kullanmanı ister; aynı 'would be good' ifadesini tekrarlamak yerine faydayı farklı yapılarla anlat."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"Güçlü bir öneri modeli düşünelim: başlık fikri özetler ('Proposal: Introducing a School Bike-Sharing Scheme'). Giriş sorunu tanıtır (otoparkın dolması, kısa mesafeler için araba kullanımı) ve amacı belirtir. Gövde fikri açar: nasıl işleyeceği (giriş kartıyla ödünç alınan bisikletler), kimin sorumlu olacağı, ve üç somut fayda (trafik azalması, öğrenci sağlığı, çevre). Olası itiraz kısaca yanıtlanır ('Maintenance costs would be low, as the student cycling club has offered to help'). Sonuç kararı çağırır ('I strongly believe this scheme would make our school greener and healthier'). İşte üç kriteri karşılayan bir öneri: resmi ama hevesli (C), fayda ve uygulama mantıkla geliştirilmiş (B), dil koşullu ve ikna edici (A).","t":"p"},{"t":"h","x":"Öneriyi Benzer Türlerden Ayırmak"},{"x":"Öğrenciler öneriyi en çok raporla (report) ve görüş yazısıyla (opinion column) karıştırır. Rapor bir durumu tarafsızca inceler ve birden çok tavsiye sunabilir; öneri ise tek bir somut fikri savunur ve ikna odaklıdır, tarafsız değildir. Görüş yazısı bir konuda taraf tutar ama çoğu zaman somut bir uygulama planı sunmaz; öneri ise mutlaka 'ne yapalım ve nasıl' sorusunu yanıtlar. Aynı konu (örneğin okulda geri dönüşüm) raporda incelenir, görüş yazısında tartışılır, öneride ise belirli bir projeye ('haftalık geri dönüşüm günü kuralım') dönüştürülüp savunulur. Görevde 'proposal' kelimesini gördüğünde şu üçlüyü hatırla: tek somut fikir, uygulanabilir plan ve fayda odaklı ikna.","t":"p"},{"t":"table","head":["Tür","Amaç","Ayırt edici işaret"],"rows":[["Öneri (Proposal)","Fikri sat, onaya ikna et","Somut plan, fayda + uygulama, çağrı"],["Rapor (Report)","Durumu incele, öneri sun","Nesnel bulgular, birden çok tavsiye"],["Görüş yazısı (Opinion)","Taraf tut, ikna et","Net tez, uygulama planı şart değil"]]},{"x":"İtirazları Öngörmek ve Yanıtlamak","t":"h"},{"t":"p","x":"Bir öneriyi olgunlaştıran şey, karar vericinin aklından geçecek itirazı önceden görüp yanıtlamaktır; bu Criterion B'de fikir derinliği olarak puana döner. Deneyimsiz bir yazar yalnızca faydaları sıralar ve maliyeti, riski ya da zorluğu görmezden gelir; okur bu boşluğu hemen fark eder. Olgun bir öneri ise olası itirazı kısaca dile getirir ve makul bir yanıt verir: 'Some may worry about the cost, but the equipment could be funded through a single fundraising event.' Bu hamle, yazarın fikri her yönüyle düşündüğünü gösterir ve güven kazandırır. İtirazı yok saymak değil, onu öngörüp yanıtlamak öneriyi ikna edici kılar."},{"x":"Faydaları güçlendirmenin yolu onları somutlaştırmak ve muhataba göre çerçevelemektir. Soyut bir fayda zayıftır: 'This would be good for the school.' Somut ve muhataba dönük bir fayda güçlüdür: 'This would ease the morning traffic that staff complain about, and give students a healthier start to the day.' Burada fayda hem elle tutulur hem de karar vericinin umursadığı şeye (personel şikâyeti, öğrenci sağlığı) bağlanmıştır. Her faydayı 'kim için, ne kazandırır' sorusuyla test et; muhatabın önceliklerine dokunan faydalar, genel iyi niyet ifadelerinden çok daha ikna edicidir.","t":"p"},{"t":"h","x":"Öneri Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"t":"p","x":"Öneri yazmayı öğrenmek, bir fikri gerekçelendirerek savunma becerisidir ve bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde ikna edici ve resmi metinler çıkabilir; fayda dilini ve öneri yapısını tanıyan öğrenci yazarın amacını ve tonunu daha isabetli okur. Individual Oral'da ise bir görsel ya da alıntıyı bir prescribed theme etrafında yorumlarken, öneride kazandığın 'iddia-fayda-gerçekçilik' düşünme biçimi işe yarar: bir gözlemden yola çıkıp onu değerlendirir, sonuç ve öneri türetirsin. Böylece yalnızca betimlemekle kalmaz, düşünceni bir yöne taşıyıp gerekçelendirebilir, olgun bir konuşma kurabilirsin."},{"t":"note","k":"ipucu","title":"Öneride puan kazandıran küçük hamleler","lines":["Tek net fikri baştan ortaya koy; birden çok fikre dağılma.","Metni başlıklı bölümlere ayır: sorun, çözüm, fayda, çağrı.","Nasıl işleyeceğini somut adımlarla göster; belirsizlikten kaçın.","Faydaları muhataba göre çerçevele: karar vericiye ne kazandırır?","Olası bir itirazı öngör ve makul biçimde yanıtla.","Ölçülü ama güçlü bir çağrıyla kapat; kararı davet et."]},{"x":"Sık yapılan hatalar öneriyi zayıflatır. En büyüğü fikri savunmayı unutup yalnızca sorunu betimlemektir; öneri bir rapor değildir, net bir çözüm ve onun için ikna içermelidir. İkincisi uygulanabilirliği atlamaktır: 'nasıl' sorusunu yanıtlamayan bir fikir havada kalır. Üçüncüsü abartılı vaat ve duygusal dildir; öneri ölçülü kalmalı, makul faydalar sunmalıdır. Dördüncüsü itirazları görmezden gelmektir; olası endişeye değinmeyen öneri tek yanlı ve saf görünür. Beşincisi ise register kaymasıdır: fazla samimi bir ton önerinin ciddiyetini düşürür. Tek fikri, somut planı ve ölçülü hevesi bir arada tut.","t":"p"},{"t":"h","x":"Muhatabı ve Önceliklerini Okumak"},{"t":"p","x":"Bir öneriyi ikna edici kılan en güçlü etken, muhatabın kim olduğunu ve neyi umursadığını bilmektir. Aynı fikir farklı karar vericilere farklı yönlerinden sunulur: bir müdüre okulun itibarı ve öğrenci başarısı, bir yönetim kuruluna maliyet ve sürdürülebilirlik, bir öğrenci konseyine katılım ve eğlence daha çok konuşur. Önerini yazmadan önce kendine sor: bu kararı verecek kişi hangi baskılar altında, neyi başarmak istiyor? Faydalarını onun önceliklerine bağladığında ikna gücün katlanır. Genel bir 'bu iyi olur' yerine, 'bu, sizin de vurguladığınız çevre hedefine doğrudan katkı sağlar' demek, muhatabı fikrin ortağı yapar."},{"t":"p","x":"İkna, mantık ile makul heves arasında bir dengedir. Yalnızca kuru veriyle yazarsan öneri soğuk kalır; yalnızca coşkuyla yazarsan güvenilmez görünürsün. Usta bir öneri ikisini örer: somut bir fayda verir ('bu, öğle trafiğini azaltır') ve onu ölçülü bir inançla mühürler ('eminim ki bu değişim kısa sürede fark edilecektir'). Bu denge, muhataba hem düşünülmüş bir plan hem de arkasında duran bir irade sunar. Aşırı iddialı vaatlerden ('bu her sorunu çözecek') kaçın; makul ve kanıtlanabilir faydalar, abartılı sözlerden çok daha ikna edicidir ve önerinin ciddiyetini korur."},{"t":"p","x":"Bir önerinin gücü, uygulanabilirliğini gösteren küçük ayrıntılarda saklıdır. Karar verici çoğu zaman 'peki bunu kim yapacak, parası nereden gelecek, ne kadar sürer?' diye düşünür. Bu soruları önceden yanıtlayan bir öneri güven verir: sorumluyu belirt ('gönüllü öğrenci kulübü yürütebilir'), maliyeti ele al ('ek bütçe gerektirmez') ve zamanlamayı ver ('bir dönemde pilot olarak denenebilir'). Bu ayrıntılar fikri bir hayalden bir plana dönüştürür. Belirsiz bırakılan her nokta, karar vericinin zihninde bir itiraza dönüşür; onları önceden kapatmak, önerini 'evet' demeye hazır hale getirir."},{"x":"Temayı Öneri Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda öneri görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı savunulabilir somut bir projeye dönüştürmektir. Örneğin 'Human ingenuity' teması altında teknoloji verildiğinde, bunu soyut tartışmak yerine belirli bir proje kur: 'okula bir dijital öğrenme laboratuvarı kuralım' gibi. Sonra nasıl işleyeceğini, kime ne fayda sağlayacağını ve maliyetin nasıl karşılanacağını göster. Aynı tema bir raporda incelenebilir, bir görüş yazısında tartışılabilirdi; öneri merceği ise onu karar vericiye sunulan, uygulanabilir ve fayda odaklı tek bir projeye indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin öneriyi güvenle yazmanı sağlar.","t":"p"},{"t":"p","x":"Zaman yönetimi öneride kritiktir çünkü hem yapı hem ikna önceden planlanmalıdır. İlk beş dakikada tek fikrini, iki üç faydasını, uygulama adımlarını ve yanıtlayacağın bir itirazı belirle. Bu iskelet çıktığında öneri ikna edici biçimde akar. Ardından yaz ve son on dakikada faydaların somut olduğunu, planın gerçekçi göründüğünü ve register'ın resmi-ama-hevesli dengesini koruduğunu kontrol et. Değerlendiricinin gözünden öneri, net fikri ve ikna mantığıyla tanınır: Criterion C için başlıklı düzen ve ölçülü resmi ton, Criterion B için fayda-uygulama-itiraz derinliği, Criterion A için koşullu ve çeşitli dil aranır. Bu HL türünün kelime sınırını (450-600) ve tür beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri veya planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (yönetim, kurul, sponsor)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi."], ["Yapı", "Başlık, giriş (önerinin özeti), gerekçe ve faydalar, uygulama planı, maliyet, kapanış çağrısı."], ["Tipik özellikler", "Bölüm başlıkları, gelecek zaman, fayda vurgusu, gerçekçi plan, ölçülü ikna dili. (Sadece HL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlıkta öneriyi adlandır (Proposal: ...).", "2. Girişte fikri tek paragrafta özetle: ne öneriyorsun ve neden?", "3. Faydalar bölümünde kime, nasıl fayda sağlayacağını göster.", "4. Uygulama planında gerçekçi adımlar ver (kim, ne zaman, nasıl).", "5. Maliyet/kaynak konusunu dürüstçe ele al (düşük maliyet güven verir).", "6. Kapanışta ölçülü ama net bir onay çağrısı yap.", "7. Son kontrol: başlık + öneri + fayda + plan + gerçekçilik var mı?"]}, {"t": "given", "title": "Birinci örnek (akran mentorluğu)", "x": "Proposal: A Peer Tutoring Programme\n\nThis proposal outlines a student-led tutoring scheme designed to support learners who are struggling in core subjects, at no cost to the school."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Proposal: A School Recycling Scheme\n\nIntroduction\nThis proposal recommends placing clearly labelled recycling bins in every classroom and corridor.\n\nBenefits\nThe scheme would cut waste, save the school money on collection, and teach students habits that last a lifetime.\n\nImplementation\nEco-club volunteers would empty and monitor the bins weekly, and a short assembly would launch the scheme.\n\nCosts\nThe only cost is the bins themselves, which a local supplier has offered to sponsor. I respectfully ask the school to approve a one-month trial."}, {"t": "wizard", "wt": "proposal", "ptitle": "Görev", "prompt": "Okulunda yeni bir kulüp, etkinlik veya sistem için yönetimden onay isteyen bir öneri (proposal) yaz. Fikri, faydalarını ve gerçekçi bir uygulama planını açıkla. (HL)", "target": 300, "check": ["Başlık ve girişte öneriyi net özetledim.", "Gerekçe/faydaları ve gerçekçi bir uygulama planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille prompt'un istediğini karşıladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (öneri)", "x": "Proposal: A Peer Tutoring Programme\n\nIntroduction\nThis proposal recommends setting up a peer tutoring programme in which older students help younger ones who are struggling in core subjects. The scheme would run twice a week after school and would cost the school almost nothing.\n\nBenefits\nThe programme would help weaker students improve their grades in a relaxed, less intimidating setting. Just as importantly, the tutors themselves would deepen their own understanding and develop leadership skills valued by universities. Over time, it could also build a stronger sense of community across year groups.\n\nImplementation\nEach term, volunteer tutors would be matched with younger students by subject teachers. Sessions would take place in the library from 3 to 4 p.m. on Tuesdays and Thursdays. A teacher would supervise, but the sessions would be led by students.\n\nCosts\nThe only real cost is supervision, which existing staff could share on a rota. No new materials or funding would be required.\n\nConclusion\nFor almost no cost, this programme could raise achievement and bring students together. I respectfully ask the school to trial it for one term."}}, {"t": "note", "k": "ipucu", "title": "Rapordan farkı", "lines": ["Rapor mevcut durumu inceler; öneri (proposal) gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-instructions", "group": "Profesyonel", "name": "Yönerge (Set of Instructions)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Yönerge Nedir ve Ne Zaman Karşına Çıkar?"},{"x":"Yönerge ya da kılavuz (set of instructions / guidelines), bir okurun belirli bir işi doğru ve güvenli biçimde yapmasını sağlamak için adım adım yol gösteren bir metin türüdür. Bir tarif, bir kullanım kılavuzu, bir 'nasıl yapılır' rehberi ya da bir güvenlik yönergesi bu türe girer. Paper 1'de profesyonel/pratik türler arasında çıkar ve birçok prescribed theme'e bağlanır: 'Experiences' altında bir aktivite rehberi, 'Human ingenuity' altında bir cihazın kullanımı, 'Sharing the planet' altında bir sürdürülebilir uygulama kılavuzu olabilir. Yönergenin özü, okuyanı hedefe götüren net, sıralı ve uygulanabilir adımlar sunmaktır; süslü anlatı değil, işleyen bir yol haritasıdır.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Yönergenin kitlesi bir işi yapmaya hazırlanan, ama nasıl yapılacağını bilmeyen okurdur: bir yeni başlayan, bir kullanıcı, bir katılımcı. Amaç tektir: okuru adım adım başarıya ulaştırmak. Register çoğu zaman doğrudan ve nettir; okura ikinci şahısla ('you') ya da emir kipiyle ('Press the button', 'Add the flour') seslenilir. Ton bağlama göre resmi ya da yarı resmi olabilir, ama her zaman açık ve yardımcıdır. Belirsizlik yönergenin en büyük düşmanıdır; okur bir adımda takılırsa tüm süreç durur. Bu yüzden yönerge kısa cümleler, net fiiller ve mantıklı bir sırayla kurulur."},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"t":"p","x":"Yönergenin en belirgin imzası sıralı yapısıdır. Genellikle amacı belirten bir başlıkla açılır ('How to Set Up Your New Tablet'). Çoğu zaman kısa bir giriş sonucu ya da hazırlığı anlatır ('This guide will help you get started in five minutes'). Ardından gerekli malzeme ya da ön koşullar listelenebilir ('You will need: the charger, a Wi-Fi password'). Sonra numaralı ya da madde işaretli adımlar mantıksal sırayla gelir; her adım tek bir eylemi anlatır. Kapanışta çoğu zaman bir ipucu, uyarı ya da 'sorun çıkarsa' notu bulunur. Numaralandırma, kısa adımlar ve emir kipi bu türün görsel imzasıdır."},{"t":"p","x":"Adımların sırası ve netliği yönergenin başarısını belirler. Her adım tek bir eylemi anlatmalı ve mantıklı bir sırada gelmelidir; bir adımı atlamak ya da yanlış sıraya koymak okuru başarısızlığa uğratır. Zayıf bir adım belirsizdir: 'Set it up properly.' Güçlü bir adım somut ve tek eylemlidir: 'Press and hold the power button for three seconds until the screen lights up.' Burada ne yapılacağı (basılı tut), ne kadar (üç saniye) ve ne olacağı (ekran açılır) verilmiştir. Adımları yazarken kendine sor: bu talimatı hiç bilmeyen biri yalnızca bunu okuyarak yapabilir mi? Yanıt 'hayır' ise adım yeterince açık değildir."},{"x":"Dil ve Netlik Araçları","t":"h"},{"t":"p","x":"Yönergenin dili emir kipi ve sıra bağlaçları üzerine kurulur. Emir kipi eylemi doğrudan verir: 'Open', 'Select', 'Wait', 'Do not press'. Sıra belirteçleri okuru adımlar arasında taşır: 'First', 'Next', 'Then', 'After that', 'Finally'. Kısa, tek eylemli cümleler netliği korur. Uyarılar ve ipuçları öne çıkarılır ('Warning: do not overfill the tank'; 'Tip: keep the receipt'). Belirsiz zamirlerden ('it', 'this') kaçınılır; neyin kastedildiği açık olmalıdır. Criterion A için bu tür, emir kipini, sıra bağlaçlarını ve koşul ifadelerini ('If the light turns red, restart the device') doğru kullanmanı ister; kısa cümle demek basit dil demek değildir, çeşitliliği bağlaç ve koşul yapılarıyla sağlarsın."},{"x":"Çözümlü Model Örnek","t":"h"},{"x":"Güçlü bir yönerge modeli düşünelim: başlık amacı verir ('How to Start Composting at Home in Five Steps'). Kısa giriş sonucu vaat eder ('In under an hour you can turn kitchen waste into rich soil'). Malzeme listesi ön koşulları sıralar. Sonra numaralı adımlar mantıksal sırayla gelir: bir kap seç, tabana kuru malzeme koy, mutfak atıklarını ekle, düzenli karıştır, birkaç hafta bekle. Her adım tek eylemli ve nettir; her birine kısa bir gerekçe ya da ipucu eklenir ('Turn the pile weekly, as this speeds up decomposition'). Kapanışta bir uyarı ve bir 'sorun çıkarsa' notu bulunur. İşte üç kriteri karşılayan bir yönerge: net ve okur odaklı register (C), adımlar mantıkla sıralanıp geliştirilmiş (B), dil doğru ve amaca uygun çeşitli (A).","t":"p"},{"t":"h","x":"Yönergeyi Benzer Türlerden Ayırmak"},{"x":"Öğrenciler yönergeyi en çok raporla (report) ve blog/anlatıyla karıştırır. Rapor bir durumu inceler ve öneri sunar; yönerge ise bir işi nasıl yapacağını adım adım gösterir, analiz etmez. Bir 'nasıl yaptım' blogu ise kişisel anlatıdır ve birinci tekil şahısla geçmiş bir deneyimi paylaşır ('Last week I tried composting and...'); yönerge ise kişisel değildir, okura dönük ve emir kipindedir ('Add the waste...'). Aynı konu (örneğin kompost) blogda kişisel anlatılır, yönergede adım adım öğretilir. Görevde 'set of instructions', 'guidelines' ya da 'how to' ifadesini gördüğünde şu üçlüyü hatırla: sıralı adımlar, emir kipi ve okuru başarıya götüren netlik.","t":"p"},{"rows":[["Yönerge (Instructions)","İşi adım adım öğret","Numaralı adımlar, emir kipi, sıra bağlaçları"],["Rapor (Report)","Durumu incele, öneri sun","Başlıklı bölümler, bulgular + tavsiye"],["Blog / Anlatı","Kişisel deneyim paylaş","Birinci şahıs, geçmiş zaman, kişisel ses"]],"t":"table","head":["Tür","Amaç","Ayırt edici işaret"]},{"t":"h","x":"Adımları Eksiksiz ve Güvenli Kılmak"},{"t":"p","x":"Yönergede en çok kaybedilen puan eksik ya da belirsiz adımlardan gelir; bu Criterion B'yi (görevi tam yerine getirme) düşürür. Deneyimsiz bir yazar kendi bildiği için bazı adımları atlar ve okur o boşlukta takılır. Çözüm, her adımı okur hiçbir şey bilmiyormuş gibi yazmaktır: ön koşulları belirt, sıra bağlaçlarıyla akışı göster ve kritik noktalarda uyarı ekle. Güvenlik ve olası hatalar öne çıkarılmalıdır; bir tarifte 'fırını önceden ısıtın', bir cihazda 'fişi çekmeden temizlemeyin' gibi uyarılar okuru korur. Eksiksiz ve güvenli adımlar, yönergeyi gerçekten işleyen bir rehbere dönüştürür."},{"t":"p","x":"Adımları zenginleştirmenin yolu, her eyleme kısa bir gerekçe ya da beklenen sonuç eklemektir. Çıplak bir adım yalnızca ne yapılacağını söyler: 'Stir the mixture.' Zenginleştirilmiş bir adım nedenini ya da işaretini de verir: 'Stir the mixture until it thickens, which shows the sauce is ready.' Bu ek, okurun doğru yaptığını anlamasını sağlar ve güven verir. Ayrıca 'ipucu' ve 'uyarı' notları, sık yapılan hataları önceden engeller. Böylece yönerge yalnızca bir emir dizisi olmaktan çıkar, okuru anlayışla yönlendiren bir kılavuza dönüşür; bu incelik hem Criterion B hem Criterion C için değer taşır."},{"t":"h","x":"Yönerge Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"t":"p","x":"Yönerge yazmayı öğrenmek, bilgiyi net ve sıralı biçimde aktarma becerisidir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde talimat ve kılavuz metinleri çıkabilir; adım yapısını ve emir kipini tanıyan öğrenci, bir bilginin sırasını ve amacını hızla kavrar. Individual Oral'da ise bir süreci ya da görseli anlatırken yönergede kazandığın netlik ve sıralama işe yarar: karmaşık bir fikri adım adım, mantıklı bir düzende açıklarsın. Dinleyiciyi kaybetmeden, 'önce, sonra, en son' akışıyla düşünceni taşımak, hem konuşmayı hem yazmayı güçlendiren aktarılabilir bir beceridir."},{"t":"note","k":"ipucu","title":"Yönergede puan kazandıran küçük hamleler","lines":["Başlıkta amacı belirt: 'How to...' kalıbı işini kolaylaştırır.","Gerekli malzeme ya da ön koşulları baştan listele.","Adımları numaralandır; her adım tek bir eylemi anlatsın.","Emir kipi ve sıra bağlaçları kullan: First, Next, Then, Finally.","Kritik noktalarda uyarı ve ipucu ekle; okuru koru.","Belirsiz zamirlerden kaçın; neyin kastedildiği net olsun."]},{"x":"Sık yapılan hatalar yönergeyi zayıflatır. En büyüğü adım atlamaktır: yazarın bildiği için es geçtiği bir eylem, okuru süreç ortasında durdurur. İkincisi belirsizliktir: 'set it up' gibi muğlak talimatlar okuru ne yapacağı konusunda boşlukta bırakır. Üçüncüsü yanlış sıralamadır; adımlar mantıksal düzende gelmezse süreç bozulur. Dördüncüsü kişisel anlatıya kaymaktır: 'I usually add the sugar first' demek yönerge değil blog olur; okura dönük emir kipinde kal. Beşincisi uyarı ve güvenlik notlarını atlamaktır; kritik risk anlarını belirtmemek okuru hataya açık bırakır. Net, sıralı ve eksiksiz adımlar bu tuzakları önler.","t":"p"},{"x":"Kullanıcının Gözünden Yazmak","t":"h"},{"t":"p","x":"İyi bir yönerge, yazarın değil kullanıcının bakış açısıyla yazılır. Yazar süreci zaten bildiği için bazı adımları apaçık sayıp atlar; oysa okur o bilgiye sahip değildir ve atlanan her adımda takılır. Bu tuzaktan kurtulmanın yolu, yazarken kendini hiç deneyimi olmayan bir kullanıcının yerine koymaktır: 'Bu talimatı ilk kez okuyan biri, elinde yalnızca bu metinle bu işi tamamlayabilir mi?' Bu soru, örtük kalan varsayımları ortaya çıkarır. Bir adımda 'bağla' demek yetmez; neyi neye, nasıl bağlayacağını göstermek gerekir. Kullanıcının gözünden yazmak, yönergeyi gerçekten işleyen bir rehbere dönüştürür."},{"x":"Adımları görselleştirmek ve gruplamak netliği artırır. Uzun bir süreç, mantıklı aşamalara bölündüğünde daha kolay izlenir: 'Hazırlık', 'Kurulum', 'Kullanım' gibi alt başlıklar okura nerede olduğunu hatırlatır. Her adım tek bir eylem taşımalı; bir adıma iki üç iş sıkıştırmak okuru şaşırtır. Kritik anları öne çıkarmak da önemlidir: bir uyarıyı ('Warning') ya da ipucunu ('Tip') ayrı bir satırda vurgulamak, onu adım akışının içinde kaybolmaktan kurtarır. Sayılar, sıra bağlaçları ve kısa cümleler, sürecin görsel olarak da takip edilebilir olmasını sağlar; okur metne bakınca yolun haritasını görmelidir.","t":"p"},{"t":"p","x":"Yönergeyi tamamlayan şey, hata anlarını öngörmektir. Deneyimli bir kılavuz yalnızca doğru yolu göstermez; işler ters gittiğinde ne yapılacağını da söyler. 'If the light stays red, unplug the device and try again' gibi bir not, okuru bir çıkmazda yalnız bırakmaz. Aynı biçimde, bir adımın doğru yapıldığını gösteren işaretleri vermek ('the mixture should now be thick') okura güven verir ve devam edip etmeyeceğini bilmesini sağlar. Sık yapılan hataları önceden uyarmak ('do not add water yet') süreci kurtarır. Bu öngörülü notlar, yönergeyi bir emir dizisinden anlayışlı bir yardımcıya dönüştürür ve okurun başarıya ulaşma ihtimalini yükseltir."},{"x":"Temayı Yönerge Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda yönerge görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı öğretilebilir bir sürece dönüştürmektir. Örneğin 'Sharing the planet' teması altında sürdürülebilirlik verildiğinde, bunu soyut anlatmak yerine somut bir süreç kur: 'evde su tasarrufu için beş adım' gibi. Sonra ön koşulları belirt, adımları sırala ve her birine kısa gerekçe ekle. Aynı tema bir raporda incelenebilir, bir blogda kişisel anlatılabilirdi; yönerge merceği ise onu okurun izleyip uygulayabileceği net, sıralı adımlara indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin yönergeyi güvenle yazmanı sağlar; anahtar, konuyu 'nasıl yapılır' sorusuna çevirmektir.","t":"p"},{"x":"Zaman yönetimi yönergede yapıyı önceden kurmayı gerektirir. İlk beş dakikada süreci zihninde baştan sona işlet ve adımları mantıksal sırayla not et; hiçbir adımı atlamadığından emin ol. Ardından yaz ve son on dakikada her adımın tek eylemli, net ve doğru sırada olduğunu, uyarıların yerinde durduğunu ve register'ın baştan sona tutarlı kaldığını kontrol et. Değerlendiricinin gözünden yönerge, sıralı yapısı ve netliğiyle tanınır: Criterion C için numaralı düzen ve okur odaklı register, Criterion B için adımların eksiksiz ve mantıklı olması, Criterion A için emir kipi ve bağlaçların doğru kullanımı aranır. Kelime sınırlarını (SL için 250-400, HL için 450-600) ve tür beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net, doğrudan. Emir kipi (imperative)."], ["Yapı", "Başlık, gerekli malzemeler/ön koşullar, numaralı adımlar, ipuçları veya uyarılar."], ["Tipik özellikler", "Emir kipi (Take, Add, Do not), numaralı adımlar, sıra bağlaçları (First, Next, Finally), kısa net cümleler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir başlık yaz (How to ...).", "2. Gerekli malzemeleri/ön koşulları listele.", "3. Adımları mantıksal sıraya koy; her adım tek bir eylem olsun.", "4. Her adımı emir kipiyle başlat (Chop, Add, Press).", "5. Sıra bağlaçları kullan (First, Next, Then, Finally).", "6. Gerekirse bir ipucu veya uyarı ekle (Do not...).", "7. Son kontrol: başlık + malzemeler + numaralı adımlar + emir kipi var mı?"]}, {"t": "given", "title": "Birinci örnek (balkon bahçesi)", "x": "How to Start a Small Balcony Garden\n\nYou will need: two or three pots, potting soil, seeds, a small trowel and water.\n\n1. Choose a spot on your balcony that gets at least four hours of sunlight a day."}, {"t": "given", "title": "İkinci örnek (dijital, farklı bağlam)", "x": "How to Set Up Your New Email Account\n\nYou will need: a phone or computer, an internet connection and a strong password.\n\n1. First, open the app store and download the email app.\n2. Tap 'Create account' and enter your name and date of birth.\n3. Next, choose a username and a password of at least eight characters.\n4. Enter your phone number so the app can send a verification code.\n5. Type in the code when it arrives.\n6. Finally, add a profile photo if you wish, and tap 'Done'. Tip: never share your password with anyone."}, {"t": "wizard", "wt": "instructions", "ptitle": "Görev", "prompt": "Bir beceriyi (basit bir yemek, bir uygulamayı kurmak veya bir el işi) yeni başlayan birine öğreten bir yönerge yaz. Bir malzeme/ön koşul listesi ve numaralı adımlar kullan.", "target": 220, "check": ["Başlık ve gerekli malzemeler/ön koşullar listesi ekledim.", "Numaralı adımlar, emir kipi ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz; prompt'un istediği beceriyi kapsıyor (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (yönerge)", "x": "How to Make a Simple Turkish Menemen\n\nYou will need: three eggs, two tomatoes, one green pepper, a little olive oil, salt and a slice of bread to serve.\n\n1. First, wash the tomatoes and pepper. Chop the pepper into small pieces and grate or finely dice the tomatoes.\n\n2. Heat a little olive oil in a pan over medium heat. Add the pepper and cook for two to three minutes until it softens.\n\n3. Next, add the tomatoes and a pinch of salt. Let the mixture simmer for about five minutes, stirring now and then, until most of the liquid has gone.\n\n4. Crack the eggs directly into the pan. Do not stir straight away; wait a few seconds, then gently fold them into the tomato mixture.\n\n5. Cook for another minute or two, until the eggs are just set but still soft.\n\n6. Finally, serve hot with fresh bread. Tip: do not overcook the eggs, or the dish will become dry."}}, {"t": "note", "k": "ipucu", "title": "Netlik", "lines": ["Her adım tek bir eylem olsun ve emir kipiyle başlasın (Chop, Add, Serve).", "Sıra bağlaçları (First, Next, Finally) ve bir malzeme listesi Criterion C'yi güçlendirir."]}]}, {"id": "t-essay", "group": "Profesyonel", "name": "Deneme (Essay, SL)", "eyebrow": "Metin Türü", "blocks": [{"x":"Deneme Nedir ve Ne Zaman Karşına Çıkar?","t":"h"},{"t":"p","x":"Deneme (essay), bir soruyu ya da konuyu akademik, dengeli ve mantıklı paragraflarla tartışan bir metin türüdür. SL öğrencilerinin karşısına çıkan bu tür, çoğu zaman 'Do you agree?' ya da 'Discuss...' biçiminde bir soruya yanıt olarak yazılır ve okuru bir görüşe akıl yürütmeyle götürür. Paper 1'de birçok prescribed theme'e bağlanır: 'Identities' altında kimlik ve gençlik, 'Human ingenuity' altında teknolojinin etkisi, 'Sharing the planet' altında çevre ve toplum konuları deneme için idealdir. Denemenin özü, kişisel bir günlük ya da renkli bir makale değil, fikirlerin gerekçelerle desteklendiği ve mantıklı bir sonuca bağlandığı düşünsel bir tartışmadır."},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Denemenin kitlesi eğitimli, düşünmeye açık bir okurdur: bir öğretmen, bir sınav okuyucusu ya da genel bir akademik okur. Amaç bir soruyu tartışmak ve gerekçelerle bir sonuca varmaktır; bilgilendirmek ya da eğlendirmek değil, akıl yürütmektir. Register resmidir: üçüncü şahıs ağırlıklıdır, ton nesnel ve ölçülüdür, kısaltma ve argo kullanılmaz. Birinci tekil şahıs sınırlı ve ölçülü kullanılabilir ('In my view'), ama deneme kişisel bir anlatıya dönüşmez. Bu akademik ton, denemeyi makaleden (daha renkli) ve blogdan (daha samimi) ayırır; deneme fikirlerin ciddiyetle tartıldığı bir alandır."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Denemenin imzası mantıksal paragraf yapısıdır; makalenin aksine alt başlık kullanmaz, düşünce paragraflarla akar. Giriş konuyu tanıtır ve çoğu zaman bir tez ya da yönlendirici cümle içerir ('This essay will consider whether social media does more harm than good'). Gövde birkaç paragraftan oluşur ve her paragraf tek bir ana fikri işler: bir iddia, onu destekleyen gerekçe ve örnek. Dengeli bir deneme karşı görüşe de yer verir ('However, others argue that...'). Sonuç paragrafı tartışmayı toparlar ve gerekçelere dayalı net bir duruş sunar. Bu 'giriş, gerekçeli gövde, dengeli tartışma, sonuç' akışı denemenin görünmez ama sağlam iskeletidir."},{"x":"Denemenin kalbi tez ile onu destekleyen mantık zinciridir. Giriş yalnızca konuyu duyurmaz, bir yön belirtir: okuyucu denemenin nereye gittiğini baştan sezmelidir. Her gövde paragrafı bir konu cümlesiyle açılır, iddiayı bir gerekçeyle açıklar ve bir örnekle somutlaştırır. Zayıf bir deneme fikirleri sıralar ama bağlamaz; güçlü bir deneme
