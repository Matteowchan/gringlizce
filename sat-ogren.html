t is' kısaltması gerekli.  C — 'there' zarftır, iyelik değildir.  D — 'they're' = 'they are'; 'effect' ismini nitеleyemez.","ans":"A"}]}]},{"id":"g32","name":"Concision & Redundancy","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Concision & Redundancy. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"n":1,"choices":{"D":"absolutely unique and original","C":"unique and special in its own way","A":"completely unique and one-of-a-kind","B":"unique"},"ans":"B","stem":"The new bridge is a completely unique and one-of-a-kind structure that has never been seen before in this region.  Which choice is most concise and avoids redundancy?","slug":"gri-mod-sat-g32-1-1","why":"B doğrudur. 'Unique' zaten tek bir türde olduğunu ifade eder. 'Completely unique,' 'one-of-a-kind' ile birlikte kullanmak gereksiz tekrardır (redundancy).  A — 'completely unique' ve 'one-of-a-kind' aynı fikri tekrar eder.  C — 'special in its own way' 'unique'e hiçbir şey katmaz.  D — 'absolutely unique' da gereksiz tekrardır."},{"choices":{"C":"final decision","D":"conclusive and decisive final decision","A":"final decision that was conclusive","B":"final and conclusive decision"},"n":2,"slug":"gri-mod-sat-g32-1-2","why":"C doğrudur. 'Final decision' yeterlidir. 'Conclusive' ve 'decisive' sözcükleri 'final' ile örtüşür.  A — 'final' ve 'conclusive' gereksiz tekrardır.  B — 'final and conclusive' hâlâ tekrar eder.  D — üç örtüşen niteleyici kullanır; çok gereksiz.","stem":"The committee made a final decision that was conclusive regarding the proposed changes.  Which is most concise?","ans":"C"},{"stem":"The author returned back to the theme of isolation in the novel's final chapter.  Which choice eliminates the redundancy?","slug":"gri-mod-sat-g32-1-3","why":"D doğrudur. 'Return' zaten 'geri dönmek' demektir; 'back' gereksiz tekrardır (redundancy).  A — 'returned back' gereksiz tekrardır.  B — 'again' ekleyerek gereksizliği artırır.  C — 'went back and returned' aynı eylemi iki kez söyler.","ans":"D","choices":{"D":"returned","C":"went back and returned","A":"returned back","B":"returned back again"},"n":3},{"slug":"gri-mod-sat-g32-1-4","why":"A doğrudur. 'Reiterate' zaten 'tekrar söylemek' demektir; 'again' gereksizdir.  B — 'reiterated again' = 'said again again.'  C — 'reiterated and repeated' iki eşanlamlı fiil kullanır.  D — aynı sorun, daha uzun.","stem":"The manager reiterated again the importance of meeting the Friday deadline.  Which choice is most concise?","ans":"A","choices":{"D":"said again and reiterated","C":"reiterated and repeated","B":"reiterated again","A":"reiterated"},"n":4},{"n":5,"choices":{"C":"short and brief","D":"brief","A":"brief in length","B":"brief and short in length"},"ans":"D","stem":"The report was brief in length but comprehensive in its coverage of the subject.  Which is most concise?","why":"D doğrudur. 'Brief' zaten kısalığı ifade eder; 'in length' ima edilmiştir.  A — 'in length' 'brief' ile tekrar eder.  B — gereksizlik katlanır.  C — 'short and brief' neredeyse eşanlamlıdır.","slug":"gri-mod-sat-g32-1-5"},{"ans":"A","stem":"The excavation team discovered an ancient relic that was very old buried beneath the ruins.  Which is most concise?","slug":"gri-mod-sat-g32-1-6","why":"A doğrudur. 'Ancient' zaten çok eski olduğunu söyler; 'very old' tekrar eder.  B — 'ancient' ve 'very old' örtüşür.  C — aynı sorun, farklı sıra.  D — 'from long ago' 'ancient'e hiçbir şey katmaz.","n":6,"choices":{"C":"very old and ancient relic","D":"old, ancient relic from long ago","B":"ancient relic that was very old","A":"ancient relic"}},{"ans":"A","why":"A doğrudur. 'Implemented' ve 'put into effect' eşanlamlıdır; biri yeterlidir.  B — iki eşanlamlı ifade aynı eylemi anlatır.  C — 'made active' üçüncü bir eşanlamlı ekler.  D — 'enacted into implementation' hem garip hem gereksizdir.","slug":"gri-mod-sat-g32-1-7","stem":"The policy was implemented and put into effect during the third quarter of the fiscal year.  Which is most concise?","n":7,"choices":{"D":"enacted into implementation","C":"put into effect and made active","B":"implemented and put into effect","A":"implemented"}},{"n":8,"choices":{"D":"easy to operate and user-oriented","C":"user-friendly","A":"easy to use and user-friendly","B":"simple, easy, and user-friendly"},"ans":"C","stem":"The new software is easy to use and user-friendly, making it accessible to all employees.  Which is most concise?","why":"C doğrudur. 'User-friendly' ve 'easy to use' aynı fikri ifade eder; biri yeterlidir.  A — iki eşanlamlı ifade.  B — üç örtüşen niteleyici.  D — 'easy to operate' ve 'user-oriented' hâlâ örtüşür.","slug":"gri-mod-sat-g32-1-8"},{"n":9,"choices":{"A":"rejected and turned down","B":"rejected, declined, and turned down","D":"rejected","C":"not accepted and turned down"},"ans":"D","stem":"The proposal was rejected and turned down by the committee without discussion.  Which is most concise?","slug":"gri-mod-sat-g32-1-9","why":"D doğrudur. 'Rejected' ve 'turned down' eşanlamlıdır; biri yeterlidir.  A — aynı eylem için iki sözcük.  B — üç eşanlamlı sözcük.  C — 'not accepted' ve 'turned down' hâlâ eşanlamlıdır."},{"ans":"A","why":"A doğrudur. 'Cooperate' zaten birlikte çalışmayı ifade eder; 'together' gereksizdir.  B — 'together' 'cooperate' ile tekrar eder.  C — gereksizlik katlanır.  D — 'in cooperation' 'cooperated' ile tekrar eder.","stem":"The athlete cooperated together with her teammates to develop a new game strategy.  Which is most concise?","n":10,"choices":{"B":"cooperated together","A":"cooperated","C":"cooperated with each other together","D":"worked together in cooperation"},"slug":"gri-mod-sat-g32-1-10"},{"ans":"D","why":"D doğrudur. 'Written document' yeterlidir; 'in writing' 'written' ile tekrar eder.  A — 'written' ve 'in writing' gereksiz tekrardır.  B — 'in written form' hâlâ tekrar eder.  C — 'in writing' yine tekrar eder.","slug":"gri-mod-sat-g32-1-11","stem":"The judge issued a written document in writing explaining the court's decision.  Which is most concise?","n":11,"choices":{"B":"document in written form","A":"written document in writing","C":"written statement in writing","D":"written document"}},{"ans":"B","slug":"gri-mod-sat-g32-1-12","why":"B doğrudur. 'Began' başlamayı zaten ifade eder; 'first' ve 'initially' gereksizdir.  A — 'first' 'began' ile tekrar eder.  C — hem 'first' hem 'initially' ekler.  D — 'started to begin' döngüsel ve gereksizdir.","stem":"The candidate first began her political career at the local level before advancing to the national stage.  Which is most concise?","n":12,"choices":{"C":"first began initially","D":"started to begin","A":"first began","B":"began"}},{"choices":{"D":"unexpected surprises that were not anticipated","C":"surprises","B":"surprising and unexpected results","A":"unexpected surprises"},"n":13,"stem":"The results were unexpected surprises that forced the team to reconsider its approach.  Which is most concise?","slug":"gri-mod-sat-g32-1-13","why":"C doğrudur. Sürpriz tanımı gereği beklenmedik bir şeydir; 'unexpected surprises' gereksiz tekrardır.  A — 'unexpected' 'surprise'ın zaten içindedir.  B — 'surprising and unexpected' eşanlamlıdır.  D — üçüncü gereksiz unsur ekler.","ans":"C"},{"stem":"The architect personally supervised the work himself throughout the construction process.  Which is most concise?","slug":"gri-mod-sat-g32-1-14","why":"B doğrudur. 'Personally' ve 'himself' ikisi de bizzat yapıldığını belirtir; biri yeterlidir.  A — 'personally' ve 'himself' birlikte gereksiz tekrardır.  C — aynı sorun.  D — 'oversaw and supervised' eşanlamlı iki fiildir.","ans":"B","choices":{"B":"personally supervised","A":"personally supervised the work himself","D":"oversaw and supervised personally","C":"supervised himself personally"},"n":14},{"choices":{"D":"conclusive and decisive proof","C":"proof that conclusively proved","B":"conclusive evidence","A":"conclusive proof that proved"},"n":15,"stem":"The laboratory's findings were conclusive proof that proved the hypothesis correct.  Which is most concise?","slug":"gri-mod-sat-g32-1-15","why":"B doğrudur. 'Conclusive evidence' anlam kaybı olmadan ifade eder. 'Proof' ve 'proved,' 'conclusive' ve 'conclusively' çift gereksiz tekrar yaratır.  A — 'proof' ve 'proved' aynı fikri tekrar eder.  C — hâlâ 'proof' ve 'conclusively proved' tekrar eder.  D — 'conclusive and decisive' neredeyse eşanlamlıdır.","ans":"B"},{"choices":{"A":"joined together","B":"merged together","D":"brought together and merged","C":"joined"},"n":16,"stem":"The merger joined together two of the largest firms in the pharmaceutical industry.  Which is most concise?","slug":"gri-mod-sat-g32-1-16","why":"C doğrudur. 'Joined' birleşmeyi ifade eder; 'together' gereksizdir.  A — 'together' 'joined' ile tekrar eder.  B — 'merged together' da gereksizdir ('merge' birleşmeyi ima eder).  D — iki eşanlamlı ifade kullanır.","ans":"C"},{"stem":"The city council voted to postpone the event until a later date.  Which is most concise?","why":"C doğrudur. 'Postpone' zaten daha ileri bir tarihe ertelemek demektir; 'until a later date' gereksizdir.  A — 'until a later date' 'postpone' ile tekrar eder.  B — 'to a future time' 'delay' ile tekrar eder.  D — 'put off and postpone' iki eşanlamlı fiildir.","slug":"gri-mod-sat-g32-1-17","ans":"C","choices":{"A":"postpone the event until a later date","B":"delay the event to a future time","D":"put off and postpone the event","C":"postpone the event"},"n":17},{"choices":{"C":"confusing","D":"hard to follow and confusing to understand","A":"confusing and hard to understand","B":"unclear and difficult to comprehend"},"n":18,"stem":"The instructions were confusing and hard to understand, leading to widespread errors.  Which is most concise?","slug":"gri-mod-sat-g32-1-18","why":"C doğrudur. 'Confusing' zaten anlaşılmasının zor olduğunu söyler.  A — iki eşanlamlı ifade.  B — 'unclear' ve 'difficult to comprehend' eşanlamlıdır.  D — gereksizlik katlanır.","ans":"C"},{"n":19,"choices":{"B":"convened global leaders together","A":"brought together leaders from around the world globally","D":"brought together leaders from around the world","C":"assembled and brought together global leaders"},"ans":"D","stem":"The summit brought together leaders from around the world globally to address climate change.  Which is most concise?","slug":"gri-mod-sat-g32-1-19","why":"D doğrudur. 'From around the world' ifadesi 'globally'yi gereksiz kılar.  A — 'globally' 'from around the world' ile tekrar eder.  B — 'convened' ve 'together' hafif gereksizdir.  C — 'assembled and brought together' eşanlamlıdır."},{"choices":{"D":"artifacts of a historical nature","C":"historical artifacts in nature","A":"artifacts that were historical in nature","B":"historical artifacts"},"n":20,"why":"B doğrudur. 'Historical artifacts' doğrudan ve kısadır; 'in nature' ve 'that were' anlam katmaz.  A — 'in nature' 'historical artifacts'a anlam katmaz.  C — 'in nature' hâlâ gereksizdir.  D — 'of a historical nature' uzun; 'historical' tek başına yeterlidir.","stem":"The museum exhibit showcased artifacts that were historical in nature from the Bronze Age.  Which is most concise?","ans":"B","slug":"gri-mod-sat-g32-1-20"},{"choices":{"D":"have an impact on and affect","C":"impact and affect","A":"affect","B":"affect and have an impact on"},"n":21,"why":"A doğrudur. 'Affect' ve 'have an impact on' eşanlamlıdır; tek fiil yeterlidir.  B — iki eşanlamlı fiil öbeği.  C — hâlâ iki eşanlamlı terim.  D — aynı gereksizlik, farklı sıra.","slug":"gri-mod-sat-g32-1-21","stem":"The new regulation will affect and have an impact on all licensed healthcare providers in the state.  Which is most concise?","ans":"A"},{"ans":"B","stem":"The study's end result was a conclusion that higher temperatures significantly reduce crop yields.  Which is most concise?","why":"B doğrudur. 'Conclusion was' araştırma bulgusunu ifade etmek için en uygun ve kısadır.  A — 'end result' ve 'conclusion' örtüşür.  C — 'result was' biraz daha iyidir ama araştırma için 'conclusion' daha kesindir.  D — 'end result and final conclusion' gereksizlikleri üst üste koyar.","slug":"gri-mod-sat-g32-1-22","n":22,"choices":{"A":"end result was a conclusion","B":"conclusion was","C":"result was","D":"end result and final conclusion were"}},{"ans":"A","stem":"The witness described events that occurred at that point in time when the suspect left the building.  Which is most concise?","why":"A doğrudur. 'Occurred then' en kısasıdır: 'at that point in time' = 'then.'  B — 'at that point in time' dört sözcük, bir sözcük yeterli.  C — 'at that time' daha iyi ama hâlâ 'then'den uzun.  D — 'specific point in time' gereksizliği artırır.","slug":"gri-mod-sat-g32-1-23","n":23,"choices":{"D":"happened at that specific point in time","C":"occurred at that time","A":"occurred then","B":"occurred at that point in time"}},{"slug":"gri-mod-sat-g32-1-24","why":"A doğrudur. 'Innovation' tanımı gereği yeni bir şeydir; 'new innovation' gereksiz tekrardır.  B — 'new' 'innovation'ın zaten içindedir.  C — 'recent new' gereksizliği artırır.  D — 'novel,' 'innovative,' ve 'new' aynı şeyi üç kez söyler.","stem":"The engineer proposed a new innovation that would reduce the plant's energy consumption by thirty percent.  Which is most concise?","ans":"A","choices":{"C":"recent new innovation","D":"novel and innovative new idea","B":"new innovation","A":"innovation"},"n":24},{"slug":"gri-mod-sat-g32-1-25","why":"D doğrudur. 'Agreed' tek başına yeterlidir. 'Mutually' ve 'with each other' ikisi de iki taraflılığı ifade eder; her ikisi de gereksizdir.  A — üç gereksiz unsur üst üste.  B — 'mutually agreed' hâlâ 'mutually' gereksizdir.  C — 'agreed with each other mutually' en uzun ve en gereksiz form.","stem":"The two companies mutually agreed with each other to dissolve the partnership by the end of the fiscal year.  Which is most concise?","ans":"D","choices":{"B":"mutually agreed","A":"mutually agreed with each other","D":"agreed","C":"agreed with each other mutually"},"n":25}],"t":"mcqquiz"}],"group":"Dilbilgisi","eyebrow":"Gramer"},{"id":"g33","group":"Dilbilgisi","name":"Nonrestrictive vs Restrictive Elements","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Nonrestrictive vs Restrictive Elements. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"ans":"C","slug":"gri-mod-sat-g33-1-1","why":"C doğrudur. 'Who discovered the compound' kısıtlayıcı (restrictive) bir yan cümledir — hangi bilim insanını kast ettiğimizi belirtir. Kısıtlayıcı yan cümleler virgül almaz.  A — virgüller cümleyi kısıtlayıcı olmayan (nonrestrictive) yapar; anlam değişir.  B — 'that' ve iç virgül yanlıştır.  D — iki nokta ilgi yan cümlesi başlatamaz.","stem":"The scientist who discovered the compound was awarded the Nobel Prize.  Which punctuation is correct for the underlined clause?","n":1,"choices":{"C":"The scientist who discovered the compound was awarded","D":"The scientist: who discovered the compound, was awarded","B":"The scientist that, discovered the compound, was awarded","A":"The scientist, who discovered the compound, was awarded"}},{"choices":{"B":"The report that was submitted last Tuesday, contained","A":"The report which was submitted last Tuesday contained","C":"The report, that was submitted last Tuesday, contained","D":"The report, which was submitted last Tuesday, contained"},"n":2,"stem":"The report, which was submitted last Tuesday, contained three major errors.  Which choice correctly punctuates the underlined clause?","why":"D doğrudur. 'Which was submitted last Tuesday' kısıtlayıcı olmayan (nonrestrictive) bir yan cümledir — tek raporla ilgili ek bilgi verir. Nonrestrictive yan cümleler 'which' ile yazılır ve virgülle ayrılır.  A — virgüllerin olmaması nonrestrictive cümleyi kısıtlayıcı gibi gösterir.  B — 'that' kısıtlayıcı yan cümle için kullanılır; virgülle uyumsuz.  C — 'that' nonrestrictive (virgüllü) yan cümlelerde kullanılmaz.","slug":"gri-mod-sat-g33-1-2","ans":"D"},{"why":"D doğrudur. 'Who fails to submit the assignment' kısıtlayıcıdır — sıfırı kimin alacağını tanımlar. Virgül yok.  A — virgüller cümleyi nonrestrictive yapar; tüm öğrencilerin ödevi vermediği anlamına gelir.  B — 'that' ve virgül yanlıştır.  C — 'who'dan sonra yanlış yere virgül.","slug":"gri-mod-sat-g33-1-3","stem":"Any student who fails to submit the assignment will receive a zero for that component.  Which choice is correct?","ans":"D","choices":{"A":"Any student, who fails to submit the assignment, will","B":"Any student, that fails to submit the assignment, will","D":"Any student who fails to submit the assignment will","C":"Any student who, fails to submit the assignment, will"},"n":3},{"slug":"gri-mod-sat-g33-1-4","why":"C doğrudur. 'The department chair' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive) — Dr. Reyes hakkında ek bilgi verir. Her iki yanı virgülle ayrılır.  A — virgül yok; appositive kapatılmamış.  B — yalnızca açılış virgülü; kapanış eksik.  D — tire açıyor ama kapanış noktalama işareti yok.","stem":"Dr. Reyes, the department chair, announced the new curriculum changes at Monday's faculty meeting.  Which choice correctly handles the underlined appositive?","ans":"C","choices":{"D":"Dr. Reyes — the department chair announced","C":"Dr. Reyes, the department chair, announced","A":"Dr. Reyes the department chair announced","B":"Dr. Reyes, the department chair announced"},"n":4},{"ans":"A","stem":"The book that won the Booker Prize sold three million copies within its first year of publication.  Which choice is correct?","why":"A doğrudur. 'That won the Booker Prize' kısıtlayıcıdır — hangi kitap olduğunu tanımlar. Virgül yok, 'that' kullanılır.  B — 'that' ve virgül yanlıştır.  C — 'which' ve virgüller cümleyi nonrestrictive yapar.  D — 'which' virgülsüz SAT'ta standart değildir.","n":5,"choices":{"A":"The book that won the Booker Prize sold","B":"The book, that won the Booker Prize, sold","C":"The book, which won the Booker Prize, sold","D":"The book which won the Booker Prize sold"},"slug":"gri-mod-sat-g33-1-5"},{"choices":{"C":"proposals, which were submitted before the deadline,","D":"proposals which were submitted before the deadline,","B":"proposals, that were submitted before the deadline","A":"proposals that were submitted before the deadline"},"n":6,"why":"A doğrudur. 'That were submitted before the deadline' kısıtlayıcıdır — hangi teklifler olduğunu belirtir. Virgül yok, 'that' kullanılır.  B — 'that'ten önce virgül kısıtlayıcı yan cümlede yanlıştır.  C — 'which' ve virgüller nonrestrictive yapar.  D — açılış virgülü olmadan kapanış virgülü dengesizdir.","stem":"The committee reviewed the proposals that were submitted before the deadline.  Which choice correctly punctuates this?","ans":"A","slug":"gri-mod-sat-g33-1-6"},{"why":"D doğrudur. Elena belirli, adlandırılmış bir kişidir — 'who has worked here for twenty years' kısıtlayıcı olmayan ek bilgidir. 'Who' ve virgüller kullanılır.  A — virgüllerin olmaması nonrestrictive cümleyi kısıtlayıcı gibi gösterir.  B — 'that' ve virgül yanlıştır.  C — noktalı virgül ilgi yan cümlesi başlatamaz.","stem":"My colleague Elena, who has worked here for twenty years, will be retiring at the end of the month.  Which choice is correct?","ans":"D","choices":{"C":"My colleague Elena; who has worked here for twenty years, will","D":"My colleague Elena, who has worked here for twenty years, will","B":"My colleague Elena that has worked here for twenty years, will","A":"My colleague Elena who has worked here for twenty years will"},"n":7,"slug":"gri-mod-sat-g33-1-7"},{"ans":"C","stem":"The regulation applies only to companies that employ more than fifty people.  Which choice is correct?","why":"C doğrudur. 'That employ more than fifty people' kısıtlayıcıdır — hangi şirketlere uygulandığını belirtir. Virgül yok, 'that' kullanılır.  A — 'that'ten önce virgül yanlıştır.  B — 'which' ve virgüller nonrestrictive yapar.  D — 'which' virgülsüz SAT'ta standart değildir.","n":8,"choices":{"B":"companies, which employ more than fifty people,","A":"companies, that employ more than fifty people","C":"companies that employ more than fifty people","D":"companies which employ more than fifty people,"},"slug":"gri-mod-sat-g33-1-8"},{"n":9,"choices":{"A":"The Eiffel Tower which was completed in 1889 was","B":"The Eiffel Tower that was completed in 1889, was","D":"The Eiffel Tower — which was completed in 1889 was","C":"The Eiffel Tower, which was completed in 1889, was"},"ans":"C","stem":"The Eiffel Tower, which was completed in 1889, was originally intended as a temporary structure.  Which choice is correct?","slug":"gri-mod-sat-g33-1-9","why":"C doğrudur. Eyfel Kulesi benzersiz bir yapıdır; bu yan cümle ekstra bilgi verir (nonrestrictive). 'Which' ve virgüller doğrudur.  A — virgüller yok; nonrestrictive cümle kapatılmamış.  B — 'that' kısıtlayıcı için; yanlış yerde virgül.  D — tire açıyor ama kapanış noktalama yok."},{"stem":"Students who study consistently throughout the semester tend to perform better on final examinations.  Which choice is correct?","slug":"gri-mod-sat-g33-1-10","why":"A doğrudur. 'Who study consistently throughout the semester' kısıtlayıcıdır — tüm öğrenciler değil, yalnızca düzenli çalışanlar kastediliyor. Virgül yok.  B — virgüller nonrestrictive yapar; tüm öğrencilerin düzenli çalıştığı anlamı çıkar.  C — 'that' ve virgül yanlıştır.  D — 'who'dan sonra yanlış yere virgül.","ans":"A","choices":{"B":"Students, who study consistently throughout the semester, tend","A":"Students who study consistently throughout the semester tend","C":"Students, that study consistently throughout the semester, tend","D":"Students who, study consistently throughout the semester, tend"},"n":10},{"choices":{"D":"The new tax policy introduced by the finance ministry in March, has","C":"The new tax policy, that was introduced by the finance ministry in March has","B":"The new tax policy introduced by the finance ministry in March has","A":"The new tax policy, introduced by the finance ministry in March, has"},"n":11,"why":"A doğrudur. 'Introduced by the finance ministry in March' kısıtlayıcı olmayan bir katılımcı öbektir (participial phrase) — politika hakkında ek bilgi verir. Her iki yanı virgülle ayrılır.  B — virgüller yok; nonrestrictive öbek kapatılmamış.  C — 'that' ve kapanış virgülü eksik.  D — yalnızca kapanış virgülü; açılış eksik.","slug":"gri-mod-sat-g33-1-11","stem":"The new tax policy, introduced by the finance ministry in March, has faced significant public opposition.  Which choice is correct?","ans":"A"},{"ans":"B","stem":"The only candidate who submitted all required documentation was selected for the final interview.  Which choice is correct?","why":"B doğrudur. 'Who submitted all required documentation' kısıtlayıcıdır — hangi aday olduğunu belirtir. Virgül yok.  A — virgüller nonrestrictive yapar; anlam değişir.  C — 'that' ve iç virgül yanlıştır.  D — 'that' ve virgüller yanlıştır.","slug":"gri-mod-sat-g33-1-12","n":12,"choices":{"D":"The only candidate, that submitted all required documentation, was","C":"The only candidate that, submitted all required documentation, was","A":"The only candidate, who submitted all required documentation, was","B":"The only candidate who submitted all required documentation was"}},{"n":13,"choices":{"D":"book, a study of postcolonial literature, has","C":"book — a study of postcolonial literature has","B":"book, a study of postcolonial literature has","A":"book a study of postcolonial literature has"},"ans":"D","stem":"The professor's latest book, a study of postcolonial literature, has received widespread critical acclaim.  Which choice is correct?","why":"D doğrudur. 'A study of postcolonial literature' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive). Her iki yanı virgülle ayrılır.  A — virgül yok; appositive kapatılmamış.  B — yalnızca açılış virgülü; kapanış eksik.  C — tire açıyor ama kapanış noktalama yok.","slug":"gri-mod-sat-g33-1-13"},{"ans":"A","why":"A doğrudur. 'That the senate passed in June' kısıtlayıcıdır — hangi yasa olduğunu belirtir. Virgül yok, 'that' kullanılır.  B — 'that' ve virgüller yanlıştır.  C — 'which' ve virgüller nonrestrictive yapar.  D — 'which' virgülsüz SAT'ta standart değildir.","stem":"The legislation that the senate passed in June will take effect on January first.  Which choice is correct?","n":14,"choices":{"A":"legislation that the senate passed in June","B":"legislation, that the senate passed in June,","C":"legislation, which the senate passed in June,","D":"legislation which the senate passed in June"},"slug":"gri-mod-sat-g33-1-14"},{"slug":"gri-mod-sat-g33-1-15","why":"B doğrudur. 'Published in 2003' kısıtlayıcı olmayan bir katılımcı öbektir — yalnızca bir 'ilk roman' var. Her iki yanı virgülle ayrılır.  A — virgüller yok.  C — açılış virgülü var ama kapanış eksik.  D — tire ve kapanış eksik.","stem":"Her first novel, published in 2003, established her reputation as one of the decade's most innovative writers.  Which choice is correct?","ans":"B","choices":{"D":"Her first novel — published in 2003 established","C":"Her first novel, published in 2003 established","B":"Her first novel, published in 2003, established","A":"Her first novel published in 2003 established"},"n":15},{"choices":{"C":"All employees, that have completed the training, are","D":"All employees who, have completed the training, are","B":"All employees who have completed the training are","A":"All employees, who have completed the training, are"},"n":16,"stem":"All employees who have completed the training are eligible to apply for the new positions.  Which choice is correct?","why":"B doğrudur. 'Who have completed the training' kısıtlayıcıdır — hangi çalışanların başvurabileceğini belirtir. Virgül yok.  A — virgüller nonrestrictive yapar; tüm çalışanların eğitimi tamamladığı anlamı çıkar.  C — 'that' ve virgüller yanlıştır.  D — 'who'dan sonra yanlış yere virgül.","slug":"gri-mod-sat-g33-1-16","ans":"B"},{"stem":"The treaty, signed by twelve nations in 1987, has been credited with significantly reducing ozone depletion.  Which choice correctly handles the underlined phrase?","why":"B doğrudur. 'Signed by twelve nations in 1987' kısıtlayıcı olmayan bir katılımcı öbektir. Her iki yanı virgülle ayrılır.  A — virgüller yok.  C — kapanış virgülü eksik.  D — açılış virgülü öbekin içinde — dengesiz.","slug":"gri-mod-sat-g33-1-17","ans":"B","choices":{"A":"treaty signed by twelve nations in 1987 has","B":"treaty, signed by twelve nations in 1987, has","D":"treaty signed, by twelve nations in 1987, has","C":"treaty, signed by twelve nations in 1987 has"},"n":17},{"n":18,"choices":{"C":"first researcher, to isolate the protein was","D":"first researcher that, to isolate the protein, was","B":"first researcher to isolate the protein was","A":"first researcher, to isolate the protein, was"},"ans":"B","why":"B doğrudur. 'To isolate the protein' kısıtlayıcı bir mastar öbeğidir (infinitive phrase) — hangi araştırmacı olduğunu tanımlar. Virgül yok.  A — virgüller nonrestrictive yapar.  C — açılış virgülü var ama kapanış eksik.  D — 'that' ve virgüller yanlıştır.","stem":"The first researcher to isolate the protein was a graduate student working independently.  Which choice is correct?","slug":"gri-mod-sat-g33-1-18"},{"ans":"C","stem":"The firm hired three consultants, all of whom had expertise in regulatory compliance, to review the contract.  Which choice is correct?","slug":"gri-mod-sat-g33-1-19","why":"C doğrudur. 'All of whom had expertise in regulatory compliance' kısıtlayıcı olmayan ilgi yan cümlesidir ve çevreleyen virgüllerle doğru şekilde kapatılmıştır.  A — ek iç virgül yanlıştır.  B — 'them' yerine 'whom' kullanılmalı.  D — 'each' toplu anlamı değiştirir; sondaki virgül yanlış yerde.","n":19,"choices":{"C":"all of whom had expertise in regulatory compliance","D":"each of whom had expertise in regulatory compliance,","A":"all of whom, had expertise in regulatory compliance","B":"all of them had expertise in regulatory compliance"}},{"choices":{"B":"student whose essay demonstrates the most original thinking","A":"student, whose essay demonstrates the most original thinking,","C":"student, that's essay demonstrates the most original thinking,","D":"student whose, essay demonstrates the most original thinking,"},"n":20,"stem":"The award goes to the student whose essay demonstrates the most original thinking.  Which choice is correct?","why":"B doğrudur. 'Whose essay demonstrates the most original thinking' kısıtlayıcıdır — ödülü kimin alacağını belirtir. Virgül yok.  A — virgüller nonrestrictive yapar.  C — 'that's' iyelik ilgi zamiri değildir.  D — 'whose'dan sonra yanlış yere virgül.","slug":"gri-mod-sat-g33-1-20","ans":"B"},{"n":21,"choices":{"D":"hub designed, by a Pritzker Prize-winning architect, is","C":"hub, designed by a Pritzker Prize-winning architect is","A":"hub, designed by a Pritzker Prize-winning architect, is","B":"hub designed by a Pritzker Prize-winning architect is"},"ans":"A","stem":"The city's new transportation hub, designed by a Pritzker Prize-winning architect, is expected to open next spring.  Which choice is correct?","why":"A doğrudur. 'Designed by a Pritzker Prize-winning architect' kısıtlayıcı olmayan bir katılımcı öbektir. Her iki yanı virgülle ayrılır.  B — virgüller yok.  C — kapanış virgülü eksik.  D — virgüller öbeğin içinde — dengesiz.","slug":"gri-mod-sat-g33-1-21"},{"n":22,"choices":{"D":"gene that regulates cell division was","C":"gene which regulates cell division was","B":"gene, which regulates cell division, was","A":"gene, that regulates cell division, was"},"ans":"D","slug":"gri-mod-sat-g33-1-22","why":"D doğrudur. 'That regulates cell division' kısıtlayıcıdır — hangi gen olduğunu belirtir. Virgül yok, 'that' kullanılır.  A — 'that' ve virgüller yanlıştır.  B — 'which' ve virgüller nonrestrictive yapar.  C — 'which' virgülsüz SAT'ta standart değildir.","stem":"The gene that regulates cell division was identified by the research team after five years of study.  Which choice is correct?"},{"n":23,"choices":{"D":"medication which has been approved for this condition is","C":"medication, which has been approved for this condition, is","A":"medication that has been approved for this condition is","B":"medication, that has been approved for this condition, is"},"ans":"A","slug":"gri-mod-sat-g33-1-23","why":"A doğrudur. 'That has been approved for this condition' kısıtlayıcıdır — hangi ilaç olduğunu belirtir. Virgül yok, 'that' kullanılır.  B — 'that' ve virgüller yanlıştır.  C — 'which' ve virgüller nonrestrictive yapar.  D — 'which' virgülsüz SAT'ta standart değildir.","stem":"The only medication that has been approved for this condition is currently in short supply.  Which choice is correct?"},{"ans":"C","stem":"Her mentor, Professor Williams, encouraged her to pursue a doctorate in computational linguistics.  Which choice correctly handles the underlined appositive?","why":"C doğrudur. 'Professor Williams' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive). Her iki yanı virgülle ayrılır.  A — virgüller yok.  B — yalnızca açılış virgülü; kapanış eksik.  D — tireler appositive kapatmak için kullanılabilir ama SAT'ta virgül kuralı tercih edilir.","n":24,"choices":{"A":"mentor Professor Williams encouraged","B":"mentor, Professor Williams encouraged","C":"mentor, Professor Williams, encouraged","D":"mentor — Professor Williams — encouraged"},"slug":"gri-mod-sat-g33-1-24"},{"stem":"Any medication that causes adverse reactions in clinical trials must be withdrawn from testing.  Which choice is correct?","why":"D doğrudur. 'That causes adverse reactions in clinical trials' kısıtlayıcıdır — hangi ilaçların geri çekilmesi gerektiğini belirtir. Virgül yok, 'that' kullanılır.  A — 'that' ve virgüller yanlıştır.  B — 'which' ve virgüller nonrestrictive yapar; tüm ilaçların yan etki gösterdiği anlamı çıkar.  C — 'which' virgülsüz SAT'ta standart değildir.","ans":"D","choices":{"D":"medication that causes adverse reactions in clinical trials must","C":"medication which causes adverse reactions in clinical trials must","A":"medication, that causes adverse reactions in clinical trials, must","B":"medication, which causes adverse reactions in clinical trials, must"},"n":25,"slug":"gri-mod-sat-g33-1-25"}]}],"eyebrow":"Gramer"},{"eyebrow":"Gramer","name":"Indefinite Pronoun Agreement","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Indefinite Pronoun Agreement. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"stem":"Everyone on the research team submitted their final report before the Friday deadline.  Which pronoun correctly agrees with 'everyone'?","why":"D doğrudur. 'Everyone' tekil olmakla birlikte cinsiyeti belirsiz kişileri kasteder. SAT, belirsiz zamirlerde cinsiyet nötr tekil 'their/they' kullanımını kabul eder.  A — 'his' erkek cinsiyet varsayar.  B — 'her' kadın cinsiyet varsayar.  C — 'its' nesnelere atıfta bulunur.","ans":"D","choices":{"B":"her","A":"his","C":"its","D":"their"},"n":1,"slug":"gri-mod-sat-g34-1-1"},{"n":2,"choices":{"D":"have been","C":"are","B":"was","A":"were"},"ans":"B","stem":"Neither of the proposals were deemed sufficient to address the committee's concerns.  Which verb form correctly agrees with 'neither'?","why":"B doğrudur. 'Neither' her zaman tekildir. 'Neither of the proposals' — özne 'neither'dır, 'proposals' değil. Tekil fiil: 'was.'  A — 'were' çoğuldur; 'neither' tekildir.  C — 'are' çoğul geniş zamandır.  D — 'have been' çoğul present perfect'tir.","slug":"gri-mod-sat-g34-1-2"},{"choices":{"B":"are","A":"were","C":"have been","D":"was"},"n":3,"stem":"Each of the applicants were required to provide three professional references.  Which verb form is correct?","why":"D doğrudur. 'Each' her zaman tekildir. Edat öbeğini çıkarın — özne 'each.' Tekil fiil: 'was.'  A — 'were' 'applicants'a uyuyor, özne 'each'e değil.  B — 'are' çoğul geniş zamandır.  C — 'have been' çoğul present perfect.","slug":"gri-mod-sat-g34-1-3","ans":"D"},{"n":4,"choices":{"A":"their","B":"his","C":"its","D":"our"},"ans":"A","stem":"Somebody in the department has left their personal items in the conference room.  Which pronoun correctly completes the sentence?","slug":"gri-mod-sat-g34-1-4","why":"A doğrudur. 'Somebody' cinsiyeti belirsiz tekil belirsiz zamirdir. Cinsiyet nötr tekil 'their' SAT tarafından kabul edilir.  B — 'his' erkek cinsiyet varsayar.  C — 'its' nesnelere atıfta bulunur.  D — 'our' birinci çoğul şahıstır."},{"ans":"A","stem":"Anyone who fails to meet the eligibility requirements will have their application returned.  Which pronoun is correct?","slug":"gri-mod-sat-g34-1-5","why":"A doğrudur. 'Anyone' cinsiyeti belirsiz tekil belirsiz zamirdir. SAT cinsiyet nötr tekil 'their' kullanımını kabul eder.  B — 'his or her' dilbilgisel olarak doğrudur ama SAT daha kısa olan 'their'i tercih eder.  C — 'its' nesnelere atıfta bulunur.  D — 'our' birinci çoğul şahıstır.","n":5,"choices":{"B":"his or her","A":"their","D":"our","C":"its"}},{"ans":"C","why":"C doğrudur. 'Neither...nor' yapısında fiil en yakın özneyle uyuşur. 'Board members' çoğuldur → 'were.'  A — 'was' 'director'a uyuyor, en yakın 'board members'a değil.  B — 'is' tekil geniş zamandır.  D — 'has been' tekil present perfect.","slug":"gri-mod-sat-g34-1-6","stem":"Neither the director nor the board members was willing to accept responsibility for the decision.  Which verb is correct?","n":6,"choices":{"B":"is","A":"was","D":"has been","C":"were"}},{"choices":{"B":"she","A":"he","C":"it","D":"they"},"n":7,"why":"D doğrudur. 'Someone' cinsiyeti belirsiz tekil belirsiz zamirdir. Cinsiyet nötr tekil 'they' kabul edilir.  A — 'he' erkek cinsiyet varsayar.  B — 'she' kadın cinsiyet varsayar.  C — 'it' nesnelere atıfta bulunur.","stem":"Someone on the night shift has reported that they noticed unusual activity near the loading dock.  Which pronoun is correct?","ans":"D","slug":"gri-mod-sat-g34-1-7"},{"slug":"gri-mod-sat-g34-1-8","stem":"Every board member and every committee chair are expected to attend the annual general meeting.  Which verb is correct?","why":"D doğrudur. 'Every' öneki olan ve 'and' ile bağlanan özne tekil sayılır. 'Every X and every Y' tekil fiil alır.  A — 'are' bileşik özneyi çoğul sayar — yanlış.  B — 'were' geçmiş çoğuldur.  C — 'have been' çoğul present perfect.","ans":"D","choices":{"A":"are","B":"were","C":"have been","D":"is"},"n":8},{"stem":"Most of the evidence were gathered during the first phase of the investigation.  Which verb is correct?","why":"B doğrudur. 'Evidence' sayılamaz isimdir. 'Most of the evidence' — fiil 'evidence'a göre belirlenir (sayılamaz = tekil). 'Was' doğrudur.  A — 'were' 'evidence'ı sayılabilir kabul eder.  C — 'are' çoğul geniş zamandır.  D — 'have been' çoğul perfect.","slug":"gri-mod-sat-g34-1-9","ans":"B","choices":{"C":"are","D":"have been","A":"were","B":"was"},"n":9},{"choices":{"B":"are","A":"is","C":"was","D":"were"},"n":10,"slug":"gri-mod-sat-g34-1-10","why":"B doğrudur. 'Either...or' yapısında en yakın özneyle uyuşulur: 'team members' çoğul → 'are.'  A — 'is' 'manager'a uyuyor, en yakın 'team members'a değil.  C — 'was' geçmiş tekildir.  D — 'were' geçmiş çoğuldur.","stem":"Either the manager or the team members is responsible for filing the quarterly reports.  Which verb is correct?","ans":"B"},{"n":11,"choices":{"D":"are","C":"has","B":"were","A":"have"},"ans":"C","stem":"Nobody in the two departments have responded to the survey about workplace conditions.  Which verb is correct?","why":"C doğrudur. 'Nobody' her zaman tekildir. 'Has' tekil present perfect yardımcı fiilidir.  A — 'have' 'nobody'yi çoğul sayar.  B — 'were' geçmiş çoğuldur.  D — 'are' çoğul geniş zamandır.","slug":"gri-mod-sat-g34-1-11"},{"ans":"D","why":"D doğrudur. 'Funding' sayılamaz isimdir — 'some of the funding' tekil fiil alır.  A — 'have' 'funding'i sayılabilir kabul eder.  B — 'were' geçmiş çoğuldur.  C — 'are' çoğul geniş zamandır.","slug":"gri-mod-sat-g34-1-12","stem":"Some of the funding have already been allocated to operational expenses.  Which verb is correct?","n":12,"choices":{"C":"are","D":"has","B":"were","A":"have"}},{"n":13,"choices":{"C":"has","D":"were","B":"are","A":"have"},"ans":"C","why":"C doğrudur. 'Each' her zaman tekildir. 'Has been reviewed' tekil present perfect pasif.  A — 'have' 'regulations'a uyuyor, özne 'each'e değil.  B — 'are' çoğul geniş zamandır.  D — 'were' geçmiş çoğuldur.","slug":"gri-mod-sat-g34-1-13","stem":"Each of the new regulations have been reviewed by the legal team before implementation.  Which verb is correct?"},{"slug":"gri-mod-sat-g34-1-14","why":"D doğrudur. 'Data' modern akademik ve SAT kullanımında sayılamaz ('information' gibi) sayılır. 'All of the data' tekil fiil alır.  A — 'have' 'data'yı sayılabilir çoğul sayar.  B — 'are' çoğul geniş zamandır.  C — 'were' geçmiş çoğuldur.","stem":"All of the data have been processed and verified by the analytical team.  Which verb is correct?","ans":"D","choices":{"C":"were","D":"has","A":"have","B":"are"},"n":14},{"choices":{"A":"is","B":"are","C":"were","D":"have been"},"n":15,"stem":"Neither of the solutions are acceptable given the project's time constraints.  Which verb is correct?","slug":"gri-mod-sat-g34-1-15","why":"A doğrudur. 'Neither' her zaman tekildir. 'Is' doğru tekil fiildir.  B — 'are' 'solutions'a uyuyor, özne 'neither'a değil.  C — 'were' geçmiş zamandır.  D — 'have been' çoğul perfect.","ans":"A"},{"choices":{"B":"is","A":"has","D":"was","C":"have"},"n":16,"stem":"Many of the participants has reported significant improvements in their overall well-being.  Which verb is correct?","why":"C doğrudur. 'Many' çoğul belirsiz zamirdir. 'Many of the participants' çoğul fiil alır: 'have reported.'  A — 'has' tekildir; 'many' çoğuldur.  B — 'is' tekil geniş zamandır.  D — 'was' tekil geçmişdir.","slug":"gri-mod-sat-g34-1-16","ans":"C"},{"ans":"B","why":"B doğrudur. 'Everybody' tekildir. 'Who attended the conference' ilgi yan cümlesi özneyi değiştirmez — 'everybody' tekil fiil alır.  A — 'were' 'everybody'yi çoğul sayar.  C — 'are' çoğul geniş zamandır.  D — 'have been' çoğul perfect.","slug":"gri-mod-sat-g34-1-17","stem":"Everybody who attended the conference were asked to complete an evaluation form.  Which verb is correct?","n":17,"choices":{"D":"have been","C":"are","A":"were","B":"was"}},{"why":"A doğrudur. 'No one' her zaman tekildir. 'Was' doğru tekil geçmiş fiildir.  B — 'were' çoğuldur; 'no one' tekildir.  C — 'are' çoğul geniş zamandır.  D — 'have been' çoğul perfect.","slug":"gri-mod-sat-g34-1-18","stem":"No one on the board were aware of the financial irregularities before the audit.  Which verb is correct?","ans":"A","choices":{"B":"were","A":"was","D":"have been","C":"are"},"n":18},{"choices":{"D":"has been","C":"is","A":"were","B":"was"},"n":19,"stem":"Few of the proposals was considered feasible within the current budget framework.  Which verb is correct?","why":"A doğrudur. 'Few' çoğul belirsiz zamirdir. 'Few of the proposals' çoğul fiil alır: 'were considered.'  B — 'was' tekildir; 'few' çoğuldur.  C — 'is' tekil geniş zamandır.  D — 'has been' tekil perfect.","slug":"gri-mod-sat-g34-1-19","ans":"A"},{"choices":{"B":"has","A":"have","D":"is","C":"was"},"n":20,"stem":"A number of issues has been raised by the committee regarding the proposed merger.  Which verb is correct?","slug":"gri-mod-sat-g34-1-20","why":"A doğrudur. 'A number of' çoğul sayılır (the number of'ten farklı olarak). 'A number of issues' = birkaç sorun — çoğul fiil alır.  B — 'has' 'a number of'ü tekil sayar; yanlış.  C — 'was' tekil geçmişdir.  D — 'is' tekil geniş zamandır.","ans":"A"},{"stem":"The number of applicants have increased significantly since the program was redesigned.  Which verb is correct?","why":"A doğrudur. 'The number of' (belirli artikelle) tekil sayılır. 'The number' toplam sayıyı tek bir miktar olarak ifade eder.  B — 'have' bu ifadeyi çoğul sayar; yanlış ('a number of' çoğuldur ama 'the number' tekildir).  C — 'are' çoğuldur.  D — 'were' geçmiş çoğuldur.","ans":"A","choices":{"C":"are","D":"were","B":"have","A":"has"},"n":21,"slug":"gri-mod-sat-g34-1-21"},{"choices":{"C":"were","D":"have been","B":"is","A":"are"},"n":22,"stem":"Anybody who discovers a conflict of interest are required to disclose it to the ethics committee.  Which verb is correct?","why":"B doğrudur. 'Anybody' tekildir. 'Is required' doğru tekil geniş zaman pasifi.  A — 'are' 'anybody'yi çoğul sayar.  C — 'were' geçmişdir.  D — 'have been' çoğul perfect.","ans":"B","slug":"gri-mod-sat-g34-1-22"},{"ans":"C","stem":"Several of the witnesses has changed their account of events since the initial report was filed.  Which verb is correct?","slug":"gri-mod-sat-g34-1-23","why":"C doğrudur. 'Several' çoğul belirsiz zamirdir. 'Several of the witnesses' çoğul fiil alır: 'have changed.'  A — 'has' tekildir; 'several' çoğuldur.  B — 'is' tekil geniş zamandır.  D — 'was' tekil geçmişdir.","n":23,"choices":{"B":"is","A":"has","D":"was","C":"have"}},{"ans":"B","slug":"gri-mod-sat-g34-1-24","why":"B doğrudur. 'All' sayılabilir çoğul isimle ('committee members') çoğuldur. 'Have reviewed' doğru çoğul present perfect.  A — 'has' tekildir.  C — 'was' tekil geçmişdir.  D — 'is' tekil geniş zamandır.","stem":"All of the committee members has reviewed the draft proposal and submitted their feedback.  Which verb is correct?","n":24,"choices":{"D":"is","C":"was","A":"has","B":"have"}},{"why":"C doğrudur. 'Everything' her zaman tekildir. 'Was redacted' doğru tekil geçmiş pasif.  A — 'were' 'everything'i çoğul sayar.  B — 'are' çoğul geniş zamandır.  D — 'have been' çoğul perfect.","slug":"gri-mod-sat-g34-1-25","stem":"Everything in the classified documents were redacted before the files were released to the public.  Which verb is correct?","ans":"C","choices":{"B":"are","A":"were","D":"have been","C":"was"},"n":25}],"t":"mcqquiz"}],"group":"Dilbilgisi","id":"g34"},{"eyebrow":"Gramer","name":"Verb Forms — Gerunds, Infinitives, Participles","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Verb Forms — Gerunds, Infinitives, Participles. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"stem":"The committee decided suspending the project until further funding could be secured.  Which verb form is correct after 'decided'?","why":"C doğrudur. 'Decide' mastar (infinitive) alır: 'decided to suspend.' Gerund almaz.  A — 'decide suspending' standart değildir.  B — 'having suspended' önceden tamamlanmış eylemi ima eder.  D — 'decided suspend' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-1","ans":"C","choices":{"D":"suspend","C":"to suspend","A":"suspending","B":"having suspended"},"n":1},{"n":2,"choices":{"A":"to reorganize","B":"having reorganized","C":"reorganize","D":"reorganizing"},"ans":"D","stem":"The manager suggested to reorganize the department to improve efficiency.  Which verb form is correct after 'suggested'?","why":"D doğrudur. 'Suggest' gerund alır: 'suggested reorganizing.' Mastar almaz.  A — 'suggested to reorganize' yanlıştır.  B — 'having reorganized' önceden tamamlanmış eylemi ima eder.  C — 'suggest reorganize' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-2"},{"slug":"gri-mod-sat-g35-1-3","choices":{"A":"to make","B":"making","C":"having made","D":"make"},"n":3,"stem":"She avoided to make any commitments until she had reviewed the contract.  Which verb form is correct after 'avoided'?","why":"B doğrudur. 'Avoid' her zaman gerund alır: 'avoided making.'  A — 'avoid to make' yanlıştır.  C — 'having made' önceden tamamlanmış eylemi ima eder.  D — 'avoid make' dilbilgisel değildir.","ans":"B"},{"choices":{"A":"to publish","B":"publishing","D":"published","C":"having published"},"n":4,"stem":"The researchers hope publishing their findings in a major journal by the end of the year.  Which verb form is correct after 'hope'?","why":"A doğrudur. 'Hope' mastar alır: 'hope to publish.'  B — 'hope publishing' standart değildir.  C — 'having published' önceden tamamlanmışlık ima eder.  D — 'hope published' dilbilgisel değildir.","ans":"A","slug":"gri-mod-sat-g35-1-4"},{"ans":"B","stem":"The board considered to extend the deadline by two weeks.  Which verb form is correct?","slug":"gri-mod-sat-g35-1-5","why":"B doğrudur. 'Consider' gerund alır: 'considered extending.'  A — 'considered to extend' yanlıştır.  C — 'having extended' önceden tamamlanmışlık ima eder.  D — 'consider extended' dilbilgisel değildir.","n":5,"choices":{"D":"extended","C":"having extended","B":"extending","A":"to extend"}},{"slug":"gri-mod-sat-g35-1-6","stem":"Having completed the audit, the accounting firm submitted its final report to the client.  Which choice correctly uses the participial phrase?","why":"B doğrudur. 'Having completed the audit' mükemmel katılımcı öbeğidir (perfect participial phrase) — ana cümlenin öznesinin (muhasebe firması) daha önce tamamladığı eylemi gösterir.  A — 'having been done' sonrasında kullanımı garip ve gereksizdir.  C — 'After they complete' zaman tutarsızlığı yaratır.  D — 'accounting firms' (çoğul) belirli firmaya uymaz.","ans":"B","choices":{"C":"After they complete the audit, the accounting firm","D":"The audit having been completed, accounting firms","B":"Having completed the audit, the accounting firm","A":"Completing the audit having been done, the accounting firm"},"n":6},{"choices":{"C":"completed","D":"to complete","A":"completing","B":"having completed"},"n":7,"why":"D doğrudur. 'Require' bu yapıda mastar alır: 'requires all employees to complete.'  A — 'requires completing' farklı bir yapıda kullanılabilir ama 'requires [kişi] to complete' standart kalıptır.  B — 'having completed' önceden tamamlanmışlık ima eder.  C — 'require employees completed' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-7","stem":"The new policy requires all employees completing the annual compliance training by December.  Which verb form is correct?","ans":"D"},{"ans":"A","stem":"Exhausted by the long trial, the jury requested a short recess before deliberating.  Which choice correctly uses the participial phrase?","slug":"gri-mod-sat-g35-1-8","why":"A doğrudur. 'Exhausted by the long trial' katılımcı öbeği ana cümlenin öznesi olan 'the jury'yi doğru şekilde niteler.  B — 'the jury being exhausted' mutlak öbek kullanır; anlam ince farklılaşır.  C — katılımcı öbeği kullanmaktan tamamen kaçınır.  D — 'a recess was requested' yorgun olamaz — sarkan belirteç (dangling modifier).","n":8,"choices":{"A":"Exhausted by the long trial, the jury","B":"The jury being exhausted by the long trial,","C":"Because of exhaustion from the long trial, the jury","D":"Exhausted by the long trial, a recess was requested"}},{"n":9,"choices":{"D":"to make","C":"having made","B":"making","A":"to have made"},"ans":"C","slug":"gri-mod-sat-g35-1-9","why":"C doğrudur. 'Admit' + geçmiş eylem için gerund: 'admitted having made.' 'Admit to making' da kabul edilebilir.  A — 'admitted to have made' standart değildir.  B — 'admitted making' kabul edilebilir ama 'having made' geçmişliği daha açık belirtir.  D — 'to make' gelecek eylemi ima eder; anlama uymaz.","stem":"The professor admitted to have made an error in the problem set.  Which verb form is correct after 'admitted'?"},{"n":10,"choices":{"C":"having approved","D":"approve","A":"approving","B":"to approve"},"ans":"A","stem":"The executive denied to approve the fraudulent invoices.  Which verb form is correct?","slug":"gri-mod-sat-g35-1-10","why":"A doğrudur. 'Deny' gerund alır: 'denied approving.'  B — 'denied to approve' yanlıştır; 'deny' gerund alır.  D — 'deny approve' dilbilgisel değildir."},{"why":"C doğrudur. 'Finish' her zaman gerund alır: 'finished writing.'  A — 'finished to write' yanlıştır.  B — 'having written' katılımcı anlamda önceden tamamlanmışlık ima eder.  D — 'finish written' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-11","stem":"The team finished to write the final section of the report just before midnight.  Which verb form is correct?","ans":"C","choices":{"D":"written","C":"writing","B":"having written","A":"to write"},"n":11},{"choices":{"B":"not knowing","A":"not to know","D":"to not know","C":"having not known"},"n":12,"why":"A doğrudur. 'Pretend' mastar alır: 'pretended not to know.' Olumsuz mastar 'not'u 'to'dan önce koyar.  B — 'pretended not knowing' standart değildir.  C — 'having not known' bu bağlamda yanlıştır.  D — 'to not know' bölünmüş mastar (split infinitive); 'not to know' tercih edilir.","stem":"She pretended not knowing about the decision when her colleagues asked.  Which verb form is correct?","ans":"A","slug":"gri-mod-sat-g35-1-12"},{"why":"B doğrudur. 'Stopped funding' = finansmanı kesti. 'Stopped to fund' = fonlamak için durdu — tam ters anlam!  A — 'stopped to fund' = fonlamak için durdu — yanlış anlam.  C — 'stopped to have funded' standart değildir.  D — 'stopped having funded' standart değildir.","slug":"gri-mod-sat-g35-1-13","stem":"The organization stopped to fund research projects that could not demonstrate measurable outcomes.  Which choice correctly conveys that funding was discontinued?","ans":"B","choices":{"B":"stopped funding","A":"stopped to fund","D":"stopped having funded","C":"stopped to have funded"},"n":13},{"n":14,"choices":{"C":"having to sign","D":"signing","B":"to have signed","A":"to sign"},"ans":"D","why":"D doğrudur. 'Remembered signing' = imzaladığını hatırladı (geçmiş eylem). 'Remembered to sign' = imzalaması gerektiğini hatırladı (gelecek eylem). Cümle zaten imzalandığını ima eder.  A — 'remembered to sign' = imzalaması gerektiğini hatırladı — yanlış anlam.  B — 'to have signed' bu bağlamda standart değildir.  C — 'having to sign' = imzalamak zorunda olmak anlamına gelir.","slug":"gri-mod-sat-g35-1-14","stem":"The CEO remembered signing the contract, but her assistant could not locate a copy.  Which form correctly conveys that the signing already happened?"},{"choices":{"B":"having uncovered","A":"uncovering","D":"to uncover","C":"uncover"},"n":15,"why":"D doğrudur. 'Tried to uncover' = bulmaya çalıştı (ve başaramadı). 'Tried uncovering' = yöntem olarak denedi — burada başarısız girişim kastı var.  A — 'tried uncovering' yöntemi denemeyi ima eder.  B — 'having uncovered' önceden tamamlanmışlık ima eder.  C — 'tried uncover' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-15","stem":"The auditors tried uncovering the source of the discrepancy but were unsuccessful.  Which form is most standard after 'tried'?","ans":"D"},{"ans":"B","stem":"The contractor agreed fixing the structural issues before the final inspection.  Which verb form is correct?","slug":"gri-mod-sat-g35-1-16","why":"B doğrudur. 'Agree' mastar alır: 'agreed to fix.'  A — 'agreed fixing' standart değildir.  C — 'having fixed' önceden tamamlanmışlık ima eder.  D — 'agree fix' dilbilgisel değildir.","n":16,"choices":{"C":"having fixed","D":"fix","B":"to fix","A":"fixing"}},{"slug":"gri-mod-sat-g35-1-17","ans":"A","why":"A doğrudur. 'Regret' + gerund = geçmiş bir eylemden pişman olmak. 'Regretted telling' doğrudur.  B — 'regretted to tell' resmi duyurularda kullanılır ('I regret to inform you') — geçmiş eylem için değil.  C — 'to have told' bu bağlamda standart değildir.  D — 'having to tell' = söylemek zorunda kalmak anlamına gelir.","stem":"She regretted to tell her colleague about the restructuring before the official announcement.  Which form is correct?","n":17,"choices":{"D":"having to tell","C":"to have told","B":"to tell","A":"telling"}},{"ans":"D","why":"D doğrudur. 'The film released next month' indirgeme ilgi cümlesi kullanır ('which will be released' → 'released'). Bu bağlamda 'released' en doğal katılımcı sıfattır.  A — 'being released' dilbilgisel olarak mümkün ama daha az doğaldır.  B — 'to be released' amacı değil takvimi ima eder.  C — 'that releasing' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-18","stem":"The film being released next month has already generated significant critical interest.  Which choice is correct?","n":18,"choices":{"C":"that releasing","D":"released","A":"being released","B":"to be released"}},{"ans":"C","why":"C doğrudur. 'Choose to' mastar yalın fiil alır: 'chose to revise.' 'To'dan sonra yalın fiil gelir.  A — 'to having revised' dilbilgisel değildir.  B — 'to revising' standart değildir.  D — 'to revised' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-19","stem":"The director chose to having revised the script before final casting decisions were made.  Which form is correct?","n":19,"choices":{"B":"revising","A":"having revised","C":"revise","D":"revised"}},{"choices":{"A":"Written in 1818, Frankenstein continues","B":"Having written in 1818, Frankenstein continues","C":"Being written in 1818, Frankenstein continues","D":"Writing in 1818, Frankenstein continues"},"n":20,"stem":"Written in 1818, Frankenstein continues to be studied in literature courses worldwide.  Which choice correctly uses the participial phrase?","slug":"gri-mod-sat-g35-1-20","why":"A doğrudur. 'Written in 1818' geçmiş katılımcı öbeği 'Frankenstein'ı doğru şekilde niteler — roman yazılmıştır (pasif).  B — 'Having written' Frankenstein'ın bir şeyler yazdığını ima eder — sarkan belirteç.  C — 'Being written' 1818'de yazılmaya devam edildiğini ima eder — yanlış.  D — 'Writing in 1818' Frankenstein'ın yazan olduğunu ima eder — sarkan belirteç.","ans":"A"},{"ans":"A","why":"A doğrudur. 'Consider' gerund alır: 'is considering expanding.'  B — 'considering to expand' standart değildir.  C — 'having expanded' önceden tamamlanmışlık ima eder.  D — 'considering expanded' dilbilgisel değildir.","stem":"The board is considering to expand the program to three additional cities by next year.  Which verb form is correct?","n":21,"choices":{"B":"to expand","A":"expanding","C":"having expanded","D":"expanded"},"slug":"gri-mod-sat-g35-1-21"},{"n":22,"choices":{"D":"increase","C":"increasing","A":"to increase","B":"having increased"},"ans":"C","why":"C doğrudur. 'Recommend' gerund alır: 'recommended increasing.'  A — 'recommended to increase' bu yapıda standart değildir.  B — 'having increased' önceden tamamlanmışlık ima eder.  D — 'recommend increase' dilbilgisel değildir.","stem":"The athlete's trainer recommended to increase the intensity of workouts gradually over three weeks.  Which verb form is correct?","slug":"gri-mod-sat-g35-1-22"},{"ans":"B","why":"B doğrudur. 'Advise someone to do something' = 'advised them to settle.' Mastar kullanılır.  A — 'advised them settling' bu yapıda standart değildir.  C — 'having settled' eylemin tamamlandığını ima eder.  D — 'advise settle' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-23","stem":"The company's lawyer advised them settling the dispute out of court to avoid a lengthy trial.  Which verb form is correct?","n":23,"choices":{"A":"settling","B":"to settle","C":"having settled","D":"settle"}},{"n":24,"choices":{"D":"to complete","C":"completed","B":"having completed","A":"completing"},"ans":"D","stem":"She managed completing all three projects before the quarterly review.  Which verb form is correct?","why":"D doğrudur. 'Manage' mastar alır: 'managed to complete.'  A — 'managed completing' standart değildir.  B — 'having completed' 'managed'den sonra standart değildir.  C — 'managed completed' dilbilgisel değildir.","slug":"gri-mod-sat-g35-1-24"},{"stem":"The student appears having misunderstood the requirements for the final examination.  Which verb form is correct?","slug":"gri-mod-sat-g35-1-25","why":"C doğrudur. 'Appear' mastar alır. 'To have misunderstood' mükemmel mastar kullanarak yanlış anlamanın görünümden önce gerçekleştiğini belirtir.  A — 'appears having misunderstood' standart değildir; 'appear' mastar alır.  B — 'appears misunderstanding' standart değildir.  D — 'appears misunderstood' mastar işaretçisinden yoksundur.","ans":"C","choices":{"A":"having misunderstood","B":"misunderstanding","D":"misunderstood","C":"to have misunderstood"},"n":25}]}],"group":"Dilbilgisi","id":"g35"},{"blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Faulty Comparisons. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"ans":"A","why":"A doğrudur. Cümle 'mühendislerin ortalama maaşı'nı 'öğretmenler'le karşılaştırıyor — ama maaş insanlarla karşılaştırılamaz. 'That of teachers' = 'öğretmenlerin maaşı' kullanılmalı.  B — maaşı insanlarla karşılaştırır — mantıksız.  C — 'teacher's' iyelikli ama eksik: 'öğretmenin neyi?'  D — 'the teachers'' da eksik.","slug":"gri-mod-sat-g36-1-1","stem":"The average salary of engineers in this city is higher than teachers.  Which revision corrects the faulty comparison?","n":1,"choices":{"C":"higher than teacher's","D":"higher than the teachers'","A":"higher than that of teachers","B":"higher than teachers"}},{"choices":{"A":"it","B":"that","D":"them","C":"those of"},"n":2,"stem":"The production costs of the new factory are lower than those of the old facility.  Which choice is correct?","why":"C doğrudur. 'Those of the old facility' maliyetleri (çoğul) maliyetlerle doğru şekilde karşılaştırır. 'Those' çoğul zamiri 'production costs' yerine geçer.  A — 'it' tekildir; 'costs' çoğuldur.  B — 'that' tekildir.  D — 'them' iyelik/atıf ilişkisini 'those of' gibi kuramaz.","slug":"gri-mod-sat-g36-1-2","ans":"C"},{"ans":"C","stem":"The climate in the southern region is warmer than the north.  Which revision correctly compares like things?","why":"C doğrudur. Güney bölgesinin iklimi kuzey bölgesinin iklimiyle karşılaştırılmalı. 'That of the northern region' = 'kuzey bölgesinin iklimi.'  A — iklimi bir bölgeyle karşılaştırır — mantıksız.  B — dilbilgisel olarak garip ve gereksiz uzun.  D — 'the northern region's being' standart değildir.","n":3,"choices":{"B":"what the northern region has","A":"the north","C":"that of the northern region","D":"the northern region's being"},"slug":"gri-mod-sat-g36-1-3"},{"choices":{"B":"previous studies","A":"those of previous studies","D":"what previous studies used to use","C":"previous studies' methods"},"n":4,"slug":"gri-mod-sat-g36-1-4","why":"A doğrudur. 'Research methods' çalışmalarla değil, önceki çalışmaların yöntemleriyle karşılaştırılmalı. 'Those of previous studies' = 'önceki çalışmaların yöntemleri.'  B — yöntemleri çalışmalarla karşılaştırır — mantıksız.  C — dilbilgisel olarak mümkün ama garip.  D — gereksiz uzun ve gayri resmi.","stem":"The research methods used in this study are more rigorous than previous studies.  Which revision corrects the faulty comparison?","ans":"A"},{"ans":"C","slug":"gri-mod-sat-g36-1-5","why":"C doğrudur. İşsizlik oranı bölgelerle değil, kırsal bölgelerdeki işsizlik oranıyla karşılaştırılmalı. 'That in rural areas' = 'kırsal bölgelerdeki işsizlik oranı.'  A — oranı bölgelerle karşılaştırır — mantıksız.  B — 'higher than in rural areas' eliptik; C daha açık.  D — gereksiz uzun ve gayri resmi.","stem":"The unemployment rate in the capital is higher than rural areas.  Which revision corrects the faulty comparison?","n":5,"choices":{"A":"rural areas","B":"in rural areas","D":"what rural areas have","C":"that in rural areas"}},{"slug":"gri-mod-sat-g36-1-6","why":"D doğrudur. Kendisi de departmanda olduğundan 'anyone' onu da kapsar — mantıksız. 'Anyone else's' onu karşılaştırma dışında bırakır. Ayrıca beceriler becerilerle karşılaştırılmalı.  A — 'anyone' onu da içerir; mantıksız.  B — 'those of anyone' onu karşılaştırma dışında bırakmaz.  C — 'those of any other person' daha tam ama en basit çözüm B'dir.","stem":"Her presentation skills are better than anyone in the department.  Which revision corrects the faulty comparison?","ans":"D","choices":{"A":"anyone","B":"those of anyone","C":"any other person","D":"anyone else's"},"n":6},{"choices":{"B":"all cities","A":"any city","D":"any other city","C":"every other cities"},"n":7,"stem":"The population of the city is larger than any city in the region.  Which revision is correct?","slug":"gri-mod-sat-g36-1-7","why":"D doğrudur. Şehir bölgenin parçası olduğundan 'any city' onu da kapsıyor. 'Any other city' onu karşılaştırma dışında bırakır.  A — şehri kendisiyle karşılaştırır.  B — 'all cities' bu yapıda dilbilgisel olarak garip.  C — 'every other cities' yanlıştır ('every other city' kabul edilebilir ama alışılmamış).","ans":"D"},{"slug":"gri-mod-sat-g36-1-8","choices":{"B":"if not more efficient, than","A":"if not more efficient, as","C":"if not more efficient than","D":"if not more efficient as"},"n":8,"why":"B doğrudur. 'As efficient as, if not more efficient than' — ikinci unsur ('if not more efficient') eklendiğinde 'than' gerekir çünkü 'more efficient than' tamamlanmalıdır.  A — sondaki 'as' 'as efficient as'ı tamamlar ama 'more efficient'ı karşılaştırmasız bırakır.  C — 'than'den önce virgül eksik.  D — 'as' 'more efficient'ı tamamlamaz.","stem":"This model is as efficient, if not more efficient, than the previous version.  Which choice is correct?","ans":"B"},{"n":9,"choices":{"C":"what is the agricultural sector's","D":"the agricultural sector revenue","A":"the agricultural sector","B":"that of the agricultural sector"},"ans":"B","slug":"gri-mod-sat-g36-1-9","why":"B doğrudur. Gelir gelirle karşılaştırılmalı. 'That of the agricultural sector' = 'tarım sektörünün yıllık geliri.'  A — geliri sektörle karşılaştırır — mantıksız.  C — garip ve standart dışı.  D — edat eksik ve belirsiz.","stem":"The annual revenue of the tech sector is greater than the agricultural sector.  Which revision corrects the faulty comparison?"},{"n":10,"choices":{"C":"those of domestic products","D":"domestic products' quality","B":"that of domestic products","A":"domestic products"},"ans":"B","slug":"gri-mod-sat-g36-1-10","why":"B doğrudur. Quality (tekil) kaliteyle karşılaştırılmalı. 'That of domestic products' = 'yerli ürünlerin kalitesi.' 'That' tekildir.  A — kaliteyi ürünlerle karşılaştırır — mantıksız.  C — 'those' çoğuldur; kalite tekildir.  D — dilbilgisel olarak mümkün ama C'den az temiz.","stem":"The quality of the imported goods is inferior to domestic products.  Which revision correctly compares like things?"},{"n":11,"choices":{"D":"the first trial data","C":"those from the first trial","B":"that of the first","A":"the first"},"ans":"C","slug":"gri-mod-sat-g36-1-11","why":"C doğrudur. 'Data' (çoğul) veriyle karşılaştırılmalı. 'Those from the first trial' = 'birinci denemeden elde edilen veriler.' 'Those' veriyle uyuşan çoğuldur.  A — veriyi bir denemeyle karşılaştırır — mantıksız.  B — 'that' tekildir; 'data' çoğuldur.  D — dilbilgisel olarak mümkün ama C'den uzun.","stem":"The data from the second trial are more conclusive than the first.  Which revision is correct?"},{"why":"C doğrudur. O sınıfta öğrenci. 'Any student' onu da kapsıyor. 'Any other student' onu karşılaştırma dışında bırakır.  A — kendisini de karşılaştırmaya dahil eder — mantıksız.  B — 'she scored higher than all the other students' şeklinde farklı bir yapıda çalışır.  D — 'every student' de kendisini kapsar.","slug":"gri-mod-sat-g36-1-12","stem":"She scored higher on the exam than any student in the class.  Which revision is correct?","ans":"C","choices":{"B":"all the students","A":"any student","D":"every student","C":"any other student"},"n":12},{"n":13,"choices":{"B":"that of the old program","A":"the old one","D":"those of the old one","C":"the old program"},"ans":"D","why":"D doğrudur. Benefits (çoğul) faydalarla karşılaştırılmalı. 'Those of the old one' = 'eski programın faydaları.' 'Those' çoğuldur.  A — faydaları bir programla karşılaştırır — mantıksız.  B — 'that' tekildir; faydalar çoğuldur.  C — A ile aynı sorun.","slug":"gri-mod-sat-g36-1-13","stem":"The benefits of the new program are more extensive than the old one.  Which revision correctly compares like things?"},{"slug":"gri-mod-sat-g36-1-14","stem":"The protein content of lentils is higher than beef.  Which revision is correct?","why":"B doğrudur. Protein içeriği (tekil) et protein içeriğiyle karşılaştırılmalı. 'That of beef' = 'etin protein içeriği.'  A — protein içeriğini bir yiyecekle karşılaştırır — mantıksız.  C — 'those' çoğuldur; protein içeriği tekildir.  D — 'beef's protein' eksik; 'content' atlıyor.","ans":"B","choices":{"A":"beef","B":"that of beef","C":"those of beef","D":"beef's protein"},"n":14},{"choices":{"B":"last year","A":"those of last year's survey","C":"last year's","D":"what last year showed"},"n":15,"stem":"The results of this survey are more reliable than last year.  Which revision corrects the comparison?","slug":"gri-mod-sat-g36-1-15","why":"A doğrudur. Anket sonuçları sonuçlarla karşılaştırılmalı. 'Those of last year's survey' = 'geçen yılın anketinin sonuçları.'  B — sonuçları bir zaman dilimiyle karşılaştırır — mantıksız.  C — 'last year's' eksik: 'geçen yılın neyi?'  D — 'what last year showed' dilbilgisel olarak garip.","ans":"A"},{"ans":"A","stem":"His prose style resembles Hemingway.  Which revision correctly compares like things?","why":"A doğrudur. Hem B ('that of Hemingway' = 'Hemingway'in düzyazı stili') hem C ('Hemingway's style') düzyazı stilini bir kişiyle değil Hemingway'in stiliyle doğru şekilde karşılaştırır.  B — düzyazı stilini bir kişiyle karşılaştırır — mantıksız.  C — doğru.  D — doğru.","n":16,"choices":{"C":"that of Hemingway","D":"Hemingway's style","B":"Hemingway","A":"B or C"},"slug":"gri-mod-sat-g36-1-16"},{"choices":{"B":"those of wealthy nations","A":"wealthy nations","C":"wealthy nations have","D":"that of wealthy nations"},"n":17,"stem":"The infrastructure of developing nations is often less advanced than wealthy nations.  Which revision corrects the faulty comparison?","slug":"gri-mod-sat-g36-1-17","why":"D doğrudur. Altyapı (tekil) altyapıyla karşılaştırılmalı. 'That of wealthy nations' = 'zengin ülkelerin altyapısı.'  A — altyapıyı ülkelerle karşılaştırır — mantıksız.  B — 'those' çoğuldur; altyapı tekildir.  C — 'wealthy nations have' eksik bir yan cümle.","ans":"D"},{"n":18,"choices":{"A":"the second","B":"the second student's","D":"that of the second student","C":"the second student wrote"},"ans":"D","stem":"The essay written by the first student is longer than the second.  Which revision corrects the comparison?","slug":"gri-mod-sat-g36-1-18","why":"D doğrudur. Bir kompozisyon başka bir kompozisyonla karşılaştırılmalı. 'That of the second student' = 'ikinci öğrencinin kompozisyonu.'  A — 'the second' belirsiz.  B — 'the second student's' eksik; isim yok.  C — eksik ilgi cümlesi."},{"ans":"D","stem":"The test scores of students in urban schools are higher than rural schools.  Which revision is correct?","why":"D doğrudur. Sınav puanları puanlarla karşılaştırılmalı. 'Those of students in rural schools' = 'kırsal okul öğrencilerinin sınav puanları.'  A — puanları okullarla karşılaştırır — mantıksız.  B — puanları öğrencilerle karşılaştırır — hâlâ mantıksız.  C — 'rural schools' students' eksik; isim yok.","slug":"gri-mod-sat-g36-1-19","n":19,"choices":{"D":"those of students in rural schools","C":"rural schools' students","A":"rural schools","B":"students in rural schools"}},{"ans":"A","stem":"The cost of living in New York is higher than most American cities.  Which revision corrects the comparison?","slug":"gri-mod-sat-g36-1-20","why":"A doğrudur. Yaşam maliyeti (tekil) yaşam maliyetiyle karşılaştırılmalı. 'That of most American cities' = 'çoğu Amerikan şehrinin yaşam maliyeti.'  B — maliyeti şehirlerle karşılaştırır — mantıksız.  C — 'those' çoğuldur; yaşam maliyeti tekildir.  D — gereksiz uzun ve garip.","n":20,"choices":{"A":"that of most American cities","B":"most American cities","D":"what most American cities cost","C":"those of most American cities"}},{"ans":"A","stem":"She is more talented than any musician I have ever heard.  Which revision is correct?","slug":"gri-mod-sat-g36-1-21","why":"A doğrudur. Şehir-bölge durumunun aksine, dinleyici onu daha önce dinlememiş olabilir. Bu durumda 'any musician' mantıksal olarak tutarlıdır.  B — 'any other' yalnızca o da grubun içindeyse gereklidir.  C — 'all musicians' farklı bir yapıda çalışır.  D — 'every musician' de farklı bir yapıda kullanılır.","n":21,"choices":{"B":"any other musician","A":"any musician","D":"every musician","C":"all musicians"}},{"slug":"gri-mod-sat-g36-1-22","choices":{"B":"that of Team B","A":"Team B","C":"those of Team B","D":"what Team B produced"},"n":22,"why":"B doğrudur. Rapor raporla karşılaştırılmalı. 'That of Team B' = 'B Takımının raporu.'  A — raporu bir takımla karşılaştırır — mantıksız.  C — 'those' çoğuldur; rapor tekildir.  D — 'what Team B produced' yan cümle olarak mümkün ama daha uzun.","stem":"The report produced by Team A is more detailed than Team B.  Which revision is correct?","ans":"B"},{"stem":"The error rate of this machine is lower than our competitors'.  Which choice correctly completes the comparison?","why":"A doğrudur. Hem C ('that of our competitors' = 'rakiplerimizin hata oranı') doğru karşılaştırma kurar. B ('our competitors' machines') da makul ama biraz daha az kesin.  B — 'our competitors'' iyelikli ama isim yok — eksik.  D — doğru.","slug":"gri-mod-sat-g36-1-23","ans":"A","choices":{"D":"that of our competitors","C":"our competitors' machines","A":"B or C","B":"our competitors'"},"n":23},{"stem":"The language in this statute is more ambiguous than most other laws passed by the legislature.  Which revision corrects the faulty comparison?","slug":"gri-mod-sat-g36-1-24","why":"C doğrudur. Language (tekil) diğer yasaların diliyle karşılaştırılmalı. 'That of most other laws' = 'diğer yasaların dili.'  A — dili yasalarla karşılaştırır — mantıksız.  B — 'those' çoğuldur; language tekildir.  D — gereksiz uzun.","ans":"C","choices":{"A":"most other laws","B":"those of most other laws","C":"that of most other laws","D":"what most other laws say"},"n":24},{"slug":"gri-mod-sat-g36-1-25","choices":{"C":"that of his classmates","D":"his classmates' understanding","B":"B or C","A":"his classmates"},"n":25,"stem":"His understanding of thermodynamics is more advanced than his classmates.  Which revision is correct?","why":"B doğrudur. Hem B ('that of his classmates' = 'sınıf arkadaşlarının anlayışı') hem C ('his classmates' understanding') anlayışı anlayışla doğru şekilde karşılaştırır.  A — anlayışı insanlarla karşılaştırır — mantıksız.  C — doğru.  D — doğru.","ans":"B"}],"t":"mcqquiz"}],"name":"Faulty Comparisons","group":"Dilbilgisi","id":"g36","eyebrow":"Gramer"},{"id":"g37","group":"Dilbilgisi","name":"Sentence Combining — Reduction & Subordination","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Sentence Combining — Reduction & Subordination. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"ans":"A","why":"A doğrudur. İlk eylemi katılımcı öbeğe dönüştürmek ('reviewing the proposal') özneyi tekrar etmeden iki cümleyi birleştirir.  B — 'the committee' tekrar ediyor; iki tam yan cümle kullanıyor.  C — 'reviewed...and finding' paralel yapı bozuyor.  D — comma splice (virgül ile yanlış birleştirme hatası).","stem":"The committee reviewed the proposal. The committee found several inconsistencies.  Which choice most effectively combines these sentences?","n":1,"choices":{"D":"The committee found several inconsistencies, they reviewed the proposal.","C":"The committee reviewed the proposal and finding several inconsistencies.","B":"The committee reviewed the proposal, and the committee found several inconsistencies.","A":"Reviewing the proposal, the committee found several inconsistencies."},"slug":"gri-mod-sat-g37-1-1"},{"n":2,"choices":{"C":"She completed the project ahead of schedule, time was given to her to review the final draft.","D":"Completing the project, she was ahead of schedule and reviewing the final draft.","B":"Having completed the project ahead of schedule, she had time to review the final draft.","A":"She completed the project ahead of schedule, and this gave her time to review the final draft."},"ans":"B","stem":"She completed the project ahead of schedule. This gave her time to review the final draft.  Which choice most effectively combines these sentences?","slug":"gri-mod-sat-g37-1-2","why":"B doğrudur. 'Having completed the project ahead of schedule' mükemmel katılımcı öbeği önceki eylemi ve sonucunu verimli şekilde aktarır.  A — dilbilgisel olarak doğru ama B'den daha uzun.  C — comma splice.  D — anlamı ve yapıyı bozuyor."},{"stem":"The documentary was critically acclaimed. It failed to attract a wide commercial audience.  Which choice most effectively combines these sentences?","why":"D doğrudur. 'Although' zıtlığı bağımlı bir yan cümleyle doğru şekilde kurar.  A — comma splice.  B — 'however failing' dilbilgisel değildir.  C — pasif yapı doğal değildir.","slug":"gri-mod-sat-g37-1-3","ans":"D","choices":{"D":"Although the documentary was critically acclaimed, it failed to attract a wide commercial audience.","C":"The documentary was critically acclaimed but wide commercial audience was not attracted.","A":"The documentary was critically acclaimed, it failed to attract a wide commercial audience.","B":"The documentary was critically acclaimed, however failing to attract a wide commercial audience."},"n":3},{"ans":"A","why":"A doğrudur. Kısıtlayıcı olmayan ilgi yan cümlesi ('which was built in 1893') köprü hakkında ek bilgi verir ve virgüllerle doğru şekilde ayrılır.  B — 'that' nonrestrictive (virgüllü) yan cümlelerde kullanılmaz.  C — 'which' virgülsüz SAT'ta standart değildir.  D — sarkan belirteç: 'built in 1893' köprüyü değil 'commuter traffic'i niteliyor.","slug":"gri-mod-sat-g37-1-4","stem":"The bridge was built in 1893. It still carries commuter traffic every day.  Which choice most effectively combines these sentences using a relative clause?","n":4,"choices":{"D":"Built in 1893, commuter traffic still crosses the bridge every day.","C":"The bridge which was built in 1893 still carries commuter traffic every day.","B":"The bridge, that was built in 1893, still carries commuter traffic every day.","A":"The bridge, which was built in 1893, still carries commuter traffic every day."}},{"slug":"gri-mod-sat-g37-1-5","ans":"D","why":"D doğrudur. Kısıtlayıcı olmayan ilgi yan cümlesi ('which aimed to reduce plastic waste') ikinci cümlenin bilgisini entegre ederken 'in 2019'u doğru yerinde tutar.  A — 'the initiative' tekrar ediyor.  B — hükümetin onu başlattığı bilgisini kaybeder.  C — '2019'u iki kez tekrarlıyor.","stem":"The government launched the initiative in 2019. The initiative aimed to reduce plastic waste.  Which choice most effectively combines these sentences?","n":5,"choices":{"A":"The government launched the initiative in 2019, and the initiative aimed to reduce plastic waste.","B":"Launched in 2019, the initiative aimed to reduce plastic waste.","D":"The government launched the initiative, which aimed to reduce plastic waste, in 2019.","C":"In 2019 the government launched the initiative aiming to reduce plastic waste in 2019."}},{"choices":{"A":"The professor is an expert in behavioral economics, and she was invited to speak at the conference.","B":"The professor, an expert in behavioral economics, was invited to speak at the conference.","C":"Being an expert in behavioral economics, the conference invited the professor to speak.","D":"An expert in behavioral economics the professor was invited to speak at the conference."},"n":6,"why":"B doğrudur. Açıklayıcı öbek (appositive) ilk cümlenin bilgisini gereksiz tekrar olmadan entegre eder.  A — iki tam yan cümle; daha az özlü.  C — sarkan belirteç: konferans davranışsal ekonomide uzman değil.  D — appositive'den sonra virgül eksik.","stem":"The professor is an expert in behavioral economics. She was invited to speak at the conference.  Which choice most effectively combines these sentences?","ans":"B","slug":"gri-mod-sat-g37-1-6"},{"stem":"The law was passed in 2018. It has since reduced emissions by thirty percent.  Which choice most effectively combines these sentences?","why":"D doğrudur. İndirgenmiş ilgi yan cümlesi ('passed in 2018') zaman bilgisini verimli şekilde entegre eder.  A — dilbilgisel olarak doğru ama iki tam yan cümle kullanıyor.  B — 'since' sona gelemiyor.  C — 'and' 'since'tan sonra bir bileşik oluşturuyor; cümle parçası (fragment) oluşuyor.","ans":"D","choices":{"C":"Since the law was passed in 2018, and it reduced emissions by thirty percent.","D":"The law, passed in 2018, has since reduced emissions by thirty percent.","A":"The law was passed in 2018, and it has since reduced emissions by thirty percent.","B":"Having been passed in 2018, the law reduced emissions by thirty percent since."},"n":7,"slug":"gri-mod-sat-g37-1-7"},{"slug":"gri-mod-sat-g37-1-8","ans":"B","why":"B doğrudur. 'In order to' amacı açık ve özlü şekilde ifade eder.  A — 'worked through the night wanting' belirsiz.  C — iki tam yan cümle gereksiz.  D — sarkan belirteç: 'the launch deadline' gece çalışmadı.","stem":"The team worked through the night. They wanted to meet the launch deadline.  Which choice most effectively combines these sentences?","n":8,"choices":{"C":"The team worked through the night, and they wanted to meet the launch deadline.","D":"Working through the night, the launch deadline was met.","A":"The team worked through the night wanting to meet the launch deadline.","B":"The team worked through the night in order to meet the launch deadline."}},{"why":"D doğrudur. Kısıtlayıcı ilgi yan cümlesi ('that can dissolve plastic in seawater') hangi bileşik olduğunu belirtir.  A — 'which' ve virgüller nonrestrictive yapar; bilim insanının keşfettiği her bileşiğin plastiği çözdüğünü ima eder.  B — comma splice.  C — 'it can dissolve' garip ikinci bağımsız yan cümle yaratıyor.","slug":"gri-mod-sat-g37-1-9","stem":"The scientist discovered a new compound. The compound can dissolve plastic in seawater.  Which choice most effectively combines these sentences using a relative clause?","ans":"D","choic
