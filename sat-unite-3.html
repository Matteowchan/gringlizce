d around 80 CE.\n- It could hold an estimated 50,000 spectators.\n- It was used for gladiatorial contests and public spectacles.\n- Parts of it were later damaged by earthquakes.","choices":{"B":"The Colosseum, built by thousands of enslaved workers, held some 50,000 spectators.","A":"The Colosseum drew visitors from across the entire Roman Empire for its games.","D":"The Colosseum remains the most visited monument in Italy today.","C":"The Colosseum, which held some 50,000 spectators, was used for gladiatorial contests and public spectacles."},"why_wrong":{"D":"The claim that it is Italy's most visited monument today is not in the notes.","B":"The claim about enslaved workers building it appears nowhere in the notes.","A":"The claim that visitors came from across the empire is not in the notes."},"why_correct":"The goal is capacity and use; A pairs the 50,000 figure with the contests and spectacles, both from the notes.","unit":3,"stem":"The student wants to describe the Colosseum's capacity and use. Which choice most effectively uses relevant information from the notes to accomplish this goal?"},{"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Bamboo is one of the fastest-growing plants on Earth.\n- Some species can grow nearly a meter in a single day.\n- Bamboo is technically a type of grass.\n- It is used for construction, furniture, and food.","why_wrong":{"B":"The claim about whole forests appearing in months is not in the notes.","A":"The claim about poor, rocky soil is not in the notes.","C":"The comparison to rainforest trees appears nowhere in the notes."},"why_correct":"The goal is bamboo's growth speed; A joins the 'fastest-growing' claim with the meter-a-day figure, both in the notes.","choices":{"B":"Bamboo grows so fast that entire forests can appear within a few months.","A":"Bamboo can grow quickly even in poor, rocky soil.","D":"Bamboo is among the fastest-growing plants on Earth, with some species growing nearly a meter in a single day.","C":"Bamboo grows faster than any tree in the tropical rainforest."},"unit":3,"stem":"The student wants to emphasize how fast bamboo grows. Which choice most effectively uses relevant information from the notes to accomplish this goal?","correct":"D","lesson":2,"id":"u3-l2-f3-02","target_family":"Notta olmayan bilgi","choice_families":{"C":"Notta olmayan bilgi","B":"Notta olmayan bilgi","A":"Notta olmayan bilgi"}},{"id":"u3-l2-f3-03","target_family":"Notta olmayan bilgi","why_wrong":{"D":"The claim about sleep is not in the notes.","C":"The claim about problem-solving is not in the notes.","B":"The claim that it uses more than any other organ is not in the notes."},"why_correct":"The goal is energy relative to size; A pairs the 2 percent weight with the 20 percent energy, both from the notes.","stem":"The student wants to emphasize how much energy the brain uses relative to its size. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"correct":"A","lesson":2,"choice_families":{"D":"Notta olmayan bilgi","C":"Notta olmayan bilgi","B":"Notta olmayan bilgi"},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The human brain contains around 86 billion neurons.\n- Neurons communicate through electrical and chemical signals.\n- The brain uses about 20 percent of the body's energy.\n- It makes up only about 2 percent of body weight.","choices":{"B":"The human brain consumes far more energy than any other single organ found anywhere in the entire human body.","A":"Though it is only about 2 percent of body weight, the brain uses roughly 20 percent of the body's energy.","D":"The brain burns most of its energy while a person sleeps.","C":"The brain's energy demand rises sharply when a person is solving problems."}},{"choice_families":{"A":"Notta olmayan bilgi","D":"Notta olmayan bilgi","C":"Notta olmayan bilgi"},"lesson":2,"correct":"B","choices":{"D":"The route to the summit is crowded with hundreds of climbers each season.","C":"Climbers near the top must also contend with fierce, unpredictable winds.","B":"Near the summit, climbers face extreme cold and, in the 'death zone' above 8,000 meters, air too thin to survive for long.","A":"Near the summit, sudden avalanches are the leading cause of climber deaths."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Mount Everest is the highest mountain above sea level, at 8,849 meters.\n- Its summit was first reached in 1953.\n- Climbers face extreme cold and thin air near the top.\n- The 'death zone' above 8,000 meters has too little oxygen to survive for long.","target_family":"Notta olmayan bilgi","id":"u3-l2-f3-04","why_wrong":{"C":"The claim about fierce winds is not in the notes.","D":"The claim about crowding is not in the notes.","A":"The claim about avalanches being the leading cause of death is not in the notes."},"why_correct":"The goal is the dangers near the summit; A joins the extreme cold with the low-oxygen death zone, both from the notes.","unit":3,"stem":"The student wants to explain the dangers climbers face near Everest's summit. Which choice most effectively uses relevant information from the notes to accomplish this goal?"},{"unit":3,"stem":"The student wants to convey the biological diversity of the Amazon. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_wrong":{"D":"The figure of 3,000 fish species is not in the notes.","B":"The claim about insects being the most anywhere is not in the notes.","A":"The claim about thousands of unknown species is not in the notes."},"why_correct":"The goal is biological diversity; A pairs the nine-country span with the millions of species, both from the notes.","id":"u3-l2-f3-05","target_family":"Notta olmayan bilgi","choices":{"B":"The Amazon is home to more species of insects than anywhere else on Earth.","A":"The Amazon rainforest shelters many thousands of plant and animal species that remain unknown to science.","D":"The Amazon's rivers alone contain over 3,000 species of fish.","C":"The Amazon, spanning nine countries, is home to millions of species of plants and animals."},"passage":"While researching a topic, a student took the following notes:\n\n- The Amazon rainforest produces a large share of the world's oxygen.\n- It is home to millions of species of plants and animals.\n- It spans nine countries in South America.\n- Large areas are cleared each year for farming.","lesson_name":"Rhetorical Synthesis","choice_families":{"D":"Notta olmayan bilgi","B":"Notta olmayan bilgi","A":"Notta olmayan bilgi"},"correct":"C","lesson":2},{"choices":{"B":"In the Sahara, sandstorms can raise temperatures even higher during the day.","A":"The Sahara was once a green landscape with lakes and rivers.","D":"In the Sahara, daytime temperatures can top 45 degrees Celsius, yet at night they can fall below freezing.","C":"The Sahara's temperature swings are the widest of any desert on Earth."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Sahara is the largest hot desert in the world.\n- It covers much of North Africa.\n- Daytime temperatures can exceed 45 degrees Celsius.\n- At night, temperatures can drop below freezing.","choice_families":{"A":"Notta olmayan bilgi","B":"Notta olmayan bilgi","C":"Notta olmayan bilgi"},"correct":"D","lesson":2,"why_correct":"The goal is the temperature swing; A pairs the 45-degree days with the below-freezing nights, both from the notes.","why_wrong":{"A":"The claim about a once-green Sahara is not in the notes.","B":"The claim about sandstorms raising temperatures is not in the notes.","C":"The claim that its swings are the widest of any desert is not in the notes."},"unit":3,"stem":"The student wants to emphasize the Sahara's extreme temperature swings. Which choice most effectively uses relevant information from the notes to accomplish this goal?","id":"u3-l2-f3-06","target_family":"Notta olmayan bilgi"},{"why_correct":"The goal is why it was not torn down; A joins its temporary purpose with its retention as a radio antenna, both from the notes.","why_wrong":{"D":"The claim that it became a symbol of France is not in the notes.","C":"The claim about demolition cost is not in the notes.","B":"The claim that Parisians grew to love it is not in the notes."},"stem":"The student wants to explain why the Eiffel Tower was not torn down. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"id":"u3-l2-f3-07","target_family":"Notta olmayan bilgi","lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Eiffel Tower was completed in 1889.\n- It stands about 330 meters tall.\n- It was built for the World's Fair in Paris.\n- It was meant to be temporary but was kept for its use as a radio antenna.","choices":{"C":"The Eiffel Tower was kept because tearing down such a tall structure was too costly.","D":"The Eiffel Tower survived because it quickly became a symbol of France.","A":"Though built as a temporary structure for the 1889 World's Fair, the Eiffel Tower was kept for its use as a radio antenna.","B":"The Eiffel Tower was spared because Parisians had grown to love its silhouette."},"correct":"A","lesson":2,"choice_families":{"B":"Notta olmayan bilgi","D":"Notta olmayan bilgi","C":"Notta olmayan bilgi"}},{"choices":{"D":"Penguins have webbed feet that help them steer while swimming.","C":"Penguins can dive to depths of more than 500 meters in search of food.","A":"Penguins are insulated by a thick layer of blubber that keeps them warm even in freezing ocean water.","B":"Though penguins cannot fly, their wings have evolved into flippers that make them strong swimmers."},"passage":"While researching a topic, a student took the following notes:\n\n- Penguins are flightless birds.\n- Their wings have evolved into flippers for swimming.\n- Most species live in the Southern Hemisphere.\n- They huddle together in large groups to stay warm.","lesson_name":"Rhetorical Synthesis","choice_families":{"A":"Notta olmayan bilgi","C":"Notta olmayan bilgi","D":"Notta olmayan bilgi"},"correct":"B","lesson":2,"stem":"The student wants to explain how penguins are adapted for life in water. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_correct":"The goal is adaptation for water; A joins their flightlessness with the flippers that make them swimmers, both from the notes.","why_wrong":{"A":"The claim about blubber is not in the notes.","C":"The diving-depth figure is not in the notes.","D":"The claim about webbed feet is not in the notes."},"id":"u3-l2-f3-08","target_family":"Notta olmayan bilgi"},{"choices":{"C":"Honey does not spoil because its low moisture and high acidity keep bacteria from growing.","D":"Honey does not spoil because sugar itself is a poison to most microbes.","B":"Honey does not spoil because bees add a natural preservative as they make it.","A":"Honey does not spoil because it is heated to high temperatures before storage."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Honey never spoils if it is sealed and stored properly.\n- Its low moisture and high acidity stop bacteria from growing.\n- Archaeologists have found edible honey in ancient tombs.\n- Bees make honey from the nectar of flowers.","choice_families":{"B":"Notta olmayan bilgi","A":"Notta olmayan bilgi","D":"Notta olmayan bilgi"},"correct":"C","lesson":2,"why_wrong":{"D":"The claim that sugar poisons microbes is not in the notes.","B":"The claim about a preservative added by bees is not in the notes.","A":"The claim about heating is not in the notes."},"why_correct":"The goal is why honey does not spoil; A uses the low moisture and high acidity from the notes.","unit":3,"stem":"The student wants to explain why honey does not spoil. Which choice most effectively uses relevant information from the notes to accomplish this goal?","id":"u3-l2-f3-09","target_family":"Notta olmayan bilgi"},{"id":"u3-l2-f3-10","target_family":"Notta olmayan bilgi","unit":3,"stem":"The student wants to explain the canal's main benefit to shipping. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_wrong":{"C":"The claim about the largest ships is not in the notes.","B":"The claim about halving shipping cost is not in the notes.","A":"The claim that it became the busiest waterway is not in the notes."},"why_correct":"The goal is the main benefit; A joins the ocean connection with sparing the long voyage, both from the notes.","correct":"D","lesson":2,"choice_families":{"C":"Notta olmayan bilgi","B":"Notta olmayan bilgi","A":"Notta olmayan bilgi"},"passage":"While researching a topic, a student took the following notes:\n\n- The Panama Canal connects the Atlantic and Pacific Oceans.\n- It opened in 1914.\n- It uses a system of locks to raise and lower ships.\n- It saves ships from the long journey around South America.","lesson_name":"Rhetorical Synthesis","choices":{"D":"By connecting the Atlantic and Pacific, the Panama Canal spares ships the long voyage around South America.","C":"The Panama Canal allowed the largest cargo ships of its era to pass with ease.","A":"The Panama Canal became the busiest waterway in the world after it opened.","B":"The Panama Canal is often said to have cut the overall cost of shipping goods around the world by almost half."}},{"correct":"D","lesson":2,"id":"u3-l2-f4-01","target_family":"Yanlış vurgu","choice_families":{"C":"Amacı karşılamıyor","B":"Yanlış vurgu","A":"Tek not sentez yok"},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The tomato is botanically a fruit.\n- In cooking it is treated as a vegetable.\n- It is native to South America.\n- It was brought to Europe in the sixteenth century.","why_wrong":{"C":"This emphasizes origin alone.","A":"This gives only the botanical side, so no gap is shown.","B":"This emphasizes origin and history, not the classification gap."},"why_correct":"The goal is the botanical-culinary gap; A sets the fruit classification against the vegetable treatment.","choices":{"C":"The tomato is native to South America.","D":"Although the tomato is botanically a fruit, in the kitchen it is treated as a vegetable.","B":"The tomato, native to South America, reached Europe in the sixteenth century.","A":"The tomato is botanically classified as a fruit."},"stem":"The student wants to emphasize the gap between the tomato's botanical and culinary classification. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3},{"passage":"While researching a topic, a student took the following notes:\n\n- The Mona Lisa was painted by Leonardo da Vinci.\n- It is famous for the subject's enigmatic smile.\n- It hangs in the Louvre in Paris.\n- It is protected behind bulletproof glass.","lesson_name":"Rhetorical Synthesis","choices":{"D":"The Mona Lisa hangs in the Louvre in Paris.","C":"The Mona Lisa is protected behind bulletproof glass.","A":"The Mona Lisa, painted by Leonardo da Vinci, is best known for the subject's enigmatic smile.","B":"The Mona Lisa hangs in the Louvre, protected behind bulletproof glass."},"correct":"A","lesson":2,"choice_families":{"B":"Yanlış vurgu","D":"Amacı karşılamıyor","C":"Amacı karşılamıyor"},"stem":"The student wants to emphasize what makes the painting artistically famous. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_correct":"The goal is artistic fame; A joins the painter with the enigmatic smile, the source of its acclaim.","why_wrong":{"B":"This emphasizes its location and security, not what makes it artistically famous.","D":"This emphasizes its location alone.","C":"This emphasizes its protection, not its artistry."},"id":"u3-l2-f4-02","target_family":"Yanlış vurgu"},{"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Antarctica is the coldest continent on Earth.\n- It holds about 70 percent of the world's fresh water as ice.\n- No permanent human population lives there.\n- Scientists visit to conduct research.","choices":{"D":"Scientists visit Antarctica to conduct research.","C":"Antarctica has no permanent human population.","B":"Antarctica holds about 70 percent of the world's fresh water, locked away as ice.","A":"Antarctica is the coldest continent, with no permanent human population."},"why_wrong":{"C":"This emphasizes the absence of people.","D":"This emphasizes research visits, not the water reserve.","A":"This emphasizes cold and lack of population, not the water reserve."},"why_correct":"The goal is its role as a water reserve; A foregrounds the 70 percent fresh-water figure.","stem":"The student wants to emphasize Antarctica's importance as a water reserve. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"lesson":2,"correct":"B","target_family":"Yanlış vurgu","id":"u3-l2-f4-03","choice_families":{"D":"Amacı karşılamıyor","C":"Amacı karşılamıyor","A":"Yanlış vurgu"}},{"choices":{"A":"The cheetah hunts mainly during the day.","B":"The cheetah is able to hold its remarkable top speed only for very short bursts before it quickly tires.","D":"The cheetah can sustain its fastest pace only briefly.","C":"The cheetah is the fastest land animal, reaching speeds of about 110 kilometers per hour."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The cheetah is the fastest land animal.\n- It can reach speeds of about 110 kilometers per hour.\n- It can sustain top speed only for short bursts.\n- It hunts mainly by day.","choice_families":{"B":"Yanlış vurgu","A":"Amacı karşılamıyor","D":"Yanlış vurgu"},"correct":"C","lesson":2,"why_correct":"The goal is the cheetah's speed; A joins its status as fastest with the 110 km/h figure.","why_wrong":{"B":"This emphasizes the limit on its speed, not the speed itself.","A":"This emphasizes its hunting schedule, not its speed.","D":"This emphasizes the brevity of its top pace rather than the speed."},"stem":"The student wants to emphasize the cheetah's remarkable speed. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"id":"u3-l2-f4-04","target_family":"Yanlış vurgu"},{"id":"u3-l2-f4-05","target_family":"Yanlış vurgu","correct":"D","lesson":2,"choice_families":{"B":"Yanlış vurgu","A":"Notta olmayan bilgi","C":"Amacı karşılamıyor"},"passage":"While researching a topic, a student took the following notes:\n\n- The Rosetta Stone is inscribed in three scripts.\n- The same text appears in hieroglyphic, Demotic, and Greek.\n- Scholars used the Greek to decode the hieroglyphs.\n- It was discovered in Egypt in 1799.","lesson_name":"Rhetorical Synthesis","stem":"The student wants to emphasize why the stone was key to decoding hieroglyphs. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_wrong":{"B":"This emphasizes the discovery date, not the decoding.","A":"The detail about soldiers on a campaign is not in the notes.","C":"This notes three scripts but does not explain the decoding."},"why_correct":"The goal is why it was key to decoding; A links the shared Greek and hieroglyphic text to how scholars decoded the script.","choices":{"D":"Because the Rosetta Stone repeats the same text in Greek and hieroglyphs, scholars could use the Greek to decode the hieroglyphs.","C":"The Rosetta Stone is inscribed in three different scripts.","A":"The Rosetta Stone was discovered by soldiers during a military campaign.","B":"The Rosetta Stone was discovered in Egypt in 1799."}},{"choice_families":{"D":"Amacı karşılamıyor","C":"Yanlış vurgu","B":"Yanlış vurgu"},"lesson":2,"correct":"A","target_family":"Yanlış vurgu","id":"u3-l2-f4-06","choices":{"C":"The blue whale survives on some of the smallest creatures in the sea.","D":"The blue whale's diet consists mostly of krill.","A":"The largest animal ever known, the blue whale can reach about 30 meters in length.","B":"The blue whale feeds almost entirely on tiny, shrimp-like krill."},"why_correct":"The goal is enormous size; A joins its status as largest with the 30-meter length.","why_wrong":{"D":"This emphasizes diet, not size.","C":"This emphasizes the smallness of its food, a contrast that shifts focus from size.","B":"This emphasizes its diet, not its size."},"unit":3,"stem":"The student wants to emphasize the blue whale's enormous size. Which choice most effectively uses relevant information from the notes to accomplish this goal?","lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The blue whale is the largest animal known to have existed.\n- It can grow to about 30 meters long.\n- Its heart alone can weigh as much as a small car.\n- It feeds almost entirely on tiny shrimp-like krill."},{"choice_families":{"A":"Yanlış vurgu","C":"Amacı karşılamıyor","D":"Notta olmayan bilgi"},"correct":"B","lesson":2,"id":"u3-l2-f4-07","target_family":"Yanlış vurgu","why_wrong":{"A":"This emphasizes how busy it is, not how it shortens routes.","C":"This emphasizes its opening date.","D":"The specific claim about a share of global trade is not in the notes."},"why_correct":"The goal is how it shortens routes; A links the two seas to avoiding the route around Africa.","choices":{"D":"The Suez Canal carries a large share of global trade each year.","C":"The Suez Canal opened in 1869.","B":"By linking the Mediterranean to the Red Sea, the Suez Canal lets ships avoid the long route around Africa.","A":"The Suez Canal is one of the world's busiest shipping routes."},"unit":3,"stem":"The student wants to emphasize how the canal shortens shipping routes. Which choice most effectively uses relevant information from the notes to accomplish this goal?","lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Suez Canal opened in 1869.\n- It links the Mediterranean Sea to the Red Sea.\n- It lets ships avoid sailing around Africa.\n- It is one of the world's busiest shipping routes."},{"unit":3,"stem":"The student wants to emphasize the contrast between van Gogh's fortunes in life and after death. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_wrong":{"D":"This states only his present fame, without the contrast with his life.","A":"This emphasizes his productivity, not the contrast.","B":"This emphasizes his output, not the contrast in fortunes."},"why_correct":"The goal is the life-versus-afterlife contrast; A sets the few sales in life against the millions his works bring now.","id":"u3-l2-f4-08","target_family":"Yanlış vurgu","choices":{"B":"Van Gogh produced over 2,000 artworks in about a decade.","A":"Van Gogh created a remarkable number of works in only ten years.","C":"Van Gogh sold very few paintings while alive, yet today his works fetch tens of millions of dollars.","D":"Van Gogh is today widely regarded as one of the most celebrated and influential painters in all of history."},"passage":"While researching a topic, a student took the following notes:\n\n- Vincent van Gogh sold very few paintings in his lifetime.\n- Today his works sell for tens of millions of dollars.\n- He produced over 2,000 artworks in about a decade.\n- He is now one of the most celebrated painters in history.","lesson_name":"Rhetorical Synthesis","choice_families":{"D":"Tek not sentez yok","B":"Yanlış vurgu","A":"Yanlış vurgu"},"correct":"C","lesson":2},{"id":"u3-l2-f4-09","target_family":"Yanlış vurgu","why_correct":"The goal is lifespan; A foregrounds the 3,000-year figure.","why_wrong":{"B":"This emphasizes fire protection, not lifespan.","A":"This emphasizes volume, not lifespan.","C":"This emphasizes height, not lifespan."},"stem":"The student wants to emphasize the extraordinary lifespan of the giant sequoia. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"correct":"D","lesson":2,"choice_families":{"A":"Yanlış vurgu","B":"Amacı karşılamıyor","C":"Yanlış vurgu"},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The giant sequoia is among the largest trees by volume.\n- Some are over 80 meters tall.\n- They can live for more than 3,000 years.\n- Their thick bark protects them from fire.","choices":{"C":"Some giant sequoias stand over 80 meters tall.","D":"Giant sequoias can live for more than 3,000 years, far outlasting most other trees.","B":"Giant sequoias have thick bark that protects them from fire.","A":"The giant sequoia is among the largest trees by volume."}},{"choices":{"A":"From a network of a handful of university computers in the late 1960s, the Internet now links billions of devices worldwide.","B":"The Internet has become central to work, learning, and communication.","C":"The Internet is now essential to how people work and learn.","D":"The Internet began as a small research network in the late 1960s."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Internet began as a small research network in the late 1960s.\n- It connected just a handful of university computers.\n- Today it links billions of devices worldwide.\n- It has become central to work, learning, and communication.","choice_families":{"B":"Yanlış vurgu","C":"Yanlış vurgu","D":"Tek not sentez yok"},"lesson":2,"correct":"A","why_wrong":{"B":"This emphasizes its importance, not its growth.","D":"This gives only the starting point, so no growth is shown.","C":"This emphasizes its role, not its growth in scale."},"why_correct":"The goal is the scale of growth; A sets the handful of early computers against billions of devices today.","unit":3,"stem":"The student wants to emphasize how much the Internet has grown since its beginnings. Which choice most effectively uses relevant information from the notes to accomplish this goal?","target_family":"Yanlış vurgu","id":"u3-l2-f4-10"}],"families":["Amacı karşılamıyor","Tek not sentez yok","Notta olmayan bilgi","Yanlış vurgu"],"name":"Rhetorical Synthesis","main_ids":["u3-l2-f1-01","u3-l2-f2-01","u3-l2-f3-01","u3-l2-f4-01"],"fam_short":{"Tek not sentez yok":"Sentez yok","Yanlış vurgu":"Yanlış vurgu","Amacı karşılamıyor":"Amaç dışı","Notta olmayan bilgi":"Notta yok"},"teaching":{"ne_olculuyor":["Bir konu hakkında alınmış notlar listesi ve bir YAZMA AMACI verilir. Görev: o amacı en iyi karşılayan cümleyi seçmek.","Bu soru dilbilgisi değil, AMAÇ uyumu ölçer. Cümle doğru olabilir, notlardan gelebilir, ama istenen amacı yapmıyorsa yanlıştır.","Kritik nokta: önce AMACI oku, sonra cevap ara. Amaç neyi vurgulamanı istiyorsa cevap onu yapmalı. Çoğu tuzak doğru bilgiyi yanlış amaç için kullanır."],"celdirici_aileleri":[{"tanim":"Cümle doğru ve notlardan gelir ama istenen AMACI yapmaz. Amaç karşılaştırma isterken sadece tanımlar, ya da vurgu isterken düz bilgi verir. Doğru bilgi, yanlış is.","ad":"Amacı karşılamıyor"},{"ad":"Tek not sentez yok","tanim":"Amaç birden çok bilgiyi BİRLEŞTİRMEYİ isterken cümle tek nota dayanır. Karşılaştırma ya da bağlantı amacında tek unsur eksik kalır. Sentez yapılmamıştır."},{"tanim":"Cümle notlarda BULUNMAYAN bir bilgi ekler. Makul görünür ama dayanağı yoktur. Öğrenci dışarıdan bilgi kattığı için seçer, ama sentez notlara dayanmalı.","ad":"Notta olmayan bilgi"},{"tanim":"Cümle notları kullanır ama amacın istediğinden BAŞKA şeyi öne çıkarır. Amaç bir özelliği vurgulamanı isterken cümle başka bir ayrıntıyı merkeze alır. Yön yanlıştır.","ad":"Yanlış vurgu"},{"tanim":"Seçenek notlardaki gerçek bir bilgiyi doğru biçimde aktarır ama sorunun istediği amaca hizmet etmez; bilgi doğru olduğu için öğrenci onu seçme eğilimine girer.","ad":"Doğru bilgi, yanlış hedef"},{"tanim":"Seçenek birden fazla notu tek cümlede toplar ve dolu görünür; ancak hedefe odaklanmak yerine dikkati dağıtır, istenen tek noktayı vurgulamaz.","ad":"Çok not birleştirme"},{"ad":"Genelleme yerine ayrıntı","tanim":"Hedef genel bir önemi ya da ana fikri isterken, çeldirici küçük bir ayrıntıya (tarih, sayı, isim) takılır; ayrıntı somut göründüğü için öğrenciyi cezbeder."}],"cozumlu_ornekler":[{"adimlar":["Önce amacı oku: KÜÇÜLMENİN ÖLÇEĞİNİ vurgulamak.","Ölçek göstermek için, eski büyüklükle şimdiki durumu yan yana koymak gerek.","A tam bunu yapar: dördüncü en büyük göl, onda birine düşmüş. Büyüklüğü gösterir.","B küçülmenin nedenini verir, ölçeğini değil. C sadece eski durumu verir. D notta yok, boş bir cümle."],"correct":"A","passage":"While researching a topic, a student took the following notes:\n\n- The Aral Sea was once the fourth-largest lake in the world.\n- By 2010 it had shrunk to a tenth of its original size.\n- Rivers feeding it were diverted for cotton farming.","choices":{"C":"The Aral Sea was once the fourth-largest lake in the world.","D":"The Aral Sea has a long and interesting history.","A":"Once the world's fourth-largest lake, the Aral Sea had shrunk to a tenth of its original size by 2010.","B":"The rivers feeding the Aral Sea were diverted for cotton farming."},"sonuc":"Amaç ölçeği vurgulamak. Doğru cevap eski ve yeni durumu birleştirip büyüklüğü gösterir.","stem":"The student wants to emphasize the scale of the Aral Sea's shrinkage. Which choice best accomplishes this goal?"},{"stem":"The student wants to compare how the two instruments are played. Which choice best accomplishes this goal?","choices":{"C":"Both instruments produce sound from vibrating strings.","D":"The guitar is a popular instrument in many kinds of music.","B":"The violin is played with a bow drawn across its strings.","A":"While the violin is played with a bow, the guitar is usually plucked with the fingers."},"sonuc":"Amaç karşılaştırma ise cevap iki notu birleştirmeli. Tek nota dayanan seçenek eksiktir.","passage":"While researching, a student took the following notes:\n\n- The violin is played with a bow drawn across its strings.\n- The guitar is usually played by plucking its strings with the fingers.\n- Both produce sound from vibrating strings.","adimlar":["Amacı oku: iki çalgıyı NASIL çalındığı açısından KARŞILAŞTIRMAK.","Karşılaştırma iki bilgiyi birleştirmeyi gerektirir.","A hem keman (yay) hem gitar (parmak) bilgisini birleştirir, karşılaştırır.","B sadece kemanı verir, tek not, sentez yok. C ortak özelliği verir, çalınışı değil. D notta yok."],"correct":"A"},{"correct":"C","adimlar":["Hedefi belirle: öğrenci axolotl'un YENİLENME (rejenerasyon) yeteneğini vurgulamak istiyor.","Her seçeneğin hangi notu kullandığına bak; sadece uzuv/kalp/beyin yenileme notu hedefe uyar.","A ve C dışındakiler yaşam alanı ya da metamorfoz notlarını kullanıyor, rejenerasyona değinmiyor.","C seçeneği doğrudan uzuvları, kalbi ve beyni yeniden büyütmeyi anlatır; hedefe tam oturur."],"passage":"While researching for a presentation, a student took the following notes:\n- The axolotl is a type of salamander native to lakes near Mexico City.\n- Unlike most amphibians, the axolotl retains its larval features throughout its life.\n- It never undergoes metamorphosis into a fully terrestrial adult.\n- It can regenerate lost limbs, parts of its heart, and even portions of its brain.\n\nThe student wants to emphasize the axolotl's regenerative ability. Which choice most effectively uses relevant information from the notes to accomplish this goal?","sonuc":"Doğru cevap C. Yalnızca C, rejenerasyon notunu kullanarak öğrencinin vurgulamak istediği yeteneği öne çıkarır.","choices":{"A":"The axolotl, a salamander native to lakes near Mexico City, never undergoes metamorphosis.","B":"Unlike most amphibians, the axolotl keeps its larval features for its whole life.","C":"The axolotl can regrow lost limbs, parts of its heart, and even portions of its brain.","D":"The axolotl is a salamander that lives in lakes located near Mexico City."},"stem":"Which choice most effectively accomplishes the student's goal?"},{"sonuc":"Doğru cevap B. İki tarihli fiyatı karşılaştıran tek seçenek olduğu için maliyet değişimini net biçimde vurgular.","choices":{"C":"Solar power has now become genuinely competitive with traditional fossil fuels in a great many regions all around the world today.","D":"Photovoltaic cells, found in solar panels, turn sunlight into electricity.","A":"Solar panels use photovoltaic cells to convert sunlight into usable electricity.","B":"Between 2010 and 2020, the average cost of a solar panel fell from about $2.00 to roughly $0.20 per watt."},"stem":"Which choice most effectively accomplishes the student's goal?","correct":"B","adimlar":["Hedefi belirle: zaman içinde MALİYET DEĞİŞİMİNİ vurgulamak.","Değişim göstermek için iki farklı zamandaki iki sayı gerekir (2010 ve 2020 fiyatları).","A ve D teknolojiyi anlatır, fiyat değişimi yok; C sonucu söyler ama sayısal değişimi göstermez.","Sadece B iki yıla ait iki fiyatı yan yana koyarak açık bir düşüşü gösterir."],"passage":"While researching a topic, a student has taken the following notes:\n- Solar panels convert sunlight into electricity using photovoltaic cells.\n- In 2010, the average cost of a solar panel was about $2.00 per watt.\n- By 2020, that cost had fallen to roughly $0.20 per watt.\n- This price drop made solar power competitive with fossil fuels in many regions.\n\nThe student wants to highlight a change in the cost of solar panels over time. Which choice most effectively uses relevant information from the notes to accomplish this goal?"},{"adimlar":["Hedefi belirle: mercan ağarmasının (bleaching) NEDENİNİ açıklamak.","Neden-açıklama, sürecin nasıl gerçekleştiğini anlatan notu gerektirir.","A ve B boyut ve tür çeşitliliğini anlatır, nedene değinmez; C ağarmanın olduğunu söyler ama neden olduğunu açıklamaz.","Sadece D, stresli mercanın alg atmasıyla ağarmanın nasıl oluştuğunu anlatarak nedeni verir."],"correct":"D","passage":"While researching a topic, a student has taken the following notes:\n- The Great Barrier Reef stretches over 2,300 kilometers along Australia's coast.\n- It is home to over 1,500 species of fish and 400 types of coral.\n- Rising ocean temperatures have caused several mass bleaching events since 1998.\n- Bleaching occurs when stressed coral expels the algae that give it color and food.\n\nThe student wants to explain the cause of coral bleaching. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"C":"Since 1998, the reef has experienced several mass bleaching events.","D":"Coral bleaching occurs when stressed coral expels the algae that provide its color and food.","B":"The reef supports more than 1,500 species of fish and 400 types of coral.","A":"The Great Barrier Reef, stretching over 2,300 kilometers, lies along the northeastern coast of Australia."},"sonuc":"Doğru cevap D. Ağarmanın mekanizmasını açıklayan tek seçenek olduğu için nedeni hedefe uygun biçimde verir.","stem":"Which choice most effectively accomplishes the student's goal?"},{"stem":"Which choice most effectively accomplishes the student's goal?","choices":{"B":"Goodall watched chimpanzees strip leaves from twigs to fish for termites.","A":"Jane Goodall started studying wild chimpanzees in Tanzania back in 1960.","D":"Goodall spent many long years patiently living among the wild chimpanzees she studied in the forests of Tanzania.","C":"By showing that chimpanzees make and use tools, Goodall overturned a trait long thought to be uniquely human."},"sonuc":"Doğru cevap C. Keşfin bilimsel anlamını vurgulayan tek seçenek olduğu için önemi hedefe uygun aktarır.","passage":"While researching a topic, a student has taken the following notes:\n- Jane Goodall began studying wild chimpanzees in Tanzania in 1960.\n- She observed chimpanzees stripping leaves off twigs to fish for termites.\n- This showed that chimpanzees make and use tools, a trait once thought uniquely human.\n- Her findings forced scientists to redefine what separates humans from other animals.\n\nThe student wants to present the significance of Goodall's discovery to a broad audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?","adimlar":["Hedefi belirle: keşfin ÖNEMİNİ/anlamını geniş bir kitleye sunmak.","Önem, bulgunun bilime ne kattığını gösteren notu (araç kullanımının insana özgü sanılması) gerektirir.","A tarih verir, B gözlemin ayrıntısını verir, D süreyi anlatır; hiçbiri 'neden önemli' sorusuna yanıt vermez.","Sadece C, araç kullanımının insana özgü sanılan bir özelliği çürüttüğünü söyleyerek önemi öne çıkarır."],"correct":"C"}],"kavramsal_temel":["Rhetorical Synthesis, notlar listesi ve bir YAZMA AMACI verir, o amacı en iyi karşılayan cümleyi seçmeni ister. Bu soru dilbilgisi değil, amaç uyumu ölçer.","Cümle doğru olabilir, notlardan gelebilir, ama istenen amacı yapmıyorsa yanlıştır. Önce AMACI oku, sonra cevap ara. Amaç neyi vurgulamanı istiyorsa cevap onu yapmalı.","Amaç karşılaştırma ya da bağlantı istiyorsa cevap BİRDEN ÇOK notu birleştirmeli. Tek nota dayanan cevap eksik kalır. Amaç emphasize the difference diyorsa cümle farkı göstermeli.","Ayrıca cevaptaki her bilgi notlarda olmalı. Kulağa doğru gelen ama notta olmayan detay tuzaktır. Sentez dışarıdan bilgi katmaz, verilen notları amaca göre kullanır.","Rhetorical Synthesis soruları bir yazma-karar testidir: sana bir dizi ham not verilir ve belirli bir retorik hedefi (bir amacı) en iyi gerçekleştiren cümleyi seçmen istenir. Buradaki kritik nokta, doğru cevabın 'en doğru bilgi' değil, 'hedefe en uygun bilgi' olmasıdır. Notların hepsi genellikle gerçektir; çeldiriciler de gerçek notları kullanır. Bu yüzden soruyu çözmenin ilk ve en önemli adımı, seçeneklere hiç bakmadan hedef cümlesini bulup onu tek bir göreve indirgemektir: 'bir değişimi göster', 'bir nedeni açıkla', 'iki şeyi karşılaştır', 'önemini vurgula'. Bu görev netleşmeden yapılan her seçim tahmine dönüşür.","Hedefi belirledikten sonra her seçeneği bir filtreden geçir: 'Bu cümle, istenen görevi yerine getiriyor mu?' Bir seçenek notlardan doğru bir bilgi taşısa bile, eğer hedefin sorduğu işi yapmıyorsa yanlıştır. Örneğin hedef bir maliyet değişimini vurgulamaksa, teknolojinin nasıl çalıştığını anlatan doğru bir cümle bile yanlış cevaptır çünkü değişim göstermez. Değişim için iki zamandaki iki değer, neden için bir mekanizma, karşılaştırma için yan yana konmuş iki öğe gerekir. Doğru cevabı seçmenin en güvenilir yolu, seçeneğin uzunluğuna ya da ne kadar bilgi içerdiğine değil, hedefin mantıksal gereğini karşılayıp karşılamadığına bakmaktır."],"sik_hatalar":[{"hata":"Amacı okumadan cevap seçmek","cozum":"Önce amacı oku. Amacı bilmeden en doğru görünen cümleyi seçersin, amacı karşılayanı değil."},{"hata":"Karşılaştırma amacında tek not kullanmak","cozum":"compare, contrast, connection varsa cevap iki bilgiyi birleştirmeli. Tek nota dayanan seçenek amacı karşılamaz."},{"hata":"Notta olmayan bilgi eklemek","cozum":"Cevaptaki her olguyu notlarda ara. Notta yoksa, ne kadar mantıklı olsa da yanlıştır."},{"hata":"Yanlış vurgu yapmak","cozum":"Cümle notları kullanabilir ama amacın istediğinden başka şeyi öne çıkarıyorsa yanlıştır. Amacın anahtar kelimesiyle test et."},{"cozum":"Önce hedef cümlesini yuvarlak içine al ve tek bir görevle özetle; her seçeneği yalnızca 'bu görevi yapıyor mu' diye test et, bilgi doğruluğuyla değerlendirme.","hata":"Öğrenci soruda belirtilen hedefi (örneğin 'nedeni açıkla' ya da 'değişimi vurgula') okumadan, notlara en sadık ya da en bilgi dolu seçeneği doğru sanıyor."},{"hata":"Öğrenci en uzun ve en çok not içeren seçeneği 'daha eksiksiz' diye seçiyor; oysa fazladan bilgi hedefi bulanıklaştırıyor.","cozum":"Uzunluğu değil odağı ölç; hedefe doğrudan hizmet eden, gereksiz not eklemeyen seçenek çoğu zaman daha kısa olandır."}],"alt_konular":[{"govde":["Soru kökünde öğrencinin ulaşmak istediği amaç yazılıdır: karşılaştırmak, bir sonucu vurgulamak, bir kavramı tanıtmak, iki bulguyu bağlamak. Bu cümleyi diğer her şeyden önce oku ve altını çiz.","Hedef, doğru cevabın hangi bilgiyi ÖNE çıkaracağını belirler. 'Vurgulamak' isteniyorsa doğru cümle o noktayı merkeze alır; 'tanıtmak' isteniyorsa temel/giriş niteliğinde bilgi verir.","En sık hata: hedefi atlayıp 'doğru ve notlarla tutarlı' herhangi bir cümleyi seçmek. Notlarla tutarlı ama hedefi ıskalayan cümle yanlıştır."],"kural":"Önce hedef cümlesini çöz; doğru cevap notlarla tutarlı OLMAKLA kalmaz, hedefi de birebir gerçekleştirir.","baslik":"1) Hedefi doğru okuma (identify the goal)"},{"govde":["Notların hepsi doğrudur ama hepsi hedefe hizmet etmez. Doğru cevap, hedef için GEREKLİ notları alır, gereksizleri dışarıda bırakır.","Yöntem: her seçeneği 'bu cümle hedefi yapıyor mu?' diye ele. İki seçenek de hedefi yapıyorsa, hangisi daha AZ gereksiz bilgi taşıyorsa o daha iyidir — SAT sadeliği ödüllendirir.","Tuzak: iki notu doğru birleştiren ama hedefin istemediği bir ilişki kuran cümle; ya da tek bir notu tekrarlayıp sentez yapmayan cümle."],"ornek":"Hedef 'iki türü karşılaştırmak' ise, doğru cümle her iki türe ait notu yan yana getirir; tek türü anlatan seçenek elenir.","baslik":"2) İlgili bilgiyi seçme ve birleştirme (select & combine)"}],"top_tips":["Önce amacı oku, seçenekleri değil. Amacı bilmeden seçenek okursan en doğru görünen cümleyi seçersin, amacı karşılayanı değil.","Amaçta compare, contrast, connection varsa cevap MUTLAKA iki bilgiyi birleştirmeli. Tek nota dayanan seçenek bu amacı karşılamaz.","Her seçeneği amacın anahtar kelimesiyle test et. Amaç emphasize the difference diyorsa, cümle farkı gösteriyor mu diye sor.","Cevaptaki her olguyu notlarda ara. Notta yoksa, ne kadar mantıklı olursa olsun, yanlıştır. Sentez dışarıdan bilgi katmaz."],"strateji":["Önce amacı oku, notları değil. Amacın anahtar sözünü işaretle.","Amaç karşılaştırma ya da bağlantı istiyorsa sentez ara, tek not yetmez.","Her seçeneği amaca göre test et: bu cümle amacı YAPIYOR mu.","Notta olmayan bilgi içeren seçeneği ele.","Amacın istediğinden başka şeyi vurgulayan seçeneği ele."],"karar_proseduru":["ÖNCE AMACI OKU, notları değil. Soru kökündeki amacı tek cümleyle kendine söyle.  Örneğin iki şeyi karşılaştırmak, bir özelliği tanıtmak, bir sonuca varmak.","Amacın anahtar sözünü işaretle.  compare, emphasize, introduce, describe. Bu kelime cevabın ne yapması gerektiğini söyler.","Her seçeneği amaca göre test et.  Bu cümle amacı YAPIYOR mu. Sadece doğru olmak yetmez, amacı karşılamalı.","Sentez gerekiyor mu bak.  Amaç karşılaştırma ya da bağlantı istiyorsa cevap BİRDEN ÇOK notu birleştirmeli. Tek nota dayanan cevap eksiktir.","Notlarda olmayanı ele.  Cevaptaki her bilgi notlarda olmalı. Kulağa doğru gelen ama notta olmayan detay tuzaktır."],"alt_konular_intro":"Rhetorical Synthesis'te sana madde madde notlar (bullet points) ve bir HEDEF cümlesi verilir. Görevin, o hedefi en iyi gerçekleştiren cümleyi kurmaktır. Bu soru okuma değil, amaca uygun yazma becerisidir. Kilit her zaman hedef cümlesindedir: 'to emphasize X', 'to introduce Y to an audience unfamiliar with it' gibi. Önce hedefi çöz, sonra notları ona göre kullan.","alt_konular_baslik":"Soru alt tipleri"}}],"unit_accent":"warm","unit_title":"SAT Reading & Writing Kampı"}</script><script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail'),main=document.getElementById('main');
const L=['A','B','C','D'];
const S={cur:0,lp:D.lessons.map(l=>({seen:new Set(),family:Object.fromEntries(l.families.map(f=>[f,'pending'])),phaseDone:{lesson:false,practice:false}})),
         phase:'lesson',queue:[],idx:0,remedFor:null,remedCount:0,activeQ:null,picked:null,locked:false};
const SB_URL=(window.SUPABASE_URL||'https://vazbvbqgvtlaqkytfsbi.supabase.co');
const SB_KEY=(window.SUPABASE_KEY||'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g');
const Progress={client:null,userId:null,
  _wait(cb,t){t=t||0;if(window.supabase&&window.supabase.createClient){cb();return;}if(t>30)return;setTimeout(()=>this._wait(cb,t+1),100);},
  async init(){try{if(!window.supabase)return;this.client=window.supabase.createClient(SB_URL,SB_KEY);
    const r=await this.client.auth.getSession();this.userId=(r&&r.data&&r.data.session)?r.data.session.user.id:null;}catch(e){this.client=null;}},
  async load(unit){if(!this.client||!this.userId)return null;try{
    const a=await this.client.from('sat_module_progress').select('lesson,family,status').eq('user_id',this.userId).eq('unit',unit);
    const b=await this.client.from('sat_lesson_state').select('lesson,practice_done').eq('user_id',this.userId).eq('unit',unit);
    return {fam:(a&&a.data)||[],st:(b&&b.data)||[]};}catch(e){return null;}},
  saveFamily(unit,lesson,family,status){if(!this.client||!this.userId)return;
    this.client.from('sat_module_progress').upsert({user_id:this.userId,unit,lesson,family,status,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson,family'}).then(()=>{},()=>{});},
  saveState(unit,lesson,seen){if(!this.client||!this.userId)return;
    this.client.from('sat_lesson_state').upsert({user_id:this.userId,unit,lesson,practice_done:true,seen_count:seen,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson'}).then(()=>{},()=>{});},
  boot(){this._wait(async()=>{await this.init();const d=await this.load(D.unit);if(!d)return;
    d.fam.forEach(r=>{const i=r.lesson-1;if(S.lp[i]&&(r.family in S.lp[i].family))S.lp[i].family[r.family]=r.status;});
    d.st.forEach(r=>{const i=r.lesson-1;if(S.lp[i])S.lp[i].phaseDone.practice=!!r.practice_done;});
    renderRail();});},
};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const curL=()=>D.lessons[S.cur], lp=()=>S.lp[S.cur];
const sf=f=>{const l=curL();return (l.fam_short&&l.fam_short[f])||f;};
const qById=id=>curL().questions.find(q=>q.id===id);
const unseen=fam=>curL().questions.find(q=>q.target_family===fam&&!lp().seen.has(q.id));
function setMode(m){S.phase=m;main.setAttribute('data-mode',m==='test'?'test':m);}
function tableHTML(t){if(!t)return'';
  const head=t.head.map(h=>`<th>${esc(h)}</th>`).join('');
  const rows=t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('');
  return `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;}
function renderRail(){
  const cur=S.phase;
  const link=(id,label,lock)=>`<a data-action="nav" data-target="${id}" class="${cur===id?'cur':''} ${lp().phaseDone[id]?'ok':''} ${lock?'lock':''}"><span class="dot"></span>${label}${lock?' <span style="margin-left:auto;font-size:10px;opacity:.6">yakinda</span>':''}</a>`;
  const lessons=D.lessons.map((l,i)=>{
    const active=i===S.cur;
    const done=S.lp[i].phaseDone.practice;
    const cls=active?'les active':(done?'les done':'les');
    const akList=(active&&curL().teaching.alt_konular&&curL().teaching.alt_konular.length)?`<div class="aknav">${curL().teaching.alt_konular.map((s,ai)=>`<a class="aklink" data-action="akjump" data-ak="${ai}">${esc(s.baslik)}</a>`).join('')}</div>`:'';
    const sub=active?`<div class="sub">${link('lesson','Konu anlatimi',false)}${akList}${link('practice','Alistirma',false)}${link('test','Ünite Testi',false)}</div>`:'';
    return `<div class="${cls}"><div class="lh" data-action="goto" data-lesson="${i}"><span class="n">${i+1}</span><span class="lt">${esc(l.name)}</span></div>${sub}</div>`;
  }).join('');
  const quads=curL().families.map(f=>{const st=lp().family[f];
    return `<div class="quad ${st==='mastered'?'mastered':st==='shaky'?'shaky':''}"><span class="qf">${esc(sf(f))}</span></div>`;}).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span>
    <div class="ut">${esc(D.unit_title)}</div><div>${lessons}</div>
    <div class="compass"><div class="cl">Tuzak pusulası</div><div class="grid2">${quads}</div></div></div>`;
}
function gotoLesson(i){S.cur=i;S.remedFor=null;S.remedCount=0;lessonView();}
function lessonView(){
  setMode('lesson');renderRail();const l=curL(),t=l.teaching;
  const secKT=(t.kavramsal_temel&&t.kavramsal_temel.length)?`<h2>Kavramsal temel</h2><div class="rule"></div>${t.kavramsal_temel.map(x=>`<p>${esc(x)}</p>`).join('')}`:'';
  const secSUB=(t.alt_konular&&t.alt_konular.length)?`<h2>${esc(t.alt_konular_baslik||'Konunun alt başlıkları')}</h2><div class="rule"></div><p class="sub-intro">${esc(t.alt_konular_intro||'')}</p>${t.alt_konular.map((s,ai)=>`<div class="subtopic" id="ak-${ai}"><h3>${esc(s.baslik)}</h3>${(s.govde||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.kural?`<div class="subrule"><span class="subrule-l">Kural</span> ${esc(s.kural)}</div>`:''}${s.ornek?`<div class="subex"><span class="subex-l">Mini örnek</span> ${esc(s.ornek)}</div>`:''}</div>`).join('')}`:'';
  const secWEX=(t.cozumlu_ornekler&&t.cozumlu_ornekler.length)?`<h2>Çözümlü örnekler</h2><div class="rule"></div>${t.cozumlu_ornekler.map((e,i)=>`<div class="wex"><div class="wex-h">Ornek ${i+1}</div>${e.passage?`<div class="wex-p">${esc(e.passage).replace(/\n/g,"<br>")}</div>`:''}<p class="wex-stem">${esc(e.stem)}</p><div class="wex-opts">${L.map(x=>`<div class="wex-opt${e.correct===x?' ok':''}"><span class="wl">${x}</span><span>${esc(e.choices[x])}</span></div>`).join('')}</div><div class="wex-sol"><div class="wex-sl">Çözüm adımları</div><ol class="steps">${e.adimlar.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="wex-ans"><b>Doğru cevap ${e.correct}.</b> ${esc(e.sonuc||'')}</p></div></div>`).join('')}`:'';
  const secMISS=(t.sik_hatalar&&t.sik_hatalar.length)?`<h2>Sık hatalar</h2><div class="rule"></div>${t.sik_hatalar.map(m=>`<div class="miss"><b>${esc(m.hata)}</b><p style="margin:.4rem 0 0">${esc(m.cozum)}</p></div>`).join('')}`:'';
  const secSTR=(t.strateji&&t.strateji.length)?`<h2>Sınav stratejisi</h2><div class="rule"></div><ol class="steps">${t.strateji.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${l.no} . Konu anlatimi</div>
     <h1>${esc(l.name)}</h1>
     <div class="head-cta"><a class="back-hub" href="ogrenme-haritasi">&lsaquo; SAT modülüne dön</a><button class="next" data-action="start">Alıştırmaya geç &rsaquo;</button></div></div>
   <div class="pad">
   <h2>Ne ölçülüyor</h2><div class="rule"></div>${t.ne_olculuyor.map(x=>`<p>${esc(x)}</p>`).join('')}
   ${secKT}
   ${secSUB}
   <h2>Karar prosedürü</h2><div class="rule"></div><ol class="steps">${t.karar_proseduru.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   ${secWEX}
   <h2>Çeldirici aileleri</h2><div class="rule"></div>${t.celdirici_aileleri.map(f=>`<div class="trap"><b>${esc(f.ad)}</b><p style="margin:.4rem 0 0">${esc(f.tanim)}</p></div>`).join('')}
   ${secMISS}
   <h2>Top tips</h2><div class="rule"></div><ul class="tips">${t.top_tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   ${secSTR}
   <div class="row"><button class="btn" data-action="start">Alıştırmaya başla</button></div></div>`;
  window.scrollTo(0,0);
}
function startPractice(){setMode('practice');S.queue=curL().main_ids.slice();S.idx=0;nextMain();}
function nextMain(){if(S.idx>=S.queue.length){return doneView();}S.remedFor=null;S.remedCount=0;showQ(qById(S.queue[S.idx]),'main');}
function showQ(q,kind){
  S.activeQ=q;S.picked=null;S.locked=false;lp().seen.add(q.id);renderRail();
  const remed=kind==='remed'?`<div class="remedbar">Telafi . hedef tuzak: ${esc(sf(S.remedFor))} . deneme ${S.remedCount}/2</div>`:'';
  const count=kind==='main'?`<div class="qcount">Soru ${S.idx+1} / ${S.queue.length}</div>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Alıştırma</div><h1>${esc(curL().name)}</h1>
     <button class="backbtn" data-action="nav" data-target="lesson">&lsaquo; Konu anlatımına dön</button></div>
   <div class="pad">${count}${remed}
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabı kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Doğru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlış.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazında durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn ghost" data-action="start">Tekrar çalış</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
// ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
function startTest(){setMode('test');S.test={q:buildTest(),idx:0,pick:null,rec:[]};showTestQ();}
function showTestQ(){
  const T=S.test,q=T.q[T.idx];T.pick=null;
  main.setAttribute('data-mode','test');railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span><div class="ut">${esc(D.unit_title)}</div><div class="tprog"><div class="tprog-l">Ünite Testi</div><div class="tprog-bar"><div class="tprog-fill" style="width:${Math.round(T.idx/T.q.length*100)}%"></div></div><div class="tprog-n">Soru ${T.idx+1} / ${T.q.length}</div></div></div>`;
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . ${esc(q.lesson_name)}</div><h1>Soru ${T.idx+1}</h1>
     <button class="backbtn" data-action="test-quit">&lsaquo; Testten cik</button></div>
   <div class="pad">
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="test-pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="tnext" data-action="test-next" disabled>${T.idx===T.q.length-1?'Testi bitir':'Sonraki soru'}</button></div></div>`;
  window.scrollTo(0,0);
}
function testPick(x){const T=S.test;T.pick=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('tnext').disabled=false;}
function testNext(){const T=S.test;if(!T.pick)return;const q=T.q[T.idx];T.rec.push({q,picked:T.pick,ok:T.pick===q.correct});T.idx++;if(T.idx>=T.q.length)return testResult();showTestQ();}
function testResult(){
  const T=S.test,rec=T.rec,total=rec.length,score=rec.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  // weak areas by lesson and by family
  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hiçbir tuzak ailesinde zayıflık yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='test-pick')testPick(el.dataset.l);
  else if(a==='test-next')testNext();
  else if(a==='test-quit')lessonView();
  else if(a==='test-review')toggleReview(+el.dataset.i);
  else if(a==='akjump'){if(S.phase!=='lesson')lessonView();var _t=document.getElementById('ak-'+el.dataset.ak);if(_t)_t.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();else if(t==='test')startTest();}});
