abel": "A", "text": "In other words,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "As a result,"}], "answer": "A", "explanation": "The fourth sentence translates the technical definition of structural racism into more direct language, making explicit the distinction from individual intentionality. 'In other words' signals this restatement and clarification. 'However' implies contradiction. 'Nevertheless' implies concession. 'As a result' implies causation."}, {"n": 6, "type": "Concession", "passage": "The longitudinal study tracked the dietary and health outcomes of over forty thousand participants across seventeen countries for a period of twenty-five years, using validated food frequency questionnaires, clinical biomarker measurements, and cause-of-death data linked to national registries. The sample was demographically diverse, the attrition rate was below eight percent, and the statistical models controlled for over sixty potential confounders. Few nutritional epidemiology studies have matched this design in scale or methodological rigor. ______ the findings contradicted several well-established dietary guidelines and the conclusions of more than a dozen previous meta-analyses, prompting immediate calls for independent replication before any clinical or policy recommendations were revised.", "choices": [{"label": "A", "text": "Even so,"}, {"label": "B", "text": "Furthermore,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The study's exceptional methodological rigor is fully acknowledged; the response to its contradictory findings still required replication before guidelines would change. 'Even so' signals that even this rigor was not sufficient to overturn established consensus without replication — a resigned acknowledgment that the scientific community applies precautionary standards even to methodologically superior single studies. 'Nevertheless' would also work but 'even so' captures the resigned, fully-concessive tone more precisely. 'Furthermore' adds without contrasting. 'Therefore' implies replication was caused by the rigor. 'Similarly' implies comparison."}, {"n": 7, "type": "Contrast", "passage": "In liberal democratic theory, legitimacy derives from consent: institutions are legitimate to the extent that those subject to them would, under appropriate conditions of information and deliberation, consent to the principles on which they rest. The theory is procedural: it asks about the process through which authority is established and exercised. ______ communitarian theorists argue that legitimacy cannot be grounded in hypothetical consent alone; it must also rest on actual shared membership in communities of practice, tradition, and identification that precede and condition any particular deliberative process.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Indeed,"}], "answer": "A", "explanation": "Liberal legitimacy (hypothetical consent, procedural) is directly challenged by communitarian legitimacy (actual communal membership, prior to deliberation). 'However' signals this theoretical challenge. 'Similarly' implies communitarianism confirms liberal theory. 'Consequently' implies causation. 'Indeed' would confirm the liberal account. The distinction from 'in contrast' is that 'however' is used here because the paragraph is presenting the communitarian critique as a qualification of the liberal theory, not a symmetric contrast between two independent frameworks."}, {"n": 8, "type": "Causation", "passage": "The transition from oral to literate culture — from societies in which knowledge is preserved and transmitted through memorized performance to those in which it is encoded in durable written artifacts — fundamentally altered the cognitive relationship between knowledge and memory. In oral cultures, knowledge that cannot be remembered ceases to exist; the mind must carry what the world cannot store. The externalization of memory into text freed cognitive capacity from storage functions. ______ literacy did not simply add a new medium for existing thought; it restructured the cognitive processes through which knowledge was produced, organized, and validated.", "choices": [{"label": "A", "text": "Consequently,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The externalization of memory into text (described in sentence three) caused the restructuring of cognitive processes — a consequence of the shift from oral to literate culture. 'Consequently' signals this transformative cognitive consequence. 'In contrast' implies opposition. 'Nevertheless' implies the restructuring occurred despite something. 'Similarly' implies parallel comparison."}, {"n": 9, "type": "Clarification", "passage": "The doctrine of comparative advantage, which underlies much of the theoretical case for free trade, holds that nations benefit from specializing in goods for which they have relatively lower opportunity costs and trading with nations that specialize in other goods — even if one nation is absolutely more efficient at producing all goods. The doctrine is widely cited to support free trade agreements. ______ the model assumes full employment of resources, flexible factor mobility between sectors, and the absence of strategic trade policy — assumptions that critics argue do not hold in the real economies of countries making trade policy decisions.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Indeed,"}], "answer": "A", "explanation": "Comparative advantage's theoretical case for free trade is presented; the model assumptions that underlie it are then challenged as unrealistic. 'However' signals this qualification of the theoretical case by specifying the conditions under which the theory holds — conditions critics argue are not met in practice. 'Similarly' implies comparison. 'Therefore' implies causation. 'Indeed' would confirm the case for free trade."}, {"n": 10, "type": "Concession", "passage": "Over a thirty-year period, the restorative justice program had been subjected to fourteen independent evaluations using varying methodologies — including randomized control trials, matched comparison studies, and longitudinal tracking — across seven countries and three distinct criminal justice contexts. The cumulative evidence was unusual in its consistency: victim satisfaction, recidivism reduction, and cost-effectiveness all compared favorably with conventional punitive processing across virtually every study design and context. The case for the program's effectiveness was, by standard social science criteria, exceptionally robust. ______ mainstream criminal justice systems in most high-income countries continue to treat restorative approaches as marginal alternatives rather than primary responses to serious crime.", "choices": [{"label": "A", "text": "Even so,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Furthermore,"}], "answer": "A", "explanation": "An exceptionally well-documented evidence base — unusual in its cross-methodological, cross-national consistency — has not produced mainstream adoption. 'Even so' precisely captures the resigned acknowledgment that even the strongest possible evidence base can fail to shift institutional practice. 'Nevertheless' would also be defensible but 'even so' is more precise when the concession is presented as complete — the writer has fully conceded the robustness of the evidence before noting that it hasn't mattered. 'Therefore' implies continued marginalization was caused by the evidence. 'Similarly' implies comparison. 'Furthermore' adds without contrasting."}, {"n": 11, "type": "Causation", "passage": "The Dunning-Kruger effect describes the phenomenon by which individuals with low competence in a domain systematically overestimate their own ability, while highly competent individuals tend to underestimate theirs relative to others. The mechanism is metacognitive: the same skills that enable accurate assessment of one's performance are the skills one lacks when incompetent. ______ in domains requiring specialized judgment — medical diagnosis, financial risk assessment, legal strategy — individuals with the least relevant expertise often express the greatest confidence in their opinions.", "choices": [{"label": "A", "text": "Consequently,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The Dunning-Kruger mechanism (metacognitive failure in low-competence individuals) directly causes the pattern of high confidence with low expertise in specialized domains. 'Consequently' signals this applied consequence of the psychological mechanism. 'However' implies an unexpected contrast. 'In contrast' implies a comparison with an opposing pattern. 'Similarly' implies parallel comparison."}, {"n": 12, "type": "Contrast", "passage": "Realist theories of international relations hold that states are the primary actors in world politics, that they are motivated primarily by survival and the pursuit of power, and that the anarchic structure of the international system — the absence of any overarching authority — creates a self-help environment in which conflict and competition are the default mode of interaction. On this view, institutions and norms can constrain state behavior only marginally and temporarily. ______ liberal institutionalists argue that international institutions, regimes, and norms can produce durable cooperation among states by reducing transaction costs, providing information, and creating forums for iterative bargaining that generate incentives for sustained compliance.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Indeed,"}], "answer": "A", "explanation": "Realism (institutions can constrain only marginally) is directly opposed by liberal institutionalism (institutions can produce durable cooperation). 'In contrast' marks this fundamental theoretical opposition in international relations theory. 'Similarly' implies institutionalism confirms realism. 'Consequently' implies causation. 'Indeed' implies confirmation."}, {"n": 13, "type": "Concession", "passage": "The intervention was designed on the basis of a comprehensive needs assessment, implemented by practitioners with relevant experience, monitored by an independent evaluation team throughout the delivery period, and supported by a theory of change grounded in peer-reviewed evidence about what works in analogous contexts. Every stage of design and delivery reflected current best practice in the field. The mid-point process evaluation reported high fidelity to the intended model and strong engagement among participants. ______ the final outcome evaluation found no statistically significant difference between participants and the matched comparison group on the primary outcome measures.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "Even so,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "This is one of the most difficult distinctions: 'even so' versus 'nevertheless.' Both signal concession-contrast. Here, 'even so' is more precise because the passage has constructed an exhaustive list of positive design features before noting null results. The tone is one of resigned acknowledgment — 'with all of that said, it still didn't work.' 'Nevertheless' implies more of an obstacle being overcome by effort; 'even so' implies full acknowledgment of merit before the qualifying reversal. 'Therefore' implies null results were caused by best practice. 'For instance' implies illustration."}, {"n": 14, "type": "Clarification", "passage": "Critics of multiculturalism sometimes argue that policies designed to accommodate cultural difference undermine social cohesion by fragmenting the shared civic identity that holds liberal democracies together. The argument assumes a tension between cultural recognition and common citizenship. ______ the strongest versions of multiculturalism, as developed by theorists such as Will Kymlicka and Charles Taylor, explicitly ground cultural rights in liberal values — arguing that the capacity for meaningful individual choice requires the cultural context that provides the options from which individuals choose.", "choices": [{"label": "A", "text": "In fact,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Consequently,"}], "answer": "A", "explanation": "The critique assumes multiculturalism undermines liberal citizenship; 'in fact' is the precise choice because the sentence reveals that multiculturalism's most rigorous theoretical defenses are explicitly grounded in liberal values — a direct correction of the critique's premise. 'However' would signal simple contrast without the corrective specificity. 'In fact' implies: contrary to what the critique assumes, the reality is more nuanced and in direct opposition to the premise. 'Similarly' implies comparison. 'Consequently' implies causation."}, {"n": 15, "type": "Causation", "passage": "The displacement of traditional subsistence practices by market integration in remote indigenous communities creates dependency on cash income to purchase food that was previously produced directly. Cash income in these communities is often seasonal, insecure, and insufficient to sustain consistent purchasing power across the agricultural calendar. When markets are distant, transport costs are high, and local price volatility is pronounced, market dependency is particularly precarious. ______ nutritional surveys in recently market-integrated indigenous communities consistently document deterioration in dietary diversity and micronutrient status compared to communities maintaining more subsistence-oriented economies.", "choices": [{"label": "A", "text": "Consequently,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "Market dependency, income insecurity, and market access difficulties combine to cause the nutritional deterioration documented in the final sentence. 'Consequently' signals this multi-factor causal outcome. 'Nevertheless' implies nutritional deterioration occurs despite something. 'For example' implies illustration. 'Similarly' implies parallel comparison."}, {"n": 16, "type": "Contrast", "passage": "Libertarian political philosophy holds that the primary purpose of the state is to protect individuals from coercion — the use of force or fraud to override their choices — and that taxes used to fund redistributive welfare programs constitute coercion by compelling the better-off to subsidize others against their will. The moral boundary against coercion is lexically prior to any consideration of distributive justice. ______ egalitarian liberals, following John Rawls, argue that the holdings people have under any property system depend on prior social decisions about rules of ownership, enforcement, and taxation, making the distinction between earned income and redistributive transfer arbitrary from a moral standpoint.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Therefore,"}], "answer": "A", "explanation": "Libertarianism (taxation is coercion, prior to distribution) is fundamentally opposed by Rawlsian egalitarianism (holdings depend on prior social arrangements, making the earned/redistributed distinction arbitrary). 'In contrast' marks this foundational philosophical opposition. 'Similarly' implies Rawlsianism confirms the libertarian view. 'Consequently' and 'Therefore' imply causation."}, {"n": 17, "type": "Clarification", "passage": "The term 'meritocracy' was coined not as an ideal to be celebrated but as a satirical warning. Michael Young, the British sociologist who introduced the concept in a 1958 dystopian novel, intended it to describe a future society in which the conflation of merit with inherited advantage produced a new, more insidious form of class stratification — one in which the successful could believe they deserved their position and the unsuccessful could be told they had only themselves to blame. ______ the term has been almost entirely inverted in contemporary usage, where it typically denotes a laudable principle of fairness — the idea that positions and rewards should be distributed according to ability and effort rather than birth or connection.", "choices": [{"label": "A", "text": "Indeed,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "Young coined 'meritocracy' as a warning; the term is now used to celebrate what it was designed to critique — a complete inversion of intended meaning. 'However' signals this contrast between original intent and current usage. 'Indeed' would confirm the original satirical intent, not introduce the inversion. 'Therefore' implies current usage was caused by Young's intent. 'Similarly' implies comparison."}, {"n": 18, "type": "Concession", "passage": "The environmental impact assessment submitted in support of the mining application had been prepared by an independent firm with no prior financial relationship with the applicant, was based on two years of field data collection across all seasons, incorporated modeling of downstream effects extending over a fifty-kilometer radius, and had been reviewed and approved by the relevant government environmental agency following a public comment period that attracted over three thousand submissions. The procedural legitimacy of the assessment was not in question. ______ a coalition of downstream water users initiated legal proceedings challenging the methodology used to project long-term sediment flow, arguing that the model had underestimated peak discharge events during extreme rainfall.", "choices": [{"label": "A", "text": "Even so,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The procedural legitimacy of the assessment is fully and explicitly conceded — even the challengers did not dispute the process. 'Even so' signals that legal challenge followed despite this complete procedural legitimacy. The choice of 'even so' over 'nevertheless' reflects the fact that the concession is fully stated ('not in question') before the qualifying action — a resigned, fully-acknowledging signal. 'Therefore' implies legal challenge was caused by legitimacy. 'Furthermore' adds without contrasting. 'Similarly' implies comparison."}, {"n": 19, "type": "Causation", "passage": "The criminalization of drug use, by making production and distribution into black market activities, removes the quality control, labeling, and dosage standardization that legal markets provide. Users cannot know with confidence what substance they are consuming, at what potency, or with what adulterants. Fentanyl and its analogues — synthetic opioids orders of magnitude more potent than heroin — are now commonly found mixed into street supplies of other drugs with no indication to the user. ______ accidental overdose deaths have increased dramatically among users who did not intend to consume opioids, expanding the risk profile of the opioid crisis well beyond the population with opioid use disorder.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "The chain of effects — criminalization removes quality control, fentanyl contaminates street supplies, users cannot detect it — collectively causes the dramatic increase in accidental overdose deaths. 'Consequently' signals this end result of the causal chain built across the passage. 'In contrast' implies an opposing mortality trend. 'Nevertheless' implies the deaths occur despite something. 'Similarly' implies parallel comparison."}, {"n": 20, "type": "Contrast", "passage": "The neoclassical synthesis in economics, which dominated the discipline from the 1950s through the 1970s, held that Keynesian demand management could stabilize business cycles in the short run while neoclassical analysis correctly described long-run equilibrium outcomes. The two frameworks were seen as complementary rather than contradictory: each occupied its own temporal domain. The stagflation of the 1970s — simultaneous high inflation and high unemployment — was difficult to explain within the synthesis, as Keynesian models predicted that unemployment and inflation traded off against each other. ______ monetarist and later New Classical economists argued that the synthesis had been built on a fundamental misunderstanding of how expectations shape economic behavior, requiring a completely different theoretical foundation.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "In response,"}], "answer": "D", "explanation": "Stagflation challenged the synthesis; monetarist and New Classical responses followed directly from that challenge. 'In response' precisely signals that the competing theories arose as direct reactions to the empirical failure of the synthesis — a causal and temporal relationship. 'Similarly' implies the monetarists confirmed the synthesis. 'Consequently' implies causation but misses the responsive, reactive quality of the new theories. 'Nevertheless' implies the new theories arose despite something. 'In response' is the most precise signal for a reaction to a preceding challenge."}, {"n": 21, "type": "Clarification", "passage": "The philosophical concept of personal identity — what makes a person at one time the same person as a person at another time — has generated a large and unresolved literature. Psychological continuity theories hold that what matters for personal identity is continuity of memory, personality, and psychological connections over time. Bodily continuity theories hold that identity tracks the persistence of the biological organism. The two accounts typically converge in ordinary cases but diverge in thought experiments involving brain transplants, teleportation, and gradual neurodegenerative disease. ______ the divergence reveals what each theory actually identifies as the bearer of personal identity and what it treats as incidental to that identity.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In fact,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "The thought experiments produce divergence; 'in fact' signals that this divergence is actually informative — it reveals what each theory is really committed to. The sentence is making a clarificatory, revelatory point: the divergence isn't merely a problem for the theories but is philosophically useful. 'However' would imply simple contrast. 'In fact' signals that the divergence achieves something — it discloses the deeper theoretical commitments. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 22, "type": "Concession", "passage": "The theoretical models underlying the financial risk management frameworks used by major investment banks in the years before 2008 had been developed by some of the most mathematically sophisticated economists and engineers in the world, drawing on decades of financial theory and implemented using computational resources unavailable to earlier generations of practitioners. The tools were capable, in principle, of identifying and quantifying risks across extraordinarily complex portfolios. They incorporated real-time market data and had been validated against historical performance over multiple market cycles. ______ they failed catastrophically to anticipate the 2008 financial crisis, in large part because they assumed that the risks they modeled were independent when in fact systemic correlation caused multiple risk factors to materialize simultaneously.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "Even so,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Furthermore,"}], "answer": "A", "explanation": "This is the hardest 'nevertheless' versus 'even so' distinction. The difference: 'even so' is used when the concession is fully stated and complete before the reversal; 'nevertheless' is used when overcoming the obstacle requires some effort or persistence — when the obstacle is weight-bearing. Here, the failure was a catastrophic collapse rather than a quiet null result or a resigned institutional choice. The scale of the failure makes 'nevertheless' more appropriate — it signals that despite genuine sophistication and validation, the collapse still occurred, with the implication that the obstacle (sophisticated modeling) should have been sufficient. 'Even so' conveys too much resignation; 'nevertheless' conveys appropriate weight. 'Therefore' implies failure was caused by sophistication. 'Furthermore' adds without contrasting."}, {"n": 23, "type": "Contrast", "passage": "Deliberative models of democracy require that political decisions be preceded by processes of reasoned argument in which participants offer justifications that any reasonable person could in principle accept, rather than simply expressing preferences or applying social pressure. Reasoned deliberation, on this view, is epistemically superior to mere aggregation of preferences: it is capable of revealing errors, producing new information, and generating outcomes with stronger legitimacy than majority voting. Critics of deliberative theory observe that real deliberative processes are not insulated from power. ______ those with greater rhetorical skill, institutional access, and social capital consistently dominate deliberative forums, producing outcomes that reflect their advantages rather than the force of the better argument.", "choices": [{"label": "A", "text": "In fact,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "A", "explanation": "The critics observe that deliberation is not power-neutral (sentence three); 'in fact' specifies exactly who wins and why — rhetorical skill and social capital — confirming and intensifying the critique with detail. 'In fact' is chosen over 'furthermore' because the fourth sentence is not adding a new point but revealing the empirical substance of the observation made in sentence three. 'Similarly' implies comparison. 'Consequently' implies causation. 'Nevertheless' implies concession."}, {"n": 24, "type": "Causation", "passage": "Climate change interacts with existing social inequalities in ways that systematically concentrate its costs among populations with the least capacity to absorb or adapt to them. Low-lying coastal communities in developing countries are exposed to sea level rise and storm surge without the engineering infrastructure or insurance markets that protect similar communities in wealthy nations. Agricultural communities in climate-vulnerable regions often lack access to irrigation, improved seed varieties, or credit markets that could buffer them against rainfall variability. Institutional capacity to design and implement adaptation policies is weakest precisely where adaptation is most urgently needed. ______ the burden of climate damage is likely to fall disproportionately on populations that contributed least to cumulative greenhouse gas emissions.", "choices": [{"label": "A", "text": "Consequently,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The three structural disadvantages described — lack of infrastructure, lack of agricultural resources, weak institutional capacity — collectively cause the disproportionate climate burden on the most vulnerable. 'Consequently' signals this cumulative causal conclusion. 'However' implies an unexpected contrast. 'In contrast' implies opposition. 'Similarly' implies parallel comparison without the causal force."}, {"n": 25, "type": "Clarification", "passage": "The term 'cancel culture' is deployed across the political spectrum to describe the social and professional consequences that individuals face following public expressions of views that others find offensive, harmful, or inconsistent with professed values. Critics of the phenomenon argue that it represents a form of extralegal punishment that bypasses due process, chills free expression, and enables majorities to silence minority viewpoints. Defenders argue that accountability for speech within communities and institutions is a legitimate form of social norm enforcement that has always existed. Both sides frequently overstate the scale of the phenomenon they are describing and understate the power asymmetries that shape who is vulnerable to it. ______ the people most frequently described as victims of 'cancellation' in prominent cases tend to be public figures with substantial institutional resources, while those who face career-ending consequences with no recourse are typically less powerful individuals with far less ability to mobilize public support.", "choices": [{"label": "A", "text": "In fact,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "A", "explanation": "The preceding sentence states that both sides overstate and understate — particularly regarding power asymmetries. 'In fact' then reveals the specific reality of those asymmetries: prominent 'victims' are institutionally resourced; actual vulnerable people are obscure. This is a factual correction that specifies and confirms the power asymmetry claim with evidence that reverses the dominant narrative. 'In fact' signals this corrective revelation that cuts against the popular framing of the debate. 'Similarly' implies comparison. 'Therefore' implies causation. 'Nevertheless' implies concession."}]}];

  var curSet=null, idx=0, ANS=[];

  // ── Pack home ──
  function showPackHome(){
    var _ph=document.getElementById('pack-home');_ph.style.display='flex';_ph.style.flexDirection='column';
    document.getElementById('quiz-wrapper').style.display='none';
    document.getElementById('set-complete').classList.remove('show');
    window.scrollTo(0,0);
    renderPackHome();
  }

  function renderPackHome(){
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    var done=Object.keys(completed).length;
    var fill=document.getElementById('ph-fill');
    var lbl=document.getElementById('ph-prog-label');
    if(fill)fill.style.width=(done*10)+'%';
    if(lbl)lbl.textContent=done+' / 10 Set Tamamland\u0131';
    var grid=document.getElementById('set-grid');
    if(!grid)return;
    grid.innerHTML='';
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    for(var i=1;i<=10;i++){
      var s=ALL_SETS[i];var c=completed[i];
      var pct=c?Math.round(c.score/c.total*100):null;
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 14px;background:'+(c?'#e0e7ff':'#fff')+';border-radius:12px;margin-bottom:8px;cursor:pointer;border:1.5px solid '+(c?'#4338ca':'#e0e7ff')+';box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s;';
      row.onmouseenter=function(){this.style.boxShadow='0 4px 14px rgba(0,0,0,.12)';};
      row.onmouseleave=function(){this.style.boxShadow='0 1px 4px rgba(0,0,0,.05)';};
      var numDiv=document.createElement('div');
      numDiv.style.cssText='width:40px;height:40px;min-width:40px;border-radius:50%;background:'+(c?'#3730a3':'#4338ca')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:monospace;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);';
      numDiv.textContent=c?'\u2713':i;
      var body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0;';
      var topicEl=document.createElement('div');
      topicEl.style.cssText='font-size:14px;font-weight:700;color:#1e1b4b;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;';
      topicEl.textContent=s.topic;
      var diffEl=document.createElement('span');
      diffEl.style.cssText='display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4338ca;background:#e0e7ff;border-radius:50px;padding:2px 8px;margin-top:4px;';
      diffEl.textContent=DIFFS[i-1];
      body.appendChild(topicEl);body.appendChild(diffEl);
      var right=document.createElement('div');
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;';
      if(c){
        var scoreEl=document.createElement('span');
        scoreEl.style.cssText='font-size:11px;font-weight:800;color:#fff;background:#4338ca;padding:2px 8px;border-radius:50px;white-space:nowrap;';
        scoreEl.textContent=c.score+'/'+c.total+' \u00b7 '+pct+'%';
        right.appendChild(scoreEl);
      }
      var ctaEl=document.createElement('span');
      ctaEl.style.cssText='font-size:11px;font-weight:700;color:#4338ca;border:1.5px solid #4338ca;border-radius:6px;padding:3px 10px;white-space:nowrap;';
      ctaEl.textContent=c?'Tekrar \u2192':'Ba\u015fla \u2192';
      right.appendChild(ctaEl);
      row.appendChild(numDiv);row.appendChild(body);row.appendChild(right);
      (function(n,r){
        r.addEventListener('click',function(){startSet(n);});
        r.addEventListener('touchend',function(e){e.preventDefault();startSet(n);});
      })(i,row);
      grid.appendChild(row);
    }
  }
  // ── Quiz engine ──
  function startSet(n){
    curSet=n;
    idx=0;
    ANS=new Array(ALL_SETS[n].qs.length).fill(null);
    document.getElementById('pack-home').style.display='none';
    document.getElementById('quiz-wrapper').style.display='flex';
    document.getElementById('set-complete').classList.remove('show');
    document.getElementById('tb-setlabel').textContent='SAT Reading & Writing · Transitions Pack 3 · Set '+n+' · '+ALL_SETS[n].topic;
    render();
  }

  var qarea=null,qnum=null,prog=null;
  function render(){
    if(!qarea){qarea=document.getElementById('qarea');qnum=document.getElementById('qnum');prog=document.getElementById('prog');}
    var q=ALL_SETS[curSet].qs[idx];
    var qs=ALL_SETS[curSet].qs;
    prog.style.width=((idx+1)/qs.length*100)+'%';
    qnum.textContent='Q '+(idx+1)+' / '+qs.length;
    var tracker=document.getElementById('tracker');
    tracker.innerHTML='';
    qs.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='dot'+(ANS[i]!==null?' ans':'')+(i===idx?' cur':'');
      (function(ii){d.onclick=function(){idx=ii;render();}}) (i);
      tracker.appendChild(d);
    });
    qarea.innerHTML='';
    var pbox=document.createElement('div');pbox.className='pbox';
    if(q.p!==undefined){
      var txt=q.p;
      if(txt.indexOf('___')!==-1){
        txt='<span style="font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;display:block;margin-bottom:.7rem">'+
          (q.k||'')+'</span>'+txt.replace('___','<span style="display:inline-block;width:140px;border-bottom:2px solid currentColor;vertical-align:bottom;margin:0 4px"></span>');
      }
      pbox.innerHTML=txt;
    } else if(q.passage!==undefined){pbox.innerHTML=q.passage;}
    qarea.appendChild(pbox);
    // Support both formats: q.question (new) or q.q (old)
    var questionText=q.question||q.q;
    if(questionText){var qt=document.createElement('div');qt.className='qtxt';qt.textContent=questionText;qarea.appendChild(qt);}
    // Support: q.choices (new obj array), q.opts (old string array), q.o (old string array)
    var choices=q.choices||q.opts||q.o;
    if(choices){
      choices.forEach(function(c,i){
        var btn=document.createElement('button');
        // Old format: answer is numeric index; new format: answer is letter
        var isSelected=(q.a!==undefined)?ANS[idx]===i:ANS[idx]===i;
        btn.className='opt'+(ANS[idx]===i?' sel':'');
        var lbl=(typeof c==='object')?c.label:c.charAt(0);
        var txt=(typeof c==='object')?c.text:c.slice(3);
        btn.innerHTML='<span class="ol">'+lbl+'</span><span>'+txt+'</span>';
        (function(ii){btn.onclick=function(){ANS[idx]=ii;render();}}) (i);
        qarea.appendChild(btn);
      });
    }
    var nav=document.createElement('div');nav.className='nav-row';
    var prev=document.createElement('button');prev.className='btn-n';prev.textContent='Previous';prev.disabled=idx===0;
    prev.onclick=function(){idx--;render();};
    nav.appendChild(prev);
    var done=ANS.filter(function(a){return a!==null;}).length;
    if(idx===qs.length-1){
      var sub=document.createElement('button');sub.className='btn-sub';
      sub.textContent='Submit ('+done+'/'+qs.length+')';sub.onclick=showSetComplete;nav.appendChild(sub);
    } else {
      var next=document.createElement('button');next.className='btn-n';next.textContent='Next';
      next.onclick=function(){idx++;render();};nav.appendChild(next);
    }
    qarea.appendChild(nav);
  }

  function getChoices(q){return q.choices||q.opts||q.o;}
  function isCorrect(q,selectedIdx){
    // Old format: q.a is numeric index
    if(q.a!==undefined&&typeof q.a==='number') return selectedIdx===q.a;
    // New format: q.answer is a letter
    var choices=getChoices(q);
    if(!choices||selectedIdx===null||selectedIdx===undefined)return false;
    var c=choices[selectedIdx];
    var selectedLabel=(typeof c==='object')?c.label:c.charAt(0);
    return selectedLabel===(q.answer||'A');
  }
  function getCorrectChoice(q){
    var choices=getChoices(q);
    if(!choices)return null;
    if(q.a!==undefined&&typeof q.a==='number') return choices[q.a];
    var lbl=q.answer||'A';
    return choices.find(function(c){return (typeof c==='object'?c.label:c.charAt(0))===lbl;});
  }
  function choiceText(c){
    if(!c)return '';
    return (typeof c==='object')?c.text:c.slice(3);
  }
  function showSetComplete(){
    var qs=ALL_SETS[curSet].qs;
    var score=0;
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))score++;
    });
    completed[curSet]={score:score,total:qs.length};
    var pct=Math.round(score/qs.length*100);
    var msg=pct>=80?'Mükemmel!':pct>=60?'Gayet iyi!':'Tekrar dene.';
    document.getElementById('quiz-wrapper').style.display='none';
    var sc=document.getElementById('set-complete');
    sc.classList.add('show');
    document.getElementById('scc-setnum').textContent=curSet;
    document.getElementById('scc-score').textContent=score;
    document.getElementById('scc-total').textContent=qs.length;
    document.getElementById('scc-pct').textContent=pct+'% — '+msg;
    var nextBtn=document.getElementById('scc-next');
    nextBtn.style.display=curSet<10?'':'none';
    // Review
    var rev=document.getElementById('scc-review');rev.innerHTML='';
    var title=document.createElement('div');title.className='scc-review-title';
    title.textContent='Yanlış Cevaplar';rev.appendChild(title);
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))return;
      var choices=getChoices(q);
      var selected=choices&&ANS[i]!==null?choices[ANS[i]]:null;
      var correctChoice=getCorrectChoice(q);
      var correctText=choiceText(correctChoice);
      var wrongText=selected?choiceText(selected):'Cevap verilmedi';
      var wi=document.createElement('div');wi.className='wi';
      var pText=(q.p||q.passage||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().substring(0,70);
      var expl=q.explanation||q.e||'';
      wi.innerHTML='<div class="wh"><span class="wh-n">Q'+(i+1)+'</span><span class="wh-q">'+pText+'...</span><span class="wh-badge w">✗</span></div>'+
        '<div class="wb" style="display:none;padding:.8rem .9rem">'+
        '<div class="aw">'+wrongText+'</div>'+
        '<div class="ac">Doğru: '+correctText+'</div>'+
        (expl?'<div class="expl"><div class="expl-head"><img class="expl-cat" src="'+griCat()+'" alt="Gri"/><span class="expl-label">Gri diyor ki:</span></div><div class="expl-body">'+expl+'</div></div>':'')+'</div>';
      wi.querySelector('.wh').onclick=function(){var wb=wi.querySelector('.wb');wb.style.display=wb.style.display==='block'?'none':'block';};
      rev.appendChild(wi);
    });
    if(rev.children.length<=1){title.textContent='Tüm cevaplar doğru! ✓';}
    window.scrollTo(0,0);
  }

  function retakeSet(){startSet(curSet);}
  function goNextSet(){if(curSet<10)startSet(curSet+1);}


  (function(){
    var dg=document.getElementById('cv-dots-inner');
    if(dg){for(var i=0;i<25;i++){var s=document.createElement('span');dg.appendChild(s);}}
    document.getElementById('cv-pword').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    document.getElementById('cv-uname').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    document.getElementById('cv-pword').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    // Mobile: use touchend to bypass iOS onclick issues inside fixed+scroll containers
    var loginBtn=document.getElementById('cv-login-btn');
    if(loginBtn){
      loginBtn.addEventListener('click',function(e){e.preventDefault();tryLogin();});
      loginBtn.addEventListener('touchend',function(e){e.preventDefault();tryLogin();});
    }
  })();

  function tryLogin(){
    var u=document.getElementById('cv-uname').value.trim();
    var p=document.getElementById('cv-pword').value.trim();
    var err=document.getElementById('cv-err');
    var box=document.getElementById('cv-loginbox');
    if(u.toLowerCase()==='admin'&&p.toLowerCase()==='admin'){
      var cover=document.getElementById('cv-cover');
      cover.classList.add('cv-leaving');
      setTimeout(function(){
        cover.style.display='none';
        var main=document.getElementById('cv-main');
        main.style.display='block';
        main.classList.add('cv-visible');
        showPackHome();
      },500);
    } else {
      err.classList.add('show');
      box.classList.remove('cv-shake');
      void box.offsetWidth;
      box.classList.add('cv-shake');
      document.getElementById('cv-pword').value='';
      document.getElementById('cv-pword').focus();
    }
  }

</script>
