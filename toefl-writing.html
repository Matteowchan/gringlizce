<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#A8443A; --accent-deep:#7A2E27; --accent-soft:#F0DAD6; --panel:#F5E3DF;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
:root[data-theme="dark"]{--bg:#15151c;--ink:#ECEDF2;--muted:#9498a6;--line:#2b2b36;--paper:#1e1e27;--card:#1e1e27;--panel:#262633;--accent-soft:rgba(255,255,255,.07);--accent-deep:var(--accent);--good-soft:rgba(31,169,113,.16);--wrong-soft:rgba(216,80,63,.16);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1140px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:13px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:9px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:7px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<script id="data" type="application/json">{"ns":"toeflw","title":"TOEFL Writing","badge":"TOEFL","groups":["Öğren","Email","Academic Discussion"],"lessons":[{"id":"tw-modul","name":"Bu Modül","eyebrow":"Öğren","group":"Öğren","blocks":[{"t":"p","x":"TOEFL iBT Writing bölümü 2026'da ÜÇ görevden oluşur: Build a Sentence, Write an Email ve Write for an Academic Discussion. Bu modül, Gri AI'nin değerlendirebildiği iki üretim görevine (Email ve Academic Discussion) odaklanır; Build a Sentence'ı aşağıda açıklıyoruz. Gri, yazını ETS'in holistik 0-5 ölçeğine göre tahmini bir puanla değerlendirir."},{"t":"table","head":["Görev","Ne yapar","Süre","Uzunluk"],"rows":[["Build a Sentence","Karışık kelimeleri doğru bir cümle olacak şekilde sıralarsın","~6 dk","~10 madde"],["Write an Email","Verilen duruma uygun bir e-posta yazarsın","7 dk","~80-120 kelime"],["Academic Discussion","Profesörün sorusuna ve iki öğrenci gönderisine katkı yaparsın","10 dk","~100-150 kelime"]]},{"t":"note","k":"ipucu","title":"Build a Sentence nedir?","lines":["Ekranda tam bir örnek cümle görürsün; ardından karışık verilen kelimeleri dilbilgisel olarak doğru ikinci bir cümle olacak biçimde sıralarsın.","Kelime sırası, özne-yüklem uyumu ve doğru zaman ölçülür. Örnek: verilen 'The museum opened a new exhibit last week.' + karışık kelimeler -> 'It has attracted thousands of visitors.'"]},{"t":"note","k":"dikkat","title":"Kısa süre, net hedef","lines":["Her görevde dilbilgisi, imla ve register (resmiyet düzeyi) puana katılır.","Süre kısadır: bir dakika planla, sonra yazmaya odaklan, son bir dakikada kontrol et."]}]},{"id":"tw-puan","name":"Puanlama (ETS 0-5)","eyebrow":"Öğren","group":"Öğren","blocks":[{"t":"p","x":"Her iki görev de holistik 0-5 ölçeğiyle puanlanır: ayrı ayrı kriter yok, tek bir bütünsel puan. Değerlendirici görevin bütününe bakar: konuya uygunluk, fikir gelişimi, düzen, kelime ve dilbilgisi."},{"t":"table","head":["Puan","Anlamı"],"rows":[["5","Tam başarılı. Görevi eksiksiz karşılar, iyi geliştirilmiş ve düzenli; dil akıcı, hatalar çok az."],["4","Büyük ölçüde başarılı. Görevi karşılar; küçük eksik veya hatalar iletişimi bozmaz."],["3","Kısmen başarılı. Konuya bağlı ama gelişim yetersiz ya da tekrar eden hatalar var."],["2","Sınırlı. Göreve zayıf bağlı, dar kelime, sık hata anlamı zorlaştırır."],["1","Başarısız. Konuyla ilgisiz veya çok kısa; dil ciddi biçimde bozuk (0 = boş ya da tamamen konu dışı)."]]},{"t":"note","k":"dikkat","title":"Uzunluk tek başına puan değildir","lines":["İmla, dilbilgisi ve register hepsi puana katılır.","Çok yazmak değil; net, hatasız ve görevin tüm maddelerine tam bağlı yazmak 5 getirir."]}]},{"id":"tw-email-yapi","name":"Email: yapı ve register","eyebrow":"Öğren","group":"Öğren","blocks":[{"t":"p","x":"İyi bir e-posta şu iskeleti izler: uygun selamlama, amacı hemen belirtme, istenen her maddeyi gerekçe veya detayla geliştirme ve kibar bir kapanış. Görevde verilen tüm maddeleri karşıladığından emin ol."},{"t":"table","head":["Bölüm","Ne yazarsın","Örnek ifade"],"rows":[["Selamlama","Alıcıya uygun hitap","Dear Ms. Carter, / Hi Alex,"],["Amaç","İlk cümlede neden yazdığın","I am writing to report... / I wanted to ask..."],["Gelişim","Her maddeyi detayla aç","This happens whenever... / Would it be possible to...?"],["Kapanış","Kibar bitiriş ve imza","Thank you for your help. Best regards,"]]},{"t":"table","head":["Resmi (formal)","Samimi (friendly)"],"rows":[["Dear Dr. Mitchell,","Hi Alex,"],["I would appreciate it if you could...","Could you...?"],["I look forward to your reply.","Let me know what works!"],["Best regards,","Thanks, see you soon!"]]},{"t":"note","k":"dikkat","title":"Register'ı alıcıya göre seç","lines":["Profesör, yönetici veya danışman gibi kişilere resmi; arkadaş ya da sınıf arkadaşına samimi yaz.","Yanlış register (ör. yöneticiye 'Hey!') puanı düşürür."]}]},{"id":"tw-ad-yapi","name":"Academic Discussion: yapı","eyebrow":"Öğren","group":"Öğren","blocks":[{"t":"p","x":"Ekranda bir profesörün sorusu ve iki öğrencinin kısa gönderisi olur. Senden tartışmaya ilgili ve iyi geliştirilmiş bir katkı beklenir: net bir duruş, bir gerekçe ve somut bir örnek. En az 100 kelime yaz."},{"t":"table","head":["Adım","Ne yaparsın"],"rows":[["Duruş","Soruya net cevap ver; bir öğrenciye katıl, katıldığını genişlet ya da karşı çık."],["Gerekçe","Neden böyle düşündüğünü açıkla."],["Örnek/detay","Kişisel deneyim veya somut bir örnekle destekle."],["Bağ kur","En az bir öğrencinin adını anıp fikrine değin."]]},{"t":"note","k":"dikkat","title":"Yeni bir nokta ekle","lines":["Sadece 'katılıyorum' deyip geçme; kendi cümlelerinle YENİ bir fikir kat.","Öğrencilerin sözünü tekrarlamak değil, tartışmayı ilerletmek 5 getirir."]}]},{"id":"tw-email-1","name":"Görev 1. Building Manager (formal)","eyebrow":"Email . Yaz","group":"Email","blocks":[{"t":"note","k":"ipucu","title":"Register: resmi","lines":["Bina yöneticine yazıyorsun; resmi ve kibar bir dil kullan.","Üç maddeyi de karşıla: kendini tanıt ve sorunu anlat, uygun bir zaman öner, geçici çözüm/kullanım sor."]},{"t":"wizard","ttid":"toefl-email","ptitle":"Email Görevi","prompt":"You moved into a new apartment last week and have noticed that water leaks slowly from the pipe under the kitchen sink whenever you use it. Write an email to Ms. Carter, your building manager. In your email: introduce yourself as a new resident and describe the problem in detail; suggest a convenient day and time for a maintenance worker to come; and ask whether you should avoid using the sink until it is repaired, or whether there is a temporary fix you could do yourself.","plan":["Selamlama ve amaç","Sorunun detayı","Uygun gün/saat önerisi","Geçici çözüm sorusu ve kibar kapanış"],"target":110,"check":["Register resmi ve kibar","Amacım ilk cümlede net","Görevdeki üç maddeyi de karşıladım","Sorunu ve öneriyi detayla geliştirdim","Kibar kapanış ve imza var","İmla ve dilbilgisini kontrol ettim"],"model":{"title":"Model cevap (5 puan)","x":"Dear Ms. Carter,\n\nMy name is Daniel Foster, and I moved into apartment 4B last week. I am writing to report a problem with the kitchen sink. Whenever I run the water, it leaks slowly from the pipe underneath and collects in the cabinet below, which I am worried could damage the wood over time.\n\nWould it be possible to send a maintenance worker this Thursday afternoon, any time after two o'clock? I am free then and can be home to provide access.\n\nIn the meantime, could you let me know whether I should avoid using the sink until the repair is done, or whether there is a temporary fix I could manage myself? I would appreciate any guidance.\n\nThank you for your help. I look forward to your reply.\n\nBest regards,\nDaniel Foster"},"ai":true}]},{"id":"tw-email-2","name":"Görev 2. Classmate (friendly)","eyebrow":"Email . Yaz","group":"Email","blocks":[{"t":"note","k":"ipucu","title":"Register: samimi","lines":["Sınıf arkadaşına yazıyorsun; sıcak ve gündelik bir dil uygun.","Üç maddeyi de karşıla: notları iste, midterm haberi sor, hafta sonu buluşma öner."]},{"t":"wizard","ttid":"toefl-email","ptitle":"Email Görevi","prompt":"You missed yesterday's economics lecture because of a doctor's appointment. Your classmate Alex always takes detailed notes. Write an email to Alex. In your email: briefly explain why you missed the class and ask if Alex could share the notes from yesterday; ask whether the professor said anything important about the upcoming midterm exam; and suggest meeting somewhere on campus this weekend to review the material together.","plan":["Selamlama ve amaç","Neden ve not isteği","Midterm sorusu","Buluşma önerisi ve kapanış"],"target":110,"check":["Register samimi ama nazik","Amacım ilk cümlede net","Görevdeki üç maddeyi de karşıladım","Her isteği kısa bir detayla açtım","Sıcak bir kapanış var","İmla ve dilbilgisini kontrol ettim"],"model":{"title":"Model cevap (5 puan)","x":"Hi Alex,\n\nI hope you're doing well. I had to miss yesterday's economics lecture because of a doctor's appointment, and I know you always take really detailed notes. Would you mind sharing them with me? I'd hate to fall behind before the exam.\n\nAlso, did the professor mention anything important about the upcoming midterm? I want to make sure I don't miss any changes to the format or the topics we're supposed to review.\n\nIf you're free this weekend, maybe we could meet at the library café on Saturday afternoon and go over the material together. It might help us both prepare. Let me know what works for you.\n\nThanks so much for the help, and see you soon!\n\nBest,\nMaria"},"ai":true}]},{"id":"tw-email-3","name":"Görev 3. Study Abroad Advisor (formal)","eyebrow":"Email . Yaz","group":"Email","blocks":[{"t":"note","k":"ipucu","title":"Register: resmi","lines":["Program danışmanına yazıyorsun; resmi ve açık bir dil kullan.","Üç maddeyi de karşıla: dönem ve neden, akademik hedef, konaklama tercihi ve soru."]},{"t":"wizard","ttid":"toefl-email","ptitle":"Email Görevi","prompt":"You applied to a study abroad exchange program in Berlin, and the advisor, Dr. Mitchell, has asked for more information before processing your application. Write an email to Dr. Mitchell. In your email: state which semester (fall or spring) you plan to attend and briefly explain why that timing works best for you; describe your main academic goal for the program; and mention any housing preferences you have and ask whether the program helps students find accommodation.","plan":["Selamlama ve amaç","Dönem ve neden","Akademik hedef","Konaklama tercihi, soru ve kapanış"],"target":110,"check":["Register resmi ve açık","Amacım ilk cümlede net","Görevdeki üç maddeyi de karşıladım","Her noktayı bir gerekçeyle geliştirdim","Kibar kapanış ve imza var","İmla ve dilbilgisini kontrol ettim"],"model":{"title":"Model cevap (5 puan)","x":"Dear Dr. Mitchell,\n\nThank you for your message regarding my application to the Berlin exchange program. I am happy to provide the additional details you requested.\n\nI plan to attend in the spring semester, as it fits best with my degree schedule and allows me to complete two required courses beforehand. My main academic goal is to improve my German through daily immersion while taking coursework in European economics, which is central to my major.\n\nAs for housing, I would prefer a shared student residence close to the university, if one is available. Could you tell me whether the program offers assistance in finding accommodation, or whether I should arrange this on my own?\n\nThank you again for your help. I look forward to hearing from you.\n\nBest regards,\nOmar Kaya"},"ai":true}]},{"id":"tw-ad-1","name":"Görev 1. Social Media","eyebrow":"Academic Discussion . Yaz","group":"Academic Discussion","blocks":[{"t":"note","k":"ipucu","title":"Katkı ekle","lines":["Sarah ve Mark'ın gönderilerini oku, sonra kendi duruşunu net koy.","Bir öğrencinin adını an, ama kendi cümlelerinle YENİ bir nokta kat."]},{"t":"wizard","ttid":"toefl-academic-discussion","ptitle":"Academic Discussion Görevi","prompt":"Your professor is teaching a class on social studies and asks you to post a response. In at least 100 words, express and support your own opinion in your own words. Professor: Today we are discussing the impact of social media on society. Platforms like Instagram and Twitter connect people all over the world, but there are concerns about misinformation, cyberbullying, and addiction. In your view, does social media cause more harm than good?","given":[{"title":"Sarah","x":"I think social media has caused more harm than good. It connects people, but it also lets users anonymously bully others, and spending too much time on it has been linked to anxiety and depression."},{"title":"Mark","x":"I think social media has mostly improved society. It gives a voice to people who were once ignored, supports political activism, and lets us stay connected to distant family for free instead of paying for expensive calls."}],"plan":["Net duruşun","Gerekçen","Örnek veya deneyim ve bir öğrenciye bağ"],"target":110,"check":["Profesörün sorusuna doğrudan cevap verdim","Duruşum net","Sarah veya Mark'ın fikrine değindim","Kendi cümlelerimle YENİ bir nokta ekledim","Bir gerekçe ve somut örnek var","En az 100 kelime yazdım"],"model":{"title":"Model cevap (5 puan)","x":"While I understand Sarah's concerns about cyberbullying, I lean closer to Mark's more balanced view. In my opinion, social media itself is neither good nor bad; the outcome depends on how we use it. What worries me most is not the technology but the way its design rewards endless scrolling and outrage. For example, a friend of mine spent hours arguing with strangers online until she deleted the apps and felt noticeably calmer. Yet those same platforms let her organize a neighborhood clean-up that reached hundreds of people in a single afternoon. Rather than banning social media, I believe we should teach digital literacy and demand better design from the companies, so that genuine connection outweighs the harm."},"ai":true}]},{"id":"tw-ad-2","name":"Görev 2. Workplace Models","eyebrow":"Academic Discussion . Yaz","group":"Academic Discussion","blocks":[{"t":"note","k":"ipucu","title":"Katkı ekle","lines":["Kenji ve Aisha farklı modelleri savunuyor; sen kendi deneyimine dayan.","Bir modeli net seç ve somut bir örnekle destekle."]},{"t":"wizard","ttid":"toefl-academic-discussion","ptitle":"Academic Discussion Görevi","prompt":"Your professor is teaching a class on business management and asks you to post a response. In at least 100 words, express and support your own opinion in your own words. Professor: Since the pandemic, companies disagree on the best workplace model: full-time office, fully remote, or hybrid. Considering both employee satisfaction and company productivity, which model do you think is most effective, and why?","given":[{"title":"Kenji","x":"A hybrid model is the obvious winner. It gives people flexibility for focused work at home while keeping the in-person collaboration that drives team creativity. The best ideas often come from spontaneous conversations you cannot replicate on video calls."},{"title":"Aisha","x":"Fully remote work is the future. Offices are expensive overhead, commuting wastes hours of people's lives, and trust-based cultures produce better results than constant supervision. Companies that cling to the office are losing top talent."}],"plan":["Net duruşun","Gerekçen","Örnek veya deneyim ve bir öğrenciye bağ"],"target":110,"check":["Profesörün sorusuna doğrudan cevap verdim","Duruşum net","Kenji veya Aisha'nın fikrine değindim","Kendi cümlelerimle YENİ bir nokta ekledim","Bir gerekçe ve somut örnek var","En az 100 kelime yazdım"],"model":{"title":"Model cevap (5 puan)","x":"Both Kenji and Aisha make strong points, but my own experience leads me to agree with Kenji that a hybrid model works best. Fully remote work, as Aisha says, does save commuting time and cut costs, yet it can also leave newcomers isolated and slow to learn. When I interned last summer, the days I spent in the office taught me far more than the remote ones, simply because I could ask questions instantly and watch how experienced colleagues worked. At the same time, I did my most focused writing at home, away from constant interruptions. A hybrid arrangement captures both benefits: quiet time for deep work, plus the informal conversations where the best ideas usually appear."},"ai":true}]},{"id":"tw-ad-3","name":"Görev 3. Climate Responsibility","eyebrow":"Academic Discussion . Yaz","group":"Academic Discussion","blocks":[{"t":"note","k":"ipucu","title":"Katkı ekle","lines":["Linda devleti, Omar bireyi öne çıkarıyor; sen bir tarafa yaslan ya da ikisini birleştir.","Somut bir örnekle duruşunu güçlendir."]},{"t":"wizard","ttid":"toefl-academic-discussion","ptitle":"Academic Discussion Görevi","prompt":"Your professor is teaching a class on environmental policy and asks you to post a response. In at least 100 words, express and support your own opinion in your own words. Professor: There is disagreement about who should bear the primary responsibility for reducing greenhouse gas emissions. Some argue that governments must lead through strict regulation; others believe that individual lifestyle choices drive real change. Which approach do you think is more effective, and why?","given":[{"title":"Linda","x":"Individual action is too small to fix a global crisis. Only governments can mandate systemic change: emission limits, public transit, renewable subsidies. Asking people to recycle while corporations pollute freely just shifts the blame onto consumers."},{"title":"Omar","x":"Government policies fail when citizens don't support them. Real change starts with individual habits that shift cultural norms. When enough people change how they eat, travel, and consume, businesses and governments follow."}],"plan":["Net duruşun","Gerekçen","Örnek veya deneyim ve bir öğrenciye bağ"],"target":110,"check":["Profesörün sorusuna doğrudan cevap verdim","Duruşum net","Linda veya Omar'ın fikrine değindim","Kendi cümlelerimle YENİ bir nokta ekledim","Bir gerekçe ve somut örnek var","En az 100 kelime yazdım"],"model":{"title":"Model cevap (5 puan)","x":"I find myself agreeing more with Linda, though Omar identifies something important. Individual choices matter, but they are simply too small and too uneven to solve a crisis of this scale. For instance, I sorted my recycling carefully for years, only to learn that a handful of industries release more emissions than millions of households combined. That does not make personal habits pointless; rather, they build the public support that Omar rightly values. In my view, the two approaches reinforce each other. Governments must set binding limits and invest in clean energy, while grassroots pressure keeps those policies alive across changing administrations. Real progress comes when strong regulation and shifting cultural norms push in the same direction."},"ai":true}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status,sel){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,selected_letter:(sel||null),answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec" lang="en">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u" lang="en">${esc(D.badge||'TOEFL')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz" data-ttid="${esc(b.ttid||'')}">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">5 token</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';

      if(val)recAns(q.getAttribute('data-slug'),good?'correct':'incorrect',val);
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{

      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else if(val)logErr(qtext,want);
      if(val)recAns(q.getAttribute('data-slug'),good?'correct':'incorrect',val);
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}

var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const forced=(wz&&wz.dataset)?wz.dataset.ttid:'';let tt=forced?types.find(t=>t.id===forced):null;if(!tt)tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
