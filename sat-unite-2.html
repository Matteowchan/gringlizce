t by point.", "B": "To list the drawbacks of cities in order to argue against city life.", "C": "To describe the noise and crowding typical of large cities.", "D": "To concede drawbacks and then argue that they are inseparable from a benefit."}, "correct": "D", "choice_families": {"B": "Ters islev", "C": "Dogru konu yanlis islev", "A": "Metinde olmayan islev"}, "why_correct": "The text concedes drawbacks, then argues they produce a benefit, defending city life. Choice A fits.", "why_wrong": {"B": "The essay defends city life, so using the drawbacks to argue against it reverses the function.", "C": "This names the topic, not the concede-then-defend move.", "A": "Rural life is not systematically compared."}}, {"id": "u2-l2-f3-03", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "A myth holds that we use only ten percent of our brains. The passage sets out to bury it: brain scans show activity across virtually the entire brain over the course of a day, leaving no vast unused reserve.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To state a popular belief and then refute it with evidence.", "B": "To state a popular belief and then confirm it with evidence.", "C": "To explain which parts of the brain are most active.", "D": "To recommend ways of using more of the brain."}, "correct": "A", "choice_families": {"B": "Ters islev", "C": "Dogru konu yanlis islev", "D": "Metinde olmayan islev"}, "why_correct": "The text states the myth, then refutes it with scan evidence. Choice A fits.", "why_wrong": {"B": "The text refutes the belief rather than confirming it, so B reverses the function.", "C": "This names the topic, not the refuting move.", "D": "The text debunks the myth rather than advising how to 'use more' of the brain."}}, {"id": "u2-l2-f3-04", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The final paragraph does not soften the report's warning. If anything, it hardens it, stating that the deadline for action is closer than the earlier sections implied and that delay now carries costs that cannot later be undone.", "stem": "Which choice best describes the function of the final paragraph in the text as a whole?", "choices": {"A": "It softens the warning developed earlier in the report.", "B": "It intensifies the warning developed earlier rather than easing it.", "C": "It summarizes the report's topic for the reader.", "D": "It introduces a solution the report had not mentioned."}, "correct": "B", "choice_families": {"C": "Dogru konu yanlis islev", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The paragraph hardens the warning and moves the deadline closer. Choice A names that intensifying function.", "why_wrong": {"C": "It does more than summarize; it strengthens the warning.", "D": "No new solution is introduced.", "A": "The paragraph intensifies rather than softens, so B reverses the function."}}, {"id": "u2-l2-f3-05", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "It would be easy to read the poem's storm imagery as a sign of despair. The poem resists that reading. By the final lines the storm has cleared, and the speaker greets the washed sky as a fresh beginning.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To describe the storm imagery used in the poem.", "B": "To raise an interpretation and then confirm it as correct.", "C": "To raise a likely interpretation and then push against it.", "D": "To compare this poem with others about storms."}, "correct": "C", "choice_families": {"B": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The text raises the 'despair' reading and then resists it, ending on renewal. Choice A fits.", "why_wrong": {"B": "The text pushes against the interpretation rather than confirming it, so B reverses the function.", "D": "No other poems are compared.", "A": "This names the imagery topic, not the resisting move."}}, {"id": "u2-l2-f3-06", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The second half of the article is not a list of the diet's benefits. It is a caution: the author details how the plan can cause nutrient gaps and warns readers to consult a doctor before beginning it.", "stem": "Which choice best describes the function of the second half of the article?", "choices": {"A": "It compares the diet with a rival diet plan.", "B": "It promotes the benefits of the diet described earlier.", "C": "It describes the meals the diet typically includes.", "D": "It warns against the diet rather than promoting its benefits."}, "correct": "D", "choice_families": {"B": "Ters islev", "C": "Dogru konu yanlis islev", "A": "Metinde olmayan islev"}, "why_correct": "The second half cautions about nutrient gaps and urges medical advice. Choice A names that warning function.", "why_wrong": {"B": "The section warns rather than promotes, so B reverses the function.", "C": "It does not describe the diet's meals.", "A": "No rival diet is compared."}}, {"id": "u2-l2-f3-07", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The economist does not endorse the tax cut she describes. After laying out its supporters' case, she turns to its likely effects and argues that the promised growth rarely materializes and that deficits usually widen instead.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To present a policy's supporting case and then argue against the policy.", "B": "To present a policy's supporting case and then endorse the policy.", "C": "To explain how the proposed tax cut would work.", "D": "To compare two competing tax proposals."}, "correct": "A", "choice_families": {"B": "Ters islev", "C": "Dogru konu yanlis islev", "D": "Metinde olmayan islev"}, "why_correct": "The text lays out the supporters' case and then argues against the cut. Choice A fits.", "why_wrong": {"B": "The economist argues against the cut rather than endorsing it, so B reverses the function.", "C": "Explaining how it works is topic material, not the argue-against move.", "D": "Only one policy is discussed."}}, {"id": "u2-l2-f3-08", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The closing anecdote is not there to lighten the mood. It lands as a rebuke: the cheerful company slogan is quoted just after the account of the layoffs, so that the slogan reads as hollow.", "stem": "Which choice best describes the function of the closing anecdote?", "choices": {"A": "It lightens the tone after the account of the layoffs.", "B": "It undercuts the company's slogan rather than relieving the tone.", "C": "It restates the company's official slogan for emphasis.", "D": "It introduces a solution to the layoffs described."}, "correct": "B", "choice_families": {"C": "Dogru konu yanlis islev", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The anecdote places the slogan against the layoffs so it reads as hollow, a rebuke. Choice A fits.", "why_wrong": {"C": "It does more than restate the slogan; it undercuts it.", "D": "No solution is introduced.", "A": "It sharpens rather than lightens the tone, so B reverses the function."}}, {"id": "u2-l2-f3-09", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The passage opens by seeming to agree that standardized tests measure ability fairly. That agreement is a setup. The rest of the passage dismantles it, showing how test scores track family income more closely than they track talent.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To explain how standardized tests are scored.", "B": "To accept a position and then build further support for it.", "C": "To appear to accept a position in order to dismantle it.", "D": "To recommend a new kind of standardized test."}, "correct": "C", "choice_families": {"B": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The apparent agreement is a setup that the passage then dismantles. Choice A fits.", "why_wrong": {"B": "The passage tears the position down rather than supporting it, so B reverses the function.", "D": "No new test is recommended.", "A": "How tests are scored is topic material, not the dismantling move."}}, {"id": "u2-l2-f3-10", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The example of the failed colony is not offered as a model to follow. The author presents it as a warning, tracing how ignoring local knowledge doomed the settlement within a single winter.", "stem": "Which choice best describes the function of the example of the failed colony?", "choices": {"A": "It compares two colonies founded in the same year.", "B": "It serves as a model of successful settlement to imitate.", "C": "It describes the geography of the settlement in detail.", "D": "It serves as a cautionary case rather than a model to imitate."}, "correct": "D", "choice_families": {"B": "Ters islev", "C": "Dogru konu yanlis islev", "A": "Metinde olmayan islev"}, "why_correct": "The failed colony is presented as a warning about ignoring local knowledge. Choice A fits.", "why_wrong": {"B": "It is a cautionary case, not a model to imitate, so B reverses the function.", "C": "It does not detail the settlement's geography.", "A": "Only one colony is discussed."}}, {"id": "u2-l2-f4-01", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The passage explains how tree rings record a region's climate history. Each ring's width reflects a year's growing conditions, so a cross-section becomes a readable archive of past wet and dry seasons.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To explain how a natural feature can serve as a record of past climate.", "B": "To weigh the advantages and disadvantages of using tree rings.", "C": "To argue that tree rings are unreliable climate indicators.", "D": "To describe how tree rings form and record climate."}, "correct": "D", "choice_families": {"B": "Metinde olmayan islev", "C": "Ters islev", "A": "Metinde olmayan islev"}, "why_correct": "The passage describes how tree rings form and record climate, presenting it as a readable archive. Choice D fits.", "why_wrong": {"B": "The passage never weighs advantages against disadvantages.", "C": "The passage treats tree rings as reliable, not unreliable, so C reverses the stance.", "A": "The passage does more than a general claim about 'a natural feature'; and it never sets up the record as one option among several, which this phrasing implies."}}, {"id": "u2-l2-f4-02", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The article traces how a small bakery grew into a national chain. It follows the founder's decisions year by year, from her first rented oven to the opening of her hundredth store.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To narrate the growth of a business through its founder's decisions.", "B": "To recommend strategies other bakeries should adopt.", "C": "To criticize the founder's choices as reckless.", "D": "To compare the chain with its main competitor."}, "correct": "A", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "B": "Metinde olmayan islev"}, "why_correct": "The article narrates the bakery's growth through the founder's year-by-year decisions. Choice B fits.", "why_wrong": {"C": "It follows her choices without criticizing them as reckless, so C misstates the stance.", "D": "No competitor is compared.", "B": "The article recounts a story; it never offers strategies for others to adopt."}}, {"id": "u2-l2-f4-03", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The text describes a curious property of certain desert plants: they photosynthesize at night, opening their pores in darkness to lose less water than they would under the noon sun.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To rank desert plants by how much water they save.", "B": "To describe an unusual adaptation and the advantage it provides.", "C": "To argue that the adaptation is harmful to the plants.", "D": "To propose an experiment on desert plants."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Metinde olmayan islev"}, "why_correct": "The text describes the night-photosynthesis adaptation and its water-saving advantage. Choice A fits.", "why_wrong": {"C": "The adaptation is presented as beneficial, not harmful, so C reverses the stance.", "D": "No experiment is proposed.", "A": "The text never ranks plants by water saved."}}, {"id": "u2-l2-f4-04", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The passage recounts how a forgotten mathematician's notebooks were rediscovered in an attic and how their contents anticipated results credited to others decades later.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To evaluate whether the mathematician deserves more credit than she received.", "B": "To argue that the notebooks contain nothing of value.", "C": "To recount a rediscovery and note what the notebooks anticipated.", "D": "To compare the mathematician with her contemporaries in detail."}, "correct": "C", "choice_families": {"A": "Metinde olmayan islev", "D": "Metinde olmayan islev", "B": "Ters islev"}, "why_correct": "The passage recounts the rediscovery and notes what the notebooks anticipated. Choice B fits.", "why_wrong": {"A": "The passage reports the facts; it never stages an evaluation of who deserves credit.", "D": "No detailed comparison with contemporaries is made.", "B": "It presents the notebooks as significant, not worthless, so C reverses the stance."}}, {"id": "u2-l2-f4-05", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The essay describes the experience of learning a second language as an adult: the early stumbling, the slow gains, and the strange moment when the new language begins to feel like one's own.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To offer step-by-step instructions for learning a language.", "B": "To compare two methods of language teaching.", "C": "To argue that adults cannot truly learn a second language.", "D": "To convey the experience of gradually acquiring a second language."}, "correct": "D", "choice_families": {"A": "Metinde olmayan islev", "C": "Ters islev", "B": "Metinde olmayan islev"}, "why_correct": "The essay conveys the felt experience of acquiring a language over time. Choice B fits.", "why_wrong": {"A": "The essay evokes an experience; it never gives step-by-step instructions.", "C": "It shows the language becoming one's own, the opposite of claiming adults cannot learn, so C reverses the stance.", "B": "No two teaching methods are compared."}}, {"id": "u2-l2-f4-06", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The text explains why some bridges are built to sway. A degree of movement, it notes, lets a structure absorb wind and traffic forces that a perfectly rigid bridge would transmit straight into its joints.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To explain why a seemingly undesirable feature is actually functional.", "B": "To list the materials used in modern bridge construction.", "C": "To argue that swaying bridges are dangerous and should be avoided.", "D": "To compare suspension bridges with arch bridges."}, "correct": "A", "choice_families": {"B": "Metinde olmayan islev", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text explains why sway, which sounds like a flaw, is actually functional. Choice A fits.", "why_wrong": {"B": "The text never lists construction materials.", "C": "It defends swaying as useful, not dangerous, so C reverses the stance.", "D": "No two bridge types are compared."}}, {"id": "u2-l2-f4-07", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The passage describes how a coral spawning event unfolds: on a few nights each year, entire reefs release eggs and sperm at once, timed to the moon, in a synchronized burst that floods the water with life.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To predict how climate change will alter coral spawning.", "B": "To describe a striking natural event and its timing.", "C": "To argue that coral spawning is poorly understood.", "D": "To compare spawning in corals with spawning in fish."}, "correct": "B", "choice_families": {"A": "Metinde olmayan islev", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The passage describes the synchronized spawning event and its lunar timing. Choice B fits.", "why_wrong": {"A": "The passage never turns to predictions about climate change.", "C": "It presents the event as understood enough to describe, not as a mystery, so C misstates it.", "D": "Fish spawning is not compared."}}, {"id": "u2-l2-f4-08", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The text recounts how an old law, written to regulate horse-drawn carriages, was later stretched to cover automobiles, then bicycles, then electric scooters, as courts applied its language to vehicles its authors never imagined.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To propose a new law covering electric scooters.", "B": "To argue that the old law should be repealed.", "C": "To trace how an old law was extended to new technologies over time.", "D": "To compare traffic laws across different countries."}, "correct": "C", "choice_families": {"A": "Metinde olmayan islev", "D": "Metinde olmayan islev", "B": "Ters islev"}, "why_correct": "The text traces how one old law was stretched to cover new vehicles over time. Choice B fits.", "why_wrong": {"A": "The text describes a history; it never proposes a new law.", "D": "No cross-country comparison is made.", "B": "It does not argue for repeal, so C adds a stance the text lacks."}}, {"id": "u2-l2-f4-09", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The passage explains how salt was once so valuable that it shaped trade routes and taxes, and how roads and cities grew up around the places where it could be mined or evaporated from the sea.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To assess whether salt is still economically important today.", "B": "To compare salt mining with sea-salt evaporation.", "C": "To argue that salt's historical value has been exaggerated.", "D": "To explain how a common substance once shaped trade and settlement."}, "correct": "D", "choice_families": {"A": "Metinde olmayan islev", "C": "Ters islev", "B": "Metinde olmayan islev"}, "why_correct": "The passage explains how salt once shaped trade routes, taxes, and settlement. Choice B fits.", "why_wrong": {"A": "The passage stays with the past; it never assesses salt's importance today.", "C": "It affirms salt's historical value rather than calling it exaggerated, so C reverses the stance.", "B": "The two extraction methods are mentioned, not systematically compared."}}, {"id": "u2-l2-f4-10", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metinde olmayan islev", "passage": "The text describes the way certain birds learn their songs: hatched knowing only a rough template, they refine it by listening to adults, so that a young bird raised in silence never sings a full, normal song.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To explain how song develops through a mix of instinct and learning.", "B": "To recommend methods for raising songbirds in captivity.", "C": "To argue that birdsong is entirely instinctive.", "D": "To compare the songs of two different bird species."}, "correct": "A", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "B": "Metinde olmayan islev"}, "why_correct": "The text explains that song develops from both an inborn template and learning from adults. Choice B fits.", "why_wrong": {"C": "It shows learning is required, the opposite of 'entirely instinctive,' so C reverses the point.", "D": "No two species' songs are compared.", "B": "The text explains a process; it never recommends captive-rearing methods."}}]}, {"no": 3, "name": "Cross-Text Connections", "teaching": {"ne_olculuyor": ["Iki kisa metin verilir, Text 1 ve Text 2, ayni konuda. Gorev: aralarindaki ILISKIYI dogru kurmak.", "Iki bicimde gelir: Text 2 yazari Text 1'e nasil yanit verirdi, ya da iki metin arasindaki iliski nedir.", "Kritik nokta: dogru cevap HER IKI metni de kullanmali ve iliskinin yonunu dogru vermeli. Tek metne dayanmak ya da yonu ters okumak en sik hatadir."], "karar_proseduru": ["Once her metnin POZISYONUNU tek cumlede yaz.  Text 1 ne savunuyor. Text 2 ne savunuyor. Kendi kelimenle, kisa.", "Iliskiyi adlandir.  Ayni fikirdeler mi, Text 2 Text 1'i cürütüyor mu, sinirliyor mu, ornekliyor mu, kosul mu ekliyor.", "Text 2 yazarinin GERCEK sozlerine bak.  Yanit sorusunda, Text 2'nin kendi iddiasi Text 1'in tam neyine dokunuyor. Genel degil, spesifik noktaya.", "Her iki metni de kullan.  Sadece bir metne uyan secenek yanlistir. Dogru cevap iliskiyi kurar, tek tarafi ozetlemez.", "Yonu kontrol et.  Kim katiliyor kim katilmiyor. Secenek bunu ters cevirmis olabilir. Yon yanlissa ele."], "celdirici_aileleri": [{"ad": "Tek metne dayanma", "tanim": "Secenek sadece BIR metni dogru ozetler ama iki metin arasindaki iliskiyi kurmaz. Genelde Text 1 ya da Text 2'nin tek basina soyledigi bir sey. Iliski sorusuna tek tarafli cevap."}, {"ad": "Iliski yonu ters", "tanim": "Secenek iliskinin YONUNU ters okur. Text 2 katilmiyorsa katiliyor der, ya da kim hangi gorusu savunuyor karistirir. Iki metin de dogru anlasilir ama yon yanlistir."}, {"ad": "Iliskiyi yanlis kurma", "tanim": "Iki gorus de dogru verilir ama ARALARINDAKI iliski yanlis adlandirilir. Text 2 aslinda sinirliyorken tamamen cürütüyor der, ya da katiliyorken karsi cikiyor der. Iliskinin turu yanlistir."}, {"ad": "Metin disi cikarim", "tanim": "Secenek iki yazardan HICBIRININ soylemedigi bir gorusu birine yukler. Makul gorunur ama metinde dayanagi yoktur. Metin disi bir iddia."}], "top_tips": ["Iliski sorusunda dogru cevap HER IKI metne dokunur. Sadece Text 1'i ya da sadece Text 2'yi ozetleyen secenegi hemen ele.", "Kim ne diyor karistirma. Text 1 A der, Text 2 B der. Secenek bunlari yer degistirmis olabilir. Yonu iki kez kontrol et.", "Katilmak, cürütmek, sinirlamak, kosul eklemek farkli iliskilerdir. Text 2 kismen katiliyorsa tamamen cürütüyor demek yanlistir.", "Secenekteki her iddianin metinde dayanagini bul. Dayanagi olmayan, kulaga mantikli gelen secenek metin disi cikarim tuzagidir."]}, "families": ["Tek metne dayanma", "Iliski yonu ters", "Iliskiyi yanlis kurma", "Metin disi cikarim"], "fam_short": {"Tek metne dayanma": "Tek metin", "Iliski yonu ters": "Yon ters", "Iliskiyi yanlis kurma": "Yanlis iliski", "Metin disi cikarim": "Metin disi"}, "main_ids": ["u2-l3-f1-01", "u2-l3-f2-01", "u2-l3-f3-01", "u2-l3-f4-01"], "questions": [{"id": "u2-l3-f1-01", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Remote work, its supporters argue, frees employees from long commutes and lets them focus without the interruptions of a busy office.\n\nText 2: In practice, many remote workers report that the boundary between job and home never closes; without the office to leave, they find themselves answering messages late into the night.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 complicates the benefit Text 1 praises by pointing to a cost Text 1 overlooks.", "B": "Text 2 explains that remote work frees employees from long commutes.", "C": "Text 2 fully agrees with Text 1 that remote work reduces interruptions.", "D": "Text 2 argues that offices should be redesigned to be quieter."}, "correct": "A", "choice_families": {"B": "Tek metne dayanma", "C": "Iliski yonu ters", "D": "Metin disi cikarim"}, "why_correct": "Text 1 praises focus and freedom; Text 2 raises an overlooked cost (no boundary), complicating that benefit. Choice A captures the relationship.", "why_wrong": {"B": "This restates only Text 1's point and ignores Text 2's contrast, so it fails to build the relationship.", "C": "Text 2 does not agree that remote work is all benefit; it raises a downside, so the direction is reversed.", "D": "Neither text proposes redesigning offices."}}, {"id": "u2-l3-f1-02", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Zoos, defenders say, play a vital role in conservation, breeding endangered species and educating the public about the need to protect them.\n\nText 2: Critics counter that most zoo animals belong to species in no danger of extinction, and that the money spent housing them could do more good protecting habitats in the wild.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 argues that zoos educate the public about endangered species.", "B": "Text 2 challenges Text 1's defense by questioning both its conservation and its spending priorities.", "C": "Text 2 agrees with Text 1 that zoos are essential to conservation.", "D": "Text 2 recommends building larger enclosures for zoo animals."}, "correct": "B", "choice_families": {"C": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Tek metne dayanma"}, "why_correct": "Text 1 defends zoos; Text 2 challenges that defense on conservation and spending. Choice A names the relationship.", "why_wrong": {"C": "Text 2 disagrees with Text 1, so 'agrees' reverses the direction.", "D": "Neither text recommends larger enclosures.", "A": "This restates Text 1's point, not Text 2's counter, so it does not build the relationship."}}, {"id": "u2-l3-f1-03", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Standardized testing, supporters hold, gives colleges a single objective measure that lets them compare applicants from very different schools.\n\nText 2: Yet a test taken on one morning captures a narrow slice of a student. Grades earned over years, some argue, reveal persistence and growth that a single score cannot.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By claiming that grades are also completely objective measures.", "B": "By agreeing that standardized tests offer a single objective measure.", "C": "By arguing that a single score misses qualities a longer record reveals.", "D": "By proposing that colleges stop admitting students altogether."}, "correct": "C", "choice_families": {"B": "Tek metne dayanma", "D": "Metin disi cikarim", "A": "Metin disi cikarim"}, "why_correct": "Text 2 would push back on Text 1 by noting that a single test misses persistence and growth that grades reveal. Choice A fits.", "why_wrong": {"B": "This restates Text 1's claim; it is not how Text 2 would respond.", "D": "Neither text suggests colleges stop admitting students.", "A": "Text 2 never claims grades are 'completely objective'; that view is in neither text."}}, {"id": "u2-l3-f1-04", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: The historian argues that the revolution was driven mainly by economic hardship, as rising bread prices pushed ordinary people to the brink.\n\nText 2: Economic strain mattered, a second historian allows, but ideas mattered too; pamphlets and debates gave the hardship a language and a target it would otherwise have lacked.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 claims the revolution had no single identifiable cause at all.", "B": "Text 2 argues that rising bread prices pushed people to the brink.", "C": "Text 2 rejects the idea that economic hardship played any role.", "D": "Text 2 accepts part of Text 1's claim while adding a factor Text 1 downplays."}, "correct": "D", "choice_families": {"B": "Tek metne dayanma", "C": "Iliski yonu ters", "A": "Metin disi cikarim"}, "why_correct": "Text 2 grants the economic factor but adds the role of ideas that Text 1 downplays. Choice A captures the qualifying relationship.", "why_wrong": {"B": "This restates Text 1's economic claim, not Text 2's addition.", "C": "Text 2 allows that economic strain mattered, so 'any role' reverses its stance.", "A": "Text 2 does not claim there is no identifiable cause; it names two."}}, {"id": "u2-l3-f1-05", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Social media, some argue, has widened the public square, giving ordinary people a platform that was once reserved for a few powerful outlets.\n\nText 2: But a louder square is not always a fairer one. On these platforms, researchers find, the most extreme voices travel fastest, drowning out the moderate majority.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 qualifies Text 1's optimism by describing a distortion in how attention spreads.", "B": "Text 2 explains that social media gives ordinary people a platform.", "C": "Text 2 fully endorses Text 1's view of a wider public square.", "D": "Text 2 argues that traditional outlets should be shut down."}, "correct": "A", "choice_families": {"B": "Tek metne dayanma", "C": "Iliski yonu ters", "D": "Metin disi cikarim"}, "why_correct": "Text 2 qualifies Text 1's optimism by noting extreme voices dominate. Choice A fits.", "why_wrong": {"B": "This restates Text 1's point, not Text 2's qualification.", "C": "Text 2 complicates rather than endorses Text 1, so the direction is off.", "D": "Neither text calls for shutting outlets down."}}, {"id": "u2-l3-f1-06", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: A team reports that a new drug lowered blood pressure sharply in their trial, and they call for its rapid approval.\n\nText 2: A second group notes that the trial ran only eight weeks. Long-term safety, they caution, cannot be judged from so short a study, whatever the early numbers show.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By agreeing that the drug should be approved rapidly.", "B": "By arguing that the trial was too short to justify the confidence Text 1 expresses.", "C": "By reporting that the drug lowered blood pressure sharply.", "D": "By claiming the drug is certainly dangerous over the long term."}, "correct": "B", "choice_families": {"C": "Tek metne dayanma", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 would respond that eight weeks is too short to support rapid approval. Choice A fits.", "why_wrong": {"C": "This restates Text 1's result, not Text 2's response.", "D": "Text 2 says safety cannot yet be judged, not that the drug is certainly dangerous.", "A": "Text 2 urges caution rather than agreeing to rapid approval, so the direction is reversed."}}, {"id": "u2-l3-f1-07", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: The critic praises the museum's new wing for making art accessible, with bright signs and interactive screens guiding every visitor.\n\nText 2: Another critic worries that the screens do the looking for us. Told what to notice, she argues, visitors stop discovering anything on their own.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 agrees that the screens make art more accessible to all.", "B": "Text 2 praises the bright signs and interactive screens.", "C": "Text 2 raises a concern about the very feature Text 1 praises.", "D": "Text 2 suggests the museum should charge higher ticket prices."}, "correct": "C", "choice_families": {"B": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 worries the screens 'do the looking for us,' targeting the feature Text 1 praised. Choice A fits.", "why_wrong": {"B": "Text 2 criticizes the screens rather than praising them, reversing the direction.", "D": "Neither text mentions ticket prices.", "A": "Text 2 does not agree the screens are a clear benefit, so 'agrees' is wrong."}}, {"id": "u2-l3-f1-08", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Automation, its advocates argue, will free workers from dull, repetitive tasks and let them focus on more creative work.\n\nText 2: For that promise to hold, a labor economist notes, displaced workers must be retrained for the new roles, and history shows such retraining is often too slow to catch those left behind.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 recommends banning automation in most industries.", "B": "Text 2 argues that automation frees workers for creative work.", "C": "Text 2 denies that automation will change the workplace at all.", "D": "Text 2 makes Text 1's promise conditional on a step Text 1 leaves out."}, "correct": "D", "choice_families": {"B": "Tek metne dayanma", "C": "Iliski yonu ters", "A": "Metin disi cikarim"}, "why_correct": "Text 2 makes Text 1's promise depend on retraining, a step Text 1 omits. Choice A fits.", "why_wrong": {"B": "This restates Text 1's promise, not Text 2's condition.", "C": "Text 2 assumes automation changes work; it disputes the ease, not the fact.", "A": "Neither text calls for banning automation."}}, {"id": "u2-l3-f1-09", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: A biologist argues that a species' survival depends most on its genetic diversity, which lets some individuals withstand new threats.\n\nText 2: Genes are only part of it, another biologist responds. A population can be genetically rich yet still collapse if its habitat disappears faster than any individual can adapt.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By arguing that habitat loss can override the genetic advantage Text 1 emphasizes.", "B": "By agreeing that genetic diversity is the single decisive factor.", "C": "By restating that diverse genes let some individuals withstand threats.", "D": "By claiming that genetic diversity has no effect on survival."}, "correct": "A", "choice_families": {"B": "Iliski yonu ters", "C": "Tek metne dayanma", "D": "Iliski yonu ters"}, "why_correct": "Text 2 responds that fast habitat loss can override genetic diversity. Choice A fits.", "why_wrong": {"B": "Text 2 denies that genes are the single decisive factor, reversing Text 1.", "C": "This restates Text 1's claim rather than Text 2's response.", "D": "Text 2 says genes are 'only part of it,' not that they have no effect."}}, {"id": "u2-l3-f1-10", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Tek metne dayanma", "passage": "Text 1: Ecotourism, supporters say, protects wild places by giving local communities a financial reason to keep them intact.\n\nText 2: The logic holds only up to a point. Beyond a certain number of visitors, one study warns, the very traffic drawn by ecotourism begins to erode the habitats it was meant to preserve.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 argues that ecotourism gives communities a reason to protect nature.", "B": "Text 2 sets a limit on the benefit Text 1 describes.", "C": "Text 2 concludes that ecotourism never protects wild places.", "D": "Text 2 recommends banning all tourism in natural areas."}, "correct": "B", "choice_families": {"C": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Tek metne dayanma"}, "why_correct": "Text 2 accepts the benefit but caps it: past a threshold, traffic erodes habitats. Choice A fits.", "why_wrong": {"C": "Text 2 says the logic holds 'up to a point,' not never, so 'never' overstates it.", "D": "Neither text calls for banning all tourism.", "A": "This restates Text 1's claim, not Text 2's limit."}}, {"id": "u2-l3-f2-01", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A researcher argues that city parks measurably improve residents' health, pointing to lower stress and more exercise among people who live near green space.\n\nText 2: These benefits are real, a second researcher agrees, and adds that parks also cool neighborhoods and clean the air, strengthening the case for building more of them.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 disputes Text 1's claim that parks improve health.", "B": "Text 2 agrees with Text 1 and extends its case with additional benefits.", "C": "Text 2 argues that parks provide no measurable benefits.", "D": "Text 2 recommends replacing parks with indoor gyms."}, "correct": "B", "choice_families": {"C": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 explicitly agrees ('these benefits are real') and adds cooling and air-cleaning. Choice A gives the correct direction.", "why_wrong": {"C": "Text 2 affirms benefits and adds more, so 'no benefits' reverses its stance.", "D": "Neither text suggests replacing parks with gyms.", "A": "Text 2 agrees rather than disputes, so this reverses the direction."}}, {"id": "u2-l3-f2-02", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A critic contends that the poet's late work is his weakest, its images blurred and its rhythms slack.\n\nText 2: A second critic sees the same late poems as his richest, arguing that what looks like slackness is a deliberate loosening that lets feeling breathe.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 argues that the poet wrote no late poems at all.", "B": "Text 2 agrees that the late poems are the poet's weakest.", "C": "Text 2 defends the late work that Text 1 dismisses.", "D": "Text 2 compares the poet with a contemporary novelist."}, "correct": "C", "choice_families": {"B": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Metin disi cikarim"}, "why_correct": "Text 1 calls the late work weakest; Text 2 calls it richest, defending it. Choice A gives the direction.", "why_wrong": {"B": "Text 2 praises the late poems, so agreeing they are weakest reverses its view.", "D": "No contemporary novelist is mentioned.", "A": "Both texts assume the late poems exist; neither denies it."}}, {"id": "u2-l3-f2-03", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: One economist warns that raising the minimum wage will cost jobs, as employers cut staff to offset higher labor costs.\n\nText 2: Recent studies, another economist notes, find little job loss after modest increases; some even show slight employment gains as higher pay reduces turnover.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By arguing that wages should never be regulated by law.", "B": "By confirming that minimum wage increases cause employers to cut staff.", "C": "By agreeing that higher wages always reduce total employment.", "D": "By presenting evidence that challenges Text 1's prediction of job losses."}, "correct": "D", "choice_families": {"B": "Iliski yonu ters", "C": "Iliski yonu ters", "A": "Metin disi cikarim"}, "why_correct": "Text 2 offers studies finding little job loss, challenging Text 1's prediction. Choice A gives the direction.", "why_wrong": {"B": "Text 2 challenges the job-loss claim rather than confirming it.", "C": "Text 2 cites possible gains, so 'always reduce employment' reverses its point.", "A": "Text 2 discusses evidence, not whether wages should ever be regulated."}}, {"id": "u2-l3-f2-04", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A teacher argues that homework reinforces learning and builds the discipline students will need later.\n\nText 2: Another teacher counters that for young children, research links heavy homework to stress and to a loss of interest in school, with little gain in achievement.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 opposes Text 1's endorsement, at least for young children.", "B": "Text 2 supports Text 1's claim that homework builds discipline.", "C": "Text 2 argues that homework has no effect of any kind.", "D": "Text 2 proposes lengthening the school day instead."}, "correct": "A", "choice_families": {"B": "Iliski yonu ters", "C": "Iliskiyi yanlis kurma", "D": "Metin disi cikarim"}, "why_correct": "Text 2 counters Text 1, citing stress and lost interest for young children. Choice A gives the direction.", "why_wrong": {"B": "Text 2 opposes rather than supports Text 1, reversing the direction.", "C": "Text 2 reports specific effects, so 'no effect of any kind' misstates it.", "D": "Neither text proposes lengthening the school day."}}, {"id": "u2-l3-f2-05", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A planner argues that wider roads ease congestion by giving traffic more room to flow.\n\nText 2: Wider roads, a transport scholar replies, tend to fill up again as the added capacity draws more drivers, a pattern known as induced demand.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By agreeing that wider roads reliably ease congestion.", "B": "By arguing that added road capacity tends to attract traffic rather than relieve it.", "C": "By confirming that traffic has more room to flow on wider roads.", "D": "By recommending that all existing roads be narrowed."}, "correct": "B", "choice_families": {"C": "Tek metne dayanma", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 argues added capacity draws more drivers (induced demand), opposing Text 1. Choice A gives the direction.", "why_wrong": {"C": "This restates Text 1's premise, not Text 2's response.", "D": "Text 2 never recommends narrowing all roads.", "A": "Text 2 disputes that wider roads ease congestion, so agreeing reverses its view."}}, {"id": "u2-l3-f2-06", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A scholar claims that folktales spread mainly by migration, carried from place to place as people moved.\n\nText 2: Another scholar finds the same tales arising independently in distant cultures that never met, suggesting shared human concerns can produce similar stories on their own.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 argues that folktales do not actually resemble one another.", "B": "Text 2 confirms that folktales spread only through migration.", "C": "Text 2 offers an alternative to Text 1's explanation for how similar tales appear.", "D": "Text 2 claims that folktales were invented by a single culture."}, "correct": "C", "choice_families": {"B": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Metin disi cikarim"}, "why_correct": "Text 2 proposes independent origin as an alternative to Text 1's migration account. Choice A gives the relationship.", "why_wrong": {"B": "Text 2 offers a different mechanism, so 'only through migration' reverses it.", "D": "Neither text claims a single culture invented all folktales.", "A": "Text 2 assumes the tales resemble one another; that is the puzzle it addresses."}}, {"id": "u2-l3-f2-07", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A columnist argues that reading fiction builds empathy by letting readers inhabit lives unlike their own.\n\nText 2: A psychologist agrees, citing studies in which readers of literary fiction performed better on tests of reading others' emotions.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 recommends that schools stop teaching fiction.", "B": "Text 2 disputes Text 1's claim that fiction builds empathy.", "C": "Text 2 argues that fiction reduces readers' empathy.", "D": "Text 2 supports Text 1's claim with experimental evidence."}, "correct": "D", "choice_families": {"B": "Iliski yonu ters", "C": "Iliski yonu ters", "A": "Metin disi cikarim"}, "why_correct": "Text 2 agrees and supplies supporting studies. Choice A gives the direction.", "why_wrong": {"B": "Text 2 supports rather than disputes Text 1, reversing the direction.", "C": "Text 2 shows fiction improves emotion reading, so 'reduces empathy' reverses it.", "A": "Neither text recommends dropping fiction."}}, {"id": "u2-l3-f2-08", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A curator argues that returning artifacts to their countries of origin will empty the world's great museums.\n\nText 2: Returns have not emptied museums, a second curator observes; loans, replicas, and new donations have kept the halls full while artifacts went home.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By pointing to evidence that returns have not had the effect Text 1 fears.", "B": "By agreeing that returning artifacts will empty the museums.", "C": "By confirming that museums cannot survive any returns.", "D": "By arguing that no artifacts should ever be displayed."}, "correct": "A", "choice_families": {"B": "Iliski yonu ters", "C": "Iliski yonu ters", "D": "Metin disi cikarim"}, "why_correct": "Text 2 notes returns have not emptied museums, countering Text 1's fear. Choice A gives the direction.", "why_wrong": {"B": "Text 2 disputes the emptying claim, so agreeing reverses it.", "C": "Text 2 shows museums stayed full, so 'cannot survive returns' reverses its point.", "D": "Neither text argues against all display."}}, {"id": "u2-l3-f2-09", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: A coach insists that natural talent is what separates elite athletes from the rest.\n\nText 2: Talent opens the door, a sports scientist responds, but tracking studies show that hours of deliberate practice predict elite performance far better than early talent does.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By agreeing that natural talent is the decisive factor.", "B": "By arguing that practice predicts elite performance more than talent does.", "C": "By confirming that talent alone separates elite athletes.", "D": "By claiming that practice has no measurable effect on performance."}, "correct": "B", "choice_families": {"C": "Tek metne dayanma", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 grants a role to talent but argues practice predicts performance better. Choice A gives the direction.", "why_wrong": {"C": "This restates Text 1's claim, not Text 2's response.", "D": "Text 2 credits practice heavily, so 'no effect' reverses its point.", "A": "Text 2 makes practice decisive, so agreeing talent is decisive reverses it."}}, {"id": "u2-l3-f2-10", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliski yonu ters", "passage": "Text 1: One nutritionist warns that skipping breakfast slows metabolism and leads to overeating later in the day.\n\nText 2: Controlled trials, another nutritionist notes, find no metabolic slowdown from skipping breakfast, and some participants ate less overall, not more.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?", "choices": {"A": "By confirming that breakfast-skippers overeat later in the day.", "B": "By agreeing that skipping breakfast slows metabolism.", "C": "By citing trials that contradict Text 1's warning about skipping breakfast.", "D": "By recommending that people eat five meals a day."}, "correct": "C", "choice_families": {"B": "Iliski yonu ters", "D": "Metin disi cikarim", "A": "Iliski yonu ters"}, "why_correct": "Text 2 cites trials finding no slowdown and sometimes less eating, contradicting Text 1. Choice A gives the direction.", "why_wrong": {"B": "Text 2 contradicts the slowdown claim, so agreeing reverses it.", "D": "Neither text recommends a five-meal schedule.", "A": "Text 2 found some ate less, so 'overeat later' reverses its finding."}}, {"id": "u2-l3-f3-01", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A scientist argues that dogs understand human pointing because domestication shaped them to read our gestures.\n\nText 2: Wolves raised by humans can learn to follow pointing too, a second scientist notes, which suggests the ability may owe as much to close contact as to domestication.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 restates Text 1's explanation in different words.", "B": "Text 2 completely refutes Text 1's claim that dogs read gestures.", "C": "Text 2 qualifies Text 1's explanation without rejecting the ability it describes.", "D": "Text 2 argues that dogs cannot understand pointing at all."}, "correct": "C", "choice_families": {"B": "Iliskiyi yanlis kurma", "D": "Iliski yonu ters", "A": "Iliskiyi yanlis kurma"}, "why_correct": "Text 2 accepts that the animals read pointing but qualifies the cause (contact, not only domestication). Choice A names that limited disagreement.", "why_wrong": {"B": "Text 2 refines the cause; it does not refute that dogs read gestures, so 'completely refutes' overstates the relationship.", "D": "Text 2 accepts the ability; 'cannot understand pointing' reverses it.", "A": "Text 2 offers a different cause, so it is not a restatement."}}, {"id": "u2-l3-f3-02", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A historian argues that the printing press caused the rapid spread of new ideas in Europe.\n\nText 2: The press mattered, a second historian agrees, but adds that without rising literacy the presses would have had few readers to reach.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 simply repeats Text 1's point about the press.", "B": "Text 2 flatly contradicts Text 1's claim about the press.", "C": "Text 2 argues that the press had no role in spreading ideas.", "D": "Text 2 agrees with Text 1 but adds a condition Text 1 leaves out."}, "correct": "D", "choice_families": {"B": "Iliskiyi yanlis kurma", "C": "Iliski yonu ters", "A": "Iliskiyi yanlis kurma"}, "why_correct": "Text 2 agrees the press mattered but adds literacy as a needed condition. Choice A names that agree-and-add relationship.", "why_wrong": {"B": "Text 2 agrees with Text 1, so 'flatly contradicts' mischaracterizes the relationship.", "C": "Text 2 grants the press a role, so 'no role' reverses it.", "A": "Text 2 adds a new factor, so it does not merely repeat Text 1."}}, {"id": "u2-l3-f3-03", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A critic argues that streaming has hurt music by pushing artists to write short, catchy openings that grab listeners in seconds.\n\nText 2: The same pressure, another critic suggests, has sharpened songwriting, forcing artists to cut filler and make every second count.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "The two texts draw opposite evaluations from the same observed pressure.", "B": "Text 2 fully agrees with Text 1 that streaming has hurt music.", "C": "Text 2 denies that streaming affects how songs are written.", "D": "Text 2 argues that streaming has no effect on artists at all."}, "correct": "A", "choice_families": {"B": "Iliskiyi yanlis kurma", "C": "Iliski yonu ters", "D": "Iliski yonu ters"}, "why_correct": "Both note the same pressure to grab listeners fast but judge it oppositely, harm versus sharpening. Choice A names that relationship.", "why_wrong": {"B": "Text 2 judges the pressure positively, so 'fully agrees' with the harm claim mischaracterizes it.", "C": "Text 2 accepts that streaming shapes songwriting; it disputes the evaluation, not the effect.", "D": "Text 2 describes a real effect, so 'no effect' reverses it."}}, {"id": "u2-l3-f3-04", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A biologist argues that a forest recovers fastest when left completely untouched after a fire.\n\nText 2: In many forests that is true, a second biologist allows, but where invasive plants move in first, some human intervention speeds recovery rather than slowing it.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 rejects Text 1's claim entirely.", "B": "Text 2 accepts Text 1's claim as a general rule but marks an exception to it.", "C": "Text 2 restates Text 1's claim without change.", "D": "Text 2 argues that forests never recover after fire."}, "correct": "B", "choice_families": {"C": "Iliskiyi yanlis kurma", "D": "Iliski yonu ters", "A": "Iliskiyi yanlis kurma"}, "why_correct": "Text 2 grants the general rule but notes an exception with invasive plants. Choice A names the rule-and-exception relationship.", "why_wrong": {"C": "Text 2 adds an exception, so it does not merely restate Text 1.", "D": "Text 2 discusses recovery, so 'never recover' reverses it.", "A": "Text 2 accepts the rule generally, so 'rejects entirely' overstates the disagreement."}}, {"id": "u2-l3-f3-05", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A researcher argues that bilingual children have a cognitive advantage in switching between tasks.\n\nText 2: A second researcher reports that when studies are combined, the advantage is small and does not appear in every group, though it is not absent.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 confirms Text 1's claim exactly as stated.", "B": "Text 2 shows that bilingual children have no advantage whatsoever.", "C": "Text 2 tempers the strength of Text 1's claim rather than overturning it.", "D": "Text 2 argues that bilingualism harms children's thinking."}, "correct": "C", "choice_families": {"B": "Iliskiyi yanlis kurma", "D": "Iliski yonu ters", "A": "Iliskiyi yanlis kurma"}, "why_correct": "Text 2 says the advantage is small and uneven but 'not absent,' tempering rather than overturning Text 1. Choice A fits.", "why_wrong": {"B": "Text 2 says the advantage is not absent, so 'no advantage whatsoever' misstates it.", "D": "Text 2 never argues bilingualism is harmful.", "A": "Text 2 weakens the claim, so it does not confirm it 'exactly.'"}}, {"id": "u2-l3-f3-06", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A scholar argues that a warm climate spurred the ancient city's growth by producing rich harvests.\n\nText 2: Climate helped, a second scholar agrees, but trade routes through the city, she argues, did more to drive its growth than harvests alone.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 argues that the city never actually grew.", "B": "Text 2 rejects the idea that climate mattered at all.", "C": "Text 2 agrees that harvests were the single main cause.", "D": "Text 2 accepts Text 1's factor but ranks a different one as more important."}, "correct": "D", "choice_families": {"B": "Iliski yonu ters", "C": "Iliskiyi yanlis kurma", "A": "Metin disi cikarim"}, "why_correct": "Text 2 grants climate a role but ranks trade above harvests. Choice A names that reprioritizing relationship.", "why_wrong": {"B": "Text 2 says climate helped, so 'mattered not at all' reverses it.", "C": "Text 2 puts trade above harvests, so agreeing harvests were the main cause mischaracterizes it.", "A": "Both texts assume the city grew."}}, {"id": "u2-l3-f3-07", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: A policy expert argues that free public transit would cut traffic by luring drivers out of their cars.\n\nText 2: Free transit mostly attracts people who already walked or biked, a second expert finds, so it fills buses without taking many cars off the road.", "stem": "Which choice best describes the relationship between Text 1 and Text 2?", "choices": {"A": "Text 2 questions the mechanism Text 1 relies on rather than the goal it shares.", "B": "Text 2 fully endorses Text 1's prediction about drivers.", "C": "Text 2 argues that reducing traffic is not worth pursuing.", "D": "Text 2 claims that free transit would have no riders."}, "correct": "A", "choice_families": {"B": "Iliski yonu ters", "C": "Metin disi cikarim", "D": "Iliski yonu ters"}, "why_correct": "Text 2 disputes the mechanism (that free transit pulls drivers from cars) while sharing the traffic goal. Choice A fits.", "why_wrong": {"B": "Text 2 disputes the prediction, so 'fully endorses' reverses it.", "C": "Text 2 does not argue the goal is not worth pursuing; it questions the method.", "D": "Text 2 says buses fill up, so 'no riders' contradicts it."}}, {"id": "u2-l3-f3-08", "unit": 2, "lesson": 3, "lesson_name": "Cross-Text Connections", "target_family": "Iliskiyi yanlis kurma", "passage": "Text 1: An educator argues that laptops in classrooms distract students and lower their grades.\n\nText 2: The harm depends on how laptops are used, a second educator argues; when tied to     ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabi kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Dogru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlis.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazinda durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn ghost" data-action="start">Tekrar calis</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();}});
