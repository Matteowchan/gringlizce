p{margin:0 0 12px}

.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}

.check .ci.on .ct{color:var(--muted);text-decoration:line-through}

{"id": "read-words-daily", "group": "Reading", "name": "Complete the Words & Daily Life", "eyebrow": "Reading", "blocks": [

  {"t": "table", "head": ["Complete the Words", "Read in Daily Life"], "rows": [["1. Önce tüm cümleyi bağlam için oku", "1. Metin tipini tanı (e-posta, duyuru, ilan)"], ["2. Verilen ve eksik harf sayısını say", "2. Gönderen-alıcı ilişkisini kur (ton belirler)"], ["3. Kelimeyi tahmin et, harf sayısıyla doğrula", "3. Önce soruyu oku, sonra metinde tarayarak bul"], ["4. Yazımı kontrol et (ie/ei, çift ünsüz, sessiz harf)", "4. Tonu yakala: kibar rica mı, kesin talep mi, bilgi mi"]]},
  {"t": "quiz", "ph": "eksik kelimeyi yaz", "items": [
    {"n": 1, "q": "The new policy was a_no_nced last week.", "ans": "announced", "why": "a_no_nced (9 harf). announced tam oturur. Bağlam: policy açıklandı.", "slug": "gri-mod-toefl-readwords-q1"},
    {"n": 2, "q": "The research showed _ig_if_cant improvements in student performance.", "ans": "significant", "why": "_ig_if_cant (11 harf). significant = anlamlı iyileşme.", "slug": "gri-mod-toefl-readwords-q2"},
    {"n": 3, "q": "Many universities have started to e_pl_re the use of AI in classrooms.", "ans": "explore", "why": "e_pl_re (7 harf), fiil gerekli. explore bağlama ve harf desenine uyar.", "slug": "gri-mod-toefl-readwords-q3"}
  ]},
  {"t": "mcqquiz", "items": [
    {"n": 1, "stem": "E-posta: \"Dear Professor Larson, I am writing to ask whether it might be possible to reschedule our group meeting from Thursday to Friday... I apologize for any inconvenience. Best, Maya\" — Maya neden yazıyor?", "choices": {"A": "Planlanan toplantıyı tamamen iptal ettirmek için", "B": "Kendi yoğun programından yakınıp şikayet etmek için", "C": "Toplantının başka bir güne alınmasını rica etmek için", "D": "Kendisine yeni bir zorunlu randevu ayarlatmak için"}, "ans": "C", "why": "\"reschedule ... from Thursday to Friday\" = erteleme ricası (iptal değil). Ton kibar; şikayet değil.", "slug": "gri-mod-toefl-readdaily-1"},
    {"n": 2, "stem": "Duyuru: \"Due to maintenance, the main reading room will be closed from October 14 to 18. Books can be borrowed from the second floor. Online resources remain available.\" — Ana amaç ne?", "choices": {"A": "Geçici ve kısmi bir kapanışı ve alternatifleri bildirmek", "B": "Kütüphanenin bütünüyle ve kalıcı olarak kapandığını duyurmak", "C": "Yeni çevrimiçi kaynakları kullanıcılara tanıtmak", "D": "Öğrencilerin ikinci kattan uzak durmasını istemek"}, "ans": "A", "why": "Tarih verilmiş (geçici), sadece 'main reading room' (kısmi), alternatifler sunulmuş.", "slug": "gri-mod-toefl-readdaily-2"}
  ]},
  {"t": "note", "k": "dikkat", "title": "En sık hatalar", "lines": ["Complete the Words: doğru kelimeyi bilip yanlış yazıp harf sayısını tutturamamak. Önce harf say.", "Daily Life: e-postayı hızlı geçip tarih/saat/isim gibi bir detayı kaçırmak. Pratik metinde yavaşla."]}
]},

{"id": "read-academic", "group": "Reading", "name": "Academic Passage", "eyebrow": "Reading", "blocks": [
  {"t": "p", "x": "~200 kelimelik yoğun akademik metin, passage başına 5 soru. Eski uzun passage'ların yerini aldı; Insert Text, Prose Summary ve Sentence Simplification artık yok. Beş soru tipi vardır, her birinin ayrı yöntemi var."},
  {"t": "table", "head": ["Soru tipi", "İpucu ifade", "Yöntem"], "rows": [["Detail", "According to the passage...", "Bilgiyi doğrudan metinden doğrula"], ["Vocabulary", "closest in meaning to...", "Kelimeyi cümledeki bağlama göre çöz"], ["Inference", "It can be inferred / suggests...", "Fikirleri birleştir; metne bağlı kal"], ["Main Idea", "What is the main idea...", "Ana fikri detaydan ayır"], ["Rhetorical Purpose", "Why does the author mention X?", "\"Bu örnek çıkarılsa ne kaybolur?\" diye sor"]]},
  {"t": "note", "k": "dikkat", "title": "Üç tuzak", "lines": ["Detail sorusunda dış bilgini kullanmak. TOEFL sadece metindeki cevabı ödüllendirir.", "Vocabulary'de ezber sözlük anlamını seçmek. Bağlam belirler.", "Inference'ı spekülasyona çevirmek. Çıkarım metindeki kanıta dayanmalı."]},
  {"t": "mcqquiz", "items": [
    {"n": 1, "stem": "\"...the Sumerians developed cuneiform script, initially used to record agricultural transactions.\" According to the passage, cuneiform ilk olarak ne için kullanıldı?", "choices": {"A": "Dini törenlerin düzenlenmesi için", "B": "Kraliyet ailesiyle iletişim kurmak için", "C": "Gelecekten haber veren kehanetler için", "D": "Tarımsal işlemlerin kaydedilmesi için"}, "ans": "D", "why": "\"initially used to record agricultural transactions\" doğrudan söyler. Diğerleri başka yazı sistemlerine ait tuzaklar.", "slug": "gri-mod-toefl-readacad-1"},
    {"n": 2, "stem": "Metin belleğin yeniden-inşa süreci olduğunu savunur, sonra Loftus'un çalışmasını anlatır. \"Why does the author mention the Loftus study?\"", "choices": {"A": "Tüm insan belleğinin baştan sona tamamen yanlış olduğunu kanıtlamak", "B": "Elizabeth Loftus'un çalışmasını açıkça eleştirmek", "C": "Belleğin yeniden-inşa görüşünü destekleyen somut kanıt sunmak", "D": "Alışveriş merkezleri hakkında yeni bir konu açmak"}, "ans": "C", "why": "\"A striking example of this...\" = ana iddiayı destekleyen kanıt. A abartı, B ton hatası.", "slug": "gri-mod-toefl-readacad-2"},
    {"n": 3, "stem": "Güneş paneli metni: fiyatlar %90 düştü, kömürden ucuz, kurulum artıyor. \"What can be inferred?\"", "choices": {"A": "Güneş enerjisi önümüzdeki on yıl içinde tüm fosil yakıtların yerini alacak", "B": "Maliyet düşüşü güneş enerjisinin yaygınlaşmasında büyük etkendi", "C": "Kömür artık her zamankinden çok daha pahalı hale geldi", "D": "Güneş paneli kurulum oranları giderek düşmektedir"}, "ans": "B", "why": "Fiyat düşüşü -> yaygınlaşma artışı, metinden mantıklı çıkarım. A aşırı-çıkarım, D metne aykırı.", "slug": "gri-mod-toefl-readacad-3"},
    {"n": 4, "stem": "\"The angle of the dance indicates the direction of the food source.\" — \"indicates\" bağlamda hangi anlama en yakın?", "choices": {"A": "shows", "B": "hides", "C": "changes", "D": "creates"}, "ans": "A", "why": "\"yönü gösterir/işaret eder\" = shows. Bağlam belirler.", "slug": "gri-mod-toefl-readacad-4"}
  ]}
]},

{"id": "listen-genel", "group": "Listening", "name": "Listening: 4 Görev ve Not Alma", "eyebrow": "Listening", "blocks": [
  {"t": "p", "x": "Ses bir kez çalınır; durdurma ve geri sarma yoktur. Yeni format kısa ama yoğun kayıtlar kullanır ve dört görev tipi içerir. Not alma zorunlu ve stratejiktir."},
  {"t": "table", "head": ["Görev", "Süre", "Soru"], "rows": [["Listen and Choose a Response", "~5 sn", "1 (uygun cevabı seç)"], ["Conversation", "30-60 sn, 2 kişi", "2"], ["Announcement", "40-85 kelime", "2-3"], ["Academic Talk", "60-90 sn, yoğun", "4"]]},
  {"t": "note", "k": "protokol", "title": "Not alma düzeni", "lines": ["Sadece anahtarı yaz: isim, sayı, tarih, sebep-sonuç işaretleri. Tam cümle yazma.", "Kısaltma kullan: w/ = with, b/c = because, -> = sebep olur, ^ = artış, v = azalış, therefore = :.", "Sayfayı üçe böl: sol ana fikir, orta detay/örnek, sağ işaretler/soru işaretleri."]},
  {"t": "note", "k": "dikkat", "title": "Üç tuzak", "lines": ["Aşırı not alıp bir sonraki cümleyi kaçırmak. Sadece anahtarı yaz.", "Dinlerken zihinde Türkçeye çevirmek hızını yarıya düşürür. İngilizceyi İngilizce anla.", "Tonu görmezden gelmek. Bazı sorular tutum/ima test eder; ironi ve vurguyu dinle."]},
  {"t": "mcqquiz", "items": [
    {"n": 1, "stem": "5 saniyelik bir kayıtta tek konuşmacı sana 'Could you tell me where the library is?' der ve bir cevap seçmen istenir. Bu hangi görevdir?", "choices": {"A": "Academic Talk (60-90 saniyelik yoğun akademik ders anlatımı)", "B": "Listen and Choose a Response (kısa ifadeye doğal cevap)", "C": "Announcement (tek konuşmacılı kampüs duyurusu)", "D": "Conversation (iki kişilik 30-60 sn'lik diyalog)"}, "ans": "B", "why": "5 sn'lik tek ifadeye en doğal cevabı seçme = Listen and Choose a Response.", "slug": "gri-mod-toefl-listgenel-1"},
    {"n": 2, "stem": "Academic Talk için en iyi not alma yaklaşımı?", "choices": {"A": "Duyduğun her kelimeyi tam cümle olarak yazmak", "B": "Hiç not almadan sadece dikkatlice dinlemek", "C": "Duyduğun her cümleyi zihninde Türkçeye çevirerek not almak", "D": "Anahtar kelime, sayı, sebep-sonuç ve kısaltma yazmak"}, "ans": "D", "why": "Stratejik anahtar-kelime notu kazanır; tam cümle sonraki bilgiyi kaçırtır.", "slug": "gri-mod-toefl-listgenel-2"},
    {"n": 3, "stem": "Ses tek çalınıyor ve bir kelimeyi kaçırdın. En doğru hamle nedir?", "choices": {"A": "Durup kaçırdığın kelimeyi düşünmeye çalışmak", "B": "Kaydın baştan tekrar çalınmasını beklemek", "C": "Bağlamdan tahmin edip dinlemeye devam etmek", "D": "O bölümün sorusunu tamamen boş bırakmak"}, "ans": "C", "why": "Tek çalım kuralı: durmak sonraki cümleyi de kaybettirir. Tahmin et, akışta kal.", "slug": "gri-mod-toefl-listgenel-3"}
  ]}
]},

{"id": "listen-mono", "group": "Listening", "name": "Announcement & Academic Talk", "eyebrow": "Listening", "blocks": [
  {"t": "p", "x": "İkisi de tek konuşmacılıdır. Announcement pratik bir duyurudur (tarih, saat, yer, yapılacak iş). Academic Talk yoğun bir mini derstir; her cümle test edilebilir."},
  {"t": "table", "head": ["Announcement", "Academic Talk"], "rows": [["40-85 kelime, ~30 sn", "60-90 sn"], ["Amaç: bilgilendirme (değişiklik, etkinlik)", "Amaç: kavram/süreç/görüş anlatımı"], ["2 soru (amaç + detay)", "4 soru (ana fikir + detay + amaç + organizasyon)"], ["Not: tarih, saat, oda, yapılacak iş", "Not: kavram, sebep-sonuç, örnek, zıtlık (but/however)"]]},
  {"t": "note", "k": "ipucu", "title": "Anahtar", "lines": ["Announcement'ta ana amaç genelde ilk cümlede: \"I want to remind you that...\".", "Academic Talk'ta \"For centuries... However, recent research...\" gibi zıtlık kalıbı yeni bulguya işaret eder; cevap çoğunlukla oradadır."]},
  {"t": "mcqquiz", "items": [
    {"n": 1, "stem": "\"...the deadline for the final paper has been moved from December 15 to December 18. This is due to a power outage. Please submit through Canvas...\" — Ana amaç?", "choices": {"A": "Ödev teslim tarihinin değiştiğini öğrencilere bildirmek", "B": "Yaklaşan elektrik kesintisi hakkında herkesi uyarmak", "C": "IT yardım masasına nasıl ulaşılacağını açıklamak", "D": "Ödevlerin Canvas üzerinden yüklenmesini zorunlu kılmak"}, "ans": "A", "why": "İlk cümle: \"deadline has been moved\" = ana amaç. Kesinti sebep, Canvas ise 'nasıl'.", "slug": "gri-mod-toefl-listmono-1"},
    {"n": 2, "stem": "\"For centuries, scientists believed the moon was geologically dead. However, recent missions indicate regular moonquakes...\" Profesör neden \"for centuries, scientists believed\" der?", "choices": {"A": "Ayın jeolojik olarak ölü olduğunu doğrulamak için", "B": "Eski dönem bilim insanlarını açıkça eleştirmek için", "C": "Apollo görevlerinin tam olarak nasıl yürütüldüğünü açıklamak için", "D": "Yeni bulgularla bir zıtlık kurup onları vurgulamak için"}, "ans": "D", "why": "\"For centuries... However...\" = eski görüşü kurup yeni kanıtla çürütme (rhetorical purpose).", "slug": "gri-mod-toefl-listmono-2"}
  ]}
]},

{"id": "listen-dialog", "group": "Listening", "name": "Choose a Response & Conversation", "eyebrow": "Listening", "blocks": [
  {"t": "p", "x": "Choose a Response: ~5 sn'lik bir ifade duyar, en doğal cevabı seçersin (pragmatik İngilizce, kibarlık, deyim). Conversation: 30-60 sn'lik kampüs diyaloğu; problem -> soru -> çözüm -> kabul akışı vardır, 2 soru sorulur."},
  {"t": "table", "head": ["Choose a Response", "Conversation"], "rows": [["~5 sn, tek konuşmacı sana hitap eder", "30-60 sn, iki kişi kampüste"], ["Doğal, konuşma dili cevabı seç", "Problemi ve çözümü yakala"], ["Test: pragmatik dil, deyim, kibarlık", "Test: sorunun çözümü, konuşmacı niyeti"]]},
  {"t": "note", "k": "ipucu", "title": "Anahtar", "lines": ["Choose a Response'ta soru: \"Doğal bir insan burada ne der?\" Çok resmi cevap yanlıştır.", "Conversation'da \"What will the student do next?\" sorusu genelde profesörün önerisi + öğrencinin \"I'll try that\" kabulüyle cevaplanır.", "Ses tekrarı bir tuzaktır: duyduğun kelimeyi içeren şık her zaman doğru değildir."]},
  {"t": "mcqquiz", "items": [
    {"n": 1, "stem": "Duyulan: \"I've been meaning to ask if you could help me with the assignment that's due tomorrow.\" En iyi cevap?", "choices": {"A": "Yes, the assignment is really quite difficult.", "B": "The deadline is tomorrow at twelve noon.", "C": "Sure, which part exactly are you stuck on?", "D": "I have been meaning to start studying too."}, "ans": "C", "why": "Kibar yardım ricası -> kabul + netleştirme. B duyulan kelimeyi tekrarlayan tuzak.", "slug": "gri-mod-toefl-listdialog-1"},
    {"n": 2, "stem": "Öğrenci kaynak bulamıyor; profesör \"try government reports or think-tank publications, Brookings has done work on this\" diyor, öğrenci \"I'll try those\" der. Öğrenci muhtemelen ne yapacak?", "choices": {"A": "Araştırma konusunu tamamen değiştirecek", "B": "Devlet raporlarına ve düşünce kuruluşu yayınlarına bakacak", "C": "Ödevi hiç kaynak kullanmadan teslim edecek", "D": "Aynı konuyu bölümdeki başka bir profesöre danışmaya gidecek"}, "ans": "B", "why": "Çözüm cümlesi + öğrencinin kabulü cevaptır. A/C/D önerilmedi.", "slug": "gri-mod-toefl-listdialog-2"}
  ]}
]},

{"id": "speak-genel", "group": "Speaking", "name": "Speaking: Kriterler ve IRT", "eyebrow": "Speaking", "blocks": [
  {"t": "p", "x": "Speaking iki yeni görevden oluşur: Listen and Repeat (7 cümle) ve Take an Interview (4 soru). Toplam ~8 dakika. Eski 4 görev (Independent + 3 Integrated) ve şablon ezberleme geçersiz. Cevaplar AI (SpeechRater) tarafından dört kriterle puanlanır."},
  {"t": "table", "head": ["Kriter", "Test edilen", "Öneri"], "rows": [["Fluency", "140-160 kelime/dk, doğal ritim, az duraksama", "Doğal akışta konuş"], ["Intelligibility", "Telaffuz, vurgu, ton", "Aksan sorun değil, anlaşılırlık önemli"], ["Language Use", "Kelime çeşitliliği, doğru gramer, karmaşık yapı", "Conditional, relative clause kullan"], ["Organization", "Mantıksal sıra, alaka, bağlaç", "IRT: Idea -> Reason -> Tie-in"]]},
  {"t": "note", "k": "protokol", "title": "IRT yapısı (45 sn)", "lines": ["Idea (~10 sn): görüşünü ilk cümlede net söyle.", "Reason (~15 sn): gerekçeni açıkla.", "Tie-in (~20 sn): somut bir örnek veya kişisel deneyimle bağla.", "Bağlaç kullan: for example, on top of that, another reason is, in my own experience."]},
  {"t": "note", "k": "dikkat", "title": "Üç tuzak", "lines": ["Eski Integrated şablonlarını kullanmak (kaldırıldı).", "Sessiz kalmak: hazırlık yok, 3 sn'den uzun sessizlik puan kaybı. Hata yaparsan durma, filler ile devam et.", "Aşırı resmi/akademik dil. Speaking yarı resmidir: \"also, this shows...\" daha doğal."]},
  {"t": "given", "title": "IRT model cevabı", "x": "Soru: Do you prefer studying alone or with a group?\n\nHonestly, I prefer studying alone. The main reason is that I focus much better without distractions, especially with complex material like statistics. For example, last semester I tried a study group but kept getting pulled into off-topic chats; when I switched back to studying alone, my grades improved noticeably."}
]},

{"id": "speak-repeat", "group": "Speaking", "name": "Listen and Repeat", "eyebrow": "Speaking", "blocks": [
  {"t": "p", "x": "Yeni bir görev. Bir cümleyi bir kez duyar, 8-12 saniye içinde aynen tekrarlarsın (paraphrase değil, tam tekrar). 7 cümle, basitten karmaşığa. Ekranda metin yoktur; işitsel hafıza, telaffuz ve hızı test eder."},
  {"t": "table", "head": ["Beceri", "Test", "Pratik"], "rows": [["İşitsel hafıza", "Cümleyi tam hatırlama", "Podcast cümlesini duraklat-tekrarla"], ["Telaffuz", "Anlaşılırlık", "Native dinle, ritmi taklit et"], ["Hız", "8-12 sn'de tamamlama", "Kronometreyle pratik"]]},
  {"t": "note", "k": "ipucu", "title": "Strateji", "lines": ["Cümleyi parçalara böl (chunking): [The seminar] [scheduled for Tuesday] [has been moved to] [Friday afternoon]. Zihinde birleştir.", "Article ve preposition'ları (the, a, in, on) atlama; cümlenin %20'sini oluşturur.", "Bir kelimeyi anlamasan bile cümleyi tamamla; fonetik olarak yakın söyle. Eksik cümle eksik puan."]},
  {"t": "note", "k": "dikkat", "title": "Tuzaklar", "lines": ["Bilinmeyen kelimeye takılıp gerisini unutmak.", "Cümleyi kendi kelimenle söylemek (bu görev tam tekrar ister).", "Her kelimeyi aşırı vurgulayıp süreden taşmak."]},
  {"t": "given", "title": "Örnek (basit ve karmaşık)", "x": "Basit: \"Please pick up your textbook from the library by Thursday.\" -> aynen tekrar, doğal hız.\n\nKarmaşık: \"The seminar that was originally scheduled for Tuesday has been moved to next Friday afternoon.\" -> parçala: konu (seminar) + değişiklik (moved) + yeni zaman (Friday afternoon)."}
]},

{"id": "speak-interview", "group": "Speaking", "name": "Take an Interview", "eyebrow": "Speaking", "blocks": [
  {"t": "p", "x": "Sanal bir mülakatçı aynı konu üzerine 4 soru sorar; her cevap 45 saniye, hazırlık yok. Sorular kişisel deneyimden soyut tartışmaya doğru ilerler. En etkili yapı IRT'dir (Idea + Reason + Tie-in)."},
  {"t": "table", "head": ["Soru", "Örnek", "Strateji"], "rows": [["1. Kişisel deneyim", "Tell me about a time you...", "Spesifik olay + ders"], ["2. Tercih + gerekçe", "Do you prefer X or Y? Why?", "Net tercih + sebep + örnek"], ["3. Genel değerlendirme", "What do people generally think...?", "Genel görüş + iki taraf + sonuç"], ["4. Soyut tartışma", "Will X continue? Avantaj/dezavantaj?", "Nüanslı görüş + koşul + kanıt"]]},
  {"t": "task", "title": "Örnek soru", "lines": ["Tell me about a class you took recently that you really enjoyed. What made it memorable?"]},
  {"t": "given", "title": "Model cevap (kişisel + soyut)", "x": "Kişisel: The class that stood out for me was Introduction to Psychology. What made it memorable was how the professor combined theory with real examples: for cognitive biases, we analysed real advertisements. I still spot those biases in everyday life.\n\nSoyut: I don't think online education will fully replace classrooms, but the two will blend. Online works for theory-heavy subjects, but labs and studio arts need physical presence. In my experience, in-person discussions taught me as much as the material. So I see a hybrid future, not a replacement."},
  {"t": "checklist", "title": "Cevabımı kontrol et", "items": ["İlk cümlede net görüş verdim.", "Bir gerekçe ekledim.", "Somut bir örnek/deneyimle bağladım (~20 sn).", "45 saniyeyi doldurdum, erken bitirmedim.", "Konu içinde kaldım, önceki cevapla çelişmedim."]}
]},

{"id": "write-genel", "group": "Writing", "name": "Writing: 3 Görev ve Build a Sentence", "eyebrow": "Writing", "blocks": [
  {"t": "p", "x": "Writing üç kısa, pratik görevden oluşur; toplam 23 dakika. Eski 300 kelimelik Independent essay ve Integrated synthesis kaldırıldı. Ezber essay şablonları geçersiz."},
  {"t": "table", "head": ["Görev", "Süre", "Kelime / yapı"], "rows": [["Build a Sentence", "~6 dk", "10 cümle, kelimeleri doğru sırala"], ["Write an Email", "7 dk", "80-120 kelime, 3 maddeyi cevapla"], ["Academic Discussion", "10 dk", "100-150 kelime, tartışmaya katıl"]]},
  {"t": "note", "k": "ipucu", "title": "Build a Sentence yöntemi", "lines": ["Önce iskeleti bul: özne + fiil + nesne. Article ve preposition'ları en son ekle.", "Örnek: students / library / the / quiet / find / very -> \"Students find the library very quiet.\""]},
  {"t": "quiz", "ph": "kelimeleri doğru sırala", "items": [
    {"n": 1, "q": "weather / good / the / today / is / very", "ans": "The weather is very good today.", "alt": ["the weather is very good today"], "why": "Özne (The weather) + fiil (is) + niteleyici (very good) + zaman (today).", "slug": "gri-mod-toefl-writegenel-q1"},
    {"n": 2, "q": "museum / closed / will / on / be / Sundays / the", "ans": "The museum will be closed on Sundays.", "alt": ["the museum will be closed on sundays"], "why": "Özne + will be + sıfat (closed) + zaman (on Sundays).", "slug": "gri-mod-toefl-writegenel-q2"}
  ]},

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz"${b.wt?` data-wt="${esc(b.wt)}"`:''}>`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types, wt){
  // TOEFL modulu: wizard'in data-wt'sine gore toefl text_type sec (email / academic_discussion)
  const av=types.filter(t=>String(t.exam||'').toLowerCase()==='toefl'&&!t.is_coming_soon&&t.is_active!==false);
  let m=null;
  if(wt)m=av.find(t=>String(t.text_type||'').toLowerCase()===String(wt).toLowerCase());
  return m||av[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  if(q.n>=2){fb.className='grifb on err';fb.textContent='Bugünlük Gri değerlendirme hakkın doldu (2/2). Yarın tekrar dene.';return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types, wz.dataset.wt);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
