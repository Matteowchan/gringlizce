die Neugier, Freundlichkeit und Anstrengung ebenso schätzt wie Noten. Würden unsere Schüler wirklich weniger lernen? Oder endlich lernen, das Lernen zu lieben?\n\nWir können das System nicht über Nacht ändern. Aber wir können die Geschichte ändern, die wir erzählen: Du bist viel mehr als deine Noten."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Kommentar NET bir taraf tutar.", "Karşı görüşü hiç anmamak. Ona değinip çürütmek yazını olgunlaştırır.", "Sadece duyguya yaslanmak. Duygu + gerekçe + örnek birlikte ikna eder."]}]}, {"id": "t-interview", "group": "Kitle İletişim", "name": "Interview (Röportaj)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kişiden bilgi/görüş almak ve okura aktarmak."], ["Kitle", "Bir dergi/gazete/site okuru."], ["Register / Ton", "Yarı resmi. Sorular net; cevaplar doğal, konuşma dilinde."], ["Yapı", "Kişiyi tanıtan kısa Einleitung, ardından Frage-Antwort dizisi, kısa kapanış."], ["Tipik özellikler", "Röportajcı ve konuşan belirtilir, doğrudan konuşma, konu odaklı sorular."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Röportaj yapılan kişiyi ve konuyu kısa bir girişle tanıt.", "2. Sorular konuya odaklansın; açık uçlu (Was/Warum/Wie).", "3. Frage-Antwort biçimini kur: 'Interviewer:' / 'Name:'.", "4. Cevapları doğal, konuşma dilinde yaz.", "5. Bir soru bir öncekinden doğsun (akış).", "6. Kısa bir kapanışla bitir.", "7. Son kontrol: tanıtım + net sorular + doğal cevaplar + Frage-Antwort biçimi var mı?"]}, {"t": "given", "title": "Birinci örnek (biyolog)", "x": "Wir haben mit Dr. Elif Kaya, einer Meeresbiologin, über das Plastik in unseren Ozeanen gesprochen.\n\nInterviewer: Was hat Sie zuerst zum Meer gebracht?\nDr. Kaya: Ehrlich gesagt ein Urlaub als Kind. Ich fand eine Schildkröte in einem Netz und habe das nie vergessen."}, {"t": "given", "title": "İkinci örnek (kısa, farklı kişi)", "x": "Diese Woche sprachen wir mit Selin Arslan, der Kapitänin des Basketballteams, über Führung.\n\nInterviewer: Was macht eine gute Kapitänin aus?\nSelin: Ehrlich, nicht die beste Spielerin zu sein. Es geht darum, die Person zu bemerken, die kämpft, und sie aufzubauen.\n\nInterviewer: Was ist am schwersten?\nSelin: Verlieren. Ein Gewinnerteam kann jeder führen. Leute nach einer Niederlage zusammenzuhalten, das ist der echte Test."}, {"t": "h", "x": "Derinlemesine: Interview (röportaj) ustalığı"}, {"t": "p", "x": "Interview, bir kişiyle yapılan soru-cevap biçimindeki metindir; genellikle bir dergi ya da gazete için, ilginç ya da uzman bir kişinin görüşlerini okura aktarmak amacıyla yazılır. Bu türün ruhu 'diyalog'dur: metin, bir soranın (Interviewer) ve bir yanıtlayanın (Befragte/r) değişimli konuşmasından oluşur. Bu yüzden Interview'in en görünür özelliği biçimidir - her konuşmacının adı ya da rolü belirtilir ve sorular ile cevaplar açıkça ayrılır. IB Deutsch B'de bu tür, öğrencinin doğru soru biçimleri kurma (W-Fragen ve evet/hayır soruları), tutarlı bir hitap (Sie ya da du) koruma ve bir konuşmayı doğal biçimde akıtma becerisini sınar."}, {"t": "p", "x": "Kriterler açısından Interview biçimsel bir türdür. Criterion C (Konzeptverständnis) şunları arar: soru-cevap biçiminin görünürlüğü (konuşmacı etiketleri), kısa bir giriş (kim, hangi konuda), tutarlı bir register (çoğunlukla saygılı 'Sie') ve doğal bir kapanış (teşekkür). Criterion B (Botschaft) soruların konuyu gerçekten açıp açmadığına ve cevapların bilgi verip vermediğine bakar - yüzeysel, tek kelimelik değişimler değil, gelişen bir sohbet beklenir. Criterion A (Sprache) ise soru yapılarının doğruluğunu ölçer: W-sorularında ve evet/hayır sorularında fiil dizilişi bu türün en kritik dilbilgisi noktasıdır."}, {"t": "p", "x": "İskelet şöyledir: kısa bir tanıtım cümlesi (kiminle, ne hakkında konuşulduğunu belirtir); ardından değişimli sorular ve cevaplar; her soru bir öncekini geliştirir (takip soruları önemlidir); ve sonda bir teşekkürle kapanış ('Vielen Dank für das Gespräch'). İyi bir röportajın sırrı, soruların birbirine bağlanmasıdır: yanıtlayanın söylediği bir şeye dayanarak yeni bir soru sorarsın ('Sie haben gerade ... erwähnt - was meinen Sie damit genau?'). Bu, gerçek bir sohbet izlenimi verir. Sorular çeşitli olmalı: hem açık W-soruları (Warum? Wie?) hem de zaman zaman evet/hayır soruları. Uzunluk: SL 250-400, HL 450-600 kelime."}, {"t": "p", "x": "Bu türün dilbilgisel kalbi soru yapısıdır ve iki tür soruyu doğru kurmak şarttır. Birincisi W-soruları: soru kelimesiyle başlar (Wer, Was, Wann, Wo, Warum, Wie, Welche), hemen ardından çekimli fiil (2. konumda), sonra özne gelir: 'Wie sind Sie auf diese Idee gekommen?', 'Warum ist Ihnen dieses Thema so wichtig?'. İkincisi evet/hayır soruları: çekimli fiil en başta (1. konumda) gelir: 'Haben Sie das erwartet?', 'Würden Sie es wieder tun?'. Hitap tutarlılığı da kritiktir: resmî bir röportajda baştan sona 'Sie' kullanılır (Sie haben, Ihnen, Ihre)."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Einleitung", "Kim, ne konuda", "Heute sprechen wir mit Frau Yıldız, einer jungen Klimaaktivistin, über ihr neues Projekt."], ["W-Frage", "Konuyu açar", "Wie sind Sie zu diesem Engagement gekommen?"], ["Antwort", "Bilgi verir", "Angefangen hat alles mit einer kleinen Aktion in unserer Schule."], ["Nachfrage", "Derinleştirir", "Und was war dabei die größte Herausforderung?"], ["Schluss", "Kapatır", "Vielen Dank für das offene Gespräch und viel Erfolg weiterhin!"]]}, {"t": "note", "k": "ipucu", "title": "Röportajı canlı kılan teknikler", "lines": ["Soruları bağla: cevaba dayanarak yeni soru sor ('Sie haben ... erwähnt - wie meinen Sie das?').", "Soru türlerini çeşitlendir: açık W-soruları + arada bir evet/hayır sorusu.", "Konuşmacı etiketlerini net tut: Interviewer / Frau Yıldız (ya da G. için Gast).", "Kısa giriş ve teşekkürle çerçeveleme yap - biçim tür işaretidir."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Giriş", "Heute spreche ich mit ... über ..."], ["Açılış sorusu", "Wie sind Sie auf diese Idee gekommen?"], ["Neden sorusu", "Warum ist Ihnen das so wichtig?"], ["Takip sorusu", "Und was hat Sie dabei am meisten überrascht?"], ["Evet/hayır sorusu", "Würden Sie es wieder so machen?"], ["Geleceğe dair", "Was sind Ihre nächsten Pläne?"], ["Tavsiye sorusu", "Was würden Sie jungen Leuten raten?"], ["Kapanış", "Vielen Dank für das Gespräch!"]]}, {"t": "p", "x": "Soru kurmayı otomatikleştirmek Interview'de en çok işine yarayacak beceridir. W-sorusunda sıralama sabittir: soru kelimesi + çekimli fiil + özne (+ diğerleri): 'Wann haben Sie angefangen?', 'Welche Rolle spielt dabei die Schule?'. Evet/hayır sorusunda çekimli fiil öne geçer: 'Haben Sie Unterstützung bekommen?'. Bileşik zamanlarda (Perfekt) ve modal fiillerde ikinci fiil parçası (Partizip ya da Infinitiv) cümlenin sonuna gider: 'Wie haben Sie das geschafft?', 'Was möchten Sie damit erreichen?'. Bu dizilişleri sağlam kurmak, röportajını hem doğal hem gramer açısından kusursuz yapar."}, {"t": "note", "k": "ipucu", "title": "Soru yapıları: W-Fragen ve Ja/Nein-Fragen", "lines": ["W-Frage: soru kelimesi + fiil (2. konum) + özne. 'Warum haben Sie das getan?'", "Ja/Nein-Frage: fiil en başta (1. konum). 'Haben Sie das erwartet?'", "Perfekt/modal: ikinci fiil sonda. 'Wie haben Sie das erreicht?', 'Was wollen Sie ändern?'", "Hitap tutarlılığı: resmî röportajda baştan sona 'Sie' (Sie haben, Ihnen, Ihre).", "Konuşmacı etiketi her replikte: okur kimin konuştuğunu anında görmeli."]}, {"t": "given", "title": "Çözümlü mini-model: soru-cevap akışı", "x": "Interviewer: Frau Yıldız, wie sind Sie überhaupt zum Umweltschutz gekommen?\n\nFrau Yıldız: Ehrlich gesagt eher zufällig. Angefangen hat alles mit einer kleinen Müllsammelaktion in unserer Schule.\n\nInterviewer: Und was war dabei die größte Herausforderung?\n\nFrau Yıldız: Am Anfang haben viele nur zugeschaut. Die Leute wirklich zum Mitmachen zu bewegen, das war nicht leicht.\n\nInterviewer: Würden Sie es trotzdem wieder tun?\n\nFrau Yıldız: Auf jeden Fall. Es hat sich jede Minute gelohnt."}, {"t": "p", "x": "Bu değişim neden örnek? Her replik konuşmacı etiketiyle açık: okur kimin konuştuğunu anında görüyor. Sorular çeşitli ve bağlı: ilk soru bir W-sorusu ('wie sind Sie ... gekommen?' - soru kelimesi + fiil + özne, Perfekt Partizip 'gekommen' sonda), ikincisi bir takip sorusu ('was war dabei die größte Herausforderung?'), üçüncüsü bir evet/hayır sorusu ('Würden Sie es ... wieder tun?' - fiil en başta). Cevaplar bilgi veriyor ve doğal akıyor. Register baştan sona tutarlı 'Sie'. Kısa ve canlı ama gramer açısından kusursuz - iyi bir röportaj tam da bu dengeyi tutar."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["W-Frage dizilişi: 'Wie Sie haben angefangen?' YANLIŞ -> 'Wie haben Sie angefangen?' DOĞRU.", "Ja/Nein-Frage: 'Sie haben das erwartet?' (bildirim gibi) -> 'Haben Sie das erwartet?' DOĞRU.", "Perfekt dizilişi: 'Was haben Sie gemacht dabei?' zayıf -> 'Was haben Sie dabei gemacht?' DOĞRU (Partizip sonda).", "Hitap karışması: 'Wie sind Sie ...? Und was hast du ...?' YANLIŞ -> tek hitabı tut (Sie) DOĞRU.", "Konuşmacı etiketi eksik: kim konuşuyor belirsizse YANLIŞ -> her repliği etiketle DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Interview görevini gördüğünde önce kiminle, hangi konuda konuşulduğunu belirle ve kısa bir tanıtım cümlesi kur ('Heute spreche ich mit ... über ...'). Sonra soru-cevap biçimini görünür kıl: her repliği konuşmacı etiketiyle ayır (Interviewer / Frau Yıldız), böylece okur kimin konuştuğunu anında görür. Soruları önceden kabaca planla ve birbirine bağla: yanıtlayanın söylediği bir şeye dayanarak yeni soru sor ('Sie haben gerade ... erwähnt - was meinen Sie damit?'). Bu, gerçek bir sohbet izlenimi verir. Bu türde en çok puanı iki yerde kaybedersin. Birincisi soru dizilişi - bu türün en kritik dilbilgisi noktası: W-sorusunda soru kelimesi + fiil (2. konum) + özne gelir ('Wie sind Sie darauf gekommen?'), evet/hayır sorusunda ise fiil en başta gelir ('Haben Sie das erwartet?'); bileşik zamanlarda ikinci fiil sonda kalır ('Wie haben Sie das erreicht?'). İkincisi hitap tutarlılığı: resmî bir röportajda baştan sona 'Sie' kullan, yarı yolda 'du'ya kayma. Soruları çeşitlendir (açık W-soruları + arada evet/hayır) ve cevapların bilgi vermesini sağla - yüzeysel, tek kelimelik değişimlerden kaçın. Son bir dakikada denetle: kısa bir giriş ve teşekkürle çerçeveleme var mı, her replik etiketli mi, soru dizilişleri doğru mu, hitap tutarlı mı? Değerlendirici bu türde doğru soru biçimlerini ve gelişen bir sohbeti arar; sen de soruları doğru kurup birbirine bağlayarak hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "interview", "ai": false, "ptitle": "Görev", "prompt": "Führe für die Schülerzeitung ein Interview mit einer inspirierenden Person (Lehrer, Sportler, Freiwillige). Schreib eine kurze Einleitung und dann im Frage-Antwort-Format.", "target": 250, "check": ["Kısa bir Einleitung yazdım, sonra Frage-Antwort biçimini kullandım.", "Sorular net; cevaplar doğal ve konuşma dilinde (Criterion C).", "Konuya odaklı, Aufgabe'nin istediğini işledim (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Interview)", "x": "Jede Schule hat einen stillen Helden. Unserer ist Herr Demir, der Hausmeister, der seit zwölf Jahren unser Recyclingprojekt leitet. Wir fragten ihn, warum.\n\nInterviewer: Die meisten gehen achtlos an den Tonnen vorbei. Warum ist es Ihnen so wichtig?\nHerr Demir: Weil es jemand tun muss. Am Anfang warfen wir alles weg. Jetzt trennen die Schüler ihren Müll. Das ist eine kleine Revolution.\n\nInterviewer: War es schwer, Gewohnheiten zu ändern?\nHerr Demir: Sehr. Zwei Jahre hörte niemand zu. Ich machte einfach weiter, eine Tonne nach der anderen.\n\nInterviewer: Was würden Sie einem Schüler sagen?\nHerr Demir: Warte nicht, bis du wichtig bist, um etwas Nützliches zu tun. Fang heute an."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Konuşanların isimlerini her replikte belirtmemek (Interviewer: / Name:).", "Cevapları resmi deneme diline kaçırmak. Röportaj konuşma dilindedir.", "Kapalı uçlu sorular. Açık uçlu sorular (Warum/Wie) daha iyi cevap getirir."]}]}, {"id": "t-nachricht", "group": "Kitle İletişim", "name": "Nachrichtenbericht (Haber)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel ve doğru biçimde haber vermek."], ["Kitle", "Gazete/haber sitesi okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Schlagzeile (başlık), ilk cümlede W-Fragen (wer/was/wann/wo), önemliden az önemliye, alıntılar."], ["Tipik özellikler", "Schlagzeile, geçmiş zaman, alıntılar (sagte), nesnel dil, isim/tarih/yer."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kısa, bilgilendirici bir Schlagzeile yaz.", "2. İlk cümlede W-Fragen'i ver: wer, was, wann, wo.", "3. Önemliden az önemliye doğru sırala (ters piramit).", "4. Nesnel, üçüncü şahıs ve geçmiş zaman kullan.", "5. En az bir doğrudan alıntı ekle (sagte/fügte hinzu).", "6. Kendi görüşünü katma; görüşler yalnızca alıntılarda.", "7. Son kontrol: Schlagzeile + W-Fragen + nesnellik + alıntı var mı?"]}, {"t": "given", "title": "Birinci örnek (bağış)", "x": "Schüler sammeln Rekordsumme für Tierheim\n\nSchülerinnen und Schüler der Grünen-Tal-Schule sammelten am vergangenen Samstag über 5.000 Lira für ein Tierheim, wie die Organisatoren am Montag bestätigten."}, {"t": "given", "title": "İkinci örnek (kısa, farklı olay)", "x": "Schultheater gewinnt Regionalpreis\n\nDie Aufführung 'Die lange Nacht' der Grünen-Tal-Schule gewann am Freitag den ersten Preis beim regionalen Theaterfestival und setzte sich gegen zwölf andere Schulen durch. Die dreißig Schüler hatten vier Monate lang geprobt.\n\n'Ich bin unglaublich stolz auf sie', sagte Theaterlehrerin Frau Aydin. Die Schule vertritt die Region nun beim Landesfinale im Juni."}, {"t": "h", "x": "Derinlemesine: Nachrichtenbericht (haber) ustalığı"}, {"t": "p", "x": "Nachrichtenbericht, bir olayı nesnel ve bilgilendirici biçimde aktaran haber metnidir. Bu türün ruhu 'tarafsızlık ve olgu'dur: burada senin görüşün yoktur, yalnızca ne olduğu, kime, nerede, ne zaman ve neden olduğu vardır. Bir Kommentar taraf tutarken, bir Nachricht yalnızca aktarır. Bu yüzden haber üçüncü şahısla yazılır, duygudan ve 'ich'ten kaçınır, ve bilgiyi genellikle en önemliden en az önemliye doğru sıralar (ters piramit). IB Deutsch B'de bu tür, öğrencinin nesnel bir register tutturma, olayı beş temel soruya (W-Fragen) göre düzenleme ve dolaylı anlatım (indirekte Rede) kurma becerisini sınar."}, {"t": "p", "x": "Kriterler açısından Nachricht disiplinli bir türdür. Criterion C (Konzeptverständnis) şunları arar: bir Schlagzeile (başlık), olayı özetleyen bilgilendirici bir giriş (Aufmacher) ve baştan sona nesnel, kişisiz bir ton. Duygusal ya da görüş bildiren bir dil anında C notunu düşürür. Criterion B (Botschaft) temel soruların (Wer? Was? Wann? Wo? Warum? Wie?) yanıtlanıp yanıtlanmadığına ve bilginin mantıklı sıralanıp sıralanmadığına bakar. Criterion A (Sprache) ise geçmiş zamanı (çoğunlukla Präteritum), edilgen çatıyı ve - ileri düzeyde - dolaylı anlatım için Konjunktiv I'i doğru kullanıp kullanmadığını ölçer."}, {"t": "p", "x": "İskelet ters piramittir: en üstte bir Schlagzeile; ilk paragrafta (Aufmacher) olayın özü - beş W-sorusunun cevabı tek-iki cümlede; sonraki paragraflarda ayrıntılar, arka plan ve tanık/yetkili açıklamaları; en sonda ise daha az önemli bilgiler. Bu yapının mantığı şudur: okur ilk cümleyi okuyup bile olayın ne olduğunu anlamalıdır. 'Am vergangenen Samstag fand an unserer Schule ein großer Umwelttag statt, an dem über 200 Schüler teilnahmen' cümlesi tek başına ne, ne zaman, nerede ve kim sorularını yanıtlar. Kaynak belirtmek de nesnelliğin parçasıdır: 'Nach Angaben der Schulleitung ...', 'Wie Augenzeugen berichteten ...'. Uzunluk: SL 250-400, HL 450-600 kelime."}, {"t": "p", "x": "Bu türün dilbilgisel imzası geçmiş zaman, edilgen çatı ve dolaylı anlatımdır. Olaylar genellikle Präteritum ile aktarılır, çünkü bu zaman yazılı haber diline daha uygundur: 'Die Veranstaltung fand statt', 'Viele Schüler nahmen teil', 'Die Aktion begann um zehn Uhr'. Edilgen çatı, eylemi yapanı geri plana atarak nesnelliği güçlendirir: 'Es wurden über hundert Bäume gepflanzt'. İleri düzeyde, birinin söylediğini aktarırken dolaylı anlatım (indirekte Rede) Konjunktiv I ile kurulur: 'Die Direktorin erklärte, die Schule WERDE das Projekt fortsetzen' ya da 'Er sagte, er SEI zufrieden'. Bu, haberin söylenenden bir mesafe koyduğunu gösterir - profesyonel gazetecilik dili budur."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Schlagzeile", "Olayı özetler", "Großer Erfolg beim Umwelttag der Schule"], ["Aufmacher (5 W)", "Özü verir", "Am Samstag fand an der Goethe-Schule ein Umwelttag statt, an dem über 200 Schüler teilnahmen."], ["Details", "Ayrıntı ve arka plan", "Im Laufe des Tages wurden Bäume gepflanzt und der Schulgarten neu gestaltet."], ["Zitat (indirekt)", "Kaynak aktarır", "Die Direktorin erklärte, die Aktion sei ein voller Erfolg gewesen."], ["Abschluss", "Daha az önemli bilgi", "Eine Wiederholung im nächsten Jahr ist bereits geplant."]]}, {"t": "note", "k": "ipucu", "title": "Haberi profesyonel yapan alışkanlıklar", "lines": ["İlk cümlede özü ver: Wer? Was? Wann? Wo? tek-iki cümlede yanıtlansın.", "Nesnel kal: 'ich' ve görüş yok; olgular ve kaynaklar konuşur.", "Kaynak belirt: 'Nach Angaben der Polizei ...', 'Wie die Schulleitung mitteilte ...'.", "Präteritum kullan: yazılı haber dili genellikle bu zamanı tercih eder."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Olay açma (Aufmacher)", "Am vergangenen Montag ereignete sich ..."], ["Zaman/yer", "Am Samstagnachmittag fand in der Aula ... statt."], ["Kaynak belirtme", "Nach Angaben der Schulleitung ..."], ["Tanık", "Wie Augenzeugen berichteten, ..."], ["Dolaylı anlatım", "Der Bürgermeister erklärte, die Stadt werde das Projekt unterstützen."], ["Edilgen bilgi", "Insgesamt wurden über hundert Bäume gepflanzt."], ["Arka plan", "Bereits im letzten Jahr hatte es eine ähnliche Aktion gegeben."], ["Kapanış/plan", "Eine Fortsetzung ist für das kommende Jahr geplant."]]}, {"t": "p", "x": "Nesnel geçmiş anlatımı ve dolaylı aktarımı doğru kurmak haberin özüdür. Präteritum'da sık fiiller: 'fand statt' (stattfinden), 'nahm teil' (teilnehmen), 'begann' (beginnen), 'gab' (geben). Edilgen geçmiş: 'wurde/wurden + Partizip II' - 'Es wurden Bäume gepflanzt'. Dolaylı anlatımda Konjunktiv I, çoğunlukla üçüncü tekilde kullanılır: 'er sei' (sein), 'er habe' (haben), 'er werde' (werden), 'er komme' (kommen). Konjunktiv I biçimi düzensiz göründüğünde (örneğin çoğulda etken biçimle karışırsa) Konjunktiv II'ye geçilir: 'sie hätten' gibi. Bu araçları kullanmak, haberini olgun ve profesyonel bir gazete diline yaklaştırır."}, {"t": "note", "k": "ipucu", "title": "Präteritum, Passiv ve indirekte Rede", "lines": ["Präteritum: 'Die Veranstaltung fand statt.', 'Viele Schüler nahmen teil.'", "Passiv (geçmiş): 'Es wurden über hundert Bäume gepflanzt.'", "İndirekt aktarım Konjunktiv I: 'Er sagte, er sei zufrieden.', 'Sie erklärte, die Schule werde weitermachen.'", "Üçüncü şahıs, 'ich' yok: haber aktarır, katılmaz.", "Kaynak zorunlu: her önemli iddia bir kaynağa bağlansın (Nach Angaben von ...)."]}, {"t": "given", "title": "Çözümlü mini-model: haber girişi", "x": "Großer Erfolg beim ersten Umwelttag der Goethe-Schule\n\nAm vergangenen Samstag fand an der Goethe-Schule zum ersten Mal ein Umwelttag statt, an dem sich über 200 Schülerinnen und Schüler beteiligten. Im Laufe des Vormittags wurden im Schulgarten mehr als hundert Bäume und Sträucher gepflanzt. Die Schulleiterin, Frau Weber, erklärte, die Aktion sei ein voller Erfolg gewesen und werde im nächsten Jahr wiederholt."}, {"t": "p", "x": "Bu giriş neden örnek? Schlagzeile olayı özetliyor. İlk cümle (Aufmacher) tek başına dört soruyu yanıtlıyor: Wann (Am vergangenen Samstag), Wo (an der Goethe-Schule), Was (ein Umwelttag), Wer (über 200 Schülerinnen und Schüler) - ve fiil Präteritum'da: 'fand ... statt'. İkinci cümle edilgen geçmiş: 'wurden ... gepflanzt' - nesnel, eylemi yapanı öne çıkarmıyor. Üçüncü cümle dolaylı anlatım: 'erklärte, die Aktion sei ... gewesen und werde ... wiederholt' - Konjunktiv I biçimleri (sei, werde) haberin söylenenden mesafe koyduğunu gösteriyor. Hiçbir yerde 'ich' ya da görüş yok; olgular, edilgen ve kaynak konuşuyor. Profesyonel haber dili tam da böyledir."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Öznellik: 'Ich finde, der Tag war toll.' YANLIŞ -> 'Nach Angaben der Schulleitung war der Tag ein Erfolg.' DOĞRU.", "İndirekt aktarım: 'Er sagte, dass er ist zufrieden.' YANLIŞ -> 'Er sagte, er sei zufrieden.' DOĞRU (Konjunktiv I).", "Ayrılabilen fiil Präteritum: 'Die Veranstaltung stattfand.' YANLIŞ -> 'Die Veranstaltung fand statt.' DOĞRU.", "Beş W eksik: olayı özetlemeyen giriş zayıf -> ilk cümlede Wer/Was/Wann/Wo ver DOĞRU.", "Kaynaksız iddia: 'Alle waren begeistert.' zayıf -> 'Wie die Schulleitung mitteilte, ...' ile kaynak ver DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Nachrichtenbericht görevini gördüğünde önce olayın beş temel sorusunu (Wer? Was? Wann? Wo? Warum/Wie?) kafanda yanıtla, çünkü haberin ilk paragrafı (Aufmacher) bunları özetlemek zorundadır. Bir Schlagzeile (başlık) yaz, ardından ilk cümlede olayın özünü ver - okur yalnız o cümleyi okusa bile ne olduğunu anlamalı ('Am Samstag fand an der Goethe-Schule ein Umwelttag statt, an dem über 200 Schüler teilnahmen'). Bilgiyi ters piramitle sırala: en önemliden en az önemliye. Bu türde en çok puanı iki yerde kaybedersin. Birincisi öznellik: 'ich' ve görüş yasak; haber aktarır, katılmaz. Bunun yerine olguları, edilgen çatıyı ('Es wurden ... gepflanzt') ve kaynakları ('Nach Angaben der Schulleitung ...') konuştur. İkincisi zaman ve dolaylı anlatım: olaylar çoğunlukla Präteritum ile verilir ('fand statt', 'nahm teil', 'begann'); birinin söylediğini aktarırken ileri düzeyde dolaylı anlatım (indirekte Rede) Konjunktiv I ile kurulur ('Die Direktorin erklärte, die Aktion sei ein Erfolg gewesen und werde wiederholt'). Bu, haberin söylenenden mesafe koyduğunu gösterir. Her önemli iddiayı bir kaynağa bağla. Son bir dakikada denetle: Schlagzeile ve 5W içeren bir Aufmacher var mı, dil baştan sona nesnel mi, geçmiş anlatım Präteritum mü, aktarımlar Konjunktiv I ile mi kurulu? Değerlendirici bu türde tarafsız, olgusal ve düzenli bir haber dili arar; sen de beş W'yi öne koyup nesnelliği edilgen ve dolaylı anlatımla kurarak hem Botschaft hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "nachricht", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Nachrichtenbericht über eine Veranstaltung an deiner Schule (ein Wettbewerb, eine Aufführung, eine Spendenaktion). Verwende eine Schlagzeile und die umgekehrte Pyramide, und füge mindestens ein Zitat ein.", "target": 250, "check": ["Bir Schlagzeile yazdım ve ilk cümlede wer/was/wann/wo verdim.", "Nesnel, tarafsız, üçüncü şahıs dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı işledim (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Nachrichtenbericht)", "x": "Schüler sammeln Rekordsumme für Tierheim\n\nSchülerinnen und Schüler der Grünen-Tal-Schule sammelten am vergangenen Samstag mehr als 5.000 Lira für ein örtliches Tierheim, wie die Organisatoren am Montag bestätigten. Es ist die höchste Summe, die die Schule je an einem Tag gesammelt hat.\n\nDas Geld kam bei einem Wohltätigkeitsbasar in der Aula zusammen, wo Schüler Gebäck verkauften und ein kleines Konzert organisierten. Über dreihundert Besucher kamen.\n\n'Wir hatten mit der Hälfte gerechnet', sagte Ayse Yildiz, die die Aktion leitete. 'Die Leute waren unglaublich großzügig.'\n\nDas Tierheim, das über vierzig Tiere versorgt, will das Geld für Futter und Medikamente nutzen. Die Organisatoren hoffen, den Basar jährlich zu wiederholen."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kendi görüşünü katmak. Haber tarafsızdır; görüşler yalnızca alıntılarda.", "En önemli bilgiyi başa koymamak (ters piramit).", "Schlagzeile veya alıntıyı unutmak."]}]}, {"id": "t-rezension", "group": "Kitle İletişim", "name": "Rezension (İnceleme)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran vb. değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (spoilersız), güçlü/zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, denge."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Neyi incelediğini baştan belli et.", "2. Kısa, sürprizsiz bir özet ver.", "3. Güçlü yönleri gerekçele.", "4. Zayıf yönleri de dürüstçe belirt (denge).", "5. Değerlendirici ama gerekçeli sıfatlar kullan.", "6. Net bir öneri/puanla bitir.", "7. Son kontrol: özet + güçlü/zayıf + denge + net öneri var mı?"]}, {"t": "given", "title": "Birinci örnek (film)", "x": "Ein Fest für die Augen, wenn auch nicht fürs Herz\n\n'Die blaue Laterne' verspricht viel, und in der ersten Stunde hält der Film es fast. Fast."}, {"t": "given", "title": "İkinci örnek (restoran, farklı ürün)", "x": "Warmes Essen, kühler Service: Das neue Eckcafé\n\nDas Eckcafé ist seit Wochen das Gesprächsthema, und das Essen hält meist, was es verspricht. Die Suppen sind reichhaltig, das Brot täglich frisch.\n\nDer Service ist leider eine andere Geschichte. Wir warteten zwanzig Minuten allein aufs Bestellen. Wenn die Besitzer das ändern, könnte es ein Lieblingsort werden. Vorerst: Geh für das Essen, aber bring Geduld mit. Drei von fünf Sternen."}, {"t": "h", "x": "Derinlemesine: Rezension (inceleme) ustalığı"}, {"t": "p", "x": "Rezension, bir kitabı, filmi, konseri ya da restoranı tanıtıp değerlendiren ve okura bir öneride bulunan metindir. Bu türün ruhu 'değerlendirme'dir: hem bilgilendirir (eser neyi anlatıyor?) hem de yargılar (iyi mi, kötü mü, neden?). Bir Rezension salt özet değildir; okura 'bunu okumalı/izlemeli miyim?' sorusunun cevabını verir. Bu yüzden dengeli olmalı - güçlü ve zayıf yanları birlikte sunmalı - ve gerekçeli bir öneriyle bitmelidir. IB Deutsch B'de bu tür, öğrencinin bir eseri betimleme, değer yüklü ama gerekçeli bir dil kurma ve - dilbilgisi açısından - sıfat çekimlerini (Adjektivendungen) doğru kullanma becerisini sınar. Çünkü inceleme, doğası gereği sıfatlarla doludur."}, {"t": "p", "x": "Kriterler açısından Rezension değerlendirici bir türdür. Criterion C (Konzeptverständnis) şunları arar: bir başlık, eseri tanıtan bir giriş, içerik ile değerlendirmenin ayrılması ve net bir öneri (Empfehlung). Yalnızca olay örgüsünü anlatıp değerlendirme yapmayan bir metin, incelemeden çok özet olur. Criterion B (Botschaft) değerlendirmenin gerekçeli olup olmadığına bakar: 'gut' ya da 'schlecht' demek yetmez; neden? Criterion A (Sprache) ise özellikle iki şeyi sınar: içeriği anlatırken şimdiki zaman (Präsens) kullanımı ve değer yüklü sıfatların doğru çekimi. Bu ikincisi - Adjektivendungen - Almancanın en teknik ama en çok fark yaratan konularından biridir."}, {"t": "p", "x": "İskelet şöyledir: bir başlık; girişte eseri tanıt (tür, yazar/yönetmen, konu bir cümlede); içerik bölümünde olay örgüsünü ana hatlarıyla ver ama SONU AÇIKLAMA (spoiler'dan kaçın); değerlendirme bölümünde güçlü yanları (oyunculuk, dil, atmosfer) ve zayıf yanları gerekçeleriyle tart; ve sonda net bir öneri sun ('Ich empfehle das Buch allen, die ... mögen'). Kritik bir teknik: içerik anlatımında şimdiki zaman kullanılır - Almancada eserin olay örgüsü daima Präsens ile aktarılır: 'Der Held verliert seine Familie und begibt sich auf eine gefährliche Reise'. Bu, edebi bir konvansiyondur ve doğru uygulanması Criterion C'yi güçlendirir. Uzunluk: SL 250-400, HL 450-600 kelime."}, {"t": "p", "x": "Bu türün dilbilgisel imzası sıfat çekimleridir (Adjektivendungen), çünkü bir inceleme değer yüklü sıfatlarla örülür: 'ein spannender Roman', 'eine überzeugende Hauptdarstellerin', 'ein enttäuschendes Ende'. Almancada isimden önce gelen sıfat, önündeki artikele ve ismin hâline/cinsine göre ek alır. Üç ana desen vardır. Belirsiz artikelle (ein/eine): 'ein spannenDER Film' (eril N.), 'eine spannenDE Geschichte' (dişil N.), 'ein spannenDES Buch' (nötr N.). Belirli artikelle (der/die/das): 'der spannenDE Film', 'die spannenDE Geschichte', 'das spannenDE Buch' (hepsi -e). Artikelsiz çoğulda: 'spannenDE Filme'. Bu desenleri doğru kullanmak, incelemeni hem akıcı hem gramer açısından zarif yapar."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "İncelemeyi adlandırır", "Ein Roman, der noch lange nachhallt"], ["Einleitung", "Eseri tanıtır", "Der Jugendroman 'Nebelkinder' von A. Kaya erzählt die Geschichte einer Flucht."], ["Inhalt (Präsens)", "Olay örgüsü (spoiler'sız)", "Die junge Ayla verlässt ihr Dorf und muss in einer fremden Stadt neu anfangen."], ["Bewertung", "Güçlü/zayıf yanlar", "Besonders überzeugend ist die ehrliche Sprache; das Ende wirkt jedoch etwas gehetzt."], ["Empfehlung", "Öneri sunar", "Ich empfehle das Buch allen, die einfühlsame Geschichten mögen."]]}, {"t": "note", "k": "ipucu", "title": "İncelemeyi güçlü kılan teknikler", "lines": ["İçeriği Präsens ile anlat: 'Der Film erzählt ...', 'Die Heldin entscheidet sich ...'.", "Dengeli ol: en az bir güçlü ve bir zayıf yan, ikisi de gerekçeli.", "Spoiler verme: sonu açıklama; okurun keşif zevkini koru.", "Net bir öneriyle bitir: kime, neden tavsiye edersin?"]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Tanıtım", "Der Film / Der Roman handelt von ..."], ["İçerik (Präsens)", "Die Geschichte spielt in ... und erzählt, wie ..."], ["Güçlü yan", "Besonders überzeugend / gelungen ist ..."], ["Zayıf yan", "Weniger überzeugend ist hingegen ..."], ["Atmosfer/dil", "Die Sprache ist bildhaft und berührend."], ["Karşılaştırma", "Im Vergleich zu ähnlichen Filmen wirkt er erfrischend ehrlich."], ["Öneri", "Ich empfehle das Buch allen, die ... mögen."], ["Çekince", "Wer schnelle Action erwartet, könnte enttäuscht werden."]]}, {"t": "p", "x": "Sıfat çekimlerini güvenle kullanmak incelemenin dil kalitesini doğrudan belirler. Pratik bir strateji: en sık ihtiyaç duyacağın Nominativ (özne) ve Akkusativ (nesne) desenlerini otomatikleştir. Belirli artikelden sonra sıfat neredeyse her zaman -e ya da -en alır: 'der gute Film' (N.), 'den guten Film' (A.). Belirsiz artikelden sonra cinsi sıfat gösterir: 'ein guter Film' (eril N.), 'eine gute Geschichte' (dişil N.), 'ein gutes Buch' (nötr N.); Akkusativ'de eril -en olur: 'einen guten Film'. Artikelsiz kullanımda sıfat artikelin işini üstlenir: 'guter Wein', 'gute Musik', 'gutes Essen', çoğul 'gute Filme'. Bu üç deseni içselleştirmek, yalnız Rezension'da değil tüm yazılarında Criterion A'yı yükseltir."}, {"t": "note", "k": "ipucu", "title": "Adjektivendungen: sıfat çekiminin üç deseni", "lines": ["Belirli artikel (der/die/das) + sıfat: Nominativ -e, çoğu diğer hâlde -en. 'der spannende Film', 'den spannenden Film'.", "Belirsiz artikel (ein/eine): cinsi sıfat gösterir. 'ein spannender Film', 'eine spannende Geschichte', 'ein spannendes Buch'.", "Belirsiz Akkusativ eril: -en. 'Ich sah einen spannenden Film.'", "Artikelsiz (çoğul/madde): sıfat güçlü ek alır. 'gute Filme', 'guter Wein', 'gutes Essen'.", "İçerik anlatımı Präsens: 'Der Held kämpft ...', 'Die Geschichte endet ...' (geçmiş zaman değil)."]}, {"t": "given", "title": "Çözümlü mini-model: tanıtım, içerik ve öneri", "x": "Ein leiser Roman mit großer Wirkung\n\n'Nebelkinder' von Aylin Kaya ist ein einfühlsamer Jugendroman über Flucht und Neuanfang. Die Geschichte erzählt, wie die vierzehnjährige Ayla ihr Dorf verlassen muss und in einer fremden, kalten Stadt ein neues Leben beginnt. Besonders überzeugend ist die ehrliche, unaufgeregte Sprache, die ganz ohne Kitsch auskommt. Weniger gelungen ist das etwas gehetzte Ende. Trotzdem empfehle ich diesen berührenden Roman allen, die leise, tiefgründige Geschichten mögen."}, {"t": "p", "x": "Bu inceleme neden örnek? Titel değerlendirici ('Ein leiser Roman mit großer Wirkung'). Giriş eseri tanıtıyor (yazar, tür, konu) ve dikkat: sıfat çekimleri kusursuz - 'ein einfühlsamer Jugendroman' (belirsiz artikel + eril N. -> -er). İçerik Präsens ile anlatılıyor: 'Die Geschichte erzählt, wie ... Ayla ihr Dorf verlassen muss und ... ein neues Leben beginnt' - şimdiki zaman, edebi konvansiyon. Değerlendirme dengeli: güçlü yan ('Besonders überzeugend ist die ehrliche, unaufgeregte Sprache') ve zayıf yan ('Weniger gelungen ist das etwas gehetzte Ende') - her ikisi de gerekçeli. Öneri net: 'empfehle ich diesen berührenden Roman allen, die ... mögen' - 'diesen berührenden Roman' (Akkusativ eril -> -en). Tanıtım, içerik, denge, öneri ve kusursuz Adjektivendungen - Rezension'un tüm ustalığı burada."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Sıfat çekimi (belirsiz eril N.): 'ein spannend Film' YANLIŞ -> 'ein spannender Film' DOĞRU.", "Sıfat çekimi (Akkusativ eril): 'Ich sah einen spannender Film.' YANLIŞ -> 'Ich sah einen spannenden Film.' DOĞRU.", "İçerik zamanı: 'Der Held verlor seine Familie und ging fort.' (Präteritum) zayıf -> 'Der Held verliert seine Familie und geht fort.' (Präsens) DOĞRU.", "Sadece özet: değerlendirmesiz olay anlatımı YANLIŞ -> güçlü/zayıf yanları gerekçeyle tart DOĞRU.", "Öneri eksik: incelemeyi yargısız bırakmak zayıf -> net bir Empfehlung ile bitir DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Rezension görevini gördüğünde önce hangi eseri (kitap, film, konser) değerlendireceğini ve genel yargını (öneriyor musun, önermiyor musun) belirle. Bir başlık yaz, girişte eseri tanıt (tür, yazar/yönetmen, konu bir cümlede), içerik bölümünde olay örgüsünü ana hatlarıyla ver ama SONU AÇIKLAMA - spoiler'dan kaçın. Değerlendirme bölümünde dengeli ol: en az bir güçlü ve bir zayıf yanı gerekçesiyle tart. Sonda net bir öneri sun ('Ich empfehle das Buch allen, die ... mögen'). Bu türde en çok puanı iki yerde kaybedersin. Birincisi, incelemeyi salt özete çevirmek: olay örgüsünü anlatıp değerlendirme yapmazsan, metin bir Rezension değil bir Zusammenfassung olur - mutlaka yargı ve gerekçe ekle. İkincisi iki dilbilgisi noktası: içeriği daima şimdiki zamanla (Präsens) anlat, çünkü Almancada eserin olay örgüsü bu zamanla verilir ('Der Held verliert seine Familie und begibt sich auf eine Reise'); ve değer yüklü sıfatların çekimini (Adjektivendungen) doğru yap - 'ein spannender Roman' (belirsiz eril N. -> -er), 'einen spannenden Roman' (Akkusativ eril -> -en), 'die überzeugende Sprache' (belirli artikel -> -e). Son bir dakikada denetle: eseri tanıttın mı, içeriği Präsens ile mi verdin, güçlü ve zayıf yanları gerekçeyle mi tarttın, net bir öneri var mı, sıfat çekimleri doğru mu? Değerlendirici bu türde bilgilendirme ile gerekçeli değerlendirmenin dengesini arar; sen de içeriği Präsens'te tutup Adjektivendungen'i doğru kullanarak hem Botschaft hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "rezension", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Rezension zu einem Film, den du gesehen, oder einem Buch, das du gelesen hast. Gib eine kurze, spoilerfreie Zusammenfassung, nenne Stärken und Schwächen und eine klare Empfehlung.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Dilbilgisini denetledim: Verbstellung, Kasus/Artikel ve Adjektivendungen doğru (Criterion A).", "Değerlendirici, çeşitli kelimeler kullandım; isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okudum (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Rezension)", "x": "Ein Fest für die Augen, wenn auch nicht fürs Herz\n\n'Die blaue Laterne' verspricht viel, und in der ersten Stunde hält der Film es fast. Er spielt in einer verfallenden Küstenstadt und folgt einem jungen Leuchtturmwärter, der ein geheimnisvolles Licht auf dem Meer entdeckt.\n\nVisuell ist der Film atemberaubend. Jedes Bild wirkt wie ein Gemälde, und das Sounddesign lässt dich den kalten Wind spüren.\n\nDas Problem ist die Geschichte. Nach der Hälfte kommt die Handlung fast zum Stillstand, und die Figuren treffen keine glaubwürdigen Entscheidungen.\n\nAlso, lohnt es sich? Wenn du Atmosphäre liebst und eine dünne Handlung verzeihen kannst, ja. Wenn du eine packende Geschichte brauchst, bleibst du vielleicht etwas kalt zurück. Drei von fünf Sternen: wunderschön, aber leer."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Sadece övme veya sadece yerme. Güçlü ve zayıf yönleri birlikte ver.", "Kararsız kalmak. Sonunda net bir öneri ver.", "Özeti spoiler'la doldurmak. Kısa ve sürprizsiz tut."]}]}, {"id": "paper1", "group": "Writing", "name": "Paper 1 Yazma", "eyebrow": "Paper 1 . Yaz", "blocks": [{"t": "p", "x": "Bir Aufgabe seç, Textsorte'yi belirle, o türün kurallarına göre Almanca yaz. Yazdıktan sonra kontrol listesini işaretle, sonra modeli aç."}, {"t": "task", "title": "Örnek görev (Aufgabe)", "lines": ["Deine Schule möchte, dass Schüler eine zweite Sprache lernen. Schreib einen Text für den Schulblog, in dem du von deiner eigenen Erfahrung erzählst und andere Schüler ermutigst, damit anzufangen.", "Textsorte: Blog. Kitle: okul öğrencileri. Amaç: deneyim paylaşmak ve teşvik etmek."]}, {"t": "given", "title": "Blog hatırlatması", "x": "Titel. Ich-Perspektive. Persönliche Erzählung und Gefühl. Direkte Ansprache (du). Ein ermutigender Schluss."}, {"t": "wizard", "wt": "blog", "ai": false, "prompt": null, "target": 250, "check": ["Doğru Textsorte'yi seçtim ve o türün açılış, düzen ve register kurallarına uydum.", "Aufgabe'nin istediği amacı ve kitleyi karşıladım (Criterion B).", "Fikirlerimi örnekle geliştirdim.", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "Ton ve register kitleye uygun (du/Sie doğru) (Criterion C).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Blog)", "x": "Warum Spanisch mein Jahr verändert hat\n\nVor einem Jahr konnte ich kaum 'Hallo' in einer anderen Sprache sagen. Heute kann ich ein echtes Gespräch auf Spanisch führen, und ich will dir erzählen, wie das passiert ist, denn wenn ich es kann, kannst du es auch.\n\nEhrlich gesagt habe ich nur angefangen, weil eine Freundin mich in einen Club schleppte. Am Anfang war es frustrierend. Ich verwechselte Wörter und wollte fast aufgeben. Aber etwas änderte sich, als ich aufhörte, perfekt sein zu wollen. Ich schaute spanische Serien und sprach mit einem Austauschschüler.\n\nAm meisten überraschte mich nicht die Grammatik, sondern das Selbstvertrauen. Eine zweite Sprache hat mir gezeigt, dass ich schlecht in etwas sein und trotzdem weitermachen kann.\n\nAlso mein ehrlicher Rat: Warte nicht, bis du bereit bist. Wähl eine Sprache und mach heute ein paar Fehler."}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Textsorte'nin biçimini görünür yap: Blogda Titel ve du, Rede'de retorik soru, Brief'te doğru selamlama/kapanış. Değerlendirici Criterion C'yi buradan okur.", "Fikri örnekle geliştir: genel cümle değil, kişisel somut örnek."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "note", "k": "dikkat", "title": "Register (du/Sie)", "lines": ["Önce kitleyi bul, du mu Sie mi karar ver. Yanlış register Criterion C'yi düşürür.", "Formeller Brief: 'Sehr geehrte/r' + 'Mit freundlichen Grüßen'. Informeller: 'Liebe/r' + 'Liebe Grüße'."]}, {"t": "note", "k": "ipucu", "title": "Sprache (Criterion A)", "lines": ["Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Fiili doğru konuma koy (yan cümlede sona).", "Aynı kelimeyi tekrarlama: 'gut' yerine 'wertvoll, hilfreich, sinnvoll'."]}, {"t": "note", "k": "ipucu", "title": "Botschaft (Criterion B)", "lines": ["Aufgabe iki şey istiyorsa ikisini de yap.", "Her fikri bir örnekle destekle; yüzeysel liste değil, gelişmiş fikir."]}]}, {"eyebrow":"Lesen . Menschliche Erfindungsgabe","id":"lesen-erfindungsgabe","name":"Lesetext 1: Smartphones","blocks":[{"x":"Gerçek okuma pratiği (Lesen): önce metni bir kez baştan sona oku, sonra soruları yanıtla. Kural: her cevabın dayanağını metinde bul. Tema: Menschliche Erfindungsgabe (teknoloji ve medya).","t":"p"},{"k":"ipucu","title":"Okuma stratejisi (Lesestrategie)","lines":["Önce sorulara göz at, ne aradığını bil; sonra metni tara (Skimming/Scanning).","Bilmediğin kelimeyi bağlamdan tahmin et; her kelimeyi çevirmeye çalışma.","Ana fikir (Hauptaussage) soruları için giriş ve sonuç paragrafına bak."],"t":"note"},{"t":"h","x":"Immer online - Fluch oder Segen?"},{"t":"p","x":"Das Smartphone ist aus dem Alltag vieler Jugendlicher nicht mehr wegzudenken. Laut einer aktuellen Studie verbringen deutsche Teenager durchschnittlich mehr als drei Stunden pro Tag mit ihrem Handy. Sie chatten mit Freunden, schauen Videos, hören Musik und informieren sich über das Weltgeschehen. Für viele ist das Gerät zugleich Wecker, Kamera, Fahrkarte und Nachschlagewerk."},{"t":"p","x":"Die Vorteile liegen auf der Hand: Man bleibt jederzeit mit Familie und Freunden in Kontakt, findet schnell Informationen und kann sogar unterwegs für die Schule lernen. Apps helfen beim Vokabellernen, beim Planen des Tages und beim Organisieren von Gruppenarbeiten."},{"t":"p","x":"Doch es gibt auch eine Kehrseite. Wer ständig auf den Bildschirm schaut, bewegt sich weniger und schläft oft schlechter. Manche Jugendliche fühlen sich unter Druck, weil sie in den sozialen Netzwerken nur perfekte Bilder sehen und sich ständig mit anderen vergleichen. Fachleute raten deshalb dazu, feste Pausen einzulegen und das Handy nachts nicht im Schlafzimmer zu lassen."},{"x":"Am Ende kommt es, wie so oft, auf das richtige Maß an. Das Smartphone ist weder nur Fluch noch nur Segen. Es ist ein Werkzeug - und wie jedes Werkzeug hängt sein Nutzen davon ab, wie wir es verwenden.","t":"p"},{"t":"mcqquiz","items":[{"choices":{"A":"Weniger als eine Stunde","C":"Mehr als drei Stunden","B":"Etwa zwei Stunden","D":"Den ganzen Tag"},"why":"Metinde açıkça durchschnittlich mehr als drei Stunden pro Tag geçiyor (1. paragraf).","ans":"C","n":1,"stem":"Wie viel Zeit verbringen deutsche Teenager laut der Studie durchschnittlich pro Tag mit dem Handy?"},{"stem":"Was bedeutet das Wort Kehrseite in diesem Text?","n":2,"ans":"B","why":"Kehrseite burada olumsuz yön / dezavantaj demektir; hemen ardından uyku ve baskı gibi olumsuzluklar sıralanır.","choices":{"A":"Die Vorderseite des Handys","C":"Eine neue App","B":"Die negative Seite, der Nachteil","D":"Die Rückseite der Kamera"}},{"why":"Uzmanlar feste Pausen einzulegen und das Handy nachts nicht im Schlafzimmer zu lassen öneriyor.","ans":"C","choices":{"A":"Das Handy den ganzen Tag zu benutzen","C":"Feste Pausen einzulegen","D":"Keine Apps mehr zu installieren","B":"Nachts das Handy im Schlafzimmer zu lassen"},"stem":"Was raten die Fachleute?","n":3},{"n":4,"stem":"Welche Aussage fasst die Meinung des Autors am besten zusammen?","choices":{"D":"Jugendliche sollten kein Handy besitzen.","B":"Das Smartphone ist immer nützlich.","A":"Das Smartphone ist nur schädlich.","C":"Es kommt darauf an, wie man das Smartphone benutzt."},"why":"Sonuç paragrafı weder nur Fluch noch nur Segen ... hängt sein Nutzen davon ab, wie wir es verwenden diyor. Yani kullanıma bağlı.","ans":"C"},{"ans":"A","why":"Özne wer 3. tekil şahıstır ve cümle şimdiki zamandadır, bu yüzden bewegt sich doğru çekimdir; metindeki biçim de budur.","choices":{"B":"bewegen","D":"bewegte","A":"bewegt","C":"bewegst"},"stem":"Welche Form passt grammatisch in die Lücke: Wer ständig auf den Bildschirm schaut, ___ sich weniger.","n":5}]}],"group":"Lesen"}, {"blocks":[{"x":"İkinci okuma metni. Tema: Wie wir den Planeten teilen (çevre ve sürdürülebilirlik). Metni oku, ardından çeşitli soru tiplerini (Detail, Wortschatz, Hauptaussage) yanıtla.","t":"p"},{"x":"Mit dem Fahrrad in die Zukunft","t":"h"},{"x":"In vielen europäischen Städten gehört das Fahrrad längst zum Straßenbild. Immer mehr Menschen lassen das Auto stehen und steigen aufs Rad - nicht nur, um fit zu bleiben, sondern auch, um die Umwelt zu schützen. Denn ein Fahrrad verursacht keine Abgase und braucht kaum Platz.","t":"p"},{"x":"Städte wie Kopenhagen und Amsterdam gelten als Vorbilder. Dort gibt es breite Radwege, sichere Kreuzungen und genügend Stellplätze. Wer mit dem Rad zur Arbeit fährt, kommt oft schneller ans Ziel als mit dem Auto, weil er nicht im Stau steht und leichter einen Parkplatz findet.","t":"p"},{"t":"p","x":"Natürlich hat das Radfahren auch Grenzen. Bei starkem Regen oder auf langen Strecken ist das Auto oder der Zug manchmal bequemer. Ältere Menschen und Familien mit kleinen Kindern brauchen zudem andere Lösungen. Trotzdem sind sich viele Experten einig: Wenn Städte den Radverkehr fördern, verbessern sich Luft und Lebensqualität für alle."},{"x":"Die Politik kann viel dazu beitragen. Sichere Wege, günstige Leihräder und weniger Platz für Autos sind wichtige Schritte. Doch am Ende entscheidet jeder Einzelne selbst, wie er sich fortbewegt. Schon eine kleine Umstellung im Alltag kann einen großen Unterschied machen.","t":"p"},{"t":"mcqquiz","items":[{"stem":"Warum steigen laut Text immer mehr Menschen aufs Rad?","n":1,"why":"1. paragraf: nicht nur, um fit zu bleiben, sondern auch, um die Umwelt zu schützen.","ans":"B","choices":{"C":"Weil es keine Autos mehr gibt","A":"Weil Fahrräder billiger als Handys sind","B":"Um fit zu bleiben und die Umwelt zu schützen","D":"Weil die Politik das Autofahren verbietet"}},{"ans":"C","why":"2. paragraf açıkça Kopenhagen und Amsterdam örnek gösterir.","choices":{"A":"Berlin und München","C":"Kopenhagen und Amsterdam","D":"London und Madrid","B":"Paris und Rom"},"stem":"Welche Städte werden als Vorbilder genannt?","n":2},{"ans":"B","why":"Metin: weil er nicht im Stau steht und leichter einen Parkplatz findet. Neden hız değil, trafik ve park.","choices":{"C":"Weil es keine Ampeln gibt","A":"Weil Fahrräder schneller als Autos fahren","B":"Weil man nicht im Stau steht und leichter parkt","D":"Weil die Radwege immer bergab gehen"},"stem":"Warum kommt man mit dem Rad oft schneller ans Ziel?","n":3},{"choices":{"A":"Bei schönem Wetter","C":"Bei starkem Regen oder auf langen Strecken","B":"Auf sehr kurzen Strecken","D":"Nur in der Innenstadt"},"why":"3. paragraf: Bei starkem Regen oder auf langen Strecken ist das Auto oder der Zug manchmal bequemer.","ans":"C","n":4,"stem":"Wann ist laut Text das Auto oder der Zug manchmal bequemer?"},{"stem":"Was ist die zentrale Botschaft (Hauptaussage) des Textes?","n":5,"why":"Metin bisikletin çevre dostu olduğunu ama sınırları olduğunu söyler; son paragraf jeder Einzelne selbst vurgusuyla herkesin katkısını öne çıkarır.","ans":"C","choices":{"B":"Nur die Politik ist für die Umwelt verantwortlich.","D":"Fahrräder sind gefährlicher als Autos.","A":"Autos sollten sofort verboten werden.","C":"Radfahren ist umweltfreundlich, hat aber Grenzen; jeder kann etwas beitragen."}}]}],"id":"lesen-planeten","eyebrow":"Lesen . Wie wir den Planeten teilen","name":"Lesetext 2: Fahrrad und Umwelt","group":"Lesen"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id,done:{}};
function _griSlugsOf(node,out){if(!node||typeof node!=='object')return;if(Array.isArray(node)){for(var i=0;i<node.length;i++)_griSlugsOf(node[i],out);return;}for(var k in node){if(!Object.prototype.hasOwnProperty.call(node,k))continue;var v=node[k];if(k==='slug'&&typeof v==='string'&&v)out.push(v);else if(v&&typeof v==='object')_griSlugsOf(v,out);}}
async function loadProgress(){try{if(!window.GRI_SB||!window.GRI_UID)return;var map={},pre=null,n=0;D.lessons.forEach(function(l){var s=[];_griSlugsOf(l.blocks||[],s);s.forEach(function(sl){map[sl]=l.id;n++;pre=(pre===null)?sl:(function(a,b){var m=Math.min(a.length,b.length),i=0;while(i<m&&a[i]===b[i])i++;return a.slice(0,i);})(pre,sl);});});if(!n)return;var q=window.GRI_SB.from('user_answers').select('question_slug').eq('user_id',window.GRI_UID);if(pre&&pre.length>=6)q=q.like('question_slug',pre+'%');var r=await q;if(r&&r.data&&r.data.length){var hit=false;r.data.forEach(function(row){var lid=map[row.question_slug];if(lid){S.done[lid]=true;hit=true;}});if(hit)renderRail();}}catch(e){}}
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''} ${S.done[l.id]?'done':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz"${b.wt?` data-wt="${esc(b.wt)}"`:''}>`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;

      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}

function pickWType(types, wt){

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types, wz.dataset.wt);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
