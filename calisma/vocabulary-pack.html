      });

:root{--bg:#f0fdfa;--surface:#ffffff;--border:#0d9488;--blight:#ccfbf1;--text:#134e4a;--muted:#5eead4;--muted2:#6b7280;--teal:#0f766e;--tdark:#0d5e57;--tlight:#e6fffa;--taclight:#f0fdfa;--correct:#166534;--cbg:#f0fdf4;--wrong:#991b1b;--wbg:#fef2f2;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(155deg,#f0fdfa 50%,#ccfbf1 100%)}
.s-series{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#5eead4;margin-bottom:.6rem}
.s-badge{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1.1rem;border-radius:50px;margin-bottom:1.6rem}

.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.2rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.74rem;color:var(--teal);font-family:'DM Mono',monospace}
.btn-p{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.9rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}

.promo-card{background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.3rem;margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;max-width:320px;width:100%;text-align:center}

.promo-sub{font-size:.68rem;color:var(--muted2);opacity:.7;font-family:'DM Mono',monospace}
.promo-exams{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:.12rem}
.promo-tag{background:transparent;border:1px solid var(--border);border-radius:4px;font-size:.61rem;font-family:'DM Mono',monospace;padding:.1rem .38rem;color:var(--teal);opacity:.85}

#quiz{display:none;min-height:100vh;flex-direction:column}
.qbody{flex:1;max-width:680px;margin:0 auto;padding:1.8rem 1.2rem 2.5rem;width:100%}
.tracker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.15rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blight);border:1.5px solid var(--border);transition:all .2s;cursor:pointer}
.dot.ans{background:var(--teal);border-color:var(--teal)}
.dot.cur{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
.qtype-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blight);border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);padding:.25rem .65rem;margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pbox{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r);padding:1.15rem 1.35rem;margin-bottom:1.2rem;font-family:'Lora',serif;font-size:.95rem;line-height:1.78;color:#1c1917}
.pbox u{text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--teal);color:var(--tdark)}
.pbox .blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:60px;text-align:center;font-family:'DM Mono',monospace;font-size:.85rem;color:var(--teal);padding:0 .3rem}
.qt{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--tdark)}
.opts{display:flex;flex-direction:column;gap:.44rem;margin-bottom:1.4rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;background:var(--surface);border:1.5px solid var(--blight);border-radius:var(--r);padding:.65rem .95rem;cursor:pointer;transition:border-color .12s,background .12s;font-size:.91rem;color:var(--text);width:100%;text-align:left;font-family:'Lora',serif}
.opt:hover{border-color:var(--teal);background:var(--taclight)}

.btn-n{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:.55rem 1.1rem;font-size:.87rem;font-weight:600;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s}

.btn-sub{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.55rem 1.35rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-sub:hover{opacity:.85}
#results{display:none;background:var(--bg);min-height:100vh}
.rh{background:var(--teal);color:#fff;padding:2rem 1.5rem;text-align:center}
.rh h1{font-family:'Inter',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.rh p{opacity:.75;font-size:.82rem}
.rb{max-width:680px;margin:0 auto;padding:2rem 1.2rem 3rem}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.sc-big{text-align:center}
.sc-num{font-size:3.5rem;font-weight:700;color:var(--teal);font-family:'DM Mono',monospace;line-height:1}
.sc-den{font-size:.8rem;color:var(--muted2);font-family:'DM Mono',monospace}
.sc-pct{font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--tdark)}
.sc-rng{font-size:.8rem;color:var(--muted2);margin-bottom:.4rem}
.sc-tip{font-size:.8rem;color:var(--muted2);line-height:1.55}
.stitle{font-size:.65rem;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:.85rem;padding-bottom:.32rem;border-bottom:1px solid var(--border)}
.wi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.wh{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#fef2f2;border-bottom:1px solid #fecaca;cursor:pointer;user-select:none}
.wn{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--wrong);font-weight:700}
.wt{font-size:.8rem;color:var(--tdark);font-weight:600}
.wtog{margin-left:auto;font-size:.72rem;color:var(--muted2)}
.wb{padding:.9rem;display:none}
.wb.open{display:block}
.rpass{background:var(--bg);border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin-bottom:.7rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.72;color:#1c1917}
.rpass u{text-decoration:none;font-weight:700;color:var(--tdark)}
.ac{background:var(--cbg);color:var(--correct);font-size:.82rem;font-weight:600;padding:.33rem .7rem;border-radius:5px;margin-bottom:.25rem;font-family:'Lora',serif}
.aw{background:var(--wbg);color:var(--wrong);font-size:.82rem;padding:.33rem .7rem;border-radius:5px;margin-bottom:.55rem;text-decoration:line-through;font-family:'Lora',serif}

.btn-rs:hover{opacity:.85}
.type-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}

.ts.wrong{border-color:#fca5a5;background:var(--wbg);color:var(--wrong)}

  const ALL_SETS=[null, {"n": 1, "topic": "Foundation Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The new urban policy was designed to <u>ameliorate</u> the housing shortage, providing subsidized units for low-income families while encouraging private developers to build in underserved neighborhoods.", "q": "As used in the text, \"ameliorate\" most nearly means:", "o": ["A) completely solve through decisive action", "B) make something bad less severe or more tolerable", "C) study and document for future analysis", "D) temporarily delay without permanent resolution"], "a": 1, "e": "B is correct. The policy addresses the shortage by providing units — it makes the problem less severe. \"Ameliorate\" = to make something bad less severe.\n\nA is too strong — completely solve overstates.\nC = analyze, not remedy.\nD = delay implies no actual improvement.\n\nKelime: ameliorate — iyileştirmek, hafifletmek"}, {"k": "vocab", "p": "The expedition proved far more <u>arduous</u> than the team had anticipated: the terrain was steep, supplies ran short, and three of the five climbers had to turn back before reaching base camp.", "q": "As used in the text, \"arduous\" most nearly means:", "o": ["A) dangerous beyond all reasonable expectation", "B) requiring great effort and endurance; very difficult", "C) poorly organized from the outset", "D) longer in duration than originally planned"], "a": 1, "e": "B is correct. Steep terrain, shortages, three turning back = extreme difficulty requiring great effort. \"Arduous\" = requiring great effort; very difficult.\n\nA — dangerous focuses on risk, not effort.\nC — poor organization is a cause, not the definition.\nD — longer duration alone is not what arduous means.\n\nKelime: arduous — çok güç, yorucu, zahmetli"}, {"k": "vocab", "p": "Before recommending treatment, the physician needed to <u>ascertain</u> the precise cause of the symptoms, ordering a series of blood tests and imaging scans to eliminate possible diagnoses one by one.", "q": "As used in the text, \"ascertain\" most nearly means:", "o": ["A) estimate with a reasonable degree of confidence", "B) communicate clearly to the patient", "C) find out with certainty; definitively establish", "D) confirm through direct observation"], "a": 2, "e": "C is correct. Tests to eliminate diagnoses = the goal is certainty. \"Ascertain\" = to find out definitely.\n\nA — estimate implies uncertainty; ascertain implies certainty.\nB — communicate is what happens after ascertaining.\nD — direct observation is a method, not the definition.\n\nKelime: ascertain — kesinlikle öğrenmek, tespit etmek"}, {"k": "vocab", "p": "The graduate student was known for her <u>assiduous</u> research habits: she arrived at the library when it opened, filled entire notebooks with primary source material, and never submitted work she considered incomplete.", "q": "As used in the text, \"assiduous\" most nearly means:", "o": ["A) intellectually gifted and highly creative", "B) extremely diligent and thorough", "C) cautious and unwilling to take risks", "D) competitive and driven by external recognition"], "a": 1, "e": "B is correct. Early arrival, thorough notes, refusing to submit incomplete work = extremely diligent. \"Assiduous\" = showing great care and perseverance.\n\nA — giftedness is separate from diligence.\nC — caution implies reluctance; assiduous implies committed effort.\nD — competitive motivation is not described.\n\nKelime: assiduous — çok çalışkan, gayretli, titiz"}, {"k": "vocab", "p": "The foundation chose to <u>augment</u> its existing grant program rather than replace it, adding funding streams for digital initiatives while preserving support for traditional community arts organizations.", "q": "As used in the text, \"augment\" most nearly means:", "o": ["A) substantially change the direction of", "B) add to in order to increase size or scope", "C) evaluate before deciding to expand", "D) transform into a more effective structure"], "a": 1, "e": "B is correct. Adding streams while preserving existing support = increasing what is already there. \"Augment\" = to add to; to make larger.\n\nA — changing direction implies replacing, not augmenting.\nC — evaluate describes a prior step, not augmentation itself.\nD — transform implies fundamental structural change.\n\nKelime: augment — artırmak, büyütmek, genişletmek"}, {"k": "vocab", "p": "The monastery's interior was deliberately <u>austere</u>: bare stone walls, wooden benches without cushions, and a single window letting in a shaft of morning light — nothing that might distract from prayer.", "q": "As used in the text, \"austere\" most nearly means:", "o": ["A) architecturally innovative in its use of natural materials", "B) severe in appearance and lacking comfort or decoration", "C) intentionally closed to outside visitors", "D) built to withstand harsh weather conditions"], "a": 1, "e": "B is correct. Bare stone, no cushions, single window = stripped of decoration and comfort. \"Austere\" = severely plain; lacking ornamentation.\n\nA — innovative is not implied.\nC — privacy describes access, not appearance.\nD — durability describes structure, not aesthetic quality.\n\nKelime: austere — sade, gösterişsiz; sert, katı"}, {"k": "vocab", "p": "The attorney's closing argument was designed to <u>bolster</u> the jury's confidence in the forensic evidence, dwelling on the consistency between the physical findings and the prosecution's timeline.", "q": "As used in the text, \"bolster\" most nearly means:", "o": ["A) question or subject to scrutiny", "B) present in simplified form", "C) strengthen or reinforce", "D) contradict with new information"], "a": 2, "e": "C is correct. Emphasizing consistency to increase the jury's confidence = reinforcing the evidence. \"Bolster\" = to support and strengthen.\n\nA — question implies doubt; bolster implies support.\nB — simplification is not what the argument does.\nD — contradict is the opposite of bolster.\n\nKelime: bolster — güçlendirmek, desteklemek, pekiştirmek"}, {"k": "vocab", "p": "The director's <u>candid</u> assessment surprised the board: rather than offering reassurance, she acknowledged the project's delays, identified specific management failures, and proposed concrete steps for recovery.", "q": "As used in the text, \"candid\" most nearly means:", "o": ["A) overly critical and lacking diplomatic sensitivity", "B) preliminary and subject to revision", "C) brief and efficiently communicated", "D) truthful and straightforwardly expressed"], "a": 3, "e": "D is correct. Acknowledged delays and failures honestly rather than offering reassurance = straightforward, truthful. \"Candid\" = forthright and honest.\n\nA — overly critical implies excessive negativity; candid is simply honest.\nB — preliminary implies incompleteness.\nC — brevity describes length, not honesty.\n\nKelime: candid — açık sözlü, dürüst, samimi"}, {"k": "vocab", "p": "The negotiator remained <u>circumspect</u> throughout the early sessions, offering no firm commitments and carefully avoiding language that could be interpreted as binding before the full terms had been reviewed.", "q": "As used in the text, \"circumspect\" most nearly means:", "o": ["A) deliberately vague in order to mislead", "B) wary; taking all factors into consideration before acting", "C) unwilling to engage under any conditions", "D) guided by strict adherence to legal procedure"], "a": 1, "e": "B is correct. No commitments, careful language = considering implications before acting. \"Circumspect\" = wary; considering all circumstances before deciding.\n\nA — deliberately misleading implies deception; circumspect implies honest caution.\nC — unwilling to engage is too extreme.\nD — legal procedure is not the basis described.\n\nKelime: circumspect — ihtiyatlı, temkinli, dikkatli"}, {"k": "vocab", "p": "The committee found the proposal's arguments <u>cogent</u>: each claim was supported by specific data, the logical sequence was easy to follow, and anticipated counterarguments were addressed directly.", "q": "As used in the text, \"cogent\" most nearly means:", "o": ["A) sufficiently brief to hold the committee's attention", "B) persuasive and logically compelling", "C) technically complex in its evidence", "D) consistent with the committee's prior preferences"], "a": 1, "e": "B is correct. Data, clear logic, addressed counterarguments = persuasive and well-reasoned. \"Cogent\" = clear, logical, and convincing.\n\nA — brevity is not what cogent describes.\nC — complexity is separate; cogent implies clarity.\nD — consistency with preferences describes reception, not reasoning quality.\n\nKelime: cogent — ikna edici, tutarlı, mantıklı"}, {"k": "vocab", "p": "After three consecutive profitable quarters, the management team grew <u>complacent</u>, assuming the conditions driving their success would persist indefinitely and investing little in anticipating change.", "q": "As used in the text, \"complacent\" most nearly means:", "o": ["A) excessively cautious about future projections", "B) overconfident and inattentive to potential risks", "C) satisfied with modest rather than ambitious targets", "D) preoccupied with internal disagreements"], "a": 1, "e": "B is correct. Assuming indefinite success + not anticipating change = overconfident, not alert to risks. \"Complacent\" = self-satisfied; uncritically at ease when there is risk.\n\nA — excessive caution is the opposite of complacency.\nC — modest ambition is different from neglecting risk.\nD — internal disagreements are not described.\n\nKelime: complacent — kendinden memnun, umursamaz; riske karşı kayıtsız"}, {"k": "vocab", "p": "The author <u>conceded</u> in her response to critics that the book's third chapter overstated the evidence, while maintaining that its central thesis remained sound.", "q": "As used in the text, \"conceded\" most nearly means:", "o": ["A) argued persuasively against", "B) acknowledged reluctantly as true", "C) explained in greater detail", "D) withdrew from circulation"], "a": 1, "e": "B is correct. The author admits the chapter overstated while defending the thesis = reluctant partial acknowledgment. \"Concede\" = to admit that something is true, often reluctantly.\n\nA — argue against is the opposite.\nC — explain in detail describes clarification, not admission.\nD — withdraw from circulation is not what concede means here.\n\nKelime: concede — kabul etmek, teslim olmak, itiraf etmek"}, {"k": "vocab", "p": "The architect's use of bright red cladding made the building <u>conspicuous</u> even from a distance, ensuring that the new civic center would be immediately identifiable within the surrounding streetscape.", "q": "As used in the text, \"conspicuous\" most nearly means:", "o": ["A) visually distinctive; easily noticed", "B) aesthetically controversial among observers", "C) structurally sound despite its unusual design", "D) designed to reflect local architectural history"], "a": 0, "e": "A is correct. Identifiable from a distance = easily noticed, standing out. \"Conspicuous\" = readily visible; attracting attention.\n\nB — controversial implies divided reaction; conspicuous simply means noticeable.\nC — structural soundness is a different quality.\nD — reflecting history describes intent, not visibility.\n\nKelime: conspicuous — göze çarpan, belirgin, dikkat çekici"}, {"k": "vocab", "p": "The proposed redistricting plan proved deeply <u>contentious</u>, drawing opposition from residents, advocacy groups, and elected officials who disagreed sharply about which neighborhoods would be grouped together.", "q": "As used in the text, \"contentious\" most nearly means:", "o": ["A) legally problematic due to procedural errors", "B) causing or likely to cause argument and disagreement", "C) technically complex and difficult to implement", "D) widely misunderstood by the general public"], "a": 1, "e": "B is correct. Multiple opposing groups, sharp disagreements = generating strong argument and conflict. \"Contentious\" = causing controversy; likely to be disputed.\n\nA — legal problems are not mentioned.\nC — technical complexity is a different issue.\nD — misunderstanding is not what contentious describes.\n\nKelime: contentious — tartışmalı, çekişmeli, anlaşmazlık yaratan"}, {"k": "vocab", "p": "The decade-long collaboration between the two research institutions <u>culminated</u> in a jointly published study that redefined the field's understanding of protein folding.", "q": "As used in the text, \"culminated\" most nearly means:", "o": ["A) was interrupted at a critical stage", "B) reached its highest point; resulted in as a final outcome", "C) was expanded into a broader partnership", "D) was recognized by the broader scientific community"], "a": 1, "e": "B is correct. The collaboration reached its highest point — the study was the final, defining outcome. \"Culminate\" = to reach the highest or final point; to end in a climax.\n\nA — interrupted is the opposite.\nC — expanded into a broader partnership describes continuation, not conclusion.\nD — recognition describes reception, not what culminate means.\n\nKelime: culminate — doruğa ulaşmak, zirveye çıkmak, sonuçlanmak"}, {"k": "vocab", "p": "Researchers studying medieval public health were hampered by a <u>dearth</u> of documentary sources: literacy rates were low, records were rarely kept systematically, and most that had been created were lost to fire and flood.", "q": "As used in the text, \"dearth\" most nearly means:", "o": ["A) poor quality or unreliability", "B) controversial or disputed status", "C) scarcity or lack", "D) inaccessibility due to restricted archives"], "a": 2, "e": "C is correct. Low literacy, systematic gaps, loss to disaster = scarcity of sources. \"Dearth\" = a scarcity or lack of something.\n\nA — poor quality is different; the issue is that few sources exist.\nB — disputed status is not mentioned.\nD — restricted archives describes access problems, not quantity.\n\nKelime: dearth — kıtlık, yokluk, eksiklik"}, {"k": "vocab", "p": "The speaker's presentation style was <u>diffuse</u>, moving between anecdotes, statistics, and tangential observations without the organizing logic that would have tied these elements into a coherent argument.", "q": "As used in the text, \"diffuse\" most nearly means:", "o": ["A) spread out and lacking focus; not concentrated", "B) deliberately informal and accessible to a general audience", "C) ambitious in scope but limited in time", "D) enthusiastic without sufficient supporting evidence"], "a": 0, "e": "A is correct. Moving between unconnected elements without organizing logic = spread out and lacking focus. \"Diffuse\" (adj.) = not concentrated; lacking clarity.\n\nB — informal is not the issue; diffuse refers to lack of cohesion.\nC — scope and time constraints are different issues.\nD — enthusiasm without evidence is a different criticism.\n\nKelime: diffuse — yayılmış, dağınık; net olmayan"}, {"k": "vocab", "p": "Only after studying the painting for several hours could the conservator <u>discern</u> the underpainting beneath the surface — a preliminary sketch that revealed the artist's original compositional intention.", "q": "As used in the text, \"discern\" most nearly means:", "o": ["A) restore to its original condition", "B) perceive or recognize with careful attention", "C) document for preservation purposes", "D) assess the monetary value of"], "a": 1, "e": "B is correct. Extended study required before the conservator could perceive the underpainting = recognize with careful attention. \"Discern\" = to recognize something that is not immediately obvious.\n\nA — restore describes a conservation action.\nC — document describes recording.\nD — assess value is unrelated to discerning.\n\nKelime: discern — seçip ayırt etmek, fark etmek, kavramak"}, {"k": "vocab", "p": "The anthology brought together <u>disparate</u> voices — novelists, journalists, environmental scientists, and urban planners — who shared a concern about coastal erosion but approached it from entirely different disciplinary perspectives.", "q": "As used in the text, \"disparate\" most nearly means:", "o": ["A) widely recognized in their respective fields", "B) fundamentally different in kind or character", "C) united by a common professional background", "D) selected from geographically diverse regions"], "a": 1, "e": "B is correct. Novelists, journalists, scientists, and planners = fundamentally different types of contributors. \"Disparate\" = so unlike as to not be comparable; essentially different.\n\nA — recognition is not what disparate describes.\nC — common professional background is the opposite.\nD — geographic diversity is not what disparate means here.\n\nKelime: disparate — birbirinden çok farklı, benzemez"}, {"k": "vocab", "p": "The senator's floor speech was widely praised as <u>eloquent</u>: its language was precise and evocative, its emotional appeals were earned rather than manipulative, and its structure guided listeners from premise to conclusion with ease.", "q": "As used in the text, \"eloquent\" most nearly means:", "o": ["A) politically effective in securing votes", "B) unusually brief for the complexity of the subject", "C) fluent and persuasive in expression", "D) technically detailed and well-documented"], "a": 2, "e": "C is correct. Precise language, evocative expression, earned appeals, clear structure = fluent, persuasive speech. \"Eloquent\" = fluent and persuasive in speaking or writing.\n\nA — political effectiveness describes outcome.\nB — brevity is not what eloquent describes.\nD — technical detail is a different quality.\n\nKelime: eloquent — etkileyici, belagatli, güzel konuşan"}, {"k": "vocab", "p": "Young architects often study under established practitioners not merely to learn technical skills but to <u>emulate</u> the thinking process — the way a master weighs constraints and arrives at a design concept.", "q": "As used in the text, \"emulate\" most nearly means:", "o": ["A) formally certify as qualified in a recognized discipline", "B) assist with practical tasks in a professional setting", "C) match or attempt to equal by imitating", "D) critique in order to develop independent judgment"], "a": 2, "e": "C is correct. Studying a master's thinking process to replicate it = match by imitating. \"Emulate\" = to match or surpass by imitating.\n\nA — certification is a formal credential process.\nB — assisting with tasks is an apprenticeship function, not emulation.\nD — critique implies analysis and disagreement, not imitation.\n\nKelime: emulate — taklit etmek, örnek alarak aynısını yapmak"}, {"k": "vocab", "p": "The study's conclusions were later shown to be <u>erroneous</u>: an audit revealed that the data had been processed with an incorrect formula, producing results that systematically overstated the claimed effect.", "q": "As used in the text, \"erroneous\" most nearly means:", "o": ["A) based on insufficient evidence", "B) containing errors; not correct", "C) presented in a misleading or selective way", "D) subsequently revised following peer review"], "a": 1, "e": "B is correct. Incorrect formula produced wrong results = the conclusions were wrong. \"Erroneous\" = wrong; containing an error.\n\nA — insufficient evidence is a different kind of problem.\nC — misleading presentation implies intent; erroneous simply means incorrect.\nD — revised following review describes what happened afterward.\n\nKelime: erroneous — hatalı, yanlış, doğru olmayan"}, {"k": "vocab", "p": "The drought was already straining agricultural output, and the unseasonably early frost served only to <u>exacerbate</u> the shortage, damaging crops that had managed to survive the dry summer.", "q": "As used in the text, \"exacerbate\" most nearly means:", "o": ["A) make something bad worse by adding to it", "B) temporarily stabilize a difficult situation", "C) draw public attention to a problem", "D) provide an unexpected cause of a condition"], "a": 0, "e": "A is correct. The drought was already bad; the frost made it worse. \"Exacerbate\" = to make a bad situation worse.\n\nB — stabilize is the opposite.\nC — draw attention is a different function.\nD — unexpected cause describes origin, not worsening.\n\nKelime: exacerbate — daha da kötüleştirmek, şiddetlendirmek"}, {"k": "vocab", "p": "The new transit hub was designed to <u>facilitate</u> transfers between bus, rail, and bicycle infrastructure, reducing the friction that had previously discouraged commuters from combining multiple modes of transportation.", "q": "As used in the text, \"facilitate\" most nearly means:", "o": ["A) mandate or require by regulation", "B) make easier or less difficult", "C) physically accommodate more users", "D) reduce the financial cost of a service"], "a": 1, "e": "B is correct. The hub reduces friction = makes transfers easier. \"Facilitate\" = to make an action or process easier.\n\nA — mandate implies legal requirement; facilitate implies ease, not compulsion.\nC — accommodating more users describes capacity.\nD — reducing cost is an economic outcome.\n\nKelime: facilitate — kolaylaştırmak, mümkün kılmak"}, {"k": "vocab", "p": "The argument that correlation implies causation is <u>fallacious</u>: the fact that two trends move together does not establish that one produces the other, a point routinely missed in popular reporting on scientific studies.", "q": "As used in the text, \"fallacious\" most nearly means:", "o": ["A) statistically imprecise", "B) based on false reasoning; logically flawed", "C) widely accepted but unverified", "D) inconsistent with current scientific consensus"], "a": 1, "e": "B is correct. Correlation-implies-causation is logically flawed reasoning. \"Fallacious\" = based on mistaken belief or unsound reasoning.\n\nA — imprecision is a different kind of error.\nC — widely accepted but unverified is a different problem.\nD — inconsistency with consensus is a separate issue.\n\nKelime: fallacious — yanıltıcı, hatalı, yanlış temele dayalı"}]}, {"n": 2, "topic": "Academic & Scientific Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The researchers sought to <u>fortify</u> their initial findings by replicating the experiment under a range of conditions, ensuring the results held not just in the original laboratory setting but across varied contexts.", "q": "As used in the text, \"fortify\" most nearly means:", "o": ["A) publicize broadly to maximize impact", "B) acknowledge the limitations of", "C) strengthen by adding more support or evidence", "D) simplify for communication to a general audience"], "a": 2, "e": "C is correct. Replicating across conditions adds supporting evidence = strengthens the findings. \"Fortify\" = to strengthen or reinforce.\n\nA — publicize describes dissemination.\nB — acknowledge limitations is the opposite.\nD — simplify describes communication strategy.\n\nKelime: fortify — güçlendirmek, pekiştirmek"}, {"k": "vocab", "p": "Despite the reputation of writers as solitary figures, the novelist was famously <u>gregarious</u>, maintaining an extensive correspondence, hosting a weekly salon, and rarely working without the sound of conversation in the background.", "q": "As used in the text, \"gregarious\" most nearly means:", "o": ["A) unusually productive in professional output", "B) sociable; enjoying the company of others", "C) resistant to established literary conventions", "D) interested in social and political issues"], "a": 1, "e": "B is correct. Correspondence, salons, working with conversation nearby = someone who thrives in social company. \"Gregarious\" = fond of the company of others; sociable.\n\nA — productivity is a separate quality.\nC — resistance to conventions is different.\nD — interest in social issues is different from enjoying social company.\n\nKelime: gregarious — sosyal, arkadaş canlısı, toplumsal"}, {"k": "vocab", "p": "The unusual warmth in February was not, as some hoped, a pleasant anomaly — ecologists warned that it was a <u>harbinger</u> of the ecosystem disruption that decades of rising temperatures had been building toward.", "q": "As used in the text, \"harbinger\" most nearly means:", "o": ["A) the direct cause of a significant event", "B) a sign that announces something to come", "C) the most severe manifestation of a problem", "D) a temporary relief from a persistent condition"], "a": 1, "e": "B is correct. The warmth signals future disruption — it announces what is coming. \"Harbinger\" = a person or thing that signals the approach of something.\n\nA — direct cause implies it produces the event; a harbinger signals without necessarily causing.\nC — most severe manifestation is the opposite (a harbinger comes before).\nD — temporary relief is the opposite meaning.\n\nKelime: harbinger — habercisi, ön işareti, müjdecisi"}, {"k": "vocab", "p": "The composer's scoring was highly <u>idiosyncratic</u>: she incorporated unpitched vocal sounds, notated silences with symbols she had invented herself, and wrote dynamics that could not be reproduced on conventional instruments.", "q": "As used in the text, \"idiosyncratic\" most nearly means:", "o": ["A) technically demanding for all performers", "B) peculiar to the individual; highly distinctive", "C) deliberately provocative toward musical tradition", "D) inconsistent in quality across different compositions"], "a": 1, "e": "B is correct. Invented notation, unconventional sounds = highly distinctive, peculiar to this composer. \"Idiosyncratic\" = peculiar to or characteristic of a particular individual.\n\nA — technical difficulty is a different quality.\nC — provocation implies intent to challenge; idiosyncratic is simply individual distinctiveness.\nD — inconsistent quality is a different issue.\n\nKelime: idiosyncratic — kendine özgü, biricik, alışılmışın dışında"}, {"k": "vocab", "p": "The <u>impetuous</u> decision to launch the product before testing was complete proved costly: three critical design flaws emerged within weeks of release, requiring an expensive recall and a public apology.", "q": "As used in the text, \"impetuous\" most nearly means:", "o": ["A) made without adequate reflection; hasty", "B) influenced by external commercial pressure", "C) based on overconfidence in prior success", "D) contrary to the engineering team's recommendations"], "a": 0, "e": "A is correct. Launching before testing = acting without adequate thought. \"Impetuous\" = acting quickly and without thought.\n\nB — external pressure is a cause, not the meaning.\nC — overconfidence is a cause, not the definition.\nD — contrary to recommendations is a specific circumstance.\n\nKelime: impetuous — düşüncesiz, ani, aceleci"}, {"k": "vocab", "p": "The editor's feedback was always <u>incisive</u>: she did not waste time on general praise but went directly to the structural problems in an argument, identifying exactly which paragraph failed to deliver on the introduction's promise.", "q": "As used in the text, \"incisive\" most nearly means:", "o": ["A) unnecessarily harsh or dismissive", "B) clear and accurate in identifying what matters", "C) focused exclusively on stylistic issues", "D) given verbally rather than in written form"], "a": 1, "e": "B is correct. Going directly to structural problems and identifying the specific failure = clear and accurate. \"Incisive\" = intelligently analytical; clear-cut.\n\nA — harsh implies cruelty; incisive implies precision.\nC — stylistic issues is opposite of the structural focus described.\nD — verbal vs. written is not what incisive means.\n\nKelime: incisive — keskin, zekice, konuya doğrudan giren"}, {"k": "vocab", "p": "Critics found the final act of the film <u>indulgent</u>, arguing that what might have served as a twenty-minute denouement had been stretched to nearly an hour through scenes that repeated emotional beats already established.", "q": "As used in the text, \"indulgent\" most nearly means:", "o": ["A) excessive and self-gratifying without justification", "B) technically accomplished but emotionally cold", "C) deliberately ambiguous in its resolution", "D) appealing to a narrow rather than general audience"], "a": 0, "e": "A is correct. Stretching twenty minutes to an hour by repeating established beats = gratuitously excessive. \"Indulgent\" = allowing excessive self-gratification without restraint.\n\nB — technically accomplished but cold is a different criticism.\nC — ambiguous resolution is a different problem.\nD — narrow appeal is not what indulgent describes.\n\nKelime: indulgent — hoşgörülü, aşırıya kaçan; kendine müsamahalı"}, {"k": "vocab", "p": "Despite the committee's urgent recommendations, the administration remained <u>inert</u> for months, neither implementing the proposed reforms nor offering a clear explanation for why action was being delayed.", "q": "As used in the text, \"inert\" most nearly means:", "o": ["A) opposed to the committee's recommendations", "B) lacking the authority to implement changes", "C) unable or unwilling to take action; inactive", "D) cautiously evaluating all options before committing"], "a": 2, "e": "C is correct. No implementation, no explanation = inactive, unresponsive. \"Inert\" = lacking the ability or strength to act.\n\nA — opposed implies active disagreement; inert implies absence of action.\nB — lacking authority is a specific cause, not the definition.\nD — careful evaluation implies a process; inert implies no process at all.\n\nKelime: inert — hareketsiz, eylemsiz, tepkisiz"}, {"k": "vocab", "p": "The philosopher argued that the tension between individual freedom and social obligation is not a historical accident but an <u>inherent</u> feature of political life — one that must be managed rather than resolved.", "q": "As used in the text, \"inherent\" most nearly means:", "o": ["A) growing more intense over time", "B) existing as a natural, inseparable part of something", "C) recognized only recently by political theorists", "D) caused by specific institutional failures"], "a": 1, "e": "B is correct. Not a historical accident but a permanent built-in feature = naturally, inseparably present. \"Inherent\" = existing in something as a permanent, essential attribute.\n\nA — growing in intensity implies change; inherent implies permanence.\nC — only recently recognized contradicts inherence.\nD — caused by institutional failures implies it could be removed; inherent implies it cannot.\n\nKelime: inherent — doğasında olan, ayrılmaz, içkin"}, {"k": "vocab", "p": "The investigation revealed that the early protests had been <u>instigated</u> not by local activists as initially reported, but by a coordinated campaign from outside the region that had exploited pre-existing economic grievances.", "q": "As used in the text, \"instigated\" most nearly means:", "o": ["A) suppressed through organized opposition", "B) documented by independent journalists", "C) brought about by incitement; provoked", "D) misrepresented in subsequent news coverage"], "a": 2, "e": "C is correct. Initiated through a coordinated campaign that exploited grievances = provoked, brought about. \"Instigate\" = to bring about or initiate through incitement.\n\nA — suppressed is the opposite.\nB — documented describes journalistic recording.\nD — misrepresented describes media coverage, not the origin.\n\nKelime: instigate — kışkırtmak, başlatmak, tetiklemek"}, {"k": "vocab", "p": "The <u>intrepid</u> journalist entered the conflict zone alone, without press credentials or official protection, to document the conditions in the border villages sealed off from outside reporters for months.", "q": "As used in the text, \"intrepid\" most nearly means:", "o": ["A) self-funded and operating independently", "B) experienced in reporting from difficult environments", "C) fearless in the face of danger; very brave", "D) ideologically committed to the story's subject"], "a": 2, "e": "C is correct. Entering alone without protection = fearless, brave. \"Intrepid\" = fearless; adventurously bold.\n\nA — self-funded is a logistical circumstance.\nB — experience is different from intrepidity.\nD — ideological commitment is a motivation, not the quality described.\n\nKelime: intrepid — cesur, korkusuz, yılmaz"}, {"k": "vocab", "p": "In the final chapter, the memoirist does not <u>lament</u> the opportunities she did not pursue in her youth — she frames them instead as preconditions that shaped the unexpected path her life actually took.", "q": "As used in the text, \"lament\" most nearly means:", "o": ["A) analyze systematically for their effects", "B) express deep grief or regret about", "C) justify or explain after the fact", "D) publicly acknowledge for the first time"], "a": 1, "e": "B is correct. Lament implies grief or regret; the memoirist chooses not to feel that. \"Lament\" = to express passionate grief or regret.\n\nA — analyze is neutral; lament is emotional.\nC — justify is a different activity.\nD — public acknowledgment is different from expressing grief.\n\nKelime: lament — ağıt yakmak, yanıp yakılmak; derin üzüntü"}, {"k": "vocab", "p": "Prolonged exposure to the heavy, humid air left the team <u>lethargic</u>, moving through tasks at half their usual pace and losing the thread of complex discussions that would have been effortless in a cooler environment.", "q": "As used in the text, \"lethargic\" most nearly means:", "o": ["A) unusually irritable due to physical discomfort", "B) sluggish and lacking energy or enthusiasm", "C) disoriented by unfamiliar surroundings", "D) focused only on immediate physical needs"], "a": 1, "e": "B is correct. Slow pace and difficulty with complex thinking = lacking energy. \"Lethargic\" = sluggish and apathetic; lacking energy.\n\nA — irritable is a different physical response.\nC — disoriented implies confusion about surroundings; lethargic implies low energy.\nD — focused on immediate needs is a different behavioral response.\n\nKelime: lethargic — uyuşuk, halsiz, üşengeç"}, {"k": "vocab", "p": "Even late in her illness, the novelist remained <u>lucid</u>, dictating precise edits to her assistant and engaging in sharp-minded discussions about the book's structure that showed no decline in her analytical powers.", "q": "As used in the text, \"lucid\" most nearly means:", "o": ["A) physically active despite illness", "B) clear and coherent in thought and expression", "C) emotionally resilient under difficult conditions", "D) creatively productive until the end of life"], "a": 1, "e": "B is correct. Precise edits and sharp analytical discussions = clear, coherent mind. \"Lucid\" = clearly expressed; able to think and express clearly.\n\nA — physical activity is different from cognitive clarity.\nC — emotional resilience is a different quality.\nD — creative productivity is not the specific quality of lucidity here.\n\nKelime: lucid — açık, anlaşılır, berrak; berrak düşünen"}, {"k": "vocab", "p": "Young children's understanding of social norms is highly <u>malleable</u>: with careful guidance, they can learn to question inherited biases and develop more flexible frameworks for interpreting unfamiliar situations.", "q": "As used in the text, \"malleable\" most nearly means:", "o": ["A) not yet fully developed from a cognitive standpoint", "B) capable of being shaped or influenced", "C) prone to accepting information uncritically", "D) easily distracted from sustained tasks"], "a": 1, "e": "B is correct. With guidance, their understanding can be changed — it is shapeable. \"Malleable\" = easily influenced or shaped; pliable.\n\nA — not fully developed is different; malleable implies capacity for shaping.\nC — uncritical acceptance implies passivity; malleable implies responsiveness to guidance.\nD — distraction is a different cognitive tendency.\n\nKelime: malleable — şekil verilebilir, esnek; etkilenmeye açık"}, {"k": "vocab", "p": "The archivist's restoration work was <u>meticulous</u>: each page was treated with a different chemical solution based on its specific composition, and the sequencing of interventions followed a protocol she had developed over decades.", "q": "As used in the text, \"meticulous\" most nearly means:", "o": ["A) innovative in the application of new techniques", "B) slow and methodical due to limited resources", "C) extremely careful and precise in attention to detail", "D) guided by historical convention rather than new methods"], "a": 2, "e": "C is correct. Different solutions per page, precise protocols = extreme care and precision. \"Meticulous\" = showing great attention to detail; very careful.\n\nA — innovation is a different quality.\nB — slowness due to resources is a different cause.\nD — historical convention is a different characteristic.\n\nKelime: meticulous — titiz, çok dikkatli, ayrıntılara özen gösteren"}, {"k": "vocab", "p": "The architects incorporated rooftop gardens and permeable paving to <u>mitigate</u> the urban heat island effect, reducing the temperature differential between the building complex and the surrounding parkland.", "q": "As used in the text, \"mitigate\" most nearly means:", "o": ["A) completely eliminate through design intervention", "B) measure accurately for planning purposes", "C) draw attention to for public awareness", "D) lessen the severity or intensity of"], "a": 3, "e": "D is correct. Reducing the temperature differential = making the problem less severe. \"Mitigate\" = to lessen the force or intensity of something harmful.\n\nA — eliminate is too strong; mitigate implies reduction, not removal.\nB — measure is a different activity.\nC — draw attention is a different goal.\n\nKelime: mitigate — hafifletmek, azaltmak, yumuşatmak"}, {"k": "vocab", "p": "The philosopher argued that philosophy's preoccupation with abstract systems had caused it to neglect the <u>mundane</u> — the everyday practices, habits, and decisions that constitute most of actual human life.", "q": "As used in the text, \"mundane\" most nearly means:", "o": ["A) morally ambiguous or difficult to evaluate", "B) relating to ordinary everyday life", "C) socially constructed rather than naturally given", "D) resistant to philosophical analysis"], "a": 1, "e": "B is correct. Everyday practices, habits, and decisions = the ordinary, everyday. \"Mundane\" = lacking interest or excitement; relating to everyday life.\n\nA — moral ambiguity is not what mundane describes.\nC — social construction is a philosophical position.\nD — resistant to analysis is not what mundane means.\n\nKelime: mundane — sıradan, olağan, gündelik"}, {"k": "vocab", "p": "A single flaw in the experimental design was enough to <u>negate</u> the study's primary finding: the contaminated control group meant the results could not distinguish the treatment's effect from the contamination's effect.", "q": "As used in the text, \"negate\" most nearly means:", "o": ["A) require the study to be redesigned", "B) make null or invalid; nullify", "C) reduce the significance of without eliminating", "D) attract critical attention from peer reviewers"], "a": 1, "e": "B is correct. The contamination makes the results invalid = nullified. \"Negate\" = to nullify; to make ineffective or invalid.\n\nA — requiring redesign is a consequence.\nC — reduce significance is weaker than negate implies.\nD — peer review is a process.\n\nKelime: negate — geçersiz kılmak, olumsuzlamak, çürütmek"}, {"k": "vocab", "p": "Within a decade, the file format had become <u>obsolete</u>: newer systems could not read it, most software no longer included support for it, and documents stored in it were effectively inaccessible.", "q": "As used in the text, \"obsolete\" most nearly means:", "o": ["A) widely criticized for its technical limitations", "B) gradually being replaced by an improved version", "C) no longer used or useful; out of date", "D) incompatible with certain operating systems only"], "a": 2, "e": "C is correct. Cannot be read, no longer supported, documents inaccessible = no longer used or useful. \"Obsolete\" = no longer produced or used; out of date.\n\nA — criticized implies active evaluation; obsolete implies simple non-use.\nB — gradually being replaced is part of the process, not the final state.\nD — incompatibility with some systems is a technical cause, not the definition.\n\nKelime: obsolete — eski moda, artık kullanılmayan, geçerliliğini yitirmiş"}, {"k": "vocab", "p": "The contract's indemnification clause was so <u>opaque</u> that the company's own lawyers spent three days debating what it actually required, concluding that its meaning depended entirely on which court interpreted it.", "q": "As used in the text, \"opaque\" most nearly means:", "o": ["A) unnecessarily lengthy and repetitive", "B) difficult to understand; not transparent in meaning", "C) legally unenforceable under current statute", "D) deliberately favorable to one party"], "a": 1, "e": "B is correct. Lawyers debated for three days and could not determine the meaning = unclear. \"Opaque\" (fig.) = difficult or impossible to understand.\n\nA — length is a different issue.\nC — unenforceable is a legal status.\nD — favorable to one party describes purpose, not clarity.\n\nKelime: opaque — anlaşılmaz, muğlak; ışık geçirmez"}, {"k": "vocab", "p": "The whistleblower found that, despite formal legal protections, she was effectively <u>ostracized</u> within her industry: job applications went unanswered, conference invitations stopped, and former colleagues no longer returned her messages.", "q": "As used in the text, \"ostracized\" most nearly means:", "o": ["A) subjected to formal legal proceedings", "B) excluded from a community or group; socially rejected", "C) systematically undermined within her organization", "D) denied professional development opportunities"], "a": 1, "e": "B is correct. Unanswered applications, no invitations, no responses = excluded from the professional community. \"Ostracize\" = to exclude from a group or society.\n\nA — legal proceedings are mentioned as insufficient; ostracism is the social exclusion despite legal protection.\nC — undermined within an organization is narrower.\nD — denied opportunities is a consequence, not the definition.\n\nKelime: ostracize — toplumdan dışlamak, reddetmek"}, {"k": "vocab", "p": "In aviation safety protocols, redundancy is <u>paramount</u>: every critical system must have a backup, every backup must have its own backup, and the failure of any single component must never cause a catastrophic outcome.", "q": "As used in the text, \"paramount\" most nearly means:", "o": ["A) widely recognized as effective", "B) required by regulatory authority", "C) most important; of supreme importance", "D) frequently discussed but rarely implemented"], "a": 2, "e": "C is correct. \"Every critical system must have a backup\" — redundancy is the top priority. \"Paramount\" = more important than anything else.\n\nA — widely recognized describes reception.\nB — regulatory requirement is a formal mandate; paramount is a statement of importance.\nD — frequently discussed but rarely implemented is the opposite of paramount.\n\nKelime: paramount — en önemli, başat, her şeyin üzerinde"}, {"k": "vocab", "p": "The professor's writing was <u>pedantic</u> in the worst sense: he devoted entire paragraphs to qualifications that readers did not need, cited obscure sources where standard ones would have sufficed, and buried his central insight in footnotes.", "q": "As used in the text, \"pedantic\" most nearly means:", "o": ["A) overly concerned with minor details or rules at the expense of clarity", "B) technically accurate but inaccessible to specialists", "C) well-researched but poorly organized", "D) deliberately challenging to conventional views"], "a": 0, "e": "A is correct. Unnecessary qualifications, obscure sources where simpler would do, insights buried in footnotes = excessive focus on minor details. \"Pedantic\" = excessively concerned with minor details or rules.\n\nB — inaccessible to specialists reverses the audience.\nC — poor organization is different from pedantry.\nD — challenging conventions is a different intellectual stance.\n\nKelime: pedantic — bilgiçlik taslayan, aşırı akademik, detaylara takılan"}, {"k": "vocab", "p": "The smell of baking bread <u>permeated</u> the entire building within minutes: it moved through the stairwells, slipped under doors, and reached even the top floors long before the loaves were taken out of the oven.", "q": "As used in the text, \"permeated\" most nearly means:", "o": ["A) was produced in unusually large quantities", "B) spread throughout; penetrated every part of", "C) was detected by individuals with heightened sensory awareness", "D) intensified as it moved further from its source"], "a": 1, "e": "B is correct. Moving through stairwells, under doors, to the top floors = spreading throughout. \"Permeate\" = to spread through; to penetrate every part of.\n\nA — large quantities is about the amount produced, not the spreading.\nC — detected by sensitive individuals describes a subset of those affected, not the spreading itself.\nD — intensifying as it moves further is the opposite of what typically happens with diffusion.\n\nKelime: permeate — sızmak, işlemek, yaygınlaşmak"}]}, {"n": 3, "topic": "Critical Thinking Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "Despite repeated rejections from publishers, the author chose to <u>persevere</u>, rewriting the manuscript three more times before finally finding an editor who recognized its merits.", "q": "As used in the text, \"persevere\" most nearly means:", "o": ["A) adapt the work to suit market demands", "B) continue steadfastly despite difficulty", "C) seek external validation before continuing", "D) consult collaborators to improve the work"], "a": 1, "e": "B is correct. Despite rejections, the author continued and rewrote three more times = continued steadfastly. \"Persevere\" = to continue steadfastly despite difficulty.\n\nA — adapting to market demands describes a different strategy.\nC — seeking validation is different from persevering alone.\nD — consulting collaborators is a different approach.\n\nKelime: persevere — ısrar etmek, kararlılıkla sürdürmek"}, {"k": "vocab", "p": "Rather than insisting on the ideal solution, the committee adopted a <u>pragmatic</u> approach, choosing reforms that could be implemented within the existing budget and were likely to gain stakeholder approval.", "q": "As used in the text, \"pragmatic\" most nearly means:", "o": ["A) cautious and inclined to avoid risk", "B) guided by practical considerations rather than ideals", "C) supported by empirical research", "D) consistent with established institutional practice"], "a": 1, "e": "B is correct. Choosing what can be done within constraints rather than the ideal = guided by practical considerations. \"Pragmatic\" = dealing with things realistically; practical rather than idealistic.\n\nA — cautious is different from pragmatic.\nC — empirical support is a different quality.\nD — consistent with established practice is different from being pragmatic.\n\nKelime: pragmatic — pratik, gerçekçi, uygulamaya dönük"}, {"k": "vocab", "p": "The strict confidentiality agreement signed by all participants <u>precluded</u> any public discussion of the proceedings, meaning that the committee's deliberations would remain entirely unknown to the press and the general public.", "q": "As used in the text, \"precluded\" most nearly means:", "o": ["A) discouraged but did not legally prohibit", "B) prevented; made impossible", "C) required formal approval before proceeding", "D) delayed pending review by a higher authority"], "a": 1, "e": "B is correct. The agreement made public discussion impossible. \"Preclude\" = to prevent from happening; to make impossible.\n\nA — discouraged implies it was still possible; precluded means impossible.\nC — required approval is a different procedural requirement.\nD — delayed implies temporary; precluded means permanently impossible.\n\nKelime: preclude — önlemek, engellemek, olanaksız kılmak"}, {"k": "vocab", "p": "Depression among college students is more <u>prevalent</u> than most campus surveys have historically captured, partly because stigma discourages self-reporting and partly because mild cases often go untreated and unrecorded.", "q": "As used in the text, \"prevalent\" most nearly means:", "o": ["A) severe in its clinical manifestations", "B) widely or commonly occurring", "C) resistant to available treatment options", "D) associated with specific demographic groups"], "a": 1, "e": "B is correct. More common than surveys have captured = widely occurring. \"Prevalent\" = widespread; occurring frequently.\n\nA — severity describes intensity, not frequency.\nC — treatment resistance is a different characteristic.\nD — associated with demographics is a different issue.\n\nKelime: prevalent — yaygın, sık görülen, hâkim olan"}, {"k": "vocab", "p": "The discovery had a <u>profound</u> effect on the field: it overturned assumptions that had been held for decades, opened entirely new lines of research, and forced theorists to rebuild their models from the ground up.", "q": "As used in the text, \"profound\" most nearly means:", "o": ["A) widely publicized beyond the academic community", "B) immediately practical in its applications", "C) deep and far-reaching in its effects", "D) contested by a significant number of specialists"], "a": 2, "e": "C is correct. Overturned decades of assumptions, opened new research, forced model rebuilding = deep and far-reaching. \"Profound\" = having or showing great depth of knowledge; very great or intense.\n\nA — wide publicity describes dissemination, not the quality of the effect.\nB — immediately practical is different; the discovery affected the theoretical field.\nD — contested by specialists is a different circumstance.\n\nKelime: profound — derin, köklü, çok büyük; derinlikli"}, {"k": "vocab", "p": "The poet was remarkably <u>prolific</u> despite working full-time as a teacher: she published eleven collections in twenty years and contributed to dozens of anthologies, while also corresponding extensively with other writers.", "q": "As used in the text, \"prolific\" most nearly means:", "o": ["A) financially successful through creative work", "B) producing a large body of work", "C) recognized internationally during her lifetime", "D) influential on subsequent generations of writers"], "a": 1, "e": "B is correct. Eleven collections, dozens of anthologies, extensive correspondence = producing large quantities of work. \"Prolific\" = producing many works, results, or offspring; highly productive.\n\nA — financial success is not what prolific describes.\nC — international recognition is a reception outcome, not a production quality.\nD — influence on subsequent generations is a legacy outcome.\n\nKelime: prolific — üretken, çok eser veren, verimli"}, {"k": "vocab", "p": "The timing of the announcement was <u>propitious</u>: the market had just recorded three consecutive weeks of gains, investor confidence was high, and no major competing products were scheduled for release that quarter.", "q": "As used in the text, \"propitious\" most nearly means:", "o": ["A) likely to produce favorable results; auspicious", "B) carefully selected after thorough analysis", "C) widely anticipated by industry observers", "D) aligned with the company's long-term strategy"], "a": 0, "e": "A is correct. Gains, high confidence, no competing releases = conditions that favor success. \"Propitious\" = giving or indicating a good chance of success; favorable.\n\nB — carefully selected describes the decision process, not the conditions.\nC — widely anticipated describes public expectation.\nD — aligned with strategy describes planning, not the favorability of conditions.\n\nKelime: propitious — elverişli, uygun, şansı getiren"}, {"k": "vocab", "p": "Given the market's volatility, the financial advisor considered it <u>prudent</u> to hold a larger-than-usual proportion of the portfolio in low-risk assets until conditions stabilized.", "q": "As used in the text, \"prudent\" most nearly means:", "o": ["A) required by fiduciary obligation", "B) acting with care and thought for consequences", "C) consistent with the investor's stated preferences", "D) approved by the relevant regulatory authority"], "a": 1, "e": "B is correct. Given volatility, holding low-risk assets = acting carefully and thinking about consequences. \"Prudent\" = acting with care and thought for the future.\n\nA — fiduciary obligation is a legal requirement; prudent is a judgment quality.\nC — consistent with preferences is a different consideration.\nD — regulatory approval is a formal process, not the meaning of prudent.\n\nKelime: prudent — tedbirli, ihtiyatlı, sağduyulu"}, {"k": "vocab", "p": "The defense attorney spent most of her closing argument attempting to <u>refute</u> the prosecution's forensic timeline, presenting new photographic evidence that she argued was inconsistent with the alleged sequence of events.", "q": "As used in the text, \"refute\" most nearly means:", "o": ["A) reinterpret in a more favorable light", "B) prove to be wrong or false", "C) delay the consideration of", "D) draw attention to inconsistencies in"], "a": 1, "e": "B is correct. Presenting new evidence to show the timeline was wrong = proving it to be false. \"Refute\" = to prove a statement or person to be wrong.\n\nA — reinterpret is more neutral; refute implies proving wrong.\nC — delay consideration is a procedural action.\nD — drawing attention to inconsistencies may be a method of refuting, but it is not the definition.\n\nKelime: refute — çürütmek, yanıtlamak, geçersiz kılmak"}, {"k": "vocab", "p": "Normally <u>reticent</u> in interviews, the author surprised journalists at the book launch by speaking openly about the autobiographical elements of the novel and the personal losses that had inspired its central themes.", "q": "As used in the text, \"reticent\" most nearly means:", "o": ["A) hostile toward media attention", "B) not revealing one's thoughts or feelings; reserved", "C) well-prepared but prone to distraction", "D) focused on professional rather than personal topics"], "a": 1, "e": "B is correct. Normally not speaking openly = reserved, not inclined to reveal personal thoughts. \"Reticent\" = not revealing one's thoughts or feelings readily.\n\nA — hostile implies active negative reaction; reticent is simply reserved.\nC — prepared but prone to distraction is a different quality.\nD — focusing on professional topics is a choice, not the quality of reticence.\n\nKelime: reticent — çekingen, az konuşan, ketum"}, {"k": "vocab", "p": "The investor's most <u>sagacious</u> decision turned out to be the one she made against the advice of her entire team: pulling out of the sector eighteen months before the regulatory changes that decimated her competitors.", "q": "As used in the text, \"sagacious\" most nearly means:", "o": ["A) emotionally driven and impossible to explain", "B) boldly contrary to consensus without justification", "C) having or showing keen mental discernment", "D) fortunate due to unforeseeable circumstances"], "a": 2, "e": "C is correct. Going against all advice and being proven right = showing keen perception and good judgment. \"Sagacious\" = having or showing keen mental discernment and good judgment.\n\nA — emotionally driven is the opposite of sagacious.\nB — contrary to consensus without justification implies irrationality; sagacious implies good judgment.\nD — fortunate due to luck is different from sagacious judgment.\n\nKelime: sagacious — basiretli, zeki, anlayışlı"}, {"k": "vocab", "p": "The auditors were instructed to <u>scrutinize</u> every transaction above ten thousand dollars for the previous three fiscal years, paying particular attention to transfers between subsidiaries in jurisdictions with limited disclosure requirements.", "q": "As used in the text, \"scrutinize\" most nearly means:", "o": ["A) record in a permanent audit log", "B) flag for external review", "C) examine very carefully and critically", "D) compare against industry benchmarks"], "a": 2, "e": "C is correct. Examining every transaction carefully with particular attention = careful critical examination. \"Scrutinize\" = to examine or inspect closely and thoroughly.\n\nA — record in a log is a documentation function.\nB — flag for external review is a procedural action.\nD — compare against benchmarks is a specific analytical method.\n\nKelime: scrutinize — dikkatlice incelemek, titizlikle gözden geçirmek"}, {"k": "vocab", "p": "Many economists remained <u>skeptical</u> of the central bank's projections, arguing that the assumptions underpinning the forecast were too optimistic and that three of the key variables had been mismodeled.", "q": "As used in the text, \"skeptical\" most nearly means:", "o": ["A) publicly opposed to the central bank's policies", "B) having doubts; not easily convinced", "C) formally disagreeing through institutional channels", "D) ideologically opposed to central banking in principle"], "a": 1, "e": "B is correct. Not convinced by the projections, arguing assumptions are too optimistic = having doubts, not easily persuaded. \"Skeptical\" = not easily convinced; having doubts or reservations.\n\nA — publicly opposed implies formal opposition; skeptical is an epistemic stance.\nC — formal institutional disagreement is a procedural action.\nD — ideological opposition is a principled rejection, not mere skepticism.\n\nKelime: skeptical — şüpheci, kuşkucu, ihtiyatlı"}, {"k": "vocab", "p": "The organization launched a public campaign to <u>solicit</u> donations from former students, emphasizing that even small contributions would help fund scholarships for the next generation of underrepresented applicants.", "q": "As used in the text, \"solicit\" most nearly means:", "o": ["A) require by formal obligation", "B) acknowledge with gratitude", "C) ask for or seek to obtain", "D) distribute through official channels"], "a": 2, "e": "C is correct. Launching a campaign to get donations = asking for, seeking to obtain. \"Solicit\" = to ask for or try to obtain something from someone.\n\nA — require by obligation implies compulsion; solicit implies a request.\nB — acknowledge with gratitude describes a response, not a request.\nD — distribute through channels describes outbound action.\n\nKelime: solicit — istemek, talep etmek, başvurmak"}, {"k": "vocab", "p": "The patient reported <u>sporadic</u> episodes of dizziness — sometimes twice a day for a week, then none for a month — making it difficult for the neurologist to identify any consistent trigger or pattern.", "q": "As used in the text, \"sporadic\" most nearly means:", "o": ["A) increasing in frequency over time", "B) occurring at irregular intervals; not continuous", "C) limited to a specific time of day", "D) associated with a particular physical activity"], "a": 1, "e": "B is correct. Sometimes twice a day, then none for a month = irregular, not continuous. \"Sporadic\" = occurring at irregular intervals; not steady or regular.\n\nA — increasing frequency is a trend; sporadic implies no consistent trend.\nC — limited to a specific time describes a trigger pattern not present here.\nD — associated with activity describes a trigger, not the pattern of occurrence.\n\nKelime: sporadic — ara sıra olan, düzensiz, aralıklı"}, {"k": "vocab", "p": "The organization's founder remained <u>steadfast</u> in her commitment to the original mission even as board members, donors, and staff urged her to pursue more commercially viable programming.", "q": "As used in the text, \"steadfast\" most nearly means:", "o": ["A) inflexible because of lack of imagination", "B) resolutely firm and unwavering", "C) cautious in the face of external pressure", "D) motivated primarily by personal conviction rather than consensus"], "a": 1, "e": "B is correct. Remaining committed despite pressure from all directions = resolutely firm and unwavering. \"Steadfast\" = resolutely or dutifully firm and unwavering.\n\nA — inflexibility due to lack of imagination implies a deficiency; steadfast implies principled commitment.\nC — cautious implies hesitation; steadfast implies firm continuation.\nD — personal conviction is a motivation, not the quality of steadfastness itself.\n\nKelime: steadfast — kararlı, sarsılmaz, yerinden oynamaz"}, {"k": "vocab", "p": "The new environmental regulations were among the most <u>stringent</u> in the region's history, setting emissions limits far below what most industries currently achieved and imposing automatic penalties for violations.", "q": "As used in the text, \"stringent\" most nearly means:", "o": ["A) controversial among affected industries", "B) requiring strict compliance; severe", "C) recently adopted without sufficient evidence", "D) applied selectively across different sectors"], "a": 1, "e": "B is correct. Far below current levels with automatic penalties = requiring strict compliance, severe. \"Stringent\" = strict, precise, and exacting.\n\nA — controversial describes reception, not the regulations themselves.\nC — recently adopted without evidence describes a criticism, not the meaning.\nD — selective application describes scope, not stringency.\n\nKelime: stringent — sıkı, katı, tavizsiz"}, {"k": "vocab", "p": "The empire did not merely defeat its rivals militarily; it sought to <u>subjugate</u> them entirely, replacing local administrative structures, suppressing native languages, and installing loyal governors at every level of regional authority.", "q": "As used in the text, \"subjugate\" most nearly means:", "o": ["A) negotiate a peace settlement with", "B) defeat and bring under complete control", "C) monitor continuously for signs of rebellion", "D) economically exploit through imposed trade terms"], "a": 1, "e": "B is correct. Replacing structures, suppressing languages, installing governors = bringing under complete control. \"Subjugate\" = to bring under domination or control, especially by conquest.\n\nA — negotiate settlement implies mutual terms; subjugate implies complete dominance.\nC — monitor for rebellion is one tool of subjugation, not the definition.\nD — economic exploitation is one aspect; subjugate is broader total control.\n\nKelime: subjugate — boyun eğdirmek, egemenlik altına almak"}, {"k": "vocab", "p": "The committee's report was admirably <u>succinct</u>: in six pages it conveyed all the findings, identified three actionable priorities, and included a summary table that allowed readers to grasp the conclusions at a glance.", "q": "As used in the text, \"succinct\" most nearly means:", "o": ["A) clearly organized with visual aids", "B) brief and clearly expressed", "C) accessible to non-specialist readers", "D) unanimous in its recommendations"], "a": 1, "e": "B is correct. Six pages conveying everything clearly = brief and clearly expressed. \"Succinct\" = briefly and clearly expressed.\n\nA — organized with visual aids is a formatting quality; succinct is about brevity of expression.\nC — accessible to non-specialists is a readability quality, not the definition.\nD — unanimous recommendations is about the committee's agreement, not the document's style.\n\nKelime: succinct — kısa ve öz, veciz, özlü"}, {"k": "vocab", "p": "The editor removed three entire chapters from the draft, arguing that they were <u>superfluous</u> — they added length and certain atmospheric details, but the book's argument was complete and fully convincing without them.", "q": "As used in the text, \"superfluous\" most nearly means:", "o": ["A) stylistically inconsistent with the rest of the book", "B) technically accurate but inaccessible to general readers", "C) unnecessary; more than what is needed", "D) originally written for a different purpose"], "a": 2, "e": "C is correct. Removed because the argument worked without them = unnecessary, more than needed. \"Superfluous\" = unnecessary; more than what is needed or wanted.\n\nA — stylistic inconsistency is a different editorial problem.\nB — inaccessible to general readers is a different concern.\nD — originally written for a different purpose is a different circumstance.\n\nKelime: superfluous — gereksiz, fazladan, fazla"}, {"k": "vocab", "p": "The investigative journalist spent four years pursuing the story, filing freedom-of-information requests, appealing denials, and cultivating sources inside the organization — a <u>tenacious</u> pursuit that eventually produced the exposé.", "q": "As used in the text, \"tenacious\" most nearly means:", "o": ["A) resourceful in finding alternative approaches", "B) holding fast; not giving up easily", "C) motivated by a desire for public recognition", "D) skilled in navigating institutional bureaucracy"], "a": 1, "e": "B is correct. Four years, repeated requests, appealing denials = not giving up. \"Tenacious\" = very determined; holding fast.\n\nA — resourcefulness describes a method; tenacious describes persistence itself.\nC — motivation for recognition is speculative and not implied.\nD — skill in bureaucracy describes a capability, not the quality of tenacity.\n\nKelime: tenacious — ısrarcı, azimli, sıkı tutunan"}, {"k": "vocab", "p": "The exhibition's appeal was partly its <u>transient</u> nature: it would be installed for exactly six weeks, after which the works would be dispersed to museums and private collections around the world, never to be shown together again.", "q": "As used in the text, \"transient\" most nearly means:", "o": ["A) accessible to a broad range of visitors", "B) dependent on temporary environmental conditions", "C) lasting only a short time; temporary", "D) composed of works from multiple international sources"], "a": 2, "e": "C is correct. Six weeks, then dispersed never to be shown together again = existing only for a short time. \"Transient\" = lasting only for a short time; temporary.\n\nA — accessible to broad audiences describes the visitor experience.\nB — dependent on temporary conditions is a different kind of temporariness.\nD — composed of international sources describes the collection's origins.\n\nKelime: transient — geçici, kısa ömürlü, geçip giden"}, {"k": "vocab", "p": "Within five years of its introduction, the device had become <u>ubiquitous</u>: it was used in offices, schools, hospitals, and homes across every economic tier, and it was difficult to imagine the routines of daily life without it.", "q": "As used in the text, \"ubiquitous\" most nearly means:", "o": ["A) affordable across different income levels", "B) present, appearing, or found everywhere", "C) well-regarded by both specialists and the general public", "D) regularly updated to maintain its relevance"], "a": 1, "e": "B is correct. Used across offices, schools, hospitals, and homes at every economic level = present everywhere. \"Ubiquitous\" = present, appearing, or found everywhere.\n\nA — affordable describes an economic quality.\nC — well-regarded describes reputation.\nD — regularly updated describes a maintenance quality.\n\nKelime: ubiquitous — her yerde olan, yaygın, kaçınılmaz"}, {"k": "vocab", "p": "The senator <u>vacillated</u> for weeks on the immigration bill, issuing statements that seemed supportive on Monday, raising objections on Wednesday, and requesting additional consultation by Friday — behavior that frustrated colleagues on both sides of the debate.", "q": "As used in the text, \"vacillated\" most nearly means:", "o": ["A) attempted to appear neutral to avoid political damage", "B) wavered indecisively between opposing positions", "C) sought compromise language that could satisfy both sides", "D) delayed action until the political climate became clearer"], "a": 1, "e": "B is correct. Supportive statements, then objections, then more consultation = wavering indecisively. \"Vacillate\" = to keep changing one's mind; to waver between alternatives.\n\nA — appearing neutral is a deliberate political strategy; vacillating is genuine indecision.\nC — seeking compromise language implies a constructive goal; vacillating implies indecision.\nD — delaying until conditions improve implies a deliberate wait; vacillating implies inability to decide.\n\nKelime: vacillate — kararsız kalmak, bocalamak, duraksamak"}, {"k": "vocab", "p": "The scientist's <u>vehement</u> denial of the allegations surprised even those who had not expected a quiet response: she called the accusations professionally irresponsible, demanded a public retraction, and threatened legal action.", "q": "As used in the text, \"vehement\" most nearly means:", "o": ["A) legally informed and strategically precise", "B) showing strong feeling; intensely forceful", "C) widely supported by colleagues in the field", "D) calm and systematic in its methodology"], "a": 1, "e": "B is correct. Called accusations irresponsible, demanded retraction, threatened legal action = intensely forceful, showing strong feeling. \"Vehement\" = showing strong feeling; forceful, passionate.\n\nA — legally informed describes the content of the response, not its quality.\nC — supported by colleagues describes external support.\nD — calm and systematic is the opposite of vehement.\n\nKelime: vehement — şiddetli, ateşli, hararetli"}]}, {"n": 4, "topic": "Literature & Arts Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The contract was so <u>verbose</u> that the standard summary version, itself twenty pages long, was required by the company's legal team before any executive would agree to read the full document.", "q": "As used in the text, \"verbose\" most nearly means:", "o": ["A) technically precise at the expense of readability", "B) using more words than necessary; wordy", "C) deliberately vague to preserve flexibility", "D) written for an audience with specialist knowledge"], "a": 1, "e": "B is correct. So long it required a twenty-page summary = using more words than necessary. \"Verbose\" = using or expressed in more words than needed.\n\nA — technically precise is a different quality.\nC — deliberately vague describes clarity, not length.\nD — written for specialists describes the audience, not the writing style.\n\nKelime: verbose — fazla kelime kullanan, uzun soluklu, sözcük cömbertiği"}, {"k": "vocab", "p": "After months of testing, only two of the seven proposed designs remained <u>viable</u>: the others had been eliminated for exceeding the weight limit, failing structural stress tests, or proving too expensive to manufacture at scale.", "q": "As used in the text, \"viable\" most nearly means:", "o": ["A) capable of being done or working successfully", "B) preferred by the engineering team for aesthetic reasons", "C) consistent with the client's original specifications", "D) supported by sufficient empirical data"], "a": 0, "e": "A is correct. The others were eliminated for specific disqualifying reasons; these two still work = capable of working successfully. \"Viable\" = capable of working successfully; feasible.\n\nB — preferred for aesthetic reasons describes a preference, not viability.\nC — consistent with specifications is a requirement, not the definition of viable.\nD — supported by data is a criterion, not the definition.\n\nKelime: viable — uygulanabilir, gerçekleştirilebilir, yaşayabilir"}, {"k": "vocab", "p": "Border agents were instructed to remain especially <u>vigilant</u> during the holiday period, when historically higher passenger volumes had provided cover for attempts to circumvent customs inspections.", "q": "As used in the text, \"vigilant\" most nearly means:", "o": ["A) present in greater numbers than usual", "B) keenly watchful to detect danger; alert", "C) following an expanded checklist of procedures", "D) coordinating with counterparts across jurisdictions"], "a": 1, "e": "B is correct. Remaining watchful
