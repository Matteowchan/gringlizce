t","stem":"The treatment protocol that the clinic developed was far from orthodox: it combined techniques from three distinct disciplines and arrived at dosages that most practitioners in the field would have considered outside the accepted range.  As used in the text, \"orthodox\" most nearly means:","ans":"B","slug":"gri-mod-sat-v8-1-8"},{"n":9,"choices":{"D":"stated or appearing to be true, but not necessarily so","C":"consistent with the executive's prior visits to other regions","B":"understood as such by all parties involved","A":"communicated through formal organizational channels"},"ans":"D","why":"D is correct. The stated reason was sales review, but the real purpose was different = appearing to be true, but not necessarily so. \"Ostensible\" = stated or appearing to be true, but not necessarily so.  A — communicated through formal channels describes the medium.  B — understood as such by all parties implies shared awareness.  C — consistent with prior visits is a pattern observation.  Kelime: ostensible — görünürdeki, sözde, zahiren","slug":"gri-mod-sat-v8-1-9","stem":"The ostensible reason for the executive's visit was to review the regional sales figures, but the conversations she held with local managers suggested that the real purpose was assessing the viability of the regional office's closure.  As used in the text, \"ostensible\" most nearly means:"},{"choices":{"A":"widely quoted in specialist and popular media","B":"professionally motivated by a conflict of interest","D":"prepared to accept the reputational consequences of criticism","C":"frank in stating one's opinions; not holding back"},"n":10,"why":"C is correct. Published a detailed rebuttal quickly, organized peers = frank, not holding back opinions. \"Outspoken\" = frank in stating one's opinions; not holding back.  A — widely quoted describes visibility, not the quality of speaking.  B — motivated by conflict of interest implies ulterior motivation.  D — prepared to accept consequences is a character quality separate from outspokenness.  Kelime: outspoken — açık sözlü, düşündüklerini söyleyen, sesi yüksek çıkan","stem":"The scientist was among the most outspoken critics of the study's methodology, publishing a detailed rebuttal within days of the original paper's release and organizing a roundtable of peers to examine its statistical claims.  As used in the text, \"outspoken\" most nearly means:","ans":"C","slug":"gri-mod-sat-v8-1-10"},{"choices":{"C":"cautious about the political implications of funding decisions","D":"selective about the types of projects it chose to support","A":"excessively unwilling to spend; overly frugal","B":"methodical in its review process"},"n":11,"why":"A is correct. Long reviews, small awards relative to endowment, no overhead = excessively unwilling to spend. \"Parsimonious\" = unwilling to spend money or use resources; excessively frugal.  B — methodical describes the process, not the spending disposition.  C — politically cautious is a different concern.  D — selective about projects describes a curatorial stance.  Kelime: parsimonious — cimri, eli sıkı, tutumlu (aşırı ölçüde)","slug":"gri-mod-sat-v8-1-11","stem":"The foundation had developed a reputation for being parsimonious with its grants: proposals were evaluated over months, the awards were small relative to the organization's endowment, and overhead support was rarely included.  As used in the text, \"parsimonious\" most nearly means:","ans":"A"},{"ans":"B","slug":"gri-mod-sat-v8-1-12","why":"B is correct. Conclusions predetermined, contrary evidence excluded = prejudiced in favor of a particular side. \"Partisan\" = prejudiced in favor of a particular cause or side; biased.  A — based on limited evidence is an evidentiary critique.  C — professional conflicts of interest is a specific bias source.  D — released at a strategic moment describes timing, not the report's quality.  Kelime: partisan — tarafgir, parti yanlısı, tek taraflı","stem":"The report was criticized as partisan by representatives from the opposing party, who argued that its conclusions had been predetermined and that contrary evidence had been systematically excluded from the analysis.  As used in the text, \"partisan\" most nearly means:","n":12,"choices":{"A":"based on limited rather than comprehensive evidence","B":"prejudiced in favor of a particular cause; biased","C":"written by individuals with professional conflicts of interest","D":"released at a politically strategic moment"}},{"ans":"D","stem":"The architect had a well-known penchant for structural contrasts: her most celebrated buildings paired materials that would conventionally be kept separate — stone next to glass, raw steel beside polished marble.  As used in the text, \"penchant\" most nearly means:","slug":"gri-mod-sat-v8-1-13","why":"D is correct. Well-known for always doing something = a strong or habitual liking. \"Penchant\" = a strong or habitual liking for something.  A — principled theoretical commitment implies a philosophical basis.  B — technical skill describes ability, not preference.  C — intention to challenge convention describes a goal.  Kelime: penchant — eğilim, düşkünlük, yatkınlık","n":13,"choices":{"B":"a technical skill developed through extended practice","A":"a principled theoretical commitment to a design philosophy","C":"an intention to challenge conventional architectural standards","D":"a strong or habitual liking for something"}},{"choices":{"A":"legally cautious in avoiding admissions that could increase liability","B":"designed to satisfy the minimum requirements of the regulatory response","C":"feeling or showing regret for wrongdoing; repentant","D":"strategically sincere to rebuild consumer confidence"},"n":14,"stem":"The statement the company released was penitent in tone — acknowledging that the data breach had resulted from negligence, expressing regret for the harm caused, and committing to a third-party security review.  As used in the text, \"penitent\" most nearly means:","slug":"gri-mod-sat-v8-1-14","why":"C is correct. Acknowledged negligence, expressed regret, committed to change = feeling and showing regret for wrongdoing. \"Penitent\" = feeling or showing sorrow and regret for having done wrong.  A — legally cautious is a strategic approach that would produce a very different statement.  B — minimum regulatory satisfaction is a compliance concern.  D — strategically sincere implies calculation; penitent implies genuine regret.  Kelime: penitent — pişman, günahına tövbe eden, nedamet duyan","ans":"C"},{"slug":"gri-mod-sat-v8-1-15","choices":{"C":"intensifying in proportion to the duration of the crisis","D":"invisible to senior leadership despite its effects on staff","B":"expressed differently depending on the individual's seniority","A":"spreading throughout; present in every part"},"n":15,"stem":"The sense of uncertainty was pervasive across the organization: it showed up in how managers worded their emails, how staff approached new projects, and how often employees sought informal confirmation before taking initiative.  As used in the text, \"pervasive\" most nearly means:","why":"A is correct. Showed up in emails, project approaches, and behavior = spreading throughout, present everywhere. \"Pervasive\" = spreading widely throughout; present everywhere.  B — varying by seniority describes differentiation.  C — intensifying proportionally implies a trend.  D — invisible to leadership is a specific observation about awareness.  Kelime: pervasive — yaygın, her yerde bulunan, işleyen","ans":"A"},{"choices":{"A":"legally sufficient to create reasonable doubt","B":"independently verified by a reliable third party","C":"seeming reasonable or probable; believable","D":"more convincing than the prosecution's account"},"n":16,"stem":"The defense attorney presented a plausible alternative explanation for her client's presence near the scene: a dentist appointment three blocks away, confirmed by office records and consistent with the timing established by surveillance footage.  As used in the text, \"plausible\" most nearly means:","why":"C is correct. Dentist appointment, office records, consistent timing = seeming reasonable and believable. \"Plausible\" = seeming reasonable or probable; giving an appearance of truth.  A — legally sufficient to create doubt is a legal standard.  B — independently verified is a corroboration standard.  D — more convincing than the prosecution is a comparative judgment.  Kelime: plausible — makul, inandırıcı, olası görünen","slug":"gri-mod-sat-v8-1-16","ans":"C"},{"choices":{"D":"overwhelm with a response the authors had not anticipated","C":"generate passionate support that quickly subsides","A":"divide sharply into opposing groups","B":"confuse by presenting insufficient information"},"n":17,"why":"A is correct. One bloc fully supporting, another fully opposing = divided sharply into opposing camps. \"Polarize\" = to divide or cause to divide into two sharply contrasting groups.  B — confuse by insufficient information is a different effect.  C — passionate support that subsides describes a temporary reaction.  D — overwhelm with an unexpected response is a different dynamic.  Kelime: polarize — kutuplaştırmak, keskin bir biçimde bölmek","slug":"gri-mod-sat-v8-1-17","stem":"The proposal did not generate the measured debate its authors had hoped for — instead, it polarized the council immediately, with one bloc supporting the measure without qualification and another opposing it with equal firmness.  As used in the text, \"polarize\" most nearly means:","ans":"A"},{"n":18,"choices":{"C":"delayed until the details of the merger became clearer","D":"caused suddenly; brought about quickly","B":"intensified beyond what the announcement had suggested","A":"followed as a predictable consequence"},"ans":"D","slug":"gri-mod-sat-v8-1-18","why":"D is correct. Announcement caused a wave of resignations immediately = caused suddenly. \"Precipitate\" (v.) = to cause an event or situation to happen suddenly or sooner than expected.  A — followed as a predictable consequence describes an expected sequence; precipitate implies suddenness.  B — intensified beyond expectations describes a degree, not a causation.  C — delayed until details became clearer is the opposite of precipitate.  Kelime: precipitate — neden olmak, tetiklemek; acele eden, aceleci","stem":"The announcement of the merger precipitated a wave of resignations, with senior staff citing uncertainty about their roles, changes to their reporting structures, and concerns about the acquiring company's culture.  As used in the text, \"precipitated\" most nearly means:"},{"choices":{"C":"not securely held; dependent on uncertain conditions","D":"more severe than similar organizations had previously experienced","B":"privately acknowledged as serious but managed in public communications","A":"deteriorating at a rate that would require intervention within a year"},"n":19,"stem":"The organization's financial position had become precarious: its reserves covered only two months of operating costs, its largest funder had signaled it might not renew, and a key revenue stream was under legal challenge.  As used in the text, \"precarious\" most nearly means:","slug":"gri-mod-sat-v8-1-19","why":"C is correct. Reserves limited, funder uncertain, revenue challenged = not securely held, dependent on uncertain conditions. \"Precarious\" = not securely held; dependent on chance; uncertain.  A — deteriorating at a specific rate is a temporal assessment.  B — managed in public communications is a communications strategy.  D — more severe than others have experienced is a comparative claim.  Kelime: precarious — tehlikeli, güvensiz, dengesiz","ans":"C"},{"slug":"gri-mod-sat-v8-1-20","why":"B is correct. Solved a challenge for students five years older = ability developed earlier than is usual. \"Precocious\" = having developed certain abilities earlier than is usual.  A — independently developed is a different quality.  C — visible only to specialists is a different observation.  D — likely to diminish is a speculative outcome.  Kelime: precocious — erken gelişen, yaşına göre ileri","stem":"The child's precocious mathematical ability was recognized when she solved a problem on the classroom board that her teacher had been using as an end-of-term challenge for students five years older.  As used in the text, \"precocious\" most nearly means:","ans":"B","choices":{"D":"likely to diminish as more advanced material was introduced","C":"immediately visible to specialists but not to general observers","A":"independently developed rather than formally taught","B":"having developed certain abilities earlier than is usual"},"n":20},{"stem":"It seemed presumptuous for a first-year analyst to question the assumptions behind a model that the firm's senior partners had been refining for a decade, and several of her colleagues suggested she raise her concerns privately.  As used in the text, \"presumptuous\" most nearly means:","why":"A is correct. A first-year questioning a decade-old model from senior partners = overstepping one's position, too bold. \"Presumptuous\" = overstepping what is right or proper; failing to observe social boundaries.  B — uninformed is a knowledge issue, not a presumption issue.  C — failing to observe conventions describes social behavior broadly.  D — desire to attract attention speculates about motivation.  Kelime: presumptuous — küstah, kendini fazla sayan, haddi olmayan","slug":"gri-mod-sat-v8-1-21","ans":"A","choices":{"B":"uninformed due to limited professional experience","A":"overstepping one's position; too bold or assuming","C":"failing to behave according to accepted conventions","D":"motivated by a desire to attract attention from senior leadership"},"n":21},{"stem":"The firm's founder had been generous to the point of being prodigal in the early years, funding every project that showed any promise and underwriting the personal research costs of staff who had no institutional budget to draw on.  As used in the text, \"prodigal\" most nearly means:","why":"C is correct. Funding every promising project, underwriting personal research = recklessly extravagant, spending without restraint. \"Prodigal\" = spending money or resources freely and recklessly; wastefully extravagant.  A — invested in talented individuals implies intentional development.  B — excessive expectations of output is a different characteristic.  D — indiscriminate in quality describes curatorial judgment.  Kelime: prodigal — savurgan, müsrif; müsrif kişi","slug":"gri-mod-sat-v8-1-22","ans":"C","choices":{"B":"excessive in its expectations of staff output","A":"invested in the development of talented individuals","C":"recklessly extravagant with money or resources","D":"indiscriminate in the quality of projects it supported"},"n":22},{"choices":{"B":"resist correction despite evidence to the contrary","A":"evolve into more sophisticated forms over time","D":"migrate across different communication channels","C":"increase rapidly in number and spread widely"},"n":23,"slug":"gri-mod-sat-v8-1-23","why":"C is correct. Outstripping fact-checking capacity, only a fraction addressed = increasing rapidly and spreading widely. \"Proliferate\" = to increase rapidly in number; to spread extensively.  A — evolve into more sophisticated forms is a qualitative change.  B — resist correction is a characteristic of misinformation but not what proliferate means.  D — migrate across channels is a distribution pattern.  Kelime: proliferate — çoğalmak, yaygınlaşmak, hızla artmak","stem":"Social media platforms have allowed misinformation to proliferate at a pace that outstrips the capacity of fact-checking organizations, which can typically address only a small fraction of the false claims that circulate in a given week.  As used in the text, \"proliferate\" most nearly means:","ans":"C"},{"slug":"gri-mod-sat-v8-1-24","stem":"The editorial's suggestion that the city should consider dissolving its public transit authority immediately provoked a public outcry, with transit unions, advocacy organizations, and several council members all issuing statements of opposition within twenty-four hours.  As used in the text, \"provoked\" most nearly means:","why":"B is correct. Immediately caused unions, organizations, and council members to respond = stimulated a reaction. \"Provoke\" = to stimulate or give rise to a reaction.  A — confirmed fears describes a specific emotional response.  C — generated an unintended debate implies the editorial board's surprise.  D — attracted disproportionate coverage describes a media outcome.  Kelime: provoke — kışkırtmak, tahrik etmek, neden olmak","ans":"B","choices":{"A":"confirmed the fears of those who had opposed the editorial","B":"stimulated a reaction; caused a response","D":"attracted media coverage disproportionate to the editorial's readership","C":"generated a debate that the editorial board had not intended"},"n":24},{"choices":{"B":"refute by presenting contradictory evidence","A":"put an end to; suppress or subdue","C":"redirect toward a more constructive topic","D":"satisfy through a transparent explanation"},"n":25,"stem":"The administration's announcement was intended to quell the mounting speculation about leadership changes, but by addressing only some of the concerns in circulation, it actually intensified interest in the ones it left unaddressed.  As used in the text, \"quell\" most nearly means:","why":"A is correct. Intended to end the speculation, but failed because it only addressed some concerns = intended to suppress or put an end to. \"Quell\" = to put an end to; to suppress or subdue.  B — refute by presenting evidence is a different approach.  C — redirect toward constructive topics is a different communication strategy.  D — satisfy through transparency is a different goal.  Kelime: quell — bastırmak, yatıştırmak, sona erdirmek","slug":"gri-mod-sat-v8-1-25","ans":"A"}]}],"id":"v8"},{"id":"v9","group":"Kelime","blocks":[{"t":"p","x":"SAT kelime â Rhetoric & Expression Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"n":1,"choices":{"A":"document for future reference","B":"assess the cost of addressing","C":"formally disclose to affected parties","D":"put right; correct a fault or error"},"ans":"D","stem":"The engineering team was given thirty days to rectify the structural deficiencies identified in the inspection, after which a reinspection would determine whether the building was safe to occupy.  As used in the text, \"rectify\" most nearly means:","slug":"gri-mod-sat-v9-1-1","why":"D is correct. Given thirty days to correct deficiencies = put right, correct. \"Rectify\" = to put right; to correct.  A — document is a different activity.  B — assess the cost is an evaluation, not a correction.  C — formally disclose is a transparency action.  Kelime: rectify — düzeltmek, gidermek, telafi etmek"},{"choices":{"B":"place under external rather than internal oversight","A":"merge with a similar department for efficiency","C":"restructure with reduced staffing and resources","D":"assign to a lower position or less important role"},"n":2,"why":"D is correct. Moved from a standalone direct-report to a sub-department = assigned to a lower, less important role. \"Relegate\" = to assign to an inferior position.  A — merge for efficiency describes a different change.  B — place under external oversight is a different structural shift.  C — reduce staffing describes a resource change.  Kelime: relegate — düşürmek, geri plana itmek, alt seviyeye indirmek","slug":"gri-mod-sat-v9-1-2","stem":"The new organizational structure relegated environmental compliance to a sub-department of operations, rather than maintaining it as a standalone function reporting directly to the executive team.  As used in the text, \"relegate\" most nearly means:","ans":"D"},{"n":3,"choices":{"A":"acknowledged as authentic but disputed its interpretation","B":"reported to the relevant authority for investigation","D":"corrected by releasing an updated version","C":"refused to accept; rejected as false or wrong"},"ans":"C","slug":"gri-mod-sat-v9-1-3","why":"C is correct. Never seen it, misrepresents her positions = refused to accept, rejected as false. \"Repudiate\" = to refuse to accept; to reject as false.  A — acknowledged but disputed interpretation is a different response.  B — reported for investigation is a different action.  D — corrected by releasing an update implies the original was hers.  Kelime: repudiate — reddetmek, kabul etmemek, inkar etmek","stem":"The senator publicly repudiated the document that had been circulating under her name, stating that she had never seen it, that it misrepresented her positions, and that she would seek legal advice regarding its origin.  As used in the text, \"repudiated\" most nearly means:"},{"slug":"gri-mod-sat-v9-1-4","choices":{"A":"protected from the worst effects of economic disruption","B":"able to recover quickly from difficult conditions","D":"unified in its political response to external pressures","C":"resourceful in finding alternative sources of income"},"n":4,"stem":"What made the community resilient in the face of the economic disruption was not the absence of hardship but its dense social networks, which enabled residents to share resources, information, and emotional support across households.  As used in the text, \"resilient\" most nearly means:","why":"B is correct. Dense networks enabling recovery = able to recover quickly from difficult conditions. \"Resilient\" = able to withstand or recover quickly from difficult conditions.  A — protected from the worst effects implies prevention; resilient implies recovery.  C — resourceful in finding income is a specific coping mechanism.  D — unified in political response is a different expression of collective strength.  Kelime: resilient — dayanıklı, çabuk toparlanan, esnekliği olan","ans":"B"},{"choices":{"A":"a technique of public speaking developed in classical antiquity","B":"language designed to have a persuasive or impressive effect but lacking substance","C":"language that draws on widely shared cultural symbols","D":"political communication aimed at specific demographic groups"},"n":5,"stem":"The candidate's speech was long on rhetoric and short on specifics: it invoked values that virtually everyone shared — fairness, opportunity, community — while offering no concrete policy proposal on any of the issues it raised.  As used in the text, \"rhetoric\" most nearly means:","why":"B is correct. Invoked shared values without concrete proposals = language designed to be impressive but lacking substance. \"Rhetoric\" = language designed to have a persuasive or impressive effect, often perceived as lacking sincerity.  A — classical speaking technique describes the academic discipline of rhetoric.  C — drawing on cultural symbols is a specific technique within rhetoric.  D — targeting demographic groups describes audience strategy.  Kelime: rhetoric — retorik, söylev sanatı; boş söz, lafazanlık","slug":"gri-mod-sat-v9-1-5","ans":"B"},{"slug":"gri-mod-sat-v9-1-6","n":6,"choices":{"A":"involving only the most basic elements; undeveloped","B":"promising in concept but not yet technically feasible","D":"limited by the resources available at the current project stage","C":"functional in controlled environments but not in the field"},"ans":"A","why":"A is correct. Could perform the core function but with manual input, slow processing, high error rates = only the most basic elements, undeveloped. \"Rudimentary\" = involving or limited to basic principles; undeveloped.  B — promising but not feasible is a different assessment.  C — functional in controlled environments only describes a specific limitation.  D — limited by resources describes a constraint.  Kelime: rudimentary — ilkel, temel, basit, gelişmemiş","stem":"The prototype was still rudimentary: it could perform the core function the team had designed it for, but the interface required manual input at every step, the processing was slow, and the error rate made it unusable in practice.  As used in the text, \"rudimentary\" most nearly means:"},{"why":"D is correct. Chose not to approve the acquisition = refused to give official permission. \"Sanction\" (v.) = to give official permission or approval for.  A — impose penalties is the other meaning of sanction; context here is about approval.  B — formally evaluate is a prior step.  C — publicly announce is a disclosure action.  Kelime: sanction — onaylamak, yetki vermek; yaptırım uygulamak","slug":"gri-mod-sat-v9-1-7","stem":"The board chose not to sanction the proposed acquisition, citing concerns about debt levels, the target company's pending litigation, and the strategic fit with the firm's existing business lines.  As used in the text, \"sanction\" most nearly means:","ans":"D","choices":{"A":"impose penalties in response to prohibited behavior","B":"formally evaluate before committing resources","D":"give official permission or approval for","C":"publicly announce in a regulated filing"},"n":7},{"slug":"gri-mod-sat-v9-1-8","why":"D is correct. Contrived plot, wooden dialogue, exhausted metaphor, failed conclusion = devastatingly severe and critical. \"Scathing\" = witheringly scornful; severely critical.  A — detailed and methodical describes structure, not severity.  B — biased by personal dislike is a possible explanation for scathing criticism.  C — likely to damage future prospects is a consequence.  Kelime: scathing — yakıcı, sert, amansız eleştiren","stem":"The reviewer's scathing assessment of the novel spared nothing: the plot was described as contrived, the dialogue as wooden, the central metaphor as exhausted, and the book's conclusion as a failure of narrative courage.  As used in the text, \"scathing\" most nearly means:","ans":"D","choices":{"B":"biased by the reviewer's personal dislike of the genre","A":"detailed and methodically organized","C":"likely to damage the author's prospects for future publication","D":"devastatingly severe and critical"},"n":8},{"slug":"gri-mod-sat-v9-1-9","ans":"B","stem":"The scientist's healthy skepticism about the data proved valuable: by questioning assumptions the rest of the team had accepted, she identified a calibration error that had been distorting the results for six weeks.  As used in the text, \"skepticism\" most nearly means:","why":"B is correct. Questioning assumptions the team accepted = a questioning attitude, doubting accepted conclusions. \"Skepticism\" = a questioning or doubting attitude.  A — refusal to accept authority is a more extreme form.  C — independent data verification is a methodological practice.  D — professional disagreement within norms is a behavioral description.  Kelime: skepticism — şüphecilik, kuşkuculuk","n":9,"choices":{"A":"a principled refusal to accept authority-based claims","B":"a questioning attitude; doubt regarding accepted conclusions","D":"professional disagreement expressed within established norms","C":"the methodological practice of independent data verification"}},{"choices":{"A":"based on outdated rather than current economic theory","B":"too abstract to be evaluated against empirical evidence","D":"superficially plausible but actually wrong","C":"deliberately constructed to mislead without explicitly lying"},"n":10,"slug":"gri-mod-sat-v9-1-10","why":"D is correct. Sounded convincing but underlying assumptions were wrong = superficially plausible but actually wrong. \"Specious\" = superficially plausible, but actually wrong.  A — outdated theory is a source of error, not the quality of speciousness.  B — too abstract for evaluation is a different problem.  C — deliberately misleading implies intent; specious can be unintentional.  Kelime: specious — yanıltıcı görünen ama yanlış olan, sahte ikna edici","stem":"The argument was specious: it sounded convincing because it used the vocabulary of economic efficiency, but the underlying assumptions had been disproven by every major empirical study in the field.  As used in the text, \"specious\" most nearly means:","ans":"D"},{"choices":{"D":"suggestive of a relationship that requires further investigation","C":"not genuine; false or misleading","B":"widely reported despite being methodologically suspect","A":"visible in the data but not explained by any theory"},"n":11,"why":"C is correct. Both driven by a third variable (heat/summer), not a real relationship = false, not genuine. \"Spurious\" = not genuine; based on false or misleading reasoning.  A — unexplained by any theory is a different scientific status.  B — widely reported despite suspicion describes dissemination.  D — requiring further investigation is a different scientific response.  Kelime: spurious — asılsız, sahte, temelsiz","slug":"gri-mod-sat-v9-1-11","stem":"The correlation between ice cream sales and crime rates is spurious: both increase in summer because of the heat and increased outdoor activity, not because one causes the other.  As used in the text, \"spurious\" most nearly means:","ans":"C"},{"choices":{"B":"performing below comparable regional economies","A":"declining slowly due to structural disadvantages","C":"showing no activity, growth, or development","D":"dependent on sectors particularly vulnerable to external shocks"},"n":12,"stem":"The region's economy had been stagnant for over a decade: GDP growth had averaged less than half a percent annually, unemployment had barely changed, and none of the infrastructure investment that had been proposed had materialized.  As used in the text, \"stagnant\" most nearly means:","why":"C is correct. No GDP growth, unchanged unemployment, no infrastructure = no activity, growth, or development. \"Stagnant\" = having no activity, growth, or development.  A — declining slowly implies negative trend; stagnant implies no movement.  B — below comparable regions describes relative performance.  D — dependent on vulnerable sectors describes structural risk.  Kelime: stagnant — durgun, hareketsiz, gelişmeyen","slug":"gri-mod-sat-v9-1-12","ans":"C"},{"stem":"Advocates argued that the legislation would stigmatize individuals seeking treatment for addiction, creating a public record that could affect employment and housing prospects long after the person had recovered.  As used in the text, \"stigmatize\" most nearly means:","slug":"gri-mod-sat-v9-1-13","why":"A is correct. Creating a public record affecting future prospects = marking as disgraceful, causing to be viewed with shame. \"Stigmatize\" = to regard or treat as worthy of disgrace.  B — deter from services is a consequence.  C — expose to legal liability is a different concern.  D — reduce insurance coverage is a financial consequence.  Kelime: stigmatize — damgalamak, damga vurmak, aşağılamak","ans":"A","choices":{"C":"expose to legal liability for health-related decisions","D":"reduce access to insurance coverage for treatment","A":"mark as disgraceful; cause to be regarded with shame","B":"deter individuals from seeking available services"},"n":13},{"stem":"The commander's stoic response to the news — a single nod, then a quiet request to be given thirty minutes alone — was widely interpreted as a sign of profound self-control rather than an absence of feeling.  As used in the text, \"stoic\" most nearly means:","slug":"gri-mod-sat-v9-1-14","why":"A is correct. Single nod, quiet request = enduring difficulty without outwardly showing feelings. \"Stoic\" = enduring pain or hardship without showing feelings.  B — trained to suppress is an explanation, not the quality itself.  C — accustomed to difficult news describes experience.  D — composed because of prior anticipation is a different explanation.  Kelime: stoic — stoik, acıya katlanmayı bilen, duygusunu belli etmeyen","ans":"A","choices":{"B":"trained to suppress emotional responses in professional contexts","A":"enduring pain or difficulty without showing feelings","C":"accustomed to delivering and receiving difficult news","D":"composed due to having anticipated the outcome"},"n":14},{"slug":"gri-mod-sat-v9-1-15","why":"C is correct. Praised by one, criticized by another with neither provably correct = based on personal feelings, not objective. \"Subjective\" = based on or influenced by personal feelings or opinions.  A — requiring specialized training is a different epistemological issue.  B — influenced by context is a different source of variability.  D — valid only within a specific culture is cultural relativism.  Kelime: subjective — öznel, kişisel, bireysel","stem":"Evaluating the quality of creative writing is inevitably subjective: the same passage might be praised for its ambiguity by one reader and criticized for its obscurity by another, with neither judgment provably correct.  As used in the text, \"subjective\" most nearly means:","ans":"C","choices":{"A":"requiring specialized training to assess reliably","B":"influenced by the context in which the work is read","C":"based on personal feelings or opinions; not objective","D":"valid only within a specific cultural framework"},"n":15},{"slug":"gri-mod-sat-v9-1-16","stem":"The shift in the CEO's public messaging was subtle but significant: she no longer described the restructuring as 'strategic' and had replaced 'opportunity' with 'challenge' in two consecutive quarterly reports.  As used in the text, \"subtle\" most nearly means:","why":"B is correct. Changed word choices that required close reading to notice = not immediately obvious, requiring careful attention. \"Subtle\" = so delicate or precise as to be difficult to detect; not obvious.  A — deliberate and carefully designed describes intent, not the quality of subtlety.  C — difficult to analyze describes complexity, not the quality of subtlety.  D — acknowledged internally but not public describes a different distinction.  Kelime: subtle — ince, nazik, fark edilmesi güç","ans":"B","choices":{"B":"not immediately obvious; requiring careful attention to notice","A":"deliberate and carefully designed to achieve a specific effect","D":"acknowledged within the company but not reflected publicly","C":"so delicate or precise as to be difficult to analyze"},"n":16},{"slug":"gri-mod-sat-v9-1-17","why":"C is correct. Exceeding the previous record by thirty percent = went beyond in performance. \"Surpass\" = to exceed; to be greater than or superior to.  A — reached despite obstacles describes the achievement's difficulty.  B — revealed to be more ambitious describes what the achievement showed.  D — achieved earlier than anticipated describes timing.  Kelime: surpass — geçmek, aşmak, üstün gelmek","stem":"The final fundraising total surpassed all prior records for the organization, exceeding the previous high by thirty percent and reaching a level that had been considered unattainable when the campaign was first designed.  As used in the text, \"surpassed\" most nearly means:","ans":"C","choices":{"D":"achieved earlier in the campaign timeline than anticipated","C":"exceeded; went beyond in performance or achievement","B":"revealed to be more ambitious than the original target","A":"reached despite significant obstacles"},"n":17},{"slug":"gri-mod-sat-v9-1-18","choices":{"D":"frequently exposed due to school attendance and group activities","C":"unaware of the health risks associated with the environment","B":"easily influenced or harmed; lacking resistance","A":"likely to experience more severe complications if infected"},"n":18,"stem":"Young children are especially susceptible to respiratory infections in crowded indoor environments, which is why pediatric guidelines recommend increased ventilation and reduced group sizes during peak illness seasons.  As used in the text, \"susceptible\" most nearly means:","why":"B is correct. Especially vulnerable to infections = easily harmed, lacking resistance. \"Susceptible\" = likely to be influenced or harmed by a particular thing; vulnerable.  A — more severe complications if infected is a different aspect of vulnerability.  C — unaware of risks is a knowledge issue.  D — frequently exposed describes opportunity for infection.  Kelime: susceptible — duyarlı, etkilenmeye açık, korunaksız","ans":"B"},{"slug":"gri-mod-sat-v9-1-19","choices":{"B":"legally cautious in avoiding language that could lead to litigation","A":"moderate in tone; showing restraint and reasonableness","C":"strategic in balancing transparency with institutional protection","D":"comprehensive in addressing all of the concerns that had been raised"},"n":19,"why":"A is correct. Acknowledged concerns, defended decision, committed to change = moderate in tone, showing restraint. \"Temperate\" = showing moderation or self-restraint.  B — legally cautious is a specific strategic quality.  C — strategically balancing transparency describes a communication calculation.  D — comprehensive in addressing all concerns describes thoroughness.  Kelime: temperate — ılımlı, dengeli, aşırıya kaçmayan","stem":"The editorial board's response to the controversy was temperate: it acknowledged the legitimate concerns raised by critics, defended the decision to publish, and committed to a clearer editorial process going forward.  As used in the text, \"temperate\" most nearly means:","ans":"A"},{"ans":"C","why":"C is correct. Key provisions unresolved, final ratification pending = not certain or fixed, subject to further discussion. \"Tentative\" = not certain or fixed; subject to change.  A — proposed informally describes an earlier stage.  B — agreed by negotiators but requiring approval describes a specific procedural status.  D — reduced in scope describes the content, not the certainty.  Kelime: tentative — geçici, kesin olmayan, tereddütlü","stem":"The peace talks produced only a tentative agreement: both parties had initialed a framework document, but key provisions remained unresolved and any final deal required ratification by legislatures that had not yet reviewed the terms.  As used in the text, \"tentative\" most nearly means:","n":20,"choices":{"C":"not certain or fixed; subject to further discussion","D":"reduced in scope from what had originally been proposed","A":"proposed informally before being put in writing","B":"agreed upon by negotiators but requiring public approval"},"slug":"gri-mod-sat-v9-1-20"},{"n":21,"choices":{"A":"technically precise at the expense of helpfulness","B":"delivered quickly due to a heavy marking load","C":"written informally rather than in the expected academic register","D":"efficiently brief; sparing with words"},"ans":"D","stem":"The professor's feedback on the essay was characteristically terse: three sentences identifying the structural flaw, one sentence on the strongest passage, and a grade with no further explanation.  As used in the text, \"terse\" most nearly means:","slug":"gri-mod-sat-v9-1-21","why":"D is correct. Three sentences, one sentence, grade with no further explanation = sparing with words, brief. \"Terse\" = sparing in the use of words; brief and abrupt.  A — technically precise at the expense of helpfulness is a different quality.  B — delivered quickly due to heavy load is a cause, not the definition.  C — informal register is a different style observation.  Kelime: terse — kısa ve kuru, özlü, kesik cümleli"},{"slug":"gri-mod-sat-v9-1-22","ans":"A","stem":"The environmental organization sought to thwart the development project by challenging the environmental impact assessment in court, arguing that the review had failed to account for the effect on protected wetlands downstream.  As used in the text, \"thwart\" most nearly means:","why":"A is correct. Challenging the project in court to stop it = preventing from succeeding, obstructing. \"Thwart\" = to prevent someone from accomplishing something.  B — replace with another project is a different goal.  C — delay until requirements are met is a less adversarial objective.  D — expose as irregular is one method of thwarting.  Kelime: thwart — engellemek, bozmak, önlemek","n":22,"choices":{"B":"replace with a project that had broader community support","A":"prevent from succeeding; obstruct","C":"delay until regulatory requirements had been properly satisfied","D":"expose as legally and procedurally irregular"}},{"slug":"gri-mod-sat-v9-1-23","why":"B is correct. Used by so many speakers that emotional force was lost = overused, worn out. \"Trite\" = overused and consequently of little import; lacking originality.  A — linguistically simple is a different quality.  C — poorly delivered is a performance issue.  D — strategically generic implies calculated blandness.  Kelime: trite — klişe, bayağı, sıradanlığa düşmüş","stem":"The speech drew polite applause but left many listeners unmoved: its appeals to unity and shared purpose were trite, having been used in similar form by so many speakers that they had lost whatever emotional force they might once have carried.  As used in the text, \"trite\" most nearly means:","ans":"B","choices":{"C":"poorly delivered rather than poorly conceived","D":"strategically generic to avoid alienating any part of the audience","B":"overused to the point of having lost its original force","A":"linguistically simple and unsuited to the formality of the occasion"},"n":23},{"choices":{"D":"informed by prior experiences of bad-faith negotiation","C":"unwilling to engage without prior procedural guarantees","B":"strategically confrontational to gain early advantage","A":"eager or quick to argue; aggressively defiant"},"n":24,"stem":"The union representative arrived at the negotiation table in a truculent mood, immediately challenging the company's opening figures as fabricated and demanding an independent auditor before further discussions could proceed.  As used in the text, \"truculent\" most nearly means:","why":"A is correct. Immediately challenged figures, demanded auditor = quick to argue, aggressively defiant. \"Truculent\" = eager or quick to argue; defiant.  B — strategically confrontational implies calculation.  C — unwilling without procedural guarantees describes a condition.  D — informed by prior bad faith is a motivation.  Kelime: truculent — kavgacı, saldırgan, hırçın","slug":"gri-mod-sat-v9-1-24","ans":"A"},{"ans":"A","stem":"The project's most turbulent period came in its third year, when the lead architect resigned abruptly, two investors withdrew, and construction was halted for three months following a structural inspection.  As used in the text, \"turbulent\" most nearly means:","why":"A is correct. Resignation, investors withdrawing, construction halted = conflict, instability, sudden change. \"Turbulent\" = characterized by conflict, disorder, or confusion; not stable.  B — most productive is the opposite.  C — most visible to the public is a different quality.  D — most consequential is a different assessment.  Kelime: turbulent — çalkantılı, karmaşık, istikrarsız","slug":"gri-mod-sat-v9-1-25","n":25,"choices":{"B":"most productive in terms of design decisions","A":"characterized by conflict, instability, or sudden change","C":"most visible to the public due to media coverage","D":"most consequential for the project's long-term outcomes"}}],"t":"mcqquiz"}],"name":"Rhetoric & Expression Vocabulary","eyebrow":"Kelime"},{"id":"v10","group":"Kelime","blocks":[{"t":"p","x":"SAT kelime â Mixed Review — Advanced Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"n":1,"choices":{"B":"questioned the validity of specific findings","A":"weakened or damaged by indirect means","D":"delayed progress by introducing competing concerns","C":"brought additional information to light"},"ans":"A","why":"A is correct. Damaged confidence beyond what data warranted = weakened indirectly. \"Undermine\" = to weaken gradually.  B — questioned specific findings describes direct challenge.  C — brought information to light is different.  D — delayed progress is a consequence.  Kelime: undermine — zayıflatmak, gizlice yıkmak","slug":"gri-mod-sat-v10-1-1","stem":"The consultant's report, while accurate in its individual findings, undermined the team's confidence more than was warranted, presenting manageable problems as though they were disqualifying.  As used in the text, \"undermined\" most nearly means:"},{"ans":"B","why":"B is correct. Changed terms without consulting partners = without agreement of the other parties. \"Unilateral\" = performed by or affecting only one side.  A — legally binding without consent is a legal quality.  C — implemented gradually is a rollout strategy.  D — announced publicly first is a communication order.  Kelime: unilateral — tek taraflı, karşılıklı değil","slug":"gri-mod-sat-v10-1-2","stem":"The company's unilateral decision to change the terms of the distribution agreement without consulting its partners triggered breach of contract claims from three of the five affected firms.  As used in the text, \"unilateral\" most nearly means:","n":2,"choices":{"B":"taken without the agreement or participation of the other party","A":"legally binding without affected parties' consent","D":"announced publicly before stakeholders had been informed","C":"implemented gradually to reduce immediate disruption"}},{"choices":{"D":"never having happened or existed before","C":"more widely covered by the media than any prior campaign","A":"larger than internal projections had estimated","B":"achieved through methods not previously used by the organization"},"n":3,"stem":"The scale of the public response was unprecedented: within forty-eight hours, donations had exceeded the organization's entire annual budget, and the volume of online engagement had crashed its server.  As used in the text, \"unprecedented\" most nearly means:","why":"D is correct. Exceeded the annual budget in 48 hours, crashed servers = never happened before. \"Unprecedented\" = never done or known before.  A — larger than projections describes exceeded expectations.  B — achieved through new methods describes technique.  C — widely covered describes media treatment.  Kelime: unprecedented — benzersiz, daha önce hiç olmamış","slug":"gri-mod-sat-v10-1-3","ans":"D"},{"choices":{"B":"having or showing no moral principles; dishonest","A":"hidden from regulatory view due to structural complexity","C":"involving multiple parties across different jurisdictions","D":"motivated primarily by pressure from larger companies in the chain"},"n":4,"stem":"The investigation found evidence of unscrupulous practices throughout the supply chain: suppliers had falsified origin certifications, inspection officials had accepted payments to approve substandard products, and several intermediaries had destroyed records.  As used in the text, \"unscrupulous\" most nearly means:","slug":"gri-mod-sat-v10-1-4","why":"B is correct. Falsified certifications, bribery, destroyed records = no moral principles. \"Unscrupulous\" = having or showing no moral principles; not honest.  A — hidden from regulation describes concealment.  C — multiple parties describes the chain structure.  D — pressure from larger companies is a causal explanation.  Kelime: unscrupulous — ahlaksız, vicdansız, ilkesiz","ans":"B"},{"n":5,"choices":{"D":"subject to regulatory review as a result of the evidence","C":"inconsistent with the company's prior public statements","A":"no longer defensible; impossible to maintain","B":"likely to be challenged through litigation"},"ans":"A","stem":"Following the discovery of new evidence, the company's original position became untenable: it had claimed to have no knowledge of the defect, but internal emails showed engineers had flagged it eighteen months before release.  As used in the text, \"untenable\" most nearly means:","slug":"gri-mod-sat-v10-1-5","why":"A is correct. Internal emails disproved the claim = no longer defensible. \"Untenable\" = not able to be maintained or defended.  B — likely to be challenged is a process outcome.  C — inconsistent with prior statements is what made it untenable.  D — regulatory review is a consequence.  Kelime: untenable — savunulamaz, tutarsız, tutulması güç"},{"n":6,"choices":{"C":"difficult to manage or control; not efficient","D":"insulated from accountability to external stakeholders","B":"lacking transparency in its decision-making processes","A":"overly complex due to poorly coordinated design"},"ans":"C","why":"C is correct. Multiple committees, boards, rotating executive, no clear authority = difficult to manage. \"Unwieldy\" = difficult to manage or control because of size or complexity.  A — overly complex due to poor design is a cause.  B — lacking transparency is a different deficiency.  D — insulated from accountability is a governance problem.  Kelime: unwieldy — kullanışsız, hantal, yönetilmesi güç","slug":"gri-mod-sat-v10-1-6","stem":"The proposed governance structure had become unwieldy: fifteen committees, four oversight boards, and a rotating executive that changed every ninety days had produced a system in which no single authority had clear responsibility.  As used in the text, \"unwieldy\" most nearly means:"},{"choices":{"A":"reconsider in light of newly submitted evidence","B":"explain the legal reasoning underlying a finding","C":"confirm; maintain the validity of a decision","D":"suspend pending a review by a higher court"},"n":7,"slug":"gri-mod-sat-v10-1-7","why":"C is correct. Voted to keep the original decision = confirm, maintain the validity. \"Uphold\" = to confirm or support something that has been questioned.  A — reconsider in light of new evidence is the opposite.  B — explain legal reasoning is a different function.  D — suspend pending review is the opposite.  Kelime: uphold — desteklemek, onaylamak, devam ettirmek","stem":"The appellate court voted to uphold the lower court's decision, finding that the trial judge had correctly applied the relevant statute and that there were no grounds for reversing the original outcome.  As used in the text, \"uphold\" most nearly means:","ans":"C"},{"n":8,"choices":{"C":"expand the formal scope of an existing role","D":"act on behalf of another under an informal arrangement","A":"exercise authority in the absence of the designated holder","B":"take a position or role by force or without right"},"ans":"B","slug":"gri-mod-sat-v10-1-8","why":"B is correct. Took over authority without formal delegation = took a role without right. \"Usurp\" = to take a position by force or without right.  A — exercise authority in someone's absence could be legitimate delegation; usurp implies without right.  C — expand formal scope is an authorized extension.  D — informal arrangement implies some agreement; usurp implies none.  Kelime: usurp — zorla ele geçirmek, hakkı olmadan almak","stem":"The deputy had effectively usurped the director's authority during the months of her illness, signing contracts, directing budgets, and representing the organization at formal functions — all without formal delegation.  As used in the text, \"usurp\" most nearly means:"},{"n":9,"choices":{"A":"demonstrate effectiveness in a large population","B":"satisfy the evidentiary requirements of regulatory review","D":"provide the final data needed to proceed to the next phase","C":"demonstrate or confirm the truth or value of"},"ans":"C","stem":"The clinical trial was designed not simply to show that the drug worked but to validate the theoretical model that had predicted its mechanism — confirming that the effect was occurring through the specific pathway the researchers had proposed.  As used in the text, \"validate\" most nearly means:","why":"C is correct. Confirming the theoretical model by showing the specific mechanism worked = demonstrate or confirm the truth of. \"Validate\" = to demonstrate or confirm the truth or value.  A — demonstrate effectiveness in large populations describes efficacy trials.  B — satisfy regulatory requirements is a compliance function.  D — provide data to proceed is a development milestone.  Kelime: validate — doğrulamak, onaylamak, geçerli kılmak","slug":"gri-mod-sat-v10-1-9"},{"n":10,"choices":{"B":"regarded with deep respect or reverence","A":"formally commemorated at institutional events","D":"made the subject of a publicly accessible historical record","C":"credited with achievements that shaped the institution"},"ans":"B","stem":"The college venerated its founder through an annual ceremony, a prominent statue in the main courtyard, and a scholarship fund bearing her name — gestures that the current generation of students sometimes found excessive.  As used in the text, \"venerated\" most nearly means:","why":"B is correct. Annual ceremony, statue, named scholarship = regarded with deep respect. \"Venerate\" = to regard with great respect; to revere.  A — formally commemorated describes the actions but not the feeling.  C — credited with achievements describes what was recognized.  D — subject of historical record is a documentation action.  Kelime: venerate — saygıyla anmak, ululamak, kutsamak","slug":"gri-mod-sat-v10-1-10"},{"choices":{"D":"expose to public scrutiny regarding professional conduct","C":"compare unfavorably to a competing candidate","B":"speak or write about in an abusively disparaging manner","A":"criticize in a way substantiated by evidence"},"n":11,"why":"B is correct. Misleading contexts, false attributions, cropped images = abusively disparaging, dishonest. \"Vilify\" = to speak or write about in an abusively disparaging manner.  A — criticism substantiated by evidence is different from vilification.  C — compare unfavorably is a gentler comparison.  D — expose to public scrutiny is a different action.  Kelime: vilify — karalamak, iftira atmak, kötülemek","slug":"gri-mod-sat-v10-1-11","stem":"The campaign literature had been designed to vilify the incumbent, portraying her in misleading contexts, attributing statements she had not made, and using cropped images that gave a false impression of her conduct.  As used in the text, \"vilify\" most nearly means:","ans":"B"},{"stem":"The region's political situation remained volatile: a new set of elections had produced an inconclusive result, two factions were refusing to recognize the outcome, and street protests had turned violent in three cities.  As used in the text, \"volatile\" most nearly means:","why":"B is correct. Inconclusive elections, refusing factions, violent protests = likely to change rapidly, unstable. \"Volatile\" = liable to change rapidly and unpredictably.  A — difficult to understand due to alliances describes interpretive difficulty.  C — external interference is a geopolitical factor.  D — resolved partially but likely to recur describes a different situation.  Kelime: volatile — dengesiz, değişken, patlayıcı","slug":"gri-mod-sat-v10-1-12","ans":"B","choices":{"A":"difficult to understand due to rapidly shifting alliances","B":"likely to change rapidly and unpredictably; unstable","D":"resolved partially but likely to recur within months","C":"subject to external interference from neighboring countries"},"n":12},{"choices":{"B":"insufficiently supported by the current social care system","A":"more likely to be affected by health conditions generally","C":"concentrated in areas without adequate infrastructure","D":"susceptible to harm; lacking protection against a threat"},"n":13,"stem":"The study found that elderly residents living alone were particularly vulnerable to extreme heat, lacking the social networks, financial resources, and mobility needed to access cooling centers during temperature emergencies.  As used in the text, \"vulnerable\" most nearly means:","slug":"gri-mod-sat-v10-1-13","why":"D is correct. Lacking networks, resources, and mobility = susceptible to harm, lacking protection. \"Vulnerable\" = susceptible to harm; lacking protection.  A — generally more health-affected is a broader claim.  B — insufficiently supported by social care is a systems critique.  C — concentrated in underserved areas is a geographic observation.  Kelime: vulnerable — savunmasız, korunaksız, zarar görebilir","ans":"D"},{"n":14,"choices":{"D":"share with other members of the committee","C":"acquire through formal appointment","B":"hold in reserve for use in critical situations","A":"exercise or exert power or authority"},"ans":"A","stem":"The position conferred significant influence: its holder could wield veto power over departmental appointments, control the agenda of the monthly steering committee, and approve the annual budget allocation.  As used in the text, \"wield\" most nearly means:","slug":"gri-mod-sat-v10-1-14","why":"A is correct. Use veto power, control agendas, approve budgets = exercise or exert power. \"Wield\" = to hold and use; to exercise power.  B — hold in reserve implies not using currently.  C — acquire through appointment describes how power was obtained.  D — share with other members is a different governance structure.  Kelime: wield — kullanmak, elde tutmak, elinde bulundurmak"},{"slug":"gri-mod-sat-v10-1-15","choices":{"C":"shared across multiple levels of the organization","D":"intentional; done deliberately and knowingly","A":"resulting from structural failures in the regulatory system","B":"motivated by financial rather than safety considerations"},"n":15,"why":"D is correct. Executives knew for two years and made no disclosure = deliberately and knowingly done. \"Willful\" = done deliberately and intentionally.  A — structural regulatory failures is a different explanation.  B — financially motivated describes the motive.  C — shared across levels describes organizational scope.  Kelime: willful — kasıtlı, inatçı, bilerek yapılan","stem":"The court found that the company's failure to warn consumers had been willful, not negligent: internal documents showed that executives were aware of the risk for at least two years before any disclosure was made.  As used in the text, \"willful\" most nearly means:","ans":"D"},{"choices":{"D":"having a feeling of vague or regretful longing","C":"reluctant to discuss memories associated with difficulty","A":"deeply satisfied with the long-term outcomes of that period","B":"critical of the ways academic culture had changed"},"n":16,"slug":"gri-mod-sat-v10-1-16","why":"D is correct. Longing for a time they could not return to = vague or regretful longing. \"Wistful\" = having a feeling of vague or regretful longing.  A — deeply satisfied is different from wistful longing.  B — critical of change is a different orientation.  C — reluctant to discuss difficult memories is a different response.  Kelime: wistful — özlemli, hüzünlü bir şekilde","stem":"The alumni's wistful reminiscences about the old campus — the common rooms, the long library nights, the informal conversations with faculty — revealed a longing for a time and place they knew they could not return to.  As used in the text, \"wistful\" most nearly means:","ans":"D"},{"choices":{"C":"exceed the performance standards required by regulation","D":"remain standing or functional in the face of","A":"measure accurately for engineering purposes","B":"reduce the impact of through protective design"},"n":17,"slug":"gri-mod-sat-v10-1-17","why":"D is correct. Designed for winds up to 120 mph = remain standing in the face of the storm. \"Withstand\" = to remain undamaged; to resist.  A — measure accurately is an assessment function.  B — reduce the impact of implies partial protection; withstand implies full resistance.  C — exceed regulatory standards is a quality benchmark.  Kelime: withstand — dayanmak, karşı koymak, direnmek","stem":"The infrastructure was designed to withstand sustained winds of up to 120 miles per hour, based on historical data about the most severe storms the region had experienced in the previous century.  As used in the text, \"withstand\" most nearly means:","ans":"D"},{"stem":"The historian argued that the immigration restriction policies of that era were fundamentally xenophobic, targeting specific nationalities not because of any demonstrated security concern but because of cultural anxieties deliberately inflamed by media coverage.  As used in the text, \"xenophobic\" most nearly means:","why":"A is correct. Targeting nationalities due to cultural anxieties rather than security = dislike or prejudice against foreigners. \"Xenophobic\" = having or showing prejudice against people from other countries.  B — economic concerns is a different motivation.  C — maintaining cultural cohesion is a stated rationale.  D — responding to declining social trust is a different framing.  Kelime: xenophobic — yabancı düşmanı, yabancılardan korkan","ans":"A","choices":{"C":"focused on maintaining cultural cohesion within a national community","D":"designed to respond to a perceived decline in social trust","A":"having or showing a dislike of or prejudice against foreigners","B":"driven by economic concerns about job competition"},"n":18,"slug":"gri-mod-sat-v10-1-18"},{"n":19,"choices":{"B":"generated support from previously reluctant stakeholders","A":"required significant concessions from both parties","C":"produced or provided as a result or consequence","D":"delayed finalization until all parties were satisfied"},"ans":"C","slug":"gri-mod-sat-v10-1-19","why":"C is correct. Finally produced a framework agreement = produced as a result. \"Yield\" = to produce or provide a natural result.  A — required concessions describes the process.  B — generated support is a different outcome.  D — delayed until all were satisfied is a different process.  Kelime: yield — vermek, sonuç doğurmak; vazgeçmek","stem":"The additional years of negotiation finally yielded a result: a framework agreement that, while falling short of what either side had originally sought, provided a foundation for the more detailed arrangements that would follow.  As used in the text, \"yielded\" most nearly means:"},{"ans":"C","why":"C is correct. Excessive attachment to methodological schools preventing engagement = excessive, uncompromising commitment. \"Zealotry\" = excessive fanaticism for a cause.  A — reluctance to accept outside criticism is a defensive stance.  B — enthusiasm outpacing evidence describes a different problem.  D — personal rather than professional disagreement is a different dynamic.  Kelime: zealotry — aşırı bağlılık, fanatizm","slug":"gri-mod-sat-v10-1-20","stem":"The professor warned against the zealotry that sometimes characterized debates within the field, arguing that excessive attachment to methodological schools had prevented productive engagement between researchers who shared the same fundamental questions.  As used in the text, \"zealotry\" most nearly means:","n":20,"choices":{"C":"excessive, uncompromising commitment to a belief or cause","D":"disagreement that is personal rather than professionally substantive","A":"reluctance to accept criticism from outside the field","B":"enthusiasm that outpaces the evidence available"}},{"stem":"The consultant's recommendation left considerable ambiguity about implementation: it specified what outcome was desired without indicating who would be responsible, on what timeline, or with what resources.  As used in the text, \"ambiguity\" most nearly means:","why":"A is correct. No responsibility, no timeline, no resources specified = open to multiple interpretations. \"Ambiguity\" = the quality of being open to more than one interpretation.  B — uncertainty from incomplete information is related but different.  C — vagueness from poor thinking implies a cognitive failure.  D — incompleteness due to scope constraints is a different kind of gap.  Kelime: ambiguity — belirsizlik, muğlaklık, iki anlamlılık","slug":"gri-mod-sat-v10-1-21","ans":"A","choices":{"A":"the quality of being open to more than one interpretation","B":"uncertainty caused by incomplete information","C":"vagueness resulting from poor analytical thinking","D":"incompleteness due to constraints on the report's scope"},"n":21},{"n":22,"choices":{"A":"challenge through alternative interpretation","B":"establish as the most probable explanation","C":"confirm or give support to","D":"demonstrate beyond the threshold of legal certainty"},"ans":"C","why":"C is correct. Called to support the prosecution's claim through analysis = confirm or give support to. \"Corroborate\" = to confirm or give support to.  A — challenge through alternative interpretation is the opposite.  B — establish as most probable implies more certainty than corroboration requires.  D — demonstrate beyond legal certainty is a higher standard than corroboration alone.  Kelime: corroborate — doğrulamak, desteklemek, pekiştirmek","slug":"gri-mod-sat-v10-1-22","stem":"The forensic linguist was called to corroborate the prosecution's claim that the anonymous letter had been written by the defendant, comparing syntactic patterns, punctuation habits, and idiosyncratic spelling errors across multiple samples.  As used in the text, \"corroborate\" most nearly means:"},{"n":23,"choices":{"C":"disputed by competing teams of investigators","D":"present in the early data but absent from later analysis","B":"too complex to fully understand with available data","A":"difficult to find, achieve, or understand"},"ans":"A","stem":"The root cause of the infrastructure failure proved elusive for months: each investigation pointed toward contributing factors, but none could identify the primary mechanism that had initiated the cascade of faults.  As used in the text, \"elusive\" most nearly means:","slug":"gri-mod-sat-v10-1-23","why":"A is correct. Months of investigation without pinpointing the cause = difficult to find or understand. \"Elusive\" = difficult to find, catch, or achieve.  B — too complex to understand describes a comprehension limit.  C — disputed by competing teams describes professional disagreement.  D — present early but absent later describes a data pattern.  Kelime: elusive — zor yakalanan, kaçınan, ele geçirilmez"},{"n":24,"choices":{"D":"seeming reasonable or probable; believable","C":"more convincing than the prosecution's account","A":"legally sufficient to create reasonable doubt","B":"independently verified by a reliable third party"},"ans":"D","stem":"The defense attorney presented a plausible alternative explanation for her client's presence near the scene: a dentist appointment three blocks away, confirmed by office records and consistent with the surveillance footage timing.  As used in the text, \"plausible\" most nearly means:","slug":"gri-mod-sat-v10-1-24","why":"D is correct. Dentist appointment, office records, consistent timing = seeming reasonable and believable. \"Plausible\" = seeming reasonable or probable.  A — legally sufficient to create doubt is a legal standard.  B — independently verified is a corroboration standard.  C — more convincing than prosecution is a comparative judgment.  Kelime: plausible — makul, inandırıcı, olası görünen"},{"stem":"The accountant was known for being scrupulous in his reporting: he flagged every discrepancy regardless of its size, documented every judgment call with supporting rationale, and declined to sign off on any figure he could not independently verify.  As used in the text, \"scrupulous\" most nearly means:","why":"A is correct. Flagged every discrepancy, documented every judgment, verified every figure = diligent in ensuring everything is completely correct. \"Scrupulous\" = very careful about doing what is right and honest; paying great attention to detail.  B — methodical in procedures describes process, not the quality of conscientiousness.  C — cautious about legal implications is a different concern.  D — insistent on transparency describes external communication.  Kelime: scrupulous — titiz, vicdanlı, dürüst, ilkeli","ans":"A","choices":{"D":"insistent on transparency with all external stakeholders","C":"cautious about the legal implications of the figures presented","B":"methodical in following established accounting procedures","A":"diligent in ensuring that all work is completely correct; careful"},"n":25,"slug":"gri-mod-sat-v10-1-25"}],"t":"mcqquiz"}],"name":"Mixed Review — Advanced Vocabulary","eyebrow":"Kelime"}],"groups":["Öğren","Dilbilgisi","Kelime"],"title":"SAT (Reading & Writing)"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
