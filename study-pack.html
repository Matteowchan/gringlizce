{"label": "C", "text": "However,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "Mid-century segregated zoning is opposed by later advocacy for mixed-use neighborhoods — a reversal in planning philosophy. 'However' signals this shift. 'Similarly' implies later planners agreed with mid-century approaches. 'Therefore' implies mixed-use advocacy followed logically from segregated zoning. 'For instance' implies illustration."}, {"n": 12, "type": "Concession", "passage": "The theory was initially dismissed by leading researchers in the field, who considered its central claims implausible given the available evidence at the time. ______ it gained widespread acceptance within a decade as new measurement techniques produced data that could not be explained by competing models.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "In addition,"}], "answer": "C", "explanation": "Initial dismissal is overcome by eventual acceptance — a classic concession structure in science. 'Nevertheless' signals that acceptance followed despite the initial rejection. 'As a result' implies acceptance was caused by the dismissal. 'For example' implies acceptance illustrates the dismissal. 'In addition' adds without contrasting."}, {"n": 13, "type": "Restatement", "passage": "The organism's metabolic strategy involves maintaining a state of torpor during periods when environmental temperatures exceed tolerable limits, suppressing all non-essential physiological processes to reduce energy expenditure to a minimum. ______ the animal essentially shuts down to survive the heat in the same way that others hibernate to survive the cold.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In other words,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "The second sentence translates the technical description (torpor, physiological suppression) into a simple analogy (shuts down to survive heat, like hibernation). 'In other words' signals this clarifying restatement. 'However' implies contradiction. 'Therefore' and 'As a result' imply causation."}, {"n": 14, "type": "Causation", "passage": "Atmospheric pressure decreases with altitude because the air column above any given point becomes shorter and therefore contains less mass. ______ water boils at lower temperatures at high elevations, requiring longer cooking times for many foods.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "C", "explanation": "Lower pressure at high altitude directly causes water to boil at lower temperatures — a physics consequence. 'As a result' signals this cause-and-effect relationship. 'In contrast' implies an opposing effect. 'For example' implies illustration. 'Nevertheless' implies the boiling point changes despite something working against it."}, {"n": 15, "type": "Clarification", "passage": "Historians have sometimes characterized the medieval church as uniformly hostile to scientific inquiry. ______ many churchmen were themselves practicing natural philosophers who maintained and transmitted classical learning throughout the period.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "In fact,"}], "answer": "D", "explanation": "The second sentence contradicts and corrects the common characterization — churchmen were actually engaged in science. 'In fact' signals this correction of a misconception with a directly opposing truth. 'However' implies simple contrast. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 16, "type": "Sequence", "passage": "The peace negotiations collapsed after three days of failed talks, with both delegations accusing the other of acting in bad faith. ______ both governments recalled their respective ambassadors, effectively downgrading diplomatic relations to their lowest point in two decades.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "Recalling ambassadors was the next step following the breakdown of talks — a temporal and political sequence. 'Subsequently' signals this progression. 'However' implies the recall was unexpected. 'Similarly' implies parallel comparison. 'In contrast' implies opposition."}, {"n": 17, "type": "Contrast", "passage": "Classical conditioning, as demonstrated by Pavlov's experiments with dogs, involves the association of a neutral stimulus with an unconditioned response until the neutral stimulus alone can trigger the response. ______ operant conditioning, developed by Skinner, shapes behavior through the consequences that follow an action rather than through stimulus pairing.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Classical and operant conditioning use fundamentally different mechanisms — stimulus-response pairing versus consequence-shaped behavior. 'In contrast' marks this explicit comparison of opposing frameworks. 'Similarly' implies both use the same mechanism. 'Therefore' implies operant conditioning followed from classical. 'As a result' implies causation."}, {"n": 18, "type": "Concession", "passage": "The region had experienced more than a decade of sustained political instability, with frequent government changes, armed conflict in border areas, and deep divisions among ethnic communities. ______ economic growth remained surprisingly robust, driven largely by a young population and abundant natural resources.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Therefore,"}], "answer": "C", "explanation": "Despite extensive political instability — normally an obstacle to growth — the economy remained strong. 'Nevertheless' signals this surprising positive outcome in spite of significant challenges. 'As a result' implies growth was caused by instability. 'For instance' implies growth illustrates instability. 'Therefore' implies causation."}, {"n": 19, "type": "Exemplification", "passage": "The process of creative destruction, as described by economist Joseph Schumpeter, holds that capitalism advances through cycles in which new technologies and business models displace established ones. ______ the rise of digital streaming platforms rendered physical media distribution chains and traditional broadcast networks economically obsolete within a single decade.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "Streaming platforms displacing physical media is a concrete, contemporary example of creative destruction as theorized by Schumpeter. 'For example' signals this exemplification. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 20, "type": "Restatement", "passage": "The legal doctrine of eminent domain permits governmental authorities to acquire privately held land without the owner's consent, provided that the acquisition serves a demonstrable public purpose and that the owner receives fair market compensation. ______ the government can take your land if it needs it for a public project, as long as it pays you what the land is worth.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In other words,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Moreover,"}], "answer": "B", "explanation": "The second sentence translates the technical legal definition of eminent domain into plain language accessible to a general audience. 'In other words' signals this restatement. 'However' implies contradiction. 'Therefore' and 'Moreover' imply other relationships."}, {"n": 21, "type": "Causation", "passage": "The collapse of the Soviet Union removed the ideological and geopolitical rationale that had previously justified the existence of many Cold War-era military alliances and security arrangements. ______ several nations undertook significant reductions in defense spending during the 1990s, redistributing resources toward domestic economic development.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The removal of the Cold War rationale directly caused the reductions in defense spending — a geopolitical consequence. 'As a result' signals this causal chain. 'In contrast' implies an opposing policy response. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 22, "type": "Clarification", "passage": "The term 'theory' in scientific usage does not carry the colloquial meaning of an unproven guess or speculation. ______ a scientific theory is a well-substantiated explanatory framework supported by extensive empirical evidence that has survived repeated attempts at falsification.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "In fact,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "However,"}], "answer": "B", "explanation": "The second sentence corrects the misconception raised in the first by providing the actual, precise scientific definition. 'In fact' signals this correction of a misunderstanding with a definitive clarification. 'Similarly' implies comparison. 'Therefore' implies causation. 'However' implies a weaker contrast than what 'in fact' achieves in a correction context."}, {"n": 23, "type": "Contrast", "passage": "Structured interview techniques, in which all candidates are asked identical questions and evaluated against standardized criteria, have consistently been shown to improve the validity and fairness of hiring decisions. ______ unstructured interviews — the most commonly used hiring method globally — have repeatedly been found to introduce significant interviewer bias.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Structured interviews (fair, valid) are directly opposed to unstructured interviews (biased) — a comparative contrast between two methods. 'In contrast' marks this explicit comparison. 'Similarly' implies both methods have the same effect. 'Therefore' implies unstructured interviews were caused by structured ones. 'As a result' implies causation."}, {"n": 24, "type": "Sequence", "passage": "The first generation of personal computers used command-line interfaces that required users to type precise textual instructions to perform any operation. ______ the development of graphical user interfaces allowed users to interact through visual elements such as icons, windows, and menus, dramatically lowering the technical barrier to computing.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "Therefore,"}], "answer": "C", "explanation": "GUIs came after command-line interfaces and represented the next stage of computing development. 'Subsequently' signals this temporal progression. 'However' implies contradiction. 'In contrast' implies opposition without temporal sequencing. 'Therefore' implies causation."}, {"n": 25, "type": "Concession", "passage": "The expedition had been denied funding by four separate scientific councils, each citing the improbability of finding evidence of life in such an extreme environment. ______ the team proceeded with private backing and returned with microbial samples that fundamentally altered scientific understanding of habitability.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Despite being denied funding four times, the team proceeded and made a landmark discovery. 'Nevertheless' signals this persistence in the face of institutional rejection. 'As a result' implies success was caused by the denials. 'Similarly' implies comparison. 'For example' implies illustration."}]},{"n":5,"topic":"Nuanced Contrast","diff":"Contrast vs. Concession","qs":[{"n": 1, "type": "Contrast", "passage": "The initial archaeological survey of the site produced no artifacts of significant historical interest, and the team nearly abandoned the excavation after the first season. ______ a subsequent and deeper investigation of a previously overlooked stratum revealed an extraordinarily well-preserved settlement dating to the early Bronze Age.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "In addition,"}], "answer": "C", "explanation": "The initial failure is reversed by the unexpected discovery — a direct contrast between two seasons of work. 'However' signals this reversal. 'Therefore' implies the discovery followed logically from the failure. 'Similarly' implies the second season replicated the first. 'In addition' adds without contrasting."}, {"n": 2, "type": "Concession", "passage": "The defendant's legal team presented compelling forensic evidence that cast doubt on the reliability of the eyewitness testimony. ______ the jury found the defendant guilty after only four hours of deliberation, placing decisive weight on the corroborating financial records.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "The compelling defense evidence might have been expected to produce acquittal, but the jury still convicted. 'Nevertheless' signals this outcome despite the obstacle. The key distinction from 'however': 'nevertheless' acknowledges the weight of the obstacle before signaling that it was overcome. 'Therefore' implies conviction followed from the forensic evidence. 'Similarly' implies comparison. 'For instance' implies illustration."}, {"n": 3, "type": "Causation", "passage": "Global shipping routes have become increasingly concentrated through a small number of strategic chokepoints — narrow waterways through which a significant proportion of world trade must pass. This geographic concentration creates systemic vulnerability. ______ the six-day grounding of a single container ship in the Suez Canal in 2021 disrupted hundreds of billions of dollars of global commerce.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "The systemic vulnerability described in the passage directly produced the large-scale disruption caused by one ship. 'Consequently' signals this consequence of structural concentration. 'Nevertheless' implies the disruption occurred despite something working against it. 'In contrast' implies opposition. 'Furthermore' adds without implying causation."}, {"n": 4, "type": "Contrast", "passage": "Consumer sentiment surveys conducted in the first quarter suggested that household confidence in the economy was at a five-year high. ______ retail sales data for the same period showed a measurable contraction, suggesting that optimistic attitudes had not translated into actual spending behavior.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Moreover,"}], "answer": "A", "explanation": "High confidence did not match actual spending behavior — a contradiction between two data sets. 'However' signals this discrepancy. 'Therefore' implies contraction followed logically from high confidence. 'Similarly' implies spending matched the optimistic sentiment. 'Moreover' adds without contrasting."}, {"n": 5, "type": "Clarification", "passage": "The popular account of Newton discovering gravity by being struck on the head by a falling apple is almost certainly apocryphal. ______ Newton himself described his insight as a gradual process of mathematical reasoning, inspired in part by observing a falling apple but not triggered by any dramatic blow.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In fact,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "C", "explanation": "The second sentence corrects the popular myth with what actually happened — a clarifying correction. 'In fact' signals this correction of an inaccurate account with a more accurate one. 'Similarly' implies comparison. 'Therefore' implies causation. 'Nevertheless' implies the myth persisted despite something, which is not the relationship here."}, {"n": 6, "type": "Concession", "passage": "The drug demonstrated a modest but statistically significant reduction in tumor markers in the initial trial, and the research team was cautiously optimistic. ______ the subsequent Phase III trial involving three thousand patients showed no meaningful difference in outcomes between the treatment and control groups.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "Furthermore,"}], "answer": "A", "explanation": "Here 'however' is the better choice over 'nevertheless' because the second sentence does not present an outcome achieved despite the first — it simply contradicts the optimism with negative Phase III results. 'Nevertheless' would signal persistence despite obstacles; the Phase III result is not a case of overcoming obstacles but of failing to replicate. 'However' marks the straightforward contradiction. 'As a result' implies causation. 'Furthermore' adds without contrasting."}, {"n": 7, "type": "Causation", "passage": "Antibiotic overuse in livestock farming allows bacteria to develop resistance under continuous low-level selective pressure, producing strains capable of surviving doses that would normally eliminate them. ______ infections caused by these resistant strains are increasingly difficult to treat with standard antibiotic protocols in both veterinary and human clinical settings.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Consequently,"}], "answer": "D", "explanation": "Resistance developed through overuse directly causes treatment difficulty — a consequence of agricultural practice with clinical implications. 'Consequently' signals this chain of consequence. 'In contrast' implies an opposing clinical trend. 'Similarly' implies parallel comparison. 'For instance' implies illustration."}, {"n": 8, "type": "Contrast", "passage": "Literary critics of the Romantic period celebrated raw emotional expression, personal vision, and a rejection of formal classical constraints as the highest ideals of poetic achievement. ______ the Modernists who followed them often prioritized formal experimentation, ironic distance, and an aesthetic of impersonality over emotional directness.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Romantic ideals (emotion, personal vision) are directly opposed by Modernist ideals (irony, impersonality, formal experiment). 'In contrast' marks this explicit philosophical opposition. 'Similarly' implies Modernism shared Romantic values. 'Therefore' implies Modernism followed logically from Romanticism. 'As a result' implies causation."}, {"n": 9, "type": "Restatement", "passage": "The central premise of natural selection is that heritable variation in traits that affect reproductive success will, over generations, cause populations to become increasingly well-adapted to their environments as advantageous traits become more frequent. ______ organisms with traits that help them survive and reproduce pass those traits on more often, gradually changing what a population looks like.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In other words,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "B", "explanation": "The second sentence rephrases the technical definition of natural selection in accessible, plain language. 'In other words' signals this restatement. 'However' implies contradiction. 'Therefore' implies causation. 'Nevertheless' implies concession, which is not the relationship here."}, {"n": 10, "type": "Concession", "passage": "Climate projections based on current emissions trajectories suggest that average global temperatures could exceed 2 degrees Celsius above pre-industrial levels before the end of the century, with potentially severe consequences for agricultural systems and coastal populations. ______ several nations have made meaningful progress in transitioning their energy systems toward lower-carbon sources.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Furthermore,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The alarming projections make the progress in energy transition feel like action against the odds. 'Nevertheless' signals this partial positive development in the face of serious threat. 'As a result' implies progress was caused by the projections. 'Furthermore' adds without signaling contrast. 'For example' implies progress illustrates the projections."}, {"n": 11, "type": "Clarification", "passage": "The term 'organic' as applied to food products refers specifically to the conditions under which ingredients were grown and processed, governed by certified standards prohibiting synthetic fertilizers and pesticides. ______ the label does not indicate that a product is nutritionally superior, more flavorful, or free of all pesticides, as some naturally derived pesticides are permitted under organic certification.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In fact,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The second sentence clarifies what 'organic' does not mean — correcting common misconceptions about what the label guarantees. While 'in fact' is used for correction, here 'however' is more appropriate because the second sentence doesn't contradict the first's truth; it adds an important qualification. The first sentence states what 'organic' means; the second states what it doesn't mean. 'However' correctly signals this limiting clarification. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 12, "type": "Causation", "passage": "The financial regulator's decision to raise capital adequacy requirements forced banks to hold larger reserves against potential losses. ______ several major institutions reduced their lending activities significantly, contributing to a tightening of credit availability across the economy.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "Higher capital requirements caused reduced lending, which caused credit tightening — a regulatory consequence. 'Therefore' signals this logical causal conclusion. 'In contrast' implies an opposing effect. 'Similarly' implies parallel comparison. 'For instance' implies illustration."}, {"n": 13, "type": "Contrast", "passage": "Inductive reasoning moves from specific observations to general conclusions, building broader principles from accumulated evidence. ______ deductive reasoning begins with general principles and derives specific conclusions from them, treating particular cases as instances of universal rules.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Induction (specific to general) and deduction (general to specific) move in opposite logical directions. 'In contrast' marks this fundamental distinction between the two reasoning modes. 'Similarly' implies both reason in the same direction. 'As a result' implies deduction follows from induction. 'For example' implies illustration."}, {"n": 14, "type": "Concession", "passage": "The technology was expensive, technically demanding to install, and incompatible with the existing infrastructure of most households in the target market. ______ adoption rates exceeded all projections within eighteen months of commercial launch, driven by a viral consumer advocacy campaign.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Therefore,"}], "answer": "B", "explanation": "Three serious barriers to adoption are overcome by viral success — a classic concession structure. 'Nevertheless' signals that the outcome occurred despite the obstacles. 'As a result' implies adoption was caused by the barriers. 'Similarly' implies comparison. 'Therefore' implies adoption logically followed from the barriers."}, {"n": 15, "type": "Exemplification", "passage": "The tendency toward in-group favoritism is a well-documented feature of human social cognition, evident across cultures and historical periods. ______ classical Athenian democracy, widely celebrated as a founding model of participatory governance, systematically excluded women, slaves, and non-citizen residents from political participation.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "Athenian exclusion of non-citizens illustrates the general human tendency toward in-group favoritism. 'For instance' signals this historical exemplification. 'However' implies Athenian democracy contradicted in-group favoritism. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 16, "type": "Causation", "passage": "The introduction of GPS navigation has reduced the cognitive demands of route-finding to the point where many users need not consciously learn or recall spatial information about their journeys. ______ the hippocampus — the brain region associated with spatial memory — shows measurably reduced engagement among regular GPS users in neuroimaging studies.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "GPS-reduced cognitive demand directly causes reduced hippocampal engagement — a neurological consequence of behavioral change. 'As a result' signals this causal chain. 'However' implies an opposing neurological finding. 'In contrast' implies opposition. 'Similarly' implies parallel comparison."}, {"n": 17, "type": "Contrast", "passage": "Several recent meta-analyses suggest that low-carbohydrate diets produce superior short-term outcomes in weight reduction and glycemic control compared to low-fat approaches. ______ long-term adherence rates favor low-fat diets, and the clinical significance of the short-term advantage diminishes substantially after twelve months.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "A", "explanation": "The short-term advantage of low-carb diets is countered by superior long-term adherence for low-fat diets — a reversal of the initial advantage over time. 'However' signals this qualification and contrast. 'Therefore' implies the long-term data follows logically from the short-term data. 'Similarly' implies agreement. 'For instance' implies illustration."}, {"n": 18, "type": "Concession", "passage": "International arbitration panels had ruled against the corporation on three separate occasions, finding each time that its data collection practices violated the privacy rights of users in the affected jurisdictions. ______ the company continued operating under the same framework, citing appeals pending in domestic courts and the absence of meaningful enforcement mechanisms.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Three adverse rulings make the company's continued non-compliance even more notable — a concession structure highlighting persistent behavior despite institutional pressure. 'Nevertheless' signals continuation in the face of clear legal findings. 'Therefore' implies continued operation was caused by the rulings. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 19, "type": "Restatement", "passage": "Supply-side economic theory holds that reducing taxation on corporations and high-income individuals will stimulate investment, expand productive capacity, and generate wealth that benefits all economic strata through market mechanisms. ______ the underlying idea is that prosperity created at the top of the income distribution will eventually reach lower income groups through economic activity rather than direct redistribution.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "In other words,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "The second sentence restates supply-side theory — often called 'trickle-down economics' — in more direct, colloquial terms. 'In other words' signals this restatement. 'However' and 'In contrast' imply contradiction. 'As a result' implies causation."}, {"n": 20, "type": "Causation", "passage": "The redesign of the city's central park eliminated a system of raised barriers that had previously divided the space into separate areas accessible only through controlled entry points. ______ park usage increased significantly among families with young children and elderly visitors, who had previously found the fragmented layout difficult to navigate.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "C", "explanation": "The removal of barriers caused increased usage by groups who had found the old layout difficult. 'Consequently' signals this design-change consequence. 'In contrast' implies an opposing usage pattern. 'For example' implies illustration. 'Nevertheless' implies usage increased despite an obstacle."}, {"n": 21, "type": "Contrast", "passage": "In most parliamentary systems, executive power is held by a prime minister who must maintain the confidence of the legislature and may be removed from office by a vote of no confidence at any time. ______ in presidential systems, the executive and legislative branches are separately elected and possess independent mandates, making removal of the executive significantly more difficult.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Parliamentary and presidential systems operate on fundamentally different principles of executive accountability. 'In contrast' marks this direct comparison of opposing constitutional structures. 'Similarly' implies both work the same way. 'Therefore' implies presidential systems follow from parliamentary ones. 'As a result' implies causation."}, {"n": 22, "type": "Clarification", "passage": "Many people believe that different individuals learn best through visual, auditory, or kinesthetic modalities, and that matching instruction to a student's preferred learning style maximizes educational outcomes. ______ decades of empirical research have found no reliable evidence that matching teaching methods to purported learning styles improves student performance.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Furthermore,"}], "answer": "A", "explanation": "The popular belief in learning styles is directly contradicted by empirical research — a correction of a widespread misconception. 'However' signals this contradiction. 'Therefore' implies the research confirms the popular belief. 'Similarly' implies agreement. 'Furthermore' adds without contradicting."}, {"n": 23, "type": "Concession", "passage": "The historian acknowledged that primary sources from the period were fragmentary, often contradictory, and almost certainly shaped by the political interests of those who commissioned them. ______ he argued that carefully triangulated readings of these sources, combined with archaeological evidence, could still yield meaningful and defensible historical conclusions.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "The acknowledged limitations of the sources do not prevent the historian from making a qualified argument for their value. 'Nevertheless' signals this intellectual persistence despite acknowledged evidentiary weaknesses. 'As a result' implies the argument was caused by the acknowledged limitations. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 24, "type": "Exemplification", "passage": "Urban heat islands — areas within cities that are significantly warmer than surrounding rural regions due to heat absorption by built surfaces and reduced vegetation — pose measurable risks to public health, particularly during heatwaves. ______ a 2003 heatwave in Paris, a city with relatively low green space coverage in its densest districts, resulted in approximately fifteen thousand excess deaths in two weeks.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The Paris heatwave is a specific historical case illustrating the general public health risk posed by urban heat islands. 'For example' signals this exemplification. 'However' implies contradiction. 'Therefore' implies causation from the general principle. 'In contrast' implies opposition."}, {"n": 25, "type": "Causation", "passage": "The widespread adoption of containerized shipping in the mid-twentieth century standardized the loading and unloading process, dramatically reducing the time cargo ships spent in port and cutting labor requirements for dock work by over fifty percent. ______ global trade volumes expanded rapidly as transaction costs fell and supply chains became more reliably predictable.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "As a result,"}], "answer": "D", "explanation": "Standardization reduced costs and time in port, which caused expanded trade and more reliable supply chains. 'As a result' signals this transformative economic consequence. 'In contrast' implies an opposing trade trend. 'However' implies an unexpected result. 'Similarly' implies parallel comparison."}]},{"n":6,"topic":"Advanced Addition","diff":"Causation & Addition Nuances","qs":[{"n": 1, "type": "Addition", "passage": "The discovery overturned a widely held assumption about how the immune system responds to repeated viral exposure. ______ it raised fundamental questions about the design of existing vaccines that relied on that assumption.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Moreover,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The second sentence adds a consequence of the discovery that intensifies its significance — raising vaccine design questions is a stronger, more serious implication. 'Moreover' signals this additional point that extends and amplifies the first. 'However' implies contradiction. 'For example' implies illustration. 'In contrast' implies opposition."}, {"n": 2, "type": "Causation", "passage": "The policy capped annual rent increases at two percent in designated urban zones, reducing landlords' financial incentive to maintain and upgrade rental properties. ______ housing quality in several rent-controlled districts deteriorated markedly over the following decade as maintenance investment fell.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Reduced maintenance investment caused deteriorating housing quality — a consequence of the policy's incentive structure. 'Consequently' signals this chain of cause and effect. 'Nevertheless' implies deterioration occurred despite something working against it. 'For instance' implies illustration. 'Similarly' implies parallel comparison."}, {"n": 3, "type": "Contrast", "passage": "The executive's public statements consistently projected confidence in the company's financial position and growth prospects. ______ internal documents obtained during the subsequent investigation revealed that senior leadership had been aware for months that the company was insolvent.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "The public confidence contrasts sharply with the private knowledge of insolvency — a gap between public performance and private reality. 'However' signals this contradiction. 'Similarly' implies internal documents confirmed the public statements. 'Therefore' implies insolvency followed from confidence. 'Furthermore' adds without contrasting."}, {"n": 4, "type": "Clarification", "passage": "The philosopher's argument is often described as pessimistic, as though it denies the possibility of human progress or meaningful action. ______ it is better understood as a form of lucid realism: an insistence on confronting conditions as they are rather than as one would prefer them to be.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Rather,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The second sentence corrects the characterization of pessimism by offering a more accurate framing — 'lucid realism.' 'Rather' signals this substitution of one characterization for a more accurate one. 'However' signals weaker contrast without the replacement sense. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 5, "type": "Addition", "passage": "The amended statute required companies to disclose carbon emissions data in their annual financial reports. ______ it mandated independent third-party verification of all reported figures to prevent selective self-reporting.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "Third-party verification is a second, separate requirement under the same statute — adding a procedural safeguard to the disclosure mandate. 'Furthermore' signals this additional regulatory measure that extends the first. 'However' implies contradiction. 'In contrast' implies opposition. 'For instance' implies verification illustrates disclosure."}, {"n": 6, "type": "Causation", "passage": "The aquifer that supplied water to the city had been drawing down at twice the natural recharge rate for three consecutive decades. ______ the regional water authority declared a state of emergency and imposed mandatory consumption restrictions across all sectors.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "Accelerated aquifer depletion over decades logically caused the emergency declaration and restrictions. 'Therefore' signals this logical, predictable consequence. 'In contrast' implies an opposing policy response. 'Similarly' implies parallel comparison. 'For instance' implies illustration."}, {"n": 7, "type": "Contrast", "passage": "Many nineteenth-century physicians believed that mental illness was primarily a moral failing or a consequence of weak character, and treated patients accordingly through disciplinary measures. ______ contemporary psychiatry understands most mental disorders as complex interactions of neurobiological, psychological, and social factors requiring evidence-based treatment.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "In addition,"}], "answer": "C", "explanation": "The moral-failing model of mental illness is directly opposed to the biopsychosocial model of contemporary psychiatry — a fundamental paradigm shift. 'In contrast' marks this historical contrast in medical understanding. 'Similarly' implies continuity. 'Consequently' implies causation. 'In addition' adds without contrasting."}, {"n": 8, "type": "Clarification", "passage": "Energy stored in the chemical bonds of food molecules is not directly usable by cells. ______ it must first be converted through metabolic processes into adenosine triphosphate, the universal energy currency that powers cellular functions.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Indeed,"}], "answer": "B", "explanation": "The first sentence states a constraint; the second explains the actual process required — a qualification and clarification of what must happen instead. 'However' correctly signals this limiting correction. 'Similarly' implies comparison. 'Therefore' implies ATP conversion follows from the food being unusable. 'Indeed' would confirm or intensify, not qualify."}, {"n": 9, "type": "Addition", "passage": "The composer's use of non-Western modal scales introduced harmonic possibilities outside the conventions of European tonal music. ______ her rhythmic language, drawn from West African polyrhythmic traditions, created an entirely new textural density in the orchestral writing.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Additionally,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "The rhythmic innovation is a second, independent compositional departure from Western convention — adding to the harmonic innovation already described. 'Additionally' signals this neutral addition of a parallel technique. 'However' implies contradiction. 'Therefore' implies the rhythm was caused by the modal scales. 'As a result' implies causation."}, {"n": 10, "type": "Concession", "passage": "The structural analysis showed that the proposed renovation would require reinforcing all six of the building's original load-bearing walls, a process that would more than double the projected cost and extend the timeline by at least fourteen months. ______ the board voted unanimously to proceed, citing the building's irreplaceable historical significance.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "Doubled cost and extended timeline are formidable obstacles; the unanimous vote to proceed signals a determination to act despite those obstacles. 'Nevertheless' signals this outcome in spite of serious practical constraints. 'As a result' implies the vote was caused by the structural challenges. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 11, "type": "Clarification", "passage": "Scientific consensus on climate change does not mean that every scientist agrees on every aspect of every model or projection. ______ it reflects a convergence of evidence from independent research programs across different disciplines that points toward the same fundamental conclusions about causation and trajectory.", "choices": [{"label": "A", "text": "Rather,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "In contrast,"}], "answer": "A", "explanation": "The first sentence clarifies what consensus does not mean; the second specifies what it does mean. 'Rather' signals this substitution of a correct definition for a common misunderstanding. 'Therefore' implies causation. 'Similarly' implies comparison. 'In contrast' implies a weaker signal than 'rather' for this kind of definitional correction."}, {"n": 12, "type": "Causation", "passage": "The dam created an enormous reservoir that flooded approximately 1,300 square kilometers of previously inhabited and forested land, displacing more than one million people and submerging entire river ecosystems. ______ the project became one of the most controversial infrastructure developments in the history of the region.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Consequently,"}], "answer": "D", "explanation": "The scale of displacement and environmental destruction directly caused the project to become controversial. 'Consequently' signals this reputation as an outcome of the documented impacts. 'However' implies the controversy was unexpected given the impacts. 'In contrast' implies opposition. 'For instance' implies illustration."}, {"n": 13, "type": "Contrast", "passage": "The candidate's internal polling consistently showed double-digit leads among all key demographic groups throughout the campaign. ______ on election day, the results revealed a far more competitive outcome, with the margin of victory falling well within statistical error of the major public surveys.", "choices": [{"label": "A", "text": "Furthermore,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Consistent internal polling leads were contradicted by a near-tie result on election day — polling versus actual outcome. 'However' signals this contradiction. 'Furthermore' adds without contrasting. 'Similarly' implies the election confirmed the polling. 'As a result' implies causation."}, {"n": 14, "type": "Addition", "passage": "The climate model incorporated new parameterizations for cloud formation that significantly improved its representation of precipitation patterns over tropical regions. ______ it was updated with a higher-resolution ocean circulation component that enhanced its accuracy in simulating decade-scale temperature variability.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Moreover,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The ocean circulation update is a second, separate model improvement — adding to the cloud parameterization already mentioned. 'Moreover' signals this additional enhancement that extends the model's improvement. 'However' implies contradiction. 'Therefore' implies the ocean update was caused by the cloud parameterization. 'In contrast' implies opposition."}, {"n": 15, "type": "Sequence", "passage": "The government first introduced a voluntary carbon offset scheme through which companies could purchase credits to compensate for emissions they could not immediately reduce. ______ it announced mandatory emissions trading, requiring all major industrial sectors to hold permits covering their actual output of greenhouse gases.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Subsequently,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "The mandatory scheme came after and as a policy progression from the voluntary offset scheme. 'Subsequently' signals this temporal and policy sequence. 'However' implies the mandatory scheme contradicted the voluntary one. 'In contrast' implies opposition. 'As a result' implies the mandatory scheme was caused by the voluntary one."}, {"n": 16, "type": "Concession", "passage": "Three decades of peer-reviewed research had established a consistent correlation between childhood exposure to lead-based paint and measurable deficits in cognitive development and behavioral regulation. ______ the full removal of lead from domestic paint products in the United States was not completed until 1978, well after the causal evidence had become unambiguous.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Despite three decades of unambiguous evidence, regulatory action was still delayed. 'Nevertheless' signals this failure to act promptly in the face of clear scientific consensus — a particularly notable concession given the public health stakes. 'Therefore' implies regulatory action was caused by the research. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 17, "type": "Clarification", "passage": "Studies comparing urban and rural residents have found that city dwellers show lower rates of certain mood and anxiety disorders in absolute terms. ______ individuals living in urban environments are exposed to significantly higher levels of ambient stressors, including noise, crowding, and social density, which have been linked to elevated cortisol levels.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "In fact,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "The second sentence complicates the apparently positive urban mental health picture by introducing evidence of elevated biological stress — a corrective nuance. 'In fact' signals this complicating clarification that reveals complexity beneath the surface finding. 'Similarly' implies comparison. 'Therefore' implies causation. 'As a result' implies causation."}, {"n": 18, "type": "Contrast", "passage": "The early interpreters of quantum mechanics treated the uncertainty principle primarily as a statement about the limits of measurement — that is, as a technological limitation rather than a feature of physical reality. ______ the Copenhagen interpretation, now dominant, holds that uncertainty is not a measurement limitation but an inherent property of quantum systems.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "Uncertainty-as-measurement-limit versus uncertainty-as-inherent-property are two fundamentally opposed interpretations. 'In contrast' marks this philosophical opposition. 'Similarly' implies both interpretations agree. 'For example' implies the Copenhagen interpretation illustrates the early view. 'As a result' implies causation."}, {"n": 19, "type": "Causation", "passage": "The pandemic prompted an unprecedented acceleration in the development and regulatory approval of mRNA vaccine technology, compressing a process that would normally take a decade or more into under twelve months. ______ the infrastructure built for COVID-19 vaccines has created new pathways for developing mRNA-based treatments for cancer, HIV, and other diseases.", "choices": [{"label": "A", "text": "Consequently,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The accelerated development created infrastructure and knowledge that is now producing broader medical applications — a consequence of pandemic-driven scientific investment. 'Consequently' signals this productive chain of effects. 'However' implies an opposing application. 'In contrast' implies opposition. 'Similarly' implies parallel comparison without causation."}, {"n": 20, "type": "Concession", "passage": "The artist had worked for eleven years on the novel, drafting and discarding more than two thousand pages before arriving at the published version's lean, spare structure. ______ several reviewers dismissed the finished work as thin and underwritten, suggesting it lacked the density the subject matter demanded.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "A", "explanation": "Eleven years of intensive labor paradoxically resulted in a work criticized for being too thin — the effort did not protect the book from dismissal. 'Nevertheless' signals this critical reception despite the exceptional investment of effort. 'Therefore' implies dismissal was caused by the long process. 'Similarly' implies comparison. 'For instance' implies illustration."}, {"n": 21, "type": "Addition", "passage": "The proposed urban greening initiative would plant ten thousand trees along major transit corridors, reducing ambient temperatures and improving air quality in some of the city's most densely populated neighborhoods. ______ the project was designed to create temporary employment for residents facing long-term unemployment in those same districts.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Employment creation is a second, separate benefit of the initiative — adding a social dimension to the environmental benefits already described. 'Furthermore' signals this additional objective. 'However' implies contradiction. 'In contrast' implies opposition. 'As a result' implies employment was caused by the tree-planting."}, {"n": 22, "type": "Contrast", "passage": "Many consumers assume that premium product pricing reflects proportionally higher quality in raw materials, manufacturing precision, or durability. ______ marketing research consistently shows that price perception itself influences quality assessment, such that the same product tastes better, performs better, or feels more effective when it carries a higher price tag.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Furthermore,"}], "answer": "B", "explanation": "The assumption that price reflects quality is undermined by research showing that price shapes perceived quality — the relationship runs in the opposite direction. 'However' signals this reversal of expected causality. 'Similarly' implies research confirms consumer assumptions. 'Therefore' implies perception research confirms price-quality logic. 'Furthermore' adds without contrasting."}, {"n": 23, "type": "Clarification", "passage": "The public often equates a nation's gross domestic product with its overall welfare or standard of living. ______ GDP measures only the total market value of goods and services produced, excluding income distribution, access to public goods, environmental quality, and many dimensions of human wellbeing that significantly affect quality of life.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "In fact,"}, {"label": "D", "text": "Therefore,"}], "answer": "A", "explanation": "The second sentence specifies the limitations of GDP — correcting the conflation with welfare. 'However' signals this corrective qualification of the common equation. 'In fact' would be used if the second sentence directly contradicted the first with a stronger truth; here it clarifies a limitation. 'Similarly' implies comparison. 'Therefore' implies causation."}, {"n": 24, "type": "Concession", "passage": "The independent review panel identified forty-seven separate procedural failures in the organization's safeguarding protocols, spanning a period of six years and involving multiple departments. ______ the organization's leadership resisted calls for external oversight and maintained that internal reforms already underway were sufficient.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "Forty-seven documented failures over six years would normally compel acceptance of external oversight; the leadership's resistance despite this evidence is a notable concession. 'Nevertheless' signals this persistence in the face of damning evidence. 'As a result' implies resistance was caused by the failures. 'For instance' implies illustration. 'Similarly' implies comparison."}, {"n": 25, "type": "Causation", "passage": "The urban development plan prioritized high-density residential construction in areas adjacent to major transit hubs, reducing residents' dependence on private vehicles for daily commuting. ______ greenhouse gas emissions per capita in those corridors fell by an average of twenty-two percent over eight years.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Reduced vehicle dependence caused lower per capita emissions — a direct environmental consequence of transit-oriented development policy. 'Consequently' signals this cause-and-effect outcome. 'However' implies an opposing emissions trend. 'In contrast' implies opposition. 'For example' implies illustration."}]},{"n":7,"topic":"Subtle Relationships I","diff":"Subtle Relationships","qs":[{"n": 1, "type": "Clarification", "passage": "The narrative of scientific progress as a smooth, cumulative accumulation of knowledge has been challenged by philosophers of science since at least the mid-twentieth century. Thomas Kuhn argued that science advances not through gradual refinement but through periodic, disruptive paradigm shifts. ______ the transition from Newtonian to Einsteinian physics represents not an extension of the earlier theory but a fundamental reconceptualization of the nature of space and time.", "choices": [{"label": "A", "text": "For instance,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The Einstein-Newton transition is a specific historical example that illustrates Kuhn's claim about paradigm shifts. 'For instance' correctly signals this exemplification. 'However' implies it contradicts Kuhn's argument. 'Therefore' implies it logically follows as a conclusion rather than an illustration. 'Similarly' implies comparison with another case."}, {"n": 2, "type": "Concession", "passage": "The architect's proposal was criticized by the planning commission for its unconventional use of materials, its departure from the neighborhood's established aesthetic character, and its potential impact on sightlines from adjacent heritage properties. ______ the commission ultimately granted approval, noting that the design met all structural and safety requirements and that innovation in urban architecture serves a legitimate public interest.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Despite these objections,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Multiple specific objections were raised, but approval was granted anyway — a concession structure. 'Despite these objections' explicitly signals that the outcome occurred in spite of the named concerns. 'As a result' implies approval was caused by the objections. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 3, "type": "Causation", "passage": "The species exhibits a reproductive strategy known as semelparity, in which the organism invests all available resources into a single massive reproductive event rather than distributing reproductive effort across multiple breeding seasons. This total investment leaves no physiological capacity for recovery. ______ Pacific salmon die within days of completing their spawning run, having exhausted every biological reserve in service of reproduction.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "For this reason,"}], "answer": "D", "explanation": "The passage explains the mechanism of semelparity; the salmon dying is the direct biological consequence of that mechanism. 'For this reason' signals that the explanation in the preceding sentences is the cause of the described outcome. 'In contrast' implies opposition. 'Consequently' also signals causation but is slightly less precise here since 'for this reason' ties the outcome back to the full explanation. 'Nevertheless' implies concession."}, {"n": 4, "type": "Contrast", "passage": "Proceduralist theories of democratic legitimacy hold that outcomes are just when they result from fair and inclusive decision-making processes, regardless of the content of those outcomes. Substantive theories, by contrast, evaluate outcomes against independent criteria of justice, holding that even procedurally correct decisions can be illegitimate if they produce unjust results. These frameworks generate different verdicts on many real-world cases. ______ a decision reached through a perfectly fair referendum to restrict a minority's civil rights would be valid under proceduralism but potentially illegitimate under substantivism.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "The referendum scenario concretely illustrates the different verdicts the two frameworks would reach — an example of the general claim in the third sentence. 'For example' signals this exemplification. 'However' implies contradiction. 'Similarly' implies comparison with another case. 'As a result' implies the referendum was caused by the theoretical difference."}, {"n": 5, "type": "Clarification", "passage": "Economist Thorstein Veblen coined the term 'conspicuous consumption' to describe the purchase of goods and services primarily to signal social status rather than for their intrinsic utility. The concept is often associated with luxury goods and ostentatious display. ______ Veblen's original analysis extended to leisure time itself, arguing that the conspicuous avoidance of productive work was among the most powerful status signals available to the leisure class.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In fact,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "The second sentence presents a limited understanding of Veblen's concept; the third sentence extends and corrects it by revealing that his analysis reached further than commonly appreciated. 'In fact' signals this correction — revealing a fuller truth beyond the narrower common understanding. 'However' implies simple contrast without the corrective force. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 6, "type": "Concession", "passage": "The defendant's alibi was corroborated by three independent witnesses, mobile phone location data, and security camera footage from two separate locations. Every piece of physical evidence presented at trial pointed to the same exculpatory conclusion. ______ the appeals court upheld the original conviction, finding that the jury had followed proper procedure and that the weight given to witness testimony fell within acceptable judicial discretion.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "An apparently overwhelming volume of exculpatory evidence makes the upheld conviction even more surprising — a striking concession. 'Nevertheless' signals that the conviction stood despite what appears to be comprehensive exculpatory evidence. 'Therefore' implies the court upheld conviction because of the evidence. 'For example' implies illustration. 'Similarly' implies comparison."}, {"n": 7, "type": "Causation", "passage": "In competitive markets, firms that fail to innovate or reduce costs over time are typically displaced by more efficient rivals. This competitive pressure creates a constant incentive for productivity improvements and technological adoption. ______ industries characterized by high market concentration and limited new entry often show slower rates of innovation compared to those with many competing firms.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In addition,"}], "answer": "A", "explanation": "The first two sentences establish that competition drives innovation; the third sentence introduces a contrast: concentrated industries (with less competition) show slower innovation. 'However' signals this counterpoint that qualifies the general principle. 'Consequently' implies slow innovation was caused by competition. 'For example' implies illustration of the general principle. 'In addition' adds without marking the contrast."}, {"n": 8, "type": "Clarification", "passage": "Neuroplasticity — the brain's capacity to reorganize synaptic connections in response to experience, learning, or injury — was long considered a property unique to developing brains in childhood. ______ evidence has accumulated over the past three decades demonstrating robust plasticity in adult brains, fundamentally revising the understanding of neural development as a lifelong rather than a time-limited process.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "In fact,"}], "answer": "A", "explanation": "The long-held belief that plasticity was limited to childhood is contradicted by evidence of adult plasticity. 'However' signals this direct reversal of scientific consensus. 'In fact' would also work but implies intensification of the existing belief; here the evidence contradicts the belief rather than intensifying it, making 'however' more precise. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 9, "type": "Contrast", "passage": "The ancient Stoics taught that equanimity — a calm, untroubled relationship with external events — could be achieved by distinguishing sharply between what is within one's control (one's own judgments, desires, and responses) and what lies outside it (everything else). The goal was not indifference to the world but a disciplined redirection of concern. ______ Epicurean philosophy pursued tranquility through a different means: the management of desire by limiting wants to what can be reliably satisfied.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Moreover,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "Stoicism pursued tranquility through control-distinction; Epicureanism pursued it through desire-limitation — parallel goals but different methods. 'In contrast' marks this methodological distinction between the two schools. 'Therefore' implies Epicureanism followed from Stoicism. 'Moreover' adds without distinguishing. 'Similarly' would obscure the methodological difference."}, {"n": 10, "type": "Concession", "passage": "The archaeological evidence for widespread trade between Bronze Age Mediterranean civilizations had long been considered fragmentary and largely circumstantial. Many historians treated cross-Mediterranean commerce as sporadic rather than systematic. ______ a series of shipwreck excavations in the late twentieth century revealed cargo compositions so diverse and geographically comprehensive that regular, organized trade networks could no longer be seriously disputed.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Despite historical skepticism, the shipwreck evidence effectively settled the debate in favor of systematic trade. 'Nevertheless' signals this reversal of the scholarly consensus in the face of new evidence. 'As a result' implies the shipwrecks were caused by the historical skepticism. 'For example' implies the shipwrecks illustrate the fragmentary evidence. 'Similarly' implies comparison."}, {"n": 11, "type": "Clarification", "passage": "Popular accounts of the Industrial Revolution tend to emphasize its role in generating economic growth and material improvement over the long run. The emphasis on long-run averages, however, can obscure the distribution of those gains across the population. ______ real wages for many categories of urban industrial workers showed little improvement for several decades after the beginning of industrialization, even as aggregate wealth increased substantially.", "choices": [{"label": "A", "text": "In fact,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "A", "explanation": "The second sentence raises the problem of distribution; the third sentence provides the specific evidence that corrects and deepens the popular account — stagnant real wages despite aggregate growth. 'In fact' signals this corrective revelation. 'However' implies simple contrast. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 12, "type": "Causation", "passage": "Urban heat island effects are most pronounced during still, clear nights when radiative heat loss from surfaces is unimpeded by cloud cover or wind mixing. Under these conditions, urban surfaces that have absorbed solar radiation throughout the day release stored heat slowly, keeping temperatures several degrees above those of surrounding rural areas. ______ nighttime mortality during heatwaves is disproportionately concentrated in dense urban cores rather than in peripheral or suburban zones.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "The mechanism of nighttime urban heat retention explains why mortality is concentrated in urban cores — a direct physical consequence. 'Consequently' signals this causal chain from atmospheric physics to public health outcome. 'In contrast' implies an opposing mortality pattern. 'Nevertheless' implies urban mortality despite something working against it. 'Furthermore' adds without implying causation."}, {"n": 13, "type": "Contrast", "passage": "Advocates for stricter gun regulation argue that the empirical evidence from countries with strong firearms restrictions demonstrates a clear correlation between lower gun ownership rates and reduced rates of gun violence. ______ opponents counter that cultural, demographic, and institutional differences between nations make cross-country comparisons unreliable as a basis for domestic policy recommendations.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The advocacy argument is directly countered by the methodological objection — a standard counter-argument in policy debate. 'However' signals the shift to the opposing position. 'Similarly' implies opponents share the advocates' position. 'As a result' implies the counter-argument was caused by the advocacy. 'For instance' implies illustration."}, {"n": 14, "type": "Clarification", "passage": "The term 'significant' in scientific reporting carries a specific technical meaning that differs substantially from its everyday usage. A statistically significant result indicates only that the observed effect is unlikely to have occurred by chance at a given probability threshold — typically five percent. ______ statistical significance says nothing about the magnitude of the effect, its practical importance, or whether the result is likely to replicate in different samples or contexts.", "choices": [{"label": "A", "text": "Rather,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "As a result,"}], "answer": "A", "explanation": "After defining what statistical significance does mean, the sentence uses 'rather' to specify what it does not mean — a clarification by substitution. 'Rather' signals this replacement of a common assumption with a more accurate limitation. 'Similarly' implies comparison. 'Therefore' implies causation. 'As a result' implies causation."}, {"n": 15, "type": "Addition", "passage": "The transition to remote work arrangements during the pandemic period accelerated the adoption of digital collaboration tools at a pace that would otherwise have taken years. Organizations that had resisted digital transformation for over a decade adopted new platforms within weeks. ______ the shift produced lasting changes in commercial real estate markets, with demand for large centralized office space declining substantially even after pandemic restrictions were lifted.", "choices": [{"label": "A", "text": "Moreover,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "For instance,"}], "answer": "A", "explanation": "The commercial real estate impact is a second, distinct consequence of the pandemic-driven shift to remote work — a further effect beyond the technology adoption already described. 'Moreover' signals this additional, significant consequence that extends the scope of the argument. 'However' implies contradiction. 'In contrast' implies opposition. 'For instance' implies the real estate change illustrates something already stated."}, {"n": 16, "type": "Concession", "passage": "The clinical trial was designed with what the investigators believed was an appropriate placebo control, a double-blind protocol, and a sample size calculated to detect clinically meaningful differences with adequate statistical power. Every standard methodological requirement appeared to have been met. ______ a post-publication reanalysis identified a systematic selection bias in the patient recruitment process that rendered the reported outcomes unreliable.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Meticulous methodology was in place, yet the study was still undermined by an undetected bias. 'Nevertheless' signals that even comprehensive procedural care could not prevent the methodological flaw. 'Therefore' implies the flaw was caused by the methodology. 'For instance' implies illustration. 'Similarly' implies comparison."}, {"n": 17, "type": "Contrast", "passage": "Early cognitive scientists modeled the mind as a computational device: a central processor that manipulates symbolic representations according to explicit rules, analogous to how a digital computer executes a program. This view placed cognition firmly within the boundaries of an individual skull. ______ embodied and extended cognition theorists argue that mental processes cannot be fully explained without reference to the body, tools, and environmental structures that offload and distribute cognitive work.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "D", "explanation": "Skull-bound computational cognition is directly opposed by embodied/extended cognition that places mind in body and environment — a fundamental theoretical opposition. 'In contrast' marks this paradigmatic contrast. 'Similarly' implies embodied cognition confirms the computational view. 'Therefore' implies causation. 'For example' implies illustration."}, {"n": 18, "type": "Causation", "passage": "The shift from subsistence agriculture to cash-crop farming removed the natural diversification that had historically protected smallholder households from food insecurity. Families that had once grown most of what they ate became dependent on market prices for both income and food. ______ a single poor harvest or a collapse in commodity prices could plunge previously food-secure households into acute hunger.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The shift to cash-cropping created market dependency; that dependency means a harvest failure or price collapse causes food insecurity. 'As a result' signals this consequential vulnerability created by the structural change. 'However' implies contradiction. 'In contrast' implies opposition. 'For example' implies illustration."}, {"n": 19, "type": "Clarification", "passage": "Critics of liberalism sometimes argue that the liberal emphasis on individual rights and state neutrality toward competing conceptions of the good effectively privileges certain ways of life over others, undermining the very neutrality it claims to provide. ______ the liberal framework's strong protections for property, contract, and mobility are not neutral at all but systematically advantage those with capital and education while disadvantaging those without.", "choices": [{"label": "A", "text": "In fact,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "A", "explanation": "The second sentence extends and intensifies the critique stated in the first — making the specific claim that liberal protections are not ne
