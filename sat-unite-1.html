ore varied than assumed.", "B": "Trade has connected distant regions throughout human history.", "C": "The jars in the shipwreck were of a type known as amphorae.", "D": "Because the jars held fish sauce, the region did not trade in wine at all."}, "correct": "A", "choice_families": {"B": "Çok geniş", "C": "Çok dar", "D": "Ters ilişki"}, "why_correct": "The passage's point is that the fish-sauce find implies more varied trade than the wine-and-grain focus suggested. Choice A states it.", "why_wrong": {"B": "A broad claim about trade across all history far exceeds this passage's specific finding.", "C": "That the jars were amphorae is a detail too narrow to be the main idea.", "D": "The passage never says the region traded no wine; this overstates and reverses the point."}}, {"id": "u1-l3-f2-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "Observing that a coral species survived a marine heat wave that killed its neighbors, researchers found that its tissues harbored an unusually heat-tolerant strain of symbiotic algae. The result hints that a coral's fate in warming seas may depend less on the coral itself than on the particular algae it happens to host.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Climate change threatens ecosystems across the entire planet.", "B": "A coral's survival in warming seas may hinge on the heat tolerance of the specific algae it hosts rather than on the coral alone.", "C": "The heat wave killed corals neighboring the surviving species.", "D": "Because the algae are heat-tolerant, the coral species faces no risk from warming seas."}, "correct": "B", "choice_families": {"C": "Çok dar", "D": "Ters ilişki", "A": "Çok geniş"}, "why_correct": "The passage's point is that survival may depend on the hosted algae's heat tolerance. Choice A states it precisely.", "why_wrong": {"C": "The death of neighboring corals is a detail too narrow to be the main idea.", "D": "The passage says the coral may depend on its algae, not that it faces no risk; this overstates the point.", "A": "A planet-wide claim about climate change is far broader than this specific finding about coral and algae."}}, {"id": "u1-l3-f2-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "A linguist tracking a word for 'wheel' across related languages found it descended from a single ancient root. Since the wheel was invented only once in the region, the shared word suggests the languages' common ancestor was still spoken when the wheel appeared, helping date that ancestor to a particular era.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The word for 'wheel' descended from a single ancient root.", "B": "Languages change continually over the course of centuries.", "C": "A shared inherited word for 'wheel' helps date the languages' common ancestor to the era when the wheel appeared.", "D": "Because the languages share a word for 'wheel,' they must have invented the wheel separately."}, "correct": "C", "choice_families": {"B": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage's point is that the shared word dates the common ancestor to the wheel's arrival. Choice A states it.", "why_wrong": {"B": "A general claim that languages change is far broader than this specific dating argument.", "D": "The shared word implies one invention passed down, not separate inventions; this reverses the logic.", "A": "That the word came from one root is a supporting detail, too narrow to be the main idea."}}, {"id": "u1-l3-f2-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "In a trial, patients recovering from surgery in rooms with a window view of trees needed less pain medication and left the hospital sooner than those facing a brick wall. The finding suggests that even a passive glimpse of nature may measurably aid physical recovery, not merely lift mood.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because a nature view aids recovery, hospitals no longer need pain medication.", "B": "Nature has a profound influence on every aspect of human well-being.", "C": "Patients facing a brick wall took longer to leave the hospital.", "D": "A view of nature may measurably speed physical recovery after surgery, not just improve patients' mood."}, "correct": "D", "choice_families": {"B": "Çok geniş", "C": "Çok dar", "A": "Ters ilişki"}, "why_correct": "The passage's point is that a nature view can aid physical recovery, not only mood. Choice A states it precisely.", "why_wrong": {"B": "A sweeping claim about nature and all well-being is far broader than this specific surgical finding.", "C": "The brick-wall group's slower recovery is one detail, too narrow to be the main idea.", "A": "The passage never claims medication becomes unnecessary; this overstates and reverses the point."}}, {"id": "u1-l3-f2-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "A study of a river delta found that as an upstream dam trapped sediment, the delta downstream stopped growing and began to erode, its land slipping beneath the sea. The case illustrates how an intervention in one part of a river system can produce unintended consequences far away.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "By trapping sediment, an upstream dam caused the downstream delta to erode, showing how one intervention can have distant, unintended effects.", "B": "Human activity has reshaped rivers and coastlines around the world.", "C": "The delta's land began to slip beneath the sea.", "D": "Because the dam trapped sediment, the delta downstream grew larger than before."}, "correct": "A", "choice_families": {"B": "Çok geniş", "C": "Çok dar", "D": "Ters ilişki"}, "why_correct": "The passage's point is that the dam's sediment trapping eroded the distant delta, an unintended effect. Choice A states it.", "why_wrong": {"B": "A worldwide claim about human reshaping of rivers is far broader than this specific case.", "C": "The land slipping under the sea is one detail, too narrow to be the main idea.", "D": "The passage says the delta eroded, not grew; this reverses the outcome."}}, {"id": "u1-l3-f2-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "Examining letters between two nineteenth-century scientists, a historian found that their public rivalry masked a private exchange of ideas, each quietly borrowing from the other. The correspondence suggests that a competition remembered as bitter was, behind the scenes, also a partnership.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Scientific progress has always depended on cooperation among researchers.", "B": "Private letters reveal that the scientists' famous rivalry was, behind the scenes, also a quiet exchange of ideas.", "C": "The two scientists exchanged letters over a period of years.", "D": "Because the scientists borrowed from each other, their public rivalry never actually existed."}, "correct": "B", "choice_families": {"C": "Çok dar", "D": "Ters ilişki", "A": "Çok geniş"}, "why_correct": "The passage's point is that the bitter rivalry concealed a private partnership. Choice A states it precisely.", "why_wrong": {"C": "That they exchanged letters is a detail too narrow to be the main idea.", "D": "The passage affirms the public rivalry was real; this denies it, reversing the point.", "A": "A sweeping claim about all scientific progress far exceeds this passage's specific case."}}, {"id": "u1-l3-f2-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "A composer known for grand orchestral works left, at her death, a notebook of short pieces for solo piano. Spare and intimate, they reveal a side of her art her public works had hidden. The notebook suggests that even an artist defined by scale could think in miniature.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The piano pieces in the notebook were spare and intimate.", "B": "Great artists often produce work in more than one form.", "C": "A notebook of intimate piano miniatures reveals a private, small-scale side of a composer known for grand orchestral works.", "D": "Because she wrote miniatures, the composer never truly mastered large orchestral works."}, "correct": "C", "choice_families": {"B": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage's point is that the miniatures reveal a hidden, intimate side of a large-scale composer. Choice A states it.", "why_wrong": {"B": "A general claim that artists work in many forms is far broader than this specific case.", "D": "The passage does not question her orchestral mastery; this invents and reverses a claim.", "A": "That the pieces were spare and intimate is a detail too narrow to be the main idea."}}, {"id": "u1-l3-f3-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "The physicist Lise Meitner helped explain nuclear fission but was omitted from the Nobel Prize awarded for the discovery. Working in exile after fleeing Nazi Germany, she corresponded with her former collaborator, who ran the experiments while she supplied the theoretical account that made sense of the results. Later historians have widely regarded the omission as a serious injustice.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Meitner's collaborator ran the experiments that produced the results.", "B": "Meitner fled Nazi Germany and worked in exile.", "C": "Meitner supplied the theoretical explanation of nuclear fission yet was unjustly left out of the Nobel Prize for the discovery.", "D": "Because Meitner worked in exile, she made no contribution to explaining fission."}, "correct": "C", "choice_families": {"B": "Doğru ama alakasız", "D": "Ters ilişki", "A": "Doğru ama alakasız"}, "why_correct": "The passage centers on Meitner's theoretical contribution and her unjust exclusion from the prize. Choice A captures that.", "why_wrong": {"B": "Her exile is true and mentioned, but it is background, tangential to the main point about her contribution and the prize.", "D": "The passage says she supplied the theory despite exile; this denies her contribution and reverses the point.", "A": "That her collaborator ran the experiments is true but a supporting detail, not the central point."}}, {"id": "u1-l3-f3-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "A restored wetland outside a growing city was expected mainly to shelter wildlife. It did, but its greatest value proved unexpected: during heavy storms, the marsh absorbed floodwater that would otherwise have swamped nearby streets, sparing the city costly damage. The project's return, officials found, lay as much in flood control as in habitat.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because the wetland controlled floods, it provided no habitat for wildlife.", "B": "The wetland lies just outside a growing city.", "C": "The city around the wetland was expanding.", "D": "A wetland restored chiefly for wildlife turned out to deliver its greatest value through flood control."}, "correct": "D", "choice_families": {"B": "Doğru ama alakasız", "C": "Doğru ama alakasız", "A": "Ters ilişki"}, "why_correct": "The passage's point is that the wetland's unexpected flood-control value rivaled its habitat value. Choice A states it.", "why_wrong": {"B": "The wetland's location is true but tangential to the point about its value.", "C": "The city's growth is background, true but not the central idea.", "A": "The passage says it sheltered wildlife and controlled floods; this denies the habitat and reverses the point."}}, {"id": "u1-l3-f3-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "Engineers coated a set of bridge cables with a new polymer, expecting it chiefly to resist rust. Over three winters, the coated cables did resist corrosion, but they also shed ice far more readily than bare cables, reducing the dangerous buildup that had closed the bridge in past storms.", "stem": "According to the text, what was the unexpected outcome of the coating trial?", "choices": {"A": "The coated cables shed ice more readily, reducing hazardous buildup.", "B": "The coated cables resisted corrosion over three winters.", "C": "The bridge had been closed during past storms.", "D": "The coating caused more ice to build up on the cables than before."}, "correct": "A", "choice_families": {"B": "Doğru ama alakasız", "C": "Doğru ama alakasız", "D": "Ters ilişki"}, "why_correct": "The text calls the ice-shedding the unexpected outcome, since corrosion resistance was expected. Choice A reports it.", "why_wrong": {"B": "Corrosion resistance was the expected outcome, not the unexpected one the question asks for.", "C": "The past closures are background, true but not the unexpected outcome.", "D": "The text says the coating reduced ice buildup; this reverses that result."}}, {"id": "u1-l3-f3-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "A novelist celebrated for her intricate plots claimed in interviews that character always came first for her, and that plot merely followed from who her people were. Critics, however, have noted that her manuscripts show plots mapped in detail before a single character was named, complicating the account she gave of her own method.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The novelist was celebrated for the intricacy of her plots.", "B": "Evidence from the novelist's manuscripts complicates her claim that character, not plot, drove her writing.", "C": "The novelist gave interviews about her writing method.", "D": "Because character came first for her, she never planned her plots in advance."}, "correct": "B", "choice_families": {"C": "Doğru ama alakasız", "D": "Ters ilişki", "A": "Doğru ama alakasız"}, "why_correct": "The passage's point is the tension between her stated method and the manuscript evidence. Choice A captures it.", "why_wrong": {"C": "That she gave interviews is a true detail, not the central idea.", "D": "The manuscripts show she did plan plots in advance; this reverses that evidence.", "A": "Her fame for intricate plots is true but background to the point about her stated method."}}, {"id": "u1-l3-f3-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "A city replaced a busy road with a linear park, and planners braced for worse traffic on surrounding streets. The gridlock never came. Many drivers, it turned out, simply stopped making trips they had taken only because the road made them easy, so the total number of car trips fell rather than shifting elsewhere.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Planners had expected traffic on surrounding streets to worsen.", "B": "The city built a linear park where the road had been.", "C": "Removing the road reduced the total number of car trips rather than pushing traffic onto other streets.", "D": "Because the road was removed, traffic on surrounding streets grew much heavier."}, "correct": "C", "choice_families": {"B": "Doğru ama alakasız", "D": "Ters ilişki", "A": "Doğru ama alakasız"}, "why_correct": "The passage's point is that removing the road cut total trips rather than displacing them. Choice A states it.", "why_wrong": {"B": "The park is true but the setting, tangential to the point about traffic.", "D": "The passage says gridlock never came; this asserts the opposite, reversing the outcome.", "A": "The planners' expectation is background that sets up the surprise, not the main idea."}}, {"id": "u1-l3-f3-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "The rare shrub had puzzled botanists whose greenhouse seeds never sprouted. In the wild, its seeds lay dormant until a wildfire swept through; the heat cracked their tough coats, letting in water. Only then, with competitors burned away and the coat breached, did the seedlings emerge.", "stem": "According to the text, why did the seeds germinate only after the fire?", "choices": {"A": "The fire sealed the seed coats, keeping water out until later.", "B": "The shrub was rare and had puzzled botanists.", "C": "The seeds had failed to sprout in the greenhouse.", "D": "The fire's heat cracked the seeds' tough coats, allowing water to enter."}, "correct": "D", "choice_families": {"B": "Doğru ama alakasız", "C": "Doğru ama alakasız", "A": "Ters ilişki"}, "why_correct": "The text says the fire's heat cracked the coats so water could enter, triggering germination. Choice A reports it.", "why_wrong": {"B": "The shrub's rarity is true but not the reason for germination.", "C": "The greenhouse failure sets up the puzzle but is not the cause the question asks for.", "A": "The text says the heat cracked the coats to let water in; this reverses the effect."}}, {"id": "u1-l3-f3-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "An economist studying a famine found that food output in the region had not actually fallen that year. Grain was available, but a collapse in wages left laborers unable to buy it, and much of the harvest was exported to areas that could pay more. The famine, she argued, was a failure of access, not of supply.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The famine resulted not from a shortage of food but from a collapse in access, as workers could not afford the grain that was available.", "B": "Much of the region's harvest was exported to areas that could pay more.", "C": "The economist studied a famine in a particular region.", "D": "Because food output fell sharply, the region ran out of grain."}, "correct": "A", "choice_families": {"B": "Doğru ama alakasız", "C": "Doğru ama alakasız", "D": "Ters ilişki"}, "why_correct": "The passage's point is that the famine was a failure of access, not supply. Choice A states it.", "why_wrong": {"B": "The export of grain is one supporting detail, true but not the central claim.", "C": "That she studied a famine is background, not the main idea.", "D": "The passage says output did not fall; this asserts the opposite, reversing the point."}}, {"id": "u1-l3-f3-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "A widely shared story holds that a scientist's great insight came in a sudden dream. Her own notebooks, kept over years, tell a different tale: the idea took shape gradually through dozens of failed sketches and revisions. The dream, if it happened at all, capped a long labor rather than replacing it.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The scientist kept notebooks over a period of years.", "B": "The scientist's notebooks show that her insight developed through long, gradual work, not the sudden dream of legend.", "C": "A widely shared story describes the scientist's dream.", "D": "Because the insight came in a dream, the years of sketches contributed nothing."}, "correct": "B", "choice_families": {"C": "Doğru ama alakasız", "D": "Ters ilişki", "A": "Doğru ama alakasız"}, "why_correct": "The passage's point is that the insight grew gradually, contrary to the dream legend. Choice A states it.", "why_wrong": {"C": "The dream story is the view being corrected, not the central claim.", "D": "The passage says the sketches did the work; this denies their role, reversing the point.", "A": "That she kept notebooks is the source of evidence, a true detail but not the main idea."}}, {"id": "u1-l3-f3-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "Searchers had combed the seabed for years without success. The break came from an old harbor ledger listing the ship's final cargo and its recorded heading on the night it sank. Matching that heading to the currents, the divers narrowed the search area and found the wreck within days.", "stem": "According to the text, what allowed the divers to locate the wreck?", "choices": {"A": "The divers found the wreck within days.", "B": "Searchers had combed the seabed for years.", "C": "A harbor ledger recording the ship's heading, matched to the currents, narrowed the search area.", "D": "The ledger's record of the heading led the divers away from the wreck."}, "correct": "C", "choice_families": {"B": "Doğru ama alakasız", "D": "Ters ilişki", "A": "Doğru ama alakasız"}, "why_correct": "The text credits the ledger's heading, matched to currents, for narrowing the search. Choice A reports it.", "why_wrong": {"B": "The years of fruitless searching is background, not what finally worked.", "D": "The text says the heading led them to the wreck; this reverses that.", "A": "Finding the wreck in days is the result, not the means the question asks about."}}, {"id": "u1-l3-f3-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Doğru ama alakasız", "passage": "A study of remote work found that employees reported higher satisfaction and focus at home, a result often cited by its advocates. The same study, less often quoted, found that newer employees learned their roles more slowly without the informal guidance of nearby colleagues. The picture it painted was mixed, not simply favorable.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because remote work raised satisfaction, it improved every measure the study examined.", "B": "Advocates of remote work often cite the study's findings.", "C": "Employees reported higher satisfaction when working at home.", "D": "The study of remote work found mixed results, with gains in satisfaction but slower learning for newer employees."}, "correct": "D", "choice_families": {"B": "Doğru ama alakasız", "C": "Çok dar", "A": "Ters ilişki"}, "why_correct": "The passage's point is that the study's results were mixed, not simply favorable. Choice A states it.", "why_wrong": {"B": "That advocates cite the study is a true aside, tangential to its mixed findings.", "C": "The satisfaction gain is one half of the mixed picture, too narrow to be the whole main idea.", "A": "The passage stresses a downside; this claims every measure improved, reversing the point."}}, {"id": "u1-l3-f4-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "A biologist studying a bird species found that the males with the brightest plumage were also the most vulnerable to predators, since their color made them easy to spot. Yet these males fathered the most chicks, because females strongly preferred them. Bright color, then, carried both a survival cost and a reproductive reward.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Birds are among the most colorful animals in the natural world.", "B": "Bright plumage made males more successful at avoiding predators.", "C": "The brightest males fathered the most chicks.", "D": "Among the birds, bright plumage raised the risk of predation but also increased reproductive success, so it carried both a cost and a reward."}, "correct": "D", "choice_families": {"B": "Ters ilişki", "C": "Çok dar", "A": "Çok geniş"}, "why_correct": "The passage's point is the trade-off: bright color costs survival but rewards reproduction. Choice A captures both sides.", "why_wrong": {"B": "The passage says bright color made males easier for predators to spot, so this reverses the survival relationship.", "C": "The reproductive success is one half of the trade-off, too narrow to be the main idea.", "A": "A general claim about birds' colorfulness is far broader than this specific finding."}}, {"id": "u1-l3-f4-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "Contrary to the belief that irrigation always boosts farm output, a study of one arid region found that decades of irrigation had gradually left salt deposits in the soil as the water evaporated. Over time these deposits poisoned the land, and yields on the most heavily irrigated fields fell below those of fields left dry.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "In the region studied, long-term irrigation built up salt that eventually lowered yields below those of unirrigated fields.", "B": "Irrigation reliably increases farm output in arid regions.", "C": "Salt deposits formed in the soil as irrigation water evaporated.", "D": "Water is essential to agriculture in dry parts of the world."}, "correct": "A", "choice_families": {"B": "Ters ilişki", "C": "Çok dar", "D": "Çok geniş"}, "why_correct": "The passage's point is that irrigation eventually lowered yields through salt buildup. Choice A states that reversal.", "why_wrong": {"B": "The passage shows irrigation lowering yields here, so this reverses its central finding.", "C": "The salt deposits are the mechanism, a detail too narrow to be the whole main idea.", "D": "A general statement about water and agriculture is far broader than this specific case."}}, {"id": "u1-l3-f4-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "Planners once assumed that widening a highway would ease congestion. Studies of several widened highways found the opposite: the added capacity drew more drivers who had previously avoided the route or traveled at other times, so within a few years traffic was as heavy as before, or heavier.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Widening a highway reliably reduces the congestion on it.", "B": "Widening highways tended to attract more drivers, leaving congestion as bad as or worse than before rather than easing it.", "C": "Some drivers had previously avoided the route or traveled at other times.", "D": "Highways are a central feature of modern transportation systems."}, "correct": "B", "choice_families": {"C": "Çok dar", "D": "Çok geniş", "A": "Ters ilişki"}, "why_correct": "The passage's point is that widening drew more traffic and failed to ease congestion. Choice A states that reversal.", "why_wrong": {"C": "That some drivers had avoided the route is a supporting detail, too narrow to be the main idea.", "D": "A general statement about highways is far broader than this specific finding.", "A": "The passage shows widening failing to reduce congestion, so this reverses its finding."}}, {"id": "u1-l3-f4-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "A common assumption holds that predators harm the populations of the animals they hunt. On one island, however, removing a top predator caused the prey population to crash, not flourish: freed from the predator, the prey overgrazed their food supply until famine set in. The predator, it turned out, had kept the prey's numbers sustainable.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The prey overgrazed their food supply after the predator was removed.", "B": "Predators reduce the populations of the animals they hunt.", "C": "Removing the predator caused the prey to overgraze and collapse, showing the predator had actually kept the prey population sustainable.", "D": "Islands often host unusual and fragile ecosystems."}, "correct": "C", "choice_families": {"B": "Ters ilişki", "D": "Çok geniş", "A": "Çok dar"}, "why_correct": "The passage's point is that the predator sustained rather than harmed the prey population. Choice A states that reversal.", "why_wrong": {"B": "The passage shows the predator sustaining the prey, so this reverses the central finding.", "D": "A general remark about island ecosystems is far broader than this specific case.", "A": "The overgrazing is the mechanism, a detail too narrow to be the whole main idea."}}, {"id": "u1-l3-f4-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "It seems natural to assume that giving people more choices makes them happier with what they pick. A study of shoppers found the reverse: those offered dozens of jam varieties were less likely to buy any and less satisfied with their purchase than those offered only a few, as the abundance of options bred doubt and regret.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Consumer behavior is influenced by many psychological factors.", "B": "More choices reliably make people happier with what they select.", "C": "Shoppers offered many jams were less likely to make a purchase.", "D": "Offering shoppers many choices left them less likely to buy and less satisfied than offering only a few, contrary to the assumption that more choice helps."}, "correct": "D", "choice_families": {"B": "Ters ilişki", "C": "Çok dar", "A": "Çok geniş"}, "why_correct": "The passage's point is that more choice reduced satisfaction and purchasing. Choice A states that reversal.", "why_wrong": {"B": "The passage shows more choice lowering satisfaction, so this reverses the finding.", "C": "The drop in purchasing is one half of the result, too narrow to be the whole main idea.", "A": "A general claim about consumer psychology is far broader than this specific study."}}, {"id": "u1-l3-f4-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "A city assumed that brighter street lighting would lower nighttime accidents. After it installed intense lighting on several roads, accidents on them rose. Researchers suggested the glare and the false sense of safety led drivers to speed up, offsetting any benefit from better visibility.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Brighter street lighting was followed by more accidents, apparently because it led drivers to speed, contrary to the city's expectation.", "B": "Brighter lighting reliably reduces nighttime traffic accidents.", "C": "The city installed intense lighting on several roads.", "D": "Traffic safety depends on a wide range of contributing factors."}, "correct": "A", "choice_families": {"B": "Ters ilişki", "C": "Çok dar", "D": "Çok geniş"}, "why_correct": "The passage's point is that brighter lighting was followed by more, not fewer, accidents. Choice A states that reversal.", "why_wrong": {"B": "The passage shows lighting raising accidents here, so this reverses the finding.", "C": "That the city installed the lighting is a setup detail, too narrow to be the main idea.", "D": "A general statement about traffic safety is far broader than this specific case."}}, {"id": "u1-l3-f4-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "Museums long believed that displaying more of their collection would draw more visitors. One museum found that crowding many works into each gallery actually shortened visits: overwhelmed, visitors skimmed and left sooner. When the museum showed fewer works with more space, people lingered and returned more often.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Displaying more of a collection reliably draws more visitors.", "B": "Showing fewer works with more space lengthened and increased visits, reversing the museum's belief that displaying more would draw more.", "C": "Overwhelmed visitors skimmed the crowded galleries and left sooner.", "D": "Museums play an important cultural role in many communities."}, "correct": "B", "choice_families": {"C": "Çok dar", "D": "Çok geniş", "A": "Ters ilişki"}, "why_correct": "The passage's point is that showing fewer works improved visits, reversing the museum's assumption. Choice A states it.", "why_wrong": {"C": "The skimming behavior is one detail, too narrow to be the whole main idea.", "D": "A general remark about museums' role is far broader than this specific finding.", "A": "The passage shows more works shortening visits, so this reverses the finding."}}, {"id": "u1-l3-f4-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "A manager assumed that setting tighter deadlines would push a team to work faster. Instead, the tighter the deadline, the more errors crept into the work, forcing time-consuming rounds of correction. The rushed projects ended up taking longer overall than those given generous schedules.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Errors crept into the work done under tight deadlines.", "B": "Tighter deadlines reliably make a team complete work faster.", "C": "Tighter deadlines produced more errors and, after corrections, longer overall times, contrary to the manager's expectation of faster work.", "D": "Effective management requires attention to many competing demands."}, "correct": "C", "choice_families": {"B": "Ters ilişki", "D": "Çok geniş", "A": "Çok dar"}, "why_correct": "The passage's point is that tight deadlines lengthened total time through errors. Choice A states that reversal.", "why_wrong": {"B": "The passage shows tight deadlines slowing overall completion, so this reverses the finding.", "D": "A general claim about management is far broader than this specific case.", "A": "The errors are the mechanism, a detail too narrow to be the whole main idea."}}, {"id": "u1-l3-f4-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "Foresters once cleared away fallen wood to keep forests tidy and, they believed, healthy. Studies revealed the practice backfired: the rotting logs they removed had housed insects, fungi, and seedlings, and had slowly released nutrients into the soil. Forests stripped of deadwood grew less diverse and less vigorous, not more.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Forests are complex ecosystems supporting many forms of life.", "B": "Clearing fallen wood keeps forests healthier and more vigorous.", "C": "Rotting logs had housed insects, fungi, and seedlings.", "D": "Removing fallen wood left forests less diverse and less vigorous, reversing the belief that clearing deadwood keeps forests healthy."}, "correct": "D", "choice_families": {"B": "Ters ilişki", "C": "Çok dar", "A": "Çok geniş"}, "why_correct": "The passage's point is that clearing deadwood harmed forests, reversing the old belief. Choice A states it.", "why_wrong": {"B": "The passage shows clearing deadwood harming forests, so this reverses the finding.", "C": "What the logs housed is a supporting detail, too narrow to be the whole main idea.", "A": "A general statement about forest complexity is far broader than this specific finding."}}, {"id": "u1-l3-f4-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters ilişki", "passage": "A school assumed that assigning more homework would raise test scores. Tracking several grade levels, researchers found that beyond about an hour a night, additional homework was linked to slightly lower scores, as fatigue and lost sleep outweighed any gain from extra practice.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Beyond about an hour a night, more homework was linked to slightly lower scores, contrary to the school's assumption that more would raise them.", "B": "Assigning more homework reliably raises students' test scores.", "C": "Researchers tracked several grade levels in the study.", "D": "Education is shaped by a wide array of policies and practices."}, "correct": "A", "choice_families": {"B": "Ters ilişki", "C": "Doğru ama alakasız", "D": "Çok geniş"}, "why_correct": "The passage's point is that beyond an hour, more homework lowered scores, reversing the assumption. Choice A states it.", "why_wrong": {"B": "The passage shows more homework lowering scores past a point, so this reverses the finding.", "C": "That researchers tracked grade levels is a true procedural detail, tangential to the main idea.", "D": "A general remark about education is far broader than this specific finding."}}]}, {"no": 4, "name": "Inferences", "teaching": {"ne_olculuyor": ["Metnin SONUNDA bir boşluk vardır. Boşluğu dolduran şık metnin mantıksal sonucu olmalıdır.", "Boşluk neredeyse her zaman bir sonuç işaretçisinden sonra gelir: therefore, thus, this suggests that, it can be concluded that, so.", "Çıkarım demek, tahmin demek değildir. Çıkarım, metnin verdiği bilgiden ZORUNLU olarak çıkan şeydir. Metin bunu söylemez ama metin bunu gerektirir."], "karar_proseduru": ["Boşluğun ÖNCESİNDEKİ cümleyi oku ve mantık yönünü bul.  Metin bir karşıtlık mı kuruyor, bir sebep mi veriyor, bir şaşırtıcı bulgu mu sunuyor.", "Metnin verdiği bütün olguları say.  Çıkarım genelde İKİ olguyu birleştirir. Sadece birine dayanan şık eksiktir.", "Kendi cümleni kur.  Şıklara bakmadan önce boşluğa ne geleceğini kendin yaz. Sonra en yakın şıkkı bul.", "Güçlü kelime taraması yap.  always, never, all, only, impossible, prevents, must, exclusively içeren şıkları işaretle. Bunların çoğu yanlıştır."], "celdirici_aileleri": [{"ad": "Çok güçlü", "tanim": "Şık mutlak bir iddia kurar. always, never, all, only, prevents, impossible. SAT çıkarımı İHTİYATLIDIR. Doğru cevap genelde may, can, suggests, tend to, is likely to gibi yumuşak fiillerle gelir."}, {"ad": "Metnin dışına çıkma", "tanim": "Şık makuldür, hatta gerçek hayatta doğrudur, ama metinde onu destekleyen hiçbir şey yoktur. Kendi bilgini kullanma. Metin ne diyorsa o."}, {"ad": "Öncül sonuç karışıklığı", "tanim": "Şık metinde zaten SÖYLENMİŞ bir şeyi tekrar eder. Bu bir çıkarım değil, bir alıntıdır. Çıkarım metnin ÖTESİNE geçer. Metni tekrar eden şık yanlıştır."}, {"ad": "Yön doğru, derece yanlış", "tanim": "Şıkkın yönü doğrudur ama iddiayı metnin destekleyeceğinden fazla ileri götürür. Metin bir etkiden bahsediyorsa şık o etkinin TEK sebep olduğunu söylüyordur."}], "top_tips": ["Güçlü kelime testi. Şıklarda always, never, all, only, none, impossible, prevents, entirely, exclusively varsa o şıkkı önce şüphelen. SAT'de bu kelimeleri içeren şık onda dokuz yanlıştır. Bu tek kural sana sınavda iki üç soru kazandırır.", "Boşluktan önceki cümlede however ya da but varsa çıkarım bir KARŞITLIK taşır. O zaman doğru şık beklentiyle çelişen bir şeyi söyler.", "Metin iki grubu karşılaştırıyorsa çıkarım genelde İKİSİ hakkındadır. Sadece bir gruptan bahseden şık eksiktir.", "Doğru cevabın fiiline bak. may, can, suggests, is likely to. Bu yumuşak fiiller SAT'ın imzasıdır."], "kavramsal_temel": ["Inferences, metnin AÇIKÇA söylemediği ama mantıken zorunlu kıldığı sonucu bulmanı ister. Boşluk çoğu zaman bir cümlenin sonundadır ve sen metnin verdiği bilgiden en güvenli çıkarımı yaparsın.", "Çıkarım tahmin değildir. Doğru cevap metnin bilgisinden MANTIKEN çıkan, başka türlü olamayacak sonuçtur. Metin dışı bilgi, geniş genelleme ya da olası ama zorunlu olmayan sonuç yanlıştır.", "En sık tuzak, metinle uyumlu ama metnin garanti etmediği bir sonuca atlamaktır. Seçenek makul gelebilir ama metin onu zorunlu kılmıyorsa doğru değildir. Çıkarımda ölçüt makullük değil, zorunluluktur.", "Bu yüzden her seçenek için sor: metin bunu KESİN kılıyor mu, yoksa sadece mümkün mu kılıyor. Sadece mümkün kılanlar çeldiricidir."], "cozumlu_ornekler": [{"passage": "Every plant in the greenhouse requires at least six hours of direct sunlight each day to flower. The fern in the north corner receives only three hours of direct sunlight. It can therefore be concluded that the fern ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "will not flower under its current conditions", "B": "is the healthiest plant in the greenhouse", "C": "should be moved outdoors immediately", "D": "receives more water than the other plants"}, "correct": "A", "adimlar": ["Metnin verdiği kuralı oku: çiçek açmak için en az altı saat güneş gerekiyor.", "Fern sadece üç saat alıyor, yani kurala ulaşmıyor.", "Mantıken zorunlu sonuç: fern mevcut koşulda çiçek açamaz. A bunu söyler.", "B, C, D metinden çıkmaz. Sağlıklı olması, dışarı taşınması, şu miktarı metinde yok, sadece tahmin."], "sonuc": "Çıkarım metnin kuralından mantıken zorunlu çıkan sonuçtur, makul tahmin değil."}, {"passage": "The museum's most valuable painting is displayed only during the summer months. A visitor who came in January was disappointed not to see it. From this it can be inferred that the visitor ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "had hoped to see that particular painting", "B": "disliked all the other paintings", "C": "will return every summer from now on", "D": "works at the museum"}, "correct": "A", "adimlar": ["Metin: ziyaretçi tabloyu göremediği için HAYAL KIRIKLIĞINA uğradı.", "Hayal kırıklığı, o tabloyu görmeyi UMDUĞUNU zorunlu kılar.", "A tam bunu söyler, metnin bilgisinden doğrudan çıkar.", "B, C, D metinden çıkmaz. Diğer tabloları sevmemesi, her yaz gelmesi, müzede çalışması zorunlu değil."], "sonuc": "Güvenli çıkarım metnin garanti ettiği sonuçtur. Mümkün ama garanti olmayan seçenekler tuzaktır."}], "sik_hatalar": [{"hata": "Makul ama zorunlu olmayan sonuca atlamak", "cozum": "Seçenek metinle uyumlu olabilir ama metin onu KESİN kılmıyorsa yanlıştır. Ölçüt zorunluluktur."}, {"hata": "Metin dışı bilgi eklemek", "cozum": "Çıkarım sadece metnin verdiği bilgiye dayanmalı. Dışarıdan getirdiğin şey çıkarım değildir."}, {"hata": "Çok güçlü genelleme yapmak", "cozum": "her zaman, hiçbir zaman, herkes gibi mutlak seçenekler çoğu zaman metnin garanti ettiğinden fazlasını söyler."}, {"hata": "Duygu ya da niyet uydurmak", "cozum": "Metnin belirtmediği bir duygu ya da niyeti seçeneğe eklersen, o çıkarım değil tahmindir."}], "strateji": ["Metnin verdiği bilgiyi ve varsa kuralı net oku.", "Boşluktan önce dur, kendi zorunlu sonucunu tahmin et.", "Her seçenek için sor: metin bunu kesin mi kılıyor, yoksa sadece mümkün mu.", "Mümkün ama zorunlu olmayanları ele.", "Mutlak ve aşırı genel seçenekleri dikkatle test et."]}, "families": ["Çok güçlü", "Metnin dışına çıkma", "Öncül sonuç karışıklığı", "Yön doğru derece yanlış"], "fam_short": {"Çok güçlü": "Çok güçlü", "Metnin dışına çıkma": "Metin dışı", "Öncül sonuç karışıklığı": "Öncül-sonuç", "Yön doğru derece yanlış": "Derece"}, "main_ids": ["u1-l4-f1-01", "u1-l4-f2-01", "u1-l4-f3-01", "u1-l4-f4-01"], "questions": [{"id": "u1-l4-f1-01", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "A team compared two methods of teaching vocabulary. Students who encountered new words in varied sentences remembered them better a month later than students who memorized definitions in isolation. The advantage held across every group tested, though its size varied from class to class. The results suggest that, for retention, encountering words in varied contexts is generally ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "more effective than memorizing isolated definitions.", "B": "the only method by which students can ever learn new words.", "C": "slightly less effective than memorizing definitions in isolation.", "D": "proof that memorizing definitions harms students' vocabulary."}, "correct": "A", "choice_families": {"B": "Çok güçlü", "C": "Yön doğru derece yanlış", "D": "Metnin dışına çıkma"}, "why_correct": "The study found varied-context learning outperformed isolated memorization across all groups, so concluding it is generally more effective is warranted.", "why_wrong": {"B": "Claiming it is the only way words can ever be learned goes far beyond a comparison of two methods.", "C": "The data show varied contexts more effective, not slightly less, so this reverses the degree.", "D": "The study shows isolated memorization was less effective, not that it harms vocabulary; that is not in the text."}}, {"id": "u1-l4-f1-02", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "Researchers found that a region's songbirds sang at a higher pitch in neighborhoods with heavy traffic noise than in quiet ones. Because the higher pitch carried better above the low rumble of traffic, the birds in noisy areas may have been adjusting their songs so as to ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "eliminate all interference from traffic noise completely.", "B": "be heard more clearly over the surrounding noise.", "C": "make their songs harder for other birds to hear.", "D": "attract the attention of the human residents nearby."}, "correct": "B", "choice_families": {"C": "Yön doğru derece yanlış", "D": "Metnin dışına çıkma", "A": "Çok güçlü"}, "why_correct": "The higher pitch carried better over traffic, so adjusting to be heard more clearly over the noise is the warranted inference.", "why_wrong": {"C": "The birds raised pitch to be heard better, not to be harder to hear; this reverses the aim.", "D": "Nothing in the text concerns attracting human residents; that goes outside the passage.", "A": "Eliminating all interference completely overstates what a pitch shift could achieve."}}, {"id": "u1-l4-f1-03", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "In an archaeological site, tools made of a stone found only in distant mountains appear in layers dated to a period when no local source of that stone was available. The presence of these tools indicates that the site's inhabitants had, in some form, ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "no contact whatsoever with distant communities.", "B": "complete control over every trade route in the region.", "C": "access to materials originating far from the site.", "D": "invented a method for creating the stone artificially."}, "correct": "C", "choice_families": {"B": "Çok güçlü", "D": "Metnin dışına çıkma", "A": "Öncül sonuç karışıklığı"}, "why_correct": "Tools of distant stone with no local source imply the inhabitants obtained far-off materials somehow, the modest warranted inference.", "why_wrong": {"B": "Complete control over every trade route far overstates what the tools show.", "D": "Nothing suggests they manufactured the stone; that goes outside the passage.", "A": "The tools show contact with distant sources, so no contact contradicts the evidence."}}, {"id": "u1-l4-f1-04", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "A study tracked shoppers offered free samples of a new tea. Those who tasted a sample were somewhat more likely to buy the tea that day than those who did not, though most sample-takers still did not buy it. The results suggest that offering samples ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "has been adopted by every major tea seller.", "B": "guarantees that shoppers will buy the product.", "C": "makes shoppers less willing to buy the product.", "D": "can modestly increase the chance of a purchase."}, "correct": "D", "choice_families": {"B": "Çok güçlü", "C": "Yön doğru derece yanlış", "A": "Metnin dışına çıkma"}, "why_correct": "Sample-takers were somewhat more likely to buy, though most did not, so a modest increase in purchase chance is the warranted inference.", "why_wrong": {"B": "A guarantee of purchase is far too strong when most sample-takers did not buy.", "C": "Samples raised the chance of buying, not lowered it; this reverses the direction.", "A": "Whether every major seller uses samples is not addressed in the text."}}, {"id": "u1-l4-f1-05", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "Over several winters, a botanist noted that a certain alpine flower bloomed a few days earlier in years with warmer early springs. The pattern was consistent but modest, with blooming rarely shifting by more than a week. The observations suggest that the flower's blooming time is ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "somewhat sensitive to early-spring temperature.", "B": "entirely determined by early-spring temperature alone.", "C": "completely unaffected by temperature of any kind.", "D": "identical from one year to the next regardless of weather."}, "correct": "A", "choice_families": {"B": "Çok güçlü", "C": "Öncül sonuç karışıklığı", "D": "Yön doğru derece yanlış"}, "why_correct": "A modest, consistent shift with warmth means blooming is somewhat sensitive to early-spring temperature, the warranted inference.", "why_wrong": {"B": "Being entirely determined by temperature alone overstates a modest, few-day shift.", "C": "The flower does respond to temperature, so calling it completely unaffected contradicts the data.", "D": "The blooming time varied with warmth, so calling it identical every year misstates the degree."}}, {"id": "u1-l4-f1-06", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "A survey found that employees allowed to set their own start times reported higher job satisfaction than those on fixed schedules, though many other factors also shaped satisfaction. The finding suggests that flexible start times can ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "single-handedly determine how satisfied any employee feels.", "B": "contribute to greater job satisfaction for some employees.", "C": "lower the satisfaction of employees who use them.", "D": "be legally required of employers in most countries."}, "correct": "B", "choice_families": {"C": "Yön doğru derece yanlış", "D": "Metnin dışına çıkma", "A": "Çok güçlü"}, "why_correct": "Flexibility was linked to higher satisfaction among many factors, so it can contribute to satisfaction for some, the warranted inference.", "why_wrong": {"C": "Flexibility was tied to higher, not lower, satisfaction; this reverses the direction.", "D": "Legal requirements are not mentioned; that goes outside the passage.", "A": "Single-handedly determining satisfaction ignores the many other factors the passage names."}}, {"id": "u1-l4-f1-07", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "Divers surveying a reef found that sections sheltered from strong currents held a greater variety of coral than exposed sections did. Because sheltered coral is less likely to be broken apart by water movement, the survey suggests that reduced water force may ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "reduce the diversity of coral in sheltered areas.", "B": "be the sole cause of all coral diversity everywhere.", "C": "help support a greater diversity of coral.", "D": "prove that currents play no role in shaping reefs."}, "correct": "C", "choice_families": {"B": "Çok güçlü", "D": "Öncül sonuç karışıklığı", "A": "Yön doğru derece yanlış"}, "why_correct": "Sheltered, lower-force sections held more variety, so reduced water force may help support greater diversity, the warranted inference.", "why_wrong": {"B": "Being the sole cause of all diversity everywhere far overstates a single reef survey.", "D": "The passage implies currents do shape reefs, so claiming no role contradicts it.", "A": "Shelter was linked to more, not less, diversity; this reverses the direction."}}, {"id": "u1-l4-f1-08", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "A historian examining household inventories from a port town found that imported spices, once listed only in the wealthiest homes, gradually appeared in more modest households over the century. The record suggests that access to such spices ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "was made possible by a new sea route the town discovered.", "B": "became universal across every household in the town.", "C": "narrowed to fewer and fewer homes over the century.", "D": "widened beyond the wealthiest households over time."}, "correct": "D", "choice_families": {"B": "Çok güçlü", "C": "Yön doğru derece yanlış", "A": "Metnin dışına çıkma"}, "why_correct": "Spices spread from the wealthiest to more modest homes, so access widened beyond the wealthy, the warranted inference.", "why_wrong": {"B": "Universal access in every household overstates a gradual spread to more modest homes.", "C": "Access broadened rather than narrowed; this reverses the trend.", "A": "A newly discovered sea route is not mentioned; that goes outside the passage."}}, {"id": "u1-l4-f1-09", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "In trials, a robotic arm guided by a new control system completed assembly tasks with fewer errors than one using the older system, though it worked at about the same speed. The trials suggest that the new system offers an advantage mainly in ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "accuracy rather than speed.", "B": "every possible measure of performance at once.", "C": "speed rather than accuracy.", "D": "reducing the cost of manufacturing the arm."}, "correct": "A", "choice_families": {"B": "Çok güçlü", "C": "Öncül sonuç karışıklığı", "D": "Metnin dışına çıkma"}, "why_correct": "The new system cut errors at similar speed, so its advantage lies mainly in accuracy, not speed, the warranted inference.", "why_wrong": {"B": "An advantage in every measure at once overstates a gain confined to accuracy.", "C": "The gain was in accuracy, not speed, which was unchanged; this reverses the finding.", "D": "Manufacturing cost is not discussed; that goes outside the passage."}}, {"id": "u1-l4-f1-10", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Çok güçlü", "passage": "A study of a lake found that in years when a certain algae bloomed heavily, oxygen levels in the deep water dropped and fish were scarcer there. Because the decaying algae consumed oxygen as they sank, the pattern suggests that heavy algal blooms can ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "permanently eliminate all fish from the entire lake.", "B": "contribute to lower oxygen and fewer fish in deep water.", "C": "raise oxygen levels in the lake's deep water.", "D": "be prevented only by removing fish from the lake."}, "correct": "B", "choice_families": {"C": "Yön doğru derece yanlış", "D": "Metnin dışına çıkma", "A": "Çok güçlü"}, "why_correct": "Heavy blooms coincided with lower deep-water oxygen and fewer fish, and the mechanism is given, so blooms can contribute to that outcome, the warranted inference.", "why_wrong": {"C": "Blooms lowered oxygen, so raising it reverses the finding.", "D": "Removing fish as the only prevention is not supported by the text.", "A": "Permanently eliminating all fish from the whole lake far overstates a seasonal, deep-water effect."}}, {"id": "u1-l4-f2-01", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A study found that people who spent a few minutes describing a problem aloud, even to no one, solved it more often than those who worked silently. The researchers proposed that putting thoughts into words forces a person to organize them. If so, then speaking through a problem may aid its solution by ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "improving the person's overall verbal intelligence.", "B": "prompting a clearer arrangement of one's thoughts.", "C": "replacing the need for any careful reasoning.", "D": "making the person less able to focus on the task."}, "correct": "B", "choice_families": {"C": "Çok güçlü", "D": "Yön doğru derece yanlış", "A": "Metnin dışına çıkma"}, "why_correct": "The researchers' proposal is that verbalizing forces organization of thought, so speaking aids solving by clarifying one's thoughts, the warranted inference.", "why_wrong": {"C": "That speaking replaces careful reasoning goes far beyond and against the proposal.", "D": "The passage links speaking to better solving, not reduced focus; this reverses it.", "A": "Raising overall verbal intelligence is a broader claim the passage never makes."}}, {"id": "u1-l4-f2-02", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "Farmers who left strips of wildflowers along the edges of their fields reported fewer pest outbreaks than neighbors who did not. Researchers noted that the flowers attracted insects that prey on crop pests. The finding suggests that the flower strips reduced pests by ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "blocking sunlight that the pests require.", "B": "enriching the soil with additional nutrients.", "C": "supporting predators that feed on the pests.", "D": "releasing a chemical that poisons the pests directly."}, "correct": "C", "choice_families": {"B": "Metnin dışına çıkma", "D": "Metnin dışına çıkma", "A": "Metnin dışına çıkma"}, "why_correct": "The passage says the flowers drew insects that prey on pests, so the strips reduced pests by supporting those predators, the warranted inference.", "why_wrong": {"B": "Enriching the soil is a mechanism the passage never mentions.", "D": "A poisonous chemical is not mentioned; the stated mechanism is predatory insects.", "A": "Blocking sunlight is not supported anywhere in the text."}}, {"id": "u1-l4-f2-03", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A museum found that visitors spent longer at exhibits accompanied by a short, plainly written label than at those with long, technical labels. The curators concluded that concise, accessible text held visitors' attention. It follows that, to keep visitors engaged, exhibit labels should generally be ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "translated into as many languages as possible.", "B": "written by the most senior curator on staff.", "C": "removed from the exhibits altogether.", "D": "clear and brief rather than long and technical."}, "correct": "D", "choice_families": {"B": "Metnin dışına çıkma", "C": "Çok güçlü", "A": "Metnin dışına çıkma"}, "why_correct": "Visitors lingered at concise, accessible labels, so labels should be clear and brief to hold attention, the warranted inference.", "why_wrong": {"B": "Who writes the labels is never discussed; that goes outside the passage.", "C": "Removing labels altogether goes against the finding that good labels held attention.", "A": "Translation into many languages is not addressed in the text."}}, {"id": "u1-l4-f2-04", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "Observers noted that a species of ant, when its usual trail was blocked, quickly formed a new trail along the shortest available detour. Because the ants lay down and follow chemical trails, this ability suggests that the colony can ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "adjust its routes in response to obstacles.", "B": "communicate using sounds inaudible to humans.", "C": "remember the layout of its entire territory for years.", "D": "survive without any food for extended periods."}, "correct": "A", "choice_families": {"B": "Metnin dışına çıkma", "C": "Metnin dışına çıkma", "D": "Metnin dışına çıkma"}, "why_correct": "The ants rerouted around a block via the shortest detour, so the colony can adjust routes in response to obstacles, the warranted inference.", "why_wrong": {"B": "Sound communication is not mentioned; the passage describes chemical trails.", "C": "Long-term memory of the whole territory goes beyond what the observation shows.", "D": "Surviving without food is unrelated to the rerouting described."}}, {"id": "u1-l4-f2-05", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "In a taste test, participants rated a soup as saltier when it was served warm than when the identical soup was served cool. Because warmth is known to heighten the perception of certain flavors, the result suggests that a food's temperature can ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "change the actual amount of salt the food contains.", "B": "influence how strongly its flavors are perceived.", "C": "determine how nutritious the food is overall.", "D": "affect how long the food can be safely stored."}, "correct": "B", "choice_families": {"C": "Metnin dışına çıkma", "D": "Metnin dışına çıkma", "A": "Öncül sonuç karışıklığı"}, "why_correct": "Identical soup tasted saltier when warm, so temperature can influence how strongly flavors are perceived, the warranted inference.", "why_wrong": {"C": "Nutritional value is never discussed in the passage.", "D": "Storage safety is unrelated to the flavor-perception finding.", "A": "The soup was identical, so the salt amount did not change; only perception did."}}, {"id": "u1-l4-f2-06", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A study of a coastal town found that residents who lived within sight of the harbor could more accurately estimate the day's weather than those living inland. The researchers noted that harbor residents watched the sky and sea daily. The result suggests that their accuracy came from ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "formal training in meteorology at the harbor.", "B": "access to more advanced forecasting instruments.", "C": "regular firsthand observation of local conditions.", "D": "a longer history of family residence in the town."}, "correct": "C", "choice_families": {"B": "Metnin dışına çıkma", "D": "Metnin dışına çıkma", "A": "Metnin dışına çıkma"}, "why_correct": "Harbor residents watched sky and sea daily, so their accuracy came from regular firsthand observation, the warranted inference.", "why_wrong": {"B": "Advanced instruments are not mentioned; the passage cites daily watching.", "D": "Length of family residence is not discussed in the passage.", "A": "Formal meteorology training appears nowhere in the text."}}, {"id": "u1-l4-f2-07", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "Engineers testing a bicycle helmet found that a new inner layer spread the force of an impact over a wider area of the shell than the old layer did. Since a force spread over a wider area presses less hard on any one point, the new layer should ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "lower the cost of manufacturing the helmet.", "B": "make the helmet significantly lighter to wear.", "C": "extend the number of years the helmet can be used.", "D": "reduce the force concentrated at the point of impact."}, "correct": "D", "choice_families": {"B": "Metnin dışına çıkma", "C": "Metnin dışına çıkma", "A": "Metnin dışına çıkma"}, "why_correct": "Spreading force over a wider area lowers pressure at any point, so the new layer should reduce force concentrated at the impact point, the warranted inference.", "why_wrong": {"B": "Weight is not discussed; the passage concerns force distribution.", "C": "The helmet's lifespan is not mentioned in the text.", "A": "Manufacturing cost is unrelated to the force-spreading finding."}}, {"id": "u1-l4-f2-08", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A researcher found that readers recalled the plot of a story better when its chapters were read in order than when the same chapters were shuffled. She proposed that a coherent sequence helps readers build connections between events. If so, then narrative order aids memory by ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "helping readers link events into a connected whole.", "B": "increasing the total number of words readers absorb.", "C": "making the individual sentences easier to pronounce.", "D": "reducing the time it takes to finish the story."}, "correct": "A", "choice_families": {"B": "Metnin dışına çıkma", "C": "Metnin dışına çıkma", "D": "Metnin dışına çıkma"}, "why_correct": "The proposal is that coherent sequence helps readers connect events, so order aids memory by linking events into a whole, the warranted inference.", "why_wrong": {"B": "Word count absorbed is not what the passage addresses.", "C": "Ease of pronunciation is unrelated to narrative order.", "D": "Reading time is not mentioned in the passage."}}, {"id": "u1-l4-f2-09", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A study found that patients who understood the reasons behind their prescribed exercises completed them more consistently than patients simply told to do them. The physical therapists concluded that understanding the purpose increased follow-through. It follows that explaining the rationale for an exercise may ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "shorten the time each exercise takes to complete.", "B": "improve how consistently patients perform it.", "C": "reduce the number of exercises a patient is given.", "D": "lower the fees the therapists are able to charge."}, "correct": "B", "choice_families": {"C": "Metnin dışına çıkma", "D": "Metnin dışına çıkma", "A": "Metnin dışına çıkma"}, "why_correct": "Understanding the purpose raised follow-through, so explaining the rationale may improve how consistently patients perform exercises, the warranted inference.", "why_wrong": {"C": "The number of exercises assigned is not addressed.", "D": "Therapists' fees are unrelated to the follow-through finding.", "A": "How long each exercise takes is not discussed in the passage."}}, {"id": "u1-l4-f2-10", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Metnin dışına çıkma", "passage": "A survey of hikers found that those carrying detailed trail maps reported feeling less anxious on unfamiliar routes than those without them. The researchers suggested that a sense of knowing where one is eases worry. If so, then carrying a map may reduce anxiety chiefly by ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "guaranteeing that hikers never take a wrong turn.", "B": "making the physical hike less tiring to complete.", "C": "giving hikers a clearer sense of their location.", "D": "improving the hikers' overall physical fitness."}, "correct": "C", "choice_families": {"B": "Metnin dışına çıkma", "D": "Metnin dışına çıkma", "A": "Çok güçlü"}, "why_correct": "The suggestion is that knowing one's location eases worry, so a map reduces anxiety chiefly by clarifying location, the warranted inference.", "why_wrong": {"B": "Physical tiredness is not what the passage addresses.", "D": "Physical fitness is unrelated to the anxiety finding.", "A": "Guaranteeing no wrong turns overstates and goes beyond the text."}}, {"id": "u1-l4-f3-01", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "A study found that every student who scored above 90 on the final had attended the optional review sessions. It does not follow that attendance guaranteed a high score, since many students who attended the sessions scored below 90. The data show only that, among high scorers, attendance was ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "rare, with few high scorers having attended.", "B": "the direct cause of every high score on the final.", "C": "universal, though attendance alone did not ensure a high score.", "D": "irrelevant to how students performed on the final."}, "correct": "C", "choice_families": {"B": "Öncül sonuç karışıklığı", "D": "Metnin dışına çıkma", "A": "Yön doğru derece yanlış"}, "why_correct": "All high scorers attended, but many attendees scored low, so attendance was universal among high scorers without ensuring high scores, the careful inference.", "why_wrong": {"B": "Treating attendance as the direct cause reverses the logic, since attending did not guarantee a high score.", "D": "The passage does not show attendance was irrelevant; high scorers all attended.", "A": "All high scorers attended, so calling attendance rare among them contradicts the data."}}, {"id": "u1-l4-f3-02", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "In a region, every year with a severe drought was also a year of low river flow. A student concluded that low river flow must cause droughts. But the passage describes droughts reducing river flow, not the reverse, so the correct reading is that the low flow was ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "a sign that droughts had ended in the region.", "B": "the underlying cause of each severe drought.", "C": "unrelated to the droughts in those years.", "D": "a consequence of the drought rather than its cause."}, "correct": "D", "choice_families": {"B": "Öncül sonuç karışıklığı", "C": "Yön doğru derece yanlış", "A": "Metnin dışına çıkma"}, "why_correct": "The passage has droughts reducing flow, so low flow was a consequence of drought, not its cause, the correct inference.", "why_wrong": {"B": "Calling low flow the cause of drought reverses the direction the passage states.", "C": "The two are clearly linked, so calling them unrelated contradicts the passage.", "A": "Low flow accompanied drought, not its ending; that goes outside the text."}}, {"id": "u1-l4-f3-03", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "Researchers observed that a bird species sings most vigorously just before it begins building a nest. One might suppose that vigorous singing prompts nest-building, but the passage presents the singing merely as something that precedes it. The data establish only that the two behaviors ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "tend to occur in sequence, without showing that one causes the other.", "B": "have no connection to each other whatsoever.", "C": "prove that singing directly triggers nest-building.", "D": "occur at completely random and unrelated times."}, "correct": "A", "choice_families": {"B": "Yön doğru derece yanlış", "C": "Öncül sonuç karışıklığı", "D": "Metnin dışına çıkma"}, "why_correct": "The passage shows singing preceding nest-building without a causal link, so the two occur in sequence without established causation, the careful inference.", "why_wrong": {"B": "They occur in a regular sequence, so 'no connection whatsoever' understates the link.", "C": "Claiming singing directly triggers nest-building asserts causation the passage does not establish.", "D": "The behaviors occur in a consistent order, not at random times."}}, {"id": "u1-l4-f3-04", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "A report notes that neighborhoods with more coffee shops also tend to have higher rents. A reader might infer that coffee shops drive rents up, yet the report suggests both may simply follow from an area's growing popularity. The data alone show that the two ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "are entirely independent of each other.", "B": "are associated, without establishing that one produces the other.", "C": "prove that opening coffee shops raises local rents.", "D": "show that high rents prevent coffee shops from opening."}, "correct": "B", "choice_families": {"C": "Öncül sonuç karışıklığı", "D": "Yön doğru derece yanlış", "A": "Yön doğru derece yanlış"}, "why_correct": "The report ties both to a common cause, so the data show association without one producing the other, the careful inference.", "why_wrong": {"C": "Claiming coffee shops raise rents asserts a cause the report declines to establish.", "D": "The passage does not show high rents blocking coffee shops; that reverses the picture.", "A": "They move together, so calling them entirely independent understates the link."}}, {"id": "u1-l4-f3-05", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "A historian notes that a kingdom's records of grain shortages grew more frequent in its final decades. It is tempting to read this as proof that food scarcity caused the kingdom's decline, but more frequent records might instead reflect better record-keeping. The evidence by itself shows only that ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "the kingdom kept no records in its final decades.", "B": "food scarcity was certainly the main cause of the decline.", "C": "reports of shortages increased, which need not mean shortages themselves did.", "D": "grain shortages had no effect on the kingdom at all."}, "correct": "C", "choice_families": {"B": "Öncül sonuç karışıklığı", "D": "Metnin dışına çıkma", "A": "Yön doğru derece yanlış"}, "why_correct": "More frequent reports could reflect better record-keeping, so the evidence shows reports rose, not necessarily shortages, the careful inference.", "why_wrong": {"B": "Treating scarcity as certainly the cause reads more into the records than they establish.", "D": "The passage does not say shortages had no effect; that goes beyond the text.", "A": "The records grew more frequent, so claiming none were kept contradicts the passage."}}, {"id": "u1-l4-f3-06", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "A study found that children who slept more also tended to perform better in school. A newspaper reported that sleep boosts grades, but the study noted that better-organized households might produce both more sleep and better grades. The findings alone establish that sleep and performance ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "show that good grades cause children to sleep less.", "B": "had nothing to do with each other.", "C": "prove conclusively that more sleep causes better grades.", "D": "were linked, without proving that sleep itself raised performance."}, "correct": "D", "choice_families": {"B": "Yön doğru derece yanlış", "C": "Öncül sonuç karışıklığı", "A": "Yön doğru derece yanlış"}, "why_correct": "A possible common cause means the data show a link, not that sleep raised performance, the careful inference.", "why_wrong": {"B": "They were linked, so 'nothing to do with each other' understates the association.", "C": "Claiming sleep conclusively causes better grades asserts more than a correlation shows.", "A": "The passage does not show grades reducing sleep; that reverses and distorts the finding."}}, {"id": "u1-l4-f3-07", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "An ecologist observes that wherever a certain beetle is abundant, a particular fungus is also common. She cautions that the beetle may spread the fungus, the fungus may attract the beetle, or both may thrive in the same damp conditions. Until further study, the co-occurrence shows only that the two ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "are found together, without revealing why.", "B": "clearly demonstrate that the beetle spreads the fungus.", "C": "are never found in the same locations.", "D": "cannot both survive in damp conditions."}, "correct": "A", "choice_families": {"B": "Öncül sonuç karışıklığı", "C": "Yön doğru derece yanlış", "D": "Metnin dışına çıkma"}, "why_correct": "With several possible explanations unresolved, the co-occurrence shows only that the two are found together without revealing why, the careful inference.", "why_wrong": {"B": "Singling out the beetle spreading the fungus asserts one unproven explanation as fact.", "C": "They occur together, so 'never in the same locations' contradicts the observation.", "D": "The passage offers shared damp conditions as one explanation, so claiming they cannot both survive there is wrong."}}, {"id": "u1-l4-f3-08", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Öncül sonuç karışıklığı", "passage": "A company finds that teams which hold brief daily meetings tend to finish projects on time. A manager concludes the meetings cause the punctuality, but the passage suggests that well-organized teams may both hold such meetings and finish on time. The data establish that the two ______", "stem": "Which choice most logically completes the text?", "choices": {"A": "are completely unrelated to each other.", "B
