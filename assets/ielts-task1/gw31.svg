<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="720" height="400" fill="#f7f4ec" rx="6"/>
<text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a2a2a">How table salt is produced from seawater</text>
<rect x="22" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="38" cy="96" r="11" fill="#2E6E6A"/>
<text x="38.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
<text x="54.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Pumping</text>
<text x="32.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Seawater pumped into</text>
<text x="32.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">large, shallow</text>
<text x="32.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">coastal ponds</text>
<rect x="198" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="214" cy="96" r="11" fill="#2E6E6A"/>
<text x="214.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
<text x="230.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Evaporation</text>
<text x="208.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Sun and wind remove</text>
<text x="208.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">water over several</text>
<text x="208.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">weeks; brine thickens</text>
<rect x="374" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="390" cy="96" r="11" fill="#2E6E6A"/>
<text x="390.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
<text x="406.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Transfer</text>
<text x="384.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Concentrated brine</text>
<text x="384.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">moved to smaller</text>
<text x="384.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">crystallising ponds</text>
<rect x="550" y="80" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="566" cy="96" r="11" fill="#2E6E6A"/>
<text x="566.0" y="100.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
<text x="582.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Crystallisation</text>
<text x="560.0" y="120.0" text-anchor="start" font-size="10" fill="#2a2a2a">Salt forms a layer</text>
<text x="560.0" y="134.0" text-anchor="start" font-size="10" fill="#2a2a2a">3-4 cm thick on the</text>
<text x="560.0" y="148.0" text-anchor="start" font-size="10" fill="#2a2a2a">pond floor</text>
<line x1="172.0" y1="123.0" x2="189.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="198.0,123.0 189.0,118.0 189.0,128.0" fill="#B78A2E"/>
<line x1="348.0" y1="123.0" x2="365.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="374.0,123.0 365.0,118.0 365.0,128.0" fill="#B78A2E"/>
<line x1="524.0" y1="123.0" x2="541.0" y2="123.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="550.0,123.0 541.0,118.0 541.0,128.0" fill="#B78A2E"/>
<line x1="625.0" y1="166.0" x2="625.0" y2="261.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="625.0,270.0 630.0,261.0 620.0,261.0" fill="#B78A2E"/>
<rect x="550" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="566" cy="286" r="11" fill="#2E6E6A"/>
<text x="566.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
<text x="582.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Harvesting</text>
<text x="560.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Machines scrape up</text>
<text x="560.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">the salt and load it</text>
<text x="560.0" y="338.0" text-anchor="start" font-size="10" fill="#2a2a2a">onto trucks</text>
<rect x="374" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="390" cy="286" r="11" fill="#2E6E6A"/>
<text x="390.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text>
<text x="406.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Washing</text>
<text x="384.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Rinsed with clean</text>
<text x="384.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">brine to remove sand</text>
<text x="384.0" y="338.0" text-anchor="start" font-size="10" fill="#2a2a2a">and mud, then drained</text>
<rect x="198" y="270" width="150" height="86" rx="8" fill="#fff" stroke="#2E6E6A" stroke-width="2"/>
<circle cx="214" cy="286" r="11" fill="#2E6E6A"/>
<text x="214.0" y="290.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>
<text x="230.0" y="290.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2a2a2a">Drying and crushing</text>
<text x="208.0" y="310.0" text-anchor="start" font-size="10" fill="#2a2a2a">Dried in hot air,</text>
<text x="208.0" y="324.0" text-anchor="start" font-size="10" fill="#2a2a2a">crushed to the</text>
<text x="208.0" y="338.0" text-anchor="start" font-size="10" fill="#2a2a2a">required grain size</text>
<line x1="550.0" y1="313.0" x2="533.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="524.0,313.0 533.0,318.0 533.0,308.0" fill="#B78A2E"/>
<line x1="374.0" y1="313.0" x2="357.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="348.0,313.0 357.0,318.0 357.0,308.0" fill="#B78A2E"/>
<line x1="198.0" y1="313.0" x2="181.0" y2="313.0" stroke="#B78A2E" stroke-width="2"/>
<polygon points="172.0,313.0 181.0,318.0 181.0,308.0" fill="#B78A2E"/>
<rect x="22" y="270" width="150" height="86" rx="8" fill="#B78A2E"/>
<text x="97.0" y="300.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Packing</text>
<text x="97.0" y="320.0" text-anchor="middle" font-size="10" fill="#fff">iodine added;</text>
<text x="97.0" y="334.0" text-anchor="middle" font-size="10" fill="#fff">bagged for sale</text>
<line x1="625.0" y1="166.0" x2="625.0" y2="191.0" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="625.0,200.0 630.0,191.0 620.0,191.0" fill="#9a9a9a"/>
<rect x="553" y="200" width="144" height="50" rx="6" fill="#fff" stroke="#9a9a9a" stroke-dasharray="4,3"/>
<text x="625.0" y="214.0" text-anchor="middle" font-size="10" fill="#2a2a2a">bitter liquid left</text>
<text x="625.0" y="226.0" text-anchor="middle" font-size="10" fill="#2a2a2a">over sold to the</text>
<text x="625.0" y="238.0" text-anchor="middle" font-size="10" fill="#2a2a2a">chemicals industry</text>
<text x="20.0" y="388.0" text-anchor="start" font-size="10" font-style="italic" fill="#8A7F6E">A full cycle from seawater to packed salt takes about one year in a warm climate.</text>
</svg>