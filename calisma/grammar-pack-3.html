(function() {
  var path = window.location.pathname;
  var slug = path.substring(path.lastIndexOf('/') + 1).replace(/\.html$/, '');

мez.\n\nB — 'who's' = 'who is'; 'who is report' anlamsızdır.\nC — 'whos' bir sözcük değildir.\nD — 'whos'' bir sözcük değildir."}, {"k": "apos", "p": "<u>Who's</u> responsible for submitting the quarterly reports to the oversight committee?", "q": "Which choice is correct?", "o": ["A) Whose", "B) Who's", "C) Whos'", "D) Who is'"], "a": 1, "e": "B doğrudur. 'Who's' = 'who is'; cümle 'who is responsible?' sorusunu soruyor. Burada kısaltma gereklidir, 'whose' değil.\n\nA — 'whose' bir isim gerektirir: 'whose responsibility.'\nC — 'whos'' bir sözcük değildir.\nD — 'who is'' standart değildir."}, {"k": "apos", "p": "The committee reviewed all of the department <u>head's</u> proposals before voting.", "q": "Which choice is correct?", "o": ["A) head's", "B) heads'", "C) heads", "D) head'"], "a": 0, "e": "A doğrudur. Tek bir department head var; tekil iyelik: 'head's' (s'den önce kesme işareti).\n\nB — 'heads'' birden fazla department head'in tekliflerini ima eder.\nC — 'heads' çoğul isimdir, iyelik değil.\nD — 'head'' standart noktalama değildir."}, {"k": "apos", "p": "The three department <u>head's</u> proposals were all rejected by the board.", "q": "Which choice is correct?", "o": ["A) head's", "B) heads'", "C) heads", "D) head's'"], "a": 1, "e": "B doğrudur. Üç department head var (çoğul). -s ile biten düzenli çoğullarda iyelik için yalnızca s'den sonra kesme işareti eklenir: 'heads'.\n\nA — 'head's' tekil iyeliktir.\nC — 'heads' çoğuldur ama iyelik değil.\nD — 'head's'' yoktur."}, {"k": "apos", "p": "The <u>childrens'</u> museum features interactive exhibits on local history.", "q": "Which choice is correct?", "o": ["A) childrens'", "B) children's", "C) childrens", "D) children'"], "a": 1, "e": "B doğrudur. 'Children' düzensiz çoğuldur (-s almaz). Düzensiz çoğullarda iyelik: kesme işareti + s → 'children's.'\n\nA — 'childrens'' sözcüğü düzenli çoğul olarak yanlış ele alır.\nC — 'childrens' bir sözcük değildir.\nD — 'children'' standart değildir."}, {"k": "apos", "p": "The <u>company's</u> board of directors voted unanimously to approve the merger.", "q": "Which choice is correct?", "o": ["A) company's", "B) companies'", "C) companys'", "D) companys"], "a": 0, "e": "A doğrudur. Tek bir şirket var; tekil iyelik: 'company's.'\n\nB — 'companies'' birden fazla şirketin çoğul iyeliğidir.\nC — 'companys'' standart bir form değildir.\nD — 'companys' yanlış yazımla çoğuldur."}, {"k": "apos", "p": "Several <u>companies'</u> financial disclosures were flagged for inconsistencies by the auditors.", "q": "Which choice is correct?", "o": ["A) company's", "B) companies", "C) companies'", "D) companys'"], "a": 2, "e": "C doğrudur. Birden fazla şirket (çoğul) bildirim sahibi. -s ile biten çoğulda iyelik: s'den sonra yalnızca kesme işareti.\n\nA — 'company's' tekildir.\nB — 'companies' çoğuldur ama iyelik değil.\nD — 'companys'' standart form değildir."}, {"k": "apos", "p": "The <u>witness's</u> testimony contradicted the evidence presented by the prosecution.", "q": "Which choice is correct?", "o": ["A) witness'", "B) witnesses'", "C) witness's", "D) witnesse's"], "a": 2, "e": "C doğrudur. Modern stil (ve SAT kuralı) -s ile biten tekil isimlere kesme işareti + s ekler: 'witness's.'\n\nA — 'witness'' eski formdur; SAT 'witness's' tercih eder.\nB — 'witnesses'' birden fazla tanığı ima eder.\nD — 'witnesse's' bir sözcük değildir."}, {"k": "apos", "p": "The policy requires that <u>one's</u> credentials be verified before accessing the secure database.", "q": "Which choice is correct?", "o": ["A) one's", "B) ones'", "C) ones", "D) one is"], "a": 0, "e": "A doğrudur. 'One's' belirsiz zamiri 'one'ın iyeliğidir ve 'credentials' ismini niteler.\n\nB — 'ones'' çoğul 'ones'ın iyeliği olurdu.\nC — 'ones' çoğul isimdir, iyelik değil.\nD — 'one is' farklı cümle yapısı gerektirir."}, {"k": "apos", "p": "The new policy affects all of the <u>employees</u> benefits and retirement contributions.", "q": "Which choice is correct?", "o": ["A) employees", "B) employee's", "C) employees'", "D) employees's"], "a": 2, "e": "C doğrudur. Tüm çalışanlar (çoğul) bu hakların sahibi. 'employees'' — s'den sonra yalnızca kesme işareti.\n\nA — 'employees' çoğuldur ama iyelik değil.\nB — 'employee's' tekil iyeliktir.\nD — 'employees's' standart değildir."}, {"k": "apos", "p": "The <u>mens'</u> locker room was closed for renovations throughout the month of February.", "q": "Which choice is correct?", "o": ["A) mens'", "B) men's", "C) mens", "D) men'"], "a": 1, "e": "B doğrudur. 'Men' düzensiz çoğuldur (-s almaz). Düzensiz çoğullarda iyelik: kesme işareti + s → 'men's.'\n\nA — 'mens'' hatalı: 'men' düzensiz çoğuldur.\nC — 'mens' bir sözcük değildir.\nD — 'men'' standart değildir."}, {"k": "apos", "p": "The professor argued that <u>James's</u> theory of pragmatism was more nuanced than his critics acknowledged.", "q": "Which choice is correct?", "o": ["A) James'", "B) Jameses'", "C) James's", "D) James'es"], "a": 2, "e": "C doğrudur. -s ile biten özel isimler için SAT kuralı: kesme işareti + s → 'James's.'\n\nA — 'James'' eski kuraldır; SAT 'James's' tercih eder.\nB — 'Jameses'' ismi gereksiz yere çoğullaştırır.\nD — 'James'es' standart bir form değildir."}, {"k": "apos", "p": "The board reviewed <u>it's</u> charter to determine whether the proposed amendment was permissible.", "q": "Which choice is correct?", "o": ["A) it's", "B) its", "C) its'", "D) No change"], "a": 1, "e": "B doğrudur. 'Its' iyelik zamiridir — kurulun tüzüğü ('its charter'). 'It's' = 'it is' demektir; burada anlamsız olur.\n\nA — 'it's' = 'it is'; 'the board reviewed it is charter' yanlıştır.\nC — 'its'' yoktur.\nD — Değişiklik yapılmasa hata kalır."}, {"k": "apos", "p": "Neither of the candidates acknowledged <u>their's</u> role in the breakdown of negotiations.", "q": "Which choice is correct?", "o": ["A) their's", "B) theirs", "C) their", "D) there"], "a": 2, "e": "C doğrudur. 'Their' iyelik sıfatıdır ve 'role' ismini niteler. 'Theirs' bağımsız zamirdir, isimden önce kullanılamaz.\n\nA — 'their's' yoktur.\nB — 'theirs' doğrudan isim niтеleyемez.\nD — 'there' iyelik değildir."}, {"k": "apos", "p": "The <u>firm's</u> approach to client confidentiality has been praised by industry regulators.", "q": "Which choice is correct?", "o": ["A) firms", "B) firm's", "C) firms'", "D) firm'"], "a": 1, "e": "B doğrudur. Tek bir firma var; tekil iyelik: 'firm's.'\n\nA — 'firms' çoğuldur, iyelik değil.\nC — 'firms'' birden fazla firmanın çoğul iyeliğidir.\nD — 'firm'' standart değildir."}, {"k": "apos", "p": "The <u>attorneys'</u> arguments were compelling, but the jury ultimately sided with the defense.", "q": "Which choice is correct?", "o": ["A) attorney's", "B) attorneys", "C) attorneys'", "D) attorneys's"], "a": 2, "e": "C doğrudur. Birden fazla avukat var; -s ile biten çoğulda iyelik: s'den sonra kesme işareti.\n\nA — 'attorney's' tekil iyeliktir.\nB — 'attorneys' çoğuldur ama iyelik değil.\nD — 'attorneys's' standart değildir."}, {"k": "apos", "p": "The president announced that the country would reassess <u>it's</u> trade agreements with three major partners.", "q": "Which choice is correct?", "o": ["A) it's", "B) its", "C) its'", "D) No change"], "a": 1, "e": "B doğrudur. 'Its' iyelik zamiridir — ülkenin ticaret anlaşmaları. 'It's' = 'it is' olur, anlamsızlaşır.\n\nA — 'it's' = 'it is'; dilbilgisel olarak yanlış.\nC — 'its'' yoktur.\nD — Değişiklik yapılmasa hata kalır."}, {"k": "apos", "p": "<u>Yours'</u> is the only application that meets all of the listed requirements.", "q": "Which choice is correct?", "o": ["A) Yours'", "B) Your's", "C) Yours", "D) Yors"], "a": 2, "e": "C doğrudur. 'Yours' bağımsız iyelik zamiridir. İyelik zamirleri (yours, hers, his, ours, theirs) asla kesme işareti almaz.\n\nA — 'yours'' gereksiz kesme işareti.\nB — 'your's' bir sözcük değildir.\nD — 'yors' yanlış yazım."}, {"k": "apos", "p": "The two scientists published <u>theirs</u> findings in the same journal on the same day.", "q": "Which choice is correct?", "o": ["A) theirs", "B) their's", "C) their", "D) there"], "a": 2, "e": "C doğrudur. 'Their' iyelik sıfatıdır ve 'findings' ismini niteler. 'Theirs' bağımsız zamirdir, isimden önce kullanılamaz.\n\nA — 'theirs' doğrudan isim niтеleyемez.\nB — 'their's' yoktur.\nD — 'there' iyelik sıfatı değildir."}, {"k": "apos", "p": "The grant proposal outlined the <u>institute's</u> long-term research priorities for the next decade.", "q": "Which choice is correct?", "o": ["A) institutes", "B) institute's", "C) institutes'", "D) institute'"], "a": 1, "e": "B doğrudur. Tek bir enstitü var; tekil iyelik: 'institute's.'\n\nA — 'institutes' çoğuldur, iyelik değil.\nC — 'institutes'' birden fazla enstitünün çoğul iyeliğidir.\nD — 'institute'' standart değildir."}, {"k": "apos", "p": "The <u>it's</u> difficult to overstate the importance of regular exercise for long-term health.", "q": "Which choice is correct?", "o": ["A) it's", "B) its", "C) its'", "D) No change needed"], "a": 0, "e": "A doğrudur. 'It's' = 'it is'; cümle 'it is difficult to overstate...' demek istiyor. Bu kullanım doğrudur.\n\nB — 'its' iyelik zamiridir; ardından isim gelmeden kullanılamaz.\nC — 'its'' yoktur.\nD — 'it's' zaten doğru kullanılmış; 'No change' da kabul edilebilir."}, {"k": "apos", "p": "<u>It's</u> too early to determine whether the new regulations will achieve <u>their</u> intended effect.", "q": "Which choice correctly uses both underlined words?", "o": ["A) It's … their", "B) Its … their", "C) It's … there", "D) Its … they're"], "a": 0, "e": "A doğrudur. 'It's' = 'it is' (doğru). 'Their' = 'effect' ismini niteleyen iyelik sıfatı (doğru).\n\nB — 'Its' iyelik zamiridir; burada 'it is' kısaltması gerekli.\nC — 'there' zarftır, iyelik değildir.\nD — 'they're' = 'they are'; 'effect' ismini nitеleyemez."}]}, {"n": 2, "topic": "Concision & Redundancy", "diff": "Concision & Redundancy", "qs": [{"k": "conc", "p": "The new bridge is a <u>completely unique and one-of-a-kind</u> structure that has never been seen before in this region.", "q": "Which choice is most concise and avoids redundancy?", "o": ["A) completely unique and one-of-a-kind", "B) unique", "C) unique and special in its own way", "D) absolutely unique and original"], "a": 1, "e": "B doğrudur. 'Unique' zaten tek bir türde olduğunu ifade eder. 'Completely unique,' 'one-of-a-kind' ile birlikte kullanmak gereksiz tekrardır (redundancy).\n\nA — 'completely unique' ve 'one-of-a-kind' aynı fikri tekrar eder.\nC — 'special in its own way' 'unique'e hiçbir şey katmaz.\nD — 'absolutely unique' da gereksiz tekrardır."}, {"k": "conc", "p": "The committee made a <u>final decision that was conclusive</u> regarding the proposed changes.", "q": "Which is most concise?", "o": ["A) final decision that was conclusive", "B) final and conclusive decision", "C) final decision", "D) conclusive and decisive final decision"], "a": 2, "e": "C doğrudur. 'Final decision' yeterlidir. 'Conclusive' ve 'decisive' sözcükleri 'final' ile örtüşür.\n\nA — 'final' ve 'conclusive' gereksiz tekrardır.\nB — 'final and conclusive' hâlâ tekrar eder.\nD — üç örtüşen niteleyici kullanır; çok gereksiz."}, {"k": "conc", "p": "The author <u>returned back</u> to the theme of isolation in the novel's final chapter.", "q": "Which choice eliminates the redundancy?", "o": ["A) returned back", "B) returned back again", "C) returned", "D) went back and returned"], "a": 2, "e": "C doğrudur. 'Return' zaten 'geri dönmek' demektir; 'back' gereksiz tekrardır (redundancy).\n\nA — 'returned back' gereksiz tekrardır.\nB — 'again' ekleyerek gereksizliği artırır.\nD — 'went back and returned' aynı eylemi iki kez söyler."}, {"k": "conc", "p": "The manager <u>reiterated again</u> the importance of meeting the Friday deadline.", "q": "Which choice is most concise?", "o": ["A) reiterated again", "B) reiterated and repeated", "C) reiterated", "D) said again and reiterated"], "a": 2, "e": "C doğrudur. 'Reiterate' zaten 'tekrar söylemek' demektir; 'again' gereksizdir.\n\nA — 'reiterated again' = 'said again again.'\nB — 'reiterated and repeated' iki eşanlamlı fiil kullanır.\nD — aynı sorun, daha uzun."}, {"k": "conc", "p": "The report was <u>brief in length</u> but comprehensive in its coverage of the subject.", "q": "Which is most concise?", "o": ["A) brief in length", "B) brief and short in length", "C) brief", "D) short and brief"], "a": 2, "e": "C doğrudur. 'Brief' zaten kısalığı ifade eder; 'in length' ima edilmiştir.\n\nA — 'in length' 'brief' ile tekrar eder.\nB — gereksizlik katlanır.\nD — 'short and brief' neredeyse eşanlamlıdır."}, {"k": "conc", "p": "The excavation team discovered an <u>ancient relic that was very old</u> buried beneath the ruins.", "q": "Which is most concise?", "o": ["A) ancient relic that was very old", "B) very old and ancient relic", "C) ancient relic", "D) old, ancient relic from long ago"], "a": 2, "e": "C doğrudur. 'Ancient' zaten çok eski olduğunu söyler; 'very old' tekrar eder.\n\nA — 'ancient' ve 'very old' örtüşür.\nB — aynı sorun, farklı sıra.\nD — 'from long ago' 'ancient'e hiçbir şey katmaz."}, {"k": "conc", "p": "The policy was <u>implemented and put into effect</u> during the third quarter of the fiscal year.", "q": "Which is most concise?", "o": ["A) implemented and put into effect", "B) implemented", "C) put into effect and made active", "D) enacted into implementation"], "a": 1, "e": "B doğrudur. 'Implemented' ve 'put into effect' eşanlamlıdır; biri yeterlidir.\n\nA — iki eşanlamlı ifade aynı eylemi anlatır.\nC — 'made active' üçüncü bir eşanlamlı ekler.\nD — 'enacted into implementation' hem garip hem gereksizdir."}, {"k": "conc", "p": "The new software is <u>easy to use and user-friendly</u>, making it accessible to all employees.", "q": "Which is most concise?", "o": ["A) easy to use and user-friendly", "B) user-friendly", "C) simple, easy, and user-friendly", "D) easy to operate and user-oriented"], "a": 1, "e": "B doğrudur. 'User-friendly' ve 'easy to use' aynı fikri ifade eder; biri yeterlidir.\n\nA — iki eşanlamlı ifade.\nC — üç örtüşen niteleyici.\nD — 'easy to operate' ve 'user-oriented' hâlâ örtüşür."}, {"k": "conc", "p": "The proposal was <u>rejected and turned down</u> by the committee without discussion.", "q": "Which is most concise?", "o": ["A) rejected and turned down", "B) rejected, declined, and turned down", "C) rejected", "D) not accepted and turned down"], "a": 2, "e": "C doğrudur. 'Rejected' ve 'turned down' eşanlamlıdır; biri yeterlidir.\n\nA — aynı eylem için iki sözcük.\nB — üç eşanlamlı sözcük.\nD — 'not accepted' ve 'turned down' hâlâ eşanlamlıdır."}, {"k": "conc", "p": "The athlete <u>cooperated together</u> with her teammates to develop a new game strategy.", "q": "Which is most concise?", "o": ["A) cooperated together", "B) cooperated with each other together", "C) cooperated", "D) worked together in cooperation"], "a": 2, "e": "C doğrudur. 'Cooperate' zaten birlikte çalışmayı ifade eder; 'together' gereksizdir.\n\nA — 'together' 'cooperate' ile tekrar eder.\nB — gereksizlik katlanır.\nD — 'in cooperation' 'cooperated' ile tekrar eder."}, {"k": "conc", "p": "The judge issued a <u>written document in writing</u> explaining the court's decision.", "q": "Which is most concise?", "o": ["A) written document in writing", "B) document in written form", "C) written document", "D) written statement in writing"], "a": 2, "e": "C doğrudur. 'Written document' yeterlidir; 'in writing' 'written' ile tekrar eder.\n\nA — 'written' ve 'in writing' gereksiz tekrardır.\nB — 'in written form' hâlâ tekrar eder.\nD — 'in writing' yine tekrar eder."}, {"k": "conc", "p": "The candidate <u>first began</u> her political career at the local level before advancing to the national stage.", "q": "Which is most concise?", "o": ["A) first began", "B) first began initially", "C) began", "D) started to begin"], "a": 2, "e": "C doğrudur. 'Began' başlamayı zaten ifade eder; 'first' ve 'initially' gereksizdir.\n\nA — 'first' 'began' ile tekrar eder.\nB — hem 'first' hem 'initially' ekler.\nD — 'started to begin' döngüsel ve gereksizdir."}, {"k": "conc", "p": "The results were <u>unexpected surprises</u> that forced the team to reconsider its approach.", "q": "Which is most concise?", "o": ["A) unexpected surprises", "B) surprising and unexpected results", "C) surprises", "D) unexpected surprises that were not anticipated"], "a": 2, "e": "C doğrudur. Sürpriz tanımı gereği beklenmedik bir şeydir; 'unexpected surprises' gereksiz tekrardır.\n\nA — 'unexpected' 'surprise'ın zaten içindedir.\nB — 'surprising and unexpected' eşanlamlıdır.\nD — üçüncü gereksiz unsur ekler."}, {"k": "conc", "p": "The architect <u>personally supervised the work himself</u> throughout the construction process.", "q": "Which is most concise?", "o": ["A) personally supervised the work himself", "B) personally supervised", "C) supervised himself personally", "D) oversaw and supervised personally"], "a": 1, "e": "B doğrudur. 'Personally' ve 'himself' ikisi de bizzat yapıldığını belirtir; biri yeterlidir.\n\nA — 'personally' ve 'himself' birlikte gereksiz tekrardır.\nC — aynı sorun.\nD — 'oversaw and supervised' eşanlamlı iki fiildir."}, {"k": "conc", "p": "The laboratory's findings were <u>conclusive proof that proved</u> the hypothesis correct.", "q": "Which is most concise?", "o": ["A) conclusive proof that proved", "B) conclusive evidence", "C) proof that conclusively proved", "D) conclusive and decisive proof"], "a": 1, "e": "B doğrudur. 'Conclusive evidence' anlam kaybı olmadan ifade eder. 'Proof' ve 'proved,' 'conclusive' ve 'conclusively' çift gereksiz tekrar yaratır.\n\nA — 'proof' ve 'proved' aynı fikri tekrar eder.\nC — hâlâ 'proof' ve 'conclusively proved' tekrar eder.\nD — 'conclusive and decisive' neredeyse eşanlamlıdır."}, {"k": "conc", "p": "The merger <u>joined together</u> two of the largest firms in the pharmaceutical industry.", "q": "Which is most concise?", "o": ["A) joined together", "B) merged together", "C) joined", "D) brought together and merged"], "a": 2, "e": "C doğrudur. 'Joined' birleşmeyi ifade eder; 'together' gereksizdir.\n\nA — 'together' 'joined' ile tekrar eder.\nB — 'merged together' da gereksizdir ('merge' birleşmeyi ima eder).\nD — iki eşanlamlı ifade kullanır."}, {"k": "conc", "p": "The city council voted to <u>postpone the event until a later date</u>.", "q": "Which is most concise?", "o": ["A) postpone the event until a later date", "B) delay the event to a future time", "C) postpone the event", "D) put off and postpone the event"], "a": 2, "e": "C doğrudur. 'Postpone' zaten daha ileri bir tarihe ertelemek demektir; 'until a later date' gereksizdir.\n\nA — 'until a later date' 'postpone' ile tekrar eder.\nB — 'to a future time' 'delay' ile tekrar eder.\nD — 'put off and postpone' iki eşanlamlı fiildir."}, {"k": "conc", "p": "The instructions were <u>confusing and hard to understand</u>, leading to widespread errors.", "q": "Which is most concise?", "o": ["A) confusing and hard to understand", "B) confusing", "C) unclear and difficult to comprehend", "D) hard to follow and confusing to understand"], "a": 1, "e": "B doğrudur. 'Confusing' zaten anlaşılmasının zor olduğunu söyler.\n\nA — iki eşanlamlı ifade.\nC — 'unclear' ve 'difficult to comprehend' eşanlamlıdır.\nD — gereksizlik katlanır."}, {"k": "conc", "p": "The summit <u>brought together leaders from around the world globally</u> to address climate change.", "q": "Which is most concise?", "o": ["A) brought together leaders from around the world globally", "B) brought together leaders from around the world", "C) convened global leaders together", "D) assembled and brought together global leaders"], "a": 1, "e": "B doğrudur. 'From around the world' ifadesi 'globally'yi gereksiz kılar.\n\nA — 'globally' 'from around the world' ile tekrar eder.\nC — 'convened' ve 'together' hafif gereksizdir.\nD — 'assembled and brought together' eşanlamlıdır."}, {"k": "conc", "p": "The museum exhibit showcased <u>artifacts that were historical in nature</u> from the Bronze Age.", "q": "Which is most concise?", "o": ["A) artifacts that were historical in nature", "B) historical artifacts in nature", "C) historical artifacts", "D) artifacts of a historical nature"], "a": 2, "e": "C doğrudur. 'Historical artifacts' doğrudan ve kısadır; 'in nature' ve 'that were' anlam katmaz.\n\nA — 'in nature' 'historical artifacts'a anlam katmaz.\nB — 'in nature' hâlâ gereksizdir.\nD — 'of a historical nature' uzun; 'historical' tek başına yeterlidir."}, {"k": "conc", "p": "The new regulation will <u>affect and have an impact on</u> all licensed healthcare providers in the state.", "q": "Which is most concise?", "o": ["A) affect and have an impact on", "B) impact and affect", "C) affect", "D) have an impact on and affect"], "a": 2, "e": "C doğrudur. 'Affect' ve 'have an impact on' eşanlamlıdır; tek fiil yeterlidir.\n\nA — iki eşanlamlı fiil öbeği.\nB — hâlâ iki eşanlamlı terim.\nD — aynı gereksizlik, farklı sıra."}, {"k": "conc", "p": "The study's <u>end result was a conclusion</u> that higher temperatures significantly reduce crop yields.", "q": "Which is most concise?", "o": ["A) end result was a conclusion", "B) result was", "C) conclusion was", "D) end result and final conclusion were"], "a": 2, "e": "C doğrudur. 'Conclusion was' araştırma bulgusunu ifade etmek için en uygun ve kısadır.\n\nA — 'end result' ve 'conclusion' örtüşür.\nB — 'result was' biraz daha iyidir ama araştırma için 'conclusion' daha kesindir.\nD — 'end result and final conclusion' gereksizlikleri üst üste koyar."}, {"k": "conc", "p": "The witness described events that <u>occurred at that point in time</u> when the suspect left the building.", "q": "Which is most concise?", "o": ["A) occurred at that point in time", "B) occurred then", "C) occurred at that time", "D) happened at that specific point in time"], "a": 1, "e": "B doğrudur. 'Occurred then' en kısasıdır: 'at that point in time' = 'then.'\n\nA — 'at that point in time' dört sözcük, bir sözcük yeterli.\nC — 'at that time' daha iyi ama hâlâ 'then'den uzun.\nD — 'specific point in time' gereksizliği artırır."}, {"k": "conc", "p": "The engineer proposed a <u>new innovation</u> that would reduce the plant's energy consumption by thirty percent.", "q": "Which is most concise?", "o": ["A) new innovation", "B) recent new innovation", "C) innovation", "D) novel and innovative new idea"], "a": 2, "e": "C doğrudur. 'Innovation' tanımı gereği yeni bir şeydir; 'new innovation' gereksiz tekrardır.\n\nA — 'new' 'innovation'ın zaten içindedir.\nB — 'recent new' gereksizliği artırır.\nD — 'novel,' 'innovative,' ve 'new' aynı şeyi üç kez söyler."}, {"k": "conc", "p": "The two companies <u>mutually agreed with each other</u> to dissolve the partnership by the end of the fiscal year.", "q": "Which is most concise?", "o": ["A) mutually agreed with each other", "B) mutually agreed", "C) agreed with each other mutually", "D) agreed"], "a": 3, "e": "D doğrudur. 'Agreed' tek başına yeterlidir. 'Mutually' ve 'with each other' ikisi de iki taraflılığı ifade eder; her ikisi de gereksizdir.\n\nA — üç gereksiz unsur üst üste.\nB — 'mutually agreed' hâlâ 'mutually' gereksizdir.\nC — 'agreed with each other mutually' en uzun ve en gereksiz form."}]}, {"n": 3, "topic": "Nonrestrictive vs Restrictive Elements", "diff": "Nonrestrictive vs Restrictive", "qs": [{"k": "nrr", "p": "The scientist <u>who discovered the compound</u> was awarded the Nobel Prize.", "q": "Which punctuation is correct for the underlined clause?", "o": ["A) The scientist, who discovered the compound, was awarded", "B) The scientist who discovered the compound was awarded", "C) The scientist that, discovered the compound, was awarded", "D) The scientist: who discovered the compound, was awarded"], "a": 1, "e": "B doğrudur. 'Who discovered the compound' kısıtlayıcı (restrictive) bir yan cümledir — hangi bilim insanını kast ettiğimizi belirtir. Kısıtlayıcı yan cümleler virgül almaz.\n\nA — virgüller cümleyi kısıtlayıcı olmayan (nonrestrictive) yapar; anlam değişir.\nC — 'that' ve iç virgül yanlıştır.\nD — iki nokta ilgi yan cümlesi başlatamaz."}, {"k": "nrr", "p": "The report, <u>which was submitted last Tuesday</u>, contained three major errors.", "q": "Which choice correctly punctuates the underlined clause?", "o": ["A) The report which was submitted last Tuesday contained", "B) The report, which was submitted last Tuesday, contained", "C) The report that was submitted last Tuesday, contained", "D) The report, that was submitted last Tuesday, contained"], "a": 1, "e": "B doğrudur. 'Which was submitted last Tuesday' kısıtlayıcı olmayan (nonrestrictive) bir yan cümledir — tek raporla ilgili ek bilgi verir. Nonrestrictive yan cümleler 'which' ile yazılır ve virgülle ayrılır.\n\nA — virgüllerin olmaması nonrestrictive cümleyi kısıtlayıcı gibi gösterir.\nC — 'that' kısıtlayıcı yan cümle için kullanılır; virgülle uyumsuz.\nD — 'that' nonrestrictive (virgüllü) yan cümlelerde kullanılmaz."}, {"k": "nrr", "p": "Any student <u>who fails to submit the assignment</u> will receive a zero for that component.", "q": "Which choice is correct?", "o": ["A) Any student who fails to submit the assignment will", "B) Any student, who fails to submit the assignment, will", "C) Any student, that fails to submit the assignment, will", "D) Any student who, fails to submit the assignment, will"], "a": 0, "e": "A doğrudur. 'Who fails to submit the assignment' kısıtlayıcıdır — sıfırı kimin alacağını tanımlar. Virgül yok.\n\nB — virgüller cümleyi nonrestrictive yapar; tüm öğrencilerin ödevi vermediği anlamına gelir.\nC — 'that' ve virgül yanlıştır.\nD — 'who'dan sonra yanlış yere virgül."}, {"k": "nrr", "p": "Dr. Reyes, <u>the department chair</u>, announced the new curriculum changes at Monday's faculty meeting.", "q": "Which choice correctly handles the underlined appositive?", "o": ["A) Dr. Reyes the department chair announced", "B) Dr. Reyes, the department chair, announced", "C) Dr. Reyes, the department chair announced", "D) Dr. Reyes — the department chair announced"], "a": 1, "e": "B doğrudur. 'The department chair' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive) — Dr. Reyes hakkında ek bilgi verir. Her iki yanı virgülle ayrılır.\n\nA — virgül yok; appositive kapatılmamış.\nC — yalnızca açılış virgülü; kapanış eksik.\nD — tire açıyor ama kapanış noktalama işareti yok."}, {"k": "nrr", "p": "The book <u>that won the Booker Prize</u> sold three million copies within its first year of publication.", "q": "Which choice is correct?", "o": ["A) The book, that won the Booker Prize, sold", "B) The book, which won the Booker Prize, sold", "C) The book that won the Booker Prize sold", "D) The book which won the Booker Prize sold"], "a": 2, "e": "C doğrudur. 'That won the Booker Prize' kısıtlayıcıdır — hangi kitap olduğunu tanımlar. Virgül yok, 'that' kullanılır.\n\nA — 'that' ve virgül yanlıştır.\nB — 'which' ve virgüller cümleyi nonrestrictive yapar.\nD — 'which' virgülsüz SAT'ta standart değildir."}, {"k": "nrr", "p": "The committee reviewed the proposals <u>that were submitted before the deadline</u>.", "q": "Which choice correctly punctuates this?", "o": ["A) proposals, that were submitted before the deadline", "B) proposals, which were submitted before the deadline,", "C) proposals that were submitted before the deadline", "D) proposals which were submitted before the deadline,"], "a": 2, "e": "C doğrudur. 'That were submitted before the deadline' kısıtlayıcıdır — hangi teklifler olduğunu belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that'ten önce virgül kısıtlayıcı yan cümlede yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar.\nD — açılış virgülü olmadan kapanış virgülü dengesizdir."}, {"k": "nrr", "p": "My colleague Elena, <u>who has worked here for twenty years</u>, will be retiring at the end of the month.", "q": "Which choice is correct?", "o": ["A) My colleague Elena who has worked here for twenty years will", "B) My colleague Elena, who has worked here for twenty years, will", "C) My colleague Elena that has worked here for twenty years, will", "D) My colleague Elena; who has worked here for twenty years, will"], "a": 1, "e": "B doğrudur. Elena belirli, adlandırılmış bir kişidir — 'who has worked here for twenty years' kısıtlayıcı olmayan ek bilgidir. 'Who' ve virgüller kullanılır.\n\nA — virgüllerin olmaması nonrestrictive cümleyi kısıtlayıcı gibi gösterir.\nC — 'that' ve virgül yanlıştır.\nD — noktalı virgül ilgi yan cümlesi başlatamaz."}, {"k": "nrr", "p": "The regulation applies only to companies <u>that employ more than fifty people</u>.", "q": "Which choice is correct?", "o": ["A) companies, that employ more than fifty people", "B) companies, which employ more than fifty people,", "C) companies that employ more than fifty people", "D) companies which employ more than fifty people,"], "a": 2, "e": "C doğrudur. 'That employ more than fifty people' kısıtlayıcıdır — hangi şirketlere uygulandığını belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that'ten önce virgül yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar.\nD — 'which' virgülsüz SAT'ta standart değildir."}, {"k": "nrr", "p": "The Eiffel Tower, <u>which was completed in 1889</u>, was originally intended as a temporary structure.", "q": "Which choice is correct?", "o": ["A) The Eiffel Tower which was completed in 1889 was", "B) The Eiffel Tower, which was completed in 1889, was", "C) The Eiffel Tower that was completed in 1889, was", "D) The Eiffel Tower — which was completed in 1889 was"], "a": 1, "e": "B doğrudur. Eyfel Kulesi benzersiz bir yapıdır; bu yan cümle ekstra bilgi verir (nonrestrictive). 'Which' ve virgüller doğrudur.\n\nA — virgüller yok; nonrestrictive cümle kapatılmamış.\nC — 'that' kısıtlayıcı için; yanlış yerde virgül.\nD — tire açıyor ama kapanış noktalama yok."}, {"k": "nrr", "p": "Students <u>who study consistently throughout the semester</u> tend to perform better on final examinations.", "q": "Which choice is correct?", "o": ["A) Students, who study consistently throughout the semester, tend", "B) Students who study consistently throughout the semester tend", "C) Students, that study consistently throughout the semester, tend", "D) Students who, study consistently throughout the semester, tend"], "a": 1, "e": "B doğrudur. 'Who study consistently throughout the semester' kısıtlayıcıdır — tüm öğrenciler değil, yalnızca düzenli çalışanlar kastediliyor. Virgül yok.\n\nA — virgüller nonrestrictive yapar; tüm öğrencilerin düzenli çalıştığı anlamı çıkar.\nC — 'that' ve virgül yanlıştır.\nD — 'who'dan sonra yanlış yere virgül."}, {"k": "nrr", "p": "The new tax policy, <u>introduced by the finance ministry in March</u>, has faced significant public opposition.", "q": "Which choice is correct?", "o": ["A) The new tax policy introduced by the finance ministry in March has", "B) The new tax policy, introduced by the finance ministry in March, has", "C) The new tax policy, that was introduced by the finance ministry in March has", "D) The new tax policy introduced by the finance ministry in March, has"], "a": 1, "e": "B doğrudur. 'Introduced by the finance ministry in March' kısıtlayıcı olmayan bir katılımcı öbektir (participial phrase) — politika hakkında ek bilgi verir. Her iki yanı virgülle ayrılır.\n\nA — virgüller yok; nonrestrictive öbek kapatılmamış.\nC — 'that' ve kapanış virgülü eksik.\nD — yalnızca kapanış virgülü; açılış eksik."}, {"k": "nrr", "p": "The only candidate <u>who submitted all required documentation</u> was selected for the final interview.", "q": "Which choice is correct?", "o": ["A) The only candidate, who submitted all required documentation, was", "B) The only candidate who submitted all required documentation was", "C) The only candidate that, submitted all required documentation, was", "D) The only candidate, that submitted all required documentation, was"], "a": 1, "e": "B doğrudur. 'Who submitted all required documentation' kısıtlayıcıdır — hangi aday olduğunu belirtir. Virgül yok.\n\nA — virgüller nonrestrictive yapar; anlam değişir.\nC — 'that' ve iç virgül yanlıştır.\nD — 'that' ve virgüller yanlıştır."}, {"k": "nrr", "p": "The professor's latest book, <u>a study of postcolonial literature</u>, has received widespread critical acclaim.", "q": "Which choice is correct?", "o": ["A) book a study of postcolonial literature has", "B) book, a study of postcolonial literature has", "C) book, a study of postcolonial literature, has", "D) book — a study of postcolonial literature has"], "a": 2, "e": "C doğrudur. 'A study of postcolonial literature' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive). Her iki yanı virgülle ayrılır.\n\nA — virgül yok; appositive kapatılmamış.\nB — yalnızca açılış virgülü; kapanış eksik.\nD — tire açıyor ama kapanış noktalama yok."}, {"k": "nrr", "p": "The legislation <u>that the senate passed in June</u> will take effect on January first.", "q": "Which choice is correct?", "o": ["A) legislation, that the senate passed in June,", "B) legislation, which the senate passed in June,", "C) legislation that the senate passed in June", "D) legislation which the senate passed in June"], "a": 2, "e": "C doğrudur. 'That the senate passed in June' kısıtlayıcıdır — hangi yasa olduğunu belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that' ve virgüller yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar.\nD — 'which' virgülsüz SAT'ta standart değildir."}, {"k": "nrr", "p": "Her first novel, <u>published in 2003</u>, established her reputation as one of the decade's most innovative writers.", "q": "Which choice is correct?", "o": ["A) Her first novel published in 2003 established", "B) Her first novel, published in 2003 established", "C) Her first novel, published in 2003, established", "D) Her first novel — published in 2003 established"], "a": 2, "e": "C doğrudur. 'Published in 2003' kısıtlayıcı olmayan bir katılımcı öbektir — yalnızca bir 'ilk roman' var. Her iki yanı virgülle ayrılır.\n\nA — virgüller yok.\nB — açılış virgülü var ama kapanış eksik.\nD — tire ve kapanış eksik."}, {"k": "nrr", "p": "All employees <u>who have completed the training</u> are eligible to apply for the new positions.", "q": "Which choice is correct?", "o": ["A) All employees, who have completed the training, are", "B) All employees who have completed the training are", "C) All employees, that have completed the training, are", "D) All employees who, have completed the training, are"], "a": 1, "e": "B doğrudur. 'Who have completed the training' kısıtlayıcıdır — hangi çalışanların başvurabileceğini belirtir. Virgül yok.\n\nA — virgüller nonrestrictive yapar; tüm çalışanların eğitimi tamamladığı anlamı çıkar.\nC — 'that' ve virgüller yanlıştır.\nD — 'who'dan sonra yanlış yere virgül."}, {"k": "nrr", "p": "The treaty, <u>signed by twelve nations in 1987</u>, has been credited with significantly reducing ozone depletion.", "q": "Which choice correctly handles the underlined phrase?", "o": ["A) treaty signed by twelve nations in 1987 has", "B) treaty, signed by twelve nations in 1987 has", "C) treaty, signed by twelve nations in 1987, has", "D) treaty signed, by twelve nations in 1987, has"], "a": 2, "e": "C doğrudur. 'Signed by twelve nations in 1987' kısıtlayıcı olmayan bir katılımcı öbektir. Her iki yanı virgülle ayrılır.\n\nA — virgüller yok.\nB — kapanış virgülü eksik.\nD — açılış virgülü öbekin içinde — dengesiz."}, {"k": "nrr", "p": "The first researcher <u>to isolate the protein</u> was a graduate student working independently.", "q": "Which choice is correct?", "o": ["A) first researcher, to isolate the protein, was", "B) first researcher to isolate the protein was", "C) first researcher, to isolate the protein was", "D) first researcher that, to isolate the protein, was"], "a": 1, "e": "B doğrudur. 'To isolate the protein' kısıtlayıcı bir mastar öbeğidir (infinitive phrase) — hangi araştırmacı olduğunu tanımlar. Virgül yok.\n\nA — virgüller nonrestrictive yapar.\nC — açılış virgülü var ama kapanış eksik.\nD — 'that' ve virgüller yanlıştır."}, {"k": "nrr", "p": "The firm hired three consultants, <u>all of whom had expertise in regulatory compliance</u>, to review the contract.", "q": "Which choice is correct?", "o": ["A) all of whom had expertise in regulatory compliance", "B) all of whom, had expertise in regulatory compliance", "C) all of them had expertise in regulatory compliance", "D) each of whom had expertise in regulatory compliance,"], "a": 0, "e": "A doğrudur. 'All of whom had expertise in regulatory compliance' kısıtlayıcı olmayan ilgi yan cümlesidir ve çevreleyen virgüllerle doğru şekilde kapatılmıştır.\n\nB — ek iç virgül yanlıştır.\nC — 'them' yerine 'whom' kullanılmalı.\nD — 'each' toplu anlamı değiştirir; sondaki virgül yanlış yerde."}, {"k": "nrr", "p": "The award goes to the student <u>whose essay demonstrates the most original thinking</u>.", "q": "Which choice is correct?", "o": ["A) student, whose essay demonstrates the most original thinking,", "B) student whose essay demonstrates the most original thinking", "C) student, that's essay demonstrates the most original thinking,", "D) student whose, essay demonstrates the most original thinking,"], "a": 1, "e": "B doğrudur. 'Whose essay demonstrates the most original thinking' kısıtlayıcıdır — ödülü kimin alacağını belirtir. Virgül yok.\n\nA — virgüller nonrestrictive yapar.\nC — 'that's' iyelik ilgi zamiri değildir.\nD — 'whose'dan sonra yanlış yere virgül."}, {"k": "nrr", "p": "The city's new transportation hub, <u>designed by a Pritzker Prize-winning architect</u>, is expected to open next spring.", "q": "Which choice is correct?", "o": ["A) hub designed by a Pritzker Prize-winning architect is", "B) hub, designed by a Pritzker Prize-winning architect is", "C) hub, designed by a Pritzker Prize-winning architect, is", "D) hub designed, by a Pritzker Prize-winning architect, is"], "a": 2, "e": "C doğrudur. 'Designed by a Pritzker Prize-winning architect' kısıtlayıcı olmayan bir katılımcı öbektir. Her iki yanı virgülle ayrılır.\n\nA — virgüller yok.\nB — kapanış virgülü eksik.\nD — virgüller öbeğin içinde — dengesiz."}, {"k": "nrr", "p": "The gene <u>that regulates cell division</u> was identified by the research team after five years of study.", "q": "Which choice is correct?", "o": ["A) gene, that regulates cell division, was", "B) gene, which regulates cell division, was", "C) gene that regulates cell division was", "D) gene which regulates cell division was"], "a": 2, "e": "C doğrudur. 'That regulates cell division' kısıtlayıcıdır — hangi gen olduğunu belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that' ve virgüller yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar.\nD — 'which' virgülsüz SAT'ta standart değildir."}, {"k": "nrr", "p": "The only medication <u>that has been approved for this condition</u> is currently in short supply.", "q": "Which choice is correct?", "o": ["A) medication, that has been approved for this condition, is", "B) medication, which has been approved for this condition, is", "C) medication that has been approved for this condition is", "D) medication which has been approved for this condition is"], "a": 2, "e": "C doğrudur. 'That has been approved for this condition' kısıtlayıcıdır — hangi ilaç olduğunu belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that' ve virgüller yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar.\nD — 'which' virgülsüz SAT'ta standart değildir."}, {"k": "nrr", "p": "Her mentor, <u>Professor Williams</u>, encouraged her to pursue a doctorate in computational linguistics.", "q": "Which choice correctly handles the underlined appositive?", "o": ["A) mentor Professor Williams encouraged", "B) mentor, Professor Williams encouraged", "C) mentor, Professor Williams, encouraged", "D) mentor — Professor Williams — encouraged"], "a": 2, "e": "C doğrudur. 'Professor Williams' kısıtlayıcı olmayan bir açıklayıcı öbektir (appositive). Her iki yanı virgülle ayrılır.\n\nA — virgüller yok.\nB — yalnızca açılış virgülü; kapanış eksik.\nD — tireler appositive kapatmak için kullanılabilir ama SAT'ta virgül kuralı tercih edilir."}, {"k": "nrr", "p": "Any medication <u>that causes adverse reactions in clinical trials</u> must be withdrawn from testing.", "q": "Which choice is correct?", "o": ["A) medication, that causes adverse reactions in clinical trials, must", "B) medication, which causes adverse reactions in clinical trials, must", "C) medication that causes adverse reactions in clinical trials must", "D) medication which causes adverse reactions in clinical trials must"], "a": 2, "e": "C doğrudur. 'That causes adverse reactions in clinical trials' kısıtlayıcıdır — hangi ilaçların geri çekilmesi gerektiğini belirtir. Virgül yok, 'that' kullanılır.\n\nA — 'that' ve virgüller yanlıştır.\nB — 'which' ve virgüller nonrestrictive yapar; tüm ilaçların yan etki gösterdiği anlamı çıkar.\nD — 'which' virgülsüz SAT'ta standart değildir."}]}, {"n": 4, "topic": "Indefinite Pronoun Agreement", "diff": "Indefinite Pronoun Agreement", "qs": [{"k": "indef", "p": "Everyone on the research team submitted <u>their</u> final report before the Friday deadline.", "q": "Which pronoun correctly agrees with 'everyone'?", "o": ["A) their", "B) his", "C) her", "D) its"], "a": 0, "e": "A doğrudur. 'Everyone' tekil olmakla birlikte cinsiyeti belirsiz kişileri kasteder. SAT, belirsiz zamirlerde cinsiyet nötr tekil 'their/they' kullanımını kabul eder.\n\nB — 'his' erkek cinsiyet varsayar.\nC — 'her' kadın cinsiyet varsayar.\nD — 'its' nesnelere atıfta bulunur."}, {"k": "indef", "p": "Neither of the proposals <u>were</u> deemed sufficient to address the committee's concerns.", "q": "Which verb form correctly agrees with 'neither'?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C doğrudur. 'Neither' her zaman tekildir. 'Neither of the proposals' — özne 'neither'dır, 'proposals' değil. Tekil fiil: 'was.'\n\nA — 'were' çoğuldur; 'neither' tekildir.\nB — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul present perfect'tir."}, {"k": "indef", "p": "Each of the applicants <u>were</u> required to provide three professional references.", "q": "Which verb form is correct?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C doğrudur. 'Each' her zaman tekildir. Edat öbeğini çıkarın — özne 'each.' Tekil fiil: 'was.'\n\nA — 'were' 'applicants'a uyuyor, özne 'each'e değil.\nB — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul present perfect."}, {"k": "indef", "p": "Somebody in the department has left <u>their</u> personal items in the conference room.", "q": "Which pronoun correctly completes the sentence?", "o": ["A) his", "B) their", "C) its", "D) our"], "a": 1, "e": "B doğrudur. 'Somebody' cinsiyeti belirsiz tekil belirsiz zamirdir. Cinsiyet nötr tekil 'their' SAT tarafından kabul edilir.\n\nA — 'his' erkek cinsiyet varsayar.\nC — 'its' nesnelere atıfta bulunur.\nD — 'our' birinci çoğul şahıstır."}, {"k": "indef", "p": "Anyone who fails to meet the eligibility requirements will have <u>their</u> application returned.", "q": "Which pronoun is correct?", "o": ["A) his or her", "B) their", "C) its", "D) our"], "a": 1, "e": "B doğrudur. 'Anyone' cinsiyeti belirsiz tekil belirsiz zamirdir. SAT cinsiyet nötr tekil 'their' kullanımını kabul eder.\n\nA — 'his or her' dilbilgisel olarak doğrudur ama SAT daha kısa olan 'their'i tercih eder.\nC — 'its' nesnelere atıfta bulunur.\nD — 'our' birinci çoğul şahıstır."}, {"k": "indef", "p": "Neither the director nor the board members <u>was</u> willing to accept responsibility for the decision.", "q": "Which verb is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B doğrudur. 'Neither...nor' yapısında fiil en yakın özneyle uyuşur. 'Board members' çoğuldur → 'were.'\n\nA — 'was' 'director'a uyuyor, en yakın 'board members'a değil.\nC — 'is' tekil geniş zamandır.\nD — 'has been' tekil present perfect."}, {"k": "indef", "p": "Someone on the night shift has reported that <u>they</u> noticed unusual activity near the loading dock.", "q": "Which pronoun is correct?", "o": ["A) he", "B) she", "C) they", "D) it"], "a": 2, "e": "C doğrudur. 'Someone' cinsiyeti belirsiz tekil belirsiz zamirdir. Cinsiyet nötr tekil 'they' kabul edilir.\n\nA — 'he' erkek cinsiyet varsayar.\nB — 'she' kadın cinsiyet varsayar.\nD — 'it' nesnelere atıfta bulunur."}, {"k": "indef", "p": "Every board member and every committee chair <u>are</u> expected to attend the annual general meeting.", "q": "Which verb is correct?", "o": ["A) are", "B) were", "C) is", "D) have been"], "a": 2, "e": "C doğrudur. 'Every' öneki olan ve 'and' ile bağlanan özne tekil sayılır. 'Every X and every Y' tekil fiil alır.\n\nA — 'are' bileşik özneyi çoğul sayar — yanlış.\nB — 'were' geçmiş çoğuldur.\nD — 'have been' çoğul present perfect."}, {"k": "indef", "p": "Most of the evidence <u>were</u> gathered during the first phase of the investigation.", "q": "Which verb is correct?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C doğrudur. 'Evidence' sayılamaz isimdir. 'Most of the evidence' — fiil 'evidence'a göre belirlenir (sayılamaz = tekil). 'Was' doğrudur.\n\nA — 'were' 'evidence'ı sayılabilir kabul eder.\nB — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul perfect."}, {"k": "indef", "p": "Either the manager or the team members <u>is</u> responsible for filing the quarterly reports.", "q": "Which verb is correct?", "o": ["A) is", "B) are", "C) was", "D) were"], "a": 1, "e": "B doğrudur. 'Either...or' yapısında en yakın özneyle uyuşulur: 'team members' çoğul → 'are.'\n\nA — 'is' 'manager'a uyuyor, en yakın 'team members'a değil.\nC — 'was' geçmiş tekildir.\nD — 'were' geçmiş çoğuldur."}, {"k": "indef", "p": "Nobody in the two departments <u>have</u> responded to the survey about workplace conditions.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B doğrudur. 'Nobody' her zaman tekildir. 'Has' tekil present perfect yardımcı fiilidir.\n\nA — 'have' 'nobody'yi çoğul sayar.\nC — 'were' geçmiş çoğuldur.\nD — 'are' çoğul geniş zamandır."}, {"k": "indef", "p": "Some of the funding <u>have</u> already been allocated to operational expenses.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) were", "D) are"], "a": 1, "e": "B doğrudur. 'Funding' sayılamaz isimdir — 'some of the funding' tekil fiil alır.\n\nA — 'have' 'funding'i sayılabilir kabul eder.\nC — 'were' geçmiş çoğuldur.\nD — 'are' çoğul geniş zamandır."}, {"k": "indef", "p": "Each of the new regulations <u>have</u> been reviewed by the legal team before implementation.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) are", "D) were"], "a": 1, "e": "B doğrudur. 'Each' her zaman tekildir. 'Has been reviewed' tekil present perfect pasif.\n\nA — 'have' 'regulations'a uyuyor, özne 'each'e değil.\nC — 'are' çoğul geniş zamandır.\nD — 'were' geçmiş çoğuldur."}, {"k": "indef", "p": "All of the data <u>have</u> been processed and verified by the analytical team.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) are", "D) were"], "a": 1, "e": "B doğrudur. 'Data' modern akademik ve SAT kullanımında sayılamaz ('information' gibi) sayılır. 'All of the data' tekil fiil alır.\n\nA — 'have' 'data'yı sayılabilir çoğul sayar.\nC — 'are' çoğul geniş zamandır.\nD — 'were' geçmiş çoğuldur."}, {"k": "indef", "p": "Neither of the solutions <u>are</u> acceptable given the project's time constraints.", "q": "Which verb is correct?", "o": ["A) are", "B) is", "C) were", "D) have been"], "a": 1, "e": "B doğrudur. 'Neither' her zaman tekildir. 'Is' doğru tekil fiildir.\n\nA — 'are' 'solutions'a uyuyor, özne 'neither'a değil.\nC — 'were' geçmiş zamandır.\nD — 'have been' çoğul perfect."}, {"k": "indef", "p": "Many of the participants <u>has</u> reported significant improvements in their overall well-being.", "q": "Which verb is correct?", "o": ["A) has", "B) have", "C) is", "D) was"], "a": 1, "e": "B doğrudur. 'Many' çoğul belirsiz zamirdir. 'Many of the participants' çoğul fiil alır: 'have reported.'\n\nA — 'has' tekildir; 'many' çoğuldur.\nC — 'is' tekil geniş zamandır.\nD — 'was' tekil geçmişdir."}, {"k": "indef", "p": "Everybody who attended the conference <u>were</u> asked to complete an evaluation form.", "q": "Which verb is correct?", "o": ["A) were", "B) was", "C) are", "D) have been"], "a": 1, "e": "B doğrudur. 'Everybody' tekildir. 'Who attended the conference' ilgi yan cümlesi özneyi değiştirmez — 'everybody' tekil fiil alır.\n\nA — 'were' 'everybody'yi çoğul sayar.\nC — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul perfect."}, {"k": "indef", "p": "No one on the board <u>were</u> aware of the financial irregularities before the audit.", "q": "Which verb is correct?", "o": ["A) were", "B) are", "C) was", "D) have been"], "a": 2, "e": "C doğrudur. 'No one' her zaman tekildir. 'Was' doğru tekil geçmiş fiildir.\n\nA — 'were' çoğuldur; 'no one' tekildir.\nB — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul perfect."}, {"k": "indef", "p": "Few of the proposals <u>was</u> considered feasible within the current budget framework.", "q": "Which verb is correct?", "o": ["A) was", "B) were", "C) is", "D) has been"], "a": 1, "e": "B doğrudur. 'Few' çoğul belirsiz zamirdir. 'Few of the proposals' çoğul fiil alır: 'were considered.'\n\nA — 'was' tekildir; 'few' çoğuldur.\nC — 'is' tekil geniş zamandır.\nD — 'has been' tekil perfect."}, {"k": "indef", "p": "A number of issues <u>has</u> been raised by the committee regarding the proposed merger.", "q": "Which verb is correct?", "o": ["A) has", "B) have", "C) was", "D) is"], "a": 1, "e": "B doğrudur. 'A number of' çoğul sayılır (the number of'ten farklı olarak). 'A number of issues' = birkaç sorun — çoğul fiil alır.\n\nA — 'has' 'a number of'ü tekil sayar; yanlış.\nC — 'was' tekil geçmişdir.\nD — 'is' tekil geniş zamandır."}, {"k": "indef", "p": "The number of applicants <u>have</u> increased significantly since the program was redesigned.", "q": "Which verb is correct?", "o": ["A) have", "B) has", "C) are", "D) were"], "a": 1, "e": "B doğrudur. 'The number of' (belirli artikelle) tekil sayılır. 'The number' toplam sayıyı tek bir miktar olarak ifade eder.\n\nA — 'have' bu ifadeyi çoğul sayar; yanlış ('a number of' çoğuldur ama 'the number' tekildir).\nC — 'are' çoğuldur.\nD — 'were' geçmiş çoğuldur."}, {"k": "indef", "p": "Anybody who discovers a conflict of interest <u>are</u> required to disclose it to the ethics committee.", "q": "Which verb is correct?", "o": ["A) are", "B) is", "C) were", "D) have been"], "a": 1, "e": "B doğrudur. 'Anybody' tekildir. 'Is required' doğru tekil geniş zaman pasifi.\n\nA — 'are' 'anybody'yi çoğul sayar.\nC — 'were' geçmişdir.\nD — 'have been' çoğul perfect."}, {"k": "indef", "p": "Several of the witnesses <u>has</u> changed their account of events since the initial report was filed.", "q": "Which verb is correct?", "o": ["A) has", "B) have", "C) is", "D) was"], "a": 1, "e": "B doğrudur. 'Several' çoğul belirsiz zamirdir. 'Several of the witnesses' çoğul fiil alır: 'have changed.'\n\nA — 'has' tekildir; 'several' çoğuldur.\nC — 'is' tekil geniş zamandır.\nD — 'was' tekil geçmişdir."}, {"k": "indef", "p": "All of the committee members <u>has</u> reviewed the draft proposal and submitted their feedback.", "q": "Which verb is correct?", "o": ["A) has", "B) have", "C) was", "D) is"], "a": 1, "e": "B doğrudur. 'All' sayılabilir çoğul isimle ('committee members') çoğuldur. 'Have reviewed' doğru çoğul present perfect.\n\nA — 'has' tekildir.\nC — 'was' tekil geçmişdir.\nD — 'is' tekil geniş zamandır."}, {"k": "indef", "p": "Everything in the classified documents <u>were</u> redacted before the files were released to the public.", "q": "Which verb is correct?", "o": ["A) were", "B) was", "C) are", "D) have been"], "a": 1, "e": "B doğrudur. 'Everything' her zaman tekildir. 'Was redacted' doğru tekil geçmiş pasif.\n\nA — 'were' 'everything'i çoğul sayar.\nC — 'are' çoğul geniş zamandır.\nD — 'have been' çoğul perfect."}]}, {"n": 5, "topic": "Verb Forms — Gerunds, Infinitives, Participles", "diff": "Verb Forms", "qs": [{"k": "vform", "p": "The committee decided <u>suspending</u> the project until further funding could be secured.", "q": "Which verb form is correct after 'decided'?", "o": ["A) suspending", "B) to suspend", "C) having suspended", "D) suspend"], "a": 1, "e": "B doğrudur. 'Decide' mastar (infinitive) alır: 'decided to suspend.' Gerund almaz.\n\nA — 'decide suspending' standart değildir.\nC — 'having suspended' önceden tamamlanmış eylemi ima eder.\nD — 'decided suspend' dilbilgisel değildir."}, {"k": "vform", "p": "The manager suggested <u>to reorganize</u> the department to improve efficiency.", "q": "Which verb form is correct after 'suggested'?", "o": ["A) to reorganize", "B) reorganizing", "C) having reorganized", "D) reorganize"], "a": 1, "e": "B doğrudur. 'Suggest' gerund alır: 'suggested reorganizing.' Mastar almaz.\n\nA — 'suggested to reorganize' yanlıştır.\nC — 'having reorganized' önceden tamamlanmış eylemi ima eder.\nD — 'suggest reorganize' dilbilgisel değildir."}, {"k": "vform", "p": "She avoided <u>to make</u> any commitments until she had reviewed the contract.", "q": "Which verb form is correct after 'avoided'?", "o": ["A) to make", "B) making", "C) having made", "D) make"], "a": 1, "e": "B doğrudur. 'Avoid' her zaman gerund alır: 'avoided making.'\n\nA — 'avoid to make' yanlıştır.\nC — 'having made' önceden tamamlanmış eylemi ima eder.\nD — 'avoid make' dilbilgisel değildir."}, {"k": "vform", "p": "The researchers hope <u>publishing</u> their findings in a major journal by the end of the year.", "q": "Which verb form is correct after 'hope'?", "o": ["A) publishing", "B) to publish", "C) having published", "D) published"], "a": 1, "e": "B doğrudur. 'Hope' mastar alır: 'hope to publish.'\n\nA — 'hope publishing' standart değildir.\nC — 'having published' önceden tamamlanmışlık ima eder.\nD — 'hope published' dilbilgisel değildir."}, {"k": "vform", "p": "The board considered <u>to extend</u> the deadline by two weeks.", "q": "Which verb form is correct?", "o": ["A) to extend", "B) extending", "C) having extended", "D) extended"], "a": 1, "e": "B doğrudur. 'Consider' gerund alır: 'considered extending.'\n\nA — 'considered to extend' yanlıştır.\nC — 'having extended' önceden tamamlanmışlık ima eder.\nD — 'consider extended' dilbilgisel değildir."}, {"k": "vform", "p": "<u>Having completed</u> the audit, the accounting firm submitted its final report to the client.", "q": "Which choice correctly uses the participial phrase?", "o": ["A) Having completed the audit, the accounting firm", "B) Completing the audit having been done, the accounting firm", "C) After they complete the audit, the accounting firm", "D) The audit having been completed, accounting firms"], "a": 0, "e": "A doğrudur. 'Having completed the audit' mükemmel katılımcı öbeğidir (perfect participial phrase) — ana cümlenin öznesinin (muhasebe firması) daha önce tamamladığı eylemi gösterir.\n\nB — 'having been done' sonrasında kullanımı garip ve gereksizdir.\nC — 'After they complete' zaman tutarsızlığı yaratır.\nD — 'accounting firms' (çoğul) belirli firmaya uymaz."}, {"k": "vform", "p": "The new policy requires all employees <u>completing</u> the annual compliance training by December.", "q": "Which verb form is correct?", "o": ["A) completing", "B) to complete", "C) having completed", "D) completed"], "a": 1, "e": "B doğrudur. 'Require' bu yapıda mastar alır: 'requires all employees to complete.'\n\nA — 'requires completing' farklı bir yapıda kullanılabilir ama 'requires [kişi] to complete' standart kalıptır.\nC — 'having completed' önceden tamamlanmışlık ima eder.\nD — 'require employees completed' dilbilgisel değildir."}, {"k": "vform", "p": "<u>Exhausted by the long trial</u>, the jury requested a short recess before deliberating.", "q": "Which choice correctly uses the participial phrase?", "o": ["A) Exhausted by the long trial, the jury", "B) The jury being exhausted by the long trial,", "C) Because of exhaustion from the long trial, the jury", "D) Exhausted by the long trial, a recess was requested"], "a": 0, "e": "A doğrudur. 'Exhausted by the long trial' katılımcı öbeği ana cümlenin öznesi olan 'the jury'yi doğru şekilde niteler.\n\nB — 'the jury being exhausted' mutlak öbek kullanır; anlam ince farklılaşır.\nC — katılımcı öbeği kullanmaktan tamamen kaçınır.\nD — 'a recess was requested' yorgun olamaz — sarkan belirteç (dangling modifier)."}, {"k": "vform", "p": "The professor admitted <u>to have made</u> an error in the problem set.", "q": "Which verb form is correct after 'admitted'?", "o": ["A) to have made", "B) making", "C) to make", "D) having made"], "a": 3, "e": "D doğrudur. 'Admit' + geçmiş eylem için gerund: 'admitted having made.' 'Admit to making' da kabul edilebilir.\n\nA — 'admitted to have made' standart değildir.\nB — 'admitted making' kabul edilebilir ama 'having made' geçmişliği daha açık belirtir.\nC — 'to make' gelecek eylemi ima eder; anlama uymaz."}, {"k": "vform", "p": "The executive denied <u>to approve</u> the fraudulent invoices.", "q": "Which verb form is correct?", "o": ["A) to approve", "B) approving", "C) having approved", "D) approve"], "a": 1, "e": "B doğrudur. 'Deny' gerund alır: 'denied approving.'\n\nA — 'denied to approve' yanlıştır; 'deny' gerund alır.\nD — 'deny approve' dilbilgisel değildir."}, {"k": "vform", "p": "The team finished <u>to write</u> the final section of the report just before midnight.", "q": "Which verb form is correct?", "o": ["A) to write", "B) writing", "C) having written", "D) written"], "a": 1, "e": "B doğrudur. 'Finish' her zaman gerund alır: 'finished writing.'\n\nA — 'finished to write' yanlıştır.\nC — 'having written' katılımcı anlamda önceden tamamlanmışlık ima eder.\nD — 'finish written' dilbilgisel değildir."}, {"k": "vform", "p": "She pretended <u>not knowing</u> about the decision when her colleagues asked.", "q": "Which verb form is correct?", "o": ["A) not knowing", "B) not to know", "C) having not known", "D) to not know"], "a": 1, "e": "B doğrudur. 'Pretend' mastar alır: 'pretended not to know.' Olumsuz mastar 'not'u 'to'dan önce koyar.\n\nA — 'pretended not knowing' standart değildir.\nC — 'having not known' bu bağlamda yanlıştır.\nD — 'to not know' bölünmüş mastar (split infinitive); 'not to know' tercih edilir."}, {"k": "vform", "p": "The organization stopped <u>to fund</u> research projects that could not demonstrate measurable outcomes.", "q": "Which choice correctly conveys that funding was discontinued?", "o": ["A) stopped to fund", "B) stopped funding", "C) stopped to have funded", "D) stopped having funded"], "a": 1, "e": "B doğrudur. 'Stopped funding' = finansmanı kesti. 'Stopped to fund' = fonlamak için durdu — tam ters anlam!\n\nA — 'stopped to fund' = fonlamak için durdu — yanlış anlam.\nC — 'stopped to have funded' standart değildir.\nD — 'stopped having funded' standart değildir."}, {"k": "vform", "p": "The CEO remembered <u>signing</u> the contract, but her assistant could not locate a copy.", "q": "Which form correctly conveys that the signing already happened?", "o": ["A) to sign", "B) signing", "C) to have signed", "D) having to sign"], "a": 1, "e": "B doğrudur. 'Remembered signing' = imzaladığını hatırladı (geçmiş eylem). 'Remembered to sign' = imzalaması gerektiğini hatırladı (gelecek eylem). Cümle zaten imzalandığını ima eder.\n\nA — 'remembered to sign' = imzalaması gerektiğini hatırladı — yanlış anlam.\nC — 'to have signed' bu bağlamda standart değildir.\nD — 'having to sign' = imzalamak zorunda olmak anlamına gelir."}, {"k": "vform", "p": "The auditors tried <u>uncovering</u> the source of the discrepancy but were unsuccessful.", "q": "Which form is most standard after 'tried'?", "o": ["A) uncovering", "B) to uncover", "C) having uncovered", "D) uncover"], "a": 1, "e": "B doğrudur. 'Tried to uncover' = bulmaya çalıştı (ve başaramadı). 'Tried uncovering' = yöntem olarak denedi — burada başarısız girişim kastı var.\n\nA — 'tried uncovering' yöntemi denemeyi ima eder.\nC — 'having uncovered' önceden tamamlanmışlık ima eder.\nD — 'tried uncover' dilbilgisel değildir."}, {"k": "vform", "p": "The contractor agreed <u>fixing</u> the structural issues before the final inspection.", "q": "Which verb form is correct?", "o": ["A) fixing", "B) to fix", "C) having fixed", "D) fix"], "a": 1, "e": "B doğrudur. 'Agree' mastar alır: 'agreed to fix.'\n\nA — 'agreed fixing' standart değildir.\nC — 'having fixed' önceden tamamlanmışlık ima eder.\nD — 'agree fix' dilbilgisel değildir."}, {"k": "vform", "p": "She regretted <u>to tell</u> her colleague about the restructuring before the official announcement.", "q": "Which form is correct?", "o": ["A) to tell", "B) telling", "C) to have told", "D) having to tell"], "a": 1, "e": "B doğrudur. 'Regret' + gerund = geçmiş bir eylemden pişman olmak. 'Regretted telling' doğrudur.\n\nA — 'regretted to tell' resmi duyurularda kullanılır ('I regret to inform you') — geçmiş eylem için değil.\nC — 'to have told' bu bağlamda standart değildir.\nD — 'having to tell' = söylemek zorunda kalmak anlamına gelir."}, {"k": "vform", "p": "The film <u>being released</u> next month has already generated significant critical interest.", "q": "Which choice is correct?", "o": ["A) being released", "B) to be released", "C) released", "D) that releasing"], "a": 2, "e": "C doğrudur. 'The film released next month' indirgeme ilgi cümlesi kullanır ('which will be released' → 'released'). Bu bağlamda 'released' en doğal katılımcı sıfattır.\n\nA — 'being released' dilbilgisel olarak mümkün ama daha az doğaldır.\nB — 'to be released' amacı değil takvimi ima eder.\nD — 'that releasing' dilbilgisel değildir."}, {"k": "vform", "p": "The director chose to <u>having revised</u> the script before final casting decisions were made.", "q": "Which form is correct?", "o": ["A) having revised", "B) revise", "C) revising", "D) revised"], "a": 1, "e": "B doğrudur. 'Choose to' mastar yalın fiil alır: 'chose to revise.' 'To'dan sonra yalın fiil gelir.\n\nA — 'to having revised' dilbilgisel değildir.\nC — 'to revising' standart değildir.\nD — 'to revised' dilbilgisel değildir."}, {"k": "vform", "p": "<u>Written in 1818</u>, Frankenstein continues to be studied in literature courses worldwide.", "q": "Which choice correctly uses the participial phrase?", "o": ["A) Written in 1818, Frankenstein continues", "B) Having written in 1818, Frankenstein continues", "C) Being written in 1818, Frankenstein continues", "D) Writing in 1818, Frankenstein continues"], "a": 0, "e": "A doğrudur. 'Written in 1818' geçmiş katılımcı öbeği 'Frankenstein'ı doğru şekilde niteler — roman yazılmıştır (pasif).\n\nB — 'Having written' Frankenstein'ın bir şeyler yazdığını ima eder — sarkan belirteç.\nC — 'Being written' 1818'de yazılmaya devam edildiğini ima eder — yanlış.\nD — 'Writing in 1818' Frankenstein'ın yazan olduğunu ima eder — sarkan belirteç."}, {"k": "vform", "p": "The board is considering <u>to expand</u> the program to three additional cities by next year.", "q": "Which verb form is correct?", "o": ["A) to expand", "B) expanding", "C) having expanded", "D) expanded"], "a": 1, "e": "B doğrudur. 'Consider' gerund alır: 'is considering expanding.'\n\nA — 'considering to expand' standart değildir.\nC — 'having expanded' önceden tamamlanmışlık ima eder.\nD — 'considering expanded' dilbilgisel değildir."}, {"k": "vform", "p": "The athlete's trainer recommended <u>to increase</u> the intensity of workouts gradually over three weeks.", "q": "Which verb form is correct?", "o": ["A) to increase", "B) increasing", "C) having increased", "D) increase"], "a": 1, "e": "B doğrudur. 'Recommend' gerund alır: 'recommended increasing.'\n\nA — 'recommended to increase' bu yapıda standart değildir.\nC — 'having increased' önceden tamamlanmışlık ima eder.\nD — 'recommend increase' dilbilgisel değildir."}, {"k": "vform", "p": "The company's lawyer advised them <u>settling</u> the dispute out of court to avoid a lengthy trial.", "q": "Which verb form is correct?", "o": ["A) settling", "B) to settle", "C) having settled", "D) settle"], "a": 1, "e": "B doğrudur. 'Advise someone to do something' = 'advised them to settle.' Mastar kullanılır.\n\nA — 'advised them settling' bu yapıda standart değildir.\nC — 'having settled' eylemin tamamlandığını ima eder.\nD — 'advise settle' dilbilgisel değildir."}, {"k": "vform", "p": "She managed <u>completing</u> all three projects before the quarterly review.", "q": "Which verb form is correct?", "o": ["A) completing", "B) to complete", "C) having completed", "D) completed"], "a": 1, "e": "B doğrudur. 'Manage' mastar alır: 'managed to complete.'\n\nA — 'managed completing' standart değildir.\nC — 'having completed' 'managed'den sonra standart değildir.\nD — 'managed completed' dilbilgisel değildir."}, {"k": "vform", "p": "The student appears <u>having misunderstood</u> the requirements for the final examination.", "q": "Which verb form is correct?", "o": ["A) having misunderstood", "B) to have misunderstood", "C) misunderstanding", "D) misunderstood"], "a": 1, "e": "B doğrudur. 'Appear' mastar alır. 'To have misunderstood' mükemmel mastar kullanarak yanlış anlamanın görünümden önce gerçekleştiğini belirtir.\n\nA — 'appears having misunderstood' standart değildir; 'appear' mastar alır.\nC — 'appears misunderstanding' standart değildir.\nD — 'appears misunderstood' mastar işaretçisinden yoksundur."}]}, {"n": 6, "topic": "Faulty Comparisons", "diff": "Faulty Comparisons", "qs": [{"k": "comp", "p": "The average salary of engineers in this city is higher than <u>teachers</u>.", "q": "Which revision corrects the faulty comparison?", "o": ["A) higher than teachers", "B) higher than that of teachers", "C) higher than teacher's", "D) higher than the teachers'"], "a": 1, "e": "B doğrudur. Cümle 'mühendislerin ortalama maaşı'nı 'öğretmenler'le karşılaştırıyor — ama maaş insanlarla karşılaştırılamaz. 'That of teachers' = 'öğretmenlerin maaşı' kullanılmalı.\n\nA — maaşı insanlarla karşılaştırır — mantıksız.\nC — 'teacher's' iyelikli ama eksik: 'öğretmenin neyi?'\nD — 'the teachers'' da eksik."}, {"k": "comp", "p": "The production costs of the new factory are lower than <u>those of</u> the old facility.", "q": "Which choice is correct?", "o": ["A) those of", "B) it", "C) that", "D) them"], "a": 0, "e": "A doğrudur. 'Those of the old facility' maliyetleri (çoğul) maliyetlerle doğru şekilde karşılaştırır. 'Those' çoğul zamiri 'production costs' yerine geçer.\n\nB — 'it' tekildir; 'costs' çoğuldur.\nC — 'that' tekildir.\nD — 'them' iyelik/atıf ilişkisini 'those of' gibi kuramaz."}, {"k": "comp", "p": "The climate in the southern region is warmer than <u>the north</u>.", "q": "Which revision correctly compares like things?", "o": ["A) the north", "B) that of the northern region", "C) what the northern region has", "D) the northern region's being"], "a": 1, "e": "B doğrudur. Güney bölgesinin iklimi kuzey bölgesinin iklimiyle karşılaştırılmalı. 'That of the northern region' = 'kuzey bölgesinin iklimi.'\n\nA — iklimi bir bölgeyle karşılaştırır — mantıksız.\nC — dilbilgisel olarak garip ve gereksiz uzun.\nD — 'the northern region's being' standart değildir."}, {"k": "comp", "p": "The research methods used in this study are more rigorous than <u>previous studies</u>.", "q": "Which revision corrects the faulty comparison?", "o": ["A) previous studies", "B) those of previous studies", "C) previous studies' methods", "D) what previous studies used to use"], "a": 1, "e": "B doğrudur. 'Research methods' çalışmalarla değil, önceki çalışmaların yöntemleriyle karşılaştırılmalı. 'Those of previous studies' = 'önceki çalışmaların yöntemleri.'\n\nA — yöntemleri çalışmalarla karşılaştırır — mantıksız.\nC — dilbilgisel olarak mümkün ama garip.\nD — gereksiz uzun ve gayri resmi."}, {"k": "comp", "p": "The unemployment rate in the capital is higher than <u>rural areas</u>.", "q": "Which revision corrects the faulty comparison?", "o": ["A) rural areas", "B) in rural areas", "C) that in rural areas", "D) what rural areas have"], "a": 2, "e": "C doğrudur. İşsizlik oranı bölgelerle değil, kırsal bölgelerdeki işsizlik oranıyla karşılaştırılmalı. 'That in rural areas' = 'kırsal bölgelerdeki işsizlik oranı.'\n\nA — oranı bölgelerle karşılaştırır — mantıksız.\nB — 'higher than in rural areas' eliptik; C daha açık.\nD — gereksiz uzun ve gayri resmi."}, {"k": "comp", "p": "Her presentation skills are better than <u>anyone</u> in the department.", "q": "Which revision corrects the faulty comparison?", "o": ["A) anyone", "B) anyone else's", "C) those of anyone", "D) any other person"], "a": 1, "e": "B doğrudur. Kendisi de departmanda olduğundan 'anyone' onu da kapsar — mantıksız. 'Anyone else's' onu karşılaştırma dışında bırakır. Ayrıca beceriler becerilerle karşılaştırılmalı.\n\nA — 'anyone' onu da içerir; mantıksız.\nC — 'those of anyone' onu karşılaştırma dışında bırakmaz.\nD — 'those of any other person' daha tam ama en basit çözüm B'dir."}, {"k": "comp", "p": "The population of the city is larger than <u>any city</u> in the region.", "q": "Which revision is correct?", "o": ["A) any city", "B) any other city", "C) all cities", "D) every other cities"], "a": 1, "e": "B doğrudur. Şehir bölgenin parçası olduğundan 'any city' onu da kapsıyor. 'Any other city' onu karşılaştırma dışında bırakır.\n\nA — şehri kendisiyle karşılaştırır.\nC — 'all cities' bu yapıda dilbilgisel olarak garip.\nD — 'every other cities' yanlıştır ('every other city' kabul edilebilir ama alışılmamış)."}, {"k": "comp", "p": "This model is as efficient, <u>if not more efficient</u>, than the previous version.", "q": "Which choice is correct?", "o": ["A) if not more efficient, than", "B) if not more efficient, as", "C) if not more efficient than", "D) if not more efficient as"], "a": 0, "e": "A doğrudur. 'As efficient as, if not more efficient than' — ikinci unsur ('if not more efficient') eklendiğinde 'than' gerekir çünkü 'more efficient than' tamamlanmalıdır.\n\nB — sondaki 'as' 'as efficient as'ı tamamlar ama 'more efficient'ı karşılaştırmasız bırakır.\nC — 'than'den önce virgül eksik.\nD — 'as' 'more efficient'ı tamamlamaz."}, {"k": "comp", "p": "The annual revenue of the tech sector is greater than <u>the agricultural</u> sector.", "q": "Which revision corrects the faulty comparison?", "o": ["A) the agricultural sector", "B) that of the agricultural sector", "C) what is the agricultural sector's", "D) the agricultural sector revenue"], "a": 1, "e": "B doğrudur. Gelir gelirle karşılaştırılmalı. 'That of the agricultural sector' = 'tarım sektörünün yıllık geliri.'\n\nA — geliri sektörle karşılaştırır — mantıksız.\nC — garip ve standart dışı.\nD — edat eksik ve belirsiz."}, {"k": "comp", "p": "The quality of the imported goods is inferior to <u>domestic products</u>.", "q": "Which revision correctly compares like things?", "o": ["A) domestic products", "B) those of domestic products", "C) that of domestic products", "D) domestic products' quality"], "a": 2, "e": "C doğrudur. Quality (tekil) kaliteyle karşılaştırılmalı. 'That of domestic products' = 'yerli ürünlerin kalitesi.' 'That' tekildir.\n\nA — kaliteyi ürünlerle karşılaştırır — mantıksız.\nB — 'those' çoğuldur; kalite tekildir.\nD — dilbilgisel olarak mümkün ama C'den az temiz."}, {"k": "comp", "p": "The data from the second trial are more conclusive than <u>the first</u>.", "q": "Which revision is correct?", "o": ["A) the first", "B) that of the first", "C) those from the first trial", "D) the first trial data"], "a": 2, "e": "C doğrudur. 'Data' (çoğul) veriyle karşılaştırılmalı. 'Those from the first trial' = 'birinci denemeden elde edilen veriler.' 'Those' veriyle uyuşan çoğuldur.\n\nA — veriyi bir denemeyle karşılaştırır — mantıksız.\nB — 'that' tekildir; 'data' çoğuldur.\nD — dilbilgisel olarak mümkün ama C'den uzun."}, {"k": "comp", "p": "She scored higher on the exam than <u>any student</u> in the class.", "q": "Which revision is correct?", "o": ["A) any student", "B) any other student", "C) all the students", "D) every student"], "a": 1, "e": "B doğrudur. O sınıfta öğrenci. 'Any student' onu da kapsıyor. 'Any other student' onu karşılaştırma dışında bırakır.\n\nA — kendisini de karşılaştırmaya dahil eder — mantıksız.\nC — 'she scored higher than all the other students' şeklinde farklı bir yapıda çalışır.\nD — 'every student' de kendisini kapsar."}, {"k": "comp", "p": "The benefits of the new program are more extensive than <u>the old one</u>.", "q": "Which revision correctly compares like things?", "o": ["A) the old one", "B) those of the old one", "C) that of the old program", "D) the old program"], "a": 1, "e": "B doğrudur. Benefits (çoğul) faydalarla karşılaştırılmalı. 'Those of the old one' = 'eski programın faydaları.' 'Those' çoğuldur.\n\nA — faydaları bir programla karşılaştırır — mantıksız.\nC — 'that' tekildir; faydalar çoğuldur.\nD — A ile aynı sorun."}, {"k": "comp", "p": "The protein content of lentils is higher than <u>beef</u>.", "q": "Which revision is correct?", "o": ["A) beef", "B) that of beef", "C) those of beef", "D) beef's protein"], "a": 1, "e": "B doğrudur. Protein içeriği (tekil) et protein içeriğiyle karşılaştırılmalı. 'That of beef' = 'etin protein içeriği.'\n\nA — protein içeriğini bir yiyecekle karşılaştırır — mantıksız.\nC — 'those' çoğuldur; protein içeriği tekildir.\nD — 'beef's protein' eksik; 'content' atlıyor."}, {"k": "comp", "p": "The results of this survey are more reliable than <u>last year</u>.", "q": "Which revision corrects the comparison?", "o": ["A) last year", "B) last year's", "C) those of last year's survey", "D) what last year showed"], "a": 2, "e": "C doğrudur. Anket sonuçları sonuçlarla karşılaştırılmalı. 'Those of last year's survey' = 'geçen yılın anketinin sonuçları.'\n\nA — sonuçları bir zaman dilimiyle karşılaştırır — mantıksız.\nB — 'last year's' eksik: 'geçen yılın neyi?'\nD — 'what last year showed' dilbilgisel olarak garip."}, {"k": "comp", "p": "His prose style resembles <u>Hemingway</u>.", "q": "Which revision correctly compares like things?", "o": ["A) Hemingway", "B) that of Hemingway", "C) Hemingway's style", "D) B or C"], "a": 3, "e": "D doğrudur. Hem B ('that of Hemingway' = 'Hemingway'in düzyazı stili') hem C ('Hemingway's style') düzyazı stilini bir kişiyle değil Hemingway'in stiliyle doğru şekilde karşılaştırır.\n\nA — düzyazı stilini bir kişiyle karşılaştırır — mantıksız.\nB — doğru.\nC — doğru."}, {"k": "comp", "p": "The infrastructure of developing nations is often less advanced than <u>wealthy nations</u>.", "q": "Which revision corrects the faulty comparison?", "o": ["A) wealthy nations", "B) that of wealthy nations", "C) those of wealthy nations", "D) wealthy nations have"], "a": 1, "e": "B doğrudur. Altyapı (tekil) altyapıyla karşılaştırılmalı. 'That of wealthy nations' = 'zengin ülkelerin altyapısı.'\n\nA — altyapıyı ülkelerle karşılaştırır — mantıksız.\nC — 'those' çoğuldur; altyapı tekildir.\nD — 'wealthy nations have' eksik bir yan cümle."}, {"k": "comp", "p": "The essay written by the first student is longer than <u>the second</u>.", "q": "Which revision corrects the comparison?", "o": ["A) the second", "B) the second student's", "C) that of the second student", "D) the second student wrote"], "a": 2, "e": "C doğrudur. Bir kompozisyon başka bir kompozisyonla karşılaştırılmalı. 'That of the second student' = 'ikinci öğrencinin kompozisyonu.'\n\nA — 'the second' belirsiz.\nB — 'the second student's' eksik; isim yok.\nD — eksik ilgi cümlesi."}, {"k": "comp", "p": "The test scores of students in urban schools are higher than <u>rural schools</u>.", "q": "Which revision is correct?", "o": ["A) rural schools", "B) students in rural schools", "C) those of students in rural schools", "D) rural schools' students"], "a": 2, "e": "C doğrudur. Sınav puanları puanlarla karşılaştırılmalı. 'Those of students in rural schools' = 'kırsal okul öğrencilerinin sınav puanları.'\n\nA — puanları okullarla karşılaştırır — mantıksız.\nB — puanları öğrencilerle karşılaştırır — hâlâ mantıksız.\nD — 'rural schools' students' eksik; isim yok."}, {"k": "comp", "p": "The cost of living in New York is higher than <u>most American cities</u>.", "q": "Which revision corrects the comparison?", "o": ["A) most American cities", "B) that of most American cities", "C) those of most American cities", "D) what most American cities cost"], "a": 1, "e": "B doğrudur. Yaşam maliyeti (tekil) yaşam maliyetiyle karşılaştırılmalı. 'That of most American cities' = 'çoğu Amerikan şehrinin yaşam maliyeti.'\n\nA — maliyeti şehirlerle karşılaştırır — mantıksız.\nC — 'those' çoğuldur; yaşam maliyeti tekildir.\nD — gereksiz uzun ve garip."}, {"k": "comp", "p": "She is more talented than <u>any musician</u> I have ever heard.", "q": "Which revision is correct?", "o": ["A) any musician", "B) any other musician", "C) all musicians", "D) every musician"], "a": 0, "e": "A doğrudur. Şehir-bölge durumunun aksine, dinleyici onu daha önce dinlememiş olabilir. Bu durumda 'any musician' mantıksal olarak tutarlıdır.\n\nB — 'any other' yalnızca o da grubun içindeyse gereklidir.\nC — 'all musicians' farklı bir yapıda çalışır.\nD — 'every musician' de farklı bir yapıda kullanılır."}, {"k": "comp", "p": "The report produced by Team A is more detailed than <u>Team B</u>.", "q": "Which revision is correct?", "o": ["A) Team B", "B) that of Team B", "C) those of Team B", "D) what Team B produced"], "a": 1, "e": "B doğrudur. Rapor raporla karşılaştırılmalı. 'That of Team B' = 'B Takımının raporu.'\n\nA — raporu bir takımla karşılaştırır — mantıksız.\nC — 'those' çoğuldur; rapor tekildir.\nD — 'what Team B produced' yan cümle olarak mümkün ama daha uzun."}, {"k": "comp", "p": "The error rate of this machine is lower than <u>our competitors'</u>.", "q
