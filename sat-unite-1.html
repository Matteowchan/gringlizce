<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gri SAT . Unite 1</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{
  --cream:#EFE7D8; --ink:#26201A; --muted:#8A7F6E; --line:#E3D8C5;
  /* unit signature (swapped per unit) - used sparingly */
  --unit:#B4692C; --unit-deep:#9A4A1C;
  --teal:#2E6E6A; --teal-deep:#123C39; --teal-soft:#DDEBE9;
  /* LEARN = warm */
  --warm-bg:#F4E7D0; --warm-panel:#F3E7D0; --warm:#B4692C; --warm-deep:#9A4A1C; --warm-soft:#EEDDC1;
  /* PRACTICE = cool */
  --cool-bg:#E7F0EE; --cool-panel:#DCEBE7; --cool:#2C6A66; --cool-deep:#123C39; --cool-soft:#CFE3DF;
  --unit-tint:#F3E7D0;
  /* TEST = gold */
  --gold-bg:#F6EFDC; --gold-panel:#F0E6C6; --gold:#B0892C; --gold-deep:#6C5219; --gold-soft:#EFE2C0;
  --wrong:#A8382F; --wrong-soft:#F2E1DC;
  --paper:#FBF6EC;
  --accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
[data-mode="lesson"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
[data-mode="practice"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
[data-mode="test"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
.shell{max-width:1150px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:32px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:0 0 30px;overflow:hidden}
.pad{padding:0 34px}
.rail{width:248px;flex:none;position:sticky;top:20px}
@media(max-width:860px){.shell{flex-direction:column;gap:16px}.rail{width:100%;position:static}.pad{padding:0 20px}}
/* page head band - carries the mode temperature boldly */
.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px;transition:background .45s,border-color .45s}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:1.95rem;margin:.3rem 0 .15rem;line-height:1.14;color:var(--ink)}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
.next{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 16px;border-radius:22px;cursor:pointer;border:none;transition:.14s}
.next:hover{filter:brightness(1.06)}
.backbtn{margin-top:13px;font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent);border-radius:22px;padding:7px 15px;cursor:pointer;transition:.14s}
.backbtn:hover{background:var(--accent-soft)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.32rem;margin:26px 0 5px}
.rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:0 0 15px;transition:background .45s}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 12px}
/* rail - neutral, unit color only on small marks */
.rc{background:#FCFAF4;border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;box-shadow:0 3px 18px rgba(24,60,57,.06)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--unit);font-weight:700;padding:3px 9px;border-radius:20px}
.rc .ut{font-family:"Playfair Display",serif;font-size:1.05rem;color:var(--ink);margin:9px 0 14px;line-height:1.2}
.les{border-top:1px solid var(--line)}
.les .lh{display:flex;align-items:center;gap:10px;padding:11px 2px;font-family:Inter,sans-serif;font-size:13.5px}
.les .lh .n{width:23px;height:23px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#EDE4D3;color:var(--muted)}
.les.active .lh .n{background:var(--unit);color:#fff}
.les.done .lh .n{background:var(--unit);color:#fff}
.les .lh .lt{flex:1;color:var(--ink)}
.les.locked .lh{opacity:.45}
.les .sub{display:none;padding:2px 0 8px 33px}
.les.active .sub{display:block}
.les.active{background:var(--unit-tint);border-left:3px solid var(--unit);border-radius:0 11px 11px 0;margin:0 -8px 0 -16px;padding:0 8px 0 13px}
.les .sub a{display:flex;align-items:center;gap:9px;padding:7px 0;font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer}
.les .sub a .dot{width:8px;height:8px;border-radius:50%;background:#DDD3C0;flex:none;transition:.2s}
.les .sub a:hover{color:var(--ink)}
.les .sub a.cur{color:var(--ink);font-weight:700}
.les .sub a.cur .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.les .sub a.ok .dot{background:var(--unit)}
.les .sub a.lock{opacity:.5;cursor:default}
.compass{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.compass .cl{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quad{position:relative;border-radius:11px;border:1px solid var(--line);background:#FFFDF8;padding:11px 11px;min-height:60px;overflow:hidden;transition:.4s}
.quad .qf{font-family:Inter,sans-serif;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;z-index:1;line-height:1.25}
.quad::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s}
.quad.mastered{border-color:var(--teal)}
.quad.mastered::after{background:var(--teal);opacity:.14}
.quad.mastered .qf{color:var(--teal-deep)}
.quad.shaky{border-color:var(--gold)}
.quad.shaky::after{background:var(--gold);opacity:.16}
/* content */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 36px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;background:var(--accent-soft);color:var(--accent-deep);border-radius:50%;font-family:Inter,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trap{border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:11px;padding:13px 16px;margin:0 0 10px;background:var(--warm-panel)}
.trap b{font-family:Inter,sans-serif;font-size:13.5px;color:var(--warm-deep)}
.tips{padding-left:2px;list-style:none;margin:0}
.tips li{position:relative;padding:0 0 9px 20px}
.tips li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.passage{color:#3a352d;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:13px 16px;margin:0 0 14px;transition:background .4s}
.stem{font-weight:500;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:#fff;cursor:pointer;margin-bottom:9px;transition:.14s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt .ltr{font-family:Inter,sans-serif;font-weight:700;font-size:12px;color:var(--muted);width:23px;height:23px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.correct{border-color:var(--teal);background:var(--teal-soft)}
.opt.correct .ltr{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.wrong .ltr{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt.locked{cursor:default;pointer-events:none}
.btn{font-family:Inter,sans-serif;font-weight:600;font-size:15px;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;background:var(--accent);color:#fff;transition:.14s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--accent-deep);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.fb{border-radius:11px;padding:14px 16px;margin:16px 0 0;font-size:17px}
.fb.ok{background:var(--teal-soft);color:var(--teal-deep)}
.fb.no{background:var(--wrong-soft);color:#7a2222}
.tagline{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);margin-top:6px}
.remedbar{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.06em;color:var(--warm-deep);font-weight:700;text-transform:uppercase;background:var(--warm-soft);padding:5px 12px;border-radius:20px;margin-bottom:12px}
.qcount{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-bottom:10px}
.done .big{font-family:"Playfair Display",serif;font-size:2.3rem;color:var(--accent-deep);text-align:center}
.mrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 15px;background:#FCFAF4;margin-bottom:8px}
.st{font-family:Inter,sans-serif;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px}
.st.good{background:var(--teal);color:#fff}.st.warn{background:var(--gold);color:#fff}
.note{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin:30px 34px 0;padding-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.dt{border-collapse:collapse;margin:0 0 14px;font-family:Inter,sans-serif;font-size:14.5px}
.dt th,.dt td{border:1px solid var(--line);padding:7px 14px;text-align:left}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.dt td:first-child,.dt th:first-child{font-weight:600}
.les.locked .lh{opacity:1}
.les .lh{cursor:pointer}
.les.active .lh{cursor:default}

<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Unite 1 . dort ders . 160 remediation sorusu . ilerleme demoda bellekte, canli surumde hesaba bagli Supabase kaydi</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit": 1, "unit_title": "SAT Reading & Writing Kampi", "unit_accent": "warm", "lessons": [{"no": 1, "name": "Command of Evidence: Textual", "teaching": {"ne_olculuyor": ["Metin bir hipotez, iddia ya da tahmin sunar. Soru sana dört bulgu verir ve sorar: hangisi bu iddiayı en çok destekler? Bazen tersini sorar: hangisi zayıflatır?", "Bu soru gerçek bir mantık sorusudur. Okuma sorusu gibi görünür ama değildir.", "Kritik nokta: şıkkın DOĞRU olması yetmez. Şıkkın İDDİAYI destekliyor olması gerekir. Bu ikisi aynı şey değil ve soru tam olarak burada tuzak kurar."], "karar_proseduru": ["İddiayı bul ve TEK CÜMLEYE indir.  Genelde metnin son cümlesindedir ya da hypothesize, propose, argue, suggest fiilinden sonra gelir. Kendi kelimelerinle yaz.", "İddianın KAÇ unsuru var, say.  Çoğu iddia iki unsurludur. Örnek: X arttığında Y azalır. İki unsur var: X'in artması ve Y'nin azalması.", "Her şıkkı iddiaya karşı test et.  Şık iddianın BÜTÜN unsurlarını içeriyor mu. Tek unsuru içeren şık tuzaktır.", "Yön kontrolü yap.  Destekleme sorusunda şık iddiayla aynı yönde olmalı. Zayıflatma sorusunda ters yönde."], "celdirici_aileleri": [{"ad": "Konuyla ilgili, iddiayla ilgisiz", "tanim": "Şık aynı konudan bahseder, aynı terimleri kullanır, ama iddiayı ne destekler ne çürütür. En yaygın çeldirici. Tanıdık kelimeler gören öğrenci işaretler."}, {"ad": "Ters yön", "tanim": "Şık aslında iddianın tersini destekler. Destekleme sorusunda bu ölümcül. Aceleyle okuyan öğrenci ilgiyi görür, yönü görmez."}, {"ad": "Tek unsur", "tanim": "İddianın iki unsuru varsa şık sadece birini karşılar. Yarım destek destek değildir. Bu tuzak en incesidir ve Advanced seviyede çok çıkar."}, {"ad": "Çok genel", "tanim": "İddia spesifiktir, şık geneldir. Genel bir ifade spesifik bir iddiayı kanıtlamaz. Örnek: iddia bu turun bu bölgede azaldığını söylüyor, şık bütün kuşların azaldığını söylüyor."}], "top_tips": ["İddiayı bir eşitlik gibi yaz. Örnek: gece ışığı artar ise böcek sayısı azalır. Şimdi her şıkkın bu eşitliğin iki tarafına da dokunup dokunmadığını kontrol et. Sadece bir tarafa dokunan şık yanlıştır.", "Zayıflatma sorusunda doğru cevap genelde iddianın ÖNERDİĞİ sebep yerine BAŞKA bir sebep sunar. Alternatif açıklama arayan şık doğru cevaptır.", "if true ifadesi önemlidir. Şıkkın gerçekten doğru olup olmadığını tartışma. Doğru VARSAY, sonra iddiaya ne yaptığını sor.", "Alıntı sorularında iddianın OLUMSUZ yarısını tekrar eden şık tuzaktır. Bir iddiayı kendisiyle destekleyemezsin."]}, "families": ["Konuyla ilgili iddiayla ilgisiz", "Ters yon", "Tek unsur", "Cok genel"], "fam_short": {"Konuyla ilgili iddiayla ilgisiz": "Ilgisiz", "Ters yon": "Ters yon", "Tek unsur": "Tek unsur", "Cok genel": "Cok genel"}, "main_ids": ["u1-l1-f1-01", "u1-l1-f2-01", "u1-l1-f3-01", "u1-l1-f4-01"], "questions": [{"id": "u1-l1-f1-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Marine biologist Renata Cho proposed that the deep-sea anglerfish's glowing lure functions chiefly to attract prey rather than to signal potential mates, reasoning that in the near-total darkness where the fish hunts, visual signals between individuals would seldom be seen.", "stem": "Which finding, if true, would most directly support Cho's proposal?", "choices": {"A": "Small shrimp that anglerfish feed on swim rapidly toward faint points of light in the surrounding darkness.", "B": "Anglerfish flash their lures in a distinctive rhythm whenever another anglerfish drifts into view close by.", "C": "The anglerfish's lure emits light at a wavelength that travels farther through deep seawater than most other colors.", "D": "Bioluminescence occurs in a wide range of unrelated deep-sea animals living at similar ocean depths."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Cho claims the lure serves to attract prey. Prey swimming toward the light directly supports that the lure functions to catch food.", "why_wrong": {"B": "This points toward mate signaling, the opposite of Cho's claim. In a support question, the wrong direction fails.", "C": "True about the light itself, but it says nothing about whether the lure attracts prey or mates. Same topic, no bearing on the claim.", "D": "A general fact about many species does not support a specific claim about the anglerfish's lure."}}, {"id": "u1-l1-f1-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Historian Alma Reyes argues that the spread of printed pamphlets in the 1520s was driven less by rising literacy than by the low cost of the pamphlet form, which let ideas circulate cheaply among readers who already existed but had lacked affordable material.", "stem": "Which finding, if true, would most strongly support Reyes's argument?", "choices": {"A": "Printers working in the 1520s frequently complained that pamphlet paper was expensive and difficult to obtain.", "B": "Literacy rates in these regions had already plateaued a full generation before the pamphlets appeared.", "C": "Printed material of many different kinds became steadily more common across Europe during the sixteenth century.", "D": "Many of the pamphlets printed in the 1520s addressed religious controversies that ordinary readers found urgent."}, "correct": "B", "choice_families": {"A": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Reyes claims readers already existed and cost, not new literacy, drove the spread. Evidence that literacy had already plateaued before pamphlets supports exactly that.", "why_wrong": {"A": "Expensive paper would weaken the low-cost explanation, the reverse of what the argument needs.", "C": "A broad statement about printed material does not support the specific claim about pamphlet cost.", "D": "The subject matter of pamphlets is on topic but does not address why the form spread. Related, not relevant."}}, {"id": "u1-l1-f1-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "A team studying urban songbirds concluded that the birds sing at higher pitches in cities chiefly to be heard over low-frequency traffic noise, since higher pitches cut through such noise more easily.", "stem": "Which finding, if true, would most directly weaken the team's conclusion?", "choices": {"A": "Traffic noise in cities is heavily concentrated at the low frequencies that higher-pitched song can cut through.", "B": "City songbirds also tend to sing more loudly, at greater volume, than their counterparts living in rural areas.", "C": "City songbirds raised in quiet aviaries, with no exposure to traffic noise, still sing at the same higher pitch.", "D": "Many different bird species are known to adjust the songs they sing in response to their local surroundings."}, "correct": "C", "choice_families": {"A": "Ters yon", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "If birds with no exposure to traffic noise still sing higher, noise cannot be the cause the team proposed. This weakens the conclusion.", "why_wrong": {"A": "This fits the team's reasoning that high pitch cuts through low-frequency noise, so it supports rather than weakens.", "B": "Loudness is a different feature from pitch and does not address whether pitch responds to noise.", "D": "A general claim about many species does not bear on this specific causal explanation."}}, {"id": "u1-l1-f1-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "In her study of the poet Nadia Volkov, critic Sun-Hee Park contends that Volkov saw memory as unreliable and actively distorting rather than as a faithful record of the past.", "stem": "Which quotation from Volkov's notebooks, if authentic, would most directly support Park's contention?", "choices": {"A": "\"My memories all return to me exact and wholly unchanged, like the pages of a book that I may read again.\"", "B": "\"The human mind is somehow capable of holding a truly great many things across the long course of one life.\"", "C": "\"The past presses in on me at every hour of the day and night, insistent, unrelenting, and always near.\"", "D": "\"What I recall rearranges itself a little each time, until the true shape of the thing is finally lost.\""}, "correct": "D", "choice_families": {"A": "Ters yon", "B": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Park says Volkov viewed memory as distorting. A line describing memory as rearranging until the truth is lost states exactly that.", "why_wrong": {"A": "Memory as exact and re-readable is the faithful-record view Park denies. Wrong direction.", "B": "A vague statement about the mind's capacity says nothing about reliability.", "C": "This speaks to how memory feels in the present, not to whether it is accurate. On topic, off the claim."}}, {"id": "u1-l1-f1-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Economist Petra Haas proposed that the decline in a town's high-street shops after 2010 was caused mainly by the rise of online shopping, not by the town's shrinking population, which had begun falling only after the shops closed.", "stem": "Which finding, if true, would most strongly support Haas's proposal?", "choices": {"A": "Local residents' online retail spending rose sharply in the years just before the shops began to close.", "B": "The town's population had already begun to fall several years before the very first of the shops closed down.", "C": "Retail and shopping patterns shifted in a great many towns of comparable size during the course of the 2010s.", "D": "The town's high street had for generations been known across the county for its many independent bookshops."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "Haas attributes the decline to online shopping. A rise in local online spending just before closures directly supports that cause.", "why_wrong": {"B": "Earlier population decline would support the explanation Haas rejects, so it works against her.", "C": "A general observation about many towns does not support this specific causal claim.", "D": "The street's reputation is related background but does not explain why shops declined."}}, {"id": "u1-l1-f1-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Botanist Idris Kane hypothesized that a desert shrub's deep taproot, rather than its waxy leaves, is the main reason it survives long droughts, since the taproot reaches water far below the surface.", "stem": "Which finding, if true, would most directly support Kane's hypothesis?", "choices": {"A": "Shrubs that had much shallower root systems survived the drought just as often as those with deep taproots.", "B": "Shrubs whose taproots were experimentally cut died during drought, while intact-taproot shrubs survived.", "C": "The shrub's thick, waxy leaves reflect a large share of the intense sunlight that falls on them each day.", "D": "Many different desert plants possess adaptations of some kind that help them endure prolonged dry periods."}, "correct": "B", "choice_families": {"A": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "Kane says the taproot is the main reason for survival. Severing the taproot causing death during drought directly supports its central role.", "why_wrong": {"A": "Equal survival without deep taproots would undercut the claim, the wrong direction.", "C": "A fact about the leaves does not support a claim that the taproot, not the leaves, is decisive.", "D": "A broad statement about desert plants does not support this specific claim."}}, {"id": "u1-l1-f1-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Art historian Lucia Moreau argues that a Renaissance workshop's paintings were mostly finished by apprentices, not the master, because the master's signature appears on works whose brushwork differs markedly from his documented style.", "stem": "Which finding, if true, would most directly weaken Moreau's argument?", "choices": {"A": "Renaissance painting workshops commonly divided the labor of a single work among a good many different hands.", "B": "Analysis shows the differing brushwork was actually added centuries later by a restorer, not the workshop.", "C": "The master personally signed each and every one of the paintings that eventually left his busy workshop.", "D": "Surviving workshop records list regular payments to apprentices for completing several large commissions."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "Moreau infers apprentice work from the odd brushwork. If that brushwork was a later restorer's addition, her evidence collapses, weakening the argument.", "why_wrong": {"A": "A general fact about workshops does not bear on this specific case.", "C": "Who signed the work is a separate matter from who painted it. Related, not relevant to the brushwork inference.", "D": "Payments to apprentices for commissions support her claim, so this strengthens rather than weakens."}}, {"id": "u1-l1-f1-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Ecologist Bo Feng proposed that a lake's summer algae blooms are driven mainly by fertilizer runoff from nearby farms rather than by warmer water, noting that blooms follow heavy rains that wash fertilizer into the lake.", "stem": "Which finding, if true, would most strongly support Feng's proposal?", "choices": {"A": "Algae blooms of one kind or another affect a great many lakes situated near stretches of farmland.", "B": "The surface temperature of the lake rises by several degrees over the course of each and every summer.", "C": "The lake's very worst algae blooms have all occurred during its hottest and most sweltering summers.", "D": "In a normal-temperature summer with unusually heavy fertilizer runoff, the lake had its largest bloom ever."}, "correct": "D", "choice_families": {"A": "Cok genel", "B": "Konuyla ilgili iddiayla ilgisiz", "C": "Ters yon"}, "why_correct": "Feng credits runoff over temperature. A large bloom in a normal-temperature but high-runoff summer isolates runoff as the driver, supporting the claim.", "why_wrong": {"A": "A general statement about many lakes does not support this specific claim.", "B": "That the water warms is true but does not show runoff rather than heat causes blooms.", "C": "Blooms in the hottest summers point to temperature, the explanation Feng rejects."}}, {"id": "u1-l1-f1-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Sociologist Nadia Toma argues that a neighborhood's falling crime rate after 2015 resulted chiefly from new streetlighting, not from the modest rise in police patrols, since crime fell most sharply on the specific streets that were newly lit.", "stem": "Which finding, if true, would most directly support Toma's argument?", "choices": {"A": "Improved street lighting has been linked to somewhat lower crime rates in a variety of different cities.", "B": "Residents of the neighborhood reported that they now felt noticeably safer when walking around at night.", "C": "Crime fell just as sharply on the streets that received extra police patrols but no new streetlighting at all.", "D": "On newly lit streets, nighttime crime fell far more than on similar unlit streets with the same patrols."}, "correct": "D", "choice_families": {"A": "Cok genel", "B": "Konuyla ilgili iddiayla ilgisiz", "C": "Ters yon"}, "why_correct": "Toma credits lighting over patrols. A sharper drop on lit streets than on unlit streets with equal patrols isolates lighting as the cause.", "why_wrong": {"A": "A general link across cities does not support this specific claim.", "B": "Feeling safer is related but does not show what caused the actual decline.", "C": "Equal declines from patrols alone would support the patrol explanation Toma rejects."}}, {"id": "u1-l1-f1-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Konuyla ilgili iddiayla ilgisiz", "passage": "Researchers concluded that a species of moth navigates at night primarily by the light of the moon, since the moths fly in straight paths on clear nights and in erratic paths when clouds hide the moon.", "stem": "Which finding, if true, would most directly weaken the researchers' conclusion?", "choices": {"A": "Many nocturnal insects of different kinds are known to rely on light cues in order to orient themselves.", "B": "The moon is by a wide margin the single brightest object visible anywhere in the darkened night sky.", "C": "On moonless but clear nights, the moths still fly straight, orienting instead to the pattern of the stars.", "D": "The moths also rely on their sense of smell to locate suitable flowers once they have landed on a plant."}, "correct": "C", "choice_families": {"A": "Cok genel", "B": "Ters yon", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "If moths navigate straight on moonless nights using stars, the moon cannot be their primary cue, which weakens the conclusion.", "why_wrong": {"A": "A general fact about nocturnal insects does not bear on this specific conclusion.", "B": "The moon's brightness supports the idea that it could guide the moths, so it does not weaken.", "D": "Using scent to find flowers is a different task from night navigation. Related, not relevant."}}, {"id": "u1-l1-f2-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A researcher proposed that a coral species tolerates warmer water than related corals specifically because of the heat-tolerant algae it hosts, not because of any difference in the coral animal itself.", "stem": "Which finding, if true, would most strongly support the researcher's proposal?", "choices": {"A": "Symbiotic algae of one type or another are found living inside a great many coral species worldwide.", "B": "The coral animal itself turns out to possess a unique protein that shields each of its cells from heat.", "C": "The coral happens to live in the very same reef zones occupied by several of its close relative species.", "D": "Related corals given the heat-tolerant algae then survived temperatures that would normally kill them."}, "correct": "D", "choice_families": {"A": "Cok genel", "B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim is that the algae, not the coral, confers heat tolerance. Giving the algae to other corals and seeing them gain tolerance directly supports that.", "why_wrong": {"A": "A general fact about algae in corals does not support this specific claim.", "B": "This credits the coral animal, the exact alternative the claim rules out. It points the opposite way.", "C": "Shared habitat is on topic but does not address the source of heat tolerance."}}, {"id": "u1-l1-f2-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A literary scholar argues that a novelist revised her early drafts to make her heroine more assertive, not more sympathetic, as the novelist believed assertiveness, not likability, was the book's true subject.", "stem": "Which finding, if true, would most directly support the scholar's argument?", "choices": {"A": "Across her successive drafts, the heroine was given gentler and far more forgiving reactions to other characters.", "B": "The novelist was in the habit of keeping detailed private notes on each of the characters in the book.", "C": "A great many novelists are known to revise the drafts of their books quite extensively before publishing.", "D": "Across her successive drafts, the heroine's dialogue grew steadily more direct, forceful, and openly commanding."}, "correct": "D", "choice_families": {"A": "Ters yon", "B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel"}, "why_correct": "The scholar says revisions made the heroine more assertive. Dialogue becoming more direct and commanding across drafts supports exactly that.", "why_wrong": {"A": "Gentler, more forgiving reactions make the heroine more sympathetic, the direction the argument rejects.", "B": "Keeping character notes is related to the writing process but not to the direction of revision.", "C": "A general fact about novelists does not support this specific claim."}}, {"id": "u1-l1-f2-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A team concluded that a lizard's bright throat color evolved mainly to attract mates, since males with brighter throats fathered more offspring in their observations.", "stem": "Which finding, if true, would most directly weaken the team's conclusion?", "choices": {"A": "The bright throat color in these particular lizards is produced by specialized pigments held within the skin.", "B": "Brighter-throated males consistently fathered more offspring than duller males did over the course of several seasons.", "C": "A great many lizard species make use of bright color signals in one behavioral context or another.", "D": "Females show no preference for brighter-throated males and mate at random with respect to throat color."}, "correct": "D", "choice_families": {"A": "Konuyla ilgili iddiayla ilgisiz", "B": "Ters yon", "C": "Cok genel"}, "why_correct": "The conclusion is that bright throats attract mates. If females show no preference for throat color, the mate-attraction explanation loses its basis, weakening it.", "why_wrong": {"A": "How the color is produced does not address why it evolved.", "B": "More offspring for brighter males supports the conclusion, so it points the wrong way for a weaken question.", "C": "A general claim about lizard color signals does not weaken this specific conclusion."}}, {"id": "u1-l1-f2-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "An analyst argued that a company's sales rose in 2022 because of its new advertising campaign, not because of falling prices, since prices actually held steady that year.", "stem": "Which finding, if true, would most strongly support the analyst's argument?", "choices": {"A": "Advertising campaigns are broadly capable of influencing the purchasing behavior of ordinary consumers.", "B": "Sales rose fastest in the regions where the campaign ran and stayed flat in regions where it did not.", "C": "The company sells a fairly wide range of ordinary household goods across most of its retail locations.", "D": "The company quietly cut prices on several of its best-selling products at some point during the year 2022."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "The analyst credits advertising over price. Sales rising only where the campaign ran ties the increase to advertising, supporting the claim.", "why_wrong": {"A": "A general statement about advertising does not support this specific claim.", "C": "The company's product range is on topic but does not show what drove the sales increase.", "D": "A price cut would support the price explanation the analyst rejects, the opposite direction."}}, {"id": "u1-l1-f2-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A historian contends that a medieval city's walls were built chiefly for defense, not for controlling trade, pointing to their construction during a period of frequent sieges.", "stem": "Which finding, if true, would most directly support the historian's contention?", "choices": {"A": "A great many cities built during the medieval period were surrounded by defensive walls of some kind.", "B": "The walls were constructed almost entirely out of stone that had been quarried from the surrounding area.", "C": "The walls were built thickest and tallest along the side facing where attacking armies usually came from.", "D": "The walls' only gates were carefully positioned along the busiest of the city's established trade routes."}, "correct": "C", "choice_families": {"A": "Cok genel", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "The contention is that the walls served defense. Reinforcement on the side facing likely attacks reflects defensive design, supporting the claim.", "why_wrong": {"A": "A general fact about walled cities does not support this specific claim.", "B": "The building material is related but says nothing about the walls' purpose.", "D": "Gates placed along trade routes suggest trade control, the purpose the historian rejects."}}, {"id": "u1-l1-f2-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A biologist proposed that a bird's long tail feathers are maintained by sexual selection despite hindering flight, because females prefer males with longer tails.", "stem": "Which finding, if true, would most strongly support the biologist's proposal?", "choices": {"A": "Males whose tails researchers lengthened attracted more mates despite then flying much less efficiently.", "B": "Males whose tails had been experimentally shortened flew more efficiently and still attracted just as many mates.", "C": "A great many different bird species have evolved elaborate and conspicuous feathers of one kind or another.", "D": "The long tail feathers of this species are shed and then fully regrown once over the course of each year."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The proposal is that females prefer longer tails even though they hinder flight. Lengthened tails attracting more mates despite worse flight supports exactly that trade-off.", "why_wrong": {"B": "If shortened tails attract just as many mates, female preference for length is not driving the trait, opposite of what is needed.", "C": "A general fact about bird feathers does not support this specific claim.", "D": "Annual regrowth is on topic but does not address mate preference."}}, {"id": "u1-l1-f2-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A study concluded that a school's new tutoring program caused students' test scores to rise, since scores went up the year the program began.", "stem": "Which finding, if true, would most directly weaken the study's conclusion?", "choices": {"A": "Tutoring of various kinds is used to support students in schools all around the world these days.", "B": "The tutoring sessions offered by the program were all scheduled to take place after regular school hours.", "C": "Scores rose by nearly the same amount at several nearby schools that ran no tutoring program that year.", "D": "The students who chose to attend the greatest number of tutoring sessions were the ones who improved the most."}, "correct": "C", "choice_families": {"A": "Cok genel", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "If scores rose equally at schools without the program, the increase cannot be credited to the program, weakening the conclusion.", "why_wrong": {"A": "A general fact about tutoring does not weaken this specific conclusion.", "B": "When sessions were held does not bear on whether the program caused the gains.", "D": "More improvement among heavy tutoring users supports the program's effect, the opposite of weakening."}}, {"id": "u1-l1-f2-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A critic argues that a composer's late symphonies grew simpler, not more complex, as he aimed for directness in his final years.", "stem": "Which finding, if true, would most directly support the critic's argument?", "choices": {"A": "The late symphonies consistently use fewer instruments and shorter themes than his earlier works do.", "B": "The late symphonies layer together many more independent melodic lines than any of his earlier works did.", "C": "The musical style of most composers tends to change in one direction or another over a long career.", "D": "The composer happened to write most of his late symphonies while living in a small coastal town."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The argument is that the late works grew simpler. Fewer instruments and shorter themes are marks of simplicity, supporting the claim.", "why_wrong": {"B": "More independent melodic lines indicate greater complexity, the direction the critic rejects.", "C": "A general statement about changing styles does not support this specific claim.", "D": "Where the works were written is unrelated to their complexity."}}, {"id": "u1-l1-f2-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A researcher proposed that a cave fish lost its eyes over evolutionary time because eyes were costly to develop and useless in darkness, not because eyes were harmful.", "stem": "Which finding, if true, would most strongly support the researcher's proposal?", "choices": {"A": "Cave fish that retain intact eyes suffer from frequent eye infections that the eyeless fish manage to avoid.", "B": "A great many animals that live in caves have eyes that are reduced in size or function in some way.", "C": "The cave fish feed for the most part on the small invertebrates that drift through the surrounding water.", "D": "Eyeless cave fish spend measurably less energy on development than close relatives that keep their eyes."}, "correct": "D", "choice_families": {"A": "Ters yon", "B": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The proposal is that eyes were lost because they were costly and useless, not harmful. Evidence that eyeless fish save developmental energy supports the cost explanation.", "why_wrong": {"A": "Infections in eyed fish would support the harmful-eyes explanation the proposal rejects.", "B": "A general fact about cave animals does not support this specific claim.", "C": "The fish's diet is on topic for cave fish but not for why eyes were lost."}}, {"id": "u1-l1-f2-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Ters yon", "passage": "A planner argued that a city's traffic fell after 2019 because of expanded bus service, not because of higher fuel prices, since fuel prices barely changed in that period.", "stem": "Which finding, if true, would most directly support the planner's argument?", "choices": {"A": "The city's buses are all run according to a fixed daily schedule that rarely changes from week to week.", "B": "Car trips dropped most sharply along the very routes where the new bus lines had recently opened for use.", "C": "Public transit of one form or another shapes the everyday travel choices of residents in many cities.", "D": "Fuel prices across the city rose quite steeply and steadily throughout both of the years 2019 and 2020."}, "correct": "B", "choice_families": {"A": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel", "D": "Ters yon"}, "why_correct": "The planner credits bus expansion over fuel prices. Car trips falling most where new bus lines opened ties the decline to bus service, supporting the claim.", "why_wrong": {"A": "The bus schedule is on topic but does not show what caused traffic to fall.", "C": "A general fact about transit does not support this specific claim.", "D": "Steeply rising fuel prices would support the fuel explanation the planner rejects."}}, {"id": "u1-l1-f3-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A researcher proposed that a fungus protects ant colonies from a deadly mold by both killing the mold's spores and preventing them from spreading through the nest.", "stem": "Which finding, if true, would most strongly support the researcher's proposal?", "choices": {"A": "In nests with the fungus, mold spores are destroyed on contact and never reach any neighboring chambers.", "B": "In nests that contain the fungus, mold spores are reliably destroyed on contact with the fungus itself.", "C": "Fungi of one kind or another interact closely with insects across a great many natural ecosystems.", "D": "In nests that contain the fungus, the resident ants tend to groom one another noticeably more often."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim has two parts, killing spores and preventing spread. Only the choice showing both destruction and no spread to other chambers supports the full claim.", "why_wrong": {"B": "This shows only that spores are killed, not that spread is prevented. Half of a two-part claim is not enough.", "C": "A general fact about fungi and insects does not support this specific claim.", "D": "More grooming is on topic for ants but does not address the fungus's effect on mold."}}, {"id": "u1-l1-f3-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A historian argues that a reformer succeeded because she both won the support of local officials and secured funding from distant patrons.", "stem": "Which finding, if true, would most directly support the historian's argument?", "choices": {"A": "Reforms that ultimately succeed tend to require fairly broad support drawn from a number of quarters.", "B": "Records show the reformer both gained the officials' backing and received large sums from patrons abroad.", "C": "Surviving records show that the reformer received several large sums of money from wealthy patrons living abroad.", "D": "The reformer is known to have traveled widely from town to town over the course of her long campaign."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Tek unsur", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The argument names two causes of success, official support and distant funding. Only the choice documenting both supports the full claim.", "why_wrong": {"A": "A general statement about reforms does not support this specific claim.", "C": "Funding alone addresses one of the two elements, leaving official support unaddressed.", "D": "Traveling widely is related background but not evidence for either named cause."}}, {"id": "u1-l1-f3-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A team proposed that a new coating both reduces friction on machine parts and resists corrosion in salt water.", "stem": "Which finding, if true, would most strongly support the team's proposal?", "choices": {"A": "The coated parts showed clearly lower friction than the uncoated parts did across every one of the trials.", "B": "The protective coating is applied to each of the machine parts as a very thin, evenly distributed spray.", "C": "The coated parts showed clearly lower friction and no corrosion at all after months soaking in salt water.", "D": "Protective coatings of many different kinds are widely used across a broad range of industrial settings."}, "correct": "C", "choice_families": {"A": "Tek unsur", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "The proposal makes two claims, less friction and corrosion resistance. Only the choice showing both supports it fully.", "why_wrong": {"A": "Lower friction addresses one claim but says nothing about corrosion resistance.", "B": "How the coating is applied does not test either claim.", "D": "A general fact about coatings does not support this specific proposal."}}, {"id": "u1-l1-f3-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "An economist argued that a policy both raised employment and lowered prices in the region where it was applied.", "stem": "Which finding, if true, would most directly support the economist's argument?", "choices": {"A": "In that region, employment rose and average prices fell in the period after the policy took effect.", "B": "In that region, overall employment rose steadily for several quarters in the period after the policy took effect.", "C": "The policy in question happened to be introduced and put into force during the early weeks of the spring.", "D": "Economic policies of various kinds are capable of affecting regional markets in one way or another."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "The argument makes two claims, higher employment and lower prices. Only the choice showing both supports it fully.", "why_wrong": {"B": "Rising employment addresses one claim while ignoring the claim about prices.", "C": "The timing of introduction does not test either outcome.", "D": "A general statement about policy effects does not support this specific claim."}}, {"id": "u1-l1-f3-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A critic contends that a filmmaker's style is defined by both long, unbroken takes and near-total silence on the soundtrack.", "stem": "Which finding, if true, would most strongly support the critic's contention?", "choices": {"A": "The filmmaker generally prefers to shoot his films on location rather than inside a controlled studio.", "B": "The filmmaker's movies consistently average very few cuts per scene across almost all of his major films.", "C": "A great many film directors go on to develop a recognizable personal style over the course of a career.", "D": "The filmmaker's movies average very few cuts per scene and use almost no music or spoken dialogue."}, "correct": "D", "choice_families": {"A": "Konuyla ilgili iddiayla ilgisiz", "B": "Tek unsur", "C": "Cok genel"}, "why_correct": "The contention names two features, long takes and silence. Only the choice showing both supports it fully.", "why_wrong": {"A": "Shooting on location is unrelated to either named feature.", "B": "Few cuts addresses the long-take feature but not the claim about silence.", "C": "A general statement about directors' styles does not support this specific claim."}}, {"id": "u1-l1-f3-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A researcher proposed that a wetland both filters pollutants from water and buffers nearby land against flooding.", "stem": "Which finding, if true, would most directly support the researcher's proposal?", "choices": {"A": "Wetlands of one type or another provide a variety of valuable benefits to the ecosystems around them.", "B": "Water leaving the wetland is cleaner than water entering, and nearby land floods less than land without one.", "C": "The wetland provides a permanent home to several distinct species of wading and migratory birds.", "D": "Water leaving the wetland is measurably cleaner than the water that had entered it further upstream."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Tek unsur"}, "why_correct": "The proposal makes two claims, filtering and flood buffering. Only the choice showing both supports it fully.", "why_wrong": {"A": "A general statement about wetlands does not support this specific proposal.", "C": "The wetland's bird life is on topic but does not test either claim.", "D": "Cleaner outflow supports filtering but says nothing about flood protection."}}, {"id": "u1-l1-f3-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A scholar argues that a language spread widely because it was both easy to learn and useful for trade across regions.", "stem": "Which finding, if true, would most strongly support the scholar's argument?", "choices": {"A": "The language came to be written down using a distinctive script unlike those of its neighboring tongues.", "B": "The language had simple grammar and was adopted mainly by traders along the busiest cross-regional routes.", "C": "The language had a notably simple grammar that learners from many backgrounds could pick up with ease.", "D": "Languages have spread from region to region for a great many different reasons all throughout history."}, "correct": "B", "choice_families": {"A": "Konuyla ilgili iddiayla ilgisiz", "C": "Tek unsur", "D": "Cok genel"}, "why_correct": "The argument names two causes, ease of learning and usefulness for trade. Only the choice showing both supports it fully.", "why_wrong": {"A": "The script is on topic but does not test either named cause.", "C": "Simple grammar addresses ease of learning but not usefulness for trade.", "D": "A general statement about language spread does not support this specific claim."}}, {"id": "u1-l1-f3-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A team proposed that a drug both slows the tumor's growth and reduces the pain it causes.", "stem": "Which finding, if true, would most directly support the team's proposal?", "choices": {"A": "Modern cancer treatments are generally designed with the aim of improving a range of patient outcomes.", "B": "Patients given the drug had slower tumor growth and reported less pain than those given a placebo.", "C": "The drug is designed to be taken just once each day in the convenient form of a small oral tablet.", "D": "Patients who were given the drug reported noticeably less pain over time than those who received a placebo."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Tek unsur"}, "why_correct": "The proposal makes two claims, slower growth and less pain. Only the choice showing both supports it fully.", "why_wrong": {"A": "A general statement about cancer treatment does not support this specific proposal.", "C": "How the drug is taken does not test either effect.", "D": "Less pain supports one claim while leaving tumor growth unaddressed."}}, {"id": "u1-l1-f3-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A historian claims that a general's victory depended on both surprising the enemy at dawn and cutting off their line of retreat.", "stem": "Which finding, if true, would most strongly support the historian's claim?", "choices": {"A": "Contemporary accounts describe a dawn attack that caught the unsuspecting enemy entirely unprepared for battle.", "B": "The element of surprise has gone on to decide the outcome of a great many battles throughout history.", "C": "Accounts describe a dawn attack that caught the enemy unprepared while a second force blocked their escape.", "D": "The general in question had already commanded large bodies of troops in a number of earlier campaigns."}, "correct": "C", "choice_families": {"A": "Tek unsur", "B": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim names two factors, surprise and cutting off retreat. Only the choice showing both supports it fully.", "why_wrong": {"A": "The dawn surprise addresses one factor but not the blocked retreat.", "B": "A general statement about surprise in battle does not support this specific claim.", "D": "The general's experience is background, not evidence for either named factor."}}, {"id": "u1-l1-f3-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Tek unsur", "passage": "A biologist proposed that a plant repels insects both by producing a bitter chemical and by growing tiny hairs that trap them.", "stem": "Which finding, if true, would most directly support the biologist's proposal?", "choices": {"A": "Insects tend to avoid the plant's bitter leaves and often become stuck fast in its dense surface hairs.", "B": "Insects tend to avoid eating the plant's distinctly bitter leaves whenever other food sources are available.", "C": "Plants have evolved a great many different kinds of defenses to protect themselves against hungry insects.", "D": "The plant reliably produces its flowers during the earliest weeks of the summer growing season each year."}, "correct": "A", "choice_families": {"B": "Tek unsur", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The proposal names two defenses, a bitter chemical and trapping hairs. Only the choice showing both supports it fully.", "why_wrong": {"B": "Avoiding bitter leaves supports the chemical defense but not the trapping hairs.", "C": "A general statement about plant defenses does not support this specific proposal.", "D": "When the plant flowers is unrelated to either defense."}}, {"id": "u1-l1-f4-01", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A researcher proposed that this particular songbird species learns its song from its father specifically, not from other adult males in the area.", "stem": "Which finding, if true, would most strongly support the researcher's proposal?", "choices": {"A": "Young males raised apart from their fathers but among other adult males failed to learn the species' song.", "B": "Young males of the species turn out to learn the song equally well from any adult male living in the area.", "C": "The full song of this particular species is made up of roughly a dozen clearly distinct individual notes.", "D": "A great many songbird species are known to learn the songs they sing by carefully listening to nearby adults."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "The claim is that the song is learned from the father specifically. Birds raised among other males but without fathers failing to learn isolates the father as the source.", "why_wrong": {"B": "Learning equally from any male contradicts the father-specific claim.", "C": "The song's note count is on topic but does not address who the bird learns from.", "D": "A general fact about many species does not show that this species learns specifically from the father."}}, {"id": "u1-l1-f4-02", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "An economist argued that this town's specific factory closure in 2018 caused its local unemployment to spike, rather than a broader regional downturn.", "stem": "Which finding, if true, would most directly support the economist's argument?", "choices": {"A": "The wider regional economy weakened slowly but steadily throughout the whole of the year 2018.", "B": "Factory closures of this sort quite often raise the level of unemployment in the communities they affect.", "C": "Unemployment rose sharply in this one town in 2018 while staying essentially flat in the neighboring towns.", "D": "The factory in question had already been operating within the town for the better part of several decades."}, "correct": "C", "choice_families": {"A": "Ters yon", "B": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim credits this town's factory closure over a regional downturn. A spike here while neighbors stayed flat isolates the local cause.", "why_wrong": {"A": "A region-wide slowdown supports the alternative the economist rejects.", "B": "A general statement about factory closures does not establish the cause in this specific town.", "D": "The factory's long history is background, not evidence about the 2018 spike."}}, {"id": "u1-l1-f4-03", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A critic contends that this novelist's third book, in particular, marked her turn toward political themes.", "stem": "Which finding, if true, would most strongly support the critic's contention?", "choices": {"A": "This third book was her first to center on elections and government, subjects absent from her earlier work.", "B": "A great many writers end up addressing political themes of one kind or another at some point in a career.", "C": "This third book happened to be brought out by one of the largest and most prominent publishing houses.", "D": "The novelist's later books turned away from politics and returned to personal, domestic subject matter."}, "correct": "A", "choice_families": {"B": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "The claim is that the third book specifically marked her turn to political themes. Its being the first to center on politics, unlike earlier work, supports that.", "why_wrong": {"B": "A general fact about writers does not show this specific book marked a turn.", "C": "The publisher is unrelated to the book's themes.", "D": "A later return to personal subjects points against a lasting political turn, the wrong direction."}}, {"id": "u1-l1-f4-04", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A team concluded that this specific chemical in the river, released by one factory, was killing the local fish.", "stem": "Which finding, if true, would most directly weaken the team's conclusion?", "choices": {"A": "The chemical proves to be highly toxic to a range of fish species when it is tested in the laboratory.", "B": "Rivers all around the world are known to face a great many different pollution threats these days.", "C": "Fish died in roughly equal numbers upstream of the factory, where the chemical was entirely absent.", "D": "The chemical in question is somewhat heavier than water and tends to sink and settle onto the riverbed."}, "correct": "C", "choice_families": {"A": "Ters yon", "B": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The conclusion blames this factory's chemical. Equal fish deaths upstream, where the chemical is absent, shows something else is at work, weakening the claim.", "why_wrong": {"A": "Lab toxicity supports the conclusion, the opposite of weakening.", "B": "A general statement about river pollution does not weaken this specific conclusion.", "D": "The chemical's density does not address whether it killed the fish."}}, {"id": "u1-l1-f4-05", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A sociologist argued that this neighborhood's specific community center, opened in 2016, reduced youth crime there.", "stem": "Which finding, if true, would most strongly support the sociologist's argument?", "choices": {"A": "Youth crime in this particular neighborhood had already been falling steadily for some years before 2016.", "B": "The community center offers a rotating schedule of classes and workshops on most weekday evenings.", "C": "Youth crime fell in this neighborhood after 2016 but held steady in similar neighborhoods with no center.", "D": "Community programs of various kinds have been shown to reduce crime across a range of different settings."}, "correct": "C", "choice_families": {"A": "Ters yon", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "The claim credits this specific center. A drop here after 2016, absent in comparable neighborhoods without a center, ties the decline to the center.", "why_wrong": {"A": "A decline already underway before 2016 works against crediting the center.", "B": "The class schedule is on topic but does not show the center reduced crime.", "D": "A general statement about community programs does not establish this center's effect."}}, {"id": "u1-l1-f4-06", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A biologist proposed that this beetle species, specifically, uses the Earth's magnetic field to navigate, unlike its close relatives.", "stem": "Which finding, if true, would most directly support the biologist's proposal?", "choices": {"A": "Placed in an artificial magnetic field, this species changed course while its close relatives did not.", "B": "This species and each of its close relatives all changed course by the very same amount in the field.", "C": "A great many animals across the natural world are now known to be able to sense magnetic fields somehow.", "D": "This particular beetle species is active for the most part during the darker hours of the night."}, "correct": "A", "choice_families": {"B": "Ters yon", "C": "Cok genel", "D": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim is that this species specifically uses magnetism, unlike relatives. Only this species responding to an artificial field supports that contrast.", "why_wrong": {"B": "All species responding equally contradicts the claim that this one is distinctive.", "C": "A general fact about magnetic sensing does not show this specific species uses it.", "D": "The beetle's activity time does not address magnetic navigation."}}, {"id": "u1-l1-f4-07", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A historian claims that this particular treaty, signed in 1748, ended the conflict, rather than the exhaustion of both armies.", "stem": "Which finding, if true, would most strongly support the historian's claim?", "choices": {"A": "Formal treaties of one kind or another have brought a great many historical conflicts to their end.", "B": "Both of the armies involved were already severely depleted by the time the treaty came to be signed.", "C": "The treaty itself happened to be negotiated and finally signed within the walls of a neutral city.", "D": "Fighting stopped as soon as the treaty was signed, though both armies still had ample supplies and troops."}, "correct": "D", "choice_families": {"A": "Cok genel", "B": "Ters yon", "C": "Konuyla ilgili iddiayla ilgisiz"}, "why_correct": "The claim credits the treaty over exhaustion. Fighting ending at once while both armies remained well supplied points to the treaty, not exhaustion.", "why_wrong": {"A": "A general statement about treaties does not establish that this one ended the conflict.", "B": "Depleted armies support the exhaustion explanation the historian rejects.", "C": "Where the treaty was negotiated is unrelated to what ended the fighting."}}, {"id": "u1-l1-f4-08", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A researcher proposed that this lake's specific fish population declined because of a warming trend in the lake, not because of overfishing.", "stem": "Which finding, if true, would most directly support the researcher's proposal?", "choices": {"A": "Fish populations right across the world are generally quite sensitive to shifts in their environment.", "B": "The fish population declined as the lake warmed, even though fishing there had been banned for years.", "C": "The lake in question happens to sit at a fairly high elevation up in the surrounding mountain range.", "D": "Heavy commercial fishing was allowed to continue on the lake throughout the entire period of decline."}, "correct": "B", "choice_families": {"A": "Cok genel", "C": "Konuyla ilgili iddiayla ilgisiz", "D": "Ters yon"}, "why_correct": "The claim credits warming over overfishing. A decline during warming while fishing was banned isolates warming as the cause.", "why_wrong": {"A": "A general statement about fish populations does not support this specific claim.", "C": "The lake's elevation does not address the cause of decline.", "D": "Continued heavy fishing supports the overfishing explanation the researcher rejects."}}, {"id": "u1-l1-f4-09", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "An analyst argued that this store's specific move to a busier street, not a change in its products, drove its higher sales.", "stem": "Which finding, if true, would most strongly support the analyst's argument?", "choices": {"A": "The store introduced a popular and heavily promoted new product line at the very same time as the move.", "B": "The store deals for the most part in imported goods sourced from a range of countries overseas.", "C": "The choice of location quite often has a real effect on the overall sales figures that a store records.", "D": "Sales rose sharply right after the move to the busier street, while the store's products stayed the same."}, "correct": "D", "choice_families": {"A": "Ters yon", "B": "Konuyla ilgili iddiayla ilgisiz", "C": "Cok genel"}, "why_correct": "The claim credits the move over product changes. Sales rising after the move with products unchanged isolates location as the driver.", "why_wrong": {"A": "A new product line supports the product explanation the analyst rejects.", "B": "The kind of goods sold does not show what drove the increase.", "C": "A general statement about location does not establish the cause for this store."}}, {"id": "u1-l1-f4-10", "unit": 1, "lesson": 1, "lesson_name": "Command of Evidence: Textual", "target_family": "Cok genel", "passage": "A team proposed that this particular volcano's eruptions are triggered by rising groundwater, unlike most volcanoes, which are driven by magma pressure alone.", "stem": "Which finding, if true, would most directly support the team's proposal?", "choices": {"A": "This volcano's eruptions turn out to occur without any measurable change at all in the local groundwater.", "B": "This particular volcano last produced a significant eruption at some point several decades ago now.", "C": "This volcano's eruptions consistently follow long spells of heavy rain that raise the local groundwater.", "D": "Volcanoes located around the world are known to erupt for a fairly wide range of underlying reasons."}, "correct": "C", "choice_families": {"A": "Ters yon", "B": "Konuyla ilgili iddiayla ilgisiz", "D": "Cok genel"}, "why_correct": "The claim is that this volcano is triggered by groundwater, unlike others. Eruptions following rain that raises groundwater supports that specific mechanism.", "why_wrong": {"A": "Eruptions without groundwater change contradict the proposed mechanism.", "B": "When it last erupted does not address the trigger.", "D": "A general statement about volcanoes does not support this specific claim."}}]}, {"no": 2, "name": "Command of Evidence: Quantitative", "teaching": {"ne_olculuyor": ["Metin bir iddia kurar, yanında bir tablo ya da grafik verilir. Soru: hangi şık tablodaki veriyi kullanarak metni en iyi tamamlar?", "Bu soru Türk öğrencinin en çok kaybettiği yerdir ve sebebi ilginçtir. Matematik kolaydır, ıngilizce kolaydır, ama İKİ AŞAMALI test yapmayı kimse öğretmez.", "Her şık iki testten geçmek zorunda. Birinci test: sayılar tabloya UYUYOR mu. İkinci test: bu veri metnin İDDİASINI destekliyor mu. Bir şık birinci testi geçip ikinciden kalabilir. İşte tuzak orada."], "karar_proseduru": ["TABLOYA HENÜZ BAKMA. Önce metni oku.  Metnin iddiası ne. Bunu bilmeden tabloya bakarsan sayılar arasında kaybolursun. En sık yapılan hata budur.", "İddiayı tek cümleye indir ve yönünü işaretle.  Örnek: A grubu B grubundan daha yüksek. Ok yönünü bil.", "Tablonun başlığını ve birimlerini oku.  Yüzde mi, adet mi, kilogram mı. Satırlar ne, sütunlar ne. Otuz saniye harca, sonra bir dakika kazan.", "Her şıkkı TEK TEK tabloda doğrula.  Sayı tabloda var mı, doğru satırdan mı geliyor. Yanlış sayı içeren şıkkı hemen ele.", "Ayakta kalan şıklara ikinci testi uygula.  Bu veri metnin iddiasını DESTEKLİYOR mu. Sayı doğru olabilir ve yine de yanlış cevap olabilir."], "celdirici_aileleri": [{"ad": "Doğru sayı, yanlış iş", "tanim": "Sayı tabloda aynen var. Ama metnin iddiasını desteklemiyor, hatta bazen alakasız bir şeyi ölçüyor. En sık düşülen tuzak. Öğrenci sayıyı tabloda bulunca rahatlıyor ve işaretliyor."}, {"ad": "Satır sütun karışıklığı", "tanim": "Sayı tabloda var ama başka bir satırdan ya da başka bir sütundan alınmış. Aceleyle okuyunca yakalanmaz. Parmağını satıra koy."}, {"ad": "Yön tersine çevrilmiş", "tanim": "Karşılaştırma doğru unsurları içeriyor ama büyük küçük ters yazılmış. greater than yerine less than. Tek kelime, tam puan."}, {"ad": "Kıyassız tek değer", "tanim": "Şık tabloda gerçekten var olan tek bir sayı verir ama hiçbir şeyle karşılaştırmaz. İddia bir KARŞILAŞTIRMA istiyorsa tek değer onu kanıtlamaz."}], "top_tips": ["Şıkkın sayısını tabloda parmağını koyarak bul. Gözle taramak hata üretir. Bu bir sınav, hız değil doğruluk kazandırır.", "Metinde however, but, yet varsa iddia bir KARŞITLIK kuruyordur. O zaman doğru şık da iki değeri KARŞILAŞTIRIR. Tek değer veren şık yanlıştır.", "Metin bir grubun özelliğini söylüyorsa, doğru şık o grubun değerini vermekle kalmaz, en azından ikinci bir grupla KIYASLAR. Kıyas yoksa iddia kanıtlanmamıştır.", "Tabloda birden fazla sütun varsa iddianın HANGİ sütunu ilgilendirdiğini işaretle. Çeldiriciler genelde yanlış sütundan doğru sayı getirir."]}, "families": ["Dogru sayi yanlis is", "Satir sutun karisikligi", "Yon tersine cevrilmis", "Kiyassiz tek deger"], "fam_short": {"Dogru sayi yanlis is": "Yanlis is", "Satir sutun karisikligi": "Satir/sutun", "Yon tersine cevrilmis": "Ters yon", "Kiyassiz tek deger": "Kiyassiz"}, "main_ids": ["u1-l2-f1-01", "u1-l2-f2-01", "u1-l2-f3-01", "u1-l2-f4-01"], "questions": [{"id": "u1-l2-f1-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A researcher claims that a new fertilizer raised wheat yield more than it raised corn yield.", "table": {"head": ["Crop", "Yield increase (%)"], "rows": [["Wheat", "18"], ["Corn", "7"], ["Barley", "12"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Wheat yield rose by 18 percent after the fertilizer was applied to the field.", "B": "Corn yield rose by a greater amount than wheat yield after the fertilizer.", "C": "Barley yield rose by 12 percent after the fertilizer was applied to the field.", "D": "Wheat yield rose by 18 percent, compared with a 7 percent rise for corn."}, "correct": "D", "choice_families": {"A": "Kiyassiz tek deger", "B": "Yon tersine cevrilmis", "C": "Dogru sayi yanlis is"}, "why_correct": "The claim compares wheat with corn. Only the choice giving both figures, 18 against 7, in the right direction supports it.", "why_wrong": {"A": "Eighteen percent is wheat's real rise, but with no corn figure it does not show wheat rose more.", "B": "This reverses the comparison; the data show wheat rose more, not corn.", "C": "Twelve percent is a real figure but it is barley's, which the claim does not mention."}}, {"id": "u1-l2-f1-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A study claims that a city's weekday bus ridership grew more than its weekend ridership from 2018 to 2023.", "table": {"head": ["Day type", "2018 (thousands)", "2023 (thousands)"], "rows": [["Weekday", "120", "168"], ["Weekend", "60", "78"], ["Holiday", "40", "44"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Weekday ridership reached 168,000 riders in the year 2023 across the city.", "B": "Weekday ridership rose by 48,000 while weekend ridership rose by only 18,000.", "C": "Weekend ridership grew by a greater amount than weekday ridership over the period.", "D": "Holiday ridership rose from 40,000 to 44,000 riders over the period from 2018 to 2023."}, "correct": "B", "choice_families": {"A": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares weekday with weekend growth. The 48,000 versus 18,000 gain supports weekday growing more.", "why_wrong": {"A": "A single 2023 figure gives no weekend comparison, so it cannot show weekday grew more.", "C": "This reverses the comparison; weekday ridership grew by more, not weekend.", "D": "Holiday figures are real but the claim is about weekday versus weekend, not holidays."}}, {"id": "u1-l2-f1-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "A biologist argues that species A tolerated the drought better than species B.", "table": {"head": ["Species", "Survival after 30 days (%)"], "rows": [["A", "82"], ["B", "55"], ["C", "70"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Species A survived at 82 percent, a higher rate than species B's 55 percent.", "B": "Species A survived at a rate of 82 percent after thirty days without any water.", "C": "Species B survived at a higher rate than species A did over the same period.", "D": "Species C survived at a rate of 70 percent after thirty days without any water."}, "correct": "A", "choice_families": {"B": "Kiyassiz tek deger", "C": "Yon tersine cevrilmis", "D": "Dogru sayi yanlis is"}, "why_correct": "The claim compares A with B. Only the choice giving 82 against 55 in the right direction supports it.", "why_wrong": {"B": "Species A's 82 percent alone, with no figure for B, does not show A tolerated drought better.", "C": "This reverses the comparison; species A survived at the higher rate, not B.", "D": "Seventy percent is real but it is species C's, which the claim does not concern."}}, {"id": "u1-l2-f1-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Dogru sayi yanlis is", "passage": "An economist claims that Region X's exports grew faster than Region Y's from 2015 to 2022.", "table": {"head": ["Region", "2015 (bn USD)", "2022 (bn USD)"], "rows": [["X", "40", "72"], ["Y", "50", "70"], ["Z", "30", "39"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Region Z's exports rose from 30 billion to 39 billion dollars over the same period.", "B": "Region X's exports reached a total of 72 billion dollars by the year 2022.", "C": "Region X's exports rose by 32 billion against Region Y's rise of only 20 billion.", "D": "Region Y's exports grew by a greater amount than Region X's over the period."}, "correct": "C", "choice_families": {"A": "Dogru sayi yanlis is", "B": "Kiyassiz tek deger", "D": "Yon tersine cevrilmis"}, "why_correct": "The claim compares X with Y. The 32 billion versus 20 billion gain supports X growing faster.", "why_wrong": {"A": "Region Z's figures are real but the claim concerns X and Y, not Z.", "B": "A single 2022 total for X, with no figure for Y, does not show X grew faster.", "D": "This reverses the comparison; Region X grew by more, not Region Y."}}, {"id": "u1
