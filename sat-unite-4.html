<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit_title":"SAT Reading & Writing Kampı","unit_accent":"warm","unit":4,"lessons":[{"name":"Boundaries","families":["Comma splice ve run-on","İki nokta noktalı virgül yanlış","Gereksiz ya da eksik virgül","Kısa çizgi parantez yanlış eşleme"],"teaching":{"kavramsal_temel":["Boundaries, iki fikri noktalamayla doğru ayırmayı ölçer. Anahtar kavram bağımsız cümledir: özne ve yüklemi olan, tek başına cümle olabilen yapı. Bağımlı cümle tek başına duramaz.","En önemli kural: iki bağımsız cümle sadece virgülle birleşemez, buna comma splice denir, ve noktalamasız birbirine yapışamaz, buna run-on denir. İki tam cümleyi ayırmanın doğru yolları: nokta, noktalı virgül, ya da virgül artı bağlaç (for, and, nor, but, or, yet, so).","İki nokta (:) özeldir: solunda TAM bir bağımsız cümle olmalı ve bir liste ya da açıklama tanıtmalı. Solu yarım cümleyse iki nokta yanlıştır. Kısa çizgi ek bilgiyi ayırır ve çift olarak eşlenir.","Bu yüzden her soruda önce boşluğun iki yanına bak: her yan tek başına cümle olur mu. İkisi de bağımsızsa ayırman gerek, sadece virgül asla yeterli değildir.","Sınır (boundary) noktalaması aslında tek bir soruyu yanıtlar: 'Buradaki iki parça bağımsız cümle mi, yoksa biri diğerine bağımlı mı?' Bir bağımsız cümle tek başına durabilen, özne ve çekimli yüklem içeren tam bir düşüncedir. İki bağımsız cümle yan yana geldiğinde onları ayırmak için dört yasal araç vardır: nokta, noktalı virgül, iki nokta (ikincisi birinciyi açıklıyorsa) ve 'virgül + FANBOYS (for, and, nor, but, or, yet, so)'. Tek başına virgül asla iki bağımsız cümleyi birleştiremez. SAT bu kuralı defalarca test eder çünkü öğrencilerin çoğu 'nefes aldığım yere virgül koyarım' sezgisiyle hareket eder; oysa noktalama nefese değil, dilbilgisel yapıya dayanır. Şıkları çözerken önce boşluğun soluna ve sağına bakıp her iki tarafın tek başına cümle olup olmadığını sınayın; bu tek test soruların çoğunu çözer.","İki nokta üst üste (:) ve kısa çizgi/tire (—) SAT'ta çoğu zaman 'tanıtım' işaretleri olarak birbirinin yerine geçebilir, ancak ortak ve katı bir şartları vardır: solundaki kısım her zaman tam, bağımsız bir cümle olmalıdır. İki nokta ardından gelen şey bir liste, bir tanım, bir örnek ya da bir açıklama olabilir; okuyucuya 'işte şimdi bunu somutlaştırıyorum' der. Tek bir tire de aynı tanıtım işini görebilir ama daha ani, vurgulu bir duraklama katar. Bir cümlede araya sıkıştırılmış ek bilgiyi ayırmak istediğinizde ise tireler çift kullanılır (— ... —) ve tıpkı çift virgül gibi davranır; bu durumda tireyle başlayıp virgülle kapatmak ya da tersini yapmak yasaktır çünkü işaretlerin eşleşmesi gerekir. Bu simetri kuralı, SAT'ın niteleyici ek bilgi sorularında en çok yakaladığı hatalardan biridir."],"cozumlu_ornekler":[{"sonuc":"İki bağımsız cümle sadece virgülle birleşemez. Virgül artı bağlaç ya da nokta ya da noktalı virgül gerek.","choices":{"B":", thousands","A":", and thousands","D":"; and thousands","C":" thousands"},"stem":"Which choice conforms to the conventions of Standard English?","correct":"A","adimlar":["İki yana bak: The storm knocked out power across the region tam cümle. thousands of homes stayed dark for two days tam cümle.","İki bağımsız cümle, ayırmak gerek.","Doğru yollar: nokta, noktalı virgül, ya da virgül artı bağlaç. A virgül artı and, doğru.","B sadece virgül, comma splice. C noktalamasız, run-on. D noktalı virgül zaten ayırır, üstüne and konmaz."],"passage":"The storm knocked out power across the region ______ of homes stayed dark for two days."},{"stem":"Which choice conforms to the conventions of Standard English?","sonuc":"İki nokta solunda tam cümle, sağında liste ya da açıklama ister. Bu şart tutuyor.","choices":{"C":", basil,","D":" basil,","A":": basil,","B":"; basil,"},"passage":"The garden contained three kinds of herb ______ mint, and thyme.","correct":"A","adimlar":["Sol tarafa bak: The garden contained three kinds of herb tam bir cümle.","Sağda gelen basılı, mint, and thyme bir liste, üçü tanıtıyor.","Tam cümle artı tanıtılan liste, iki nokta ister. A doğru.","B noktalı virgül iki bağımsız cümle ister, liste değil. C virgül çok zayıf. D noktalamasız, liste cümleye yapışır."]},{"sonuc":"Doğru cevap C: Noktalı virgül iki bağımsız cümleyi doğru şekilde ayırır.","choices":{"B":"tides her","A":"tides, her","C":"tides; her","D":"tides her,"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","correct":"C","adimlar":["Boşluğun iki yanına bak: 'Rachel Carson spent years studying ocean tides' bağımsız bir cümle, 'her observations eventually reshaped...' da bağımsız bir cümle.","İki bağımsız cümleyi yalnızca virgülle birleştirmek 'comma splice' (virgül yapıştırması) hatasıdır; bu yüzden A elenir.","İki cümleyi hiçbir noktalama olmadan birleştirmek 'run-on' hatasıdır; B ve D bu yüzden yanlış.","Noktalı virgül (;) birbiriyle yakından ilişkili iki bağımsız cümleyi bağlaç olmadan birleştirebilir; tam da buradaki durum."],"passage":"Marine biologist Rachel Carson spent years studying ocean tides ______ her observations eventually reshaped how scientists understood coastal ecosystems."},{"sonuc":"Doğru cevap B: İki nokta üst üste tam bir cümleden sonra listeyi tanıtır.","choices":{"A":"ingredients, which are","B":"ingredients:","C":"ingredients;","D":"ingredients"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","correct":"B","adimlar":["Boşluktan önce 'The recipe calls for three uncommon ingredients' tam ve bağımsız bir cümledir.","Boşluktan sonra gelen kısım bir liste; bu liste öncesindeki cümleyi açıklıyor/örnekliyor.","İki nokta üst üste (:), kendisinden önce tam bir cümle geldiğinde bir liste ya da açıklama başlatmak için kullanılır; B tam olarak bunu yapar.","Noktalı virgül liste öncesi kullanılmaz (C yanlış); hiç noktalama koymamak liste öncesi kopukluk yaratır (D yanlış); A gereksiz kelime ekleyip yapıyı bozar."],"passage":"The recipe calls for three uncommon ingredients ______ saffron, tamarind paste, and dried lime."},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"B":"After that,","A":"After, that","C":"After","D":"After,"},"sonuc":"Doğru cevap C: Zaman bağlacı 'after' bağımlı cümleyi virgülsüz başlatır.","passage":"______ the storm passed, the volunteers returned to clearing the debris from the flooded streets.","adimlar":["Cümlenin ana kısmı 'the volunteers returned to clearing the debris' bağımsız cümledir.","Başta yan cümle kuruluyor: '______ the storm passed' — bu bir zaman zarf cümleciği olmalı.","'After the storm passed' ('Fırtına geçtikten sonra') doğru bir bağımlı cümledir; 'after' bağlacından sonra virgül gelmez.","A ve D 'after' sonrası hatalı virgül koyar; B ise 'After that' deyip 'the storm passed' cümleciğini bağlaçsız bırakır, yapı bozulur."],"correct":"C"},{"correct":"C","adimlar":["Boşluğun iki yanı da bağımsız cümle: 'The committee reviewed the proposal for weeks' ve 'ultimately, they voted to approve the new budget.'","'ultimately' bir bağlaç değil, bir zarftır (geçiş zarfı); tek başına iki cümleyi birleştiremez.","İki bağımsız cümle, aralarında yalnızca bir geçiş zarfı varken noktalı virgülle ayrılmalıdır; C bunu sağlar.","A ve B'de bağlaç 'ultimately'den önce gelir ama 'ultimately, they voted' ile ikinci bir özne katmanı doğar ve anlam bozulur; D ise koordinasyon ile virgülü karıştırıp yapıyı bozar."],"passage":"The committee reviewed the proposal for weeks ______ ultimately, they voted to approve the new budget.","sonuc":"Doğru cevap C: Geçiş zarfıyla başlayan ikinci cümleden önce noktalı virgül gerekir.","choices":{"D":"weeks, and ultimately","C":"weeks;","A":"weeks and","B":"weeks, but"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?"}],"celdirici_aileleri":[{"tanim":"İki bağımsız cümleyi ya sadece virgülle (comma splice) ya da hiç noktalama olmadan (run-on) birleştirir. En sık hata. İki tam cümle asla sadece virgülle birleşmez.","ad":"Comma splice ve run-on"},{"tanim":"İki nokta ya da noktalı virgül yanlış yerde. İki nokta solunda tam cümle istemediği yerde kullanılır, ya da noktalı virgül iki bağımsız cümle olmadığı halde konur.","ad":"İki nokta noktalı virgül yanlış"},{"ad":"Gereksiz ya da eksik virgül","tanim":"Virgül olmaması gereken yere konur (özne ile yüklem arası) ya da gerekli olduğu yerde (giriş ifadesi, ara cümle sonrası) eksik bırakılır."},{"tanim":"Ara bilgiyi ayıran işaretler yanlış eşlenir. Başta kısa çizgi sonda virgül ya da parantez, gibi. Aynı tür işaret çiftlenmelidir.","ad":"Kısa çizgi parantez yanlış eşleme"},{"ad":"Comma Splice (Virgül Yapıştırması)","tanim":"İki bağımsız cümlenin araya bağlaç konmadan yalnızca virgülle birleştirilmesi. SAT'ta en sık kurulan tuzaktır; çözüm noktalı virgül, nokta ya da 'virgül + FANBOYS bağlacı' kullanmaktır."},{"ad":"İki Nokta Öncesi Tam Cümle Kuralı","tanim":"İki nokta üst üste (:) yalnızca kendisinden önce bağımsız (tam) bir cümle geldiğinde kullanılabilir. 'The ingredients are: X, Y' gibi yarım cümleden sonra iki nokta yanlıştır; çeldiriciler bunu doğru gösterir."},{"tanim":"'however, therefore, moreover, ultimately, consequently' gibi geçiş zarfları iki bağımsız cümleyi tek başına birleştiremez; öncesinde noktalı virgül veya nokta gerekir. Sadece virgülle kullanmak comma splice yaratır.","ad":"Geçiş Zarfı Bağlaç Değildir"}],"top_tips":["Boşluğun iki yanından her biri tek başına cümle olabiliyorsa, onları ayırman gerek. Sadece virgül asla yeterli değil, comma splice olur.","Nokta ve noktalı virgül burada aynı işi yapar: iki bağımsız cümleyi ayırır.","İki noktadan (:) önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır.","Özne ile yüklem arasına virgül girmez. The scientists who worked for years, published derse, o virgül yanlıştır."],"sik_hatalar":[{"hata":"İki tam cümleyi virgülle birleştirmek","cozum":"Comma splice en sık hata. İki bağımsız cümle için nokta, noktalı virgül, ya da virgül artı bağlaç gerek."},{"hata":"İki noktayı yarım cümleden sonra kullanmak","cozum":"İki noktadan önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır."},{"hata":"Özne ile yüklem arasına virgül koymak","cozum":"The scientists who worked for years, published derse o virgül yanlıştır. Özne ile fiil ayrılmaz."},{"cozum":"Ara bilgiyi ayıran işaretler çift olmalı. Başta çizgi sonda çizgi, ya da ikisi de virgül.","hata":"Kısa çizgi ve virgülü eşitlememek"},{"cozum":"Noktalı virgül iki BAĞIMSIZ cümleyi birleştirir; liste ya da açıklama tanıtmak iki noktanın (:) işidir. Her ikisinin de solunda tam cümle olmalı ama sağ tarafları farklıdır.","hata":"Öğrenci noktalı virgülü, iki nokta üst üstenin işini yaptığını sanıp liste tanıtmak için kullanıyor (örn. 'three items; X, Y, Z')."},{"cozum":"Virgül bağlaçtan sonra değil, bağımlı cümlecik BİTTİKTEN sonra gelir: 'After the storm passed, ...' Bağlacın hemen ardına virgül konmaz.","hata":"Öğrenci başta gelen bağlaçtan ('although, because, after, when') sonra otomatik virgül koyuyor."}],"alt_konular_baslik":"Kural alt başlıkları","ne_olculuyor":["Bu ders noktalama ve cümle sınırlarını ölçer. Boşluk, iki fikri nasıl ayırdığını ya da birleştirdiğini sorar.","Anahtar kavram: bağımsız cümle (independent clause) tek başına cümle olur, bağımlı cümle (dependent clause) olmaz. Noktalama bu ikisini doğru ayırmalı.","Kritik nokta: iki bağımsız cümle virgülle birleşemez (comma splice) ve noktasız birbirine yapışamaz (run-on). Doğru araçlar: nokta, noktalı virgül, ya da virgül artı bağlaç."],"strateji":["Boşluğun iki yanını oku, her yan tek başına cümle olur mu.","İkisi de bağımsızsa ayır: nokta, noktalı virgül, ya da virgül artı bağlaç.","Bir yan bağımlı ise, giriş ifadesinden sonra virgül doğru.","İki nokta için solda tam cümle, sağında liste ya da açıklama olmalı.","Kısa çizgi ve parantezi çift eşle."],"alt_konular":[{"baslik":"1) İki bağımsız cümleyi ayırma (period / semicolon)","kural":"Bağımsız + bağımsız → nokta veya noktalı virgül. Sadece virgül (comma splice) daima yanlıştır.","govde":["Boşluğun iki yanı da tek başına ayakta duran tam cümleyse (bağımsız + bağımsız), onları ya nokta ile ayırırsın ya da noktalı virgül (;) ile bağlarsın. İkisi dilbilgisel olarak eşdeğerdir.","En sık tuzak COMMA SPLICE'tır: iki bağımsız cümleyi yalnızca virgülle bağlamak yanlıştır. Virgül tek başına iki tam cümleyi tutamaz; ya nokta/noktalı virgül gerekir ya da virgül + bağlaç (, and / , but).","Test: boşluğun soluna nokta koy, sağdaki parça tek başına anlamlı tam cümle mi? Soluna da bak. İkisi de 'evet' ise nokta ya da noktalı virgül doğrudur."]},{"ornek":"\"Sonuç netti: örneklem çok küçüktü.\" Sol taraf tam cümle olduğu için iki nokta doğrudur.","govde":["İki nokta (:) kullanmak için SOLDAKİ parça tam bir cümle olmalı; sağı ise bir liste, açıklama ya da örnek getirir. 'Tam cümle : açıklama' kalıbı doğrudur.","Tire (—) benzer bir 'açıklama/kesinti' işlevi görür ve çoğu zaman iki noktayla değiştirilebilir; ama açılan tirenin çift olması gereken durumlara dikkat et (araya giren bilgi iki tireyle sarılır).","Tuzak: solu tam cümle olmadan iki nokta kullanmak. 'The team needed three things: ...' doğru; 'The three things were, for example: ...' gibi solu yarım bırakan kullanım yanlıştır."],"baslik":"2) İki nokta ve tire ile açıklama (colon / dash)"},{"kural":"Çıkarılabilen ek bilgi iki virgülle sarılır; cümle için zorunlu bilgi virgülsüz kalır.","govde":["Bağımlı bir öğe (giriş ifadesi, zaman/koşul yan cümlesi) ana cümleden virgülle ayrılır: 'After the rain stopped, ...'. Bağımlı + bağımsız ilişkisinde tek virgül yeterlidir.","Araya giren, çıkarılabilir bilgi (nonrestrictive) İKİ virgülle sarılır: '..., which was unexpected, ...'. Bir açıp bir kapamayı unutma; tek yanlı virgül klasik hatadır.","Kısıtlayıcı (restrictive) bilgi ise virgül İSTEMEZ, çünkü cümlenin anlamı için zorunludur: 'The book that I bought' — burada 'that I bought' virgülsüz kalır."],"baslik":"3) Bağımlı öğeleri ve araya giren bilgiyi virgülleme"}],"karar_proseduru":["Boşluğun iki yanını oku. Her yan tek başına cümle olur mu, yani bağımsız mi.  Özne ve yüklem var mi diye bak.","İki yan da bağımsızsa, onları ayırman gerek.  Seçenekler: nokta, noktalı virgül, ya da virgül artı FANBOYS bağlacı (for, and, nor, but, or, yet, so). Tek başına virgül YANLIŞ, o comma splice.","Bir yan bağımlı ise, virgül çoğu zaman doğrudur.  Bağımlı cümle başta ise arkasına virgül gelir.","İki nokta (:) ve kısa çizgi (--) kontrolü.  İki nokta ancak solunda TAM bir bağımsız cümle varsa kullanılır ve bir liste ya da açıklama tanıtır. Kısa çizgi ek bilgiyi ayırır, çift olarak eşlenir.","Seç ve oku.  Cümleyi seçilen noktalamayla oku. İki fikir doğru ayrılmış mi, yanlış yapışma var mi kontrol et."],"alt_konular_intro":"Boundaries, cümleler ve cümle parçaları arasındaki NOKTALAMAYI ölçer: nokta, noktalı virgül, iki nokta, virgül, tire. Bu sorularda kulakla değil, YAPIYLA karar verilir. Değişmez ilk adım şudur: boşluğun iki yanındaki parçaların her biri tek başına tam cümle (bağımsız) mi, yoksa yarım (bağımlı) mı? Cevap buradan çıkar."},"fam_short":{"İki nokta noktalı virgül yanlış":"İki nokta/;","Gereksiz ya da eksik virgül":"Virgül","Comma splice ve run-on":"Splice/run-on","Kısa çizgi parantez yanlış eşleme":"Çizgi/parantez"},"main_ids":["u4-l1-f1-01","u4-l1-f2-01","u4-l1-f3-01","u4-l1-f4-01"],"questions":[{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"choices":{"C":" thousands","D":"; and thousands","B":", thousands","A":", and thousands"},"why_correct":"Both sides are independent clauses, so a comma plus the conjunction 'and' correctly joins them.","why_wrong":{"D":"A semicolon already joins independent clauses on its own; adding 'and' after it is not standard.","C":"No punctuation between two independent clauses is a run-on.","B":"A comma alone between two independent clauses is a comma splice."},"passage":"The storm knocked out power across the region ______ of homes stayed dark for two days.","lesson_name":"Boundaries","choice_families":{"C":"Comma splice ve run-on","D":"İki nokta noktalı virgül yanlış","B":"Comma splice ve run-on"},"target_family":"Comma splice ve run-on","id":"u4-l1-f1-01","lesson":1,"correct":"A"},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_wrong":{"A":"A comma alone between two independent clauses is a comma splice.","C":"No punctuation between two independent clauses is a run-on.","D":"The extra comma after 'it' wrongly separates the subject from its verb."},"why_correct":"Both clauses are independent, so a period correctly separates them into two sentences.","id":"u4-l1-f1-02","target_family":"Comma splice ve run-on","passage":"The museum renovated its main hall last year ______ now displays twice as many works as before.","lesson_name":"Boundaries","choices":{"B":". It","A":", it","D":", it,","C":" it"},"correct":"B","lesson":1,"choice_families":{"C":"Comma splice ve run-on","D":"Gereksiz ya da eksik virgül","A":"Comma splice ve run-on"}},{"why_wrong":{"B":"A comma alone between two independent clauses is a comma splice.","A":"No punctuation between two independent clauses is a run-on.","D":"A colon should introduce a list or explanation, but the second clause does not explain the first."},"why_correct":"Both clauses are independent, so a semicolon correctly links two closely related complete thoughts.","choices":{"B":", their","A":" their","D":": their","C":"; their"},"stem":"Which choice completes the text so that it conforms to orm, Structure, and Sense","passage":"By the time the guests arrived, the host ______ already prepared every dish on the menu.","choices":{"A":"will have","B":"has","C":"had","D":"is having"},"why_correct":"An action completed before the past 'arrived' takes the past perfect, so 'had' is correct.","why_wrong":{"D":"'is having' is present progressive, inconsistent with the past-time frame.","A":"'will have' points to the future, inconsistent with the past narrative.","B":"'has' is present perfect, inconsistent with the past-time frame set by 'arrived.'"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"lesson":2,"correct":"C","target_family":"Fiil zamanı tutarsızlığı","id":"u4-l2-f2-02","choice_families":{"A":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı"}},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_wrong":{"C":"'had switched' is past perfect, inconsistent with the present-time frame.","B":"'switched' shifts to past, inconsistent with the present 'rely' and 'fall.'","A":"'will have switched' points to the future, inconsistent with the present context."},"why_correct":"The sentence is in the present ('rely,' 'fall'), so the present 'switch' keeps the tense consistent.","id":"u4-l2-f2-03","target_family":"Fiil zamanı tutarsızlığı","choices":{"D":"switch","C":"had switched","A":"will have switched","B":"switched"},"passage":"Today many households rely on solar power, and each year even more ______ to it as costs fall.","lesson_name":"Form, Structure, and Sense","choice_families":{"A":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı","C":"Fiil zamanı tutarsızlığı"},"correct":"D","lesson":2},{"lesson_name":"Form, Structure, and Sense","passage":"The novelist wrote her first draft by hand, then ______ it into a computer for editing.","choices":{"C":"will type","D":"is typing","B":"types","A":"typed"},"why_correct":"The first verb 'wrote' is past, so the past 'typed' keeps the sequence consistent.","why_wrong":{"C":"'will type' shifts to future, inconsistent with the past 'wrote.'","D":"'is typing' shifts to present, inconsistent with the past narrative.","B":"'types' shifts to present, breaking the past sequence begun by 'wrote.'"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"lesson":2,"correct":"A","target_family":"Fiil zamanı tutarsızlığı","id":"u4-l2-f2-04","choice_families":{"C":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı"}},{"correct":"B","lesson":2,"choice_families":{"D":"Fiil zamanı tutarsızlığı","C":"Fiil zamanı tutarsızlığı","A":"Fiil zamanı tutarsızlığı"},"passage":"Every spring the river rises, floods the fields, and then slowly ______ to its normal level by summer.","lesson_name":"Form, Structure, and Sense","choices":{"C":"had receded","D":"will have receded","B":"recedes","A":"receded"},"id":"u4-l2-f2-05","target_family":"Fiil zamanı tutarsızlığı","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_correct":"The habitual present ('rises,' 'floods') calls for the present 'recedes' to stay consistent.","why_wrong":{"A":"'receded' shifts to past, inconsistent with the present 'rises' and 'floods.'","C":"'had receded' is past perfect, inconsistent with the present-time frame.","D":"'will have receded' points to the future, inconsistent with the present pattern."}},{"passage":"The ancient city thrived for centuries before a series of earthquakes ______ it in ruins.","lesson_name":"Form, Structure, and Sense","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_correct":"The past 'thrived' sets a past-time frame, so the past 'left' stays consistent.","why_wrong":{"D":"'has left' is present perfect, inconsistent with the completed past-time frame.","A":"'will leave' shifts to future, inconsistent with the past narrative.","B":"'leaves' shifts to present, inconsistent with the past 'thrived.'"},"choices":{"D":"has left","C":"left","B":"leaves","A":"will leave"},"id":"u4-l2-f2-06","target_family":"Fiil zamanı tutarsızlığı","correct":"C","lesson":2,"choice_families":{"A":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı"}},{"choices":{"C":"had stowed","D":"will have stowed","B":"stowed","A":"stow"},"lesson_name":"Form, Structure, and Sense","passage":"Right now the crew is loading the ship, and by nightfall they ______ every crate on board.","choice_families":{"C":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı","A":"Fiil zamanı tutarsızlığı"},"lesson":2,"correct":"D","why_correct":"An action completed by a future point ('by nightfall') takes the future perfect 'will have stowed.'","why_wrong":{"B":"'stowed' is simple past, inconsistent with the future point 'by nightfall.'","A":"'stow' is simple present and does not express completion by the future point.","C":"'had stowed' is past perfect, inconsistent with the future-time frame."},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"target_family":"Fiil zamanı tutarsızlığı","id":"u4-l2-f2-07"},{"choice_families":{"C":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı"},"target_family":"Fiil zamanı tutarsızlığı","id":"u4-l2-f2-08","lesson":2,"correct":"A","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"choices":{"D":"are agreeing","C":"will agree","A":"agreed","B":"agree"},"why_wrong":{"D":"'are agreeing' shifts to present, inconsistent with the past narrative.","C":"'will agree' shifts to future, inconsistent with the past verbs.","B":"'agree' shifts to present, breaking the past sequence."},"why_correct":"The past verbs 'studied' and 'discussed' set a past sequence, so the past 'agreed' stays consistent.","passage":"The students studied the map for a while, discussed the route, and finally ______ on a plan.","lesson_name":"Form, Structure, and Sense"},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"choices":{"A":"were","B":"are","D":"will be","C":"had been"},"why_wrong":{"A":"'were' shifts to past, inconsistent with the present 'runs.'","D":"'will be' points to the future, inconsistent with the present context.","C":"'had been' is past perfect, inconsistent with the present-time frame."},"why_correct":"The present frame ('These days,' 'runs') calls for the present 'are' to stay consistent.","passage":"These days the factory runs on renewable power, and its emissions ______ far lower than they were a decade ago.","lesson_name":"Form, Structure, and Sense","choice_families":{"A":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı","C":"Fiil zamanı tutarsızlığı"},"target_family":"Fiil zamanı tutarsızlığı","id":"u4-l2-f2-09","lesson":2,"correct":"B"},{"id":"u4-l2-f2-10","target_family":"Fiil zamanı tutarsızlığı","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_wrong":{"B":"'turns' shifts to present, inconsistent with the past 'kept.'","A":"'will turn' shifts to future, inconsistent with the past narrative.","D":"'is turning' shifts to present, inconsistent with the past-time frame."},"why_correct":"The past 'kept' sets a past frame, so the past 'turned' stays consistent.","choice_families":{"D":"Fiil zamanı tutarsızlığı","A":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı"},"correct":"C","lesson":2,"choices":{"C":"turned","D":"is turning","A":"will turn","B":"turns"},"passage":"The explorer kept a detailed journal throughout the voyage and later ______ it into a bestselling book.","lesson_name":"Form, Structure, and Sense"},{"why_wrong":{"B":"'their' is plural and does not agree with the singular 'Each student' in this convention.","A":"'they're' means 'they are' and is not a possessive pronoun.","D":"'there' indicates place and is not a possessive pronoun."},"why_correct":"The singular antecedent 'Each student' takes a singular pronoun, so 'his or her' agrees.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"id":"u4-l2-f3-01","target_family":"Zamir uyumsuzluğu","choices":{"C":"his or her","D":"there","A":"they're","B":"their"},"lesson_name":"Form, Structure, and Sense","passage":"Each student must bring ______ own laptop to the coding workshop.","choice_families":{"D":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"correct":"C","lesson":2},{"unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_wrong":{"A":"'they're' means 'they are' and is not a possessive.","B":"'their' is plural, disagreeing with the singular 'company.'","C":"'it's' means 'it is' and is not a possessive."},"why_correct":"The singular 'company' takes the singular possessive 'its.'","target_family":"Zamir uyumsuzluğu","id":"u4-l2-f3-02","choices":{"B":"their","A":"they're","C":"it's","D":"its"},"passage":"The company revised ______ policy after employees raised concerns about overtime.","lesson_name":"Form, Structure, and Sense","choice_families":{"C":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"lesson":2,"correct":"D"},{"choices":{"A":"his or her","B":"their","D":"they're","C":"its"},"why_wrong":{"B":"'their' is plural and does not agree with the singular 'A good teacher' in this convention.","D":"'they're' means 'they are' and is not a possessive.","C":"'its' is used for things, not a person like a teacher."},"why_correct":"The singular 'A good teacher' takes a singular pronoun, so 'his or her' agrees.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"lesson_name":"Form, Structure, and Sense","passage":"A good teacher adapts ______ methods to the needs of each class.","choice_families":{"C":"Zamir uyumsuzluğu","D":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu"},"lesson":2,"correct":"A","target_family":"Zamir uyumsuzluğu","id":"u4-l2-f3-03"},{"choice_families":{"C":"Zamir uyumsuzluğu","D":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"lesson":2,"correct":"B","choices":{"B":"they","A":"it","D":"one","C":"he"},"passage":"The two universities announced that ______ would merge their science departments.","lesson_name":"Form, Structure, and Sense","target_family":"Zamir uyumsuzluğu","id":"u4-l2-f3-04","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_wrong":{"C":"'he' is singular and refers to a person, not two institutions.","D":"'one' is singular and does not match the plural antecedent.","A":"'it' is singular, disagreeing with the plural 'two universities.'"},"why_correct":"The plural antecedent 'two universities' takes the plural pronoun 'they.'"},{"choices":{"C":"she","D":"one's","B":"they","A":"it"},"passage":"Neither of the sisters remembered where ______ had left the keys.","lesson_name":"Form, Structure, and Sense","choice_families":{"D":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu"},"correct":"C","lesson":2,"unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_correct":"'Neither' is singular, so the singular pronoun 'she' agrees.","why_wrong":{"D":"'one's' is a possessive and does not fit as the subject of 'had left.'","B":"'they' is plural, but 'Neither' is singular.","A":"'it' does not refer to a person."},"id":"u4-l2-f3-05","target_family":"Zamir uyumsuzluğu"},{"choices":{"A":"they're","B":"their","D":"its","C":"it's"},"lesson_name":"Form, Structure, and Sense","passage":"The orchestra tuned ______ instruments before the conductor arrived.","choice_families":{"C":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"correct":"D","lesson":2,"why_correct":"The singular collective noun 'orchestra,' acting as one unit, takes the singular 'its.'","why_wrong":{"C":"'it's' means 'it is' and is not a possessive.","B":"'their' treats the singular collective noun as plural here.","A":"'they're' means 'they are' and is not a possessive."},"unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l2-f3-06","target_family":"Zamir uyumsuzluğu"},{"passage":"Every applicant should proofread ______ essay before submitting it.","lesson_name":"Form, Structure, and Sense","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"C":"its","D":"your","A":"his or her","B":"their"},"why_correct":"The singular 'Every applicant' takes a singular pronoun, so 'his or her' agrees.","why_wrong":{"C":"'its' is used for things, not a person.","D":"'your' shifts to the second person, which the antecedent does not support.","B":"'their' is plural and does not agree with the singular 'Every applicant' in this convention."},"target_family":"Zamir uyumsuzluğu","id":"u4-l2-f3-07","lesson":2,"correct":"A","choice_families":{"B":"Zamir uyumsuzluğu","D":"Zamir uyumsuzluğu","C":"Zamir uyumsuzluğu"}},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_wrong":{"A":"'their' treats the singular collective noun as plural.","D":"'they're' means 'they are' and is not a possessive.","C":"'it's' means 'it is' and is not a possessive."},"why_correct":"The singular collective 'board,' acting as one unit, takes the singular 'its.'","choices":{"A":"their","B":"its","C":"it's","D":"they're"},"passage":"The board reversed ______ earlier ruling once new evidence came to light.","lesson_name":"Form, Structure, and Sense","choice_families":{"D":"Zamir uyumsuzluğu","C":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"id":"u4-l2-f3-08","target_family":"Zamir uyumsuzluğu","correct":"B","lesson":2},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"choices":{"C":"one's","D":"your","B":"their","A":"his"},"why_wrong":{"B":"'their' is plural and shifts away from the singular 'One.'","A":"'his' narrows to one gender where 'one's' is the consistent form.","D":"'your' shifts to the second person, breaking agreement with 'One.'"},"why_correct":"The pronoun 'One' is matched by the possessive 'one's' to keep person and number consistent.","passage":"One should always double-check ______ work before handing it in.","lesson_name":"Form, Structure, and Sense","choice_families":{"D":"Zamir uyumsuzluğu","B":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu"},"target_family":"Zamir uyumsuzluğu","id":"u4-l2-f3-09","lesson":2,"correct":"C"},{"lesson_name":"Form, Structure, and Sense","passage":"The herd moved slowly across the plain, following ______ leader toward the water.","why_correct":"The singular collective 'herd,' acting as one unit, takes the singular 'its.'","why_wrong":{"A":"'they're' means 'they are' and is not a possessive.","B":"'their' treats the singular collective noun as plural.","C":"'it's' means 'it is' and is not a possessive."},"choices":{"D":"its","C":"it's","B":"their","A":"they're"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"correct":"D","lesson":2,"id":"u4-l2-f3-10","target_family":"Zamir uyumsuzluğu","choice_families":{"B":"Zamir uyumsuzluğu","A":"Zamir uyumsuzluğu","C":"Zamir uyumsuzluğu"}},{"target_family":"Modifier ve paralellik","id":"u4-l2-f4-01","why_wrong":{"B":"'the umbrella' cannot be the one walking home, so it dangles the modifier.","A":"'her clothes' cannot be walking home, so the modifier dangles.","C":"'it' does not name the walker the modifier requires."},"why_correct":"The opening modifier 'Walking home' must describe the subject that follows; 'she' is the one walking, so 'she was' is correct.","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","lesson":2,"correct":"D","choice_families":{"B":"Modifier ve paralellik","A":"Modifier ve paralellik","C":"Modifier ve paralellik"},"lesson_name":"Form, Structure, and Sense","passage":"Walking home in the rain, ______ soaked before reaching the door.","choices":{"B":"the umbrella was","A":"her clothes were","C":"it was","D":"she was"}},{"why_wrong":{"D":"'how a team is managed' is a clause and breaks the parallel structure.","C":"'a team can be managed' is a clause, not a parallel infinitive phrase.","B":"'managing' is a gerund and breaks the parallel infinitive pattern."},"why_correct":"The list uses infinitives ('to code, to write'), so the parallel 'to manage a team' keeps the structure consistent.","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l2-f4-02","target_family":"Modifier ve paralellik","choices":{"D":"how a team is managed","C":"a team can be managed","A":"to manage a team","B":"managing a team"},"lesson_name":"Form, Structure, and Sense","passage":"The internship taught her to code, to write clearly, and ______.","choice_families":{"D":"Modifier ve paralellik","C":"Modifier ve paralellik","B":"Modifier ve paralellik"},"correct":"A","lesson":2},{"id":"u4-l2-f4-03","target_family":"Modifier ve paralellik","correct":"B","lesson":2,"choice_families":{"A":"Modifier ve paralellik","D":"Modifier ve paralellik","C":"Modifier ve paralellik"},"passage":"Covered in dust after the excavation, ______ carefully brushed off each artifact.","lesson_name":"Form, Structure, and Sense","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_wrong":{"A":"'the brushes' being covered in dust cannot be the ones brushing off artifacts.","D":"'there were tools that' leaves the modifier without the person it should describe.","C":"'it was' names no agent for the modifier to describe."},"why_correct":"The modifier 'Covered in dust' must describe the ones doing the brushing; the archaeologists are covered in dust, so they are the correct subject.","choices":{"B":"the archaeologists","A":"the brushes","C":"it was","D":"there were tools that"}},{"choice_families":{"A":"Modifier ve paralellik","B":"Modifier ve paralellik","D":"Modifier ve paralellik"},"lesson":2,"correct":"C","target_family":"Modifier ve paralellik","id":"u4-l2-f4-04","choices":{"D":"positivity","C":"stayed positive","A":"were staying positive","B":"staying positive"},"why_correct":"The list uses past-tense verbs ('trained, listened'), so the parallel 'stayed positive' keeps the structure consistent.","why_wrong":{"A":"'were staying' shifts the form and breaks the parallel with 'trained' and 'listened.'","B":"'staying' breaks the parallel simple-past pattern.","D":"'positivity' is a noun and does not match the verb pattern of the list."},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"lesson_name":"Form, Structure, and Sense","passage":"The coach valued players who trained hard, listened closely, and ______."},{"lesson_name":"Form, Structure, and Sense","passage":"To improve the design, ______ tested three prototypes before choosing one.","choices":{"C":"it was decided that","D":"the engineers","B":"the design","A":"there was a plan that"},"why_wrong":{"C":"'it was decided that' names no agent for the modifier.","B":"'the design' cannot be the one testing prototypes to improve itself.","A":"'there was a plan that' leaves the modifier without an actor."},"why_correct":"The opening infinitive phrase 'To improve the design' must describe the ones acting; the engineers did the testing, so they are the correct subject.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"lesson":2,"correct":"D","target_family":"Modifier ve paralellik","id":"u4-l2-f4-05","choice_families":{"B":"Modifier ve paralellik","A":"Modifier ve paralellik","C":"Modifier ve paralellik"}},{"lesson_name":"Form, Structure, and Sense","passage":"The new library is praised for being bright, spacious, and ______.","why_correct":"The list uses adjectives ('bright, spacious'), so the parallel adjective 'quiet' keeps the structure consistent.","why_wrong":{"B":"'it has quiet spaces' is a clause and breaks the parallel adjective pattern.","C":"'having quiet' is a phrase that does not match the adjectives.","D":"'quietness' is a noun and does not match the adjective pattern."},"choices":{"B":"it has quiet spaces","A":"quiet","C":"having quiet","D":"quietness"},"unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","correct":"A","lesson":2,"id":"u4-l2-f4-06","target_family":"Modifier ve paralellik","choice_families":{"D":"Modifier ve paralellik","C":"Modifier ve paralellik","B":"Modifier ve paralellik"}},{"passage":"Ripe and heavy on the branch, ______ finally picked the apples.","lesson_name":"Form, Structure, and Sense","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"choices":{"A":"the basket","B":"the farmer","C":"it was time to have","D":"there came a moment when someone"},"why_wrong":{"A":"'the basket' cannot be ripe and heavy on the branch.","C":"'it was time to have' leaves the modifier without a proper noun to describe.","D":"'there came a moment when someone' buries the actor and mismatches the modifier."},"why_correct":"The modifier 'Ripe and heavy on the branch' describes the apples, so the sentence must place the apples logically; only 'the farmer ... picked the apples' keeps the apples as what is ripe, avoiding a dangling modifier.","target_family":"Modifier ve paralellik","id":"u4-l2-f4-07","lesson":2,"correct":"B","choice_families":{"C":"Modifier ve paralellik","D":"Modifier ve paralellik","A":"Modifier ve paralellik"}},{"choice_families":{"D":"Modifier ve paralellik","B":"Modifier ve paralellik","A":"Modifier ve paralellik"},"correct":"C","lesson":2,"choices":{"B":"helping others","A":"they help others","C":"who help others","D":"to help others"},"passage":"The scholarship rewards students who show curiosity, who work hard, and ______.","lesson_name":"Form, Structure, and Sense","id":"u4-l2-f4-08","target_family":"Modifier ve paralellik","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_correct":"The list uses 'who' clauses ('who show, who work'), so the parallel 'who help others' keeps the structure consistent.","why_wrong":{"D":"'to help others' is an infinitive and does not match the 'who' clauses.","B":"'helping others' breaks the parallel 'who' clause pattern.","A":"'they help others' is an independent clause that breaks the pattern."}},{"passage":"Written in a single week, ______ still became the author's most beloved book.","lesson_name":"Form, Structure, and Sense","choices":{"D":"the novel","C":"readers everywhere","A":"it was a week that","B":"the author"},"lesson":2,"correct":"D","choice_families":{"A":"Modifier ve paralellik","B":"Modifier ve paralellik","C":"Modifier ve paralellik"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"why_wrong":{"C":"'readers everywhere' were not written, so the modifier dangles.","A":"'it was a week that' leaves the modifier without the thing written.","B":"'the author' was not written in a week, so the modifier dangles."},"why_correct":"The modifier 'Written in a single week' must describe what was written; the novel was written, so it is the correct subject.","target_family":"Modifier ve paralellik","id":"u4-l2-f4-09"},{"id":"u4-l2-f4-10","target_family":"Modifier ve paralellik","correct":"A","lesson":2,"choice_families":{"B":"Modifier ve paralellik","C":"Modifier ve paralellik","D":"Modifier ve paralellik"},"passage":"The trip promised sightseeing during the day, dining in the evening, and ______ at night.","lesson_name":"Form, Structure, and Sense","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","why_correct":"The list uses gerunds ('sightseeing, dining'), so the parallel gerund 'dancing' keeps the structure consistent.","why_wrong":{"C":"'they danced' is a clause and breaks the pattern.","D":"'a dance' is a noun phrase that does not match the gerunds.","B":"'to dance' is an infinitive and breaks the parallel gerund pattern."},"choices":{"A":"dancing","B":"to dance","D":"a dance","C":"they danced"}}],"families":["Özne yüklem uyumsuzluğu","Fiil zamanı tutarsızlığı","Zamir uyumsuzluğu","Modifier ve paralellik"],"name":"Form, Structure, and Sense","fam_short":{"Özne yüklem uyumsuzluğu":"Özne/yüklem","Modifier ve paralellik":"Modifier/paralel","Fiil zamanı tutarsızlığı":"Fiil zamanı","Zamir uyumsuzluğu":"Zamir"},"main_ids":["u4-l2-f1-01","u4-l2-f2-01","u4-l2-f3-01","u4-l2-f4-01"],"teaching":{"alt_konular_intro":"Bu beceri cümlenin İÇ tutarlılığını ölçer: fiiller, zamirler ve yapılar birbiriyle uyumlu mu? Boundaries noktalamaya bakarken, Form/Structure kelimelerin BİÇİMİNE bakar. Ortak yöntem: uyumu bozan öğeyi bulmak için özneyi, zamanı ya da göndergeyi cümlede geriye doğru izlemektir.","karar_proseduru":["Fiil boşluğu ise, GERÇEK öznesini bul.  Özne ile fiil arasına giren araya bakma. The box of old letters WAS, letters değil box tekil.","Zamana bak.  Cümlenin geri kalanı hangi zamandaysa fiil de ona uymalı. Etraftaki fiiller geçmişse boşluk da geçmiş olmalı.","Zamir boşluğu ise, gönderdiği ismi bul ve sayısına bak.  Tekil isim tekil zamir ister. A student ... their değil his or her ya da yeniden yapılandır.","Cümle bir tanımlayanla başlıyorsa, hemen ardından gelen İSİM onun tanımladığı şey olmalı.  Walking home, the rain started YANLIŞ, çünkü yağmur yürümez.","Liste ya da karşılaştırma varsa paralel yap.  Ögeler aynı formda olmalı: reading, writing, and drawing; to read değil."],"alt_konular":[{"govde":["Fiil, sayı bakımından ÖZNEYLE uyuşmalı: tekil özne tekil fiil, çoğul özne çoğul fiil. Zorluk, araya giren kelimelerin özneyi gizlemesidir.","SAT'ın en sevdiği tuzak: özneyle fiil arasına araya giren bir öbek koymak. 'The box of old letters ___ on the shelf' — özne 'box' (tekil), 'letters' değil. Araya giren öbeği zihinsel olarak sil, gerçek özneyi bul.","Diğer tuzak: 'each', 'every', 'neither' gibi daima TEKİL sayılan özneler; ve 'and' ile bağlanan çoğul özneler. Bu işaretleri ezberle."],"kural":"Araya giren öbeği sil, gerçek özneyi bul, fiili ona göre tekil/çoğul yap.","baslik":"1) Özne-yüklem uyumu (subject-verb agreement)"},{"ornek":"Paragraf geçmiş zamanda ilerliyorsa, 'she then decides' değil 'she then decided' doğrudur.","govde":["Fiilin zamanı cümledeki ya da paragraftaki diğer zaman işaretleriyle tutarlı olmalı. Metnin genel zamanı geçmişse, tutarsız bir şimdiki zaman fiili yanlıştır.","İpuçlarını topla: zaman zarfları (yesterday, currently, by 2020), diğer fiillerin zamanı, olayların sırası. 'By the time X happened, Y had already...' gibi kalıplar past perfect ister.","Tuzak: kulağa doğru gelen ama paragrafın zaman çizgisini bozan fiil. Tek cümleye değil, çevredeki fiillere bakarak karar ver."],"baslik":"2) Fiil zamanı ve biçimi (verb tense & form)"},{"kural":"Zamiri gönderdiği isimle eşle; sayı uyuşmuyorsa ya da gönderge belirsizse seçenek yanlıştır.","govde":["Zamir, gönderdiği isimle (antecedent) sayı bakımından uyuşmalı: tekil isim → tekil zamir (it), çoğul isim → çoğul zamir (they).","Sık hata: 'a company... they' gibi tekil bir kurumu çoğul zamirle karşılamak. Göndergeyi bul, sayısını belirle, zamiri ona uydur.","Belirsiz gönderge de yanlıştır: zamirin hangi isme gönderdiği net değilse cümle kusurludur. SAT bunu çoğu zaman ismi tekrar eden seçenekle düzeltir."],"baslik":"3) Zamir uyumu ve göndergesi (pronoun agreement)"},{"baslik":"4) Paralellik ve niteleyici yeri (parallelism & modifiers)","kural":"Listede öğeler aynı biçimde olmalı; başta niteleyici varsa hemen sonraki özne onu yapan kişi/şey olmalı.","govde":["Liste ya da karşılaştırmadaki öğeler AYNI dilbilgisel biçimde olmalı: 'running, jumping, and swimming' (üçü de -ing). Biçimi kırılan öğe yanlıştır.","Sarkık niteleyici (dangling modifier): cümlenin başındaki tanımlayıcı öbek, hemen ardından gelen ÖZNEYİ nitelemeli. 'Walking home, the rain started' yanlıştır çünkü yürüyen yağmur değildir; doğru özne kişidir.","Yöntem: giriş öbeğini oku, 'bunu kim/ne yapıyor?' diye sor, cevabı ana cümlenin öznesi olmalı. Değilse niteleyici sarkıktır."]}],"strateji":["Fiil boşluğunda gerçek özneyi bul, araya giren ifadeyi kapat.","Zamana bak, cümlenin gerisiyle tutarlı fiili seç.","Zamir boşluğunda gönderdiği ismi bul, sayısına uydur.","Cümle tanımlayanla başlıyorsa, ardından gelen isim eylemi yapan olmalı.","Liste ve karşılaştırmada ögeleri aynı formda tut."],"ne_olculuyor":["Bu ders cümlenin dilbilgisi yapısını ölçer: fiil uyumu ve zamanı, zamir uyumu, modifier yerleşimi ve paralellik.","Boşluk çoğu zaman bir fiil, zamir ya da kelime formu ister. Doğru form cümlenin diğer ögeleriyle uyumlu olmalıdır.","Kritik nokta: fiil öznesiyle sayıda uyuşmalı, zamir gönderdiği isimle uyuşmalı, tanımlayan (modifier) tanımladığı şeyin yanında olmalı, listeler paralel olmalı."],"alt_konular_baslik":"Kural alt başlıkları","top_tips":["Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ... ifadesini elle kapat, gerçek özneyi gör.","Zaman için etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı. Zaman kayması tuzaktır.","their tek bir kişi için kullanılamaz (Standard English'te bu soru tipinde). A person ... their yerine his or her, ya da isim çoğul yapılır.","Cümle -ing ya da -ed ile başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı. Yapmıyorsa modifier yanlış yerleşmiş."],"sik_hatalar":[{"cozum":"Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ifadesini kapat.","hata":"Yanlış kelimeyi özne sanmak"},{"hata":"Zaman kayması","cozum":"Etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı."},{"hata":"Tekil isme çoğul zamir","cozum":"Bu soru tipinde a person ... their yerine his or her, ya da ismi çoğul yap."},{"hata":"Modifier ve paralellik bozmak","cozum":"Cümle -ing ya da -ed ile başlıyorsa virgülden sonraki ilk isim o eylemi yapan olmalı. Listede ögeleri aynı formda tut."},{"cozum":"Önce cümlenin gerçek çekirdek öznesini bul, araya giren 'of/with' ibarelerini parantez içine al gibi düşün. Yüklem yalnızca çekirdek özneye uyar: 'The list ... is'.","hata":"Öğrenci yüklemi, özneye değil, hemen soldaki en yakın isme uyduruyor ('The list of items are...')."},{"hata":"Öğrenci paralellik sorularında kulağa 'daha resmi/uzun' gelen seçeneği doğru sanıyor.","cozum":"Paralellikte kural biçim eşleşmesidir, uzunluk ya da resmiyet değil. Listedeki ilk öğenin dilbilgisel biçimine bak (yalın fiil mi, -ing mi, isim mi) ve boşluğu tam olarak aynı biçimle doldur."}],"cozumlu_ornekler":[{"stem":"Which choice conforms to the conventions of Standard English?","sonuc":"Araya giren of ... ifadesini kapat, gerçek özneyi (box, tekil) gör, fiili ona uydur.","choices":{"A":"has","B":"have","C":"having","D":"to have"},"passage":"The box of old photographs and letters ______ been sitting in the attic for decades.","correct":"A","adimlar":["Gerçek özneyi bul: The box. of old photographs and letters araya giren ifade, özne değil.","box tekil, o yüzden fiil tekil olmalı.","has tekil, doğru.","have çoğul, letters'a uyar ama gerçek özne box. having ve to have çekimli fiil değil, ana fiil olamaz."]},{"passage":"The internship taught her to code, to write clearly, and ______.","correct":"A","adimlar":["Listenin yapısına bak: to code, to write, yani mastar formu (to + fiil).","Paralellik için üçüncü öge de aynı formda olmalı.","to manage a team mastar, paralel, doğru.","managing gerund, formu bozar. c ve d birer cümle, mastar değil, paralellik kırılır."],"stem":"Which choice conforms to the conventions of Standard English?","sonuc":"Listedeki ögeler aynı formda olmalı. İlk ikisi mastar ise üçüncü de mastar.","choices":{"B":"managing a team","A":"to manage a team","D":"how a team is managed","C":"a team can be managed"}},{"adimlar":["Yüklemin öznesini bul: özne 'The collection', çekirdek isim tekildir.","'of rare manuscripts' ve 'housed in the university's oldest library' araya giren tamlama/niteleyicilerdir; özneyi değiştirmezler.","Araya giren çoğul 'manuscripts' kelimesi yüklemi çoğula çekmeye çalışan tuzaktır; A, B ve C çoğula uyar, bu yüzden elenir.","Tekil özne 'collection' tekil yüklem 'is' ister."],"correct":"D","passage":"The collection of rare manuscripts, housed in the university's oldest library, ______ carefully preserved by a team of specialists.","choices":{"A":"are","B":"were","C":"have been","D":"is"},"sonuc":"Doğru cevap D: Tekil özne 'collection' tekil 'is' yüklemini alır.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?"},{"adimlar":["Zaman çerçevesine bak: 'By the time the researchers published... last spring' ifadesi geçmişte belirli bir anı işaret eder.","Anlatılan olay, o geçmiş andan ÖNCE başlayıp süregelmiş; yani 'geçmişten daha önceki geçmiş' gerekir.","Past perfect continuous ('had been occurring') tam olarak geçmiş bir noktadan önce başlayıp süren eylemi anlatır.","A present perfect (şimdiye bağlar), B geniş zaman, C şimdiki zaman; hepsi geçmiş referans çerçevesiyle çelişir."],"correct":"D","passage":"By the time the researchers published their findings last spring, the phenomenon they described ______ for nearly a decade.","choices":{"C":"is occurring","D":"had been occurring","B":"occurs","A":"has been occurring quite steadily"},"sonuc":"Doğru cevap D: 'had been occurring' geçmiş bir andan önceki sürekliliği doğru verir.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?"},{"passage":"Every student who submitted a project on time received feedback, and ______ was encouraged to revise the work before the final deadline.","correct":"B","adimlar":["Öncül (antecedent) 'Every student' — 'every' ile başlayan öznesi dilbilgisel olarak TEKİLDİR.","Boşluk cümlenin öznesi konumunda; tekil ve özne durumunda bir zamir/isim gerekir.","'they' (A) çoğul, 'them' (C) nesne durumu ve çoğul, 'those students' (D) çoğul — hepsi tekil öncülle uyuşmaz.","'each one' tekildir ve özne olarak durur, tekil öncül 'every student' ile uyumludur."],"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","sonuc":"Doğru cevap B: 'each one' tekil öncül 'every student' ile sayı bakımından uyuşur.","choices":{"D":"those students","C":"them","A":"they","B":"each one"}},{"passage":"The internship program aims to teach participants how to analyze data, communicate results, and ______ under tight deadlines.","correct":"D","adimlar":["Cümlede bir liste var: 'to analyze data, communicate results, and ______'.","Paralellik kuralı: listedeki öğeler aynı dilbilgisel biçimde olmalı. İlk iki öğe yalın fiil: 'analyze', 'communicate'.","Üçüncü öğe de aynı yalın fiil biçiminde olmalı: 'manage'.","A bir yan cümle, B isim tamlaması, C '-ing' biçimi — hiçbiri 'analyze/communicate' ile paralel değil."],"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","sonuc":"Doğru cevap D: 'manage', listedeki diğer yalın fiillerle paralel yapıyı korur.","choices":{"A":"how they should manage projects","B":"the management of projects","D":"manage projects","C":"managing projects"}}],"celdirici_aileleri":[{"tanim":"Fiil öznesiyle sayıda uyuşmaz. Araya giren ifadeler yüzünden yanlış kelimeyi özne sanmak en sık hata. Tekil özne tekil fiil, çoğul özne çoğul fiil ister.","ad":"Özne yüklem uyumsuzluğu"},{"tanim":"Fiil cümlenin ya da paragrafın zamanına uymaz. Etraf geçmiş zamandayken boşluğa şimdiki ya da gelecek konur. Zaman tutarlı olmalı.","ad":"Fiil zamanı tutarsızlığı"},{"ad":"Zamir uyumsuzluğu","tanim":"Zamir gönderdiği isimle sayıda uyuşmaz ya da hangi ismi gönderdiği belirsizdir. Tekil isme çoğul zamir, ya da iki olası isme tek zamir."},{"ad":"Modifier ve paralellik","tanim":"Tanımlayan yanlış şeyi tanımlar (dangling ya da misplaced modifier), ya da liste ve karşılaştırmadaki ögeler aynı formda değildir (paralellik bozuk)."},{"tanim":"Özne ile yüklem arasına 'of ...', 'along with ...', niteleyici cümlecik gibi ibareler sokulur ve bunların içindeki isme göre yüklem seçtirilmeye çalışılır. Yüklem daima gerçek özneye uyar; araya giren isim göz ardı edilir.","ad":"Araya Giren İbare Tuzağı (Intervening Phrase)"},{"ad":"Zaman Çerçevesi Tutarlılığı (Tense Consistency)","tanim":"Cümledeki zaman belirteçleri ('by the time', 'last spring', 'currently', 'for a decade') hangi zamanın gerekli olduğunu belirler. Çeldiriciler dilbilgisel olarak doğru ama zaman çerçevesiyle çelişen fiiller sunar."},{"ad":"Belgisiz Zamir Tekilliği (Indefinite Pronoun Agreement)","tanim":"'each, every, everyone, anyone, either, neither, one' gibi özneler dilbilgisel olarak tekildir ve tekil yüklem/zamir ister. Anlamca 'çok kişi' çağrıştırsalar da çoğul 'they/them' ile eşleştirmek SAT'ta hatadır."}],"kavramsal_temel":["Form, Structure, and Sense, cümlenin dilbilgisi yapısını ölçer: fiil uyumu ve zamanı, zamir uyumu, modifier yerleşimi ve paralellik. Boşluk çoğu zaman bir fiil, zamir ya da kelime formu ister.","Fiil uyumunda en sık tuzak, öznenin fiile en yakın kelime OLMAMASIDIR. The box of old letters was derse, özne box (tekil), letters değil. Araya giren of ifadesini elle kapatıp gerçek özneyi bul.","Zamir gönderdiği isimle sayıda uyuşmalı. Bu soru tipinde tekil isme çoğul their genelde yanlıştır, his or her ya da isim çoğul yapılır. Ayrıca cümle bir tanımlayanla başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı, yoksa modifier yanlış yerleşir.","Paralellikte liste ve karşılaştırmadaki ögeler aynı formda olmalı: reading, writing, and drawing, arada to read olmaz. Önce yapının ne olduğunu belirle, sonra boşluğu ona uydur.","Özne-yüklem uyumu ve zamir uyumu, aslında aynı temel becerinin iki yüzüdür: bir kelimenin dilbilgisel olarak hangi isme 'bağlı' olduğunu doğru tespit etmek. SAT bu bağı bilerek gizler; özne ile yüklem arasına uzun niteleyiciler, 'of' tamlamaları veya araya giren cümlecikler yerleştirir ki en yakın isim sizi yanıltsın. Doğru yöntem her zaman aynıdır: cümleyi çıplak iskeletine indirin. Araya giren tüm ibareleri geçici olarak silin, geriye kalan 'kim + ne yapıyor' çekirdeğini bulun ve uyumu o çekirdek üzerinden kurun. 'The collection ... is', 'Each student ... is' gibi. Bu indirgeme alışkanlığı, uyum sorularının neredeyse tamamını mekanik ve hatasız çözülebilir hale getirir; sezgiye değil, yapının kendisine güvenmeyi öğretir.","Fiil zamanı soruları SAT'ta izole biçimde değil, her zaman cümlenin veya paragrafın kurduğu 'zaman çerçevesi' içinde değerlendirilmelidir. Bir fiil tek başına dilbilgisel olarak kusursuz olabilir ama yanlış zaman çerçevesinde durduğu için hatalı sayılır. Bu yüzden zaman sorularında önce 'zaman çapalarını' arayın: 'by the time', 'last year', 'currently', 'since 2010', 'for a decade' gibi ifadeler hangi zamanı gerektirdiğinizi söyler. Örneğin 'by the time' ile başlayan bir geçmiş referans, ondan önce başlamış bir eylem için past perfect gerektirir; 'since' ve 'for' çoğu zaman present perfect'i çağırır; bir dizi eylemin sırasını anlatan bir paragrafta ise fiiller kendi aralarında tutarlı bir zaman zincirinde kalmalıdır. Paralellik de bu tutarlılık ilkesinin bir uzantısıdır: bir liste ya da karşılaştırma içinde tüm öğeler aynı dilbilgisel biçimi paylaşmalı, böylece cümlenin mantıksal simetrisi bozulmamalıdır."]}}]}</script><script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail'),main=document.getElementById('main');
const L=['A','B','C','D'];
const S={cur:0,lp:D.lessons.map(l=>({seen:new Set(),family:Object.fromEntries(l.families.map(f=>[f,'pending'])),phaseDone:{lesson:false,practice:false}})),
         phase:'lesson',queue:[],idx:0,remedFor:null,remedCount:0,activeQ:null,picked:null,locked:false};
const SB_URL=(window.SUPABASE_URL||'https://vazbvbqgvtlaqkytfsbi.supabase.co');
const SB_KEY=(window.SUPABASE_KEY||'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g');
const Progress={client:null,userId:null,
  _wait(cb,t){t=t||0;if(window.supabase&&window.supabase.createClient){cb();return;}if(t>30)return;setTimeout(()=>this._wait(cb,t+1),100);},
  async init(){try{if(!window.supabase)return;this.client=window.supabase.createClient(SB_URL,SB_KEY);
    const r=await this.client.auth.getSession();this.userId=(r&&r.data&&r.data.session)?r.data.session.user.id:null;}catch(e){this.client=null;}},
  async load(unit){if(!this.client||!this.userId)return null;try{
    const a=await this.client.from('sat_module_progress').select('lesson,family,status').eq('user_id',this.userId).eq('unit',unit);
    const b=await this.client.from('sat_lesson_state').select('lesson,practice_done').eq('user_id',this.userId).eq('unit',unit);
    return {fam:(a&&a.data)||[],st:(b&&b.data)||[]};}catch(e){return null;}},
  saveFamily(unit,lesson,family,status){if(!this.client||!this.userId)return;
    this.client.from('sat_module_progress').upsert({user_id:this.userId,unit,lesson,family,status,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson,family'}).then(()=>{},()=>{});},
  saveState(unit,lesson,seen){if(!this.client||!this.userId)return;
    this.client.from('sat_lesson_state').upsert({user_id:this.userId,unit,lesson,practice_done:true,seen_count:seen,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson'}).then(()=>{},()=>{});},
  boot(){this._wait(async()=>{await this.init();const d=await this.load(D.unit);if(!d)return;
    d.fam.forEach(r=>{const i=r.lesson-1;if(S.lp[i]&&(r.family in S.lp[i].family))S.lp[i].family[r.family]=r.status;});
    d.st.forEach(r=>{const i=r.lesson-1;if(S.lp[i])S.lp[i].phaseDone.practice=!!r.practice_done;});
    renderRail();});},
};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const curL=()=>D.lessons[S.cur], lp=()=>S.lp[S.cur];
const sf=f=>{const l=curL();return (l.fam_short&&l.fam_short[f])||f;};
const qById=id=>curL().questions.find(q=>q.id===id);
const unseen=fam=>curL().questions.find(q=>q.target_family===fam&&!lp().seen.has(q.id));
function setMode(m){S.phase=m;main.setAttribute('data-mode',m==='test'?'test':m);}
function tableHTML(t){if(!t)return'';
  const head=t.head.map(h=>`<th>${esc(h)}</th>`).join('');
  const rows=t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('');
  return `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;}
function renderRail(){
  const cur=S.phase;
  const link=(id,label,lock)=>`<a data-action="nav" data-target="${id}" class="${cur===id?'cur':''} ${lp().phaseDone[id]?'ok':''} ${lock?'lock':''}"><span class="dot"></span>${label}${lock?' <span style="margin-left:auto;font-size:10px;opacity:.6">yakinda</span>':''}</a>`;
  const lessons=D.lessons.map((l,i)=>{
    const active=i===S.cur;
    const done=S.lp[i].phaseDone.practice;
    const cls=active?'les active':(done?'les done':'les');
    const akList=(active&&curL().teaching.alt_konular&&curL().teaching.alt_konular.length)?`<div class="aknav">${curL().teaching.alt_konular.map((s,ai)=>`<a class="aklink" data-action="akjump" data-ak="${ai}">${esc(s.baslik)}</a>`).join('')}</div>`:'';
    const sub=active?`<div class="sub">${link('lesson','Konu anlatimi',false)}${akList}${link('practice','Alistirma',false)}${link('test','Ünite Testi',false)}</div>`:'';
    return `<div class="${cls}"><div class="lh" data-action="goto" data-lesson="${i}"><span class="n">${i+1}</span><span class="lt">${esc(l.name)}</span></div>${sub}</div>`;
  }).join('');
  const quads=curL().families.map(f=>{const st=lp().family[f];
    return `<div class="quad ${st==='mastered'?'mastered':st==='shaky'?'shaky':''}"><span class="qf">${esc(sf(f))}</span></div>`;}).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span>
    <div class="ut">${esc(D.unit_title)}</div><div>${lessons}</div>

}
function gotoLesson(i){S.cur=i;S.remedFor=null;S.remedCount=0;lessonView();}
function lessonView(){
  setMode('lesson');renderRail();const l=curL(),t=l.teaching;
  const secKT=(t.kavramsal_temel&&t.kavramsal_temel.length)?`<h2>Kavramsal temel</h2><div class="rule"></div>${t.kavramsal_temel.map(x=>`<p>${esc(x)}</p>`).join('')}`:'';
  const secSUB=(t.alt_konular&&t.alt_konular.length)?`<h2>${esc(t.alt_konular_baslik||'Konunun alt başlıkları')}</h2><div class="rule"></div><p class="sub-intro">${esc(t.alt_konular_intro||'')}</p>${t.alt_konular.map((s,ai)=>`<div class="subtopic" id="ak-${ai}"><h3>${esc(s.baslik)}</h3>${(s.govde||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.kural?`<div class="subrule"><span class="subrule-l">Kural</span> ${esc(s.kural)}</div>`:''}${s.ornek?`<div class="subex"><span class="subex-l">Mini örnek</span> ${esc(s.ornek)}</div>`:''}</div>`).join('')}`:'';
  const secWEX=(t.cozumlu_ornekler&&t.cozumlu_ornekler.length)?`<h2>Çözümlü örnekler</h2><div class="rule"></div>${t.cozumlu_ornekler.map((e,i)=>`<div class="wex"><div class="wex-h">Ornek ${i+1}</div>${e.passage?`<div class="wex-p">${esc(e.passage).replace(/\n/g,"<br>")}</div>`:''}<p class="wex-stem">${esc(e.stem)}</p><div class="wex-opts">${L.map(x=>`<div class="wex-opt${e.correct===x?' ok':''}"><span class="wl">${x}</span><span>${esc(e.choices[x])}</span></div>`).join('')}</div><div class="wex-sol"><div class="wex-sl">Çözüm adımları</div><ol class="steps">${e.adimlar.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="wex-ans"><b>Doğru cevap ${e.correct}.</b> ${esc(e.sonuc||'')}</p></div></div>`).join('')}`:'';
  const secMISS=(t.sik_hatalar&&t.sik_hatalar.length)?`<h2>Sık hatalar</h2><div class="rule"></div>${t.sik_hatalar.map(m=>`<div class="miss"><b>${esc(m.hata)}</b><p style="margin:.4rem 0 0">${esc(m.cozum)}</p></div>`).join('')}`:'';
  const secSTR=(t.strateji&&t.strateji.length)?`<h2>Sınav stratejisi</h2><div class="rule"></div><ol class="steps">${t.strateji.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${l.no} . Konu anlatimi</div>
     <h1>${esc(l.name)}</h1>
     <div class="head-cta"><a class="back-hub" href="ogrenme-haritasi.html">&lsaquo; SAT modülüne dön</a><button class="next" data-action="start">Alıştırmaya geç &rsaquo;</button></div></div>
   <div class="pad">
   <h2>Ne ölçülüyor</h2><div class="rule"></div>${t.ne_olculuyor.map(x=>`<p>${esc(x)}</p>`).join('')}
   ${secKT}
   ${secSUB}
   <h2>Karar prosedürü</h2><div class="rule"></div><ol class="steps">${t.karar_proseduru.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   ${secWEX}
   <h2>Çeldirici aileleri</h2><div class="rule"></div>${t.celdirici_aileleri.map(f=>`<div class="trap"><b>${esc(f.ad)}</b><p style="margin:.4rem 0 0">${esc(f.tanim)}</p></div>`).join('')}
   ${secMISS}
   <h2>Top tips</h2><div class="rule"></div><ul class="tips">${t.top_tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>

}
function startPractice(){setMode('practice');S.queue=curL().main_ids.slice();S.idx=0;nextMain();}
function nextMain(){if(S.idx>=S.queue.length){return doneView();}S.remedFor=null;S.remedCount=0;showQ(qById(S.queue[S.idx]),'main');}
function showQ(q,kind){
  S.activeQ=q;S.picked=null;S.locked=false;lp().seen.add(q.id);renderRail();
  const remed=kind==='remed'?`<div class="remedbar">Telafi . hedef tuzak: ${esc(sf(S.remedFor))} . deneme ${S.remedCount}/2</div>`:'';
  const count=kind==='main'?`<div class="qcount">Soru ${S.idx+1} / ${S.queue.length}</div>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Alıştırma</div><h1>${esc(curL().name)}</h1>
     <button class="backbtn" data-action="nav" data-target="lesson">&lsaquo; Konu anlatımına dön</button></div>
   <div class="pad">${count}${remed}
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabı kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Doğru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlış.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazında durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn ghost" data-action="start">Tekrar çalış</button>${nextL}</div></div>`;
  window.scrollTo(0,0);

// ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
function startTest(){setMode('test');S.test={q:buildTest(),idx:0,pick:null,rec:[]};showTestQ();}
function showTestQ(){
  const T=S.test,q=T.q[T.idx];T.pick=null;
  main.setAttribute('data-mode','test');railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span><div class="ut">${esc(D.unit_title)}</div><div class="tprog"><div class="tprog-l">Ünite Testi</div><div class="tprog-bar"><div class="tprog-fill" style="width:${Math.round(T.idx/T.q.length*100)}%"></div></div><div class="tprog-n">Soru ${T.idx+1} / ${T.q.length}</div></div></div>`;
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . ${esc(q.lesson_name)}</div><h1>Soru ${T.idx+1}</h1>
     <button class="backbtn" data-action="test-quit">&lsaquo; Testten cik</button></div>
   <div class="pad">
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="test-pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="tnext" data-action="test-next" disabled>${T.idx===T.q.length-1?'Testi bitir':'Sonraki soru'}</button></div></div>`;
  window.scrollTo(0,0);
}
function testPick(x){const T=S.test;T.pick=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('tnext').disabled=false;}
function testNext(){const T=S.test;if(!T.pick)return;const q=T.q[T.idx];T.rec.push({q,picked:T.pick,ok:T.pick===q.correct});T.idx++;if(T.idx>=T.q.length)return testResult();showTestQ();}
function testResult(){
  const T=S.test,rec=T.rec,total=rec.length,score=rec.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  // weak areas by lesson and by family
  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hiçbir tuzak ailesinde zayıflık yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
