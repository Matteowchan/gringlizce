<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit":3,"lessons":[{"no":1,"questions":[{"stem":"Which choice completes the text with the most logical transition?","unit":3,"why_correct":"The second sentence contradicts the expectation in the first (traffic rose instead of falling), so a contrast transition fits.","why_wrong":{"B":"'Therefore' signals a result that follows, but the sentences conflict, so it points the wrong way.","C":"'For example' introduces an illustration, but the second sentence is a contrast, not an example.","D":"'Meanwhile' marks simultaneous events, which is not the relationship here."},"target_family":"Ters yön","id":"u3-l1-f1-01","passage":"The new policy was expected to cut the city's traffic sharply. ______, congestion in the downtown core actually rose in the months after it took effect.","lesson_name":"Transitions","choices":{"D":"Meanwhile","C":"For example","A":"However","B":"Therefore"},"lesson":1,"correct":"A","choice_families":{"B":"Ters yön","C":"Yanlış alt tür","D":"İlgisiz geçiş"}},{"why_correct":"Despite cheaper panels, households still hesitate; the second sentence runs against the first, so a contrast transition fits.","why_wrong":{"D":"'Similarly' marks likeness, but the two sentences oppose each other.","C":"'In other words' restates a point, but the second sentence adds a contrasting fact, not a restatement.","A":"'As a result' signals a consequence, but hesitation contradicts the drop in price rather than following from it."},"stem":"Which choice completes the text with the most logical transition?","unit":3,"id":"u3-l1-f1-02","target_family":"Ters yön","lesson_name":"Transitions","passage":"Solar panels have become far cheaper over the past decade. ______, many households still hesitate to install them because of the upfront cost.","choices":{"B":"Nevertheless","A":"As a result","D":"Similarly","C":"In other words"},"correct":"B","lesson":1,"choice_families":{"C":"Yanlış alt tür","D":"İlgisiz geçiş","A":"Ters yön"}},{"stem":"Which choice completes the text with the most logical transition?","unit":3,"why_correct":"Gathering data then ignoring it is a contradiction, so a contrast transition fits.","why_wrong":{"D":"'Likewise' marks similarity, not the contrast present here.","B":"'For instance' introduces an example, which the second sentence is not.","A":"'Consequently' signals a result, but ignoring the data does not follow logically from gathering it."},"id":"u3-l1-f1-03","target_family":"Ters yön","choices":{"D":"Likewise","C":"Yet","A":"Consequently","B":"For instance"},"passage":"The committee gathered months of detailed data on the proposal. ______, it reached its final decision without consulting any of it.","lesson_name":"Transitions","choice_families":{"D":"İlgisiz geçiş","B":"Yanlış alt tür","A":"Ters yön"},"correct":"C","lesson":1},{"id":"u3-l1-f1-04","target_family":"Ters yön","why_correct":"Passing safety checks would predict quick approval, but approval was delayed, so a contrast transition fits.","why_wrong":{"C":"'That is' introduces a restatement, not the contrast the sentences require.","A":"'Thus' signals a result, but the delay works against the smooth safety checks rather than following from them.","B":"'Meanwhile' marks simultaneity, which is not the relationship here."},"stem":"Which choice completes the text with the most logical transition?","unit":3,"choice_families":{"C":"Yanlış alt tür","A":"Ters yön","B":"İlgisiz geçiş"},"correct":"D","lesson":1,"choices":{"C":"That is","D":"Still","B":"Meanwhile","A":"Thus"},"lesson_name":"Transitions","passage":"The medication cleared the trial's safety checks with ease. ______, regulators delayed its approval for another full year."},{"choice_families":{"C":"Yanlış alt tür","D":"İlgisiz geçiş","B":"Ters yön"},"target_family":"Ters yön","id":"u3-l1-f1-05","lesson":1,"correct":"A","unit":3,"stem":"Which choice completes the text with the most logical transition?","choices":{"D":"Finally","C":"In addition","B":"Accordingly","A":"In contrast"},"why_correct":"The film succeeded against the prediction of failure, so a contrast transition fits.","why_wrong":{"B":"'Accordingly' signals a result in line with what came before, but success contradicts the prediction.","D":"'Finally' marks the last item in a sequence, which is not the relationship here.","C":"'In addition' adds a similar point, but the second sentence opposes the first."},"passage":"Critics predicted the film would fail at the box office. ______, it became the highest-grossing release of the year.","lesson_name":"Transitions"},{"target_family":"Ters yön","id":"u3-l1-f1-06","why_correct":"Different assumptions would predict different results, but the theories agree, so a contrast transition fits.","why_wrong":{"C":"'For example' introduces an illustration, which the second sentence is not.","D":"'Meanwhile' marks simultaneity, not the contrast present here.","A":"'Therefore' signals a consequence, but identical predictions do not follow from opposite assumptions."},"unit":3,"stem":"Which choice completes the text with the most logical transition?","lesson":1,"correct":"B","choice_families":{"D":"İlgisiz geçiş","C":"Yanlış alt tür","A":"Ters yön"},"lesson_name":"Transitions","passage":"The two theories rest on completely different assumptions about how memory works. ______, they arrive at nearly identical predictions.","choices":{"D":"Meanwhile","C":"For example","A":"Therefore","B":"Nonetheless"}},{"lesson_name":"Transitions","passage":"The region receives abundant rainfall throughout the year. ______, its reservoirs run dangerously low each summer.","choices":{"A":"As a result","B":"In short","C":"Even so","D":"Similarly"},"correct":"C","lesson":1,"choice_families":{"D":"İlgisiz geçiş","B":"Yanlış alt tür","A":"Ters yön"},"why_correct":"Abundant rain would predict full reservoirs, but they run low, so a contrast transition fits.","why_wrong":{"B":"'In short' introduces a summary, not the contrast the sentences require.","A":"'As a result' signals a consequence, but low reservoirs contradict abundant rainfall.","D":"'Similarly' marks likeness, which is not the relationship here."},"stem":"Which choice completes the text with the most logical transition?","unit":3,"id":"u3-l1-f1-07","target_family":"Ters yön"},{"choices":{"B":"Meanwhile","A":"Hence","D":"However","C":"In fact"},"passage":"The author spent years researching the historical setting of her novel. ______, she chose to leave almost all of that detail out of the finished book.","lesson_name":"Transitions","choice_families":{"B":"İlgisiz geçiş","A":"Ters yön","C":"Yanlış alt tür"},"lesson":1,"correct":"D","stem":"Which choice completes the text with the most logical transition?","unit":3,"why_wrong":{"C":"'In fact' intensifies or confirms a prior point, not the contrast present here.","A":"'Hence' signals a result, but omitting the detail does not follow from researching it.","B":"'Meanwhile' marks simultaneity, which is not the relationship here."},"why_correct":"Extensive research then leaving it out is a contradiction, so a contrast transition fits.","target_family":"Ters yön","id":"u3-l1-f1-08"},{"choice_families":{"D":"İlgisiz geçiş","C":"Yanlış alt tür","B":"Ters yön"},"correct":"A","lesson":1,"choices":{"D":"Likewise","C":"For instance","A":"Despite this","B":"Thus"},"lesson_name":"Transitions","passage":"Early reviews of the restaurant were overwhelmingly negative. ______, it has been fully booked every night since it opened.","id":"u3-l1-f1-09","target_family":"Ters yön","why_correct":"Negative reviews would predict empty tables, but the restaurant is fully booked, so a contrast transition fits.","why_wrong":{"B":"'Thus' signals a result, but being fully booked contradicts the negative reviews.","C":"'For instance' introduces an example, which the second sentence is not.","D":"'Likewise' marks similarity, not the contrast present here."},"stem":"Which choice completes the text with the most logical transition?","unit":3},{"stem":"Which choice completes the text with the most logical transition?","unit":3,"why_wrong":{"D":"'Meanwhile' marks simultaneity, not the contrast present here.","C":"'In other words' restates a point, which the second sentence does not do.","A":"'Consequently' signals a result, but the discovery works against the extinction claim rather than following from it."},"why_correct":"A recent living population contradicts the extinction declaration, so a contrast transition fits.","target_family":"Ters yön","id":"u3-l1-f1-10","passage":"The species was declared extinct more than fifty years ago. ______, a small population was recently found living deep in the forest.","lesson_name":"Transitions","choices":{"A":"Consequently","B":"However","C":"In other words","D":"Meanwhile"},"lesson":1,"correct":"B","choice_families":{"D":"İlgisiz geçiş","C":"Yanlış alt tür","A":"Ters yön"}},{"id":"u3-l1-f2-01","target_family":"Yanlış alt tür","why_wrong":{"A":"'For example' would make the streetlights an illustration of the previous items, but they are a separate, added investment, not an example of transit expansion.","C":"'However' signals contrast, but the sentence continues in the same direction.","D":"'Therefore' signals a result, but the streetlights do not follow as a consequence."},"why_correct":"The streetlights are one more item added to a list of investments, so an addition transition fits.","unit":3,"stem":"Which choice completes the text with the most logical transition?","correct":"B","lesson":1,"choice_families":{"D":"Sebep sonuç ters","C":"Ters yön","A":"Yanlış alt tür"},"lesson_name":"Transitions","passage":"The city has invested heavily in public transit in recent years. It has expanded the subway, added bus routes, and built new bike lanes. ______, it has installed hundreds of new streetlights to improve safety at night.","choices":{"B":"In addition","A":"For example","D":"Therefore","C":"However"}},{"id":"u3-l1-f2-02","target_family":"Yanlış alt tür","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_wrong":{"A":"'Nevertheless' signals contrast, but the sentence supports the previous one.","B":"'In addition' would add a separate point, but the cactus is an instance of the general claim, not a new one.","D":"'As a result' signals a consequence, which the cactus example is not."},"why_correct":"The barrel cactus is a specific illustration of the general point about water conservation, so an example transition fits.","correct":"C","lesson":1,"choice_families":{"D":"Sebep sonuç ters","B":"Yanlış alt tür","A":"Ters yön"},"passage":"Many desert plants have developed ways to conserve water. ______, the barrel cactus stores moisture in its thick, ribbed stem for use during long droughts.","lesson_name":"Transitions","choices":{"C":"For example","D":"As a result","A":"Nevertheless","B":"In addition"}},{"choice_families":{"C":"Ters yön","B":"Yanlış alt tür","A":"İlgisiz geçiş"},"correct":"D","lesson":1,"choices":{"C":"However","D":"In short","A":"Meanwhile","B":"For example"},"passage":"The report's findings were complex and easily misread. ______, its conclusion was that current methods, though imperfect, remain the best available.","lesson_name":"Transitions","id":"u3-l1-f2-03","target_family":"Yanlış alt tür","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_correct":"The second sentence sums up the complex findings in a single line, so a summary transition fits.","why_wrong":{"B":"'For example' introduces an illustration, but this sentence condenses the findings rather than exemplifying them.","A":"'Meanwhile' marks simultaneity, which is not the relationship here.","C":"'However' signals contrast, but the sentence distills rather than opposes."}},{"choice_families":{"B":"Yanlış alt tür","D":"Yanlış alt tür","C":"Sebep sonuç ters"},"correct":"A","lesson":1,"choices":{"C":"Therefore","D":"For example","B":"In addition","A":"By contrast"},"lesson_name":"Transitions","passage":"The professor's lectures were famous for their difficulty. Students often left them confused and overwhelmed. ______, her office hours were patient, warm, and unhurried.","id":"u3-l1-f2-04","target_family":"Yanlış alt tür","why_wrong":{"C":"'Therefore' signals a result, but the office hours do not follow as a consequence of the hard lectures.","D":"'For example' introduces an illustration, but the office hours contrast with, rather than illustrate, the lectures.","B":"'In addition' would add a similar point, but the office hours oppose the tone of the lectures."},"why_correct":"The warm office hours are set against the difficult lectures, so a contrast transition fits.","unit":3,"stem":"Which choice completes the text with the most logical transition?"},{"target_family":"Yanlış alt tür","id":"u3-l1-f2-05","why_wrong":{"A":"'For instance' would make the price cut an example of rewriting labels, but it is a separate measure.","C":"'However' signals contrast, but the sentence continues the same effort.","D":"'In conclusion' signals a closing summary, but this sentence adds a new action, not a wrap-up."},"why_correct":"Lower ticket prices are another step added to the museum's efforts, so an addition transition fits.","stem":"Which choice completes the text with the most logical transition?","unit":3,"lesson":1,"correct":"B","choice_families":{"A":"Yanlış alt tür","D":"Yanlış alt tür","C":"Ters yön"},"lesson_name":"Transitions","passage":"The museum wanted to make its collection more approachable. It rewrote its labels in plain language and added audio guides. ______, it lowered its ticket prices for students and families.","choices":{"D":"In conclusion","C":"However","B":"Moreover","A":"For instance"}},{"choice_families":{"D":"İlgisiz geçiş","B":"Yanlış alt tür","A":"Sebep sonuç ters"},"correct":"C","lesson":1,"choices":{"B":"For example","A":"Therefore","D":"Meanwhile","C":"In fact"},"lesson_name":"Transitions","passage":"The bridge's design looked strange to many observers. ______, its unusual curves were what allowed it to withstand high winds.","id":"u3-l1-f2-06","target_family":"Yanlış alt tür","why_correct":"The second sentence deepens and confirms the point with a striking detail, so an emphasis transition fits.","why_wrong":{"D":"'Meanwhile' marks simultaneity, which is not the relationship here.","A":"'Therefore' signals a result, but the point about wind resistance is not a consequence of looking strange.","B":"'For example' introduces an illustration of a general claim, but here the sentence intensifies rather than exemplifies."},"unit":3,"stem":"Which choice completes the text with the most logical transition?"},{"choice_families":{"C":"Ters yön","B":"Yanlış alt tür","A":"Sebep sonuç ters"},"correct":"D","lesson":1,"choices":{"B":"For example","A":"As a result","C":"Nevertheless","D":"Furthermore"},"passage":"Coral reefs face many threats today. Warming seas cause bleaching, pollution smothers the coral, and overfishing removes key species. ______, coastal construction buries reefs under sediment.","lesson_name":"Transitions","id":"u3-l1-f2-07","target_family":"Yanlış alt tür","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_correct":"Coastal construction is one more threat added to a list, so an addition transition fits.","why_wrong":{"A":"'As a result' signals a consequence, which this added threat is not.","B":"'For example' would make construction an illustration of the previous threats, but it is a separate threat added to them.","C":"'Nevertheless' signals contrast, but the sentence continues the list."}},{"passage":"The essay's language is dense and technical. ______, its central claim is simple: people remember stories better than facts.","lesson_name":"Transitions","stem":"Which choice completes the text with the most logical transition?","unit":3,"why_correct":"The second sentence restates the dense essay in plain terms, so a restatement transition fits.","why_wrong":{"C":"'Consequently' signals a result, but the simple claim does not follow as a consequence of dense language.","D":"'Similarly' marks likeness, which is not the relationship here.","B":"'For example' introduces an illustration, but this sentence paraphrases the claim rather than giving an instance."},"choices":{"C":"Consequently","D":"Similarly","B":"For example","A":"Put simply"},"id":"u3-l1-f2-08","target_family":"Yanlış alt tür","correct":"A","lesson":1,"choice_families":{"D":"İlgisiz geçiş","C":"Sebep sonuç ters","B":"Yanlış alt tür"}},{"choice_families":{"A":"Yanlış alt tür","C":"Ters yön","D":"Sebep sonuç ters"},"id":"u3-l1-f2-09","target_family":"Yanlış alt tür","correct":"B","lesson":1,"unit":3,"stem":"Which choice completes the text with the most logical transition?","why_correct":"On-site childcare is another retention measure added to the list, so an addition transition fits.","why_wrong":{"A":"'For example' would make childcare an illustration of raising salaries, but it is a separate measure.","C":"'However' signals contrast, but the sentence continues the same effort.","D":"'Therefore' signals a result, which this added measure is not."},"choices":{"D":"Therefore","C":"However","B":"In addition","A":"For example"},"passage":"The startup tried several ways to keep its employees. It raised salaries and offered flexible hours. ______, it began providing free childcare on site.","lesson_name":"Transitions"},{"correct":"C","lesson":1,"id":"u3-l1-f2-10","target_family":"Yanlış alt tür","choice_families":{"D":"İlgisiz geçiş","B":"Yanlış alt tür","A":"Ters yön"},"lesson_name":"Transitions","passage":"The argument runs through many pages of statistics and qualifications. ______, it boils down to a single warning: act now or lose the chance.","why_wrong":{"D":"'Meanwhile' marks simultaneity, which is not the relationship here.","B":"'For example' introduces an illustration, but this sentence sums up rather than exemplifies.","A":"'However' signals contrast, but the sentence distills rather than opposes."},"why_correct":"The second sentence condenses the long argument into its core, so a summary transition fits.","choices":{"A":"However","B":"For example","C":"In essence","D":"Meanwhile"},"unit":3,"stem":"Which choice completes the text with the most logical transition?"},{"target_family":"Sebep sonuç ters","id":"u3-l1-f3-01","why_wrong":{"D":"'For example' introduces an illustration, which the flood is not.","A":"'However' signals contrast, but the flood follows from the rain rather than opposing it.","B":"This phrasing treats the flood as the cause of the rain, reversing the real order; the rain caused the flood, not the reverse."},"why_correct":"The flooding is the consequence of the heavy rain, so a result transition fits, with cause before effect.","unit":3,"stem":"Which choice completes the text with the most logical transition?","lesson":1,"correct":"C","choice_families":{"A":"Ters yön","B":"Sebep sonuç ters","D":"Yanlış alt tür"},"lesson_name":"Transitions","passage":"Heavy rain fell across the valley for three straight days. ______, the river burst its banks and flooded the low-lying farms.","choices":{"B":"For this reason the rain fell, since","A":"However","D":"For example","C":"As a result"}},{"choice_families":{"C":"Ters yön","A":"Yanlış alt tür","B":"Sebep sonuç ters"},"correct":"D","lesson":1,"id":"u3-l1-f3-02","target_family":"Sebep sonuç ters","why_correct":"The emissions drop is the effect of switching to renewables, so a result transition fits, with cause before effect.","why_wrong":{"A":"'For instance' introduces an example, which the drop is not.","B":"This makes the emissions drop the reason for the switch, reversing the order; the switch caused the drop, not the reverse.","C":"'Nevertheless' signals contrast, but the drop follows from the switch."},"choices":{"D":"Consequently","C":"Nevertheless","B":"That drop is why the factory switched, as","A":"For instance"},"stem":"Which choice completes the text with the most logical transition?","unit":3,"lesson_name":"Transitions","passage":"The factory switched to renewable power last year. ______, its carbon emissions dropped by nearly half."},{"passage":"The team practiced together for months before the tournament. ______, their coordination on the court was seamless.","lesson_name":"Transitions","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_wrong":{"B":"This treats the seamless play as the cause of the practice, reversing the order; practice produced the coordination, not the reverse.","D":"'In other words' restates a point, which this is not.","C":"'In contrast' signals opposition, but the coordination follows from the practice."},"why_correct":"The seamless coordination results from months of practice, so a result transition fits, with cause before effect.","choices":{"D":"In other words","C":"In contrast","B":"The seamless play is what led them to practice, because","A":"Thus"},"id":"u3-l1-f3-03","target_family":"Sebep sonuç ters","correct":"A","lesson":1,"choice_families":{"D":"Yanlış alt tür","C":"Ters yön","B":"Sebep sonuç ters"}},{"choice_families":{"C":"Ters yön","D":"Yanlış alt tür","A":"Sebep sonuç ters"},"id":"u3-l1-f3-04","target_family":"Sebep sonuç ters","correct":"B","lesson":1,"unit":3,"stem":"Which choice completes the text with the most logical transition?","why_correct":"The easily started fire is a consequence of the dry conditions, so a result transition fits, with cause before effect.","why_wrong":{"C":"'However' signals contrast, but the fire risk follows from the drought.","D":"'For example' introduces an illustration, which this is not.","A":"This makes the wildfire the cause of the drought, reversing the order; the drought enabled the fire, not the reverse."},"choices":{"D":"For example","C":"However","B":"As a result","A":"The wildfire is why the drought set in, since"},"passage":"A long drought dried out the forest floor over the summer. ______, even a small spark was enough to start a fast-moving wildfire.","lesson_name":"Transitions"},{"choice_families":{"D":"Yanlış alt tür","A":"Ters yön","B":"Sebep sonuç ters"},"lesson":1,"correct":"C","target_family":"Sebep sonuç ters","id":"u3-l1-f3-05","choices":{"C":"Consequently","D":"For instance","A":"Still","B":"That rise in traffic is why it moved, as"},"why_wrong":{"D":"'For instance' introduces an example, which this is not.","B":"This treats the traffic rise as the reason for the move, reversing the order; the move caused the rise, not the reverse.","A":"'Still' signals contrast, but the traffic rise follows from the move."},"why_correct":"The rise in foot traffic is the effect of the move, so a result transition fits, with cause before effect.","unit":3,"stem":"Which choice completes the text with the most logical transition?","lesson_name":"Transitions","passage":"The store moved to a busy corner near the train station. ______, its foot traffic more than doubled within a month."},{"choice_families":{"C":"Ters yön","A":"Yanlış alt tür","B":"Sebep sonuç ters"},"target_family":"Sebep sonuç ters","id":"u3-l1-f3-06","lesson":1,"correct":"D","unit":3,"stem":"Which choice completes the text with the most logical transition?","choices":{"B":"Those low case numbers brought the vaccine, because","A":"In short","D":"As a result","C":"Nevertheless"},"why_wrong":{"A":"'In short' introduces a summary, which this is not.","B":"This makes the low case numbers the cause of the vaccine's arrival, reversing the order; the vaccine reduced cases, not the reverse.","C":"'Nevertheless' signals contrast, but the drop follows from the vaccine."},"why_correct":"The drop in cases results from the vaccine's arrival, so a result transition fits, with cause before effect.","passage":"The new vaccine reached remote villages for the first time this year. ______, cases of the disease there fell to record lows.","lesson_name":"Transitions"},{"why_wrong":{"B":"This treats the breakdown as the cause of the ignored warnings, reversing the order; ignoring the warnings led to the breakdown, not the reverse.","D":"'Similarly' marks likeness, which is not the relationship here.","C":"'However' signals contrast, but the breakdown follows from the neglect."},"why_correct":"The breakdown is the consequence of ignoring the warnings, so a result transition fits, with cause before effect.","stem":"Which choice completes the text with the most logical transition?","unit":3,"target_family":"Sebep sonuç ters","id":"u3-l1-f3-07","choices":{"D":"Similarly","C":"However","A":"Consequently","B":"The breakdown is why the warnings were ignored, since"},"lesson_name":"Transitions","passage":"The company ignored years of warnings about its aging equipment. ______, a major breakdown finally shut the plant for weeks.","choice_families":{"D":"İlgisiz geçiş","C":"Ters yön","B":"Sebep sonuç ters"},"lesson":1,"correct":"A"},{"choice_families":{"A":"Sebep sonuç ters","D":"Yanlış alt tür","C":"Ters yön"},"lesson":1,"correct":"B","choices":{"C":"Yet","D":"For example","A":"The fish leaving is what warmed the water, because","B":"Thus"},"passage":"Warm ocean water flowed into the bay all summer. ______, the fish that need cold water moved farther offshore.","lesson_name":"Transitions","target_family":"Sebep sonuç ters","id":"u3-l1-f3-08","stem":"Which choice completes the text with the most logical transition?","unit":3,"why_correct":"The fish moving offshore results from the warm water, so a result transition fits, with cause before effect.","why_wrong":{"C":"'Yet' signals contrast, but the fish's move follows from the warming.","D":"'For example' introduces an illustration, which this is not.","A":"This makes the fish leaving the cause of the warming, reversing the order; the warm water drove the fish away, not the reverse."}},{"why_correct":"The rise in evening use is the effect of longer hours, so a result transition fits, with cause before effect.","why_wrong":{"B":"This treats the late-night use as the cause of the schedule change, reversing the order; the longer hours caused the use, not the reverse.","A":"'However' signals contrast, but the use follows from the longer hours.","D":"'In other words' restates a point, which this is not."},"unit":3,"stem":"Which choice completes the text with the most logical transition?","target_family":"Sebep sonuç ters","id":"u3-l1-f3-09","choices":{"B":"That late-night use is why the hours changed, as","A":"However","D":"In other words","C":"As a result"},"lesson_name":"Transitions","passage":"The library extended its opening hours into the late evening. ______, student use of its study rooms rose sharply after dark.","choice_families":{"D":"Yanlış alt tür","B":"Sebep sonuç ters","A":"Ters yön"},"lesson":1,"correct":"C"},{"choice_families":{"C":"Ters yön","A":"Yanlış alt tür","B":"Sebep sonuç ters"},"target_family":"Sebep sonuç ters","id":"u3-l1-f3-10","lesson":1,"correct":"D","unit":3,"stem":"Which choice completes the text with the most logical transition?","choices":{"A":"For instance","B":"The rich harvest is why the ash fell, since","D":"Consequently","C":"Nevertheless"},"why_correct":"The rich harvest results from the mineral-laden ash, so a result transition fits, with cause before effect.","why_wrong":{"B":"This makes the harvest the cause of the ashfall, reversing the order; the ash enriched the soil, not the reverse.","A":"'For instance' introduces an example, which this is not.","C":"'Nevertheless' signals contrast, but the harvest follows from the ash."},"passage":"A thick layer of ash settled over the fields after the eruption. ______, the following season's harvest was the richest in memory.","lesson_name":"Transitions"},{"choices":{"D":"Next","C":"In contrast","B":"Similarly","A":"For example"},"lesson_name":"Transitions","passage":"The first phase of the project focused on gathering data from local farms. ______, the second phase turned to analyzing that data for patterns.","choice_families":{"B":"İlgisiz geçiş","A":"Yanlış alt tür","C":"Ters yön"},"lesson":1,"correct":"D","why_wrong":{"C":"'In contrast' signals opposition, but the phases follow in sequence rather than conflict.","A":"'For example' introduces an illustration, which the second phase is not.","B":"'Similarly' marks likeness, but the sentences describe successive stages, not similar ones."},"why_correct":"The two phases follow one another in order, so a sequence transition fits.","unit":3,"stem":"Which choice completes the text with the most logical transition?","target_family":"İlgisiz geçiş","id":"u3-l1-f4-01"},{"choice_families":{"C":"Ters yön","D":"Yanlış alt tür","B":"İlgisiz geçiş"},"target_family":"İlgisiz geçiş","id":"u3-l1-f4-02","lesson":1,"correct":"A","unit":3,"stem":"Which choice completes the text with the most logical transition?","choices":{"C":"However","D":"In other words","B":"Likewise","A":"Then"},"why_wrong":{"C":"'However' signals contrast, but the outdoor test follows naturally from the lab test.","D":"'In other words' restates a point, which this is not.","B":"'Likewise' marks similarity, but the sentences describe consecutive steps, not similar ones."},"why_correct":"Moving outdoors is the next step after lab testing, so a sequence transition fits.","passage":"The engineers finished testing the prototype in the lab. ______, they moved it outdoors to see how it performed in real weather.","lesson_name":"Transitions"},{"choice_families":{"C":"Ters yön","D":"Yanlış alt tür","A":"İlgisiz geçiş"},"lesson":1,"correct":"B","choices":{"A":"Similarly","B":"Afterward","D":"For instance","C":"Nevertheless"},"passage":"The recipe calls for chilling the dough for an hour. ______, you roll it out and cut it into shapes before baking.","lesson_name":"Transitions","target_family":"İlgisiz geçiş","id":"u3-l1-f4-03","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_wrong":{"D":"'For instance' introduces an example, which this step is not.","C":"'Nevertheless' signals contrast, but the rolling step follows the chilling naturally.","A":"'Similarly' marks likeness, but the steps follow one another rather than resembling each other."},"why_correct":"Rolling out the dough comes after chilling, so a sequence transition fits."},{"why_wrong":{"A":"'However' signals contrast, but the sentence stresses their shared role.","B":"'Meanwhile' marks simultaneous events, but the sentence compares the two species rather than timing them.","D":"'For example' introduces an illustration, but the sentence generalizes across both animals rather than giving one instance."},"why_correct":"The sentence draws a likeness between the two animals' roles, so a similarity transition fits.","unit":3,"stem":"Which choice completes the text with the most logical transition?","id":"u3-l1-f4-04","target_family":"İlgisiz geçiş","lesson_name":"Transitions","passage":"Sea otters and beavers both shape the habitats around them. ______, each is considered a keystone species whose loss would transform its ecosystem.","choices":{"D":"For example","C":"Similarly","B":"Meanwhile","A":"However"},"correct":"C","lesson":1,"choice_families":{"D":"Yanlış alt tür","A":"Ters yön","B":"İlgisiz geçiş"}},{"unit":3,"stem":"Which choice completes the text with the most logical transition?","choices":{"C":"In short","D":"By comparison","B":"Therefore","A":"As a result"},"why_wrong":{"B":"'Therefore' signals a result, but the southern trail is not a consequence of the northern one.","A":"'As a result' signals a consequence, which the second trail is not.","C":"'In short' introduces a summary, but the sentence compares rather than sums up."},"why_correct":"The sentence sets the two trails side by side to compare them, so a comparison transition fits.","passage":"The northern trail climbs steeply through rocky terrain to the summit. ______, the southern trail winds gently through meadows to reach the same peak.","lesson_name":"Transitions","choice_families":{"B":"İlgisiz geçiş","A":"Sebep sonuç ters","C":"Yanlış alt tür"},"target_family":"İlgisiz geçiş","id":"u3-l1-f4-05","lesson":1,"correct":"D"},{"id":"u3-l1-f4-06","target_family":"İlgisiz geçiş","unit":3,"stem":"Which choice completes the text with the most logical transition?","why_wrong":{"C":"'Therefore' signals a result, but the conductor's waiting is not a consequence of the tuning.","D":"'For example' introduces an illustration, which this is not.","B":"'Similarly' marks likeness, but the sentence describes two different things happening at once, not similar ones."},"why_correct":"The two actions happen at the same time in different places, so a simultaneity transition fits.","correct":"A","lesson":1,"choice_families":{"B":"İlgisiz geçiş","C":"Sebep sonuç ters","D":"Yanlış alt tür"},"passage":"The orchestra tuned their instruments as the hall filled with people. ______, the conductor waited backstage, reviewing the score one last time.","lesson_name":"Transitions","choices":{"B":"Similarly","A":"Meanwhile","D":"For example","C":"Therefore"}},{"why_wrong":{"A":"'Likewise' marks similarity, but the sentence moves to the next stage rather than a parallel one.","D":"'For instance' introduces an example, which this step is not.","C":"'However' signals contrast, but the grouping step follows the brainstorming naturally."},"why_correct":"The sentence marks the next step in an ordered process, so a sequence transition fits.","unit":3,"stem":"Which choice completes the text with the most logical transition?","target_family":"İlgisiz geçiş","id":"u3-l1-f4-07","lesson_name":"Transitions","passage":"First, the students brainstormed as many ideas as they could without judging them. ______, they grouped the ideas and chose the three strongest to develop.","choices":{"B":"Second","A":"Likewise","D":"For instance","C":"However"},"lesson":1,"correct":"B","choice_families":{"D":"Yanlış alt tür","C":"Ters yön","A":"İlgisiz geçiş"}},{"unit":3,"stem":"Which choice completes the text with the most logical transition?","why_wrong":{"D":"'Therefore' signals a result, which this shared trait is not.","B":"'Meanwhile' marks simultaneity, but the sentence compares the two sources rather than timing them.","A":"'However' signals contrast, but the sentence stresses what they share."},"why_correct":"The sentence adds a further shared trait of the two sources, drawing a parallel, so a similarity transition fits.","target_family":"İlgisiz geçiş","id":"u3-l1-f4-08","choices":{"B":"Meanwhile","A":"However","C":"Likewise","D":"Therefore"},"passage":"Solar power and wind power both draw energy from natural, renewable sources. ______, both produce electricity without burning fuel or releasing carbon.","lesson_name":"Transitions","choice_families":{"D":"Sebep sonuç ters","B":"İlgisiz geçiş","A":"Ters yön"},"lesson":1,"correct":"C"},{"choices":{"D":"Meanwhile","C":"As a result","A":"In other words","B":"Similarly"},"passage":"The crew loaded the supplies onto the ship through the morning. ______, the captain reviewed the route with the navigation officer on the bridge.","lesson_name":"Transitions","choice_families":{"B":"İlgisiz geçiş","A":"Yanlış alt tür","C":"Sebep sonuç ters"},"correct":"D","lesson":1,"stem":"Which choice completes the text with the most logical transition?","unit":3,"why_wrong":{"B":"'Similarly' marks likeness, but the sentence describes two different tasks happening at once.","A":"'In other words' restates a point, which this is not.","C":"'As a result' signals a consequence, but the captain's review is not caused by the loading."},"why_correct":"The two activities occur at the same time in different places, so a simultaneity transition fits.","id":"u3-l1-f4-09","target_family":"İlgisiz geçiş"},{"lesson":1,"correct":"A","choice_families":{"B":"İlgisiz geçiş","C":"Sebep sonuç ters","D":"Yanlış alt tür"},"lesson_name":"Transitions","passage":"A paper map never loses signal and needs no battery to work. ______, a phone's map updates in real time and can reroute you around traffic.","choices":{"A":"By contrast","B":"Meanwhile","D":"In short","C":"Therefore"},"target_family":"İlgisiz geçiş","id":"u3-l1-f4-10","why_correct":"The sentence sets the phone map against the paper map to contrast their strengths, so a contrast transition fits.","why_wrong":{"D":"'In short' introduces a summary, but the sentence contrasts rather than sums up.","C":"'Therefore' signals a result, but the phone map is not a consequence of the paper map.","B":"'Meanwhile' marks simultaneity, but the sentence compares the two tools rather than timing them."},"unit":3,"stem":"Which choice completes the text with the most logical transition?"}],"families":["Ters yön","Yanlış alt tür","Sebep sonuç ters","İlgisiz geçiş"],"name":"Transitions","main_ids":["u3-l1-f1-01","u3-l1-f2-01","u3-l1-f3-01","u3-l1-f4-01"],"fam_short":{"Yanlış alt tür":"Yanlış tür","İlgisiz geçiş":"İlgisiz","Sebep sonuç ters":"Sebep/sonuç","Ters yön":"Ters yön"},"teaching":{"alt_konular_baslik":"Geçiş türleri","alt_konular_intro":"Transitions soruları bir boşluğa doğru geçiş kelimesini (however, therefore, for example...) koymanı ister. Doğru cevap asla 'kulağa hoş gelen' değil, boşluğun İKİ tarafındaki cümleler arasındaki mantıksal ilişkiyi doğru adlandırandır. Bu yüzden önce ilişkiyi belirle, sonra o ilişkiye ait geçiş ailesini seç. Aşağıda dört temel aile var.","karar_proseduru":["GEÇİŞ KELİMESİNE HENÜZ BAKMA. Önce iki cümleyi oku, arasındaki ilişkiyi kendi kelimenle söyle.  İkinci cümle birinciyle çelişiyor mu, onu mu sonuçlandırıyor, örnek mi veriyor, ekliyor mu.","İlişkiyi bir kategoriye koy.  Zıtlık mi, sonuç mu, ekleme mi, örnek mi, açıklama mi. Önce kategoriyi bul.","O kategoriye uyan geçişi ara.  Zıtlık ise however, yet, nevertheless. Sonuç ise therefore, thus. Ekleme ise moreover, in addition. Örnek ise for example.","Yönü iki kez kontrol et.  En sık hata: zıtlık gerekirken sonuç bağlacı koymak. İkinci cümle birinciyle ÇELİŞİYORSA geçiş de zıtlık olmalı.","Seçilen geçişi cümleye koy ve oku.  Mantık akıyor mu. Akmıyorsa yanlış kategoridesin."],"alt_konular":[{"baslik":"1) Ekleme ve örnekleme (addition / example)","govde":["İkinci cümle birinciyi DESTEKLİYOR, genişletiyor ya da örnekliyorsa bu aile devrededir: moreover, in addition, furthermore, for example, for instance.","Ayrım önemli: 'for example / for instance' somut bir örnek gelirken; 'moreover / furthermore' aynı yönde YENİ bir nokta eklenirken kullanılır. Cümle örnek mi veriyor, yoksa yeni bir sav mı ekliyor, karar ver.","Tuzak: iki cümle aynı yöndeyken zıtlık geçişi (however) seçmek. İlişkinin yönünü yanlış okumak bu ailenin klasik hatasıdır."],"kural":"İki cümle aynı yöndeyse ekleme; ikinci cümle birincinin somut hâliyse örnekleme geçişi kullan."},{"baslik":"2) Zıtlık ve karşıtlık (contrast)","ornek":"\"Deney kusursuz planlanmıştı; ______, sonuçlar beklentiyi karşılamadı.\" → however / yet.","govde":["İkinci cümle birinciyle ÇELİŞİYOR ya da onu sınırlıyorsa: however, in contrast, on the other hand, nevertheless, yet, still.","Bu ailenin işareti, iki cümle arasında beklentiyle gerçeğin çatışmasıdır. 'X doğruydu; ancak Y' kalıbı görürsün. Boşluğun iki tarafını 'ama' ile bağlayabiliyorsan bu ailedesin.","'Nevertheless' ile 'however' çoğu zaman aynıdır; ama 'nevertheless' özellikle 'buna rağmen' anlamı taşıyan, önceki cümleye rağmen sonucun değişmediği durumlarda güçlüdür."]},{"baslik":"3) Sebep, sonuç ve çıkarım (cause / result)","kural":"Boşluktan sonraki cümle bir öncekinin sonucu/çıkarımıysa therefore/thus/as a result kullan.","govde":["İkinci cümle birincinin SONUCU ya da mantıksal çıkarımıysa: therefore, thus, as a result, consequently, hence.","Yön kontrolü: sebep önce, sonuç sonra gelmeli. Boşluk sonuç cümlesinin başındaysa bu aile doğrudur. 'Because' ise ters kurar (sonuç önce, sebep sonra) ve genelde geçiş kelimesi olarak boşlukta değil cümle içinde çıkar.","Tuzak: aslında sadece 'ekleme' olan iki cümleye 'therefore' koymak. Sonuç ilişkisi gerçekten var mı diye test et: birinci cümle ikinciyi ZORUNLU kılıyor mu?"]},{"govde":["Olaylar ya da adımlar bir DÜZEN içinde ilerliyorsa: first, next, then, finally, meanwhile, subsequently.","Bu aile çoğunlukla süreç ya da anlatı metinlerinde çıkar. Boşluk bir adımdan diğerine geçişi işaretliyorsa devrededir.","Yöntem her ailede aynı: boşluğun iki tarafını oku, ilişkiyi bir kelimeyle adlandır (ekleme mi, zıtlık mı, sonuç mu, sıra mı), sonra o ailenin seçeneğini seç. Geçiş kelimesini kulakla değil, ilişkiyle seç."],"baslik":"4) Sıra ve zaman (sequence / time)"}],"top_tips":["Önce ilişkiyi kendi kelimenle söyle, sonra seçeneklere bak. Geçiş kelimesinden bakarsan tanıdık olanı seçersin, mantığı değil.","En sık tuzak ters yön. İki cümle çelişiyorsa (biri olumlu biri olumsuz sonuç) geçiş MUTLAKA zıtlık olmalı. therefore görünce dur, gerçekten sonuç mu diye sor.","however ile therefore birbirinin tersi. Biri doğruysa öteki kesin yanlış. İki cümlenin çelişip çelişmediğine bak.","for example koymadan önce sor: ikinci cümle birincinin ÖRNEĞİ mi, yoksa SONUCU ya da EKLEMESİ mi. Örnek değilse for example yanlıştır."],"strateji":["Geçiş kelimesine bakmadan iki cümle arasındaki ilişkiyi kendi kelimenle söyle.","İlişkiyi kategoriye koy: zıtlık, sonuç, ekleme, örnek, açıklama.","O kategoriye uyan geçişi ara.","Yönü iki kez kontrol et, ters yön en sık hata.","Seçtiğin geçişi cümleye koyup oku, mantık akıyor mu bak."],"sik_hatalar":[{"cozum":"İki cümle çelişiyorsa geçiş zıtlık olmalı. therefore görünce dur, gerçekten sonuç mu diye sor.","hata":"Ters yön seçmek"},{"hata":"Ekleme ile örnek karıştırmak","cozum":"for example koymadan önce sor: ikinci cümle birincinin ÖRNEĞİ mi, yoksa ayrı bir EKLEME mi."},{"hata":"Sebep sonucu ters kurmak","cozum":"Neden mi sonuç mu, ok yönünü kontrol et. therefore sonuca, because nedene gider."},{"hata":"İlgisiz geçiş seçmek","cozum":"similarly benzerlik, meanwhile eş zamanlılık ister. Cümlede o ilişki yoksa bu geçişler yanlıştır."},{"hata":"Öğrenci geçiş kelimesini boşluğa yerleştirdikten sonra sadece ikinci cümleyi okuyup 'akıyor mu' diye bakıyor, ilk cümleyle olan mantık ilişkisini test etmiyor.","cozum":"Önce iki cümlenin ilişkisini kendi cümlenle adlandır (zıtlık mı, sebep-sonuç mu, ekleme mi); ancak o etiketi karşılayan seçeneği seç."},{"hata":"Öğrenci seçenekleri anlam ailelerine ayırmadan tek tek deniyor ve benzer anlamlı iki seçenek arasında kararsız kalıyor.","cozum":"Seçenekleri önce gruplara ayır (zıtlık: however/nevertheless; sonuç: therefore/thus); yanlış grubu topluca ele, kalan grup içinde ince farkı incele."}],"cozumlu_ornekler":[{"correct":"A","adimlar":["İki cümleyi oku: birincide trafik düşecek bekleniyordu, ikincide trafik ARTTI.","İlişki: ikinci cümle birinciyle çelişiyor. Beklenen olmadı.","Çelişki zıtlık geçişi ister. However doğru.","Therefore sonuç bağlacı, yanlış yön. For example örnek, değil. Meanwhile eş zamanlılık, değil."],"passage":"The new policy was expected to cut the city's traffic sharply. ______, congestion in the downtown core actually rose in the months after it took effect.","sonuc":"İki cümle çelişiyorsa geçiş MUTLAKA zıtlık olmalı. actually kelimesi de çelişkiyi işaret ediyordu.","choices":{"A":"However","B":"Therefore","C":"For example","D":"Meanwhile"},"stem":"Which choice completes the text with the most logical transition?"},{"adimlar":["İki cümleyi oku: birincide yatırımlar sayılıyor, ikincide bir yatırım daha ekleniyor.","İlişki: ekleme. Streetlight bir örnek değil, listeye eklenen ayrı bir yatırım.","In addition ekleme geçişi, doğru.","For example bunu örnek yapar, yanlış alt tür. However zıtlık, değil. Therefore sonuç, değil."],"correct":"A","passage":"The city has invested heavily in public transit. It expanded the subway, added bus routes, and built bike lanes. ______, it installed hundreds of new streetlights to improve night safety.","choices":{"C":"However","D":"Therefore","B":"For example","A":"In addition"},"sonuc":"Ekleme ile örnek karıştırılmamalı. Streetlight önceki maddelerin örneği değil, listeye eklenen yeni bir şey.","stem":"Which choice completes the text with the most logical transition?"},{"passage":"The city council initially rejected the proposal to build a new bike lane, citing concerns about reduced parking. ______ after a six-month study showed that bike lanes increased foot traffic to local shops, the council reversed its decision.","adimlar":["İlk cümle: konsey öneriyi REDDETTİ (park kaygısı yüzünden).","İkinci cümle: konsey kararını GERİ ALDI (çalışma olumlu çıktığı için).","İki cümle arasında red -> geri alma yönünde bir ZITLIK/dönüş var.","Zıtlık gösteren tek seçenek 'However'; 'For example' örnek, 'Likewise' benzerlik, 'In addition' ekleme gösterir."],"correct":"B","stem":"Which choice completes the text with the most logical transition?","choices":{"C":"Likewise,","D":"In addition,","B":"However,","A":"For example,"},"sonuc":"Doğru cevap B. İki cümle arasındaki fikir dönüşünü yalnızca zıtlık bağlacı 'However' karşılar."},{"stem":"Which choice completes the text with the most logical transition?","sonuc":"Doğru cevap B. Engellere karşın gelen başarı, ödün bildiren 'Nonetheless' ile bağlanır.","choices":{"B":"Nonetheless,","A":"Consequently,","C":"Therefore,","D":"For instance,"},"passage":"Marie Curie faced significant barriers as a woman in early twentieth-century science, often being denied laboratory access granted to her male colleagues. ______ she persisted, eventually becoming the first person to win Nobel Prizes in two different scientific fields.","correct":"B","adimlar":["İlk cümle: Curie ciddi ENGELLERLE karşılaştı (laboratuvara erişimi reddedildi).","İkinci cümle: buna rağmen DİRENDİ ve iki alanda Nobel kazandı.","Engel var ama başarı geldi: beklenene AYKIRI bir sonuç, yani ödün/zıtlık ilişkisi.","'Consequently' ve 'Therefore' sebep-sonuç, 'For instance' örnek verir; sadece 'Nonetheless' 'buna rağmen' anlamını taşır."]},{"correct":"C","adimlar":["İlk cümle: deney çok hassas sıcaklık kontrolü gerektiriyor; küçük dalgalanma numuneleri bozar (bir PROBLEM/ihtiyaç).","İkinci cümle: araştırmacılar yedek soğutma sistemi kurdu (bu ihtiyaca verilen YANIT).","İhtiyaç -> alınan önlem: neden-sonuç ilişkisi kuruluyor.","'In contrast' ve 'Nevertheless' zıtlık, 'Similarly' benzerlik gösterir; sebep-sonuç için doğru olan 'Therefore'."],"passage":"The experiment required precise temperature control; even a two-degree fluctuation could ruin the crystal samples. ______ the researchers installed a redundant cooling system that would activate automatically if the primary unit failed.","sonuc":"Doğru cevap C. Hassasiyet ihtiyacı önlemi doğurduğu için sonuç bağlacı 'Therefore' gerekir.","choices":{"C":"Therefore,","D":"Similarly,","A":"In contrast,","B":"Nevertheless,"},"stem":"Which choice completes the text with the most logical transition?"},{"passage":"The novel's first half unfolds slowly, dwelling on the protagonist's quiet daily routines and inner doubts. The second half, ______ accelerates into a series of rapid confrontations that resolve every lingering question.","correct":"A","adimlar":["İlk cümle: romanın ilk yarısı YAVAŞ ilerliyor (durgun rutinler).","İkinci cümle: ikinci yarı HIZLANIYOR (art arda çatışmalar).","İki yarı yan yana konup FARKLILIKLARI vurgulanıyor; bu bir karşılaştırma/kontrast.","'As a result' sonuç, 'For example' örnek, 'In conclusion' özet bildirir; iki bölümü kıyaslayan tek seçenek 'by comparison'."],"stem":"Which choice completes the text with the most logical transition?","sonuc":"Doğru cevap A. İki bölümün hız farkı karşılaştırıldığı için 'by comparison' en mantıklı geçiştir.","choices":{"D":"in conclusion,","C":"for example,","A":"by comparison,","B":"as a result,"}}],"celdirici_aileleri":[{"tanim":"Geçiş doğru olanın TERSİ yönü gösterir. İki cümle çelişiyorken sonuç bağlacı (therefore) koyar, ya da sonuç gerekirken zıtlık (however) koyar. En sık ve en ölümcül tuzak.","ad":"Ters yön"},{"tanim":"Geçiş genel yönü doğru ama YANLIŞ alt türü. Ekleme gerekirken örnek (for example) koyar, ya da sonuç gerekirken açıklama (in other words). Yön yakın ama tür yanlış.","ad":"Yanlış alt tür"},{"tanim":"Neden ile sonuç yer değiştirir. İkinci cümle birincinin Sebebiyken sonuç gibi bağlar, ya da tam tersi. Ok yönü ters çevrilmiştir.","ad":"Sebep sonuç ters"},{"ad":"İlgisiz geçiş","tanim":"Geçişin anlamı iki cümleye HİÇ uymaz. Benzerlik yokken similarly, sıralama yokken meanwhile koyar. Tanıdık kelime ama yanlış ilişki."},{"ad":"Sözcük tanıdık ama yön yanlış","tanim":"Seçenek gerçek bir geçiş kelimesidir ('therefore', 'however') ama iki cümle arasındaki ilişkinin yönünü tersine çevirir; öğrenci kelimeyi tanıdığı için doğru sanır."},{"ad":"Örnek-sanma tuzağı","tanim":"İkinci cümle aslında yeni bir fikir eklerken ('in addition') ya da sonuç bildirirken, çeldirici 'for example' koyar; öğrenci ikinci cümleyi ilkinin örneği gibi okur."},{"tanim":"Cümleye takılınca kulağa doğal gelen ('meanwhile', 'in fact') fakat iki cümlenin mantıksal bağını kurmayan bir geçiş; öğrenci anlamı değil sesi test eder.","ad":"Kulağa akıcı gelen ama ilişkisiz bağlaç"}],"kavramsal_temel":["Transitions, iki cümle arasındaki MANTIK ilişkisini doğru adlandıran geçiş kelimesini seçmeni ister. Bu soru kelime bilgisi değil, mantık sorusudur.","Görev however, therefore, for example gibi kelimelerin anlamını bilmek değil, iki cümlenin BİRBİRİNE nasıl bağlı olduğunu görmektir. Geçiş kelimesi bu gerçek ilişkiyi yansıtmalı.","En sık ve en ölümcül tuzak ters yöndür: iki cümle çelişiyorken sonuç bağlacı (therefore) koymak, ya da sonuç gerekirken zıtlık (however) koymak. however ile therefore birbirinin tersidir, biri doğruysa öteki kesin yanlıştır.","Bu yüzden geçiş kelimesine bakmadan önce iki cümleyi oku ve aralarındaki ilişkiyi kendi kelimenle söyle. İkinci cümle birinciyle çelişiyor mu, onu mu sonuçlandırıyor, örnek mi veriyor.","Digital SAT'te geçiş soruları aslında bir okuma-anlama testidir, kelime bilgisi testi değildir. Boşluğa gelecek kelimeyi bulmadan önce iki cümle arasındaki mantıksal ilişkiyi çözmelisin: ikinci cümle birinciyi mi destekliyor, ona karşı mı çıkıyor, ondan bir sonuç mu çıkarıyor, yoksa bir örnek mi veriyor? Bu ilişki bir kez netleştiğinde doğru geçiş kelimesi neredeyse kendini seçtirir. Bu yüzden usta öğrenciler seçeneklere bakmadan önce boşluğa kendi Türkçe etiketlerini koyar ('ama', 'çünkü', 'örneğin', 'ayrıca') ve sonra bu etikete uyan İngilizce karşılığı seçenekler arasında ararlar.","Geçiş kelimeleri anlam ailelerine ayrılır ve bu aileleri tanımak sınavda hız kazandırır. Zıtlık ailesi (however, nevertheless, nonetheless, in contrast, on the other hand) bir fikrin yönünü tersine çevirir. Sebep-sonuç ailesi (therefore, thus, consequently, as a result) bir önermeden çıkarım yapar. Ekleme ailesi (moreover, furthermore, in addition, also) aynı yöndeki fikri güçlendirir. Örnekleme ailesi (for example, for instance) genel bir ifadeyi somutlaştırır. SAT çeldiricileri genellikle her aileden bir temsilci koyar; doğru aileyi belirleyip diğer üçünü topluca elediğinde, çoğu soruda geriye tek mantıklı seçenek kalır."],"ne_olculuyor":["İki cümle arasında bir boşluk vardır. Görev: iki cümle arasındaki mantık ilişkisini doğru adlandıran geçiş kelimesini seçmek.","Bu soru kelime bilgisi değil, MANTIK sorusudur. however, therefore, for example gibi kelimelerin ne anlama geldiğini değil, iki cümlenin BİRBİRİNE nasıl bağlı olduğunu ölçer.","Kritik nokta: geçiş kelimesi iki cümle arasındaki gerçek ilişkiyi yansıtmalı. Yanlış yönü ya da yanlış türü seçen öğrenci puanı kaybeder."]}},{"no":2,"questions":[{"choice_families":{"B":"Amacı karşılamıyor","C":"Amacı karşılamıyor","D":"Tek not sentez yok"},"lesson":2,"correct":"A","target_family":"Amacı karşılamıyor","id":"u3-l2-f1-01","choices":{"D":"The Aral Sea was once the fourth-largest lake in the world.","C":"The exposed seabed of the Aral Sea became a source of toxic dust storms.","B":"The rivers that had for decades fed the Aral Sea were diverted to irrigate the region's expanding cotton farms.","A":"Once the world's fourth-largest lake, the Aral Sea had shrunk to just a tenth of its original size by 2010."},"why_wrong":{"C":"This names a consequence, not the scale of the shrinkage.","D":"This states only the original size and never shows how much it shrank.","B":"This gives a cause of the shrinkage, accurate but not a statement of its scale."},"why_correct":"The goal is to emphasize the scale of shrinkage; A pairs the original rank with the tenth-size figure, showing the magnitude.","stem":"The student wants to emphasize the scale of the Aral Sea's shrinkage. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Aral Sea was once the fourth-largest lake in the world.\n- By 2010 it had shrunk to a tenth of its original size.\n- Rivers feeding it were diverted for cotton farming.\n- The exposed seabed became a source of toxic dust storms."},{"correct":"B","lesson":2,"choice_families":{"A":"Amacı karşılamıyor","C":"Tek not sentez yok","D":"Yanlış vurgu"},"passage":"While researching a topic, a student took the following notes:\n\n- Bioluminescence is the production of light by living organisms.\n- Many deep-sea fish use it to attract prey.\n- Fireflies use it to attract mates.\n- Some fungi glow to attract insects that spread their spores.","lesson_name":"Rhetorical Synthesis","choices":{"A":"Bioluminescence is the production of light by living organisms.","B":"Organisms use bioluminescence for different ends: deep-sea fish lure prey, fireflies attract mates, and some fungi draw spore-spreading insects.","D":"Bioluminescence can be found in fish, insects, and fungi alike.","C":"Many deep-sea fish use bioluminescence to attract prey."},"id":"u3-l2-f1-02","target_family":"Amacı karşılamıyor","unit":3,"stem":"The student wants to illustrate the variety of purposes bioluminescence serves. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_wrong":{"C":"This gives a single purpose in a single organism, not the variety.","D":"This emphasizes the range of organisms, not the range of purposes the goal asks for.","A":"This only defines the term and names no purpose at all."},"why_correct":"The goal is to show the variety of purposes; A lists three distinct purposes across three organisms."},{"choice_families":{"B":"Amacı karşılamıyor","A":"Amacı karşılamıyor","D":"Tek not sentez yok"},"lesson":2,"correct":"C","choices":{"C":"Where books had once been copied slowly by hand, their numbers rose enormously within decades of the press's arrival.","D":"Before the printing press, books were copied by hand, slowly and at great cost.","A":"The printing press was introduced to Europe around 1450.","B":"Literacy rates in Europe began to climb in the century after the press appeared."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The printing press was introduced to Europe around 1450.\n- Before it, books were copied by hand, slowly and at great cost.\n- After it, the number of books in Europe rose enormously within decades.\n- Literacy rates began to climb in the following century.","target_family":"Amacı karşılamıyor","id":"u3-l2-f1-03","why_correct":"The goal is to show the speed of change in book production; A contrasts slow hand-copying with the rapid rise in books after the press.","why_wrong":{"B":"This concerns literacy, a later effect, not the speed of change in book production.","A":"This gives only a date and shows no change.","D":"This describes only the earlier state without showing how quickly it changed."},"unit":3,"stem":"The student wants to highlight how quickly the press changed book production. Which choice most effectively uses relevant information from the notes to accomplish this goal?"},{"choices":{"B":"Honeybees communicate a food source's location to the hive through a special movement called the waggle dance.","A":"The waggle dance is one of the most studied behaviors in the insect world.","C":"Other bees follow the waggle dance's directions to reach the food source.","D":"In the waggle dance, the angle signals the food's direction and the duration signals its distance."},"why_wrong":{"C":"This describes what other bees do, not how the dance conveys information.","B":"This states that the dance communicates location but not how the information is encoded.","A":"This claim about how studied the dance is appears nowhere in the notes."},"why_correct":"The goal is to explain how specific information is conveyed; A names both variables (angle to direction, duration to distance).","stem":"The student wants to explain how the waggle dance conveys specific information. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Honeybees communicate the location of food through a 'waggle dance.'\n- The angle of the dance signals the direction of the food.\n- The duration of the dance signals the distance.\n- Other bees follow the directions to reach the source.","choice_families":{"B":"Amacı karşılamıyor","A":"Notta olmayan bilgi","C":"Amacı karşılamıyor"},"lesson":2,"correct":"D","target_family":"Amacı karşılamıyor","id":"u3-l2-f1-04"},{"why_wrong":{"B":"This emphasizes size and visibility, not biological richness.","D":"This concerns length, a measure of size rather than richness.","C":"This concerns visibility from space, unrelated to biological richness."},"why_correct":"The goal is biological richness; A combines the fish and coral species counts, both measures of life.","stem":"The student wants to emphasize the reef's biological richness. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"target_family":"Amacı karşılamıyor","id":"u3-l2-f1-05","choices":{"C":"The Great Barrier Reef can be seen from space.","D":"The Great Barrier Reef stretches over 2,300 kilometers.","B":"The Great Barrier Reef stretches over 2,300 kilometers and is so large that it can even be seen from space.","A":"The Great Barrier Reef supports more than 1,500 species of fish and around 400 species of coral."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Great Barrier Reef stretches over 2,300 kilometers.\n- It is home to more than 1,500 species of fish.\n- It can be seen from space.\n- It supports around 400 species of coral.","choice_families":{"B":"Yanlış vurgu","C":"Amacı karşılamıyor","D":"Amacı karşılamıyor"},"lesson":2,"correct":"A"},{"unit":3,"stem":"The student wants to explain why Venus is so hot despite not being the closest planet to the Sun. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_correct":"The goal asks why Venus is hot despite not being closest; A links the trapped heat to being hotter than closer Mercury.","why_wrong":{"C":"This gives only its position and no explanation.","D":"This names the atmosphere but does not connect it to the puzzle of Venus being hotter than Mercury.","A":"This states the temperature but never explains why, nor addresses the Mercury comparison."},"target_family":"Amacı karşılamıyor","id":"u3-l2-f1-06","choices":{"C":"Venus is the second planet from the Sun.","D":"Venus has a thick atmosphere made largely of carbon dioxide.","A":"Venus is the second planet from the Sun and averages about 465 degrees Celsius.","B":"Though Mercury sits closer to the Sun, Venus is hotter because its thick carbon-dioxide atmosphere traps heat."},"passage":"While researching a topic, a student took the following notes:\n\n- Venus is the second planet from the Sun.\n- Its surface temperature averages about 465 degrees Celsius.\n- A thick carbon-dioxide atmosphere traps heat.\n- It is hotter than Mercury, which is closer to the Sun.","lesson_name":"Rhetorical Synthesis","choice_families":{"A":"Amacı karşılamıyor","C":"Amacı karşılamıyor","D":"Tek not sentez yok"},"lesson":2,"correct":"B"},{"passage":"While researching a topic, a student took the following notes:\n\n- Jane Goodall began studying chimpanzees in Tanzania in 1960.\n- She observed them using stripped twigs to fish termites from mounds.\n- This was the first record of tool use by nonhuman animals.\n- The finding forced scientists to rethink the definition of humans as the only toolmakers.","lesson_name":"Rhetorical Synthesis","stem":"The student wants to explain the significance of Goodall's observation for science. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"choices":{"A":"Goodall observed chimpanzees using stripped twigs to fish termites from mounds.","B":"Jane Goodall began studying chimpanzees in Tanzania in 1960.","C":"Goodall's record of chimpanzees fishing for termites with twigs was the first evidence of animal tool use, forcing science to rethink humans as the only toolmakers.","D":"Goodall spent many years living among the chimpanzees she studied."},"why_wrong":{"D":"How long she lived among them appears nowhere in the notes.","B":"This gives only when she started, not the significance.","A":"This describes the observation alone without stating why it mattered."},"why_correct":"The goal is the significance for science; A links the observation to its status as a first and to the rethinking it forced.","target_family":"Amacı karşılamıyor","id":"u3-l2-f1-07","lesson":2,"correct":"C","choice_families":{"A":"Tek not sentez yok","B":"Amacı karşılamıyor","D":"Notta olmayan bilgi"}},{"choice_families":{"B":"Amacı karşılamıyor","A":"Tek not sentez yok","C":"Amacı karşılamıyor"},"target_family":"Amacı karşılamıyor","id":"u3-l2-f1-08","lesson":2,"correct":"D","stem":"The student wants to emphasize how much saltier the Dead Sea is than ordinary seawater. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"choices":{"B":"The Dead Sea's high salinity makes swimmers float easily on its surface.","A":"The Dead Sea has a salt content of about 34 percent.","C":"Almost no fish or plants can survive in the Dead Sea.","D":"At about 34 percent salt, the Dead Sea is nearly ten times as salty as ordinary seawater, which is around 3.5 percent."},"why_wrong":{"C":"This names another effect, not how much saltier the Dead Sea is.","A":"This gives only the Dead Sea's figure with nothing to compare it to.","B":"This names an effect of the salinity, not the comparison."},"why_correct":"The goal is a comparison of saltiness; A puts the two figures side by side to show the gap.","passage":"While researching a topic, a student took the following notes:\n\n- The Dead Sea has a salt content of about 34 percent.\n- Ordinary seawater is about 3.5 percent salt.\n- The high salinity makes swimmers float easily.\n- Almost no fish or plants can survive in it.","lesson_name":"Rhetorical Synthesis"},{"id":"u3-l2-f1-09","target_family":"Amacı karşılamıyor","correct":"A","lesson":2,"choice_families":{"C":"Amacı karşılamıyor","D":"Tek not sentez yok","B":"Amacı karşılamıyor"},"passage":"While researching a topic, a student took the following notes:\n\n- The Wright brothers made their first powered flight in 1903.\n- The flight lasted 12 seconds and covered 37 meters.\n- Within two years they were flying for over half an hour.\n- By 1908 they were demonstrating flights in Europe.","lesson_name":"Rhetorical Synthesis","unit":3,"stem":"The student wants to highlight how rapidly the brothers' flights improved. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_correct":"The goal is the speed of improvement; A contrasts the 12-second first flight with half-hour flights two years later.","why_wrong":{"B":"This notes the European demonstrations but shows no improvement over time.","C":"This gives only the starting date.","D":"This describes only the first flight without showing progress."},"choices":{"B":"By 1908 the Wright brothers were demonstrating their flights in Europe.","A":"From a first flight of just 12 seconds in 1903, the Wrights were flying for over half an hour within two years.","C":"The Wright brothers made their first powered flight in 1903.","D":"The Wright brothers' very first powered flight, in 1903, lasted just 12 seconds and covered only about 37 meters."}},{"id":"u3-l2-f1-10","target_family":"Amacı karşılamıyor","unit":3,"stem":"The student wants to explain how the octopus's circulatory system works. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_correct":"The goal is how the circulatory system works; A explains the role of each of the three hearts.","why_wrong":{"C":"This concerns color change, unrelated to circulation.","D":"This states the number of hearts but not how they function.","A":"This concerns blood color and chemistry, not how the system pumps."},"choice_families":{"A":"Amacı karşılamıyor","C":"Amacı karşılamıyor","D":"Tek not sentez yok"},"correct":"B","lesson":2,"choices":{"A":"The blood of an octopus appears blue because it relies on copper to carry oxygen all throughout its body.","B":"An octopus has three hearts: two pump blood through the gills while the third pumps it through the body.","D":"An octopus has three hearts.","C":"Octopuses can change color in a fraction of a second."},"passage":"While researching a topic, a student took the following notes:\n\n- Octopuses have three hearts.\n- Two pump blood through the gills; one pumps it through the body.\n- Their blood is blue because it uses copper to carry oxygen.\n- They can change color in a fraction of a second.","lesson_name":"Rhetorical Synthesis"},{"stem":"The student wants to compare how the two instruments are played. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"choices":{"D":"Both instruments produce sound from vibrating strings.","C":"Both the violin and the guitar are very common instruments in many different kinds of music all around the world today.","B":"While the violin is played with a bow drawn across its strings, the guitar is usually plucked with the fingers.","A":"The violin is played with a bow drawn across its strings."},"why_correct":"The goal is to compare how the two are played; A sets the bowing of the violin against the plucking of the guitar.","why_wrong":{"C":"This notes a shared trait but not how they are played.","D":"This notes another shared trait rather than contrasting playing methods.","A":"This describes only the violin, so it makes no comparison."},"passage":"While researching a topic, a student took the following notes:\n\n- The violin is played with a bow drawn across its strings.\n- The guitar is usually played by plucking its strings with the fingers.\n- Both instruments produce sound from vibrating strings.\n- Both are common in many kinds of music.","lesson_name":"Rhetorical Synthesis","choice_families":{"A":"Tek not sentez yok","C":"Amacı karşılamıyor","D":"Amacı karşılamıyor"},"target_family":"Tek not sentez yok","id":"u3-l2-f2-01","lesson":2,"correct":"B"},{"choice_families":{"D":"Yanlış vurgu","A":"Amacı karşılamıyor","B":"Tek not sentez yok"},"id":"u3-l2-f2-02","target_family":"Tek not sentez yok","correct":"C","lesson":2,"unit":3,"stem":"The student wants to contrast the flavor of the two bean types. Which choice most effectively uses relevant information from the notes to accomplish this goal?","why_correct":"The goal is to contrast flavor; A puts the mild Arabica against the bitter Robusta.","why_wrong":{"D":"This contrasts caffeine content rather than flavor, which the goal specifies.","B":"This gives only the Arabica flavor, with nothing to contrast.","A":"This notes where they grow, not their flavor."},"choices":{"A":"Both Arabica and Robusta are grown in tropical regions.","B":"Arabica coffee beans have a mild, sweet flavor.","D":"Arabica coffee beans contain noticeably less caffeine than the hardier, stronger Robusta beans do.","C":"Arabica beans have a mild, sweet flavor, whereas Robusta beans taste stronger and more bitter."},"passage":"While researching a topic, a student took the following notes:\n\n- Arabica coffee beans have a mild, sweet flavor.\n- Robusta beans have a stronger, more bitter taste.\n- Arabica contains less caffeine than Robusta.\n- Both are grown in tropical regions.","lesson_name":"Rhetorical Synthesis"},{"choice_families":{"B":"Tek not sentez yok","A":"Amacı karşılamıyor","C":"Amacı karşılamıyor"},"correct":"D","lesson":2,"choices":{"A":"Cartilage is lighter and more flexible than bone.","B":"Sharks have skeletons made entirely of cartilage.","D":"Unlike most fish, whose skeletons are made of bone, sharks have skeletons made entirely of cartilage.","C":"Sharks have existed for over 400 million years."},"passage":"While researching a topic, a student took the following notes:\n\n- Sharks have skeletons made entirely of cartilage.\n- Most other fish have skeletons made of bone.\n- Cartilage is lighter and more flexible than bone.\n- Sharks have existed for over 400 million years.","lesson_name":"Rhetorical Synthesis","id":"u3-l2-f2-03","target_family":"Tek not sentez yok","stem":"The student wants to compare shark skeletons with those of most other fish. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_wrong":{"C":"This concerns their age, not their skeletons.","A":"This describes cartilage in general without comparing the two groups of fish.","B":"This describes only sharks, so no comparison is drawn."},"why_correct":"The goal is a comparison of skeletons; A sets shark cartilage against the bone of most fish."},{"choice_families":{"D":"Yanlış vurgu","C":"Amacı karşılamıyor","B":"Tek not sentez yok"},"target_family":"Tek not sentez yok","id":"u3-l2-f2-04","lesson":2,"correct":"A","stem":"The student wants to contrast the supply of renewable energy with that of fossil fuels. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"choices":{"C":"Both renewable sources and fossil fuels are widely used to generate electricity in many countries around the world.","D":"Solar power produces no carbon emissions when generating electricity.","A":"Renewable sources such as solar do not run out, while fossil fuels are finite and will eventually be depleted.","B":"Renewable energy sources such as solar do not run out."},"why_wrong":{"D":"This emphasizes emissions rather than supply, which the goal specifies.","C":"This notes a shared use rather than a contrast in supply.","B":"This describes only renewables, so no contrast is made."},"why_correct":"The goal is to contrast supply; A sets the inexhaustible renewables against the finite fossil fuels.","passage":"While researching a topic, a student took the following notes:\n\n- Renewable energy sources such as solar do not run out.\n- Fossil fuels are finite and will eventually be depleted.\n- Solar power produces no carbon emissions when generating electricity.\n- Both are used to generate electricity worldwide.","lesson_name":"Rhetorical Synthesis"},{"stem":"The student wants to contrast the demands of marathon running and sprinting. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_correct":"The goal is to contrast the demands; A sets the paced hours of the marathon against the seconds of maximum sprinting.","why_wrong":{"D":"This gives only the sprint distances without contrasting the demands.","C":"This gives only the marathon distance.","A":"This describes only the marathon, so no contrast is drawn."},"choices":{"C":"The marathon covers 42.2 kilometers.","D":"The sprint events are contested over the short distances of 100, 200, and 400 meters on the running track.","B":"Marathon runners pace themselves over hours, whereas sprinters run at maximum effort for only seconds.","A":"Marathon runners pace themselves over hours."},"passage":"While researching a topic, a student took the following notes:\n\n- The marathon covers 42.2 kilometers.\n- The sprint events cover 100, 200, and 400 meters.\n- Marathon runners pace themselves over hours.\n- Sprinters run at maximum effort for seconds.","lesson_name":"Rhetorical Synthesis","choice_families":{"A":"Tek not sentez yok","C":"Amacı karşılamıyor","D":"Amacı karşılamıyor"},"id":"u3-l2-f2-05","target_family":"Tek not sentez yok","correct":"B","lesson":2},{"choice_families":{"D":"Yanlış vurgu","B":"Tek not sentez yok","A":"Yanlış vurgu"},"correct":"C","lesson":2,"choices":{"B":"Watercolor dries within minutes.","A":"Watercolor paints are transparent and blend softly.","D":"Oil paints are opaque and can be layered thickly.","C":"Watercolor dries within minutes, while oil paint can take days or even weeks."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Watercolor paints are transparent and blend softly.\n- Oil paints are opaque and can be layered thickly.\n- Watercolor dries within minutes.\n- Oil paint can take days or weeks to dry.","id":"u3-l2-f2-06","target_family":"Tek not sentez yok","why_correct":"The goal is to contrast drying times; A sets the minutes of watercolor against the days or weeks of oil.","why_wrong":{"A":"This contrasts transparency, not drying time.","B":"This gives only watercolor's drying time, with nothing to contrast.","D":"This describes oil's texture, not its drying time."},"stem":"The student wants to contrast the drying times of the two paints. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3},{"choice_families":{"C":"Amacı karşılamıyor","B":"Tek not sentez yok","A":"Amacı karşılamıyor"},"lesson":2,"correct":"D","choices":{"C":"Alligators are usually found in freshwater.","D":"Alligators have broad, rounded snouts, while crocodiles have narrower, more pointed ones.","B":"Alligators have broad, rounded snouts.","A":"Crocodiles are among the relatively few reptiles that can tolerate living in saltwater for long periods."},"passage":"While researching a topic, a student took the following notes:\n\n- Alligators have broad, rounded snouts.\n- Crocodiles have narrower, more pointed snouts.\n- Alligators are usually found in freshwater.\n- Crocodiles can tolerate saltwater.","lesson_name":"Rhetorical Synthesis","target_family":"Tek not sentez yok","id":"u3-l2-f2-07","stem":"The student wants to compare the snouts of alligators and crocodiles. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_wrong":{"B":"This describes only the alligator, so no comparison is made.","A":"This concerns saltwater tolerance, not snouts.","C":"This concerns habitat, not snouts."},"why_correct":"The goal is to compare snouts; A sets the rounded alligator snout against the pointed crocodile snout."},{"target_family":"Tek not sentez yok","id":"u3-l2-f2-08","lesson":2,"correct":"A","choice_families":{"C":"Amacı karşılamıyor","D":"Yanlış vurgu","B":"Yanlış vurgu"},"passage":"While researching a topic, a student took the following notes:\n\n- Paperback books are cheaper and lighter to carry.\n- Hardcover books are more durable and long-lasting.\n- Paperbacks are printed on thinner paper.\n- Hardcovers usually appear first when a book is released.","lesson_name":"Rhetorical Synthesis","unit":3,"stem":"The student wants to contrast the durability of paperbacks and hardcovers. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Paperbacks are lighter but less durable, whereas hardcovers are sturdier and last longer.","B":"Paperback books are cheaper and lighter to carry.","D":"Paperbacks are printed on thinner paper than hardcovers.","C":"Hardcovers usually appear first when a book is released."},"why_correct":"The goal is to contrast durability; A sets the less durable paperback against the sturdier hardcover.","why_wrong":{"C":"This concerns release timing, not durability.","D":"This emphasizes paper thickness, not durability directly.","B":"This emphasizes cost and weight rather than durability."}},{"stem":"The student wants to compare the number of humps on the two camel types. Which choice most effectively uses relevant information from the notes to accomplish this goal?","unit":3,"why_correct":"The goal is to compare hump number; A sets the two humps of the Bactrian against the single hump of the dromedary.","why_wrong":{"A":"This describes only the Bactrian, so no comparison is made.","D":"This concerns the Bactrian's habitat, not humps.","C":"This concerns the dromedary's habitat, not humps."},"target_family":"Tek not sentez yok","id":"u3-l2-f2-09","passage":"While researching a topic, a student took the following notes:\n\n- Bactrian camels have two humps.\n- Dromedary camels have a single hump.\n- Bactrian camels live in the cold deserts of Central Asia.\n- Dromedaries live in the hot deserts of the Middle East and Africa.","lesson_name":"Rhetorical Synthesis","choices":{"C":"Dromedaries live in the hot deserts of the Middle East and Africa.","D":"Bactrian camels live in the cold deserts of Central Asia.","A":"Bactrian camels have two humps.","B":"Bactrian camels have two humps, while dromedaries have only one."},"lesson":2,"correct":"B","choice_families":{"C":"Amacı karşılamıyor","D":"Amacı karşılamıyor","A":"Tek not sentez yok"}},{"choices":{"D":"Analog clocks help show how much time remains until the hour.","C":"Digital clocks display the time as numbers, whereas analog clocks show it with hands moving around a dial.","A":"Digital clocks are generally very easy for most people to read at a quick glance, even from across a room.","B":"Digital clocks display the time as numbers."},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- Digital clocks display the time as numbers.\n- Analog clocks show the time with moving hands on a dial.\n- Digital clocks are easy to read at a glance.\n- Analog clocks help show how much time remains until an hour.","choice_families":{"D":"Amacı karşılamıyor","B":"Tek not sentez yok","A":"Amacı karşılamıyor"},"correct":"C","lesson":2,"why_wrong":{"A":"This concerns ease of reading, not how time is displayed.","B":"This describes only digital clocks, so no contrast is drawn.","D":"This concerns a use of analog clocks, not how they display time."},"why_correct":"The goal is to contrast how time is displayed; A sets the numbers of digital clocks against the moving hands of analog ones.","unit":3,"stem":"The student wants to contrast how the two clock types display the time. Which choice most effectively uses relevant information from the notes to accomplish this goal?","id":"u3-l2-f2-10","target_family":"Tek not sentez yok"},{"lesson":2,"correct":"C","target_family":"Notta olmayan bilgi","id":"u3-l2-f3-01","choice_families":{"D":"Notta olmayan bilgi","A":"Notta olmayan bilgi","B":"Notta olmayan bilgi"},"lesson_name":"Rhetorical Synthesis","passage":"While researching a topic, a student took the following notes:\n\n- The Colosseum in Rome was complete
