 cope with pesticide, and a badly fed bee cannot mount an (25) response. This account is harder to act on, because it is difficult to (26) against a combination of pressures.", "options": [{"k": "A", "label": "A. interactive"}, {"k": "B", "label": "B. survivable"}, {"k": "C", "label": "C. simple"}, {"k": "D", "label": "D. immune"}, {"k": "E", "label": "E. legislate"}, {"k": "F", "label": "F. hedgerows"}, {"k": "G", "label": "G. import"}], "items": [{"n": 24, "label": "Gap 24", "ans": "A", "why": "explanation they now favour is interactive. A."}, {"n": 25, "label": "Gap 25", "ans": "D", "why": "cannot mount an immune response. D."}, {"n": 26, "label": "Gap 26", "ans": "E", "why": "difficult to legislate against a combination. E."}]}]}, {"no": 3, "title": "Who Owns the Past?", "qrange": "27 - 40", "time": "23 dakika", "paras": ["A   The British Museum holds roughly eight million objects. Fewer than one per cent are on display at any time. Of the remainder, a great many were acquired in circumstances that the museum's own curators would now describe, in the careful language of the profession, as reflecting an imbalance of power. The question of what should be done about this has moved, over the past two decades, from the fringes of the profession to its centre.", "B   The case that is always cited is the Parthenon Marbles, removed from Athens by Lord Elgin between 1801 and 1812 under a permit from the Ottoman authorities whose exact terms are disputed and whose original has never been produced. Greece has requested their return since 1832. The museum's formal position has been that the sculptures are better seen in London, where they can be viewed alongside the art of other civilisations, and that the legality of the acquisition, whatever one thinks of its morality, has never been overturned.", "C   That argument has weakened. When it was first made, Athens had no purpose-built gallery in which to display the sculptures, and the museum could point to the pollution damage suffered by the pieces that remained on the Acropolis. Since 2009 both objections have been answered by the opening of the Acropolis Museum, a climate-controlled building whose top floor was designed, with some deliberation, to hold exactly the sculptures that London retains, with the remaining originals arranged around empty spaces.", "D   A second argument is more resistant. Museums fear a precedent. If the Marbles go, the reasoning runs, the Rosetta Stone will follow, and the Benin Bronzes, and the Koh-i-Noor diamond, and in time the encyclopaedic museum, an institution that gathers the artefacts of all cultures under one roof and allows them to be compared, will cease to exist. Neil MacGregor, who directed the British Museum for thirteen years, argued that such institutions serve a purpose that national collections cannot, and that dismantling them would be a loss to everyone, including the countries requesting return.", "E   The counter-argument is not that the encyclopaedic museum is worthless but that it is not universal in the way it claims. Dan Hicks, a curator at Oxford, has pointed out that the world's great encyclopaedic collections are almost all in a handful of wealthy northern cities, that they were assembled during a period of colonial expansion, and that the people whose objects they hold are, in the main, unable to visit them. A museum that claims to belong to humanity, he argues, ought to be able to explain why humanity must travel to Bloomsbury to see it.", "F   In practice, the position has begun to shift without waiting for the argument to be settled. Germany agreed in 2022 to transfer ownership of more than a thousand Benin Bronzes to Nigeria, with many pieces remaining in German museums on loan. France has passed legislation permitting specific returns to Benin and Senegal. Smaller British institutions, including several university museums, have returned material without waiting for a change in national law, which in the case of the British Museum forbids most permanent disposals. Loans, long-term and renewable, have emerged as the compromise that allows both parties to avoid conceding the point of principle.", "G   Whether this constitutes progress depends on what one thinks the dispute is about. If it is about access, then a generous loan settles it. If it is about ownership, a loan settles nothing, because a loan is by definition made by an owner. The Greek government has consistently declined to accept the sculptures on loan, on the grounds that to do so would acknowledge a title it does not recognise. That refusal is often reported as intransigence. It might equally be described as the only position consistent with the claim being made."], "groups": [{"type": "yn", "range": "27 - 31", "instr": "Do the following statements agree with the claims of the writer? Write YES, NO or NOT GIVEN.", "items": [{"n": 27, "label": "The exact terms of Elgin's permit are known.", "ans": "NO", "why": "exact terms are disputed and the original never produced. NO."}, {"n": 28, "label": "The opening of the Acropolis Museum weakened one of the British Museum's arguments.", "ans": "YES", "why": "That argument has weakened... answered by the opening of the Acropolis Museum. YES."}, {"n": 29, "label": "Neil MacGregor supports the return of the Marbles to Greece.", "ans": "NO", "why": "MacGregor: dismantling them would be a loss; iadeye karşı. NO."}, {"n": 30, "label": "The British Museum has more visitors than the Acropolis Museum.", "ans": "NOT GIVEN", "why": "Ziyaretçi karşılaştırması yok. NOT GIVEN."}, {"n": 31, "label": "The writer regards Greece's refusal of a loan as unreasonable.", "ans": "NO", "why": "Yazar reddi savunur: the only position consistent with the claim. NO."}]}, {"type": "mcqmulti", "range": "32 - 33", "instr": "Choose TWO letters, A to E. Which TWO arguments against returning objects are mentioned in the passage?", "label": "Arguments against return", "choices": {"A": "The objects would be damaged in transit.", "B": "Returning them would set a precedent that destroys the encyclopaedic museum.", "C": "The original acquisition has never been ruled illegal.", "D": "The requesting countries cannot afford to display them.", "E": "Most of the objects are not on display anyway."}, "ans": ["B", "C"], "why": "B: Museums fear a precedent... encyclopaedic museum will cease to exist. C: legality never overturned. B ve C."}, {"type": "mcq", "range": "34 - 37", "instr": "Choose the correct letter, A, B, C or D.", "items": [{"n": 34, "label": "What is Dan Hicks's objection to the encyclopaedic museum?", "choices": {"A": "It ought to be shut down and its holdings dispersed entirely.", "B": "It causes lasting physical harm to the objects it holds in store.", "C": "It should not admit visitors free of charge.", "D": "Its claim to speak for everyone does not survive inspection."}, "ans": "D", "why": "not universal in the way it claims; why must humanity travel to Bloomsbury. D."}, {"n": 35, "label": "Long-term loans have become common because they", "choices": {"A": "let each side avoid conceding the question of ownership.", "B": "cost far less than a permanent transfer of legal title would.", "C": "are what British law requires.", "D": "are the arrangement requesting countries prefer."}, "ans": "A", "why": "the compromise that allows both parties to avoid conceding the point of principle. A."}, {"n": 36, "label": "The writer's closing argument is that", "choices": {"A": "a loan is always a sufficient answer.", "B": "Greece has taken an obstinate position that serves nobody's interests.", "C": "whether a loan settles anything depends on what is being claimed.", "D": "the sculptures will be sent back to Athens within a decade or two."}, "ans": "C", "why": "about access, loan settles it; about ownership, settles nothing. C."}, {"n": 37, "label": "What does the passage indicate about the British Museum's legal position?", "choices": {"A": "It may hand back whatever object its trustees choose to release.", "B": "Legislation bars it from disposing of most items permanently.", "C": "It has already transferred ownership of the Benin Bronzes to Nigeria.", "D": "It stands outside British law."}, "ans": "B", "why": "national law forbids most permanent disposals. B."}]}, {"type": "select", "variant": "info", "range": "38 - 40", "instr": "Which paragraph contains the following information? Write the correct letter, A to G.", "options": [{"k": "A", "label": "A"}, {"k": "B", "label": "B"}, {"k": "C", "label": "C"}, {"k": "D", "label": "D"}, {"k": "E", "label": "E"}, {"k": "F", "label": "F"}, {"k": "G", "label": "G"}], "items": [{"n": 38, "label": "examples of states that have already agreed to hand objects back", "ans": "F", "why": "F: Germany agreed in 2022; France has passed legislation. F."}, {"n": 39, "label": "a figure showing how little of a collection the public can see", "ans": "A", "why": "A: Fewer than one per cent are on display. A."}, {"n": 40, "label": "a description of a gallery built around an absence", "ans": "C", "why": "C: top floor designed to hold... with empty spaces. C."}]}]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail'),main=document.getElementById('main');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S={view:'lesson',id:D.lessons[0].id};

function norm(s){return (s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();}
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'IELTS Reading')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:(D.title||'IELTS Reading'),q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'IELTS Reading')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}

// ---------- RAIL ----------
function renderRail(){
  const DEF='Öğren . Strateji';
  const secs=[];D.lessons.forEach(l=>{const s=l.sec||DEF;if(!secs.includes(s))secs.push(s);});
  const lesHTML=secs.map(s=>`<div class="rsec">${esc(s)}</div>`+D.lessons.filter(l=>(l.sec||DEF)===s).map(l=>`<div class="rlink ${S.view==='lesson'&&S.id===l.id?'cur':''}" data-go="lesson:${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('')).join('');
  const tst=D.tests.map(t=>`<div class="rlink ${S.view==='test'&&S.id===t.id?'cur':''}" data-go="test:${t.id}"><span class="dot"></span>${esc(t.name)}</div>`).join('');
  railEl.innerHTML=`<div class="rc"><span class="u" lang="en">IELTS</span><div class="ut">${esc(D.title)}</div>${lesHTML}<div class="rsec">Denemeler</div>${tst}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>route(e.getAttribute('data-go')));
}

// ---------- BLOCKS ----------
function blockHTML(b){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){
    const head=b.head.map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){
    const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  return '';
}

// ---------- QUESTION GROUPS ----------
const TF=['TRUE','FALSE','NOT GIVEN'];
const YN=['YES','NO','NOT GIVEN'];

function groupHTML(g,gi){
  let h=`<div class="qgroup" data-gi="${gi}">`;
  if(g.range)h+=`<span class="gh">Questions ${esc(g.range)}</span>`;
  if(g.instr)h+=`<div class="gi">${esc(g.instr)}</div>`;
  if(g.intro)h+=`<div class="gsummary">${esc(g.intro)}</div>`;
  if((g.type==='select')&&g.options&&(g.variant==='heading'||g.variant==='features'||g.variant==='summary')){
    h+=`<div class="optlist">${g.options.map(o=>`<span><b>${esc(o.k)}.</b> ${esc(o.label.replace(/^[A-Za-z]+\.\s*/,''))}</span>`).join('')}</div>`;
  }
  if(g.type==='mcqmulti'){
    h+=`<div class="q" data-qn="${esc(g.range)}" data-type="mcqmulti" data-bm-slug="gri-mod-ielts-reading-${S.view}-${S.id}-${String(g.range).replace(/[^a-z0-9]+/gi,'')}"><div class="ql"><span class="qn">${esc(g.range)}</span><span class="qtext">${esc(g.label||'')}</span></div>`;
    h+=`<div class="opts">`+Object.keys(g.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(g.choices[k])}</span></label>`).join('')+`</div>`;
    h+=`<div class="fb" style="display:none"></div></div>`;
    h+=`</div>`;return h;
  }
  (g.items||[]).forEach(it=>{
    h+=`<div class="q" data-qn="${it.n}" data-type="${g.type}" data-variant="${g.variant||''}" data-bm-slug="gri-mod-ielts-reading-${S.view}-${S.id}-${String(it.n).replace(/[^a-z0-9]+/gi,'')}">`;
    h+=`<div class="ql"><span class="qn">${it.n}</span><span class="qtext">${esc(it.label)}</span></div>`;
    if(g.type==='tf'||g.type==='yn'){
      const opts=(g.type==='tf'?TF:YN);
      h+=`<div class="inl">`+opts.map(o=>`<button data-v="${o}">${o}</button>`).join('')+`</div>`;
    }else if(g.type==='gap'){
      h+=`<div class="ctrl"><input type="text" autocomplete="off" placeholder="cevabını yaz"></div>`;
    }else if(g.type==='select'){
      h+=`<div class="ctrl"><select><option value="">seç</option>`+g.options.map(o=>`<option value="${o.k}">${esc(o.k)}${g.variant==='heading'||g.variant==='summary'?'. '+esc(o.label.replace(/^[A-Za-z]+\.\s*/,'')).slice(0,42):''}</option>`).join('')+`</select></div>`;
    }else if(g.type==='mcq'){
      h+=`<div class="opts">`+Object.keys(it.choices).sort().map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div>`;
    }
    h+=`<div class="fb" style="display:none"></div></div>`;
  });
  h+=`</div>`;return h;
}

// ---------- VIEWS ----------
function saveResume(name,go){try{history.replaceState(null,'','#'+go);localStorage.setItem('gri_resume',JSON.stringify({exam:(D.badge||'IELTS'),lesson:(name||''),url:location.pathname.split('/').pop()+'#'+go,t:Date.now()}));}catch(e){}}
function lessonView(id){
  S.view='lesson';S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">Öğren . Strateji</div><h1>${esc(l.name)}</h1><div class="lead">${esc(D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach(b=>h+=blockHTML(b));
  if(l.passage){h+=`<div class="passage"><div class="pmeta">Metin</div>`+l.passage.map(p=>`<p>${esc(p)}</p>`).join('')+`</div>`;}
  if(l.groups){ (l.groups).forEach((g,gi)=>h+=groupHTML(g,gi));
    h+=`<button class="btn" data-check="lesson">Cevabı kontrol et</button><div class="score" style="display:none"></div>`;
  }
  h+=`</div>`;app.innerHTML=h;attach();saveResume(l.name,'lesson:'+id);
}

function testView(id){
  S.view='test';S.id=id;renderRail();window.scrollTo(0,0);
  const t=D.tests.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">Deneme</div><h1>${esc(t.name)}</h1><div class="lead">Üç passage. Kırk soru. Altmış dakika. Transfer süresi yok.</div></div><div class="pad">`;
  h+=`<div class="note ipucu"><span class="nt">Sınav koşulu</span><ul><li>Altmış dakika, kronometre kur, telefon uzakta.</li><li>Cevaplarını işaretle, sonra her passage'ın altındaki Cevabı kontrol et düğmesine bas.</li><li>Yanlışlarda metne dön ve doğru cevabın nerede olduğunu bul.</li></ul></div>`;
  t.passages.forEach((p,pi)=>{
    h+=`<div data-passage="${pi}">`;
    h+=`<h2>Passage ${p.no}. ${esc(p.title)}</h2><div class="rule"></div>`;
    h+=`<div class="passage"><div class="pt">${esc(p.title)}</div><div class="pmeta">Questions ${esc(p.qrange)} . Önerilen süre ${esc(p.time)}</div>`+p.paras.map(x=>`<p>${esc(x)}</p>`).join('')+`</div>`;
    p.groups.forEach((g,gi)=>h+=groupHTML(g,pi*100+gi));
    h+=`<button class="btn" data-check="passage" data-pi="${pi}">Passage ${p.no} . Cevabı kontrol et</button><div class="score" style="display:none"></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;app.innerHTML=h;attach();saveResume(t.name,'test:'+id);
}

// ---------- INTERACTION ----------
function attach(){
  app.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>route(e.getAttribute('data-go')));
  // inl buttons (tf/yn)
  app.querySelectorAll('.inl').forEach(box=>box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(box.closest('.q').classList.contains('done'))return;
    box.querySelectorAll('button').forEach(x=>x.classList.remove('pick'));b.classList.add('pick');}));
  // mcq / mcqmulti labels
  app.querySelectorAll('.q[data-type="mcq"] .opts, .q[data-type="mcqmulti"] .opts').forEach(box=>{
    const multi=box.closest('.q').getAttribute('data-type')==='mcqmulti';
    box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
      if(box.closest('.q').classList.contains('done'))return;
      if(multi){const on=l.classList.contains('pick');const n=box.querySelectorAll('label.pick').length;if(!on&&n>=2)return;l.classList.toggle('pick');}
      else{box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}
    });
  });
  app.querySelectorAll('[data-check]').forEach(btn=>btn.onclick=()=>{
    if(btn.getAttribute('data-check')==='passage')checkScope(btn.closest('[data-passage]'),btn);
    else checkScope(app,btn);
  });
}
function route(go){const [v,id]=go.split(':');if(v==='lesson')lessonView(id);else testView(parseInt(id,10));}

// build lookup of answers by qn for current view
function ansIndex(){
  const idx={};
  const src = S.view==='lesson' ? [D.lessons.find(x=>x.id===S.id)] : D.tests.find(x=>x.id===S.id).passages;
  src.forEach(container=>{
    (container.groups||[]).forEach(g=>{
      if(g.type==='mcqmulti'){idx[g.range]={type:'mcqmulti',ans:g.ans,why:g.why};}
      else (g.items||[]).forEach(it=>idx[it.n]={type:g.type,variant:g.variant,ans:it.ans,why:it.why});
    });
  });
  return idx;
}
function checkScope(scope,btn){
  const idx=ansIndex();let correct=0,total=0;
  scope.querySelectorAll('.q').forEach(q=>{
    const qn=q.getAttribute('data-qn');const type=q.getAttribute('data-type');const rec=idx[qn];if(!rec)return;
    total++;q.classList.add('done');
    let ok=false,shown='';
    if(type==='tf'||type==='yn'){
      const pick=q.querySelector('.inl button.pick');const val=pick?pick.getAttribute('data-v'):'';
      ok=(val===rec.ans);shown=val||'—';
      q.querySelectorAll('.inl button').forEach(b=>b.disabled=true);
    }else if(type==='gap'){
      const inp=q.querySelector('input[type=text]');const val=inp?inp.value:'';
      ok=rec.ans.some(a=>norm(a)===norm(val));shown=val||'—';inp&&(inp.disabled=true);
    }else if(type==='select'){
      const sel=q.querySelector('select');const val=sel?sel.value:'';ok=(val===rec.ans);shown=val||'—';sel&&(sel.disabled=true);
    }else if(type==='mcq'){
      const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';ok=(val===rec.ans);shown=val||'—';
    }else if(type==='mcqmulti'){
      const picks=[...q.querySelectorAll('.opts label.pick')].map(l=>l.getAttribute('data-k')).sort();
      const want=[...rec.ans].sort();ok=(picks.length===want.length&&picks.every((v,i)=>v===want[i]));shown=picks.join(', ')||'—';
    }
    q.classList.add(ok?'correct':'incorrect');if(ok)correct++;
    const ansTxt = Array.isArray(rec.ans)? rec.ans[0] : rec.ans;
    const qtx=(q.querySelector('.qtext')?q.querySelector('.qtext').textContent:('Soru '+qn));
    if(ok)clearErr(qtx);else logErr(qtx, String(ansTxt));
    recAns('gri-mod-ielts-reading-'+S.view+'-'+S.id+'-'+String(qn).replace(/[^a-z0-9]+/gi,''),ok?'correct':'incorrect');
    const fb=q.querySelector('.fb');fb.style.display='block';fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML = ok ? `<span class="ans">Doğru.</span> ${esc(rec.why||'')}`
      : `<span class="ans">Yanlış.</span> Senin cevabın: ${esc(shown)}. Doğru cevap: <b>${esc(String(ansTxt))}</b>. ${esc(rec.why||'')}`;
  });
  btn.disabled=true;
  const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('score')){sc.style.display='block';sc.textContent=`Doğru: ${correct} / ${total}`;}
}

  const SB_U=(window.SUPABASE_URL||'https://vazbvbqgvtlaqkytfsbi.supabase.co');
  const SB_K=(window.SUPABASE_KEY||'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g');
  function showGate(){
    const ret=encodeURIComponent('/'+location.pathname.split('/').pop());
    app.innerHTML='<div class="head"><div class="eyebrow">Üyelere özel</div><h1>Bu içerik giriş gerektirir</h1></div>'+
      '<div class="pad"><p style="font-family:Inter,sans-serif;font-size:14px;color:var(--muted)">IELTS Reading modülünü çalışmak için ücretsiz hesabınla giriş yap. Girişten sonra bu sayfaya geri dönersin.</p>'+
      '<div style="display:flex;gap:10px;margin-top:14px"><a class="btn" href="giris?return='+ret+'">Giriş Yap</a>'+
      '<a class="btn ghost" href="giris#signup">Ücretsiz Hesap Aç</a></div></div>';
    railEl.innerHTML='';window.scrollTo(0,0);
  }
  function boot(cb){if(window.supabase&&window.supabase.createClient)return cb();var t=0,iv=setInterval(function(){t++;if(window.supabase&&window.supabase.createClient){clearInterval(iv);cb();}else if(t>30){clearInterval(iv);cb();}},100);}
  app.innerHTML='<div class="head"><div class="eyebrow">Yükleniyor</div><h1>&nbsp;</h1></div>';
  boot(async function(){
    var ok=false;
    try{ if(window.supabase&&window.supabase.createClient){var c=window.griTrackSB||window.supabase.createClient(SB_U,SB_K);window.griTrackSB=c;var r=await c.auth.getSession();ok=!!(r&&r.data&&r.data.session);if(ok){window.GRI_SB=c;window.GRI_UID=r.data.session.user.id;}} }catch(e){ok=false;}
    if(ok){ var hh=(location.hash||'').replace(/^#/,''); if(/^(lesson|test):/.test(hh)){route(hh);} else { lessonView(D.lessons[0].id); } } else { showGate(); }
  });
})();
</script>

<style>
/* soru yer imi */
.mcq[data-slug],.qz[data-slug],[data-bm-slug]{position:relative}
.gribm{position:absolute;top:12px;right:2px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;z-index:2}
.gribm:hover{background:rgba(46,110,106,.12)}
.gribm:disabled{opacity:.5;cursor:default}
.gribm svg{width:17px;height:17px;fill:none;stroke:#8a8f9c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,fill .15s}
.gribm.on svg{fill:#2E6E6A;stroke:#2E6E6A}
.mcq[data-slug] .mstem,.qz[data-slug] .qzq{padding-right:40px}
.q[data-bm-slug] .ql{padding-right:40px}
.st-q[data-bm-slug] .gribm{top:.7rem;right:.7rem}
</style>
<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body></html>
