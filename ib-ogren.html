 her paragrafı bir öncekiyle ve tezle ilişkilendirir. Karşı görüşü anıp yanıtlamak ('While some claim..., the evidence suggests...') denemeye olgunluk katar. Sonuç yeni bilgi eklemez; tartışmayı özetler ve gerekçelerin götürdüğü net bir yargıyı sunar.","t":"p"},{"x":"Dil ve Tartışma Araçları","t":"h"},{"t":"p","x":"Denemenin dili akademik bağlaçlar ve ölçülü ifadelerle örülür. Karşıtlık ve taviz bağlaçları dengeyi kurar: 'however', 'on the other hand', 'although', 'nevertheless'. Neden-sonuç bağlaçları mantığı gösterir: 'therefore', 'as a result', 'consequently'. Ölçülü kesinlik ifadeleri ('it could be argued that', 'this suggests', 'to some extent') akademik tonu korur ve aşırı genellemeden kaçınır. Örnek ve kanıt sunmak ('for instance', 'evidence shows') iddiaları destekler. Criterion A için bu tür, tartışma bağlaçlarını, koşul ve karşılaştırma yapılarını doğru ve çeşitli kullanmanı ister; aynı 'also' ya da 'but' kelimesini tekrarlamak yerine bağlaç dağarcığını genişlet."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"Güçlü bir deneme modeli düşünelim: konu 'Do smartphones make young people less social?' Giriş konuyu tanıtır ve dengeli bir yön belirtir ('This essay will weigh both sides before reaching a conclusion'). Birinci gövde paragrafı bir iddiayı işler (telefonlar yüz yüze iletişimi azaltır), gerekçelendirir ve örnekler. İkinci paragraf karşı görüşü sunar (telefonlar uzaktaki dostlukları güçlendirir) ve o da örneklenir. Üçüncü paragraf ikisini tartar ('the effect depends on how phones are used'). Sonuç gerekçelere dayalı ölçülü bir yargı verir: telefonlar sosyalliği zorunlu olarak azaltmaz, ama dengesiz kullanım riskli olabilir. İşte üç kriteri karşılayan bir deneme: akademik ve dengeli register (C), fikirler gerekçe ve karşı görüşle geliştirilmiş (B), dil bağlaç açısından zengin ve doğru (A).","t":"p"},{"t":"h","x":"Denemeyi Benzer Türlerden Ayırmak"},{"t":"p","x":"Öğrenciler denemeyi en çok makaleyle (article) ve görüş yazısıyla (opinion column) karıştırır. Makale bilgilendirir ve ilgilendirir; alt başlıklar, renkli bir dil ve yarı resmi bir ton kullanır. Deneme ise alt başlık kullanmaz, daha resmi ve analitiktir; amacı ilgi çekmek değil, tartışmaktır. Görüş yazısı tek bir tarafı güçlü biçimde savunur ve ikna etmeye çalışır; deneme ise çoğu zaman iki tarafı da tartar ve gerekçelerle dengeli bir sonuca varır. Aynı konu (örneğin sosyal medya) makalede renkli anlatılır, görüş yazısında keskin savunulur, denemede ise dengeli ve akademik tartışılır. Görevde 'essay' ya da 'discuss / to what extent' ifadesini gördüğünde şu üçlüyü hatırla: akademik ton, gerekçeli paragraflar ve dengeli tartışma."},{"rows":[["Deneme (Essay)","Bir soruyu tartış","Akademik paragraflar, dengeli, alt başlıksız"],["Makale (Article)","Bilgilendir ve ilgilendir","Alt başlıklar, renkli dil, yarı resmi"],["Görüş yazısı (Opinion)","Taraf tut, ikna et","Tek taraf, keskin tez, ikna edici"]],"head":["Tür","Amaç","Ayırt edici işaret"],"t":"table"},{"t":"h","x":"Fikri Derinleştirmek ve Dengeyi Kurmak"},{"t":"p","x":"Denemede en çok kaybedilen puan yüzeysellikten ve tek yanlılıktan gelir; bu Criterion B'yi düşürür. Yüzeysel bir yazar iddiaları sıralar ama geliştirmez: 'Social media wastes time. It also spreads false news. And it harms sleep.' Bu cümleler üç iddiayı çıplak bırakır. Derin bir yazar tek iddiayı alır ve onu gerekçe, örnek ve sonuçla işler. Tek yanlılık da bir tuzaktır: yalnızca bir tarafı savunan bir deneme dengesiz kalır. Olgun deneme karşı görüşü anar ve yanıtlar ('While some argue... the evidence suggests...'). Bir fikri sonuna kadar götürmek ve karşı tarafı da tartmak, denemeyi hem derin hem güvenilir kılar."},{"x":"Fikri geliştirmenin pratik yöntemi 'iddia, açıklama, örnek, sonuç' zinciridir; deneme bu zinciri her gövde paragrafında kurar. Önce iddiayı söyle, sonra neden böyle olduğunu açıkla, ardından somut bir örnek ver ve son olarak bunun tezinle ilişkisini belirt. Bu dört adım her paragrafı tam ve ikna edici kılar. Ayrıca paragraflar arası geçişler ('Furthermore', 'By contrast', 'Building on this') düşünce akışını görünür kılar; okuyucu bir fikirden diğerine nasıl geçtiğini anlar. Dağınık bir fikir yığını değil, birbirine bağlı bir akıl yürütme; işte denemeyi güçlü kılan budur.","t":"p"},{"t":"h","x":"Deneme Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"t":"p","x":"Deneme yazmayı öğrenmek, akıl yürütme ve dengeli tartışma becerisidir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde tartışmacı ve akademik metinler çıkar; deneme yapısını ve bağlaç mantığını tanıyan öğrenci yazarın argümanını ve karşı görüşleri daha isabetli çözer. Individual Oral'da ise bir görsel ya da alıntıyı bir prescribed theme etrafında tartışırken denemede kazandığın 'iddia-gerekçe-karşı görüş-sonuç' düşünme biçimi doğrudan işe yarar: bir görüş öne sürer, gerekçelendirir, öbür tarafı anar ve dengeli bir yargıya varırsın. Böylece ezber bir sunumun ötesine geçer, düşünen bir aday gibi konuşursun."},{"t":"note","k":"ipucu","title":"Denemede puan kazandıran küçük hamleler","lines":["Girişte konuyu tanıt ve bir yön ya da tez belirt.","Her gövde paragrafını tek bir ana fikre ayır.","İddiayı gerekçe ve örnekle destekle; çıplak bırakma.","Karşı görüşü an ve yanıtla; denge olgunluk gösterir.","Akademik bağlaçlar kullan: however, therefore, although.","Sonuçta yeni bilgi ekleme; gerekçelere dayalı net bir yargı ver."]},{"t":"p","x":"Sık yapılan hatalar denemeyi zayıflatır. En büyüğü yüzeyselliktir: iddiaları geliştirmeden sıralamak, denemeyi bir liste gibi bırakır. İkincisi tek yanlılıktır; karşı görüşü hiç anmadan yalnızca bir tarafı savunmak dengeyi bozar. Üçüncüsü register kaymasıdır: kısaltma, argo ya da fazla kişisel anlatı denemeyi akademik olmaktan çıkarır. Dördüncüsü tezsizliktir; ne savunduğu belli olmayan, bir sonuca varmayan deneme havada kalır. Beşincisi ise makaleyle karışmaktır: alt başlık koymak ya da renkli bir ton benimsemek denemeyi türünden uzaklaştırır. Gerekçeli, dengeli ve akademik kal; her iddiayı geliştir ve net bir sonuca bağla."},{"x":"Giriş ve Sonucun Zanaatı","t":"h"},{"t":"p","x":"Denemede giriş ve sonuç, aradaki tartışma kadar önemlidir çünkü okurun ilk ve son izlenimini belirler. Zayıf bir giriş konuyu düz biçimde duyurur ('This essay is about technology'); güçlü bir giriş konuyu bir bağlama oturtur, önemini sezdirir ve tartışmanın yönünü verir. İyi bir giriş üç işi yapar: konuyu tanıtır, neden tartışmaya değer olduğunu gösterir ve denemenin izleyeceği çizgiyi ima eder. Okur girişi bitirdiğinde denemenin nereye gittiğini sezmelidir. Bu netlik, tartışmayı baştan bir çerçeveye oturtur ve değerlendiriciye yazarın kontrolü elinde tuttuğunu gösterir."},{"x":"Sonuç, yeni bir tartışma açmaz; var olanı toparlar ve bir yargıya bağlar. Zayıf bir sonuç yalnızca 'sonuç olarak, bu önemli bir konudur' der ve hiçbir şey eklemez; güçlü bir sonuç gövdedeki gerekçeleri hatırlatır ve onların götürdüğü net bir duruşu ortaya koyar. Dengeli bir denemede sonuç, iki tarafı da tarttıktan sonra ölçülü bir taraf tutar: 'Her iki görüşün de haklı yanları vardır, ancak kanıtlar bir bütün olarak şunu göstermektedir...'. Bu ölçülü kesinlik, denemeyi hem dengeli hem sonuçlu kılar. Sonucu havada kesmek ya da kararsız bitirmek, tüm tartışmanın etkisini zayıflatır.","t":"p"},{"x":"Denemenin akışı, paragraflar arası bağlantılarla sağlanır. Her paragraf bir öncekiyle konuşmalı; okur bir fikirden diğerine nasıl geçtiğini anlamalıdır. Geçiş ifadeleri bu köprüyü kurar: bir karşı görüşe geçerken 'However' ya da 'On the other hand', bir fikri derinleştirirken 'Furthermore' ya da 'Moreover', bir sonuca varırken 'Therefore' ya da 'As a result'. Bu bağlaçlar yalnızca süs değildir; düşüncenin mantıksal yönünü gösterir ve denemeyi bir fikir yığını olmaktan çıkarıp akan bir akıl yürütmeye dönüştürür. İyi bağlanmış paragraflar hem Criterion B'de fikir gelişimini hem Criterion A'da dil çeşitliliğini güçlendirir.","t":"p"},{"t":"h","x":"Temayı Deneme Merceğinden Çerçevelemek"},{"x":"Sınavda deneme görevi genellikle bir prescribed theme'e bağlı bir soruyla gelir ve senin işin o temayı tartışılabilir bir soruya çevirip dengeli biçimde işlemektir. Örneğin 'Identities' teması altında gençlik verildiğinde, konuyu bir soruya dönüştür ('Do young people today face more pressure than previous generations?') ve iki tarafı da gerekçelerle tart. Aynı tema bir makalede renkli anlatılabilir, bir görüş yazısında keskin savunulabilirdi; deneme merceği ise onu akademik paragraflarla tartışılan, karşı görüşü de içeren dengeli bir soruya indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin denemeyi güvenle yazmanı sağlar; anahtar, konuyu 'tartışılacak bir soru' olarak görmektir.","t":"p"},{"t":"p","x":"Zaman yönetimi denemede düşünmeye zaman ayırmayı gerektirir. İlk beş dakikada soruyu çöz, tezini belirle ve iki üç gövde fikri ile bir karşı görüş not et; bu plan denemenin dengesini baştan kurar. Ardından yaz ve son on dakikada her iddianın gerekçelendiğini, karşı görüşün anıldığını, bağlaçların akışı taşıdığını ve sonucun net bir yargı verdiğini kontrol et. Değerlendiricinin gözünden deneme, akademik tonu ve dengeli tartışmasıyla tanınır: Criterion C için resmi register ve mantıklı paragraf düzeni, Criterion B için fikirlerin gerekçe ve karşı görüşle geliştirilmesi, Criterion A için bağlaç açısından zengin ve doğru dil aranır. Bu SL türünün kelime sınırını (250-400) ve tür beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Giriş (konu + tez), her biri bir fikri işleyen gövde paragrafları (gerekçe + örnek), sonuç."], ["Tipik özellikler", "Net tez, bağlaçlar (however, therefore, for example), gerekçeli argüman, dengeli değerlendirme, sonuç. (Genelde SL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Soruyu çöz: seni ne hakkında görüş bildirmeye çağırıyor?", "2. Net bir tez belirle (görüşün ne?).", "3. Girişte konuyu tanıt ve tezini son cümlede ver.", "4. Her gövde paragrafında bir fikri işle: iddia + gerekçe + örnek.", "5. Karşı görüşe de değin (however...), sonra kendi görüşünle dengele.", "6. Sonuçta tezi toparla; yeni bilgi ekleme.", "7. Son kontrol: tez + gerekçeli paragraflar + bağlaçlar + denge + sonuç var mı?"]}, {"t": "given", "title": "Birinci örnek (sosyal medya)", "x": "Should Social Media Be Part of School Life?\n\nSocial media is often blamed for distracting students, yet it also offers real opportunities for learning. This essay argues that, used carefully, it belongs in the classroom."}, {"t": "given", "title": "İkinci örnek (giriş + tez, farklı konu)", "x": "Should Schools Ban Mobile Phones?\n\nFew objects divide a classroom like the mobile phone. To some it is a powerful learning tool; to others, the single biggest source of distraction in a student's day. While phones certainly have their uses, this essay argues that schools are right to restrict them during lessons, because the cost to concentration outweighs the convenience."}, {"t": "wizard", "wt": "essay", "ptitle": "Görev", "prompt": "Şu soruya bir deneme (essay) yaz: 'Should students be required to do community service?' Net bir tez, gerekçeli gövde paragrafları ve dengeli bir sonuç kullan.", "target": 280, "check": ["Girişte konuyu tanıttım ve net bir tez cümlesi yazdım.", "Her gövde paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve sonunda görüşümü toparladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (deneme)", "x": "Should Students Be Required to Do Community Service?\n\nMany schools now ask students to spend a set number of hours helping their community. Some see this as an unfair burden, but I believe that required community service, if handled sensibly, does far more good than harm.\n\nThe strongest argument in its favour is what students learn. Helping at a shelter or tutoring a younger child teaches responsibility and empathy in a way no textbook can. A friend of mine who volunteered at a care home says it completely changed how she sees older people.\n\nCritics argue that forcing people to help removes the kindness from the act. There is some truth in this. However, many students would never volunteer on their own, and once they start, they often continue by choice. The requirement simply opens a door.\n\nOf course, the hours must be reasonable, so that service does not harm students' studies or become a box-ticking exercise.\n\nIn conclusion, while it should be applied with care, required community service benefits both students and society, and I believe schools are right to include it."}}, {"t": "note", "k": "ipucu", "title": "Argüman", "lines": ["Girişte net bir tez ver; sonuç bu tezi toparlasın. Değerlendirici Criterion B'yi buradan okur.", "Karşı görüşe de değin (however...), sonra kendi görüşünle dengele. Bu olgunluk gösterir."]}]}, {"id": "t-social", "group": "Kişisel", "name": "Sosyal Medya Gönderisi", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Sosyal Medya Gönderisi Nedir ve Ne Zaman Karşına Çıkar?"},{"x":"Sosyal medya gönderisi (social media post), bir çevrimiçi platformda bir kitleye seslenen, kısa, dikkat çekici ve etkileşime davet eden bir metin türüdür. Bir kampanya duyurusu, bir bilinçlendirme paylaşımı, bir etkinlik çağrısı ya da bir görüş ifadesi olabilir. Paper 1'de kişisel/dijital türler arasında çıkar ve birçok prescribed theme'e bağlanır: 'Social organization' altında bir topluluk çağrısı, 'Sharing the planet' altında bir çevre kampanyası, 'Identities' altında bir kimlik ya da farkındalık mesajı gönderiye dönüşür. Gönderinin özü, sınırlı bir alanda güçlü bir mesaj vermek ve okuru bir tepkiye (beğeni, paylaşım, yorum, katılım) davet etmektir; uzun bir yazı değil, keskin ve etkileşimli bir çağrıdır.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"x":"Gönderinin kitlesi bir platformdaki takipçiler ve o mesaja rastlayan geniş çevrimiçi okurdur: hızlı kaydıran, dikkati kolay dağılan bir izleyici. Amaç ikna etmek, bilinçlendirmek ya da harekete geçirmek olabilir, ama her zaman etkileşim hedefler; gönderi okurdan bir tepki ister. Register çoğu zaman gayriresmi ve dolaysızdır: kısa cümleler, doğrudan seslenme ('you'), ünlemler, hashtag ve zaman zaman emoji. Yine de platform ve amaca göre resmiyet değişir; bir kurumun bilinçlendirme gönderisi daha ölçülüdür. Sınavda 'yazılı' bir tür istendiği için dil doğru kalmalıdır (Criterion A); gayriresmi olmak özensiz olmak değildir.","t":"p"},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"t":"p","x":"Gönderinin imza öğeleri kısalık ve etkileşim işaretleridir. Güçlü bir gönderi bir kancayla açılır: çarpıcı bir soru, şaşırtıcı bir olgu ya da doğrudan bir çağrı ('Did you know we throw away 30% of our food?'). Mesaj birkaç kısa satırda verilir; uzun paragraflar kaydırılıp geçilir. Bir eylem çağrısı (call to action) neredeyse zorunludur: 'Share this', 'Join us on Saturday', 'Tell us in the comments'. Hashtag'ler mesajı bir konuya bağlar ve keşfedilebilir kılar (#SaveFood). Kimi gönderi bir bağlantıya ya da etikete yönlendirir. Bu kısa-çarpıcı-etkileşimli yapı, gönderiyi uzun türlerden ayırır."},{"t":"p","x":"Gönderinin başarısı ilk satırda gizlidir. Çevrimiçi okur saniyeler içinde kaydırıp geçer; ilk cümle onu durdurmazsa mesaj kaybolur. Zayıf bir açılış düz ve mesafelidir: 'We are writing about food waste.' Güçlü bir açılış okuru anında içine çeker: 'Every day, our school bins swallow enough food to feed a class. Let us change that.' İkinci açılış bir imge kurar, bir sorun gösterir ve hemen bir çağrıya yol açar. Sınırlı alanda her kelime çalışmalıdır; giriş cümlesi hem dikkat çekmeli hem mesajın özünü taşımalıdır. Bu yoğunluk, gönderi yazımının en kritik becerisidir."},{"t":"h","x":"Dil ve Etkileşim Araçları"},{"x":"Gönderinin dili kısa, canlı ve etkileşim odaklıdır. Emir kipi harekete çağırır: 'Join', 'Share', 'Tag a friend', 'Don't miss'. Doğrudan sorular okuru yoruma davet eder ('What would you do?'). Kısa, çarpıcı cümleler ve tek cümlelik satırlar ritim ve vurgu yaratır. Hashtag'ler mesajı bir harekete bağlar ve topluluk hissi kurar. Emoji ölçülü kullanıldığında ton katar, ama aşırısı ciddiyeti düşürür ve sınav bağlamında dikkatli olunmalıdır. Criterion A için bu tür, kısalık içinde bile çeşitlilik ister: farklı çağrı fiilleri, farklı cümle kalıpları ve doğru dilbilgisi. Kısa yazmak, basit ya da hatalı yazmak anlamına gelmez.","t":"p"},{"x":"Çözümlü Model Örnek","t":"h"},{"t":"p","x":"Güçlü bir gönderi modeli düşünelim: bir okul çevre kulübünün kampanya paylaşımı. Kanca çarpıcı bir olguyla açılır ('Our school throws away 200 lunches a week. That stops now.'). Ardından kısa satırlarda mesaj gelir: sorun, çözüm ve etkinlik ('This Friday, we launch Zero-Waste Lunch. Bring a reusable box, win a prize.'). Bir eylem çağrısı okuru harekete davet eder ('Tag two friends and join us'). Hashtag'ler mesajı bağlar (#ZeroWasteFriday #GreenValley). Gönderi kısadır ama her satır çalışır: dikkat çeker, bilgilendirir ve etkileşime iter. İşte üç kriteri karşılayan bir gönderi: platforma uygun gayriresmi register (C), mesaj ve çağrı net biçimde geliştirilmiş (B), dil kısa ama doğru ve çeşitli (A)."},{"t":"h","x":"Gönderiyi Benzer Türlerden Ayırmak"},{"x":"Öğrenciler gönderiyi en çok blogla (blog) ve reklamla (advertisement) karıştırır. Blog kişisel ve uzundur, bir deneyimi ayrıntılı anlatır; gönderi ise kısadır, tek bir mesaja odaklanır ve anında etkileşim ister. Reklam bir ürünü ya da hizmeti satmaya çalışır ve çoğu zaman ticari bir çağrı taşır; gönderi ise satış dışında bilinçlendirme, çağrı ya da görüş amacı da güder ve platformun etkileşim diline (hashtag, etiket, yorum) yaslanır. Aynı konu blogda uzun uzun anlatılır, gönderide birkaç satırda çarpıcı verilir. Görevde 'social media post', 'tweet' ya da 'Instagram caption' ifadesini gördüğünde şu üçlüyü hatırla: kısalık, doğrudan çağrı ve etkileşim işaretleri.","t":"p"},{"t":"table","head":["Tür","Amaç","Ayırt edici işaret"],"rows":[["Sosyal medya gönderisi","Etkileşime çağır, harekete geçir","Kısa, hashtag, doğrudan çağrı (CTA)"],["Blog","Kişisel deneyim paylaş","Uzun, birinci şahıs, ayrıntılı anlatı"],["Reklam (Advertisement)","Ürünü/hizmeti sat","Ticari çağrı, ürün odağı, ikna"]]},{"t":"h","x":"Kısalıkta Güç: Her Kelimeyi Çalıştırmak"},{"x":"Gönderide en çok kaybedilen puan dağınıklıktan ve zayıf çağrıdan gelir; bu Criterion B'yi (amaca uygunluk) düşürür. Sınırlı alanda birden çok mesaja dağılmak okuru kaybettirir; iyi bir gönderi tek bir net fikir taşır. Her kelime bir işe yaramalı; dolgu ifadeler ('I just wanted to say that...') alanı israf eder. Güçlü gönderi mesajı sıkıştırır ve çağrıyı belirginleştirir. Ayrıca etkileşim davetinin somut olması gerekir: 'Do something' değil, 'Bring a reusable box this Friday'. Kısalık bir kısıt değil, bir disiplindir; az sözle çok şey söylemek, gönderi yazımının ustalığıdır.","t":"p"},{"x":"Etkileşimi güçlendirmenin yolu, okura yapabileceği somut ve kolay bir eylem sunmaktır. Belirsiz bir çağrı zayıftır: 'Support the environment.' Somut ve erişilebilir bir çağrı güçlüdür: 'Swap one plastic bottle for a reusable one this week, and tell us how it goes.' Burada eylem küçük, net ve yapılabilirdir; okur ne yapacağını tam bilir ve katılması kolaydır. Ayrıca soru sorarak ('What's your one small change?') okuru yoruma davet etmek etkileşimi artırır. Gönderinin amacı yalnızca bilgi vermek değil, okuru harekete ya da diyaloğa katmaktır; bu yüzden çağrı hep somut ve davetkâr olmalıdır.","t":"p"},{"t":"h","x":"Gönderi Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"x":"Sosyal medya gönderisi yazmayı öğrenmek, mesajı öz ve etkili biçimde iletme becerisidir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde dijital ve kısa metinler çıkabilir; gönderinin çağrı dilini ve etkileşim amacını tanıyan öğrenci yazarın niyetini ve tonunu isabetle okur. Individual Oral'da ise bir görseli ya da mesajı özetlerken gönderide kazandığın 'özleştirme' becerisi işe yarar: dağılmadan, en çarpıcı noktayı öne çıkararak konuşursun. Ayrıca gönderilerin etkileşim mantığı, bir prescribed theme'in çağdaş iletişimdeki yerini tartışırken zengin bir örnek kaynağı sunar; dijital okuryazarlık, çağın dilini anlamak demektir.","t":"p"},{"t":"note","lines":["İlk satırda güçlü bir kanca kur: çarpıcı olgu, soru ya da çağrı.","Tek bir net mesaja odaklan; dağılma.","Somut bir eylem çağrısı (CTA) ekle: Join, Share, Bring, Tag.","Amaca uygun hashtag kullan; mesajı bir harekete bağla.","Kısa satırlar ve doğrudan seslenmeyle etkileşim yarat.","Kısa yazsan da dilbilgisini bozma; her kelime doğru olsun."],"title":"Gönderide puan kazandıran küçük hamleler","k":"ipucu"},{"t":"p","x":"Sık yapılan hatalar gönderiyi zayıflatır. En büyüğü dağınıklıktır: sınırlı alanda birçok mesaja yayılmak okuru kaybettirir. İkincisi çağrısız kalmaktır; etkileşim istemeyen bir gönderi amacına ulaşmaz, okuru harekete davet et. Üçüncüsü uzunluğa kaçmaktır: gönderiyi bir bloga çevirmek türü bozar, kısa ve keskin kal. Dördüncüsü aşırı emoji ve argodur; ton katar ama abartısı ciddiyeti ve dil kalitesini düşürür, sınavda ölçülü ol. Beşincisi ise dili özensizleştirmektir: kısalık, dilbilgisi hatasına gerekçe değildir. Tek mesaj, somut çağrı ve doğru dil bu tuzakları önler."},{"x":"Platforma Göre Ton ve Biçim","t":"h"},{"t":"p","x":"Sosyal medya tek bir şey değildir; her platformun kendi dili ve biçimi vardır ve iyi bir gönderi bu farkı gözetir. Bir Twitter/X gönderisi çok kısadır ve keskin bir tek cümleye yaslanır; bir Instagram başlığı (caption) görselle konuşur ve daha sıcak, hikâye anlatan bir tona izin verir; bir LinkedIn paylaşımı daha ölçülü ve profesyoneldir. Sınavda sana hangi platform verildiyse ya da bağlam neyi ima ediyorsa, tonu ve uzunluğu ona göre ayarla. Aynı çevre mesajı bir platformda esprili bir tek satır, bir diğerinde birkaç paragraflık bir çağrı olabilir. Platformun diline uymak, gönderinin gerçekçi ve amaca uygun görünmesini sağlar."},{"x":"Hashtag ve etiketleme, gönderinin görünürlüğünü ve topluluk hissini kuran araçlardır, ama ölçülü kullanılmalıdır. İyi seçilmiş bir iki hashtag mesajı bir harekete bağlar ve keşfedilmesini sağlar (#ZeroWaste); on tane hashtag yığmak ise dağınık ve amatör görünür. Etiketleme ('Tag a friend who...') okuru etkileşime davet eder ve mesajı yayar. Hashtag'ler aynı zamanda mesajın tonunu da taşır; ciddi bir bilinçlendirme gönderisinde şakacı bir etiket yersiz kaçar. Bu araçları amaca uygun ve ölçülü kullanmak, gönderinin hem etkili hem inandırıcı olmasını sağlar; her biri mesaja bir değer katmalı, yalnızca yer doldurmamalıdır.","t":"p"},{"t":"p","x":"Görsel-metin ilişkisi, sosyal medyanın kalbinde yer alır. Çoğu gönderi bir görselle birlikte var olur ve metin o görseli tamamlar; ikisi aynı şeyi tekrarlamaz, birbirini güçlendirir. Sınavda görseli çizemezsin ama metnin onu ima edebilir: 'Aşağıdaki fotoğrafta gördüğünüz gibi...' ya da 'İşte bu hafta topladıklarımız'. Bu, gönderinin gerçek bir platform gönderisi gibi durmasını sağlar. Ayrıca metnin kendisi de görsel olarak düzenlenir: kısa satırlar, ara boşluklar ve belki bir emoji, mesajı taranabilir kılar. Metni tek bir sıkışık blok olarak değil, gözün kolayca kayabileceği kısa parçalar olarak kurmak, gönderinin etkisini artırır."},{"x":"Temayı Gönderi Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda gönderi görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı kısa, çarpıcı ve etkileşimli bir mesaja dönüştürmektir. Örneğin 'Sharing the planet' teması altında çevre verildiğinde, konuyu uzun uzun anlatmak yerine tek bir kampanyaya odakla: 'bu hafta tek kullanımlık plastiği bırak' gibi. Sonra çarpıcı bir olgu, kısa bir çözüm ve somut bir çağrı ver. Aynı tema bir denemede tartışılabilir, bir raporda incelenebilirdi; gönderi merceği ise onu bir platformda saniyelerde dikkat çekip harekete davet eden keskin bir mesaja indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin gönderiyi güvenle yazmanı sağlar; anahtar, konuyu 'kaydırmayı durduracak bir çağrı' olarak görmektir.","t":"p"},{"x":"Zaman yönetimi gönderide farklı işler çünkü uzunluk kısadır ama yoğunluk yüksektir. İlk beş dakikada tek mesajını, kancanı ve somut çağrını belirle; sınav görevi birden çok kısa gönderi ya da bir kampanya dizisi isteyebilir, bu durumda her gönderiyi ayrı ama tutarlı kurgula. Ardından yaz ve son dakikalarda her satırın çalıştığını, çağrının somut olduğunu, hashtag ve tonun amaca uyduğunu ve kısalığa rağmen dilin doğru kaldığını kontrol et. Değerlendiricinin gözünden gönderi, kısalığı ve etkileşim gücüyle tanınır: Criterion C için platforma uygun register, Criterion B için net mesaj ve çağrı, Criterion A için kısa ama doğru ve çeşitli dil aranır. Metin türü beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kısa ve etkili biçimde bilgilendirmek, ikna etmek veya farkındalık yaratmak."], ["Kitle", "Bir platformun takipçileri veya kullanıcıları."], ["Register / Ton", "Kısa, canlı ve samimi; amaca uygun."], ["Yapı", "Dikkat çeken kısa mesaj, gerekirse maddeler, hashtag'ler, harekete geçirici çağrı."], ["Tipik özellikler", "Kısalık, hashtag (#), bahsetme (@), doğrudan hitap, net bir çağrı (Share, Sign up, Link below)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Amacı ve platformu belirle (bilgilendirme, davet, farkındalık).", "2. İlk satırda dikkat çek: bir soru veya çarpıcı ifade.", "3. Mesajı kısa ve net tut; tek bir ana fikir.", "4. Gerekli bilgiyi (tarih, yer, fiyat) kısa maddelerle ver.", "5. 2-4 ilgili hashtag ekle.", "6. Net bir çağrı koy (Tag a friend, Sign up, Link in bio).", "7. Son kontrol: kısa mı, hashtag ve çağrı var mı, ton platforma uygun mu?"]}, {"t": "given", "title": "Birinci örnek (farkındalık)", "x": "Every plastic bottle you skip is a small win for the planet.\n\nThis week, our school is going bottle-free. Bring a reusable one and we'll refill it for free at any fountain.\n\nSmall habit, big difference. Who's in?\n#GreenValley #PlasticFree #SmallSteps"}, {"t": "given", "title": "İkinci örnek (etkinlik, farklı bağlam)", "x": "THREE NIGHTS ONLY\n\nOur drama club presents 'The Long Night' — a story you won't forget.\n\n- 12 to 14 June, 7 pm\n- Tickets 20 lira at the door\n\nTag the friend you're bringing below.\n#GVHSDrama #SchoolPlay"}, {"t": "wizard", "wt": "social", "ai": false, "ptitle": "Görev", "prompt": "Okulunun bir kampanyası veya etkinliği için bir sosyal medya gönderisi yaz. Dikkat çeken kısa bir mesaj, gerekli bilgiler, uygun hashtag'ler ve net bir çağrı kullan.", "target": 120, "check": ["İlk satırda dikkat çektim ve mesajı kısa tuttum.", "Gerekli bilgiyi (tarih/yer/çağrı) net verdim (Criterion B).", "Uygun hashtag ve doğrudan bir çağrı kullandım (Criterion C).", "Ton platforma ve kitleye uygun.", "Kelime çeşitliliği kullandım (Criterion A)."], "model": {"title": "Model cevap (sosyal medya)", "x": "Exams are close, but you are not alone.\n\nThis week we're launching Study Buddies: free peer study sessions every lunchtime in the library. Bring your toughest subject; we'll bring the tea.\n\nNo pressure, no judgement, just people getting through it together.\n\nDrop by, or tag a friend who needs this below.\n#GreenValley #StudyBuddies #YouGotThis"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Uzun paragraflar yazmak. Sosyal medya kısadır; her kelime çalışsın.", "Hashtag veya çağrıyı unutmak. Bunlar türün imzasıdır (Criterion C).", "Yanlış ton. Resmi bir rapor dili sosyal medyada garip durur."]}]}, {"id": "t-ad", "group": "Kitle İletişim", "name": "Reklam (Advertisement)", "eyebrow": "Metin Türü", "blocks": [{"x":"Reklam Nedir ve Ne Zaman Karşına Çıkar?","t":"h"},{"t":"p","x":"Reklam (advertisement), bir ürünü, hizmeti, etkinliği ya da fikri bir kitleye tanıtıp onları harekete geçirmek, yani satın almaya, katılmaya ya da denemeye ikna etmek için yazılan bir metin türüdür. Bir dergi ilanı, bir afiş, bir el ilanı ya da çevrimiçi bir tanıtım olabilir. Paper 1'de kitle iletişim türleri arasında çıkar ve birçok prescribed theme'e bağlanır: 'Human ingenuity' altında bir teknoloji ürünü, 'Experiences' altında bir seyahat ya da etkinlik, 'Social organization' altında bir topluluk hizmeti reklam konusu olabilir. Reklamın özü, dikkat çekmek, arzu uyandırmak ve okuru net bir eyleme (call to action) yönlendirmektir; tarafsız bilgi değil, ikna eden çekici bir çağrıdır."},{"t":"h","x":"Kitle, Amaç ve Register"},{"t":"p","x":"Reklamın kitlesi hedeflenen tüketici ya da katılımcıdır: ürünün ya da etkinliğin ilgilendirebileceği belirli bir grup. Amaç ikna etmek ve harekete geçirmektir; reklam okurdan bir tepki (satın alma, kayıt, ziyaret) ister. Register çoğu zaman canlı, olumlu ve doğrudandır: okura 'you' ile seslenir, emir kipi kullanır ve heyecanlı bir ton benimser. Resmiyet ürüne göre değişir; lüks bir ürün daha ölçülü, gençlere dönük bir etkinlik daha enerjik bir dil kullanır. Reklam abartıya yaklaşabilir ama inandırıcılığını korumalıdır; boş vaat okuru kaçırır. Bu çekici, ikna edici ton reklamı tarafsız türlerden ayırır."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"x":"Reklamın imza öğeleri dikkat çeken bir başlık (slogan) ve net bir eylem çağrısıdır. Güçlü bir reklam çarpıcı bir başlıkla açılır: bir söz oyunu, bir vaat ya da bir soru ('Tired of Slow Mornings?'). Gövde ürünün ya da etkinliğin faydalarını öne çıkarır; özellikleri değil, okura ne kazandıracağını anlatır ('Wake up refreshed in half the time'). Pratik bilgiler (fiyat, tarih, yer, iletişim) verilir. Kapanışta güçlü bir eylem çağrısı bulunur: 'Buy now', 'Book today', 'Visit us this weekend'. Kimi reklam bir slogan ya da marka vaadiyle biter. Bu 'dikkat, arzu, çağrı' akışı reklamın omurgasıdır ve okuru adım adım eyleme taşır.","t":"p"},{"x":"Reklamın kalbi özellik ile fayda ayrımıdır. Deneyimsiz bir yazar ürünün özelliklerini sıralar ('This phone has a 5000 mAh battery'); usta bir yazar bu özelliği okur için bir faydaya çevirir ('Go two full days without reaching for a charger'). Okur özellikle değil, o özelliğin hayatını nasıl kolaylaştıracağıyla ilgilenir. Bu yüzden her cazip nokta 'bu bana ne kazandırır?' sorusuyla test edilmelidir. Fayda odaklı dil, reklamı kuru bir ürün listesinden çıkarıp arzu uyandıran bir çağrıya dönüştürür; okur kendini o faydanın içinde hayal ettiğinde ikna yolun yarısı tamamlanmış olur.","t":"p"},{"x":"Dil ve İkna Araçları","t":"h"},{"t":"p","x":"Reklamın dili çekici ve harekete çağıran araçlarla örülür. Emir kipi doğrudan eyleme iter: 'Grab yours', 'Don't wait', 'Discover'. Doğrudan seslenme ('you', 'your') okuru mesajın merkezine koyar. Güçlü, olumlu sıfatlar arzu uyandırır ('fresh', 'effortless', 'unforgettable'). Retorik sorular okuru bir ihtiyaca uyandırır ('Ready for a change?'). Üçlü listeler, tekrar ve aliterasyon akılda kalıcılık yaratır. Aciliyet ifadeleri ('for a limited time', 'while stocks last') harekete iter. Criterion A için bu tür, ikna dilini, sıfatları ve çağrı kalıplarını doğru ve çeşitli kullanmanı ister; aynı 'great' ya da 'best' kelimesini tekrarlamak yerine cazibeyi farklı sözcüklerle anlat."},{"x":"Çözümlü Model Örnek","t":"h"},{"x":"Güçlü bir reklam modeli düşünelim: bir okul yaz kampının ilanı. Başlık bir vaatle açılır ('This Summer, Trade Screens for Sunshine'). Gövde faydaları öne çıkarır: yeni arkadaşlıklar, açık hava maceraları, yeni beceriler; her biri okura ne kazandıracağıyla verilir. Pratik bilgiler nettir (tarih, yer, ücret, kayıt). Aciliyet eklenir ('Only 20 places left'). Kapanış güçlü bir çağrıyla biter ('Book your spot today and make this summer unforgettable'). Bir slogan mesajı mühürler. İşte üç kriteri karşılayan bir reklam: canlı ve ikna edici register (C), faydalar ve çağrı etkili biçimde geliştirilmiş (B), dil çekici ve çeşitli (A). Reklam abartıya yaklaşır ama vaatleri makul kalır.","t":"p"},{"t":"h","x":"Reklamı Benzer Türlerden Ayırmak"},{"t":"p","x":"Öğrenciler reklamı en çok incelemeyle (review) ve broşürle (brochure) karıştırır. İnceleme dengeli ve dürüsttür; hem güçlü hem zayıf yönleri söyler ve gerekçeli bir yargı verir. Reklam ise yalnızca över ve satmaya çalışır; zayıf yön anmaz. Broşür bilgilendirir ve tanıtır, çoğu zaman daha ölçülü ve bölümlüdür; reklam ise daha keskin biçimde ikna ve eyleme odaklanır, güçlü bir çağrı taşır. Aynı ürün incelemede tartılıp puanlanır, broşürde ayrıntılı tanıtılır, reklamda ise çarpıcı biçimde satılır. Görevde 'advertisement' ya da 'advert' ifadesini gördüğünde şu üçlüyü hatırla: dikkat çeken başlık, fayda odaklı ikna ve net eylem çağrısı."},{"head":["Tür","Amaç","Ayırt edici işaret"],"t":"table","rows":[["Reklam (Advertisement)","Sat, harekete geçir","Slogan, fayda odağı, eylem çağrısı (CTA)"],["İnceleme (Review)","Değerlendir ve öner","Güçlü/zayıf denge, gerekçeli yargı"],["Broşür (Brochure)","Bilgilendir ve tanıt","Bölümlü bilgi, ölçülü ton, ayrıntı"]]},{"t":"h","x":"İkna ile İnandırıcılık Dengesini Kurmak"},{"t":"p","x":"Reklamda en çok kaybedilen puan aşırı abartıdan ve zayıf çağrıdan gelir; bu Criterion B ve C'yi etkiler. Her şeyi 'en iyi', 'mükemmel', 'inanılmaz' diye niteleyen bir reklam boş ve güvenilmez görünür; okur abartıyı sezer ve inancını yitirir. Güçlü ikna somut faydaya ve makul vaade dayanır: 'the best camp ever' yerine 'three days of climbing, kayaking and campfire nights'. Somut ayrıntı, boş övgüden çok daha inandırıcıdır. Ayrıca çağrı belirgin ve kolay olmalı; okur ne yapacağını ve nasıl yapacağını tam bilmelidir. İkna ile inandırıcılık dengesi, reklamı etkili kılan ince çizgidir."},{"x":"Reklamı güçlendirmenin yolu hedef kitleyi tanımak ve mesajı ona göre biçimlendirmektir. Genel bir reklam herkese seslenmeye çalışır ve kimseye ulaşmaz; hedefli bir reklam belirli bir okurun ihtiyacına dokunur. Gençlere dönük bir kamp reklamı macera ve arkadaşlığı öne çıkarırken, ailelere dönük olanı güvenlik ve gelişimi vurgular. Aynı ürün, farklı kitleye farklı faydalarla sunulur. Bu yüzden yazmadan önce 'kime sesleniyorum ve o neyi umursar?' diye sor. Kitleye uygun fayda ve ton seçimi, reklamı hedefine ulaştıran şeydir; doğru kişiye doğru vaat, ikna gücünü katlar.","t":"p"},{"t":"h","x":"Reklam Becerisinin Paper 2 ve Individual Oral'a Katkısı"},{"x":"Reklam yazmayı öğrenmek, ikna dilini ve kitle bilincini geliştirir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde reklam ve tanıtım metinleri çıkar; ikna araçlarını ve fayda dilini tanıyan öğrenci yazarın amacını ve hedef kitlesini isabetle çözer, ton sorularını daha güvenle yanıtlar. Individual Oral'da ise bir görseli, özellikle bir reklam görselini yorumlarken reklamda kazandığın çözümleme işe yarar: hangi ikna aracının kullanıldığını, kime seslenildiğini ve mesajın bir prescribed theme ile nasıl ilişkilendiğini açıklarsın. İkna dilini üretmeyi bilmek, onu çözümlemeyi de kolaylaştırır; bu iki yönlü beceri sınav boyunca değer taşır.","t":"p"},{"t":"note","k":"ipucu","title":"Reklamda puan kazandıran küçük hamleler","lines":["Dikkat çeken bir başlık ya da slogan kur: vaat, soru ya da söz oyunu.","Özellikleri faydaya çevir: okura ne kazandırır?","Hedef kitleyi düşün ve mesajı ona göre biçimlendir.","Somut ayrıntıyla ikna et; boş abartıdan kaçın.","Net bir eylem çağrısı ekle: Buy, Book, Join, Visit.","Aciliyet ve doğrudan seslenmeyle harekete iter dil kullan."]},{"x":"Sık yapılan hatalar reklamı zayıflatır. En büyüğü aşırı abartıdır: her şeyi 'mükemmel' ilan etmek güveni yıkar; somut ve makul kal. İkincisi özellik ile faydayı karıştırmaktır; ürünün teknik özelliklerini sıralamak değil, okura kazandıracağını anlatmak gerekir. Üçüncüsü çağrısız kalmaktır: eylem çağrısı olmayan bir reklam okuru ne yapacağı konusunda boşta bırakır. Dördüncüsü kitleyi görmezden gelmektir; herkese seslenen genel mesaj kimseye ulaşmaz. Beşincisi ise incelemeyle karışıp zayıf yön anmaktır; reklam över, dengeli değerlendirme yapmaz. Fayda odağı, somut ikna ve net çağrı bu tuzakları önler.","t":"p"},{"x":"Marka Sesi ve Akılda Kalıcılık","t":"h"},{"t":"p","x":"Etkili bir reklam, tutarlı bir sese ve akılda kalan bir çekirdeğe sahiptir. Marka sesi, reklamın baştan sona koruduğu kişiliktir: bir gençlik kampı enerjik ve samimi konuşurken, bir sağlık ürünü güven veren ve sakin bir ton benimser. Bu ses, başlıktan çağrıya kadar tutarlı kalmalıdır; ton ortada değişirse okur kafası karışır ve güvenini yitirir. Reklamı yazmadan önce 'bu ürün bir insan olsaydı nasıl konuşurdu?' diye düşünmek, tutarlı bir ses bulmana yardım eder. Tutarlı bir kişilik, reklamı yalnızca bir bilgi yığını olmaktan çıkarıp okurun hatırlayacağı bir izlenime dönüştürür."},{"t":"p","x":"Akılda kalıcılık, reklamın en değerli özelliğidir ve dil araçlarıyla kurulur. Bir slogan, bir söz oyunu, bir tekrar ya da bir aliterasyon ('Fresh Food, Fast') mesajı okurun zihnine kazır. Kısa ve ritmik ifadeler uzun açıklamalardan daha kalıcıdır; okur bir reklamdan çıktığında ayrıntıları değil, o çarpıcı çekirdeği hatırlar. Bu yüzden reklamın merkezine tek bir güçlü fikir ya da vaat koymak, onu dağıtmaktan iyidir. Bir reklamın başarısı, okur onu okuduktan saatler sonra bile o tek cümleyi hatırlıyorsa gelir; bu da özenle seçilmiş, ritmi olan ve tek bir mesaja odaklanan bir dille sağlanır."},{"x":"Reklamda duygu, ikna gücünün gizli motorudur. Okur çoğu zaman bir ürünü özellikleri için değil, ona hissettirdikleri için ister: özgürlük, aidiyet, güven, heyecan ya da rahatlık. Usta bir reklam bu duyguya dokunur; bir yaz kampını 'aktivite listesi' olarak değil, 'unutulmaz bir yaz' vaadi olarak sunar. Ancak duygu, dürüstlükle dengelenmelidir; sahte ya da abartılı bir duygu okuru iter. En güçlü reklam, gerçek bir faydayı gerçek bir duyguya bağlar: 'iki gün şarj derdi olmadan, özgürce'. Duyguyu somut bir faydayla birleştirmek, reklamı hem çekici hem inandırıcı kılar ve okuru harekete iten asıl kıvılcımı yakar.","t":"p"},{"x":"Temayı Reklam Merceğinden Çerçevelemek","t":"h"},{"x":"Sınavda reklam görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı satılabilir, harekete çağıran bir mesaja dönüştürmektir. Örneğin 'Experiences' teması altında seyahat verildiğinde, konuyu tartışmak yerine somut bir teklife çevir: 'bu yaz bir doğa kampına katıl' gibi. Sonra dikkat çeken bir başlık, okura dönük faydalar ve net bir çağrı kur. Aynı tema bir denemede tartışılabilir, bir incelemede değerlendirilebilirdi; reklam merceği ise onu dikkat çekip arzu uyandıran ve eyleme davet eden çekici bir çağrıya indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin reklamı güvenle yazmanı sağlar; anahtar, konuyu 'okuru harekete geçirecek bir teklif' olarak görmektir.","t":"p"},{"x":"Zaman yönetimi reklamda yaratıcılığa ve düzene birlikte zaman ayırmayı gerektirir. İlk beş dakikada ürünü/etkinliği, hedef kitleyi, iki üç faydayı ve çağrıyı belirle; başlığın ya da slogana da bu aşamada karar ver. Ardından yaz ve son dakikalarda başlığın çekici, faydaların somut, çağrının net ve dilin doğru olduğunu kontrol et; abartının makul sınırda kaldığından emin ol. Değerlendiricinin gözünden reklam, ikna gücü ve net çağrısıyla tanınır: Criterion C için canlı ve amaca uygun register, Criterion B için fayda ve eylem çağrısının etkili gelişimi, Criterion A için çekici ama doğru ve çeşitli dil aranır. Metin türü beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir ürünü, hizmeti veya etkinliği tanıtıp okuru satın almaya/harekete geçmeye ikna etmek."], ["Kitle", "Hedeflenen müşteri veya katılımcı."], ["Register / Ton", "İkna edici, çarpıcı, kısa ve enerjik."], ["Yapı", "Akılda kalan slogan/başlık, ana fayda, bir teklif/detay, güçlü çağrı, iletişim."], ["Format", "Görsel ağırlıklı; elle yazımda slogan + kısa metin + [Image: ...] + çağrı ile temsil et."], ["Tipik özellikler", "Slogan, çekici dil, fayda vurgusu, emir kipi, teklif/fiyat, [Image] yer tutucu, çağrı."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Ürünü/teklifi ve hedef kitleyi belirle.", "2. Akılda kalan bir slogan veya başlık bul.", "3. Ana faydayı vurgula: bu neden alınmalı?", "4. Bir teklif veya detay ekle (fiyat, indirim, özellik).", "5. [Image: ...] ile görsel yerini belirt.", "6. Güçlü bir çağrı ve iletişim bilgisi koy (Order now, Visit...).", "7. Son kontrol: slogan + fayda + teklif + çağrı var mı?"]}, {"t": "given", "title": "Birinci örnek (ürün)", "x": "TIRED OF COLD MORNINGS? MEET THE POCKET WARMER.\n\nOne click, twelve hours of heat. Small enough for your pocket, powerful enough for the coldest bus stop.\n\n[Image: a student smiling in the snow, holding the warmer]\n\nToday only: buy one, get one free. Just 199 lira.\nOrder now at www.pocketwarmer.example."}, {"t": "given", "title": "İkinci örnek (hizmet, farklı bağlam)", "x": "LEARN TO SWIM THIS SUMMER.\n\nAfraid of water? Our patient coaches have taught over 2,000 nervous beginners to swim with real confidence.\n\nSmall groups. Warm pool. Genuine results.\n\n[Image: a child laughing while floating beside an instructor]\n\nYour first lesson is free. Book today: 0212 555 44 33."}, {"t": "wizard", "wt": "advertisement", "ai": false, "ptitle": "Görev", "prompt": "Bir ürün, hizmet veya etkinlik için bir reklam yaz. Akılda kalan bir slogan, ana faydayı, bir teklif ([Image] yer tutucu dahil) ve güçlü bir çağrı kullan.", "target": 150, "check": ["Akılda kalan bir slogan/başlıkla açtım.", "Ana faydayı ve bir teklif/detayı vurguladım (Criterion B).", "[Image: ...] yer tutucu ve güçlü bir çağrı kullandım (Criterion C).", "İkna edici, kısa ve enerjik bir dil kullandım (Criterion A).", "İletişim/çağrı bilgisini ekledim."], "model": {"title": "Model cevap (reklam)", "x": "STILL SCROLLING FOR SOMETHING TO DO THIS WEEKEND?\n\nStop. The Riverside Skate Park is open, and your first session is on us.\n\nWhether you've never touched a board or you're chasing your next trick, our friendly instructors will have you rolling in no time. Helmets and boards provided — just bring your courage.\n\n[Image: teenagers laughing on ramps under a bright sky]\n\nThis Saturday, 10 am to 6 pm. First hour free for students.\nFind us at Riverside Park, next to the old bridge. Come and roll with us."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Slogansız, düz bir tanıtım yazmak. Reklamın kalbi akılda kalan bir slogandır.", "Faydayı değil sadece özelliği anlatmak. Okur 'bu bana ne katar' bilmek ister.", "Çağrıyı unutmak. Reklam mutlaka bir eyleme çağırır (Buy, Book, Visit)."]}]}, {"id": "t-webpage", "group": "Kitle İletişim", "name": "Web Sayfası (Web Page)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Web Sayfası Nedir ve Ne Zaman Karşına Çıkar?"},{"x":"Web sayfası (web page), bir çevrimiçi ziyaretçiye bilgi sunan, tarama-dostu (kolay göz gezdirilen) biçimde düzenlenmiş bir metin türüdür. Bir kurumun tanıtım sayfası, bir etkinliğin bilgi sayfası, bir 'hakkımızda' ya da 'sıkça sorulan sorular' bölümü olabilir. Paper 1'de kitle iletişim türleri arasında çıkar ve birçok prescribed theme'e bağlanır: 'Social organization' altında bir topluluk sayfası, 'Human ingenuity' altında bir proje tanıtımı, 'Sharing the planet' altında bir çevre girişiminin sayfası olabilir. Web sayfasının özü, çevrimiçi okurun hızla tarayarak istediği bilgiye ulaşmasını sağlamaktır; uzun, akan bir yazı değil, başlıklar ve bölümlerle parçalanmış, gezinilebilir bir bilgi düzenidir.","t":"p"},{"t":"h","x":"Kitle, Amaç ve Register"},{"t":"p","x":"Web sayfasının kitlesi belirli bir bilgiyi ya da hizmeti arayan çevrimiçi ziyaretçidir: sabırsız, tarayarak okuyan ve aradığını bulamazsa hemen ayrılan bir okur. Amaç bilgilendirmek ve yönlendirmektir; ziyaretçiyi bir eyleme (kayıt, iletişim, katılım) taşımak da hedeflenebilir. Register bağlama göre değişir ama çoğu zaman erişilebilir ve davetkârdır: net, sıcak ve doğrudan bir ton, okura 'you' ile seslenme yaygındır. Bir kurumsal sayfa daha resmi, bir topluluk sayfası daha samimi olabilir. Web sayfası okuru sıkmadan bilgilendirmeli; bu yüzden dil açık, cümleler yönetilebilir ve ton yardımcı olmalıdır."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"x":"Web sayfasının en belirgin imzası tarama-dostu düzenidir; bu görsel yapı Criterion C'nin kanıtıdır. Genellikle net bir ana başlıkla açılır ve içerik kısa bölümlere ayrılır; her bölümün açıklayıcı bir alt başlığı vardır ('About Us', 'What We Do', 'How to Join'). Metin kısa paragraflar, madde listeleri ve öne çıkan bilgilerle parçalanır; uzun bloklar kaçınılır. Çoğu sayfa bir eylem çağrısı ya da bağlantı içerir ('Sign up here', 'Contact us'). Kimi sayfa sık sorulan sorular ya da öne çıkan alıntılar barındırır. Bu başlıklı, bölümlü ve gezinilebilir düzen, web sayfasını akan düz metinlerden ayıran temel özelliktir.","t":"p"},{"x":"Web sayfasının başarısı taranabilirliğinde gizlidir. Çevrimiçi okur satır satır okumaz; gözüyle sayfayı tarar, başlıklara atlar ve ilgilendiği bölümde durur. Bu yüzden alt başlıklar bilgilendirici olmalı, okurun aradığını hemen bulmasını sağlamalıdır ('When and Where' başlığı altında tarih ve yer beklenir). Her bölüm kendi içinde anlamlı olmalı; okur ortadan bir bölüme atladığında bağlamı kaybetmemelidir. Öne çıkan bilgiler (tarih, ücret, iletişim) kolayca görülebilir olmalıdır. İyi bir web sayfası, okurun sabırsızlığını bir kusur değil bir tasarım ilkesi olarak kabul eder ve bilgiyi ona göre parçalar.","t":"p"},{"x":"Dil ve Erişilebilirlik Araçları","t":"h"},{"x":"Web sayfasının dili net, öz ve okuru yönlendiren araçlarla kurulur. Bilgilendirici alt başlıklar sayfayı bölümlere ayırır ve gezinmeyi kolaylaştırır. Kısa paragraflar ve madde listeleri bilgiyi sindirilebilir kılar; bir dizi özellik ya da adım, düz paragraf yerine listede daha okunur olur. Doğrudan seslenme ('you can', 'join us') okuru sürecin içine alır. Eylem çağrıları ve bağlantı ifadeleri ('Learn more', 'Book now') okuru bir sonraki adıma taşır. Criterion A için bu tür, net ve çeşitli bir dil ister: kısa cümleler basit dil demek değildir; alt başlıklar, listeler ve akıcı paragrafları dengede tutarak hem düzeni hem dil zenginliğini sergilersin.","t":"p"},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"Güçlü bir web sayfası modeli düşünelim: bir okul çevre kulübünün tanıtım sayfası. Ana başlık kulübü tanıtır ('Green Valley Eco Club: Small Steps, Big Change'). Kısa bir giriş paragrafı amacı özetler. Ardından bölümler alt başlıklarla ayrılır: 'What We Do' (etkinlikler madde listesiyle), 'When We Meet' (gün, saat, yer net biçimde), 'Why Join' (faydalar), 'How to Join' (adımlar ve iletişim). Öne çıkan bilgiler kolayca bulunur ve bir eylem çağrısı sayfayı kapatır ('Ready to make a difference? Sign up at the front office'). İşte üç kriteri karşılayan bir web sayfası: erişilebilir ve davetkâr register (C), bilgi bölümlü ve amaca uygun geliştirilmiş (B), dil net ve çeşitli (A).","t":"p"},{"x":"Web Sayfasını Benzer Türlerden Ayırmak","t":"h"},{"t":"p","x":"Öğrenciler web sayfasını en çok broşürle (brochure) ve makaleyle (article) karıştırır. Broşür de bölümlü ve tanıtıcıdır, ama basılı bir formatı ve genelde katlanan bir düzeni çağrıştırır; web sayfası ise çevrimiçidir, bağlantılara ve gezinmeye yaslanır ve tarama-dostu düzeni daha belirgindir. Makale bir konuyu akan paragraflarla, tek bir argüman ya da anlatı çizgisinde ele alır; web sayfası ise bir konuyu tartışmaz, bilgiyi bağımsız bölümlerde sunar ve okurun istediğine atlamasını sağlar. Aynı konu makalede baştan sona okunur, web sayfasında ise taranır ve parça parça alınır. Görevde 'web page' ya da 'website' ifadesini gördüğünde şu üçlüyü hatırla: net başlıklar, bölümlü bilgi ve tarama-dostu düzen."},{"head":["Tür","Amaç","Ayırt edici işaret"],"t":"table","rows":[["Web sayfası (Web page)","Bilgilendir ve yönlendir","Alt başlıklar, bölümler, tarama-dostu, bağlantı/CTA"],["Broşür (Brochure)","Tanıt ve bilgilendir","Basılı düzen, bölümlü tanıtım, görsel katlar"],["Makale (Article)","Bilgilendir ve ilgilendir","Akan paragraflar, tek anlatı çizgisi"]]},{"t":"h","x":"Bilgiyi Bölümlere Ayırmak ve Öne Çıkarmak"},{"t":"p","x":"Web sayfasında en çok kaybedilen puan düzensizlikten ve uzun bloklardan gelir; bu Criterion C'yi (tür/format) düşürür. Bilgiyi tek bir uzun paragrafa yığmak web sayfasının doğasına aykırıdır; okur o bloğu tarayamaz ve ayrılır. Çözüm, bilgiyi mantıklı bölümlere ayırmak ve her bölüme okurun aradığını gösteren bir alt başlık vermektir. Öne çıkan bilgiler (tarih, ücret, iletişim, son tarih) belirgin kılınmalı, uzun cümlelerin içine gömülmemelidir. Madde listeleri bir dizi bilgiyi hızla iletir. Bölümlere ayrılmış, öne çıkarılmış bilgi, web sayfasını gerçekten gezinilebilir ve işlevsel kılar."},{"t":"p","x":"Web sayfasını güçlendirmenin yolu, her bölümü kendi başına anlamlı ve okuru bir sonraki adıma taşıyacak biçimde kurmaktır. Okur sayfaya bir arama sonucundan gelip ortadaki bir bölüme atlayabilir; o bölüm tek başına anlaşılır olmalıdır. Ayrıca her bölüm okuru pasif bırakmamalı, mümkünse bir eyleme ya da başka bir bölüme yönlendirmelidir ('For more, see How to Join below'). Eylem çağrıları sayfanın amacını tamamlar; bilgi vermek yeterli değildir, okuru katılıma ya da iletişime taşımak gerekir. Bağımsız ama birbirine bağlanan bölümler, web sayfasını hem gezinilebilir hem amaca hizmet eden bir bütün yapar."},{"x":"Web Sayfası Becerisinin Paper 2 ve Individual Oral'a Katkısı","t":"h"},{"t":"p","x":"Web sayfası yazmayı öğrenmek, bilgiyi düzenleme ve okur için erişilebilir kılma becerisidir; bu sınavın her yerinde işe yarar. Paper 2 okuma bölümünde web sayfaları ve dijital bilgi metinleri çıkar; bölümlü yapıyı ve tarama mantığını tanıyan öğrenci bir bilginin hangi başlık altında olacağını sezer ve soruları hızla yanıtlar. Individual Oral'da ise bir konuyu ya da görseli bir prescribed theme etrafında sunarken web sayfasında kazandığın 'bilgiyi bölümleme' becerisi işe yarar: dağınık anlatmak yerine düşünceni net başlıklar altında, okurun izleyebileceği bir düzende sunarsın. Bilgiyi erişilebilir kılmak, hem yazıda hem konuşmada değer taşıyan bir beceridir."},{"lines":["Net bir ana başlıkla aç; sayfanın ne olduğunu hemen belli et.","İçeriği bölümlere ayır ve her bölüme bilgilendirici alt başlık ver.","Uzun bloklardan kaçın; kısa paragraf ve madde listeleri kullan.","Öne çıkan bilgileri (tarih, yer, iletişim) belirgin kıl.","Doğrudan seslen ('you') ve okuru davetkâr bir tonla karşıla.","Bir eylem çağrısı ya da yönlendirme ekle: Sign up, Contact, Learn more."],"title":"Web sayfasında puan kazandıran küçük hamleler","k":"ipucu","t":"note"},{"t":"p","x":"Sık yapılan hatalar web sayfasını zayıflatır. En büyüğü bilgiyi uzun, bölünmemiş bloklara yığmaktır; bu tarama-dostu düzeni yok eder ve Criterion C düşer. İkincisi alt başlıkları eksik ya da belirsiz bırakmaktır; okur aradığını bulamaz. Üçüncüsü makaleye kaymaktır: konuyu tek bir akan anlatıya çevirmek türü bozar, bilgiyi bağımsız bölümlerde sun. Dördüncüsü öne çıkan bilgileri gömmektir; tarih ya da iletişim uzun cümlelerin içinde kaybolmamalı. Beşincisi ise eylem çağrısını atlamaktır; okuru bir sonraki adıma taşımayan sayfa amacına ulaşmaz. Bölümlü düzen, net başlıklar ve belirgin bilgi bu tuzakları önler."},{"x":"Bağlantılar ve Gezinme Mantığı","t":"h"},{"t":"p","x":"Web sayfasını basılı metinlerden ayıran en temel şey, bağlantılar ve gezinme mantığıdır. Bir web sayfası tek başına durmaz; başka sayfalara, bölümlere ya da eylemlere köprü kurar. Sınavda gerçek bağlantı ekleyemezsin ama bu mantığı metne yansıtabilirsin: 'Daha fazlası için aşağıdaki Nasıl Katılırsınız bölümüne bakın' ya da 'Kayıt için buraya tıklayın' gibi ifadeler, sayfanın çevrimiçi doğasını gösterir. Bu yönlendirmeler okuru pasif bırakmaz; onu bir sonraki adıma, bir bölüme ya da bir eyleme taşır. Gezinme mantığını metne katmak, yazının gerçek bir web sayfası gibi durmasını ve amacına hizmet etmesini sağlar."},{"x":"Bölümlerin sırası da bir gezinme mantığı taşır. İyi bir web sayfası, okurun doğal soru sırasını izler: önce 'bu nedir?' (giriş, hakkımızda), sonra 'ne sunuyor?' (özellikler, etkinlikler), sonra 'bana ne fayda sağlar?' ve en sonda 'nasıl katılırım / iletişim'. Bu sıra okuru bilgiden eyleme doğru akıtır. En önemli ve en çok aranan bilgiyi üste koymak da tarama mantığının bir parçasıdır; okur aradığını hemen görmeli, sayfanın dibine inmek zorunda kalmamalıdır. Bölümleri okurun düşünce akışına göre dizmek, sayfayı sezgisel ve kullanışlı kılar.","t":"p"},{"x":"Her bölümün bağımsız anlaşılırlığı, web sayfasının kritik bir özelliğidir. Okur sayfaya bir arama sonucundan gelip doğrudan ortadaki bir bölüme atlayabilir; bu yüzden her bölüm, öncekini okumamış biri için bile anlamlı olmalıdır. Bir bölüm 'yukarıda anlatıldığı gibi' diye başlarsa, ortadan gelen okur bağlamı kaybeder. Bunun yerine her bölüm kendi mini-bağlamını taşımalı ve tam bir bilgi vermelidir. Bu bağımsızlık, sayfayı hem taranabilir hem esnek kılar; okur istediği yerden girebilir ve yine de aradığını bulur. Bağımsız ama tutarlı bölümler, iyi bir web sayfasının hem kullanışlılığını hem profesyonel görünümünü belirler.","t":"p"},{"t":"h","x":"Temayı Web Sayfası Merceğinden Çerçevelemek"},{"x":"Sınavda web sayfası görevi genellikle bir prescribed theme'e bağlanır ve senin işin o temayı gezinilebilir bir bilgi düzenine dönüştürmektir. Örneğin 'Social organization' teması altında bir topluluk girişimi verildiğinde, konuyu akan bir yazı olarak değil, bölümlü bir sayfa olarak kur: 'Hakkımızda', 'Ne Yapıyoruz', 'Nasıl Katılırsınız' başlıklarıyla. Sonra her bölümü kısa ve net doldur, öne çıkan bilgileri belirginleştir ve bir çağrıyla kapat. Aynı tema bir makalede anlatılabilir, bir raporda incelenebilirdi; web sayfası merceği ise onu okurun tarayıp istediğine ulaşabileceği bölümlü bir bilgi düzenine indirir. Bu çerçeveleme becerisi, hangi tema gelirse gelsin web sayfasını güvenle yazmanı sağlar.","t":"p"},{"x":"Zaman yönetimi web sayfasında yapıyı önceden kurmayı gerektirir. İlk beş dakikada sayfanın bölümlerini ve her bölümün alt başlığını belirle; hangi bilginin nerede duracağını planla. Bu iskelet çıktığında yazı düzenli akar. Ardından yaz ve son on dakikada her bölümün net bir alt başlığı olduğunu, uzun blokların parçalandığını, öne çıkan bilgilerin görünür durduğunu ve bir eylem çağrısının bulunduğunu kontrol et. Değerlendiricinin gözünden web sayfası, tarama-dostu düzeni ve erişilebilir tonuyla tanınır: Criterion C için bölümlü format ve davetkâr register, Criterion B için bilginin amaca uygun düzenlenmesi, Criterion A için net ve çeşitli dil aranır. Metin türü beklentilerini güncel resmi IB English B Guide üzerinden teyit etmeyi ihmal etme.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kurum, etkinlik veya konu hakkında çevrimiçi bilgi sunmak ve kullanıcıyı yönlendirmek."], ["Kitle", "Siteyi ziyaret eden kullanıcılar."], ["Register / Ton", "Net, davetkâr; çoğunlukla yarı resmi."], ["Yapı", "Başlık/banner, kısa tanıtım, gezinme menüsü, bölüm başlıkları, kısa metin/maddeler, butonlar, altbilgi."], ["Format", "Elle yazımda: başlık + [Menu: Home | About | Contact] + bölüm başlıkları + [Button: Sign up] ile temsil et."], ["Tipik özellikler", "Başlık, gezinme (menu), bölüm başlıkları, kısa metin, butonlar/linkler, iletişim/altbilgi."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Sayfanın amacını ve kimin için olduğunu belirle.", "2. Bir başlık/banner ve kısa bir hoş geldin metni yaz.", "3. Gezinme menüsünü işaretle: [Menu: Home | About | ...].", "4. İçeriği bölüm başlıkları ve kısa paragraf/maddelerle sun.", "5. Butonları/linkleri belirt: [Button: Sign up].", "6. Altbilgide iletişim ve link ver.", "7. Son kontrol: başlık + menu + bölümler + butonlar + altbilgi var mı?"]}, {"t": "given", "title": "Birinci örnek (okul)", "x": "[Banner: GREEN VALLEY HIGH SCHOOL]\n[Menu: Home | About | Admissions | Contact]\n\nWelcome to Green Valley\nA place where curiosity meets community.\n\nWHY CHOOSE US\n- Small, friendly classes\n- Over twenty clubs and sports\n- A strong record of university success\n\n[Button: Book a Tour]\n\nFooter: 15 Valley Road, 0212 000 00 00, info@greenvalley.example"}, {"t": "given", "title": "İkinci örnek (etkinlik, farklı bağlam)", "x": "[Banner: RIVERSIDE ARTS FESTIVAL]\n[Menu: Home | Line-up | Tickets | Getting Here]\n\nThree Days by the River\nMusic, food and workshops for everyone.\n\nWHAT'S ON\n- Two open-air stages\n- Free art and dance workshops\n- Street food from thirty local kitchens\n\n[Button: Get Your Tickets]\n\nFooter: Riverside Park, 14 to 16 June, hello@riversidefest.example"}, {"t": "wizard", "wt": "webpage", "ai": false, "ptitle": "Görev", "prompt": "Bir okul, kulüp veya etkinlik için bir web sayfası (ana sayfa) yaz. Başlık/banner, bir menü, bölüm başlıkları, kısa maddeler, en az bir buton ve bir altbilgi kullan.", "target": 180, "check": ["Bir başlık/banner ve kısa bir hoş geldin metni yazdım.", "Bir gezinme menüsü [Menu: ...] belirttim.", "İçeriği bölüm başlıkları ve kısa maddelerle sundum (Criterion C).", "En az bir buton [Button: ...] ve bir altbilgi (iletişim) ekledim.", "Net, davetkâr bir dil kullandım (Criterion A/B)."], "model": {"title": "Model cevap (web sayfası)", "x": "[Banner: THE GREEN VALLEY ECO CLUB]\n[Menu: Home | Projects | Events | Join Us]\n\nSmall Actions, Big Change\nWelcome to the Eco Club, a group of students working to make our school greener, one project at a time.\n\nWHAT WE DO\n- Run the school recycling scheme\n- Grow vegetables in the courtyard garden\n- Organise clean-up days along the river\n\nWHY JOIN\nYou don't need to be an expert. You just need to care. Every member helps shape what we do next, and you will meet people who want to change things too.\n\n[Button: Join the Club]\n\nFooter: Meet us every Thursday, Room 12, ecoclub@greenvalley.example"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Sayfayı düz bir denemeye çevirmek. Web sayfasında menu, bölümler ve butonlar görünür olmalı.", "Gezinme (menu) ve butonları unutmak. Bunlar türü belli eder (Criterion C).", "Uzun paragraflar. Web okuru tarar; kısa bölümler ve maddeler kullan."]}]}, {"id": "paper1", "group": "Writing", "name": "Paper 1 Yazma", "eyebrow": "Paper 1 . Yaz", "blocks": [{"t":"h","x":"Paper 1 Sınav Anında Nasıl İşler?"},{"x":"Paper 1, English B'nin yazma becerini ölçen dış değerlendirmesidir ve final notunun yaklaşık dörtte birini oluşturur. Sınav 75 dakikadır ve önüne üç ayrı görev (prompt) konur; bunlardan yalnızca BİRİNİ seçip yanıtlarsın. Her görev genellikle farklı bir prescribed theme'e ve farklı bir metin türüne yönlendirir, böylece hangi konuda ve türde daha güçlü olduğunu seçme şansın olur. SL öğrencileri 250-400 kelimelik tek bir metin yazar; HL öğrencileri ise 450-600 kelimelik tek bir metin yazar. Bu ders sana o 75 dakikayı en verimli biçimde nasıl kullanacağını, yani sınav anında adım adım ne yapacağını öğretir. Kesin kelime sınırlarını ve süreleri her zaman güncel resmi IB English B Guide'dan teyit et.","t":"p"},{"t":"p","x":"Paper 1'de başarı üç şeyin birleşimidir: doğru görev seçimi, iyi bir plan ve üç kriteri bilinçli uygulayan bir yazım. Bu üçü olmadan, dil ne kadar iyi olursa olsun puan tavana vurmaz. Çoğu öğrenci doğrudan yazmaya başlar ve yarı yolda yapısını kaybeder; oysa birkaç dakikalık plan, hem zamanı hem puanı kurtarır. Aşağıda bu süreci evrelere böleceğiz: seçim, planlama, yazım, kriter uygulaması, kelime ve zaman disiplini ve son kontrol. Her evreyi kendi sınav pratiğinde tekrarla; bu akış içselleştiğinde, sınav anında panik yerine bir rutin devreye girer."},{"x":"Görevi Doğru Seçmek","t":"h"},{"t":"p","x":"Üç görev arasından seçim yaparken en yaygın hata, en ilgi çekici konuyu seçmektir. Doğru ölçüt konu değil, metin türüdür. Kendine sor: bu üç türden hangisinin kurallarına en iyi hakimim? Fikir bolluğun olan ama türünü tanımadığın bir görev tuzaktır; çünkü mesajın güçlü olsa bile yanlış türde yazarsan Criterion C çöker. Örneğin harika fikirlerin olduğu bir konu bir 'proposal' (öneri) istiyorsa ve sen öneri yapısını bilmiyorsan, o görevden uzak dur. Türünü iyi bildiğin, imza öğelerini ve register'ını rahatça kurabileceğin görevi seç; fikirler her konuda üretilebilir ama tür bilgisi anlık üretilemez."},{"t":"p","x":"Seçimini yaparken her görevi hızlıca üç soruyla tara: hangi metin türü isteniyor, kime yazacağım ve amaç ne? Bu üç yanıtı en net verebildiğin görev, en güvenli seçimdir. Ayrıca görevin sana ne kadar somut malzeme verdiğine bak; bazı görevler bir bağlam, bir durum veya birkaç ipucu sunar ve bunlar fikir üretmeni kolaylaştırır. Seçimini bir dakika içinde yap ve geri dönme; kararsızlık, değerli sınav zamanını yer. Seçtiğin görevi bir daha oku ve anahtar kelimelerin altını çiz."},{"t":"h","x":"Planlama: İlk Beş Dakika"},{"x":"Yazmaya başlamadan önce yaklaşık beş dakikanı planlamaya ayır; bu, tüm sınavın en yüksek getirili yatırımıdır. Önce üç temel kararı yaz: metin türü, kitle ve register. Sonra o türün zorunlu imza öğelerini not et: başlık mı, hitap mı, imza mı, alt başlık mı, tarih mi gerekiyor? Ardından üç dört ana fikir seç ve her birini bir örnekle geliştirmeyi planla. Son olarak açılış cümleni zihninde kur; güçlü bir açılış, metnin geri kalanını sürükler. Bu plan bir taslak değil, bir pusuladır; yazarken kaybolduğunda ona dönersin.","t":"p"},{"x":"Planlama aşamasında fikirlerini yüzeysel bırakma tuzağına karşı önlem al. Her ana fikrin yanına onu nasıl geliştireceğini kısaca not et: hangi örnek, hangi ayrıntı, hangi sonuç? Criterion B'de en çok puan, fikirlerin çıplak bırakılmayıp geliştirilmesinden gelir. Ayrıca fikirlerinin sırasını düşün: en güçlü fikri nereye koyacaksın, nasıl bir mantıksal akış kuracaksın? İyi bir plan, üç dört ana fikri mantıklı bir sırayla ve her birini bir örnekle dizer. Bu iskelet hazır olduğunda, yazım aşaması çok daha hızlı ve düzenli akar.","t":"p"},{"lines":["1. Metin türü, kitle ve register'ı yaz.","2. Türün imza öğelerini listele (başlık, hitap, imza, alt başlık, tarih).","3. Üç dört ana fikir seç; her birinin yanına bir örnek/geliştirme notu düş.","4. Fikirleri mantıklı bir sıraya koy.","5. Güçlü bir açılış cümlesi kur; metnin geri kalanı onu izleyecek."],"t":"note","k":"protokol","title":"Beş dakikalık planlama rutini"},{"x":"Yazım: Yapıyı Kurmak","t":"h"},{"x":"Yazıma güçlü bir açılışla başla. Açılış hem türü ele vermeli (makalede başlık ve kanca, mektupta hitap ve amaç, konuşmada selamlama) hem de okurun ilgisini çekmelidir. Ardından gövdeyi planına göre böl; her paragraf tek bir ana fikre odaklansın ve o fikri iddia-açıklama-örnek-sonuç zinciriyle geliştirsin. Paragraflar arası geçişleri bağlaçlarla yumuşat, böylece metin akıcı bir bütün olur. Son olarak türe uygun bir kapanışla bitir: makalede düşündüren bir soru, mektupta beklenen eylem, konuşmada güçlü bir çağrı. Yapı, okuru elinden tutup metnin içinde gezdirmektir.","t":"p"},{"x":"Yazarken register'ı baştan sona sabit tutmaya özellikle dikkat et; en sık kayma, metnin ortasında ve sonunda olur. Resmi bir metinde kısaltma kullanmamak, gayriresmi bir metinde ise sıcak ve doğrudan kalmak için ilk cümlede verdiğin tonu her paragrafta yenile. Ayrıca kitleni sürekli zihninde tut: bu okur bu kelimeyi anlar mı, bu tonu bekler mi, bu örnek ona hitap eder mi? Register ve kitle bilinci, yazının her cümlesinde görünür olmalıdır; işte Criterion C bu tutarlılığı ödüllendirir.","t":"p"},{"t":"h","x":"Üç Kriteri Sınav Anında Uygulamak"},{"t":"p","x":"Criterion A (Language) için sınav anında yapabileceğin en etkili şey, kelime ve yapı çeşitliliğini bilinçli aramaktır. Aynı kelimeyi iki kez kullanmak üzereyken bir eş anlamlı düşün; aynı cümle yapısını tekrarlıyorsan bir sonrakini farklı kur. Ama riskli, emin olmadığın yapılara girme; basit ama doğru, karmaşık ama hatalıdan iyidir. Yazarken içinden bir denetçi çalıştır: bu cümle dilbilgisel olarak doğru mu, bu kelime bu bağlamda yerinde mi? Küçük ama tutarlı doğruluk, gösterişli ama hatalı denemelerden daha çok puan getirir."},{"t":"p","x":"Criterion B (Message) için en önemli hamle, her fikri geliştirmektir. Bir iddiayı yazdıktan sonra dur ve sor: bunu bir örnekle, bir ayrıntıyla veya bir sonuçla destekledim mi? Yüzeysel kalmak, bu kriterin en büyük puan kaybıdır. Ayrıca görevin istediği her şeyi karşıladığından emin ol; görev iki soru soruyorsa ikisini de yanıtla, bir bağlam veriyorsa onu kullan. Fikirlerinin göreve ilgili, geliştirilmiş ve düzenli olması, Criterion B'nin üç ayağıdır; her paragrafta bu üçünü kontrol et."},{"t":"p","x":"Criterion C (Conceptual understanding) için sınav anında metin türünü ve register'ı korumaya odaklan. Seçtiğin türün imza öğelerini metnine yerleştirdiğinden emin ol ve register'ı tek bir kez bile bozmamaya çalış. Yazarken ara ara dur ve sor: bu hala bir makale/mektup/konuşma gibi mi duruyor, ton tutarlı mı, kitleye uygun mu? Bu kriter, English B'yi genel bir yazma dersinden ayıran şeydir; türü ve tonu doğru tutturmak, teknik olarak en kolay ama en çok ihmal edilen puan kaynağıdır."},{"x":"Kelime Sayısı ve Zaman Disiplini","t":"h"},{"t":"p","x":"Kelime sınırına uymak, hem bir kural hem bir strateji meselesidir. Çok kısa yazmak (alt sınırın altında) fikirlerini geliştirecek alan bırakmaz ve Criterion B'yi zayıflatır. Aşırı uzun yazmak ise dil hatalarını çoğaltır, süreni tüketir ve son kontrole vakit bırakmaz. Hedef bandın içinde kalmayı planla; SL için 250-400, HL için 450-600 kelime aralığı fikirlerini geliştirmen için yeterli ama kontrol edebileceğin bir alandır. Yazarken yaklaşık kelime sayını takip et; bir paragrafın ne kadar yer kapladığını bilirsen, bandı tutturmak kolaylaşır."},{"x":"Zaman disiplini için 75 dakikayı böl: yaklaşık beş dakika planlama, elli beş dakika yazım ve on beş dakika kontrol ve düzeltme. Bu dağılım kesin değildir ama bir çerçeve sunar; en önemli ilke, sona mutlaka kontrol için zaman bırakmaktır. Çoğu öğrenci son dakikaya kadar yazar ve düzeltme yapamaz; oysa son okumada yakalanan basit hatalar, hazır puanlardır. Saatini düzenli kontrol et ve yazım süresi dolduğunda, ne olursa olsun kontrole geç. İyi yönetilen bir zaman, orta seviye bir yazıyı iyi bir yazıya dönüştürebilir.","t":"p"},{"t":"h","x":"Son Kontrol ve Sık Hatalar"},{"t":"p","x":"Son on beş dakikada metnini bir okur gibi baştan oku ve şu kontrol listesini uygula: metin türü doğru ve imza öğeleri yerinde mi; register baştan sona tutarlı mı; her ana fikir bir örnekle geliştirilmiş mi; göze çarpan dilbilgisi ve yazım hataları var mı; kelime hedefine ulaştın mı? Bu son okuma, hem yapısal hem dilsel boşlukları kapatır. Özellikle fiil zamanları, özne-yüklem uyumu, artikel kullanımı ve noktalama gibi sık hataları ara; bunlar küçük ama tekrarlandığında Criterion A'yı düşürür."},{"x":"Paper 1'in en sık hataları şunlardır: görevi yanlış okuyup yanlış türde yazmak; register'ı ortada bozmak; fikirleri geliştirmeden yüzeysel geçmek; kelime sınırının çok altında veya çok üstünde kalmak; ve sona kontrol için zaman bırakmamak. Bu hataların hepsi önlenebilir ve hepsinin çözümü aynı yerde başlar: dikkatli okuma ve iyi planlama. Sınav pratiği yaparken bu hataları kendi yazılarında ara ve her birini bilinçli olarak düzelt; zamanla bu kontroller otomatikleşir.","t":"p"},{"x":"Örnek Bir Görev Üzerinden Düşünmek","t":"h"},{"t":"p","x":"Bir görevi nasıl çözeceğini somutlaştıralım. Diyelim ki görev şu: 'Your school is considering banning mobile phones during break times. Write a text for the school website expressing your view on this proposal.' İlk adımda anahtar kelimeleri belirlersin: 'expressing your view' seni bir görüş yazısına yönlendirir; 'school website' kitleyi (öğrenciler, veliler, öğretmenler) ve register'ı (yarı resmi) verir; 'this proposal' ise somut bir konu sunar. İkinci adımda net bir tez alırsın: yasağı destekliyor musun, karşı mısın? Üçüncü adımda iki üç argüman ve her birine bir örnek planlarsın, karşı görüşü de anıp çürütmeyi not edersin. Dördüncü adımda güçlü bir açılış kurarsın. Görevi böyle çözdüğünde, yazım aşamasına geçmeden önce metnin iskeleti zaten hazırdır."},{"t":"p","x":"Bu örnekte dikkat edilmesi gereken incelik, görevin türü açıkça söylememesidir; 'expressing your view' ifadesinden türü sen çıkarırsın. Birçok Paper 1 görevi türü doğrudan söyler ('write an article', 'write a letter') ama bazıları böyle ipuçlarıyla ima eder. Bu yüzden görevdeki her kelimeyi dikkatle oku; 'view', 'persuade', 'inform', 'describe your experience' gibi fiiller ve 'for the website', 'to the mayor', 'in the school magazine' gibi bağlamlar, türü ve kitleyi ele verir. Bu ipuçlarını doğru okumak, doğru türü seçmenin ve dolayısıyla Criterion C'yi kazanmanın anahtarıdır."},{"x":"Unutma: Paper 1 bir hız yarışı değil, bir karar ve uygulama sınavıdır. Doğru görevi seç, birkaç dakika planla, üç kriteri bilinçli uygula, kelime ve zaman bandını yönet ve sona kontrol için vakit bırak. Bu disiplinli akış, aynı dil seviyesindeki iki öğrenci arasında en büyük farkı yaratan şeydir. Sınav yapısına, kelime sınırlarına ve kriter bant açıklamalarına dair tüm ayrıntıları her zaman okulunun elindeki güncel resmi IB English B Guide'dan doğrula; burada verilen bilgiler öğretim amaçlıdır ve resmi kılavuz esas alınmalıdır.","t":"p"},{"t": "p", "x": "Bir görev seç, metin türünü belirle, o türün kurallarına göre yaz. Yazdıktan sonra kontrol listesini işaretle, sonra modeli aç."}, {"t": "task", "title": "Örnek görev", "lines": ["Your school is encouraging students to learn a second language. Write a text for the school blog in which you share your own experience and encourage other students to start.", "Metin türü: blog. Kitle: okul öğrencileri. Amaç: deneyim paylaşmak ve teşvik etmek."]}, {"t": "given", "title": "Blog hatırlatması", "x": "Tarih veya samimi başlık. Birinci tekil şahıs. Kişisel anlatı ve duygu. Okura doğrudan seslenme (you). Teşvik eden bir kapanış."}, {"t": "wizard", "wt": "blog", "prompt": null, "target": 220, "check": ["Doğru metin türünü seçtim ve o türün açılış, düzen ve register kurallarına uydum.", "Prompt'un istediği amacı ve kitleyi karşıladım (Criterion B).", "Fikirlerimi örnekle geliştirdim, yüzeysel bırakmadım.", "Kelime çeşitliliği kullandım, aynı kelimeyi tekrarlamadım (Criterion A).", "Ton ve register kitleme uygun (Criterion C).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (blog)", "x": "Why Learning Spanish Changed My Year\n\nThis time last year, I could barely say hello in another language. Today, I can hold a real conversation in Spanish, and I want to tell you how it happened, because if I can do it, so can you.\n\nHonestly, I only started because a friend dragged me along to a club. At first it was frustrating. I mixed up words, I froze in the middle of sentences, and I nearly gave up more than once. But something changed when I stopped worrying about being perfect. I began watching Spanish shows, labelling things in my room, and chatting with an exchange student at lunch. Little by little, the language stopped feeling like a subject and started feeling like a door.\n\nWhat surprised me most was not the grammar. It was the confidence. Speaking a second language taught me that I can be bad at something and still keep going, and that lesson has helped me far beyond the classroom.\n\nSo here is my honest advice: do not wait until you feel ready. Pick a language, make a few mistakes today, and enjoy them. Your future self will thank you."}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Metin türünün biçimini görünür yap. Blogda başlık ve doğrudan seslenme, konuşmada retorik soru, mektupta resmi hitap. Değerlendirici Criterion C'yi buradan okur.", "Fikri örnekle geliştir. Genel cümle değil, kişisel somut örnek."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"x":"İpuçları ve Tuzaklar: Sınavın Bütününe Bakış","t":"h"},{"t":"p","x":"English B üç bileşenden oluşur ve her birinin kendine has stratejileri ve tuzakları vardır. Paper 1 yazma becerini (%25), Paper 2 hem okuma hem dinleme yani alımlama becerilerini (%50) ve Individual Oral konuşma becerini (%25) ölçer. Bu ders, üç bileşen için de pratik ipuçlarını ve en sık düşülen tuzakları bir araya getirir. Amaç, dil bilgini artırmak değil (o alt derslerin işi), o bilgiyi sınav anında en verimli biçimde kullanmanı sağlamaktır. İyi bir öğrenci ile iyi bir sınav öğrencisi arasındaki fark, çoğu zaman burada anlatılan strateji ve dikkat noktalarında saklıdır. Tüm bileşenlerin güncel yapısını okulunun elindeki resmi IB English B Guide'dan teyit et."},{"x":"Paper 1 için Altın Kurallar","t":"h"},{"t":"p","x":"Paper 1'de en çok puan, metin türünü doğru seçip o türün kurallarına uymaktan gelir. Üç görev arasından, en iyi bildiğin konuyu değil, türüne en hakim olduğun görevi seç. Yazmadan önce mutlaka birkaç dakika planla: tür, kitle, register ve üç dört ana fikir. Register'ı baştan sona tutarlı taşı; en sık kayma metnin ortasında olur. Her fikri bir örnekle geliştir, yüzeysel bırakma. Kelime bandının içinde kal ve sona kontrol için zaman ayır. Bu kurallar basit görünür ama sınav baskısı altında en çok ihmal edilenlerdir; onları rutin haline getirirsen puanın belirgin biçimde yükselir."},{"x":"Paper 1'in en sinsi tuzağı, görevi hızlı okuyup yanlış anlamaktır. Görevin istediği türü, kitleyi ve amacı yanlış çözersen, mükemmel bir dille bile yanlış hedefe yazarsın ve Criterion C'den ciddi puan kaybedersin. İkinci tuzak, gösteriş için riskli yapılara ve emin olmadığın ileri kelimelere yönelmektir; bunlar hata üretir ve Criterion A'yı düşürür. Basit ama doğru olan, karmaşık ama hatalıya her zaman üstündür. Üçüncü tuzak, imza öğelerini unutmaktır; başlıksız makale, hitapsız mektup, seslenmesiz konuşma türü belirsizleştirir. Bu üç tuzağın panzehiri aynıdır: dikkatli okuma ve disiplinli plan.","t":"p"},{"x":"Paper 2 Okuma (Reading): Strateji","t":"h"},{"t":"p","x":"Paper 2'nin okuma bölümünde üç farklı yazılı metin ve toplam kırk puanlık soru bulunur; metinler beş prescribed theme etrafında döner ve giderek zorlaşır. En etkili strateji, önce soruları okuyup sonra metne dönmektir. Soruları bildiğinde, metni amaçlı okursun: her soru sana metnin belirli bir yerine işaret eder ve gereksiz ayrıntıda boğulmazsın. Metin türünü tanımak da işini kolaylaştırır; bir makalenin, mektubun veya blogun nereye ne koyduğunu bildiğinde, aradığın bilgiyi daha hızlı bulursun. Zamanını üç metne dengeli dağıt ve zor bir soruda takılıp kalma; işaretleyip geç, sona döner tamamlarsın."},{"x":"Okuma bölümünün en yaygın tuzağı, sorunun tam olarak ne istediğini yanlış anlamaktır. Bazı sorular metinden doğrudan bir bilgi ister (açık bilgi), bazıları ise metnin ima ettiği bir sonucu ister (çıkarım). Çıkarım sorularında, metnin söylediklerinden mantıken çıkan yanıtı seç; kendi genel bilgini veya metnin bir adım ötesini değil. İkinci tuzak, kelime tuzağıdır: yanlış bir şık çoğu zaman metindeki bir kelimeyi aynen içerir ama anlamı çarpıtır. Yanıtı, tek bir kelime eşleşmesine göre değil, cümlenin tam anlamına göre seç. Soru kökündeki 'not', 'except', 'best' gibi kelimeleri de kaçırma; bunlar yanıtı tersine çevirebilir.","t":"p"},{"t":"note","k":"ipucu","title":"Okuma bölümü için hızlı taktikler","lines":["Önce soruları oku, sonra metne amaçlı dön.","Metin türünü tanı; bilgi genelde türün beklenen yerindedir.","Çıkarım sorularında metnin söylediğinden çık, bir adım fazlasına gitme.","Tek kelime eşleşmesine kanma; cümlenin tam anlamına bak.","Zor soruyu işaretle, geç, sona dön; zamanı üç metne dengeli dağıt."]},{"t":"h","x":"Paper 2 Dinleme (Listening): Strateji"},{"x":"Paper 2'nin dinleme bölümünde üç ses kaydı ve toplam yirmi beş puanlık soru bulunur. Her kayıt genellikle iki kez dinletilir; bu iki dinlemeyi farklı amaçlarla kullan. İlk dinlemede genel resmi yakala: konu ne, kim konuşuyor, ana fikir nedir? İkinci dinlemede ayrıntılara odaklan ve yanıtlarını netleştir. Dinlemeden önce soruları okumaya vakit ayır; ne dinleyeceğini bildiğinde, doğru anları yakalarsın. Anahtar kelimeleri ve sayıları, tarihleri, isimleri özellikle dinle; bunlar sık sorulur. Bir yanıtı kaçırdıysan panik yapma; sonraki soruya odaklan, yoksa zinciri kaybedersin.","t":"p"},{"x":"Dinleme bölümünün en büyük tuzağı, 'kelime tuzağı' veya 'distractor' denen çeldiricilerdir. Konuşmacı çoğu zaman bir bilgiyi söyler, sonra düzeltir veya değiştirir ('We first planned to meet on Monday, but we moved it to Wednesday'). İlk duyduğun bilgiye atlarsan yanılırsın; cümlenin tamamını dinle ve son karara odaklan. İkinci tuzak, sorudaki kelimenin kayıtta aynen geçmesini beklemektir; kayıt genellikle eş anlamlı ifadeler kullanır. Anlamı dinle, kelimeyi değil. Yazım da önemlidir; yanıtı yazarken doğru yazdığından emin ol, çünkü yanlış yazım puan kaybettirebilir. Dinlerken kısa notlar al, ama not almaya dalıp dinlemeyi kaçırma.","t":"p"},{"lines":["Dinlemeden önce soruları oku; ne arayacağını bil.","İlk dinlemede ana fikri, ikincide ayrıntıyı yakala.","Çeldiricilere dikkat: konuşmacı bilgiyi düzeltebilir, son karara odaklan.","Eş anlamlıları dinle; sorudaki kelime kayıtta birebir geçmeyebilir.","Bir soruyu kaçırırsan bırak, sonrakine odaklan; zinciri koru."],"k":"ipucu","t":"note","title":"Dinleme bölümü için hızlı taktikler"},{"x":"Individual Oral: Hazırlık ve Sunum","t":"h"},{"t":"p","x":"Individual Oral, konuşma becerini ölçen iç değerlendirmedir ve yaklaşık on iki ile on beş dakika sürer. SL öğrencileri bir GÖRSEL (visual stimulus) üzerine konuşur; HL öğrencileri ise okudukları iki edebi eserden alınmış bir EDEBİ ALINTI (literary extract) üzerine konuşur. Sınav üç aşamalıdır: yaklaşık üç dört dakikalık bir sunum, ardından öğretmenle sunum üzerine bir tartışma ve son olarak farklı bir tema üzerine genel bir sohbet. Hazırlık için SL öğrencilerine on beş, HL öğrencilerine yirmi dakika verilir. Bu yapıyı ve süreleri güncel resmi IB English B Guide'dan mutlaka teyit et; ayrıntılar güncellenebilir."},{"x":"Sunumun güçlü olması için görseli veya alıntıyı üç katmanda ele al: betimle, yorumla ve bir prescribed theme ile ilişkilendir. Önce ne gördüğünü veya okuduğunu betimle (kim, ne, nerede); sonra bunun ne anlama geldiğini, hangi mesajı verdiğini yorumla; en sonda bunu daha geniş bir temaya (identities, sharing the planet gibi) bağla. Bu üç katmanlı yapı, sunumunu yüzeysel bir betimlemenin ötesine taşır ve kavramsal derinlik gösterir. Sunumunu ezberleme; bir plan etrafında doğal konuş. Ezber metin, bir soruyla bölündüğünde çöker; plana dayalı konuşma ise esnek ve dayanıklıdır.","t":"p"},{"t":"p","x":"Individual Oral dört ölçütle değerlendirilir: Criterion A dil hakimiyetini (kelime, dilbilgisi, telaffuz, akıcılık), Criterion B1 görsel veya alıntıdan fikir geliştirmeni, Criterion B2 sohbette fikir geliştirmeni ve Criterion C etkileşim becerini (öğretmenin sorularını anlayıp geliştirerek yanıtlama) ölçer. En sık tuzak, tartışma ve sohbet aşamasında kısa, tek kelimelik yanıtlar vermektir; bu Criterion B2 ve C'yi düşürür. Her yanıtı gerekçe ve örnekle geliştir, öğretmenle gerçek bir sohbet kur. Bir soruyu anlamadıysan, tekrar istemek yanlış anlamaktan iyidir. Akıcılık, kusursuzluktan önce gelir; küçük hatalar yapsan bile düşünerek ve gelişterek konuşmak yüksek puan getirir."},{"t":"h","x":"Genel Dil ve Zaman Tuzakları"},{"x":"Tüm bileşenlerde geçerli birkaç genel tuzak vardır. Birincisi, zaman yönetimi eksikliğidir; her bölümde saatini kontrol et ve tek bir soruda veya paragrafta boğulma. İkincisi, panik ve kilitlenmedir; kaçırdığın bir soru veya kelime, sonrakini de kaçırmana yol açar. Bir şeyi kaçırdığında bırak ve devam et. Üçüncüsü, kendi genel bilgini metnin veya kaydın söylediğinin yerine koymaktır; yanıtların daima kaynaktan çıkmalıdır. Dördüncüsü, talimatları okumamaktır; her bölümün kendi yönergesi vardır ve onu atlamak kolayca puan kaybettirir.","t":"p"},{"x":"Dil açısından en
