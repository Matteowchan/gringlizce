<script id="data" type="application/json">{"title": "Deutsch B", "badge": "DE", "groups": ["Öğren", "Kişisel", "Profesyonel", "Kitle İletişim", "Lesen", "Writing", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "Paper 1 ve Kriterler", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "IB Deutsch B Paper 1'de üç görevden (Aufgabe) birini seçip belirli bir metin türünde (Textsorte) Almanca yazarsın. Doğru türü seçmek ve o türün kurallarına (biçim, register, ton) uymak, dilbilgisi kadar önemlidir."}, {"t": "table", "head": ["Kriter", "Ne ölçer", "Neye dikkat"], "rows": [["A. Sprache", "Dil: kelime çeşitliliği, dilbilgisi doğruluğu, akıcılık", "Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Artikel (der/die/das) ve fiilin cümle sonu konumuna dikkat."], ["B. Botschaft", "Mesaj: göreve uygunluk, fikir gelişimi, ilgililik", "Aufgabe'nin istediğini tam karşıla; fikirleri örnekle geliştir, yüzeysel bırakma."], ["C. Konzeptverständnis", "Kavramsal: metin türü, amaç, kitle, register, ton", "Seçtiğin Textsorte'nin kurallarına uy; kitleye uygun du/Sie ve biçim kullan."]]}, {"t": "note", "k": "dikkat", "title": "En kritik Almanca kararı: du mu, Sie mi?", "lines": ["Arkadaşa/aileye: 'du' (informell). Yetkiliye/tanımadığına: 'Sie' (formell). Bu seçim tüm metnin tonunu ve fiil çekimini belirler.", "Yanlış register (arkadaşa Sie, müdüre du) Criterion C'yi ciddi düşürür. Önce kitleyi belirle, sonra du/Sie'ye karar ver."]}, {"t": "note", "k": "ipucu", "title": "Alman metin türü işaretleri", "lines": ["Formeller Brief: 'Sehr geehrte Frau .../Sehr geehrter Herr ...' + kapanış 'Mit freundlichen Grüßen'.", "Informeller Brief: 'Liebe .../Lieber ...' + kapanış 'Liebe Grüße / Bis bald'.", "Her türün açılışı, düzeni ve register'ı farklıdır. Önce türü tanı, sonra yaz."]}, {"t": "h", "x": "Almanca Dilbilgisi Temeli: Paper 1 için olmazsa olmazlar"}, {"t": "p", "x": "Textsorte'yi doğru seçmek Criterion C'yi (Konzeptverständnis) kurtarır, ama notunun büyük kısmı Criterion A'dan (Sprache) gelir - yani dilbilgisi doğruluğundan. İyi haber şu: Deutsch B Paper 1'de hep aynı birkaç dilbilgisi sistemi döner. Bu bölüm o çekirdeği tek yerde toplar. Aşağıdaki yedi sistemi - Kasus, Artikel, Adjektivendungen, Verbstellung, trennbare Verben, Konjunktiv II ve Wechselpräpositionen - içselleştirirsen, hangi metin türünü yazarsan yaz, cümlelerin sağlam kurulur. Unutma: değerlendirici basit ama doğru bir cümleyi, karmaşık ama hatalı bir cümleye her zaman tercih eder."}, {"t": "p", "x": "Her şey hâl (Kasus) ile başlar. Almancada bir ismin cümledeki rolü, önündeki artikeli değiştirir. Dört hâl vardır: Nominativ (özne - eylemi yapan), Akkusativ (dolaysız nesne - eylemin doğrudan etkilediği), Dativ (dolaylı nesne - genellikle 'kime?') ve Genitiv (iyelik - 'kimin?'). 'Der Mann gibt dem Kind den Ball' cümlesinde 'der Mann' özne (Nominativ), 'dem Kind' dolaylı nesne (Dativ), 'den Ball' dolaysız nesne (Akkusativ). Artikelin nasıl değiştiğini gör: der -> dem, der -> den. Bu değişimi tablo hâlinde tanımak, doğru cümle kurmanın anahtarıdır."}, {"t": "table", "head": ["Fall (hâl)", "Maskulin", "Feminin", "Neutrum", "Plural"], "rows": [["Nominativ (özne)", "der / ein", "die / eine", "das / ein", "die"], ["Akkusativ (dolaysız nesne)", "den / einen", "die / eine", "das / ein", "die"], ["Dativ (dolaylı nesne)", "dem / einem", "der / einer", "dem / einem", "den"], ["Genitiv (iyelik)", "des / eines", "der / einer", "des / eines", "der"]]}, {"t": "note", "k": "ipucu", "title": "Kasus ne zaman kullanılır?", "lines": ["Nominativ: özne, 'kim/ne yapıyor?'. 'Der Lehrer erklärt die Regel.'", "Akkusativ: dolaysız nesne, 'kimi/neyi?'. 'Ich sehe den Film.' Ayrıca şu edatlardan sonra: durch, für, gegen, ohne, um.", "Dativ: dolaylı nesne, 'kime?'. 'Ich helfe dem Freund.' Ayrıca şu edatlardan sonra: aus, bei, mit, nach, seit, von, zu.", "Genitiv: iyelik, 'kimin?'. 'das Auto des Vaters', 'die Farbe der Wand'."]}, {"t": "p", "x": "İkinci sistem sıfat çekimleridir (Adjektivendungen). Bir sıfat isimden önce geldiğinde, önündeki artikele ve ismin hâline/cinsine göre ek alır. En sık yazıda ihtiyaç duyacağın Nominativ ve Akkusativ desenlerini otomatikleştir. Belirsiz artikelle (ein-word) sıfat, ismin cinsini gösterir; belirli artikelle sıfat çoğunlukla -e ya da -en alır. Aşağıdaki tablo en çok kullanılan belirsiz-artikel desenini verir."}, {"t": "table", "head": ["Fall", "Maskulin", "Feminin", "Neutrum", "Plural (artikelsiz)"], "rows": [["Nominativ", "ein guter Film", "eine gute Idee", "ein gutes Buch", "gute Filme"], ["Akkusativ", "einen guten Film", "eine gute Idee", "ein gutes Buch", "gute Filme"], ["Dativ", "einem guten Film", "einer guten Idee", "einem guten Buch", "guten Filmen"]]}, {"t": "note", "k": "ipucu", "title": "Adjektivendungen: hızlı kurallar", "lines": ["Belirsiz artikel eril Nominativ -> -er: 'ein spannender Roman'.", "Belirsiz artikel eril Akkusativ -> -en: 'Ich lese einen spannenden Roman.'", "Belirli artikel (der/die/das) + sıfat: Nominativ tekilde -e, çoğu diğer durumda -en. 'der gute Film', 'den guten Film'.", "Artikelsiz (çoğul, madde): sıfat güçlü ek alır: 'gute Filme', 'guter Wein', 'gutes Essen'."]}, {"t": "p", "x": "Üçüncü ve belki en kritik sistem fiil dizilişidir (Verbstellung). Almanca cümlenin iskeleti fiilin konumuyla belirlenir. Ana cümlede çekimli fiil daima ikinci konumdadır - başta ne olursa olsun. Yan cümlede (weil, dass, wenn, obwohl, da...) ise çekimli fiil en sona gider. Bileşik zamanlarda ve modal yapılarda çekimli fiil ikinci konumda kalır ama ikinci fiil parçası (Partizip ya da Infinitiv) cümlenin sonuna atılır. Bu tek sistemi ustalaşmak, Almancanı bir anda 'doğru' gösterir."}, {"t": "note", "k": "ipucu", "title": "Verbstellung: fiil dizilişinin beş kuralı", "lines": ["Ana cümle: çekimli fiil 2. konumda. 'Ich schreibe heute einen Brief.' / 'Heute schreibe ich einen Brief.' (başta zarf varsa özne fiilden sonra).", "Yan cümle: çekimli fiil en sonda. 'Ich bleibe zu Hause, weil ich krank bin.'", "Bileşik zaman/modal: çekimli fiil 2., ikinci fiil sonda. 'Ich habe einen Brief geschrieben.' / 'Ich muss einen Brief schreiben.'", "Evet/hayır sorusu: fiil 1. konumda. 'Kommst du mit?'", "W-sorusu: soru kelimesi + fiil (2. konum). 'Wann kommst du?'"]}, {"t": "p", "x": "Dördüncü sistem ayrılabilen fiillerdir (trennbare Verben). Bazı fiillerin bir ön eki vardır (auf-, an-, aus-, ein-, mit-, vor-, zu-, ab-...) ve bu ön ek ana cümlede fiilden kopup cümlenin sonuna gider. 'aufstehen' fiili 'Ich stehe um sieben auf' olur; 'anrufen' fiili 'Ich rufe dich später an' olur. Perfekt'te ön ek ile fiil yeniden birleşir ve 'ge-' araya girer: 'Ich bin früh aufgestanden', 'Ich habe dich angerufen'. Yan cümlede ve modal yapılarda fiil bölünmez, birleşik hâlde sonda durur: '..., weil ich früh aufstehe' / 'Ich muss früh aufstehen'."}, {"t": "note", "k": "ipucu", "title": "Trennbare Verben: ayrılabilen fiiller", "lines": ["Ana cümle: ön ek sona gider. 'Ich stehe um sieben auf.', 'Ich rufe dich an.'", "Perfekt: ge- ortada. 'Ich bin aufgestanden.', 'Ich habe angerufen.'", "Yan cümle: birleşik ve sonda. 'Ich bin müde, weil ich früh aufstehe.'", "Modal + trennbar: birleşik mastar sonda. 'Ich möchte dich anrufen.'", "Sık ön ekler: auf-, an-, aus-, ein-, mit-, vor-, zu-, ab-, teil- (teilnehmen), statt- (stattfinden)."]}, {"t": "p", "x": "Beşinci sistem, resmî yazının nezaket ve varsayım kipi olan Konjunktiv II'dir. Onu üç iş için kullanırsın: nezaket (bir yetkiliye kibar rica), dilek/keşke (gerçekleşmemiş bir istek) ve varsayım (koşullu bir sonuç). En güvenli genel yol 'würde + Infinitiv'dir: 'Ich würde mich freuen'. Ancak 'sein', 'haben' ve modal fiillerde doğrudan biçimleri kullan: 'wäre', 'hätte', 'könnte', 'müsste', 'sollte'. 'Ich würde sein' değil, 'ich wäre'; 'ich würde haben' değil, 'ich hätte'."}, {"t": "table", "head": ["Fiil", "Konjunktiv II", "Örnek cümle"], "rows": [["sein", "wäre", "Das wäre wirklich hilfreich."], ["haben", "hätte", "Ich hätte eine kurze Frage."], ["werden (+ Inf.)", "würde", "Ich würde mich über eine Antwort freuen."], ["können", "könnte", "Könnten Sie mir bitte helfen?"], ["müssen", "müsste", "Man müsste die Regel ändern."], ["sollen", "sollte", "Wir sollten mehr darüber sprechen."]]}, {"t": "note", "k": "ipucu", "title": "Konjunktiv II: üç kullanım", "lines": ["Nezaket (resmî mektup): 'Könnten Sie ...?', 'Ich wäre Ihnen dankbar, wenn ...', 'Ich würde mich freuen.'", "Dilek / keşke (günlük): 'Ich wünschte, ich hätte mehr Zeit.', 'Wäre ich nur früher gekommen!'", "Varsayım (öneri/deneme): 'Wenn die Schule das einführte, würde es allen helfen.'", "Güvenli yol: 'würde + Infinitiv'; ama sein/haben/modal doğrudan (wäre, hätte, könnte)."]}, {"t": "p", "x": "Altıncı sistem Wechselpräpositionen'dir - hem Akkusativ hem Dativ alabilen dokuz konum edatı: an, auf, hinter, in, neben, über, unter, vor, zwischen. Hangi hâli aldıkları eylemin türüne bağlıdır. Bir yön/hareket varsa (soru: Wohin? - nereye?) Akkusativ kullanılır. Bir konum/durum varsa (soru: Wo? - nerede?) Dativ kullanılır. 'Ich gehe in die Schule' (nereye? -> Akkusativ) ama 'Ich bin in der Schule' (nerede? -> Dativ). Bu ayrım basit bir soruyla çözülür: hareket mi, konum mu?"}, {"t": "table", "head": ["Präposition", "Wohin? + Akkusativ (hareket)", "Wo? + Dativ (konum)"], "rows": [["in", "Ich gehe in die Stadt.", "Ich wohne in der Stadt."], ["auf", "Ich lege das Buch auf den Tisch.", "Das Buch liegt auf dem Tisch."], ["an", "Ich hänge das Bild an die Wand.", "Das Bild hängt an der Wand."], ["über", "Die Lampe kommt über den Tisch.", "Die Lampe hängt über dem Tisch."], ["neben", "Ich stelle den Stuhl neben das Bett.", "Der Stuhl steht neben dem Bett."]]}, {"t": "note", "k": "ipucu", "title": "Wechselpräpositionen: hareket mi, konum mu?", "lines": ["Dokuz edat: an, auf, hinter, in, neben, über, unter, vor, zwischen.", "Wohin? (hareket, yön) -> Akkusativ. Tipik fiiller: gehen, legen, stellen, setzen, hängen (koymak).", "Wo? (konum, durum) -> Dativ. Tipik fiiller: sein, liegen, stehen, sitzen, hängen (asılı olmak).", "Test sorusu: Eylem bir yer değişimi mi (Akkusativ) yoksa sabit bir konum mu (Dativ) anlatıyor?"]}, {"t": "given", "title": "Çözümlü örnek: aynı edat, iki hâl", "x": "Wohin? (hareket -> Akkusativ):\nIch hänge das Poster an die Wand.\nDer Hund läuft unter den Tisch.\nWir gehen in den Park.\n\nWo? (konum -> Dativ):\nDas Poster hängt an der Wand.\nDer Hund schläft unter dem Tisch.\nWir spielen in dem (im) Park."}, {"t": "p", "x": "Bu üç çift, tüm mantığı gösterir. 'an die Wand' (Akkusativ, çünkü poster oraya doğru hareket ediyor) karşısında 'an der Wand' (Dativ, çünkü poster orada asılı duruyor). 'unter den Tisch' (köpek oraya koşuyor - hareket) karşısında 'unter dem Tisch' (köpek orada uyuyor - konum). 'in den Park' (oraya gidiyoruz) karşısında 'in dem/im Park' (orada oynuyoruz). Aynı edat, eylemin türüne göre iki farklı hâl. Bu ayrımı bir kez içselleştirdiğinde, Almancanın en sinsi hatalarından birini otomatik olarak atlarsın."}, {"t": "note", "k": "dikkat", "title": "En sık gramer hataları: yanlış vs doğru", "lines": ["Fiil 2. konum: 'Morgen ich gehe zur Schule.' YANLIŞ -> 'Morgen gehe ich zur Schule.' DOĞRU.", "Yan cümle fiili: 'Ich weiß, dass er kommt morgen.' YANLIŞ -> 'Ich weiß, dass er morgen kommt.' DOĞRU.", "Akkusativ/Dativ: 'Ich helfe den Mann.' YANLIŞ -> 'Ich helfe dem Mann.' DOĞRU (helfen daima Dativ).", "Sıfat çekimi: 'ein gut Film' YANLIŞ -> 'ein guter Film' DOĞRU.", "Wechselpräposition: 'Ich gehe in der Schule.' (hareket) YANLIŞ -> 'Ich gehe in die Schule.' DOĞRU.", "İsim küçük harf: 'ich lese ein buch' YANLIŞ -> 'Ich lese ein Buch.' DOĞRU."]}]}, {"id": "karsilastirma", "group": "Öğren", "name": "Karşılaştırma Tablosu", "eyebrow": "Metin Türleri", "blocks": [{"t": "p", "x": "En sık çıkan Alman metin türlerinin hızlı karşılaştırması. Ayrıntılar alt derslerde."}, {"t": "table", "head": ["Textsorte", "Amaç", "Kitle", "Register"], "rows": [["Blog", "Kişisel deneyim/görüş paylaş", "Çevrimiçi okurlar", "Kişisel, du"], ["Tagebuch (Günlük)", "Özel kayıt ve yansıtma", "Yazan kişi", "Çok kişisel"], ["Informeller Brief", "Arkadaşa haber/davet", "Arkadaş/aile", "Samimi, du"], ["Formeller Brief", "Talep, şikayet, başvuru", "Yetkili/kurum", "Resmi, Sie"], ["Bericht", "Bulgu ve öneri sun", "Karar verici", "Resmi, nesnel"], ["Artikel", "Bilgilendir ve ilgi çek", "Dergi okuru", "Yarı resmi"], ["Rede", "İkna et/bilgilendir", "Dinleyici kitlesi", "Hitabet, du/Sie"], ["Rezension", "Değerlendir ve öner", "Karar veren okur", "Yarı resmi"]]}, {"t": "note", "k": "ipucu", "title": "Seçim kuralı", "lines": ["Aufgabe kitleyi ve amacı söyler: 'für die Schülerzeitung' -> Artikel, 'an deine Freundin' -> informeller Brief, 'bei einer Versammlung' -> Rede. Kitle + amaç türü belirler."]}]}, {"id": "t-blog", "group": "Kişisel", "name": "Blog", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kişisel bir deneyimi, düşünceyi veya görüşü bir okur kitlesiyle paylaşmak."], ["Kitle", "Blogu takip eden çevrimiçi okurlar."], ["Register / Ton", "Kişisel ve samimi ama düzgün. 'du' ile okura seslen."], ["Yapı", "Çekici başlık (Titel), okuru içine çeken giriş, kişisel anlatı/görüş, okura seslenme, düşündüren kapanış."], ["Tipik özellikler", "Titel, birinci tekil (ich), retorik sorular, duygu, günlük ama düzgün dil, doğrudan du, yorum daveti."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin kişisel açını belirle.", "2. Merak uyandıran kısa bir başlık (Titel) bul.", "3. Girişte okuru içine çek: bir soru veya çarpıcı bir sahne.", "4. Deneyimini/görüşünü somut örneklerle anlat; 'du' ile okurla bağ kur.", "5. Sadece olayı değil, ne hissettiğini de göster.", "6. Düşündüren veya harekete geçiren bir kapanış yaz.", "7. Son kontrol: Titel, ich-perspektifi, okura hitap (du), kişisel ses var mı?"]}, {"t": "given", "title": "Birinci örnek (kişisel deneyim)", "x": "Der Tag, an dem ich mein Handy weglegte\n\nLetzten Monat, an einem ganz normalen Dienstag, habe ich etwas getan, das mir wirklich Angst machte: Ich habe alle sozialen Netzwerke von meinem Handy gelöscht. Ehrlich, könntest du das?"}, {"t": "given", "title": "İkinci örnek (görüş/tavsiye, farklı bağlam)", "x": "Warum meine erste schlechte Note das Beste war, was mir passieren konnte\n\nNiemand sagt dir das, aber Scheitern kann ein Geschenk sein. Als ich letztes Jahr diese rote Zahl sah, wollte ich im Boden versinken. Heute bin ich fast dankbar dafür."}, {"t": "h", "x": "Derinlemesine: Blogu ustalıkla yazmak"}, {"t": "p", "x": "Blog, kişisel bir sesin herkese açık bir sahnede konuştuğu metin türüdür. Onu bir Tagebuch'tan (günlük) ayıran tek ama belirleyici fark, bir OKUR kitlesinin var olmasıdır: sen yaşadığın bir deneyimi ya da savunduğun bir görüşü, seni tanımayan ama seninle bağ kurabilecek insanlara anlatırsın. Bu yüzden blog iki gücü aynı anda taşır. Bir yanda samimi, birinci tekil şahıs (ich) anlatısı vardır; öte yanda okuru metnin içine çeken, ona doğrudan 'du' diye seslenen bir davet. IB Deutsch B'de blog en sık çıkan ve öğrenciye en çok alan tanıyan türlerden biridir, çünkü doğal ve kişisel dilin güçlü yanlarını sergilemene izin verir. Ama tam da bu rahatlık bir tuzaktır: doğallık, yapısal disiplini gevşetmek anlamına gelmez. En iyi bloglar en özgür görünenlerdir; oysa arkalarında bilinçli bir kurgu vardır."}, {"t": "p", "x": "Değerlendiricinin gözünden bakmak yazını baştan doğru kurmanı sağlar. Criterion C (Konzeptverständnis) blogun türsel işaretlerini arar: metnin bir Titel'i (başlık) var mı, ich-perspektifi tutarlı mı, okura 'du' ile sesleniliyor mu, ton kişisel ama okunabilir mi? Bu işaretlerden biri eksikse - örneğin başlık yoksa ya da metin resmî bir mektuba kayıyorsa - C notu hızla düşer. Criterion B (Botschaft) fikrinin gerçekten gelişip gelişmediğine bakar: tek bir anıyı ya da tezi somut bir örnekle, bir dönüm noktasıyla derinleştirdin mi, yoksa 'çok güzeldi, çok şey öğrendim' gibi yüzeyde mi kaldın? Criterion A (Sprache) dilbilgisi doğruluğunu ve kelime çeşitliliğini ölçer. Blogda en çok üç şey sınanır: Präteritum ile Perfekt arasındaki geçişler, fiilin cümledeki konumu (Verbstellung) ve isimlerin büyük harfle yazımı (Groß-/Kleinschreibung). Üç kriteri aynı anda tatmin etmenin yolu içinden geldiği gibi yazmak değil; içten bir sesi bilinçli bir mimariyle birleştirmektir."}, {"t": "p", "x": "Peki bu 'içten ama kurgulu' ses nasıl kurulur? Anahtar, okuru ilk iki cümlede yakalamaktır. Almanca blog girişleri neredeyse hiçbir zaman 'Heute schreibe ich über ...' (Bugün ... hakkında yazıyorum) gibi düz bir bildirimle başlamaz; bunun yerine bir sahne, bir soru ya da çarpıcı bir itirafla açılır. Okur ilk satırda kendini o anın içinde bulmalıdır. Sonra anlatı ilerledikçe okurla göz teması kurarsın: bir retorik soru sorar, ona 'du' ile dönersin, onu senin yaşadığın ikilemin içine çekersin. Kapanışta ise okuru bir düşünceyle ya da küçük bir davetle bırakırsın - bir 'aha' anı. Bu yay - giriş kancası, gelişen anlatı, okura dönüş, düşündüren kapanış - her iyi blogun görünmez iskeletidir."}, {"t": "p", "x": "Blogu zayıf bırakan en büyük etken soyutluktur. 'Es war ein schöner Tag' (Güzel bir gündü) cümlesi hiçbir şey göstermez; okur onu görmez, hissetmez. Bunun yerine somut ayrıntı ver: hangi gün, hangi koku, hangi ses, hangi düşünce? 'An einem grauen Montagmorgen, als der Kaffee längst kalt geworden war, traf ich eine Entscheidung' cümlesi okuru anında sahneye taşır. Kural basittir: her genel duyguyu tek bir somut sahneyle destekle. Bu, hem Botschaft'ı (fikir gelişimi) hem de Sprache'yi (zengin ama doğru kelime) güçlendirir, çünkü somut sahne seni daha çeşitli fiil ve sıfat kullanmaya iter."}, {"t": "p", "x": "Uzunluk ve seviye farkını unutma. IB Deutsch B'de SL adayları 250-400 kelime, HL adayları 450-600 kelime yazar. Blog her iki seviyede de çıkabilir; fark uzunlukta ve derinliktedir. SL'de tek bir güçlü deneyim ve net bir mesaj yeterlidir. HL'de ise aynı yayı korur ama daha çok katman eklersin: karşı bir bakış açısına değinir, deneyimini daha geniş bir düşünceyle (toplum, kuşak, teknoloji) bağlar ve dili daha çeşitli yan cümlelerle (obwohl, während, sodass) örersin. Sınavda ilk beş dakikanı plana ayır: Titel'i, giriş kancasını, anlatının dönüm noktasını ve kapanış davetini kısaca not et. Bu küçük iskelet, panikle yazıp yarıda dağılan metinlerle, baştan sona kontrollü akan metinler arasındaki farktır."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "Merak uyandırır, konuyu ele verir", "Der Tag, an dem ich mein Handy weglegte"], ["Einstieg (kanca)", "Okuru sahneye çeker", "Kennst du das Gefühl, wenn dein Handy wichtiger wird als deine Freunde?"], ["Hauptteil (anlatı)", "Deneyimi/görüşü örnekle geliştirir", "Die ersten zwei Tage waren schrecklich, doch dann veränderte sich etwas."], ["Leseransprache", "Okurla bağ kurar", "Und du? Könntest du eine Woche ohne durchhalten?"], ["Schluss (davet)", "Düşündürür, harekete geçirir", "Probier es einfach mal aus - du wirst überrascht sein."]]}, {"t": "note", "k": "ipucu", "title": "Blog sesini kuran dört teknik", "lines": ["Retorik soru: okuru düşündürür ve ona seslenir. 'Aber ist das wirklich unser Ernst?'", "Doğrudan hitap (du): mesafeyi kaldırır. 'Du kennst das bestimmt.'", "Kısa vurucu cümle: bir uzun cümleden sonra kısa bir cümle ritim yaratır. 'Ich war frei.'", "Somut ayrıntı: soyut duyguyu görünür kılar. Sayı, renk, koku, an - hepsi işe yarar."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Okuru içine çekmek", "Kennst du das Gefühl, wenn ...?"], ["Deneyime giriş", "Vor Kurzem ist mir etwas passiert, das ich dir erzählen muss."], ["Kişisel görüş", "Ehrlich gesagt, ich finde, dass ..."], ["Dönüm noktası", "Doch dann veränderte sich alles."], ["Duygu belirtmek", "Ich war hin- und hergerissen zwischen Angst und Neugier."], ["Okura dönmek", "Und du? Wie würdest du an meiner Stelle reagieren?"], ["Ders çıkarmak", "Was ich daraus gelernt habe, ist ganz einfach: ..."], ["Harekete geçiren kapanış", "Also, worauf wartest du noch? Probier es aus."]]}, {"t": "p", "x": "Blogun dilbilgisel kalbi zaman kullanımıdır. Geçmiş bir olayı anlatırken konuşma diline yakın olan Perfekt tercih edilir: 'Ich habe alle sozialen Netzwerke gelöscht' (yazınsal Präteritum 'löschte' burada fazla mesafeli durur). Buna karşılık 'sein', 'haben' ve modal fiiller (können, müssen, wollen) günlük dilde bile Präteritum'da doğaldır: 'Ich war nervös', 'Ich hatte Angst', 'Ich konnte nicht schlafen'. Bu ikili sistemi doğru kullanmak, metnini hem akıcı hem doğal kılar."}, {"t": "note", "k": "ipucu", "title": "Blogda zaman, fiil dizilişi ve okura hitap", "lines": ["Olay anlatısı Perfekt: 'Ich habe mein Handy weggelegt.' - haben/sein + Partizip II (weggelegt), ayrılan ön ek Partizip'e yapışır (weg + gelegt).", "Durum/duygu Präteritum: 'Ich war müde, ich hatte keine Lust, ich wollte aufgeben.' sein/haben/modal fiilleri için Präteritum daha doğal.", "Verbstellung ana cümle: çekimli fiil daima 2. konumda. Başta bir zarf varsa özne fiilden SONRA gelir: 'Letzten Monat habe ICH etwas Verrücktes getan.'", "Verbstellung yan cümle: weil/dass/obwohl sonrası çekimli fiil cümlenin SONUNDA: '..., weil ich zu viel Zeit online verbrachte.'", "du-Imperativ ile okura seslen: 'Probier', 'Leg dein Handy weg', 'Denk mal darüber nach.' (du-imperatifi çoğu fiilde eksizdir: du probierst -> probier)."]}, {"t": "given", "title": "Çözümlü mini-model: güçlü bir giriş", "x": "Der Tag, an dem ich aufhörte, allen zu gefallen\n\nEs war ein ganz gewöhnlicher Freitag, als ich zum ersten Mal Nein sagte - und die Welt nicht unterging. Kennst du dieses ständige Ziehen im Bauch, wenn du jemanden enttäuschen könntest? Genau davon möchte ich dir heute erzählen."}, {"t": "p", "x": "Bu üç cümle neden işe yarıyor? Birincisi, Titel bir soru değil ama bir merak çengeli kuruyor: 'herkese yaranmayı bıraktığım gün' okuru 'ne oldu?' diye sordurur. İkincisi, giriş cümlesi somut bir sahneyle (ein ganz gewöhnlicher Freitag) açılıyor ve hemen bir gerilim (zum ersten Mal Nein sagte) kuruyor; 'die Welt nicht unterging' ise hafif bir mizahla tonu belirliyor. Üçüncüsü, retorik soru (Kennst du dieses ständige Ziehen im Bauch ...?) okuru doğrudan içine çekiyor ve son cümle (Genau davon möchte ich dir heute erzählen) blogun sözünü veriyor. Dikkat et: fiiller kusursuz konumda - 'Es war', 'als ich ... sagte' (yan cümlede fiil sonda), 'möchte ich dir ... erzählen' (modal fiil 2. konumda, ana fiil sonda). İşte Criterion A ile C'yi aynı anda kazanan bir açılış budur."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Ayrılabilen fiil yanlış: 'Ich habe weggelegt mein Handy.' YANLIŞ -> 'Ich habe mein Handy weggelegt.' DOĞRU. Nesne ortada, Partizip II (weggelegt) cümle sonunda.", "Fiil 2. konum ihlali: 'Letzten Monat ich habe etwas getan.' YANLIŞ -> 'Letzten Monat habe ich etwas getan.' DOĞRU. Başta zaman zarfı varsa özne fiilden sonra gelir.", "dass yan cümlesi: 'Ich dachte, dass ich versage sofort.' YANLIŞ -> 'Ich dachte, dass ich sofort versagen würde.' DOĞRU. Virgül + fiil sonda.", "nach Hause / zu Hause karışıklığı: 'Ich ging zu Hause.' (hareket için) YANLIŞ -> 'Ich ging nach Hause.' DOĞRU. Yön için 'nach Hause', konum için 'zu Hause'.", "İsim küçük harf: 'meine erste schlechte note' YANLIŞ -> 'meine erste schlechte Note' DOĞRU. Almancada tüm isimler büyük harfle başlar."]}, {"t": "wizard", "wt": "blog", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Beitrag für den Schulblog über eine Gewohnheit, ein Erlebnis oder eine Entscheidung, die dich verändert hat. Erzähl persönlich, sprich die Leser direkt an (du) und rege sie zum Nachdenken oder Handeln an.", "target": 250, "check": ["Bir Titel ile açtım ve ich-perspektifiyle kişisel bir ses kullandım.", "Okura doğrudan 'du' ile seslendim ve en az bir retorik soru sordum (Criterion C).", "Deneyimimi somut örnekle anlattım ve duygumu gösterdim (Criterion B).", "Dilbilgisini denetledim: Verbstellung (fiil 2. konumda / yan cümlede sonda), Kasus ve Artikel doğru, Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliği kullandım, tekrardan kaçındım; isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okudum (Criterion A).", "Düşündüren bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Blog)", "x": "Der Tag, an dem ich mein Handy weglegte\n\nLetzten Monat, an einem ganz normalen Dienstag, habe ich etwas getan, das mir wirklich Angst machte: Ich habe alle sozialen Netzwerke von meinem Handy gelöscht. Ehrlich, könntest du eine Woche ohne durchhalten?\n\nDie ersten zwei Tage waren schrecklich. Meine Hand griff ständig nach einem Bildschirm, auf dem nichts mehr war. Ich fühlte mich gelangweilt, unruhig und seltsam einsam.\n\nDann veränderte sich etwas. Ich bemerkte die Dinge wieder: das Frühstück, die Menschen im Bus, ganze Gespräche, die ich früher verpasst hätte. Ich las zwei Bücher in einer Woche und schlief endlich gut.\n\nIch sage dir nicht, du sollst alles für immer löschen. Aber probier ein Wochenende ohne Bildschirm. Vielleicht entdeckst du, dass das Leben leise auf dich wartet, während du weiterscrollst."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Blogu özel bir günlüğe çevirmek. Blogun bir OKURU vardır; ona 'du' ile seslen.", "Sadece olay anlatıp duyguyu/anlamı atlamak.", "Titel'siz veya çok resmi dille yazmak. Titel ve samimi ses Criterion C'yi belirler."]}]}, {"id": "t-tagebuch", "group": "Kişisel", "name": "Tagebuch (Günlük)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Günün olaylarını ve kişisel duyguları özel olarak kaydetmek, yansıtmak."], ["Kitle", "Yalnızca yazan kişi (özel, mahrem)."], ["Register / Ton", "Çok kişisel ve düşünsel. Birinci tekil (ich)."], ["Yapı", "Tarih, günün olayı (geçmiş: Perfekt/Präteritum), o an hissedilenler, geleceğe dair umut/kaygı."], ["Tipik özellikler", "Tarih, ich, geçmiş anlatı + şimdiki duygular, iç ses, 'Liebes Tagebuch' (opsiyonel)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Tarihi yaz (Dienstag, 14. Mai).", "2. Günün seni en çok etkileyen olayını seç.", "3. Ne olduğunu geçmiş zamanla (Perfekt) kısaca anlat.", "4. O AN ne hissettiğini yansıt.", "5. İçindeki çelişkiyi/çatışmayı göster.", "6. Geleceğe dair bir umut veya kaygıyla bitir.", "7. Son kontrol: tarih + ich + olay + duygu + yansıtma var mı?"]}, {"t": "given", "title": "Birinci örnek (mutlu sürpriz)", "x": "Dienstag, 14. Mai\n\nIch kann den Stift kaum ruhig halten. Heute hat sich alles verändert, und ich weiß immer noch nicht, ob ich lachen oder weinen soll."}, {"t": "given", "title": "İkinci örnek (zor bir gün, farklı bağlam)", "x": "Donnerstag, 2. November\n\nIch will heute Abend gar nicht schreiben, aber ich habe es mir versprochen. Heute habe ich mich zum letzten Mal von diesem Haus verabschiedet. Die leeren Zimmer sahen so fremd aus, wie das Foto eines Ortes, den ich nur geträumt habe."}, {"t": "h", "x": "Derinlemesine: Tagebuch (günlük) ustalığı"}, {"t": "p", "x": "Tagebuch, tüm metin türleri içinde en mahrem olanıdır. Burada bir okur yoktur; kâğıdın öbür ucunda yalnızca sen ve kendi iç sesin vardır. Bu tek gerçek, günlüğü blogdan kesin biçimde ayırır. Blog okuru içine çeker, günlük ise okurdan kaçar; günlükte 'du' ile kimseye seslenmezsin, retorik soru sorup okuru düşündürmezsin. Onun yerine kendi kafanın içindeki gürültüyü kâğıda dökersin: olan biteni değil, o olayın SENDE bıraktığı izi yazarsın. IB Deutsch B'de günlük, öğrencinin duygusal derinlik ve iç gözlem (Selbstreflexion) becerisini sınar. Değerlendirici bir olay listesi değil, bir iç yolculuk okumak ister."}, {"t": "p", "x": "Kriterler açısından günlük ilginç bir dengede durur. Criterion C (Konzeptverständnis) türsel işaretleri arar: bir tarih var mı, birinci tekil (ich) tutarlı mı, ton kişisel ve içe dönük mü, okura seslenme tuzağına düşülmemiş mi? Criterion B (Botschaft) burada özellikle 'yansıtma' ister: sadece 'şunu yaptım, bunu yaptım' değil, 'bunu neden hissettim, içimde ne çatıştı, yarın için ne umuyorum' sorularına cevap. Zayıf günlükler olayları sıralar; güçlü günlükler o olayların altındaki duyguyu ve çelişkiyi açar. Criterion A (Sprache) ise en çok iki noktada sınanır: geçmiş zaman (Perfekt/Präteritum) tutarlılığı ve iç dilekleri anlatan Konjunktiv II ('Ich wünschte, ich hätte ...')."}, {"t": "p", "x": "Günlüğün iskeleti çoğu zaman şu yaydır: tarih, günü değiştiren olay, o anki ham duygu, içteki çatışma ve son olarak geleceğe dönük bir umut ya da kaygı. Bu yayın kalbi 'çatışma' halkasıdır. Bir günlük yazısını olgunlaştıran şey, çelişkili duyguları aynı anda tutabilmesidir: 'Einerseits war ich stolz, andererseits hatte ich schreckliche Angst.' İnsan zihni asla tek bir duygu taşımaz; en inandırıcı günlükler de bu ikiliği yakalar. Somutluk yine kilit rol oynar: 'Es war ein trauriger Tag' yerine 'Die leeren Zimmer sahen so fremd aus wie das Foto eines Ortes, den ich nur geträumt hatte' yaz - okur duyguyu görür."}, {"t": "p", "x": "Uzunluk ve seviye: SL için 250-400, HL için 450-600 kelime. Günlük her iki seviyede de çıkabilir. SL'de tek bir yoğun anı ve onun duygusal yankısı yeter. HL'de aynı içtenliği korursun ama zamanda daha çok gidip gelirsin (geçmiş anıya bağlanma, geleceğe dair senaryolar), duygularını daha ince ayrımlarla adlandırırsın ve Konjunktiv II ile 'olabilecek ama olmayan' ihtimalleri kurarsın. Sınavda ilk dakikaları planına ayır: hangi olay, hangi duygu, hangi çatışma, hangi umut? Bu dört kelimelik iskelet bile yazını dağılmaktan kurtarır."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Datum", "Zaman ve mahrem çerçeve kurar", "Donnerstag, 2. November"], ["Auslöser (olay)", "Günü değiştiren şey", "Heute habe ich mich zum letzten Mal von diesem Haus verabschiedet."], ["Gefühl (ham duygu)", "O anki iç durum", "Ich weiß nicht, ob ich lachen oder weinen soll."], ["Konflikt (çatışma)", "Çelişkili duyguları tutar", "Einerseits bin ich erleichtert, andererseits fühle ich mich verloren."], ["Ausblick (umut/kaygı)", "Geleceğe dönük kapanış", "Vielleicht flüstert morgen eine kleine Stimme: Du schaffst das."]]}, {"t": "note", "k": "ipucu", "title": "Günlüğe derinlik kazandıran teknikler", "lines": ["Çift duygu: 'einerseits ... andererseits ...' ile aynı anı içindeki iki sesi göster.", "İç ses (innere Rede): düşünceni doğrudan aktar. 'Mein erster Gedanke war: Jetzt gibt es Ärger.'", "Duyusal ayrıntı: koku, ışık, sessizlik - soyut duyguyu somut kılar.", "Zamanda kayma: bugünkü olayı bir geçmiş anıyla ya da yarına dair bir korkuyla bağla."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Zorlanarak başlama", "Ich weiß gar nicht, wo ich anfangen soll."], ["Olayı açma", "Heute ist etwas passiert, das ich nie vergessen werde."], ["Ham duygu", "Mein Herz klopft immer noch, während ich das schreibe."], ["İç çatışma", "Ein Teil von mir wollte jubeln, ein anderer einfach nur verschwinden."], ["Pişmanlık / keşke", "Ich wünschte, ich hätte den Mut gehabt, etwas zu sagen."], ["Kendini sorgulama", "Warum habe ich mich nur so verhalten?"], ["Geleceğe bakış", "Vielleicht sehe ich das morgen mit anderen Augen."], ["Kapanış", "Für heute ist es genug. Gute Nacht."]]}, {"t": "p", "x": "Günlüğün dilbilgisel omurgası geçmiş zaman ile Konjunktiv II'nin birlikte çalışmasıdır. Olayları anlatırken Perfekt kullan: 'Heute habe ich mich verabschiedet', 'Sie haben mir gesagt, dass ich gewonnen habe.' Duygu ve durum fiillerini ise Präteritum'da tut: 'Ich war sprachlos', 'Ich hatte Angst', 'Ich konnte es nicht glauben.' İç dilekleri, pişmanlıkları ve 'keşke'leri anlatmak içinse Konjunktiv II devreye girer - bu, günlüğün en karakteristik dilbilgisi aracıdır."}, {"t": "note", "k": "ipucu", "title": "Zaman ve Konjunktiv II: günlüğün dilbilgisi kalbi", "lines": ["Olay Perfekt: 'Heute habe ich einen wichtigen Brief bekommen.' (haben/sein + Partizip II).", "Duygu/durum Präteritum: 'Ich war nervös, ich hatte keine Worte, ich wollte nur allein sein.'", "Keşke/dilek Konjunktiv II: 'Ich wünschte, ich hätte anders reagiert.' / 'Wäre ich nur geblieben!' (hätte/wäre + Partizip II).", "İç düşünce yan cümlesi, fiil sonda: 'Ich merkte erst später, dass ich die ganze Zeit gelächelt hatte.'", "Okura SESLENME. 'Kannst du dir das vorstellen?' gibi bir soru günlüğü blog yapar; onun yerine kendine sor: 'Konnte ich es selbst glauben?'"]}, {"t": "given", "title": "Çözümlü mini-model: çatışmayı gösteren bir giriş", "x": "Freitag, 19. April\n\nIch sitze seit einer Stunde hier und starre auf die leere Seite. Heute habe ich die Rolle bekommen, von der ich seit Jahren träume - und trotzdem konnte ich mich auf dem Heimweg nicht freuen. Einerseits bin ich stolz, andererseits fragt eine leise Stimme in mir: Was, wenn ich versage? Ich wünschte, ich könnte mich einfach nur glücklich fühlen."}, {"t": "p", "x": "Bu giriş neden güçlü? Önce tarih, mahrem çerçeveyi kuruyor. 'Ich sitze ... und starre auf die leere Seite' cümlesi yazma anını canlandırıyor - okuru değil, yazarın kendi anını. Ardından olay Perfekt ile geliyor: 'Heute habe ich die Rolle bekommen.' Ama asıl güç, hemen ardından gelen çelişkide: 'und trotzdem konnte ich mich ... nicht freuen.' Duygu fiili Präteritum'da (konnte), yer yer iç ses (Was, wenn ich versage?) devrede. Son cümlede Konjunktiv II ('Ich wünschte, ich könnte ... fühlen') pişmanlık ve arzuyu kusursuzca taşıyor. Dört cümlede olay, çatışma, iç ses ve dilek - günlüğün tüm ruhu burada."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Fiil 2. konum: 'Heute ich habe geweint.' YANLIŞ -> 'Heute habe ich geweint.' DOĞRU.", "Dilek Konjunktiv II: 'Ich wünschte, ich habe mehr Zeit.' YANLIŞ -> 'Ich wünschte, ich hätte mehr Zeit.' DOĞRU.", "Refleksif fiil: 'Ich habe gefühlt glücklich.' YANLIŞ -> 'Ich habe mich glücklich gefühlt.' DOĞRU. (sich fühlen + sıfat).", "Okura seslenme (blog tonu): 'Kannst du das nachvollziehen?' günlükte YANLIŞ -> iç ses: 'Ich konnte es selbst kaum nachvollziehen.' DOĞRU.", "Gün adı küçük harf: 'freitag' YANLIŞ -> 'Freitag' DOĞRU. Haftanın günleri isimdir, büyük yazılır."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Tagebuch görevini gördüğünde ilk iki dakikayı planlamaya ayır. Önce bir tarih seç ve yazacağın günü belirle; sonra dört kelimeyle iskeletini not et - hangi olay, hangi ham duygu, hangi iç çatışma, hangi umut/kaygı. Bu dört durak seni blogun tuzağından korur: sakın okura 'du' ile seslenme, retorik soru sorup onu içine çekme; günlük yalnız senin ve iç sesinin metnidir. Yazarken en çok puanı iki yerde kaybedersin. Birincisi zaman: olayları Perfekt ile ('Heute habe ich ... erfahren'), duyguları ve durumları Präteritum ile ('Ich war fassungslos, ich konnte nicht schlafen') ver; bu ikisini karıştırma. İkincisi Konjunktiv II: pişmanlık ve dilekleri mutlaka bu kiple kur ('Ich wünschte, ich hätte anders reagiert'), çünkü günlüğün en tipik ve en çok değer kazandıran yapısı budur. Son bir dakikada metni yeniden oku ve üç şeyi denetle: fiiller doğru konumda mı (ana cümlede 2., yan cümlede sonda), tüm isimler büyük harfle mi başlıyor, ve metin bir olay listesi değil de bir iç yolculuk gibi mi okunuyor? Değerlendirici bu türde tam olarak duygusal derinliği ve dürüst bir yansıtmayı arar; sen de her genel duygunun altına tek somut bir sahne koyarak (bir koku, bir sessizlik, bir bakış) bunu ona göster. Böylece hem Botschaft (fikir gelişimi) hem Konzeptverständnis (tür bilinci) hem de Sprache (doğru dil) aynı anda güçlenir."}, {"t": "wizard", "wt": "tagebuch", "ai": false, "ptitle": "Görev", "prompt": "Denk an einen Tag, an dem eine wichtige Entscheidung fiel oder etwas Unerwartetes geschah. Schreib einen Tagebucheintrag, der die Ereignisse und deine Gefühle in diesem Moment zeigt.", "target": 250, "check": ["Tarihle başladım ve ich-perspektifiyle kişisel bir ses kullandım.", "Sadece olayları değil, o an hissettiklerimi ve iç düşüncelerimi yansıttım (Criterion C).", "Aufgabe'nin istediği günü/kararı işledim (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Tagebuch)", "x": "Dienstag, 14. Mai\n\nIch kann den Stift kaum ruhig halten. Heute hat sich alles verändert, und ich weiß nicht, ob ich lachen oder weinen soll.\n\nEs begann wie jeder andere Dienstag. Ich war halb eingeschlafen im Matheunterricht, als mich das Sekretariat herunterrief. Mein erster Gedanke war, dass ich Ärger bekomme. Stattdessen sagten sie mir, dass meine Kurzgeschichte den Landeswettbewerb gewonnen hat.\n\nIch glaube, ich stand einfach nur da. Jemand schüttelte mir die Hand. Später im Bus traf es mich endlich, und ich musste mein Gesicht verstecken.\n\nWas mir Angst macht, ist das, was jetzt kommt: eine Preisverleihung, eine Lesung, ein echtes Publikum. Der alte Ich hätte sofort Nein gesagt. Aber heute Abend flüstert eine kleine Stimme: Vielleicht schaffst du das."}}, {"t": "note", "k": "dikkat", "title": "Blogdan farkı", "lines": ["Tagebuch özeldir, kendine yazarsın; Blog bir okur kitlesine yazılır. Günlükte 'du' ile okura seslenmezsin.", "İç dünyayı ve çelişkili duyguları göster; sadece olay anlatımı değil, yansıtma beklenir."]}]}, {"id": "t-informell", "group": "Kişisel", "name": "Informeller Brief / E-Mail", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir arkadaşa veya aile üyesine haber vermek, davet etmek, teşekkür nar - ne buz gibi resmî, ne de anlaşılmaz derecede argo."}, {"t": "p", "x": "Kriterlere göre okuyalım. Criterion C (Konzeptverständnis) burada en çok register'a bakar: baştan sona 'du' kullanıldı mı, selamlama ve kapanış samimi mi (Liebe/Lieber ... / Liebe Grüße), ton sıcak mı? Yanlış bir 'Sie' ya da 'Mit freundlichen Grüßen' anında C notunu düşürür. Criterion B (Botschaft) mektubun amacını (haber verme, davet, teşekkür, teşvik) karşılayıp karşılamadığına ve kişisel ayrıntılarla zenginleştirip zenginleştirmediğine bakar. Criterion A (Sprache) ise 'du' çekimlerinin doğruluğunu (du kommst, du hast, dein/deine), soru ve ünlem yapılarını ve fiil dizilişini sınar. Samimi dil, gramerin gevşek olacağı anlamına gelmez - en iyi arkadaş mektupları hem sıcak hem kusursuzdur."}, {"t": "p", "x": "Bir informeller Brief'in iskeleti nettir: samimi selamlama, kısa bir hâl hatır, asıl haber/amaç, sorular ve kişisel dokunuşlar, sıcak bir kapanış ve imza. En çok gözden kaçan iki nokta selamlama ve kapanıştır. Almancada selamlama alıcının cinsiyetine göre değişir: kadın için 'Liebe Ayla,', erkek için 'Lieber Can,'. Ayrıca çok önemli bir yazım geleneği vardır: selamlamadan sonra virgül konur ve BİR SONRAKİ SATIR küçük harfle başlar - 'Liebe Ayla,' ardından yeni satırda 'ich muss dir unbedingt erzählen ...'. Bunu bilmek, metnine anında yerlilik katar."}, {"t": "p", "x": "Samimi tonu asıl kuran şey ise Modalpartikeln denen küçük kelimelerdir: 'doch', 'mal', 'ja', 'eben', 'halt'. Bunların İngilizce ya da Türkçe birebir karşılığı yoktur; işlevleri cümleye ton ve arkadaşça bir renk katmaktır. 'Komm doch mal vorbei!' cümlesi 'Komm vorbei!' cümlesinden çok daha davetkâr ve sıcaktır. 'Das war ja unglaublich!' ünlemi paylaşılan bir şaşkınlığı ima eder. Bu parçacıkları doğru serpiştirmek, metnini 'ders kitabı Almancası' olmaktan çıkarıp gerçek bir arkadaş sesine dönüştürür. Uzunluk: SL 250-400, HL 450-600 kelime; HL'de daha çok anı, daha çok kişisel ayrıntı ve daha uzun yan cümleler eklersin."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Anrede (selam)", "Sıcaklığı ve du tonunu kurar", "Liebe Deniz, / Lieber Can,"], ["Einstieg (hâl hatır)", "Bağı yeniden ısıtır", "Wie geht es dir? Bei mir ist gerade so viel los!"], ["Hauptteil (haber)", "Asıl amacı taşır", "Ich muss dir unbedingt erzählen, was letzte Woche passiert ist!"], ["Leserbezug", "Karşılıklılık kurar", "Und wie läuft es bei dir mit der Prüfung?"], ["Gruß (kapanış)", "Sıcak biçimde kapatır", "Ganz liebe Grüße, deine Ecem"]]}, {"t": "note", "k": "ipucu", "title": "Samimiyeti kuran teknikler", "lines": ["Modalpartikeln serp: 'Komm doch mal vorbei!', 'Das ist ja toll!', 'Mach dir mal keine Sorgen.'", "Soru sor: karşılıklılık kurar. 'Was machst du eigentlich in den Ferien?'", "Ünlem kullan: coşkuyu gösterir ama abartma. 'Ich freue mich so für dich!'", "Kişisel ayrıntı ver: ortak bir anıyı ya da içeriden bir şakayı an - bu, iki kişinin gerçekten tanıştığını gösterir."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Selamlama (kadın/erkek)", "Liebe Ayla, / Lieber Can,"], ["Hâl hatır sorma", "Wie geht es dir? Ich hoffe, bei dir ist alles gut."], ["Haber verme", "Stell dir vor, was passiert ist!"], ["Sevinç paylaşma", "Ich kann es immer noch kaum glauben!"], ["Davet etme", "Hast du Lust, am Samstag vorbeizukommen?"], ["Rica / haber bekleme", "Sag mir bitte Bescheid, ob du kommst."], ["Özlem", "Ich vermisse dich wirklich - wir müssen uns bald sehen!"], ["Kapanış", "Liebe Grüße / Bis bald / Ganz liebe Grüße, deine Ecem"]]}, {"t": "p", "x": "Dilbilgisel olarak informeller Brief 'du' dünyasında yaşar. İkinci tekil çekimleri sağlam olmalı: 'du kommst', 'du hast', 'du bist', 'du wirst', iyelik 'dein Buch / deine Idee / deine Freunde'. Rica ve davet için du-Imperativ kullanılır: 'Komm!', 'Schreib mir!', 'Bring deine Freundin mit!'. Fiil dizilişi kuralları burada da geçerlidir: ana cümlede fiil 2. konumda, yan cümlede sonda. Sık kullanılan yan cümle bağlaçları 'weil', 'dass', 'wenn' ve 'ob' fiili cümle sonuna iter: 'Ich hoffe, dass du bald kommst.'"}, {"t": "note", "k": "ipucu", "title": "du dünyasının dilbilgisi", "lines": ["du çekimi: du kommst, du gehst, du hast, du bist, du wirst; iyelik dein/deine/deinen.", "du-Imperativ (rica/davet): 'Komm vorbei!', 'Schreib mir bald!', 'Mach dir keine Sorgen!' (çoğu fiilde eksiz).", "Selamdan sonra küçük harf: 'Liebe Deniz,' + yeni satır 'es fühlt sich an, als hätten wir ewig nicht gesprochen.'", "Kadın 'Liebe', erkek 'Lieber'; kapanış imzası kadın 'deine', erkek 'dein'.", "Kapanış virgülsüz de olabilir: 'Liebe Grüße' + yeni satır + isim; resmî 'Mit freundlichen Grüßen' ASLA kullanılmaz."]}, {"t": "given", "title": "Çözümlü mini-model: sıcak bir açılış", "x": "Liebe Deniz,\n\nes fühlt sich an, als hätten wir ewig nicht mehr geschrieben! Wie geht es dir eigentlich mit dem neuen Job? Ich muss dir unbedingt erzählen, was letztes Wochenende passiert ist - du wirst es kaum glauben. Aber sag mir zuerst: Hast du am Samstag schon etwas vor?"}, {"t": "p", "x": "Bu açılış neden doğru ses veriyor? Selamlama 'Liebe Deniz,' kadın alıcı için doğru biçim, ardından yeni satır küçük 'es' ile başlıyor - tam Alman geleneği. 'es fühlt sich an, als hätten wir ewig nicht mehr geschrieben' cümlesi Konjunktiv II (als hätten) ile hem doğal hem gramer açısından zengin. 'eigentlich' ve 'unbedingt' gibi kelimeler samimi tonu kuruyor. İki soru (Wie geht es dir ...? / Hast du ... schon etwas vor?) karşılıklılık ve davet ipucu veriyor. Fiiller kusursuz: 'Ich muss dir unbedingt erzählen' (modal 2. konumda, erzählen sonda), 'was ... passiert ist' (yan cümlede fiil sonda). Sıcak ama disiplinli - aranan denge budur."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Resmî selamlama: 'Sehr geehrte Deniz' YANLIŞ -> 'Liebe Deniz' DOĞRU.", "Resmî kapanış: 'Mit freundlichen Grüßen' YANLIŞ -> 'Liebe Grüße / Bis bald' DOĞRU.", "Cinsiyet uyumsuzluğu: 'Lieber Ayla' (Ayla kadın) YANLIŞ -> 'Liebe Ayla' DOĞRU.", "Selamdan sonra büyük harf: 'Liebe Deniz, Es war ...' YANLIŞ -> 'Liebe Deniz,' + yeni satır 'es war ...' DOĞRU.", "Sie/du karışması: 'Ich hoffe, es geht Ihnen gut, Deniz.' YANLIŞ -> 'Ich hoffe, es geht dir gut.' DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Informeller Brief görevini gördüğünde önce iki şeyi netleştir - alıcı kim (arkadaş mı, aile mi) ve amacın ne (haber verme, davet, teşekkür, teşvik). Bu ikisi tonunu ve içeriğini belirler. Sonra selamlamayı doğru kur, çünkü en kolay puanı burada kaybedersin: kadın için 'Liebe', erkek için 'Lieber', virgülden sonra yeni satır ve küçük harf ('Liebe Ayla,' + 'ich freue mich, ...'). Baştan sona 'du' kullan; tek bir 'Sie' ya da resmî bir kalıp ('Sehr geehrte', 'Mit freundlichen Grüßen') tüm register'ını çökertir. Yazarken samimiyeti tesadüfe bırakma: Modalpartikeln serpiştir ('Komm doch mal vorbei!', 'Das ist ja toll!'), en az bir-iki soru sor (karşılıklılık kurar) ve kişisel bir ayrıntı ekle (ortak bir anı, içeriden bir şaka). Bunlar metni 'ders kitabı Almancası' olmaktan çıkarıp gerçek bir arkadaş sesine dönüştürür. Kapanışta resmî kalıba kaymadan sıcak bir formül ve imza kullan ('Ganz liebe Grüße, deine Ecem'; kadın 'deine', erkek 'dein'). Son bir dakikada üç şeyi denetle: 'du' çekimleri doğru mu (du kommst, du hast, dein/deine), fiiller doğru konumda mı, ve selamlama/kapanış birbiriyle uyumlu mu (ikisi de samimi). Değerlendirici bu türde sıcak ama düzenli bir register arar; sen de içtenliği koruyarak gramerini kusursuz tutarak hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "informell", "ai": false, "ptitle": "Görev", "prompt": "Du hast an einem Sommercamp im Ausland teilgenommen. Schreib eine informelle E-Mail an eine gute Freundin/einen guten Freund, in der du von deinem Erlebnis erzählst und sie/ihn ermutigst, nächstes Jahr mitzukommen.", "target": 250, "check": ["Samimi bir selamlama (Liebe/Lieber + isim) ve sıcak bir kapanış (Liebe Grüße + isim) kullandım.", "'du' ve günlük ifadelerle samimi bir ton tutturdum (Criterion C).", "Aufgabe'yi karşıladım: deneyimi anlattım ve arkadaşımı teşvik ettim (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Informeller Brief)", "x": "Liebe Deniz,\n\nes fühlt sich an, als hätten wir ewig nicht gesprochen! Ich muss dir unbedingt etwas erzählen: Ich war drei Wochen in einem Sommercamp in Wales, und es hat wirklich verändert, wie ich mich sehe.\n\nDie ersten Tage waren schrecklich. Ich kannte niemanden, mein Englisch fühlte sich holprig an, und ich hätte fast zu Hause angerufen. Aber am Ende der ersten Woche wanderte ich mit Leuten aus sechs Ländern und lachte über Witze, die ich einen Monat vorher nicht verstanden hätte.\n\nAm meisten hat mich überrascht, wie schnell ich meine Schüchternheit verlor. Wenn du auf Englisch nach dem Frühstück fragen musst, machst du es einfach.\n\nDu würdest es lieben, und die Anmeldung öffnet im Januar. Versprich mir, dass du darüber nachdenkst!\n\nGanz liebe Grüße,\nEcem"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Resmi kalıplara ('Sehr geehrte...', 'Mit freundlichen Grüßen') kaymak. Bu tür samimidir, 'du' kullanır.", "Selamlamada yanlış cinsiyet/çekim: kadın için 'Liebe', erkek için 'Lieber'.", "Soğuk, mesafeli ton. Sorular, ünlemler ve kişisel ayrıntı samimiyeti kurar."]}]}, {"id": "t-formell", "group": "Profesyonel", "name": "Formeller Brief / E-Mail", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Talep etmek, şikayet etmek, başvurmak veya resmi bilgi vermek."], ["Kitle", "Belirli bir kişi veya kurum (yetkili, şirket, müdür)."], ["Register / Ton", "Resmi ve nazik. Her yerde 'Sie'. Kısaltma yok."], ["Yapı", "Anrede (Sehr geehrte...), amacı belirten açılış, gerekçeli gövde, istek, Grußformel (Mit freundlichen Grüßen) + isim."], ["Anrede/Grußformel kuralı", "İsim biliniyorsa 'Sehr geehrte Frau/Herr [Nachname],'; bilinmiyorsa 'Sehr geehrte Damen und Herren,'. Kapanış: 'Mit freundlichen Grüßen'."], ["Tipik özellikler", "'Sie', net amaç cümlesi (Ich schreibe Ihnen, um ...), nazik ton, gerekçe, Grußformel."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle: adını biliyor musun?", "2. Doğru Anrede'yi seç: 'Sehr geehrte Frau ...,' veya 'Sehr geehrte Damen und Herren,'.", "3. Amaç cümlesini yaz: 'Ich schreibe Ihnen, um ...'.", "4. Gerekçeni 'Sie' ile nazik ve net paragraflarla açıkla.", "5. Ne istediğini/beklediğini açıkça belirt.", "6. 'Mit freundlichen Grüßen' + adınla bitir.", "7. Son kontrol: baştan sona 'Sie', doğru Anrede ve Grußformel, net amaç var mı?"]}, {"t": "given", "title": "Birinci örnek (şikayet)", "x": "Sehr geehrter Herr Thompson,\n\nich schreibe Ihnen, um meine Sorge über die geänderten Busfahrzeiten auszudrücken, die viele Schülerinnen und Schüler in meiner Nachbarschaft betreffen."}, {"t": "given", "title": "İkinci örnek (başvuru, farklı bağlam)", "x": "Sehr geehrte Damen und Herren,\n\nich schreibe Ihnen, um mich für die Stelle als Sommerhelfer in der Stadtbibliothek zu bewerben, die auf Ihrer Webseite ausgeschrieben ist. Als begeisterte Leserin und zuverlässige Schülerin könnte ich viel zu Ihrem Team beitragen.\n\nÜber die Möglichkeit eines Gesprächs würde ich mich sehr freuen. Vielen Dank für Ihre Zeit.\n\nMit freundlichen Grüßen\nAnna Müller"}, {"t": "h", "x": "Derinlemesine: Formeller Brief / E-Mail ustalığı"}, {"t": "p", "x": "Formeller Brief, tanımadığın ya da resmî bir mesafe koruman gereken birine - bir kuruma, yetkiliye, işverene - yazdığın metindir. Bu türün ruhu 'Sie' zamiridir ve bu seçim asla değişmez: baştan sona nezaket, netlik ve saygı. Formeller Brief'in amacı genellikle bir şey talep etmek, şikâyet etmek, başvurmak ya da resmî bilgi vermektir. Duyguların yeri yoktur; onların yerini net gerekçeler ve nazik ama kesin bir dil alır. IB Deutsch B'de bu tür, öğrencinin resmî register'a hâkimiyetini ve bir metni belirli bir amaca göre yapılandırma becerisini sınar. Almancada resmî mektup, sabit kalıpları olan neredeyse törensel bir metindir; bu kalıpları bilmek yarı zaferdir."}, {"t": "p", "x": "Kriterler bu türde çok nettir. Criterion C (Konzeptverständnis) sabit biçimi arar: doğru Anrede (Sehr geehrte ...), baştan sona 'Sie', doğru Grußformel (Mit freundlichen Grüßen) ve amacın ilk paragrafta açıkça belirtilmesi. Bir tek 'du' ya da 'Liebe Grüße' bile C notunu ciddi biçimde düşürür. Criterion B (Botschaft) amacın gerçekten karşılanıp karşılanmadığına bakar: talebini net söyledin mi, gerekçelendirdin mi, bir çözüm ya da beklenti belirttin mi? Criterion A (Sprache) ise resmî dilin gerektirdiği yapıları - özellikle Konjunktiv II ile kurulan nazik rica biçimlerini (Ich wäre Ihnen dankbar, wenn ...) ve 'um ... zu' amaç yapılarını - doğru kullanıp kullanmadığını ölçer."}, {"t": "p", "x": "İskelet katıdır ve bu iyi bir şeydir - sana güvenli bir çerçeve verir. Doğru Anrede ile başla: alıcının adını biliyorsan 'Sehr geehrte Frau Müller,' ya da 'Sehr geehrter Herr Braun,'; bilmiyorsan 'Sehr geehrte Damen und Herren,'. Anrede'den sonra virgül konur ve bir sonraki satır küçük harfle başlar. Hemen ilk cümlede amacını belirt: 'Ich schreibe Ihnen, um ... zu ...'. Gövdede gerekçelerini nazik ve mantıklı paragraflarla açıkla. Sonra ne beklediğini/istediğini net söyle. En sonda 'Mit freundlichen Grüßen' ve adınla kapat. Bu çerçevenin gücü öngörülebilirliğindedir: değerlendirici tam olarak ne arayacağını bilir, sen de tam olarak ne vereceğini."}, {"t": "p", "x": "Bu türün en zarif tarafı nezaket dilidir ve bu dil neredeyse tamamen Konjunktiv II üzerine kuruludur. Almancada bir yetkiliye 'Ich will, dass Sie das machen' demek kabadır; onun yerine ihtimal ve nezaket kipi kullanılır: 'Ich würde mich freuen, wenn ...', 'Könnten Sie mir bitte mitteilen ...', 'Ich wäre Ihnen sehr dankbar, wenn Sie ... könnten.' Bu kalıplar seni hem daha saygılı hem de dilbilgisi açısından daha yetkin gösterir. Uzunluk: SL 250-400, HL 450-600 kelime; HL'de gerekçelerini daha çok katmanla (arka plan, olası itiraz, çözüm önerisi) örer ve dili daha karmaşık yan cümlelerle zenginleştirirsin."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Anrede", "Resmî çerçeveyi açar", "Sehr geehrte Frau Müller, / Sehr geehrte Damen und Herren,"], ["Zweck (amaç)", "İlk cümlede amacı verir", "Ich schreibe Ihnen, um mich über ... zu beschweren."], ["Begründung (gerekçe)", "Nedenleri nesnel sunar", "Seit der Änderung ist es für viele Schüler schwierig, pünktlich zu sein."], ["Bitte (rica)", "Nazik talebi belirtir", "Ich wäre Ihnen dankbar, wenn Sie eine Lösung finden könnten."], ["Grußformel", "Resmî biçimde kapatır", "Mit freundlichen Grüßen + Anna Müller"]]}, {"t": "note", "k": "ipucu", "title": "Resmî ama insani kalmanın yolları", "lines": ["Amacını gizleme: ilk cümlede 'Ich schreibe Ihnen, um ... zu ...' ile net söyle.", "Nezaketi Konjunktiv II ile kur: 'Ich würde mich freuen, wenn ...', 'Könnten Sie ...?'", "Gerekçeni somut ver: sayı, tarih, örnek - şikâyeti güçlendirir, öfkeyi değil mantığı gösterir.", "Kısa ve düzenli paragraflar kullan; her paragraf tek bir noktayı işlesin."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Anrede (bilinen/bilinmeyen)", "Sehr geehrte Frau Braun, / Sehr geehrte Damen und Herren,"], ["Amaç bildirme", "Ich schreibe Ihnen, um mich für die Stelle als ... zu bewerben."], ["Şikâyet açma", "Ich möchte Sie auf ein Problem aufmerksam machen."], ["Gerekçe bağlama", "Der Grund dafür ist, dass ..."], ["Nazik rica", "Ich wäre Ihnen sehr dankbar, wenn Sie dies prüfen könnten."], ["Bilgi isteme", "Könnten Sie mir bitte mitteilen, ob ...?"], ["Yanıt bekleme", "Über eine baldige Rückmeldung würde ich mich sehr freuen."], ["Kapanış", "Vielen Dank für Ihre Mühe. Mit freundlichen Grüßen"]]}, {"t": "p", "x": "Dilbilgisel olarak formeller Brief 'Sie' dünyasında yaşar ve büyük harfli nezaket biçimlerini gerektirir: 'Sie', 'Ihnen', 'Ihr/Ihre' daima büyük harfle yazılır (bu, cümle içinde bile geçerlidir). Nazik ricalar Konjunktiv II ile kurulur: en pratik yol 'würde + Infinitiv' (Ich würde mich freuen) ve düzensiz biçimler 'hätte, wäre, könnte, müsste'dir. Amaç için 'um ... zu + Infinitiv' yapısı kullanılır ve bu yapıda özne tekrarlanmaz: 'Ich schreibe Ihnen, um Sie zu informieren.' Yan cümle kuralları yine geçerli: 'dass', 'weil', 'wenn' sonrası fiil cümlenin sonunda."}, {"t": "note", "k": "ipucu", "title": "Sie dünyasının ve nezaketin dilbilgisi", "lines": ["Sie çekimi: Sie kommen, Sie haben, Sie sind; iyelik Ihr/Ihre - hepsi büyük harf.", "Nezaket Konjunktiv II: 'Ich würde mich freuen ...', 'Könnten Sie ...?', 'Ich wäre Ihnen dankbar, wenn ...'", "Amaç yapısı: 'Ich schreibe Ihnen, um mich zu bewerben.' (um ... zu + Infinitiv, virgülle ayrılır).", "Anrede sıfatı çekimlenir: erkek 'Sehr geehrter Herr ...', kadın 'Sehr geehrte Frau ...'", "Anrede sonrası küçük harf: 'Sehr geehrte Frau Müller,' + yeni satır 'ich schreibe Ihnen ...'"]}, {"t": "given", "title": "Çözümlü mini-model: net ve nazik bir açılış", "x": "Sehr geehrte Frau Direktorin Weber,\n\nich schreibe Ihnen, um Sie auf ein Problem mit den geänderten Öffnungszeiten der Schulbibliothek aufmerksam zu machen. Seit die Bibliothek bereits um 15 Uhr schließt, können viele Schülerinnen und Schüler mit Nachmittagsunterricht sie nicht mehr nutzen. Ich wäre Ihnen sehr dankbar, wenn Sie eine Verlängerung der Öffnungszeiten prüfen könnten."}, {"t": "p", "x": "Bu açılış neden örnek niteliğinde? Anrede doğru çekimli: kadın yetkili için 'Sehr geehrte Frau Direktorin Weber,' ve ardından küçük 'ich' ile yeni satır. İlk cümle amacı gizlemiyor: 'ich schreibe Ihnen, um ... aufmerksam zu machen' - amaç yapısı (um ... zu) kusursuz. Gerekçe somut ve nesnel: 'Seit die Bibliothek bereits um 15 Uhr schließt, können viele ...' (yan cümlede fiil 'schließt' sonda, ana cümlede 'können' 2. konumda). Son cümle nezaketin zirvesi: 'Ich wäre Ihnen sehr dankbar, wenn Sie ... prüfen könnten' - iki Konjunktiv II biçimi (wäre, könnten) bir arada, hem saygılı hem gramer açısından ustaca. Üç cümlede amaç, gerekçe ve nazik talep - resmî mektubun tam kalbi."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Gayriresmî selam: 'Hallo Herr Müller' YANLIŞ -> 'Sehr geehrter Herr Müller' DOĞRU.", "Yanlış kapanış: 'Liebe Grüße' YANLIŞ -> 'Mit freundlichen Grüßen' DOĞRU.", "Anrede çekimi: 'Sehr geehrte Herr Müller' YANLIŞ -> 'Sehr geehrter Herr Müller' DOĞRU (erkek için -r).", "Nezaket Sie küçük yazılırsa: 'ich danke ihnen' YANLIŞ -> 'ich danke Ihnen' DOĞRU (Sie/Ihnen/Ihr büyük harf).", "Kaba talep: 'Ich will, dass Sie das ändern.' YANLIŞ -> 'Ich wäre Ihnen dankbar, wenn Sie das ändern könnten.' DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Formeller Brief görevini gördüğünde önce alıcıyı ve amacını belirle. Alıcının adını biliyor musun? Biliyorsan 'Sehr geehrte Frau ...,' ya da 'Sehr geehrter Herr ...,'; bilmiyorsan 'Sehr geehrte Damen und Herren,'. Anrede'yi doğru çekimlemek (erkek için -r) ve ardından küçük harfle devam etmek ilk izlenimini belirler. İlk cümlede amacını gizleme: 'Ich schreibe Ihnen, um ... zu ...' kalıbıyla neden yazdığını hemen söyle. Bu türde en çok puanı iki yerde kaybedersin. Birincisi register: baştan sona 'Sie' kullan, nezaket biçimlerini (Sie, Ihnen, Ihr) büyük harfle yaz, ve tek bir 'du' ya da 'Liebe Grüße' bile bırakma. İkincisi nezaket dili: talebini kaba bir emirle değil, Konjunktiv II ile kur - 'Ich wäre Ihnen dankbar, wenn Sie ... könnten', 'Könnten Sie mir bitte mitteilen ...?'. Gövdede gerekçeni somut ver (tarih, sayı, örnek); bu, öfkeyi değil mantığı gösterir ve şikâyetini güçlendirir. Kapanışta mutlaka 'Mit freundlichen Grüßen' ve adın. Son bir dakikada üç şeyi denetle: doğru Anrede ve Grußformel var mı, metin baştan sona 'Sie' mi, ve nazik ricalar Konjunktiv II ile mi kurulmuş? Değerlendirici bu türde resmî register'a hâkimiyeti ve net bir amaç yapısını arar; sen de sabit kalıpları doğru kullanıp nezaketi Konjunktiv II'ye yaslayarak hem Konzeptverständnis hem Sprache puanını birlikte alırsın."}, {"t": "wizard", "wt": "formell", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen formellen Brief an die Stadtverwaltung oder die Schulleitung über ein Problem, das dich betrifft (die Schließung einer Einrichtung, eine Regeländerung). Nenne dein Anliegen klar, begründe es und bitte um eine Lösung.", "target": 250, "check": ["Doğru Anrede (Sehr geehrte ...) ve doğru Grußformel (Mit freundlichen Grüßen) kullandım.", "Baştan sona 'Sie' kullandım ve amacımı net belirttim (Ich schreibe Ihnen, um ...) (Criterion C).", "Gerekçemi nazik paragraflarla açıkladım ve bir çözüm/istek sundum (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Formeller Brief)", "x": "Sehr geehrter Herr Thompson,\n\nich schreibe Ihnen, um meine Sorge über die geänderten Busfahrzeiten auszudrücken, die es den Schülerinnen und Schülern im Stadtteil Riverside sehr erschweren, pünktlich zu sein.\n\nSeit der frühere Bus gestrichen wurde, müssen viele von uns einen Bus nehmen, der die Schule erst zehn Minuten nach der ersten Stunde erreicht. Dadurch werden Schüler ohne eigenes Verschulden regelmäßig als verspätet notiert, und einige nehmen an den freiwilligen Lernstunden am Morgen gar nicht mehr teil.\n\nIch wäre Ihnen sehr dankbar, wenn die Schule den früheren Bus wieder einführen oder eine kurze Toleranzzeit einrichten könnte. Eine kleine Anpassung würde das Problem für viele Familien lösen.\n\nVielen Dank, dass Sie sich dieser Angelegenheit annehmen. Ich freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nAnna Müller"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["'du' veya günlük ifade kullanmak. Formeller Brief baştan sona 'Sie' ister.", "Yanlış Grußformel: informell 'Liebe Grüße' değil, formell 'Mit freundlichen Grüßen'.", "Amacı geç söylemek. İlk cümlede 'Ich schreibe Ihnen, um ...' ile amacı net ver."]}]}, {"id": "t-bericht", "group": "Profesyonel", "name": "Bericht (Rapor)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (Schulleitung, yönetim)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Titel, An/Von/Datum, Einleitung (amaç), başlıklı Ergebnisse, Empfehlungen, kısa Schluss."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (Es wird empfohlen, dass ...)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Titel ve An / Von / Datum bilgisini yaz.", "2. Einleitung'da raporun amacını tek cümleyle belirt.", "3. Ergebnisse bölümünde sorunu nesnel ve veriye dayalı anlat (başlık kullan).", "4. Her bulguyu kısa ve tarafsız ver; kişisel görüş katma.", "5. Empfehlungen bölümünde çözümleri 'Es wird empfohlen, dass ...' ile sırala.", "6. Kısa bir Schluss ile bitir.", "7. Son kontrol: Titel + bölüm başlıkları + nesnel dil + öneriler var mı?"]}, {"t": "given", "title": "Birinci örnek (kantin)", "x": "Bericht über die Schulmensa\nAn: Die Schulleitung\nVon: Der Schülerrat\nDatum: 10. März\n\nEinleitung\nDieser Bericht untersucht die Sorgen der Schüler über die Mensa und schlägt praktische Verbesserungen vor."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Bericht über das AG-Angebot\nAn: Die stellvertretende Schulleitung\nVon: Der Schülerrat\nDatum: 3. April\n\nErgebnisse\nEine Umfrage unter 200 Schülern zeigte, dass die AGs beliebt, aber begrenzt sind. Die beliebtesten Aktivitäten — Programmieren, Debattieren und Film — werden derzeit nicht angeboten.\n\nEmpfehlungen\nEs wird empfohlen, dass nächstes Halbjahr drei neue AGs eingeführt werden. Außerdem wird empfohlen, die AG-Zeiten an den Busfahrplan anzupassen."}, {"t": "h", "x": "Derinlemesine: Bericht (rapor) ustalığı"}, {"t": "p", "x": "Bericht, bir konuyu araştırıp bulgularını ve önerilerini resmî ve nesnel biçimde bir karar vericiye (Schulleitung, yönetim) sunduğun metindir. Bu türün ruhu 'nesnellik'tir: burada senin kişisel hislerin değil, veriler, gözlemler ve mantıklı öneriler konuşur. Bir Bericht'i mektuptan ayıran en görünür şey biçimidir - başlık, alıcı/gönderen/tarih bilgisi ve görünür bölüm başlıkları (Einleitung, Ergebnisse, Empfehlungen). IB Deutsch B'de bu tür, öğrencinin bilgiyi düzenleme, nesnel bir register tutturma ve gerekçeli öneri sunma becerisini sınar. Bir rapor asla 'Ich finde, dass ...' diye başlamaz; 'Die Umfrage zeigt, dass ...' diye başlar."}, {"t": "p", "x": "Kriterler açısından Bericht'in en ayırt edici özelliği yapısıdır. Criterion C (Konzeptverständnis) tam olarak bu biçimi arar: Titel var mı, An/Von/Datum satırı var mı, metin görünür bölüm başlıklarıyla düzenlenmiş mi, dil nesnel mi? Kişisel, duygusal bir ton anında C notunu düşürür. Criterion B (Botschaft) bulguların net sunulup sunulmadığına ve her soruna karşılık somut bir öneri gelip gelmediğine bakar. Criterion A (Sprache) ise raporun karakteristik dilbilgisini - özellikle edilgen çatıyı (Passiv: 'Es wird empfohlen'), belirsiz özne 'man'ı ve isimleştirilmiş (nominal) yapıları - doğru kullanıp kullanmadığını ölçer."}, {"t": "p", "x": "İskelet standarttır: önce Titel ve An/Von/Datum bloğu; sonra Einleitung'da raporun amacı tek cümleyle; ardından Ergebnisse bölümünde bulgular nesnel ve veriye dayalı (mümkünse sayılarla); sonra Empfehlungen bölümünde her buluma karşılık bir çözüm; en sonda kısa bir Schluss. Anahtar disiplin şudur: Ergebnisse ile Empfehlungen'i asla karıştırma. Ergebnisse 'ne olduğunu' anlatır (mevcut durum, veri); Empfehlungen 'ne yapılmalı'yı söyler (öneri, gelecek). Bu ayrımı net tutmak, raporunu profesyonel gösterir ve Criterion C'yi güvenceye alır."}, {"t": "p", "x": "Bu türün dilbilgisel imzası edilgen çatı ve nesnel yapılardır. Öneriler neredeyse her zaman kişisiz kurulur: 'Es wird empfohlen, dass die Bibliothek länger geöffnet bleibt' ya da 'Es wird empfohlen, die Öffnungszeiten zu verlängern.' 'Man' zamiri de nesnelliği korur: 'Man könnte eine ruhige Lernzone einrichten.' İsimleştirme (Nominalstil) raporu daha resmî yapar: 'die Verlängerung der Öffnungszeiten', 'die Einführung neuer Arbeitsgemeinschaften.' Uzunluk: SL 250-400, HL 450-600 kelime; HL'de daha çok veri katmanı, olası maliyet/itiraz değerlendirmesi ve daha ayrıntılı öneriler eklersin."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel + Kopf", "Resmî çerçeve ve konu", "Bericht über die Schulbibliothek / An: Die Schulleitung / Von: Der Schülerrat / Datum: 10. März"], ["Einleitung", "Amacı tek cümlede verir", "Dieser Bericht untersucht die Situation der Bibliothek und schlägt Verbesserungen vor."], ["Ergebnisse", "Bulguları nesnel sunar", "Eine Umfrage unter 150 Schülern ergab zwei Hauptprobleme."], ["Empfehlungen", "Çözümleri sıralar", "Es wird empfohlen, die Öffnungszeiten bis 17 Uhr zu verlängern."], ["Schluss", "Kısaca toparlar", "Diese Änderungen wären günstig und würden das Lernen deutlich verbessern."]]}, {"t": "note", "k": "ipucu", "title": "Raporu profesyonel yapan alışkanlıklar", "lines": ["Bölüm başlıklarını görünür kıl: Einleitung, Ergebnisse, Empfehlungen (gerekirse Schluss).", "Veriyle konuş: 'Eine Umfrage unter 150 Schülern ergab, dass ...' - sayı güven verir.", "Ergebnisse ve Empfehlungen'i ayır: biri durumu, diğeri çözümü anlatır.", "Öneri kalıbını kullan: 'Es wird empfohlen, dass ...' / 'Es wird empfohlen, ... zu ...'"]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Amaç bildirme", "Dieser Bericht untersucht ... und gibt Empfehlungen."], ["Veri sunma", "Eine Umfrage unter 200 Schülern ergab, dass ..."], ["Bulgu belirtme", "Die Ergebnisse zeigen, dass ..."], ["Sıralama", "Erstens ... Zweitens ... Außerdem ..."], ["Öneri (Passiv)", "Es wird empfohlen, dass ... / Es wird empfohlen, ... einzuführen."], ["İkinci öneri", "Außerdem wäre es sinnvoll, eine ruhige Lernzone einzurichten."], ["Olasılık (man)", "Man könnte die Öffnungszeiten flexibel gestalten."], ["Sonuç", "Zusammenfassend lässt sich sagen, dass diese Maßnahmen sinnvoll sind."]]}, {"t": "p", "x": "Raporun dilbilgisi kalbi edilgen çatıdır (Vorgangspassiv): 'werden + Partizip II'. 'Es wird empfohlen', 'Die Mensa wird von vielen Schülern genutzt', 'Ein neues System sollte eingeführt werden.' Edilgen, eylemi yapan kişiyi geri plana atarak metni nesnel kılar - bir raporun tam istediği şey. 'Man' zamiri benzer bir nesnellik sağlar. Dikkat edilmesi gereken en yaygın yapısal nokta, mastarların (Infinitiv) ve Partizip'lerin cümle sonuna gitmesidir: 'Es wird empfohlen, die Zeiten zu verlängern' (verlängern sonda), 'Das System sollte verbessert werden' (verbessert werden sonda)."}, {"t": "note", "k": "ipucu", "title": "Edilgen, man ve nominal stil", "lines": ["Vorgangspassiv: werden + Partizip II. 'Es wird empfohlen', 'Neue AGs werden eingeführt.'", "Passiv + modal: 'Die Zeiten sollten verlängert werden.' (Partizip + werden en sonda).", "Belirsiz özne man: 'Man könnte eine Lernzone einrichten.' - nesnel öneri dili.", "Nominalstil: 'die Verlängerung der Öffnungszeiten', 'die Einführung neuer AGs' - fiili isimleştir.", "ich/Meinung yok: 'Ich denke' yerine 'Die Umfrage zeigt' ya da 'Es wird empfohlen'."]}, {"t": "given", "title": "Çözümlü mini-model: nesnel bir bulgu ve öneri", "x": "Ergebnisse\nEine Umfrage unter 150 Schülern ergab zwei Hauptprobleme. Erstens schließt die Bibliothek bereits um 15 Uhr, sodass Schüler mit Nachmittagsunterricht sie kaum nutzen können. Zweitens gibt es in den Prüfungswochen zu wenige ruhige Arbeitsplätze.\n\nEmpfehlungen\nEs wird empfohlen, die Öffnungszeiten werktags bis 17 Uhr zu verlängern. Außerdem wäre es sinnvoll, eine ruhige Lernzone für das Einzellernen einzurichten."}, {"t": "p", "x": "Bu bölüm neden örnek? Önce 'Ergebnisse' ve 'Empfehlungen' başlıkları görünür - Criterion C anında kazanılır. Bulgular veriyle açılıyor: 'Eine Umfrage unter 150 Schülern ergab ...' ve 'Erstens ... Zweitens ...' ile düzenli sıralanıyor. 'sodass Schüler ... sie kaum nutzen können' yan cümlesinde fiil (können) sonda, kusursuz. Öneriler edilgen ve kişisiz: 'Es wird empfohlen, ... zu verlängern' ve 'wäre es sinnvoll, ... einzurichten' - Konjunktiv II (wäre) nesnel bir tavsiye tonu katıyor. Hiçbir yerde 'ich' yok; sayılar, edilgen ve öneri kalıpları konuşuyor. Profesyonel bir raporun tam da böyle olması beklenir."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Öznellik: 'Ich denke, die Mensa ist schlecht.' YANLIŞ -> 'Die Umfrage zeigt, dass viele Schüler mit der Mensa unzufrieden sind.' DOĞRU.", "Edilgen mastar dizilişi: 'Es wird empfohlen zu verlängern die Zeiten.' YANLIŞ -> 'Es wird empfohlen, die Zeiten zu verlängern.' DOĞRU.", "man + fiil: 'Man kann verbessern das System.' YANLIŞ -> 'Man kann das System verbessern.' DOĞRU (Infinitiv sonda).", "Özne-fiil uyumu: 'Die Ergebnisse zeigt ...' YANLIŞ -> 'Die Ergebnisse zeigen ...' DOĞRU (çoğul).", "Başlıksız akıcı metin: bölümsüz yazmak YANLIŞ -> Einleitung / Ergebnisse / Empfehlungen başlıklarını koy DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Bericht görevini gördüğünde ilk işin biçimsel iskeleti kâğıda dökmek olsun - Titel, ardından An/Von/Datum satırı, sonra bölüm başlıkları: Einleitung, Ergebnisse, Empfehlungen (gerekirse Schluss). Bu başlıklar görünür olduğu an Criterion C'nin büyük kısmını güvenceye alırsın. Einleitung'da raporun amacını tek cümleyle söyle. Ergebnisse bölümünde mevcut durumu nesnel ve mümkünse veriyle anlat ('Eine Umfrage unter 150 Schülern ergab, dass ...'); burada asla çözüm önerme. Empfehlungen bölümünde ise her buluma karşılık bir çözüm sun ('Es wird empfohlen, ... zu ...'). Bu iki bölümü karıştırmamak, raporunu profesyonel gösterir. Bu türde en çok puanı öznellikte kaybedersin: 'Ich finde' ya da 'Ich denke' yazma; onun yerine veriyi, edilgen çatıyı ('Es wird empfohlen', 'Es wurden ... gepflanzt') ve 'man'ı konuştur. İsimleştirilmiş yapılar ('die Verlängerung der Öffnungszeiten') raporu daha resmî yapar. Son bir dakikada üç şeyi denetle: bölüm başlıkları görünür mü, dil baştan sona nesnel mi, ve her sorun için bir öneri var mı? Edilgen çatıda mastar ve Partizip'lerin cümle sonuna gittiğinden emin ol ('Es wird empfohlen, die Zeiten zu verlängern'). Değerlendirici bu türde nesnel bir register, düzenli bir yapı ve gerekçeli öneriler arar; sen de sayılarla konuşup Ergebnisse ile Empfehlungen'i temiz ayırarak hem Botschaft hem Konzeptverständnis hem Sprache puanını birlikte yükseltirsin."}, {"t": "wizard", "wt": "bericht", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen formellen Bericht für die Schulleitung über ein Problem (Öffnungszeiten der Bibliothek, Mensa, Verkehr) und schlage Lösungen vor. Verwende Titel, An/Von/Datum sowie die Abschnitte Ergebnisse und Empfehlungen.", "target": 280, "check": ["Titel ve An/Von/Datum ile resmi rapor biçimini kullandım.", "Başlıklı bölümler (Einleitung, Ergebnisse, Empfehlungen) ve nesnel dil kullandım (Criterion C).", "Bulguları verdim ve çözüm önerileri sundum (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Bericht)", "x": "Bericht über die Schulbibliothek\nAn: Die Schulleitung\nVon: Der Schülerrat\nDatum: 10. März\n\nEinleitung\nDieser Bericht untersucht die Sorgen der Schüler über die Bibliothek und empfiehlt Verbesserungen bei Öffnungszeiten und Lernraum.\n\nErgebnisse\nEine Umfrage unter 150 Schülern ergab zwei Hauptprobleme. Erstens schließt die Bibliothek um 15 Uhr, sodass Schüler mit AGs sie nicht nutzen können. Zweitens gibt es in Prüfungszeiten zu wenige ruhige Plätze.\n\nEmpfehlungen\nEs wird empfohlen, dass die Bibliothek werktags bis 17 Uhr geöffnet bleibt. Außerdem wird empfohlen, eine ruhige Zone für das Einzellernen einzurichten.\n\nSchluss\nDiese Änderungen wären günstig, würden aber das Lernen an der Schule deutlich verbessern."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kişisel ton kullanmak. Bericht nesnel ve veri odaklıdır.", "Bölüm başlıklarını atlamak. Einleitung, Ergebnisse, Empfehlungen görünür olmalı (Criterion C).", "Öneri bölümünü unutmak. 'Es wird empfohlen, dass ...' kalıbını kullan."]}]}, {"id": "t-vorschlag", "group": "Profesyonel", "name": "Vorschlag (Öneri, HL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri/planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (Leitung, Vorstand)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi. 'Sie'."], ["Yapı", "Titel, Einleitung (özet), Nutzen/Vorteile, Umsetzung (plan), Kosten, ikna edici Schluss."], ["Tipik özellikler", "Bölüm başlıkları, gelecek (würde/wird), fayda vurgusu, gerçekçi plan, ölçülü ikna dili."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Titel'de öneriyi adlandır (Vorschlag: ...).", "2. Einleitung'da fikri tek paragrafta özetle: ne öneriyorsun ve neden?", "3. Vorteile bölümünde kime, nasıl fayda sağladığını göster.", "4. Umsetzung'da gerçekçi adımlar ver (kim, ne zaman, nasıl).", "5. Kosten'i dürüstçe ele al (düşük maliyet güven verir).", "6. Schluss'ta ölçülü ama net bir onay çağrısı yap.", "7. Son kontrol: Titel + öneri + fayda + plan + gerçekçilik var mı?"]}, {"t": "given", "title": "Birinci örnek (akran mentorluğu)", "x": "Vorschlag: Ein Programm für Nachhilfe unter Schülern\n\nDieser Vorschlag beschreibt ein von Schülern geleitetes Nachhilfeprogramm, das Lernende in den Kernfächern unterstützt, und zwar ohne Kosten für die Schule."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Vorschlag: Ein Recycling-System für die Schule\n\nEinleitung\nDieser Vorschlag empfiehlt, in jedem Klassenzimmer und Flur deutlich beschriftete Recyclingbehälter aufzustellen.\n\nVorteile\nDas System würde Müll reduzieren, Kosten sparen und den Schülern nachhaltige Gewohnheiten vermitteln.\n\nUmsetzung\nFreiwillige der Umwelt-AG würden die Behälter wöchentlich leeren und kontrollieren.\n\nKosten\nDie einzigen Kosten sind die Behälter, die ein lokaler Anbieter sponsern würde. Ich bitte höflich um eine Testphase von einem Monat."}, {"t": "h", "x": "Derinlemesine: Vorschlag (öneri, HL) ustalığı"}, {"t": "p", "x": "Vorschlag, bir fikri ya da planı gerekçelendirip bir karar vericiden onay ve destek istediğin metindir. Bericht'e benzer resmî bir biçimi vardır, ama yönü tam tersidir: Bericht mevcut bir durumu inceler ve geçmişe/şimdiye bakar; Vorschlag ise henüz olmamış bir şeyi savunur ve geleceğe bakar. Bu yüzden Vorschlag'ın dili varsayımsaldır: 'Bu program şunu sağlardı, bundan şu kişiler yararlanırdı.' IB Deutsch B'de bu tür genellikle HL düzeyinde çıkar ve öğrencinin ikna edici ama gerçekçi bir metin kurma, faydayı gerekçelendirme ve varsayım kipini (Konjunktiv II) doğru kullanma becerisini sınar. Güçlü bir Vorschlag hayal kurmaz; uygulanabilir bir gelecek çizer."}, {"t": "p", "x": "Kriterler açısından denge kritiktir. Criterion C (Konzeptverständnis) resmî öneri biçimini arar: Titel, Einleitung'da özet, başlıklı bölümler (Vorteile, Umsetzung, Kosten) ve ikna edici ama ölçülü bir ton. Criterion B (Botschaft) önerinin gerçekten geliştirilip geliştirilmediğine bakar: yalnızca faydaları saymak yetmez; gerçekçi bir uygulama planı ve dürüst bir maliyet değerlendirmesi de gerekir. Aşırı iyimser, plansız bir öneri inandırıcılığını kaybeder. Criterion A (Sprache) ise Konjunktiv II ile kurulan varsayım cümlelerini (würde, wäre, könnte) ve geleceğe dönük yapıları doğru kullanıp kullanmadığını ölçer."}, {"t": "p", "x": "İskelet şöyledir: Titel (Vorschlag: ...); Einleitung'da fikri tek paragrafta özetle (ne öneriyorsun ve neden?); Vorteile bölümünde kime, nasıl fayda sağladığını göster; Umsetzung bölümünde gerçekçi adımlar ver (kim, ne zaman, nasıl?); Kosten bölümünde maliyeti dürüstçe ele al (düşük maliyet güven verir); Schluss'ta ölçülü ama net bir onay çağrısı yap. Bu türün ikna gücü abartıda değil, gerçekçilikte yatar. 'Die Kosten wären gering, da vorhandenes Personal die Aufsicht übernehmen könnte' cümlesi, on tane coşkulu sıfattan daha inandırıcıdır. Değerlendirici, planın gerçek dünyada yürüyüp yürümeyeceğini sorar; sen bu soruya baştan cevap ver."}, {"t": "p", "x": "Bu türün dilbilgisel imzası Konjunktiv II'dir, çünkü henüz gerçekleşmemiş bir şeyin olası sonuçlarını anlatırsın. En pratik biçim 'würde + Infinitiv'dir: 'Ein Nachhilfeprogramm würde schwächeren Schülern helfen.' Yanı sıra 'wäre', 'könnte', 'hätte' düzensiz biçimleri sık kullanılır: 'Die Umsetzung wäre einfach', 'Die Schule könnte davon profitieren.' Koşul cümleleri de değerlidir: 'Wenn die Schule das Programm einführte, würden viele Schüler davon profitieren.' Uzunluk HL için 450-600 kelime; bu, her bölümü (özellikle Vorteile ve Umsetzung) yeterince derinleştirmen gerektiği anlamına gelir - yüzeysel bir taslak HL bandını doldurmaz."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "Öneriyi adlandırır", "Vorschlag: Ein Nachhilfeprogramm unter Schülern"], ["Einleitung", "Fikri özetler", "Dieser Vorschlag empfiehlt, ein von Schülern geleitetes Nachhilfeprogramm einzurichten."], ["Vorteile", "Faydayı gerekçeler", "Schwächere Schüler würden ihre Noten verbessern, und die Tutoren würden Führungskompetenzen entwickeln."], ["Umsetzung", "Gerçekçi planı verir", "Fachlehrer würden freiwillige Tutoren mit jüngeren Schülern zusammenbringen."], ["Kosten + Schluss", "Maliyet ve onay çağrısı", "Die Kosten wären gering. Ich bitte die Schule höflich, das Programm zu erproben."]]}, {"t": "note", "k": "ipucu", "title": "İkna edici ama gerçekçi kalmak", "lines": ["Faydayı somutla: kime, nasıl yarar sağlar? 'Sowohl schwächere Schüler als auch Tutoren würden profitieren.'", "Planı gerçekçi ver: kim, ne zaman, nerede? Belirsiz vaatler güven vermez.", "Maliyeti dürüstçe ele al: düşük maliyet ya da sponsor, öneriyi güçlendirir.", "Ölçülü bitir: 'Ich bitte höflich um eine Testphase' - abartılı değil, makul bir çağrı."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Öneri tanıtma", "Dieser Vorschlag empfiehlt, ... einzuführen."], ["Fayda (Konj. II)", "Ein solches Programm würde ... fördern."], ["Çift fayda", "Davon würden sowohl die Schüler als auch die Schule profitieren."], ["Uygulama", "Die Umsetzung wäre u
