/* Site tema token'lari (main.css ile ayni degerler); 30 renk temasi nav.js'ten override edilir */
:root{--bg:#F1EAD9;--bg-soft:#FBF6EC;--bg-card:#FBF6EC;--text:#241E17;--text-soft:#6E6353;--text-muted:#786D59;--teal:#2E6E6A;--teal-deep:#123C39;--line:#E3D8C3;--gri-gold:#B78A2E}
:root[data-theme="dark"]{--bg:#151210;--bg-soft:#1B1813;--bg-card:#201C17;--text:#F1E9D9;--text-soft:#B7AB96;--text-muted:#7E7362;--teal:#6FB6AF;--teal-deep:#A9D6D1;--line:#332C22;--gri-gold:#D8B25A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* HEADER bar (navy) */
#kbHeader{background:var(--bg-card);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:12px;position:sticky;top:66px;z-index:50;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.05)}
.kbh-left{display:flex;align-items:center;gap:10px;min-width:0}
.kbh-title{font-family:'Lora',serif;font-weight:500;font-size:13px;white-space:nowrap}
.kbh-sep{opacity:.55}
.kbh-meta{opacity:.82;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbh-right{display:flex;align-items:center;gap:10px}
.kbh-score{opacity:.78;font-size:11px;white-space:nowrap}
.kbh-bar{width:100px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.kbh-fill{height:100%;background:var(--teal);transition:width .35s ease;width:0%}
.kbh-home{background:var(--bg-soft);border:1px solid var(--line);color:var(--text);padding:5px 11px;border-radius:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:background .15s}
.kbh-home:hover{background:var(--line)}

/* MAIN container */
.kb-wrap{max-width:740px;margin:0 auto;padding:0 16px}

/* WORD DISPLAY */
.kb-word-sec{padding:38px 12px 14px;text-align:center}
.kb-word{font-family:'Lora',serif;font-size:50px;font-weight:500;color:var(--teal);letter-spacing:-.5px;margin-bottom:10px;line-height:1}
.kb-pron{display:inline-flex;align-items:center;gap:10px;background:var(--bg-card);border:0.5px solid var(--line);padding:7px 14px 7px 10px;border-radius:20px;margin-bottom:14px}
.kb-speaker{width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:transform .12s,background .15s}
.kb-speaker:hover{background:var(--teal-deep,#1E4D48);transform:scale(1.05)}
.kb-speaker:active{transform:scale(0.95)}
.kb-speaker svg{width:13px;height:13px}
.kb-ipa{font-family:'Lora',serif;font-size:13.5px;color:var(--text)}
.kb-pron-sep{width:1px;height:14px;background:var(--line)}
.kb-phon-tr{font-family:'Lora',serif;font-size:13.5px;color:var(--text-muted);font-style:italic}
.kb-prompt{font-family:'Lora',serif;font-size:18px;color:#a04a32;font-style:italic}

/* OPTIONS */
.kb-options{padding:0 6px 18px;display:flex;flex-direction:column;gap:9px}
.kb-opt{background:var(--bg-card);border-radius:10px;padding:13px 18px;display:flex;align-items:center;gap:13px;border:0.5px solid var(--line);cursor:pointer;transition:all .15s ease;font-family:'Lora',serif}
.kb-opt:hover:not(.locked){border-color:var(--teal);transform:translateY(-1px);box-shadow:0 2px 8px rgba(44,88,86,.06)}
.kb-opt.locked{cursor:default}
.kb-opt-letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-size:12px;font-weight:500;flex-shrink:0;transition:all .15s}
.kb-opt-text{font-size:18px;color:var(--text);flex:1}
.kb-opt-icon{width:18px;flex-shrink:0;color:transparent;transition:color .15s}

.kb-opt.correct{border:2px solid var(--teal);padding:12px 17px}
.kb-opt.correct .kb-opt-letter{border-color:var(--teal);color:var(--teal)}
.kb-opt.correct .kb-opt-icon{color:var(--teal)}

.kb-opt.wrong{border:2px solid #b85c4a;padding:12px 17px;background:color-mix(in srgb,var(--bg-card) 88%,#b85c4a)}
.kb-opt.wrong .kb-opt-letter{border-color:#b85c4a;color:#b85c4a}
.kb-opt.wrong .kb-opt-icon{color:#b85c4a}

.kb-opt.locked:not(.correct):not(.wrong){opacity:.55}
.kb-opt.locked:not(.correct):not(.wrong) .kb-opt-text{color:var(--text-muted)}

/* EXPLANATION block */
.kb-expl{margin:0 6px 22px;background:var(--bg-card);border-radius:10px;padding:16px 18px 18px;border-left:3px solid var(--teal);display:none}
.kb-expl.show{display:block}
.kb-expl.wrong-state{border-left-color:#b85c4a}

.kb-expl-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.kb-expl-head-icon{font-size:18px;line-height:1;display:inline-flex;align-items:center}
.kb-expl-head-label{font-weight:500;font-size:14px}
.kb-expl-head-meta{margin-left:auto;font-size:11px;color:var(--text-muted);font-style:italic}

.kb-expl .ok-color{color:var(--teal)}
.kb-expl .bad-color{color:#b85c4a}

.kb-expl-block{margin-bottom:14px}
.kb-expl-block:last-child{margin-bottom:0}
.kb-expl-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a04a32;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.kb-expl-lbl svg{width:13px;height:13px;color:var(--gri-gold,#B78A2E)}
.kb-expl-body{font-size:13.5px;line-height:1.65;color:var(--text)}

.kb-expl-body strong{font-weight:500;color:var(--teal)}
.kb-example{font-family:'Lora',serif;font-style:italic;font-size:14px;line-height:1.6;color:var(--text);background:var(--bg-card);padding:10px 14px;border-radius:6px}
.kb-example strong{font-weight:500;color:var(--teal);font-style:normal}

/* FOOTER actions */
.kb-actions{padding:0 6px 36px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kb-bookmark{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;padding:6px 8px;border-radius:6px;transition:color .15s,background .15s}
.kb-bookmark:hover{color:var(--teal);background:rgba(44,88,86,.06)}
.kb-bookmark.active{color:var(--gri-gold,#B78A2E)}
.kb-bookmark.active svg{fill:currentColor}
.kb-bookmark svg{width:16px;height:16px}
.kb-act-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kb-savelist{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--teal);cursor:pointer;border:1px solid rgba(44,88,86,.35);background:rgba(44,88,86,.06);font-family:'Inter',sans-serif;padding:6px 13px;border-radius:6px;transition:background .15s,color .15s,border-color .15s}
.kb-savelist:hover{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.kb-savelist.kb-saved{background:var(--teal);color:var(--bg);border-color:var(--teal);cursor:default}
.kb-savelist:disabled{opacity:.7;cursor:default}
.kb-savelist svg{width:15px;height:15px}
.kb-next{background:var(--teal);color:var(--bg);padding:11px 24px;border-radius:8px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:background .15s,transform .12s}
.kb-next:hover{background:var(--teal-deep,#1E4D48)}
.kb-next:active{transform:scale(.97)}
.kb-next:disabled{background:var(--line);cursor:default}
.kb-next svg{width:15px;height:15px}

/* LOADING / EMPTY states */
.kb-state{text-align:center;padding:80px 24px;color:var(--text-muted)}
.kb-state h2{font-family:'Lora',serif;color:var(--teal);margin-bottom:12px;font-weight:500;font-size:22px}
.kb-state p{font-size:14px;line-height:1.65;max-width:420px;margin:0 auto 18px}
.kb-state .kb-btn{background:var(--teal);color:var(--bg);padding:10px 22px;border-radius:8px;font-size:13.5px;font-weight:500;text-decoration:none;display:inline-block;border:none;cursor:pointer;font-family:'Inter',sans-serif}

/* RESPONSIVE */
@media (max-width:520px){
  .kb-word{font-size:42px}
  .kbh-bar{width:60px}
  .kbh-score{display:none}
  .kb-pron{padding:6px 12px 6px 8px}
  .kb-opt-text{font-size:16px}
  .kb-prompt{font-size:16px}
}

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

// URL params
const params = new URLSearchParams(window.location.search);
const CATEGORY = params.get('cat'); // null = tüm kategoriler karma
const TIER = params.get('tier'); // '1' | '3' | '5' → CEFR zorluk kademesi (1000/3000/5000)
const EXAM = params.get('exam'); // 'ielts' | 'sat' → exam_tags overlay
const TIER_CEFR = { '1': ['B1'], '3': ['B1','B2'], '5': ['B1','B2','C1','C2'] };
function applyFilters(q){
  if (CATEGORY) q = q.eq('category', CATEGORY);
  if (TIER && TIER_CEFR[TIER]) q = q.in('cefr', TIER_CEFR[TIER]);
  if (EXAM) q = q.contains('exam_tags', [EXAM]);
  return q;
}
const POOL_ID = [CATEGORY, EXAM ? 'e'+EXAM : null, TIER ? 't'+TIER : null].filter(Boolean).join('_') || 'karma';
const CAT_LABELS = {
  'zaman-ve-sureklilik': 'Zaman ve Süreklilik',
  'argumantasyon': 'Argümantasyon ve Eleştiri',
  'analiz-ve-cikarim': 'Analiz ve Çıkarım',
  'sebep-etki': 'Sebep, Etki, Önleme',
  'degisim-ve-donusum': 'Değişim ve Dönüşüm',
  'miktar-ve-derece': 'Miktar ve Derece',
  'akademik-tutum': 'Akademik Tutum',
  'toplum-ve-yapi': 'Toplum ve Yapı',
  'dusunce-ve-yargi': 'Düşünce ve Yargı',
  'karsitlik-ve-uyum': 'Karşıtlık ve Uyum'
};

// localStorage progress
const LS_KEY_SEEN = `kb_seen_${POOL_ID}`;
const LS_KEY_CORRECT = `kb_correct_${POOL_ID}`;
const LS_KEY_WRONG = `kb_wrong_${POOL_ID}`;
const LS_KEY_BOOKMARK = 'kb_bookmarks';

function getSet(key){
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
  catch(e){ return new Set(); }
}
function saveSet(key, set){
  try { localStorage.setItem(key, JSON.stringify(Array.from(set))); }
  catch(e){}
}

let seenIds = getSet(LS_KEY_SEEN);
let correctIds = getSet(LS_KEY_CORRECT);
let wrongIds = getSet(LS_KEY_WRONG);
let bookmarks = getSet(LS_KEY_BOOKMARK);
let totalInPool = 0;
let currentWord = null;
let isLocked = false;

// SVG icons (inline for speed)
const SVG = {
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/></svg>',
  bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  circleCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  circleX: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
};

// META display
function updateMeta(){
  const catLabel = [EXAM?EXAM.toUpperCase():null, TIER?({'1':'İlk 1000','3':'3000','5':'5000'}[TIER]):null, CATEGORY?(CAT_LABELS[CATEGORY]||CATEGORY):null].filter(Boolean).join(' · ') || 'Karma · Tüm kategoriler';
  document.getElementById('kbMeta').textContent =
    `${catLabel} · ${seenIds.size + 1} / ${totalInPool}`;
  const score = correctIds.size;
  const seen = seenIds.size;
  document.getElementById('kbScore').textContent = `${score} / ${seen} doğru`;
  const pct = totalInPool > 0 ? Math.round((seenIds.size / totalInPool) * 100) : 0;
  document.getElementById('kbFill').style.width = pct + '%';
}

// Fetch pool size and next word
async function fetchPoolSize(){
  let q = supabase.from('kelimeler').select('id', { count: 'exact', head: true }).eq('active', true);
  q = applyFilters(q);
  const { count, error } = await q;
  if (error){ console.error('pool size error:', error); return 0; }
  return count || 0;
}

async function fetchNextWord(){
  // 1) Try unseen first
  let q = supabase.from('kelimeler').select('*').eq('active', true);
  q = applyFilters(q);
  if (seenIds.size > 0) q = q.not('id', 'in', `(${Array.from(seenIds).map(id=>`"${id}"`).join(',')})`);

  const { data, error } = await q;
  if (error){ console.error('fetch error:', error); return null; }

  if (data && data.length > 0){
    return data[Math.floor(Math.random() * data.length)];
  }

  // 2) All seen — try wrong words for review
  if (wrongIds.size > 0){
    let qw = supabase.from('kelimeler').select('*').eq('active', true).in('id', Array.from(wrongIds));
    qw = applyFilters(qw);
    const { data: wd } = await qw;
    if (wd && wd.length > 0){
      return { ...wd[Math.floor(Math.random() * wd.length)], _reviewMode: true };
    }
  }

  // 3) Everything mastered
  return null;
}

function showCompletion(){
  const catLabel = [EXAM?EXAM.toUpperCase():null, TIER?({'1':'İlk 1000','3':'3000','5':'5000'}[TIER]):null, CATEGORY?(CAT_LABELS[CATEGORY]||CATEGORY):null].filter(Boolean).join(' · ') || 'tüm kelimeler';
  document.getElementById('kbContent').innerHTML = `
    <div class="kb-state">
      <h2>Tebrikler!</h2>
      <p>${catLabel} kategorisindeki tüm kelimeleri başarıyla tamamladın. İlerlemen sıfırlanırsa baştan başlayabilirsin ya da farklı bir kategori seçebilirsin.</p>
      <button class="kb-btn" onclick="window.kbReset()">İlerlemeyi Sıfırla</button>
      <p style="margin-top:14px;font-size:12px"><a href="kelime-bankasi" style="color:var(--teal)">Diğer kategoriler</a></p>
    </div>`;
}

window.kbReset = function(){
  if (!confirm('Bu kategorideki ilerlemen sıfırlanacak. Emin misin?')) return;
  localStorage.removeItem(LS_KEY_SEEN);
  localStorage.removeItem(LS_KEY_CORRECT);
  localStorage.removeItem(LS_KEY_WRONG);
  location.reload();
};

function renderWord(w){
  currentWord = w;
  isLocked = false;
  const reviewBadge = w._reviewMode ? '<span style="background:color-mix(in srgb,var(--bg-card) 88%,#b85c4a);color:#b85c4a;padding:2px 8px;border-radius:10px;font-size:10px;letter-spacing:.05em;margin-left:8px">Tekrar</span>' : '';

  const optsHtml = w.options.map((text, i) => {
    const letter = String.fromCharCode(65 + i); // A, B, C, D
    return `
      <button class="kb-opt" data-letter="${letter}" onclick="window.kbAnswer('${letter}')">
        <span class="kb-opt-letter">${letter}</span>
        <span class="kb-opt-text">${text}</span>
        <span class="kb-opt-icon"></span>
      </button>`;
  }).join('');

  document.getElementById('kbContent').innerHTML = `
    <div class="kb-word-sec">
      <div class="kb-word">${w.word}</div>
      <div class="kb-pron">
        <button class="kb-speaker" id="kbSpeaker" aria-label="Telaffuz dinle">${SVG.speaker}</button>
        <span class="kb-ipa">${w.ipa || ''}</span>
        ${w.phonetic_tr ? '<span class="kb-pron-sep"></span><span class="kb-phon-tr">'+w.phonetic_tr+'</span>' : ''}
      </div>
      <div class="kb-prompt">ne demek?${reviewBadge}</div>
    </div>

    <div class="kb-options" id="kbOptions">
      ${optsHtml}
    </div>

    <div class="kb-expl" id="kbExpl"></div>

    <div class="kb-actions">
      <div class="kb-act-left">
        <button class="kb-bookmark ${bookmarks.has(w.id) ? 'active' : ''}" id="kbBookmark" onclick="window.kbToggleBookmark()">
          ${SVG.bookmark}<span>${bookmarks.has(w.id) ? 'İşaretli' : 'İşaretle'}</span>
        </button>
        <button class="kb-savelist" id="kbSaveList" onclick="window.kbSaveToList()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Listeme Ekle</span>
        </button>
      </div>
      <button class="kb-next" id="kbNext" onclick="window.kbNext()" disabled>Sonraki kelime ${SVG.arrow}</button>
    </div>`;

  // Speaker pronunciation via Web Speech API
  document.getElementById('kbSpeaker').onclick = () => {
    try {
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(w.word);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }
    } catch(e){ console.warn('speak error:', e); }
  };

  updateMeta();
}

window.kbAnswer = function(letter){
  if (isLocked) return;
  isLocked = true;
  const w = currentWord;
  const correctLetter = w.correct;
  const correctIdx = correctLetter.charCodeAt(0) - 65;
  const chosenIdx = letter.charCodeAt(0) - 65;
  const isCorrect = letter === correctLetter;

  // Lock all options
  const opts = document.querySelectorAll('.kb-opt');
  opts.forEach((el, i) => {
    el.classList.add('locked');
    if (i === correctIdx){
      el.classList.add('correct');
      el.querySelector('.kb-opt-icon').innerHTML = SVG.check;
    } else if (i === chosenIdx && !isCorrect){
      el.classList.add('wrong');
      el.querySelector('.kb-opt-icon').innerHTML = SVG.x;
    }
  });

  // Update progress
  seenIds.add(w.id);
  if (isCorrect){
    correctIds.add(w.id);
    wrongIds.delete(w.id); // remove from wrong if previously wrong
  } else {
    wrongIds.add(w.id);
  }
  saveSet(LS_KEY_SEEN, seenIds);
  saveSet(LS_KEY_CORRECT, correctIds);
  saveSet(LS_KEY_WRONG, wrongIds);

  // merkezi izleme
  if (window.logEvent) logEvent('vocab_answer', { word_id: w.id, word: (w.word || w.kelime || w.term || null), category: CATEGORY, correct: isCorrect });

  // Show explanation
  const expl = document.getElementById('kbExpl');
  expl.classList.add('show');
  if (!isCorrect) expl.classList.add('wrong-state');

  const headIcon = isCorrect ? SVG.circleCheck : SVG.circleX;
  const headLbl = isCorrect ? 'Doğru' : 'Yanlış';
  const colorCls = isCorrect ? 'ok-color' : 'bad-color';

  // If wrong, show what the correct answer was
  const wrongNote = isCorrect ? '' :
    `<div class="kb-expl-block">
       <div class="kb-expl-lbl">Doğru cevap</div>
       <div class="kb-expl-body"><strong>${correctLetter}</strong> · ${w.options[correctIdx]}</div>
     </div>`;

  expl.innerHTML = `
    <div class="kb-expl-head">
      <span class="kb-expl-head-icon ${colorCls}">${headIcon}</span>
      <span class="kb-expl-head-label ${colorCls}">${headLbl}</span>
      <span class="kb-expl-head-meta">${w.pos || ''}</span>
    </div>
    ${wrongNote}
    <div class="kb-expl-block">
      <div class="kb-expl-lbl">Sınavda kullanımı</div>
      <div class="kb-expl-body">${w.exam_use || ''}</div>
    </div>
    <div class="kb-expl-block">
      <div class="kb-expl-lbl">${SVG.bulb} Fun fact</div>
      <div class="kb-expl-body">${w.fun_fact || ''}</div>
    </div>
    <div class="kb-expl-block">
      <div class="kb-expl-lbl">Örnek</div>
      <div class="kb-example">${w.example || ''}</div>
    </div>`;

  // Enable next button
  document.getElementById('kbNext').disabled = false;

  // Scroll explanation into view smoothly
  setTimeout(() => expl.scrollIntoView({behavior:'smooth', block:'nearest'}), 120);

  updateMeta();
};

window.kbNext = async function(){
  document.getElementById('kbContent').innerHTML = `
    <div class="kb-state">
      <h2>Sonraki kelime hazırlanıyor</h2>
    </div>`;
  const w = await fetchNextWord();
  if (!w){ showCompletion(); return; }
  renderWord(w);
};

window.kbToggleBookmark = function(){
  if (!currentWord) return;
  if (bookmarks.has(currentWord.id)){
    bookmarks.delete(currentWord.id);
  } else {
    bookmarks.add(currentWord.id);
  }
  saveSet(LS_KEY_BOOKMARK, bookmarks);
  const btn = document.getElementById('kbBookmark');
  btn.classList.toggle('active', bookmarks.has(currentWord.id));
  btn.querySelector('span').textContent = bookmarks.has(currentWord.id) ? 'İşaretli' : 'İşaretle';
};

// Kalıcı kişisel listeye ekleme (user_vocab) — sat-deneme/gri-sozluk ile aynı akış (vocab-lookup edge fn)
const VOCAB_FN = window.SUPABASE_URL + '/functions/v1/vocab-lookup';
window.kbSaveToList = async function(){
  if (!currentWord) return;
  const btn = document.getElementById('kbSaveList');
  if (!btn || btn.classList.contains('kb-saved')) return;
  const span = btn.querySelector('span'), orig = span.textContent;
  btn.disabled = true; span.textContent = 'Ekleniyor...';
  try {
    let token = null, uid = null;
    try { const s = await supabase.auth.getSession(); if (s && s.data && s.data.session){ token = s.data.session.access_token; uid = s.data.session.user.id; } } catch(_){}
    if (!uid){ span.textContent = 'Giriş gerekli'; setTimeout(function(){ location.href = 'giris?return=' + encodeURIComponent(location.pathname + location.search); }, 750); return; }
    const headers = { 'Content-Type': 'application/json', 'apikey': window.SUPABASE_KEY };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(VOCAB_FN, { method: 'POST', headers: headers, body: JSON.stringify({ word: currentWord.word }) });
    const d = await r.json();
    if (!d || !d.ok || !d.vocabulary_id){ span.textContent = 'Kaydedilemedi'; btn.disabled = false; setTimeout(function(){ span.textContent = orig; }, 1600); return; }
    const ins = await supabase.from('user_vocab').insert({ user_id: uid, vocabulary_id: d.vocabulary_id });
    const dup = ins.error && (ins.error.code === '23505' || (ins.error.message || '').toLowerCase().indexOf('duplicate') !== -1);
    if (ins.error && !dup){ span.textContent = 'Hata'; btn.disabled = false; setTimeout(function(){ span.textContent = orig; }, 1600); return; }
    span.textContent = dup ? 'Zaten listende ✓' : 'Listende ✓';
    btn.classList.add('kb-saved');
  } catch(e){ span.textContent = 'Hata'; btn.disabled = false; setTimeout(function(){ span.textContent = orig; }, 1600); }
};

// INIT
(async () => {
  totalInPool = await fetchPoolSize();
  if (totalInPool === 0){
    document.getElementById('kbContent').innerHTML = `
      <div class="kb-state">
        <h2>Bu kategoride kelime bulunamadı</h2>
        <p>Şimdilik diğer kategorileri inceleyebilirsin.</p>
        <a class="kb-btn" href="kelime-bankasi">Kategorilere dön</a>
      </div>`;
    return;
  }
  const w = await fetchNextWord();
  if (!w){ showCompletion(); return; }
  renderWord(w);
})();
</script>
