icit."}], "answer": "B", "explanation": "The pronoun refers to 'the mayor' (singular). B uses 'she,' which matches context (the pronoun 'she' is already established in the passage). A uses 'they,' which could refer to the city council — ambiguous and number-inconsistent with 'the mayor.' C uses 'it' — inappropriate for a person. D uses 'he or she' — unnecessarily wordy when 'she' is already established."}, {"n": 23, "type": "Modifiers", "passage": "Located at the southern edge of the campus, the newly constructed library serves students from all four colleges within the university. Its collection includes over two million volumes, and it provides access to more than forty online research databases.", "question": "Which choice correctly attaches the participial modifier to the noun it describes?", "underline": "Located at the southern edge of the campus, students from all four colleges use the newly constructed library.", "choices": [{"label": "A", "text": "Located at the southern edge of the campus, students from all four colleges use the newly constructed library."}, {"label": "B", "text": "Located at the southern edge of the campus, the newly constructed library serves students from all four colleges."}, {"label": "C", "text": "The newly constructed library, located at the southern edge of the campus, students from all four colleges use it."}, {"label": "D", "text": "Students from all four colleges use the newly constructed library, located at the southern edge of the campus."}], "answer": "B", "explanation": "'Located at the southern edge of the campus' describes the library. B correctly places 'the newly constructed library' immediately after the phrase. A makes 'students' the implied subject of 'located' — dangling modifier. C creates a double subject ('the library... students use it'). D is grammatically acceptable but positions the modifier after the sentence — the SAT convention prefers the fronted modifier to directly precede its subject."}, {"n": 24, "type": "Parallel Structure", "passage": "The internship program was designed to develop students' research skills, improve their professional communication, and their exposure to industry practices would be broadened by the experience. Mentors from partner organizations guided participants throughout the twelve-week placement.", "question": "Which choice corrects the parallel structure error in the list?", "underline": "to develop students' research skills, improve their professional communication, and their exposure to industry practices would be broadened", "choices": [{"label": "A", "text": "to develop students' research skills, improve their professional communication, and their exposure to industry practices would be broadened"}, {"label": "B", "text": "to develop students' research skills, improving their professional communication, and broaden their exposure to industry practices"}, {"label": "C", "text": "to develop students' research skills, to improve their professional communication, and broaden their exposure to industry practices"}, {"label": "D", "text": "to develop students' research skills, improve their professional communication, and broaden their exposure to industry practices"}], "answer": "D", "explanation": "The list follows 'to develop' — all items must be parallel infinitive base forms: develop, improve, broaden. D correctly uses all three base forms (after the governing 'to'). A uses a full clause for the third item. B uses a gerund ('improving') for the second. C repeats 'to' for the second item but drops it for the third — mixing forms unnecessarily."}, {"n": 25, "type": "Verb Tense & Mood", "passage": "The engineers insisted that the structural report be reviewed by an independent consultant before any construction permits were issued. The project manager acknowledged the request and forwarded the report immediately. Both parties agreed that transparency was essential to maintaining public trust.", "question": "Which choice correctly uses the subjunctive after a verb of insistence?", "underline": "The engineers insisted that the structural report was reviewed by an independent consultant", "choices": [{"label": "A", "text": "The engineers insisted that the structural report was reviewed by an independent consultant"}, {"label": "B", "text": "The engineers insisted that the structural report be reviewed by an independent consultant"}, {"label": "C", "text": "The engineers insisted that the structural report is reviewed by an independent consultant"}, {"label": "D", "text": "The engineers insisted that the structural report would be reviewed by an independent consultant"}], "answer": "B", "explanation": "'Insist that' triggers the mandative subjunctive, requiring the base form 'be.' B correctly uses 'be reviewed.' A uses 'was reviewed' — simple past indicative, not subjunctive. C uses 'is reviewed' — present indicative. D uses 'would be reviewed' — conditional, not subjunctive. The pattern 'insist/demand/require/propose + that + [subject] + base verb' is the defining subjunctive construction."}]}];

  // ── Quiz engine ──
  function startSet(n){
    curSet=n;
    idx=0;
    ANS=new Array(ALL_SETS[n].qs.length).fill(null);
    document.getElementById('pack-home').style.display='none';
    document.getElementById('quiz-wrapper').style.display='flex';
    document.getElementById('set-complete').classList.remove('show');
    document.getElementById('tb-setlabel').textContent='SAT Reading & Writing · Grammar Pack 2 · Set '+n+' · '+ALL_SETS[n].topic;
    render();

  var qarea=null,qnum=null,prog=null;
  function render(){
    if(!qarea){qarea=document.getElementById('qarea');qnum=document.getElementById('qnum');prog=document.getElementById('prog');}
    var q=ALL_SETS[curSet].qs[idx];
    var qs=ALL_SETS[curSet].qs;
    prog.style.width=((idx+1)/qs.length*100)+'%';
    qnum.textContent='Q '+(idx+1)+' / '+qs.length;
    var tracker=document.getElementById('tracker');
    tracker.innerHTML='';
    qs.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='dot'+(ANS[i]!==null?' ans':'')+(i===idx?' cur':'');
      (function(ii){d.onclick=function(){idx=ii;render();}}) (i);
      tracker.appendChild(d);
    });
    qarea.innerHTML='';
    var pbox=document.createElement('div');pbox.className='pbox';
    if(q.p!==undefined){
      var txt=q.p;
      if(txt.indexOf('___')!==-1){
        txt='<span style="font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;display:block;margin-bottom:.7rem">'+
          (q.k||'')+'</span>'+txt.replace('___','<span style="display:inline-block;width:140px;border-bottom:2px solid currentColor;vertical-align:bottom;margin:0 4px"></span>');
      }
      pbox.innerHTML=txt;
    } else if(q.passage!==undefined){pbox.innerHTML=q.passage;}
    qarea.appendChild(pbox);
    // Support both formats: q.question (new) or q.q (old)
    var questionText=q.question||q.q;
    if(questionText){var qt=document.createElement('div');qt.className='qtxt';qt.textContent=questionText;qarea.appendChild(qt);}
    // Support: q.choices (new obj array), q.opts (old string array), q.o (old string array)
    var choices=q.choices||q.opts||q.o;
    if(choices){
      choices.forEach(function(c,i){
        var btn=document.createElement('button');
        // Old format: answer is numeric index; new format: answer is letter
        var isSelected=(q.a!==undefined)?ANS[idx]===i:ANS[idx]===i;
        btn.className='opt'+(ANS[idx]===i?' sel':'');
        var lbl=(typeof c==='object')?c.label:c.charAt(0);
        var txt=(typeof c==='object')?c.text:c.slice(3);
        btn.innerHTML='<span class="ol">'+lbl+'</span><span>'+txt+'</span>';
        (function(ii){btn.onclick=function(){ANS[idx]=ii;render();}}) (i);
        qarea.appendChild(btn);
      });
    }
    var nav=document.createElement('div');nav.className='nav-row';
    var prev=document.createElement('button');prev.className='btn-n';prev.textContent='Previous';prev.disabled=idx===0;
    prev.onclick=function(){idx--;render();};

    var done=ANS.filter(function(a){return a!==null;}).length;
    if(idx===qs.length-1){
      var sub=document.createElement('button');sub.className='btn-sub';

    } else {
      var next=document.createElement('button');next.className='btn-n';next.textContent='Next';
      next.onclick=function(){idx++;render();};nav.appendChild(next);

    qarea.appendChild(nav);
  }

  function getChoices(q){return q.choices||q.opts||q.o;}
  function isCorrect(q,selectedIdx){
    // Old format: q.a is numeric index
    if(q.a!==undefined&&typeof q.a==='number') return selectedIdx===q.a;
    // New format: q.answer is a letter
    var choices=getChoices(q);
    if(!choices||selectedIdx===null||selectedIdx===undefined)return false;
    var c=choices[selectedIdx];
    var selectedLabel=(typeof c==='object')?c.label:c.charAt(0);
    return selectedLabel===(q.answer||'A');
  }
  function getCorrectChoice(q){
    var choices=getChoices(q);
    if(!choices)return null;
    if(q.a!==undefined&&typeof q.a==='number') return choices[q.a];
    var lbl=q.answer||'A';
    return choices.find(function(c){return (typeof c==='object'?c.label:c.charAt(0))===lbl;});
  }
  function choiceText(c){
    if(!c)return '';
    return (typeof c==='object')?c.text:c.slice(3);
  }
  function showSetComplete(){

      var choices=getChoices(q);

      var wi=document.createElement('div');wi.className='wi';
      var pText=(q.p||q.passage||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().substring(0,70);
      var expl=q.explanation||q.e||'';
      wi.innerHTML='<div class="wh"><span class="wh-n">Q'+(i+1)+'</span><span class="wh-q">'+pText+'...</span><span class="wh-badge w">✗</span></div>'+
        '<div class="wb" style="display:none;padding:.8rem .9rem">'+
        '<div class="aw">'+wrongText+'</div>'+
        '<div class="ac">Doğru: '+correctText+'</div>'+
        (expl?'<div class="expl"><div class="expl-head"><img class="expl-cat" src="'+griCat()+'" alt="Gri"/><span class="expl-label">Gri diyor ki:</span></div><div class="expl-body">'+expl+'</div></div>':'')+'</div>';
      wi.querySelector('.wh').onclick=function(){var wb=wi.querySelector('.wb');wb.style.display=wb.style.display==='block'?'none':'block';};
      rev.appendChild(wi);
    });
    if(rev.children.length<=1){title.textContent='Tüm cevaplar doğru! ✓';}
    window.scrollTo(0,0);
  }

  function retakeSet(){startSet(curSet);}
  function goNextSet(){if(curSet<10)startSet(curSet+1);}


    (function(){
    var dg=document.getElementById('cv-dots-inner');
    if(dg){for(var i=0;i<25;i++){var s=document.createElement('span');dg.appendChild(s);}}
  })();

  showPackHome();

</script>
