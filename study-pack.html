<style>
  /* Hide cover instantly, never show — auth handles access via /assets/users.js */
  #cv-cover { 
    display: none !important; 
    visibility: hidden !important; 
    opacity: 0 !important;
    pointer-events: none !important;
  }
  /* Also hide any cv-leaving transition */
  #cv-cover.cv-leaving { animation: none !important; }
</style>
<script src="/assets/users.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function() {
  var path = window.location.pathname;
  var slug = path.substring(path.lastIndexOf('/') + 1).replace(/\.html$/, '');
  
  var auth = window.GriAuth && window.GriAuth.requireAuth(slug);
  if (!auth) return;
  
  document.addEventListener('DOMContentLoaded', function() {
    // Override goHome as backup (real fix is on button onclick attrs)
    window.goHome = function() {
      window.location.href = '/panelim.html';
    };
    
    // Force cover hidden, set up main view
    var cover = document.getElementById('cv-cover');
    var main = document.getElementById('cv-main');
    if (cover) {
      cover.style.display = 'none';
      cover.setAttribute('hidden', 'hidden');
    }
    if (main) {
      main.style.display = 'block';
      main.classList.add('cv-visible');
    }
    
    if (typeof showPackHome === 'function') {
      try { showPackHome(); } catch(e) { console.error('showPackHome:', e); }
    }
  });
})();
</script>

:root{--bg:#f0fdfa;--surface:#ffffff;--border:#0d9488;--blight:#ccfbf1;--text:#134e4a;--muted:#5eead4;--muted2:#6b7280;--teal:#0f766e;--tdark:#0d5e57;--tlight:#e6fffa;--taclight:#f0fdfa;--correct:#166534;--cbg:#f0fdf4;--wrong:#991b1b;--wbg:#fef2f2;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
#splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:linear-gradient(155deg,#f0fdfa 50%,#ccfbf1 100%)}

.s-badge{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1.1rem;border-radius:50px;margin-bottom:1.6rem}
.s-title{font-family:'Inter',sans-serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;line-height:1.2;margin-bottom:.7rem;color:var(--tdark)}
.s-desc{color:var(--muted2);font-size:.91rem;max-width:440px;line-height:1.65;margin-bottom:1.6rem}
.s-chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.2rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.3rem .75rem;font-size:.74rem;color:var(--teal);font-family:'DM Mono',monospace}
.btn-p{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.9rem 2.5rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.promo-card{background:transparent;border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1.3rem;margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;max-width:320px;width:100%;text-align:center}
.promo-name{font-size:.77rem;color:var(--muted2);font-family:'DM Mono',monospace;letter-spacing:.04em}
.promo-sub{font-size:.68rem;color:var(--muted2);opacity:.7;font-family:'DM Mono',monospace}
.promo-exams{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;margin-top:.12rem}
.promo-tag{background:transparent;border:1px solid var(--border);border-radius:4px;font-size:.61rem;font-family:'DM Mono',monospace;padding:.1rem .38rem;color:var(--teal);opacity:.85}
.promo-phone{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted2);opacity:.7;margin-top:.1rem}
#quiz{display:none;min-height:100vh;flex-direction:column}
.qbody{flex:1;max-width:680px;margin:0 auto;padding:1.8rem 1.2rem 2.5rem;width:100%}
.tracker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.15rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blight);border:1.5px solid var(--border);transition:all .2s;cursor:pointer}
.dot.ans{background:var(--teal);border-color:var(--teal)}
.dot.cur{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--teal)}
.qtype-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--blight);border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--teal);padding:.25rem .65rem;margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pbox{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:var(--r);padding:1.15rem 1.35rem;margin-bottom:1.2rem;font-family:'Lora',serif;font-size:.95rem;line-height:1.78;color:#1c1917}
.pbox u{text-decoration:none;font-weight:700;border-bottom:2.5px solid var(--teal);color:var(--tdark)}
.pbox .blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:60px;text-align:center;font-family:'DM Mono',monospace;font-size:.85rem;color:var(--teal);padding:0 .3rem}
.qt{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--tdark)}
.opts{display:flex;flex-direction:column;gap:.44rem;margin-bottom:1.4rem}
.opt{display:flex;align-items:flex-start;gap:.7rem;background:var(--surface);border:1.5px solid var(--blight);border-radius:var(--r);padding:.65rem .95rem;cursor:pointer;transition:border-color .12s,background .12s;font-size:.91rem;color:var(--text);width:100%;text-align:left;font-family:'Lora',serif}
.opt:hover{border-color:var(--teal);background:var(--taclight)}
.opt.sel{border-color:var(--teal);background:var(--taclight)}
.ol{display:flex;align-items:center;justify-content:center;width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--border);font-size:.72rem;font-family:'DM Mono',monospace;font-weight:700;margin-top:1px;transition:all .12s;flex-shrink:0}
.opt.sel .ol{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-row{display:flex;justify-content:space-between;align-items:center}
.btn-n{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:.55rem 1.1rem;font-size:.87rem;font-weight:600;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s}
.btn-n:hover{border-color:var(--tdark)}
.btn-n:disabled{opacity:.3;cursor:not-allowed}
.btn-sub{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.55rem 1.35rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-sub:hover{opacity:.85}
#results{display:none;background:var(--bg);min-height:100vh}
.rh{background:var(--teal);color:#fff;padding:2rem 1.5rem;text-align:center}
.rh h1{font-family:'Inter',sans-serif;font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.rh p{opacity:.75;font-size:.82rem}
.rb{max-width:680px;margin:0 auto;padding:2rem 1.2rem 3rem}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.35rem;display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.sc-big{text-align:center}
.sc-num{font-size:3.5rem;font-weight:700;color:var(--teal);font-family:'DM Mono',monospace;line-height:1}
.sc-den{font-size:.8rem;color:var(--muted2);font-family:'DM Mono',monospace}
.sc-pct{font-size:1.15rem;font-weight:700;margin-bottom:.3rem;color:var(--tdark)}
.sc-rng{font-size:.8rem;color:var(--muted2);margin-bottom:.4rem}
.sc-tip{font-size:.8rem;color:var(--muted2);line-height:1.55}
.stitle{font-size:.65rem;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:.85rem;padding-bottom:.32rem;border-bottom:1px solid var(--border)}
.wi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.6rem;overflow:hidden}
.wh{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:#fef2f2;border-bottom:1px solid #fecaca;cursor:pointer;user-select:none}
.wn{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--wrong);font-weight:700}
.wt{font-size:.8rem;color:var(--tdark);font-weight:600}
.wtog{margin-left:auto;font-size:.72rem;color:var(--muted2)}
.wb{padding:.9rem;display:none}
.wb.open{display:block}
.rpass{background:var(--bg);border-left:3px solid var(--border);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin-bottom:.7rem;font-family:'Lora',serif;font-size:.84rem;line-height:1.72;color:#1c1917}
.rpass u{text-decoration:none;font-weight:700;color:var(--tdark)}
.ac{background:var(--cbg);color:var(--correct);font-size:.82rem;font-weight:600;padding:.33rem .7rem;border-radius:5px;margin-bottom:.25rem;font-family:'Lora',serif}
.aw{background:var(--wbg);color:var(--wrong);font-size:.82rem;padding:.33rem .7rem;border-radius:5px;margin-bottom:.55rem;text-decoration:line-through;font-family:'Lora',serif}
.expl{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:.78rem .9rem;font-size:.82rem;line-height:1.7;color:#292524;white-space:pre-wrap}
.btn-rs{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:.75rem 1.8rem;font-size:.87rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:1rem;transition:opacity .15s}
.btn-rs:hover{opacity:.85}
.type-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.ts{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--teal)}
.ts.wrong{border-color:#fca5a5;background:var(--wbg);color:var(--wrong)}
@media(max-width:520px){.sc-card{grid-template-columns:1fr}.sc-num{font-size:2.7rem}}

  /* ── Mobile Cover Fix ── */
  @media (max-width:640px){
    #cv-cover{display:block!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
    #cv-cover .cv-left{height:auto!important;min-height:100svh;padding:1.8rem 1.5rem 3rem!important;justify-content:flex-start!important;gap:1rem}
    #cv-cover .cv-brand{margin-bottom:.5rem}
    #cv-cover .cv-title-block{padding:0!important;flex:none!important}
    #cv-cover .cv-main-title{font-size:2.8rem!important}
    #cv-cover .cv-pills{margin-bottom:.8rem!important}
    #cv-cover .cv-login{background:rgba(255,255,255,.7)!important}
    #cv-cover .cv-btn-login{
      padding:1rem!important;font-size:.75rem!important;
      -webkit-appearance:none!important;
      touch-action:manipulation!important;
      cursor:pointer!important;
      position:relative!important;z-index:10!important
    }

    #cv-cover{grid-template-columns:1fr!important}

  const ALL_SETS=[null,{"n":1,"topic":"Foundational Relationships","diff":"Foundational Relationships","qs":[{"n": 1, "type": "Contrast", "passage": "Early experiments with the compound showed promising results in controlled laboratory conditions. ______ field trials conducted under real-world conditions produced consistently disappointing outcomes.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For example,"}], "answer": "A", "explanation": "The lab results were 'promising' while the field results were 'disappointing' — a direct reversal. 'However' signals this contradiction. 'Therefore' implies the field results followed logically from the lab findings. 'Similarly' implies the results matched. 'For example' implies the field trials illustrated the lab findings."}, {"n": 2, "type": "Causation", "passage": "The prolonged drought reduced soil moisture levels in the region to record lows. ______ crop yields fell by nearly fifty percent in the affected agricultural districts.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Moreover,"}], "answer": "B", "explanation": "The second sentence states a direct consequence of the drought: crop failure. 'As a result' signals this cause-and-effect relationship. 'In contrast' implies an opposing outcome. 'For instance' implies illustration. 'Moreover' adds information in the same direction without implying causation."}, {"n": 3, "type": "Addition", "passage": "The new transportation policy reduced average commute times by twenty minutes. ______ it lowered vehicle emissions in urban centers by fifteen percent.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "In other words,"}], "answer": "C", "explanation": "The second sentence adds another benefit of the same policy — extending the argument in the same direction. 'Furthermore' signals this additional supporting information. 'However' signals contrast. 'Therefore' implies conclusion. 'In other words' implies restatement, not a new point."}, {"n": 4, "type": "Contrast", "passage": "Northern European nations have historically invested heavily in public welfare systems. ______ many developing nations lack the fiscal infrastructure to sustain comparable programs.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "The first sentence describes high investment; the second describes lack of infrastructure — opposite situations. 'In contrast' signals this direct comparison of opposites. 'Similarly' implies the two groups share the same situation. 'For instance' implies illustration. 'As a result' implies causation."}, {"n": 5, "type": "Causation", "passage": "Repeated exposure to noise above 85 decibels permanently damages the hair cells of the inner ear. ______ workers in manufacturing environments frequently develop hearing loss over time.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The second sentence states the logical consequence of the first: because loud noise damages hearing cells, workers develop hearing loss. 'Therefore' signals this logical conclusion. 'However' implies contrast. 'Similarly' implies parallel comparison. 'For example' implies illustration."}, {"n": 6, "type": "Addition", "passage": "The antibiotic proved highly effective against the bacteria responsible for the infection. ______ it produced far fewer side effects than the standard treatment currently in use.", "choices": [{"label": "A", "text": "However,"}, {"la  directly from impaired hemoglobin production. 'For this reason' signals that the first sentence is the cause and the second is the result. 'In contrast' and 'on the other hand' imply opposition. 'Similarly' implies parallel comparison."}, {"n": 12, "type": "Addition", "passage": "The architectural firm's design minimized energy consumption through passive solar heating. ______ it incorporated a rainwater harvesting system that reduced municipal water usage by thirty percent.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "Additionally,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The second sentence adds another sustainability feature of the same design — a second independent benefit. 'Additionally' signals this neutral addition. 'However' implies contrast. 'As a result' implies the rainwater system was caused by the solar heating design. 'For instance' implies the rainwater system illustrates the solar heating point."}, {"n": 13, "type": "Contrast", "passage": "Grizzly bears in protected national park zones have shown steady population growth over the past two decades. ______ populations in adjacent unprotected regions have declined due to habitat loss and human conflict.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "By contrast,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "Protected zones show growth while unprotected areas show decline — directly opposite trends in parallel settings. 'By contrast' marks this explicit comparison of opposites. 'Similarly' implies both populations trend the same way. 'Therefore' implies decline follows from growth. 'Furthermore' adds information without marking contrast."}, {"n": 14, "type": "Causation", "passage": "The algorithm was trained on data that overrepresented urban demographics. ______ its predictions proved far less accurate when applied to rural populations with different behavioral patterns.", "choices": [{"label": "A", "text": "In addition,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Thus,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Biased training data caused reduced accuracy on different populations — a logical consequence. 'Thus' signals this formal cause-and-effect conclusion. 'In addition' adds information. 'However' implies an unexpected contrast. 'For example' implies illustration rather than consequence."}, {"n": 15, "type": "Addition", "passage": "Ancient Mesopotamian societies developed complex legal codes to regulate trade and property rights. ______ early Chinese civilizations established formal administrative systems to manage land ownership and taxation.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Likewise,"}], "answer": "D", "explanation": "Both civilizations independently developed formal governance systems — parallel achievements in different regions. 'Likewise' signals this parallel comparison. 'However' implies contrast. 'Therefore' implies causation between the two. 'For instance' implies Chinese civilization is an example of something stated in the first sentence."}, {"n": 16, "type": "Contrast", "passage": "High-intensity interval training has been shown to improve cardiovascular fitness significantly in a short period of time. ______ it places considerable stress on joints and may be unsuitable for individuals with existing musculoskeletal conditions.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "On the other hand,"}, {"label": "D", "text": "In addition,"}], "answer": "C", "explanation": "The second sentence shifts from benefits to drawbacks of the same activity — a direct contrast. 'On the other hand' marks this shift from one evaluative perspective to an opposing one. 'Similarly' implies agreement. 'Consequently' implies the joint stress results from the cardiovascular benefit. 'In addition' would add a second benefit, not a drawback."}, {"n": 17, "type": "Causation", "passage": "The species had evolved in complete geographic isolation for thousands of years. ______ it had developed characteristics markedly different from those of its closest mainland relatives.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "As a result,"}], "answer": "D", "explanation": "Long isolation caused distinctive evolutionary development — a direct cause-and-effect relationship. 'As a result' signals this consequence of isolation. 'In contrast' implies an opposing outcome. 'For example' implies illustration. 'However' implies an unexpected contrast."}, {"n": 18, "type": "Addition", "passage": "The restructured curriculum increased student engagement scores significantly in pilot schools. ______ standardized test results in those schools improved by an average of twelve percentage points over two academic years.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Furthermore,"}], "answer": "D", "explanation": "The second sentence provides a second, independent positive outcome of the same curriculum change. 'Furthermore' signals this additional evidence extending the same argument. 'In contrast' implies an opposing result. 'Therefore' implies test scores were a logical conclusion of engagement. 'For instance' implies test scores are an example of engagement."}, {"n": 19, "type": "Contrast", "passage": "Multiple peer-reviewed studies confirmed the intervention produced no statistically significant reduction in symptom severity. ______ the research team recommended further investigation, citing insufficient sample size.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Despite null findings, the team still recommended further study — they acted contrary to what the null results might suggest. 'Nevertheless' signals this action taken despite an obstacle or discouraging finding. 'Similarly' implies agreement. 'Therefore' implies the recommendation was a direct logical conclusion of the null findings. 'For example' implies illustration."}, {"n": 20, "type": "Causation", "passage": "The central bank raised interest rates six consecutive times in an effort to curb rising inflation. ______ borrowing costs for businesses and households increased sharply, slowing economic growth.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Furthermore,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Consequently,"}], "answer": "D", "explanation": "The rate increases directly caused higher borrowing costs and slower growth — a chain of consequences. 'Consequently' signals this result. 'However' implies an unexpected contrast. 'Furthermore' adds information without implying causation. 'For instance' implies illustration."}, {"n": 21, "type": "Contrast", "passage": "Proponents argued that stricter emissions standards would create significant compliance costs for the manufacturing sector. ______ a detailed economic analysis found that long-term public health savings far outweighed those costs.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "In particular,"}], "answer": "B", "explanation": "The proponents' argument about costs is contradicted by the economic analysis showing greater savings. 'However' signals this direct reversal of the expected conclusion. 'Therefore' implies the analysis confirms the proponents' position. 'Similarly' implies agreement. 'In particular' signals narrowing to a specific detail."}, {"n": 22, "type": "Addition", "passage": "The new software platform reduced data processing time by forty percent in controlled trials. ______ it demonstrated a significantly lower error rate than the legacy system it was designed to replace.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Moreover,"}], "answer": "D", "explanation": "The second sentence adds a second independent advantage — lower error rates — on top of the speed improvement. 'Moreover' signals this additional, reinforcing point. 'In contrast' implies opposition. 'As a result' implies the lower error rate was caused by the speed improvement. 'For instance' implies error rate illustrates the speed improvement."}, {"n": 23, "type": "Causation", "passage": "Migratory birds navigate using magnetic fields, star patterns, and visual landmarks. When smoke and light pollution obscure these cues, birds lose their directional reference. ______ mass disorientation events have been recorded near heavily industrialized coastal areas during peak migration season.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The passage explains why birds become disoriented near industrial areas: their navigational cues are blocked. 'Therefore' signals the logical conclusion that follows from this explanation. 'In contrast' implies an opposing finding. 'However' implies an unexpected result. 'Similarly' implies parallel comparison with another case."}, {"n": 24, "type": "Contrast", "passage": "Early twentieth-century economists largely dismissed psychological factors in market behavior, focusing on rational utility maximization. ______ behavioral economists who emerged in the latter half of the century placed psychological biases at the center of their frameworks.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "As a result,"}], "answer": "A", "explanation": "Early economists ignored psychology while behavioral economists centered it — directly opposing methodological approaches across time periods. 'In contrast' marks this explicit comparison of opposing positions. 'Similarly' implies agreement. 'For example' implies behavioral economists illustrate the early position. 'As a result' implies behavioral economics was caused by early economics."}, {"n": 25, "type": "Addition", "passage": "The Roman aqueduct allowed settlements in arid regions to maintain reliable access to clean water regardless of seasonal rainfall. ______ it enabled the growth of urban centers at distances that would previously have been unsustainable without a permanent water source.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The second sentence adds a second, distinct benefit of the aqueduct — enabling urban expansion — beyond the first benefit of water reliability. 'Furthermore' signals this additional supporting point extending the same argument. 'However' implies contrast. 'Therefore' implies urban growth was the only logical conclusion. 'For instance' implies urban growth illustrates water reliability."}]},{"n":2,"topic":"Contrast & Addition","diff":"Core Transitions","qs":[{"n": 1, "type": "Exemplification", "passage": "Many species have developed remarkable physiological adaptations to survive in extreme environments. ______ the Saharan silver ant can tolerate body temperatures exceeding fifty degrees Celsius for short periods — among the highest recorded for any animal.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The ant is presented as a specific case that illustrates the general claim about extreme adaptations. 'For instance' correctly signals this exemplification. 'However' implies a contradiction. 'Therefore' implies the ant's tolerance caused or concluded something. 'In contrast' implies the ant represents an opposite example."}, {"n": 2, "type": "Contrast", "passage": "The initial clinical trial produced results that strongly supported the drug's effectiveness. ______ a larger follow-up study involving a more diverse patient population failed to replicate those findings.", "choices": [{"label": "A", "text": "Furthermore,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "Likewise,"}], "answer": "C", "explanation": "Positive initial results are directly contradicted by a failed follow-up — a clear reversal. 'However' signals this contradiction. 'Furthermore' adds supporting information. 'Therefore' implies failure followed logically from success. 'Likewise' implies the follow-up produced similarly positive results."}, {"n": 3, "type": "Causation", "passage": "The introduction of invasive zebra mussels drastically reduced phytoplankton populations in the Great Lakes by filtering vast quantities of water. ______ the fish species that depended on phytoplankton as a food source experienced significant population declines.", "choices": [{"label": "A", "text": "In addition,"}, {"label": "B", "text": "On the other hand,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The decline in phytoplankton caused by the mussels led directly to fish population decline. 'As a result' signals this consequential chain. 'In addition' adds information without causation. 'On the other hand' implies contrast. 'For example' implies the fish decline is an illustration of the mussel problem."}, {"n": 4, "type": "Exemplification", "passage": "Governments have increasingly adopted behavioral nudges to encourage healthier public choices without restricting individual freedom. ______ several countries have restructured cafeteria layouts in public schools to make nutritious foods more visually prominent and accessible.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Specifically,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "On the other hand,"}], "answer": "B", "explanation": "The cafeteria layout change is a specific, concrete example of the general behavioral nudge policy described in the first sentence. 'Specifically' correctly signals this narrowing to a particular illustration. 'However' implies contradiction. 'Therefore' implies causation. 'On the other hand' implies contrast."}, {"n": 5, "type": "Addition", "passage": "The fossil record reveals that early mammals were predominantly small, nocturnal creatures during the age of dinosaurs. ______ they were remarkably diverse in body form, including swimmers, burrowers, and gliders.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "Additionally,"}], "answer": "D", "explanation": "The second sentence adds another characteristic of early mammals — their diversity — alongside the smallness already mentioned. 'Additionally' correctly signals this neutral addition. 'However' implies contrast with being small. 'As a result' implies diversity was caused by smallness. 'For instance' implies diversity is an example of being small and nocturnal."}, {"n": 6, "type": "Contrast", "passage": "Urban gardens have been widely promoted as solutions to food insecurity in low-income neighborhoods. ______ research indicates that the yields from typical community plots are rarely sufficient to meaningfully supplement household food budgets.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The promoted solution (urban gardens) is undermined by research showing insufficient yield — a contrast between expectation and reality. 'However' signals this contradiction. 'Similarly' implies agreement. 'Therefore' implies the yield problem follows from the promotion. 'For instance' implies the research illustrates something from the first sentence."}, {"n": 7, "type": "Causation", "passage": "The collapse of a major investment bank sent shockwaves through global financial markets, triggering a cascade of institutional failures. ______ credit markets seized up almost entirely, making it nearly impossible for businesses to secure short-term financing.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Likewise,"}], "answer": "B", "explanation": "The bank's collapse caused the credit markets to seize up — a direct consequence in a chain of events. 'Consequently' signals this cause-and-effect relationship. 'In contrast' implies an opposing outcome. 'For example' implies illustration. 'Likewise' implies parallel comparison."}, {"n": 8, "type": "Exemplification", "passage": "Some philosophers argue that consciousness cannot be fully explained by physical brain processes alone. ______ the 'hard problem' of consciousness asks why there is subjective experience at all, rather than merely information processing without any felt quality.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "The hard problem is cited as a specific example of the broader philosophical argument described in the first sentence. 'For example' signals this exemplification. 'However' implies the hard problem contradicts the argument. 'Therefore' implies causation. 'Furthermore' adds a new point rather than illustrating."}, {"n": 9, "type": "Contrast", "passage": "The marsupial lion, Thylacoleo carnifex, possessed the most powerful bite force relative to body size of any known mammal. ______ its forelimbs, long considered weak, were recently revealed by biomechanical analysis to have been highly effective for climbing and prey restraint.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Moreover,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The second sentence adds a second remarkable physical attribute of the same animal — strong forelimbs — alongside the bite force already established. 'Moreover' signals this additional reinforcing detail. 'Similarly' implies comparison with another animal. 'Therefore' implies causation. 'In contrast' implies the forelimbs oppose something about the bite force."}, {"n": 10, "type": "Causation", "passage": "A series of late frosts damaged blossoms across major apple-growing regions at a critical stage of fruit development. ______ domestic apple supplies fell short of market demand the following autumn, driving retail prices to a ten-year high.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "Frost damage to blossoms directly caused reduced supply and higher prices. 'Therefore' signals this logical consequence. 'However' implies an unexpected contrast. 'Similarly' implies parallel comparison. 'For instance' implies illustration."}, {"n": 11, "type": "Exemplification", "passage": "Historical records show that many ancient civilizations independently developed strikingly similar solutions to shared problems of governance and social organization. ______ both the Roman Republic and the Athenian city-state experimented with forms of representative deliberation centuries before the concept of modern democracy emerged.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "In particular,"}, {"label": "D", "text": "On the other hand,"}], "answer": "C", "explanation": "The Roman and Athenian example is highlighted as a specific instance of the general claim about parallel civilizational developments. 'In particular' correctly signals this narrowing to a specific illustrative case. 'However' implies contradiction. 'As a result' implies causation. 'On the other hand' implies contrast."}, {"n": 12, "type": "Addition", "passage": "The composer incorporated unconventional time signatures rarely seen in mainstream classical repertoire. ______ she deliberately avoided functional harmony, replacing traditional chord progressions with sustained dissonant clusters.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The avoidance of functional harmony is a second, independent compositional choice that reinforces the composer's unconventional approach. 'Furthermore' signals this additional parallel point. 'However' implies contrast. 'As a result' implies the harmonic choice was caused by the time signatures. 'For instance' implies the harmony illustrates the time signatures."}, {"n": 13, "type": "Contrast", "passage": "Keystone predators such as wolves play a disproportionately large role in regulating ecosystem balance relative to their population size. ______ in their absence, prey species can multiply unchecked and fundamentally alter the vegetation structure of entire landscapes.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "However,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For example,"}], "answer": "B", "explanation": "The presence of wolves maintains balance; without them, ecosystems are disrupted — a contrast between presence and absence. 'However' signals this shift from one state to its opposite. 'Similarly' implies the absence has the same effect as presence. 'Therefore' implies unchecked prey is a conclusion drawn from their regulatory role. 'For example' implies this is one case of the general claim."}, {"n": 14, "type": "Causation", "passage": "The volcanic eruption of 1815 released enormous quantities of sulfur dioxide into the stratosphere, forming a reflective aerosol layer that encircled the globe. ______ average global temperatures dropped by approximately one degree Celsius the following year, producing what became known as the Year Without a Summer.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Moreover,"}], "answer": "B", "explanation": "The aerosol layer directly caused the temperature drop — a clear physical mechanism and its consequence. 'As a result' signals this causal chain. 'In contrast' implies an opposing temperature trend. 'For example' implies the temperature drop illustrates the aerosol. 'Moreover' adds information without implying causation."}, {"n": 15, "type": "Exemplification", "passage": "Architects increasingly draw on biomimicry, designing structures based on principles observed in natural organisms. ______ the Eastgate Centre in Zimbabwe was modeled after termite mounds, using passive airflow channels to regulate interior temperature without conventional air conditioning.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The Eastgate Centre is a specific building that exemplifies the general principle of biomimicry described in the first sentence. 'For instance' signals this exemplification. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies the building opposes biomimicry."}, {"n": 16, "type": "Contrast", "passage": "Early theories of plate tectonics met fierce resistance from the geological establishment, which dismissed continental drift as implausible without a credible mechanism. ______ within two decades, the discovery of seafloor spreading provided exactly the mechanical explanation the theory required.", "choices": [{"label": "A", "text": "Furthermore,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "However,"}], "answer": "D", "explanation": "Initial resistance is reversed by a discovery that validated the theory — a shift from rejection to confirmation. 'However' signals this reversal. 'Furthermore' adds information without indicating reversal. 'Therefore' implies the discovery logically followed from the resistance. 'Subsequently' only marks time sequence, not the evaluative reversal."}, {"n": 17, "type": "Causation", "passage": "The removal of predatory sea otters from kelp forest ecosystems allowed sea urchin populations to surge dramatically. ______ the urchins consumed kelp at rates that stripped entire coastal zones of their primary plant structure.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Likewise,"}], "answer": "C", "explanation": "The urchin population surge was the direct result of otter removal, and the kelp destruction was the direct result of the urchin surge. 'Consequently' signals this cascading consequence. 'In contrast' implies an opposing outcome. 'For example' implies illustration. 'Likewise' implies parallel comparison."}, {"n": 18, "type": "Addition", "passage": "The 1906 San Francisco earthquake destroyed an estimated twenty-eight thousand buildings. ______ the fires that broke out in its aftermath burned for three days and caused damage exceeding that of the quake itself.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Moreover,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "In other words,"}], "answer": "B", "explanation": "The fires add a second layer of catastrophic damage beyond the earthquake — reinforcing and extending the account of destruction. 'Moreover' signals this additional, intensifying point. 'However' implies the fires unexpectedly contradicted the earthquake's damage. 'As a result' implies the fires caused the building destruction. 'In other words' implies restatement."}, {"n": 19, "type": "Contrast", "passage": "Proponents of nuclear energy argue that it produces minimal greenhouse gas emissions during electricity generation compared to fossil fuels. ______ critics point to the unresolved challenge of safely storing radioactive waste for periods exceeding ten thousand years.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "Supporters cite an environmental advantage; critics cite a long-term risk — directly opposing perspectives on the same technology. 'However' marks this shift from one side to the opposing argument. 'Similarly' implies critics share the proponents' position. 'Therefore' implies the waste problem follows from low emissions. 'For instance' implies critics illustrate the supporters' point."}, {"n": 20, "type": "Exemplification", "passage": "The decorative arts of the Art Nouveau movement were characterized by organic, flowing forms inspired by natural shapes rather than geometric abstraction. ______ Hector Guimard's iconic Paris Metro entrances feature iron structures that mimic the curved stems and canopies of plants.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The Metro entrances are a specific, concrete example of Art Nouveau's organic forms described in the first sentence. 'For example' signals this exemplification. 'Nevertheless' implies action despite an obstacle. 'Therefore' implies the entrances were caused by the movement's principles. 'In contrast' implies the entrances deviate from those principles."}, {"n": 21, "type": "Causation", "passage": "Overfishing depleted Atlantic cod stocks to critical levels throughout the 1980s. ______ Canada was forced to impose a complete moratorium on cod fishing in 1992, devastating fishing communities across Newfoundland.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The depletion caused the regulatory response: the moratorium was the direct consequence of overfishing. 'Therefore' signals this logical, causal conclusion. 'However' implies the moratorium was unexpected or contradictory. 'Similarly' implies parallel comparison. 'For instance' implies illustration."}, {"n": 22, "type": "Contrast", "passage": "Ancient Greek architects achieved precise horizontal alignment in temple construction using subtle upward curvature of base platforms. ______ even the seemingly straight columns taper slightly inward to prevent the optical illusion of sagging under the weight of the entablature.", "choices": [{"label": "A", "text": "Furthermore,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "However,"}], "answer": "A", "explanation": "The second sentence adds another optical correction technique used in Greek temple construction — extending the discussion with a related but distinct example. 'Furthermore' signals this addition of a parallel supporting point. 'As a result' implies column tapering was caused by base curvature. 'For instance' would make tapering an example of base curvature, conflating two separate techniques. 'However' implies contrast."}, {"n": 23, "type": "Causation", "passage": "The government's decision to eliminate subsidies for domestic grain production left smallholder farmers unable to compete with cheaper imported cereals. ______ rural poverty rates increased sharply in the affected regions over the following three years.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "Nevertheless,"}], "answer": "C", "explanation": "The elimination of subsidies caused smallholders to become uncompetitive, which in turn caused rising poverty. 'As a result' signals this causal outcome. 'In contrast' implies an opposing trend. 'For example' implies the poverty rise is an illustration of competition. 'Nevertheless' implies poverty increased despite an obstacle, which misreads the relationship."}, {"n": 24, "type": "Exemplification", "passage": "Cognitive biases can distort financial decision-making even among highly trained professionals. ______ the disposition effect — the tendency to sell winning investments too quickly while holding onto losing ones for too long — has been documented in the behavior of professional fund managers.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Specifically,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The disposition effect is a specific, named cognitive bias that illustrates the general claim about professional financial decision-making. 'Specifically' signals this narrowing to a concrete example. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 25, "type": "Contrast", "passage": "Traditional economic models assumed that consumers make rational decisions by carefully weighing all available information. ______ decades of experimental research in behavioral economics have demonstrated that people routinely rely on mental shortcuts that produce systematic, predictable errors.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "Additionally,"}], "answer": "C", "explanation": "Traditional assumptions about rationality are directly undermined by behavioral research showing systematic irrationality. 'However' signals this fundamental contradiction between theory and evidence. 'Similarly' implies behavioral research confirms rational models. 'Therefore' implies irrational behavior follows logically from rational assumptions. 'Additionally' adds without contradicting."}]},{"n":3,"topic":"Causation & Sequence","diff":"Core + Exemplification","qs":[{"n": 1, "type": "Concession", "passage": "The vaccination campaign faced significant logistical challenges, including shortages of cold storage in rural areas and resistance from some community leaders. ______ health authorities ultimately achieved immunization rates that exceeded the initial targets set by the national health ministry.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Despite these obstacles,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The difficulties are acknowledged, but success was achieved anyway — a classic concession structure. 'Despite these obstacles' correctly signals that the outcome occurred in spite of the challenges. 'Therefore' implies success was a logical result of the challenges. 'For instance' implies success illustrates the challenges. 'Similarly' implies the success mirrored something else."}, {"n": 2, "type": "Sequence", "passage": "Researchers first identified the protein's role in cellular metabolism through a series of controlled enzymatic assays. ______ they used X-ray crystallography to determine its three-dimensional structure with atomic-level precision.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The X-ray work came after and as a next step from the metabolic assays — a clear chronological sequence. 'Subsequently' signals this temporal progression. 'However' implies the structural work contradicted the metabolic findings. 'As a result' implies the structure was caused by the assays. 'In contrast' implies opposition."}, {"n": 3, "type": "Contrast", "passage": "The policy was projected to generate significant cost savings for the health care system over a ten-year period. ______ independent analysts found that implementation costs in the first two years had already exceeded the projected decade-long savings.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Furthermore,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "However,"}], "answer": "D", "explanation": "The projected savings are directly contradicted by the reality of costs exceeding those savings. 'However' signals this stark reversal between prediction and outcome. 'Similarly' implies the analysis confirmed the projection. 'Furthermore' adds information. 'For instance' implies the analysis illustrates the projection."}, {"n": 4, "type": "Concession", "passage": "Critics pointed out that the novelist's prose style was dense, allusive, and often resistant to casual reading. ______ the work earned widespread critical acclaim and sold more copies in its first month than any debut novel in the publisher's history.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "Nevertheless,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For example,"}], "answer": "B", "explanation": "Despite the acknowledged stylistic difficulty, the novel succeeded commercially and critically — a concession structure. 'Nevertheless' signals that the success occurred in spite of the criticism. 'As a result' implies difficulty caused success. 'Similarly' implies the success mirrors something else. 'For example' implies success illustrates the density."}, {"n": 5, "type": "Sequence", "passage": "Early hominins first controlled fire approximately one million years ago, using it primarily for warmth and protection from predators. ______ evidence suggests they began deliberately using fire for cooking, which significantly expanded the range of digestible foods.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Eventually,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "Cooking use developed later, over a long period of time after initial fire control — a temporal progression. 'Eventually' signals this gradual development over time. 'However' implies cooking contradicted warming/protection uses. 'In contrast' implies cooking was an opposing application. 'As a result' implies cooking was caused by warmth and predator protection."}, {"n": 6, "type": "Causation", "passage": "Heavy industrial development along the river's banks introduced elevated concentrations of nitrogen and phosphorus into the water supply over several decades. ______ algal blooms proliferated across the river's surface, depleting oxygen levels and creating hypoxic zones that could not support aquatic life.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Furthermore,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Elevated nutrients caused algal bloom proliferation — a direct ecological consequence. 'As a result' signals this causal relationship. 'In contrast' implies an opposing ecological response. 'Furthermore' adds without implying cause. 'For example' implies illustration."}, {"n": 7, "type": "Concession", "passage": "The proposal to convert the historic factory site into affordable housing faced opposition from preservation groups concerned about destroying an industrial landmark. ______ the city council approved the development plan by a wide margin, citing an acute shortage of housing supply.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Despite this opposition,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "Despite acknowledged opposition, the council approved the plan anyway. 'Despite this opposition' correctly signals this concessive relationship. 'Therefore' implies approval was a logical conclusion of the opposition. 'Similarly' implies the approval mirrors another situation. 'For instance' implies approval illustrates the opposition."}, {"n": 8, "type": "Exemplification", "passage": "The study of epigenetics has revealed that environmental factors can alter gene expression without changing the underlying DNA sequence, and that some of these changes may be heritable. ______ children of individuals who experienced severe famine during critical developmental windows have shown distinct patterns of metabolic gene regulation.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The famine study is a concrete example illustrating the general claim about heritable epigenetic changes. 'For example' correctly signals this exemplification. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 9, "type": "Sequence", "passage": "The initial peer review process identified several methodological concerns that the authors had not addressed in their original submission. ______ the manuscript was returned to the research team with a detailed list of required revisions before it could be considered for publication.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "The return for revisions came after and as a result of the review identifying concerns — a sequential process. 'Subsequently' signals this temporal next step. 'However' implies the return contradicted the review's concerns. 'Similarly' implies parallel comparison. 'In contrast' implies the return opposed the review's findings."}, {"n": 10, "type": "Contrast", "passage": "Machine learning models trained on large datasets have achieved remarkable performance on benchmark tasks in image recognition and natural language processing. ______ they often fail catastrophically when deployed in real-world environments containing data distributions not represented in their training sets.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "Furthermore,"}], "answer": "C", "explanation": "Benchmark success contrasts with real-world failure — a well-known tension in machine learning. 'However' signals this direct contradiction between controlled performance and practical performance. 'Similarly' implies real-world performance mirrors benchmark performance. 'Therefore' implies failure follows from success. 'Furthermore' adds without contrasting."}, {"n": 11, "type": "Concession", "passage": "The ocean-crossing was fraught with dangerous weather, mechanical failures, and an outbreak of illness among the crew that incapacitated nearly a third of the ship's company. ______ the expedition reached its destination within two weeks of the original schedule.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The serious obstacles listed in the first sentence make the near-on-schedule arrival surprising — a concession structure. 'Nevertheless' signals success despite significant adversity. 'As a result' implies the schedule was a consequence of the problems. 'For example' implies the schedule illustrates the problems. 'Similarly' implies comparison."}, {"n": 12, "type": "Sequence", "passage": "Astronomers confirmed the existence of gravitational waves through indirect evidence in 1974, earning the researchers a Nobel Prize. ______ in 2015, the LIGO observatory made the first direct detection of gravitational waves, opening an entirely new window on the universe.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Decades later,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The first direct detection came approximately four decades after the indirect confirmation — a clear temporal sequence. 'Decades later' signals this gap in time. 'However' implies contradiction between the two events. 'As a result' implies direct detection was caused by indirect evidence. 'In contrast' implies opposition."}, {"n": 13, "type": "Causation", "passage": "Several major studies linked high consumption of processed red meat to elevated risk of colorectal cancer. ______ public health agencies in multiple countries updated their dietary guidelines to recommend significant reductions in red meat intake.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "Meanwhile,"}], "answer": "B", "explanation": "The research findings caused the policy response: guidelines were updated as a logical consequence of the evidence. 'Therefore' signals this causal conclusion. 'In contrast' implies the guidelines contradicted the studies. 'For example' implies the guidelines illustrate the studies. 'Meanwhile' implies simultaneous events without causation."}, {"n": 14, "type": "Concession", "passage": "The documentary was produced on a minimal budget, relying entirely on interviews and archival footage rather than dramatic reconstruction or expensive location filming. ______ it went on to win three major international awards and was praised universally for its restraint and emotional depth.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Despite its modest production,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The budget limitations are acknowledged as constraints; the awards nonetheless followed. 'Despite its modest production' correctly signals the concession. 'Therefore' implies the awards were a logical result of low budget. 'For instance' implies the awards illustrate the budget. 'Similarly' implies comparison."}, {"n": 15, "type": "Contrast", "passage": "Psychologists initially classified autism spectrum disorder primarily as a social communication impairment, emphasizing deficits relative to neurotypical behavior. ______ more recent frameworks conceptualize autism as a form of neurodiversity, focusing on difference rather than deficit.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "For instance,"}, {"label": "D", "text": "In contrast,"}], "answer": "D", "explanation": "The deficit model is directly opposed by the neurodiversity model — a paradigm shift in conceptual framing. 'In contrast' signals this explicit comparison of opposing frameworks. 'Similarly' implies the newer framework agrees with the older one. 'As a result' implies one caused the other. 'For instance' implies illustration."}, {"n": 16, "type": "Sequence", "passage": "During the Renaissance, European artists began experimenting with linear perspective as a mathematical system for representing three-dimensional space on a flat surface. ______ painters like Raphael and Titian refined and extended these principles to achieve unprecedented depth and realism in large-scale compositions.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "As a result,"}], "answer": "C", "explanation": "Raphael and Titian came after the initial experimenters and built on their work — a chronological succession. 'Subsequently' signals this temporal development. 'However' implies the later painters contradicted the earlier experiments. 'In contrast' implies opposition. 'As a result' implies Raphael's work was caused by the initial experiments, which is too direct."}, {"n": 17, "type": "Causation", "passage": "The widespread adoption of smartphones fundamentally changed how people navigate unfamiliar environments, replacing printed maps and asking directions with real-time GPS applications. ______ spatial memory skills — the ability to learn and retain routes through direct experience — have measurably declined in populations with high smartphone usage.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "As a result,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For example,"}], "answer": "B", "explanation": "GPS reliance caused a decline in spatial memory — a direct cognitive consequence of technological change. 'As a result' signals this causal relationship. 'However' implies an unexpected contrast. 'Similarly' implies parallel comparison. 'For example' implies illustration."}, {"n": 18, "type": "Concession", "passage": "The economic transition plan faced strong opposition from labor unions, industry groups, and several regional governments who feared job losses in traditional sectors. ______ international observers praised it as among the most ambitious and well-designed structural reform programs introduced in the region in a generation.", "choices": [{"label": "A", "text": "Therefore,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "Nevertheless,"}, {"label": "D", "text": "For instance,"}], "answer": "C", "explanation": "The domestic opposition makes the international praise somewhat surprising — the plan was acclaimed externally despite internal resistance. 'Nevertheless' signals this outcome in spite of significant opposition. 'Therefore' implies praise resulted from opposition. 'Consequently' implies praise was caused by opposition. 'For instance' implies praise illustrates opposition."}, {"n": 19, "type": "Exemplification", "passage": "The brain's reward system can be hijacked by behaviors that provide intense, immediate gratification, creating dependency patterns structurally similar to substance addiction. ______ compulsive social media use has been shown to activate the same dopamine pathways implicated in gambling and drug dependency.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "For example,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "Social media is presented as a specific behavioral example illustrating the general claim about non-substance addiction. 'For example' correctly signals this. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 20, "type": "Contrast", "passage": "Early aviation pioneers believed that fixed-wing aircraft design had reached its practical limits by the 1920s, with little room for improvement in speed or range. ______ the development of jet propulsion within two decades revolutionized aviation and rendered those assumptions entirely obsolete.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Consequently,"}, {"label": "C", "text": "Furthermore,"}, {"label": "D", "text": "However,"}], "answer": "D", "explanation": "The belief in design limits was proven wrong by jet propulsion — a direct contradiction of expert prediction. 'However' signals this reversal. 'Similarly' implies the jet engine confirmed the belief. 'Consequently' implies the engine followed from the belief. 'Furthermore' adds without contradicting."}, {"n": 21, "type": "Sequence", "passage": "The ancient city was abandoned around 900 CE, likely due to a combination of prolonged drought and political fragmentation. ______ for nearly six centuries, the site lay undisturbed beneath accumulated sediment until archaeologists began systematic excavation in the early twentieth century.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Thereafter,"}, {"label": "D", "text": "In contrast,"}], "answer": "C", "explanation": "Six centuries of abandonment followed the initial desertion — a clear temporal sequence. 'Thereafter' signals this continuation of time after the abandonment. 'However' implies an unexpected event interrupted the abandonment. 'Therefore' implies the six centuries caused something. 'In contrast' implies the six centuries represented an opposing condition."}, {"n": 22, "type": "Causation", "passage": "The new land use regulations prohibited commercial development within five hundred meters of designated wetland boundaries. ______ several proposed industrial projects in the region were cancelled or relocated before breaking ground.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "The regulations directly caused the cancellation or relocation of industrial projects. 'Consequently' signals this policy consequence. 'In contrast' implies an opposing result. 'For example' implies the projects illustrate the regulations. 'Similarly' implies parallel comparison."}, {"n": 23, "type": "Concession", "passage": "The painting technique demanded an extraordinary degree of precision, requiring the artist to work with brushes containing only three or four hairs and to allow each microscopic layer to dry fully before applying the next. ______ the finished work conveyed a sense of spontaneity and fluid movement that belied the painstaking method of its creation.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For instance,"}, {"label": "C", "text": "Despite this technical severity,"}, {"label": "D", "text": "Therefore,"}], "answer": "C", "explanation": "The highly controlled process paradoxically produced an appearance of spontaneity — the outcome contrasts with the method. 'Despite this technical severity' signals this concessive relationship. 'As a result' implies spontaneity was caused by the precision. 'For instance' implies spontaneity illustrates the precision. 'Therefore' implies the same causal relationship."}, {"n": 24, "type": "Sequence", "passage": "Researchers identified a previously unknown protein involved in the regulation of cell division and confirmed its structure using cryo-electron microscopy. ______ they developed a series of synthetic inhibitors designed to block the protein's activity in cancer cells.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Subsequently,"}, {"label": "D", "text": "In addition,"}], "answer": "C", "explanation": "Developing inhibitors was the next research step following identification and structural analysis. 'Subsequently' signals this temporal and logical progression. 'However' implies the inhibitors contradicted the structural findings. 'In contrast' implies opposition. 'In addition' implies parallel addition rather than sequential next step."}, {"n": 25, "type": "Contrast", "passage": "Advocates of decentralized governance argue that local authorities are better positioned to respond to the specific needs and priorities of their communities than distant central governments. ______ studies of service delivery outcomes in several countries suggest that decentralized systems can produce significant inconsistencies in quality and access across regions.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "However,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The advocacy claim (local is better) is countered by evidence of inconsistency — an opposing finding. 'However' signals this contradiction between the theoretical argument and the empirical evidence. 'Similarly' implies the studies confirm the advocacy position. 'Therefore' implies inconsistency follows from the argument. 'For example' implies illustration."}]},{"n":4,"topic":"Concession & Restatement","diff":"Mixed Transitions","qs":[{"n": 1, "type": "Restatement", "passage": "The study's findings suggest that early childhood exposure to a second language creates neural pathways that persist into adulthood and confer lasting cognitive advantages. ______ children who grow up in bilingual environments appear to develop stronger executive control mechanisms than those raised in monolingual settings.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In other words,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "In contrast,"}], "answer": "B", "explanation": "The second sentence restates the first sentence's claim in more concrete, specific terms — the 'neural pathways' become 'stronger executive control mechanisms.' 'In other words' signals this restatement. 'However' implies contradiction. 'Therefore' implies causation. 'In contrast' implies opposition."}, {"n": 2, "type": "Concession", "passage": "The bridge had been flagged as structurally compromised in three separate engineering inspections conducted over a seven-year period. ______ budget constraints prevented the local government from undertaking the necessary repairs until after a partial collapse forced an emergency closure.", "choices": [{"label": "A", "text": "Nevertheless,"}, {"label": "B", "text": "Therefore,"}, {"label": "C", "text": "Similarly,"}, {"label": "D", "text": "For example,"}], "answer": "A", "explanation": "The warning signs were known, but repairs were still not made — a failure to act despite clear evidence. 'Nevertheless' signals that inaction continued even in the face of repeated warnings. 'Therefore' implies budget constraints caused the inspections. 'Similarly' implies comparison. 'For example' implies illustration."}, {"n": 3, "type": "Clarification", "passage": "The decline in monarch butterfly populations is often attributed primarily to habitat loss caused by agricultural expansion. ______ pesticide use — particularly neonicotinoids applied to milkweed plants — has emerged as an equally significant factor in recent research.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "In fact,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For instance,"}], "answer": "B", "explanation": "The second sentence corrects or complicates the common assumption that habitat loss is the primary cause — introducing a factor of equal or greater significance. 'In fact' signals this correction or intensification of the previous claim. 'Similarly' implies the pesticide finding confirms habitat loss as primary. 'Therefore' implies causation. 'For instance' implies illustration."}, {"n": 4, "type": "Causation", "passage": "The introduction of a carbon pricing mechanism raised the operational cost of coal-fired electricity generation relative to renewables. ______ investment in wind and solar capacity accelerated significantly as the economic case for fossil fuel infrastructure weakened.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In contrast,"}, {"label": "C", "text": "Consequently,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "The carbon price changed the economic equation, which caused accelerated investment in renewables. 'Consequently' signals this policy-driven causal chain. 'However' implies an unexpected result. 'In contrast' implies renewable investment opposed something. 'For example' implies illustration."}, {"n": 5, "type": "Contrast", "passage": "Behavioral economists have documented that individuals are far more sensitive to financial losses than to equivalent gains — a phenomenon known as loss aversion. ______ in certain social contexts, people consistently demonstrate risk-seeking behavior, particularly when they frame potential losses as certain unless they act.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Similarly,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "For instance,"}], "answer": "A", "explanation": "The general tendency toward loss aversion is complicated by contexts where risk-seeking emerges — a conditional reversal. 'However' signals that the second sentence presents an exception to the established pattern. 'Similarly' implies risk-seeking confirms loss aversion. 'Therefore' implies risk-seeking is a consequence of loss aversion. 'For instance' implies illustration."}, {"n": 6, "type": "Restatement", "passage": "The architectural style prioritizes the honest expression of structural and material elements, leaving load-bearing columns, ductwork, and piping deliberately exposed rather than concealing them within decorative finishes. ______ the building's internal systems become the aesthetic rather than something the design works to hide.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "In other words,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "As a result,"}], "answer": "B", "explanation": "The second sentence rephrases the first's idea in simpler, more direct language — 'internal systems become the aesthetic' restates 'honest expression of structural elements.' 'In other words' signals this restatement. 'However' implies contradiction. 'Therefore' and 'As a result' both imply causation."}, {"n": 7, "type": "Concession", "passage": "The proposed merger would create a company controlling nearly sixty percent of the domestic market, raising significant antitrust concerns. ______ regulatory bodies ultimately approved the transaction after both companies agreed to divest several subsidiary brands in competitive segments.", "choices": [{"label": "A", "text": "As a result,"}, {"label": "B", "text": "For example,"}, {"label": "C", "text": "Despite these concerns,"}, {"label": "D", "text": "Similarly,"}], "answer": "C", "explanation": "Significant antitrust concerns were acknowledged, but approval followed anyway after conditions were met. 'Despite these concerns' signals this concessive relationship. 'As a result' implies approval was caused by the antitrust concerns. 'For example' implies approval illustrates the concerns. 'Similarly' implies comparison."}, {"n": 8, "type": "Causation", "passage": "Rising sea surface temperatures have intensified tropical storm activity by providing additional thermal energy that fuels cyclone development and sustains higher wind speeds at peak intensity. ______ the frequency of Category 4 and 5 hurricanes has increased measurably over the past four decades.", "choices": [{"label": "A", "text": "In contrast,"}, {"label": "B", "text": "Moreover,"}, {"label": "C", "text": "As a result,"}, {"label": "D", "text": "For example,"}], "answer": "C", "explanation": "Warmer ocean temperatures are the mechanism causing increased major hurricane frequency. 'As a result' signals this direct causal relationship. 'In contrast' implies an opposing trend. 'Moreover' adds without implying causation. 'For example' implies illustration."}, {"n": 9, "type": "Clarification", "passage": "The research did not conclude that social media use directly causes depression in adolescents. ______ it found a correlation between heavy usage and reported feelings of loneliness and inadequacy, while noting that causality may flow in either direction.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Rather,"}, {"label": "C", "text": "Therefore,"}, {"label": "D", "text": "Similarly,"}], "answer": "B", "explanation": "The first sentence clarifies what the research did not find; the second specifies what it actually did find. 'Rather' signals this correction — introducing the actual finding after disqualifying a common misconception. 'However' implies a simple contrast. 'Therefore' implies causation. 'Similarly' implies comparison."}, {"n": 10, "type": "Sequence", "passage": "Paleontologists first discovered fossilized feathers in theropod dinosaurs during the 1990s, challenging the established view of dinosaurs as entirely reptilian. ______ genomic analysis confirmed that birds are direct descendants of theropod dinosaurs, effectively reclassifying birds as living dinosaurs.", "choices": [{"label": "A", "text": "However,"}, {"label": "B", "text": "Subsequently,"}, {"label": "C", "text": "In contrast,"}, {"label": "D", "text": "For example,"}], "answer": "B", "explanation": "The genomic confirmation came after the fossil discovery and extended the paradigm shift further. 'Subsequently' signals this temporal and logical progression. 'However' implies the genomic finding contradicted the fossil evidence. 'In contrast' implies opposition. 'For example' implies illustration."}, {"n": 11, "type": "Contrast", "passage": "The urban planning movement of the mid-twentieth century championed large-scale housing projects and the separation of residential, commercial, and industrial zones. ______ scholars and planners in subsequent decades argued that mixed-use neighborhoods with high walkability produced far better social and economic outcomes.", "choices": [{"label": "A", "text": "Similarly,"}, {"label": "B", "text": "Therefore,"},
