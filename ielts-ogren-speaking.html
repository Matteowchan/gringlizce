*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1140px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}

.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}

p{margin:0 0 12px}

.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}

.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}

.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}

.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}

.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--card);resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}

.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--card)}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}

.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}

.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:18px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:15.5px;line-height:1.6;margin-bottom:12px;font-weight:500}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:15px;padding:12px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:240px;transition:border-color .15s,box-shadow .15s}

.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:var(--card);color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:var(--card);color:#a8382f;border:1px solid #F1D4CD}

.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

: "Başlarken", "name": "Bu Modül", "eyebrow": "Başlarken", "blocks": [{"t": "p", "x": "Konuşurken hatanı duymazsın, dinlerken duyarsın. Bu modülün bütün mantığı budur. On iki kayıt görevi var ve her birinde kendi sesini dinleyeceksin."}, {"t": "note", "k": "protokol", "title": "Kayıt kuralları", "lines": ["Tek çekimde kaydet. Durdurup baştan alma. Sınavda ikinci şans yok.", "Yazılı nota bakma. Sadece Part 2'de bir dakikalık hazırlık notu alabilirsin, o notta cümle değil kelime olur.", "Telefonu veya cihazı doğal mesafede tut, ağzına yaklaştırma.", "Kayıt bittikten sonra kendi kaydını baştan sona dinle ve o görevin kontrol sorularını yanıtla."]}, {"t": "note", "k": "dikkat", "title": "Kendi kaydını dinlemek zorundasın", "lines": ["Kaydı gönderip geçmek işe yaramaz. Bu modüldeki en önemli adım, kendi sesini dinlemektir.", "Konuşurken hatalarını duymazsın, çünkü beynin cümleyi kurmakla meşguldür. Dinlerken duyarsın."]}, {"t": "note", "k": "ipucu", "title": "Kayıt bu sayfada", "lines": ["Her görevde Kaydı başlat düğmesi var. Tarayıcı mikrofon izni ister, izin verirsen doğrudan burada kaydedip dinleyebilirsin. Kayıt cihazından çıkmaz, hiçbir yere yüklenmez.", "Mikrofon izni vermezsen sorunları gene sesli yanıtla ve telefonuna kaydet."]}]}, {"id": "iskele", "group": "Temeller", "name": "Cevap İskeletleri", "eyebrow": "Temeller", "blocks": [{"t": "p", "x": "Her Part'ın kendi kalıbı var. Ezberleme, kullan."}, {"t": "given", "title": "Part 1. Cevap. Sebep. Örnek.", "x": "Do you enjoy reading? — Yes, I do, although I read less than I would like to. (CEVAP) I mostly read novels, and a good story helps me switch off after school. (SEBEP) At the moment I am halfway through a detective novel a friend recommended. (ÖRNEK)"}, {"t": "given", "title": "Part 2. Giriş. Dört madde. Kapanış değerlendirmesi.", "x": "I would like to talk about... (GİRİŞ) It is... I usually go... I normally... (DÖRT MADDE) The reason I like it so much is that... (KAPANIŞ)"}, {"t": "given", "title": "Part 3. Görüş. Karşı baskı. Kendi gerekçen.", "x": "Should cities have more green spaces? — Definitely, and I would say it is becoming more urgent. (GÖRÜŞ) As cities grow, the pressure to build on every piece of land is enormous, so parks are the first thing sacrificed. (KARŞI BASKI) But they give people somewhere to go that costs nothing, which matters in a city where everything requires money. (GEREKÇE)"}]}, {"id": "tempo", "group": "Temeller", "name": "Cue Card Temposu", "eyebrow": "Temeller", "blocks": [{"t": "p", "x": "Sorun fikir eksikliği değil, tempo bilmemek. Çoğu öğrenci cue card'ı bir dakikada bitirip susar. Aşağıdaki dağılım iki dakikayı tam doldurur."}, {"t": "table", "head": ["Zaman", "Ne yapıyorsun", "Kaç cümle"], "rows": [["0:00 - 0:15", "Giriş. I would like to talk about... Konuyu tanıt.", "1 cümle"], ["0:15 - 0:40", "Madde 1. Bir bilgi, bir detay.", "2 cümle"], ["0:40 - 1:05", "Madde 2. Aynı tempo.", "2 cümle"], ["1:05 - 1:30", "Madde 3. Burada bir örnek ver.", "2-3 cümle"], ["1:30 - 2:00", "Son madde. Genelde and explain why ile başlar. En uzun bölüm. Duygu ve değerlendirme ekle.", "3-4 cümle"]]}, {"t": "note", "k": "ipucu", "title": "Üç kural", "lines": ["Son madde en uzun olandır. and explain why ile başlayan madde en çok puan getirir, çünkü gerekçe ister.", "Erken bitirirsen sınav görevlisi durdurmaz, sen susarsın. Sessizlik Fluency puanını düşürür.", "Zamanın dolarsa cümleni yarım bırakma. Bitirmeye çalış."]}]}, {"id": "k1", "group": "12 Kayıt", "name": "Kayıt 1. Isınma (Part 1)", "eyebrow": "Kayıt 1", "blocks": [{"t": "table", "rows": [["Part", "Part 1"], ["Süre", "3-4 dakika"], ["Teslim", "Ders 4"], ["Odak", "Uzunluk. Kalite değil."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Hiçbir cevap tek cümle olmayacak. Her cevap en az üç cümle: cevap, sebep, örnek.", "ÖLÇÜT. Öğretmen buna bakacak: Uzunluk."]}, {"t": "qlist", "groups": [{"h": "Work or Study", "items": ["Do you work or are you a student?", "What subject do you study?", "Why did you choose it?", "What do you find most difficult about it?"]}, {"h": "Hometown", "items": ["Where is your hometown?", "What do you like about it?", "Has it changed in recent years?", "Would you like to live there in the future?"]}, {"h": "Free Time", "items": ["What do you do in your free time?", "Do you prefer indoor or outdoor activities?", "Do you have enough free time?", "What did you do last weekend?"]}]}, {"t": "recorder"}]}, {"id": "k2", "group": "12 Kayıt", "name": "Kayıt 2. Cue card. A place", "eyebrow": "Kayıt 2", "blocks": [{"t": "table", "rows": [["Part", "Part 2"], ["Süre", "1 dk hazırlık, 2 dk konuşma"], ["Teslim", "Ders 4"], ["Odak", "İki dakikayı doldurmak."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. İki dakika dolacak. Kayıt erken bitiyorsa görev tamamlanmamış sayılır.", "ÖLÇÜT. Öğretmen buna bakacak: İki dakikayı doldurmak."]}, {"t": "cue", "title": "Describe a place you like to visit.", "points": ["where it is", "how often you go there", "what you do there", "and explain why you like it"]}, {"t": "plan", "fields": ["Where it is", "How often", "What you do", "Why you like it"]}, {"t": "recorder"}]}, {"id": "k3", "group": "12 Kayıt", "name": "Kayıt 3. Tekrar (Part 1)", "eyebrow": "Kayıt 3", "blocks": [{"t": "table", "rows": [["Part", "Part 1"], ["Süre", "3-4 dakika"], ["Teslim", "Ders 6 öncesi"], ["Odak", "Kendi kaydını dinleyip düzeltmek."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Önce Kayıt 1'i baştan sona dinle. Üç sorunu yaz. Sonra aynı soruları yeniden cevapla.", "ÖLÇÜT. Öğretmen buna bakacak: Kendi kaydını dinleyip düzeltmek."]}, {"t": "note", "k": "protokol", "title": "Bu kayıtta yapacağın şey", "lines": ["Önce Kayıt 1'i baştan sona dinle. Bir kere.", "Duyduğun üç sorunu yaz.", "Sonra aynı soruları (Kayıt 1 sayfasında) yeniden cevapla."]}, {"t": "plan", "fields": ["Sorun 1", "Sorun 2", "Sorun 3", "Bu sefer farklı yapacağım"]}, {"t": "recorder"}]}, {"id": "k4", "group" , "Who cooks in your family?", "Has your diet changed in recent years?"]}, {"h": "Weather", "items": ["What is the weather like in your city?", "Which season do you prefer?", "Does the weather affect your mood?", "Do you check the forecast?"]}, {"h": "Technology", "items": ["How often do you use your phone?", "What apps do you use most?", "Do you think people spend too much time online?", "How has technology changed studying?"]}]}, {"t": "recorder"}]}, {"id": "k7", "group": "12 Kayıt", "name": "Kayıt 7. Cue card. A skill", "eyebrow": "Kayıt 7", "blocks": [{"t": "table", "rows": [["Part", "Part 2"], ["Süre", "1 dk hazırlık, 2 dk konuşma"], ["Teslim", "Ders 11"], ["Odak", "Would, could, if kalıpları."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Gelecek ve koşul yapıları doğru kullanılacak.", "ÖLÇÜT. Öğretmen buna bakacak: Would, could, if kalıpları."]}, {"t": "cue", "title": "Describe a skill you would like to learn.", "points": ["what the skill is", "why you want to learn it", "how you would learn it", "and explain how it would change your life"]}, {"t": "plan", "fields": ["What skill", "Why", "How you would learn it", "How it would change your life"]}, {"t": "recorder"}]}, {"id": "k8", "group": "12 Kayıt", "name": "Kayıt 8. Tech ve Environment (Part 3)", "eyebrow": "Kayıt 8", "blocks": [{"t": "table", "rows": [["Part", "Part 3"], ["Süre", "4-5 dakika"], ["Teslim", "Ders 13 öncesi"], ["Odak", "Soyut soruya somut örnek."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Genel geçer cümleyle geçiştirme yok. Her cevapta bir örnek olacak.", "ÖLÇÜT. Öğretmen buna bakacak: Soyut soruya somut örnek."]}, {"t": "qlist", "groups": [{"h": "Technology", "items": ["Does technology make people less social?", "Should schools ban mobile phones?"]}, {"h": "Environment", "items": ["Whose responsibility is it to protect the environment, governments or individuals?", "Is public transport the answer to pollution?"]}]}, {"t": "recorder"}]}, {"id": "k9", "group": "12 Kayıt", "name": "Kayıt 9. Cue card. Busy time", "eyebrow": "Kayıt 9", "blocks": [{"t": "table", "rows": [["Part", "Part 2"], ["Süre", "1 dk hazırlık, 2 dk konuşma"], ["Teslim", "Ders 13 öncesi"], ["Odak", "Zaman kipi tutarlılığı."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Bütün anlatı geçmişte. Bir de duygu ve değerlendirme cümlesi ekle.", "ÖLÇÜT. Öğretmen buna bakacak: Zaman kipi tutarlılığı."]}, {"t": "cue", "title": "Describe a time when you were very busy.", "points": ["when it was", "what you had to do", "how you managed it", "and explain how you felt afterwards"]}, {"t": "plan", "fields": ["When", "What you had to do", "How you managed", "How you felt afterwards"]}, {"t": "recorder"}]}, {"id": "k10", "group": "12 Kayıt", "name": "Kayıt 10. Karışık (Part 1 + 3)", "eyebrow": "Kayıt 10", "blocks": [{"t": "table", "rows": [["Part", "Part 1 ve Part 3"], ["Süre", "6-7 dakika"], ["Teslim", "Ders 15 öncesi"], ["Odak", "Part 1'den Part 3'e geçerken tonu değiştirmek."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Part 1 kısa ve doğal. Part 3 uzun ve gerekçeli. Fark duyulacak.", "ÖLÇÜT. Öğretmen buna bakacak: Part 1'den Part 3'e geçerken tonu değiştirmek."]}, {"t": "qlist", "groups": [{"h": "Part 1", "items": ["Do you like travelling?", "Where did you go on your last trip?", "Do you prefer travelling alone or with others?", "Where would you like to go next?"]}, {"h": "Part 3", "items": ["Is a high salary the most important thing in a job?", "Should people change careers during their lives?", "Do young people today have more opportunities than their parents?"]}]}, {"t": "recorder"}]}, {"id": "k11", "group": "12 Kayıt", "name": "Kayıt 11. Cue card. Book or film", "eyebrow": "Kayıt 11", "blocks": [{"t": "table", "rows": [["Part", "Part 2"], ["Süre", "1 dk hazırlık, 2 dk konuşma"], ["Teslim", "Ders 15 öncesi"], ["Odak", "Sıfat çeşitliliği."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. good, nice, interesting kelimeleri yasak. Yerine kesin sıfatlar kullan.", "ÖLÇÜT. Öğretmen buna bakacak: Sıfat çeşitliliği."]}, {"t": "cue", "title": "Describe a book or a film you enjoyed.", "points": ["what it was", "when you read or watched it", "what it was about", "and explain why you enjoyed it"]}, {"t": "plan", "fields": ["What it was", "When", "What it was about", "Why you enjoyed it"]}, {"t": "recorder"}]}, {"id": "k12", "group": "12 Kayıt", "name": "Kayıt 12. Full Mock", "eyebrow": "Kayıt 12", "blocks": [{"t": "table", "rows": [["Part", "Tam sınav"], ["Süre", "11-14 dakika"], ["Teslim", "Ders 15, sınıfta"], ["Odak", "Sınav koşulu."]]}, {"t": "note", "k": "hedef", "title": "Bu kayıtta", "lines": ["HEDEF. Öğretmen sınav görevlisi rolünde. Kayıt tek parça, durdurulmaz.", "ÖLÇÜT. Öğretmen buna bakacak: Sınav koşulu."]}, {"t": "note", "k": "protokol", "title": "Tam sınav simülasyonu", "lines": ["Öğretmen sınav görevlisi rolünde. Sorular önceden verilmez.", "Part 1: dört dakika. Part 2: bir dakika hazırlık, iki dakika konuşma, bir soru. Part 3: beş dakika.", "Kayıt tek parça alınır, durdurulmaz. Hata yapsan bile devam et."]}, {"t": "note", "k": "ipucu", "title": "Band 5.5 ölçütü", "lines": ["Cevaplar uzayabiliyor, temel zaman kipleri doğru, konuşma anlaşılır, uzun duraklamalar sınırlı."]}, {"t": "recorder"}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "p", "x": "Kayıt öncesi ve sırasında aklında tutacağın yüksek getirili kurallar."}, {"t": "note", "k": "ipucu", "title": "Ton ve tempo", "lines": ["Part 1 kısa ve doğal: cevap, sebep, örnek. Part 3 uzun ve gerekçeli: görüş, karşı baskı, gerekçe. Fark duyulmalı.", "Cue card'da iki dakikayı doldur. Erken susma. Son madde en uzun olsun, and explain why en çok puan getirir."]}, {"t": "note", "k": "dikkat", "title": "Yaygın hatalar", "lines": ["I don't know demek yasak. Emin olmasan da bir görüş üret ve gerekçelendir.", "good, nice, interesting yerine kesin sıfat kullan.", "Sessizlik Fluency puanını düşürür. Boşlukta susma, düşünürken sesli bağlaç kullan (well, let me think, actually)."]}, {"t": "note", "k": "protokol", "title": "En önemli adım", "lines": ["Her kayıttan sonra kendi kaydını baştan sona dinle. Hatanı konuşurken değil dinlerken duyarsın.", "Duyduğun üç sorunu yaz, bir sonraki kayıtta onlara odaklan."]}]}, {"id": "ornek1", "group": "Örnekler", "name": "Örnek Cevaplar: Part 1", "eyebrow": "Örnekler", "blocks": [{"t": "p", "x": "Band 7 seviyesinde örnek cevaplar. Ezberleme, kalıbı gör: cevap, sebep, örnek. Hiçbiri tek cümle değil."}, {"t": "given", "title": "Do you work or are you a student?", "x": "I'm a student at the moment. I'm in my final year of high school, preparing for the university entrance exams, so most of my week is taken up with studying. I do try to keep some time free for football at the weekend, though."}, {"t": "given", "title": "What do you do in your free time?", "x": "When I actually get some free time, I usually either play video games with friends online or go out for a walk to clear my head. Lately I've also been getting into cooking, which I never expected to enjoy as much as I do."}, {"t": "given", "title": "Has your hometown changed in recent years?", "x": "Yes, quite a lot, actually. A number of new cafes and shops have opened near the centre, which has made it feel livelier. On the other hand, some of the older buildings I grew up with have been knocked down, and I do miss those."}, {"t": "note", "k": "ipucu", "title": "Neden puan getiriyor", "lines": ["Her cevapta bir gerekçe ve bir somut detay var. take up, get into, clear my head gibi collocation kullanılmış. Tek kelimelik veya tek cümlelik cevap yok."]}]}, {"id": "ornek2", "group": "Örnekler", "name": "Örnek Cevap: Part 2", "eyebrow": "Örnekler", "blocks": [{"t": "cue", "title": "Describe a place you like to visit.", "points": ["where it is", "how often you go there", "what you do there", "and explain why you like it"]}, {"t": "given", "title": "Band 7 örnek (yaklaşık 2 dakika)", "x": "I'd like to talk about a small seaside town called Ayvalik, on the west coast of Turkey. I go there maybe once or twice a year, usually in the summer with my family. When I'm there, I spend most of my time swimming, wandering through the narrow old streets and, I have to admit, eating far too much seafood. The reason I like it so much is that it feels completely cut off from my normal routine. Back home everything is fast and noisy, but in Ayvalik the pace slows right down. After a few days there I always come back feeling genuinely rested, and I think that is why I keep going back year after year."}, {"t": "note", "k": "ipucu", "title": "Neden iki dakikayı dolduruyor", "lines": ["Dört maddenin hepsi cevaplanmış. Son madde (why) en uzun bölüm ve gerçek bir gerekçe içeriyor.", "cut off from my routine, the pace slows right down gibi ifadeler puanı yükseltir. Anlatı tutarlı bir zaman kipinde kalıyor."]}]}, {"id": "ornek3", "group": "Örnekler", "name": "Örnek Cevaplar: Part 3", "eyebrow": "Örnekler", "blocks": [{"t": "p", "x": "Part 3 kalıbı: görüş, karşı baskı, kendi gerekçen. Cevaplar Part 1'den daha uzun ve daha gerekçeli."}, {"t": "given", "title": "Should students choose their own subjects at school?", "x": "To some extent, yes, although I don't think it should be completely unrestricted. Giving students a degree of choice tends to increase motivation, because people naturally work harder at things they find interesting. That said, teenagers don't always know what will be useful to them later on, so I think the ideal is a system where they choose within sensible limits rather than being handed total freedom."}, {"t": "given", "title": "Is a high salary the most important thing in a job?", "x": "It's certainly important, but I wouldn't say it's the most important thing for everyone. A good salary gives you security and options, which obviously matters. However, I know people who earn a lot and are miserable because the work itself is meaningless to them. Personally, I'd rather have a slightly lower salary and a job I actually look forward to."}, {"t": "note", "k": "ipucu", "title": "Neden puan getiriyor", "lines": ["Her cevap üç hamle yapıyor: görüş, karşı görüşün kabulü (that said, however), kendi gerekçesi.", "to some extent, I wouldn't say, personally gibi ifadeler görüşü esnetip olgunlaştırır. I don't know yok."]}]}, {"id": "ozdeg", "group": "Örnekler", "name": "Öz-değerlendirme", "eyebrow": "Örnekler", "blocks": [{"t": "p", "x": "Her kayıttan sonra kendi sesini dinlerken bu listeyi işaretle. İşaretlenmeyen madde bir sonraki kaydın hedefidir."}, {"t": "checklist", "title": "Kaydını dinlerken", "items": ["Her cevap en az üç cümleydi.", "Aynı dolgu kelimesini (like, you know) çok tekrar etmedim.", "good, nice, interesting gibi kelimeleri tekrar tekrar kullanmadım.", "Uzun ve rahatsız edici duraklama yoktu.", "Fiil zamanları tutarlıydı.", "Part 2'de iki dakikayı doldurdum.", "Hiçbir cümlemi yarım bırakmadım.", "En az bir gerekçe ve bir örnek verdim."]}]}, {"id": "tema", "group": "Örnekler", "name": "Tema Kelimeleri", "eyebrow": "Örnekler", "blocks": [{"t": "p", "x": "Sık çıkan Part 1 ve Part 3 temaları için kelime ve collocation. Kendi cümlende kullan."}, {"t": "table", "head": ["Tema", "Kullanışlı ifadeler"], "rows": [["Work and study", "take up a subject, a demanding course, juggle work and study, a rewarding career, hands-on experience"], ["Hometown", "a close-knit community, the outskirts, a bustling city centre, laid-back, well connected"], ["Free time", "unwind, recharge, a change of scene, get into a hobby, catch up with friends"], ["Technology", "stay connected, screen time, cut down on my phone, keep up with the news, a double-edged sword"], ["Travel", "get away from it all, off the beaten track, soak up the atmosphere, a once-in-a-lifetime trip"], ["Environment", "cut down on waste, do your bit, a throwaway culture, raise awareness, small changes add up"]]}, {"t": "note", "k": "ipucu", "title": "Kural", "lines": ["İfadeyi ezberleme, bir cümleye yerleştir ve yüksek sesle söyle. Ancak kullandığında senin olur."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">5 token</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).sort().map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

<style>
/* soru yer imi */
.mcq[data-slug],.qz[data-slug],[data-bm-slug]{position:relative}
.gribm{position:absolute;top:12px;right:2px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;z-index:2}
.gribm:hover{background:rgba(46,110,106,.12)}
.gribm:disabled{opacity:.5;cursor:default}
.gribm svg{width:17px;height:17px;fill:none;stroke:#8a8f9c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,fill .15s}
.gribm.on svg{fill:#2E6E6A;stroke:#2E6E6A}
.mcq[data-slug] .mstem,.qz[data-slug] .qzq{padding-right:40px}
.q[data-bm-slug] .ql{padding-right:40px}
.st-q[data-bm-slug] .gribm{top:.7rem;right:.7rem}
</style>
<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
