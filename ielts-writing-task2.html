[["Opinion. To what extent","Kendi görüşünün ilk gerekçesi","İkinci gerekçe veya karşı görüşün kabulü","Girişte ve sonuçta"],["Discussion. Both views","Birinci görüş","İkinci görüş","Sonuçta, girişte sezdirilmeli"],["Advantages, Disadvantages","Avantajlar","Dezavantajlar","Sonuçta, tartı kurulmalı"],["Problem and Solution","Sebepler","Çözümler, her çözüm bir sebebe cevap","Pozisyon gerekmez"],["Two-part question","Birinci soru","İkinci soru","İkinci soruda, ikisi de cevaplanmalı"]],"head":["Soru tipi","Body 1","Body 2","Pozisyon nerede"]}]},{"eyebrow":"Task 2","id":"t2-mantik","name":"Paragraf İçi Mantık","group":"Öğren","blocks":[{"t":"p","x":"Her body paragrafı dört adımdan oluşur. İddia. Gerekçe. Örnek. Sonuç."},{"t":"table","head":["Adım","Örnek"],"rows":[["İDDİA","Practical skills deserve a place in the curriculum."],["GEREKÇE","Many young people leave school without knowing how to manage money."],["ÖRNEK","In my country, many first-year university students fall into debt."],["SONUÇ","A single term of financial education could prevent this."]]},{"k":"dikkat","lines":["Neredeyse her zaman ÖRNEK ve SONUÇ eksik kalır. Öğrenci iddia ve gerekçe yazıp durur, paragraf yüzeysel kalır.","Kural: her body paragrafında en az bir örnek. Örnek yoksa paragraf bitmemiştir."],"t":"note","title":"En çok atlanan adım"}]},{"blocks":[{"x":"Tema bazlı fikir ve kelime. Kopyalama, kendi cümlene çevir.","t":"p"},{"rows":[["Education","critical thinking, rote learning, well-rounded, tuition fees, vocational training, academic pressure"],["Technology","automation, screen time, digital literacy, misinformation, dependence on devices"],["Environment","carbon emissions, renewable energy, single-use plastic, conservation, sustainable"],["Health","sedentary lifestyle, preventive care, mental wellbeing, processed food, work-life balance"],["Work","job security, remote working, skills gap, productivity, burnout, the gig economy"],["Crime and society","deterrent, rehabilitation, root causes, surveillance, social inequality"]],"head":["Tema","Kullanışlı kelime ve ifadeler"],"t":"table"},{"t":"table","head":["İşlev","Bağlayıcı ifadeler"],"rows":[["Görüş","In my view, It seems to me that, I would argue that"],["Karşıt görüş","Admittedly, It is true that, Critics might argue"],["Gerekçe","This is largely because, The main reason is that"],["Örnek","For instance, A clear example of this is"],["Sonuç","Consequently, As a result, This means that"],["Kapanış","On balance, Taking everything into account, In conclusion"]]}],"eyebrow":"Task 2","name":"Fikir ve Kelime Bankası","id":"t2-bank","group":"Öğren"},{"eyebrow":"Task 2 . Yaz","name":"Görev 1. Opinion","id":"t2-g1","group":"Görevler","blocks":[{"lines":["Some people believe that schools should teach practical skills such as cooking and money management instead of academic subjects like history. To what extent do you agree or disagree? Write at least 250 words."],"t":"task","title":"Task 2"},{"lines":["Bütçe bilmeyen genç borca giriyor. Üniversite öğrencileri ilk yılında kredi kartı borcuna giriyor.","Pratik beceriler evrensel. Herkes yemek ve para harcamak zorunda.","Okul hayata hazırlamalı."],"t":"note","k":"ipucu","title":"Bir taraf"},{"k":"ipucu","t":"note","lines":["Akademik dersler düşünme biçimi kazandırır. Tarih kanıt değerlendirmeyi öğretir.","Pratik beceri sonradan öğrenilir, düşünme biçimi öğrenilemez.","İşverenler zaten analiz becerisi arıyor."],"title":"Diğer taraf"},{"title":"Pozisyon önerisi","k":"dikkat","t":"note","lines":["En güçlü pozisyon: pratik beceriler eklenmeli ama akademik derslerin yerine değil. instead of değil, alongside."]},{"prompt":null,"model":{"x":"It is sometimes argued that schools should replace academic subjects such as history with practical skills like cooking and managing money. While I accept that practical skills deserve more attention, I do not believe they should be taught instead of academic ones.\n\nThere is a strong case for practical instruction. Many young people leave school unable to perform basic tasks that adult life demands, from budgeting to preparing a simple meal. In my own country, a large number of first-year university students fall into debt within months, largely because no one has explained to them how interest works. A single term of financial literacy could prevent a great deal of later hardship.\n\nNevertheless, abandoning academic subjects would be a serious mistake. Subjects such as history train the mind to weigh evidence, compare conflicting accounts and think critically. These habits cannot easily be acquired later, whereas a skill such as cooking can be picked up in a weekend. Employers, moreover, increasingly value exactly the analytical abilities that academic study develops.\n\nThe sensible solution is not to choose between the two but to combine them. Schools should make room for practical instruction alongside traditional subjects, not in place of them. An education that produces young people who can both think critically and manage their own affairs is far stronger than one that sacrifices the first for the second.","title":"Model cevap (Band 7)"},"t":"wizard","plan":["Pozisyon","Body 1. İddia, gerekçe, örnek","Body 2. İddia, gerekçe, örnek","Sonuç"],"check":["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.","Pozisyonum giriş paragrafında net.","Pozisyonum sonuna kadar değişmedi.","Her body paragrafının tek bir ana fikri var.","Her ana fikirde gerekçe var.","Her body paragrafında en az bir örnek var.","İki tam cümleyi virgülle birleştirmedim.","However ve therefore öncesine nokta koydum.","Sonuç paragrafı özet değil, yargı.","En az 250 kelime yazdım."],"target":250}]},{"group":"Görevler","id":"t2-g2","name":"Görev 2. Discussion","eyebrow":"Task 2 . Yaz","blocks":[{"title":"Task 2","lines":["Some people think students should study subjects they enjoy, while others believe they should study subjects useful for future employment. Discuss both views and give your own opinion. Write at least 250 words."],"t":"task"},{"lines":["Sevdiğin dersi okumak motivasyon getirir, öğrenci zorlanınca bırakmaz.","Kariyer için seçilen bölümlerde bırakma oranı yüksek.","İlgi zaten pratik bir varlıktır."],"t":"note","k":"ipucu","title":"Bir taraf"},{"lines":["Eğitim pahalıdır, hobi gibi görülemez.","İstihdam edilemeyen diploma güvensizlik yaratır.","Düşük gelirli için bu bir hayatta kalma meselesi."],"t":"note","k":"ipucu","title":"Diğer taraf"},{"t":"note","lines":["En güçlü pozisyon: bu yanlış bir ikilem. İlgi ile fayda kesişir, kesişimi ara."],"k":"dikkat","title":"Pozisyon önerisi"},{"model":{"title":"Model cevap (Band 7)","x":"People disagree about whether students should choose subjects they find enjoyable or ones likely to lead to a secure job. Both positions have merit, and I will argue that the two are less opposed than they first appear.\n\nThose who favour an enjoyable subject point to motivation. A student who is genuinely interested will read beyond the syllabus and is far less likely to abandon the course. Dropout rates are often highest among students who chose a field purely for its career prospects and then lost heart, and an unfinished degree serves no one.\n\nOn the other hand, education is expensive, and for many families it cannot be treated as a hobby. A graduate whose qualification is not valued by employers may spend years in insecure work, and for students from low-income backgrounds this is a matter of survival rather than an abstract risk.\n\nIn my view, this is a false choice. Interest and usefulness frequently overlap, and the wisest approach is to look for that overlap first. A student fascinated by biology can train as a doctor; one who loves writing can enter journalism or law. Where no overlap exists, practical considerations should probably take priority, since a degree that leads nowhere benefits neither the student nor society."},"prompt":null,"t":"wizard","check":["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.","Pozisyonum giriş paragrafında net.","Pozisyonum sonuna kadar değişmedi.","Her body paragrafının tek bir ana fikri var.","Her ana fikirde gerekçe var.","Her body paragrafında en az bir örnek var.","İki tam cümleyi virgülle birleştirmedim.","However ve therefore öncesine nokta koydum.","Sonuç paragrafı özet değil, yargı.","En az 250 kelime yazdım."],"target":250,"plan":["Pozisyon","Body 1. İddia, gerekçe, örnek","Body 2. İddia, gerekçe, örnek","Sonuç"]}]},{"group":"Görevler","eyebrow":"Task 2 . Yaz","id":"t2-g3","name":"Görev 3. Advantages / Disadvantages","blocks":[{"title":"Task 2","lines":["More and more people are working from home rather than in an office. Do the advantages of this development outweigh the disadvantages? Write at least 250 words."],"t":"task"},{"title":"Avantajlar","k":"ipucu","lines":["Yol süresi kazanılır, o süre spora veya uykuya gider.","Esneklik, özellikle ebeveynler için.","Şirket maliyeti düşer, geniş havuzdan işe alım."],"t":"note"},{"k":"ipucu","lines":["İzolasyon, aidiyet kaybı.","İş-ev sınırı kayboluyor.","Genç çalışan deneyimliyi izleyerek öğrenemiyor."],"t":"note","title":"Dezavantajlar"},{"lines":["En güçlü pozisyon: avantajlar ağır basar, çünkü dezavantajlar yönetilebilir (hibrit model), avantajlar yapısaldır."],"t":"note","k":"dikkat","title":"Pozisyon önerisi"},{"model":{"x":"An increasing number of people now work from home rather than commuting to an office. In my opinion, although this shift brings real drawbacks, its advantages clearly outweigh them.\n\nThe benefits are considerable. The most obvious is the time saved. A worker in a city such as Istanbul may spend two hours a day travelling, and reclaiming those hours for exercise, family or rest improves both health and morale. Home working also offers flexibility that particularly helps parents, while employers who save on office space can recruit from a far wider pool of talent.\n\nThe disadvantages, however, are genuine. Employees who rarely see their colleagues can feel isolated, and the boundary between work and home tends to dissolve when the laptop is always on the kitchen table. Younger employees may suffer most, since much of a profession is learned by watching experienced colleagues.\n\nYet these problems can largely be managed. A hybrid model restores social contact, and clear rules about working hours protect personal time. The core advantages, by contrast, are structural and do not disappear. On balance, therefore, the move towards home working is a positive development, provided that companies take deliberate steps to soften its weaknesses.","title":"Model cevap (Band 7)"},"prompt":null,"check":["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.","Pozisyonum giriş paragrafında net.","Pozisyonum sonuna kadar değişmedi.","Her body paragrafının tek bir ana fikri var.","Her ana fikirde gerekçe var.","Her body paragrafında en az bir örnek var.","İki tam cümleyi virgülle birleştirmedim.","However ve therefore öncesine nokta koydum.","Sonuç paragrafı özet değil, yargı.","En az 250 kelime yazdım."],"target":250,"plan":["Pozisyon","Body 1. İddia, gerekçe, örnek","Body 2. İddia, gerekçe, örnek","Sonuç"],"t":"wizard"}]},{"blocks":[{"title":"Task 2","t":"task","lines":["Traffic congestion is becoming a serious problem in many large cities. What are the main causes of this problem and what measures could be taken to solve it? Write at least 250 words."]},{"lines":["Sebep: özel araç sahipliği artıyor.","Sebep: toplu taşıma yetersiz.","Sebep: şehir planlaması dağıtık."],"t":"note","k":"ipucu","title":"Sebepler"},{"k":"ipucu","lines":["Çözüm: raylı sisteme yatırım.","Çözüm: tıkanma ücreti, ama önce alternatif olmalı.","Çözüm: karma kullanımlı planlama."],"t":"note","title":"Çözümler"},{"lines":["Bu soruda pozisyon değil eşleşme gerekir. Her çözüm bir sebebe cevap versin."],"t":"note","k":"dikkat","title":"Pozisyon önerisi"},{"t":"wizard","plan":["Pozisyon","Body 1. İddia, gerekçe, örnek","Body 2. İddia, gerekçe, örnek","Sonuç"],"target":250,"check":["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.","Pozisyonum giriş paragrafında net.","Pozisyonum sonuna kadar değişmedi.","Her body paragrafının tek bir ana fikri var.","Her ana fikirde gerekçe var.","Her body paragrafında en az bir örnek var.","İki tam cümleyi virgülle birleştirmedim.","However ve therefore öncesine nokta koydum.","Sonuç paragrafı özet değil, yargı.","En az 250 kelime yazdım."],"prompt":null,"model":{"title":"Model cevap (Band 7)","x":"Traffic congestion has become a serious problem in many large cities. This essay will examine its principal causes and suggest measures that could realistically address them.\n\nThe first cause is the steady rise in private car ownership. As incomes grow, a car becomes both affordable and desirable, yet the roads of most cities were designed for a far smaller population. A second cause is the inadequacy of public transport: in many cities the metro and bus networks do not reach outer districts, leaving residents with no genuine alternative to driving. Finally, dispersed planning means that homes, workplaces and schools are located far apart, making long daily journeys unavoidable.\n\nEach cause points towards a solution. The most effective response to rising car use is heavy investment in rail-based transport, which moves large numbers of people without adding vehicles to the road. Where a reliable network already exists, a congestion charge can discourage unnecessary driving, as London has shown. Dispersed planning can be tackled through mixed-use development, which places housing and workplaces close together so that the need to travel is reduced rather than shifted.\n\nThe key is to match each solution to a cause rather than relying on a single measure. Congestion is the product of several overlapping pressures, and only a combination of better public transport, sensible pricing and smarter planning is likely to relieve it."}}],"group":"Görevler","name":"Görev 4. Problem / Solution","id":"t2-g4","eyebrow":"Task 2 . Yaz"},{"group":"Görevler","name":"Görev 5. Two-part Question","id":"t2-g5","eyebrow":"Task 2 . Yaz","blocks":[{"title":"Task 2","lines":["Nowadays many people choose to work for themselves rather than for a company. Why might this be the case? Is this a positive or negative development? Write at least 250 words."],"t":"task"},{"title":"Neden","t":"note","lines":["Neden: esneklik, kendi patronun olmak.","Neden: teknoloji uzaktan çalışmayı kolaylaştırdı.","Neden: kurumsal hayattan memnuniyetsizlik."],"k":"ipucu"},{"lines":["Pozitif: özerklik, gelir potansiyeli, motivasyon.","Negatif: iş güvencesi yok, izin ve emeklilik yok, yalnızlık.","Yönetilebilir: planlama ile riskler azaltılır."],"t":"note","k":"ipucu","title":"Pozitif mi negatif mi"},{"title":"Pozisyon önerisi","lines":["İki soruyu da ayrı cevapla. Body 1 nedenleri, body 2 pozitif mi negatif mi ve senin görüşünü verir. İkincisinde pozisyonunu net söyle."],"t":"note","k":"dikkat"},{"prompt":null,"model":{"x":"It is becoming increasingly common for people to work for themselves instead of being employed by a company. This essay will consider why this is happening and argue that, on balance, it is a positive development.\n\nThere are several reasons behind the rise of self-employment. The most important is the flexibility it offers, since a freelancer can choose when and where to work, which is especially valuable for parents or people with other commitments. Technology has also made it far easier: a person with a laptop and an internet connection can now find clients, manage payments and deliver work from home. Finally, dissatisfaction with rigid corporate life pushes many talented people to seek greater independence.\n\nWhether this trend is positive or negative depends partly on the individual, but I believe its benefits outweigh its drawbacks. Self-employment gives people autonomy and a direct stake in their own success, which is often more motivating than a fixed salary, and it can lead to higher earnings for those who are disciplined. Admittedly, freelancers lack the security of a steady income, paid holidays and pensions, and some find working alone isolating. However, these problems can be managed with careful planning.\n\nIn conclusion, people increasingly choose self-employment because of the flexibility and independence it provides, and while it carries genuine risks, I regard it as a largely positive development for those who are prepared for it.","title":"Model cevap (Band 7)"},"plan":["Pozisyon","Body 1. İddia, gerekçe, örnek","Body 2. İddia, gerekçe, örnek","Sonuç"],"target":250,"check":["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.","Pozisyonum giriş paragrafında net.","Pozisyonum sonuna kadar değişmedi.","Her body paragrafının tek bir ana fikri var.","Her ana fikirde gerekçe var.","Her body paragrafında en az bir örnek var.","İki tam cümleyi virgülle birleştirmedim.","However ve therefore öncesine nokta koydum.","Sonuç paragrafı özet değil, yargı.","En az 250 kelime yazdım."],"t":"wizard"}]},{"id":"t2-grammar","name":"Band 7+ Dilbilgisi Aralığı","blocks":[{"x":"Grammatical Range and Accuracy kriterinde Band 6'da takılmanın ana sebebi hep aynı basit cümle yapısını kullanmaktır. Band 7+ için 'çeşitli karmaşık yapıları' hatasız kullandığını göstermelisin. Aşağıdaki yapılardan her denemeye en az üç-dört tanesini bilinçli serpiştir.","t":"p"},{"rows":[["Relative clause","Students who study abroad often gain independence."],["Conditional (2/3)","If governments invested more, pollution would fall."],["Concession (although/while)","Although costly, the policy benefits everyone."],["Cleft sentence","It is education that drives long-term growth."],["Participle clause","Faced with rising costs, many families cut spending."],["Inversion (formal)","Not only does it save money, but it also saves time."]],"head":["Yapı","Örnek"],"t":"table"},{"title":"Doğruluk > gösteriş","k":"ipucu","t":"note","lines":["Karmaşık ama hatalı cümle, basit ama doğru cümleden daha az puan getirir.","Bir yapıyı emin değilsen kullanma; bildiğin yapıları çeşitlendir.","Her paragrafta cümle uzunluğunu değiştir: kısa vurucu + uzun açıklayıcı."]},{"title":"En sık 3 hata","k":"dikkat","lines":["Özne-yüklem uyumu: 'The number of cars have risen' → 'has risen'.","Sayılamayan isimler: 'informations', 'advices' YANLIŞ.","Artikel: 'Society' genel anlamda artikelsiz; 'the government of X' belirli."],"t":"note"}]},{"blocks":[{"x":"Lexical Resource yalnızca 'zor kelime' demek değildir; doğru yerde, doğru eşdizimle (collocation) ve tekrara düşmeden kelime kullanmaktır. Ezberlenmiş süslü kelimeleri yanlış bağlamda kullanmak puanı düşürür.","t":"p"},{"t":"table","rows":[["very big problem","a pressing / serious issue"],["a lot of people think","many argue that / it is widely held"],["good for the economy","boosts economic growth"],["bad effect on health","detrimental to health"],["get better","improve significantly"],["important","crucial / vital / essential (bağlama göre)"]],"head":["Zayıf (tekrarlı)","Band 7+ (kesin/eşdizim)"]},{"title":"Paraphrase disiplini","t":"note","lines":["Girişte soruyu kendi kelimelerinle yeniden yaz; aynı kelimeleri kopyalama.","Aynı anahtar kelimeyi bir paragrafta ikiden fazla tekrar etme; eş anlamlı kullan.","Konu bazlı kelime kümesi kur: eğitim, çevre, teknoloji, sağlık için 8-10 kelime."],"k":"ipucu"},{"k":"dikkat","t":"note","lines":["'make a research' YANLIŞ → 'do/conduct research'.","'strong rain' YANLIŞ → 'heavy rain'. Kelimeyi arkadaşlarıyla öğren.","Sözlükten çektiğin kelimeyi bir örnek cümlede görmeden kullanma."],"title":"Eşdizim tuzağı"}],"name":"Band 7+ Kelime Zenginliği","id":"t2-lexis"},{"blocks":[{"title":"Task 2","t":"note","lines":["Pozisyonun girişte net olsun ve sonuna kadar değişmesin.","Her body paragrafında en az bir örnek. Örnek yoksa paragraf bitmemiştir.","İki tam cümleyi virgülle birleştirme. However ve therefore öncesine nokta koy.","Two-part soruda iki soru da cevaplanmalı, biri unutulursa Task Response düşer."],"k":"dikkat"},{"title":"Zaman","t":"note","lines":["40 dakika, en az 250 kelime. Beş dakika planla, otuz dakika yaz, beş dakika kontrol et."],"k":"ipucu"}],"name":"İpuçları ve Tuzaklar","id":"ipucu","eyebrow":"İpuçları","group":"İpuçları"}],"badge":"IELTS"}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u" lang="en">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');

      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');

      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');

    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });

async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body></html>
