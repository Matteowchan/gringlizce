ma abartıyla değil, çekici sunulan gerçek faydalarla.","t":"p"},{"x":"Broşürün pratik işlevini asla unutma: okurun bir sonraki adımı atabilmesi için ne, ne zaman, nerede ve nasıl bilgilerini net vermelisin. En çekici broşür bile, okur nasıl katılacağını bilmiyorsa amacına ulaşamaz. Bu yüzden sona yakın bir yerde tarih, yer, iletişim ve kayıt yöntemini açıkça belirt ve güçlü bir harekete geçirici çağrıyla bağla: 'Sign up at the student center by Friday, June 3.' Bu netlik, broşürü bir bilgi metninden bir eylem aracına dönüştürür ve türün amacını tamamlar.","t":"p"},{"t":"h","x":"Broşürde Dil Ekonomisi ve Değerlendirici Gözü"},{"x":"Broşür kısa bir türdür, bu yüzden dil ekonomisi ustalık ister: az kelimeyle çok şey söylemek. Her cümle bir işe yaramalı, boş dolgu içermemelidir. Bu kısıt aslında Criterion A için bir fırsattır; çünkü kısa alanda çeşitli ve etkili yapılar kurmak dil hakimiyeti gösterir. İmperatif fiillerle enerji ('Join', 'Discover', 'Save your spot'), soru cümleleriyle merak ('Ready to make a difference?') ve kısa, çarpıcı ifadelerle vurgu yarat. Sıfatları özenle seç: her fayda için tek, güçlü bir sıfat, üç zayıf sıfattan iyidir. Broşürde her kelime bir işçidir; işe yaramayanı çıkar.","t":"p"},{"x":"Değerlendiricinin gözünden broşür, görsel düzeni ve harekete geçirici çağrısıyla ilk bakışta tanınır. Criterion C için değerlendirici şunu sorar: bu metin bir broşür gibi mi düzenlenmiş, yoksa düz bir makale mi? Başlıklar, alt başlıklar ve maddeler bu soruya olumlu yanıt verir. Criterion B için faydaların somut ve okur odaklı olup olmadığına bakar; 'bu okura ne katar?' sorusunun yanıtı net olmalıdır. Yazarken bir broşür tasarımcısı gibi düşün: okurun gözünün nereye takılacağını planla, en önemli bilgiyi en görünür yere koy ve onu bir eyleme çağırmadan bırakma.","t":"p"},{"x":"Son olarak, broşürün amacı okuru bir adım atmaya ikna etmektir ve bu amaç metnin her parçasına yön vermelidir. Başlık dikkat çeker, bölümler bilgilendirir ve ikna eder, çağrı ise eyleme geçirir. Bu üçlü bir huni gibi çalışır: geniş bir ilgiden, somut bir karara. Broşürü yazarken sürekli kendine sor: okur bunu okuduktan sonra ne yapacak, nasıl yapacağını biliyor mu? Bu amaç odaklı düşünce, broşürü güzel ama işlevsiz bir metin olmaktan çıkarır ve English B'nin istediği gibi kitle-amaç bilincini gösteren güçlü bir türe dönüştürür.","t":"p"},{"t":"p","x":"Broşürde başlıkların ve maddelerin dili de önemlidir: alt başlıklar okuru yönlendiren küçük vaatler gibi çalışmalıdır ('Why join us?', 'What you'll gain'), maddeler ise paralel yapıda ve fiil ağırlıklı olmalıdır ('Meet new people', 'Build real skills', 'Make a difference'). Bu paralellik hem okumayı kolaylaştırır hem de dil düzenini gösterir. Dağınık, birbiriyle uyumsuz maddeler broşürü özensiz gösterir; aynı kalıpta kurulmuş maddeler ise profesyonel ve taranabilir kılar."},{"t":"p","x":"En sık hata broşürü düz bir makale gibi paragraflar halinde yazmaktır; bu görsel düzeni yok eder ve Criterion C düşer. İkinci hata harekete geçirici çağrının eksikliğidir; broşürün amacı okuru bir eyleme yöneltmektir, bu çağrı olmadan tür eksik kalır. Üçüncü hata aşırı abartıdır: her cümlede 'amazing', 'incredible' demek güvenilirliği azaltır; ikna, somut faydayla yapılır. Dördüncü hata pratik bilginin (nasıl katılırım, ne zaman, nerede) unutulmasıdır. Kelime sınırlarını ve metin türü beklentilerini güncel resmi IB English B Guide'dan doğrula."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir yeri, ürünü veya etkinliği tanıtmak ve okuru harekete geçirmek (ziyaret et, katıl, satın al)."], ["Kitle", "Potansiyel ziyaretçi/müşteri veya ilgilenen halk."], ["Register / Ton", "İkna edici, enerjik, sıcak. Kısa cümleler, doğrudan 'you'."], ["Yapı", "Büyük başlık + slogan, alt başlıklı 2-3 bölüm, madde işaretleri, iletişim/çağrı kutusu."], ["Format (A4)", "Katlanır: trifold (3 sütun) veya bifold (2 sütun). Elle yazımda her bölümü bir alt başlıkla temsil et."], ["Tipik özellikler", "Çekici başlık, alt başlıklar, madde imleri, emir kipi (Discover, Join, Book), [Image: ...] yer tutucu, çağrı (call to action)."]]}, {"t": "note", "k": "protokol", "title": "A4'e nasıl yerleştirilir?", "lines": ["Sınav elle yazılır; yerleşimi KELİME ve DÜZENLE göster, çizim yapma.", "En üste büyük, akılda kalan bir BAŞLIK ve altına tek satır slogan koy.", "Görsel yerini parantezle belirt: [Image: a photo of hikers at sunrise].", "Gövdeyi 2-3 kısa bölüme ayır; her birine bir ALT BAŞLIK ver (Why visit? / What to bring / Plan your visit).", "Her bölümde 2-4 kısa madde (•) kullan; cümleler kısa ve çekici olsun.", "En alta bir bilgi/çağrı kutusu koy: açılış saati, fiyat, adres, telefon, web ve net bir çağrı.", "Trifold düşünüyorsan üç bölümü üç sütun gibi kurgula: sol=tanıtım, orta=detay, sağ=iletişim."]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Prompt'u çöz: kim yazıyor, kime, neyi tanıtmak için? Yer/etkinlik/ürün ne?", "2. Akılda kalıcı bir BAŞLIK ve tek satırlık bir slogan bul.", "3. Gövdeyi 2-3 bölüme ayır ve her birine bir ALT BAŞLIK ver (Why? / What? / Plan your visit).", "4. Her bölüme 2-4 somut, çekici madde yaz; abartma, ayrıntı ver.", "5. Bilgi/çağrı kutusunu doldur: saat, fiyat, adres, web ve net bir çağrı (Book now).", "6. Baştan sona emir kipi ve doğrudan 'you' kullan; cümleleri kısa tut.", "7. Son kontrol: başlık + slogan + alt başlıklar + madde işaretleri + kutu + çağrı hepsi var mı?"]}, {"t": "given", "title": "Birinci örnek (doğa yürüyüşü, yerleşim işaretli)", "x": "DISCOVER THE GREEN VALLEY TRAIL\nEscape the city. Breathe the mountain air.\n\n[Image: hikers on a green mountain path at sunrise]\n\nWHY GREEN VALLEY?\n• 12 km of well-marked, family-friendly trails\n• Stunning views over three hidden waterfalls\n• Rare birds, wild flowers and total silence\n\nWHAT TO BRING\n• Comfortable shoes and a light jacket\n• Water and a small snack\n• Your camera — you will definitely need it!\n\nPLAN YOUR VISIT\nOpen daily, 8 a.m. to 6 p.m. · Entry free for students\nJust two hours from the city centre\nBook a guided tour: www.greenvalley.example · 0212 000 00 00\n\nCome and rediscover nature. Your adventure starts this weekend!"}, {"t": "given", "title": "İkinci örnek (okul açık günü — farklı bağlam)", "x": "COME AND SEE YOUR FUTURE SCHOOL\nGreen Valley High Open Day — everyone welcome!\n\n[Image: smiling students showing visitors around a bright science lab]\n\nWHAT YOU CAN DO\n• Tour our labs, library and sports hall\n• Watch live science and music demonstrations\n• Meet our teachers and current students\n\nWHY GREEN VALLEY?\n• Small classes and genuinely friendly staff\n• Clubs for everyone, from robotics to drama\n• A strong record of students reaching top universities\n\nVISIT US\nSaturday 5 October, 10 a.m. to 3 p.m.\nNo booking needed — just turn up\n15 Valley Road (bus lines 12 and 34)\nQuestions? Email us at openday@greenvalley.example\n\nCome and picture yourself here. We can't wait to meet you!"}, {"t": "wizard", "wt": "brochure", "ptitle": "Görev", "prompt": "Şehrindeki bir yeri (bir park, müze, festival veya spor tesisi) tanıtan bir broşür/leaflet yaz. Çekici bir başlık, alt başlıklı bölümler, madde işaretleri ve bir iletişim/çağrı kutusu kullan.", "target": 220, "check": ["Büyük bir başlık ve bir slogan ile açtım.", "2-3 alt başlıklı bölüm ve madde işaretleri kullandım (Criterion C).", "Emir kipi, doğrudan 'you' ve net bir çağrı (call to action) koydum.", "Bir iletişim/bilgi kutusu (saat, fiyat, adres) ekledim.", "İkna edici, kısa ve enerjik bir dil kullandım (Criterion A/B).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (broşür)", "x": "COME ALIVE AT THE RIVERSIDE ARTS FESTIVAL\nThree days of music, colour and unforgettable moments.\n\n[Image: a crowd dancing in front of a bright outdoor stage]\n\nWHAT'S ON?\n• Live bands on two open-air stages\n• Street food from over thirty local kitchens\n• Free workshops in painting, dance and photography\n\nWHY YOU CAN'T MISS IT\nWhere else can you learn to paint at noon, taste the world at six, and dance under the stars at midnight? For one weekend, the Riverside Festival turns our quiet town into the most exciting place in the region.\n\nPLAN YOUR WEEKEND\nFriday to Sunday, 14–16 June · 10 a.m. until late\nTickets: 50 lira for the weekend, free for under-12s\nRiverside Park, next to the old bridge\nBook now: www.riversidefest.example · 0212 111 22 33\n\nBring your friends, bring your appetite, and bring your dancing shoes. We'll see you by the river!"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Broşürü düz bir denemeye çevirmek. Başlık, alt başlık ve madde işaretleri olmadan Criterion C düşer.", "Abartılı, inandırıcılıktan uzak övgü. Somut ayrıntı (saat, fiyat, ne var) güveni artırır.", "Çağrıyı (call to action) ve iletişim bilgisini unutmak. Broşürün amacı harekete geçirmektir."]}]}, {"id": "t-opinion", "group": "Kitle İletişim", "name": "Görüş Yazısı (Opinion Column)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Görüş Yazısı (Opinion Column) Nedir?"},{"x":"Görüş yazısı, yazarın bir konu hakkındaki kişisel duruşunu gerekçeleriyle savunduğu, bir gazete veya dergide yayımlanan bir metin türüdür. Makaleden en büyük farkı budur: makale dengeli ve bilgilendiricidir, görüş yazısı ise açıkça TARAF TUTAR ve okuru ikna etmeye çalışır. Paper 1'de görüş yazısı tartışmalı konularla eşleşir: sosyal medyanın etkisi, okul kuralları, çevre politikaları, teknolojinin geleceği. Beş temanın hepsiyle bağlanabilir. Görüş yazısının gücü, güçlü bir tez etrafında örülmüş ikna edici bir argümandan gelir; yazar ne düşündüğünü söyler ve NEDEN böyle düşündüğünü kanıtlarla destekler.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Görüş yazısının kitlesi, bir yayının okurlarıdır; konuya ilgi duyan ama henüz ikna olmamış kişiler. Amaç bu okurları yazarın görüşüne çekmektir. Register yarı resmidir: makale kadar dengeli değil, blog kadar samimi değil; kişisel ama gerekçeli bir ses. Yazar 'I believe', 'In my view' gibi ifadelerle duruşunu açıkça ortaya koyar ama iddialarını mantık ve örnekle destekler. Ton ikna edici, kimi zaman tutkulu, ama saygılıdır; karşı görüşü küçümsemeden çürütür. Bu denge, görüş yazısını hem güçlü hem ikna edici kılar."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Görüş yazısı genellikle çekici bir başlıkla ve net bir duruşla açılır; okur ilk paragrafta yazarın hangi tarafta olduğunu anlamalıdır. Gövde, tezi destekleyen birkaç argüman etrafında kurulur ve her argüman bir örnek, istatistik veya mantıksal gerekçeyle desteklenir. Güçlü görüş yazıları karşı görüşü de anar (counter-argument) ve onu çürüterek kendi konumunu güçlendirir. Kapanış tezi güçlü biçimde yineler ve çoğu zaman okura bir çağrı veya düşündürücü bir sonuç bırakır. İmza öğeleri: net bir tez, birinci tekil şahıs görüş ifadeleri, gerekçeli argümanlar ve ikna edici bir kapanış."},{"t":"p","x":"Karşı görüşü ele almak, görüş yazısının en olgun hamlesidir. Zayıf bir yazar yalnızca kendi tarafını anlatır; güçlü bir yazar karşı tarafı da tanır ve çürütür: 'Some argue that social media brings us closer. Yet the very platforms that promise connection often leave us lonelier than ever.' Bu hamle hem dürüstlük gösterir hem de yazarın konumunu sağlamlaştırır. Criterion B için bu, fikir gelişiminin en güçlü kanıtlarından biridir."},{"t":"h","x":"Dil ve İkna Araçları"},{"x":"Görüş yazısı ikna dilinin araçlarını kullanır. Güçlü, kesin ifadeler ('There is no doubt that...') duruşu netleştirir. Retorik sorular okuru yazarın mantığına çeker. Duygusal dil (pathos) ve mantıksal gerekçe (logos) dengelenir. Karşıtlıklar ve üçlü listeler vurgu katar. Ancak abartı ve genelleme tehlikelidir: 'Everyone knows that...' gibi ifadeler zayıf argümandır. İkna, kanıtla yapılır. Criterion A için görüş yazısı, güçlü bağlaçlar (however, therefore, nevertheless) ve çeşitli cümle yapılarıyla mantıksal akışı sergilemek için idealdir.","t":"p"},{"t":"h","x":"Çözümlü Model Örnek"},{"t":"p","x":"Güçlü bir görüş yazısı açılışı: 'We are told that homework builds discipline. After ten years in the school system, I am convinced of the opposite: it builds resentment, exhaustion, and a quiet hatred of learning.' Bu açılış net bir duruş alır, çarpıcıdır ve bir üçlü listeyle güçlenir. Gövdede yazar her iddiayı örnekle destekler, karşı görüşü ('Of course, some homework has value') anıp çürütür ve mantığını adım adım kurar. Kapanış tezi güçlü biçimde yineler: 'If we truly value learning, we must stop mistaking exhaustion for effort.' İkna edici ve taraflı ama gerekçeli (C), argümanlar örnek ve karşı-argümanla geliştirilmiş (B), dil mantıksal bağlaçlarla zengin (A)."},{"t":"h","x":"Görüş Yazısını Makale ve Denemeden Ayırmak"},{"x":"Görüş yazısı, makale ve deneme aynı aileden görünür ama niyetleri farklıdır. Makale dengelidir: bilgilendirir, farklı açıları anar ve okuru kendi sonucuna yönlendirir. Deneme akademiktir: bir soruyu ölçülü ve analitik biçimde tartışır, çoğu zaman iki yönü de tartar. Görüş yazısı ise açıkça taraf tutar: net bir tez alır ve okuru o teze ikna etmeye çalışır. Bu yüzden görüş yazısında 'I believe', 'In my view', 'It is clear that' gibi kişisel ve kesin ifadeler serbesttir; makalede ise bunlar tonu bozar. Görevde 'opinion', 'argue', 'do you agree', 'to what extent' gibi ifadeler taraf almanı isteyebilir; bu durumda net bir duruşla görüş yazısına geç.","t":"p"},{"rows":[["Görüş yazısı (Opinion)","Açıkça taraflı","Net tez + gerekçeli ikna"],["Makale (Article)","Dengeli","Bilgilendirir, alt başlıklı, yönlendirmez"],["Deneme (Essay)","Ölçülü/analitik","Akademik, iki yönü tartar, alt başlıksız"]],"t":"table","head":["Tür","Duruş","Ayırt edici işaret"]},{"t":"h","x":"Güçlü Bir Argüman İnşa Etmek"},{"t":"p","x":"İkna, çıplak iddiayla değil, gerekçeli argümanla yapılır. Her argümanı bir zincire otur: iddiayı söyle, gerekçesini ver, bir örnek veya kanıtla destekle ve sonucunu belirt. Örneğin: 'Homework harms learning (iddia), because it turns study into a chore rather than a choice (gerekçe); a student who spends three hours on forced worksheets has no energy left for the book that might have sparked real curiosity (örnek); over time, this is how schools accidentally teach children to dislike learning (sonuç).' Bu dört adım her argümanı sağlam ve ikna edici kılar. Görüş yazısında iki üç böyle argüman kurarsan, tezin sağlam bir zemine oturur."},{"x":"Karşı görüşü ele almak, ikna gücünü paradoksal biçimde artırır. Yalnızca kendi tarafını anlatan bir yazar tek yönlü ve savunmasız görünür; karşı tarafı tanıyıp çürüten bir yazar ise dürüst ve güçlü görünür. Bunu yapmanın kalıbı basittir: 'Admittedly, some argue that... However, this overlooks...' Karşı görüşü adil biçimde an, sonra onun eksiğini göster. Bu hamle Criterion B'de fikir gelişiminin en olgun kanıtıdır ve okurun 'ama ya şu?' itirazını daha o düşünmeden karşılar. Genelleme ('everyone knows', 'nobody thinks') ve abartıdan kaçın; bunlar argümanı zayıflatır ve çürütülmeye açık hale getirir.","t":"p"},{"t":"h","x":"Görüş Yazısı Becerisinin Individual Oral'a Katkısı"},{"x":"Görüş yazısı, bir duruşu gerekçelendirme becerisini geliştirir ve bu beceri Individual Oral'ın kalbidir. Sözlü sınavda öğretmen sana fikrini sorar ve seni gerekçelendirmeye iter; görüş yazısında öğrendiğin 'iddia-gerekçe-örnek-sonuç' zinciri ve karşı görüşü ele alma refleksi, tam da bu anlarda işe yarar. Paper 2 okuma bölümünde de görüş yazıları çıkar; yazarın tezini, gerekçelerini ve tonunu tanımak, çıkarım sorularını isabetle yanıtlamanı sağlar. Böylece taraf tutup gerekçelendirmeyi öğrenmek, hem yazmada hem konuşmada hem okumada kazandırır.","t":"p"},{"lines":["İlk paragrafta net bir tez al; okur nerede durduğunu bilsin.","Her argümanı bir örnek, istatistik veya mantıkla destekle; çıplak iddia bırakma.","Karşı görüşü an ve çürüt; bu olgunluk ve güç kazandırır.","Kapanışta tezi güçlü biçimde yinele ve okura bir düşünce bırak."],"k":"ipucu","t":"note","title":"İkna gücünü artıran hamleler"},{"t":"h","x":"Temayı Görüş Yazısı Merceğinden Çerçevelemek"},{"x":"Görüş yazısı görevi seni bir prescribed theme hakkında net bir duruş almaya çağırır. 'Human ingenuity' altında teknoloji, 'Social organization' altında eğitim veya kurallar, 'Sharing the planet' altında etik konular tipik görüş yazısı zeminleridir. Temayı çerçevelerken önce kendi tezini netleştir: bu konuda ne düşünüyorsun ve neden? Sonra o tezi destekleyecek iki üç güçlü argüman ve her birine bir örnek seç. Görüş yazısı merceği dengeli değil, taraflıdır; ama taraflılık, gerekçesizlik demek değildir. En güçlü görüş yazıları, güçlü bir kanaati sağlam kanıtlarla birleştirir ve okuru mantıkla ikna eder, bağırarak değil.","t":"p"},{"t":"p","x":"Görüş yazısında tonun kararlı ama saygılı olması önemlidir. Kendinden emin ifadeler ('I am convinced that', 'The evidence is clear') duruşunu güçlendirir, ama karşı tarafı aşağılayan bir ton ('Anyone who disagrees is simply foolish') okuru kaybettirir ve olgunluk eksikliği gösterir. Okuru ikna etmek istiyorsan, onu küçümseyemezsin. Karşı görüşü adil biçimde tanı, sonra onu mantıkla çürüt. Bu saygılı ama kararlı ton, hem daha ikna edicidir hem de Criterion C'de doğru register'ı gösterir: görüş yazısı tutkulu olabilir ama medeni kalmalıdır."},{"t":"p","x":"Kapanış, görüş yazısının en kritik anlarından biridir çünkü okurun aklında kalacak son sözdür. Zayıf bir kapanış tezi kuru biçimde tekrarlar; güçlü bir kapanış tezi yeni bir ışıkta yeniden ifade eder ve okura bir çağrı veya düşündürücü bir soru bırakır. Örneğin: 'If we truly value learning, we must stop mistaking exhaustion for effort.' Bu tür bir kapanış hem tezi pekiştirir hem de okurun zihninde yankılanır. Kapanışta yeni bir argüman açma; onun yerine söylediklerini güçlü ve akılda kalıcı bir cümlede topla ve okuru kendi sonucuna doğru son bir adım at."},{"x":"Görüş Yazısında Dil ve Değerlendirici Gözü","t":"h"},{"t":"p","x":"Görüş yazısı, mantıksal akışı görünür kılan dil araçlarıyla güçlenir ve bu araçlar Criterion A için doğal bir çeşitlilik zemini sunar. Bağlaçlar argümanının iskeletini gösterir: 'however' bir karşıtlık, 'therefore' bir sonuç, 'furthermore' bir ekleme, 'admittedly' bir taviz işaret eder. Bu bağlaçları doğru kullanmak, okurun mantığını takip etmesini sağlar ve yazının düşünülmüş olduğunu gösterir. Ayrıca kesinlik dereceleri arasında oynamayı öğren: 'This proves' güçlü, 'This suggests' ölçülü bir iddiadır. Aşırı kesinlik ('This absolutely proves everyone is wrong') çürütülebilir; ölçülü ama kararlı bir dil daha ikna edicidir."},{"x":"Değerlendiricinin gözünden görüş yazısı, net bir tez ve onu destekleyen gerekçeli argümanlarla tanınır. Criterion C için değerlendirici şunu sorar: bu yazar bir duruş aldı mı, yoksa makale gibi dengeli mi kaldı? Net bir tez ve ikna edici ton bu soruya olumlu yanıt verir. Criterion B için argümanların gerçekten geliştirilip geliştirilmediğine bakar; çıplak iddialar değil, gerekçe-örnek zincirleri puan getirir. Yazarken bir avukat gibi düşün: bir davayı savunuyorsun, ama mahkemeyi kanıtla ikna etmelisin, bağırarak değil. Her argümanın arkasında bir 'çünkü' ve bir örnek olsun.","t":"p"},{"x":"Son olarak, güçlü bir görüş yazısı okuru düşünmeye zorlar ve çoğu zaman onun fikrini biraz olsun değiştirir. Bunu başarmanın yolu, okurun zaten inandığını tekrarlamak değil, ona yeni bir bakış açısı sunmaktır. En etkili görüş yazıları beklenmedik bir açıdan yaklaşır ('Belki de sorun teknoloji değil, ondan ne beklediğimizdir') ve okuru rahat inançlarından nazikçe çıkarır. Bu tür bir taze bakış, hem Criterion B'de fikir gücünü gösterir hem de yazını unutulmaz kılar. Görüş yazısı yalnızca bir taraf tutma değil, okuru bir yolculuğa çıkarma sanatıdır.","t":"p"},{"t":"p","x":"En sık hata dengesizlik değil, gerekçesizliktir: taraf tutmak görüş yazısının doğasıdır ama iddiaları kanıtlamadan sıralamak zayıftır. Her görüş bir gerekçe ister. İkinci hata makale ile karıştırmaktır: görüş yazısı dengeli olmaya çalışırsa amacını kaybeder; net bir duruş almalıdır. Üçüncü hata abartı ve genellemedir ('everyone', 'always', 'never'); bunlar argümanı çürütülebilir kılar. Dördüncü hata karşı görüşü hiç anmamaktır; onu ele alıp çürütmek yazıyı güçlendirir. Kelime sınırlarını ve metin türü beklentilerini güncel resmi IB English B Guide'dan teyit et."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir görüşü gerekçeli biçimde savunmak."], ["Kitle", "Bir gazete veya derginin okurları."], ["Register / Ton", "İkna edici, kişisel görüş, yer yer duygusal."], ["Yapı", "Net bir tez, gerekçelerle gelişen paragraflar, karşı görüşe kısa değinme, güçlü kapanış."], ["Tipik özellikler", "Birinci şahıs görüş, retorik sorular, örnekler, ikna edici dil."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir görüş/tez belirle: neyi savunuyorsun?", "2. Çarpıcı bir açılışla tezini hemen ortaya koy.", "3. Her paragrafta bir gerekçe ver ve örnekle destekle.", "4. Karşı görüşe kısaca değin (Critics will say...), sonra çürüt.", "5. İkna edici dil ve retorik sorular kullan.", "6. Güçlü, akılda kalan bir kapanış yaz.", "7. Son kontrol: net tez + gerekçeler + karşı görüş + ikna edici ton var mı?"]}, {"t": "given", "title": "Birinci örnek (sınav baskısı)", "x": "It is time we admitted an uncomfortable truth: our obsession with exam results is failing the very students it claims to help."}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Everyone keeps telling young people to 'follow their passion.' It sounds inspiring on a poster. In reality, it may be the most useless advice we ever give them — and here is why."}, {"t": "wizard", "wt": "opinion_column", "ptitle": "Görev", "prompt": "Bir gazetenin görüş köşesi için bir yazı yaz: gençleri ilgilendiren tartışmalı bir konuda (sosyal medya, sınavlar, teknoloji, çevre) net bir görüş savun. Tezini açıkça ver, gerekçelendir, karşı görüşe değin ve güçlü bir kapanış yap.", "target": 250, "check": ["Girişte net bir tez/görüş verdim.", "Görüşümü gerekçe ve örneklerle geliştirdim; retorik soru kullandım (Criterion C).", "Karşı görüşe değindim ve onu dengeledim/çürüttüm (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Güçlü bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (görüş yazısı)", "x": "It is time we admitted an uncomfortable truth: our obsession with exam results is failing the very students it claims to help.\n\nOf course grades matter. They open doors, and pretending otherwise would be dishonest. But when a fourteen-year-old cannot sleep for fear of a test, something has gone badly wrong. We have taken a useful measure and turned it into the only thing that counts.\n\nCritics will say that pressure builds character. Perhaps a little does. Yet the students I know are not becoming stronger; they are becoming exhausted, anxious, and convinced that their worth is a number on a page.\n\nImagine, instead, a school that valued curiosity, kindness and effort alongside marks. Would our students really learn less? Or would they finally learn to love learning?\n\nWe cannot change the exam system overnight. But we can change the story we tell our children about it. Let us start by telling them the truth: you are so much more than your results."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Görüş yazısı NET bir taraf tutar; 'her iki görüş de doğru' zayıftır.", "Karşı görüşü hiç anmamak. Ona değinip çürütmek yazını olgunlaştırır.", "Sadece duyguya yaslanmak. Duygu + gerekçe + örnek birlikte ikna eder."]}]}, {"id": "t-letter", "group": "Profesyonel", "name": "Resmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Resmi Mektup / E-posta (Formal Letter) Nedir?"},{"x":"Resmi mektup veya e-posta, tanımadığın ya da bir kurumu temsil eden bir kişiye belirli bir amaçla (şikayet, başvuru, talep, öneri, bilgi isteme) yazılan, en yüksek resmiyet düzeyindeki metin türüdür. Paper 1'de resmi mektup çok sık çıkar çünkü net kuralları ve tanınabilir bir biçimi vardır: bir okul müdürüne, bir belediyeye, bir şirkete, bir gazete editörüne yazılabilir ve 'Social organization', 'Sharing the planet' gibi temalarla eşleşir. Resmi mektubun gücü, açık amacı, saygılı tonu ve düzenli yapısından gelir. Bu tür, Criterion C'yi kanıtlamak için en somut fırsatı sunar çünkü biçimsel öğeleri (hitap, kapanış, imza) nettir.","t":"p"},{"t":"h","x":"Kitle, Amaç ve Register"},{"x":"Resmi mektubun kitlesi bir yetkili veya kurumdur: müdür, editör, yönetici, memur. Onu tanımazsın ve saygılı bir mesafe korursun. Amaç nettir ve mektup boyunca odakta kalır: şikayet etmek, başvurmak, talep etmek, öneri sunmak. Register en resmi uçtadır: kısaltma yoktur (do not, cannot yazılır, don't değil), nesnel ve saygılı bir ton kullanılır, argo ve gündelik ifadeler dışlanır. Duygular kontrollüdür; öfkeli bir şikayet bile saygılı ve gerekçeli kalır. Bu ölçülü ve düzenli dil, mektubun ciddiyetini ve ikna gücünü artırır.","t":"p"},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Resmi mektubun katı bir yapısı vardır ve bu yapı Criterion C'nin doğrudan kanıtıdır. Uygun bir hitapla açılır: alıcının adını biliyorsan 'Dear Mr Smith,', bilmiyorsan 'Dear Sir or Madam,'. İlk paragraf yazma amacını hemen belirtir: 'I am writing to express my concern about...'. Gövde paragrafları amacı gerekçelerle geliştirir; her paragraf bir noktaya odaklanır. Kapanış paragrafı beklenen eylemi belirtir ve nazik bir kapanışla biter. Uygun bitiş formülü hitaba bağlıdır: 'Dear Mr Smith' ile açtıysan 'Yours sincerely', 'Dear Sir or Madam' ile açtıysan 'Yours faithfully' ile bitirir ve altına adını yazarsın. Bu formüller resmi mektubun imza öğeleridir."},{"x":"Açılış paragrafı amacı gizlemez, hemen ilan eder. Zayıf bir açılış konuya dolaylı girer; güçlü bir açılış nettir: 'I am writing to apply for the volunteer position advertised in your newsletter.' Okuyan yetkili ilk cümlede neden yazdığını anlar. Bu netlik, resmi iletişimin nezaketidir; yetkilinin zamanına saygı gösterir ve mektubun amacını odakta tutar.","t":"p"},{"x":"Dil ve Üslup","t":"h"},{"x":"Resmi mektubun dili nesnel, saygılı ve ölçülüdür. Kısaltmasız tam yapılar (I would like, I am writing) kullanılır. Nazik ama kararlı ifadeler ('I would be grateful if you could...', 'I would appreciate it if...') talebi saygıyla iletir. Pasif yapı yer yer nesnellik katar ('It has come to my attention that...'). Duygular kontrollü ifade edilir; 'I am furious' yerine 'I am deeply concerned' denir. Criterion A için resmi mektup, karmaşık ama doğru yapılar ve resmi kalıplar kurma becerini gösterir. Ancak kalıpları abartma; doğal ve amaca uygun bir resmiyet, yapay bir gösterişten iyidir.","t":"p"},{"x":"Çözümlü Model Örnek","t":"h"},{"t":"p","x":"Güçlü bir resmi şikayet mektubu şöyle işler: 'Dear Sir or Madam,' hitabıyla açar; ilk paragrafta amacı net verir: 'I am writing to draw your attention to the poor condition of the public library's study area.' Gövdede sorunu somut örneklerle anlatır ('broken chairs', 'faulty lighting', 'no working sockets') ve bunun öğrenciler üzerindeki etkisini açıklar; ton boyunca saygılı ve gerekçeli kalır. Kapanışta net bir eylem talep eder: 'I would be grateful if these issues could be addressed before the exam period.' Ve 'Yours faithfully,' ile adını yazarak biter. Resmi ve saygılı (C), sorun somut örneklerle geliştirilmiş (B), dil resmi kalıplarla doğru ve çeşitli (A)."},{"t":"h","x":"Resmi Mektubu Gayriresmi Mektuptan Ayırmak"},{"x":"En kritik ayrım resmi ile gayriresmi mektup arasındadır çünkü ikisi de mektuptur ama register uçlardadır. Resmi mektup tanımadığın bir yetkiliye yazılır; hitap 'Dear Sir or Madam' veya 'Dear Mr Smith', register en resmi uçta, kısaltma yok, ton nesnel ve saygılı. Gayriresmi mektup ise yakın birine yazılır; hitap 'Dear Anna' veya 'Hi Sam', register gayriresmi, kısaltmalar ve gündelik ifadeler serbest, ton sıcak ve kişisel. Aynı olayı iki mektupta anlatabilirsin ama dil tamamen değişir. Görevde alıcının kim olduğuna bak: bir kurum, bir yetkili, bir yabancı ise resmi; bir arkadaş, bir aile üyesi ise gayriresmi mektup yaz. Bu kararı ilk hitaptan son imzaya kadar tutarlı taşı.","t":"p"},{"t":"table","head":["Özellik","Resmi mektup","Gayriresmi mektup"],"rows":[["Hitap","Dear Sir or Madam / Dear Mr X","Dear Anna / Hi Sam"],["Register","Kısaltmasız, nesnel, saygılı","Kısaltmalı, sıcak, kişisel"],["Kapanış","Yours faithfully / Yours sincerely","Best wishes / Love / See you soon"]]},{"x":"Amacı Yapıya Dönüştürmek","t":"h"},{"t":"p","x":"Resmi mektupta her paragrafın bir işi vardır ve bu işlevsel yapı Criterion C ile B'yi birlikte güçlendirir. İlk paragraf amacı ilan eder ('I am writing to...'). İkinci ve üçüncü paragraflar amacı gerekçelerle ve örneklerle geliştirir; her paragraf tek bir noktaya odaklanır. Son paragraf beklenen eylemi net söyler ('I would be grateful if you could...') ve nazik bir kapanışa hazırlar. Bu düzen okuyan yetkiliyi yormaz; ne istediğini nerede bulacağını bilir. Şikayet mektubunda sorunu ve etkisini; başvuru mektubunda niteliklerini ve motivasyonunu; talep mektubunda ihtiyacını ve gerekçesini bu yapı içinde sun. Yapı, amacın hizmetindedir."},{"t":"p","x":"Resmi register kalıpları mektubu ustaca gösterir ama abartılmamalıdır. 'I would be grateful if you could...', 'I am writing with regard to...', 'I would appreciate it if...', 'Please do not hesitate to contact me...' gibi kalıplar saygılı ve profesyonel bir ton kurar. Ancak her cümleyi kalıba boğmak yapay durur; kalıpları doğal bir akış içinde, amaca hizmet ettikleri yerde kullan. Ayrıca duyguyu kontrol et: en haklı şikayette bile 'I am furious' yerine 'I am deeply concerned' de. Ölçülü ve saygılı bir ton, öfkeli bir tondan her zaman daha ikna edicidir çünkü yetkiliyi savunmaya değil çözüme yöneltir."},{"t":"h","x":"Resmi Mektup Becerisinin Diğer Bölümlere Katkısı"},{"t":"p","x":"Resmi mektup, register kontrolünün ve amaç odaklı yapının en net okulu olduğu için tüm sınava katkı sağlar. Register'ı baştan sona tutarlı taşımayı burada öğrenirsin ve bu beceri diğer resmi türlere (rapor, öneri, yönerge) doğrudan aktarılır. Paper 2 okuma bölümünde resmi mektuplar ve e-postalar çıkar; hitap, amaç ve kapanış kalıplarını tanıyan öğrenci yazarın niyetini hızlı çözer. Individual Oral'da ise resmi ve nesnel konuşabilme becerisi, bir konuyu ciddiyetle ele alırken işe yarar. Kısacası resmi mektupta kazandığın register disiplini, English B'nin her köşesinde değer taşır."},{"lines":["Doğru hitap-kapanış eşleşmesi: 'Dear Mr X'/'Yours sincerely', 'Dear Sir or Madam'/'Yours faithfully'.","İlk paragrafta amacı açıkça belirt; okuru bekletme.","Kısaltma kullanma; do not, cannot, I am yaz.","Kapanışta beklenen eylemi net söyle ve saygılı bir kapanışla bitir."],"title":"Resmi mektupta puan garantileyen öğeler","k":"ipucu","t":"note"},{"x":"Temayı Resmi Mektup Merceğinden Çerçevelemek","t":"h"},{"t":"p","x":"Resmi mektup görevi bir prescribed theme'i somut bir amaca bağlar: bir soruna dikkat çekmek, bir programa başvurmak, bir talepte bulunmak. 'Sharing the planet' altında bir belediyeye çevre şikayeti, 'Social organization' altında bir okula öneri, 'Experiences' altında bir programa başvuru tipiktir. Temayı çerçevelerken kendine sor: kime yazıyorum, ne istiyorum ve bunu hangi gerekçelerle haklı çıkarıyorum? Resmi mektup merceği kişisel duygudan çok, açık amaç ve mantıklı gerekçe ister. Konuyu bir yetkilinin harekete geçebileceği somut bir talebe dönüştür; belirsiz şikayetler yerine net istekler sun ve her isteğini bir gerekçeyle destekle."},{"t":"p","x":"Resmi mektupta nezaket ve kararlılık bir arada durur. Bir şey talep ederken saygılı ol ama isteğini net söyle; bir sorunu bildirirken medeni kal ama etkisini açıkça ortaya koy. Bu denge 'I would be grateful if...' gibi nazik kalıplarla, net taleplerin birleşiminden doğar. Aşırı özür dileyen, çekingen bir ton ('I'm so sorry to bother you, I know you're busy...') mektubu zayıflatır; aşırı talepkar, sert bir ton ise yetkiliyi savunmaya iter. Profesyonel bir orta yol tut: kendine güvenen ama saygılı. Bu ton, hem daha ikna edicidir hem de Criterion C'de doğru resmi register'ı gösterir."},{"t":"p","x":"Mektubun bütünlüğü de değerlendirilir: hitap, açılış, gövde, kapanış ve imza tutarlı bir zincir oluşturmalıdır. Açılıştaki resmiyet kapanışa kadar taşınmalı, hitap ile kapanış formülü eşleşmeli ('Dear Sir or Madam' ile 'Yours faithfully'), ve gövdedeki her paragraf tek bir noktaya odaklanmalıdır. Son okumada bu zinciri kontrol et: baştan sona resmi mi, biçimsel öğeler yerinde mi, amaç net mi, talep açık mı? Bu bütünlük, mektubun profesyonel ve özenli görünmesini sağlar ve değerlendiricide türü tam kavradığın izlenimini bırakır."},{"t":"h","x":"Resmi Mektupta Dil ve Değerlendirici Gözü"},{"x":"Resmi mektup, karmaşık ama doğru yapıları sergilemek için ideal bir zemindir ve bu da Criterion A açısından değerlidir. Nazik istek kalıpları ('I would be grateful if you could...', 'I would appreciate the opportunity to...') şart kipini ve resmi register'ı bir arada gösterir. Pasif yapı yer yer nesnellik katar ('It has come to my attention that the facilities are no longer maintained'). Bağlaçlar mantığı düzenler ('Furthermore', 'Consequently', 'Nevertheless'). Ancak bu yapıları amaca hizmet ettikleri yerde kullan; her cümleyi süslemeye çalışmak yapaylık yaratır. Doğal bir resmiyet, zorlama bir gösterişten her zaman daha güçlüdür ve daha yüksek puan getirir.","t":"p"},{"x":"Değerlendiricinin gözünden resmi mektup, biçimsel öğeleriyle anında tanınır: doğru hitap, net amaç, düzenli gövde, uygun kapanış ve imza. Criterion C için değerlendirici şunu sorar: bu yazar resmi register'ı baştan sona koruyabildi mi, biçimsel öğeleri doğru kullandı mı? Tek bir gündelik ifade ('thanks a lot', 'it's a bit annoying') bu izlenimi bozabilir. Criterion B için amacın net olup olmadığına ve gerekçelerin geliştirilip geliştirilmediğine bakar. Yazarken kendini mektubu alan yetkilinin yerine koy: ne istendiğini hemen anlıyor mu, ton saygılı ama net mi, harekete geçmesi için yeterli gerekçe var mı?","t":"p"},{"x":"Son olarak, resmi mektubun gücü açıklık ve nezaketin birleşiminden gelir. En etkili resmi mektuplar ne muğlak ne de kaba olanlardır; ne istediğini tam olarak bilen ama bunu saygıyla ifade edenlerdir. Bu denge, bir yetkiliyi savunmaya değil işbirliğine iter. Şikayet mektubunda bile amaç suçlamak değil, çözüm istemektir; başvuru mektubunda amaç yalvarmak değil, kendini profesyonelce sunmaktır. Bu olgun, çözüm odaklı ton, hem gerçek hayatta hem sınavda en iyi sonucu verir ve English B'nin resmi türlerde aradığı kitle-amaç bilincini eksiksiz gösterir.","t":"p"},{"t":"p","x":"En sık hata register kaymasıdır: mektuba resmi başlayıp ortada gündelik ifadelere ('it's a bit annoying', 'thanks a lot') kaymak. Register baştan sona resmi kalmalıdır. İkinci hata hitap ve kapanış formüllerini karıştırmaktır; 'Dear Sir or Madam' ile açıp 'Yours sincerely' ile bitirmek yanlıştır. Üçüncü hata amacı gizlemek veya çok geç söylemektir; resmi mektup ilk paragrafta niyetini açıklar. Dördüncü hata kontrolsüz duygudur; öfkeli bir ton mektubun ciddiyetini ve ikna gücünü zayıflatır. Kelime sınırlarını ve metin türü kurallarını güncel resmi IB English B Guide'dan doğrula."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Talep etmek, şikayet etmek, başvurmak veya resmi bilgi vermek."], ["Kitle", "Belirli bir kişi veya kurum (müdür, yetkili, şirket)."], ["Register / Ton", "Resmi ve nazik. Kısaltma (I'm) yok, net ve saygılı."], ["Yapı", "Selamlama (Dear ...), amacı belirten açılış, gerekçeli gövde, istenen sonuç, resmi kapanış."], ["Kapanış kuralı", "İsim biliniyorsa 'Yours sincerely'; bilinmiyorsa (Dear Sir/Madam) 'Yours faithfully'."], ["Tipik özellikler", "Resmi hitap, net amaç cümlesi (I am writing to...), nazik ton, gerekçe, imza formülü."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle: adını biliyor musun? Selamlama ve kapanışı buna göre seç.", "2. 'Dear Mr/Ms [soyad],' veya 'Dear Sir or Madam,' ile başla.", "3. Açılış cümlesinde amacı net söyle: I am writing to...", "4. Gövdede gerekçeni nazik ama net paragraflarla açıkla.", "5. Ne istediğini/beklediğini açıkça belirt (talep, çözüm).", "6. Nazik bir kapanış + doğru formül (Yours sincerely/faithfully) + adın.", "7. Son kontrol: resmi hitap, kısaltma yok, net amaç, doğru kapanış formülü var mı?"]}, {"t": "given", "title": "Birinci örnek (şikayet)", "x": "Dear Mr Thompson,\n\nI am writing to express my concern about the recent changes to the school bus timetable, which have affected many students in my neighbourhood."}, {"t": "given", "title": "İkinci örnek (başvuru, farklı bağlam)", "x": "Dear Sir or Madam,\n\nI am writing to apply for the position of summer volunteer at the city library, which was advertised on your website. As a keen reader and a reliable, organised student, I believe I could contribute a great deal to your team.\n\nI would welcome the chance to discuss my application further. Thank you for considering my request.\n\nYours faithfully,\nAlex Carter"}, {"t": "wizard", "wt": "formal_letter", "ptitle": "Görev", "prompt": "Yerel belediyeye veya okul yönetimine, seni etkileyen bir sorun (bir tesisin kapatılması, bir kural değişikliği) hakkında resmi bir şikayet veya talep mektubu yaz. Amacını net belirt, gerekçelendir ve bir çözüm iste.", "target": 250, "check": ["Doğru resmi selamlama (Dear ...) ve doğru kapanış formülünü (sincerely/faithfully) kullandım.", "Açılışta amacımı net belirttim (I am writing to...) ve kısaltma kullanmadım (Criterion C).", "Gerekçemi nazik ama net paragraflarla açıkladım ve bir çözüm/talep sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (resmi mektup)", "x": "Dear Mr Thompson,\n\nI am writing to express my concern about the recent changes to the school bus timetable, which have made it very difficult for students in the Riverside area to arrive on time.\n\nSince the earlier service was removed, many of us must now take a bus that reaches school ten minutes after the first lesson begins. As a result, students are regularly marked late through no fault of their own, and some have stopped attending the optional morning study sessions altogether.\n\nI would be very grateful if the school could consider restoring the earlier service, or arranging a short grace period for affected students. A small adjustment would solve the problem for a large number of families.\n\nThank you for taking the time to consider this matter. I look forward to your reply.\n\nYours sincerely,\nAlex Carter"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kısaltma (I'm, don't) veya günlük ifade kullanmak. Resmi mektup samimi olmaz.", "Yanlış kapanış formülü: isim biliniyorsa 'sincerely', bilinmiyorsa 'faithfully'.", "Amacı geç söylemek. İlk cümlede 'I am writing to...' ile amacı net ver."]}]}, {"id": "t-informal", "group": "Kişisel", "name": "Gayriresmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"x":"Gayriresmi Mektup / E-posta Nedir?","t":"h"},{"t":"p","x":"Gayriresmi mektup veya e-posta, tanıdığın ve yakın olduğun birine (bir arkadaş, bir aile üyesi, bir akraba) yazılan, sıcak ve kişisel bir metin türüdür. Resmi mektubun tam karşısında durur: orada bir yetkiliye mesafeli ve saygılı yazarken, burada sevdiğin birine samimi ve rahat yazarsın. Paper 1'de gayriresmi mektup, bir haber verme, bir davet, bir tavsiye, bir teşekkür veya bir deneyimi paylaşma bağlamında çıkar ve 'Experiences', 'Identities' gibi temalarla eşleşir. Bu türün gücü, gerçek bir ilişkinin sıcaklığını dile taşımaktan gelir; okur, satırların arasında gerçek bir dostun sesini duymalıdır."},{"x":"Gayriresmi mektubu değerli kılan, kişisel bağdır. Yazar ile alıcı birbirini tanır; bu yüzden metin ortak anılara, iç şakalara, paylaşılan deneyimlere gönderme yapabilir. Bu tanışıklık dile de yansır: rahat, doğal ve içten. Ancak gayriresmi olmak, dağınık veya özensiz olmak demek değildir; dil hâlâ doğru ve akıcı olmalıdır. Criterion A gayriresmi bir mektupta da çeşitliliği ve doğruluğu ödüllendirmeye devam eder. İyi bir gayriresmi mektup, hem bir dostun sesini taşır hem de dil açısından özenlidir.","t":"p"},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Gayriresmi mektubun kitlesi yakın biridir ve bu yakınlık her kararı belirler. Amaç genellikle kişiseldir: bir haber vermek, bir deneyimi anlatmak, bir tavsiye vermek, bir daveti iletmek veya sadece hasret gidermek. Register gayriresmidir: kısaltmalar (I'm, don't, can't) serbesttir, gündelik ifadeler ve deyimler kullanılabilir, ünlemler ve doğrudan seslenmeler doğaldır. Ton sıcak, samimi ve kişiseldir; okurla bir sohbet ediyormuş gibi yazarsın. Bu register'ı ilk hitaptan ('Hi Anna', 'Dear Grandpa') son kapanışa ('Love', 'Take care', 'See you soon') kadar tutarlı taşımalısın."},{"t":"h","x":"Yapı ve İmza Öğeleri"},{"t":"p","x":"Gayriresmi mektup, resmi mektuptan daha esnek bir yapıya sahiptir ama yine de tanınabilir imza öğeleri taşır. Sıcak bir hitapla açılır ('Dear Sam', 'Hi Emma'). Açılış genellikle bir hal hatır sorma veya bir teşekkürle başlar ('How are you? It feels like ages since we last talked!'). Gövde daha akışkandır; katı alt başlıklar gerekmez, konudan konuya doğal geçişler yapılır. Kapanış sıcak bir dilek ve gayriresmi bir bitiş formülüyle biter ('Write back soon! Love, Mert'). İmza öğeleri: samimi hitap, kişisel açılış, sohbet havasında gövde ve sıcak kapanış. Bu öğeler mektubun gerçek bir ilişkiden doğduğunu gösterir."},{"x":"Açılış, mektubun sıcaklığını hemen kurar. Resmi mektup amacı ilan ederken, gayriresmi mektup önce ilişkiye değinir. Zayıf bir açılış doğrudan konuya girer ve soğuk kalır: 'I am writing to tell you about my holiday.' Güçlü bir açılış ise önce bağ kurar: 'I've been dying to tell you about my trip — you won't believe what happened!' Bu ikinci açılış heyecan, samimiyet ve merak taşır; okuru bir dostun anlatısına davet eder. İlk cümleler, iki insan arasındaki gerçek bağı yansıtmalıdır.","t":"p"},{"t":"table","head":["Özellik","Gayriresmi mektup","Resmi mektup"],"rows":[["Hitap","Hi Sam / Dear Anna","Dear Sir or Madam / Dear Mr X"],["Register","Kısaltmalı, sıcak, deyimli","Kısaltmasız, nesnel, saygılı"],["Kapanış","Love / Take care / See you soon","Yours faithfully / Yours sincerely"]]},{"x":"Dil ve Üslup","t":"h"},{"t":"p","x":"Gayriresmi mektubun dili canlı ve kişiseldir. Kısaltmalar ve gündelik ifadeler ('by the way', 'to be honest', 'guess what') tonu sıcak tutar. Doğrudan sorular okurla diyalog kurar ('Remember that cafe we loved?'). Ünlemler heyecan ve duygu katar. Birinci ve ikinci tekil şahıs ('I', 'you') mektuba yakınlık verir. Ancak Criterion A'yı unutma: samimi olmak, basit ve tekrarlı yazmak demek değildir. Duyguları çeşitli kelimelerle anlat, cümle uzunluğunu değiştir, deyimleri doğru kullan. Böylece hem sıcak hem dil açısından zengin bir mektup ortaya çıkar; işte bu denge en yüksek puanı getirir."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"İyi bir gayriresmi mektup şöyle işler: 'Hi Leyla,' hitabıyla sıcak açar; ilk paragrafta bağ kurar: 'How have you been? I still can't stop thinking about our summer by the sea!' Gövdede haberini heyecanla anlatır, kişisel detaylar ve duygular ekler ('I was so nervous I could barely speak, but it turned out amazing'). Okura sorular sorar ve onu sürece dahil eder ('Have you ever felt like that?'). Kapanışta sıcak bir dilek ve davet bırakır: 'Write back and tell me everything — I miss you! Love, Mert.' Sıcak ve gayriresmi register baştan sona tutarlı (C), deneyim kişisel detaylarla geliştirilmiş (B), dil samimi ama çeşitli ve doğru (A).","t":"p"},{"lines":["Sıcak bir hitap ve kişisel bir açılışla başla; önce bağ kur, sonra konuya gir.","Kısaltma, deyim ve doğrudan soru kullan; okurla sohbet et.","Duyguları çeşitli kelimelerle anlat; samimiyet dil çeşitliliğini engellemez.","Sıcak bir dilek ve gayriresmi kapanış formülüyle bitir."],"title":"Gayriresmi mektupta sıcaklığı kurmak","k":"ipucu","t":"note"},{"x":"Sık Hatalar ve Değerlendirici Gözü","t":"h"},{"t":"p","x":"En sık hata register kaymasıdır ama bu kez ters yönde: gayriresmi bir mektuba resmi kalıplar ('I am writing to inform you that...', 'Yours faithfully') sıkıştırmak. Bu, sıcaklığı öldürür ve Criterion C'yi düşürür. İkinci hata, mektubu bir günlüğe çevirmektir; gayriresmi mektup yine de bir OKURA yazılır, ona seslenir ve sorular sorar, yalnızca yazarın iç dünyasını dökmez. Üçüncü hata, samimiyeti bahane edip özensiz yazmaktır; gayriresmi dil de doğru ve çeşitli olmalıdır. Değerlendirici Criterion C için gerçek bir kişisel ilişkinin sıcaklığını, Criterion B için deneyimin kişisel detaylarla geliştirilmesini, Criterion A için ise samimi ama zengin bir dili arar."},{"t":"h","x":"Gayriresmi ile Resmi Arasında Gezinmek"},{"x":"Gayriresmi mektup yazarken en sık düşülen tuzak, resmi kalıplara istemeden kaymaktır; çünkü okulda öğretilen çoğu mektup kalıbı resmidir. 'I am writing to tell you' resmi bir açılıştır; gayriresmi karşılığı 'Guess what happened!' veya 'I just had to tell you about...' olurdu. 'I look forward to hearing from you' resmidir; gayriresmi karşılığı 'Can't wait to hear back from you!' olur. Bu farkları bilinçli tanımak, register'ı doğru tutmanın anahtarıdır. Yazarken her cümlede kendine sor: bunu gerçekten bir arkadaşıma söyler miyim, yoksa bir memura mı? Bu basit test, register kaymalarını daha yazarken yakalar ve Criterion C'yi korur.","t":"p"},{"x":"Gayriresmi mektupta samimiyet, dilbilgisel özensizliğe bahane değildir. Bazı öğrenciler 'gayriresmi' kelimesini 'kurallara aldırmadan yaz' diye anlar ve dili bozar; oysa Criterion A gayriresmi bir mektupta da doğruluğu ve çeşitliliği ödüllendirir. Doğru gayriresmi dil, kısaltmaları ve deyimleri DOĞRU kullanan, cümleleri düzgün kuran ama tonu sıcak tutan dildir. Yani hem 'don't worry, it's all good' diyebilirsin hem de dilbilgisin sağlam kalır. Samimi olmak ile özensiz olmak arasındaki bu ayrımı içselleştirmek, gayriresmi türlerde yüksek puanın sırrıdır.","t":"p"},{"x":"Deneyimi Canlı ve Kişisel Anlatmak","t":"h"},{"x":"Gayriresmi mektubun kalbi, bir deneyimi bir dosta anlatmaktır ve bunu canlı kılmanın yolu somut detaylardır. Zayıf bir mektup deneyimi özetler ('The trip was good and I had fun'); güçlü bir mektup okuru o ana taşır ('Picture me at six in the morning, half asleep, watching the sun turn the whole valley gold — I actually got goosebumps'). Kişisel detaylar, duyular ve küçük anlar, bir deneyimi soyut bir özetten yaşanmış bir hikayeye çevirir. Ayrıca duygularını dürüstçe paylaş; gayriresmi mektupta korkularını, heyecanını, hayal kırıklığını itiraf edebilirsin ve bu içtenlik okurla bağ kurar. Deneyimini anlatırken sürekli okuru zihninde tut: ona bu hikayeyi neden anlatıyorsun, onunla hangi duyguyu paylaşmak istiyorsun?","t":"p"},{"t":"p","x":"Gayriresmi mektupta okuru sürecin içinde tutmak, onu bir dinleyiciden bir sohbet ortağına çevirir. Ona sorular sor ('Do you remember how nervous I was before we left?'), onun hayatına değin ('How did your own exams go? I've been thinking about you'), ortak anılara gönderme yap. Bu karşılıklılık, mektubu tek yönlü bir anlatıdan iki insan arasındaki gerçek bir ilişkiye dönüştürür. Resmi mektupta bu tür kişisel değinmeler yersiz kaçarken, gayriresmi mektupta tam da beklenen şeydir; onların yokluğu mektubu soğuk ve mesafeli gösterir. İyi bir gayriresmi mektup, okurun 'bu gerçekten bana yazılmış' demesini sağlar."},{"x":"Gayriresmi Mektup Becerisinin Diğer Bölümlere Katkısı","t":"h"},{"x":"Gayriresmi mektup, samimi ve kişisel bir sesle yazmayı öğretir ve bu beceri sınavın diğer bölümlerine taşınır. Paper 2 okuma bölümünde gayriresmi mektuplar ve e-postalar çıkar; hitap, ton ve register işaretlerini tanıyan öğrenci yazar ile alıcı arasındaki ilişkiyi ve mektubun amacını daha isabetli çözer. Individual Oral'da ise kişisel deneyimden sıcak biçimde konuşmak sık gerekir; gayriresmi mektupta geliştirdiğin 'deneyimi kişisel detaylarla anlatma' becerisi, bir görseli veya alıntıyı kendi hayatınla ilişkilendirirken doğrudan işe yarar. Böylece samimi bir ses, hem yazmada hem konuşmada hem de okuma anlayışında değer kazanır.","t":"p"},{"t":"p","x":"Register kontrolü açısından gayriresmi ve resmi mektup birbirinin en iyi öğretmenidir. İkisini yan yana çalışmak, register'ın ne kadar belirleyici olduğunu net gösterir: aynı olay, aynı kişi, ama tamamen farklı bir dil. Bu karşıtlığı içselleştiren öğrenci, sınavda hangi register'ın istendiğini hızlı seçer ve onu tutarlı taşır. Gayriresmi mektupta gevşek ama doğru, sıcak ama zengin bir dil kurmayı başardığında, register'ı bilinçli yönetme becerisini kanıtlamış olursun; bu beceri, English B'nin bütün türlerinde en çok fark yaratan yetkinliklerden biridir."},{"t":"p","x":"Değerlendiricinin gözünden gayriresmi mektup, sıcak hitabı, kişisel açılışı ve samimi tonuyla anında tanınır. Değerlendirici Criterion C için gerçek bir dostluk veya yakınlık hissi arar; mektup, iki insan arasındaki gerçek bir bağı yansıtmalıdır. Yazarken alıcıyı zihninde canlandır: bu kişi kim, onunla ne paylaşıyorsun, hangi anıları var? Bu kişiyi ne kadar gerçek kılarsan, mektup o kadar inandırıcı olur. Soğuk, genel bir 'herhangi birine yazılabilecek' mektup, bu türün ruhunu kaçırır; gayriresmi mektup daima belirli, tanıdık ve sevilen birine yazılır."},{"x":"Temayı gayriresmi mektup merceğinden çerçevelemek, büyük bir konuyu kişisel bir ilişkiye indirgemektir. 'Experiences' teması altında bir seyahat verildiğinde, bunu genel bilgiyle değil, bir dosta anlattığın kişisel bir hikaye olarak yazarsın. Tema ne olursa olsun, onu iki insan arasındaki gerçek bir sohbetin içine yerleştir. Zaman ve kelime disiplinini de koru: kişisel detaylarla deneyimi geliştir ama dağılma, kelime bandında kal ve sona register kontrolü için vakit bırak. Gayriresmi mektup, sıcaklık ile dilsel özenin bir arada durduğu, ilişkinin sesini kağıda taşıyan zengin bir türdür. Metin türü kurallarını, kelime sınırlarını ve register beklentilerini her zaman güncel resmi IB English B Guide'dan doğrula.","t":"p"},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir arkadaşa veya aile üyesine haber vermek, davet etmek, teşekkür etmek."], ["Kitle", "Yakın bir arkadaş veya aile üyesi."], ["Register / Ton", "Samimi, sıcak, kişisel. Kasılmalar (I'm, don't) serbest."], ["Yapı", "Hi/Dear + isim, hâl hatır sorma, gövde (asıl haber), sıcak kapanış (Love/Take care) + isim."], ["Tipik özellikler", "Kasılmalar, sorular, ünlemler, günlük ifadeler, doğrudan you, kişisel ayrıntılar."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle (arkadaş/aile) ve tonu ona göre ayarla.", "2. Samimi bir selamla başla (Hi/Hey + isim).", "3. Kısa bir hâl hatır sorma ile aç (It's been ages! How are you?).", "4. Asıl haberi veya amacı sıcak, kişisel bir dille anlat.", "5. Sorular sor; kasılma (I'm, don't) ve ünlem kullan.", "6. Sıcak bir kapanış (Love / Take care / Write back soon) + adın.", "7. Son kontrol: samimi selam ve kapanış, kasılmalar, kişisel ton var mı?"]}, {"t": "given", "title": "Birinci örnek (haber verme)", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share with you, and honestly I've been grinning about it all week."}, {"t": "given", "title": "İkinci örnek (davet, farklı bağlam)", "x": "Hey Can,\n\nGuess what — I'm finally having that birthday barbecue, and it wouldn't be the same without you! It's this Saturday at ours, from around four. Bring nothing but yourself and maybe that playlist you keep bragging about. Oh, and my little brother still wants a rematch at table tennis, so consider yourself warned. Let me know you can make it!\n\nCan't wait,\nEcem"}, {"t": "wizard", "wt": "informal_letter", "ptitle": "Görev", "prompt": "Yurt dışında bir yaz kampına katıldın. Yakın bir arkadaşına, kamptaki deneyimini anlatan ve onu gelecek yıl katılmaya teşvik eden gayriresmi bir e-posta yaz.", "target": 250, "check": ["Samimi bir selamlama (Hi + isim) ve sıcak bir kapanış (Love/Take care + isim) kullandım.", "Kasılmalar, sorular ve günlük ifadelerle samimi bir ton tutturdum (Criterion C).", "Prompt'un istediğini karşıladım: deneyimi anlattım ve arkadaşımı teşvik ettim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (gayriresmi e-posta)", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share: I spent three weeks at a summer camp in Wales, and it honestly changed how I see myself.\n\nThe first days were terrifying. I knew nobody, my English felt clumsy, and I nearly called home twice. But by the end of the first week, I was hiking with people from six different countries and laughing at jokes I couldn't have understood a month earlier. We cooked together, got hopelessly lost on a mountain, and stayed up far too late talking about everything.\n\nWhat surprised me most was how quickly I stopped being shy. When you have to speak English to ask for breakfast, you just do it.\n\nYou would absolutely love it, and they open applications in January. Promise me you'll think about it? I really want us to go together next year.\n\nMiss you loads,\nEcem"}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Register'ı görünür yap: kasılmalar, bir-iki soru ve doğrudan you. Değerlendirici Criterion C'yi buradan okur.", "Resmi mektup kalıplarına (I am writing to inform you) kaçma; bu tür samimidir."]}]}, {"id": "t-diary", "group": "Kişisel", "name": "Günlük (Diary)", "eyebrow": "Metin Türü", "blocks": [{"x":"Günlük (Diary) Nedir?","t":"h"},{"t":"p","x":"Günlük, yazarın kendi kendine, en özel ve içten biçimde yazdığı bir metin türüdür. Diğer tüm türlerden ayıran temel özelliği budur: günlüğün kitlesi bir başkası değil, yazarın kendisidir. Bu yüzden günlük, düşüncelerin ve duyguların en serbest, en filtresiz döküldüğü türdür. Paper 1'de günlük, bir olayın ardından yazarın iç dünyasını, karışık duygularını ve düşüncelerini yansıtan bir bağlamda çıkar ve 'Experiences', 'Identities' temalarıyla eşleşir. Günlüğün gücü, samimiyet ve içe dönüklükten gelir; okur (yani değerlendirici) yazarın en özel anına tanıklık ediyormuş hissi taşımalıdır."},{"t":"p","x":"Günlüğü blogdan ayırmak kritiktir çünkü ikisi de kişisel ve birinci tekil şahıstır. Fark kitlededir: blog bir OKUR topluluğuna seslenir ve onları içine çeker; günlük ise yalnızca yazarın kendisine yazılır, kimseye seslenmez, kimseyi ikna etmeye çalışmaz. Günlükte 'you' ve okura çağrı yoktur; onun yerine yazarın kendisiyle konuşması, kendine sorular sorması, çelişkili duygularını tartması vardır. Bu içe dönüklük, günlüğü English B'nin en mahrem türü yapar."},{"t":"h","x":"Kitle, Amaç ve Register"},{"x":"Günlüğün kitlesi yazarın kendisidir; kimse okumayacakmış gibi yazılır. Amaç, bir günü, bir olayı veya bir duyguyu işlemek, düşünceleri ve hisleri kağıda dökerek anlamlandırmaktır. Bu yüzden günlük çoğu zaman bir olayın değil, o olayın yazarda uyandırdığı DUYGULARIN kaydıdır. Register gayriresmi ve çok kişiseldir: kısaltmalar, yarım cümleler, ani düşünce sıçramaları ve doğrudan iç ses serbesttir. Ton, o günkü ruh haline göre değişir: heyecanlı, kırgın, umutlu, kararsız. Günlük, düşüncenin ham halini yansıtır; cilalı değil, içten olmalıdır.","t":"p"},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Günlüğün en tanınabilir imza öğesi tarih ve sık kullanılan 'Dear Diary' hitabıdır; günlük, belirli bir güne ait bir kayıttır. Açılış genellikle o günü veya o anki ruh halini duyurur ('What a day. I don't even know where to begin.'). Gövde katı bir yapı izlemez; düşünceler doğal bir akışla, çağrışımlarla ilerler. Yazar olayı anlatırken sürekli kendi duygularına ve iç sesine döner. Kapanış çoğu zaman bir çıkarım, bir umut, bir soru veya çözülmemiş bir duyguyla biter ('Maybe tomorrow will make more sense. I hope so.'). İmza öğeleri: tarih, kişisel iç ses, duygu odağı ve içe dönük bir kapanış."},{"t":"p","x":"Açılış, günlüğün duygusal tonunu hemen belli eder. Zayıf bir açılış olayı kuru biçimde bildirir: 'Today I went to the exam.' Güçlü bir açılış ise o anki iç durumu yansıtır: 'I can still feel my hands shaking as I write this. The exam is over, but my mind won't stop racing.' Bu ikinci açılış, okuru yazarın duygusal dünyasının ortasına bırakır. Günlükte olay bir zemindir; asıl konu, o olayın yazarda uyandırdığı içsel dalgalanmadır."},{"t":"h","x":"Dil ve Üslup"},{"t":"p","x":"Günlüğün dili içten ve duygusaldır. Birinci tekil şahıs ('I felt', 'I couldn't believe', 'I keep thinking') hakimdir. Kendine sorular sormak ('Why did I say that? What was I thinking?') iç sesin doğal bir parçasıdır. Kısa, kesik cümleler duygusal yoğunluk yaratır ('And then he left. Just like that.'). Duygu kelimeleri zengin ve çeşitli olmalıdır: yalnızca 'sad' değil, 'hollow', 'restless', 'quietly relieved'. Criterion A için günlük, iç dünyayı ince nüanslarla anlatan çeşitli bir kelime dağarcığı sergilemek için idealdir. Ham ve içten olmak, dil açısından zengin olmakla çelişmez."},{"t":"h","x":"Çözümlü Model Örnek"},{"x":"İyi bir günlük girişi: 'Dear Diary, 14 March. I got the part. I actually got the part. I've read the message a hundred times and I still don't believe it.' Bu açılış tarihi verir, iç sesi yansıtır ve tekrar yoluyla duygusal yoğunluğu kurar. Devamında yazar olayı anlatırken sürekli kendi duygularına döner: korku, sevinç, kendinden şüphe. Kendine sorular sorar ('What if I'm not good enough?') ve çelişkili hislerini tartar. Kapanış içe dönük ve çözülmemiştir: 'I should be happy — I am happy — but why do I feel so scared? Maybe that's just what wanting something this much feels like.' İçe dönük ve kişisel register baştan sona tutarlı (C), duygular derinlemesine işlenmiş (B), dil ince nüanslı ve çeşitli (A).","t":"p"},{"lines":["Tarih ve iç sesle aç; günlük belirli bir güne ait mahrem bir kayıttır.","Olaydan çok, olayın uyandırdığı DUYGULARA odaklan.","Kendine sorular sor ve çelişkili hisleri tart; iç ses böyle kurulur.","Okura ASLA seslenme; günlük yalnızca yazarın kendisine yazılır."],"k":"ipucu","t":"note","title":"Günlükte içtenliği kurmak"},{"x":"Sık Hatalar ve Değerlendirici Gözü","t":"h"},{"t":"p","x":"En sık hata günlüğü bloga çevirmektir: okura seslenmek, 'you' demek, birini ikna etmeye çalışmak. Günlük yalnızca yazarın kendisine yazılır; okur çağrısı türü bozar ve Criterion C'yi düşürür. İkinci hata, olayı kuru biçimde raporlamak ve duyguya hiç girmemektir; günlüğün kalbi iç dünyadır, olay yalnızca bahanedir. Üçüncü hata, duyguları tek düze ve yüzeysel bırakmaktır ('I was happy. It was nice.'); duygular çeşitli ve derinlemesine işlenmelidir. Değerlendirici Criterion C için gerçek bir iç sesi ve mahrem tonu, Criterion B için duyguların derinlemesine işlenmesini, Criterion A için ise ince nüanslı, çeşitli bir dili arar."},{"x":"Farklı Ruh Halleri, Farklı Günlükler","t":"h"},{"x":"Günlüğün tonu, o günkü ruh haline göre tamamen değişir ve bu esneklik türün zenginliğidir. Sevinçli bir günlük hızlı, kesik ve ünlem dolu cümlelerle akar; kırgın bir günlük ağır, uzun ve sorularla dolu cümlelerle sürüklenir; kararsız bir günlük ise ileri geri gidip gelen, kendini düzelten bir iç sesle ilerler. Görevdeki duygusal bağlamı doğru okumak ve ona uygun bir ton kurmak, Criterion C'de kavramsal anlayışın önemli bir parçasıdır. Yazmadan önce kendine sor: bu günlüğü yazan kişi hangi ruh halinde ve bu ruh hali cümlelerin ritmine nasıl yansımalı? Ton ile içerik uyumlu olduğunda, günlük gerçek ve inandırıcı olur.","t":"p"},{"x":"Günlükte kapanış, çözülmemiş bir duyguyla veya kırılgan bir umutla bitmek zorunda değildir ama genellikle bir iç dinginleşme ya da bir soruyla sonlanır. Diğer türlerin aksine günlük net bir sonuç veya çağrı sunmak zorunda değildir; hayat gibi, açık uçlu kalabilir. 'Belki yarın daha anlaşılır olur' türünden bir kapanış, iç sesin doğallığını korur. Bu açık uçluluk zayıflık değil, türün doğasıdır; günlük bir sonuç metni değil, bir an metnidir. Kapanışta yeni bir olay açma; onun yerine o günün duygusal yükünü bir cümlede topla ve iç sesi son bir kez duyur.","t":"p"},{"t":"note","k":"ipucu","title":"Güçlü bir günlük için son kontrol","lines":["Tarih ve iç ses açılışı var mı?","Olaydan çok duyguya odaklandım mı, çelişkili hisleri tarttım mı?","Okura hiç seslenmedim, tamamen içe dönük kaldım mı?","Duygu kelimelerim çeşitli mi, ton ruh haliyle uyumlu mu?"]},{"x":"Duyguyu Derinlemesine İşlemek","t":"h"},{"t":"p","x":"Günlüğün en yüksek puanlı hali, duyguları yalnızca adlandıran değil, onları tartan ve keşfeden günlüktür. Yüzeysel bir günlük 'I was happy and then I was sad' der ve geçer; derin bir günlük duygunun katmanlarını açar: 'I thought getting the part would feel like pure joy. Instead, the happiness lasted about a minute before a cold wave of doubt washed over it. Am I really ready for this? Or did they just make a mistake?' Bu tür bir iç sorgulama, günlüğü bir duygu listesinden gerçek bir iç yolculuğa çevirir. Çelişkili duyguları bir arada tutmak (aynı anda hem mutlu hem korkmuş olmak) insanı gerçek kılar ve Criterion B'de fikir derinliğini gösterir. Duygularını basit etiketlerle geçme; onların içine gir ve nereden geldiklerini sorgula."},{"x":"Günlükte zaman ve düşünce akışı da bir imzadır. Yazar geçmişe döner ('This morning felt like a lifetime ago'), şimdiki ana çakılır ('My hands are still shaking') ve geleceğe endişeyle bakar ('What will tomorrow bring?'). Bu zamansal gidiş gelişler, iç sesin doğal dalgalanmasını yansıtır ve Criterion A için çeşitli zaman kiplerini doğal biçimde kullanma fırsatı verir. Ayrıca günlük, düşüncenin ham akışını yansıttığı için ani çağrışımlara, yarım kalan cümlelere ve kendine kesilen sözlere izin verir; bu ham nitelik, aşırı cilalı bir metinden daha inandırıcıdır. Ancak ham olmak, dilbilgisel özensizlik demek değildir; iç ses düzensiz görünse de dil doğru kalmalıdır.","t":"p"},{"t":"h","x":"Günlük Becerisinin Diğer Bölümlere Katkısı"},{"t":"p","x":"Günlük, iç dünyayı ince nüanslarla ifade etmeyi öğretir ve bu duygusal dil zenginliği sınavın her yerinde işe yarar. Paper 2 okuma bölümünde günlükler ve kişisel yansıma metinleri çıkabilir; iç sesin işaretlerini ve duygusal tonu tanıyan öğrenci, yazarın ruh halini ve niyetini sorularda daha isabetli okur. Individual Oral'da ise bir görselin veya alıntının uyandırdığı duyguları ifade etmek sık gerekir; günlükte geliştirdiğin duygu kelime dağarcığı ve iç sorgulama alışkanlığı, sözlü sınavda düşüncelerini derinlemesine ifade etmeni sağlar. Böylece içe dönük ve nüanslı bir dil, hem yazma hem konuşma hem okuma anlayışına katkı sunar."},{"t":"p","x":"Günlük ayrıca öz farkındalık ve dürüstlük gerektirir; bu da onu diğer türlerden ayıran şeydir. Diğer türlerde bir kitleyi etkilemeye, ikna etmeye veya bilgilendirmeye çalışırsın; günlükte ise yalnızca dürüst olmaya çalışırsın. Bu dürüstlük, paradoksal biçimde, değerlendiriciyi en çok etkileyen şeydir; çünkü gerçek bir iç sesin sahiciliğini taklit etmek zordur. Günlük yazarken 'değerlendirici bunu okuyacak' kaygısını bir kenara bırak ve gerçekten kendine yazıyormuş gibi yaz; bu zihniyet, en inandırıcı ve en yüksek puanlı günlükleri üretir. İçtenlik, günlüğün hem konusu hem de en güçlü aracıdır."},{"t":"p","x":"Değerlendiricinin gözünden güçlü bir günlük, sahici bir iç sesle tanınır; sanki gerçekten kimsenin okumayacağı bir sayfaya dökülmüş gibidir. Bu sahiciliği kurmanın yolu, duyguları dürüstçe ve nüanslı biçimde işlemek, okura hiç seslenmemek ve iç sorgulamayı canlı tutmaktır. Yazarken kendini yargılamayı bırak ve gerçekten kendine yazıyormuş gibi düşün; bu zihniyet, en inandırıcı günlükleri üretir. Günlük, gösterişin değil dürüstlüğün türüdür; ne kadar içten olursan, o kadar güçlü olur."},{"t":"p","x":"Temayı günlük merceğinden çerçevelemek, büyük bir konuyu bir bireyin iç deneyimine indirgemektir. 'Identities' teması altında bir kimlik konusu verildiğinde, bunu bir tartışma olarak değil, yazarın kendi kimliğiyle boğuştuğu mahrem bir an olarak yazarsın. Tema ne olursa olsun, onu yazarın iç dünyasının bir sarsıntısı olarak çerçevele. Zaman ve kelime disiplinini koru: duyguları derinlemesine işle ama dağılma, kelime bandında kal ve sona iç ses tutarlılığını kontrol için vakit bırak. Günlük, English B'nin en içten ve en kişisel türüdür; onu doğru yazmak, dilden önce dürüstlük ve öz farkındalık ister. Metin türü kurallarını, kelime sınırlarını ve register beklentilerini güncel resmi IB English B Guide'dan doğrula."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Günün olaylarını ve kişisel duyguları özel olarak kaydetmek, yansıtmak."], ["Kitle", "Yalnızca yazan kişi (özel, mahrem)."], ["Register / Ton", "Çok kişisel, samimi ve düşünsel. Birinci tekil şahıs."], ["Yapı", "Tarih, günün olayı (geçmiş zaman anlatı), o an hissedilenler, geleceğe dair umut veya kaygı."], ["Tipik özellikler", "Tarih, birinci şahıs, geçmiş anlatı + şimdiki duygular, iç ses, samimi ve dağınık düşünceler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Tarihi yaz (Tuesday, 14 May gibi).", "2. Günün seni en çok etkileyen olayını seç.", "3. Ne olduğunu geçmiş zamanla kısaca anlat.", "4. O AN ne hissettiğini yansıt (şaşkınlık, korku, sevinç).", "5. İçindeki çelişkiyi veya çatışmayı göster (hem sevindim hem korktum).", "6. Geleceğe dair bir umut veya kaygıyla bitir.", "7. Son kontrol: tarih + birinci şahıs + olay + duygu + yansıtma var mı?"]}, {"t": "given", "title": "Birinci örnek (mutlu sürpriz)", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't quite know how I feel about it."}, {"t": "given", "title": "İkinci örnek (zor bir gün, farklı bağlam)", "x": "Thursday, 2 November\n\nI don't even want to write tonight, but I promised myself I would. Today I said goodbye to this house for the last time. The empty rooms looked so strange, like a photograph of a place I only dreamed. I keep telling myself a new city means a new start, and part of me almost believes it. But right now, sitting on a box in a bare room, all I can feel is the shape of everything I am leaving behind."}, {"t": "wizard", "wt": "diary", "ptitle": "Görev", "prompt": "Hayatında önemli bir kararın verildiği veya beklenmedik bir şeyin olduğu bir günü düşün. O günkü olayları ve o an hissettiklerini yansıtan bir günlük girişi yaz.", "target": 250, "check": ["Tarihle başladım ve birinci tekil şahıs kişisel bir ses kullandım.", "Sadece olayları değil, o an hissettiklerimi ve iç düşüncelerimi yansıttım (Criterion C).", "Prompt'un istediği günü ve kararı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (günlük)", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't know whether to laugh or cry.\n\nIt started like any other Tuesday. I was half asleep in maths when the office called me down. My first thought was that I was in trouble. Instead, they told me my short story had won the national competition, the one I entered months ago and had completely forgotten about.\n\nI think I just stood there. Someone shook my hand. Later, on the bus home, it finally hit me and I had to hide my face so nobody would see me grinning like a fool.\n\nWhat scares me is what comes next. There's a ceremony, a reading, an actual audience. The old me would have said no immediately. But tonight, for the first time, a small voice inside me is saying: maybe you can do this.\n\nI hope I still feel that brave in the morning."}}, {"t": "note", "k": "ipucu", "title": "Blogdan farkı", "lines": ["Günlük özeldir, kendine yazarsın; blog bir okur kitlesine yazılır. Günlükte 'you' ile okura seslenmezsin.", "İç dünyayı, çelişkili duyguları göster. Sadece olay anlatımı değil, yansıtma (reflection) beklenir."]}]}, {"id": "t-interview", "group": "Kitle İletişim", "name": "Röportaj (Interview)", "eyebrow": "Metin Türü", "blocks": [{"t":"h","x":"Röportaj (Interview) Nedir?"},{"t":"p","x":"Röportaj, bir kişiye sorular sorularak onun görüşlerini, deneyimlerini veya uzmanlığını ortaya çıkaran, soru-cevap düzeninde ilerleyen bir metin türüdür. Genellikle bir dergi, gazete, web sitesi veya okul yayını için hazırlanır. Diğer türlerden en belirgin farkı, iki sesin (soran ve yanıtlayan) dönüşümlü olarak yer almasıdır. Paper 1'de röportaj, bir uzmanla, bir sanatçıyla, bir gönüllüyle veya ilginç bir deneyimi olan biriyle yapılan bir söyleşi olarak çıkar ve beş temanın hepsiyle eşleşebilir. Röportajın gücü, okura başka birinin perspektifine doğrudan erişim sağlamasından gelir."},{"t":"p","x":"Röportaj yazarken iki rolü de sen kurgularsın: hem soruları soran gazeteci, hem yanıtları veren kişi. Bu, aslında bir yaratıcılık ve tutarlılık sınavıdır; yanıt veren kişinin bir kişiliği, bir sesi ve tutarlı bir bakış açısı olmalıdır. İyi bir röportaj, iki sesin de gerçek ve ayırt edilebilir olduğu, soruların yanıtları anlamlı biçimde açtığı bir metindir. Bu yüzden röportaj planlarken önce röportaj yapılan kişiyi tanımla: kim, ne yapıyor, konu hakkında ne düşünüyor? Sonra bu kişiyi ortaya çıkaracak soruları tasarla."},{"x":"Kitle, Amaç ve Register","t":"h"},{"t":"p","x":"Röportajın kitlesi, konuya veya kişiye ilgi duyan yayın okurudur. Amaç, röportaj yapılan kişinin görüşlerini, deneyimlerini veya bilgisini okura aktarmak ve onu ilgilendirmektir. Register genellikle yarı resmidir ama röportajın bağlamına göre değişebilir: bir uzmanla yapılan röportaj daha ciddi, bir gençlik dergisi için yapılan bir söyleşi daha samimi olabilir. Soruları soran gazetecinin dili nazik, meraklı ve okuru temsil eder niteliktedir; yanıt veren kişinin dili ise onun kişiliğini ve uzmanlığını yansıtır. İki sesin register'ı bağlama uygun ve tutarlı olmalıdır."},{"x":"Yapı ve İmza Öğeleri","t":"h"},{"t":"p","x":"Röportajın en belirgin imza öğesi soru-cevap düzenidir. Genellikle kısa bir giriş paragrafıyla açılır; bu giriş röportaj yapılan kişiyi ve konuyu tanıtır ('We spoke to Dr. Chen, a marine biologist, about the future of our oceans.'). Ardından sorular ve yanıtlar dönüşümlü olarak sıralanır; sorular çoğu zaman koyu veya ayırt edilebilir biçimde verilir. Sorular mantıklı bir sırayla ilerler: tanıtıcıdan derinleşene doğru. Röportaj çoğu zaman kapanış bir soruyla veya röportaj yapılan kişinin akılda kalıcı bir sözüyle biter. İmza öğeleri: tanıtıcı giriş, net soru-cevap düzeni ve iki ayırt edilebilir ses."},{"x":"İyi sorular röportajın kalitesini belirler. Zayıf sorular evet-hayır ile yanıtlanır ve konuşmayı öldürür ('Do you like your job?'). Güçlü sorular açık uçludur ve yanıt vereni açılmaya davet eder ('What first drew you to marine biology, and what keeps you there?'). Sorular ayrıca birbirini takip etmeli; bir yanıt bir sonraki soruyu doğal biçimde açmalıdır. Bu akış, röportajı bir soru listesinden gerçek bir sohbete dönüştürür ve Criterion B'de fikir gelişimini güçlendirir.","t":"p"},{"t":"h","x":"Dil ve Üslup"},{"x":"Röportaj dili iki sesi ayırt edici olmalıdır. Gazetecinin soruları kısa, net ve meraklıdır; okurun merak edeceği şeyleri sorar. Yanıt verenin cevapları ise daha uzun, kişisel ve içeriklidir; onun sesini, deneyimini ve bakış açısını taşır. Bu iki sesin dili farklı olmalı ki okur kimin konuştuğunu hissetsin. Criterion A için röportaj, iki farklı sesi ve register'ı yönetme becerini gösterir; soru dilini ve yanıt dilini çeşitlendirmek dil hakimiyetini kanıtlar. Yanıtlarda somut örnekler, anekdotlar ve kişisel detaylar, röportajı canlı ve inandırıcı kılar.","t":"p"},{"t":"h","x":"Çözümlü Model Örnek"},{"t":"p","x":"İyi bir röportaj şöyle işler: kısa bir giriş kişiyi tanıtır; sonra sorular açılır. 'Q: You gave up a career in finance to plant trees. What made you take such a leap?' Bu soru açık uçlu, meraklı ve okurun da merak edeceği türdendir. Yanıt kişiseldir ve bir hikaye anlatır: 'A: Honestly, I was miserable. One morning I looked at my screen full of numbers and realised I hadn't touched soil in years...' Sonraki soru bu yanıttan doğar ('And was it as freeing as you hoped?'). Röportaj, kişinin akılda kalıcı bir sözüyle kapanır. Yarı resmi register ve net soru-cevap düzeni tutarlı (C), yanıtlar somut hikayelerle geliştirilmiş (B), iki ses ayırt edilebilir ve dil çeşitli (A)."},{"title":"Röportajı canlı kılmak","k":"ipucu","t":"note","lines":["Kısa bir tanıtıcı girişle kişiyi ve konuyu duyur.","Açık uçlu sorular sor; evet-hayır soruları konuşmayı öldürür.","Soruları birbirine bağla; bir yanıt bir sonraki soruyu açsın.","İki sesi ayırt edici kıl: soru dili kısa ve meraklı, yanıt dili kişisel ve içerikli."]},{"t":"h","x":"Sık Hatalar ve Değerlendirici Gözü"},{"x":"En sık hata, soruları evet-hayır ile yanıtlanacak biçimde kurmaktır; bu, yanıtları kısa ve içeriksiz bırakır ve Criterion B'yi düşürür. İkinci hata, iki sesi ayırt edilemez kılmaktır; hem gazeteci hem yanıt veren aynı sesle konuşursa röportaj yapaylaşır. Üçüncü hata, tanıtıcı girişi atlamaktır; okur kimi ve neyi okuduğunu bilmeli. Dördüncü hata, soruların rastgele sıralanmasıdır; iyi bir röportaj mantıklı bir akışla derinleşir. Değerlendirici Criterion C için net soru-cevap düzenini ve tanıtıcı girişi, Criterion B için yanıtların somut biçimde geliştirilmesini, Criterion A için ise iki ayırt edilebilir sesi ve çeşitli dili arar.","t":"p"},{"x":"Soru Tasarımı: Röportajın Motoru","t":"h"},{"t":"p","x":"Bir röportajın kalitesi, büyük ölçüde sorularının kalitesiyle belirlenir; iyi sorular iyi yanıtları doğurur. Soruları tasarlarken çeşitlilik hedefle: bazı sorular geçmişe bakar ('What first drew you to this?'), bazıları şimdiye ('What does a typical day look like now?'), bazıları geleceğe ('Where do you see this going?'). Bazı sorular olgu ister, bazıları duygu ve görüş. Bu çeşitlilik, röportajı tek düze bir sorgudan çok yönlü bir portreye çevirir. Ayrıca zor veya kışkırtıcı bir soru ('Some people say this is naive — how do you respond?') röportaja derinlik katar ve yanıt verenin gerçek bakış açısını ortaya çıkarır. Soruları rastgele değil, bir yolculuk gibi tasarla: tanıtımdan derinliğe, olgudan anlama doğru."},{"x":"Röportajın girişi ve kapanışı da özen ister. Giriş, okurun neden bu kişiyi ve bu konuyu umursaması gerektiğini kısaca açıklamalıdır; röportaj yapılan kişinin neden ilginç veya önemli olduğunu bir iki cümlede kur. Kapanış ise röportaja bir tamlık hissi vermelidir; bunu ya güçlü, akılda kalıcı bir yanıtla ya da geleceğe bakan bir soruyla yapabilirsin. Zayıf bir röportaj aniden, ortada kesilir gibi biter; güçlü bir röportaj ise okuru düşündüren bir sözle kapanır. Bu çerçeveleme, röportajı dağınık bir soru dizisinden özenle kurulmuş bir metne dönüştürür.","t":"p"},{"t":"h","x":"İki Sesi İnandırıcı Kurmak"},{"t":"p","x":"Röportajın en zorlu ama en ödüllendirici tarafı, iki ayrı insanı tek bir metinde canlandırmaktır. Gazetecinin sesi meraklı, nazik ve okuru temsil eder; sanki okurun aklındaki soruları soruyormuş gibidir. Yanıt verenin sesi ise kişisel, deneyimli ve tutarlı bir bakış açısına sahiptir; onun geçmişi, tutkusu ve dünya görüşü yanıtlarına sinmelidir. Bu iki sesi ayırt edici kılmak için yanıt verene bir kişilik ver: belki mütevazı ve sıcaktır, belki tutkulu ve kararlıdır. Yanıtlarında bu kişilik tutarlı görünmelidir. Okur, kimin konuştuğunu isim etiketine bakmadan tondan anlayabilmelidir; işte gerçek bir röportaj bu ayrımı başarır ve Criterion A'da iki register'ı yönetme becerini kanıtlar."},{"t":"p","x":"Yanıtları geliştirmek, röportajın Criterion B karnesidir. Zayıf bir yanıt genel ve kısadır ('Yes, I enjoy my work a lot'); güçlü bir yanıt somut bir anekdot, bir örnek veya bir duygu içerir ('The best moment? A child once handed me a drawing of the tree we'd planted together — I keep it on my desk to this day'). Somut detaylar yanıtları inandırıcı ve akılda kalıcı kılar. Ayrıca yanıtlar birbirini beslemeli; iyi bir röportajda bir yanıt yeni bir merak uyandırır ve gazeteci onu takip eder. Bu doğal akış, röportajı bir soru listesinden yaşayan bir sohbete dönüştürür ve okuru sonuna kadar tutar."},{"t":"h","x":"Röportaj Becerisinin Diğer Bölümlere Katkısı"},{"t":"p","x":"Röportaj yazmak, farklı sesleri ve bakış açılarını yönetmeyi öğretir ve bu beceri sınavın diğer bölümlerinde de değer taşır. Paper 2 okuma bölümünde röportajlar sık çıkar; soru-cevap düzenini ve iki sesi tanıyan öğrenci, kimin ne söylediğini ve yanıtların ne ima ettiğini daha isabetli çözer. Paper 2 dinleme bölümünde de röportajlar ve söyleşiler ses kaydı olarak gelir; röportaj yapısını tanımak, konuşmacıları ayırt etmeni ve soruları takip etmeni kolaylaştırır. Individual Oral'da ise öğretmenle bir sohbet yürütürsün; röportajda geliştirdiğin 'soruyu anlayıp gelişterek yanıtlama' ve 'yanıtı somut örnekle destekleme' becerisi, tam da bu etkileşimde işe yarar."},{"x":"Röportaj ayrıca empati ve bakış açısı alma becerisi gerektirir; başka birinin dünyasına girip onun sesini kurmak, dil kadar hayal gücü de ister. Bu beceri, English B'nin genel amacıyla (farklı kültürleri ve perspektifleri anlamak) doğrudan örtüşür. Röportaj yazarken kendine sor: bu kişi kim, neyi önemsiyor, dünyayı nasıl görüyor? Bu soruların yanıtları, yanıt verenin sesini gerçek kılar. İyi bir röportaj yazan öğrenci, yalnızca dil değil, insan anlayışı da sergiler; bu da onu English B'nin en zengin ve en yaratıcı türlerinden biri yapar.","t":"p"},{"x":"Değerlendiricinin gözünden güçlü bir röportaj, net soru-cevap düzeni, ayırt edilebilir iki ses ve somut örneklerle geliştirilmiş yanıtlarla tanınır. Değerlendirici Criterion C için tanıtıcı girişi ve düzenli yapıyı, Criterion B için yanıtların gerçek içerikle dolu olmasını, Criterion A için ise iki sesin dilsel farkını ve genel çeşitliliği arar. Yazarken hem gazeteci hem de yanıt veren olarak düşün; birinin merakını, diğerinin deneyimini eşit özenle kur. Yapay, tek sesli bir metin değil, iki gerçek insanın karşılaşması hedefle. Bu ikili canlılık, röportajı English B'nin en yaratıcı türlerinden biri yapar ve doğru kurulduğunda üç kriterde de fark yaratır.","t":"p"},{"t":"p","x":"Temayı röportaj merceğinden çerçevelemek, bir konuyu bir kişinin deneyimi ve görüşü üzerinden açmaktır. 'Sharing the planet' teması altında çevre verildiğinde, bunu bir uzmanla veya bir aktivistle yapılan bir söyleşi olarak kurgularsın; tema, o kişinin sesinden hayat bulur. Röportaj yapılan kişiyi ve onun bakış açısını iyi tasarla; tema, somut bir insanın deneyiminde somutlaşsın. Zaman ve kelime disiplinini koru: yanıtları somut örneklerle geliştir ama dağılma, kelime bandında kal ve sona iki sesin tutarlılığını kontrol için vakit bırak. Röportaj, dil kadar hayal gücü ve empati de gerektiren, iki insanın karşılaşmasını kağıda taşıyan yaratıcı bir türdür; onu ustaca kurmak, hem dil hem de insan anlayışı sergiler. Metin türü kurallarını, kelime sınırlarını ve register beklentilerini güncel resmi IB English B Guide'dan doğrula."},{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kişiden bilgi veya görüş almak ve okura aktarmak."], ["Kitle", "Bir dergi, gazete veya sitenin okuru."], ["Register / Ton", "Yarı resmi. Sorular net; cevaplar doğal, konuşma dilinde."], ["Yapı", "Kişiyi tanıtan kısa giriş paragrafı, ardından soru-cevap dizisi, kısa kapanış."], ["Tipik özellikler", "Röportajcı ve konuşan belirtilir, doğrudan konuşma, konu odaklı sorular, kişisel cevaplar."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Röportaj yapılan kişiyi ve konuyu kısa bir girişle tanıt.", "2. Sorular konuya odaklansın; açık uçlu olsun (What/Why/How).", "3. Soru-cevap biçimini kur: 'Interviewer:' / 'İsim:'.", "4. Cevapları doğal, konuşma dilinde yaz (birinci şahıs).", "5. Bir soru bir öncekinden doğsun (akış olsun).", "6. Kısa bir kapanış cümlesiyle bitir.", "7. Son kontrol: tanıtım + net sorular + doğal cevaplar + soru-cevap biç
