nkompliziert: ..."], ["Maliyet", "Die Kosten wären gering, da ..."], ["Koşul", "Wenn die Schule dies einführte, würde ..."], ["Nazik onay çağrısı", "Ich bitte Sie höflich, das Programm ein Halbjahr lang zu erproben."], ["Sonuç", "Insgesamt wäre dies eine kleine Investition mit großem Nutzen."]]}, {"t": "p", "x": "Konjunktiv II'yi güvenle kullanmak bu türde belirleyicidir. 'würde + Infinitiv' neredeyse her varsayım cümlesinde işe yarar ve en güvenli yoldur: 'Das würde die Motivation steigern.' Ancak 'sein', 'haben' ve modal fiillerde doğrudan biçimleri tercih et: 'wäre' (nicht 'würde sein'), 'hätte' (nicht 'würde haben'), 'könnte', 'müsste', 'sollte'. 'Die Umsetzung würde sein einfach' yanlıştır; doğrusu 'Die Umsetzung wäre einfach'tır. Ayrıca öneri bildiren yan cümlelerde fiil sona gider: 'Ich schlage vor, dass die Schule ein Programm einrichtet.'"}, {"t": "note", "k": "ipucu", "title": "Konjunktiv II: varsayım kipinin doğru kullanımı", "lines": ["Genel varsayım: würde + Infinitiv. 'Ein Recyclingsystem würde Müll reduzieren.'", "sein/haben/modal doğrudan: wäre, hätte, könnte, sollte. 'Die Kosten wären gering.', 'Die Schule könnte profitieren.'", "'würde sein' KULLANMA: 'wäre' de. Aynı şekilde 'würde haben' yerine 'hätte'.", "Koşul cümlesi: 'Wenn ... einführte/hätte, würde ...' (wenn-cümlesinde fiil sonda).", "Öneri yan cümlesi: 'Ich schlage vor, dass wir ein Programm einrichten.' (einrichten sonda)."]}, {"t": "given", "title": "Çözümlü mini-model: fayda ve gerçekçi plan", "x": "Vorteile\nEin von Schülern geleitetes Nachhilfeprogramm würde gleich doppelt wirken. Schwächere Schüler könnten ihre Noten in einer entspannten Umgebung verbessern, und die Tutoren würden ihr eigenes Wissen vertiefen sowie wertvolle Führungskompetenzen entwickeln.\n\nUmsetzung\nJedes Halbjahr würden Fachlehrer freiwillige Tutoren mit jüngeren Schülern zusammenbringen. Die Treffen fänden dienstags und donnerstags in der Bibliothek statt, betreut von einer Lehrkraft. Die Kosten wären gering, da nur eine Aufsicht nötig wäre."}, {"t": "p", "x": "Bu iki bölüm neden ikna edici? Başlıklar (Vorteile, Umsetzung) yapıyı gösteriyor. Fayda cümleleri baştan sona Konjunktiv II: 'würde ... wirken', 'könnten ... verbessern', 'würden ... vertiefen ... entwickeln' - varsayımsal ama net. 'sowohl ... als auch' benzeri 'gleich doppelt' ifadesi çift faydayı vurguluyor. Umsetzung bölümü gerçekçi: kim (Fachlehrer), ne zaman (jedes Halbjahr, dienstags und donnerstags), nerede (in der Bibliothek). 'Die Treffen fänden ... statt' cümlesinde ayrılabilen fiil 'stattfinden'in Konjunktiv II biçimi (fänden ... statt) kusursuz. Maliyet dürüst: 'Die Kosten wären gering, da nur eine Aufsicht nötig wäre' - iki Konjunktiv II (wären, wäre) ve 'da' yan cümlesinde fiil sonda. Hem hayal hem plan - dengeli bir Vorschlag budur."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Kesinlik + dizim: 'Das wird helfen den Schülern.' YANLIŞ -> 'Das würde den Schülern helfen.' DOĞRU.", "'würde sein': 'Die Umsetzung würde einfach sein.' zayıf -> 'Die Umsetzung wäre einfach.' DOĞRU.", "Öneri yan cümlesi: 'Ich schlage vor, dass wir machen ein Programm.' YANLIŞ -> 'Ich schlage vor, dass wir ein Programm einrichten.' DOĞRU.", "Çoğul uyum: 'Die Kosten wäre gering.' YANLIŞ -> 'Die Kosten wären gering.' DOĞRU.", "Plansız öneri: sadece faydayı saymak zayıf -> gerçekçi bir Umsetzung ve Kosten bölümü ekle DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Vorschlag (çoğunlukla HL) görevini gördüğünde önce ne önereceğini tek cümlede netleştir - somut, uygulanabilir bir fikir. Sonra biçimsel iskeleti kur: Titel (Vorschlag: ...), Einleitung, ve başlıklı bölümler Vorteile, Umsetzung, Kosten. Einleitung'da fikri özetle: ne öneriyorsun ve neden? Vorteile'de kime, nasıl fayda sağladığını göster; tek bir gruba değil, mümkünse birden fazla tarafa ('sowohl ... als auch ...'). Umsetzung bölümü çoğu adayın atladığı ama en çok fark yaratan yerdir: gerçekçi adımlar ver - kim, ne zaman, nerede? Kosten bölümünde maliyeti dürüstçe ele al; düşük maliyet ya da sponsor, öneriyi güçlendirir. Bu türde en çok puanı iki yerde kaybedersin. Birincisi gerçekçilik: yalnızca coşkulu faydalar sıralamak, plansız bir hayal gibi durur; bir Umsetzung ve Kosten bölümü öneriye güven katar. İkincisi Konjunktiv II: olası sonuçları varsayım kipiyle kur ('Das würde die Motivation steigern', 'Die Umsetzung wäre einfach'), ve 'würde sein' yerine 'wäre', 'würde haben' yerine 'hätte' de. HL'de uzunluk 450-600 kelime olduğundan her bölümü yeterince derinleştir; yüzeysel bir taslak bu bandı doldurmaz. Son bir dakikada denetle: fikir net mi, fayda-plan-maliyet üçlüsü var mı, varsayımlar Konjunktiv II ile mi kurulu? Değerlendirici bu türde ikna ile gerçekçiliğin dengesini arar; sen de faydayı somutlayıp planı gerçekçi tutarak hem Botschaft hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "vorschlag", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Vorschlag an die Schulleitung für eine neue AG, Veranstaltung oder ein neues System. Erkläre die Idee, die Vorteile und einen realistischen Umsetzungsplan. (HL)", "target": 300, "check": ["Titel ve Einleitung'da öneriyi net özetledim.", "Vorteile ve gerçekçi bir Umsetzung planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille Aufgabe'yi karşıladım (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (Vorschlag)", "x": "Vorschlag: Ein Nachhilfeprogramm unter Schülern\n\nEinleitung\nDieser Vorschlag empfiehlt, ein Programm einzurichten, bei dem ältere Schüler jüngeren helfen, die in den Kernfächern Schwierigkeiten haben. Es würde zweimal pro Woche nach der Schule stattfinden und die Schule fast nichts kosten.\n\nVorteile\nSchwächere Schüler könnten ihre Noten in einer entspannten Umgebung verbessern. Gleichzeitig würden die Tutoren ihr eigenes Wissen vertiefen und Führungskompetenzen entwickeln, die auch Universitäten schätzen.\n\nUmsetzung\nJedes Halbjahr würden Fachlehrer freiwillige Tutoren mit jüngeren Schülern zusammenbringen. Die Treffen fänden dienstags und donnerstags in der Bibliothek statt, betreut von einer Lehrkraft.\n\nKosten\nDie einzigen Kosten sind die Aufsicht, die vorhandenes Personal übernehmen könnte. Ich bitte die Schule höflich, das Programm ein Halbjahr lang zu erproben."}}, {"t": "note", "k": "dikkat", "title": "Berichtten farkı", "lines": ["Bericht mevcut durumu inceler; Vorschlag gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-anleitung", "group": "Profesyonel", "name": "Anleitung (Yönerge)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net. Genelde Imperativ (Nimm, Füge ... hinzu) veya 'man'."], ["Yapı", "Titel, gerekli malzemeler (Du brauchst / Man braucht), numaralı adımlar, ipuçları/uyarılar."], ["Tipik özellikler", "Imperativ, numaralı adımlar, sıra bağlaçları (Zuerst, Dann, Zum Schluss), kısa net cümleler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir Titel yaz (Wie man ... / Anleitung: ...).", "2. Gerekli malzemeleri listele (Du brauchst: ...).", "3. Adımları mantıksal sıraya koy; her adım tek bir eylem olsun.", "4. Her adımı Imperativ ile başlat (Schneide, Gib ... hinzu).", "5. Sıra bağlaçları kullan (Zuerst, Dann, Danach, Zum Schluss).", "6. Gerekirse bir Tipp veya uyarı ekle (Achtung: ...).", "7. Son kontrol: Titel + malzemeler + numaralı adımlar + Imperativ var mı?"]}, {"t": "given", "title": "Birinci örnek (menemen)", "x": "Wie man ein einfaches Menemen kocht\n\nDu brauchst: drei Eier, zwei Tomaten, eine grüne Paprika, etwas Olivenöl, Salz und eine Scheibe Brot.\n\n1. Zuerst wasche die Tomaten und die Paprika. Schneide die Paprika in kleine Stücke."}, {"t": "given", "title": "İkinci örnek (dijital, farklı bağlam)", "x": "Wie man ein neues E-Mail-Konto einrichtet\n\nDu brauchst: ein Handy oder einen Computer, eine Internetverbindung und ein sicheres Passwort.\n\n1. Öffne zuerst den App-Store und lade die E-Mail-App herunter.\n2. Tippe auf 'Konto erstellen' und gib deinen Namen ein.\n3. Wähle danach einen Benutzernamen und ein Passwort mit mindestens acht Zeichen.\n4. Gib deine Handynummer ein, damit die App einen Code senden kann.\n5. Zum Schluss tippe den Code ein und tippe auf 'Fertig'. Tipp: Teile dein Passwort mit niemandem."}, {"t": "h", "x": "Derinlemesine: Anleitung (yönerge) ustalığı"}, {"t": "p", "x": "Anleitung, bir işin nasıl yapılacağını adım adım öğreten metindir - bir tarif, bir kurulum rehberi, bir el işi projesi. Bu türün ruhu 'netlik'tir: okur bir işi ilk kez yapacaktır ve senin görevin onu hiç şaşırtmadan, sırayla, adım adım sonuca götürmektir. Anleitung genellikle en kısa ve en teknik türlerden biridir, ama bu onu kolay yapmaz; tam tersine, her fazladan kelime kafa karışıklığı riski taşır. IB Deutsch B'de bu tür, öğrencinin emir kipini (Imperativ), ayrılabilen fiilleri (trennbare Verben) ve sıra bağlaçlarını (zuerst, dann, zum Schluss) doğru kullanma becerisini sınar. İyi bir Anleitung, okuru yalnız bırakmaz."}, {"t": "p", "x": "Kriterler açısından Anleitung ölçülü ama katı bir türdür. Criterion C (Konzeptverständnis) biçimi arar: net bir Titel, gerekli malzemelerin listesi (Du brauchst / Man braucht), numaralı adımlar ve Imperativ. Bir malzeme listesi ya da numaralandırma eksikse yapı zayıflar. Criterion B (Botschaft) adımların tam, sıralı ve eksiksiz olup olmadığına bakar: okur bu adımları takip ederek gerçekten sonuca ulaşabilir mi, yoksa bir adım atlanmış mı? Criterion A (Sprache) ise Imperativ biçimlerinin doğruluğunu (özellikle düzensiz fiiller: nehmen -> nimm, geben -> gib) ve ayrılabilen fiillerin doğru bölünüp bölünmediğini ('Gib das Salz hinzu') ölçer."}, {"t": "p", "x": "İskelet basittir: net bir Titel (Wie man ... / Anleitung: ...), gerekli malzemeler listesi, mantıksal sıraya konmuş numaralı adımlar ve gerekiyorsa bir ipucu ya da uyarı. Altın kural şudur: her adım TEK bir eylem içersin. 'Schneide die Tomaten und koche sie und gib Salz hinzu' üç ayrı adımdır, tek bir cümleye sıkıştırılmamalıdır. Adımları sıra bağlaçlarıyla birbirine bağla - 'Zuerst', 'Dann', 'Danach', 'Anschließend', 'Zum Schluss' - böylece okur nerede olduğunu her an bilir. Kısalık ve tek-eylem disiplini, bu türün hem netliğini hem de Criterion C puanını belirler."}, {"t": "p", "x": "Bu türün dilbilgisel kalbi emir kipidir (Imperativ). Almancada 'du' için Imperativ genellikle fiilin gövdesidir, kişi eki atılır: 'du machst' -> 'Mach!', 'du kommst' -> 'Komm!'. Ama düzensiz (starke) fiillerde sesli değişir ve bunu bilmek şarttır: 'nehmen' -> 'Nimm!', 'geben' -> 'Gib!', 'lesen' -> 'Lies!', 'sehen' -> 'Sieh!'. Ayrılabilen fiiller (trennbare Verben) emir kipinde de bölünür ve ön ek cümlenin sonuna gider: 'hinzugeben' -> 'Gib das Salz hinzu', 'aufschneiden' -> 'Schneide die Paprika auf', 'umrühren' -> 'Rühre die Masse gut um'. Uzunluk SL için 250-400 kelime; Anleitung genellikle bu bandın alt ucunda, yoğun ve nettir."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "İşi adlandırır", "Wie man einen kleinen Balkongarten anlegt"], ["Materialliste", "Gerekli olanı listeler", "Du brauchst: Töpfe, Blumenerde, Samen und Wasser."], ["Schritte (adımlar)", "Sıralı, tek-eylem adımlar", "1. Fülle zuerst die Töpfe mit Erde. 2. Streue dann die Samen darauf."], ["Verbindungswörter", "Sırayı gösterir", "Zuerst ... Dann ... Danach ... Zum Schluss ..."], ["Tipp / Warnung", "Uyarı ya da ipucu ekler", "Tipp: Zu viel Wasser schadet den jungen Pflanzen."]]}, {"t": "note", "k": "ipucu", "title": "Netliği kuran alışkanlıklar", "lines": ["Her adım tek eylem: bir cümlede bir Imperativ, fazlasını bölerek yaz.", "Malzeme listesiyle başla: 'Du brauchst: ...' okura hazırlık verir.", "Sıra bağlaçları kullan: Zuerst / Dann / Danach / Anschließend / Zum Schluss.", "Kısa ve nesnel cümleler kur; süsleme ve uzun yan cümle netliği bozar."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Malzeme listesi", "Du brauchst: ... / Man braucht: ..."], ["İlk adım", "Nimm zuerst ... / Wähle zuerst ..."], ["Sıralama", "Dann ... / Danach ... / Anschließend ..."], ["Ayrılabilen fiil", "Gib etwas Öl hinzu. / Schneide das Gemüse klein."], ["Uyarı", "Achte darauf, dass die Erde nicht zu nass wird."], ["İpucu", "Tipp: Lass den Teig zehn Minuten ruhen."], ["Son adım", "Zum Schluss ... / Zuletzt ..."], ["Kapanış ipucu", "Fertig! Guten Appetit / Viel Erfolg."]]}, {"t": "p", "x": "Imperativ ve ayrılabilen fiiller bu türde en çok hata yapılan iki alandır, o yüzden onları güvenli kullanmak seni öne çıkarır. Alternatif olarak 'man' ile de yazabilirsin ('Man nimmt zuerst zwei Eier'), ama Imperativ daha doğrudan ve tipiktir. Ayrılabilen fiilde mantık nettir: fiil çekimlenir, ayrılan ön ek cümlenin en sonuna gider. 'hinzugeben' fiilinde 'gib' başta, 'hinzu' sonda: 'Gib das Salz hinzu.' Bunu içselleştirmek, hem Anleitung'da hem de günlük Almancada işine yarar."}, {"t": "note", "k": "ipucu", "title": "Imperativ ve trennbare Verben", "lines": ["Düzenli Imperativ (du): gövde, ek atılır. 'Mach!', 'Komm!', 'Rühr(e)!'", "Düzensiz Imperativ (Vokalwechsel): nehmen -> Nimm!, geben -> Gib!, lesen -> Lies!, sehen -> Sieh!", "Ayrılabilen fiil: ön ek sona gider. 'Gib ... hinzu', 'Schneide ... auf', 'Rühre ... um'.", "man alternatifi: 'Man nimmt zuerst ...', 'Man gibt das Salz hinzu.'", "Adımlar Imperativ ile başlar; her adım tek eylem, kısa ve net."]}, {"t": "given", "title": "Çözümlü mini-model: net adımlar", "x": "Wie man einen einfachen Kräutertee zubereitet\n\nDu brauchst: frische Minze, heißes Wasser, eine Tasse und etwas Honig.\n\n1. Wasche zuerst die Minzblätter vorsichtig unter kaltem Wasser.\n2. Gib die Blätter dann in die Tasse.\n3. Übergieße sie mit heißem, aber nicht mehr kochendem Wasser.\n4. Lass den Tee etwa fünf Minuten ziehen.\n5. Rühre zum Schluss etwas Honig unter. Tipp: Nimm keinen Zucker, wenn du den frischen Geschmack behalten willst."}, {"t": "p", "x": "Bu Anleitung neden temiz işliyor? Titel net ('Wie man ... zubereitet'), malzeme listesi 'Du brauchst: ...' ile açık. Her adım numaralı ve tek eylem: yıka, koy, üzerine dök, demlenmeye bırak, karıştır. Adımlar sıra bağlaçlarıyla örülü: 'zuerst', 'dann', 'zum Schluss'. Imperativ biçimleri kusursuz - dikkat et: 'Gib die Blätter ... in die Tasse' (geben -> gib, düzensiz), 'Übergieße', 'Lass', 'Rühre ... unter' (ayrılabilen fiil unterrühren: rühre ... unter, ön ek sonda). Son cümlede bir ipucu ve 'wenn' yan cümlesi (fiil 'willst' sonda). Kısa, sıralı, eksiksiz - okur bunu takip ederek gerçekten çay yapar. Anleitung'un tek amacı budur."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Modal + mastar yerine Imperativ: 'Du musst nehmen zwei Eier.' zayıf -> 'Nimm zwei Eier.' DOĞRU.", "Ayrılan ön ek yanlış yer: 'Gib hinzu das Salz.' YANLIŞ -> 'Gib das Salz hinzu.' DOĞRU.", "Düzensiz Imperativ: 'Nehme zwei Eier.' YANLIŞ -> 'Nimm zwei Eier.' DOĞRU (nehmen -> nimm).", "Malzeme listesi eksik: doğrudan adımlara başlamak zayıf -> 'Du brauchst: ...' ile aç DOĞRU.", "Adımda çok eylem: 'Schneide und koche und würze alles.' YANLIŞ -> her eylemi ayrı numaralı adım yap DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Anleitung görevini gördüğünde önce öğreteceğin işi ve onun mantıksal adım sırasını kafanda çöz. Net bir Titel yaz ('Wie man ...'), ardından gerekli malzemeleri listele ('Du brauchst: ...'). Sonra adımları numaralandır ve altın kuralı uygula: her adım TEK bir eylem içersin. 'Schneide, koche und würze alles' üç ayrı adımdır; onları birleştirme. Adımları sıra bağlaçlarıyla ör - 'Zuerst', 'Dann', 'Danach', 'Zum Schluss' - böylece okur her an nerede olduğunu bilir. Bu türde en çok puanı iki dilbilgisi alanında kaybedersin. Birincisi emir kipi (Imperativ): düzenli fiillerde ek atılır ('Mach!', 'Komm!'), ama düzensizlerde sesli değişir ve bunu bilmek şarttır ('nehmen' -> 'Nimm!', 'geben' -> 'Gib!', 'lesen' -> 'Lies!'). İkincisi ayrılabilen fiiller: emir kipinde de bölünür ve ön ek cümlenin sonuna gider ('Gib das Salz hinzu', 'Schneide die Paprika auf', 'Rühre die Masse gut um'). Cümlelerini kısa ve net tut; uzun yan cümleler netliği bozar ve bu tür için yanlış tondur. Son bir dakikada denetle: Titel ve malzeme listesi var mı, adımlar numaralı ve tek-eylem mi, her adım Imperativ ile mi başlıyor, ayrılan ön ekler doğru yerde mi? Değerlendirici bu türde eksiksiz, sıralı ve takip edilebilir bir yönerge arar; sen de tek-eylem disiplinini ve doğru emir kipini koruyarak hem Botschaft hem Konzeptverständnis hem Sprache puanını birlikte alırsın."}, {"t": "wizard", "wt": "anleitung", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Anleitung, die einem Anfänger eine Fähigkeit beibringt (ein einfaches Gericht, eine App einrichten, ein Bastelprojekt). Verwende eine Materialliste und nummerierte Schritte im Imperativ.", "target": 220, "check": ["Titel ve gerekli malzemeler listesi ekledim.", "Numaralı adımlar, Imperativ ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Anleitung)", "x": "Wie man einen kleinen Balkongarten anlegt\n\nDu brauchst: zwei oder drei Töpfe, Blumenerde, Samen, eine kleine Schaufel und Wasser.\n\n1. Wähle zuerst einen Platz auf dem Balkon, der mindestens vier Stunden Sonne bekommt.\n2. Fülle die Töpfe mit Erde, aber lass oben etwas Platz.\n3. Streue danach die Samen auf die Erde und bedecke sie leicht.\n4. Gieße vorsichtig, sodass die Erde feucht, aber nicht nass ist.\n5. Stelle die Töpfe an den sonnigen Platz.\n6. Gieße jeden zweiten Tag und warte geduldig. Zum Schluss ein Tipp: Zu viel Wasser schadet den jungen Pflanzen mehr als zu wenig."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Her adımda birden fazla eylem yazmak. Her adım tek bir Imperativ olsun.", "Sıra bağlaçlarını ve malzeme listesini atlamak. Zuerst/Dann/Zum Schluss yapıyı gösterir (Criterion C).", "Uzun, karmaşık cümleler. Anleitung kısa ve net olmalı."]}]}, {"id": "t-aufsatz", "group": "Profesyonel", "name": "Aufsatz (Deneme, SL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Einleitung (konu + tez), her biri bir fikri işleyen Hauptteil paragrafları (gerekçe + örnek), Schluss."], ["Tipik özellikler", "Net tez, bağlaçlar (jedoch, deshalb, zum Beispiel), gerekçeli argüman, denge, Schluss."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Soruyu (Frage) çöz: seni ne hakkında görüş bildirmeye çağırıyor?", "2. Net bir tez (These) belirle.", "3. Einleitung'da konuyu tanıt ve tezini son cümlede ver.", "4. Her Hauptteil paragrafında bir fikri işle: iddia + gerekçe + örnek.", "5. Karşı görüşe de değin (Manche sagen ...), sonra dengeleyip çürüt.", "6. Schluss'ta tezi toparla; yeni bilgi ekleme.", "7. Son kontrol: These + gerekçeli paragraflar + bağlaçlar + denge + Schluss var mı?"]}, {"t": "given", "title": "Birinci örnek (sosyal medya)", "x": "Sollten soziale Medien Teil des Schullebens sein?\n\nSoziale Medien werden oft dafür verantwortlich gemacht, dass Schüler abgelenkt werden, doch sie bieten auch echte Lernchancen. Dieser Aufsatz argumentiert, dass sie, klug genutzt, in den Unterricht gehören."}, {"t": "given", "title": "İkinci örnek (giriş + tez, farklı konu)", "x": "Sollten Schulen Handys verbieten?\n\nWenige Gegenstände spalten ein Klassenzimmer so wie das Handy. Für die einen ist es ein starkes Lernwerkzeug, für die anderen die größte Ablenkung des Tages. Dieser Aufsatz argumentiert, dass Schulen Handys im Unterricht zu Recht einschränken, weil der Preis für die Konzentration größer ist als der Nutzen."}, {"t": "h", "x": "Derinlemesine: Aufsatz (deneme, SL) ustalığı"}, {"t": "p", "x": "Aufsatz, bir konuda görüş geliştirdiğin ve bu görüşü gerekçelerle savunduğun tartışma metnidir. Bu türün ruhu 'argüman'dır: burada bir hikâye anlatmaz, bir mektup yazmazsın; bir soruya (Frage) yanıt olarak net bir tez (These) kurar ve onu mantıkla, örneklerle, karşı görüşü de hesaba katarak savunursun. IB Deutsch B'de Aufsatz genellikle SL düzeyinde çıkar ve öğrencinin fikirleri mantıklı biçimde düzenleme, bağlaçlarla akıcı bir argüman örme ve dengeli bir sonuç kurma becerisini sınar. En sık yapılan hata belirsiz kalmaktır; iyi bir Aufsatz ilk paragrafta nerede durduğunu açıkça söyler."}, {"t": "p", "x": "Kriterler açısından Aufsatz'ın kalbi yapı ve mantıktır. Criterion C (Konzeptverständnis) tartışma metninin işaretlerini arar: net bir These, her biri tek bir fikri işleyen Hauptteil paragrafları, bağlaçlarla kurulmuş akış ve fikirleri toparlayan bir Schluss. Criterion B (Botschaft) argümanın gerçekten geliştirilip geliştirilmediğine bakar: her iddia bir gerekçe ve örnekle desteklendi mi, karşı görüşe değinilip dengelendi mi? Criterion A (Sprache) ise bağlaçların doğru kullanımını ve - çok önemli - bu bağlaçlardan sonra fiil dizilişini (Verbstellung) ölçer. 'deshalb', 'jedoch', 'trotzdem' cümle başındayken özne fiilden sonra gelir; bu, en sık hata yapılan noktadır."}, {"t": "p", "x": "İskelet klasiktir: Einleitung'da konuyu tanıt ve son cümlede net tezini ver; her Hauptteil paragrafında bir fikri işle (iddia + gerekçe + örnek); en az bir paragrafta karşı görüşe değin (Manche behaupten ...), sonra onu dengeleyip kendi tezini güçlendir; Schluss'ta tezi toparla, ama yeni bilgi ekleme. Olgun bir Aufsatz'ı sıradan bir yazıdan ayıran şey, karşı görüşe (Gegenargument) yer vermesidir. 'Kritiker sagen zwar, dass ..., jedoch ...' kalıbı hem dengeni hem de düşünsel olgunluğunu gösterir. Değerlendirici tek yanlı bir savunma değil, tartabilen bir zihin arar."}, {"t": "p", "x": "Bu türün dilbilgisel imzası bağlaçlar ve onların yarattığı fiil dizilişidir. Üç tür bağlacı ayırt etmek şarttır. Birincisi, cümle başında gelip özneyi fiilden sonraya iten zarf-bağlaçlar: 'deshalb', 'jedoch', 'trotzdem', 'außerdem' - 'Deshalb IST es wichtig, ...'. İkincisi, fiili cümle sonuna iten yan cümle bağlaçları: 'weil', 'obwohl', 'da', 'dass' - '..., weil viele Schüler das nicht wollen.'. Üçüncüsü, dizilişi değiştirmeyen sıralayıcılar: 'und', 'aber', 'denn', 'oder'. Bu üçünü karıştırmamak, Criterion A'da fark yaratır. Uzunluk SL için 250-400 kelime; net bir tez, iki-üç gerekçeli paragraf ve dengeli bir sonuç bu bandı rahatça doldurur."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Einleitung + These", "Konuyu tanıtır, tezi verir", "Dieser Aufsatz vertritt die Ansicht, dass verpflichtetes Engagement mehr nützt als schadet."], ["Hauptteil (argüman)", "İddia + gerekçe + örnek", "Das stärkste Argument dafür ist, dass Schüler dabei Verantwortung lernen."], ["Beispiel", "Fikri somutlar", "Wer in einem Heim hilft, lernt Empathie wie aus keinem Lehrbuch."], ["Gegenargument", "Karşı görüşe değinir", "Kritiker sagen zwar, dass Zwang der guten Tat den Wert nimmt, jedoch ..."], ["Schluss", "Toparlar, denge kurar", "Zusammenfassend nützt Engagement, mit Augenmaß angewendet, allen Seiten."]]}, {"t": "note", "k": "ipucu", "title": "Argümanı güçlendiren teknikler", "lines": ["Net tez: Einleitung'un son cümlesinde nerede durduğunu açıkça söyle.", "Her paragraf tek fikir: iddia + gerekçe (weil ...) + somut örnek (zum Beispiel ...).", "Karşı görüşe değin: 'Manche behaupten zwar ..., jedoch ...' - denge olgunluk gösterir.", "Bağlaçlarla ör: deshalb, jedoch, außerdem, trotzdem - ama fiil dizilişine dikkat et."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Tez bildirme", "In diesem Aufsatz vertrete ich die Ansicht, dass ..."], ["Argüman açma", "Ein wichtiges Argument dafür ist, dass ..."], ["Örnek verme", "Ein gutes Beispiel dafür ist ..."], ["Sonuç bağlama", "Deshalb / Aus diesem Grund ..."], ["Karşı görüş", "Manche behaupten zwar, dass ..., jedoch ..."], ["Ekleme", "Außerdem / Darüber hinaus ..."], ["Karşıtlık", "Auf der einen Seite ..., auf der anderen Seite ..."], ["Sonuç", "Zusammenfassend lässt sich sagen, dass ..."]]}, {"t": "p", "x": "Bağlaçlardan sonra fiil dizilişi, Aufsatz'ta en çok puan kazandıran ya da kaybettiren detaydır. 'deshalb', 'jedoch', 'trotzdem', 'außerdem', 'deswegen' bir cümlenin başında yer aldığında, çekimli fiil hemen ardından (2. konumda) gelir ve özne fiilden sonraya kayar: 'Jedoch ist diese Sicht zu einfach.' Buna karşılık 'weil', 'obwohl', 'da', 'dass', 'wenn' bir yan cümle başlatır ve çekimli fiili cümlenin en sonuna iter: '..., obwohl viele Schüler dagegen sind.' Bir de klasik tuzak: 'obwohl' ile 'aber' asla aynı cümlede birlikte kullanılmaz."}, {"t": "note", "k": "ipucu", "title": "Bağlaçlar ve Verbstellung", "lines": ["Zarf-bağlaç (başta): fiil 2. konumda, özne sonra. 'Deshalb ist es wichtig.', 'Jedoch bleibt ein Problem.'", "Yan cümle bağlacı: fiil sonda. 'Ich stimme zu, weil die Vorteile überwiegen.', 'obwohl es schwer ist.'", "Sıralayıcı (und/aber/denn/oder): diziliş değişmez. 'Es ist schwer, aber es lohnt sich.'", "'obwohl ... aber' TUZAĞI: ikisi bir arada kullanılmaz.", "'zwar ... aber' ve 'einerseits ... andererseits' denge kurmanın güvenli yollarıdır."]}, {"t": "given", "title": "Çözümlü mini-model: tez ve karşı görüş", "x": "Viele Schulen verlangen heute, dass Schüler eine bestimmte Zahl an Stunden für die Gemeinschaft leisten. Manche sehen darin eine unfaire Belastung; ich bin jedoch überzeugt, dass verpflichtetes Engagement, klug umgesetzt, weit mehr nützt als schadet.\n\nKritiker sagen zwar, Zwang nehme der guten Tat ihre Freiwilligkeit. Darin steckt etwas Wahres. Jedoch würden viele Schüler von allein nie beginnen, und oft machen sie später freiwillig weiter."}, {"t": "p", "x": "Bu iki paragraf neden örnek? Einleitung konuyu tanıtıyor ('Viele Schulen verlangen ...') ve son cümlede net tez veriyor: 'ich bin jedoch überzeugt, dass ... mehr nützt als schadet.' Dikkat et: 'jedoch' cümle ortasında kullanıldığında da fiil dizilişi doğru ('ich bin jedoch überzeugt'). İkinci paragraf karşı görüşle açılıyor: 'Kritiker sagen zwar, Zwang nehme ...' - burada dolaylı anlatım için Konjunktiv I (nehme) kullanılmış, ileri düzey bir doğruluk. 'Darin steckt etwas Wahres' cümlesi karşı görüşe hakkını veriyor (denge). Sonra 'Jedoch würden viele Schüler ... nie beginnen' - 'jedoch' başta, fiil (würden) hemen ardından 2. konumda. Tez, karşı görüş, denge ve kusursuz diziliş - olgun bir Aufsatz'ın çekirdeği."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["deshalb dizilişi: 'Deshalb es ist wichtig.' YANLIŞ -> 'Deshalb ist es wichtig.' DOĞRU (fiil 2. konumda).", "dass virgülü/dizilişi: 'Ich denke dass es gut ist.' YANLIŞ -> 'Ich denke, dass es gut ist.' DOĞRU.", "obwohl + aber: 'Obwohl es schwer ist, aber ich mache es.' YANLIŞ -> 'Obwohl es schwer ist, mache ich es.' DOĞRU.", "Tez eksikliği: belirsiz giriş zayıf -> Einleitung'un sonunda net bir These koy DOĞRU.", "jedoch dizilişi: 'Jedoch das ist falsch.' YANLIŞ -> 'Jedoch ist das falsch.' DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Aufsatz (çoğunlukla SL) görevini gördüğünde önce soruyu (Frage) dikkatle çöz - seni ne hakkında görüş bildirmeye çağırıyor? Sonra net bir tez (These) belirle; nerede durduğunu bilmeden yazmaya başlama. İlk iki dakikada kısaca planla: Einleitung'un son cümlesinde tezini ver, iki-üç Hauptteil paragrafının her birinde bir fikri işle (iddia + gerekçe + örnek), en az bir paragrafta karşı görüşe değin ve onu dengele, Schluss'ta tezi topar. Bu türde en çok puanı iki yerde kaybedersin. Birincisi belirsizlik: net bir tez olmadan yazı savrulur; Einleitung'da açıkça taraf ol. İkincisi bağlaçlardan sonra fiil dizilişi - bu, en sık yapılan Sprache hatasıdır. 'deshalb', 'jedoch', 'trotzdem', 'außerdem' cümle başındayken fiil hemen ardından 2. konumda gelir ('Deshalb ist es wichtig'); 'weil', 'obwohl', 'da', 'dass' ise fiili cümle sonuna iter ('..., weil viele Schüler das ablehnen'). Bir de klasik tuzak: 'obwohl' ile 'aber' asla aynı cümlede birlikte kullanılmaz. Karşı görüşe değinmek (Gegenargument) yazını olgunlaştırır: 'Manche behaupten zwar ..., jedoch ...'. Son bir dakikada denetle: net bir These var mı, her paragraf tek fikri gerekçeyle mi işliyor, bağlaçlardan sonra fiil doğru konumda mı, ve konuya dengeli mi yaklaştın? Değerlendirici bu türde mantıklı bir yapı, gerekçeli argüman ve dengeyi arar; sen de tezini erken koyup bağlaç dizilişini kontrol ederek hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "aufsatz", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Aufsatz zu dieser Frage: 'Sollten Schüler zu sozialem Engagement (Gemeinschaftsdienst) verpflichtet werden?' Verwende eine klare These, begründete Hauptteil-Absätze und einen ausgewogenen Schluss. (SL)", "target": 280, "check": ["Einleitung'da konuyu tanıttım ve net bir These yazdım.", "Her Hauptteil paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve Schluss'ta görüşümü toparladım (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Aufsatz)", "x": "Sollten Schüler zu sozialem Engagement verpflichtet werden?\n\nViele Schulen verlangen heute, dass Schüler eine bestimmte Zahl an Stunden für die Gemeinschaft leisten. Manche sehen darin eine unfaire Belastung, doch ich bin überzeugt, dass verpflichtetes Engagement, klug umgesetzt, weit mehr nützt als schadet.\n\nDas stärkste Argument dafür ist, was Schüler dabei lernen. Wer in einem Heim hilft oder ein jüngeres Kind unterrichtet, lernt Verantwortung und Empathie, wie es kein Lehrbuch vermitteln kann.\n\nKritiker sagen, Zwang nehme der guten Tat ihre Freiwilligkeit. Darin steckt etwas Wahres. Jedoch würden viele Schüler von allein nie beginnen, und oft machen sie später freiwillig weiter. Die Pflicht öffnet nur eine Tür.\n\nNatürlich muss der Umfang vernünftig bleiben. Zusammenfassend nützt verpflichtetes Engagement, mit Augenmaß angewendet, sowohl den Schülern als auch der Gesellschaft."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Aufsatz net bir These ile başlar.", "Karşı görüşü hiç anmamak. Ona değinip dengelemek yazını olgunlaştırır.", "Bağlaçsız, kopuk paragraflar. jedoch, deshalb, zum Beispiel fikirleri bağlar."]}]}, {"id": "t-artikel", "group": "Kitle İletişim", "name": "Artikel (Makale)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konu hakkında bilgilendirmek ve okuru ilgilendirmek."], ["Kitle", "Bir dergi, gazete veya Schülerzeitung okuru."], ["Register / Ton", "Yarı resmi. Ne akademik ne günlük konuşma."], ["Yapı", "Çekici Titel, ilgi çeken giriş, Zwischenüberschriften ile bölümlenmiş gövde, toparlayan kapanış."], ["Tipik özellikler", "Titel, doğrudan okura soru, örnekler, alt başlıklar, bazen yazar adı."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin açını belirle.", "2. Merak uyandıran çekici bir Titel bul.", "3. Girişte okuru içine çek: bir soru veya çarpıcı bir gerçek.", "4. Gövdeyi 2-3 bölüme ayır, her birine bir Zwischenüberschrift ver.", "5. Fikirleri örnekle geliştir; yer yer okura seslen.", "6. Toparlayan, düşündüren bir kapanış yaz.", "7. Son kontrol: Titel + ilgi çeken giriş + alt başlıklar + yarı resmi ton var mı?"]}, {"t": "given", "title": "Birinci örnek (teknoloji)", "x": "Verlernen wir das Gespräch?\n\nGeh heute in irgendein Café und du siehst dieselbe Szene: ein Tisch voller Freunde, jeder starrt auf einen Bildschirm. Aber ist die Technik wirklich schuld?"}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Die Vier-Tage-Woche in der Schule: Traum oder Albtraum?\n\nStell dir eine Schulwoche ohne Freitag vor. Es klingt wie der Traum jedes Schülers, doch einige Schulen im Ausland haben es tatsächlich ausprobiert, und die Ergebnisse sind überraschender, als du denkst."}, {"t": "h", "x": "Derinlemesine: Artikel (makale) ustalığı"}, {"t": "p", "x": "Artikel, bir dergi, gazete ya da Schülerzeitung için yazdığın, bir konu hakkında hem bilgilendiren hem de okuru ilgilendiren metindir. Bu türün ruhu 'yarı resmî' bir denge tutmaktır: ne bir akademik makale kadar ağır, ne de bir sohbet kadar gevşek. Artikel okuru bir konuya çeker, ona yeni bir bakış sunar ve düşündürür. Blogdan farkı, daha az kişisel ve daha bilgilendirici olması; Aufsatz'tan farkı ise tek bir tezi savunmak zorunda olmaması, bir konuyu çok yönlü aydınlatabilmesidir. IB Deutsch B'de bu tür, öğrencinin bilgiyi ilgi çekici biçimde sunma, metni görünür biçimde yapılandırma (Zwischenüberschriften) ve okurla ölçülü bir bağ kurma becerisini sınar."}, {"t": "p", "x": "Kriterler açısından Artikel'in ayırt edici özelliği görünür yapısıdır. Criterion C (Konzeptverständnis) şu işaretleri arar: çekici bir Titel, ilgi uyandıran bir giriş, gövdeyi bölen ara başlıklar (Zwischenüberschriften) ve yarı resmî bir ton. Titel ya da ara başlık yoksa, metin bir makaleden çok düz bir kompozisyona benzer ve C notu düşer. Criterion B (Botschaft) konunun somut örneklerle geliştirilip geliştirilmediğine bakar. Criterion A (Sprache) ise kelime çeşitliliğini, doğru cümle yapısını ve özellikle ilgi cümlelerini (Relativsätze) doğru kurup kurmadığını ölçer - çünkü makale dili, bilgiyi bu tür cümlelerle katmanlar."}, {"t": "p", "x": "İskelet nettir: merak uyandıran bir Titel; okuru içine çeken bir giriş (bir soru, çarpıcı bir gözlem ya da küçük bir sahne); gövdede iki-üç bölüm, her birine bir Zwischenüberschrift; ve toparlayan, düşündüren bir kapanış. Ara başlıklar bu türün en güçlü ve en çok ihmal edilen aracıdır: hem okura yol gösterir hem de değerlendiriciye türü tanıdığını kanıtlar. Giriş asla 'In diesem Artikel schreibe ich über ...' gibi düz bir bildirimle başlamamalı; bunun yerine okuru bir sahneye ya da soruya davet etmeli: 'Geh heute in irgendein Café, und du siehst dieselbe Szene ...'. Uzunluk: SL 250-400, HL 450-600 kelime; HL'de konuyu daha çok açıdan (nedenler, sonuçlar, farklı görüşler) işler ve dili daha karmaşık cümlelerle örersin."}, {"t": "p", "x": "Bu türün dilbilgisel imzası ilgi cümleleridir (Relativsätze), çünkü makale dili bilgiyi bu cümlelerle sıkıştırır ve akıcı kılar. İlgi zamiri (Relativpronomen), öncülü olan ismin cinsine ve sayısına göre seçilir - der/die/das/die - ve ilgi cümlesinde çekimli fiil daima cümlenin sonuna gider: 'ein Trend, DER unser Leben verändert', 'eine App, DIE Millionen nutzen', 'ein Problem, DAS niemand lösen kann'. Zamirin hâli (Kasus) ise cümledeki rolüne göre değişir: özneyse Nominativ (der), nesneyse Akkusativ (den). Bu yapıyı ustaca kullanmak, makaleni hem bilgilendirici hem zarif yapar."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "Merak uyandırır", "Verlernen wir das Gespräch?"], ["Einstieg (kanca)", "Okuru içine çeker", "Geh heute in irgendein Café, und du siehst dieselbe Szene: jeder starrt auf ein Handy."], ["Zwischenüberschrift", "Bölümler, yol gösterir", "Der Trost des Bildschirms"], ["Hauptteil + Beispiel", "Bilgiyi örnekle geliştirir", "Ein Beispiel: Sobald ein Gespräch stockt, greifen wir zum Handy."], ["Schluss", "Toparlar, düşündürür", "Vielleicht führst du beim nächsten Mal das beste Gespräch der Woche."]]}, {"t": "note", "k": "ipucu", "title": "Makaleyi ilgi çekici kılan teknikler", "lines": ["Ara başlık kullan: 2-3 Zwischenüberschrift hem yapı hem tür işareti verir.", "Somut örnek ver: soyut bir iddiayı bir günlük sahneyle destekle.", "Yer yer okura dön: bir retorik soru makaleye canlılık katar.", "Yarı resmî kal: ne akademik jargon, ne de sokak dili - ikisinin ortası."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Çekici giriş", "Stell dir vor, ... / Geh heute in irgendein Café, und du siehst ..."], ["Konu tanıtma", "In letzter Zeit wird viel darüber diskutiert, ob ..."], ["Örnek verme", "Ein anschauliches Beispiel dafür ist ..."], ["İlgi cümlesi", "Es gibt einen Trend, der immer stärker wird."], ["Okura seslenme", "Doch was bedeutet das eigentlich für uns?"], ["Karşıtlık", "Auf den ersten Blick ..., doch bei näherem Hinsehen ..."], ["Sonuç bağlama", "Am Ende bleibt die Frage: ..."], ["Düşündüren kapanış", "Vielleicht ist es Zeit, genauer hinzuschauen."]]}, {"t": "p", "x": "İlgi cümlelerini doğru kurmak makale dilinin kalbidir. Kural iki adımdır: önce zamirin cinsini ve sayısını öncüle göre belirle (der Mann -> der, die Frau -> die, das Kind -> das, die Leute -> die), sonra hâlini cümledeki rolüne göre seç (özne Nominativ, dolaysız nesne Akkusativ, dolaylı nesne Dativ). Ve her zaman: ilgi cümlesinin çekimli fiili cümlenin en sonundadır. 'ein Buch, das ich gestern gelesen habe' - 'gelesen habe' sonda. Bu iki kuralı içselleştirmek, hem Artikel'de hem tüm resmî metinlerinde işine yarar."}, {"t": "note", "k": "ipucu", "title": "Relativsätze: ilgi cümlelerinin kuralı", "lines": ["Zamir cinsi öncüle uyar: der Trend, DER ...; die App, DIE ...; das Problem, DAS ...; die Menschen, DIE ...", "Zamir hâli role göre: özne Nominativ (der/die/das), nesne Akkusativ (den/die/das), Dativ (dem/der/dem).", "Fiil sonda: 'eine Idee, die viele Menschen überzeugt.'", "İlgi cümlesi virgülle ayrılır: 'Der Schüler, der die Rede hielt, war nervös.'", "Öncül + zamir + ... + fiil (sonda): bu kalıbı ezberle."]}, {"t": "given", "title": "Çözümlü mini-model: kancalı bir giriş ve ara başlık", "x": "Verlernen wir das Gespräch?\n\nGeh heute in irgendein Café, und du siehst überall dieselbe Szene: ein Tisch voller Freunde, und trotzdem starrt jeder auf ein Handy. Aber ist wirklich die Technik schuld, oder haben wir einfach verlernt, miteinander zu reden?\n\nDer Trost des Bildschirms\nSobald ein Gespräch stockt, greifen viele zum Handy, das immer eine bequeme Ausrede bietet."}, {"t": "p", "x": "Bu açılış neden işliyor? Titel bir retorik soru ('Verlernen wir das Gespräch?') ve okuru anında konuya çekiyor. Giriş bir sahneyle başlıyor ('Geh heute in irgendein Café ...'), soyut bir iddia değil somut bir görüntü sunuyor. İkinci cümle bir soruyla okura dönüyor ('Aber ist wirklich die Technik schuld ...?'). Sonra bir Zwischenüberschrift ('Der Trost des Bildschirms') gövdeyi bölüyor - tür işareti. Son cümlede bir ilgi cümlesi var: 'zum Handy, das immer eine bequeme Ausrede bietet' - zamir 'das' (das Handy) ve fiil 'bietet' sonda, kusursuz. Kanca, soru, ara başlık ve Relativsatz - makalenin tüm araçları bir arada."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["İlgi cümlesi fiili: 'Der Trend, der verändert alles.' YANLIŞ -> 'Der Trend, der alles verändert.' DOĞRU (fiil sonda).", "Zamir uyumu: 'die Menschen, die benutzt Handys' YANLIŞ -> 'die Menschen, die Handys benutzen' DOĞRU (çoğul).", "Titel/başlık eksik: düz kompozisyon gibi yazmak zayıf -> Titel + Zwischenüberschriften ekle DOĞRU.", "Düz bildirim girişi: 'In diesem Artikel schreibe ich über Handys.' zayıf -> bir sahne ya da soruyla aç DOĞRU.", "Aşırı akademik ya da argo dil: dengesiz -> yarı resmî tonu koru DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Artikel görevini gördüğünde önce konuyu ve senin açını belirle, sonra iki-üç dakika planla. Merak uyandıran bir Titel bul, gövdeyi 2-3 bölüme ayır ve her birine bir Zwischenüberschrift ver - bu ara başlıklar bu türün en güçlü ve en çok ihmal edilen aracıdır; hem okura yol gösterir hem de değerlendiriciye türü tanıdığını kanıtlar. Girişi asla 'In diesem Artikel schreibe ich über ...' gibi düz bir bildirimle açma; bir sahne, bir soru ya da çarpıcı bir gerçekle başla ('Geh heute in irgendein Café, und du siehst ...'). Bu türde en çok puanı iki yerde kaybedersin. Birincisi yapı: Titel ya da Zwischenüberschriften yoksa metin bir makaleden çok düz bir kompozisyona benzer. İkincisi ilgi cümleleri (Relativsätze): makale dili bilgiyi bu cümlelerle katmanlar, ama zamir uyumu ve fiil dizilişi sık hata alanıdır - zamir öncüle uyar (der Trend, DER ...; die App, DIE ...) ve ilgi cümlesinin fiili daima sonda ('ein Problem, das niemand lösen kann'). Fikirleri somut örneklerle geliştir ve yarı resmî tonu koru - ne akademik jargon, ne sokak dili. Son bir dakikada denetle: çekici bir Titel ve ara başlıklar var mı, giriş okuru içine çekiyor mu, ilgi cümlelerinde fiil sonda mı, ton yarı resmî mi? Değerlendirici bu türde bilgiyi ilgi çekici biçimde sunmayı ve görünür bir yapıyı arar; sen de ara başlıklarla yapılandırıp Relativsätze'yi doğru kurarak hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "artikel", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Artikel für die Schülerzeitung über ein Thema, das Jugendliche betrifft (Schlaf, soziale Medien, Prüfungsstress, Hobbys). Verwende einen packenden Titel, einen interessanten Einstieg, Zwischenüberschriften und einen runden Schluss.", "target": 250, "check": ["Çekici bir Titel ve ilgi çeken bir giriş yazdım.", "Gövdeyi Zwischenüberschriften ile böldüm ve yarı resmi ton tutturdum (Criterion C).", "Fikirleri somut örneklerle geliştirdim (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "Toparlayan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Artikel)", "x": "Verlernen wir das Gespräch?\n\nGeh heute in irgendein Café und du siehst dieselbe Szene: ein Tisch voller Freunde, jeder starrt auf ein Handy. Aber ist die Technik wirklich schuld, oder haben wir einfach verlernt zu reden?\n\nDer Trost des Bildschirms\nHandys bieten einen leichten Ausweg aus unangenehmer Stille. Sobald ein Gespräch stockt, greifen wir zum Bildschirm. Es wirkt harmlos, doch jedes Mal sagen wir der Person gegenüber, dass sie weniger interessant ist als eine Benachrichtigung.\n\nWas wir verlieren\nEchtes Gespräch ist eine Fähigkeit, und wie jede Fähigkeit verblasst sie ohne Übung.\n\nAlso eine kleine Herausforderung: Lass beim nächsten Treffen dein Handy in der Tasche. Vielleicht führst du das beste Gespräch der Woche."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Titel veya alt başlık olmadan yazmak. Makalenin görünür bir yapısı olmalı (Criterion C).", "Çok akademik veya çok günlük dil. Artikel yarı resmidir.", "Fikri örneklemeden yüzeysel bırakmak."]}]}, {"id": "t-rede", "group": "Kitle İletişim", "name": "Rede (Konuşma)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Canlı bir kitleyi ikna etmek veya bilgilendirmek."], ["Kitle", "Bir toplantı, tören veya etkinlikteki dinleyiciler."], ["Register / Ton", "Hitabet. Doğrudan seslenme, güçlü ve ritmik. (du veya Sie, bağlama göre)"], ["Yapı", "Anrede (Liebe Mitschülerinnen und Mitschüler), dikkat çeken açılış, işaretli bölümler, güçlü kapanış."], ["Tipik özellikler", "Anrede, retorik sorular, tekrar, üçlemeler, doğrudan hitap."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kitleyi ve amacı belirle (ikna/bilgilendirme).", "2. Bir Anrede ve dikkat çeken açılış yaz (soru veya çarpıcı iddia).", "3. Ana mesajını tek cümlede belirle.", "4. 2-3 noktayla geliştir; retorik soru ve tekrar kullan.", "5. Doğrudan dinleyiciye seslen; kısa, ritmik cümleler kur.", "6. Güçlü, akılda kalan bir kapanışla bitir (ve teşekkür).", "7. Son kontrol: Anrede + retorik araçlar + doğrudan hitap + güçlü kapanış var mı?"]}, {"t": "given", "title": "Birinci örnek (ilham)", "x": "Guten Morgen zusammen. Lasst mich mit einer einfachen Frage beginnen: Wann habt ihr zuletzt etwas zum ersten Mal getan? Heute möchte ich darüber sprechen, warum das wichtig ist."}, {"t": "given", "title": "İkinci örnek (ikna, farklı bağlam)", "x": "Liebe Mitschülerinnen und Mitschüler, schaut euch in diesem Raum um. In zehn Jahren werden einige von uns diese Stadt verbessert haben, und es beginnt mit einer kleinen Entscheidung heute. Ich bitte euch um diese Entscheidung: Macht beim Freiwilligenprogramm mit."}, {"t": "h", "x": "Derinlemesine: Rede (konuşma) ustalığı"}, {"t": "p", "x": "Rede, canlı bir dinleyici kitlesinin önünde söylenmek üzere yazdığın metindir - bir okul toplantısı, bir tören, bir etkinlik. Bu türün ruhu 'hitabet'tir: burada okunan değil, duyulan bir metin kurarsın. Bu yüzden Rede'nin dili ritmik, doğrudan ve duygusaldır; dinleyiciye 'ihr' ya da 'Sie' ile seslenir, onları içine çeker, harekete geçirir. Bir Rede'yi mektuptan ya da makaleden ayıran en görünür şey, bir Anrede (hitap) ile açılması ve baştan sona dinleyiciyle konuşmasıdır. IB Deutsch B'de bu tür, öğrencinin retorik araçları (retorik soru, tekrar, üçleme) ve doğrudan hitabı ikna edici biçimde kullanma becerisini sınar."}, {"t": "p", "x": "Kriterler açısından Rede bir performans metnidir. Criterion C (Konzeptverständnis) hitabet işaretlerini arar: bir Anrede var mı (Liebe Mitschülerinnen und Mitschüler), dinleyiciye doğrudan sesleniliyor mu, retorik araçlar (Frage, Wiederholung, Trikolon) kullanılıyor mu, güçlü bir açılış ve kapanış var mı? Criterion B (Botschaft) mesajın net olup olmadığına ve örneklerle güçlendirilip güçlendirilmediğine bakar. Criterion A (Sprache) ise 'ihr' çekimlerini, çoğul emir kipini (Macht mit!) ve 'Lasst uns + Infinitiv' çağrı kalıbını doğru kullanıp kullanmadığını ölçer. Bir konuşma, kâğıtta bile 'duyulabilir' olmalıdır."}, {"t": "p", "x": "İskelet şöyledir: Anrede ile aç; dikkat çeken bir açılış yap (bir soru, çarpıcı bir iddia ya da küçük bir sahne); ana mesajını tek cümlede ortaya koy; iki-üç noktayla geliştir, her birinde retorik araçlar kullan; dinleyiciye doğrudan seslen; ve güçlü, akılda kalan bir kapanışla bitir (çoğu zaman bir çağrı ve teşekkür). Retorik araçların üçü şarttır: retorik soru ('Habt ihr euch jemals gefragt ...?'), tekrar/anafora (aynı yapının tekrarı) ve üçleme/Trikolon ('Es geht um Mut, um Zusammenhalt und um Hoffnung'). Bu araçlar konuşmaya ritim ve güç katar. Uzunluk: SL 250-400, HL 450-600 kelime."}, {"t": "p", "x": "Bu türün dilbilgisel imzası çoğul hitap ve çağrı kalıplarıdır. Bir gruba seslendiğin için 'ihr' biçimi devrededir: 'ihr habt', 'ihr wisst', 'euch', 'euer'. Doğrudan çağrı için çoğul emir kipi kullanılır ve bu, 'ihr' çekiminden '-t' ile kurulur ama zamir düşer: 'ihr macht' -> 'Macht mit!', 'ihr denkt' -> 'Denkt daran!'. Ortak eyleme çağıran en güçlü kalıp ise 'Lasst uns + Infinitiv'dir: 'Lasst uns gemeinsam anfangen', 'Lasst uns die Schule verändern' - dikkat: burada mastar 'zu'suz gelir. Bu kalıp konuşmaya birlik ve enerji katar."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Anrede", "Kitleyle bağ kurar", "Liebe Mitschülerinnen und Mitschüler,"], ["Einstieg (kanca)", "Dikkat çeker", "Habt ihr euch jemals gefragt, wann ihr zuletzt etwas zum ersten Mal getan habt?"], ["Kernbotschaft", "Ana mesajı verir", "Heute möchte ich mit euch über den Mut sprechen, Neues zu wagen."], ["Rhetorische Mittel", "Ritim ve güç katar", "Es geht um Mut, um Zusammenhalt und um Hoffnung."], ["Schluss + Appell", "Harekete geçirir", "Lasst uns heute damit anfangen. Vielen Dank."]]}, {"t": "note", "k": "ipucu", "title": "Konuşmaya güç katan retorik araçlar", "lines": ["Retorik soru: dinleyiciyi düşündürür. 'Habt ihr euch das jemals gefragt?'", "Tekrar (Anapher): aynı başlangıcı yinele. 'Wir können lernen. Wir können wachsen. Wir können gewinnen.'", "Üçleme (Trikolon): üç öğeyle vurgula. 'Mut, Geduld und Hoffnung.'", "Doğrudan hitap: 'ihr' ve çoğul Imperativ dinleyiciyi metnin içine alır."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Hitap", "Liebe Mitschülerinnen und Mitschüler, / Liebe Gäste,"], ["Açılış sorusu", "Habt ihr euch jemals gefragt, ...?"], ["Ana mesaj", "Heute möchte ich mit euch über ... sprechen."], ["Vurgu", "Stellt euch nur einmal vor: ..."], ["Ortak çağrı", "Lasst uns gemeinsam etwas verändern."], ["Doğrudan çağrı", "Macht mit! Zeigt, was in euch steckt!"], ["Umut", "Gemeinsam können wir mehr erreichen, als wir glauben."], ["Kapanış", "Fangen wir heute damit an. Vielen Dank für eure Aufmerksamkeit."]]}, {"t": "p", "x": "'ihr' biçimini ve çağrı kalıplarını güvenle kullanmak Rede'de belirleyicidir. 'ihr habt', 'ihr seid', 'ihr könnt', dönüşlü 'euch', iyelik 'euer/eure'. Çoğul Imperativ zamirsizdir ve '-t' ile biter: 'Kommt!', 'Macht mit!', 'Denkt daran!'. 'Lasst uns + Infinitiv' kalıbında mastar 'zu' almaz: 'Lasst uns anfangen' (nicht 'anzufangen'). Ayrıca dönüşlü fiillerde zamir sıralamasına dikkat: 'Habt ihr euch gefragt ...?' - 'euch' fiilden hemen sonra gelir. Bu ayrıntılar, konuşmanın hem doğal hem gramer açısından sağlam olmasını sağlar."}, {"t": "note", "k": "ipucu", "title": "ihr biçimi, çoğul Imperativ ve Lasst uns", "lines": ["ihr çekimi: ihr habt, ihr seid, ihr könnt; dönüşlü euch; iyelik euer/eure.", "Çoğul Imperativ: zamir düşer, -t kalır. 'Macht mit!', 'Denkt daran!', 'Steht auf!'", "Lasst uns + Infinitiv (zu'suz): 'Lasst uns anfangen', 'Lasst uns zusammenhalten'.", "Dönüşlü sıralama: 'Habt ihr euch gefragt ...?' (euch fiilden sonra).", "Anrede sonrası virgül ve yeni satır küçük harfle: 'Liebe Gäste,' + 'ich freue mich, ...'"]}, {"t": "given", "title": "Çözümlü mini-model: güçlü bir açılış", "x": "Liebe Mitschülerinnen und Mitschüler,\n\nhabt ihr euch jemals gefragt, wann ihr zuletzt etwas zum allerersten Mal getan habt? Ein neues Instrument, eine fremde Stadt, ein ehrliches Gespräch? Heute möchte ich euch etwas Einfaches, aber Wichtiges sagen: Lasst uns wieder mutig werden. Denn Mut verändert Menschen, Mut verändert Schulen, und Mut verändert am Ende die Welt."}, {"t": "p", "x": "Bu açılış neden güçlü? Anrede ('Liebe Mitschülerinnen und Mitschüler,') türü anında kuruyor ve ardından küçük 'habt' ile yeni satır - doğru gelenek. Açılış bir retorik soru: 'habt ihr euch jemals gefragt ...?' - 'euch' doğru yerde, fiil dizilişi kusursuz. Üç örnekli bir üçleme ('Ein neues Instrument, eine fremde Stadt, ein ehrliches Gespräch') dinleyiciyi somuta çekiyor. Ana mesaj net veriliyor ve 'Lasst uns wieder mutig werden' çağrısı (Infinitiv 'werden' zu'suz) birlik kuruyor. Son cümle bir Trikolon ve anafora: 'Mut verändert Menschen, Mut verändert Schulen, und Mut verändert ... die Welt' - tekrar ve ritim zirvede. Kâğıtta bile duyuluyor; iyi bir Rede tam da budur."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Anrede eksik: doğrudan konuya girmek zayıf -> 'Liebe Mitschülerinnen und Mitschüler,' ile aç DOĞRU.", "Lasst uns + zu: 'Lasst uns anzufangen.' YANLIŞ -> 'Lasst uns anfangen.' DOĞRU (Infinitiv zu'suz).", "Zayıf çağrı: 'Ihr macht mit.' (bildirim) -> 'Macht mit!' DOĞRU (çoğul Imperativ).", "Dönüşlü sıralama: 'Habt ihr gefragt euch?' YANLIŞ -> 'Habt ihr euch gefragt?' DOĞRU.", "ihr/Sie karışması: aynı konuşmada 'ihr' ile başlayıp 'Sie'ye kaymak YANLIŞ -> tek hitabı tutarlı kullan DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Rede görevini gördüğünde önce kitleyi ve amacı belirle (ikna mı, bilgilendirme mi), sonra bir Anrede seç. Konuşman mutlaka bir hitapla açılmalı ('Liebe Mitschülerinnen und Mitschüler,') ve baştan sona dinleyiciyle konuşmalı. İlk iki dakikada üç şeyi not et: dikkat çeken açılışın (bir soru ya da çarpıcı iddia), ana mesajın tek cümlede, ve güçlü kapanışın (çoğu zaman bir çağrı). Bu türün gücü retorik araçlardadır; en az üçünü kullan: retorik soru ('Habt ihr euch jemals gefragt ...?'), tekrar/anafora (aynı yapının yinelenmesi) ve üçleme/Trikolon ('Es geht um Mut, um Zusammenhalt und um Hoffnung'). Bu türde en çok puanı iki yerde kaybedersin. Birincisi biçim: Anrede yoksa ya da metin bir dinleyiciye seslenmiyorsa, konuşma değil deneme gibi durur. İkincisi 'ihr' biçimi ve çağrı kalıpları: çoğula seslendiğin için 'ihr habt', 'euch', 'euer' devrede; çoğul emir kipi zamirsiz ve -t'lidir ('Macht mit!', 'Denkt daran!'); ortak eyleme çağıran 'Lasst uns + Infinitiv' kalıbında mastar 'zu' almaz ('Lasst uns anfangen', nicht 'anzufangen'). Metnin kâğıtta bile 'duyulabilir' - ritmik ve doğrudan - olması gerekir. Son bir dakikada denetle: Anrede var mı, en az üç retorik araç kullandın mı, dinleyiciye doğrudan sesleniyor mu, güçlü bir kapanış ve teşekkür var mı? Değerlendirici bu türde hitabet gücünü ve doğrudan hitabı arar; sen de retorik araçları ve doğru 'ihr' biçimini kullanarak hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "rede", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Rede für eine Schulversammlung, in der du die Schüler aufforderst, sich für etwas einzusetzen (Freiwilligenarbeit, Umwelt, etwas Neues wagen). Verwende eine Anrede, rhetorische Fragen, Wiederholung und einen starken Schluss.", "target": 250, "check": ["Bir Anrede ve dikkat çeken açılışla başladım.", "Retorik soru, tekrar ve doğrudan hitap kullandım (Criterion C).", "Mesajımı örneklerle geliştirdim ve dinleyiciyi harekete çağırdım (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "Güçlü, akılda kalan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Rede)", "x": "Guten Morgen zusammen. Lasst mich mit einer einfachen Frage beginnen: Wann habt ihr zuletzt etwas zum ersten Mal getan?\n\nFür viele von uns lautet die ehrliche Antwort: 'Ich weiß es nicht mehr.' Wir stehen auf, wir scrollen, wir gehen denselben sicheren Weg. Und langsam hören wir auf zu wachsen.\n\nIch bitte euch nicht, morgen einen Berg zu besteigen. Ich bitte um etwas Kleineres und Mutigeres: Probiert diese Woche eine neue Sache. Sprecht jemanden an, den ihr nie angesprochen habt. Meldet euch für die AG, die euch Angst macht.\n\nDenn jede Fähigkeit, die ihr bewundert, begann genau dort, wo ihr jetzt seid.\n\nAlso sucht heute nicht das Bequeme. Sucht das erste Mal. Danke."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Anrede ve doğrudan hitabı unutmak. Rede bir kitleye seslenir.", "Retorik araç kullanmamak. Retorik soru, tekrar ve üçleme konuşmayı güçlendirir (Criterion C).", "Zayıf bitirmek. En güçlü cümle kapanışta olmalı."]}]}, {"id": "t-broschuere", "group": "Kitle İletişim", "name": "Broschüre / Flyer", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir yeri, ürünü veya etkinliği tanıtıp okuru harekete geçirmek."], ["Kitle", "Potansiyel ziyaretçi/müşteri."], ["Register / Ton", "İkna edici, enerjik, kısa."], ["Yapı", "Büyük Titel + slogan, alt başlıklı 2-3 bölüm, madde işaretleri, iletişim/çağrı kutusu."], ["Format (A4)", "Katlanır: dreifach (3 sütun) veya zweifach. Elle yazımda her bölümü bir alt başlıkla temsil et."], ["Tipik özellikler", "Titel, alt başlıklar, madde imleri, Imperativ (Entdecke, Komm), [Bild: ...] yer tutucu, çağrı."]]}, {"t": "note", "k": "protokol", "title": "A4'e nasıl yerleştirilir?", "lines": ["Sınav elle yazılır; yerleşimi kelime ve düzenle göster, çizim yapma.", "En üste büyük bir Titel ve altına tek satır slogan koy.", "Görsel yerini belirt: [Bild: Wanderer bei Sonnenaufgang].", "Gövdeyi 2-3 bölüme ayır; her birine bir alt başlık ver (Warum? / Was mitbringen? / Besuch planen).", "Her bölümde 2-4 kısa madde (•) kullan.", "En alta bir bilgi/çağrı kutusu koy: Öffnungszeiten, Preis, Adresse, Web ve net bir çağrı.", "Dreifach düşünüyorsan üç bölümü üç sütun gibi kurgula."]}, {"t": "given", "title": "Örnek metin (yerleşim işaretli)", "x": "ENTDECKE DEN GRÜNEN-TAL-WANDERWEG\nRaus aus der Stadt. Atme die Bergluft.\n\n[Bild: Wanderer auf einem grünen Bergpfad bei Sonnenaufgang]\n\nWARUM DAS GRÜNE TAL?\n• 12 km gut markierte, familienfreundliche Wege\n• Traumhafte Aussichten auf drei Wasserfälle\n• Seltene Vögel und völlige Stille\n\nBESUCH PLANEN\nTäglich 8 bis 18 Uhr · Eintritt für Schüler frei\nNur zwei Stunden vom Stadtzentrum\nFührung buchen: www.gruenestal.example\n\nKomm und entdecke die Natur neu. Dein Abenteuer beginnt dieses Wochenende!"}, {"t": "h", "x": "Derinlemesine: Broschüre / Flyer ustalığı"}, {"t": "p", "x": "Broschüre (broşür) ya da Flyer, bir etkinliği, hizmeti ya da fikri tanıtıp okuru harekete geçirmeyi amaçlayan kısa, görsel ve çarpıcı metindir. Bu türün ruhu 'doğrudanlık'tır: uzun paragrafların yeri yoktur; kısa, vurucu cümleler, başlıklar, sorular ve net bir eylem çağrısı (Handlungsaufforderung) vardır. Bir broşür okuru yavaşça ikna etmez, onu bir bakışta yakalar. IB Deutsch B'de bu tür, öğrencinin metni görsel bloklara ayırma, doğrudan hitap (du ya da Sie) ve emir kipiyle harekete geçirme becerisini sınar. Broşürü bir denemeden ayıran şey, her satırının bir işlevi olmasıdır: ya dikkat çeker, ya bilgi verir, ya da çağırır."}, {"t": "p", "x": "Kriterler açısından broşür biçimsel bir türdür. Criterion C (Konzeptverständnis) şu işaretleri arar: çarpıcı bir başlık/slogan, bilgiyi bloklara ayıran ara başlıklar ya da sorular, kısa cümleler ve net bir eylem çağrısı. Uzun, akıcı paragraflar bu türe uymaz ve C notunu düşürür. Criterion B (Botschaft) okurun ihtiyaç duyduğu bilginin (ne, ne zaman, nerede, neden katılmalı) verilip verilmediğine bakar. Criterion A (Sprache) ise emir kipini (Melde dich an!), doğrudan hitabı ve kısa cümle kurmayı doğru yapıp yapmadığını ölçer. Az kelimeyle çok iş yapmak, bu türün hem estetiği hem de puanıdır."}, {"t": "p", "x": "İskelet görseldir: en üstte çarpıcı bir başlık ya da slogan; ardından okurun ilgisini kancalayan bir soru ya da vaat; sonra kısa bloklar hâlinde bilgi (genellikle 'Was?', 'Wann?', 'Wo?', 'Warum mitmachen?' gibi ara başlıklarla); belki kısa bir fayda listesi; ve en sonda güçlü bir eylem çağrısı ile iletişim bilgisi. Anahtar disiplin, her bloğu kısa tutmaktır. 'Komm zu unserem Umwelttag und hilf mit, die Schule grüner zu machen!' tek, net bir davettir; üç yan cümleli bir açıklama değil. Doğrudan hitap (du ya da Sie) baştan sona tutarlı olmalı. Uzunluk SL için 250-400 kelime; broşür genellikle yoğun ama kısadır."}, {"t": "p", "x": "Bu türün dilbilgisel imzası emir kipi ve doğrudan hitaptır. Okuru harekete geçirmek için 'du' emir kipi (Mach mit!, Melde dich an!, Komm vorbei!) ya da resmî bağlamda 'Sie' emir kipi (Machen Sie mit!, Melden Sie sich an!) kullanılır. Ayrılabilen fiiller burada da bölünür: 'anmelden' -> 'Melde dich an', 'mitmachen' -> 'Mach mit', 'vorbeikommen' -> 'Komm vorbei'. Sorular ('Hast du genug von langweiligen Nachmittagen?') ve ünlemler ('Sei dabei!') enerjiyi yükseltir. Kısa cümle kurmak da bir beceridir: bir fikir, bir cümle. Bu ekonomi, broşürün gücüdür."}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel / Slogan", "Bir bakışta yakalar", "Mach mit - deine Schule braucht dich!"], ["Hook (soru/vaat)", "İlgiyi kancalar", "Hast du Lust auf ein Projekt, das wirklich etwas verändert?"], ["Info-Blöcke", "Ne/ne zaman/nerede", "Was? Umwelttag. Wann? Samstag, 10 Uhr. Wo? Im Schulhof."], ["Vorteile", "Neden katılmalı", "Neue Freunde, frische Ideen und jede Menge Spaß."], ["Handlungsaufforderung", "Harekete geçirir", "Melde dich noch heute im Sekretariat an!"]]}, {"t": "note", "k": "ipucu", "title": "Broşürü çarpıcı kılan teknikler", "lines": ["Kısa tut: bir fikir, bir cümle. Uzun paragraf broşürü boğar.", "Soru ve ünlem kullan: enerji ve doğrudanlık katar.", "Bilgiyi bloklara ayır: 'Was? Wann? Wo?' okura hızlı yanıt verir.", "Net bir eylem çağrısıyla bitir: 'Melde dich an!', 'Sei dabei!'"]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Slogan başlık", "Sei dabei - gestalte mit!"], ["Soru kancası", "Hast du genug von langweiligen Pausen?"], ["Bilgi bloğu", "Was? ... Wann? ... Wo? ..."], ["Vaat / fayda", "Bei uns findest du neue Freunde und neue Ideen."], ["Emir / çağrı", "Mach mit! / Melde dich noch heute an!"], ["Aciliyet", "Nur noch wenige Plätze frei - sei schnell!"], ["Teşvik", "Jeder ist willkommen, ganz egal, wie viel Erfahrung du hast."], ["İletişim", "Mehr Infos gibt es im Sekretariat oder unter ..."]]}, {"t": "p", "x": "Emir kipi ve ayrılabilen fiiller broşürün motorudur, o yüzden onları temiz kullanmak şart. 'du' emir kipinde çoğu fiil eksizdir ('Komm!', 'Mach!'), düzensizlerde sesli değişir ('Sei dabei!' - sein fiilinin emir biçimi 'sei'dir). 'Sie' emir kipinde ise fiil + Sie: 'Kommen Sie!', 'Machen Sie mit!'. Ayrılabilen fiilde ön ek sona gider: 'Melde dich an', 'Komm vorbei', 'Mach mit'. En sık hata, seçilen hitabı (du/Sie) yarı yolda değiştirmektir; baştan sona birini tut."}, {"t": "note", "k": "ipucu", "title": "Emir kipi ve doğrudan hitap", "lines": ["du-Imperativ: 'Komm!', 'Mach mit!', 'Melde dich an!' (çoğu eksiz).", "sein düzensiz: emir biçimi 'Sei!' -> 'Sei dabei!', 'Sei mutig!'", "Sie-Imperativ: fiil + Sie. 'Kommen Sie!', 'Machen Sie mit!', 'Melden Sie sich an!'", "Ayrılabilen fiil: ön ek sona. 'Melde dich AN', 'Komm VORBEI', 'Mach MIT'.", "Hitap tutarlılığı: baştan sona ya hep 'du' ya hep 'Sie' - karıştırma."]}, {"t": "given", "title": "Çözümlü mini-model: çarpıcı bir broşür bloğu", "x": "Umwelttag an unserer Schule - mach mit!\n\nHast du Lust, endlich etwas zu verändern, statt nur zuzuschauen? Dann bist du bei uns genau richtig.\n\nWas? Ein Tag voller Aktionen für eine grünere Schule.\nWann? Samstag, den 12. Mai, ab 10 Uhr.\nWo? Im Schulhof und im Garten.\n\nGemeinsam pflanzen wir Bäume, sammeln Müll und haben jede Menge Spaß. Melde dich noch heute im Sekretariat an - jede Hand zählt!"}, {"t": "p", "x": "Bu broşür neden işliyor? Başlık bir slogan ve doğrudan çağrı içeriyor: 'mach mit!' (mitmachen -> mach ... mit). Hook bir soru: 'Hast du Lust, endlich etwas zu verändern, statt nur zuzuschauen?' - enerji ve doğrudanlık. Bilgi net bloklara ayrılmış: 'Was? Wann? Wo?' - okur saniyeler içinde ne, ne zaman, nerede olduğunu görüyor. 'Gemeinsam pflanzen wir ..., sammeln ... und haben ...' üç fiille faydayı somutluyor. Kapanış güçlü bir eylem çağrısı: 'Melde dich noch heute ... an' (anmelden ayrılabilen fiil, 'an' sonda) ve aciliyet: 'jede Hand zählt!'. Kısa, doğrudan, çağıran - broşürün tüm ilkeleri tek blokta."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Uzun paragraf: akıcı bir metin yazmak broşüre uymaz -> kısa bloklara ayır DOĞRU.", "Ayrılan ön ek: 'Melde an dich.' YANLIŞ -> 'Melde dich an.' DOĞRU.", "sein emri: 'Bei dabei!' YANLIŞ -> 'Sei dabei!' DOĞRU.", "Eylem çağrısı eksik: bilgi verip bırakmak zayıf -> net bir 'Mach mit! / Melde dich an!' ekle DOĞRU.", "Hitap karışması: 'Komm vorbei ... Melden Sie sich an.' YANLIŞ -> tek hitabı (du/Sie) tut DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Broschüre/Flyer görevini gördüğünde önce neyi tanıttığını ve okurdan ne yapmasını istediğini (eylem çağrısı) netleştir. Sonra metni görsel bloklar hâlinde tasarla: en üstte çarpıcı bir başlık ya da slogan, ardından ilgi kancalayan bir soru, sonra kısa bilgi blokları (çoğu zaman 'Was? Wann? Wo? Warum mitmachen?' başlıklarıyla) ve en sonda güçlü bir eylem çağrısı. Bu türde en çok puanı iki yerde kaybedersin. Birincisi biçim: uzun, akıcı paragraflar broşüre uymaz ve Criterion C'yi düşürür; her satır kısa olmalı ve bir işi olmalı - ya dikkat çeker, ya bilgi verir, ya çağırır. İkincisi emir kipi ve hitap tutarlılığı: okuru harekete geçirmek için Imperativ kullan ('Mach mit!', 'Melde dich an!', 'Sei dabei!' - sein fiilinin emri 'sei'dir), ayrılabilen fiillerde ön ek sona gider ('Melde dich an', 'Komm vorbei'), ve seçtiğin hitabı (du ya da Sie) baştan sona koru - yarı yolda değiştirme. Sorular ve ünlemler enerji katar; bir fikir, bir cümle disiplinini uygula. Son bir dakikada denetle: çarpıcı bir başlık/slogan var mı, bilgi kısa bloklara ayrılmış mı, net bir eylem çağrısı var mı, hitap tutarlı mı? Değerlendirici bu türde doğrudanlığı, görsel yapıyı ve harekete geçiren bir dili arar; sen de kısa bloklar ve doğru emir kipiyle yazarak hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "broschuere", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Broschüre/einen Flyer über einen Ort in deiner Stadt (ein Park, ein Museum, ein Festival). Verwende einen packenden Titel, Abschnitte mit Zwischenüberschriften, Aufzählungspunkte und einen Info-/Handlungsaufruf-Kasten.", "target": 220, "check": ["Büyük bir Titel ve bir slogan ile açtım.", "2-3 alt başlıklı bölüm ve madde işaretleri kullandım (Criterion C).", "Imperativ ve net bir çağrı (Handlungsaufruf) koydum.", "Bir bilgi kutusu (Öffnungszeiten, Preis, Adresse) ekledim.", "İkna edici, kısa dil kullandım ve istenen uzunluğa ulaştım.", "Dilbilgisini denetledim: Imperativ biçimleri doğru (Besuch uns! / Besuchen Sie uns!), Kasus/Artikel uyumlu ve Groß-/Kleinschreibung doğru; metni son bir kez okudum (Criterion A)."], "model": {"title": "Model cevap (Broschüre)", "x": "KOMM ZUM RIVERSIDE-KUNSTFESTIVAL\nDrei Tage Musik, Farbe und unvergessliche Momente.\n\n[Bild: eine tanzende Menge vor einer hellen Freilichtbühne]\n\nWAS GIBT ES?\n• Live-Bands auf zwei Freilichtbühnen\n• Streetfood aus über dreißig lokalen Küchen\n• Kostenlose Workshops in Malen, Tanz und Fotografie\n\nWARUM DU NICHT FEHLEN DARFST\nWo sonst kannst du mittags malen lernen, um sechs die Welt schmecken und um Mitternacht unter den Sternen tanzen?\n\nWOCHENENDE PLANEN\nFreitag bis Sonntag, 14. bis 16. Juni · ab 10 Uhr\nTickets: 50 Lira fürs Wochenende, für Kinder unter 12 frei\nRiverside-Park, neben der alten Brücke\nJetzt buchen: www.riversidefest.example\n\nBring deine Freunde und deine Tanzschuhe mit. Wir sehen uns am Fluss!"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Broşürü düz bir denemeye çevirmek. Titel, alt başlık ve madde işaretleri olmalı (Criterion C).", "Abartılı, inandırıcılıktan uzak övgü. Somut ayrıntı güven verir.", "Handlungsaufruf ve iletişim bilgisini unutmak."]}]}, {"id": "t-meinung", "group": "Kitle İletişim", "name": "Meinungsartikel / Kommentar", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir görüşü gerekçeli biçimde savunmak."], ["Kitle", "Bir gazete/derginin okurları."], ["Register / Ton", "İkna edici, kişisel görüş, yer yer duygusal."], ["Yapı", "Net bir tez, gerekçelerle gelişen paragraflar, karşı görüşe kısa değinme, güçlü kapanış."], ["Tipik özellikler", "Birinci tekil görüş (ich), retorik sorular, örnekler, ikna edici dil."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir görüş/tez belirle: neyi savunuyorsun?", "2. Çarpıcı bir açılışla tezini hemen ortaya koy.", "3. Her paragrafta bir gerekçe ver ve örnekle destekle.", "4. Karşı görüşe kısaca değin (Manche behaupten ...), sonra çürüt.", "5. İkna edici dil ve retorik sorular kullan.", "6. Güçlü, akılda kalan bir kapanış yaz.", "7. Son kontrol: net tez + gerekçeler + karşı görüş + ikna edici ton var mı?"]}, {"t": "given", "title": "Birinci örnek (sınav baskısı)", "x": "Es wird Zeit, eine unbequeme Wahrheit zuzugeben: Unsere Besessenheit von Prüfungsnoten schadet genau den Schülern, denen sie helfen soll."}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Alle sagen jungen Menschen, sie sollten 'ihrer Leidenschaft folgen'. Auf einem Poster klingt das inspirierend. In Wirklichkeit ist es vielleicht der nutzloseste Rat, den wir ihnen geben, und ich erkläre, warum."}, {"t": "h", "x": "Derinlemesine: Meinungsartikel / Kommentar ustalığı"}, {"t": "p", "x": "Meinungsartikel (görüş yazısı) ya da Kommentar, bir gazetede ya da dergide yayımlanan, açıkça taraf tutan bir metindir. Bu türün ruhu 'net bir duruş'tur. Bir Bericht nesnel kalırken, bir Kommentar tam tersine kişisel görüşünü öne sürer, savunur ve okuru ikna etmeye çalışır. Aufsatz'a benzer ama daha keskin, daha gazetecidir; dili daha canlı, tonu daha kişiseldir ve çoğu zaman güçlü bir duyguyla açılır ya da kapanır. IB Deutsch B'de bu tür, öğrencinin açık bir tez kurma, onu değer yüklü (wertend) bir dille savunma ve retorik araçlarla ikna etme becerisini sınar. Bir yorumun en büyük günahı, tarafsız kalıp hiçbir şey söylememektir."}, {"t": "p", "x": "Kriterler açısından Kommentar'ın kalbi tavırdır. Criterion C (Konzeptverständnis) şunları arar: yayımlanacak bir metnin işaretleri (Titel), net ve erken belirtilen bir görüş, değer yüklü bir dil ve okura yönelen retorik araçlar. Nötr, rapor gibi bir ton bu türe uymaz. Criterion B (Botschaft) görüşün gerçekten gerekçelendirilip gerekçelendirilmediğine bakar - salt öfke ya da slogan yetmez; arkasında mantık olmalı. Criterion A (Sprache) ise kişisel görüş kalıplarını (Meiner Meinung nach ...), değerlendirme sıfatlarını ve modal fiillerle kurulan çağrıları (Wir sollten ...) doğru kullanıp kullanmadığını ölçer."}, {"t": "p", "x": "İskelet şöyledir: çarpıcı bir Titel; güçlü bir açılış (bir provokasyon, bir soru ya da çarpıcı bir gerçek); görüşünü net koyan bir tez; bunu gerekçe ve örneklerle savunan gövde; kısaca bir karşı görüşe değinip onu çürüten bir bölüm; ve okuru bir düşünce ya da çağrıyla bırakan güçlü bir kapanış. Aufsatz'tan farkı tonunda ve amacındadır: Aufsatz dengeli bir tartışma sunar, Kommentar ise net bir taraftan konuşur ve okuru kendi tarafına çekmek ister. Yine de körü körüne değil; en iyi yorumlar duyguyu mantıkla birleştirir. Uzunluk: SL 250-400, HL 450-600 kelime."}, {"t": "p", "x": "Bu türün dilbilgisel imzası kişisel görüş ve değerlendirme dilidir. Görüşünü açıkça belirten kalıplar kullanırsın: 'Meiner Meinung nach ...', 'Ich bin überzeugt, dass ...', 'Es ist höchste Zeit, dass ...'. Değer yüklü sıfatlar (wertende Adjektive) tavrını taşır: 'inakzeptabel', 'bedenklich', 'großartig', 'unverantwortlich'. Çağrılar ise modal fiillerle kurulur: 'Wir sollten ...', 'Man müsste endlich ...', 'Es darf nicht sein, dass ...'. Retorik sorular okuru içine çeker: 'Wie lange wollen wir noch zusehen?'. Dikkat: 'Meiner Meinung nach' bir cümlenin başında geldiğinde, çekimli fiil hemen ardından (2. konumda) gelir: 'Meiner Meinung nach IST das ein Fehler.'"}, {"t": "table", "head": ["Baustein (yapı taşı)", "İşlev", "Almanca kalıp / örnek"], "rows": [["Titel", "Tavrı sezdirir", "Schluss mit der Handy-Panik!"], ["Provokativer Einstieg", "Dikkat çeker", "Jeden Tag hören wir dieselbe Warnung - und jeden Tag ist sie ein bisschen übertriebener."], ["These (görüş)", "Net duruş koyar", "Meiner Meinung nach schaden diese Verbote mehr, als sie nützen."], ["Argument + Wertung", "Gerekçe + değer", "Es ist schlicht unverantwortlich, Jugendlichen jede Eigenverantwortung abzusprechen."], ["Appell / Schluss", "Okuru çağırır", "Wir sollten endlich aufhören, aus jedem Problem eine Krise zu machen."]]}, {"t": "note", "k": "ipucu", "title": "Yorumu keskinleştiren teknikler", "lines": ["Erken taraf tut: görüşünü ilk paragrafta net söyle, saklama.", "Değer yüklü dil kullan: 'bedenklich', 'großartig', 'inakzeptabel' - ama gerekçesiz slogan atma.", "Retorik soruyla okuru sık: 'Wie lange soll das noch so weitergehen?'", "Karşı görüşe kısaca değin ve çürüt: bu, tavrını daha güçlü ve olgun gösterir."]}, {"t": "table", "head": ["İşlev", "Deutsche Wendung (hazır kalıp)"], "rows": [["Görüş bildirme", "Meiner Meinung nach ist es höchste Zeit, dass ..."], ["Güçlü ifade", "Es ist einfach nicht hinnehmbar, dass ..."], ["Değerlendirme", "Genau hier liegt das eigentliche Problem."], ["Retorik soru", "Wie lange wollen wir noch tatenlos zusehen?"], ["Karşı görüş + çürütme", "Natürlich sagen manche ..., doch das greift zu kurz."], ["Modal çağrı", "Wir sollten endlich aufhören, ... zu ..."], ["Vurgu", "Und genau das ist der Punkt."], ["Kapanış", "Es wird Zeit, dass wir umdenken."]]}, {"t": "p", "x": "Görüş ve çağrı dilini doğru kurmak yorumun gücünü belirler. Modal fiiller (sollen, müssen, dürfen) çağrının omurgasıdır: 'Wir sollten handeln', 'Man müsste das ändern', 'Das darf nicht länger so bleiben'. Değerlendirme sıfatları isimden önce geldiğinde doğru çekim eki alır (Adjektivendungen): 'ein bedenklicher Trend', 'eine großartige Chance', 'ein unverantwortliches Verbot'. 'Meiner Meinung nach', 'Ehrlich gesagt', 'Ohne Zweifel' gibi ifadeler cümle başında yer aldığında fiili 2. konuma iter. Bu üç aracı - modal çağrı, değer sıfatı, başta gelen görüş ifadesi - ustaca kullanmak, yorumunu hem keskin hem doğru yapar."}, {"t": "note", "k": "ipucu", "title": "Görüş, değerlendirme ve çağrı dili", "lines": ["Görüş kalıbı (başta): fiil 2. konumda. 'Meiner Meinung nach ist das falsch.'", "Modal çağrı: 'Wir sollten ...', 'Man müsste ...', 'Das darf nicht sein.'", "Değer sıfatı + çekim: 'ein bedenklicher Trend', 'eine großartige Idee'.", "Retorik soru: okuru içine çeker, cevabı zaten bellidir. 'Ist das wirklich fair?'", "Nötrlükten kaçın: 'Man könnte sagen ...' gibi çekingen ifade yorumu zayıflatır - net konuş."]}, {"t": "given", "title": "Çözümlü mini-model: keskin bir açılış ve tez", "x": "Schluss mit der ewigen Handy-Panik!\n\nKaum ein Thema wird an unseren Schulen so hitzig diskutiert wie das Handyverbot. Doch meiner Meinung nach schaden diese pauschalen Verbote am Ende mehr, als sie nützen. Denn wer Jugendlichen jede Eigenverantwortung abspricht, darf sich nicht wundern, wenn sie keine entwickeln. Ist es nicht klüger, den vernünftigen Umgang zu lehren, statt das Gerät einfach zu verbannen?"}, {"t": "p", "x": "Bu açılış neden güçlü? Titel bir tavır sloganı: 'Schluss mit der ewigen Handy-Panik!' - okur daha ilk satırda yazarın nerede durduğunu sezer. Açılış cümlesi konuyu tartışmalı çerçevesiyle kuruyor. İkinci cümle net tez: 'meiner Meinung nach schaden diese pauschalen Verbote ... mehr, als sie nützen' - dikkat et, 'meiner Meinung nach' başta olduğu için fiil 'schaden' hemen ardından (2. konumda). Üçüncü cümle 'Denn ...' ile gerekçe veriyor ve değer yüklü ('jede Eigenverantwortung abspricht'). Son cümle bir retorik soru ('Ist es nicht klüger ...?') okuru yazarın tarafına çekiyor. Net duruş, gerekçe, değer dili ve retorik soru - Kommentar'ın tüm silahları."}, {"t": "note", "k": "dikkat", "title": "Sık hatalar: yanlış vs doğru Almanca", "lines": ["Nötr ton: rapor gibi tarafsız yazmak YANLIŞ -> net bir görüş koy DOĞRU.", "Görüş dizilişi: 'Meiner Meinung nach das ist falsch.' YANLIŞ -> 'Meiner Meinung nach ist das falsch.' DOĞRU.", "Değer sıfatı çekimi: 'ein bedenklich Trend' YANLIŞ -> 'ein bedenklicher Trend' DOĞRU.", "Gerekçesiz slogan: sadece bağırmak zayıf -> her görüşü bir gerekçeyle destekle DOĞRU.", "Modal çağrı: 'Wir sollen handeln jetzt.' YANLIŞ -> 'Wir sollten jetzt handeln.' DOĞRU."]}, {"t": "p", "x": "Sınav anı için pratik bir yol haritası: Meinungsartikel/Kommentar görevini gördüğünde önce net bir duruş belirle - bu türün en büyük günahı tarafsız kalıp hiçbir şey söylememektir. İlk iki dakikada planla: çarpıcı bir Titel, güçlü bir açılış (bir provokasyon, soru ya da çarpıcı gerçek), erken belirtilen bir tez, gerekçeli gövde, kısa bir karşı görüş + çürütme, ve okuru düşünce ya da çağrıyla bırakan bir kapanış. Bu türde en çok puanı iki yerde kaybedersin. Birincisi nötrlük: rapor gibi tarafsız yazmak yorumu öldürür; görüşünü ilk paragrafta açıkça koy ve değer yüklü sıfatlar kullan ('bedenklich', 'großartig', 'inakzeptabel') - ama gerekçesiz slogan atma, her görüşün arkasında mantık olsun. İkincisi görüş ve çağrı dilinin dilbilgisi: 'Meiner Meinung nach' cümle başındayken fiil hemen ardından 2. konumda gelir ('Meiner Meinung nach ist das ein Fehler'); çağrılar modal fiillerle kurulur ('Wir sollten ...', 'Man müsste ...', 'Das darf nicht sein'); değer sıfatları isimden önce doğru ek alır ('ein bedenklicher Trend'). Retorik sorular okuru senin tarafına çeker ('Wie lange wollen wir noch zusehen?'). Son bir dakikada denetle: net bir görüş var mı, her iddia gerekçeli mi, karşı görüşe değinip çürüttün mü, görüş/çağrı dilinin dizilişi doğru mu? Değerlendirici bu türde net bir duruşu ve ikna gücünü arar; sen de erken taraf tutup değer dilini gerekçeyle destekleyerek hem Konzeptverständnis hem Sprache puanını birlikte kazanırsın."}, {"t": "wizard", "wt": "meinung", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Meinungsartikel/Kommentar für eine Zeitung: Vertritt zu einem umstrittenen Thema (soziale Medien, Prüfungen, Umwelt) eine klare Meinung. Nenne deine These, begründe sie, geh auf die Gegenmeinung ein und schließe stark ab.", "target": 250, "check": ["Girişte net bir tez/görüş verdim.", "Görüşümü gerekçe ve örneklerle geliştirdim; retorik soru kullandım (Criterion C).", "Karşı görüşe değindim ve onu çürüttüm (Criterion B).", "Dilbilgisini denetledim: fiil ana cümlede 2. konumda, yan cümlede (weil/dass/wenn) sonda (Verbstellung); Kasus ve Artikel doğru (der/die/das, den/dem, ein/einen); Adjektivendungen uyumlu (Criterion A).", "Kelime çeşitliliğini artırdım: aynı sözcüğü tekrarlamak yerine eşanlamlı ve bağlaç (deshalb, obwohl, außerdem) kullandım; tüm isimleri büyük harfle yazdım (Groß-/Kleinschreibung) ve metni son bir kez okuyup yazım/noktalama hatalarını temizledim (Criterion A).", "Güçlü bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Kommentar)", "x": "Es wird Zeit, eine unbequeme Wahrheit zuzugeben: Unsere Besessenheit von Noten schadet genau den Schülern, denen sie helfen soll.\n\nNatürlich zählen Noten. Sie öffnen Türen, und das Gegenteil zu behaupten wäre unehrlich. Aber wenn ein Vierzehnjähriger aus Angst vor einem Test nicht schlafen kann, läuft etwas gründlich falsch.\n\nManche behaupten, Druck stärke den Charakter. Vielleicht ein wenig. Doch die Schüler, die ich kenne, werden nicht stärker, sondern erschöpft und ängstlich.\n\nStell dir stattdessen eine Schule vor,
