nt theories tended to assume that the informal sector would gradually shrink as economies modernised, much as it had in the historical experience of Western Europe. The evidence of recent decades, however, has not borne this expectation out. Informal employment has proved remarkably durable, and in some cities has even expanded during periods of formal economic growth. This durability has prompted scholars to reconsider whether informality is best understood as a transitional phase or as a structural feature of contemporary capitalism in much of the world.</p><p>Policy responses are still evolving. Some governments have pursued aggressive formalisation campaigns, often with mixed results, while others have begun to experiment with frameworks that extend at least some protections — health coverage, basic pensions, dispute resolution mechanisms — to informal workers without insisting on full incorporation into the formal sector.</p></div><div class='qprompt'>It can be inferred from the passage that aggressive formalisation campaigns ----.</div>","n":28,"choices":{"C":"tend to be most effective when imposed without consultation with affected workers","A":"have consistently succeeded in transforming informal enterprises into registered businesses","D":"have produced uneven outcomes in the cities where they have been attempted","B":"are universally supported by international development organisations","E":"have largely eliminated the need for alternative regulatory approaches"},"why":"Pasaj 'aggressive formalisation campaigns, often with mixed results' der; 'mixed results' = eşit olmayan/değişken sonuçlar. A pozitif abartı; B pasajda yok; D yazarın tutumuyla zıt; E pasajla zıt."},{"n":29,"choices":{"E":"extend selected protections to informal workers without requiring full formalisation","D":"replace existing social insurance schemes with informal-sector alternatives","B":"shift responsibility for informal workers from governments to private enterprises","A":"abolish the informal sector entirely within a defined timeframe","C":"standardise informal-sector regulation across all developing economies"},"why":"Pasajın son cümlesi 'extend at least some protections ... without insisting on full incorporation into the formal sector' diyerek B'yi birebir karşılar. Diğer seçenekler pasajda dayanak bulmaz.","slug":"gri-mod-yds-deneme2-1-29","ans":"E","stem":"<div class='passage'><p>In rapidly urbanising regions of the global South, the formal economy frequently accounts for only a fraction of total employment. The remainder is found in what economists somewhat awkwardly term the \"informal sector\": street vendors, small-scale repair workshops, domestic workers, and a vast array of micro-enterprises that operate outside official registration and taxation.</p><p>Policymakers have long viewed this sector with ambivalence. On the one hand, it absorbs labour that the formal economy cannot, providing livelihoods for millions who would otherwise face destitution. On the other, its workers typically lack legal protections, occupational safety standards, and access to social insurance, leaving them acutely vulnerable to economic shocks.</p><p>Earlier development theories tended to assume that the informal sector would gradually shrink as economies modernised, much as it had in the historical experience of Western Europe. The evidence of recent decades, however, has not borne this expectation out. Informal employment has proved remarkably durable, and in some cities has even expanded during periods of formal economic growth. This durability has prompted scholars to reconsider whether informality is best understood as a transitional phase or as a structural feature of contemporary capitalism in much of the world.</p><p>Policy responses are still evolving. Some governments have pursued aggressive formalisation campaigns, often with mixed results, while others have begun to experiment with frameworks that extend at least some protections — health coverage, basic pensions, dispute resolution mechanisms — to informal workers without insisting on full incorporation into the formal sector.</p></div><div class='qprompt'>The passage suggests that recent policy experiments in some countries aim to ----.</div>"},{"slug":"gri-mod-yds-deneme2-1-30","ans":"E","stem":"<div class='passage'><p>Peer review has long been treated as the cornerstone of scholarly publication, an imperfect but indispensable safeguard against error, exaggeration, and outright fraud. Recent meta-research, however, has begun to document the cognitive biases that can creep into the process even when individual reviewers act in good faith.</p><p>One persistent pattern is what researchers have called \"confirmation bias in reverse\": reviewers presented with results that contradict their prior expectations tend to scrutinise the methodology far more closely than they do for results that confirm what they already believe. The effect is not necessarily one of intentional gatekeeping; it appears to operate even among reviewers who would, if questioned, sincerely deny any bias.</p><p>Such findings do not invalidate peer review, but they do suggest that reliance on the process alone is insufficient. Pre-registration of study designs, open data, and post-publication review are increasingly proposed as complementary mechanisms that can catch errors a single reviewer, however careful, is likely to miss.</p></div><div class='qprompt'>One can infer from the passage that ----.</div>","choices":{"E":"reviewers' methodological scrutiny may vary depending on whether the results align with their prior beliefs","B":"confirmation bias is mainly a problem in studies that lack pre-registered protocols","D":"post-publication review has largely supplanted traditional peer review in the natural sciences","A":"peer review should be replaced by automated screening of submitted papers","C":"most reviewers consciously favour papers that confirm their own theoretical commitments"},"n":30,"why":"Pasajın merkezindeki 'confirmation bias in reverse' tanımı tam olarak bunu söyler. A pasajda yok; C 'mainly' aşırı; D 'consciously' yanlış (pasaj bilinçli olmadığını söyler); E pasajda yok."},{"why":"Pasajın son cümlesi 'complementary mechanisms that can catch errors a single reviewer ... is likely to miss' diyerek C'yi tam karşılar. A pasajla zıt; B/D/E pasajda yer almaz.","choices":{"A":"substitutes for peer review that should replace it altogether","C":"tools used exclusively in physics and the most quantitative biological sciences","E":"supplements to peer review that can detect errors individual reviewers may overlook","D":"reforms opposed by most working scientists on practical grounds","B":"ineffective additions that have produced no measurable improvements"},"n":31,"ans":"E","stem":"<div class='passage'><p>Peer review has long been treated as the cornerstone of scholarly publication, an imperfect but indispensable safeguard against error, exaggeration, and outright fraud. Recent meta-research, however, has begun to document the cognitive biases that can creep into the process even when individual reviewers act in good faith.</p><p>One persistent pattern is what researchers have called \"confirmation bias in reverse\": reviewers presented with results that contradict their prior expectations tend to scrutinise the methodology far more closely than they do for results that confirm what they already believe. The effect is not necessarily one of intentional gatekeeping; it appears to operate even among reviewers who would, if questioned, sincerely deny any bias.</p><p>Such findings do not invalidate peer review, but they do suggest that reliance on the process alone is insufficient. Pre-registration of study designs, open data, and post-publication review are increasingly proposed as complementary mechanisms that can catch errors a single reviewer, however careful, is likely to miss.</p></div><div class='qprompt'>According to the passage, mechanisms such as pre-registration and open data are best understood as ----.</div>","slug":"gri-mod-yds-deneme2-1-31"},{"n":32,"choices":{"A":"Awareness campaigns rarely work because people generally ignore public health messaging altogether.","C":"Part of the answer is that information campaigns assume choices are made in a context where healthy options are accessible, which is often not the case.","E":"The right approach is to abandon information campaigns and focus exclusively on regulating food manufacturers.","B":"The most important factor is the genetic composition of the population, which awareness campaigns cannot influence.","D":"I suspect the data is misleading; obesity rates in our region are probably no higher than they used to be."},"why":"Sonraki replikteki 'even well-designed campaigns can be undermined by the environments in which people actually live' özetlemesi ve son repliğin 'if healthy options are expensive, distant, or socially marginalised' detayı B'yi gerektirir. A genel ret, C/D konu kayması, E radikal.","slug":"gri-mod-yds-deneme2-1-32","ans":"C","stem":"<div class='dia'><p><b>Public health official:</b><br>We've spent considerable resources on awareness campaigns about diet and exercise, yet rates of obesity in our region have continued to rise. How should we make sense of this?</p><p><b>Health economist:</b><br>----</p><p><b>Public health official:</b><br>So even very well-designed information campaigns can be undermined by the environments in which people actually live and make choices?</p><p><b>Health economist:</b><br>Exactly. If healthy options are expensive, distant, or socially marginalised, awareness alone simply cannot overcome those structural barriers; effective policy has to address the environment, not just the information available within it.</p></div>"},{"why":"Sonraki replikteki 'apparent change reflects difference in scale ... rather than a real shift' özetlemesi ve son repliğin 'motifs, colour relationships, compositional logic ... can be traced quite directly to work two decades earlier' detayı C'yi gerektirir: süreklilik en az farklar kadar önemlidir. A geleneksel okumayı kabul eder, B aşırı reddedicidir, D belirsizdir, E öznel yargıdır.","choices":{"C":"I think the description is misleading; the continuities with her earlier work are at least as significant as the differences, even if they have been less often noted.","A":"The traditional reading is broadly correct, and recent scholarship has done little to alter it.","B":"Most contemporary scholars now reject any continuity between her early and late periods.","D":"That depends entirely on which of her late works one happens to be looking at.","E":"Personally, I find her late period far less artistically convincing than her earlier work."},"n":33,"ans":"C","stem":"<div class='dia'><p><b>Curator:</b><br>I'm preparing the catalogue text for our forthcoming retrospective. Many earlier critics described this painter's late work as a sharp departure from her earlier style. Would you agree with that characterisation?</p><p><b>Art historian:</b><br>----</p><p><b>Curator:</b><br>So you'd argue that the apparent change reflects a difference in scale and ambition rather than a real shift in artistic concerns?</p><p><b>Art historian:</b><br>That's right. The motifs, colour relationships, and underlying compositional logic of her late paintings can all be traced quite directly to work she completed two decades earlier; what changes is the format and the public stakes, not the artistic vocabulary itself.</p></div>","slug":"gri-mod-yds-deneme2-1-33"},{"slug":"gri-mod-yds-deneme2-1-34","stem":"<div class='dia'><p><b>Climate scientist:</b><br>The latest projections for sea-level rise this century are higher than those produced even five years ago. What accounts for the revision?</p><p><b>Earth systems researcher:</b><br>----</p><p><b>Climate scientist:</b><br>So it's not that the underlying warming is dramatically faster, but that we now better understand how ice sheets contribute to total sea-level rise?</p><p><b>Earth systems researcher:</b><br>Precisely. The thermal expansion component has been understood for some time, but the dynamics of the Greenland and Antarctic ice sheets — particularly the rate at which marine-terminating glaciers can disintegrate — have turned out to be far more sensitive to warming than earlier models assumed.</p></div>","ans":"A","n":34,"choices":{"C":"Honestly, the new projections are no more reliable than the old ones; the uncertainty range is simply too wide.","A":"The change is largely a consequence of refining our models of ice-sheet behaviour rather than any sudden acceleration in surface warming itself.","B":"Most of the revision reflects new political pressure on scientists to issue more alarming forecasts.","D":"It is almost entirely due to a single record-breaking summer in the Arctic last year.","E":"Earlier projections were deliberately conservative for diplomatic reasons, and we are now correcting for that."},"why":"Sonraki replikteki 'not that underlying warming is dramatically faster, but that we now better understand how ice sheets contribute' özetlemesi ve son repliğin 'dynamics of Greenland and Antarctic ice sheets ... more sensitive than earlier models assumed' detayı B'yi gerektirir. A komplo, C özetlemeyle zıt, D abartılı tekil olay, E ideolojik."},{"why":"A şu üç unsuru korur: (1) 'widespread perception ... hard to substantiate' (yaygın algı, doğrulanması zor), (2) 'comparable cross-generational data is scarce', (3) 'notions of what counts as relevant knowledge have shifted'. B tam tersini söyler; C 'impossible' abartı; D nedensel iddia kurar; E 'disproved' tam zıt.","choices":{"E":"The widespread perception that students retain less factual knowledge has been disproved by comparable cross-generational data, although debates continue about what kinds of knowledge schools should prioritise.","B":"Although many people assume that today's students know fewer facts than students of previous generations, this claim is hard to verify, both because comparable data across generations is limited and because the very definition of important knowledge has changed.","D":"Today's students retain less factual knowledge than students of previous generations primarily because the educational system has shifted its emphasis toward skills over content.","A":"Recent studies have conclusively demonstrated that the popular belief in declining factual knowledge among students reflects a real generational shift in educational standards rather than mere nostalgia.","C":"Cross-generational comparisons of student knowledge have become impossible to conduct reliably, since the curriculum has changed so drastically that no shared baseline remains for comparison purposes."},"n":35,"ans":"B","stem":"<b>The widespread perception that students retain less factual knowledge than their predecessors a generation ago has, on closer inspection, proved difficult to substantiate, in part because comparable cross-generational data is scarce and in part because notions of what counts as relevant knowledge have themselves shifted.</b>","slug":"gri-mod-yds-deneme2-1-35"},{"choices":{"C":"Sceptics argue that universal income schemes cannot reduce poverty without simultaneously reducing stigma, while supporters maintain that political sustainability is the only real obstacle.","A":"Both supporters and opponents of universal income schemes agree that these programmes would substantially reduce poverty, but they disagree about whether the existing welfare state should be preserved alongside them.","D":"Whether or not universal income schemes can reduce poverty and stigma simultaneously, they have not yet attracted enough political support to be implemented on a national scale anywhere in the world.","B":"Universal income schemes have proven politically sustainable in the small number of countries where they have been tried, although stigma effects have been more modest than supporters predicted.","E":"Proponents claim that universal income schemes would address both poverty and stigma at once, but critics argue that the political sustainability of such programmes would require significant cuts elsewhere in social spending."},"n":36,"why":"A şu dört unsuru aktarır: (1) 'advocates argue ... reduce poverty and stigma simultaneously', (2) unconditional payment fikri, (3) 'sceptics counter that', (4) 'without substantial reductions elsewhere in the welfare state'. B/C/D/E ya unsurları kaybeder ya da yeni iddialar ekler.","slug":"gri-mod-yds-deneme2-1-36","ans":"E","stem":"<b>While advocates of universal income schemes argue that providing every citizen with a regular unconditional payment would reduce poverty and stigma simultaneously, sceptics counter that such programmes are unlikely to be politically sustainable without substantial reductions elsewhere in the welfare state.</b>"},{"why":"Paragraf önce kültürel argümanı sunar; boşluktan sonraki kısım 'studies ... how speakers categorise space, time, and causation' diyerek deneysel/bilişsel bir bakışa geçer. C bu geçişi tam ifade eder: 'ikinci ve giderek deneysel bir argüman ... dil ile düşünce ilişkisi.' Diğerleri farklı yönlere kayar.","choices":{"E":"Documentation efforts have produced impressive archives of recordings, dictionaries, and grammars in recent decades.","B":"But there is a second, increasingly empirical argument that turns on the relationship between language and thought.","D":"Many endangered languages survive only in the speech of older community members, often in geographically isolated regions.","A":"Public interest in endangered languages has grown in parallel with global concerns about biodiversity and cultural heritage.","C":"Critics counter, however, that languages have always died out and that policy interventions tend to slow rather than reverse the process."},"n":37,"ans":"B","stem":"<div class='passage'>The case for protecting endangered languages is often framed in cultural terms: each language, the argument runs, embodies a distinctive way of organising human experience, and its loss diminishes the collective heritage of humanity. <b>----</b> Studies of how speakers of typologically diverse languages categorise space, time, and causation suggest that some cognitive distinctions, though always available in principle, are far more readily made by speakers of languages that grammaticalise them. If correct, this would mean that linguistic diversity is not merely an aesthetic or sentimental concern, but contributes to the cognitive resources available to humanity as a whole.</div>","slug":"gri-mod-yds-deneme2-1-37"},{"n":38,"choices":{"B":"The conventional view, which credited medical breakthroughs with most of the gains, has been substantially revised over the past several decades.","D":"Statistical reconstruction of nineteenth-century mortality has been complicated by inconsistent record-keeping.","E":"Mortality from infectious disease remains substantial in many lower-income countries today.","C":"Most countries experienced their largest mortality declines well before the discovery of antibiotics.","A":"Vaccination programmes were widely introduced during this period, but their impact on overall mortality has been disputed."},"why":"Boşluktan sonraki kısım 'sanitation ... housing ... nutrition appear to account for much of the early decline ... vaccines and antibiotics playing a measurable but later role' diyerek geleneksel görüşün (tıbbi atılımlar başroldedir) revize edildiğini gösterir. B bu geçişi kurar.","slug":"gri-mod-yds-deneme2-1-38","stem":"<div class='passage'>Historians of medicine have long debated the role of public health measures, as opposed to specific medical treatments, in the decline of infectious disease mortality in the nineteenth century. <b>----</b> Sanitation reform, improvements in housing, and rising standards of nutrition appear to account for much of the early decline in mortality from diseases such as tuberculosis and cholera, with vaccines and antibiotics playing a measurable but later role. This historical pattern continues to inform contemporary debates about how scarce health resources should be allocated between clinical care and broader social investment.</div>","ans":"B"},{"choices":{"C":"II","A":"I","D":"III","B":"IV","E":"V"},"n":39,"why":"Paragraf bilimsel bir konuyu (mikrobiyom araştırması, hastalık ilişkileri, klinik çeviri zorlukları) işler. IV. cümle Batılı tüketicilerin fermente gıda eğilimine ve kültürel akıma geçer; bilimsel akıştan tamamen kopar.","slug":"gri-mod-yds-deneme2-1-39","ans":"B","stem":"<div class='passage'><b>(I)</b> The microbiome — the vast community of bacteria, viruses, fungi, and other microorganisms that inhabit the human body — has emerged in recent years as a central focus of biomedical research. <b>(II)</b> Disturbances to the gut microbiome in particular have been linked to a range of conditions, from inflammatory bowel disease and obesity to anxiety and depression. <b>(III)</b> Researchers have begun to identify specific microbial signatures associated with various pathological states, opening up potentially novel diagnostic and therapeutic avenues. <b>(IV)</b> The recent surge of interest in fermented foods among Western consumers reflects a broader cultural turn toward traditional and artisanal diets. <b>(V)</b> However, distinguishing genuinely causal relationships from mere statistical associations has proved unexpectedly difficult, and progress on translating microbiome research into reliable clinical interventions has been slower than early enthusiasm suggested.</div>"},{"why":"Paragrafın bütünü jeotermal enerjiye odaklanır (mevcut durum, teknolojik ilerleme, mühendislik sistemleri, zorluklar). III. cümle hidroelektrik enerjiye geçer ve jeotermal odağı bozar.","choices":{"B":"II","D":"III","E":"V","C":"IV","A":"I"},"n":40,"stem":"<div class='passage'><b>(I)</b> Geothermal energy, which harnesses heat from beneath the Earth's surface, has long been a relatively minor component of the global renewable mix, accounting for a small percentage of total electricity generation. <b>(II)</b> Recent technological advances, however, have begun to expand the range of locations where geothermal power is economically feasible, including regions that lack the high-grade resources traditionally associated with the technology. <b>(III)</b> Hydroelectric power continues to provide the largest share of renewable electricity in many countries, particularly those with substantial river systems. <b>(IV)</b> Engineered geothermal systems, in which fluid is circulated through artificially fractured rock, allow electricity generation in geological settings that would once have been considered unsuitable. <b>(V)</b> Although significant challenges remain, particularly concerning induced seismicity and long-term reservoir management, geothermal power may yet come to play a larger role in the transition to low-carbon energy.</div>","ans":"D","slug":"gri-mod-yds-deneme2-1-40"}]}],"id":"deneme2","group":"Drilller"},{"blocks":[{"x":"Serinin Ã¼Ã§Ã¼ncÃ¼ kitapÃ§Ä±ÄÄ±: ileri seviye paragraflar ve sÄ±nav Ã¶ncesi son tekrar. GerÃ§ek YDS formatÄ±nda 40 Ã¶zgÃ¼n soru, TÃ¼rkÃ§e aÃ§Ä±klamalÄ±.","t":"p"},{"t":"mcqquiz","items":[{"slug":"gri-mod-yds-deneme3-1-1","choices":{"E":"verified","C":"substantiated","B":"acknowledged","D":"unsubstantiated","A":"corroborated"},"n":1,"stem":"The senator dismissed allegations of impropriety as ----, claiming they had been fabricated by political opponents seeking to damage her standing ahead of the election.","why":"'Dismissed ... as' yapısı dayanaksız bir şeyi reddetmek anlamı verir; 'fabricated by political opponents' ile uyumludur. Unsubstantiated (kanıtlanmamış, dayanaksız) tam karşılıktır. Corroborated, substantiated, verified zıt yönde (kanıtlanmış); acknowledged (kabul edilmiş) bağlamı tutmaz.","ans":"D"},{"ans":"D","why":"'While X to outsiders, prove on closer examination to embody sophisticated knowledge' yapısı zıtlık kurar: dışarıdan anlaşılmaz ama yakından bakıldığında bilgili. Opaque (anlaşılmaz, kapalı) bu zıtlığı kurar. Discernible/accessible (görünür/erişilebilir) zıt; inconsequential (önemsiz) yanlış yön; commonplace (sıradan) zıtlık kurmaz.","stem":"Anthropologists studying nomadic communities in the highlands have documented practices that, while ---- to outsiders, prove on closer examination to embody sophisticated ecological knowledge.","n":2,"choices":{"A":"discernible","E":"commonplace","C":"accessible","D":"opaque","B":"inconsequential"},"slug":"gri-mod-yds-deneme3-1-2"},{"slug":"gri-mod-yds-deneme3-1-3","choices":{"A":"restrictiveness","E":"inadequacy","C":"convenience","B":"obsolescence","D":"dependability"},"why":"'Although [erişim sağlar], [kolaylığı yüzeysel meşgul olmaya yol açabilir]' karşıtlık kurar. Convenience (kolaylık) erişim avantajının olumsuz yan etkisini açıklar. Restrictiveness/obsolescence/inadequacy zıt yön; dependability (güvenilirlik) yüzeysellikle bağlantılı değildir.","n":3,"stem":"Although the new digital archive offers unprecedented access to historical materials, scholars warn that its very ---- may encourage superficial engagement at the expense of careful interpretation.","ans":"C"},{"ans":"C","why":"Inversion ile kurulmuş üçüncü tip koşul: 'Had + S + V3, ... could/would/might have + V3.' Geçmişte gerçekleşmemiş koşul ve sonucu. Diğer kombinasyonlar yapıyı bozar.","n":4,"stem":"Had the commission ---- the warning signs in time, several of the structural failures that occurred during the storm ---- prevented entirely.","choices":{"E":"recognising / might be","C":"recognised / could have been","B":"recognises / will have been","D":"had recognised / would have","A":"been recognising / could be"},"slug":"gri-mod-yds-deneme3-1-4"},{"slug":"gri-mod-yds-deneme3-1-5","choices":{"C":"implementing / they had required","E":"be implemented / they require","D":"to be implemented / requires","B":"were implemented / require","A":"are implemented / required"},"n":5,"stem":"The minister insisted that the new procurement guidelines ---- without further delay, despite warnings from the audit office that ---- a thorough review.","why":"'Insist that X be V3' subjunctive (mandative) yapısıdır — emir/öneri fiillerinin ardından base form kullanılır. İkinci boşluk 'warnings that they require' defining relative clause olarak simple present'tir.","ans":"E"},{"slug":"gri-mod-yds-deneme3-1-6","choices":{"A":"on / denounced","D":"about / to denounce","B":"over / denouncing","C":"by / having denounced","E":"towards / denouncing"},"n":6,"stem":"Public opinion was sharply divided ---- the proposed legislation, with some commentators describing it as a long-overdue reform and others ---- it as an unwarranted intrusion into private life.","why":"'Divided over X' (X konusunda bölünmüş) standart kalıptır. İkinci boşluk paralel yapıdır: 'some describing ... others denouncing' — ikisi de present participle. A her iki gereksinimi karşılar.","ans":"B"},{"ans":"A","why":"'Given X, Y' yapısı 'X göz önünde bulundurulduğunda Y' anlamı verir. Akademik yayın bolluğu durumu karşısında akademisyenlerin ayıklama görevini sunar. Because of yalnız neden, unlike/in contrast to karşılaştırma, as long as koşul içindir.","stem":"---- the increasing volume of academic publications, scholars now face the difficult task of identifying which findings genuinely advance their field and which merely repeat established conclusions.","n":7,"choices":{"A":"Given","E":"As long as","C":"Unlike","D":"In contrast to","B":"Because of"},"slug":"gri-mod-yds-deneme3-1-7"},{"why":"'Not until + clause, [aux + S + V]' inversion kuralı: olumsuzluk başa gelince yardımcı fiil özneden önce gelir. B/C/E inversion yapmaz; D yardımcı fiil olmadan özne-fiil yer değiştirir.","stem":"Not until the second edition ---- the author's most controversial claims, which had provoked considerable debate in the original printing.","n":8,"ans":"D","slug":"gri-mod-yds-deneme3-1-8","choices":{"D":"did the publishers remove","B":"the publishers were removing","E":"the publishers have removed","C":"removed the publishers","A":"the publishers had removed"}},{"ans":"A","why":"'Arise from + sebep' standart kalıbıdır: bir durumun belirli faktörlerden kaynaklanması. 'Into' yön, 'over' üzerinde, 'towards' yöneliş, 'for' amaç gösterir; hiçbiri kaynak anlamı vermez.","stem":"<div class='passage'>Cities are now widely recognised as significantly warmer than the surrounding countryside, a phenomenon climatologists describe as the \"urban heat island\" effect. The temperature differential — sometimes several degrees during summer evenings — arises <b>(9) ----</b> a combination of factors: dense built surfaces that retain heat, reduced vegetation cover, and waste heat from vehicles, air conditioning, and industry. These differences are not merely uncomfortable. Periods of extreme heat now <b>(10) ----</b> a substantial public health burden, particularly for older residents and those in poorly insulated housing. Mitigation strategies fall into two broad categories. Some focus on the urban surface itself, <b>(11) ----</b> the reflectivity of roofs and pavements or expanding green spaces that cool through evapotranspiration. Others target the broader system, encouraging shifts in transport and building design that reduce waste heat at its source. <b>(12) ----</b> such interventions can produce measurable improvements, their adoption has been uneven, often constrained by cost, regulatory complexity, and competing pressures on urban land. The challenge for planners is to design responses that scale with the size of the problem <b>(13) ----</b> remaining responsive to the specific conditions of each neighbourhood.</div><div class='qprompt'>9.</div>","n":9,"choices":{"C":"over","E":"for","B":"into","D":"towards","A":"from"},"slug":"gri-mod-yds-deneme3-1-9"},{"slug":"gri-mod-yds-deneme3-1-10","choices":{"B":"lift","D":  calibrated way.</p><p>None of these is a complete solution, but each addresses the political-epistemic problem that the technology has introduced: not merely that false content can spread, but that the very notion of shared evidence is becoming harder to sustain.</p></div><div class='qprompt'>According to the passage, the immediate concern raised by deepfake technology is that ----.</div>","why":"Pasaj 'immediate concern is straightforward: forged content can be used to defame political figures, distort public memory of past events, or trigger reactions to events that never occurred' diyerek B'yi doğrudan ifade eder."},{"slug":"gri-mod-yds-deneme3-1-27","choices":{"B":"the legal advantages enjoyed by those who produce synthetic media for satirical purposes","D":"the benefit to dishonest actors who can plausibly dismiss authentic damaging evidence as fabricated","E":"the increased trust placed in mainstream journalism during periods of widespread misinformation","C":"the rhetorical strategies employed by political campaigns during election cycles","A":"the financial profits that platforms accrue from hosting fabricated content"},"why":"Pasaj 'the liar's dividend ... potentially benefits those whose actions would otherwise be exposed by authentic documentation: they can plausibly claim that compromising footage is itself a deepfake' diyerek B'yi tanımlar.","stem":"<div class='passage'><p>The rapid improvement of synthetic media — particularly so-called deepfakes, which can convincingly fabricate images, audio, and video — has begun to reshape debates about democratic legitimacy in ways that political theorists are only beginning to map. The immediate concern is straightforward: forged content can be used to defame political figures, distort public memory of past events, or trigger reactions to events that never occurred.</p><p>Yet some scholars argue that the deeper threat lies elsewhere. As the public becomes aware that any given recording could in principle be fabr ularly so-called deepfakes, which can convincingly fabricate images, audio, and video — has begun to reshape debates about democratic legitimacy in ways that political theorists are only beginning to map. The immediate concern is straightforward: forged content can be used to defame political figures, distort public memory of past events, or trigger reactions to events that never occurred.</p><p>Yet some scholars argue that the deeper threat lies elsewhere. As the public becomes aware that any given recording could in principle be fabricated, the credibility of genuine evidence — recordings of corruption, abuses, or simple policy statements — may also erode. This second-order effect, sometimes called the \"liar's dividend\", potentially benefits those whose actions would otherwise be exposed by authentic documentation: they can plausibly claim that compromising footage is itself a deepfake, even when it is not.</p><p>Technical responses, such as cryptographic watermarking of authentic content or improved detection algorithms, are advancing but face fundamental limits in an environment where generation technology continues to improve. Several researchers have therefore argued that the more durable defence may lie in institutional rather than technical reform: stronger journalistic verification standards, more rapid official confirmation or denial of contested material, and educational efforts to help citizens evaluate evidence in a more calibrated way.</p><p>None of these is a complete solution, but each addresses the political-epistemic problem that the technology has introduced: not merely that false content can spread, but that the very notion of shared evidence is becoming harder to sustain.</p></div><div class='qprompt'>One can infer from the passage that purely technical responses to deepfakes are ----.</div>"},{"choices":{"B":"They are likely to make technical defences entirely unnecessary","D":"They have so far proved more controversial than the technology itself","C":"They cannot succeed without the prior establishment of international treaties","E":"They may offer a more durable defence even though they too are partial solutions","A":"They have been universally adopted by major democracies in recent years"},"slug":"gri-mod-yds-deneme3-1-29","ans":"E","stem":"<div class='passage'><p>The rapid improvement of synthetic media — particularly so-called deepfakes, which can convincingly fabricate images, audio, and video — has begun to reshape debates about democratic legitimacy in ways that political theorists are only beginning to map. The immediate concern is straightforward: forged content can be used to defame political figures, distort public memory of past events, or trigger reactions to events that never occurred.</p><p>Yet some scholars argue that the deeper threat lies elsewhere. As the public becomes aware that any given recording could in principle be fabricated, the credibility of genuine evidence — recordings of corruption, abuses, or simple policy statements — may also erode. This second-order effect, sometimes called the \"liar's dividend\", potentially benefits those whose actions would otherwise be exposed by authentic documentation: they can plausibly claim that compromising footage is itself a deepfake, even when it is not.</p><p>Technical responses, such as cryptographic watermarking of authentic content or improved detection algorithms, are advancing but face fundamental limits in an environment where generation technology continues to improve. Several researchers have therefore argued that the more durable defence may lie in institutional rather than technical reform: stronger journalistic verification standards, more rapid official confirmation or denial of contested material, and educational efforts to help citizens evaluate evidence in a more calibrated way.</p><p>None of these is a complete solution, but each addresses the political-epistemic problem that the technology has introduced: not merely that false content can spread, but that the very notion of shared evidence is becoming harder to sustain.</p></div><div class='qprompt'>What does the author suggest about institutional rather than technical responses?</div>","n":29,"why":"Pasaj 'the more durable defence may lie in institutional rather than technical reform' der ve 'None of these is a complete solution, but each addresses the political-epistemic problem' diyerek nüansı korur. D bu dengeyi tam aktarır."},{"n":30,"stem":"<div class='passage'><p>For much of the twentieth century, scientific understanding of cognitive ageing was shaped by cross-sectional studies that compared the performance of younger and older adults at a single moment in time. Such studies typically found substantial age-related decline across a range of cognitive measures, a pattern that was widely interpreted as evidence of intrinsic deterioration with age.</p><p>More recent longitudinal research — which follows the same individuals over many years — has complicated this picture in several ways. Within-person decline is real but often considerably smaller than cross-sectional comparisons had suggested; some cognitive abilities, including aspects of vocabulary and general knowledge, can remain stable or even improve well into later life; and the variability between individuals at any given age is large, with lifestyle, education, and health together accounting for much of the difference. Taken together, these findings have shifted attention away from age itself as the central explanatory factor and toward the conditions and experiences that shape how individuals age.</p></div><div class='qprompt'>One can infer from the passage that earlier cross-sectional studies of cognitive ageing ----.</div>","why":"Pasaj 'Within-person decline is real but often considerably smaller than cross-sectional comparisons had suggested' diyerek B'yi doğrudan ima eder: kesitsel çalışmalar yaşa bağlı düşüşü abartmış olabilir. A 'entirely discredited' aşırı; C/D/E pasajda yok.","ans":"E","slug":"gri-mod-yds-deneme3-1-30","choices":{"A":"have been entirely discredited by recent longitudinal research","E":"may have overstated the extent of age-related decline by comparing different cohorts","C":"failed to consider gender differences in cognitive performance","D":"were primarily concerned with very early stages of cognitive development","B":"focused exclusively on populations with high levels of educational attainment"}},{"choices":{"E":"intrinsic age-related decline to the conditions and experiences that shape ageing","C":"cross-sectional to qualitative methods","D":"individual variation to population-level averages","B":"cognitive abilities to physical health","A":"genetic factors to environmental factors"},"slug":"gri-mod-yds-deneme3-1-31","ans":"E","stem":"<div class='passage'><p>For much of the twentieth century, scientific understanding of cognitive ageing was shaped by cross-sectional studies that compared the performance of younger and older adults at a single moment in time. Such studies typically found substantial age-related decline across a range of cognitive measures, a pattern that was widely interpreted as evidence of intrinsic deterioration with age.</p><p>More recent longitudinal research — which follows the same individuals over many years — has complicated this picture in several ways. Within-person decline is real but often considerably smaller than cross-sectional comparisons had suggested; some cognitive abilities, including aspects of vocabulary and general knowledge, can remain stable or even improve well into later life; and the variability between individuals at any given age is large, with lifestyle, education, and health together accounting for much of the difference. Taken together, these findings have shifted attention away from age itself as the central explanatory factor and toward the conditions and experiences that shape how individuals age.</p></div><div class='qprompt'>According to the passage, recent research has shifted explanatory focus from ----.</div>","n":31,"why":"Pasajın son cümlesi: 'These findings have shifted attention away from age itself as the central explanatory factor and toward the conditions and experiences that shape how individuals age.' B birebir karşılıktır."},{"slug":"gri-mod-yds-deneme3-1-32","choices":{"B":"It mainly reflects differences in research and development costs that vary across pharmaceutical companies.","D":"It is largely an effect of currency fluctuations between the producing country and the consuming country.","E":"The gap will disappear naturally as more generic manufacturers enter the market over the next decade.","C":"Most of the gap comes down to how the market for the drug is organised, particularly who has the power to negotiate on the buyer's side.","A":"The most important factor is patent protection, which expires after a fixed number of years regardless of country."},"why":"Sonraki replikteki 'regulatory and bargaining environment ... not about underlying chemistry' özetlemesi ve son repliğin 'single national purchaser ... fragmented market with limited bargaining power' detayı C'yi gerektirir: piyasanın nasıl örgütlendiği ve alıcı tarafın pazarlık gücü belirleyici. A/B/D/E sonraki repliğe uymaz.","stem":"<div class='dia'><p><b>Pharmaceutical analyst:</b><br>The recent debate over insulin pricing has highlighted just how much patients in some countries pay for medications that cost very little to produce. How would you account for that gap?</p><p><b>Health policy researcher:</b><br>----</p><p><b>Pharmaceutical analyst:</b><br>So the price tells us more about the regulatory and bargaining environment than about the underlying chemistry?</p><p><b>Health policy researcher:</b><br>Exactly. Where a single national purchaser negotiates prices on behalf of an entire population, costs tend to fall close to production levels; where the market is fragmented across many private payers with limited bargaining power, the same drug can command many times that figure with no corresponding change in its physical properties.</p></div>","n":32,"ans":"C"},{"ans":"C","why":"Sonraki replik 'practical response to audience expectations and partly an interpretive choice' iki bileşeni özetler; B her ikisini ortaya koyar: çağdaş eserlerin tanıdık eserlerle programlanmasının kolaylığı + karşılaştırmanın yeni boyutlar açması. A/C/D/E tek boyutlu veya konu dışıdır.","stem":"<div class='dia'><p><b>Music critic:</b><br>I've been struck by how often contemporary classical concerts pair very new works with much older ones rather than presenting either alone. What's your sense of why that has become standard practice?</p><p><b>Conductor:</b><br>----</p><p><b>Music critic:</b><br>So it's partly a practical response to audience expectations and partly an interpretive choice that lets the older and newer works illuminate one another?</p><p><b>Conductor:</b><br>Precisely. Audiences trained primarily on the classical repertoire are often reluctant to commit to an evening of unfamiliar contemporary music, but they respond differently when a new piece is heard alongside a familiar one, and the juxtaposition itself can reveal connections — formal, harmonic, or emotional — that neither work would suggest on its own.</p></div>","n":33,"choices":{"E":"The trend reflects the influence of academic music programmes, which have made cross-period comparison a standard pedagogical tool.","C":"Several considerations are at work, but two stand out: contemporary works are easier to programme alongside familiar pieces, and the comparison can open up dimensions of each that would not be apparent in isolation.","D":"Most conductors choose pairings based on technical considerations such as instrumentation and rehearsal efficiency.","B":"Honestly, I think the practice is gradually disappearing as audiences become more receptive to contemporary music on its own terms.","A":"The pairing is largely a marketing decision designed to inflate ticket sales without compromising programmatic seriousness."},"slug":"gri-mod-yds-deneme3-1-33"},{"n":34,"stem":"<div class='dia'><p><b>Hydrologist:</b><br>Several regions that have not historically faced serious water stress are now experiencing repeated droughts and falling reservoir levels. How should we interpret this shift?</p><p><b>Climate adaptation specialist:</b><br>----</p><p><b>Hydrologist:</b><br>So it's not simply that the climate is changing in the abstract, but that systems designed for one set of conditions are now operating outside their original assumptions?</p><p><b>Climate adaptation specialist:</b><br>Exactly. Reservoirs, agricultural systems, and even municipal pricing structures were all designed on the basis of historical rainfall patterns, and when those patterns shift, the infrastructure does not automatically adjust. The result is that the same physical change produces very different practical consequences depending on how rigidly local systems were built around prior expectations.</p></div>","why":"Sonraki replik 'systems designed for one set of conditions are now operating outside their original assumptions' özetlemesi ve son repliğin 'infrastructure does not automatically adjust' detayı B'yi gerektirir: uzun ömürlü altyapı varsayımları ile yeni iklim arasındaki uyumsuzluk. A geçici görür; C/D başka nedenlere yönlendirir; E tarihselliği reddeder.","ans":"A","slug":"gri-mod-yds-deneme3-1-34","choices":{"A":"Part of what we are seeing is a mismatch between long-standing infrastructure assumptions and the climate that now obtains in these regions.","C":"Most of the change is attributable to local mismanagement rather than to any broader climatic trend.","E":"The data simply shows that historical rainfall patterns were never as stable as we assumed.","D":"Population growth in affected regions explains the majority of the additional water stress.","B":"The phenomenon is best understood as a temporary anomaly that will reverse itself within the coming decade."}},{"why":"A şu üç unsuru korur: (1) 'substantially reduced the time' (önemli ölçüde hız kazandırır), (2) 'specialists warn that' (uzmanlar uyarır), (3) 'replicate, and in some cases amplify, the very biases' (yansıtır ve bazen yoğunlaştırır). B tam reddedicidir; C tam zıt (bias eliminated); D yavaş diye yanlış iddia; E sıralamayı bozar.","stem":"<b>Although the introduction of automated screening tools has substantially reduced the time required to filter large numbers of job applications, recruitment specialists warn that such systems can replicate, and in some cases amplify, the very biases they were intended to eliminate.</b>","n":35,"ans":"B","slug":"gri-mod-yds-deneme3-1-35","choices":{"A":"Recruitment specialists now uniformly recommend that organisations abandon automated screening tools because of their persistent bias problems and limited efficiency gains.","E":"Automated screening tools have been deployed primarily to reduce bias rather than to improve speed, although they have so far achieved only the latter goal.","C":"The introduction of automated screening has eliminated bias in recruitment processes, though specialists note that the speed gains have been more modest than originally promised.","D":"Specialists in recruitment have demonstrated that automated screening tools, while slower than manual review, are more reliable in identifying suitable candidates.","B":"Automated screening tools have made it considerably faster to sift through large volumes of job applications, but specialists caution that these systems may reproduce — and sometimes intensify — the biases they were designed to remove."}},{"slug":"gri-mod-yds-deneme3-1-36","choices":{"D":"The political, economic, and cultural priorities of the past are best reconstructed not from contemporaneous documents but from the maps that those societies produced.","B":"Scholars increasingly read historical maps as artefacts of those who commissioned them, which means such maps should no longer be considered useful sources of evidence about the past.","C":"Historical maps that were commissioned by political, economic, or cultural authorities have been shown to contain systematic distortions that reduce their value for contemporary scholarship.","E":"Although historical maps remain valuable evidence of how past societies understood their spaces, scholars now treat them less as neutral records of geography than as objects shaped by the priorities of those who produced them.","A":"Historical maps provide essential evidence about how past societies understood their physical environment, although scholars now generally regard them as scientifically inaccurate."},"why":"C şu dört unsuru aktarır: (1) 'indispensable evidence' (vazgeçilmez kanıt — 'remain valuable'), (2) 'scholars have increasingly emphasised' (giderek vurgular), (3) 'not as transparent records ... but as artefacts shaped by' (tarafsız kayıt değil aksine yapılandırılmış), (4) 'political, economic, and cultural priorities'. A 'scientifically inaccurate' ekler; B kullanışsız olduğu sonucunu çıkarır; D nedensel zincir kurar; E ters bilgi kaynağı önerir.","n":36,"stem":"<b>While historical maps offer indispensable evidence of how particular societies understood the spaces they occupied, scholars have increasingly emphasised that such maps should be read not as transparent records of physical geography but as artefacts shaped by the political, economic, and cultural priorities of those who commissioned them.</b>","ans":"E"},{"why":"Paragraf önce destekçilerin görüşünü sunar; boşluktan sonraki cümle 'challenge ... combine the breadth of mass participation with methodological consistency' diyerek bir gerilime işaret eder. B bu gerilimi tam ortaya koyar: eleştirmenlerin veri kalitesi/tutarlılık endişeleri. A/C/D/E paragrafın akışını kırar.","stem":"<div class='passage'>The increasing involvement of non-specialists in scientific data collection — often grouped under the label \"citizen science\" — has been received with both enthusiasm and concern within the research community. Supporters point to the scale of evidence that can be gathered when thousands of volunteers contribute observations on bird populations, weather events, or astronomical phenomena, often producing datasets that no professional team could feasibly assemble alone. <b>----</b> The challenge for project designers is to develop protocols that combine the breadth of mass participation with the methodological consistency that scientific use of the data requires.</div>","n":37,"ans":"B","slug":"gri-mod-yds-deneme3-1-37","choices":{"A":"Astronomy in particular has been transformed by amateur observation programmes, some of which date back well over a century.","E":"The most ambitious citizen science projects now operate across national borders, coordinating millions of observations annually.","C":"Smartphone applications have made participation considerably easier than it was for earlier generations of amateur observers.","B":"Critics, however, raise legitimate questions about data quality, training, and the consistency with which untrained observers apply technical definitions in the field.","D":"Public engagement with science has been a stated priority of many national funding bodies over the past two decades."}},{"ans":"B","stem":"<div class='passage'>The relationship between economic growth and self-reported happiness has been one of the most contested topics in contemporary welfare research. Early findings appeared to show that once a country reaches a certain level of average income, further growth produces only modest gains in subjective well-being, a result widely interpreted as evidence that material prosperity alone is an insufficient measure of national success. <b>----</b> More recent analyses, drawing on larger datasets and improved measurement, have generally supported the conclusion that the relationship between income and happiness, while complex, does not flatten as sharply as the earliest findings implied.</div>","n":38,"why":"Boşluktan önceki kısım bir bulguyu özetler; boşluktan sonraki kısım 'more recent analyses ... does not flatten as sharply' diyerek aynı bulgunun sonradan revize edildiğine işaret eder. A bu geçişi kurar: 'Easterlin paradox' terimini verir ve 'methodological criticism and renewed interest' diyerek hem itirazları hem yeni araştırma dalgasını öngörür. B/C/D/E geçişi kurmaz.","choices":{"A":"Surveys of subjective well-being have been conducted in most regions of the world over the past several decades.","E":"The technical question of how best to measure happiness across diverse populations remains a matter of active debate.","C":"Public policy responses to such findings have varied widely, with some governments introducing well-being measures alongside conventional economic indicators.","B":"This pattern, sometimes known as the Easterlin paradox, prompted both methodological criticism and renewed interest in alternative indicators of welfare.","D":"Critics often note that self-reported happiness is shaped by cultural expectations as well as by material conditions."},"slug":"gri-mod-yds-deneme3-1-38"},{"why":"Paragraf endüstriyel tarımın azaltıcı etkisi, dayanıklılık endişesi, tohum bankalarının rolü ve uluslararası işbirliği üzerinedir. IV. cümle geleneksel mutfaklara ve kültürel alışverişe geçer; tarımsal genetik çeşitlilik akışını bozar.","n":39,"stem":"<div class='passage'><b>(I)</b> Industrial agriculture has substantially reduced the genetic diversity of the crops on which global food supplies depend, with a handful of varieties now accounting for the bulk of cultivation worldwide. <b>(II)</b> This narrowing of the genetic base has raised serious concerns about resilience: a single pest outbreak or climatic shift can have disproportionate consequences when so much of the food supply rests on so few varieties. <b>(III)</b> Seed banks have therefore taken on growing importance as repositories of genetic material that may prove essential for future breeding programmes. <b>(IV)</b> Many traditional cuisines around the world combine ingredients in ways that reflect long histories of regional trade and cultural exchange. <b>(V)</b> International cooperation in maintaining these collections has improved in recent years, although the long-term funding required to sustain them remains a recurring concern.</div>","ans":"B","slug":"gri-mod-yds-deneme3-1-39","choices":{"A":"I","E":"V","C":"II","B":"IV","D":"III"}},{"slug":"gri-mod-yds-deneme3-1-40","choices":{"C":"III","E":"V","B":"II","D":"IV","A":"I"},"why":"Paragraf hastalık modellerinin gelişimi (varsayımlar, ağ tabanlı modeller, sosyal ağ yapısının önemi) üzerinedir. IV. cümle matematiğin fizikteki kullanımına geçer ve halk sağlığı/epidemiyoloji akışından kopar.","n":40,"stem":"<div class='passage'><b>(I)</b> Mathematical models of disease spread have become indispensable tools for public health planning, allowing officials to anticipate the likely trajectory of an outbreak under different intervention scenarios. <b>(II)</b> Early models typically assumed that populations mix randomly, an assumption that simplified calculations but did not match the structured patterns of contact observed in real societies. <b>(III)</b> Network-based models, which represent contacts among individuals or groups as edges in a graph, have helped capture the heterogeneity that earlier approaches missed. <b>(IV)</b> Mathematics has a long history of applications in physics, particularly in mechanics, electromagnetism, and quantum theory. <b>(V)</b> Such refinements have proved especially valuable in modelling diseases transmitted through close personal contact, where the structure of social networks substantially shapes how an outbreak unfolds.</div>","ans":"D"}]}],"group":"Drilller","eyebrow":"Drill","id":"deneme3","name":"Mini Deneme 3"},{"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "note", "k": "ipucu", "title": "Kelime", "lines": ["YDS'de kelime her şeydir. Akademik kelimeleri collocation ile öğren: make a contribution, pose a threat, draw a conclusion.", "Tuzak şık genelde tanıdık kelime ama yanlış anlam ilişkisi kurar."]}, {"t": "note", "k": "ipucu", "title": "Yapı ve bağlaç", "lines": ["despite/owing to/because of isim öbeği ister; although/because/since cümle ister. Bu ayrım çok soru kazandırır.", "however, therefore, consequently zarftır; iki cümle arasında noktalı virgül veya nokta ile gelir, bağlaç değildir."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  if(q.n>=2){fb.className='grifb on err';fb.textContent='Bugünlük Gri değerlendirme hakkın doldu (2/2). Yarın tekrar dene.';return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
