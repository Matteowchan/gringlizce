  <script>
    (async function () {
      var SUPABASE_URL = 'https://vazbvbqgvtlaqkytfsbi.supabase.co';
      var SUPABASE_KEY = 'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g';

      if (!window.supabase || !window.supabase.createClient) {
        console.error('Supabase yüklenemedi');
        return;
      }
      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });

      var loadingEl = document.getElementById('oks-loading');
      var contentEl = document.getElementById('oks-content');
      var errorEl = document.getElementById('oks-error');
      var errorMsgEl = document.getElementById('oks-error-msg');

      function showError(msg) {
        if (loadingEl) loadingEl.style.display = 'none';
        if (contentEl) contentEl.style.display = 'none';
        if (errorEl) errorEl.style.display = '';
        if (errorMsgEl) errorMsgEl.textContent = msg;
      }

      function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      }

      function fmtDate(s) {
        if (!s) return '—';
        var d = new Date(s);
        var months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
        return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      }

      function fmtDateShort(s) {
        if (!s) return '—';
        var d = new Date(s);
        var months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
        return d.getDate() + ' ' + months[d.getMonth()];
      }

      function fmtRelative(s) {
        if (!s) return '—';
        var d = new Date(s);
        var now = new Date();
        var diffMs = now - d;
        var diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return 'şimdi';
        if (diffMin < 60) return diffMin + ' dk önce';
        var diffHour = Math.floor(diffMin / 60);
        if (diffHour < 24) return diffHour + ' sa önce';
        var diffDay = Math.floor(diffHour / 24);
        if (diffDay < 7) return diffDay + ' gün önce';
        return fmtDateShort(s);
      }

      function humanizeCategory(s) {
        if (!s) return '';
        return s.split(/[-_]/).map(function (w) {
          return w.charAt(0).toUpperCase() + w.slice(1);
        }).join(' ');
      }

      // 1. URL'den class_id al
      var params = new URLSearchParams(window.location.search);
      var classId = params.get('id');
      if (!classId) {
        showError('Sınıf ID bulunamadı.');
        return;
      }

      // 2. Auth check
      var sess = await sb.auth.getSession();
      if (!sess || !sess.data || !sess.data.session) {
        window.location.href = 'giris.html?return=/ogretmen-sinif.html?id=' + classId;
        return;
      }

      // 3. Sınıf detayı + roster paralel
      var classRes, rosterRes;
      try {
        [classRes, rosterRes] = await Promise.all([
          sb.rpc('class_detail', { p_class_id: classId }),
          sb.rpc('class_roster',  { p_class_id: classId })
        ]);
        if (classRes.error) throw classRes.error;
        if (rosterRes.error) throw rosterRes.error;
      } catch (err) {
        var msg = String(err.message || err);
        if (/not_class_owner|not_found/i.test(msg)) {
          showError('Bu sınıfı görüntülemek için yetkin yok ya da sınıf bulunamadı.');
        } else {
          showError('Yüklenemedi: ' + msg);
        }
        return;
      }

      var classInfo = classRes.data || {};
      var students = rosterRes.data || [];

      // 4. Class info doldur
      document.title = (classInfo.name || 'Sınıf') + ' | Gri English';
      document.getElementById('oks-class-name').textContent = classInfo.name || 'Sınıf';
      var descEl = document.getElementById('oks-class-desc');
      if (classInfo.description) {
        descEl.textContent = classInfo.description;
      } else {
        descEl.style.display = 'none';
      }

      document.getElementById('oks-member-count').textContent = classInfo.member_count || 0;
      document.getElementById('oks-assignment-count').textContent = classInfo.assignment_count || 0;
      document.getElementById('oks-created-date').textContent = fmtDateShort(classInfo.created_at);

      var codeEl = document.getElementById('oks-join-code');
      codeEl.textContent = classInfo.join_code || '—';
      codeEl.addEventListener('click', function () {
        if (navigator.clipboard && classInfo.join_code) {
          navigator.clipboard.writeText(classInfo.join_code).then(function () {
            var orig = codeEl.textContent;
            codeEl.textContent = 'Kopyalandı';
            setTimeout(function () { codeEl.textContent = orig; }, 1500);
          });
        }
      });

      // 5. Roster render
      var rosterBody = document.getElementById('oks-roster-body');
      if (students.length === 0) {
        rosterBody.innerHTML = ''
          + '<div class="oks-empty">'
          + '<h3>Henüz öğrenci yok</h3>'
          + '<p>Bu kodu öğrencilerinle paylaş. Panelim\'den "Sınıfa Katıl" diyerek girebilirler.</p>'
          + '<div class="oks-empty-code">' + esc(classInfo.join_code || '') + '</div>'
          + '</div>';
      } else {
        var rows = students.map(function (s) {
          var total = parseInt(s.total_answers) || 0;
          var correct = parseInt(s.correct_answers) || 0;
          var accPct = parseFloat(s.accuracy_pct) || 0;
          var accClass = total === 0 ? 'zero' : (accPct < 50 ? 'low' : '');
          var accText = total === 0 ? '—' : accPct + '%';

          return ''
            + '<tr class="oks-roster-row" data-id="' + esc(s.student_id) + '" data-email="' + esc(s.student_email) + '">'
              + '<td class="col-email">' + esc(s.student_email || '(e-posta yok)') + '</td>'
              + '<td>' + total + '</td>'
              + '<td class="col-accuracy ' + accClass + '">' + accText + '</td>'
              + '<td class="col-meta">' + fmtRelative(s.last_active) + '</td>'
              + '<td class="col-vocab">' + (parseInt(s.vocab_count) || 0) + '</td>'
              + '<td class="col-joined col-meta">' + fmtDateShort(s.joined_at) + '</td>'
              + '<td><button class="oks-remove-btn" data-action="remove" data-id="' + esc(s.student_id) + '" data-email="' + esc(s.student_email) + '" title="Sınıftan çıkar">×</button></td>'
            + '</tr>';
        }).join('');

        rosterBody.innerHTML = ''
          + '<table class="oks-roster-table">'
            + '<thead><tr>'
              + '<th>E-posta</th>'
              + '<th>Cevap</th>'
              + '<th>Doğruluk</th>'
              + '<th>Son Aktivite</th>'
              + '<th class="col-vocab">Kelime</th>'
              + '<th class="col-joined">Katıldı</th>'
              + '<th></th>'
            + '</tr></thead>'
            + '<tbody>' + rows + '</tbody>'
          + '</table>';

        // Row click → drawer
        rosterBody.querySelectorAll('.oks-roster-row').forEach(function (row) {
          row.addEventListener('click', function (e) {
            // Remove button'a tıklama row click'i tetiklemesin
            if (e.target.closest('[data-action="remove"]')) return;
            openStudentDrawer(row.dataset.id, row.dataset.email);
          });
        });

        // Remove button
        rosterBody.querySelectorAll('[data-action="remove"]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            var email = btn.dataset.email || 'bu öğrenci';
            if (!confirm(email + ' adresli öğrenciyi sınıftan çıkarmak istiyor musun?')) return;
            btn.disabled = true;
            try {
              var r = await sb.rpc('remove_student_from_class', {
                p_class_id: classId,
                p_student_id: btn.dataset.id
              });
              if (r.error) throw r.error;
              window.location.reload();
            } catch (err) {
              alert('Çıkarma başarısız: ' + (err.message || err));
              btn.disabled = false;
            }
          });
        });
      }

      // Show content
      loadingEl.style.display = 'none';
      contentEl.style.display = '';

      // === Student drawer ===
      var drawer = document.getElementById('student-drawer');
      var drawerTitle = document.getElementById('osd-title');
      var drawerBody = document.getElementById('osd-body');
      var drawerClose = document.getElementById('osd-close');
      var drawerBackdrop = document.getElementById('osd-backdrop');

      function closeDrawer() {
        drawer.classList.remove('show');
        document.body.style.overflow = '';
      }
      drawerClose.addEventListener('click', closeDrawer);
      drawerBackdrop.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && drawer.classList.contains('show')) closeDrawer();
      });

      async function openStudentDrawer(studentId, email) {
        drawerTitle.textContent = email || 'Öğrenci Detayı';
        drawerBody.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-style: italic;">Yükleniyor...</p>';
        drawer.classList.add('show');
        document.body.style.overflow = 'hidden';

        try {
          var r = await sb.rpc('student_class_detail', {
            p_class_id: classId,
            p_student_id: studentId
          });
          if (r.error) throw r.error;
          renderStudentDetail(r.data || {}, studentId);
        } catch (err) {
          drawerBody.innerHTML = '<p style="color: #b45046; font-style: italic; text-align: center;">Yüklenemedi: ' + esc(err.message || err) + '</p>';
        }
      }

      function renderStudentDetail(d, studentId) {
        var total = parseInt(d.total_answers) || 0;
        var correct = parseInt(d.correct_count) || 0;
        var wrong = parseInt(d.wrong_count) || 0;
        var accPct = parseFloat(d.accuracy_pct) || 0;
        var accClass = accPct < 50 ? 'accuracy-low' : '';
        var accText = total === 0 ? '—' : accPct + '%';
        var categories = d.categories || [];
        var recent = d.recent_answers || [];

        var metaLine = 'Sınıfa katılım: ' + fmtDate(d.joined_at)
          + ' · Son aktivite: ' + (d.last_active ? fmtRelative(d.last_active) : 'henüz yok');

        var summaryHtml = ''
          + '<div class="osd-summary">'
          + '<div class="osd-stat"><div class="osd-stat-val">' + total + '</div><div class="osd-stat-label">Cevap</div></div>'
          + '<div class="osd-stat"><div class="osd-stat-val ' + accClass + '">' + accText + '</div><div class="osd-stat-label">Doğruluk</div></div>'
          + '<div class="osd-stat"><div class="osd-stat-val">' + correct + '</div><div class="osd-stat-label">Doğru</div></div>'
          + '<div class="osd-stat"><div class="osd-stat-val">' + wrong + '</div><div class="osd-stat-label">Yanlış</div></div>'
          + '<div class="osd-stat"><div class="osd-stat-val">' + (parseInt(d.vocab_count) || 0) + '</div><div class="osd-stat-label">Kelime</div></div>'
          + '<div class="osd-stat"><div class="osd-stat-val">' + (parseInt(d.writing_count) || 0) + '</div><div class="osd-stat-label">Writing</div></div>'
          + '</div>';

        // Categories
        var catsHtml = '';
        if (categories.length === 0) {
          catsHtml = '<p style="color: var(--text-muted); font-style: italic;">Henüz veri yok.</p>';
        } else {
          catsHtml = '<ul class="osd-cat-list">' + categories.map(function (c) {
            var caccClass = (parseFloat(c.accuracy) || 0) < 50 ? 'low' : '';
            var examPill = c.exam_type ? '<span class="exam-pill">' + esc(c.exam_type) + '</span>' : '';
            var nameText = humanizeCategory(c.category || '') + (c.subcategory ? ' · ' + humanizeCategory(c.subcategory) : '');
            return ''
              + '<li class="osd-cat-row">'
              + '<div class="osd-cat-name">' + examPill + esc(nameText) + '</div>'
              + '<div class="osd-cat-count">' + c.correct + '/' + c.total + '</div>'
              + '<div class="osd-cat-acc ' + caccClass + '">' + c.accuracy + '%</div>'
              + '</li>';
          }).join('') + '</ul>';
        }

        // Recent answers
        var recentHtml = '';
        if (recent.length === 0) {
          recentHtml = '<p style="color: var(--text-muted); font-style: italic;">Henüz cevap yok.</p>';
        } else {
          recentHtml = '<ul class="osd-recent-list">' + recent.map(function (a) {
            var statusClass = a.status === 'correct' ? 'correct' : (a.status === 'wrong' ? 'wrong' : 'skipped');
            var timeSpent = '';
            if (a.time_spent_ms && a.time_spent_ms > 0) {
              var sec = Math.round(a.time_spent_ms / 1000);
              timeSpent = ' · ' + sec + 's';
            }
            var metaParts = [];
            if (a.exam_type) metaParts.push(esc(a.exam_type));
            if (a.category) metaParts.push(esc(humanizeCategory(a.category)));
            if (a.difficulty) metaParts.push(esc(a.difficulty));
            return ''
              + '<li class="osd-recent-row">'
              + '<span class="osd-recent-status ' + statusClass + '"></span>'
              + '<div class="osd-recent-info">'
                + '<span class="osd-recent-slug">' + esc(a.question_slug || '—') + '</span>'
                + '<div class="osd-recent-meta">' + metaParts.join(' · ') + timeSpent + '</div>'
              + '</div>'
              + '<div class="osd-recent-time">' + fmtRelative(a.answered_at) + '</div>'
              + '</li>';
          }).join('') + '</ul>';
        }

        drawerBody.innerHTML = ''
          + '<p class="osd-meta-line">' + metaLine + '</p>'
          + summaryHtml
          + '<div class="osd-section-title">Kategori Performansı</div>'
          + catsHtml
          + '<div class="osd-section-title">Son Cevaplar</div>'
          + recentHtml
          + '<div class="osd-actions">'
            + '<button class="osd-remove-btn" data-id="' + esc(studentId) + '" type="button">Sınıftan Çıkar</button>'
          + '</div>';

        // Remove from drawer
        drawerBody.querySelector('.osd-remove-btn').addEventListener('click', async function () {
          var email = d.student_email || 'bu öğrenci';
          if (!confirm(email + ' adresli öğrenciyi sınıftan çıkarmak istiyor musun?')) return;
          try {
            var r = await sb.rpc('remove_student_from_class', {
              p_class_id: classId,
              p_student_id: studentId
            });
            if (r.error) throw r.error;
            closeDrawer();
            window.location.reload();
          } catch (err) {
            alert('Çıkarma başarısız: ' + (err.message || err));
          }
        });
      }
    })();
  </script>
</body>
</html>
