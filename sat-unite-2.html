Connections","why_correct":"Text 2 cites trials finding no slowdown and sometimes less eating, contradicting Text 1. Choice A gives the direction.","unit":2},{"id":"u2-l3-f3-01","lesson":3,"passage":"Text 1: A scientist argues that dogs understand human pointing because domestication shaped them to read our gestures.\n\nText 2: Wolves raised by humans can learn to follow pointing too, a second scientist notes, which suggests the ability may owe as much to close contact as to domestication.","correct":"C","why_wrong":{"B":"Text 2 refines the cause; it does not refute that dogs read gestures, so 'completely refutes' overstates the relationship.","A":"Text 2 offers a different cause, so it is not a restatement.","D":"Text 2 accepts the ability; 'cannot understand pointing' reverses it."},"why_correct":"Text 2 accepts that the animals read pointing but qualifies the cause (contact, not only domestication). Choice A names that limited disagreement.","choice_families":{"D":"İlişki yönü ters","A":"İlişkiyi yanlış kurma","B":"İlişkiyi yanlış kurma"},"unit":2,"target_family":"İlişkiyi yanlış kurma","choices":{"D":"Text 2 argues that dogs cannot understand pointing at all.","C":"Text 2 qualifies Text 1's explanation without rejecting the ability it describes.","B":"Text 2 completely refutes Text 1's claim that dogs are able to read and follow human pointing gestures at all.","A":"Text 2 restates Text 1's explanation in different words."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections"},{"lesson":3,"id":"u2-l3-f3-02","why_wrong":{"B":"Text 2 agrees with Text 1, so 'flatly contradicts' mischaracterizes the relationship.","A":"Text 2 adds a new factor, so it does not merely repeat Text 1.","C":"Text 2 grants the press a role, so 'no role' reverses it."},"passage":"Text 1: A historian argues that the printing press caused the rapid spread of new ideas in Europe.\n\nText 2: The press mattered, a second historian agrees, but adds that without rising literacy the presses would have had few readers to reach.","correct":"D","target_family":"İlişkiyi yanlış kurma","unit":2,"choice_families":{"C":"İlişki yönü ters","A":"İlişkiyi yanlış kurma","B":"İlişkiyi yanlış kurma"},"why_correct":"Text 2 agrees the press mattered but adds literacy as a needed condition. Choice A names that agree-and-add relationship.","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choices":{"A":"Text 2 simply repeats Text 1's point about the press.","B":"Text 2 flatly contradicts Text 1's claim about the press.","C":"Text 2 argues that the press had no role in spreading ideas.","D":"Text 2 agrees with Text 1 but adds a condition Text 1 leaves out."}},{"lesson":3,"choices":{"B":"Text 2 fully agrees with Text 1 that streaming has hurt music.","A":"The two texts draw opposite evaluations from the same observed pressure.","C":"Text 2 denies that streaming affects how songs are written.","D":"Text 2 argues that streaming has no effect on artists at all."},"lesson_name":"Cross-Text Connections","why_correct":"Both note the same pressure to grab listeners fast but judge it oppositely, harm versus sharpening. Choice A names that relationship.","unit":2,"passage":"Text 1: A critic argues that streaming has hurt music by pushing artists to write short, catchy openings that grab listeners in seconds.\n\nText 2: The same pressure, another critic suggests, has sharpened songwriting, forcing artists to cut filler and make every second count.","correct":"A","why_wrong":{"D":"Text 2 describes a real effect, so 'no effect' reverses it.","C":"Text 2 accepts that streaming shapes songwriting; it disputes the evaluation, not the effect.","B":"Text 2 judges the pressure positively, so 'fully agrees' with the harm claim mischaracterizes it."},"id":"u2-l3-f3-03","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choice_families":{"B":"İlişkiyi yanlış kurma","C":"İlişki yönü ters","D":"İlişki yönü ters"},"target_family":"İlişkiyi yanlış kurma"},{"target_family":"İlişkiyi yanlış kurma","unit":2,"choice_families":{"D":"İlişki yönü ters","A":"İlişkiyi yanlış kurma","C":"İlişkiyi yanlış kurma"},"why_correct":"Text 2 grants the general rule but notes an exception with invasive plants. Choice A names the rule-and-exception relationship.","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choices":{"B":"Text 2 accepts Text 1's claim as a general rule but marks an exception to it.","A":"Text 2 rejects Text 1's claim entirely, denying that an untouched forest recovers any faster than a managed one.","C":"Text 2 restates Text 1's claim without change.","D":"Text 2 argues that forests never recover after fire."},"lesson":3,"id":"u2-l3-f3-04","why_wrong":{"D":"Text 2 discusses recovery, so 'never recover' reverses it.","C":"Text 2 adds an exception, so it does not merely restate Text 1.","A":"Text 2 accepts the rule generally, so 'rejects entirely' overstates the disagreement."},"correct":"B","passage":"Text 1: A biologist argues that a forest recovers fastest when left completely untouched after a fire.\n\nText 2: In many forests that is true, a second biologist allows, but where invasive plants move in first, some human intervention speeds recovery rather than slowing it."},{"correct":"C","passage":"Text 1: A researcher argues that bilingual children have a cognitive advantage in switching between tasks.\n\nText 2: A second researcher reports that when studies are combined, the advantage is small and does not appear in every group, though it is not absent.","why_wrong":{"D":"Text 2 never argues bilingualism is harmful.","A":"Text 2 weakens the claim, so it does not confirm it 'exactly.'","B":"Text 2 says the advantage is not absent, so 'no advantage whatsoever' misstates it."},"id":"u2-l3-f3-05","lesson":3,"choices":{"B":"Text 2 shows that bilingual children have no advantage whatsoever.","A":"Text 2 confirms Text 1's claim exactly as stated.","C":"Text 2 tempers the strength of Text 1's claim rather than overturning it.","D":"Text 2 argues that bilingualism harms children's thinking."},"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","why_correct":"Text 2 says the advantage is small and uneven but 'not absent,' tempering rather than overturning Text 1. Choice A fits.","choice_families":{"D":"İlişki yönü ters","B":"İlişkiyi yanlış kurma","A":"İlişkiyi yanlış kurma"},"target_family":"İlişkiyi yanlış kurma","unit":2},{"why_correct":"Text 2 grants climate a role but ranks trade above harvests. Choice A names that reprioritizing relationship.","unit":2,"choices":{"C":"Text 2 agrees that harvests were the single main cause.","A":"Text 2 argues that the city never actually grew.","B":"Text 2 flatly rejects the idea that the region's warm climate mattered at all to the ancient city's rapid growth.","D":"Text 2 accepts Text 1's factor but ranks a different one as more important."},"lesson_name":"Cross-Text Connections","lesson":3,"choice_families":{"B":"İlişki yönü ters","A":"Metin dışı çıkarım","C":"İlişkiyi yanlış kurma"},"target_family":"İlişkiyi yanlış kurma","stem":"Which choice best describes the relationship between Text 1 and Text 2?","id":"u2-l3-f3-06","passage":"Text 1: A scholar argues that a warm climate spurred the ancient city's growth by producing rich harvests.\n\nText 2: Climate helped, a second scholar agrees, but trade routes through the city, she argues, did more to drive its growth than harvests alone.","correct":"D","why_wrong":{"A":"Both texts assume the city grew.","B":"Text 2 says climate helped, so 'mattered not at all' reverses it.","C":"Text 2 puts trade above harvests, so agreeing harvests were the main cause mischaracterizes it."}},{"lesson":3,"id":"u2-l3-f3-07","why_wrong":{"B":"Text 2 disputes the prediction, so 'fully endorses' reverses it.","C":"Text 2 does not argue the goal is not worth pursuing; it questions the method.","D":"Text 2 says buses fill up, so 'no riders' contradicts it."},"correct":"A","passage":"Text 1: A policy expert argues that free public transit would cut traffic by luring drivers out of their cars.\n\nText 2: Free transit mostly attracts people who already walked or biked, a second expert finds, so it fills buses without taking many cars off the road.","unit":2,"target_family":"İlişkiyi yanlış kurma","why_correct":"Text 2 disputes the mechanism (that free transit pulls drivers from cars) while sharing the traffic goal. Choice A fits.","choice_families":{"D":"İlişki yönü ters","C":"Metin dışı çıkarım","B":"İlişki yönü ters"},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","choices":{"B":"Text 2 fully endorses Text 1's prediction about drivers.","A":"Text 2 questions the mechanism Text 1 relies on rather than the goal it shares.","C":"Text 2 argues that reducing traffic is not worth pursuing.","D":"Text 2 claims that free transit would have no riders."}},{"choice_families":{"D":"İlişki yönü ters","A":"İlişki yönü ters","C":"İlişki yönü ters"},"why_correct":"Text 2 conditions the harm on usage, showing benefit with structured tasks. Choice A names that conditional relationship.","unit":2,"target_family":"İlişkiyi yanlış kurma","choices":{"D":"Text 2 claims laptops have no place in education.","A":"Text 2 agrees that laptops always lower grades.","B":"Text 2 makes Text 1's blanket claim conditional on how the tool is used.","C":"Text 2 argues that laptops should be banned from classrooms."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","id":"u2-l3-f3-08","lesson":3,"correct":"B","passage":"Text 1: An educator argues that laptops in classrooms distract students and lower their grades.\n\nText 2: The harm depends on how laptops are used, a second educator argues; when tied to structured tasks, they raised engagement in her study rather than lowering it.","why_wrong":{"D":"Text 2 finds a place for laptops, so 'no place' reverses it.","A":"Text 2 shows laptops can help, so 'always lower grades' reverses it.","C":"Text 2 supports structured use, not a ban."}},{"why_correct":"Text 1 says deadlines harm creativity; Text 2 says they help finish work, a contrary conclusion. Choice A names it.","choice_families":{"B":"İlişki yönü ters","A":"Metin dışı çıkarım","D":"İlişki yönü ters"},"target_family":"İlişkiyi yanlış kurma","unit":2,"choices":{"C":"The texts reach contrary conclusions about how deadlines affect creative work.","B":"Text 2 agrees that deadlines kill creativity.","A":"Text 2 argues that genuine creative work needs no external structure at all and flourishes best without any deadlines.","D":"Text 2 claims that deadlines have no effect on artists."},"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","id":"u2-l3-f3-09","lesson":3,"correct":"C","passage":"Text 1: A writer argues that deadlines kill creativity by forcing work before ideas are ripe.\n\nText 2: For many artists the opposite holds, a second writer notes; a firm deadline ends endless tinkering and pushes the work to completion.","why_wrong":{"A":"Text 2 praises the structure a deadline gives, so 'needs no structure' misstates it.","B":"Text 2 defends deadlines, so agreeing they kill creativity reverses it.","D":"Text 2 describes a real effect, so 'no effect' reverses it."}},{"why_correct":"Text 2 confirms the effect is real but says it is slower and patchier, complicating reliability. Choice A fits.","unit":2,"choices":{"C":"Text 2 agrees that recovery is quick and uniform everywhere.","B":"Text 2 denies that wolves affect deer or forests.","A":"Text 2 argues that wolves should be removed from all parks.","D":"Text 2 confirms Text 1's effect while complicating how reliably it occurs."},"lesson_name":"Cross-Text Connections","lesson":3,"choice_families":{"C":"İlişkiyi yanlış kurma","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"target_family":"İlişkiyi yanlış kurma","stem":"Which choice best describes the relationship between Text 1 and Text 2?","id":"u2-l3-f3-10","passage":"Text 1: A conservationist argues that reintroducing wolves restores balance by controlling deer that would otherwise strip young forests.\n\nText 2: The effect is real but slower and patchier than often claimed, a second conservationist reports; in some valleys the forests recovered, in others they did not.","correct":"D","why_wrong":{"C":"Text 2 stresses uneven recovery, so 'quick and uniform' mischaracterizes it.","B":"Text 2 calls the effect 'real,' so denying it reverses the stance.","A":"Neither text calls for removing wolves."}},{"passage":"Text 1: A researcher argues that early exposure to music training improves children's memory.\n\nText 2: A second researcher finds the memory gains fade within a few years unless the training continues.","correct":"D","why_wrong":{"B":"Text 2 does not say training harms memory; it says the gains fade without practice.","A":"Neither text argues music should be required for all children.","C":"Text 2 shows the benefit is not permanent, so 'permanently improves' reverses it."},"id":"u2-l3-f4-01","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choice_families":{"C":"İlişki yönü ters","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"target_family":"Metin dışı çıkarım","lesson":3,"choices":{"A":"By arguing that all children should be required to study music.","B":"By claiming that music training harms children's memory.","C":"By agreeing with Text 1 that early exposure to music training brings a lasting, permanent improvement to children's memory.","D":"By noting that the benefit Text 1 describes may not last without continued training."},"lesson_name":"Cross-Text Connections","why_correct":"Text 2 says the gains fade without continued training, qualifying Text 1's benefit. Choice A fits.","unit":2},{"passage":"Text 1: A planner argues that dense housing near transit reduces the distances people must drive.\n\nText 2: Density helps only where the transit is frequent and reliable, a second planner notes; where service is poor, residents drive as much as anyone.","correct":"A","why_wrong":{"D":"Text 2 assumes transit can be reliable; it never claims the opposite.","C":"Text 2 limits the benefit to good-service areas, so 'in all cases' reverses it.","B":"Text 2 supports density where transit is good; it never says density should never be built."},"id":"u2-l3-f4-02","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choice_families":{"D":"Metin dışı çıkarım","B":"Metin dışı çıkarım","C":"İlişki yönü ters"},"target_family":"Metin dışı çıkarım","lesson":3,"choices":{"D":"By claiming that transit systems can never be made reliable.","A":"By arguing that the benefit depends on the quality of the transit service.","B":"By concluding that dense housing should never be built.","C":"By agreeing that density reduces driving in all cases."},"lesson_name":"Cross-Text Connections","why_correct":"Text 2 conditions the benefit on frequent, reliable transit. Choice A fits.","unit":2},{"why_wrong":{"D":"Text 2 says film has its own means, not that it is always better.","C":"Text 2 argues film can show inner life, so 'cannot' reverses it.","A":"Text 2 defends adaptation; it never says novels should not be adapted."},"correct":"B","passage":"Text 1: A critic argues that adapting a novel to film inevitably loses the book's inner life, its access to a character's private thoughts.\n\nText 2: Skilled filmmakers, a second critic replies, convey inner life through image and sound, giving in pictures what the novel gives in words.","lesson":3,"id":"u2-l3-f4-03","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","choices":{"C":"By agreeing that film cannot show a character's inner life.","B":"By arguing that film has its own means of conveying what Text 1 says is lost.","A":"By concluding that novels should never be adapted into films because the medium always loses the book's inner life.","D":"By claiming that films are always better than the novels they adapt."},"unit":2,"target_family":"Metin dışı çıkarım","why_correct":"Text 2 argues film conveys inner life through image and sound, countering Text 1's 'loss.' Choice A fits.","choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","A":"Metin dışı çıkarım"}},{"lesson":3,"id":"u2-l3-f4-04","why_wrong":{"B":"Text 2 says one tree 'helps a little,' so denying any cooling reverses it.","A":"Text 2 limits a single tree's effect, so agreeing it cools a city misstates it.","D":"Neither text suggests removing trees."},"passage":"Text 1: A scientist argues that a single tree can cool a street measurably on a hot day.\n\nText 2: One tree helps a little, a second scientist notes, but only a connected canopy across many streets produces cooling large enough to feel citywide.","correct":"C","target_family":"Metin dışı çıkarım","unit":2,"choice_families":{"D":"Metin dışı çıkarım","A":"İlişkiyi yanlış kurma","B":"İlişki yönü ters"},"why_correct":"Text 2 grants a small effect from one tree but says citywide cooling needs a connected canopy. Choice A fits.","lesson_name":"Cross-Text Connections","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choices":{"C":"By arguing that a citywide effect requires far more than a single tree.","A":"By agreeing that one tree cools an entire city.","B":"By denying that trees provide any cooling at all.","D":"By claiming that cities should remove their existing trees."}},{"lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choices":{"D":"Text 2 points to a drawback of the very anonymity Text 1 praises.","C":"Text 2 agrees that anonymous reviews are always honest.","B":"Text 2 concludes that online reviews should be banned.","A":"Text 2 claims that consumers never read online reviews."},"target_family":"Metin dışı çıkarım","unit":2,"why_correct":"Text 2 notes that anonymity, which Text 1 praises, also invites fake reviews. Choice A fits.","choice_families":{"C":"İlişki yönü ters","A":"Metin dışı çıkarım","B":"Metin dışı çıkarım"},"why_wrong":{"C":"Text 2 shows some reviews are planted, so 'always honest' reverses it.","A":"Neither text claims consumers do not read reviews.","B":"Text 2 warns of a drawback; it never calls for banning reviews."},"passage":"Text 1: A scholar argues that anonymous online reviews give consumers honest, unfiltered opinions.\n\nText 2: Anonymity also invites abuse, a second scholar warns; without accountability, some reviews are planted by sellers or rivals rather than real customers.","correct":"D","lesson":3,"id":"u2-l3-f4-05"},{"lesson_name":"Cross-Text Connections","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choices":{"C":"By agreeing that glass towers cannot be made efficient.","B":"By concluding that no more glass towers should be built.","A":"By arguing that technology has reduced the problem Text 1 describes.","D":"By claiming that solid walls always waste more energy than glass."},"target_family":"Metin dışı çıkarım","unit":2,"why_correct":"Text 2 says coatings and shading now reduce the heat problem Text 1 raises. Choice A fits.","choice_families":{"C":"İlişki yönü ters","B":"Metin dışı çıkarım","D":"Metin dışı çıkarım"},"why_wrong":{"D":"Text 2 says the gap narrows, not that solid walls waste more.","C":"Text 2 shows glass can be made more efficient, so 'cannot' reverses it.","B":"Text 2 defends improved glass; it never says no glass towers should be built."},"correct":"A","passage":"Text 1: An architect argues that glass towers waste energy, letting heat pour in through their windows.\n\nText 2: New coatings and shading, a second architect notes, now let glass buildings block much of that heat, narrowing the gap with solid walls.","lesson":3,"id":"u2-l3-f4-06"},{"why_correct":"Text 2 broadens the account by crediting organizers and local groups, not just one leader. Choice A fits.","choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","A":"Metin dışı çıkarım"},"unit":2,"target_family":"Metin dışı çıkarım","choices":{"B":"Text 2 broadens the account Text 1 centers on one person.","A":"Text 2 argues that the movement had no success to explain.","C":"Text 2 agrees that a single leader was the main force.","D":"Text 2 claims the leader opposed the movement he led."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","id":"u2-l3-f4-07","lesson":3,"correct":"B","passage":"Text 1: A historian argues that a single charismatic leader was the main force behind the movement's success.\n\nText 2: Focusing on one leader, a second historian cautions, hides the organizers, writers, and local groups whose steady work made the movement possible.","why_wrong":{"C":"Text 2 downplays the single leader, so agreeing reverses it.","A":"Both texts assume the movement succeeded; Text 2 explains it differently.","D":"Neither text says the leader opposed the movement."}},{"lesson":3,"why_correct":"Text 2 notes anxiety and dropout for some users, undercutting Text 1's benefit. Choice A fits.","unit":2,"choices":{"B":"Text 2 concludes that no one should exercise at all.","A":"Text 2 agrees that trackers help every user equally.","C":"Text 2 identifies an unintended effect that can undercut Text 1's benefit.","D":"Text 2 claims that trackers cannot measure movement."},"lesson_name":"Cross-Text Connections","id":"u2-l3-f4-08","passage":"Text 1: A doctor argues that wearable trackers improve health by making people aware of how little they move.\n\nText 2: For some users, a second doctor notes, the constant numbers breed anxiety, and a few abandon exercise once the novelty and the guilt wear off.","correct":"C","why_wrong":{"B":"Text 2 never argues against exercise itself.","A":"Text 2 shows effects vary, so 'help every user equally' misstates it.","D":"Neither text disputes that trackers measure movement."},"choice_families":{"A":"İlişkiyi yanlış kurma","B":"Metin dışı çıkarım","D":"Metin dışı çıkarım"},"target_family":"Metin dışı çıkarım","stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","target_family":"Metin dışı çıkarım","choice_families":{"A":"Metin dışı çıkarım","B":"Metin dışı çıkarım","C":"İlişki yönü ters"},"why_wrong":{"C":"Text 2 finds no worsening, so agreeing writing gets sloppier reverses it.","B":"Text 2 disputes the harm; it never calls for banning texting.","A":"Text 2 notes a sharper sense of formal language, so it does not dismiss formal writing."},"correct":"D","passage":"Text 1: A linguist argues that texting harms young people's writing by rewarding sloppy shorthand.\n\nText 2: Studies find no such harm, a second linguist reports; students who text heavily write no worse, and some show a sharper sense of when formal language is required.","id":"u2-l3-f4-09","lesson_name":"Cross-Text Connections","choices":{"D":"By citing findings that contradict Text 1's claim of harm.","C":"By agreeing that texting makes students' writing sloppier.","B":"By concluding that texting should be banned for young people.","A":"By claiming that formal writing no longer matters."},"unit":2,"why_correct":"Text 2 cites studies finding no harm, contradicting Text 1. Choice A fi // ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}

  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hiçbir tuzak ailesinde zayıflık yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='test-pick')testPick(el.dataset.l);
  else if(a==='test-next')testNext();
  else if(a==='test-quit')lessonView();
  else if(a==='test-review')toggleReview(+el.dataset.i);
  else if(a==='akjump'){if(S.phase!=='lesson')lessonView();var _t=document.getElementById('ak-'+el.dataset.ak);if(_t)_t.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();else if(t==='test')startTest();}});
