<style>
  :root{
    --sp:#3a6ea5;--li:#7a4fa3;--re:#2f8f6b;--wr:#c0672a;--gr:#4a6b8a;--vo:#9a7b1f;--dn:#a33b3b;--tk:#8a7420;--dg:#6f6a58;
  }
  .pg{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
  .loading{padding:60px 20px;text-align:center;color:var(--text-muted,#6f6a58)}

  /* ---- sabit ust arac cubugu: kaydet her zaman gorunur ---- */
  .bar{position:sticky;top:0;z-index:30;background:var(--bg,#faf7ee);border-bottom:1px solid var(--gri-line,#e5ddc9);
       margin:0 -16px 14px;padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar .who{font-family:var(--font-display,Georgia),serif;font-size:1.05rem;font-weight:700;margin-right:2px}
  .bar .sub{font-size:.78rem;color:var(--text-muted,#6f6a58)}
  .bar .spacer{flex:1}
  .pill{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:100px;
        background:var(--gri-gold-soft,#f5ecd4);color:var(--gri-gold,#C89A3C)}
  .pill.live{background:#e2f0e4;color:#2f7a44}
  .btn{border-radius:8px;font-weight:700;font-size:.82rem;padding:8px 14px;cursor:pointer;
       border:1px solid var(--gri-line,#e5ddc9);background:var(--bg-card,#fff);color:var(--text,#23291f)}
  .btn.primary{background:var(--gri-accent,#2C5856);color:#fff;border-color:var(--gri-accent,#2C5856)}
  .btn.sm{padding:6px 10px;font-size:.78rem;font-weight:600}
  .btn:disabled{opacity:.5;cursor:default}
  select.btn{padding-right:8px}

  /* ---- program bilgileri: tek satir, katlanabilir ---- */
  .meta{border:1px solid var(--gri-line,#e5ddc9);border-radius:10px;background:var(--bg-card,#fff);margin-bottom:12px}
  .meta-h{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font-size:.82rem;color:var(--text-muted,#6f6a58)}
  .meta-h b{color:var(--text,#23291f);font-size:.88rem}
  .meta-b{display:none;padding:0 12px 12px;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .meta.open .meta-b{display:grid}
  .meta-b .wide{grid-column:1/-1}
  label.fl{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted,#6f6a58);font-weight:700;margin:0 0 4px}
  .inp{width:100%;background:var(--bg,#faf7ee);border:1px solid var(--gri-line,#e5ddc9);border-radius:7px;padding:7px 9px;
       font-family:var(--font-ui,Inter),sans-serif;font-size:.86rem;color:var(--text,#23291f)}
  @media(max-width:720px){.meta-b{grid-template-columns:1fr}}

  /* ---- sekmeler ---- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--gri-line,#e5ddc9);margin-bottom:0;flex-wrap:wrap}
  .tab{border:1px solid transparent;border-bottom:0;background:transparent;cursor:pointer;padding:9px 15px;
       font-family:var(--font-ui,Inter),sans-serif;font-size:.86rem;font-weight:700;color:var(--text-muted,#6f6a58);
       border-radius:9px 9px 0 0;margin-bottom:-1px}
  .tab .n{font-weight:600;opacity:.75;margin-left:5px}
  .tab.on{background:var(--bg-card,#fff);border-color:var(--gri-line,#e5ddc9);color:var(--text,#23291f)}
  .pane{display:none;background:var(--bg-card,#fff);border:1px solid var(--gri-line,#e5ddc9);border-top:0;
        border-radius:0 0 10px 10px;padding:12px}
  .pane.on{display:block}

  /* ---- hucre tablosu (Excel hissi) ---- */
  .sheet{width:100%;border-collapse:collapse;font-family:var(--font-ui,Inter),sans-serif;font-size:.84rem}
  .sheet th{position:sticky;top:52px;z-index:5;background:var(--bg,#faf7ee);text-align:left;
            font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted,#6f6a58);font-weight:700;
            padding:7px 8px;border:1px solid var(--gri-line,#e5ddc9)}
  .sheet td{border:1px solid var(--gri-line,#e5ddc9);padding:0;vertical-align:middle}
  .sheet tbody tr:nth-child(even)>td{background:rgba(120,110,80,.04)}
  .sheet input,.sheet select,.sheet textarea{width:100%;border:0;background:transparent;padding:7px 8px;
       font-family:inherit;font-size:inherit;color:var(--text,#23291f);resize:none}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:2px solid var(--gri-accent,#2C5856);outline-offset:-2px;background:var(--bg-card,#fff)}
  /* Uzun metin (odev / ders detayi): satir yuksekligi bozulmasin diye tek satir
     gorunur, tiklayinca acilir. Boylece tablo kompakt kalir ama metin duzenlenebilir. */
  .sheet textarea.grow{box-sizing:border-box;height:32px;overflow:hidden;line-height:18px;white-space:pre-wrap}
  .sheet textarea.grow:focus{height:104px;overflow:auto;position:relative;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .sheet .rn{text-align:center;font-weight:700;color:var(--gri-gold,#C89A3C);font-size:.78rem;padding:0 2px}
  .sheet .del{width:100%;border:0;background:transparent;color:var(--text-muted,#6f6a58);cursor:pointer;font-size:1rem;line-height:28px}
  .sheet .del:hover{color:var(--dn);background:rgba(163,59,59,.08)}
  .sheet td.c{text-align:center}
  .sheet .sk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  /* hafta basligi satiri */
  .wkrow>td{background:var(--gri-gold-soft,#f5ecd4)!important;padding:0}
  .wkbtn{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:7px 10px;
         font-family:var(--font-ui,Inter),sans-serif;font-size:.8rem;font-weight:700;color:var(--text,#23291f)}
  .wkbtn .chev{display:inline-block;width:14px;color:var(--text-muted,#6f6a58)}
  .wkbtn .cnt{font-weight:600;color:var(--text-muted,#6f6a58);margin-left:8px}
  .wkbtn .bugun{margin-left:8px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gri-accent,#2C5856)}
  .recrow>td{background:var(--gri-gold-soft,#f5ecd4)!important;padding:8px 10px}
  .recrow audio{width:100%;max-width:420px;height:32px;margin-top:3px}
  .recrow .nm{font-size:.74rem;color:var(--text-muted,#6f6a58)}
  /* link hucresi: ham URL yerine okunur etiket */
  .lnkcell{padding:0 4px 0 8px!important}
  .lnkcell .wrap{display:flex;align-items:center;gap:6px;min-height:32px}
  .lnkcell .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
       cursor:text;font-size:.8rem;color:var(--gri-accent,#2C5856);border-bottom:1px dotted transparent}
  .lnkcell .lbl:hover{border-bottom-color:var(--gri-line,#e5ddc9)}
  .lnkcell .lbl.none{color:var(--text-muted,#6f6a58);font-style:italic}
  .lnkcell .go{flex:0 0 auto;text-decoration:none;color:var(--text-muted,#6f6a58);font-size:.95rem;
       padding:0 4px;border-radius:5px}
  .lnkcell .go:hover{color:var(--gri-accent,#2C5856);background:var(--gri-gold-soft,#f5ecd4)}
  .lnkcell input{padding:7px 4px}
  /* tur / beceri hucresi */
  .skcell{border-left:3px solid var(--dg)}
  .bar .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .addb{margin-top:10px;border:1px dashed var(--gri-line,#e5ddc9);background:transparent;color:var(--gri-accent,#2C5856);
        font-weight:700;font-size:.82rem;padding:8px 14px;border-radius:8px;cursor:pointer}
  .empty{padding:26px 10px;text-align:center;color:var(--text-muted,#6f6a58);font-size:.86rem}

  /* ---- takvim sekmesi ---- */
  .calwrap{max-width:460px}
  .cal .m{font-family:var(--font-display,Georgia),serif;font-weight:700;font-size:1rem;margin-bottom:8px}
  .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .dw{font-size:9px;text-transform:uppercase;color:var(--text-muted,#6f6a58);text-align:center;font-weight:700}
  .dy{aspect-ratio:1/1;border-radius:7px;background:var(--bg,#faf7ee);padding:3px;font-size:.7rem;display:flex;flex-direction:column}
  .dy.empty{background:transparent;padding:0}
  .dy .n{color:var(--text-muted,#6f6a58);font-weight:600}
  .dy .dots{margin-top:auto;display:flex;gap:2px;flex-wrap:wrap}
  .dy .dots i{width:6px;height:6px;border-radius:50%}

  .msg{font-size:.82rem;padding:7px 11px;border-radius:7px;display:none}
  .msg.ok{background:#e2f0e4;color:#2f7a44;display:inline-block}
  .msg.err{background:#f5e0e0;color:#a33b3b;display:inline-block}
  @media(max-width:720px){
    .sheet{font-size:.8rem}
    .sheet th{top:0}
    .bar{position:static}
  }
</style>
</head>
<body data-cat="teacher">
<div class="pg">
  <div class="loading" id="loading">Yükleniyor…</div>
  <div id="app" style="display:none">

    <div class="bar">
      <a class="btn sm" id="backBtn" href="#">←</a>
      <span class="who" id="pgWho">Öğrenci</span>
      <span class="pill" id="statusPill">Taslak</span>
      <span class="sub" id="pgSum"></span>
      <span class="spacer"></span>
      <span class="msg" id="msg"></span>
      <span class="acts">
        <select class="btn sm" id="progSelect"><option value="">+ Yeni program</option></select>
        <button class="btn sm" id="dupBtn" type="button">Kopyala</button>
        <button class="btn sm" id="delBtn" type="button">Sil</button>
        <button class="btn sm" id="publishBtn" type="button">Yayınla</button>
        <button class="btn primary" id="saveDraft" type="button">Kaydet</button>
      </span>
    </div>

    <div class="meta" id="metaBox">
      <div class="meta-h" id="metaToggle">
        <span class="chev">▸</span><b id="metaTitle">Program bilgileri</b>
        <span id="metaLine"></span>
      </div>
      <div class="meta-b">
        <div><label class="fl" for="fTitle">Program adı</label><input class="inp" id="fTitle" placeholder="ör. IELTS 8 Haftalık Hazırlık"></div>
        <div><label class="fl" for="fStart">Başlangıç</label><input class="inp" id="fStart" type="date"></div>
        <div><label class="fl" for="fEnd">Bitiş</label><input class="inp" id="fEnd" type="date"></div>
        <div class="wide"><label class="fl" for="fNote">Not (öğrenciye görünür)</label><input class="inp" id="fNote" placeholder="ör. Her ders öncesi ödevini tamamla."></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-pane="p-les" type="button">Dersler<span class="n" id="lCnt">0</span></button>
      <button class="tab" data-pane="p-hw" type="button">Ödevler<span class="n" id="hCnt">0</span></button>
      <button class="tab" data-pane="p-res" type="button">Kaynaklar<span class="n" id="rCnt">0</span></button>
      <button class="tab" data-pane="p-cal" type="button">Takvim</button>
    </div>

    <div class="pane on" id="p-les">
      <table class="sheet">
        <colgroup><col style="width:34px"><col style="width:124px"><col style="width:124px"><col style="width:26%"><col><col style="width:16%"><col style="width:32px"></colgroup>
        <thead><tr><th></th><th>Tarih</th><th>Beceri</th><th>Başlık</th><th>Detay</th><th>Link</th><th></th></tr></thead>
        <tbody id="lessons"></tbody>
      </table>
      <button class="addb" id="addLesson" type="button">+ Ders ekle</button>
    </div>

    <div class="pane" id="p-hw">
      <table class="sheet">
        <colgroup><col style="width:118px"><col style="width:44px"><col style="width:118px"><col><col style="width:21%"><col style="width:44px"><col style="width:32px"></colgroup>
        <thead><tr><th>Tarih</th><th>Gün</th><th>Tür</th><th>Ödev</th><th>Link</th><th>Ses</th><th></th></tr></thead>
        <tbody id="homework"></tbody>
      </table>
      <button class="addb" id="addHw" type="button">+ Ödev ekle</button>
    </div>

    <div class="pane" id="p-res">
      <table class="sheet">
        <colgroup><col style="width:32%"><col><col style="width:32px"></colgroup>
        <thead><tr><th>Grup</th><th>Link / açıklama</th><th></th></tr></thead>
        <tbody id="resources"></tbody>
      </table>
      <button class="addb" id="addRes" type="button">+ Kaynak ekle</button>
    </div>

    <div class="pane" id="p-cal">
      <div class="calwrap">
        <div class="cal">
          <div class="m" id="calMonth">Takvim</div>
          <div class="cg" id="calGrid"></div>
          <div style="display:flex;flex-wrap:wrap;gap:7px 11px;margin-top:10px;padding-top:9px;border-top:1px solid var(--gri-line,#e5ddc9)">
            <span style="font-size:.7rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:50%;background:var(--sp);display:inline-block"></i>Ders</span>
            <span style="font-size:.7rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:50%;background:var(--dn);display:inline-block"></i>Ödev</span>
          </div>
          <div style="display:flex;gap:6px;margin-top:10px">
            <button class="btn sm" id="calPrev" type="button">‹</button>
            <button class="btn sm" id="calNext" type="button">›</button>
          </div>
        </div>
      </div>
    </div>

    <p style="font-size:.76rem;color:var(--text-muted,#6f6a58);margin:12px 2px 0">Yayınlandığında öğrenci Çalışma Masası'nda görür ve PDF indirebilir.</p>
  </div>
</div>

<script>
(async function(){
  var SB_URL='https://vazbvbqgvtlaqkytfsbi.supabase.co';
  var SB_KEY='sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g';
  function ready(){return window.supabase&&window.supabase.createClient;}
  var tries=0; while(!ready()&&tries<40){await new Promise(r=>setTimeout(r,120));tries++;}
  if(!ready()){document.getElementById('loading').textContent='Bağlantı kurulamadı.';return;}
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

  var params=new URLSearchParams(location.search);
  var studentId=params.get('student');
  var classId=params.get('class')||'';
  var studentName=params.get('name')?decodeURIComponent(params.get('name')):'Öğrenci';

  var sess=await sb.auth.getSession();
  if(!sess||!sess.data||!sess.data.session){location.href='giris?return='+encodeURIComponent(location.pathname+location.search);return;}
  var me=sess.data.session.user;
  if(!studentId){document.getElementById('loading').textContent='Öğrenci belirtilmedi.';return;}

  var SKILLS=[['speaking','Speaking','sp'],['listening','Listening','li'],['reading','Reading','re'],['writing','Writing','wr'],['grammar','Grammar','gr'],['vocabulary','Vocabulary','vo'],['deneme','Deneme','dn'],['tekrar','Tekrar','tk'],['other','Diğer','dg']];
  function skillColor(k){var f=SKILLS.find(function(s){return s[0]===k;});return f?('var(--'+f[2]+')'):'var(--dg)';}
  function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  var GUNLER=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  var state={id:null,status:'draft',lessons:[],homework:[],resources:[]};
  var calRef=null;
  var openWeeks={};       // hafta anahtari -> acik mi
  var weeksInited=false;  // ilk yuklemede yalnizca icinde bulunulan hafta acilir

  // ---------------------------------------------------------------- sekmeler
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t);});
      document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id===t.dataset.pane);});
      if(t.dataset.pane==='p-cal')drawCal();
    });
  });
  document.getElementById('metaToggle').addEventListener('click',function(){
    var box=document.getElementById('metaBox');
    box.classList.toggle('open');
    box.querySelector('.chev').textContent=box.classList.contains('open')?'▾':'▸';
  });

  // ------------------------------------------------------------------ helpers
  function cell(html){var td=document.createElement('td');td.innerHTML=html;return td;}
  // Bir satirdaki her alan dogrudan state nesnesine yazar (ara kaydetme yok).
  function bind(tr,obj,after){
    tr.querySelectorAll('[data-k]').forEach(function(el){
      var ev=(el.type==='checkbox')?'change':'input';
      el.addEventListener(ev,function(){
        obj[el.dataset.k]=(el.type==='checkbox')?el.checked:el.value;
        if(after)after(el.dataset.k);
      });
    });
  }
  // Link hucresi: normalde okunur etiket, tiklayinca duzenlenebilir input.
  // Ok isareti linki yeni sekmede acar — ogretmen nereye gittigini gorebilsin.
  function linkCell(obj){
    var td=document.createElement('td');td.className='lnkcell';
    function goster(){
      var u=obj.url||'';
      var et=u?(window.GriLinkLabel?window.GriLinkLabel(u):u):'link yok';
      td.innerHTML='<div class="wrap"><span class="lbl'+(u?'':' none')+'" title="'+esc(u||'Düzenlemek için tıkla')+'">'+esc(et)+'</span>'+
        (u?('<a class="go" href="'+esc(u)+'" target="_blank" rel="noopener" title="Yeni sekmede aç">↗</a>'):'')+'</div>';
      td.querySelector('.lbl').addEventListener('click',duzenle);
    }
    function duzenle(){
      td.innerHTML='<input value="'+esc(obj.url||'')+'" placeholder="https://…">';
      var inp=td.querySelector('input');inp.focus();inp.select();
      inp.addEventListener('input',function(){obj.url=inp.value;});
      inp.addEventListener('blur',goster);
      inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();});
    }
    goster();
    return td;
  }

  function skillSelect(sec){
    return '<select data-k="skill">'+SKILLS.map(function(s){
      return '<option value="'+s[0]+'"'+(s[0]===sec?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select>';
  }

  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
  function kisaTarih(iso){if(!iso)return '';var d=new Date(iso);return d.getDate()+' '+AYLAR[d.getMonth()].slice(0,3);}

  // ------------------------------------------------------------------ dersler
  function renderLessons(){
    var box=document.getElementById('lessons');box.innerHTML='';
    if(!state.lessons.length){
      box.innerHTML='<tr><td colspan="7"><div class="empty">Henüz ders yok. "+ Ders ekle" ile başla.</div></td></tr>';
    }
    state.lessons.forEach(function(L,i){
      var tr=document.createElement('tr');
      tr.appendChild(cell('<div class="rn">'+(i+1)+'</div>'));
      tr.appendChild(cell('<input type="date" data-k="date" value="'+esc(L.date||'')+'">'));
      tr.appendChild(cell(skillSelect(L.skill||'speaking')));
      tr.appendChild(cell('<input data-k="title" placeholder="Başlık" value="'+esc(L.title||'')+'">'));
      tr.appendChild(cell('<textarea class="grow" data-k="detail" rows="1" placeholder="Detay" title="'+esc(L.detail||'')+'">'+esc(L.detail||'')+'</textarea>'));
      tr.appendChild(linkCell(L));
      tr.appendChild(cell('<button class="del" title="Sil">×</button>'));
      // beceri rengi: satirin solunda kucuk nokta
      var skCell=tr.children[2];skCell.className='skcell';
      skCell.style.borderLeftColor=skillColor(L.skill||'speaking');
      box.appendChild(tr);
      bind(tr,L,function(k){
        if(k==='date')drawCal();
        if(k==='skill')skCell.style.borderLeft='3px solid '+skillColor(L.skill);
      });
      tr.querySelector('.del').addEventListener('click',function(){state.lessons.splice(i,1);renderLessons();drawCal();});
    });
    document.getElementById('lCnt').textContent=state.lessons.length;
    updateSummary();
  }

  // ------------------------------------------------------------------ odevler
  // 42 satir tek listede okunmuyor; haftalara bolunup katlaniyor.
  function renderHw(){
    var box=document.getElementById('homework');box.innerHTML='';
    if(!state.homework.length){
      box.innerHTML='<tr><td colspan="7"><div class="empty">Henüz ödev yok. "+ Ödev ekle" ile başla.</div></td></tr>';
      document.getElementById('hCnt').textContent='0';updateSummary();return;
    }
    var bugunPzt=mondayOf(new Date()).getTime();
    // Tarihe gore siralanmis indeks listesi; state icindeki gercek index korunur.
    var idx=state.homework.map(function(H,i){return i;});
    idx.sort(function(a,b){return String(state.homework[a].date||'').localeCompare(String(state.homework[b].date||''));});
    // Ogrencinin ses kaydi klasoru hw<tarihe-gore-siralanmis-index>; ogretmen de
    // ayni indeksi kullanmali (calisma-programim odevleri tarihe gore siraliyor).
    var sortedPos={};idx.forEach(function(orig,pos){sortedPos[orig]=pos;});

    var gruplar=[];      // {key, mon, items:[i]}
    var haritaKey={};
    idx.forEach(function(i){
      var H=state.homework[i];
      var key='tarihsiz', mon=null;
      if(H.date){mon=mondayOf(new Date(H.date));key=mon.toISOString().slice(0,10);}
      if(!haritaKey[key]){haritaKey[key]={key:key,mon:mon,items:[]};gruplar.push(haritaKey[key]);}
      haritaKey[key].items.push(i);
    });

    if(!weeksInited){
      // Ilk acilista yalnizca bu hafta acik; gecmis/gelecek kapali.
      gruplar.forEach(function(g){openWeeks[g.key]=!!(g.mon&&g.mon.getTime()===bugunPzt);});
      if(!Object.keys(openWeeks).some(function(k){return openWeeks[k];})&&gruplar.length)openWeeks[gruplar[0].key]=true;
      weeksInited=true;
    }

    gruplar.forEach(function(g,gi){
      var acik=!!openWeeks[g.key];
      var wtr=document.createElement('tr');wtr.className='wkrow';
      var son=g.mon?new Date(g.mon.getFullYear(),g.mon.getMonth(),g.mon.getDate()+6):null;
      var etiket=g.mon
        ? ('Hafta '+(gi+1)+' · '+g.mon.getDate()+' '+AYLAR[g.mon.getMonth()]+' – '+son.getDate()+' '+AYLAR[son.getMonth()])
        : 'Tarihsiz';
      var simdi=(g.mon&&g.mon.getTime()===bugunPzt)?'<span class="bugun">bu hafta</span>':'';
      var td=document.createElement('td');td.colSpan=7;
      td.innerHTML='<button class="wkbtn" type="button"><span class="chev">'+(acik?'▾':'▸')+'</span>'+
        etiket+'<span class="cnt">'+g.items.length+' ödev</span>'+simdi+'</button>';
      wtr.appendChild(td);box.appendChild(wtr);
      td.querySelector('.wkbtn').addEventListener('click',function(){openWeeks[g.key]=!acik;renderHw();});
      if(!acik)return;

      g.items.forEach(function(i){
        var H=state.homework[i];
        var d=H.date?new Date(H.date):null;
        var tr=document.createElement('tr');
        tr.appendChild(cell('<input type="date" data-k="date" value="'+esc(H.date||'')+'">'));
        var gc=cell(d?GUNLER[(d.getDay()+6)%7]:'');gc.className='c';gc.style.fontSize='.76rem';gc.style.color='var(--text-muted,#6f6a58)';
        tr.appendChild(gc);
        var hsk=cell(skillSelect(H.skill||'other'));hsk.className='skcell';
        hsk.style.borderLeftColor=skillColor(H.skill||'other');
        tr.appendChild(hsk);
        tr.appendChild(cell('<textarea class="grow" data-k="task" rows="1" placeholder="Ödev" title="'+esc(H.task||'')+'">'+esc(H.task||'')+'</textarea>'));
        tr.appendChild(linkCell(H));
        var ac=cell('<input type="checkbox" data-k="audio" style="width:auto"'+(H.audio?' checked':'')+' title="Ses kaydı iste">');
        ac.className='c';tr.appendChild(ac);
        tr.appendChild(cell('<button class="del" title="Sil">×</button>'));
        box.appendChild(tr);
        bind(tr,H,function(k){
          if(k==='date'){drawCal();renderHw();}
          if(k==='audio')renderHw();
          if(k==='skill')hsk.style.borderLeftColor=skillColor(H.skill);
        });
        tr.querySelector('.del').addEventListener('click',function(){state.homework.splice(i,1);renderHw();drawCal();});

        // Ses kaydi istenen odevlerde: kayitlar tiklayinca yuklenir (her acilista
        // 6 storage cagrisi yapmamak icin tembel).
        if(H.audio&&state.id){
          var rtr=document.createElement('tr');rtr.className='recrow';
          var rtd=document.createElement('td');rtd.colSpan=7;
          rtd.innerHTML='<button class="btn sm" type="button">Ses kayıtlarını göster</button><div data-role="list"></div>';
          rtr.appendChild(rtd);box.appendChild(rtr);
          var btn=rtd.querySelector('button'), list=rtd.querySelector('[data-role="list"]');
          btn.addEventListener('click',function(){
            btn.disabled=true;btn.textContent='Yükleniyor…';
            loadRecordings(sortedPos[i],list).then(function(){btn.remove();});
          });
        }
      });
    });
    document.getElementById('hCnt').textContent=state.homework.length;
    updateSummary();
  }

  async function loadRecordings(idx,listEl){
    var folder=studentId+'/'+state.id+'/hw'+idx;
    var l=await sb.storage.from('speaking-submissions').list(folder,{limit:20,sortBy:{column:'created_at',order:'desc'}});
    if(l.error||!l.data||!l.data.length){listEl.innerHTML='<span class="nm">Henüz kayıt yüklenmedi.</span>';return;}
    listEl.innerHTML='';
    l.data.forEach(function(f){
      var row=document.createElement('div');
      row.innerHTML='<div class="nm">'+esc(f.name)+'</div>';
      listEl.appendChild(row);
      sb.storage.from('speaking-submissions').createSignedUrl(folder+'/'+f.name,3600).then(function(s){
        if(s.data&&s.data.signedUrl){var a=document.createElement('audio');a.controls=true;a.src=s.data.signedUrl;row.appendChild(a);}
      });
    });
  }

  // --------------------------------------------------------------- kaynaklar
  function renderRes(){
    var box=document.getElementById('resources');box.innerHTML='';
    if(!state.resources.length){
      box.innerHTML='<tr><td colspan="3"><div class="empty">Henüz kaynak yok.</div></td></tr>';
    }
    state.resources.forEach(function(R,i){
      var tr=document.createElement('tr');
      tr.appendChild(cell('<input data-k="group" placeholder="Grup (ör. Konuşma)" value="'+esc(R.group||'')+'">'));
      tr.appendChild(linkCell(R));
      tr.appendChild(cell('<button class="del" title="Sil">×</button>'));
      box.appendChild(tr);
      bind(tr,R);
      tr.querySelector('.del').addEventListener('click',function(){state.resources.splice(i,1);renderRes();});
    });
    document.getElementById('rCnt').textContent=state.resources.length;
    updateSummary();
  }

  function updateSummary(){
    var s=document.getElementById('fStart').value, e=document.getElementById('fEnd').value;
    var tarih=(s?kisaTarih(s):'')+(e?(' – '+kisaTarih(e)):'');
    document.getElementById('pgSum').textContent=
      state.lessons.length+' ders · '+state.homework.length+' ödev · '+state.resources.length+' kaynak'+(tarih?('  ·  '+tarih):'');
    document.getElementById('metaLine').textContent=
      (document.getElementById('fTitle').value||'adsız')+(tarih?('  ·  '+tarih):'');
  }

  // ---------------------------------------------------------------- takvim
  function drawCal(){
    if(!calRef){
      var f=(document.getElementById('fStart').value)||(state.lessons[0]&&state.lessons[0].date)||new Date().toISOString().slice(0,10);
      var dd=new Date(f);calRef=new Date(dd.getFullYear(),dd.getMonth(),1);
    }
    var y=calRef.getFullYear(),m=calRef.getMonth();
    document.getElementById('calMonth').textContent=AYLAR[m]+' '+y;
    var byDay={};
    state.lessons.forEach(function(L){if(L.date){var d=new Date(L.date);if(d.getFullYear()===y&&d.getMonth()===m)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push('sp');}});
    state.homework.forEach(function(H){if(H.date){var d=new Date(H.date);if(d.getFullYear()===y&&d.getMonth()===m)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push('dn');}});
    var off=(new Date(y,m,1).getDay()+6)%7;
    var days=new Date(y,m+1,0).getDate();
    var h=GUNLER.map(function(x){return '<div class="dw">'+x+'</div>';}).join('');
    for(var i=0;i<off;i++)h+='<div class="dy empty"></div>';
    for(var dnum=1;dnum<=days;dnum++){
      var a=byDay[dnum]||[];
      var dots=a.slice(0,4).map(function(x){return '<i style="background:var(--'+x+')"></i>';}).join('');
      h+='<div class="dy"><span class="n">'+dnum+'</span><span class="dots">'+dots+'</span></div>';
    }
    document.getElementById('calGrid').innerHTML=h;
  }
  document.getElementById('calPrev').addEventListener('click',function(){calRef=new Date(calRef.getFullYear(),calRef.getMonth()-1,1);drawCal();});
  document.getElementById('calNext').addEventListener('click',function(){calRef=new Date(calRef.getFullYear(),calRef.getMonth()+1,1);drawCal();});

  // ------------------------------------------------------------ yukle / kaydet
  function loadState(p){
    state.id=p?p.id:null;
    state.status=p?p.status:'draft';
    var c=(p&&p.content)||{};
    state.lessons=(c.lessons||[]).map(function(x){return Object.assign({},x);});
    state.homework=(c.homework||[]).map(function(x){return Object.assign({},x);});
    state.resources=(c.resources||[]).map(function(x){return Object.assign({},x);});
    document.getElementById('fTitle').value=p?p.title:'';
    document.getElementById('fNote').value=p?(p.note||''):'';
    document.getElementById('fStart').value=p?(p.start_date||''):'';
    document.getElementById('fEnd').value=p?(p.end_date||''):'';
    setStatusUi();
    calRef=null;weeksInited=false;openWeeks={};
    renderLessons();renderHw();renderRes();drawCal();
  }
  function setStatusUi(){
    var pill=document.getElementById('statusPill');
    pill.textContent=state.status==='published'?'Yayında':'Taslak';
    pill.className='pill'+(state.status==='published'?' live':'');
    document.getElementById('publishBtn').textContent=state.status==='published'?'Yayından kaldır':'Yayınla';
  }

  var allPrograms=[];
  function refreshSelect(){
    var sel=document.getElementById('progSelect');
    sel.innerHTML='<option value="">+ Yeni program</option>'+allPrograms.map(function(p){
      return '<option value="'+p.id+'">'+esc(p.title)+(p.status==='published'?' (yayında)':' (taslak)')+'</option>';}).join('');
    sel.value=state.id||'';
  }
  async function loadPrograms(selectId){
    var r=await sb.from('student_programs').select('*').eq('student_id',studentId).eq('teacher_id',me.id).order('created_at',{ascending:false});
    allPrograms=r.data||[];
    var pick=selectId?allPrograms.find(function(p){return p.id===selectId;}):null;
    loadState(pick||null);refreshSelect();
  }

  function collect(){
    return {
      teacher_id:me.id, student_id:studentId, class_id:classId||null,
      title:document.getElementById('fTitle').value.trim()||'Çalışma Programı',
      note:document.getElementById('fNote').value.trim()||null,
      start_date:document.getElementById('fStart').value||null,
      end_date:document.getElementById('fEnd').value||null,
      content:{lessons:state.lessons,homework:state.homework,resources:state.resources},
      updated_at:new Date().toISOString()
    };
  }
  function showMsg(t,ok){var m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');setTimeout(function(){m.className='msg';},3500);}

  async function save(publishState){
    var row=collect();
    if(publishState!=null)row.status=publishState;
    var res;
    if(state.id){res=await sb.from('student_programs').update(row).eq('id',state.id).select().single();}
    else{res=await sb.from('student_programs').insert(row).select().single();}
    if(res.error){showMsg('Kaydedilemedi: '+res.error.message,false);return;}
    state.id=res.data.id;state.status=res.data.status;setStatusUi();
    await loadPrograms(state.id);
    showMsg(publishState==='published'?'Yayınlandı.':(publishState==='draft'?'Yayından kaldırıldı.':'Kaydedildi.'),true);
  }

  document.getElementById('addLesson').addEventListener('click',function(){state.lessons.push({date:'',skill:'speaking',title:'',detail:'',url:''});renderLessons();});
  document.getElementById('addHw').addEventListener('click',function(){state.homework.push({date:'',skill:'other',task:'',url:'',audio:false});weeksInited=false;renderHw();});
  document.getElementById('addRes').addEventListener('click',function(){state.resources.push({group:'',url:''});renderRes();});
  document.getElementById('saveDraft').addEventListener('click',function(){save(null);});
  document.getElementById('publishBtn').addEventListener('click',function(){save(state.status==='published'?'draft':'published');});
  ['fStart','fEnd','fTitle'].forEach(function(id){
    document.getElementById(id).addEventListener('input',function(){if(id!=='fTitle'){calRef=null;drawCal();}updateSummary();});
  });
  document.getElementById('progSelect').addEventListener('change',function(e){loadPrograms(e.target.value||null);});
  document.getElementById('dupBtn').addEventListener('click',function(){
    state.id=null;state.status='draft';
    document.getElementById('fTitle').value=(document.getElementById('fTitle').value||'Program')+' (kopya)';
    setStatusUi();showMsg('Kopya taslağı — Kaydet ile yeni program oluşur.',true);refreshSelect();
  });
  document.getElementById('delBtn').addEventListener('click',async function(){
    if(!state.id){showMsg('Silinecek kayıtlı program yok.',false);return;}
    if(!confirm('Bu programı silmek istediğine emin misin?'))return;
    var r=await sb.from('student_programs').delete().eq('id',state.id);
    if(r.error){showMsg('Silinemedi: '+r.error.message,false);return;}
    await loadPrograms(null);showMsg('Silindi.',true);
  });

  // Baslikta ham e-posta cirkin duruyordu: adi buyut, e-postayi kucuk goster.
  (function(){
    var ad=studentName, mail='';
    if(/@/.test(studentName)){mail=studentName;ad=studentName.split('@')[0];}
    ad=ad.charAt(0).toUpperCase()+ad.slice(1);
    var el=document.getElementById('pgWho');
    el.textContent=ad;
    if(mail){
      var m=document.createElement('span');m.className='sub';m.style.marginLeft='6px';m.textContent=mail;
      el.insertAdjacentElement('afterend',m);
    }
  })();
  document.getElementById('backBtn').href=classId?('ogretmen-sinif?id='+classId):'ogretmen';

  await loadPrograms(params.get('id')||null);
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='';
})();
</script>
</body>
</html>
