letes the text so that it conforms to the conventions of Standard English?","choice_families":{"A":"Kısa çizgi parantez yanlış eşleme","B":"Kısa çizgi parantez yanlış eşleme","D":"Comma splice ve run-on"},"lesson":1,"lesson_name":"Boundaries","correct":"C","passage":"The city's oldest cafe -- founded in 1890 ______ still serves its original recipes."},{"passage":"The novel's setting ______ a remote island in the North Atlantic, shapes every part of the plot.","lesson_name":"Boundaries","correct":"D","lesson":1,"choice_families":{"B":"Kısa çizgi parantez yanlış eşleme","C":"Comma splice ve run-on","A":"İki nokta noktalı virgül yanlış"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":":","C":";","B":"(","D":"--"},"unit":4,"id":"u4-l1-f4-05","why_wrong":{"C":"A semicolon needs an independent clause on each side, which the aside is not.","B":"An opening parenthesis must be closed by a parenthesis, not the comma used here.","A":"A colon cannot pair with the closing comma to enclose an aside."},"why_correct":"The aside closes with a comma, so a single dash to open pairs with it to set off the nonessential description.","target_family":"Kısa çizgi parantez yanlış eşleme"},{"choices":{"A":"--","B":",","D":":","C":")"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l1-f4-06","unit":4,"why_correct":"The aside opens with a dash, so the closing mark must also be a dash to form a matching pair.","why_wrong":{"C":"A closing parenthesis does not match the opening dash.","D":"A colon cannot serve as the closing mark of a dash-opened aside.","B":"A comma to close does not match the dash that opens the aside."},"target_family":"Kısa çizgi parantez yanlış eşleme","lesson_name":"Boundaries","correct":"A","passage":"Three of the paintings -- all early works ______ were sold before the show even opened.","lesson":1,"choice_families":{"D":"İki nokta noktalı virgül yanlış","B":"Kısa çizgi parantez yanlış eşleme","C":"Kısa çizgi parantez yanlış eşleme"}},{"unit":4,"id":"u4-l1-f4-07","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"(","D":";","B":"--","C":":"},"target_family":"Kısa çizgi parantez yanlış eşleme","why_wrong":{"A":"An opening parenthesis must be closed by a parenthesis, not the comma used here.","C":"A colon cannot pair with the closing comma to enclose an appositive.","D":"A semicolon needs an independent clause on each side, which is not the case here."},"why_correct":"The appositive closes with a comma, so a single dash to open pairs with it to set off the nonessential phrase.","lesson":1,"passage":"The expedition's leader ______ a veteran of four polar crossings, guided the team to safety.","correct":"B","lesson_name":"Boundaries","choice_families":{"A":"Kısa çizgi parantez yanlış eşleme","C":"İki nokta noktalı virgül yanlış","D":"Comma splice ve run-on"}},{"correct":"C","lesson_name":"Boundaries","passage":"The instrument -- a rare eighteenth-century cello ______ had not been played in fifty years.","lesson":1,"choice_families":{"D":"Comma splice ve run-on","B":"Kısa çizgi parantez yanlış eşleme","A":"Kısa çizgi parantez yanlış eşleme"},"choices":{"C":"--","D":";","B":",","A":")"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l1-f4-08","unit":4,"why_correct":"The aside opens with a dash, so the closing mark must also be a dash to form a matching pair.","why_wrong":{"A":"A closing parenthesis does not match the opening dash.","B":"A comma to close does not match the dash that opens the aside.","D":"A semicolon needs an independent clause on each side, which is not the case here."},"target_family":"Kısa çizgi parantez yanlış eşleme"},{"choice_families":{"C":"Comma splice ve run-on","B":"Kısa çizgi parantez yanlış eşleme","A":"İki nokta noktalı virgül yanlış"},"lesson":1,"passage":"The final chapter ______ barely ten pages long, ties together every thread of the story.","correct":"D","lesson_name":"Boundaries","target_family":"Kısa çizgi parantez yanlış eşleme","why_wrong":{"C":"A semicolon needs an independent clause on each side, which the aside is not.","B":"An opening parenthesis must be closed by a parenthesis, not the comma used here.","A":"A colon cannot pair with the closing comma to enclose an aside."},"why_correct":"The aside closes with a comma, so a single dash to open pairs with it to set off the nonessential phrase.","id":"u4-l1-f4-09","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":":","B":"(","D":"--","C":";"}},{"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"--","C":")","B":",","D":":"},"id":"u4-l1-f4-10","unit":4,"why_wrong":{"D":"A colon cannot serve as the closing mark of a dash-opened aside.","B":"A comma to close does not match the dash that opens the aside.","C":"A closing parenthesis does not match the opening dash."},"why_correct":"The aside opens with a dash, so the closing mark must also be a dash to form a matching pair.","target_family":"Kısa çizgi parantez yanlış eşleme","passage":"Two of the researchers -- both graduate students ______ presented the findings at the conference.","correct":"A","lesson_name":"Boundaries","lesson":1,"choice_families":{"B":"Kısa çizgi parantez yanlış eşleme","D":"İki nokta noktalı virgül yanlış","C":"Kısa çizgi parantez yanlış eşleme"}}],"fam_short":{"Kısa çizgi parantez yanlış eşleme":"Çizgi/parantez","İki nokta noktalı virgül yanlış":"İki nokta/;","Gereksiz ya da eksik virgül":"Virgül","Comma splice ve run-on":"Splice/run-on"},"teaching":{"ne_olculuyor":["Bu ders noktalama ve cümle sınırlarını ölçer. Boşluk, iki fikri nasıl ayırdığını ya da birleştirdiğini sorar.","Anahtar kavram: bağımsız cümle (independent clause) tek başına cümle olur, bağımlı cümle (dependent clause) olmaz. Noktalama bu ikisini doğru ayırmalı.","Kritik nokta: iki bağımsız cümle virgülle birleşemez (comma splice) ve noktasız birbirine yapışamaz (run-on). Doğru araçlar: nokta, noktalı virgül, ya da virgül artı bağlaç."],"karar_proseduru":["Boşluğun iki yanını oku. Her yan tek başına cümle olur mu, yani bağımsız mi.  Özne ve yüklem var mi diye bak.","İki yan da bağımsızsa, onları ayırman gerek.  Seçenekler: nokta, noktalı virgül, ya da virgül artı FANBOYS bağlacı (for, and, nor, but, or, yet, so). Tek başına virgül YANLIŞ, o comma splice.","Bir yan bağımlı ise, virgül çoğu zaman doğrudur.  Bağımlı cümle başta ise arkasına virgül gelir.","İki nokta (:) ve kısa çizgi (--) kontrolü.  İki nokta ancak solunda TAM bir bağımsız cümle varsa kullanılır ve bir liste ya da açıklama tanıtır. Kısa çizgi ek bilgiyi ayırır, çift olarak eşlenir.","Seç ve oku.  Cümleyi seçilen noktalamayla oku. İki fikir doğru ayrılmış mi, yanlış yapışma var mi kontrol et."],"alt_konular_baslik":"Kural alt başlıkları","celdirici_aileleri":[{"tanim":"İki bağımsız cümleyi ya sadece virgülle (comma splice) ya da hiç noktalama olmadan (run-on) birleştirir. En sık hata. İki tam cümle asla sadece virgülle birleşmez.","ad":"Comma splice ve run-on"},{"tanim":"İki nokta ya da noktalı virgül yanlış yerde. İki nokta solunda tam cümle istemediği yerde kullanılır, ya da noktalı virgül iki bağımsız cümle olmadığı halde konur.","ad":"İki nokta noktalı virgül yanlış"},{"tanim":"Virgül olmaması gereken yere konur (özne ile yüklem arası) ya da gerekli olduğu yerde (giriş ifadesi, ara cümle sonrası) eksik bırakılır.","ad":"Gereksiz ya da eksik virgül"},{"ad":"Kısa çizgi parantez yanlış eşleme","tanim":"Ara bilgiyi ayıran işaretler yanlış eşlenir. Başta kısa çizgi sonda virgül ya da parantez, gibi. Aynı tür işaret çiftlenmelidir."}],"alt_konular_intro":"Boundaries, cümleler ve cümle parçaları arasındaki NOKTALAMAYI ölçer: nokta, noktalı virgül, iki nokta, virgül, tire. Bu sorularda kulakla değil, YAPIYLA karar verilir. Değişmez ilk adım şudur: boşluğun iki yanındaki parçaların her biri tek başına tam cümle (bağımsız) mi, yoksa yarım (bağımlı) mı? Cevap buradan çıkar.","cozumlu_ornekler":[{"correct":"A","passage":"The storm knocked out power across the region ______ of homes stayed dark for two days.","adimlar":["İki yana bak: The storm knocked out power across the region tam cümle. thousands of homes stayed dark for two days tam cümle.","İki bağımsız cümle, ayırmak gerek.","Doğru yollar: nokta, noktalı virgül, ya da virgül artı bağlaç. A virgül artı and, doğru.","B sadece virgül, comma splice. C noktalamasız, run-on. D noktalı virgül zaten ayırır, üstüne and konmaz."],"sonuc":"İki bağımsız cümle sadece virgülle birleşemez. Virgül artı bağlaç ya da nokta ya da noktalı virgül gerek.","choices":{"C":" thousands","B":", thousands","D":"; and thousands","A":", and thousands"},"stem":"Which choice conforms to the conventions of Standard English?"},{"choices":{"C":", basil,","D":" basil,","B":"; basil,","A":": basil,"},"sonuc":"İki nokta solunda tam cümle, sağında liste ya da açıklama ister. Bu şart tutuyor.","stem":"Which choice conforms to the conventions of Standard English?","adimlar":["Sol tarafa bak: The garden contained three kinds of herb tam bir cümle.","Sağda gelen basılı, mint, and thyme bir liste, üçü tanıtıyor.","Tam cümle artı tanıtılan liste, iki nokta ister. A doğru.","B noktalı virgül iki bağımsız cümle ister, liste değil. C virgül çok zayıf. D noktalamasız, liste cümleye yapışır."],"correct":"A","passage":"The garden contained three kinds of herb ______ mint, and thyme."}],"sik_hatalar":[{"cozum":"Comma splice en sık hata. İki bağımsız cümle için nokta, noktalı virgül, ya da virgül artı bağlaç gerek.","hata":"İki tam cümleyi virgülle birleştirmek"},{"cozum":"İki noktadan önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır.","hata":"İki noktayı yarım cümleden sonra kullanmak"},{"cozum":"The scientists who worked for years, published derse o virgül yanlıştır. Özne ile fiil ayrılmaz.","hata":"Özne ile yüklem arasına virgül koymak"},{"cozum":"Ara bilgiyi ayıran işaretler çift olmalı. Başta çizgi sonda çizgi, ya da ikisi de virgül.","hata":"Kısa çizgi ve virgülü eşitlememek"}],"alt_konular":[{"baslik":"1) İki bağımsız cümleyi ayırma (period / semicolon)","kural":"Bağımsız + bağımsız → nokta veya noktalı virgül. Sadece virgül (comma splice) daima yanlıştır.","govde":["Boşluğun iki yanı da tek başına ayakta duran tam cümleyse (bağımsız + bağımsız), onları ya nokta ile ayırırsın ya da noktalı virgül (;) ile bağlarsın. İkisi dilbilgisel olarak eşdeğerdir.","En sık tuzak COMMA SPLICE'tır: iki bağımsız cümleyi yalnızca virgülle bağlamak yanlıştır. Virgül tek başına iki tam cümleyi tutamaz; ya nokta/noktalı virgül gerekir ya da virgül + bağlaç (, and / , but).","Test: boşluğun soluna nokta koy, sağdaki parça tek başına anlamlı tam cümle mi? Soluna da bak. İkisi de 'evet' ise nokta ya da noktalı virgül doğrudur."]},{"baslik":"2) İki nokta ve tire ile açıklama (colon / dash)","ornek":"\"Sonuç netti: örneklem çok küçüktü.\" Sol taraf tam cümle olduğu için iki nokta doğrudur.","govde":["İki nokta (:) kullanmak için SOLDAKİ parça tam bir cümle olmalı; sağı ise bir liste, açıklama ya da örnek getirir. 'Tam cümle : açıklama' kalıbı doğrudur.","Tire (—) benzer bir 'açıklama/kesinti' işlevi görür ve çoğu zaman iki noktayla değiştirilebilir; ama açılan tirenin çift olması gereken durumlara dikkat et (araya giren bilgi iki tireyle sarılır).","Tuzak: solu tam cümle olmadan iki nokta kullanmak. 'The team needed three things: ...' doğru; 'The three things were, for example: ...' gibi solu yarım bırakan kullanım yanlıştır."]},{"baslik":"3) Bağımlı öğeleri ve araya giren bilgiyi virgülleme","kural":"Çıkarılabilen ek bilgi iki virgülle sarılır; cümle için zorunlu bilgi virgülsüz kalır.","govde":["Bağımlı bir öğe (giriş ifadesi, zaman/koşul yan cümlesi) ana cümleden virgülle ayrılır: 'After the rain stopped, ...'. Bağımlı + bağımsız ilişkisinde tek virgül yeterlidir.","Araya giren, çıkarılabilir bilgi (nonrestrictive) İKİ virgülle sarılır: '..., which was unexpected, ...'. Bir açıp bir kapamayı unutma; tek yanlı virgül klasik hatadır.","Kısıtlayıcı (restrictive) bilgi ise virgül İSTEMEZ, çünkü cümlenin anlamı için zorunludur: 'The book that I bought' — burada 'that I bought' virgülsüz kalır."]}],"strateji":["Boşluğun iki yanını oku, her yan tek başına cümle olur mu.","İkisi de bağımsızsa ayır: nokta, noktalı virgül, ya da virgül artı bağlaç.","Bir yan bağımlı ise, giriş ifadesinden sonra virgül doğru.","İki nokta için solda tam cümle, sağında liste ya da açıklama olmalı.","Kısa çizgi ve parantezi çift eşle."],"kavramsal_temel":["Boundaries, iki fikri noktalamayla doğru ayırmayı ölçer. Anahtar kavram bağımsız cümledir: özne ve yüklemi olan, tek başına cümle olabilen yapı. Bağımlı cümle tek başına duramaz.","En önemli kural: iki bağımsız cümle sadece virgülle birleşemez, buna comma splice denir, ve noktalamasız birbirine yapışamaz, buna run-on denir. İki tam cümleyi ayırmanın doğru yolları: nokta, noktalı virgül, ya da virgül artı bağlaç (for, and, nor, but, or, yet, so).","İki nokta (:) özeldir: solunda TAM bir bağımsız cümle olmalı ve bir liste ya da açıklama tanıtmalı. Solu yarım cümleyse iki nokta yanlıştır. Kısa çizgi ek bilgiyi ayırır ve çift olarak eşlenir.","Bu yüzden her soruda önce boşluğun iki yanına bak: her yan tek başına cümle olur mu. İkisi de bağımsızsa ayırman gerek, sadece virgül asla yeterli değildir."],"top_tips":["Boşluğun iki yanından her biri tek başına cümle olabiliyorsa, onları ayırman gerek. Sadece virgül asla yeterli değil, comma splice olur.","Nokta ve noktalı virgül burada aynı işi yapar: iki bağımsız cümleyi ayırır.","İki noktadan (:) önceki kısım tam bir cümle olmalı. Solu yarım cümleyse iki nokta yanlıştır.","Özne ile yüklem arasına virgül girmez. The scientists who worked for years, published derse, o virgül yanlıştır."]}},{"teaching":{"strateji":["Fiil boşluğunda gerçek özneyi bul, araya giren ifadeyi kapat.","Zamana bak, cümlenin gerisiyle tutarlı fiili seç.","Zamir boşluğunda gönderdiği ismi bul, sayısına uydur.","Cümle tanımlayanla başlıyorsa, ardından gelen isim eylemi yapan olmalı.","Liste ve karşılaştırmada ögeleri aynı formda tut."],"kavramsal_temel":["Form, Structure, and Sense, cümlenin dilbilgisi yapısını ölçer: fiil uyumu ve zamanı, zamir uyumu, modifier yerleşimi ve paralellik. Boşluk çoğu zaman bir fiil, zamir ya da kelime formu ister.","Fiil uyumunda en sık tuzak, öznenin fiile en yakın kelime OLMAMASIDIR. The box of old letters was derse, özne box (tekil), letters değil. Araya giren of ifadesini elle kapatıp gerçek özneyi bul.","Zamir gönderdiği isimle sayıda uyuşmalı. Bu soru tipinde tekil isme çoğul their genelde yanlıştır, his or her ya da isim çoğul yapılır. Ayrıca cümle bir tanımlayanla başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı, yoksa modifier yanlış yerleşir.","Paralellikte liste ve karşılaştırmadaki ögeler aynı formda olmalı: reading, writing, and drawing, arada to read olmaz. Önce yapının ne olduğunu belirle, sonra boşluğu ona uydur."],"celdirici_aileleri":[{"tanim":"Fiil öznesiyle sayıda uyuşmaz. Araya giren ifadeler yüzünden yanlış kelimeyi özne sanmak en sık hata. Tekil özne tekil fiil, çoğul özne çoğul fiil ister.","ad":"Özne yüklem uyumsuzluğu"},{"tanim":"Fiil cümlenin ya da paragrafın zamanına uymaz. Etraf geçmiş zamandayken boşluğa şimdiki ya da gelecek konur. Zaman tutarlı olmalı.","ad":"Fiil zamanı tutarsızlığı"},{"tanim":"Zamir gönderdiği isimle sayıda uyuşmaz ya da hangi ismi gönderdiği belirsizdir. Tekil isme çoğul zamir, ya da iki olası isme tek zamir.","ad":"Zamir uyumsuzluğu"},{"ad":"Modifier ve paralellik","tanim":"Tanımlayan yanlış şeyi tanımlar (dangling ya da misplaced modifier), ya da liste ve karşılaştırmadaki ögeler aynı formda değildir (paralellik bozuk)."}],"alt_konular_intro":"Bu beceri cümlenin İÇ tutarlılığını ölçer: fiiller, zamirler ve yapılar birbiriyle uyumlu mu? Boundaries noktalamaya bakarken, Form/Structure kelimelerin BİÇİMİNE bakar. Ortak yöntem: uyumu bozan öğeyi bulmak için özneyi, zamanı ya da göndergeyi cümlede geriye doğru izlemektir.","cozumlu_ornekler":[{"choices":{"C":"having","B":"have","D":"to have","A":"has"},"sonuc":"Araya giren of ... ifadesini kapat, gerçek özneyi (box, tekil) gör, fiili ona uydur.","stem":"Which choice conforms to the conventions of Standard English?","correct":"A","passage":"The box of old photographs and letters ______ been sitting in the attic for decades.","adimlar":["Gerçek özneyi bul: The box. of old photographs and letters araya giren ifade, özne değil.","box tekil, o yüzden fiil tekil olmalı.","has tekil, doğru.","have çoğul, letters'a uyar ama gerçek özne box. having ve to have çekimli fiil değil, ana fiil olamaz."]},{"adimlar":["Listenin yapısına bak: to code, to write, yani mastar formu (to + fiil).","Paralellik için üçüncü öge de aynı formda olmalı.","to manage a team mastar, paralel, doğru.","managing gerund, formu bozar. c ve d birer cümle, mastar değil, paralellik kırılır."],"passage":"The internship taught her to code, to write clearly, and ______.","correct":"A","stem":"Which choice conforms to the conventions of Standard English?","sonuc":"Listedeki ögeler aynı formda olmalı. İlk ikisi mastar ise üçüncü de mastar.","choices":{"D":"how a team is managed","B":"managing a team","C":"a team can be managed","A":"to manage a team"}}],"alt_konular":[{"kural":"Araya giren öbeği sil, gerçek özneyi bul, fiili ona göre tekil/çoğul yap.","govde":["Fiil, sayı bakımından ÖZNEYLE uyuşmalı: tekil özne tekil fiil, çoğul özne çoğul fiil. Zorluk, araya giren kelimelerin özneyi gizlemesidir.","SAT'ın en sevdiği tuzak: özneyle fiil arasına araya giren bir öbek koymak. 'The box of old letters ___ on the shelf' — özne 'box' (tekil), 'letters' değil. Araya giren öbeği zihinsel olarak sil, gerçek özneyi bul.","Diğer tuzak: 'each', 'every', 'neither' gibi daima TEKİL sayılan özneler; ve 'and' ile bağlanan çoğul özneler. Bu işaretleri ezberle."],"baslik":"1) Özne-yüklem uyumu (subject-verb agreement)"},{"govde":["Fiilin zamanı cümledeki ya da paragraftaki diğer zaman işaretleriyle tutarlı olmalı. Metnin genel zamanı geçmişse, tutarsız bir şimdiki zaman fiili yanlıştır.","İpuçlarını topla: zaman zarfları (yesterday, currently, by 2020), diğer fiillerin zamanı, olayların sırası. 'By the time X happened, Y had already...' gibi kalıplar past perfect ister.","Tuzak: kulağa doğru gelen ama paragrafın zaman çizgisini bozan fiil. Tek cümleye değil, çevredeki fiillere bakarak karar ver."],"ornek":"Paragraf geçmiş zamanda ilerliyorsa, 'she then decides' değil 'she then decided' doğrudur.","baslik":"2) Fiil zamanı ve biçimi (verb tense & form)"},{"baslik":"3) Zamir uyumu ve göndergesi (pronoun agreement)","kural":"Zamiri gönderdiği isimle eşle; sayı uyuşmuyorsa ya da gönderge belirsizse seçenek yanlıştır.","govde":["Zamir, gönderdiği isimle (antecedent) sayı bakımından uyuşmalı: tekil isim → tekil zamir (it), çoğul isim → çoğul zamir (they).","Sık hata: 'a company... they' gibi tekil bir kurumu çoğul zamirle karşılamak. Göndergeyi bul, sayısını belirle, zamiri ona uydur.","Belirsiz gönderge de yanlıştır: zamirin hangi isme gönderdiği net değilse cümle kusurludur. SAT bunu çoğu zaman ismi tekrar eden seçenekle düzeltir."]},{"baslik":"4) Paralellik ve niteleyici yeri (parallelism & modifiers)","govde":["Liste ya da karşılaştırmadaki öğeler AYNI dilbilgisel biçimde olmalı: 'running, jumping, and swimming' (üçü de -ing). Biçimi kırılan öğe yanlıştır.","Sarkık niteleyici (dangling modifier): cümlenin başındaki tanımlayıcı öbek, hemen ardından gelen ÖZNEYİ nitelemeli. 'Walking home, the rain started' yanlıştır çünkü yürüyen yağmur değildir; doğru özne kişidir.","Yöntem: giriş öbeğini oku, 'bunu kim/ne yapıyor?' diye sor, cevabı ana cümlenin öznesi olmalı. Değilse niteleyici sarkıktır."],"kural":"Listede öğeler aynı biçimde olmalı; başta niteleyici varsa hemen sonraki özne onu yapan kişi/şey olmalı."}],"sik_hatalar":[{"cozum":"Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ifadesini kapat.","hata":"Yanlış kelimeyi özne sanmak"},{"hata":"Zaman kayması","cozum":"Etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı."},{"hata":"Tekil isme çoğul zamir","cozum":"Bu soru tipinde a person ... their yerine his or her, ya da ismi çoğul yap."},{"cozum":"Cümle -ing ya da -ed ile başlıyorsa virgülden sonraki ilk isim o eylemi yapan olmalı. Listede ögeleri aynı formda tut.","hata":"Modifier ve paralellik bozmak"}],"ne_olculuyor":["Bu ders cümlenin dilbilgisi yapısını ölçer: fiil uyumu ve zamanı, zamir uyumu, modifier yerleşimi ve paralellik.","Boşluk çoğu zaman bir fiil, zamir ya da kelime formu ister. Doğru form cümlenin diğer ögeleriyle uyumlu olmalıdır.","Kritik nokta: fiil öznesiyle sayıda uyuşmalı, zamir gönderdiği isimle uyuşmalı, tanımlayan (modifier) tanımladığı şeyin yanında olmalı, listeler paralel olmalı."],"karar_proseduru":["Fiil boşluğu ise, GERÇEK öznesini bul.  Özne ile fiil arasına giren araya bakma. The box of old letters WAS, letters değil box tekil.","Zamana bak.  Cümlenin geri kalanı hangi zamandaysa fiil de ona uymalı. Etraftaki fiiller geçmişse boşluk da geçmiş olmalı.","Zamir boşluğu ise, gönderdiği ismi bul ve sayısına bak.  Tekil isim tekil zamir ister. A student ... their değil his or her ya da yeniden yapılandır.","Cümle bir tanımlayanla başlıyorsa, hemen ardından gelen İSİM onun tanımladığı şey olmalı.  Walking home, the rain started YANLIŞ, çünkü yağmur yürümez.","Liste ya da karşılaştırma varsa paralel yap.  Ögeler aynı formda olmalı: reading, writing, and drawing; to read değil."],"alt_konular_baslik":"Kural alt başlıkları","top_tips":["Fiil sorusunda öznenin fiile en yakın kelime OLMADIĞINA dikkat et. Araya giren of ... ifadesini elle kapat, gerçek özneyi gör.","Zaman için etraftaki fiillere bak. Cümlenin gerisi geçmişse boşluk da geçmiş olmalı. Zaman kayması tuzaktır.","their tek bir kişi için kullanılamaz (Standard English'te bu soru tipinde). A person ... their yerine his or her, ya da isim çoğul yapılır.","Cümle -ing ya da -ed ile başlıyorsa, virgülden sonraki ilk isim o eylemi yapan olmalı. Yapmıyorsa modifier yanlış yerleşmiş."]},"fam_short":{"Modifier ve paralellik":"Modifier/paralel","Fiil zamanı tutarsızlığı":"Fiil zamanı","Özne yüklem uyumsuzluğu":"Özne/yüklem","Zamir uyumsuzluğu":"Zamir"},"no":2,"name":"Form, Structure, and Sense","questions":[{"choices":{"A":"has","D":"to have","B":"have","C":"having"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l2-f1-01","unit":4,"why_correct":"The subject is the singular 'box,' not 'photographs and letters,' so the singular verb 'has' agrees.","why_wrong":{"C":"'having' is not a finite verb and cannot serve as the main verb here.","B":"'have' is plural, but the true subject 'box' is singular.","D":"'to have' is an infinitive and cannot serve as the main verb of the sentence."},"target_family":"Özne yüklem uyumsuzluğu","lesson_name":"Form, Structure, and Sense","correct":"A","passage":"The box of old photographs and letters ______ been sitting in the attic for decades.","lesson":2,"choice_families":{"B":"Özne yüklem uyumsuzluğu","D":"Modifier ve paralellik","C":"Fiil zamanı tutarsızlığı"}},{"choice_families":{"A":"Özne yüklem uyumsuzluğu","C":"Fiil zamanı tutarsızlığı","D":"Modifier ve paralellik"},"lesson":2,"passage":"Each of the students in the advanced classes ______ required to submit a final project.","lesson_name":"Form, Structure, and Sense","correct":"B","target_family":"Özne yüklem uyumsuzluğu","why_wrong":{"C":"'were' is plural and past, disagreeing with the singular subject and the present context.","D":"'being' is not a finite verb and cannot serve as the main verb.","A":"'are' is plural, but 'Each' is singular regardless of the plural nouns nearby."},"why_correct":"The subject is 'Each,' which is singular, so the singular verb 'is' agrees.","id":"u4-l2-f1-02","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"are","B":"is","D":"being","C":"were"}},{"lesson":2,"lesson_name":"Form, Structure, and Sense","correct":"C","passage":"The list of approved suppliers ______ updated at the start of every month.","choice_families":{"B":"Özne yüklem uyumsuzluğu","D":"Özne yüklem uyumsuzluğu","A":"Fiil zamanı tutarsızlığı"},"id":"u4-l2-f1-03","unit":4,"choices":{"C":"is","B":"are","D":"have been","A":"were"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","target_family":"Özne yüklem uyumsuzluğu","why_correct":"The subject is the singular 'list,' not 'suppliers,' so the singular verb 'is' agrees.","why_wrong":{"D":"'have been' is plural, disagreeing with the singular 'list.'","B":"'are' is plural, but the true subject 'list' is singular.","A":"'were' is plural and shifts to past, disagreeing with the singular subject."}},{"lesson_name":"Form, Structure, and Sense","correct":"D","passage":"Neither the manager nor the employees ______ aware of the schedule change.","lesson":2,"choice_families":{"A":"Özne yüklem uyumsuzluğu","C":"Özne yüklem uyumsuzluğu","B":"Özne yüklem uyumsuzluğu"},"choices":{"C":"is","D":"were","B":"was","A":"has been"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"id":"u4-l2-f1-04","why_correct":"With 'neither ... nor,' the verb agrees with the nearer subject 'employees,' which is plural, so 'were' agrees.","why_wrong":{"A":"'has been' is singular, disagreeing with the plural 'employees.'","B":"'was' is singular, but the nearer subject 'employees' is plural.","C":"'is' is singular and present, disagreeing with the plural nearer subject."},"target_family":"Özne yüklem uyumsuzluğu"},{"choice_families":{"B":"Özne yüklem uyumsuzluğu","D":"Modifier ve paralellik","C":"Özne yüklem uyumsuzluğu"},"correct":"A","lesson_name":"Form, Structure, and Sense","passage":"The committee ______ its decision after weeks of careful debate.","lesson":2,"why_correct":"'Committee' is a singular collective noun acting as one unit, so the singular past verb 'announced' agrees.","why_wrong":{"D":"'announcing' is not a finite verb and cannot serve as the main verb.","B":"'announce' fails to agree with the singular collective noun and shifts the sense to present.","C":"'have announced' treats the singular committee as plural."},"target_family":"Özne yüklem uyumsuzluğu","choices":{"A":"announced","C":"have announced","B":"announce","D":"announcing"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"id":"u4-l2-f1-05"},{"passage":"One of the reasons for the project's success ______ its clear leadership.","correct":"B","lesson_name":"Form, Structure, and Sense","lesson":2,"choice_families":{"D":"Modifier ve paralellik","C":"Özne yüklem uyumsuzluğu","A":"Özne yüklem uyumsuzluğu"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"C":"have been","B":"was","D":"being","A":"were"},"unit":4,"id":"u4-l2-f1-06","why_wrong":{"D":"'being' is not a finite verb and cannot serve as the main verb.","C":"'have been' is plural, disagreeing with the singular 'One.'","A":"'were' is plural, but the true subject 'One' is singular, not 'reasons.'"},"why_correct":"The subject is 'One,' which is singular, so the singular verb 'was' agrees.","target_family":"Özne yüklem uyumsuzluğu"},{"lesson":2,"correct":"C","lesson_name":"Form, Structure, and Sense","passage":"The data from the two surveys ______ a clear trend among younger voters.","choice_families":{"B":"Özne yüklem uyumsuzluğu","D":"Modifier ve paralellik","A":"Fiil zamanı tutarsızlığı"},"unit":4,"id":"u4-l2-f1-07","choices":{"A":"is revealing","C":"reveal","D":"to reveal","B":"reveals"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","target_family":"Özne yüklem uyumsuzluğu","why_correct":"'Data' is treated as plural here, so the plural verb 'reveal' agrees.","why_wrong":{"A":"'is revealing' is singular, disagreeing with the plural 'data.'","B":"'reveals' is singular, disagreeing with the plural 'data.'","D":"'to reveal' is an infinitive and cannot serve as the main verb."}},{"lesson":2,"passage":"A collection of rare coins ______ displayed in the museum's east wing.","lesson_name":"Form, Structure, and Sense","correct":"D","choice_families":{"C":"Fiil zamanı tutarsızlığı","B":"Özne yüklem uyumsuzluğu","A":"Özne yüklem uyumsuzluğu"},"id":"u4-l2-f1-08","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"D":"is","B":"are","C":"were","A":"have been"},"target_family":"Özne yüklem uyumsuzluğu","why_wrong":{"A":"'have been' is plural, disagreeing with the singular 'collection.'","B":"'are' is plural, but the true subject 'collection' is singular.","C":"'were' is plural and past, disagreeing with the singular subject."},"why_correct":"The subject is the singular 'collection,' not 'coins,' so the singular verb 'is' agrees."},{"lesson":2,"passage":"Every one of the paintings in the gallery ______ carefully lit to bring out its colors.","correct":"A","lesson_name":"Form, Structure, and Sense","choice_families":{"C":"Fiil zamanı tutarsızlığı","B":"Özne yüklem uyumsuzluğu","D":"Modifier ve paralellik"},"id":"u4-l2-f1-09","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"is","B":"are","D":"being","C":"were"},"target_family":"Özne yüklem uyumsuzluğu","why_wrong":{"D":"'being' is not a finite verb and cannot serve as the main verb.","B":"'are' is plural, but 'Every one' is singular despite the plural 'paintings.'","C":"'were' is plural and past, disagreeing with the singular subject."},"why_correct":"The subject is 'Every one,' which is singular, so the singular verb 'is' agrees."},{"why_correct":"'The number' is a singular subject, so the singular verb 'has' agrees.","why_wrong":{"A":"'have' is plural, but 'The number' is singular, unlike 'a number,' which is plural.","C":"'are' is plural, disagreeing with the singular 'The number.'","D":"'having' is not a finite verb and cannot serve as the main verb."},"target_family":"Özne yüklem uyumsuzluğu","choices":{"A":"have","C":"are","B":"has","D":"having"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"id":"u4-l2-f1-10","choice_families":{"D":"Modifier ve paralellik","C":"Özne yüklem uyumsuzluğu","A":"Özne yüklem uyumsuzluğu"},"correct":"B","lesson_name":"Form, Structure, and Sense","passage":"The number of applicants for the scholarship ______ risen sharply this year.","lesson":2},{"target_family":"Fiil zamanı tutarsızlığı","why_wrong":{"A":"'analyze' shifts to present, breaking the past-tense sequence begun by 'gathered.'","C":"'will analyze' shifts to future, inconsistent with the past 'gathered.'","D":"'are analyzing' shifts to present, inconsistent with the past narrative."},"why_correct":"The first verb 'gathered' is past, so the parallel past 'analyzed' keeps the tense consistent.","id":"u4-l2-f2-01","unit":4,"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"analyze","C":"will analyze","D":"are analyzing","B":"analyzed"},"choice_families":{"D":"Fiil zamanı tutarsızlığı","C":"Fiil zamanı tutarsızlığı","A":"Fiil zamanı tutarsızlığı"},"lesson":2,"passage":"The researchers gathered their samples in the morning and ______ them in the lab that afternoon.","correct":"B","lesson_name":"Form, Structure, and Sense"},{"target_family":"Fiil zamanı tutarsızlığı","why_correct":"An action completed before the past 'arrived' takes the past perfect, so 'had' is correct.","why_wrong":{"D":"'is having' is present progressive, inconsistent with the past-time frame.","B":"'has' is present perfect, inconsistent with the past-time frame set by 'arrived.'","A":"'will have' points to the future, inconsistent with the past narrative."},"id":"u4-l2-f2-02","unit":4,"choices":{"A":"will have","B":"has","D":"is having","C":"had"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","choice_families":{"A":"Fiil zamanı tutarsızlığı","D":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı"},"lesson":2,"lesson_name":"Form, Structure, and Sense","correct":"C","passage":"By the time the guests arrived, the host ______ already prepared every dish on the menu."},{"choice_families":{"C":"Fiil zamanı tutarsızlığı","B":"Fiil zamanı tutarsızlığı","A":"Fiil zamanı tutarsızlığı"},"lesson_name":"Form, Structure, and Sense","correct":"D","passage":"Today many households rely on solar power, and each year even more ______ to it as costs fall.","lesson":2,"why_correct":"The sentence is in the present ('rely,' 'fall'), so the present 'switch' keeps the tense consistent.","why_wrong":{"B":"'switched' shifts to past, inconsistent with the present 'rely' and 'fall.'","C":"'had switched' is past perfect, inconsistent with the present-time frame.","A":"'will have switched' points to the future, inconsistent with the present context."},"target_family":"Fiil zamanı tutarsızlığı","choices":{"C":"had switched","B":"switched","D":"switch","A":"will have switched"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","unit":4,"id":"u4-l2-f2-03"},{"choices":{"A":"typed","B":"types","D":"is typing","C":"will type"},"stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","id":"u4-l2-f2-04","unit":4,"why_correct":"The first verb 'wrote' is past, so the past 'typed' keeps the sequence consistent.","why_ const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
