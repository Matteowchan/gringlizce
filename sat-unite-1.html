}, "why_correct": "The central point is that simpler designs are often safer, which this captures.", "why_wrong": {"A": "The text says often safer, not always completely safe; that overstates it.", "C": "The age of bridge-building is true but not the point the question asks about.", "D": "Added parts failing is one supporting point, too narrow to be the main idea."}}, {"id": "u1-l3-f3-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The chef argued that good cooking starts with restraint. Too many ingredients, he said, drown out the flavors that matter. A dish with three well-chosen elements can taste richer than one with twelve. Knowing what to leave out is the mark of a skilled cook.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "A dish with fewer ingredients always tastes better than any other dish ever could.", "B": "Good cooking depends on restraint, using few well-chosen ingredients.", "C": "The chef said too many ingredients drown out key flavors.", "D": "Many people enjoy eating out at restaurants."}, "correct": "B", "choice_families": {"A": "Cok genis", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that restraint makes for good cooking, which this captures.", "why_wrong": {"A": "The text does not claim fewer ingredients always taste better; that overstates it.", "C": "The drowning-out point is one supporting idea, too narrow to be the main idea.", "D": "That people enjoy restaurants is true but not the point the question asks about."}}, {"id": "u1-l3-f3-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The teacher found that spacing lessons out works better than cramming. When students review material over several days, they remember it far longer than when they study it all at once. The effort of recalling a fading memory is what makes it stick.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Students review the material over several days.", "B": "Cramming never helps anyone remember anything at all, in any situation.", "C": "Students attend school for many years of their lives.", "D": "Spacing study across days aids retention far more than cramming."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Cok genis", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that spaced study beats cramming for retention, which this captures.", "why_wrong": {"A": "Reviewing over several days is one detail, too narrow to be the main idea.", "B": "The text does not claim cramming never helps at all; that overstates it.", "C": "How long students attend school is true but not the point the question asks about."}}, {"id": "u1-l3-f3-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The naturalist claimed that wolves shape whole ecosystems. By controlling deer numbers, they let young trees grow, which shelter birds and stabilize riverbanks. Remove the wolves, she observed, and the effects ripple outward. A single predator can hold a landscape together.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Wolves can shape entire ecosystems, so removing them ripples widely.", "B": "Wolves are members of the dog family.", "C": "Wolves help to control deer numbers.", "D": "Wolves are the only animals that have any effect at all on any ecosystem."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Cok dar", "D": "Cok genis"}, "why_correct": "The central point is that wolves shape whole ecosystems, which this captures.", "why_wrong": {"B": "That wolves are in the dog family is true but not the point the question asks about.", "C": "Controlling deer is one detail, too narrow to be the main idea.", "D": "The text does not claim wolves are the only animals that affect ecosystems; that overstates it."}}, {"id": "u1-l3-f3-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The archivist warned that digital records are more fragile than they seem. Files can be lost when formats become obsolete or storage devices fail, sometimes within a decade. Paper, by contrast, can last centuries untended. Preserving digital history takes constant, active effort.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "All digital files are destroyed within exactly ten years, with no exceptions.", "B": "Files can be lost when storage devices fail.", "C": "Computers are used in nearly every office today.", "D": "Digital records are fragile and require constant effort to preserve, unlike paper."}, "correct": "D", "choice_families": {"A": "Cok genis", "B": "Cok dar", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that digital records are fragile and need active preservation, which this captures.", "why_wrong": {"A": "The text says sometimes within a decade, not always exactly ten years; that overstates it.", "B": "Files lost to device failure is one detail, too narrow to be the main idea.", "C": "The prevalence of computers is true but not the point the question asks about."}}, {"id": "u1-l3-f3-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The economist argued that small businesses anchor local economies. Money spent at a neighborhood shop tends to stay in the area, paying local wages and suppliers, while money spent at distant chains often leaves. Strong local businesses keep a community's wealth circulating close to home.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Money spent at a neighborhood shop pays local wages.", "B": "Many businesses now accept payment by card.", "C": "Every large chain store harms every community it enters, with no exception.", "D": "Local businesses strengthen communities by keeping wealth circulating."}, "correct": "D", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "C": "Cok genis"}, "why_correct": "The central point is that local businesses keep community wealth circulating, which this captures.", "why_wrong": {"A": "Paying local wages is one supporting point, too narrow to be the main idea.", "B": "That businesses accept cards is true but not the point the question asks about.", "C": "The text does not claim every chain harms every community; that overstates it."}}, {"id": "u1-l3-f3-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The astronomer explained that dark skies are a vanishing resource. Artificial light now washes out the stars for most city dwellers, who may never see the Milky Way. Beyond stargazing, this glow disrupts the rhythms of nocturnal animals. Protecting darkness matters for people and wildlife.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Artificial light washes out the stars for many city dwellers.", "B": "The Milky Way is a galaxy.", "C": "Light pollution erases dark skies, harming both stargazers and wildlife.", "D": "Artificial light has completely destroyed every star in the entire universe."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that light pollution harms both stargazing and wildlife, which this captures.", "why_wrong": {"A": "Washed-out stars is one detail, too narrow to be the main idea.", "B": "That the Milky Way is a galaxy is true but not the point the question asks about.", "D": "The text is about washed-out views, not destroyed stars; that overstates it absurdly."}}, {"id": "u1-l3-f3-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Dogru ama alakasiz", "passage": "The linguist argued that slang is not lazy speech but invention. Young people constantly coin words to name new feelings and experiences, and some eventually enter standard dictionaries. What sounds like carelessness is often language renewing itself.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Some slang words enter standard dictionaries.", "B": "English is spoken in many countries around the world.", "C": "Slang is creative language renewal, not careless or lazy speech.", "D": "Every slang word ever invented has become a formal dictionary entry."}, "correct": "C", "choice_families": {"A": "Cok dar", "B": "Dogru ama alakasiz", "D": "Cok genis"}, "why_correct": "The central point is that slang is creative renewal, not laziness, which this captures.", "why_wrong": {"A": "Some slang entering dictionaries is one detail, too narrow to be the main idea.", "B": "Where English is spoken is true but not the point the question asks about.", "D": "The text says some slang enters dictionaries, not every word; that overstates it."}}, {"id": "u1-l3-f4-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The researcher found that trust builds cooperation, not the other way around. When people believe others will keep their word, they take the risk of working together, and success then deepens that trust. But the first step is trust; without it, cooperation never begins.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "People work together in many different kinds of groups and teams.", "B": "Successful cooperation can deepen the trust that already exists.", "C": "Trust comes first and makes cooperation possible, not the reverse.", "D": "Cooperation between people is what first creates the trust among them."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that trust comes first and enables cooperation, which this captures.", "why_wrong": {"A": "That people work in groups is true but not the point the question asks about.", "B": "Cooperation deepening trust is one sub-point, too narrow to be the main idea about order.", "D": "This flips the order; the text says trust enables cooperation, not the reverse."}}, {"id": "u1-l3-f4-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The biologist explained that shade from the forest canopy keeps the soil moist, and that this moisture in turn lets the tall canopy trees thrive. The relationship runs one way at the start: it is the canopy's shade that protects the moisture the whole system depends on.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Forests are found on every continent except Antarctica.", "B": "It is the soil's moisture that produces the shade of the forest canopy.", "C": "The canopy's shade preserves the moisture the tall trees depend on.", "D": "Moisture lets the tall canopy trees thrive."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that canopy shade preserves moisture that trees depend on, which this captures.", "why_wrong": {"A": "Where forests are found is true but not the point the question asks about.", "B": "This flips the relationship; the text says shade preserves moisture, not the reverse.", "D": "Moisture helping trees is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The historian argued that cheap paper enabled mass literacy, not the reverse. Once paper became affordable, books and pamphlets spread, and ordinary people gained reason and means to read. Demand for reading did not create cheap paper; cheap paper created the conditions for reading.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Paper can be made from wood or from cloth fibers.", "B": "Books and pamphlets spread once paper became affordable.", "C": "Cheap paper came first and enabled mass literacy, not the reverse.", "D": "A rise in mass literacy is what made paper become cheap."}, "correct": "C", "choice_families": {"A": "Dogru ama alakasiz", "B": "Cok dar", "D": "Ters iliski"}, "why_correct": "The central point is that cheap paper preceded and enabled literacy, which this captures.", "why_wrong": {"A": "What paper is made of is true but not the point the question asks about.", "B": "Books spreading is one sub-point, too narrow to be the main idea about order.", "D": "This flips the order; the text says paper enabled literacy, not the reverse."}}, {"id": "u1-l3-f4-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The ecologist showed that otters protect kelp forests. Otters eat sea urchins, and urchins left unchecked devour kelp. Where otters thrive, urchin numbers stay low and kelp flourishes. The otter's presence, not the kelp's, sets the whole chain in motion.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Flourishing kelp forests are what cause otter populations to thrive.", "B": "Otters protect kelp forests by keeping the urchins that eat kelp in check.", "C": "Otters eat sea urchins.", "D": "Kelp is a kind of large seaweed."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that otters protect kelp by controlling urchins, which this captures.", "why_wrong": {"A": "This flips the chain; the text says otters set it in motion, not the kelp.", "C": "That otters eat urchins is one detail, too narrow to be the main idea.", "D": "That kelp is a seaweed is true but not the point the question asks about."}}, {"id": "u1-l3-f4-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The teacher observed that curiosity drives attention, not the reverse. When students genuinely wonder about something, they focus without being told to. Forcing attention onto a dull topic rarely works; sparking curiosity first is what makes the focus follow.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Forcing students to pay attention is what creates their curiosity.", "B": "Curiosity comes first and produces attention, not the reverse.", "C": "Students focus on the things they wonder about.", "D": "Classrooms often contain rows of desks and chairs."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Cok dar", "D": "Dogru ama alakasiz"}, "why_correct": "The central point is that curiosity comes first and produces attention, which this captures.", "why_wrong": {"A": "This flips the order; the text says curiosity produces attention, not the reverse.", "C": "Focusing on wonder is one sub-point, too narrow to be the main idea.", "D": "What classrooms contain is true but not the point the question asks about."}}, {"id": "u1-l3-f4-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The economist argued that rising wages drove the town's recovery, not the reverse. As factories raised pay, workers spent more locally, which revived shops and drew new businesses in. The higher wages came first; the broader recovery followed from them.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Rising wages came first and drove the town's wider economic recovery.", "B": "Many towns have both factories and shops.", "C": "The town's economic recovery is what caused its wages to rise.", "D": "Workers spent more money at the local shops."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that rising wages preceded and drove the recovery, which this captures.", "why_wrong": {"B": "That towns have factories and shops is true but not the point the question asks about.", "C": "This flips the order; the text says wages drove recovery, not the reverse.", "D": "Workers spending locally is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The scientist explained that warming seas drive stronger storms, not the reverse. Warm water feeds energy into forming storms, making them more intense. The storms do not warm the sea; they draw on heat already there. The order of cause and effect is clear.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Strong storms are what cause the seas to become warmer.", "B": "Warm seas drive stronger storms, not the other way around.", "C": "Storms are given names by weather agencies.", "D": "Warm water feeds energy into forming storms."}, "correct": "B", "choice_families": {"A": "Ters iliski", "C": "Dogru ama alakasiz", "D": "Cok dar"}, "why_correct": "The central point is that warm seas drive stronger storms, not the reverse, which this captures.", "why_wrong": {"A": "This flips the cause and effect; the text says warm seas drive storms, not the reverse.", "C": "That storms are named is true but not the point the question asks about.", "D": "Warm water feeding storms is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The sociologist argued that strong friendships lead to good health, not merely the reverse. People with close ties feel less stress and take better care of themselves, which improves health over time. It is the social bond that supports the health, not simply healthy people making friends.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Strong friendships support good health, not merely the reverse.", "B": "People make friends at school, at work, and in other places.", "C": "Being in good health is the only reason people ever form strong friendships.", "D": "People with close ties tend to feel less stress."}, "correct": "A", "choice_families": {"B": "Dogru ama alakasiz", "C": "Ters iliski", "D": "Cok dar"}, "why_correct": "The central point is that friendships support health, not just the reverse, which this captures.", "why_wrong": {"B": "Where people make friends is true but not the point the question asks about.", "C": "This flips the relationship; the text stresses that bonds support health, not only the reverse.", "D": "Less stress from close ties is one sub-point, too narrow to be the main idea."}}, {"id": "u1-l3-f4-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The engineer explained that good roads lower transport costs, which then lower the price of goods. The causal arrow points from roads to prices: build better roads, and delivery grows cheaper, so shelves fill at lower cost. Cheap goods do not build the roads; the roads make the goods cheap.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Cheap goods are what fund and build the better roads.", "B": "Better roads make delivery cheaper.", "C": "Roads are usually paved with asphalt or with concrete.", "D": "Better roads lower transport costs and so lower the price of goods, not the reverse."}, "correct": "D", "choice_families": {"A": "Ters iliski", "B": "Cok dar", "C": "Dogru ama alakasiz"}, "why_correct": "The central point is that roads lower costs and thus prices, not the reverse, which this captures.", "why_wrong": {"A": "This flips the cause and effect; the text says roads make goods cheap, not the reverse.", "B": "Cheaper delivery is one sub-point, too narrow to be the main idea.", "C": "What roads are paved with is true but not the point the question asks about."}}, {"id": "u1-l3-f4-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Ters iliski", "passage": "The researcher found that practice builds confidence, not the reverse. As musicians rehearse a piece until it is secure, their nerves fade and assurance grows. Waiting to feel confident before practicing gets the order backward; confidence is a product of practice, not its precondition.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Feeling confident in advance is what makes musicians willing to practice.", "B": "Musicians play many different kinds of instruments.", "C": "Practice builds confidence, so confidence follows from practice.", "D": "Musicians rehearse a piece until it is secure."}, "correct": "C", "choice_families": {"A": "Ters iliski", "B": "Dogru ama alakasiz", "D": "Cok dar"}, "why_correct": "The central point is that practice builds confidence, not the reverse, which this captures.", "why_wrong": {"A": "This flips the order; the text says practice builds confidence, not the reverse.", "B": "What instruments musicians play is true but not the point the question asks about.", "D": "Rehearsing until secure is one sub-point, too narrow to be the main idea."}}]}, {"no": 4, "name": "Inferences", "teaching": {"ne_olculuyor": ["Metnin SONUNDA bir boşluk vardır. Boşluğu dolduran şık metnin mantıksal sonucu olmalıdır.", "Boşluk neredeyse her zaman bir sonuç işaretçisinden sonra gelir: therefore, thus, this suggests that, it can be concluded that, so.", "Çıkarım demek, tahmin demek değildir. Çıkarım, metnin verdiği bilgiden ZORUNLU olarak çıkan şeydir. Metin bunu söylemez ama metin bunu gerektirir."], "karar_proseduru": ["Boşluğun ÖNCESİNDEKİ cümleyi oku ve mantık yönünü bul.  Metin bir karşıtlık mı kuruyor, bir sebep mi veriyor, bir şaşırtıcı bulgu mu sunuyor.", "Metnin verdiği bütün olguları say.  Çıkarım genelde İKİ olguyu birleştirir. Sadece birine dayanan şık eksiktir.", "Kendi cümleni kur.  Şıklara bakmadan önce boşluğa ne geleceğini kendin yaz. Sonra en yakın şıkkı bul.", "Güçlü kelime taraması yap.  always, never, all, only, impossible, prevents, must, exclusively içeren şıkları işaretle. Bunların çoğu yanlıştır."], "celdirici_aileleri": [{"ad": "Çok güçlü", "tanim": "Şık mutlak bir iddia kurar. always, never, all, only, prevents, impossible. SAT çıkarımı İHTİYATLIDIR. Doğru cevap genelde may, can, suggests, tend to, is likely to gibi yumuşak fiillerle gelir."}, {"ad": "Metnin dışına çıkma", "tanim": "Şık makuldür, hatta gerçek hayatta doğrudur, ama metinde onu destekleyen hiçbir şey yoktur. Kendi bilgini kullanma. Metin ne diyorsa o."}, {"ad": "Öncül sonuç karışıklığı", "tanim": "Şık metinde zaten SÖYLENMİŞ bir şeyi tekrar eder. Bu bir çıkarım değil, bir alıntıdır. Çıkarım metnin ÖTESİNE geçer. Metni tekrar eden şık yanlıştır."}, {"ad": "Yön doğru, derece yanlış", "tanim": "Şıkkın yönü doğrudur ama iddiayı metnin destekleyeceğinden fazla ileri götürür. Metin bir etkiden bahsediyorsa şık o etkinin TEK sebep olduğunu söylüyordur."}], "top_tips": ["Güçlü kelime testi. Şıklarda always, never, all, only, none, impossible, prevents, entirely, exclusively varsa o şıkkı önce şüphelen. SAT'de bu kelimeleri içeren şık onda dokuz yanlıştır. Bu tek kural sana sınavda iki üç soru kazandırır.", "Boşluktan önceki cümlede however ya da but varsa çıkarım bir KARŞITLIK taşır. O zaman doğru şık beklentiyle çelişen bir şeyi söyler.", "Metin iki grubu karşılaştırıyorsa çıkarım genelde İKİSİ hakkındadır. Sadece bir gruptan bahseden şık eksiktir.", "Doğru cevabın fiiline bak. may, can, suggests, is likely to. Bu yumuşak fiiller SAT'ın imzasıdır."]}, "families": ["Cok guclu", "Metnin disina cikma", "Oncul sonuc karisikligi", "Yon dogru derece yanlis"], "fam_short": {"Cok guclu": "Cok guclu", "Metnin disina cikma": "Metin disi", "Oncul sonuc karisikligi": "Oncul-sonuc", "Yon dogru derece yanlis": "Derece"}, "main_ids": ["u1-l4-f1-01", "u1-l4-f2-01", "u1-l4-f3-01", "u1-l4-f4-01"], "questions": [{"id": "u1-l4-f1-01", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "In a study of note-taking, students who wrote notes by hand recalled more of a lecture a week later than those who typed. Researchers suggested that writing forces students to summarize in their own words, while typing lets them copy verbatim. This suggests that, for long-term recall, handwriting notes may", "stem": "Which choice most logically completes the text?", "choices": {"A": "force students to summarize a lecture in their own words.", "B": "offer some students an advantage over typing for later recall.", "C": "always be better than typing for every student without exception.", "D": "improve students' handwriting over the course of a term."}, "correct": "B", "choice_families": {"A": "Oncul sonuc karisikligi", "C": "Cok guclu", "D": "Metnin disina cikma"}, "why_correct": "The evidence supports a modest advantage for some students, so the hedged completion fits.", "why_wrong": {"A": "This restates a premise already given rather than drawing a new inference.", "C": "Always, every, and without exception overstate what a single study can support.", "D": "Improving handwriting is not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-02", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "A city planted trees along several bare streets. Over the next few summers, residents of those streets reported lower cooling bills than residents of nearby treeless streets. The planners concluded that the shade reduced the need for air conditioning. This suggests that adding street trees may", "stem": "Which choice most logically completes the text?", "choices": {"A": "help lower cooling costs on at least some city streets.", "B": "eliminate the need for air conditioning entirely on every street.", "C": "provide shade to the streets where they are planted.", "D": "raise the property values of the homes along them."}, "correct": "A", "choice_families": {"B": "Cok guclu", "C": "Oncul sonuc karisikligi", "D": "Metnin disina cikma"}, "why_correct": "The evidence supports lower cooling costs for some streets, so the hedged completion fits.", "why_wrong": {"B": "Eliminate entirely and every street overstate what the evidence shows.", "C": "This restates the given premise that trees provide shade rather than inferring.", "D": "Property values are not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-03", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "In an experiment, plants exposed to gentle recorded birdsong grew slightly taller than identical plants kept in silence. The researcher was careful to note that the effect was small and might not hold outside the lab. This suggests that sound may", "stem": "Which choice most logically completes the text?", "choices": {"A": "have produced slightly taller plants in this experiment.", "B": "have a modest effect on the growth of some plants.", "C": "always cause every plant to grow much taller than it otherwise would.", "D": "make plants more resistant to insect pests."}, "correct": "B", "choice_families": {"A": "Oncul sonuc karisikligi", "C": "Cok guclu", "D": "Metnin disina cikma"}, "why_correct": "The researcher stresses the effect is small and uncertain, so the hedged completion fits.", "why_wrong": {"A": "This restates the experiment's result rather than inferring beyond it.", "C": "Always and every plant overstate a small, uncertain effect.", "D": "Resistance to pests is not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-04", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "A bakery began labeling its breads with the farm where the wheat was grown. Sales of those breads rose over the following months, while unlabeled breads sold at their usual rate. The owner believed customers valued knowing the source. This suggests that origin labels may", "stem": "Which choice most logically completes the text?", "choices": {"A": "guarantee that all customers will always choose labeled bread.", "B": "appeal to at least some of the bakery's customers.", "C": "improve the nutritional quality of the bread itself.", "D": "show customers which farm grew the wheat."}, "correct": "B", "choice_families": {"A": "Cok guclu", "C": "Metnin disina cikma", "D": "Oncul sonuc karisikligi"}, "why_correct": "Rising sales support appeal to some customers, so the hedged completion fits.", "why_wrong": {"A": "Guarantee, all, and always overstate what the sales show.", "C": "Nutritional quality is not mentioned; this goes beyond the text.", "D": "This restates the given premise about what labels show rather than inferring."}}, {"id": "u1-l4-f1-05", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Drivers on a highway were shown signs displaying their current speed. In the weeks after the signs went up, average speeds in that stretch dropped. Officials thought seeing their own speed prompted drivers to slow down. This suggests that speed-display signs may", "stem": "Which choice most logically completes the text?", "choices": {"A": "reduce the cost of maintaining the highway surface.", "B": "display each driver's current speed to them.", "C": "force every driver to always obey the speed limit exactly.", "D": "encourage some drivers to reduce their speed."}, "correct": "D", "choice_families": {"A": "Metnin disina cikma", "B": "Oncul sonuc karisikligi", "C": "Cok guclu"}, "why_correct": "Lower average speeds support the idea that some drivers slowed, so the hedged completion fits.", "why_wrong": {"A": "Maintenance cost is not mentioned; this goes beyond the text.", "B": "This restates the given premise about what the signs display rather than inferring.", "C": "Force, every, and always exactly overstate the effect."}}, {"id": "u1-l4-f1-06", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Two groups of workers were given the same task; one worked in a room with a window and one without. Over a month, the group with the window reported fewer headaches. The manager suspected natural light played a role. This suggests that access to a window may", "stem": "Which choice most logically completes the text?", "choices": {"A": "completely prevent headaches for all workers everywhere.", "B": "increase how quickly the workers finished the task.", "C": "benefit at least some workers' comfort.", "D": "give one group of workers a view outside."}, "correct": "C", "choice_families": {"A": "Cok guclu", "B": "Metnin disina cikma", "D": "Oncul sonuc karisikligi"}, "why_correct": "Fewer headaches support a comfort benefit for some, so the hedged completion fits.", "why_wrong": {"A": "Completely prevent, all, and everywhere overstate the finding.", "B": "Task speed is not mentioned; this goes beyond the text.", "D": "This restates the given premise about one group's window rather than inferring."}}, {"id": "u1-l4-f1-07", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "A school moved its lunch period from 11 a.m. to noon. Teachers noticed that students seemed more focused in late-morning classes afterward. The principal thought hunger had been distracting the earlier group. This suggests that lunch timing may", "stem": "Which choice most logically completes the text?", "choices": {"A": "have been moved from 11 a.m. to noon.", "B": "affect how focused some students are in class.", "C": "reduce the amount of food the cafeteria wastes.", "D": "determine the exact grades of every student in the school."}, "correct": "B", "choice_families": {"A": "Oncul sonuc karisikligi", "C": "Metnin disina cikma", "D": "Cok guclu"}, "why_correct": "Sharper focus supports an effect on some students, so the hedged completion fits.", "why_wrong": {"A": "This restates the given premise about the schedule change rather than inferring.", "C": "Food waste is not mentioned; this goes beyond the text.", "D": "Exact grades and every student overstate the observation."}}, {"id": "u1-l4-f1-08", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Shoppers in a store were played slow music on some days and fast music on others. On the slow-music days, shoppers lingered longer and spent a little more. The manager linked the pace of the music to the pace of shopping. This suggests that background music may", "stem": "Which choice most logically completes the text?", "choices": {"A": "always make all shoppers spend the maximum possible amount.", "B": "be played at a slow pace on some of the days.", "C": "improve the store's relationship with its suppliers.", "D": "influence how long some shoppers stay in a store."}, "correct": "D", "choice_families": {"A": "Cok guclu", "B": "Oncul sonuc karisikligi", "C": "Metnin disina cikma"}, "why_correct": "Longer lingering supports an effect on some shoppers, so the hedged completion fits.", "why_wrong": {"A": "Always, all, and maximum overstate the effect.", "B": "This restates the given premise about the music's pace rather than inferring.", "C": "Supplier relationships are not mentioned; this goes beyond the text."}}, {"id": "u1-l4-f1-09", "unit": 1, "lesson": 4, "lesson_name": "Inferences", "target_family": "Cok guclu", "passage": "Researchers gave one group of hikers a detailed trail map and another only a rough sketch. The group with the detailed map made fewer wrong turns. The researchers concluded that clearer maps aid navigation. This suggests that a detailed map may", "stem": "Which choice most logically completes the text?", "choices": {"A": "he const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail'),main=document.getElementById('main');
const L=['A','B','C','D'];
const S={cur:0,lp:D.lessons.map(l=>({seen:new Set(),family:Object.fromEntries(l.families.map(f=>[f,'pending'])),phaseDone:{lesson:false,practice:false}})),
         phase:'lesson',queue:[],idx:0,remedFor:null,remedCount:0,activeQ:null,picked:null,locked:false};

// ---- Supabase progress adapter (matches site auth pattern; guest fallback) ----
const SB_URL=(window.SUPABASE_URL||'https://vazbvbqgvtlaqkytfsbi.supabase.co');
const SB_KEY=(window.SUPABASE_KEY||'sb_publishable_F5K-wIVQHXlD4e4GYnySNw_Xm4teO9g');
const Progress={client:null,userId:null,
  _wait(cb,t){t=t||0;if(window.supabase&&window.supabase.createClient){cb();return;}if(t>30)return;setTimeout(()=>this._wait(cb,t+1),100);},
  async init(){try{if(!window.supabase)return;this.client=window.supabase.createClient(SB_URL,SB_KEY);
    const r=await this.client.auth.getSession();this.userId=(r&&r.data&&r.data.session)?r.data.session.user.id:null;}catch(e){this.client=null;}},
  async load(unit){if(!this.client||!this.userId)return null;try{
    const a=await this.client.from('sat_module_progress').select('lesson,family,status').eq('user_id',this.userId).eq('unit',unit);
    const b=await this.client.from('sat_lesson_state').select('lesson,practice_done').eq('user_id',this.userId).eq('unit',unit);
    return {fam:(a&&a.data)||[],st:(b&&b.data)||[]};}catch(e){return null;}},
  saveFamily(unit,lesson,family,status){if(!this.client||!this.userId)return;
    this.client.from('sat_module_progress').upsert({user_id:this.userId,unit,lesson,family,status,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson,family'}).then(()=>{},()=>{});},
  saveState(unit,lesson,seen){if(!this.client||!this.userId)return;
    this.client.from('sat_lesson_state').upsert({user_id:this.userId,unit,lesson,practice_done:true,seen_count:seen,updated_at:new Date().toISOString()},{onConflict:'user_id,unit,lesson'}).then(()=>{},()=>{});},
  boot(){this._wait(async()=>{await this.init();const d=await this.load(D.unit);if(!d)return;
    d.fam.forEach(r=>{const i=r.lesson-1;if(S.lp[i]&&(r.family in S.lp[i].family))S.lp[i].family[r.family]=r.status;});
    d.st.forEach(r=>{const i=r.lesson-1;if(S.lp[i])S.lp[i].phaseDone.practice=!!r.practice_done;});
    renderRail();});},
};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const curL=()=>D.lessons[S.cur], lp=()=>S.lp[S.cur];
const sf=f=>{const l=curL();return (l.fam_short&&l.fam_short[f])||f;};
const qById=id=>curL().questions.find(q=>q.id===id);
const unseen=fam=>curL().questions.find(q=>q.target_family===fam&&!lp().seen.has(q.id));
function setMode(m){S.phase=m;main.setAttribute('data-mode',m==='test'?'test':m);}
function tableHTML(t){if(!t)return'';
  const head=t.head.map(h=>`<th>${esc(h)}</th>`).join('');
  const rows=t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('');
  return `<table class="dt"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;}
function renderRail(){
  const cur=S.phase;
  const link=(id,label,lock)=>`<a data-action="nav" data-target="${id}" class="${cur===id?'cur':''} ${lp().phaseDone[id]?'ok':''} ${lock?'lock':''}"><span class="dot"></span>${label}${lock?' <span style="margin-left:auto;font-size:10px;opacity:.6">yakinda</span>':''}</a>`;
  const lessons=D.lessons.map((l,i)=>{
    const active=i===S.cur;
    const done=S.lp[i].phaseDone.practice;
    const cls=active?'les active':(done?'les done':'les');
    const sub=active?`<div class="sub">${link('lesson','Konu anlatimi',false)}${link('practice','Alistirma',false)}${link('test','Unit Test',true)}</div>`:'';
    return `<div class="${cls}"><div class="lh" data-action="goto" data-lesson="${i}"><span class="n">${i+1}</span><span class="lt">${esc(l.name)}</span></div>${sub}</div>`;
  }).join('');
  const quads=curL().families.map(f=>{const st=lp().family[f];
    return `<div class="quad ${st==='mastered'?'mastered':st==='shaky'?'shaky':''}"><span class="qf">${esc(sf(f))}</span></div>`;}).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span>
    <div class="ut">${esc(D.unit_title)}</div><div>${lessons}</div>
    <div class="compass"><div class="cl">Tuzak pusulasi</div><div class="grid2">${quads}</div></div></div>`;
}
function gotoLesson(i){S.cur=i;S.remedFor=null;S.remedCount=0;lessonView();}
function lessonView(){
  setMode('lesson');renderRail();const l=curL(),t=l.teaching;
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${l.no} . Konu anlatimi</div>
     <h1>${esc(l.name)}</h1>
     <button class="next" data-action="start">Alistirmaya gec &rsaquo;</button></div>
   <div class="pad">
   <h2>Ne olculuyor</h2><div class="rule"></div>${t.ne_olculuyor.map(x=>`<p>${esc(x)}</p>`).join('')}
   <h2>Karar proseduru</h2><div class="rule"></div><ol class="steps">${t.karar_proseduru.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   <h2>Celdirici aileleri</h2><div class="rule"></div>${t.celdirici_aileleri.map(f=>`<div class="trap"><b>${esc(f.ad)}</b><p style="margin:.4rem 0 0">${esc(f.tanim)}</p></div>`).join('')}
   <h2>Top tips</h2><div class="rule"></div><ul class="tips">${t.top_tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <div class="row"><button class="btn" data-action="start">Alistirmaya basla</button></div></div>`;
  window.scrollTo(0,0);
}
function startPractice(){setMode('practice');S.queue=curL().main_ids.slice();S.idx=0;nextMain();}
function nextMain(){if(S.idx>=S.queue.length){return doneView();}S.remedFor=null;S.remedCount=0;showQ(qById(S.queue[S.idx]),'main');}
function showQ(q,kind){
  S.activeQ=q;S.picked=null;S.locked=false;lp().seen.add(q.id);renderRail();
  const remed=kind==='remed'?`<div class="remedbar">Telafi . hedef tuzak: ${esc(sf(S.remedFor))} . deneme ${S.remedCount}/2</div>`:'';
  const count=kind==='main'?`<div class="qcount">Soru ${S.idx+1} / ${S.queue.length}</div>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Alistirma</div><h1>${esc(curL().name)}</h1>
     <button class="backbtn" data-action="nav" data-target="lesson">&lsaquo; Konu anlatimina don</button></div>
   <div class="pad">${count}${remed}
    ${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="submit" data-action="submit" disabled>Cevabi kontrol et</button></div>
    <div id="fb"></div></div>`;
  window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Dogru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlis.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazinda durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya don</button><button class="btn ghost" data-action="start">Tekrar calis</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();}});
lessonView();Progress.boot();
