<meta name="description" content="IB English B Paper 1 hazirlik. Metin turleri karsilastirmasi, makale, blog, konusma, brosur, gorus yazisi, resmi mektup, kriterler ve Paper 1 yazma sihirbazi.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --ink:#1B2330; --muted:#6B7280; --line:#EAEBEF;
  --accent:#3B4E8A; --accent-deep:#26356B; --accent-soft:#DBE1F2; --panel:#E8ECF7;
  --good:#1FA971; --good-soft:#E7F6EF; --wrong:#D8503F; --wrong-soft:#FBEAE6;
  --paper:#FFFFFF; --card:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1140px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}
.pad{padding:0 30px}
.rail{width:288px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.85;font-weight:700;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
h1{font-family:Inter,sans-serif;font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:.35rem 0 .15rem;line-height:1.15;color:#fff}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:#fff;opacity:.82}
h2{font-family:Inter,sans-serif;font-weight:700;color:var(--ink);font-size:1.12rem;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.rule{height:0;margin:0}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:11px 18px;border-radius:12px;cursor:pointer;border:none;transition:filter .14s,transform .06s,box-shadow .14s;box-shadow:0 2px 8px rgba(30,40,70,.12)}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(30,40,70,.18)}
.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--accent-deep);background:var(--accent-soft);border:none;box-shadow:none}
.btn.ghost:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.dt{border-collapse:separate;border-spacing:0;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:10px 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:#F7F8FA}
.note .nt{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#F1D4CD}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:transparent}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#CBEBDC}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:transparent}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.figure{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;overflow-x:auto}
.figure svg{max-width:100%;height:auto;display:block;margin:0 auto}
.figcap{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.task{background:#F7F8FA;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#F7F8FA;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:12px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:8px}
.drill .da{display:none;font-size:13.5px;color:#166a4a;background:var(--good-soft);border:1px solid #CBEBDC;border-radius:10px;padding:9px 12px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:20px;padding:6px 13px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.qz{border-top:1px solid var(--line);padding:12px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:8px;border-radius:10px;padding:8px 12px}
.qz .qzfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.qz .qzfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.qz.correct,.qz.incorrect{padding-left:13px;padding-right:13px}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:none;border-radius:12px;padding:12px 16px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:13px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:9px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:7px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:10px;align-items:center;padding:10px 13px;border:1.6px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label:active{transform:translateY(1px)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.mcq .opts label.pick .ol{background:var(--accent);color:#fff}
.mcq.correct{background:var(--good-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--good)}
.mcq.incorrect{background:var(--wrong-soft);border-radius:12px;box-shadow:inset 3px 0 0 var(--wrong)}
.mcq.correct,.mcq.incorrect{padding-left:13px;padding-right:13px}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:9px;border-radius:10px;padding:9px 12px}
.mcq .mfb.ok{background:#fff;color:#166a4a;border:1px solid #CBEBDC}
.mcq .mfb.no{background:#fff;color:#a8382f;border:1px solid #F1D4CD}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:4px 10px;border-radius:20px}
.rc .ut{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em;font-size:1.1rem;color:var(--ink);margin:10px 0 14px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.rlink{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:13.5px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.rlink:hover{background:#F4F5F7}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}

h2 svg{width:18px;height:18px;color:var(--accent);flex:none}

/* Gri writing AI */
.griwz{margin:16px 0 4px}
.griask{background:linear-gradient(120deg,var(--accent),var(--accent-deep))}
.griq{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-left:10px}
.grifb{display:none;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#F7F8FA;font-family:Inter,sans-serif;font-size:14px;line-height:1.55}
.grifb.on{display:block}
.grifb.err{background:var(--wrong-soft);border-color:#F1D4CD;color:#8a382f}
.grifb .gscore{font-weight:800;font-size:1.1rem;color:var(--accent-deep);margin-bottom:10px}
.grifb .gcrit{border-top:1px solid var(--line);padding:9px 0}
.grifb .gcrit b{color:var(--accent-deep)}
.grifb .gsec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.grifb .gmis{font-size:13.5px;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.grifb .gmis .o{color:var(--wrong);text-decoration:line-through}
.grifb .gmis .c{color:#166a4a;font-weight:700}

<script id="data" type="application/json">{"title": "IB English B", "badge": "IB", "groups": ["Öğren", "Metin Türleri", "Writing", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "Paper 1 ve Kriterler", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "IB English B Paper 1'de üç görevden birini seçip belirli bir metin türünde (text type) yazarsın. Metin türünü doğru seçmek ve o türün kurallarına uymak, dilbilgisi kadar önemlidir."}, {"t": "table", "head": ["Kriter", "Ne ölçer", "Neye dikkat"], "rows": [["A. Language", "Dil: kelime çeşitliliği, dilbilgisi doğruluğu, akıcılık", "Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Kelime tekrarından kaçın."], ["B. Message", "Mesaj: göreve uygunluk, fikir gelişimi, ilgililik", "Prompt'un istediğini tam karşıla. Fikirleri örnekle geliştir, yüzeysel bırakma."], ["C. Conceptual understanding", "Kavramsal: metin türü, amaç, kitle, register, ton", "Seçtiğin türün kurallarına uy. Kitlene ve amaca uygun ton ve biçim kullan."]]}, {"t": "note", "k": "dikkat", "title": "En sık kaybedilen puan", "lines": ["Criterion C. Öğrenci makale yazacakken deneme yazar, blog yazacakken resmi rapor tonu kullanır. Tür yanlışsa mesaj iyi olsa bile C düşer.", "Her türün açılışı, düzeni ve register'ı farklıdır. Önce türü tanı, sonra yaz."]}]}, {"id": "karsilastirma", "group": "Metin Türleri", "name": "Karşılaştırma Tablosu", "eyebrow": "Metin Türleri", "blocks": [{"t": "p", "x": "En sık çıkan metin türlerinin hızlı karşılaştırması. Ayrıntılar alt derslerde."}, {"t": "table", "head": ["Tür", "Amaç", "Kitle", "Register"], "rows": [["Makale (Article)", "Bilgilendir ve ilgi çek", "Genel dergi/gazete okuru", "Yarı resmi"], ["Blog / Günlük", "Kişisel düşünce ve deneyim paylaş", "Online okur veya kişinin kendisi", "Kişisel, samimi"], ["Konuşma (Speech)", "İkna et veya bilgilendir", "Canlı dinleyici kitlesi", "Hitabet, doğrudan seslenme"], ["Broşür (Brochure)", "Tanıt ve harekete geçir", "Potansiyel müşteri/halk", "İkna edici, kısa"], ["Görüş yazısı (Opinion column)", "Bir görüşü savun", "Gazete okuru", "İkna edici, kişisel görüş"], ["Resmi mektup/e-posta", "Talep, şikayet, başvuru", "Belirli bir muhatap", "Resmi"], ["İnceleme (Review)", "Değerlendir ve öner", "Karar vermeye çalışan okur", "Yarı resmi, öznel"], ["Yönerge (Instructions)", "Nasıl yapılacağını öğret", "Kullanıcı", "Nötr, net, emir kipi"]]}, {"t": "note", "k": "ipucu", "title": "Seçim kuralı", "lines": ["Prompt kitleyi ve amacı söyler. School magazine diyorsa makale, your friend diyorsa e-posta/blog, at an assembly diyorsa konuşma. Kitle + amaç türü belirler."]}]}, {"id": "t-article", "group": "Metin Türleri", "name": "Makale (Article)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konu hakkında bilgilendirmek ve okuru ilgilendirmek."], ["Kitle", "Bir dergi veya gazetenin genel okuru."], ["Register / Ton", "Yarı resmi. Ne akademik ne günlük konuşma."], ["Yapı", "Çekici başlık, ilgi çeken giriş, alt başlıklarla bölümlenmiş gövde, toparlayan kapanış."], ["Tipik özellikler", "Çekici başlık, doğrudan okura soru, örnekler, bazen yazarın adı (byline)."]]}, {"t": "given", "title": "Açılış örneği", "x": "Are We Losing the Art of Conversation?\n\nWalk into any cafe today and you will see the same scene: a table of friends, each staring at a screen. But is technology really to blame?"}]}, {"id": "t-blog", "group": "Metin Türleri", "name": "Blog / Günlük", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kişisel bir deneyimi veya düşünceyi paylaşmak, yansıtmak."], ["Kitle", "Blogu takip eden online okurlar, veya günlükte kişinin kendisi."], ["Register / Ton", "Kişisel ve samimi. Birinci tekil şahıs."], ["Yapı", "Tarih (günlükte), samimi giriş, kişisel anlatı, okura doğrudan seslenme, kapanış düşüncesi."], ["Tipik özellikler", "Birinci şahıs, sorular, duygu ifadeleri, gündelik ama düzgün dil, okura hitap."]]}, {"t": "given", "title": "Açılış örneği", "x": "March 3rd\n\nI still cannot quite believe what happened today. When I woke up this morning, I had no idea that a single phone call would change my entire year."}]}, {"id": "t-speech", "group": "Metin Türleri", "name": "Konuşma (Speech)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Canlı bir kitleyi ikna etmek veya bilgilendirmek."], ["Kitle", "Bir toplantı, tören veya etkinlikteki dinleyiciler."], ["Register / Ton", "Hitabet dili. Doğrudan seslenme, güçlü ve ritmik."], ["Yapı", "Selamlama, dikkat çeken açılış, işaret cümleleriyle bölümler, güçlü kapanış çağrısı."], ["Tipik özellikler", "Ladies and gentlemen, retorik sorular, tekrar (anaphora), üçlemeler, doğrudan you."]]}, {"t": "given", "title": "Açılış örneği", "x": "Good morning, everyone. Let me begin with a simple question: when was the last time you did something for the first time? Today, I want to talk about why that matters."}]}, {"id": "t-brochure", "group": "Metin Türleri", "name": "Broşür (Brochure)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir ürünü, yeri veya etkinliği tanıtmak ve harekete geçirmek."], ["Kitle", "Potansiyel müşteriler veya ilgilenen halk."], ["Register / Ton", "İkna edici, enerjik, kısa."], ["Yapı", "Büyük başlık, kısa bölüm başlıkları, madde işaretleri, emir kipi, iletişim bilgisi."], ["Tipik özellikler", "Başlıklar, madde imleri, emir kipi (Join us, Discover), abartısız övgü, çağrı."]]}, {"t": "given", "title": "Açılış örneği", "x": "DISCOVER THE GREEN VALLEY TRAIL\n\nEscape the city. Breathe the mountain air. Reconnect with nature, just two hours from home."}]}, {"id": "t-opinion", "group": "Metin Türleri", "name": "Görüş Yazısı (Opinion Column)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir görüşü gerekçeli biçimde savunmak."], ["Kitle", "Bir gazete veya derginin okurları."], ["Register / Ton", "İkna edici, kişisel görüş, yer yer duygusal."], ["Yapı", "Net bir tez, gerekçelerle gelişen paragraflar, karşı görüşe kısa değinme, güçlü kapanış."], ["Tipik özellikler", "Birinci şahıs görüş, retorik sorular, örnekler, ikna edici dil."]]}, {"t": "given", "title": "Açılış örneği", "x": "It is time we admitted an uncomfortable truth: our obsession with exam results is failing the very students it claims to help."}]}, {"id": "t-letter", "group": "Metin Türleri", "name": "Resmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Talep etmek, şikayet etmek, başvurmak veya resmi bilgi vermek."], ["Kitle", "Belirli bir kişi veya kurum (müdür, yetkili, şirket)."], ["Register / Ton", "Resmi. Kısaltma yok, nazik ve net."], ["Yapı", "Selamlama (Dear ...), amacı belirten açılış, gövde paragrafları, resmi kapanış (Yours sincerely)."], ["Tipik özellikler", "Resmi hitap, net amaç cümlesi, nazik ton, imza formülü."]]}, {"t": "given", "title": "Açılış örneği", "x": "Dear Mr Thompson,\n\nI am writing to express my concern about the recent changes to the school bus timetable, which have affected many students in my neighbourhood."}]}, {"id": "t-informal", "group": "Metin Türleri", "name": "Gayriresmi Mektup / E-posta", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir arkadaşa veya aile üyesine haber vermek, davet etmek, teşekkür etmek."], ["Kitle", "Yakın bir arkadaş veya aile üyesi."], ["Register / Ton", "Samimi, sıcak, kişisel. Kasılmalar (I'm, don't) serbest."], ["Yapı", "Hi/Dear + isim, hâl hatır sorma, gövde (asıl haber), sıcak kapanış (Love/Take care) + isim."], ["Tipik özellikler", "Kasılmalar, sorular, ünlemler, günlük ifadeler, doğrudan you, kişisel ayrıntılar."]]}, {"t": "given", "title": "Açılış örneği", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share with you, and honestly I've been grinning about it all week."}, {"t": "wizard", "wt": "informal_letter", "ptitle": "Görev", "prompt": "Yurt dışında bir yaz kampına katıldın. Yakın bir arkadaşına, kamptaki deneyimini anlatan ve onu gelecek yıl katılmaya teşvik eden gayriresmi bir e-posta yaz.", "target": 250, "check": ["Samimi bir selamlama (Hi + isim) ve sıcak bir kapanış (Love/Take care + isim) kullandım.", "Kasılmalar, sorular ve günlük ifadelerle samimi bir ton tutturdum (Criterion C).", "Prompt'un istediğini karşıladım: deneyimi anlattım ve arkadaşımı teşvik ettim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (gayriresmi e-posta)", "x": "Hi Deniz,\n\nIt feels like ages since we last spoke! I've got some news I just had to share: I spent three weeks at a summer camp in Wales, and it honestly changed how I see myself.\n\nThe first days were terrifying. I knew nobody, my English felt clumsy, and I nearly called home twice. But by the end of the first week, I was hiking with people from six different countries and laughing at jokes I couldn't have understood a month earlier. We cooked together, got hopelessly lost on a mountain, and stayed up far too late talking about everything.\n\nWhat surprised me most was how quickly I stopped being shy. When you have to speak English to ask for breakfast, you just do it.\n\nYou would absolutely love it, and they open applications in January. Promise me you'll think about it? I really want us to go together next year.\n\nMiss you loads,\nEcem"}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Register'ı görünür yap: kasılmalar, bir-iki soru ve doğrudan you. Değerlendirici Criterion C'yi buradan okur.", "Resmi mektup kalıplarına (I am writing to inform you) kaçma; bu tür samimidir."]}]}, {"id": "t-diary", "group": "Metin Türleri", "name": "Günlük (Diary)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Günün olaylarını ve kişisel duyguları özel olarak kaydetmek, yansıtmak."], ["Kitle", "Yalnızca yazan kişi (özel, mahrem)."], ["Register / Ton", "Çok kişisel, samimi ve düşünsel. Birinci tekil şahıs."], ["Yapı", "Tarih, günün olayı (geçmiş zaman anlatı), o an hissedilenler, geleceğe dair umut veya kaygı."], ["Tipik özellikler", "Tarih, birinci şahıs, geçmiş anlatı + şimdiki duygular, iç ses, samimi ve dağınık düşünceler."]]}, {"t": "given", "title": "Açılış örneği", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't quite know how I feel about it."}, {"t": "wizard", "wt": "diary", "ptitle": "Görev", "prompt": "Hayatında önemli bir kararın verildiği veya beklenmedik bir şeyin olduğu bir günü düşün. O günkü olayları ve o an hissettiklerini yansıtan bir günlük girişi yaz.", "target": 250, "check": ["Tarihle başladım ve birinci tekil şahıs kişisel bir ses kullandım.", "Sadece olayları değil, o an hissettiklerimi ve iç düşüncelerimi yansıttım (Criterion C).", "Prompt'un istediği günü ve kararı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (günlük)", "x": "Tuesday, 14 May\n\nI can hardly hold the pen still. Today everything changed, and I still don't know whether to laugh or cry.\n\nIt started like any other Tuesday. I was half asleep in maths when the office called me down. My first thought was that I was in trouble. Instead, they told me my short story had won the national competition, the one I entered months ago and had completely forgotten about.\n\nI think I just stood there. Someone shook my hand. Later, on the bus home, it finally hit me and I had to hide my face so nobody would see me grinning like a fool.\n\nWhat scares me is what comes next. There's a ceremony, a reading, an actual audience. The old me would have said no immediately. But tonight, for the first time, a small voice inside me is saying: maybe you can do this.\n\nI hope I still feel that brave in the morning."}}, {"t": "note", "k": "ipucu", "title": "Blogdan farkı", "lines": ["Günlük özeldir, kendine yazarsın; blog bir okur kitlesine yazılır. Günlükte 'you' ile okura seslenmezsin.", "İç dünyayı, çelişkili duyguları göster. Sadece olay anlatımı değil, yansıtma (reflection) beklenir."]}]}, {"id": "t-interview", "group": "Metin Türleri", "name": "Röportaj (Interview)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kişiden bilgi veya görüş almak ve okura aktarmak."], ["Kitle", "Bir dergi, gazete veya sitenin okuru."], ["Register / Ton", "Yarı resmi. Sorular net; cevaplar doğal, konuşma dilinde."], ["Yapı", "Kişiyi tanıtan kısa giriş paragrafı, ardından soru-cevap dizisi, kısa kapanış."], ["Tipik özellikler", "Röportajcı ve konuşan belirtilir, doğrudan konuşma, konu odaklı sorular, kişisel cevaplar."]]}, {"t": "given", "title": "Açılış örneği", "x": "We sat down with Dr. Elif Kaya, a marine biologist, to talk about the plastic quietly filling our oceans.\n\nInterviewer: What first drew you to the sea?\nDr. Kaya: Honestly, a childhood holiday. I found a turtle tangled in a net, and I never forgot it."}, {"t": "wizard", "wt": "interview", "ptitle": "Görev", "prompt": "Okulunun dergisi için ilham veren biriyle (bir öğretmen, sporcu, gönüllü veya mezun) röportaj yap. Kısa bir tanıtım paragrafı, ardından soru-cevap biçiminde yaz.", "target": 250, "check": ["Kişiyi tanıtan kısa bir giriş yazdım, sonra soru-cevap biçimini kullandım.", "Sorular net; cevaplar doğal ve konuşma dilinde (Criterion C).", "Konuya odaklı, prompt'un istediği kişiyi ve amacı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (röportaj)", "x": "Every school has a quiet hero. Ours is Mr. Demir, the caretaker who has run our recycling scheme for twelve years. We asked him why he bothers.\n\nInterviewer: Most people walk past the bins without a thought. Why do you care so much?\nMr. Demir: Because someone has to. When I started, we threw everything away. It broke my heart. Now the students actually sort their rubbish. That is a small revolution.\n\nInterviewer: Has it been hard to change habits?\nMr. Demir: Very. For two years, nobody listened. I just kept going, one bin at a time. Change is slow, but it is real.\n\nInterviewer: What would you say to a student reading this?\nMr. Demir: Do not wait to be important before you do something useful. Start today, where you are, with what you have.\n\nAs he picked up his gloves and walked off, we understood exactly what he meant."}}, {"t": "note", "k": "ipucu", "title": "Biçim", "lines": ["Konuşan kişilerin isimlerini her replikte belirt (Interviewer: / Mr. Demir:). Bu Criterion C'yi güçlendirir.", "Cevapları konuşma dilinde tut; röportaj bir denemenin resmi diline kaçmamalı."]}]}, {"id": "t-news", "group": "Metin Türleri", "name": "Haber (News Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel, doğru ve tarafsız biçimde haber vermek."], ["Kitle", "Bir gazete veya haber sitesinin okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Başlık (headline), ilk cümlede 5N1K, önemliden az önemliye (ters piramit), alıntılar."], ["Tipik özellikler", "Başlık, byline, geçmiş zaman, alıntılar (said/added), nesnel dil, isim-tarih-yer."]]}, {"t": "given", "title": "Açılış örneği", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised over 5,000 lira for an animal shelter last Saturday, organisers confirmed on Monday."}, {"t": "wizard", "wt": "news_report", "ptitle": "Görev", "prompt": "Okulunda gerçekleşen bir etkinliği (bir yarışma, gösteri, bağış kampanyası veya beklenmedik bir olay) haber yap. Bir başlık ve ters piramit yapısında nesnel bir haber yaz; en az bir alıntı ekle.", "target": 250, "check": ["Bir başlık yazdım ve ilk cümlede kim/ne/ne zaman/nerede bilgisini verdim.", "Nesnel, tarafsız, üçüncü şahıs bir dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı prompt'a uygun işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (haber)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised more than 5,000 lira for a local animal shelter last Saturday, organisers confirmed on Monday. The total is the highest the school has ever collected in a single day.\n\nThe money was raised through a charity fair held in the main hall, where students sold baked goods, ran games and organised a small concert. More than three hundred visitors attended during the afternoon.\n\n'We expected maybe half this amount,' said Ayse Yildiz, the student who led the campaign. 'People were incredibly generous.'\n\nThe shelter, which currently cares for over forty animals, said the donation would be used to buy food and medical supplies for the winter. Its director thanked the students and described the support as a real lifeline.\n\nOrganisers said they hoped to make the fair an annual event."}}, {"t": "note", "k": "ipucu", "title": "Nesnellik", "lines": ["Kendi görüşünü katma; haber tarafsızdır. Görüşler yalnızca alıntılarda yer alır.", "En önemli bilgiyi başa koy (ters piramit). Okur ilk cümlede olayı anlamalı."]}]}, {"id": "t-review", "group": "Metin Türleri", "name": "İnceleme (Review)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran veya etkinliği değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan (izleyecek/okuyacak mı diye) okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (sürprizsiz), güçlü ve zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, birinci şahıs görüş, dengeli değerlendirme."]]}, {"t": "given", "title": "Açılış örneği", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Almost."}, {"t": "wizard", "wt": "review", "ptitle": "Görev", "prompt": "Yakın zamanda izlediğin bir film veya okuduğun bir kitabı incele. Kısa bir özet (sürprizleri açık etmeden), güçlü ve zayıf yönler ve net bir öneri içeren bir inceleme yaz.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Değerlendirici, çeşitli kelimeler kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (inceleme)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Set in a crumbling seaside town, it follows a young lighthouse keeper who discovers a mysterious light at sea. The premise is simple, but the film wraps it in some of the most beautiful images I have seen this year.\n\nVisually, it is stunning. Every frame looks like a painting, and the sound design makes you feel the cold wind and crashing waves.\n\nThe problem is the story. Halfway through, the plot slows to a crawl, and the characters stop making believable choices. By the end, I admired the film without ever really caring about anyone in it.\n\nSo is it worth watching? If you love atmosphere and can forgive a thin plot, yes. If you need a story that grips you, you may leave a little cold. I would give it three stars out of five: gorgeous, but hollow."}}, {"t": "note", "k": "ipucu", "title": "Denge", "lines": ["Sadece övme veya sadece yerme; güçlü ve zayıf yönleri birlikte ver. Dengeli görüş üst puan getirir.", "Kararsız kalma; sonunda net bir öneri (izle/izleme, kime uygun) ver."]}]}, {"id": "t-report", "group": "Metin Türleri", "name": "Resmi Rapor (Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (müdür, yönetim, kurul)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Başlık, To/From/Date, giriş (amaç), başlıklı bulgular, öneriler, kısa kapanış."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (It is recommended that)."]]}, {"t": "given", "title": "Açılış örneği", "x": "Report on the School Cafeteria\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine student concerns about the cafeteria and to suggest practical improvements."}, {"t": "wizard", "wt": "report", "ptitle": "Görev", "prompt": "Okul yönetimi için bir sorunu (kütüphane saatleri, kantin, ulaşım veya kulüpler) araştıran ve çözüm öneren resmi bir rapor yaz. Başlık, To/From/Date, bulgular ve öneriler bölümlerini kullan.", "target": 280, "check": ["Başlık ve To/From/Date bilgisiyle resmi rapor biçimini kullandım.", "Başlıklı bölümler (giriş, bulgular, öneriler) ve nesnel bir dil kullandım (Criterion C).", "Bulguları verdim ve prompt'un istediği çözüm önerilerini sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (rapor)", "x": "Report on the School Library\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine students' concerns about the school library and to recommend improvements to its opening hours and study space.\n\nFindings\nA survey of 150 students revealed two main problems. First, the library closes at 3 p.m., which prevents students who stay for clubs from using it. Second, during exam periods, there are not enough quiet seats, and many students are turned away.\n\nSeveral students also noted that the study area is often disturbed by group work taking place in the same room.\n\nRecommendations\nIt is recommended that the library remain open until 5 p.m. on weekdays. It is also recommended that a separate silent zone be created for individual study, especially before examinations.\n\nConclusion\nThese changes would be low in cost but would greatly improve students' ability to study effectively at school."}}, {"t": "note", "k": "ipucu", "title": "Resmilik", "lines": ["Kişisel ton yok; nesnel ve veri odaklı yaz. It is recommended that... kalıbı Criterion C'yi güçlendirir.", "Bölüm başlıkları kullan (Introduction, Findings, Recommendations). Yapı görünür olmalı."]}]}, {"id": "t-proposal", "group": "Metin Türleri", "name": "Öneri / Teklif (Proposal, HL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri veya planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (yönetim, kurul, sponsor)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi."], ["Yapı", "Başlık, giriş (önerinin özeti), gerekçe ve faydalar, uygulama planı, maliyet, kapanış çağrısı."], ["Tipik özellikler", "Bölüm başlıkları, gelecek zaman, fayda vurgusu, gerçekçi plan, ölçülü ikna dili. (Sadece HL)"]]}, {"t": "given", "title": "Açılış örneği", "x": "Proposal: A Peer Tutoring Programme\n\nThis proposal outlines a student-led tutoring scheme designed to support learners who are struggling in core subjects, at no cost to the school."}, {"t": "wizard", "wt": "proposal", "ptitle": "Görev", "prompt": "Okulunda yeni bir kulüp, etkinlik veya sistem için yönetimden onay isteyen bir öneri (proposal) yaz. Fikri, faydalarını ve gerçekçi bir uygulama planını açıkla. (HL)", "target": 300, "check": ["Başlık ve girişte öneriyi net özetledim.", "Gerekçe/faydaları ve gerçekçi bir uygulama planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille prompt'un istediğini karşıladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (öneri)", "x": "Proposal: A Peer Tutoring Programme\n\nIntroduction\nThis proposal recommends setting up a peer tutoring programme in which older students help younger ones who are struggling in core subjects. The scheme would run twice a week after school and would cost the school almost nothing.\n\nBenefits\nThe programme would help weaker students improve their grades in a relaxed, less intimidating setting. Just as importantly, the tutors themselves would deepen their own understanding and develop leadership skills valued by universities. Over time, it could also build a stronger sense of community across year groups.\n\nImplementation\nEach term, volunteer tutors would be matched with younger students by subject teachers. Sessions would take place in the library from 3 to 4 p.m. on Tuesdays and Thursdays. A teacher would supervise, but the sessions would be led by students.\n\nCosts\nThe only real cost is supervision, which existing staff could share on a rota. No new materials or funding would be required.\n\nConclusion\nFor almost no cost, this programme could raise achievement and bring students together. I respectfully ask the school to trial it for one term."}}, {"t": "note", "k": "ipucu", "title": "Rapordan farkı", "lines": ["Rapor mevcut durumu inceler; öneri (proposal) gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-instructions", "group": "Metin Türleri", "name": "Yönerge (Set of Instructions)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net, doğrudan. Emir kipi (imperative)."], ["Yapı", "Başlık, gerekli malzemeler/ön koşullar, numaralı adımlar, ipuçları veya uyarılar."], ["Tipik özellikler", "Emir kipi (Take, Add, Do not), numaralı adımlar, sıra bağlaçları (First, Next, Finally), kısa net cümleler."]]}, {"t": "given", "title": "Açılış örneği", "x": "How to Start a Small Balcony Garden\n\nYou will need: two or three pots, potting soil, seeds, a small trowel and water.\n\n1. Choose a spot on your balcony that gets at least four hours of sunlight a day."}, {"t": "wizard", "wt": "instructions", "ptitle": "Görev", "prompt": "Bir beceriyi (basit bir yemek, bir uygulamayı kurmak veya bir el işi) yeni başlayan birine öğreten bir yönerge yaz. Bir malzeme/ön koşul listesi ve numaralı adımlar kullan.", "target": 220, "check": ["Başlık ve gerekli malzemeler/ön koşullar listesi ekledim.", "Numaralı adımlar, emir kipi ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz; prompt'un istediği beceriyi kapsıyor (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (yönerge)", "x": "How to Make a Simple Turkish Menemen\n\nYou will need: three eggs, two tomatoes, one green pepper, a little olive oil, salt and a slice of bread to serve.\n\n1. First, wash the tomatoes and pepper. Chop the pepper into small pieces and grate or finely dice the tomatoes.\n\n2. Heat a little olive oil in a pan over medium heat. Add the pepper and cook for two to three minutes until it softens.\n\n3. Next, add the tomatoes and a pinch of salt. Let the mixture simmer for about five minutes, stirring now and then, until most of the liquid has gone.\n\n4. Crack the eggs directly into the pan. Do not stir straight away; wait a few seconds, then gently fold them into the tomato mixture.\n\n5. Cook for another minute or two, until the eggs are just set but still soft.\n\n6. Finally, serve hot with fresh bread. Tip: do not overcook the eggs, or the dish will become dry."}}, {"t": "note", "k": "ipucu", "title": "Netlik", "lines": ["Her adım tek bir eylem olsun ve emir kipiyle başlasın (Chop, Add, Serve).", "Sıra bağlaçları (First, Next, Finally) ve bir malzeme listesi Criterion C'yi güçlendirir."]}]}, {"id": "t-essay", "group": "Metin Türleri", "name": "Deneme (Essay, SL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Giriş (konu + tez), her biri bir fikri işleyen gövde paragrafları (gerekçe + örnek), sonuç."], ["Tipik özellikler", "Net tez, bağlaçlar (however, therefore, for example), gerekçeli argüman, dengeli değerlendirme, sonuç. (Genelde SL)"]]}, {"t": "given", "title": "Açılış örneği", "x": "Should Social Media Be Part of School Life?\n\nSocial media is often blamed for distracting students, yet it also offers real opportunities for learning. This essay argues that, used carefully, it belongs in the classroom."}, {"t": "wizard", "wt": "essay", "ptitle": "Görev", "prompt": "Şu soruya bir deneme (essay) yaz: 'Should students be required to do community service?' Net bir tez, gerekçeli gövde paragrafları ve dengeli bir sonuç kullan.", "target": 280, "check": ["Girişte konuyu tanıttım ve net bir tez cümlesi yazdım.", "Her gövde paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve sonunda görüşümü toparladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (deneme)", "x": "Should Students Be Required to Do Community Service?\n\nMany schools now ask students to spend a set number of hours helping their community. Some see this as an unfair burden, but I believe that required community service, if handled sensibly, does far more good than harm.\n\nThe strongest argument in its favour is what students learn. Helping at a shelter or tutoring a younger child teaches responsibility and empathy in a way no textbook can. A friend of mine who volunteered at a care home says it completely changed how she sees older people.\n\nCritics argue that forcing people to help removes the kindness from the act. There is some truth in this. However, many students would never volunteer on their own, and once they start, they often continue by choice. The requirement simply opens a door.\n\nOf course, the hours must be reasonable, so that service does not harm students' studies or become a box-ticking exercise.\n\nIn conclusion, while it should be applied with care, required community service benefits both students and society, and I believe schools are right to include it."}}, {"t": "note", "k": "ipucu", "title": "Argüman", "lines": ["Girişte net bir tez ver; sonuç bu tezi toparlasın. Değerlendirici Criterion B'yi buradan okur.", "Karşı görüşe de değin (however...), sonra kendi görüşünle dengele. Bu olgunluk gösterir."]}]}, {"id": "paper1", "group": "Writing", "name": "Paper 1 Yazma", "eyebrow": "Paper 1 . Yaz", "blocks": [{"t": "p", "x": "Bir görev seç, metin türünü belirle, o türün kurallarına göre yaz. Yazdıktan sonra kontrol listesini işaretle, sonra modeli aç."}, {"t": "task", "title": "Örnek görev", "lines": ["Your school is encouraging students to learn a second language. Write a text for the school blog in which you share your own experience and encourage other students to start.", "Metin türü: blog. Kitle: okul öğrencileri. Amaç: deneyim paylaşmak ve teşvik etmek."]}, {"t": "given", "title": "Blog hatırlatması", "x": "Tarih veya samimi başlık. Birinci tekil şahıs. Kişisel anlatı ve duygu. Okura doğrudan seslenme (you). Teşvik eden bir kapanış."}, {"t": "wizard", "wt": "blog", "prompt": null, "target": 220, "check": ["Doğru metin türünü seçtim ve o türün açılış, düzen ve register kurallarına uydum.", "Prompt'un istediği amacı ve kitleyi karşıladım (Criterion B).", "Fikirlerimi örnekle geliştirdim, yüzeysel bırakmadım.", "Kelime çeşitliliği kullandım, aynı kelimeyi tekrarlamadım (Criterion A).", "Ton ve register kitleme uygun (Criterion C).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (blog)", "x": "Why Learning Spanish Changed My Year\n\nThis time last year, I could barely say hello in another language. Today, I can hold a real conversation in Spanish, and I want to tell you how it happened, because if I can do it, so can you.\n\nHonestly, I only started because a friend dragged me along to a club. At first it was frustrating. I mixed up words, I froze in the middle of sentences, and I nearly gave up more than once. But something changed when I stopped worrying about being perfect. I began watching Spanish shows, labelling things in my room, and chatting with an exchange student at lunch. Little by little, the language stopped feeling like a subject and started feeling like a door.\n\nWhat surprised me most was not the grammar. It was the confidence. Speaking a second language taught me that I can be bad at something and still keep going, and that lesson has helped me far beyond the classroom.\n\nSo here is my honest advice: do not wait until you feel ready. Pick a language, make a few mistakes today, and enjoy them. Your future self will thank you."}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Metin türünün biçimini görünür yap. Blogda başlık ve doğrudan seslenme, konuşmada retorik soru, mektupta resmi hitap. Değerlendirici Criterion C'yi buradan okur.", "Fikri örnekle geliştir. Genel cümle değil, kişisel somut örnek."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "note", "k": "dikkat", "title": "Metin türü", "lines": ["Önce kitle ve amacı bul, tür ondan çıkar. Yanlış tür Criterion C'yi düşürür.", "Türün biçimsel işaretlerini koy: blogda başlık ve you, konuşmada selamlama ve retorik soru, mektupta Dear ve Yours sincerely."]}, {"t": "note", "k": "ipucu", "title": "Dil (Criterion A)", "lines": ["Basit ama doğru cümle, karmaşık ama hatalı cümleden iyidir.", "Aynı kelimeyi tekrarlama. good yerine valuable, effective, worthwhile."]}, {"t": "note", "k": "ipucu", "title": "Mesaj (Criterion B)", "lines": ["Prompt iki şey istiyorsa ikisini de yap (deneyim paylaş VE teşvik et).", "Her fikri bir örnekle destekle. Yüzeysel liste değil, gelişmiş fikir."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz"${b.wt?` data-wt="${esc(b.wt)}"`:''}>`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types, wt){
  // IB modulu: wizard'in data-wt'sine gore ib text_type sec (blog, article, review, report...)
  const av=types.filter(t=>String(t.exam||'').toLowerCase()==='ib'&&!t.is_coming_soon&&t.is_active!==false);
  let m=null;
  if(wt)m=av.find(t=>String(t.text_type||'').toLowerCase()===String(wt).toLowerCase());
  return m||av[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  if(q.n>=2){fb.className='grifb on err';fb.textContent='Bugünlük Gri değerlendirme hakkın doldu (2/2). Yarın tekrar dene.';return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types, wz.dataset.wt);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
