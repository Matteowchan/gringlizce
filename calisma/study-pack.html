ümle, kalıcı aydınlık ve karanlık yarıküre arasındaki sıcaklık farkının küresel iklimi ve sıvı suyu ortadan kaldırıp kaldırmayacağını — ya da atmosferik sirkülasyonun ısıyı yeniden dağıtıp dağıtamayacağını — aktif araştırma sorusu olarak sunuyor. Eklenecek cümle bu soruya bir yanıt veriyor: bilgisayar simülasyonları atmosferin ısı kontrastını azaltabileceğini, bazı gezegenlerin yaşanabilir olabileceğini öne sürüyor. 5. cümlenin soruyu sormasının ardından simülasyondan gelen kısmi yanıt gelmelidir.\n\nA — 2. cümle sonrası: Ay anlatılıyor; kırmızı cüce yıldızlar henüz gündemde değil.\nB — 3. cümle sonrası: kırmızı cüceler ve yaşanabilirlik genel olarak tanıtılıyor; simülasyon için çok erken.\nC — 4. cümle sonrası: gel-git kilidi ve yarıküre ikilemesi anlatılıyor; ama 5. cümle bu soruyu formüle ediyor ve simülasyonun ardından gelmesi lazım.\nD — 5. cümle sonrası: soru soruldu → simülasyonlar kısmi yanıt veriyor. Doğru."}, {"k": "place", "p": "[1] The field of behavioral genetics examines the degree to which individual differences in psychological traits, cognitive abilities, and psychiatric disorders are attributable to genetic versus environmental factors. [2] Twin studies — comparing identical twins who share nearly all of their DNA with fraternal twins who share approximately half — have been the primary methodological workhorse of behavioral genetics for decades, offering a natural experiment that allows researchers to partition the variance in a trait into genetic and environmental components. [3] These studies have consistently found substantial heritability estimates for a wide range of traits, from intelligence and personality dimensions to the risk for depression, schizophrenia, and autism spectrum disorder. [4] The identification of specific genetic variants associated with complex psychological traits through genome-wide association studies has proven more difficult than early optimism suggested, with thousands of variants each contributing tiny effects that collectively explain only a fraction of the heritability estimated from twin studies — a discrepancy known as the 'missing heritability' problem. [5] The 'missing heritability' may reflect the limitations of current GWAS methodologies, rare genetic variants not captured by standard arrays, gene-environment interactions, or the underestimated contribution of non-additive genetic effects.", "q": "The writer wants to add the following sentence: 'Despite their power, twin studies have been criticized on methodological grounds, including the assumption that identical and fraternal twins experience equally similar environments — an assumption that, if violated, would inflate heritability estimates.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle ikiz çalışmalarının sürekli olarak yüksek kalıtsallık tahminleri bulduğunu söylüyor. Eklenecek cümle 'despite their power' ile bu çalışmaların metodolojik eleştirilerini sunuyor — güçlerine rağmen sınırlılıkları var. 3. cümlenin güçlü bulgularının ardından hemen metodolojik eleştiri gelmesi retorik olarak en etkili konumdur.\n\nA — 2. cümle sonrası: ikiz çalışmaları tanıtıldı ama henüz bulgular gösterilmedi; 'despite their power' için zemin zayıf.\nB — 3. cümle sonrası: güçlü bulgular aktarıldı → 'despite their power, kritik edildi.' Doğru kontrast.\nC — 4. cümle sonrası: GWAS zorlukları anlatılıyor; ikiz çalışmaları eleştirisi bu noktada akışı kesiyor.\nD — 5. cümle sonrası: 'missing heritability' çözümleri anlatılıyor; metodoloji eleştirisi çok geç."}, {"k": "place", "p": "[1] The resurgence of tuberculosis (TB) as a global public health priority reflects a convergence of factors that have complicated the decades-long effort to eradicate what was once the world's leading infectious disease killer. [2] The emergence of multidrug-resistant TB (MDR-TB) and extensively drug-resistant TB (XDR-TB) strains — the result of incomplete treatment courses, inadequate drug supply chains, and the prolonged and poorly supervised treatment regimens that characterize healthcare delivery in many low-income settings — has rendered the standard first-line antibiotic regimen ineffective for a growing proportion of cases. [3] The interaction between TB and HIV co-infection has further complicated treatment, as HIV substantially compromises the immune response that normally suppresses TB bacteria in latent infection, making TB the leading cause of death among people living with HIV globally. [4] Diagnostic infrastructure remains a significant challenge: the definitive diagnosis of MDR-TB requires culture-based tests that take weeks to return results and require laboratory facilities unavailable in many high-burden settings. [5] Novel diagnostic tools, including the GeneXpert molecular testing platform, have been deployed in many settings and can provide drug-sensitivity results within hours, though their rollout has been uneven and their cost remains a barrier in the poorest countries.", "q": "The writer wants to add the following sentence: 'Treatment of MDR-TB requires newer, more toxic, and substantially more expensive drugs administered over eighteen to twenty-four months — a course that imposes severe burdens on healthcare systems and patients and yields far lower cure rates than standard TB treatment.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle ilaç dirençli TB suşlarının ortaya çıkışını ve standart birinci basamak antibiyotik rejiminin yetersiz kaldığını anlatıyor. Eklenecek cümle bu yetersizliğin pratik sonucunu sunuyor: MDR-TB tedavisi daha toksik, daha pahalı ve daha uzun sürüyor. 2. cümlenin direnç tespitinin hemen ardından tedavi yükü gelmelidir.\n\nA — 1. cümle sonrası: genel bağlam kurulmuş; MDR-TB tedavi detayları için çok erken.\nB — 2. cümle sonrası: MDR-TB ortaya çıkışı → tedavisinin daha zor ve pahalı olduğu bilgisi. Doğru.\nC — 3. cümle sonrası: HIV-TB etkileşimi anlatılıyor; MDR-TB tedavi yükü buraya bağlamsız.\nD — 4. cümle sonrası: tanı altyapısı anlatılıyor; tedavi yükü çok geç."}, {"k": "place", "p": "[1] The history of urban sanitation is inseparable from the history of urban mortality, as the introduction of clean water supply and sewage treatment systems in the nineteenth century produced reductions in infectious disease mortality that exceeded the contributions of any other public health intervention, including vaccination. [2] Before the construction of modern sewer systems, cities such as London, Paris, and New York were periodically devastated by epidemic cholera — a disease transmitted through fecal contamination of drinking water — as well as typhoid fever, dysentery, and other waterborne illnesses. [3] The 'Great Stink' of London in 1858, caused by the accumulation of raw sewage in the Thames during a hot summer, is credited with galvanizing political will to fund the construction of Joseph Bazalgette's underground sewer network, one of the most consequential feats of Victorian civil engineering. [4] The epidemiological case for sanitation investment remains as compelling in the twenty-first century as it was in the nineteenth: waterborne disease continues to kill hundreds of thousands of people annually in low-income countries that lack access to safely managed water and sanitation. [5] The estimated economic return on investment in basic water and sanitation infrastructure in low-income settings has been calculated at several dollars for every dollar invested, through reductions in healthcare costs, productivity losses, and educational disruption caused by waterborne illness.", "q": "The writer wants to add the following sentence: 'John Snow's 1854 mapping of cholera cases in London's Soho district, which demonstrated that the outbreak was centered on a single contaminated water pump, is regarded as a foundational moment in the development of epidemiology as a discipline.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle modern kanalizasyon öncesinde kolera ve diğer su kaynaklı hastalıkların şehirleri nasıl harap ettiğini anlatıyor. Eklenecek cümle 1854 Soho kolera salgınını — kirli su pompasına izlenen bir salgın — anlatıyor ve bunu epidemiyolojinin doğuşuyla ilişkilendiriyor. Bu, 2. cümlenin kolera bağlamında mükemmel bir tarihsel örnek ve kavramsal geliştirmedir.\n\nA — 1. cümle sonrası: genel kentsel sanitasyon-mortalite ilişkisi anlatılıyor; spesifik John Snow örneği için bağlam yok.\nB — 2. cümle sonrası: kolera salgınları anlatıldı → John Snow'un Soho kolera haritalama örneği. Doğru.\nC — 3. cümle sonrası: Great Stink anlatılıyor; John Snow örneği kronolojik olarak 1854'te (Great Stink'ten önce) gerçekleşti; ama bu her iki konumda da yanlış değil — ancak B çok daha doğal.\nD — 4. cümle sonrası: 21. yüzyıl anlatılıyor; John Snow örneği çok geç."}, {"k": "place", "p": "[1] The economics of pharmaceutical drug development presents a complex and contested set of incentive structures that shape which diseases receive research attention and how the resulting treatments are priced. [2] Developing a new drug from initial discovery through clinical trials and regulatory approval requires an estimated investment of two to three billion dollars and takes an average of ten to fifteen years, with high rates of failure at each stage. [3] The patent system is intended to provide a temporary monopoly to recoup development costs and fund further research; critics argue, however, that it enables pharmaceutical companies to price drugs far above what global health equity would justify, placing life-saving medications out of reach for patients in low- and middle-income countries. [4] The 'neglected tropical diseases' — a cluster of infectious diseases that affect hundreds of millions of people primarily in tropical regions — illustrate a fundamental market failure: because their victims are overwhelmingly poor, private pharmaceutical investment in treatments for these conditions is minimal relative to the burden of disease they impose. [5] Proposed solutions include greater public and philanthropic funding for neglected disease research, advance market commitments designed to de-risk development of vaccines and drugs for low-income markets, and reforms to intellectual property frameworks that would improve access to essential medicines.", "q": "The writer wants to add the following sentence: 'The AIDS crisis of the 1980s and 1990s demonstrated how activist pressure could succeed in forcing significant reductions in antiretroviral drug prices, setting a precedent for subsequent advocacy campaigns.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle patent sisteminin ilaç fiyatlarını küresel sağlık eşitliğinin çok üstüne çektiğini ve hayat kurtaran ilaçları erişilemez kıldığını eleştiriyor. Eklenecek cümle 'ancak aktivist baskısı fiyatları düşürebildi' ile bu sorunun tarihsel bir çözüm örneğini sunuyor. Bu, 3. cümlenin eleştirisini iyimser bir tarihsel örnekle dengelediği için doğrudan orada yer almalı.\n\nA — 2. cümle sonrası: geliştirme maliyetleri anlatılıyor; aktivist baskısı bu noktada bağlamsız.\nB — 3. cümle sonrası: fiyatlama eleştirisi yapıldı → tarihsel olarak aktivist baskısı fiyatları değiştirebildi. Doğru.\nC — 4. cümle sonrası: ihmal edilen tropik hastalıklar anlatılıyor; AIDS örneği bu bağlamda bağlamsız.\nD — 5. cümle sonrası: çözüm önerileri anlatılıyor; tarihsel örnek çok geç."}, {"k": "place", "p": "[1] The rapid development of large language models has prompted an intense and still unresolved debate about whether these systems exhibit, or merely simulate, forms of understanding, reasoning, and intentionality that have historically been regarded as distinctively human cognitive capacities. [2] Proponents of the view that current AI systems represent a genuine cognitive advance argue that the models' ability to perform impressively across domains as diverse as medical diagnosis, legal reasoning, mathematical proof, and creative writing cannot be dismissed as mere pattern matching without invoking an increasingly implausible distinction between 'real' and 'simulated' cognition. [3] Skeptics counter that the systems' impressive performance is the product of statistical regularities in training data and sophisticated interpolation, not of any genuine comprehension of the concepts whose surface features the model manipulates. [4] The debate maps onto longstanding philosophical disputes about the nature of mind, meaning, and understanding, including John Searle's 'Chinese Room' argument, which contends that syntactic manipulation of symbols — however sophisticated — cannot by itself produce semantic understanding. [5] Whether or how the question can be empirically settled is itself contested, as the absence of an agreed operational definition of 'understanding' makes it difficult to design a test whose results would be accepted as decisive by both sides.", "q": "The writer wants to add the following sentence: 'Critics of this view note, however, that dramatic performance improvements can result from scale and data alone, without necessitating any change in the underlying computational mechanism.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 1, "e": "B doğrudur. 2. cümle, yapay zekanın etkileyici performansının gerçek bir bilişsel ilerleme olduğunu savunanların argümanlarını sunuyor. Eklenecek cümle 'critics of this view note, however' ile bu görüşün eleştirisini yapıyor: performans artışı ölçek ve veriyle açıklanabilir, gerçek bilişsel değişim gerektirmiyor. Bu, 2. cümlenin argümanına karşı çok doğal ve hemen gelmesi gereken bir itiraz.\n\nA — 1. cümle sonrası: tartışma tanımlanıyor; henüz taraf sunulmadı; eleştiri için zemin yok.\nB — 2. cümle sonrası: 'gerçek bilişsel ilerleme' görüşü sunuldu → 'critics of this view' ile itiraz. Doğru.\nC — 3. cümle sonrası: şüpheciler zaten itiraz ediyor; ek eleştiri fazladan.\nD — 4. cümle sonrası: felsefi tartışma anlatılıyor; ölçek/veri eleştirisi bu noktada bağlamsız."}, {"k": "place", "p": "[1] The political philosophy of communitarianism, associated most prominently with thinkers such as Alasdair MacIntyre, Michael Sandel, and Charles Taylor, emerged in the 1980s as a critical response to the liberal individualism articulated by John Rawls and Robert Nozick. [2] Communitarians argue that the liberal conception of the 'unencumbered self' — a sovereign individual whose identity and preferences are formed prior to and independently of social relationships — is both philosophically incoherent and normatively impoverished, failing to capture the extent to which persons are constituted by the communities, traditions, and shared practices into which they are born and through which they develop their identities. [3] The normative implications of this critique are significant: if the self is fundamentally 'situated' — embedded in communities and traditions that give it its moral vocabulary and sense of obligation — then political philosophy cannot treat the individual as the sole unit of moral concern and must give greater weight to communal goods, practices, and institutions than liberal theory typically allows. [4] Liberal theorists have responded by arguing that communitarianism, in privileging community and tradition, risks providing philosophical cover for social conservatism and the suppression of dissent, individual rights, and minority identities that deviate from the community's dominant norms. [5] The debate has proven generative for both sides, enriching liberal political philosophy's treatment of community, tradition, and civic virtue while pushing communitarians to more carefully specify the conditions under which communal authority over individuals is legitimate.", "q": "The writer wants to add the following sentence: 'This critique has particular resonance in contemporary debates about the authority of religious communities, indigenous governance, and national cultural policies to impose obligations on individual members.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle komüniteryanizmin normatif içerimlerini açıklıyor: topluluk ve gelenekler bireyin ahlaki söz dağarcığını oluşturuyorsa, liberal teori yeniden düşünülmeli. Eklenecek cümle bu normatif içerimin günümüz tartışmalarındaki yankılarını — dini topluluklar, yerli yönetişim, ulusal kültür politikaları — sunuyor. 3. cümlenin normatif çıkarımının hemen ardından güncel uygulamalar vermek paragrafrın akışına mükemmel uyuyor.\n\nA — 2. cümle sonrası: 'encumbered self' eleştirisi anlatılıyor; normatif içerimler henüz açıklanmadı; güncel örnekler için zemin yok.\nB — 3. cümle sonrası: normatif içerimler açıklandı → güncel örnekler. Doğru.\nC — 4. cümle sonrası: liberal yanıt anlatılıyor; güncel örnekler bu noktada akışı kesiyor.\nD — 5. cümle sonrası: tartışmanın üretkenliği anlatılıyor; çok geç."}, {"k": "place", "p": "[1] Soil degradation — encompassing erosion, salinization, compaction, nutrient depletion, and loss of organic matter — threatens agricultural productivity across approximately one-third of the world's agricultural land, with profound implications for global food security in a century of growing population and climate disruption. [2] Industrial agriculture's reliance on synthetic fertilizers, monoculture cropping, and mechanized tillage has been identified as a primary driver of soil degradation, as these practices reduce the diversity and biomass of soil microbial communities, diminish organic matter, and leave soils vulnerable to erosion. [3] Regenerative agricultural practices — including cover cropping, crop rotation, reduced tillage, and the integration of livestock into crop systems — have demonstrated the capacity to rebuild soil organic matter, restore microbial diversity, and improve water retention over periods of five to fifteen years. [4] The transition to regenerative practices typically requires several years of reduced yields during the recovery period, creating a significant financial barrier for farmers operating on thin margins and under pressure from commodity markets that reward volume over sustainability. [5] Policy interventions, including direct payments to farmers for soil health improvements and reform of commodity support programs that currently incentivize high-input monoculture, have been proposed as mechanisms to accelerate the transition.", "q": "The writer wants to add the following sentence: 'Carbon sequestration in restored soils has also attracted interest as a potential tool for mitigating climate change, though the permanence and verifiability of soil carbon storage remain subjects of scientific debate.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle yenileyici tarım uygulamalarının toprak organik maddesini yeniden inşa edebildiğini, mikrobiyal çeşitliliği geri kazandırdığını ve su tutmayı iyileştirdiğini belgeliyor. Eklenecek cümle bu aynı sürecin — toprak onarımı — iklim değişikliğini hafifletme potansiyeli olan karbon depolamasını sağladığını, ancak bunun bilimsel tartışmalı olduğunu söylüyor. Bu, 3. cümlenin fayda listesinin doğal bir devamı ve genişletmesi.\n\nA — 2. cümle sonrası: endüstriyel tarımın zararları anlatılıyor; karbon depolama faydası burada bağlamsız.\nB — 3. cümle sonrası: yenileyici tarımın faydaları listelendi → karbon depolama bu faydalara eklenebilir. Doğru.\nC — 4. cümle sonrası: geçiş maliyeti anlatılıyor; karbon depolama bu bağlamda bağlamsız.\nD — 5. cümle sonrası: politika müdahaleleri anlatılıyor; çok geç."}, {"k": "place", "p": "[1] The epistemology of expert testimony in legal proceedings raises fundamental questions about how courts should evaluate and weight scientific evidence that is beyond the comprehension of typical jurors yet central to the determination of guilt, civil liability, or regulatory compliance. [2] The Daubert standard, established by the US Supreme Court in 1993, charges federal judges with acting as 'gatekeepers' of scientific evidence, tasked with evaluating whether proffered expert testimony rests on reliable methodology and whether that methodology has been properly applied to the facts of the case. [3] Critics of the Daubert framework argue that judges, who lack scientific training, are poorly positioned to evaluate the reliability of complex scientific methodologies, and that the standard has been applied inconsistently and in ways that sometimes exclude legitimate scientific evidence or admit junk science depending on the ideological and scientific literacy of the presiding judge. [4] The problem is compounded by the adversarial structure of legal proceedings, in which each side typically presents its own paid expert, creating an impression of scientific controversy even in areas where genuine scientific consensus exists. [5] Proposed reforms include the use of court-appointed neutral experts, the establishment of specialized science courts for cases with complex technical components, and the development of better scientific literacy training for judges.", "q": "The writer wants to add the following sentence: 'Climate change litigation has provided particularly sharp illustrations of this challenge, as courts have been required to evaluate highly technical climatological evidence in high-stakes cases involving oil companies, regulatory agencies, and sovereign governments.' Where should it be placed?", "o": ["A) After sentence 1", "B) After sentence 2", "C) After sentence 3", "D) After sentence 4"], "a": 2, "e": "C doğrudur. 3. cümle Daubert çerçevesinin hakimlerin bilimsel metodolojileri değerlendirme konusunda yetersiz kaldığını eleştiriyor. Eklenecek cümle bu eleştirinin somut bir örneğini sunuyor: iklim değişikliği davaları, mahkemelerin son derece teknik klimatolojik kanıtları değerlendirmek zorunda kaldığı özel bir örnek. 3. cümlenin genel eleştirisinin ardından spesifik örnek vermek doğaldır.\n\nA — 1. cümle sonrası: genel problem tanımlandı; spesifik örnek için çok erken.\nB — 2. cümle sonrası: Daubert standardı tanımlandı; iklim değişikliği örneği için henüz eleştiri yapılmadı.\nC — 3. cümle sonrası: hakimlerin yetersizliği eleştirisi yapıldı → iklim davası spesifik örnek olarak geliyor. Doğru.\nD — 4. cümle sonrası: rakip uzmanlık sorunu anlatılıyor; spesifik örnek bu noktada akışı kesiyor."}, {"k": "place", "p": "[1] Contemporary discourse around 'digital sovereignty' reflects growing anxiety among states about the concentration of critical digital infrastructure — including cloud computing, social media platforms, undersea fiber optic cables, and satellite internet — in the hands of a small number of predominantly American and Chinese technology corporations. [2] European policymakers have been at the forefront of efforts to assert regulatory sovereignty over digital markets, with the GDPR, the Digital Markets Act, and the AI Act collectively representing the most ambitious attempt by any jurisdiction to impose binding governance frameworks on global technology companies. [3] Smaller economies face particular challenges in asserting digital sovereignty, as their lack of domestic technology champions means that any assertive regulation risks deterring investment and restricting access to digital services that their populations and economies depend upon. [4] The geopolitical dimension of digital sovereignty has intensified with the recognition that data flows are not merely commercial but involve information about critical infrastructure, military assets, and populations that states have strong security interests in protecting. [5] The decoupling of the global internet into increasingly distinct national or regional networks — sometimes called the 'splinternet' — represents a potential long-term consequence of these sovereignty pressures that would fragment the global digital commons and complicate cross-border digital commerce.", "q": "The writer wants to add the following sentence: 'The forced divestiture demands directed at TikTok in the United States and the exclusion of Huawei from 5G infrastructure projects in several Western countries illustrate how security and sovereignty concerns are reshaping global technology competition.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 2, "e": "C doğrudur. 4. cümle dijital egemenliğin jeopolitik boyutunu — veri akışlarının güvenlik çıkarlarıyla ilgili olduğunu — vurguluyor. Eklenecek cümle bu jeopolitik boyutun somut örneklerini sunuyor: TikTok'un zorla satışı, Huawei'nin 5G'den dışlanması. 4. cümlenin jeopolitik güvenlik tespitinin ardından somut örnekler gelmesi doğaldır.\n\nA — 2. cümle sonrası: AB düzenlemeleri anlatılıyor; TikTok/Huawei örnekleri bu bağlamda erken.\nB — 3. cümle sonrası: küçük ekonomilerin zorluğu anlatılıyor; TikTok/Huawei örnekleri bu bağlamda bağlamsız.\nC — 4. cümle sonrası: güvenlik ve egemenlik jeopolitiği anlatıldı → TikTok ve Huawei bu jeopolitik gerginliğin somut örnekleri. Doğru.\nD — 5. cümle sonrası: splinternet anlatılıyor; spesifik örnekler çok geç."}, {"k": "place", "p": "[1] The remarkable expansion of trade between China and Africa over the first two decades of the twenty-first century — with bilateral trade growing from approximately ten billion dollars in 2000 to over two hundred billion dollars by 2020 — has generated a rich and deeply contested debate about its developmental implications for African economies. [2] Proponents of Chinese engagement argue that Chinese investment has provided critical infrastructure — roads, railways, ports, and power plants — that colonial-era and Western development models failed to deliver at comparable scale, and that Chinese willingness to engage without the governance conditionalities attached to Western aid and multilateral lending has allowed African governments greater autonomy. [3] Critics argue that many Chinese infrastructure projects have been financed through debt arrangements that leave recipient countries vulnerable to financial distress, and that infrastructure contracts frequently favor Chinese state-owned enterprises and Chinese labor over local companies and workers, limiting the technology transfer and employment benefits that would maximize developmental impact. [4] The question of whether Chinese engagement represents a fundamentally different development model or a new form of extractivism that mirrors colonial patterns has become one of the most contested questions in African political economy. [5] African governments and scholars have increasingly pushed back against both uncritical celebration and blanket condemnation of Chinese engagement, arguing that the diversity of arrangements across the continent resists any single characterization and that African states have greater agency in shaping these partnerships than either narrative acknowledges.", "q": "The writer wants to add the following sentence: 'Zambia's 2020 sovereign debt default — the first in sub-Saharan Africa in over twenty years — focused attention on the risks of Chinese lending terms, though economists debate the relative contribution of Chinese debt compared to Eurobond borrowing to Zambia's fiscal crisis.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle borç düzenlemelerinin alıcı ülkeleri finansal sıkıntıya karşı savunmasız bıraktığı eleştirisini yapıyor. Eklenecek cümle bu borç riskini somutlaştıran Zambiya örneğini sunuyor — tam olarak 3. cümledeki 'debt arrangements that leave countries vulnerable' iddiasını kanıtlayan tarihsel bir vaka. 3. cümlenin eleştirisinin ardından somut örnek gelmeli.\n\nA — 2. cümle sonrası: Çin yatırımının faydaları anlatılıyor; borç sorunu henüz gündemde değil.\nB — 3. cümle sonrası: borç riskleri eleştirisi yapıldı → Zambiya somut örnek olarak geliyor. Doğru.\nC — 4. cümle sonrası: genel tartışma anlatılıyor; Zambiya örneği bu noktada akışı kesiyor.\nD — 5. cümle sonrası: nüanslı yaklaşım çağrısı anlatılıyor; çok geç."}, {"k": "place", "p": "[1] The sociology of knowledge — the study of how social factors shape what counts as knowledge, what questions get asked, and whose experiences and perspectives inform accepted theoretical frameworks — has generated sustained debates about the relationship between the social position of researchers and the knowledge they produce. [2] Standpoint theory, developed by feminist scholars including Sandra Harding and Patricia Hill Collins, argues that knowledge-production is inherently situated: researchers' social locations — their gender, race, class, and institutional position — shape their perceptual frameworks, research questions, and interpretations in ways that are often invisible to those whose positions are socially dominant. [3] The practical implication of standpoint theory for research methodology is significant: if dominated groups have epistemic advantages in understanding social structures of domination that are naturalized and thus invisible from dominant positions, research that centers the perspectives and experiences of marginalized people may produce more complete and accurate accounts of social reality. [4] Critics of standpoint theory argue that, taken to its logical conclusion, it undermines the possibility of any transsubjective truth and makes it impossible to adjudicate between conflicting knowledge claims from different standpoints, collapsing into a form of relativism that is self-refuting. [5] Defenders respond that standpoint theory does not claim that all standpoints are equally valid but rather that socially dominant perspectives have systematically obscured important dimensions of reality, and that opening the research process to greater diversity of perspectives improves rather than undermines the quality of knowledge produced.", "q": "The writer wants to add the following sentence: 'This argument has had practical influence on funding agencies and research ethics boards, which increasingly require researchers to reflect explicitly on their own positionality and its potential effects on their work.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 1, "e": "B doğrudur. 3. cümle standpoint teorisinin araştırma metodolojisi için pratik içerimlerini açıklıyor: marjinalleşmiş grupların perspektifleri daha tam ve doğru sosyal hesaplar üretebilir. Eklenecek cümle 'this argument has had practical influence' ile tam olarak 3. cümledeki pratik içerimin gerçek dünyada nasıl uygulamaya girdiğini aktarıyor: finansman ajansları ve araştırma etik kurulları araştırmacılara kendi konumlarını yansıtmalarını zorunlu kılıyor. Pratik içerim → pratik etki.\n\nA — 2. cümle sonrası: standpoint teorisi tanımlandı; pratik etki için henüz içerimler açıklanmadı.\nB — 3. cümle sonrası: pratik içerimler açıklandı → bu içerimin pratik etkisi. Doğru.\nC — 4. cümle sonrası: eleştiriler anlatılıyor; pratik etki bu noktada bağlamsız.\nD — 5. cümle sonrası: savunular anlatılıyor; çok geç."}, {"k": "place", "p": "[1] The history of measurement standardization reveals how the adoption of common units transformed not only commerce and science but the very concept of rational administration. [2] Before the French Revolution, France alone had hundreds of distinct local units of weight and measure, making taxation, trade, and scientific communication across regions enormously difficult. [3] The metric system, developed by French scientists and mathematicians in the 1790s and adopted by the Revolutionary government, represented a deliberate attempt to replace this chaotic diversity with a universal, rational, decimal-based system grounded in natural constants. [4] Napoleon later exported the metric system across Europe through conquest, and though he subsequently allowed some traditional measures to be restored, the metric system gradually became the dominant global standard during the nineteenth and twentieth centuries through its adoption by scientific institutions and international treaties. [5] The United States remains the only major economy that has not fully transitioned to the metric system in everyday commerce and public life, a fact that is occasionally cited as a source of costly errors in engineering, science, and international trade.", "q": "The writer wants to add the following sentence: 'The Système International d'Unités, established in 1960 and revised in 2019 to anchor all base units to fixed numerical values of fundamental physical constants, represents the culmination of this centuries-long rationalization project.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 2, "e": "C doğrudur. 4. cümle metrik sistemin Napolyon döneminde yayılmasını ve uluslararası standarlaşmayı anlatıyor. Eklenecek cümle 1960'ta kurulan ve 2019'da güncellenen Uluslararası Birimler Sistemini (SI) sunuyor — bu, metrik standardizasyon projesinin doruğu ve tamamlanma noktası. 4. cümledeki uluslararası standardizasyon anlatısının doğal devamı.\n\nA — 2. cümle sonrası: yerel birimlerin kaotik çeşitliliği anlatılıyor; SI sistemi için çok erken.\nB — 3. cümle sonrası: metrik sistemin yaratılması anlatılıyor; SI 1960'a kadar kurulmadı; kronolojik olarak erken.\nC — 4. cümle sonrası: küresel standardizasyon anlatıldı → SI sistemi bu sürecin kulminasyonu. Doğru.\nD — 5. cümle sonrası: ABD'nin geçiş yapmadığı anlatılıyor; SI tanımı bu noktada akışı kesiyor."}, {"k": "place", "p": "[1] The neuroscience of creativity remains one of the most contested and rapidly evolving areas of cognitive science, as researchers attempt to identify the neural correlates of processes — including insight, divergent thinking, and aesthetic judgment — that are notoriously difficult to operationalize and measure. [2] Early models associated creativity with the right hemisphere of the brain, building on clinical observations of hemispheric specialization, but this simplification has been substantially revised by neuroimaging research showing that creative cognition recruits distributed networks across both hemispheres. [3] The default mode network (DMN) — a set of brain regions that becomes active during self-referential thought, mind-wandering, and the integration of loosely associated information — has been identified as a key substrate of creative ideation, particularly during the generative or incubation phases of creative problem-solving. [4] Interestingly, highly creative individuals show stronger co-activation of networks that are typically anti-correlated in non-creative individuals — specifically, the default mode network and the executive control network — suggesting that their brains are better at simultaneously generating ideas and evaluating their quality. [5] These findings have attracted interest from educators and organizational psychologists seeking to understand whether creative capacity can be trained or environmental conditions designed to enhance it, though translating neuroscientific findings into evidence-based educational or organizational interventions remains challenging.", "q": "The writer wants to add the following sentence: 'This finding challenges the popular notion of creativity as an 'effortless' or purely unconscious process, suggesting instead that effective creativity involves the integration of spontaneous generation and disciplined evaluation.' Where should it be placed?", "o": ["A) After sentence 2", "B) After sentence 3", "C) After sentence 4", "D) After sentence 5"], "a": 2, "e": "C doğrudur. 4. cümle, yaratıcı bireylerde genellikle anti-koreleli olan varsayılan mod ağı ve yürütme kontrol ağının güçlü şekilde birlikte aktive olduğunu, yani hem fikir üretimi hem de değerlendirmenin eş zamanlı gerçekleştiğini söylüyor. Eklenecek cümle 'this finding' ile tam olarak 4. cümlenin bulgusunu yorumluyor: bu, yaratıcılığın çabasız veya bilinçdışı bir süreç olduğu popüler görüşüne meydan okuyor.\n\nA — 2. cümle sonrası: sağ yarıküre modeli anlatılıyor; 4. cümledeki bulgu henüz yok.\nB — 3. cümle sonrası: DMN tanımlandı; ama 4. cümledeki anti-korelasyon bulgusu henüz yok.\nC — 4. cümle sonrası: anti-koreleli ağların birlikte aktivasyonu bulgusu verildi → eklenecek cümle 'this finding'i yorumluyor. Doğru.\nD — 5. cümle sonrası: eğitim uygulamaları anlatılıyor; yorum çok geç."}]}];

  // ── State ──
  var curSet=null, idx=0, ANS=[];
  var completed={};

  // ── Pack home ──
  function showPackHome(){
    var _ph=document.getElementById('pack-home');_ph.style.display='flex';_ph.style.flexDirection='column';
    document.getElementById('quiz-wrapper').style.display='none';
    document.getElementById('set-complete').classList.remove('show');
    window.scrollTo(0,0);
    renderPackHome();
  }

  function renderPackHome(){
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    var done=Object.keys(completed).length;
    var fill=document.getElementById('ph-fill');
    var lbl=document.getElementById('ph-prog-label');
    if(fill)fill.style.width=(done*10)+'%';
    if(lbl)lbl.textContent=done+' / 10 Set Tamamland\u0131';
    var grid=document.getElementById('set-grid');
    if(!grid)return;
    grid.innerHTML='';
    var DIFFS=['Very Easy','Easy','Easy \u2014 Medium','Medium \u2014 Easy','Medium','Medium','Medium \u2014 Hard','Hard','Hard','Very Hard'];
    for(var i=1;i<=10;i++){
      var s=ALL_SETS[i];var c=completed[i];
      var pct=c?Math.round(c.score/c.total*100):null;
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 14px;background:'+(c?'#ccfbf1':'#fff')+';border-radius:12px;margin-bottom:8px;cursor:pointer;border:1.5px solid '+(c?'#0d9488':'#ccfbf1')+';box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .15s;';
      row.onmouseenter=function(){this.style.boxShadow='0 4px 14px rgba(0,0,0,.12)';};
      row.onmouseleave=function(){this.style.boxShadow='0 1px 4px rgba(0,0,0,.05)';};
      var numDiv=document.createElement('div');
      numDiv.style.cssText='width:40px;height:40px;min-width:40px;border-radius:50%;background:'+(c?'#0d5e57':'#0d9488')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:monospace;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);';
      numDiv.textContent=c?'\u2713':i;
      var body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0;';
      var topicEl=document.createElement('div');
      topicEl.style.cssText='font-size:14px;font-weight:700;color:#134e4a;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;';
      topicEl.textContent=s.topic;
      var diffEl=document.createElement('span');
      diffEl.style.cssText='display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0d9488;background:#ccfbf1;border-radius:50px;padding:2px 8px;margin-top:4px;';
      diffEl.textContent=DIFFS[i-1];
      body.appendChild(topicEl);body.appendChild(diffEl);
      var right=document.createElement('div');
      right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;';
      if(c){
        var scoreEl=document.createElement('span');
        scoreEl.style.cssText='font-size:11px;font-weight:800;color:#fff;background:#0d9488;padding:2px 8px;border-radius:50px;white-space:nowrap;';
        scoreEl.textContent=c.score+'/'+c.total+' \u00b7 '+pct+'%';
        right.appendChild(scoreEl);
      }
      var ctaEl=document.createElement('span');
      ctaEl.style.cssText='font-size:11px;font-weight:700;color:#0d9488;border:1.5px solid #0d9488;border-radius:6px;padding:3px 10px;white-space:nowrap;';
      ctaEl.textContent=c?'Tekrar \u2192':'Ba\u015fla \u2192';
      right.appendChild(ctaEl);
      row.appendChild(numDiv);row.appendChild(body);row.appendChild(right);
      (function(n,r){
        r.addEventListener('click',function(){startSet(n);});
        r.addEventListener('touchend',function(e){e.preventDefault();startSet(n);});
      })(i,row);
      grid.appendChild(row);
    }
  }
  // ── Quiz engine ──
  function startSet(n){
    curSet=n;
    idx=0;
    ANS=new Array(ALL_SETS[n].qs.length).fill(null);
    document.getElementById('pack-home').style.display='none';
    document.getElementById('quiz-wrapper').style.display='flex';
    document.getElementById('set-complete').classList.remove('show');
    document.getElementById('tb-setlabel').textContent='SAT Reading & Writing · Study Pack · Set '+n+' · '+ALL_SETS[n].topic;
    render();
  }

  var qarea=null,qnum=null,prog=null;
  function render(){
    if(!qarea){qarea=document.getElementById('qarea');qnum=document.getElementById('qnum');prog=document.getElementById('prog');}
    var q=ALL_SETS[curSet].qs[idx];
    var qs=ALL_SETS[curSet].qs;
    prog.style.width=((idx+1)/qs.length*100)+'%';
    qnum.textContent='Q '+(idx+1)+' / '+qs.length;
    var tracker=document.getElementById('tracker');
    tracker.innerHTML='';
    qs.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='dot'+(ANS[i]!==null?' ans':'')+(i===idx?' cur':'');
      (function(ii){d.onclick=function(){idx=ii;render();}}) (i);
      tracker.appendChild(d);
    });
    qarea.innerHTML='';
    var pbox=document.createElement('div');pbox.className='pbox';
    if(q.p!==undefined){
      var txt=q.p;
      if(txt.indexOf('___')!==-1){
        txt='<span style="font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888;display:block;margin-bottom:.7rem">'+
          (q.k||'')+'</span>'+txt.replace('___','<span style="display:inline-block;width:140px;border-bottom:2px solid currentColor;vertical-align:bottom;margin:0 4px"></span>');
      }
      pbox.innerHTML=txt;
    } else if(q.passage!==undefined){pbox.innerHTML=q.passage;}
    qarea.appendChild(pbox);
    // Support both formats: q.question (new) or q.q (old)
    var questionText=q.question||q.q;
    if(questionText){var qt=document.createElement('div');qt.className='qtxt';qt.textContent=questionText;qarea.appendChild(qt);}
    // Support: q.choices (new obj array), q.opts (old string array), q.o (old string array)
    var choices=q.choices||q.opts||q.o;
    if(choices){
      choices.forEach(function(c,i){
        var btn=document.createElement('button');
        // Old format: answer is numeric index; new format: answer is letter
        var isSelected=(q.a!==undefined)?ANS[idx]===i:ANS[idx]===i;
        btn.className='opt'+(ANS[idx]===i?' sel':'');
        var lbl=(typeof c==='object')?c.label:c.charAt(0);
        var txt=(typeof c==='object')?c.text:c.slice(3);
        btn.innerHTML='<span class="ol">'+lbl+'</span><span>'+txt+'</span>';
        (function(ii){btn.onclick=function(){ANS[idx]=ii;render();}}) (i);
        qarea.appendChild(btn);
      });
    }
    var nav=document.createElement('div');nav.className='nav-row';
    var prev=document.createElement('button');prev.className='btn-n';prev.textContent='Previous';prev.disabled=idx===0;
    prev.onclick=function(){idx--;render();};
    nav.appendChild(prev);
    var done=ANS.filter(function(a){return a!==null;}).length;
    if(idx===qs.length-1){
      var sub=document.createElement('button');sub.className='btn-sub';
      sub.textContent='Submit ('+done+'/'+qs.length+')';sub.onclick=showSetComplete;nav.appendChild(sub);
    } else {
      var next=document.createElement('button');next.className='btn-n';next.textContent='Next';
      next.onclick=function(){idx++;render();};nav.appendChild(next);
    }
    qarea.appendChild(nav);
  }

  function getChoices(q){return q.choices||q.opts||q.o;}
  function isCorrect(q,selectedIdx){
    // Old format: q.a is numeric index
    if(q.a!==undefined&&typeof q.a==='number') return selectedIdx===q.a;
    // New format: q.answer is a letter
    var choices=getChoices(q);
    if(!choices||selectedIdx===null||selectedIdx===undefined)return false;
    var c=choices[selectedIdx];
    var selectedLabel=(typeof c==='object')?c.label:c.charAt(0);
    return selectedLabel===(q.answer||'A');
  }
  function getCorrectChoice(q){
    var choices=getChoices(q);
    if(!choices)return null;
    if(q.a!==undefined&&typeof q.a==='number') return choices[q.a];
    var lbl=q.answer||'A';
    return choices.find(function(c){return (typeof c==='object'?c.label:c.charAt(0))===lbl;});
  }
  function choiceText(c){
    if(!c)return '';
    return (typeof c==='object')?c.text:c.slice(3);
  }
  function showSetComplete(){
    var qs=ALL_SETS[curSet].qs;
    var score=0;
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))score++;
    });
    completed[curSet]={score:score,total:qs.length};
    var pct=Math.round(score/qs.length*100);
    var msg=pct>=80?'Mükemmel!':pct>=60?'Gayet iyi!':'Tekrar dene.';
    document.getElementById('quiz-wrapper').style.display='none';
    var sc=document.getElementById('set-complete');
    sc.classList.add('show');
    document.getElementById('scc-setnum').textContent=curSet;
    document.getElementById('scc-score').textContent=score;
    document.getElementById('scc-total').textContent=qs.length;
    document.getElementById('scc-pct').textContent=pct+'% — '+msg;
    var nextBtn=document.getElementById('scc-next');
    nextBtn.style.display=curSet<10?'':'none';
    // Review
    var rev=document.getElementById('scc-review');rev.innerHTML='';
    var title=document.createElement('div');title.className='scc-review-title';
    title.textContent='Yanlış Cevaplar';rev.appendChild(title);
    qs.forEach(function(q,i){
      if(isCorrect(q,ANS[i]))return;
      var choices=getChoices(q);
      var selected=choices&&ANS[i]!==null?choices[ANS[i]]:null;
      var correctChoice=getCorrectChoice(q);
      var correctText=choiceText(correctChoice);
      var wrongText=selected?choiceText(selected):'Cevap verilmedi';
      var wi=document.createElement('div');wi.className='wi';
      var pText=(q.p||q.passage||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().substring(0,70);
      var expl=q.explanation||q.e||'';
      wi.innerHTML='<div class="wh"><span class="wh-n">Q'+(i+1)+'</span><span class="wh-q">'+pText+'...</span><span class="wh-badge w">✗</span></div>'+
        '<div class="wb" style="display:none;padding:.8rem .9rem">'+
        '<div class="aw">'+wrongText+'</div>'+
        '<div class="ac">Doğru: '+correctText+'</div>'+
        (expl?'<div class="expl"><div class="expl-head"><img class="expl-cat" src="'+griCat()+'" alt="Gri"/><span class="expl-label">Gri diyor ki:</span></div><div class="expl-body">'+expl+'</div></div>':'')+'</div>';
      wi.querySelector('.wh').onclick=function(){var wb=wi.querySelector('.wb');wb.style.display=wb.style.display==='block'?'none':'block';};
      rev.appendChild(wi);
    });
    if(rev.children.length<=1){title.textContent='Tüm cevaplar doğru! ✓';}
    window.scrollTo(0,0);
  }

  function retakeSet(){startSet(curSet);}
  function goNextSet(){if(curSet<10)startSet(curSet+1);}


    (function(){
    var dg=document.getElementById('cv-dots-inner');
    if(dg){for(var i=0;i<25;i++){var s=document.createElement('span');dg.appendChild(s);}}
  })();

  showPackHome();

</script>
