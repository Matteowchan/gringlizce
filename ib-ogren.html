imi var mı?"]}, {"t": "given", "title": "Birinci örnek (biyolog)", "x": "We sat down with Dr. Elif Kaya, a marine biologist, to talk about the plastic quietly filling our oceans.\n\nInterviewer: What first drew you to the sea?\nDr. Kaya: Honestly, a childhood holiday. I found a turtle tangled in a net, and I never forgot it."}, {"t": "given", "title": "İkinci örnek (kısa, farklı kişi)", "x": "This week we spoke to Selin Arslan, captain of the school basketball team, about leadership.\n\nInterviewer: What makes a good captain?\nSelin: Not being the best player, honestly. It's about noticing the person who's struggling and lifting them up before anyone else does.\n\nInterviewer: What's the hardest part?\nSelin: Losing. Anyone can lead a winning team. Keeping people together after a bad defeat — that's the real test."}, {"t": "wizard", "wt": "interview", "ptitle": "Görev", "prompt": "Okulunun dergisi için ilham veren biriyle (bir öğretmen, sporcu, gönüllü veya mezun) röportaj yap. Kısa bir tanıtım paragrafı, ardından soru-cevap biçiminde yaz.", "target": 250, "check": ["Kişiyi tanıtan kısa bir giriş yazdım, sonra soru-cevap biçimini kullandım.", "Sorular net; cevaplar doğal ve konuşma dilinde (Criterion C).", "Konuya odaklı, prompt'un istediği kişiyi ve amacı işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (röportaj)", "x": "Every school has a quiet hero. Ours is Mr. Demir, the caretaker who has run our recycling scheme for twelve years. We asked him why he bothers.\n\nInterviewer: Most people walk past the bins without a thought. Why do you care so much?\nMr. Demir: Because someone has to. When I started, we threw everything away. It broke my heart. Now the students actually sort their rubbish. That is a small revolution.\n\nInterviewer: Has it been hard to change habits?\nMr. Demir: Very. For two years, nobody listened. I just kept going, one bin at a time. Change is slow, but it is real.\n\nInterviewer: What would you say to a student reading this?\nMr. Demir: Do not wait to be important before you do something useful. Start today, where you are, with what you have.\n\nAs he picked up his gloves and walked off, we understood exactly what he meant."}}, {"t": "note", "k": "ipucu", "title": "Biçim", "lines": ["Konuşan kişilerin isimlerini her replikte belirt (Interviewer: / Mr. Demir:). Bu Criterion C'yi güçlendirir.", "Cevapları konuşma dilinde tut; röportaj bir denemenin resmi diline kaçmamalı."]}]}, {"id": "t-news", "group": "Kitle İletişim", "name": "Haber (News Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel, doğru ve tarafsız biçimde haber vermek."], ["Kitle", "Bir gazete veya haber sitesinin okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Başlık (headline), ilk cümlede 5N1K, önemliden az önemliye (ters piramit), alıntılar."], ["Tipik özellikler", "Başlık, byline, geçmiş zaman, alıntılar (said/added), nesnel dil, isim-tarih-yer."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kısa, bilgilendirici bir başlık (headline) yaz.", "2. İlk cümlede 5N1K'yı ver: kim, ne, ne zaman, nerede.", "3. Ters piramit: en önemli bilgi başta, ayrıntılar sonra.", "4. Nesnel, üçüncü şahıs ve geçmiş zaman kullan.", "5. En az bir doğrudan alıntı ekle (said/added).", "6. Kendi görüşünü katma; görüşler yalnızca alıntılarda.", "7. Son kontrol: başlık + 5N1K + nesnellik + alıntı var mı?"]}, {"t": "given", "title": "Birinci örnek (bağış)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised over 5,000 lira for an animal shelter last Saturday, organisers confirmed on Monday."}, {"t": "given", "title": "İkinci örnek (kısa, farklı olay)", "x": "School Play Wins Regional Drama Award\n\nGreen Valley High School's production of 'The Long Night' won first prize at the regional drama festival on Friday, beating twelve other schools. The cast of thirty students had rehearsed for four months.\n\n'I am incredibly proud of them,' said drama teacher Ms. Aydin. 'They earned every second of this.' The school will now represent the region at the national final in June."}, {"t": "wizard", "wt": "news_report", "ptitle": "Görev", "prompt": "Okulunda gerçekleşen bir etkinliği (bir yarışma, gösteri, bağış kampanyası veya beklenmedik bir olay) haber yap. Bir başlık ve ters piramit yapısında nesnel bir haber yaz; en az bir alıntı ekle.", "target": 250, "check": ["Bir başlık yazdım ve ilk cümlede kim/ne/ne zaman/nerede bilgisini verdim.", "Nesnel, tarafsız, üçüncü şahıs bir dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı prompt'a uygun işledim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (haber)", "x": "Students Raise Record Sum for Local Shelter\n\nStudents at Green Valley High School raised more than 5,000 lira for a local animal shelter last Saturday, organisers confirmed on Monday. The total is the highest the school has ever collected in a single day.\n\nThe money was raised through a charity fair held in the main hall, where students sold baked goods, ran games and organised a small concert. More than three hundred visitors attended during the afternoon.\n\n'We expected maybe half this amount,' said Ayse Yildiz, the student who led the campaign. 'People were incredibly generous.'\n\nThe shelter, which currently cares for over forty animals, said the donation would be used to buy food and medical supplies for the winter. Its director thanked the students and described the support as a real lifeline.\n\nOrganisers said they hoped to make the fair an annual event."}}, {"t": "note", "k": "ipucu", "title": "Nesnellik", "lines": ["Kendi görüşünü katma; haber tarafsızdır. Görüşler yalnızca alıntılarda yer alır.", "En önemli bilgiyi başa koy (ters piramit). Okur ilk cümlede olayı anlamalı."]}]}, {"id": "t-review", "group": "Kitle İletişim", "name": "İnceleme (Review)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran veya etkinliği değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan (izleyecek/okuyacak mı diye) okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (sürprizsiz), güçlü ve zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, birinci şahıs görüş, dengeli değerlendirme."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Neyi incelediğini (film, kitap, restoran) baştan belli et.", "2. Kısa, sürprizleri açık etmeyen bir özet ver.", "3. Güçlü yönleri gerekçele (ne iyiydi, neden?).", "4. Zayıf yönleri de dürüstçe belirt (denge kurar).", "5. Değerlendirici ama gerekçeli sıfatlar kullan.", "6. Net bir öneriyle veya puanla bitir (kime uygun?).", "7. Son kontrol: özet + güçlü/zayıf + denge + net öneri var mı?"]}, {"t": "given", "title": "Birinci örnek (film)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Almost."}, {"t": "given", "title": "İkinci örnek (restoran, farklı ürün)", "x": "Warm Food, Cold Service: The New Corner Cafe\n\nThe Corner Cafe has been the talk of our street for weeks, and the food mostly lives up to the hype. The soups are rich and generous, and the bread is baked fresh every morning.\n\nThe service, sadly, is another story. We waited twenty minutes just to order. If the owners can fix the slow service, this could become a favourite. For now, go for the food, but bring your patience. Three stars out of five."}, {"t": "wizard", "wt": "review", "ptitle": "Görev", "prompt": "Yakın zamanda izlediğin bir film veya okuduğun bir kitabı incele. Kısa bir özet (sürprizleri açık etmeden), güçlü ve zayıf yönler ve net bir öneri içeren bir inceleme yaz.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Değerlendirici, çeşitli kelimeler kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (inceleme)", "x": "A Feast for the Eyes, If Not the Heart\n\n'The Blue Lantern' promises a lot, and for its first hour it almost delivers. Set in a crumbling seaside town, it follows a young lighthouse keeper who discovers a mysterious light at sea. The premise is simple, but the film wraps it in some of the most beautiful images I have seen this year.\n\nVisually, it is stunning. Every frame looks like a painting, and the sound design makes you feel the cold wind and crashing waves.\n\nThe problem is the story. Halfway through, the plot slows to a crawl, and the characters stop making believable choices. By the end, I admired the film without ever really caring about anyone in it.\n\nSo is it worth watching? If you love atmosphere and can forgive a thin plot, yes. If you need a story that grips you, you may leave a little cold. I would give it three stars out of five: gorgeous, but hollow."}}, {"t": "note", "k": "ipucu", "title": "Denge", "lines": ["Sadece övme veya sadece yerme; güçlü ve zayıf yönleri birlikte ver. Dengeli görüş üst puan getirir.", "Kararsız kalma; sonunda net bir öneri (izle/izleme, kime uygun) ver."]}]}, {"id": "t-report", "group": "Profesyonel", "name": "Resmi Rapor (Report)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (müdür, yönetim, kurul)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Başlık, To/From/Date, giriş (amaç), başlıklı bulgular, öneriler, kısa kapanış."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (It is recommended that)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlık ve To / From / Date bilgisini yaz.", "2. Girişte raporun amacını tek cümleyle belirt.", "3. Bulgular bölümünde sorunu nesnel ve veriye dayalı anlat (başlık kullan).", "4. Her bulguyu kısa ve tarafsız ver; kişisel görüş katma.", "5. Öneriler bölümünde çözümleri 'It is recommended that...' kalıbıyla sırala.", "6. Kısa bir sonuç/kapanışla bitir.", "7. Son kontrol: başlık + bölüm başlıkları + nesnel dil + öneriler var mı?"]}, {"t": "given", "title": "Birinci örnek (kantin)", "x": "Report on the School Cafeteria\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine student concerns about the cafeteria and to suggest practical improvements."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Report on After-School Club Provision\nTo: The Vice Principal\nFrom: The Student Council\nDate: 3 April\n\nFindings\nA survey of 200 students showed that clubs are popular but limited. The most requested activities — coding, debating and film — are currently not offered. Many students also reported that clubs clash with the late bus.\n\nRecommendations\nIt is recommended that three new clubs be introduced next term. It is further recommended that club times be aligned with the bus timetable so that no student is excluded."}, {"t": "wizard", "wt": "report", "ptitle": "Görev", "prompt": "Okul yönetimi için bir sorunu (kütüphane saatleri, kantin, ulaşım veya kulüpler) araştıran ve çözüm öneren resmi bir rapor yaz. Başlık, To/From/Date, bulgular ve öneriler bölümlerini kullan.", "target": 280, "check": ["Başlık ve To/From/Date bilgisiyle resmi rapor biçimini kullandım.", "Başlıklı bölümler (giriş, bulgular, öneriler) ve nesnel bir dil kullandım (Criterion C).", "Bulguları verdim ve prompt'un istediği çözüm önerilerini sundum (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (rapor)", "x": "Report on the School Library\nTo: The School Principal\nFrom: The Student Council\nDate: 10 March\n\nIntroduction\nThe purpose of this report is to examine students' concerns about the school library and to recommend improvements to its opening hours and study space.\n\nFindings\nA survey of 150 students revealed two main problems. First, the library closes at 3 p.m., which prevents students who stay for clubs from using it. Second, during exam periods, there are not enough quiet seats, and many students are turned away.\n\nSeveral students also noted that the study area is often disturbed by group work taking place in the same room.\n\nRecommendations\nIt is recommended that the library remain open until 5 p.m. on weekdays. It is also recommended that a separate silent zone be created for individual study, especially before examinations.\n\nConclusion\nThese changes would be low in cost but would greatly improve students' ability to study effectively at school."}}, {"t": "note", "k": "ipucu", "title": "Resmilik", "lines": ["Kişisel ton yok; nesnel ve veri odaklı yaz. It is recommended that... kalıbı Criterion C'yi güçlendirir.", "Bölüm başlıkları kullan (Introduction, Findings, Recommendations). Yapı görünür olmalı."]}]}, {"id": "t-proposal", "group": "Profesyonel", "name": "Öneri / Teklif (Proposal, HL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri veya planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (yönetim, kurul, sponsor)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi."], ["Yapı", "Başlık, giriş (önerinin özeti), gerekçe ve faydalar, uygulama planı, maliyet, kapanış çağrısı."], ["Tipik özellikler", "Bölüm başlıkları, gelecek zaman, fayda vurgusu, gerçekçi plan, ölçülü ikna dili. (Sadece HL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Başlıkta öneriyi adlandır (Proposal: ...).", "2. Girişte fikri tek paragrafta özetle: ne öneriyorsun ve neden?", "3. Faydalar bölümünde kime, nasıl fayda sağlayacağını göster.", "4. Uygulama planında gerçekçi adımlar ver (kim, ne zaman, nasıl).", "5. Maliyet/kaynak konusunu dürüstçe ele al (düşük maliyet güven verir).", "6. Kapanışta ölçülü ama net bir onay çağrısı yap.", "7. Son kontrol: başlık + öneri + fayda + plan + gerçekçilik var mı?"]}, {"t": "given", "title": "Birinci örnek (akran mentorluğu)", "x": "Proposal: A Peer Tutoring Programme\n\nThis proposal outlines a student-led tutoring scheme designed to support learners who are struggling in core subjects, at no cost to the school."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Proposal: A School Recycling Scheme\n\nIntroduction\nThis proposal recommends placing clearly labelled recycling bins in every classroom and corridor.\n\nBenefits\nThe scheme would cut waste, save the school money on collection, and teach students habits that last a lifetime.\n\nImplementation\nEco-club volunteers would empty and monitor the bins weekly, and a short assembly would launch the scheme.\n\nCosts\nThe only cost is the bins themselves, which a local supplier has offered to sponsor. I respectfully ask the school to approve a one-month trial."}, {"t": "wizard", "wt": "proposal", "ptitle": "Görev", "prompt": "Okulunda yeni bir kulüp, etkinlik veya sistem için yönetimden onay isteyen bir öneri (proposal) yaz. Fikri, faydalarını ve gerçekçi bir uygulama planını açıkla. (HL)", "target": 300, "check": ["Başlık ve girişte öneriyi net özetledim.", "Gerekçe/faydaları ve gerçekçi bir uygulama planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille prompt'un istediğini karşıladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (öneri)", "x": "Proposal: A Peer Tutoring Programme\n\nIntroduction\nThis proposal recommends setting up a peer tutoring programme in which older students help younger ones who are struggling in core subjects. The scheme would run twice a week after school and would cost the school almost nothing.\n\nBenefits\nThe programme would help weaker students improve their grades in a relaxed, less intimidating setting. Just as importantly, the tutors themselves would deepen their own understanding and develop leadership skills valued by universities. Over time, it could also build a stronger sense of community across year groups.\n\nImplementation\nEach term, volunteer tutors would be matched with younger students by subject teachers. Sessions would take place in the library from 3 to 4 p.m. on Tuesdays and Thursdays. A teacher would supervise, but the sessions would be led by students.\n\nCosts\nThe only real cost is supervision, which existing staff could share on a rota. No new materials or funding would be required.\n\nConclusion\nFor almost no cost, this programme could raise achievement and bring students together. I respectfully ask the school to trial it for one term."}}, {"t": "note", "k": "ipucu", "title": "Rapordan farkı", "lines": ["Rapor mevcut durumu inceler; öneri (proposal) gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-instructions", "group": "Profesyonel", "name": "Yönerge (Set of Instructions)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net, doğrudan. Emir kipi (imperative)."], ["Yapı", "Başlık, gerekli malzemeler/ön koşullar, numaralı adımlar, ipuçları veya uyarılar."], ["Tipik özellikler", "Emir kipi (Take, Add, Do not), numaralı adımlar, sıra bağlaçları (First, Next, Finally), kısa net cümleler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir başlık yaz (How to ...).", "2. Gerekli malzemeleri/ön koşulları listele.", "3. Adımları mantıksal sıraya koy; her adım tek bir eylem olsun.", "4. Her adımı emir kipiyle başlat (Chop, Add, Press).", "5. Sıra bağlaçları kullan (First, Next, Then, Finally).", "6. Gerekirse bir ipucu veya uyarı ekle (Do not...).", "7. Son kontrol: başlık + malzemeler + numaralı adımlar + emir kipi var mı?"]}, {"t": "given", "title": "Birinci örnek (balkon bahçesi)", "x": "How to Start a Small Balcony Garden\n\nYou will need: two or three pots, potting soil, seeds, a small trowel and water.\n\n1. Choose a spot on your balcony that gets at least four hours of sunlight a day."}, {"t": "given", "title": "İkinci örnek (dijital, farklı bağlam)", "x": "How to Set Up Your New Email Account\n\nYou will need: a phone or computer, an internet connection and a strong password.\n\n1. First, open the app store and download the email app.\n2. Tap 'Create account' and enter your name and date of birth.\n3. Next, choose a username and a password of at least eight characters.\n4. Enter your phone number so the app can send a verification code.\n5. Type in the code when it arrives.\n6. Finally, add a profile photo if you wish, and tap 'Done'. Tip: never share your password with anyone."}, {"t": "wizard", "wt": "instructions", "ptitle": "Görev", "prompt": "Bir beceriyi (basit bir yemek, bir uygulamayı kurmak veya bir el işi) yeni başlayan birine öğreten bir yönerge yaz. Bir malzeme/ön koşul listesi ve numaralı adımlar kullan.", "target": 220, "check": ["Başlık ve gerekli malzemeler/ön koşullar listesi ekledim.", "Numaralı adımlar, emir kipi ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz; prompt'un istediği beceriyi kapsıyor (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (yönerge)", "x": "How to Make a Simple Turkish Menemen\n\nYou will need: three eggs, two tomatoes, one green pepper, a little olive oil, salt and a slice of bread to serve.\n\n1. First, wash the tomatoes and pepper. Chop the pepper into small pieces and grate or finely dice the tomatoes.\n\n2. Heat a little olive oil in a pan over medium heat. Add the pepper and cook for two to three minutes until it softens.\n\n3. Next, add the tomatoes and a pinch of salt. Let the mixture simmer for about five minutes, stirring now and then, until most of the liquid has gone.\n\n4. Crack the eggs directly into the pan. Do not stir straight away; wait a few seconds, then gently fold them into the tomato mixture.\n\n5. Cook for another minute or two, until the eggs are just set but still soft.\n\n6. Finally, serve hot with fresh bread. Tip: do not overcook the eggs, or the dish will become dry."}}, {"t": "note", "k": "ipucu", "title": "Netlik", "lines": ["Her adım tek bir eylem olsun ve emir kipiyle başlasın (Chop, Add, Serve).", "Sıra bağlaçları (First, Next, Finally) ve bir malzeme listesi Criterion C'yi güçlendirir."]}]}, {"id": "t-essay", "group": "Profesyonel", "name": "Deneme (Essay, SL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Giriş (konu + tez), her biri bir fikri işleyen gövde paragrafları (gerekçe + örnek), sonuç."], ["Tipik özellikler", "Net tez, bağlaçlar (however, therefore, for example), gerekçeli argüman, dengeli değerlendirme, sonuç. (Genelde SL)"]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Soruyu çöz: seni ne hakkında görüş bildirmeye çağırıyor?", "2. Net bir tez belirle (görüşün ne?).", "3. Girişte konuyu tanıt ve tezini son cümlede ver.", "4. Her gövde paragrafında bir fikri işle: iddia + gerekçe + örnek.", "5. Karşı görüşe de değin (however...), sonra kendi görüşünle dengele.", "6. Sonuçta tezi toparla; yeni bilgi ekleme.", "7. Son kontrol: tez + gerekçeli paragraflar + bağlaçlar + denge + sonuç var mı?"]}, {"t": "given", "title": "Birinci örnek (sosyal medya)", "x": "Should Social Media Be Part of School Life?\n\nSocial media is often blamed for distracting students, yet it also offers real opportunities for learning. This essay argues that, used carefully, it belongs in the classroom."}, {"t": "given", "title": "İkinci örnek (giriş + tez, farklı konu)", "x": "Should Schools Ban Mobile Phones?\n\nFew objects divide a classroom like the mobile phone. To some it is a powerful learning tool; to others, the single biggest source of distraction in a student's day. While phones certainly have their uses, this essay argues that schools are right to restrict them during lessons, because the cost to concentration outweighs the convenience."}, {"t": "wizard", "wt": "essay", "ptitle": "Görev", "prompt": "Şu soruya bir deneme (essay) yaz: 'Should students be required to do community service?' Net bir tez, gerekçeli gövde paragrafları ve dengeli bir sonuç kullan.", "target": 280, "check": ["Girişte konuyu tanıttım ve net bir tez cümlesi yazdım.", "Her gövde paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve sonunda görüşümü toparladım (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (deneme)", "x": "Should Students Be Required to Do Community Service?\n\nMany schools now ask students to spend a set number of hours helping their community. Some see this as an unfair burden, but I believe that required community service, if handled sensibly, does far more good than harm.\n\nThe strongest argument in its favour is what students learn. Helping at a shelter or tutoring a younger child teaches responsibility and empathy in a way no textbook can. A friend of mine who volunteered at a care home says it completely changed how she sees older people.\n\nCritics argue that forcing people to help removes the kindness from the act. There is some truth in this. However, many students would never volunteer on their own, and once they start, they often continue by choice. The requirement simply opens a door.\n\nOf course, the hours must be reasonable, so that service does not harm students' studies or become a box-ticking exercise.\n\nIn conclusion, while it should be applied with care, required community service benefits both students and society, and I believe schools are right to include it."}}, {"t": "note", "k": "ipucu", "title": "Argüman", "lines": ["Girişte net bir tez ver; sonuç bu tezi toparlasın. Değerlendirici Criterion B'yi buradan okur.", "Karşı görüşe de değin (however...), sonra kendi görüşünle dengele. Bu olgunluk gösterir."]}]}, {"id": "t-social", "group": "Kişisel", "name": "Sosyal Medya Gönderisi", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kısa ve etkili biçimde bilgilendirmek, ikna etmek veya farkındalık yaratmak."], ["Kitle", "Bir platformun takipçileri veya kullanıcıları."], ["Register / Ton", "Kısa, canlı ve samimi; amaca uygun."], ["Yapı", "Dikkat çeken kısa mesaj, gerekirse maddeler, hashtag'ler, harekete geçirici çağrı."], ["Tipik özellikler", "Kısalık, hashtag (#), bahsetme (@), doğrudan hitap, net bir çağrı (Share, Sign up, Link below)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Amacı ve platformu belirle (bilgilendirme, davet, farkındalık).", "2. İlk satırda dikkat çek: bir soru veya çarpıcı ifade.", "3. Mesajı kısa ve net tut; tek bir ana fikir.", "4. Gerekli bilgiyi (tarih, yer, fiyat) kısa maddelerle ver.", "5. 2-4 ilgili hashtag ekle.", "6. Net bir çağrı koy (Tag a friend, Sign up, Link in bio).", "7. Son kontrol: kısa mı, hashtag ve çağrı var mı, ton platforma uygun mu?"]}, {"t": "given", "title": "Birinci örnek (farkındalık)", "x": "Every plastic bottle you skip is a small win for the planet.\n\nThis week, our school is going bottle-free. Bring a reusable one and we'll refill it for free at any fountain.\n\nSmall habit, big difference. Who's in?\n#GreenValley #PlasticFree #SmallSteps"}, {"t": "given", "title": "İkinci örnek (etkinlik, farklı bağlam)", "x": "THREE NIGHTS ONLY\n\nOur drama club presents 'The Long Night' — a story you won't forget.\n\n- 12 to 14 June, 7 pm\n- Tickets 20 lira at the door\n\nTag the friend you're bringing below.\n#GVHSDrama #SchoolPlay"}, {"t": "wizard", "wt": "social", "ai": false, "ptitle": "Görev", "prompt": "Okulunun bir kampanyası veya etkinliği için bir sosyal medya gönderisi yaz. Dikkat çeken kısa bir mesaj, gerekli bilgiler, uygun hashtag'ler ve net bir çağrı kullan.", "target": 120, "check": ["İlk satırda dikkat çektim ve mesajı kısa tuttum.", "Gerekli bilgiyi (tarih/yer/çağrı) net verdim (Criterion B).", "Uygun hashtag ve doğrudan bir çağrı kullandım (Criterion C).", "Ton platforma ve kitleye uygun.", "Kelime çeşitliliği kullandım (Criterion A)."], "model": {"title": "Model cevap (sosyal medya)", "x": "Exams are close, but you are not alone.\n\nThis week we're launching Study Buddies: free peer study sessions every lunchtime in the library. Bring your toughest subject; we'll bring the tea.\n\nNo pressure, no judgement, just people getting through it together.\n\nDrop by, or tag a friend who needs this below.\n#GreenValley #StudyBuddies #YouGotThis"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Uzun paragraflar yazmak. Sosyal medya kısadır; her kelime çalışsın.", "Hashtag veya çağrıyı unutmak. Bunlar türün imzasıdır (Criterion C).", "Yanlış ton. Resmi bir rapor dili sosyal medyada garip durur."]}]}, {"id": "t-ad", "group": "Kitle İletişim", "name": "Reklam (Advertisement)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir ürünü, hizmeti veya etkinliği tanıtıp okuru satın almaya/harekete geçmeye ikna etmek."], ["Kitle", "Hedeflenen müşteri veya katılımcı."], ["Register / Ton", "İkna edici, çarpıcı, kısa ve enerjik."], ["Yapı", "Akılda kalan slogan/başlık, ana fayda, bir teklif/detay, güçlü çağrı, iletişim."], ["Format", "Görsel ağırlıklı; elle yazımda slogan + kısa metin + [Image: ...] + çağrı ile temsil et."], ["Tipik özellikler", "Slogan, çekici dil, fayda vurgusu, emir kipi, teklif/fiyat, [Image] yer tutucu, çağrı."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Ürünü/teklifi ve hedef kitleyi belirle.", "2. Akılda kalan bir slogan veya başlık bul.", "3. Ana faydayı vurgula: bu neden alınmalı?", "4. Bir teklif veya detay ekle (fiyat, indirim, özellik).", "5. [Image: ...] ile görsel yerini belirt.", "6. Güçlü bir çağrı ve iletişim bilgisi koy (Order now, Visit...).", "7. Son kontrol: slogan + fayda + teklif + çağrı var mı?"]}, {"t": "given", "title": "Birinci örnek (ürün)", "x": "TIRED OF COLD MORNINGS? MEET THE POCKET WARMER.\n\nOne click, twelve hours of heat. Small enough for your pocket, powerful enough for the coldest bus stop.\n\n[Image: a student smiling in the snow, holding the warmer]\n\nToday only: buy one, get one free. Just 199 lira.\nOrder now at www.pocketwarmer.example."}, {"t": "given", "title": "İkinci örnek (hizmet, farklı bağlam)", "x": "LEARN TO SWIM THIS SUMMER.\n\nAfraid of water? Our patient coaches have taught over 2,000 nervous beginners to swim with real confidence.\n\nSmall groups. Warm pool. Genuine results.\n\n[Image: a child laughing while floating beside an instructor]\n\nYour first lesson is free. Book today: 0212 555 44 33."}, {"t": "wizard", "wt": "advertisement", "ai": false, "ptitle": "Görev", "prompt": "Bir ürün, hizmet veya etkinlik için bir reklam yaz. Akılda kalan bir slogan, ana faydayı, bir teklif ([Image] yer tutucu dahil) ve güçlü bir çağrı kullan.", "target": 150, "check": ["Akılda kalan bir slogan/başlıkla açtım.", "Ana faydayı ve bir teklif/detayı vurguladım (Criterion B).", "[Image: ...] yer tutucu ve güçlü bir çağrı kullandım (Criterion C).", "İkna edici, kısa ve enerjik bir dil kullandım (Criterion A).", "İletişim/çağrı bilgisini ekledim."], "model": {"title": "Model cevap (reklam)", "x": "STILL SCROLLING FOR SOMETHING TO DO THIS WEEKEND?\n\nStop. The Riverside Skate Park is open, and your first session is on us.\n\nWhether you've never touched a board or you're chasing your next trick, our friendly instructors will have you rolling in no time. Helmets and boards provided — just bring your courage.\n\n[Image: teenagers laughing on ramps under a bright sky]\n\nThis Saturday, 10 am to 6 pm. First hour free for students.\nFind us at Riverside Park, next to the old bridge. Come and roll with us."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Slogansız, düz bir tanıtım yazmak. Reklamın kalbi akılda kalan bir slogandır.", "Faydayı değil sadece özelliği anlatmak. Okur 'bu bana ne katar' bilmek ister.", "Çağrıyı unutmak. Reklam mutlaka bir eyleme çağırır (Buy, Book, Visit)."]}]}, {"id": "t-webpage", "group": "Kitle İletişim", "name": "Web Sayfası (Web Page)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kurum, etkinlik veya konu hakkında çevrimiçi bilgi sunmak ve kullanıcıyı yönlendirmek."], ["Kitle", "Siteyi ziyaret eden kullanıcılar."], ["Register / Ton", "Net, davetkâr; çoğunlukla yarı resmi."], ["Yapı", "Başlık/banner, kısa tanıtım, gezinme menüsü, bölüm başlıkları, kısa metin/maddeler, butonlar, altbilgi."], ["Format", "Elle yazımda: başlık + [Menu: Home | About | Contact] + bölüm başlıkları + [Button: Sign up] ile temsil et."], ["Tipik özellikler", "Başlık, gezinme (menu), bölüm başlıkları, kısa metin, butonlar/linkler, iletişim/altbilgi."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Sayfanın amacını ve kimin için olduğunu belirle.", "2. Bir başlık/banner ve kısa bir hoş geldin metni yaz.", "3. Gezinme menüsünü işaretle: [Menu: Home | About | ...].", "4. İçeriği bölüm başlıkları ve kısa paragraf/maddelerle sun.", "5. Butonları/linkleri belirt: [Button: Sign up].", "6. Altbilgide iletişim ve link ver.", "7. Son kontrol: başlık + menu + bölümler + butonlar + altbilgi var mı?"]}, {"t": "given", "title": "Birinci örnek (okul)", "x": "[Banner: GREEN VALLEY HIGH SCHOOL]\n[Menu: Home | About | Admissions | Contact]\n\nWelcome to Green Valley\nA place where curiosity meets community.\n\nWHY CHOOSE US\n- Small, friendly classes\n- Over twenty clubs and sports\n- A strong record of university success\n\n[Button: Book a Tour]\n\nFooter: 15 Valley Road, 0212 000 00 00, info@greenvalley.example"}, {"t": "given", "title": "İkinci örnek (etkinlik, farklı bağlam)", "x": "[Banner: RIVERSIDE ARTS FESTIVAL]\n[Menu: Home | Line-up | Tickets | Getting Here]\n\nThree Days by the River\nMusic, food and workshops for everyone.\n\nWHAT'S ON\n- Two open-air stages\n- Free art and dance workshops\n- Street food from thirty local kitchens\n\n[Button: Get Your Tickets]\n\nFooter: Riverside Park, 14 to 16 June, hello@riversidefest.example"}, {"t": "wizard", "wt": "webpage", "ai": false, "ptitle": "Görev", "prompt": "Bir okul, kulüp veya etkinlik için bir web sayfası (ana sayfa) yaz. Başlık/banner, bir menü, bölüm başlıkları, kısa maddeler, en az bir buton ve bir altbilgi kullan.", "target": 180, "check": ["Bir başlık/banner ve kısa bir hoş geldin metni yazdım.", "Bir gezinme menüsü [Menu: ...] belirttim.", "İçeriği bölüm başlıkları ve kısa maddelerle sundum (Criterion C).", "En az bir buton [Button: ...] ve bir altbilgi (iletişim) ekledim.", "Net, davetkâr bir dil kullandım (Criterion A/B)."], "model": {"title": "Model cevap (web sayfası)", "x": "[Banner: THE GREEN VALLEY ECO CLUB]\n[Menu: Home | Projects | Events | Join Us]\n\nSmall Actions, Big Change\nWelcome to the Eco Club, a group of students working to make our school greener, one project at a time.\n\nWHAT WE DO\n- Run the school recycling scheme\n- Grow vegetables in the courtyard garden\n- Organise clean-up days along the river\n\nWHY JOIN\nYou don't need to be an expert. You just need to care. Every member helps shape what we do next, and you will meet people who want to change things too.\n\n[Button: Join the Club]\n\nFooter: Meet us every Thursday, Room 12, ecoclub@greenvalley.example"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Sayfayı düz bir denemeye çevirmek. Web sayfasında menu, bölümler ve butonlar görünür olmalı.", "Gezinme (menu) ve butonları unutmak. Bunlar türü belli eder (Criterion C).", "Uzun paragraflar. Web okuru tarar; kısa bölümler ve maddeler kullan."]}]}, {"id": "paper1", "group": "Writing", "name": "Paper 1 Yazma", "eyebrow": "Paper 1 . Yaz", "blocks": [{"t":"h","x":"Paper 1 Sınav Anında Nasıl İşler?"},{"x":"Paper 1, English B'nin yazma becerini ölçen dış değerlendirmesidir ve final notunun yaklaşık dörtte birini oluşturur. Sınav 75 dakikadır ve önüne üç ayrı görev (prompt) konur; bunlardan yalnızca BİRİNİ seçip yanıtlarsın. Her görev genellikle farklı bir prescribed theme'e ve farklı bir metin türüne yönlendirir, böylece hangi konuda ve türde daha güçlü olduğunu seçme şansın olur. SL öğrencileri 250-400 kelimelik tek bir metin yazar; HL öğrencileri ise 450-600 kelimelik tek bir metin yazar. Bu ders sana o 75 dakikayı en verimli biçimde nasıl kullanacağını, yani sınav anında adım adım ne yapacağını öğretir. Kesin kelime sınırlarını ve süreleri her zaman güncel resmi IB English B Guide'dan teyit et.","t":"p"},{"t":"p","x":"Paper 1'de başarı üç şeyin birleşimidir: doğru görev seçimi, iyi bir plan ve üç kriteri bilinçli uygulayan bir yazım. Bu üçü olmadan, dil ne kadar iyi olursa olsun puan tavana vurmaz. Çoğu öğrenci doğrudan yazmaya başlar ve yarı yolda yapısını kaybeder; oysa birkaç dakikalık plan, hem zamanı hem puanı kurtarır. Aşağıda bu süreci evrelere böleceğiz: seçim, planlama, yazım, kriter uygulaması, kelime ve zaman disiplini ve son kontrol. Her evreyi kendi sınav pratiğinde tekrarla; bu akış içselleştiğinde, sınav anında panik yerine bir rutin devreye girer."},{"x":"Görevi Doğru Seçmek","t":"h"},{"t":"p","x":"Üç görev arasından seçim yaparken en yaygın hata, en ilgi çekici konuyu seçmektir. Doğru ölçüt konu değil, metin türüdür. Kendine sor: bu üç türden hangisinin kurallarına en iyi hakimim? Fikir bolluğun olan ama türünü tanımadığın bir görev tuzaktır; çünkü mesajın güçlü olsa bile yanlış türde yazarsan Criterion C çöker. Örneğin harika fikirlerin olduğu bir konu bir 'proposal' (öneri) istiyorsa ve sen öneri yapısını bilmiyorsan, o görevden uzak dur. Türünü iyi bildiğin, imza öğelerini ve register'ını rahatça kurabileceğin görevi seç; fikirler her konuda üretilebilir ama tür bilgisi anlık üretilemez."},{"t":"p","x":"Seçimini yaparken her görevi hızlıca üç soruyla tara: hangi metin türü isteniyor, kime yazacağım ve amaç ne? Bu üç yanıtı en net verebildiğin görev, en güvenli seçimdir. Ayrıca görevin sana ne kadar somut malzeme verdiğine bak; bazı görevler bir bağlam, bir durum veya birkaç ipucu sunar ve bunlar fikir üretmeni kolaylaştırır. Seçimini bir dakika içinde yap ve geri dönme; kararsızlık, değerli sınav zamanını yer. Seçtiğin görevi bir daha oku ve anahtar kelimelerin altını çiz."},{"t":"h","x":"Planlama: İlk Beş Dakika"},{"x":"Yazmaya başlamadan önce yaklaşık beş dakikanı planlamaya ayır; bu, tüm sınavın en yüksek getirili yatırımıdır. Önce üç temel kararı yaz: metin türü, kitle ve register. Sonra o türün zorunlu imza öğelerini not et: başlık mı, hitap mı, imza mı, alt başlık mı, tarih mi gerekiyor? Ardından üç dört ana fikir seç ve her birini bir örnekle geliştirmeyi planla. Son olarak açılış cümleni zihninde kur; güçlü bir açılış, metnin geri kalanını sürükler. Bu plan bir taslak değil, bir pusuladır; yazarken kaybolduğunda ona dönersin.","t":"p"},{"x":"Planlama aşamasında fikirlerini yüzeysel bırakma tuzağına karşı önlem al. Her ana fikrin yanına onu nasıl geliştireceğini kısaca not et: hangi örnek, hangi ayrıntı, hangi sonuç? Criterion B'de en çok puan, fikirlerin çıplak bırakılmayıp geliştirilmesinden gelir. Ayrıca fikirlerinin sırasını düşün: en güçlü fikri nereye koyacaksın, nasıl bir mantıksal akış kuracaksın? İyi bir plan, üç dört ana fikri mantıklı bir sırayla ve her birini bir örnekle dizer. Bu iskelet hazır olduğunda, yazım aşaması çok daha hızlı ve düzenli akar.","t":"p"},{"lines":["1. Metin türü, kitle ve register'ı yaz.","2. Türün imza öğelerini listele (başlık, hitap, imza, alt başlık, tarih).","3. Üç dört ana fikir seç; her birinin yanına bir örnek/geliştirme notu düş.","4. Fikirleri mantıklı bir sıraya koy.","5. Güçlü bir açılış cümlesi kur; metnin geri kalanı onu izleyecek."],"t":"note","k":"protokol","title":"Beş dakikalık planlama rutini"},{"x":"Yazım: Yapıyı Kurmak","t":"h"},{"x":"Yazıma güçlü bir açılışla başla. Açılış hem türü ele vermeli (makalede başlık ve kanca, mektupta hitap ve amaç, konuşmada selamlama) hem de okurun ilgisini çekmelidir. Ardından gövdeyi planına göre böl; her paragraf tek bir ana fikre odaklansın ve o fikri iddia-açıklama-örnek-sonuç zinciriyle geliştirsin. Paragraflar arası geçişleri bağlaçlarla yumuşat, böylece metin akıcı bir bütün olur. Son olarak türe uygun bir kapanışla bitir: makalede düşündüren bir soru, mektupta beklenen eylem, konuşmada güçlü bir çağrı. Yapı, okuru elinden tutup metnin içinde gezdirmektir.","t":"p"},{"x":"Yazarken register'ı baştan sona sabit tutmaya özellikle dikkat et; en sık kayma, metnin ortasında ve sonunda olur. Resmi bir metinde kısaltma kullanmamak, gayriresmi bir metinde ise sıcak ve doğrudan kalmak için ilk cümlede verdiğin tonu her paragrafta yenile. Ayrıca kitleni sürekli zihninde tut: bu okur bu kelimeyi anlar mı, bu tonu bekler mi, bu örnek ona hitap eder mi? Register ve kitle bilinci, yazının her cümlesinde görünür olmalıdır; işte Criterion C bu tutarlılığı ödüllendirir.","t":"p"},{"t":"h","x":"Üç Kriteri Sınav Anında Uygulamak"},{"t":"p","x":"Criterion A (Language) için sınav anında yapabileceğin en etkili şey, kelime ve yapı çeşitliliğini bilinçli aramaktır. Aynı kelimeyi iki kez kullanmak üzereyken bir eş anlamlı düşün; aynı cümle yapısını tekrarlıyorsan bir sonrakini farklı kur. Ama riskli, emin olmadığın yapılara girme; basit ama doğru, karmaşık ama hatalıdan iyidir. Yazarken içinden bir denetçi çalıştır: bu cümle dilbilgisel olarak doğru mu, bu kelime bu bağlamda yerinde mi? Küçük ama tutarlı doğruluk, gösterişli ama hatalı denemelerden daha çok puan getirir."},{"t":"p","x":"Criterion B (Message) için en önemli hamle, her fikri geliştirmektir. Bir iddiayı yazdıktan sonra dur ve sor: bunu bir örnekle, bir ayrıntıyla veya bir sonuçla destekledim mi? Yüzeysel kalmak, bu kriterin en büyük puan kaybıdır. Ayrıca görevin istediği her şeyi karşıladığından emin ol; görev iki soru soruyorsa ikisini de yanıtla, bir bağlam veriyorsa onu kullan. Fikirlerinin göreve ilgili, geliştirilmiş ve düzenli olması, Criterion B'nin üç ayağıdır; her paragrafta bu üçünü kontrol et."},{"t":"p","x":"Criterion C (Conceptual understanding) için sınav anında metin türünü ve register'ı korumaya odaklan. Seçtiğin türün imza öğelerini metnine yerleştirdiğinden emin ol ve register'ı tek bir kez bile bozmamaya çalış. Yazarken ara ara dur ve sor: bu hala bir makale/mektup/konuşma gibi mi duruyor, ton tutarlı mı, kitleye uygun mu? Bu kriter, English B'yi genel bir yazma dersinden ayıran şeydir; türü ve tonu doğru tutturmak, teknik olarak en kolay ama en çok ihmal edilen puan kaynağıdır."},{"x":"Kelime Sayısı ve Zaman Disiplini","t":"h"},{"t":"p","x":"Kelime sınırına uymak, hem bir kural hem bir strateji meselesidir. Çok kısa yazmak (alt sınırın altında) fikirlerini geliştirecek alan bırakmaz ve Criterion B'yi zayıflatır. Aşırı uzun yazmak ise dil hatalarını çoğaltır, süreni tüketir ve son kontrole vakit bırakmaz. Hedef bandın içinde kalmayı planla; SL için 250-400, HL için 450-600 kelime aralığı fikirlerini geliştirmen için yeterli ama kontrol edebileceğin bir alandır. Yazarken yaklaşık kelime sayını takip et; bir paragrafın ne kadar yer kapladığını bilirsen, bandı tutturmak kolaylaşır."},{"x":"Zaman disiplini için 75 dakikayı böl: yaklaşık beş dakika planlama, elli beş dakika yazım ve on beş dakika kontrol ve düzeltme. Bu dağılım kesin değildir ama bir çerçeve sunar; en önemli ilke, sona mutlaka kontrol için zaman bırakmaktır. Çoğu öğrenci son dakikaya kadar yazar ve düzeltme yapamaz; oysa son okumada yakalanan basit hatalar, hazır puanlardır. Saatini düzenli kontrol et ve yazım süresi dolduğunda, ne olursa olsun kontrole geç. İyi yönetilen bir zaman, orta seviye bir yazıyı iyi bir yazıya dönüştürebilir.","t":"p"},{"t":"h","x":"Son Kontrol ve Sık Hatalar"},{"t":"p","x":"Son on beş dakikada metnini bir okur gibi baştan oku ve şu kontrol listesini uygula: metin türü doğru ve imza öğeleri yerinde mi; register baştan sona tutarlı mı; her ana fikir bir örnekle geliştirilmiş mi; göze çarpan dilbilgisi ve yazım hataları var mı; kelime hedefine ulaştın mı? Bu son okuma, hem yapısal hem dilsel boşlukları kapatır. Özellikle fiil zamanları, özne-yüklem uyumu, artikel kullanımı ve noktalama gibi sık hataları ara; bunlar küçük ama tekrarlandığında Criterion A'yı düşürür."},{"x":"Paper 1'in en sık hataları şunlardır: görevi yanlış okuyup yanlış türde yazmak; register'ı ortada bozmak; fikirleri geliştirmeden yüzeysel geçmek; kelime sınırının çok altında veya çok üstünde kalmak; ve sona kontrol için zaman bırakmamak. Bu hataların hepsi önlenebilir ve hepsinin çözümü aynı yerde başlar: dikkatli okuma ve iyi planlama. Sınav pratiği yaparken bu hataları kendi yazılarında ara ve her birini bilinçli olarak düzelt; zamanla bu kontroller otomatikleşir.","t":"p"},{"x":"Örnek Bir Görev Üzerinden Düşünmek","t":"h"},{"t":"p","x":"Bir görevi nasıl çözeceğini somutlaştıralım. Diyelim ki görev şu: 'Your school is considering banning mobile phones during break times. Write a text for the school website expressing your view on this proposal.' İlk adımda anahtar kelimeleri belirlersin: 'expressing your view' seni bir görüş yazısına yönlendirir; 'school website' kitleyi (öğrenciler, veliler, öğretmenler) ve register'ı (yarı resmi) verir; 'this proposal' ise somut bir konu sunar. İkinci adımda net bir tez alırsın: yasağı destekliyor musun, karşı mısın? Üçüncü adımda iki üç argüman ve her birine bir örnek planlarsın, karşı görüşü de anıp çürütmeyi not edersin. Dördüncü adımda güçlü bir açılış kurarsın. Görevi böyle çözdüğünde, yazım aşamasına geçmeden önce metnin iskeleti zaten hazırdır."},{"t":"p","x":"Bu örnekte dikkat edilmesi gereken incelik, görevin türü açıkça söylememesidir; 'expressing your view' ifadesinden türü sen çıkarırsın. Birçok Paper 1 görevi türü doğrudan söyler ('write an article', 'write a letter') ama bazıları böyle ipuçlarıyla ima eder. Bu yüzden görevdeki her kelimeyi dikkatle oku; 'view', 'persuade', 'inform', 'describe your experience' gibi fiiller ve 'for the website', 'to the mayor', 'in the school magazine' gibi bağlamlar, türü ve kitleyi ele verir. Bu ipuçlarını doğru okumak, doğru türü seçmenin ve dolayısıyla Criterion C'yi kazanmanın anahtarıdır."},{"x":"Unutma: Paper 1 bir hız yarışı değil, bir karar ve uygulama sınavıdır. Doğru görevi seç, birkaç dakika planla, üç kriteri bilinçli uygula, kelime ve zaman bandını yönet ve sona kontrol için vakit bırak. Bu disiplinli akış, aynı dil seviyesindeki iki öğrenci arasında en büyük farkı yaratan şeydir. Sınav yapısına, kelime sınırlarına ve kriter bant açıklamalarına dair tüm ayrıntıları her zaman okulunun elindeki güncel resmi IB English B Guide'dan doğrula; burada verilen bilgiler öğretim amaçlıdır ve resmi kılavuz esas alınmalıdır.","t":"p"},{"t": "p", "x": "Bir görev seç, metin türünü belirle, o türün kurallarına göre yaz. Yazdıktan sonra kontrol listesini işaretle, sonra modeli aç."}, {"t": "task", "title": "Örnek görev", "lines": ["Your school is encouraging students to learn a second language. Write a text for the school blog in which you share your own experience and encourage other students to start.", "Metin türü: blog. Kitle: okul öğrencileri. Amaç: deneyim paylaşmak ve teşvik etmek."]}, {"t": "given", "title": "Blog hatırlatması", "x": "Tarih veya samimi başlık. Birinci tekil şahıs. Kişisel anlatı ve duygu. Okura doğrudan seslenme (you). Teşvik eden bir kapanış."}, {"t": "wizard", "wt": "blog", "prompt": null, "target": 220, "check": ["Doğru metin türünü seçtim ve o türün açılış, düzen ve register kurallarına uydum.", "Prompt'un istediği amacı ve kitleyi karşıladım (Criterion B).", "Fikirlerimi örnekle geliştirdim, yüzeysel bırakmadım.", "Kelime çeşitliliği kullandım, aynı kelimeyi tekrarlamadım (Criterion A).", "Ton ve register kitleme uygun (Criterion C).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (blog)", "x": "Why Learning Spanish Changed My Year\n\nThis time last year, I could barely say hello in another language. Today, I can hold a real conversation in Spanish, and I want to tell you how it happened, because if I can do it, so can you.\n\nHonestly, I only started because a friend dragged me along to a club. At first it was frustrating. I mixed up words, I froze in the middle of sentences, and I nearly gave up more than once. But something changed when I stopped worrying about being perfect. I began watching Spanish shows, labelling things in my room, and chatting with an exchange student at lunch. Little by little, the language stopped feeling like a subject and started feeling like a door.\n\nWhat surprised me most was not the grammar. It was the confidence. Speaking a second language taught me that I can be bad at something and still keep going, and that lesson has helped me far beyond the classroom.\n\nSo here is my honest advice: do not wait until you feel ready. Pick a language, make a few mistakes today, and enjoy them. Your future self will thank you."}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Metin türünün biçimini görünür yap. Blogda başlık ve doğrudan seslenme, konuşmada retorik soru, mektupta resmi hitap. Değerlendirici Criterion C'yi buradan okur.", "Fikri örnekle geliştir. Genel cümle değil, kişisel somut örnek."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"x":"İpuçları ve Tuzaklar: Sınavın Bütününe Bakış","t":"h"},{"t":"p","x":"English B üç bileşenden oluşur ve her birinin kendine has stratejileri ve tuzakları vardır. Paper 1 yazma becerini (%25), Paper 2 hem okuma hem dinleme yani alımlama becerilerini (%50) ve Individual Oral konuşma becerini (%25) ölçer. Bu ders, üç bileşen için de pratik ipuçlarını ve en sık düşülen tuzakları bir araya getirir. Amaç, dil bilgini artırmak değil (o alt derslerin işi), o bilgiyi sınav anında en verimli biçimde kullanmanı sağlamaktır. İyi bir öğrenci ile iyi bir sınav öğrencisi arasındaki fark, çoğu zaman burada anlatılan strateji ve dikkat noktalarında saklıdır. Tüm bileşenlerin güncel yapısını okulunun elindeki resmi IB English B Guide'dan teyit et."},{"x":"Paper 1 için Altın Kurallar","t":"h"},{"t":"p","x":"Paper 1'de en çok puan, metin türünü doğru seçip o türün kurallarına uymaktan gelir. Üç görev arasından, en iyi bildiğin konuyu değil, türüne en hakim olduğun görevi seç. Yazmadan önce mutlaka birkaç dakika planla: tür, kitle, register ve üç dört ana fikir. Register'ı baştan sona tutarlı taşı; en sık kayma metnin ortasında olur. Her fikri bir örnekle geliştir, yüzeysel bırakma. Kelime bandının içinde kal ve sona kontrol için zaman ayır. Bu kurallar basit görünür ama sınav baskısı altında en çok ihmal edilenlerdir; onları rutin haline getirirsen puanın belirgin biçimde yükselir."},{"x":"Paper 1'in en sinsi tuzağı, görevi hızlı okuyup yanlış anlamaktır. Görevin istediği türü, kitleyi ve amacı yanlış çözersen, mükemmel bir dille bile yanlış hedefe yazarsın ve Criterion C'den ciddi puan kaybedersin. İkinci tuzak, gösteriş için riskli yapılara ve emin olmadığın ileri kelimelere yönelmektir; bunlar hata üretir ve Criterion A'yı düşürür. Basit ama doğru olan, karmaşık ama hatalıya her zaman üstündür. Üçüncü tuzak, imza öğelerini unutmaktır; başlıksız makale, hitapsız mektup, seslenmesiz konuşma türü belirsizleştirir. Bu üç tuzağın panzehiri aynıdır: dikkatli okuma ve disiplinli plan.","t":"p"},{"x":"Paper 2 Okuma (Reading): Strateji","t":"h"},{"t":"p","x":"Paper 2'nin okuma bölümünde üç farklı yazılı metin ve toplam kırk puanlık soru bulunur; metinler beş prescribed theme etrafında döner ve giderek zorlaşır. En etkili strateji, önce soruları okuyup sonra metne dönmektir. Soruları bildiğinde, metni amaçlı okursun: her soru sana metnin belirli bir yerine işaret eder ve gereksiz ayrıntıda boğulmazsın. Metin türünü tanımak da işini kolaylaştırır; bir makalenin, mektubun veya blogun nereye ne koyduğunu bildiğinde, aradığın bilgiyi daha hızlı bulursun. Zamanını üç metne dengeli dağıt ve zor bir soruda takılıp kalma; işaretleyip geç, sona döner tamamlarsın."},{"x":"Okuma bölümünün en yaygın tuzağı, sorunun tam olarak ne istediğini yanlış anlamaktır. Bazı sorular metinden doğrudan bir bilgi ister (açık bilgi), bazıları ise metnin ima ettiği bir sonucu ister (çıkarım). Çıkarım sorularında, metnin söylediklerinden mantıken çıkan yanıtı seç; kendi genel bilgini veya metnin bir adım ötesini değil. İkinci tuzak, kelime tuzağıdır: yanlış bir şık çoğu zaman metindeki bir kelimeyi aynen içerir ama anlamı çarpıtır. Yanıtı, tek bir kelime eşleşmesine göre değil, cümlenin tam anlamına göre seç. Soru kökündeki 'not', 'except', 'best' gibi kelimeleri de kaçırma; bunlar yanıtı tersine çevirebilir.","t":"p"},{"t":"note","k":"ipucu","title":"Okuma bölümü için hızlı taktikler","lines":["Önce soruları oku, sonra metne amaçlı dön.","Metin türünü tanı; bilgi genelde türün beklenen yerindedir.","Çıkarım sorularında metnin söylediğinden çık, bir adım fazlasına gitme.","Tek kelime eşleşmesine kanma; cümlenin tam anlamına bak.","Zor soruyu işaretle, geç, sona dön; zamanı üç metne dengeli dağıt."]},{"t":"h","x":"Paper 2 Dinleme (Listening): Strateji"},{"x":"Paper 2'nin dinleme bölümünde üç ses kaydı ve toplam yirmi beş puanlık soru bulunur. Her kayıt genellikle iki kez dinletilir; bu iki dinlemeyi farklı amaçlarla kullan. İlk dinlemede genel resmi yakala: konu ne, kim konuşuyor, ana fikir nedir? İkinci dinlemede ayrıntılara odaklan ve yanıtlarını netleştir. Dinlemeden önce soruları okumaya vakit ayır; ne dinleyeceğini bildiğinde, doğru anları yakalarsın. Anahtar kelimeleri ve sayıları, tarihleri, isimleri özellikle dinle; bunlar sık sorulur. Bir yanıtı kaçırdıysan panik yapma; sonraki soruya odaklan, yoksa zinciri kaybedersin.","t":"p"},{"x":"Dinleme bölümünün en büyük tuzağı, 'kelime tuzağı' veya 'distractor' denen çeldiricilerdir. Konuşmacı çoğu zaman bir bilgiyi söyler, sonra düzeltir veya değiştirir ('We first planned to meet on Monday, but we moved it to Wednesday'). İlk duyduğun bilgiye atlarsan yanılırsın; cümlenin tamamını dinle ve son karara odaklan. İkinci tuzak, sorudaki kelimenin kayıtta aynen geçmesini beklemektir; kayıt genellikle eş anlamlı ifadeler kullanır. Anlamı dinle, kelimeyi değil. Yazım da önemlidir; yanıtı yazarken doğru yazdığından emin ol, çünkü yanlış yazım puan kaybettirebilir. Dinlerken kısa notlar al, ama not almaya dalıp dinlemeyi kaçırma.","t":"p"},{"lines":["Dinlemeden önce soruları oku; ne arayacağını bil.","İlk dinlemede ana fikri, ikincide ayrıntıyı yakala.","Çeldiricilere dikkat: konuşmacı bilgiyi düzeltebilir, son karara odaklan.","Eş anlamlıları dinle; sorudaki kelime kayıtta birebir geçmeyebilir.","Bir soruyu kaçırırsan bırak, sonrakine odaklan; zinciri koru."],"k":"ipucu","t":"note","title":"Dinleme bölümü için hızlı taktikler"},{"x":"Individual Oral: Hazırlık ve Sunum","t":"h"},{"t":"p","x":"Individual Oral, konuşma becerini ölçen iç değerlendirmedir ve yaklaşık on iki ile on beş dakika sürer. SL öğrencileri bir GÖRSEL (visual stimulus) üzerine konuşur; HL öğrencileri ise okudukları iki edebi eserden alınmış bir EDEBİ ALINTI (literary extract) üzerine konuşur. Sınav üç aşamalıdır: yaklaşık üç dört dakikalık bir sunum, ardından öğretmenle sunum üzerine bir tartışma ve son olarak farklı bir tema üzerine genel bir sohbet. Hazırlık için SL öğrencilerine on beş, HL öğrencilerine yirmi dakika verilir. Bu yapıyı ve süreleri güncel resmi IB English B Guide'dan mutlaka teyit et; ayrıntılar güncellenebilir."},{"x":"Sunumun güçlü olması için görseli veya alıntıyı üç katmanda ele al: betimle, yorumla ve bir prescribed theme ile ilişkilendir. Önce ne gördüğünü veya okuduğunu betimle (kim, ne, nerede); sonra bunun ne anlama geldiğini, hangi mesajı verdiğini yorumla; en sonda bunu daha geniş bir temaya (identities, sharing the planet gibi) bağla. Bu üç katmanlı yapı, sunumunu yüzeysel bir betimlemenin ötesine taşır ve kavramsal derinlik gösterir. Sunumunu ezberleme; bir plan etrafında doğal konuş. Ezber metin, bir soruyla bölündüğünde çöker; plana dayalı konuşma ise esnek ve dayanıklıdır.","t":"p"},{"t":"p","x":"Individual Oral dört ölçütle değerlendirilir: Criterion A dil hakimiyetini (kelime, dilbilgisi, telaffuz, akıcılık), Criterion B1 görsel veya alıntıdan fikir geliştirmeni, Criterion B2 sohbette fikir geliştirmeni ve Criterion C etkileşim becerini (öğretmenin sorularını anlayıp geliştirerek yanıtlama) ölçer. En sık tuzak, tartışma ve sohbet aşamasında kısa, tek kelimelik yanıtlar vermektir; bu Criterion B2 ve C'yi düşürür. Her yanıtı gerekçe ve örnekle geliştir, öğretmenle gerçek bir sohbet kur. Bir soruyu anlamadıysan, tekrar istemek yanlış anlamaktan iyidir. Akıcılık, kusursuzluktan önce gelir; küçük hatalar yapsan bile düşünerek ve gelişterek konuşmak yüksek puan getirir."},{"t":"h","x":"Genel Dil ve Zaman Tuzakları"},{"x":"Tüm bileşenlerde geçerli birkaç genel tuzak vardır. Birincisi, zaman yönetimi eksikliğidir; her bölümde saatini kontrol et ve tek bir soruda veya paragrafta boğulma. İkincisi, panik ve kilitlenmedir; kaçırdığın bir soru veya kelime, sonrakini de kaçırmana yol açar. Bir şeyi kaçırdığında bırak ve devam et. Üçüncüsü, kendi genel bilgini metnin veya kaydın söylediğinin yerine koymaktır; yanıtların daima kaynaktan çıkmalıdır. Dördüncüsü, talimatları okumamaktır; her bölümün kendi yönergesi vardır ve onu atlamak kolayca puan kaybettirir.","t":"p"},{"x":"Dil açısından en yaygın tuzak, gösteriş yapmaya çalışıp hata üretmektir. Sınavın hiçbir bölümünde en süslü kelimeyi kullanan kazanmaz; en uygun ve doğru ifadeyi kullanan kazanır. Emin olmadığın bir yapıya girmek yerine, bildiğin yapıları çeşitlendirerek kullan. Aynı şekilde, ezber kalıplara aşırı yaslanmak da yapaylık üretir; kalıpları amaca hizmet ettikleri yerde, doğal bir akış içinde kullan. Dilin amacı iletişimdir; anlaşılır, uygun ve doğru olmak, gösterişli ama kusurlu olmaktan her zaman değerlidir. Bu ilke English B'nin tüm bileşenlerinin ortak felsefesidir.","t":"p"},{"x":"Hazırlık Döneminde Ne Yapmalı?","t":"h"},{"x":"Sınav stratejileri ancak hazırlık döneminde inşa edilen bir temele oturursa işe yarar. Okuma ve dinleme becerini geliştirmenin en etkili yolu, düzenli ve çeşitli maruz kalmadır: İngilizce makaleler, podcast'ler, röportajlar ve videolar, beş prescribed theme etrafında dönen gerçek malzemelerdir. Bunları tüketirken pasif kalma; okuduğun bir metnin türünü tanı, bir konuşmacının tonunu fark et, yeni kelimeleri bağlamlarıyla not al. Kelime dağarcığını temalar etrafında örgütle; 'sharing the planet' için çevre kelimeleri, 'human ingenuity' için teknoloji kelimeleri gibi. Bu tematik hazırlık, hem Paper 2'de metinleri anlamanı hem de Paper 1 ve oral'da fikir üretmeni kolaylaştırır.","t":"p"},{"x":"Yazma becerini geliştirmenin yolu ise düzenli pratik ve geri bildirimdir. Her metin türünü en az birkaç kez yaz; imza öğelerini ve register'ını tekrar tekrar uygulayınca bunlar refleks haline gelir. Yazdıklarını mümkünse bir öğretmene veya değerlendirme aracına göster ve üç kriter açısından geri bildirim al; nerede yüzeysel kaldığını, nerede register kaydırdığını görmek, aynı hatayı sınavda yapmamanı sağlar. Zamanlı pratik de önemlidir; gerçek sınav süresinde yazmak, hız ve zaman yönetimi becerini geliştirir. Hazırlık, sınav gününü bir sürpriz olmaktan çıkarır ve tanıdık bir rutine dönüştürür.","t":"p"},{"x":"Individual Oral için hazırlık, konuşma pratiği ister. Görselleri betimleme, yorumlama ve temaya bağlama alıştırması yap; HL öğrencisiysen okuduğun iki edebi eserin temalarını, karakterlerini ve önemli pasajlarını iyi tanı, çünkü alıntı bunlardan gelecek. Sesli konuşma pratiği yap; düşüncelerini akıcı biçimde, duraklamadan ifade etmeyi ancak tekrar ederek geliştirirsin. Bir arkadaşınla veya aynada, bir görsel üzerine üç dört dakika konuşmayı dene ve kendini kaydet; kendini dinlemek, akıcılık ve telaffuz eksiklerini görmenin en hızlı yoludur. Konuşma, en az yazma kadar pratik gerektiren bir beceridir.","t":"p"},{"t":"h","x":"Sınav Günü Zihniyeti"},{"t":"p","x":"Son olarak, sınav günü zihniyeti performansını doğrudan etkiler. Her bölüme bir rutinle gir: Paper 1'de önce oku ve planla; Paper 2 okumada önce soruları tara; dinlemede önce soruları oku; oral'da hazırlık süresini üç katmanlı plan için kullan. Rutin, paniği bir sürece dönüştürür ve zihnini serbest bırakır. Bir hata yaptığında veya bir soruyu kaçırdığında kendini yargılama; bir bölümdeki tek bir kayıp, tüm sınavı belirlemez. Sakin, sistemli ve amaçlı çalış. Hazırlık döneminde bu ipuçlarını gerçek sınav koşullarında prova et; strateji, ancak tekrar edildiğinde refleks haline gelir ve gerçek sınavda seni taşır. Tüm bileşenlerin güncel yapısını ve kurallarını resmi IB English B Guide'dan doğrulamayı unutma."},{"t": "note", "k": "dikkat", "title": "Metin türü", "lines": ["Önce kitle ve amacı bul, tür ondan çıkar. Yanlış tür Criterion C'yi düşürür.", "Türün biçimsel işaretlerini koy: blogda başlık ve you, konuşmada selamlama ve retorik soru, mektupta Dear ve Yours sincerely."]}, {"t": "note", "k": "ipucu", "title": "Dil (Criterion A)", "lines": ["Basit ama doğru cümle, karmaşık ama hatalı cümleden iyidir.", "Aynı kelimeyi tekrarlama. good yerine valuable, effective, worthwhile."]}, {"t": "note", "k": "ipucu", "title": "Mesaj (Criterion B)", "lines": ["Prompt iki şey istiyorsa ikisini de yap (deneyim paylaş VE teşvik et).", "Her fikri bir örnekle destekle. Yüzeysel liste değil, gelişmiş fikir."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id,done:{}};
function _griSlugsOf(node,out){if(!node||typeof node!=='object')return;if(Array.isArray(node)){for(var i=0;i<node.length;i++)_griSlugsOf(node[i],out);return;}for(var k in node){if(!Object.prototype.hasOwnProperty.call(node,k))continue;var v=node[k];if(k==='slug'&&typeof v==='string'&&v)out.push(v);else if(v&&typeof v==='object')_griSlugsOf(v,out);}}
async function loadProgress(){try{if(!window.GRI_SB||!window.GRI_UID)return;var map={},pre=null,n=0;D.lessons.forEach(function(l){var s=[];_griSlugsOf(l.blocks||[],s);s.forEach(function(sl){map[sl]=l.id;n++;pre=(pre===null)?sl:(function(a,b){var m=Math.min(a.length,b.length),i=0;while(i<m&&a[i]===b[i])i++;return a.slice(0,i);})(pre,sl);});});if(!n)return;var q=window.GRI_SB.from('user_answers').select('question_slug').eq('user_id',window.GRI_UID);if(pre&&pre.length>=6)q=q.like('question_slug',pre+'%');var r=await q;if(r&&r.data&&r.data.length){var hit=false;r.data.forEach(function(row){var lid=map[row.question_slug];if(lid){S.done[lid]=true;hit=true;}});if(hit)renderRail();}}catch(e){}}
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''} ${S.done[l.id]?'done':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz"${b.wt?` data-wt="${esc(b.wt)}"`:''}>`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">5 token</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).sort().map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');

      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';

    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}

function pickWType(types, wt){
  // IB modulu: wizard'in data-wt'sine gore ib text_type sec (blog, article, review, report...)
  const av=types.filter(t=>String(t.exam||'').toLowerCase()==='ib'&&!t.is_coming_soon&&t.is_active!==false);

async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types, wz.dataset.wt);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
