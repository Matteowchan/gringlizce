<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gri SAT . Math</title>
<meta name="description" content="Digital SAT Math drilleri. Heart of Algebra, Problem Solving and Data, Advanced Math, Geometry ve Trigonometri. Cozumlu, Turkce aciklamali.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EFE7D8; --ink:#26201A; --muted:#8A7F6E; --line:#E3D8C5;
  --accent:#2E6E6A; --accent-deep:#123C39; --accent-soft:#DDEBE9; --panel:#E7F0EE;
  --good:#2E6E4E; --good-soft:#DCEBE1; --wrong:#A8382F; --wrong-soft:#F2E1DC;
  --paper:#FBF6EC; --card:#FCFAF4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
.shell{max-width:1180px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:32px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:0 0 34px;overflow:hidden}
.pad{padding:0 34px}
.rail{width:262px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:1.9rem;margin:.3rem 0 .15rem;line-height:1.14;color:var(--ink)}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.3rem;margin:26px 0 5px}
.rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:0 0 15px}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 17px;border-radius:22px;cursor:pointer;border:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}
.dt{border-collapse:collapse;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:8px 0 14px}
.dt th,.dt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.note .nt{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#E4C4BC}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:rgba(0,0,0,.08)}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#C4DCCB}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:rgba(0,0,0,.08)}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:12px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:11px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:6px}
.drill .da{display:none;font-size:13.5px;color:var(--good);background:var(--good-soft);border:1px solid #C4DCCB;border-radius:9px;padding:8px 11px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:600;color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent);border-radius:18px;padding:4px 12px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:5px 12px}
.qz{border-top:1px solid var(--line);padding:11px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:7px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:linear-gradient(90deg,var(--good-soft),transparent)}
.qz.incorrect{background:linear-gradient(90deg,var(--wrong-soft),transparent)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:7px;border-radius:9px;padding:7px 11px}
.qz .qzfb.ok{background:var(--good-soft);color:#1d4a34;border:1px solid #C4DCCB}
.qz .qzfb.no{background:var(--wrong-soft);color:#7c2a23;border:1px solid #E4C4BC}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:11px 15px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:12px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:5px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:9px;align-items:flex-start;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;background:#fff}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;font-weight:700;color:var(--accent-deep)}
.mcq.correct{background:linear-gradient(90deg,var(--good-soft),transparent)}
.mcq.incorrect{background:linear-gradient(90deg,var(--wrong-soft),transparent)}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:8px;border-radius:9px;padding:8px 11px}
.mcq .mfb.ok{background:var(--good-soft);color:#1d4a34;border:1px solid #C4DCCB}
.mcq .mfb.no{background:var(--wrong-soft);color:#7c2a23;border:1px solid #E4C4BC}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 18px rgba(24,40,60,.06)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:3px 9px;border-radius:20px}
.rc .ut{font-family:"Playfair Display",serif;font-size:1.02rem;color:var(--ink);margin:9px 0 12px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.rlink{display:flex;align-items:center;gap:9px;font-family:Inter,sans-serif;font-size:13.5px;padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.rlink:last-child{border-bottom:none}.rlink:hover{background:var(--accent-soft)}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<script src="assets/nav.js"></script>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}
/* face lift */
h1{letter-spacing:-.012em}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.btn{box-shadow:0 1px 2px rgba(30,20,10,.12);transition:filter .14s,transform .06s,box-shadow .14s}
.btn:hover{box-shadow:0 3px 10px rgba(30,20,10,.14)}
.btn:active{transform:translateY(1px)}
.rc{box-shadow:0 8px 28px rgba(30,25,18,.08)}
.rlink{transition:background .12s,box-shadow .12s}
.rlink.cur{box-shadow:inset 3px 0 0 var(--accent)}
.mcq .opts label,.opts label{transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:active,.opts label:active{transform:translateY(1px)}
.chip{transition:transform .1s}.chip:hover{transform:translateY(-1px)}
.head{position:relative}
.qz.correct,.mcq.correct{box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect,.mcq.incorrect{box-shadow:inset 3px 0 0 var(--wrong)}
</style>

<script id="data" type="application/json">{"title": "SAT Math", "badge": "SAT", "groups": ["Öğren", "4 Konu"], "lessons": [{"id": "basla", "group": "Öğren", "name": "SAT Math Yapısı", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "Digital SAT Math iki modülden oluşur, tamamında hesap makinesi serbesttir. Dört ana konu vardır. Bu modül her konuyu çözümlü çoktan seçmeli sorularla çalıştırır."}, {"t": "table", "head": ["Konu", "İçerik"], "rows": [["Heart of Algebra", "Lineer denklemler, eşitsizlikler, denklem sistemleri, grafikler."], ["Problem Solving and Data", "Oran, yüzde, hız, ortalama, veri yorumlama."], ["Advanced Math", "Karesel denklemler, üsler, fonksiyonlar, çarpanlara ayırma."], ["Geometry and Trigonometry", "Alan, çevre, açılar, Pisagor, çember, temel trigonometri."]]}, {"t": "note", "k": "ipucu", "title": "Strateji", "lines": ["Soruyu çözmeden şıklara bakma. Kendi cevabını bul, sonra eşleştir.", "Şıklardan geri gitmek (plugging in) bazen en hızlı yoldur, özellikle değişkenli sorularda.", "Birim ve işaret hatalarına dikkat. SAT tuzağı çoğu zaman doğru sayı, yanlış işaret veya birimdir."]}]}, {"id": "algebra", "group": "4 Konu", "name": "1. Heart of Algebra", "eyebrow": "Konu 1", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["Lineer denklemde değişkeni yalnız bırak: aynı işlemi iki tarafa uygula.", "Eşitsizlikte iki tarafı negatif sayıyla çarpar veya bölersen yön değişir.", "Sistemde ekleme veya yerine koyma ile bir değişkeni yok et."]}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "If 3x + 7 = 22, what is the value of x?", "choices": {"A": "3", "B": "9", "C": "7", "D": "5"}, "ans": "D", "why": "3x = 22 - 7 = 15, x = 5."}, {"n": 2, "stem": "If 2(x - 4) = 10, what is the value of x?", "choices": {"A": "3", "B": "9", "C": "7", "D": "1"}, "ans": "B", "why": "2x - 8 = 10, 2x = 18, x = 9."}, {"n": 3, "stem": "A line has slope 2 and passes through (0, -3). What is its equation?", "choices": {"A": "y = 2x + 3", "B": "y = -3x + 2", "C": "y = 2x - 3", "D": "y = -2x - 3"}, "ans": "C", "why": "Eğim 2, y-kesişimi -3. y = mx + b = 2x - 3."}, {"n": 4, "stem": "If 5x - 3 > 12, which of the following is a possible value of x?", "choices": {"A": "1", "B": "2", "C": "3", "D": "4"}, "ans": "D", "why": "5x > 15, x > 3. Yalnızca 4 bu koşulu sağlar."}, {"n": 5, "stem": "If x + y = 10 and x - y = 4, what is the value of x?", "choices": {"A": "3", "B": "5", "C": "7", "D": "6"}, "ans": "C", "why": "İki denklemi topla: 2x = 14, x = 7."}, {"n": 6, "stem": "A phone plan costs $20 per month plus $0.10 per text. Which expression gives the total monthly cost for t texts?", "choices": {"A": "20t + 0.1", "B": "20 + 0.1t", "C": "0.1(20 + t)", "D": "20 + 10t"}, "ans": "B", "why": "Sabit 20, mesaj başına 0.10, t mesaj: 20 + 0.1t."}]}]}, {"id": "data", "group": "4 Konu", "name": "2. Problem Solving and Data", "eyebrow": "Konu 2", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["Yüzde indirim: yeni fiyat = fiyat x (1 - indirim). %25 indirim = x 0.75.", "Ortalama = toplam / adet. Toplam = ortalama x adet.", "Oran problemlerinde birim değeri bul, sonra ölçekle."]}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "A shirt that normally costs $40 is on sale for 25% off. What is the sale price?", "choices": {"A": "$30", "B": "$15", "C": "$10", "D": "$35"}, "ans": "A", "why": "%25 indirim = %75 ödenir. 40 x 0.75 = $30."}, {"n": 2, "stem": "If 3 apples cost $1.50, how much do 10 apples cost at the same rate?", "choices": {"A": "$4.00", "B": "$4.50", "C": "$6.00", "D": "$5.00"}, "ans": "D", "why": "Bir elma 1.50 / 3 = $0.50. 10 elma = $5.00."}, {"n": 3, "stem": "A car travels 150 miles in 3 hours. What is its average speed?", "choices": {"A": "30 mph", "B": "45 mph", "C": "60 mph", "D": "50 mph"}, "ans": "D", "why": "Hız = yol / süre = 150 / 3 = 50 mph."}, {"n": 4, "stem": "The average of four numbers is 12. What is their sum?", "choices": {"A": "3", "B": "16", "C": "48", "D": "36"}, "ans": "C", "why": "Toplam = ortalama x adet = 12 x 4 = 48."}, {"n": 5, "stem": "In a class of 30 students, 18 are girls. What percent of the class are boys?", "choices": {"A": "12%", "B": "60%", "C": "40%", "D": "30%"}, "ans": "C", "why": "Erkek = 30 - 18 = 12. 12 / 30 = 0.40 = %40."}, {"n": 6, "stem": "The ratio of cats to dogs is 3 to 5. If there are 15 cats, how many dogs are there?", "choices": {"A": "9", "B": "18", "C": "5", "D": "25"}, "ans": "D", "why": "15 kedi = 3 x 5, yani ölçek 5. Köpek = 5 x 5 = 25."}]}]}, {"id": "advanced", "group": "4 Konu", "name": "3. Advanced Math", "eyebrow": "Konu 3", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["x^2 = a ise x = +sqrt(a) veya -sqrt(a). İki kök unutulmaz.", "Çarpanlara ayırma: x^2 + bx + c için çarpımı c, toplamı b olan iki sayı bul.", "Fonksiyonda f(3), x yerine 3 koymaktır. Üslerde 2^5 = 32 gibi değerleri bil."]}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "What are the solutions to x^2 - 9 = 0?", "choices": {"A": "x = 3 only", "B": "x = -3 only", "C": "x = 9", "D": "x = 3 or x = -3"}, "ans": "D", "why": "x^2 = 9, x = +3 veya -3. İki kök."}, {"n": 2, "stem": "If f(x) = 2x^2 + 1, what is f(3)?", "choices": {"A": "13", "B": "19", "C": "7", "D": "37"}, "ans": "B", "why": "f(3) = 2(3^2) + 1 = 2 x 9 + 1 = 19."}, {"n": 3, "stem": "Which of the following is the factored form of x^2 + 5x + 6?", "choices": {"A": "(x + 1)(x + 6)", "B": "(x + 2)(x + 3)", "C": "(x - 2)(x - 3)", "D": "(x + 5)(x + 1)"}, "ans": "B", "why": "Çarpımı 6, toplamı 5 olan sayılar 2 ve 3. (x+2)(x+3)."}, {"n": 4, "stem": "If 2^x = 32, what is the value of x?", "choices": {"A": "4", "B": "6", "C": "5", "D": "16"}, "ans": "C", "why": "2^5 = 32, yani x = 5."}, {"n": 5, "stem": "For x not equal to 2, the expression (x^2 - 4)/(x - 2) simplifies to:", "choices": {"A": "x + 2", "B": "x - 2", "C": "x^2", "D": "2"}, "ans": "A", "why": "x^2 - 4 = (x - 2)(x + 2). (x-2) sadeleşir, x + 2 kalır."}, {"n": 6, "stem": "What is the x-coordinate of the vertex of y = x^2 - 6x + 5?", "choices": {"A": "3", "B": "-3", "C": "6", "D": "5"}, "ans": "A", "why": "Tepe noktası x = -b / (2a) = 6 / 2 = 3."}]}]}, {"id": "geometry", "group": "4 Konu", "name": "4. Geometry ve Trigonometri", "eyebrow": "Konu 4", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["Dik üçgende Pisagor: a^2 + b^2 = c^2 (c hipotenüs).", "Çember: alan = pi r^2, çevre = 2 pi r = pi d. Üçgende iç açılar toplamı 180.", "Temel trig: sin = karşı/hipotenüs, cos = komşu/hipotenüs, tan = karşı/komşu."]}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "A right triangle has legs of length 3 and 4. What is the length of the hypotenuse?", "choices": {"A": "6", "B": "5", "C": "7", "D": "12"}, "ans": "B", "why": "3^2 + 4^2 = 9 + 16 = 25, hipotenüs = sqrt(25) = 5."}, {"n": 2, "stem": "What is the area of a circle with radius 5? (Use A = pi r^2)", "choices": {"A": "25 pi", "B": "10 pi", "C": "5 pi", "D": "50 pi"}, "ans": "A", "why": "A = pi x 5^2 = 25 pi."}, {"n": 3, "stem": "Two angles of a triangle measure 50 and 60 degrees. What is the third angle?", "choices": {"A": "70", "B": "80", "C": "90", "D": "60"}, "ans": "A", "why": "İç açılar toplamı 180. 180 - 50 - 60 = 70."}, {"n": 4, "stem": "A rectangle has length 8 and width 3. What is its perimeter?", "choices": {"A": "11", "B": "16", "C": "22", "D": "24"}, "ans": "C", "why": "Çevre = 2(uzunluk + genişlik) = 2(8 + 3) = 22."}, {"n": 5, "stem": "In a right triangle, the side opposite an angle is 6 and the hypotenuse is 10. What is the sine of that angle?", "choices": {"A": "0.8", "B": "0.6", "C": "0.75", "D": "1.67"}, "ans": "B", "why": "sin = karşı / hipotenüs = 6 / 10 = 0.6."}, {"n": 6, "stem": "What is the circumference of a circle with diameter 10? (Use C = pi d)", "choices": {"A": "10 pi", "B": "5 pi", "C": "20 pi", "D": "100 pi"}, "ans": "A", "why": "C = pi x d = pi x 10 = 10 pi."}]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
