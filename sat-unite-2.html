:root{
  --cream:#EFE7D8; --ink:#26201A; --muted:#8A7F6E; --line:#E3D8C5;

}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
[data-mode="lesson"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
[data-mode="practice"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
[data-mode="test"]{--accent:var(--warm);--accent-deep:var(--warm-deep);--accent-soft:var(--warm-soft);--panel:var(--warm-panel)}
.shell{max-width:1150px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:32px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:0 0 30px;overflow:hidden}
.pad{padding:0 34px}
.rail{width:248px;flex:none;position:sticky;top:20px}
@media(max-width:860px){.shell{flex-direction:column;gap:16px}.rail{width:100%;position:static}.pad{padding:0 20px}}
.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px;transition:background .45s,border-color .45s}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:1.95rem;margin:.3rem 0 .15rem;line-height:1.14;color:var(--ink)}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
.next{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 16px;border-radius:22px;cursor:pointer;border:none;transition:.14s}
.next:hover{filter:brightness(1.06)}
.backbtn{margin-top:13px;font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent);border-radius:22px;padding:7px 15px;cursor:pointer;transition:.14s}
.backbtn:hover{background:var(--accent-soft)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.32rem;margin:26px 0 5px}
.rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:0 0 15px;transition:background .45s}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 12px}
.rc{background:#FCFAF4;border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;box-shadow:0 3px 18px rgba(24,60,57,.06)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--unit);font-weight:700;padding:3px 9px;border-radius:20px}
.rc .ut{font-family:"Playfair Display",serif;font-size:1.05rem;color:var(--ink);margin:9px 0 14px;line-height:1.2}
.les{border-top:1px solid var(--line)}
.les .lh{display:flex;align-items:center;gap:10px;padding:11px 2px;font-family:Inter,sans-serif;font-size:13.5px}
.les .lh .n{width:23px;height:23px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#EDE4D3;color:var(--muted)}
.les.active .lh .n{background:var(--unit);color:#fff}
.les.done .lh .n{background:var(--unit);color:#fff}
.les .lh .lt{flex:1;color:var(--ink)}
.les.locked .lh{opacity:.45}
.les .sub{display:none;padding:2px 0 8px 33px}
.les.active .sub{display:block}
.les.active{background:var(--unit-tint);border-left:3px solid var(--unit);border-radius:0 11px 11px 0;margin:0 -8px 0 -16px;padding:0 8px 0 13px}
.les .sub a{display:flex;align-items:center;gap:9px;padding:7px 0;font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer}

.les .sub a.cur{color:var(--ink);font-weight:700}
.les .sub a.cur .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.les .sub a.ok .dot{background:var(--unit)}

.compass{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quad{position:relative;border-radius:11px;border:1px solid var(--line);background:#FFFDF8;padding:11px 11px;min-height:60px;overflow:hidden;transition:.4s}
.quad .qf{font-family:Inter,sans-serif;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;z-index:1;line-height:1.25}
.quad::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s}
.quad.mastered{border-color:var(--teal)}

.quad.mastered .qf{color:var(--teal-deep)}

.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 36px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;background:var(--accent-soft);color:var(--accent-deep);border-radius:50%;font-family:Inter,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trap{border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:11px;padding:13px 16px;margin:0 0 10px;background:var(--warm-panel)}
.trap b{font-family:Inter,sans-serif;font-size:13.5px;color:var(--warm-deep)}
.tips{padding-left:2px;list-style:none;margin:0}
.tips li{position:relative;padding:0 0 9px 20px}
.tips li::before{content:"";position:absolute;left:0;top:11px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.passage{color:#3a352d;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:13px 16px;margin:0 0 14px;transition:background .4s}
.stem{font-weight:500;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:#fff;cursor:pointer;margin-bottom:9px;transition:.14s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt .ltr{font-family:Inter,sans-serif;font-weight:700;font-size:12px;color:var(--muted);width:23px;height:23px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.correct{border-color:var(--teal);background:var(--teal-soft)}
.opt.correct .ltr{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.wrong .ltr{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt.locked{cursor:default;pointer-events:none}
.btn{font-family:Inter,sans-serif;font-weight:600;font-size:15px;border:none;border-radius:10px;padding:12px 24px;cursor:pointer;background:var(--accent);color:#fff;transition:.14s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--accent-deep);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.fb{border-radius:11px;padding:14px 16px;margin:16px 0 0;font-size:17px}
.fb.ok{background:var(--teal-soft);color:var(--teal-deep)}
.fb.no{background:var(--wrong-soft);color:#7a2222}
.tagline{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);margin-top:6px}
.remedbar{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.06em;color:var(--warm-deep);font-weight:700;text-transform:uppercase;background:var(--warm-soft);padding:5px 12px;border-radius:20px;margin-bottom:12px}
.qcount{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);margin-bottom:10px}
.done .big{font-family:"Playfair Display",serif;font-size:2.3rem;color:var(--accent-deep);text-align:center}
.mrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 15px;background:#FCFAF4;margin-bottom:8px}
.st{font-family:Inter,sans-serif;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px}
.st.good{background:var(--teal);color:#fff}.st.warn{background:var(--gold);color:#fff}
.note{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin:30px 34px 0;padding-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.dt{border-collapse:collapse;margin:0 0 14px;font-family:Inter,sans-serif;font-size:14.5px}

.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.dt td:first-child,.dt th:first-child{font-weight:600}
.les.locked .lh{opacity:1}
.les .lh{cursor:pointer}
.les.active .lh{cursor:default}

ite of deepening, so the policy was meant to reduce tension. 'Ease' fits.", "why_wrong": {"B": "'Inflame' means to worsen, the opposite of what the committee expected before tension deepened.", "C": "'Obliterate' points the right way (reducing) but is far too strong; wiping out tension entirely overshoots the sentence.", "D": "'Mediate' belongs to the world of committees and disputes but does not fit the slot; one mediates a dispute, not 'mediate the tension' in this sense."}}, {"id": "u2-l1-f1-02", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The critic praised the novel for its ______ prose, noting that not a single sentence felt padded or unnecessary.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "ornate", "B": "spare", "C": "legible", "D": "fictional"}, "correct": "B", "choice_families": {"A": "Ters anlam", "C": "Ikincil sozluk anlami", "D": "Cagrisim tuzagi"}, "why_correct": "'Not a single sentence felt padded' means the prose is stripped down, so 'spare' (lean, economical) fits.", "why_wrong": {"A": "'Ornate' means heavily decorated, the opposite of prose with nothing padded.", "C": "'Legible' concerns handwriting being readable, a different sense that does not describe a lean style.", "D": "'Fictional' is associated with a novel but does not describe the density of the prose the sentence is about."}}, {"id": "u2-l1-f1-03", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "Far from being ______, the ambassador's remarks were blunt enough to offend several delegates in the room.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "brutal", "B": "audible", "C": "tactful", "D": "diplomatic"}, "correct": "C", "choice_families": {"B": "Ikincil sozluk anlami", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Far from being ___ ... blunt enough to offend' means the remarks were the opposite of tactful, so 'tactful' correctly names what they were NOT.", "why_wrong": {"B": "'Audible' means able to be heard, a real word but the wrong sense for describing tactfulness.", "D": "'Diplomatic' fits the ambassador setting by association but, like the answer, would need the 'far from' frame; placed alone it competes weakly and is the topical lure here.", "A": "'Brutal' matches the blunt, offensive remarks rather than the quality they lacked, so it reverses the logic."}}, {"id": "u2-l1-f1-04", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The medication was expected to ______ the patient's symptoms, but after a week they had grown noticeably more severe.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "eradicate", "B": "aggravate", "C": "diagnose", "D": "alleviate"}, "correct": "D", "choice_families": {"B": "Ters anlam", "C": "Cagrisim tuzagi", "A": "Ton ve derece uyumsuzlugu"}, "why_correct": "'But ... grown more severe' shows the medication was expected to do the opposite: reduce symptoms. 'Alleviate' fits.", "why_wrong": {"B": "'Aggravate' means to worsen, which is what actually happened, not what was expected.", "C": "'Diagnose' is a medical-sounding word tied to the topic but names identifying an illness, not reducing symptoms.", "A": "'Eradicate' points the right way but is too absolute; wiping out symptoms entirely overshoots 'expected to reduce.'"}}, {"id": "u2-l1-f1-05", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The reforms were meant to ______ public trust in the agency, yet each new scandal left citizens more skeptical than before.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "restore", "B": "erode", "C": "audit", "D": "cement"}, "correct": "A", "choice_families": {"B": "Ters anlam", "C": "Cagrisim tuzagi", "D": "Ton ve derece uyumsuzlugu"}, "why_correct": "'Yet ... more skeptical' signals the reforms were meant to do the opposite of eroding trust, so 'restore' fits.", "why_wrong": {"B": "'Erode' means to wear away, matching the skepticism that grew rather than the intended repair.", "C": "'Audit' is associated with an agency but names a financial review, not the rebuilding of trust.", "D": "'Cement' points toward strengthening but is too strong for trust that must first be rebuilt; one cannot cement trust that is currently absent."}}, {"id": "u2-l1-f1-06", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "Rather than ______ the debate, the moderator's pointed questions only sharpened the disagreement between the candidates.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "escalating", "B": "defusing", "C": "scheduling", "D": "annihilating"}, "correct": "B", "choice_families": {"C": "Cagrisim tuzagi", "D": "Ton ve derece uyumsuzlugu", "A": "Ters anlam"}, "why_correct": "'Rather than ___ ... only sharpened the disagreement' means the moderator failed to do the opposite: calm the debate. 'Defusing' fits.", "why_wrong": {"C": "'Scheduling' is associated with a moderator's duties but does not fit calming a debate.", "D": "'Annihilating' aims the right way but is wildly too strong for easing a debate.", "A": "'Escalating' means intensifying, which is what happened, not the contrast the sentence sets up."}}, {"id": "u2-l1-f1-07", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The evidence was supposed to ______ the theory, but the new data instead confirmed it beyond reasonable doubt.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "publish", "B": "reinforce", "C": "undermine", "D": "demolish"}, "correct": "C", "choice_families": {"B": "Ters anlam", "D": "Ton ve derece uyumsuzlugu", "A": "Cagrisim tuzagi"}, "why_correct": "'But ... confirmed it' shows the evidence was expected to do the opposite of confirming, so 'undermine' (weaken) fits.", "why_wrong": {"B": "'Reinforce' means to strengthen, matching what the data actually did rather than what was expected.", "D": "'Demolish' points the right way but is too extreme for the measured 'supposed to' setup, which implies casting doubt, not total destruction.", "A": "'Publish' is associated with theories and research but names releasing work, not weakening a theory."}}, {"id": "u2-l1-f1-08", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The coach's speech was intended to ______ the exhausted players, though several admitted afterward that it had only worn them down further.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "electrify", "B": "deplete", "C": "recruit", "D": "invigorate"}, "correct": "D", "choice_families": {"B": "Ters anlam", "C": "Cagrisim tuzagi", "A": "Ton ve derece uyumsuzlugu"}, "why_correct": "'Though ... worn them down further' signals the speech was intended to do the opposite, to energize tired players. 'Invigorate' fits.", "why_wrong": {"B": "'Deplete' means to drain, which is what the speech did, not what it aimed to do.", "C": "'Recruit' is associated with coaching but names signing new players, not re-energizing tired ones.", "A": "'Electrify' is the right direction but too intense for a speech meant simply to revive worn-out players."}}, {"id": "u2-l1-f1-09", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "Critics feared the merger would ______ competition in the industry, but smaller firms actually multiplied in the years that followed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "stifle", "B": "foster", "C": "regulate", "D": "annihilate"}, "correct": "A", "choice_families": {"B": "Ters anlam", "C": "Cagrisim tuzagi", "D": "Ton ve derece uyumsuzlugu"}, "why_correct": "'But smaller firms actually multiplied' shows the feared effect was the opposite of growth: to suppress competition. 'Stifle' fits.", "why_wrong": {"B": "'Foster' means to encourage, matching the multiplication that occurred, not the feared harm.", "C": "'Regulate' is associated with industry and mergers but names oversight, not the suppression the critics feared.", "D": "'Annihilate' aims the right way but is too absolute; critics feared competition would be suppressed, not utterly destroyed."}}, {"id": "u2-l1-f1-10", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ters anlam", "passage": "The new irrigation system was designed to ______ the region's dependence on seasonal rain, yet farmers found themselves relying on the rains as heavily as ever.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "heighten", "B": "lessen", "C": "channel", "D": "abolish"}, "correct": "B", "choice_families": {"C": "Cagrisim tuzagi", "D": "Ton ve derece uyumsuzlugu", "A": "Ters anlam"}, "why_correct": "'Yet ... relying ... as heavily as ever' shows the system was designed to do the opposite of increasing dependence, so 'lessen' fits.", "why_wrong": {"C": "'Channel' is associated with irrigation and water but names directing flow, not reducing dependence.", "D": "'Abolish' points the right way but is too absolute for a system meant to reduce, not entirely end, reliance on rain.", "A": "'Heighten' means to increase, the reverse of what an irrigation system built to reduce reliance would aim for."}}, {"id": "u2-l1-f2-01", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The historian's account is admirably ______: she keeps strictly to what the documents show and adds no speculation of her own.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "novel", "B": "disciplined", "C": "reckless", "D": "archival"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Ikincil sozluk anlami"}, "why_correct": "'Keeps strictly to what the documents show, adds no speculation' describes controlled restraint, so 'disciplined' fits.", "why_wrong": {"C": "'Reckless' is the opposite of the careful restraint described.", "D": "'Archival' is associated with documents and history but describes records themselves, not the historian's restraint.", "A": "'Novel' can mean new or original, but that dictionary sense does not match staying strictly to evidence; the sentence is about restraint, not originality."}}, {"id": "u2-l1-f2-02", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "Before the vote, the chair asked each member to ______ the proposal carefully, weighing its costs against its likely benefits.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "dismiss", "B": "table", "C": "weigh", "D": "legislate"}, "correct": "C", "choice_families": {"B": "Ikincil sozluk anlami", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Weighing its costs against its benefits' calls for careful evaluation, so 'weigh' (consider) fits.", "why_wrong": {"B": "'Table' can mean to set aside a proposal, a real parliamentary sense, but here the members are asked to consider it, not shelve it.", "D": "'Legislate' is associated with votes and chairs but names making law, not evaluating a single proposal.", "A": "'Dismiss' is the opposite of the careful consideration the chair requests."}}, {"id": "u2-l1-f2-03", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The essay's argument is ______: each claim follows cleanly from the one before it, with no gaps in the reasoning.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "published", "B": "current", "C": "disjointed", "D": "coherent"}, "correct": "D", "choice_families": {"B": "Ikincil sozluk anlami", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Each claim follows cleanly ... no gaps' describes tight logical connection, so 'coherent' fits.", "why_wrong": {"B": "'Current' can mean up to date, a real sense, but that does not describe how claims connect; the sentence is about logical flow, not timeliness.", "C": "'Disjointed' is the opposite of claims that follow cleanly.", "A": "'Published' is associated with essays but describes release, not the internal logic of the argument."}}, {"id": "u2-l1-f2-04", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The engineer proposed a ______ solution, one that used the fewest possible parts to do the job reliably.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "elegant", "B": "stylish", "C": "convoluted", "D": "structural"}, "correct": "A", "choice_families": {"B": "Ikincil sozluk anlami", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "In technical writing an 'elegant' solution is one that is simple and efficient, matching 'fewest possible parts,' so 'elegant' fits.", "why_wrong": {"B": "'Stylish' captures the fashion sense of elegant but not the technical sense of simple and efficient the sentence requires.", "C": "'Convoluted' means overly complex, the opposite of using the fewest parts.", "D": "'Structural' is associated with engineering but describes what a thing relates to, not the simplicity of the solution."}}, {"id": "u2-l1-f2-05", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The witness gave a ______ account of the accident, describing each moment in the exact order it occurred.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "tidy", "B": "orderly", "C": "garbled", "D": "sworn"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Ikincil sozluk anlami"}, "why_correct": "'Each moment in the exact order it occurred' describes a well-sequenced account, so 'orderly' fits.", "why_wrong": {"C": "'Garbled' means confused and jumbled, the opposite of a clear sequence.", "D": "'Sworn' is associated with witnesses and testimony but describes an oath, not how the account is arranged.", "A": "'Tidy' shares the neat sense of orderly but usually describes physical spaces, not the sequence of a spoken account."}}, {"id": "u2-l1-f2-06", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The composer was known for ______ melodies that listeners could hum after a single hearing.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "forgettable", "B": "commemorative", "C": "memorable", "D": "orchestral"}, "correct": "C", "choice_families": {"B": "Ikincil sozluk anlami", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Listeners could hum after a single hearing' means the melodies stick in the mind, so 'memorable' fits.", "why_wrong": {"B": "'Commemorative' shares the memory root but means honoring an event, not easy to remember.", "D": "'Orchestral' is associated with composers but describes instrumentation, not memorability.", "A": "'Forgettable' is the opposite of melodies people hum after one hearing."}}, {"id": "u2-l1-f2-07", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "Her leadership style was refreshingly ______: she made decisions openly and explained the reasons behind each one.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "executive", "B": "see-through", "C": "secretive", "D": "transparent"}, "correct": "D", "choice_families": {"B": "Ikincil sozluk anlami", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Made decisions openly and explained the reasons' describes openness, so 'transparent' (open, candid) fits.", "why_wrong": {"B": "'See-through' captures the literal, physical sense of transparent but not the figurative sense of open and candid the sentence needs.", "C": "'Secretive' is the opposite of making decisions openly.", "A": "'Executive' is associated with leadership but names a role, not the openness described."}}, {"id": "u2-l1-f2-08", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The report was praised as ______: it laid out the findings plainly, without jargon that would confuse a general reader.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "lucid", "B": "luminous", "C": "opaque", "D": "editorial"}, "correct": "A", "choice_families": {"B": "Ikincil sozluk anlami", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "'Laid out the findings plainly, without jargon' describes clarity, so 'lucid' (clear, easy to follow) fits.", "why_wrong": {"B": "'Luminous' shares a light-giving root with lucid but means glowing, not clear in expression.", "C": "'Opaque' means hard to understand, the opposite of plainly laid out.", "D": "'Editorial' is associated with reports and writing but names opinion content, not clarity."}}, {"id": "u2-l1-f2-09", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The negotiator stayed ______ throughout the tense meeting, never once raising her voice or losing her focus.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "composite", "B": "composed", "C": "frantic", "D": "contractual"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Ikincil sozluk anlami"}, "why_correct": "'Never raising her voice or losing focus' describes calm self-control, so 'composed' fits.", "why_wrong": {"C": "'Frantic' is the opposite of the calm control described.", "D": "'Contractual' is associated with negotiation but describes agreements, not the negotiator's calm.", "A": "'Composite' shares the root with composed but means made of parts, an unrelated sense."}}, {"id": "u2-l1-f2-10", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ikincil sozluk anlami", "passage": "The teacher's feedback was consistently ______: it pointed out weaknesses in a way that helped students improve rather than discouraging them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "harsh", "B": "structural", "C": "constructive", "D": "academic"}, "correct": "C", "choice_families": {"B": "Ikincil sozluk anlami", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Helped students improve rather than discouraging them' describes helpful criticism, so 'constructive' fits.", "why_wrong": {"B": "'Structural' shares the build root with constructive but means relating to structure, not helpful in intent.", "D": "'Academic' is associated with teachers but describes a field, not the helpful quality of the feedback.", "A": "'Harsh' is the opposite of feedback that helps rather than discourages."}}, {"id": "u2-l1-f3-01", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The study found that the drug ______ symptoms in most patients, though a few reported no change at all.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "worsened", "B": "eliminated", "C": "reduced", "D": "medicated"}, "correct": "C", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'In most patients, though a few reported no change' calls for a measured, partial effect, so 'reduced' fits.", "why_wrong": {"B": "'Eliminated' is the right direction but too absolute; if it eliminated symptoms, the sentence could not add 'though a few reported no change.'", "D": "'Medicated' is associated with drugs and patients but names giving medicine, not the effect on symptoms.", "A": "'Worsened' reverses the direction the sentence needs."}}, {"id": "u2-l1-f3-02", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "Reviewers found the film ______, praising its steady craft while stopping short of calling it a masterpiece.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "cinematic", "B": "flawless", "C": "dreadful", "D": "solid"}, "correct": "D", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Stopping short of calling it a masterpiece' signals moderate praise, so 'solid' fits the measured tone.", "why_wrong": {"B": "'Flawless' overshoots; reviewers who stop short of 'masterpiece' would not call the film flawless.", "C": "'Dreadful' reverses the positive direction the praise establishes.", "A": "'Cinematic' is associated with film but describes a visual quality, not the level of the reviewers' praise."}}, {"id": "u2-l1-f3-03", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The senator expressed ______ support for the bill, backing its goals while noting several provisions she hoped to amend.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "qualified", "B": "wholehearted", "C": "outright", "D": "legislative"}, "correct": "A", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "C": "Ton ve derece uyumsuzlugu", "D": "Cagrisim tuzagi"}, "why_correct": "'Backing its goals while noting provisions she hoped to amend' describes limited, conditional support, so 'qualified' fits.", "why_wrong": {"B": "'Wholehearted' overshoots; support with reservations is not wholehearted.", "C": "'Outright' also overshoots, implying total and unconditional support, which the reservations contradict.", "D": "'Legislative' is associated with senators and bills but describes lawmaking, not the degree of support."}}, {"id": "u2-l1-f3-04", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The coating gives the metal ______ protection against rust, enough for indoor use but not for harsh outdoor exposure.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "total", "B": "modest", "C": "negligible", "D": "metallic"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Ton ve derece uyumsuzlugu"}, "why_correct": "'Enough for indoor use but not for harsh outdoor exposure' describes limited protection, so 'modest' fits.", "why_wrong": {"C": "'Negligible' undershoots in the other direction; the coating does help indoors, so the protection is not negligible.", "D": "'Metallic' is associated with metal but describes a material quality, not the degree of protection.", "A": "'Total' overshoots; protection that fails outdoors is not total."}}, {"id": "u2-l1-f3-05", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "Her tone was ______ rather than hostile; she disagreed firmly but never insulted anyone in the room.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "gentle", "B": "savage", "C": "pointed", "D": "vocal"}, "correct": "C", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Disagreed firmly but never insulted anyone' calls for sharp but controlled, so 'pointed' fits.", "why_wrong": {"B": "'Savage' overshoots into hostility, which the sentence explicitly rules out.", "D": "'Vocal' is associated with tone and speaking but describes loudness, not the controlled sharpness meant.", "A": "'Gentle' undershoots; firm disagreement is stronger than gentle."}}, {"id": "u2-l1-f3-06", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The proposal met with ______ enthusiasm: the board approved it but asked for a smaller budget than requested.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "fiscal", "B": "boundless", "C": "hostile", "D": "tempered"}, "correct": "D", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Approved it but asked for a smaller budget' signals restrained enthusiasm, so 'tempered' fits.", "why_wrong": {"B": "'Boundless' overshoots; enthusiasm that trims the budget is not boundless.", "C": "'Hostile' reverses the direction, since the board approved the proposal.", "A": "'Fiscal' is associated with budgets but describes finance, not the degree of enthusiasm."}}, {"id": "u2-l1-f3-07", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The change produced a ______ improvement in efficiency, small but consistent across every trial.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "marginal", "B": "dramatic", "C": "ruinous", "D": "mechanical"}, "correct": "A", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "'Small but consistent' points to a slight gain, so 'marginal' fits the degree.", "why_wrong": {"B": "'Dramatic' overshoots; the sentence calls the improvement small.", "C": "'Ruinous' reverses direction, implying harm rather than improvement.", "D": "'Mechanical' is associated with efficiency and machines but describes a manner, not the size of the improvement."}}, {"id": "u2-l1-f3-08", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The author is ______ of the policy, raising a few concerns without rejecting it outright.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "scathing", "B": "wary", "C": "admiring", "D": "authorial"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Ton ve derece uyumsuzlugu"}, "why_correct": "'A few concerns without rejecting it outright' describes mild caution, so 'wary' fits.", "why_wrong": {"C": "'Admiring' reverses the direction, since the author has concerns.", "D": "'Authorial' is associated with an author but describes writing itself, not an attitude.", "A": "'Scathing' overshoots; raising a few concerns is far milder than a scathing attack."}}, {"id": "u2-l1-f3-09", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "The mayor offered a ______ apology, acknowledging the error briefly before moving on to other business.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "defiant", "B": "profound", "C": "perfunctory", "D": "municipal"}, "correct": "C", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Acknowledging the error briefly before moving on' signals a token, minimal apology, so 'perfunctory' fits.", "why_wrong": {"B": "'Profound' overshoots; a brief acknowledgment is the opposite of a deep, heartfelt apology.", "D": "'Municipal' is associated with a mayor but describes city government, not the quality of the apology.", "A": "'Defiant' reverses direction, since the mayor does apologize."}}, {"id": "u2-l1-f3-10", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Ton ve derece uyumsuzlugu", "passage": "Sales showed a ______ recovery, ticking upward slightly after months of steep decline.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "commercial", "B": "triumphant", "C": "catastrophic", "D": "tentative"}, "correct": "D", "choice_families": {"B": "Ton ve derece uyumsuzlugu", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Ticking upward slightly' after decline describes a cautious, early recovery, so 'tentative' fits.", "why_wrong": {"B": "'Triumphant' overshoots; a slight uptick is not a triumphant recovery.", "C": "'Catastrophic' reverses direction, describing disaster rather than recovery.", "A": "'Commercial' is associated with sales but describes business, not the strength of the recovery."}}, {"id": "u2-l1-f4-01", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The astronomer's lecture was so ______ that even listeners with no science background followed every point with ease.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "stellar", "B": "celestial", "C": "impenetrable", "D": "accessible"}, "correct": "D", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Even listeners with no background followed every point with ease' means the lecture was easy to grasp, so 'accessible' fits.", "why_wrong": {"B": "'Celestial' is tied to astronomy by topic but describes the sky, not how easy the lecture was to follow.", "C": "'Impenetrable' reverses the meaning, describing something impossible to understand.", "A": "'Stellar' evokes stars and can mean excellent, but the slot needs 'easy to follow,' not 'excellent'; it is the topical lure."}}, {"id": "u2-l1-f4-02", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The chef's new menu was praised as ______, blending techniques from cuisines that rarely appear together.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "inventive", "B": "culinary", "C": "derivative", "D": "savory"}, "correct": "A", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "'Blending techniques that rarely appear together' describes originality, so 'inventive' fits.", "why_wrong": {"B": "'Culinary' is tied to a chef and menu by topic but simply means relating to cooking, not original.", "C": "'Derivative' reverses the meaning, describing unoriginal work.", "D": "'Savory' evokes food but describes a taste, not the originality of the menu; it is the topical lure."}}, {"id": "u2-l1-f4-03", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The judge's ruling was widely seen as ______, applying the same standard to both sides without favor.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "judicial", "B": "impartial", "C": "biased", "D": "legal"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Cagrisim tuzagi"}, "why_correct": "'Applying the same standard to both sides without favor' describes fairness, so 'impartial' fits.", "why_wrong": {"C": "'Biased' reverses the meaning, describing favoritism.", "D": "'Legal' evokes the courtroom but means lawful, not even-handed; it is the topical lure.", "A": "'Judicial' is tied to a judge by topic but means relating to courts, not fair."}}, {"id": "u2-l1-f4-04", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The architect's design was admired for being ______, using every square meter of the small lot without feeling cramped.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "wasteful", "B": "architectural", "C": "efficient", "D": "structural"}, "correct": "C", "choice_families": {"B": "Cagrisim tuzagi", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Using every square meter ... without feeling cramped' describes smart use of space, so 'efficient' fits.", "why_wrong": {"B": "'Architectural' is tied to an architect by topic but just means relating to buildings, not economical in space.", "D": "'Structural' evokes construction but describes load and framework, not spatial economy; it is the topical lure.", "A": "'Wasteful' reverses the meaning, describing poor use of space."}}, {"id": "u2-l1-f4-05", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The novelist's later work grew more ______, stripping away subplots until only the central story remained.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "narrative", "B": "literary", "C": "sprawling", "D": "focused"}, "correct": "D", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Stripping away subplots until only the central story remained' describes concentration, so 'focused' fits.", "why_wrong": {"B": "'Literary' is tied to a novelist by topic but means relating to literature, not concentrated.", "C": "'Sprawling' reverses the meaning, describing something that spreads out rather than narrows.", "A": "'Narrative' evokes storytelling but names a type of writing, not the tightening described; it is the topical lure."}}, {"id": "u2-l1-f4-06", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The economist's forecast proved ______, matching the actual figures released months later almost exactly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "accurate", "B": "economic", "C": "mistaken", "D": "monetary"}, "correct": "A", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "'Matching the actual figures almost exactly' describes correctness, so 'accurate' fits.", "why_wrong": {"B": "'Economic' is tied to an economist by topic but means relating to the economy, not correct.", "C": "'Mistaken' reverses the meaning, describing a wrong forecast.", "D": "'Monetary' evokes economics but concerns money supply, not the forecast's correctness; it is the topical lure."}}, {"id": "u2-l1-f4-07", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The surgeon's movements were remarkably ______, each cut placed with control that left no room for error.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "surgical", "B": "precise", "C": "clumsy", "D": "medical"}, "correct": "B", "choice_families": {"C": "Ters anlam", "D": "Cagrisim tuzagi", "A": "Cagrisim tuzagi"}, "why_correct": "'Each cut placed with control ... no room for error' describes exactness, so 'precise' fits.", "why_wrong": {"C": "'Clumsy' reverses the meaning, describing a lack of control.", "D": "'Medical' evokes the operating room but means relating to medicine, not exact; it is the topical lure.", "A": "'Surgical' is tied to a surgeon by topic; though it can mean precise, here it is the circular topical lure, and 'precise' names the quality directly."}}, {"id": "u2-l1-f4-08", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The historian's biography is admirably ______, drawing on letters and records that earlier accounts overlooked.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "superficial", "B": "historical", "C": "thorough", "D": "chronological"}, "correct": "C", "choice_families": {"B": "Cagrisim tuzagi", "D": "Cagrisim tuzagi", "A": "Ters anlam"}, "why_correct": "'Drawing on letters and records earlier accounts overlooked' describes completeness, so 'thorough' fits.", "why_wrong": {"B": "'Historical' is tied to a historian by topic but means relating to history, not exhaustive in research.", "D": "'Chronological' evokes history and biography but describes time order, not depth of research; it is the topical lure.", "A": "'Superficial' reverses the meaning, describing shallow work."}}, {"id": "u2-l1-f4-09", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The pianist's performance was ______, holding the audience in complete silence until the final note faded.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "melodic", "B": "musical", "C": "tedious", "D": "captivating"}, "correct": "D", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "A": "Cagrisim tuzagi"}, "why_correct": "'Holding the audience in complete silence' describes a gripping performance, so 'captivating' fits.", "why_wrong": {"B": "'Musical' is tied to a pianist by topic but just means relating to music, not spellbinding.", "C": "'Tedious' reverses the meaning, describing a dull performance.", "A": "'Melodic' evokes music but describes tunefulness, not the gripping effect on the audience; it is the topical lure."}}, {"id": "u2-l1-f4-10", "unit": 2, "lesson": 1, "lesson_name": "Words in Context", "target_family": "Cagrisim tuzagi", "passage": "The report on the ecosystem was praised as ______, tracing how a single species loss rippled through the whole food web.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": {"A": "comprehensive", "B": "ecological", "C": "narrow", "D": "biological"}, "correct": "A", "choice_families": {"B": "Cagrisim tuzagi", "C": "Ters anlam", "D": "Cagrisim tuzagi"}, "why_correct": "'Tracing how a single loss rippled through the whole food web' describes wide coverage, so 'comprehensive' fits.", "why_wrong": {"B": "'Ecological' is tied to an ecosystem by topic but means relating to ecology, not wide-ranging.", "C": "'Narrow' reverses the meaning, describing limited scope.", "D": "'Biological' evokes the natural science but describes the field, not the breadth of the report; it is the topical lure."}}]}, {"no": 2, "name": "Text Structure and Purpose", "teaching": {"ne_olculuyor": ["Bu soru metnin NE dedigini degil, NASIL kurulduğunu ya da bir parcanin NE ISE YARADIGINI olcer. Yapi ve islev sorusudur.", "Uc bicimde gelir: metnin genel yapisi, metnin ana amaci, ya da belirli bir cumlenin metindeki islevi.", "Kritik nokta: dogru secenek metnin YAPTIGI seyi tarif eder, konusunu OZETLEMEZ. Ozet ile islev farkli seylerdir ve tuzak tam burada kurulur."], "karar_proseduru": ["Once metnin hareketini izle.  Yazar ne yapiyor: bir iddia mi kuruyor, bir problem mi sunuyor, iki gorus mu karsilastiriyor, bir ornek mi veriyor. Fiil olarak dusun: sunar, karsilastirir, eleştirir, ornekler.", "Soru genel mi ozel mi belirle.  Genel yapi soruluyorsa cevap metnin BUTUNUNU kapsamali. Tek bir cumlenin islevi soruluyorsa cevap o cumlenin metne KATKISINI vermeli.", "Secenekleri fiil olarak oku.  Her secenek bir hareket tarif eder: introduces, challenges, illustrates, qualifies. Bu fiil metnin gercekte yaptigi harekete uyuyor mu.", "Konu ozeti olan secenekleri ele.  Metnin ne HAKKINDA oldugunu soyleyip ne YAPTIGINI soylemeyen secenek yanlistir.", "Kapsam kontrolu yap.  Secenek metnin sadece bir kismini mi tarif ediyor, yoksa butununu mu. Genel soruda parca tarifi tuzaktir."], "celdirici_aileleri": [{"ad": "Dogru konu yanlis islev", "tanim": "Secenek metnin KONUSUNU dogru soyler ama YAPTIGI seyi yanlis tarif eder. Ozet gibi okunur, islev degil. Ogrenci konuyu tanidigi icin isaretler ama soru islev sorar."}, {"ad": "Metnin bir kismi butunu degil", "tanim": "Secenek metnin sadece BIR bolumunu dogru tarif eder ama soru BUTUNUN yapisini ister. Ilk cumleye ya da son cumleye uyar, metnin tamamina uymaz."}, {"ad": "Ters islev", "tanim": "Secenek metnin yaptiginin TERSI bir hareket soyler. Metin destekliyorsa secenek elestirir der, metin ornekliyorsa reddeder der. Yon yanlistir."}, {"ad": "Metinde olmayan islev", "tanim": "Secenek makul gorunen ama metnin ASLA yapmadigi bir hareket tarif eder. Metinde olmayan bir karsilastirma, cozum ya da elestiri uydurur."}], "top_tips": ["Secenegi bir FIILE indir. introduces, then evaluates, gibi. Metin bu fiili gercekten yapiyor mu diye kontrol et. Yapmiyorsa ele.", "Konu ozeti tuzagina dikkat. discusses the history of X gibi secenekler cogu zaman konuyu soyler, islevi degil. Soru islev soruyorsa bunlar yanlistir.", "Genel yapi sorusunda tek parca tarif eden secenegi ele. Cevap metnin basindan sonuna kadarki hareketi kapsamali.", "Bir cumlenin islevi soruluyorsa, o cumleyi metinden CIKAR ve ne kaybettigini dusun. Kaybettigin sey o cumlenin islevidir."]}, "families": ["Dogru konu yanlis islev", "Metnin bir kismi butunu degil", "Ters islev", "Metinde olmayan islev"], "fam_short": {"Dogru konu yanlis islev": "Konu/islev", "Metnin bir kismi butunu degil": "Parca/butun", "Ters islev": "Ters islev", "Metinde olmayan islev": "Olmayan islev"}, "main_ids": ["u2-l2-f1-01", "u2-l2-f2-01", "u2-l2-f3-01", "u2-l2-f4-01"], "questions": [{"id": "u2-l2-f1-01", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "Many gardeners assume that richer soil always yields healthier plants. A recent study complicates this belief: in nutrient-heavy soil, several native wildflowers grew tall but produced far fewer blooms than the same species grown in leaner ground. The finding suggests that abundance can sometimes work against a plant's reproductive success.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A common assumption is presented, then challenged with a study whose results point to a more complicated conclusion.", "B": "The text describes how soil nutrients affect the growth of native wildflowers.", "C": "A study is described in detail and then dismissed as unreliable.", "D": "Two competing gardening methods are compared and one is recommended."}, "correct": "A", "choice_families": {"B": "Dogru konu yanlis islev", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text states a common belief, then introduces a study that complicates it and draws a nuanced conclusion. Choice A captures that movement.", "why_wrong": {"B": "This names the topic (soil and wildflowers) but not what the text does; it reads like a summary, not a description of structure.", "C": "The text does not dismiss the study; it treats the results as meaningful.", "D": "No two gardening methods are compared or recommended."}}, {"id": "u2-l2-f1-02", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "The composer Clara Schumann was celebrated as a performer in her lifetime, yet her compositions were long overlooked. Only in recent decades have scholars begun to examine her songs and piano works closely, arguing that they deserve a place beside those of her better-known contemporaries.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To describe the life and career of the composer Clara Schumann.", "B": "To argue that a historically neglected composer's works merit renewed critical attention.", "C": "To question whether Clara Schumann's compositions have any lasting value.", "D": "To compare Clara Schumann's performing career with her teaching career."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The text moves toward the scholars' argument that her works deserve attention, so its purpose is to make that case. Choice A fits.", "why_wrong": {"C": "The text supports the value of her works rather than questioning it.", "D": "No teaching career is mentioned or compared.", "A": "Describing her life is the topic, not the purpose; the text builds toward an argument, not a biography."}}, {"id": "u2-l2-f1-03", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "Coral reefs are often described as fragile, but this framing can mislead. Reefs have survived dramatic swings in ocean temperature over millions of years. What threatens them now is not fragility but the unusual speed of current change, which outpaces the corals' capacity to adapt.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To argue that coral reefs are not actually in any danger today.", "B": "To explain how coral reefs respond to changes in ocean temperature.", "C": "To correct a common characterization of reefs by locating the real source of their present danger.", "D": "To compare modern reefs with the reefs of millions of years ago."}, "correct": "C", "choice_families": {"B": "Dogru konu yanlis islev", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The text rejects the 'fragile' framing and pinpoints speed of change as the real threat, so its purpose is to correct and relocate the danger. Choice A fits.", "why_wrong": {"B": "Explaining temperature response is topic material, not the text's purpose, which is corrective.", "D": "Past and present reefs are mentioned but not systematically compared.", "A": "The text says reefs are threatened now, so it does not claim they are safe."}}, {"id": "u2-l2-f1-04", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "The first photographs of Earth from space did more than document the planet. Circulated widely in the late 1960s, the images gave many viewers a sudden sense of the planet as small, whole, and shared, and historians credit them with helping to energize the emerging environmental movement.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To compare early space photography with modern satellite imaging.", "B": "To describe the first photographs of Earth taken from space.", "C": "To argue that the photographs had no real effect on public attitudes.", "D": "To explain how a set of images came to have an influence beyond their documentary value."}, "correct": "D", "choice_families": {"B": "Dogru konu yanlis islev", "C": "Ters islev", "A": "Metinde olmayan islev"}, "why_correct": "The text explains how the images gained influence beyond documentation, energizing a movement. Choice A captures that purpose.", "why_wrong": {"B": "Describing the photographs is the topic; the text's aim is to explain their larger effect.", "C": "The text credits the images with real influence, the opposite of claiming none.", "A": "Modern satellite imaging is never mentioned."}}, {"id": "u2-l2-f1-05", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "For years, economists treated commuting time as a minor cost. Newer research challenges that view, linking long daily commutes to measurable declines in well-being and even in job performance. The costs of distance, this work suggests, reach well beyond the hours spent in transit.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A long-held view is noted, then countered by research that broadens the understood costs of an activity.", "B": "The text explains the effects of long commutes on workers' daily lives.", "C": "A body of research is introduced and then rejected as overstated.", "D": "Two methods of measuring commuting time are contrasted."}, "correct": "A", "choice_families": {"B": "Dogru konu yanlis islev", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text states the old view, then uses new research to widen the recognized costs. Choice A tracks that structure.", "why_wrong": {"B": "This states the topic (effects of commuting) rather than the text's structure.", "C": "The text endorses the newer research rather than rejecting it.", "D": "No two measurement methods are contrasted."}}, {"id": "u2-l2-f1-06", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "The novel's narrator seems, at first, entirely trustworthy. Only gradually do small contradictions accumulate in her account, until the reader begins to suspect that she has been concealing her own role in the events she describes. The unease is the point: the book asks how much any single narrator can be believed.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To describe the narrator of the novel and the events she recounts.", "B": "To show how the novel uses a gradually unreliable narrator to raise a larger question.", "C": "To argue that the novel's narrator is fully reliable throughout.", "D": "To compare this novel's narrator with narrators in other novels."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The text explains how the narrator's growing unreliability serves a larger question about belief. Choice A fits.", "why_wrong": {"C": "The text argues the narrator is not fully reliable, the reverse of C.", "D": "Other novels' narrators are not compared.", "A": "Describing the narrator is topic material, not the purpose, which is about the effect she creates."}}, {"id": "u2-l2-f1-07", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "It is tempting to see the printing press as the sole cause of the spread of literacy in Europe. Yet presses were useless without cheap paper, rising urban schools, and a growing class of readers. The press mattered, but it was one part of a wider set of conditions that made mass reading possible.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To argue that the printing press had nothing to do with rising literacy.", "B": "To describe how the printing press was invented and spread.", "C": "To qualify a single-cause explanation by placing one factor within a broader set of conditions.", "D": "To compare literacy rates in urban and rural Europe."}, "correct": "C", "choice_families": {"B": "Dogru konu yanlis islev", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The text tempers the 'press alone' explanation by embedding it among other conditions. Choice A fits.", "why_wrong": {"B": "How the press spread is topic material, not the corrective purpose.", "D": "Urban and rural literacy rates are not compared.", "A": "The text says the press mattered, so it does not dismiss its role."}}, {"id": "u2-l2-f1-08", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "Bee colonies are often praised as models of selfless cooperation. The reality is subtler. Workers do labor for the hive, but recent studies show they also compete, police one another, and occasionally lay their own eggs. Cooperation in the hive is real, yet it rests on constant internal negotiation.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "Two species of bees are compared in terms of cooperation.", "B": "The text describes the social behavior of workers within a bee colony.", "C": "A popular view of bee colonies is presented and then fully confirmed.", "D": "An idealized view is stated, then complicated by evidence of tension beneath the cooperation."}, "correct": "D", "choice_families": {"B": "Dogru konu yanlis islev", "C": "Ters islev", "A": "Metinde olmayan islev"}, "why_correct": "The text states the idealized view, then complicates it with evidence of internal competition. Choice A captures the structure.", "why_wrong": {"B": "This names the topic (worker behavior) rather than the text's structure.", "C": "The text complicates the popular view rather than confirming it.", "A": "No two bee species are compared."}}, {"id": "u2-l2-f1-09", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "The painter spent her final years on a single mural, and critics at the time called the choice a waste of her talent. History has been kinder. The mural is now seen as the fullest expression of her style, the work in which every earlier experiment finally came together.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To trace a shift in how a late work has come to be judged.", "B": "To describe the mural the painter made in her final years.", "C": "To argue that the critics of the painter's time were correct.", "D": "To compare the mural with murals by other painters."}, "correct": "A", "choice_families": {"B": "Dogru konu yanlis islev", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text moves from harsh contemporary judgment to a kinder later view, tracing a shift in reception. Choice A fits.", "why_wrong": {"B": "Describing the mural is topic material, not the purpose, which concerns changing judgment.", "C": "The text sides with the later, kinder view, not the original critics.", "D": "Other painters' murals are not compared."}}, {"id": "u2-l2-f1-10", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Dogru konu yanlis islev", "passage": "Sleep was once thought to be a period of pure rest, the brain simply idling. That picture has been overturned. During sleep the brain replays the day's experiences, strengthens some memories, and clears away certain waste products. Rest, it turns out, is anything but idle.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "The text explains what the brain does during different stages of sleep.", "B": "An outdated idea is stated, then replaced by a description of active processes that overturn it.", "C": "A modern account of sleep is presented and then called into doubt.", "D": "Two theories about why humans need sleep are weighed against each other."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The text states the old 'idling' idea, then overturns it with active processes. Choice A tracks that structure.", "why_wrong": {"C": "The text presents the modern account as established, not doubtful.", "D": "No two theories of why we sleep are weighed.", "A": "This states the topic (brain during sleep) rather than the overturning structure."}}, {"id": "u2-l2-f2-01", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The engineer first outlines the problem: the bridge sways in high wind. She then walks through three failed fixes attempted over the years. Finally, she proposes a new damping system and explains why it should succeed where the others did not.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A problem with a bridge is described in detail.", "B": "A problem is stated, past failed solutions are reviewed, and a new solution is proposed and defended.", "C": "A new solution is proposed and then shown to fail like the others.", "D": "Two damping systems are compared and rated equally effective."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Metnin bir kismi butunu degil"}, "why_correct": "The text moves problem, failed fixes, new solution and defense. Choice A covers the whole arc.", "why_wrong": {"C": "The text defends the new solution rather than showing it fails.", "D": "Only one new system is proposed; two are not rated equally.", "A": "Describing the problem is only the first part; the question asks about the whole structure."}}, {"id": "u2-l2-f2-02", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The essay opens with a vivid childhood memory of the author's grandmother baking bread. It then widens outward, using that memory to reflect on how food carries family history, and closes by arguing that recipes are a form of inheritance as real as any heirloom.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A broad claim is stated first and then narrowed to a single memory.", "B": "The author recounts a childhood memory of a grandmother baking bread.", "C": "A personal memory opens the text and is then developed into a broader claim about food and inheritance.", "D": "Two family recipes are compared across generations."}, "correct": "C", "choice_families": {"B": "Metnin bir kismi butunu degil", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The text opens with a memory and widens into a broader claim about inheritance. Choice A captures the full movement.", "why_wrong": {"B": "The memory is only the opening; the question asks about the whole structure.", "D": "No two recipes are compared.", "A": "The order is reversed: the memory comes first, then the broad claim."}}, {"id": "u2-l2-f2-03", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The report begins by noting a puzzle: a lake that should be dying is instead thriving. It reviews and rejects two easy explanations, then identifies an overlooked underground spring as the likely cause, and ends by calling for further testing.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "Two lakes are compared to explain why one thrives.", "B": "A puzzle about a thriving lake is introduced.", "C": "A likely cause is named first and then two explanations are added to support it.", "D": "A puzzle is raised, weak explanations are dismissed, a likely cause is identified, and further study is urged."}, "correct": "D", "choice_families": {"B": "Metnin bir kismi butunu degil", "C": "Ters islev", "A": "Metinde olmayan islev"}, "why_correct": "The text raises a puzzle, rejects weak explanations, names a cause, and calls for testing. Choice A covers all of it.", "why_wrong": {"B": "Introducing the puzzle is only the opening; the question asks about the whole.", "C": "The order is wrong: explanations are rejected before the cause is named.", "A": "Only one lake is discussed; two are not compared."}}, {"id": "u2-l2-f2-04", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The lecture starts with a familiar definition of intelligence as problem-solving speed. It then presents cases, an octopus, a crow, that solve problems slowly but creatively, and concludes that speed is a poor measure of intelligence on its own.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A standard definition is introduced, tested against counterexamples, and then judged inadequate.", "B": "A standard definition of intelligence as problem-solving speed is presented.", "C": "Counterexamples are offered first and a definition is built from them.", "D": "An octopus and a crow are compared to decide which is smarter."}, "correct": "A", "choice_families": {"B": "Metnin bir kismi butunu degil", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text gives a definition, tests it with counterexamples, and finds it inadequate. Choice A covers the whole.", "why_wrong": {"B": "The definition is only the opening; the question asks about the full structure.", "C": "The definition comes first, not built from the examples afterward.", "D": "The animals illustrate a point; they are not ranked against each other."}}, {"id": "u2-l2-f2-05", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The article first celebrates the speed of a new translation tool. It then turns critical, showing how the tool flattens idioms and loses tone. It ends in the middle: useful for gist, it argues, but no substitute for a human translator.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "The article praises the speed of a new translation tool.", "B": "An initial praise is followed by criticism, leading to a balanced final judgment.", "C": "The article criticizes the tool and then withdraws every criticism.", "D": "Two translation tools are compared feature by feature."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Metnin bir kismi butunu degil"}, "why_correct": "The text praises, then criticizes, then lands on a balanced verdict. Choice A captures the arc.", "why_wrong": {"C": "The criticisms stand in the final judgment rather than being withdrawn.", "D": "Only one tool is discussed.", "A": "The praise is only the opening; the question asks about the whole."}}, {"id": "u2-l2-f2-06", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The chapter opens with the discovery of a strange fossil. It then reconstructs, step by step, how researchers determined the animal's diet, gait, and habitat from a few bones. It closes by noting how much can be inferred from how little.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A reflection on scientific reasoning opens the text and a fossil is found at the end.", "B": "A strange fossil discovery is described.", "C": "A discovery is introduced, the reasoning drawn from it is traced, and a reflection on that reasoning closes the text.", "D": "Two fossils are compared to determine which is older."}, "correct": "C", "choice_families": {"B": "Metnin bir kismi butunu degil", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The text introduces the discovery, traces the reasoning, and closes with reflection. Choice A covers the whole.", "why_wrong": {"B": "The discovery is only the opening; the question asks about the full structure.", "D": "Only one fossil is discussed.", "A": "The order is reversed: the fossil opens the text, the reflection closes it."}}, {"id": "u2-l2-f2-07", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The passage begins by describing the calm surface of a tidal pool. It then reveals the fierce competition beneath, crabs, snails, and anemones all vying for space, and ends by suggesting that stillness in nature often hides intense struggle.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "Crabs and anemones are compared as competitors.", "B": "The calm surface of a tidal pool is described.", "C": "A general lesson about nature opens the passage and a tidal pool illustrates it first.", "D": "A calm appearance is described, the hidden conflict beneath it is revealed, and a general lesson is drawn."}, "correct": "D", "choice_families": {"B": "Metnin bir kismi butunu degil", "C": "Ters islev", "A": "Metinde olmayan islev"}, "why_correct": "The text describes calm, reveals hidden conflict, and draws a lesson. Choice A covers the whole.", "why_wrong": {"B": "The calm surface is only the opening; the question asks about the whole.", "C": "The order is reversed: the description comes first, the lesson last.", "A": "The animals illustrate competition; they are not ranked."}}, {"id": "u2-l2-f2-08", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The biography's middle chapters dwell on the inventor's many failures. But the book frames these as necessary: it opens by promising to explain his eventual breakthrough and closes by showing that each failure taught a lesson the success required.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "A promise to explain a success frames an account of failures that are shown to make the success possible.", "B": "The book describes the inventor's many failures in his middle years.", "C": "The book argues that the inventor's failures prevented his later success.", "D": "Two inventors are compared by their number of failures."}, "correct": "A", "choice_families": {"B": "Metnin bir kismi butunu degil", "C": "Ters islev", "D": "Metinde olmayan islev"}, "why_correct": "The text frames the failures within a promise to explain the success and shows they enabled it. Choice A covers the whole.", "why_wrong": {"B": "The failures are only the middle portion; the question asks about the whole frame.", "C": "The failures enable the success rather than preventing it.", "D": "Only one inventor is discussed."}}, {"id": "u2-l2-f2-09", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The review opens by admiring the film's visuals. It spends most of its length, however, on the weak script, arguing that no amount of beauty can rescue a story the audience cannot follow. It ends by recommending the film only to those who watch for images alone.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "The review admires the film's striking visuals.", "B": "Initial praise gives way to sustained criticism, ending in a narrow, qualified recommendation.", "C": "The review praises the script and criticizes the visuals.", "D": "Two films by the same director are compared."}, "correct": "B", "choice_families": {"C": "Ters islev", "D": "Metinde olmayan islev", "A": "Metnin bir kismi butunu degil"}, "why_correct": "The text opens with praise, shifts to sustained criticism, and ends with a narrow recommendation. Choice A covers the whole.", "why_wrong": {"C": "It criticizes the script and praises the visuals, the reverse of C.", "D": "Only one film is reviewed.", "A": "Admiring the visuals is only the opening; the question asks about the whole."}}, {"id": "u2-l2-f2-10", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Metnin bir kismi butunu degil", "passage": "The text starts with a startling statistic about food waste. It then explains the tangled causes, from cosmetic standards to confusing date labels, and finishes by describing several cities that have cut waste sharply, offering their methods as a model.", "stem": "Which choice best describes the overall structure of the text?", "choices": {"A": "Successful solutions are described first and the causes of waste are added last.", "B": "A startling statistic about food waste is presented.", "C": "A striking statistic leads into an analysis of causes and then to examples of successful solutions.", "D": "Two cities are compared to decide which wastes more food."}, "correct": "C", "choice_families": {"B": "Metnin bir kismi butunu degil", "D": "Metinde olmayan islev", "A": "Ters islev"}, "why_correct": "The text opens with a statistic, analyzes causes, then gives successful examples. Choice A covers the whole.", "why_wrong": {"B": "The statistic is only the opening; the question asks about the whole.", "D": "The cities model solutions; they are not ranked by waste.", "A": "The order is reversed: causes come before the solutions."}}, {"id": "u2-l2-f3-01", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "Some claim that background music helps students study. The evidence points the other way. In controlled trials, students who studied in silence recalled more than those exposed to music, even instrumental music without lyrics.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To describe how background music affects studying.", "B": "To present a claim and then supply evidence that supports it.", "C": "To present a claim and then offer evidence that undercuts it.", "D": "To propose a new method for testing memory."}, "correct": "C", "choice_families": {"B": "Ters islev", "D": "Metinde olmayan islev", "A": "Dogru konu yanlis islev"}, "why_correct": "The text states a claim, then gives evidence against it. Choice A names that function.", "why_wrong": {"B": "The evidence undercuts the claim rather than supporting it, so B reverses the function.", "D": "No new testing method is proposed.", "A": "This names the topic, not what the text does with the claim."}}, {"id": "u2-l2-f3-02", "unit": 2, "lesson": 2, "lesson_name": "Text Structure and Purpose", "target_family": "Ters islev", "passage": "The author begins by granting that cities are noisy, crowded, and expensive. But the essay is a defense of city life: those very pressures, it argues, force the mixing of people and ideas that makes cities engines of creativity.", "stem": "Which choice best states the main purpose of the text?", "choices": {"A": "To compare city life with rural life poin
