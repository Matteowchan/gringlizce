 neglect","B":"recognized as a problem only in recent years","D":"persisting for a long time; habitual","C":"affecting the system's operational capacity directly"},"ans":"D","slug":"gri-mod-sat-v5-1-1","why":"D is correct. Nearly three decades of underfunding = persisting for a long time. \"Chronic\" = persisting for a long time; constantly recurring.  A — deliberate neglect implies intent; chronic describes duration.  B — recognized only recently is the opposite.  C — affecting operational capacity is a consequence.  Kelime: chronic — kronik, uzun süreli, süreğen","stem":"The city had struggled with chronic underfunding of its public transit system for nearly three decades, a period during which deferred maintenance had accumulated into a backlog estimated at four billion dollars.  As used in the text, \"chronic\" most nearly means:"},{"choices":{"D":"challenge through formal administrative appeal","C":"comply with while minimizing operational impact","B":"find a way around; get around by avoiding","A":"repeal through legislative action"},"n":2,"why":"B is correct. Found a legal way to avoid the regulation's effect by reclassifying workers = get around by avoiding. \"Circumvent\" = to find a way around an obstacle; to avoid by going around.  A — repeal through legislation is a different action.  C — comply while minimizing impact is the opposite of circumventing.  D — formal administrative challenge is a different approach.  Kelime: circumvent — atlatmak, aşmak, çevresinden dolaşmak","stem":"Rather than confronting the regulation directly, the company found a legal way to circumvent it, restructuring its contracts so that the employees subject to the rule were reclassified as independent contractors.  As used in the text, \"circumvent\" most nearly means:","ans":"B","slug":"gri-mod-sat-v5-1-2"},{"n":3,"choices":{"C":"misled about the contents or implications","D":"compelled through threats or force","B":"legally required under employment law","A":"persuaded through financial incentives"},"ans":"D","why":"D is correct. Threatening termination to compel signing = compelled through threats. \"Coerce\" = to persuade an unwilling person to do something through force or threats.  A — financial incentives is persuasion, not coercion.  B — legally required is compulsion by law, not by individual threatening.  C — misled about contents describes a different kind of manipulation.  Kelime: coerce — zorlamak, baskı yaparak yaptırmak","stem":"Investigators found evidence that employees had been coerced into signing the non-disclosure agreements, with supervisors threatening termination as a direct consequence of refusing to sign.  As used in the text, \"coerced\" most nearly means:","slug":"gri-mod-sat-v5-1-3"},{"slug":"gri-mod-sat-v5-1-4","why":"A is correct. Internalized system, automatic communication, consistent winning = unity and internal consistency. \"Cohesive\" = forming a unified whole; sticking together.  B — well-coached describes external guidance, not the team's internal unity.  C — above prior-season expectations describes improvement, not cohesion.  D — experienced and stable roster is a resource, not the quality of cohesion.  Kelime: cohesive — bütünlük taşıyan, tutarlı, bir arada tutan","stem":"The team's third season was the most cohesive in the franchise's history: the players had internalized the system, communicated automatically on defense, and won twelve consecutive games without a single poor performance.  As used in the text, \"cohesive\" most nearly means:","ans":"A","choices":{"C":"performing significantly above prior-season expectations","D":"supported by an experienced and stable roster","A":"characterized by unity and internal consistency","B":"well-coached and disciplined in execution"},"n":4},{"choices":{"C":"investigate the grievances of","D":"comply with the demands of following arbitration","A":"gain goodwill of; appease or placate","B":"negotiate a legally binding agreement with"},"n":5,"stem":"After months of public conflict, the company's new director attempted to conciliate the union by reinstating the disputed benefits, publicly acknowledging the workers' contributions, and meeting directly with shop stewards.  As used in the text, \"conciliate\" most nearly means:","slug":"gri-mod-sat-v5-1-5","why":"A is correct. Reinstating benefits, public acknowledgment, direct meetings = gaining goodwill, placating. \"Conciliate\" = to stop someone from being angry; to make peace with.  B — legally binding negotiation is a more formal process.  C — investigate grievances is a different step.  D — comply following arbitration implies a formal ruling.  Kelime: conciliate — uzlaştırmak, barıştırmak, hoşnut etmek","ans":"A"},{"choices":{"C":"accepting or allowing without protest or punishment","D":"shifting responsibility to other parties","B":"downplaying the severity of","A":"providing factual context to explain"},"n":6,"stem":"The school's refusal to take disciplinary action was widely interpreted as implicitly condoning the behavior — a perception that intensified after the principal publicly described the incident as a minor misunderstanding.  As used in the text, \"condoning\" most nearly means:","slug":"gri-mod-sat-v5-1-6","why":"C is correct. No disciplinary action = accepting or allowing without protest. \"Condone\" = to accept and allow behavior that is considered morally wrong.  A — providing context is different from condoning.  B — downplaying severity is a consequence, not the definition.  D — shifting responsibility is a different behavior.  Kelime: condone — görmezden gelmek, hoş görmek, affetmek","ans":"C"},{"ans":"D","stem":"The instructions for filing the tax rebate were so convoluted that the government's own telephone helpline had no clear answer to callers' questions and eventually directed most inquiries to an external consulting firm.  As used in the text, \"convoluted\" most nearly means:","why":"D is correct. So complicated that the government helpline had no answers = highly complicated, intricately tangled. \"Convoluted\" = extremely complex; intricately involved.  A — excessively lengthy due to repetition is verbose, not necessarily convoluted.  B — difficult to find is a different issue.  C — requiring specialist knowledge describes a skill requirement.  Kelime: convoluted — karmaşık, dolambaçlı, girift","slug":"gri-mod-sat-v5-1-7","n":7,"choices":{"A":"excessively lengthy due to unnecessary repetition","B":"difficult to find using standard search methods","C":"requiring specialist knowledge to complete accurately","D":"highly complicated; intricately tangled"}},{"ans":"D","stem":"The journalist arrived at the interview with copious notes — three notebooks filled with transcribed sources, cross-referenced with printed excerpts and hand-drawn timelines — suggesting months of preparatory research.  As used in the text, \"copious\" most nearly means:","slug":"gri-mod-sat-v5-1-8","why":"D is correct. Three notebooks, transcribed sources, cross-references, timelines = abundant in quantity. \"Copious\" = abundant in supply or quantity.  A — organized systematically describes structure, not quantity.  B — legitimately obtained describes provenance.  C — supplemented by electronic records is a detail about format.  Kelime: copious — bol, çok, geniş kapsamlı","n":8,"choices":{"B":"obtained through legitimate and verifiable means","A":"organized into a clear system of reference","C":"supplemented by electronic records","D":"abundant in quantity; extensive"}},{"slug":"gri-mod-sat-v5-1-9","why":"B is correct. Consistent unpublished details = supporting and confirming the account. \"Corroborate\" = to confirm or give support to a statement or theory.  A — challenge accuracy is the opposite.  C — establish as officially valid is more formal than corroborate.  D — amplify by adding detail is different from confirming.  Kelime: corroborate — doğrulamak, desteklemek, güçlendirmek","stem":"Three independent witnesses came forward to corroborate the survivor's account, providing details consistent with her description of events that had not been publicly disclosed before their interviews.  As used in the text, \"corroborate\" most nearly means:","ans":"B","choices":{"C":"help establish as officially valid","D":"amplify by adding additional detail","A":"challenge the accuracy of","B":"confirm or give support to"},"n":9},{"n":10,"choices":{"C":"motivated primarily by greed","D":"aware of the risks but willing to accept them","A":"financially inexperienced and poorly advised","B":"too willing to believe; easily deceived"},"ans":"B","stem":"The scam succeeded because it targeted credulous investors who did not question the implausibly high returns being promised, signing documents without independent legal or financial advice.  As used in the text, \"credulous\" most nearly means:","why":"B is correct. Not questioning implausible returns, signing without advice = too willing to believe. \"Credulous\" = having or showing too great a readiness to believe things.  A — inexperienced describes background, not disposition.  C — motivated by greed is a different driver.  D — aware of risks but accepting them describes a different attitude.  Kelime: credulous — safdil, çabuk inanan, saf","slug":"gri-mod-sat-v5-1-10"},{"n":11,"choices":{"B":"focused on summary rather than detail","A":"completed under significant time pressure","D":"conducted by an unqualified reviewer","C":"hasty and therefore not thorough"},"ans":"C","slug":"gri-mod-sat-v5-1-11","why":"C is correct. Missed errors that careful reading would have caught = hasty, not thorough. \"Cursory\" = hasty and therefore not thorough or detailed.  A — time pressure is a cause, not the definition.  B — focused on summary is a choice; cursory implies the thoroughness is lacking.  D — unqualified reviewer is a different issue.  Kelime: cursory — yüzeysel, acele, gelişigüzel","stem":"The manager's cursory review of the report missed three factual errors that a more careful reading would have caught, and the errors were only discovered when the document was distributed to the full board.  As used in the text, \"cursory\" most nearly means:"},{"n":12,"choices":{"D":"weakened to the point of being unable to function normally","C":"distracted by the demands of medical treatment","A":"isolated from professional networks","B":"forced to reconsider research priorities"},"ans":"D","stem":"The prolonged illness had debilitated the economist to the point where she could no longer attend conferences, maintain her research schedule, or complete the drafts she had been working on before her diagnosis.  As used in the text, \"debilitated\" most nearly means:","slug":"gri-mod-sat-v5-1-12","why":"D is correct. Could no longer attend conferences, maintain schedule, or complete drafts = weakened to the point of not functioning normally. \"Debilitate\" = to make someone very weak and infirm.  A — isolated from networks is a consequence, not the definition.  B — reconsidering priorities is a choice response.  C — distracted by treatment is a different effect.  Kelime: debilitate — zayıflatmak, güçten düşürmek"},{"why":"C is correct. Calling it an attack on civil liberties and demanding repeal = publicly declaring it wrong. \"Denounce\" = to publicly declare to be wrong or evil.  A — investigate through commission is a different process.  B — propose amendments is a constructive response.  D — refer to constitutional review is a legal process.  Kelime: denounce — kınamak, ihbar etmek; açıkça suçlamak","slug":"gri-mod-sat-v5-1-13","stem":"The opposition party moved quickly to denounce the legislation, calling it an attack on civil liberties, demanding its immediate repeal, and encouraging civil society organizations to join a coordinated campaign of resistance.  As used in the text, \"denounce\" most nearly means:","ans":"C","choices":{"C":"publicly declare to be wrong or evil","D":"refer to constitutional review by the judiciary","A":"investigate through an independent commission","B":"propose amendments to address identified weaknesses"},"n":13},{"stem":"Three consecutive droughts had severely depleted the region's groundwater reserves, and hydrologists warned that at current rates of extraction, the aquifer could reach critically low levels within a decade.  As used in the text, \"depleted\" most nearly means:","why":"D is correct. Three droughts severely reducing reserves = reduced significantly through use. \"Deplete\" = to use up the supply of.  A — contamination is a different kind of damage.  B — reduced replenishment rate is a cause, not the effect of depletion.  C — inaccessible is a different kind of problem.  Kelime: deplete — tüketmek, azaltmak, bitirmek","ans":"D","choices":{"D":"reduced significantly through use","C":"inaccessible due to deepening water tables","A":"contaminated through agricultural runoff","B":"reduced in replenishment rate"},"n":14,"slug":"gri-mod-sat-v5-1-14"},{"n":15,"choices":{"A":"the feeling that something is unworthy; contempt","B":"a carefully reasoned professional objection","C":"an ideological disagreement rooted in different values","D":"a strategic concern about practical implementation"},"ans":"A","why":"A is correct. Naive, tone-deaf, likely to backfire = she considers it unworthy, feels contempt for it. \"Disdain\" = the feeling that someone or something is unworthy of consideration.  B — carefully reasoned objection is analytical; disdain is emotional contempt.  C — ideological disagreement rooted in values is a principled stance.  D — strategic concern about implementation is practical, not contemptuous.  Kelime: disdain — hor görmek, küçümsemek, tepeden bakmak","slug":"gri-mod-sat-v5-1-15","stem":"The veteran diplomat made no effort to conceal her disdain for the proposal, describing it in the meeting as naive, politically tone-deaf, and likely to produce the opposite of its stated objectives.  As used in the text, \"disdain\" most nearly means:"},{"slug":"gri-mod-sat-v5-1-16","why":"C is correct. Submitting an alternative analysis reaching different conclusions = expressing opinions contrary to the majority. \"Dissent\" = to hold or express opinions that are at variance with an official view.  A — abstain means not participating; dissent means actively expressing disagreement.  B — supplement with data is adding to, not disagreeing with.  D — demand additional deliberation is a procedural request.  Kelime: dissent — karşı çıkmak, ayrı düşmek; muhalefet","stem":"Two members of the panel chose to dissent from the majority report, submitting a twelve-page alternative analysis that reached different conclusions on four of the report's ten recommendations.  As used in the text, \"dissent\" most nearly means:","ans":"C","choices":{"A":"abstain from voting on a contested question","B":"supplement the majority's findings with additional data","C":"hold or express opinions contrary to those of the majority","D":"demand a second round of deliberation before finalization"},"n":16},{"choices":{"D":"evaluating students harshly relative to professional standards","C":"knowledgeable but resistant to new research","B":"excessively attached to fixed beliefs; unwilling to consider alternatives","A":"inclined to impose one's views on others"},"n":17,"stem":"The professor was known for being dogmatic in her assessment of methodological choices: she dismissed approaches that deviated from her preferred framework without engaging with the evidence that supported them.  As used in the text, \"dogmatic\" most nearly means:","slug":"gri-mod-sat-v5-1-17","why":"B is correct. Dismissed alternatives without engaging with evidence = excessively attached to fixed beliefs. \"Dogmatic\" = inclined to lay down principles as incontrovertibly true.  A — imposing on others describes behavior toward others; dogmatic can be a private stance.  C — resistant to new research is related but dogmatic implies rejection regardless of evidence.  D — harsh evaluation is a behavioral quality, not dogmatism.  Kelime: dogmatic — dogmatik, katı, tartışmaya kapalı","ans":"B"},{"n":18,"choices":{"B":"unauthorized; acting beyond the scope of official responsibility","A":"deceitful; behaving in a way that shows two contradictory sides","D":"self-interested; prioritizing personal gain over the agreement","C":"negligent; failing to disclose relevant information"},"ans":"A","stem":"The negotiator's duplicitous conduct was eventually exposed: he had been simultaneously offering different terms to both parties, leading each side to believe it had secured concessions the other side had not received.  As used in the text, \"duplicitous\" most nearly means:","why":"A is correct. Offering different terms to both parties simultaneously = behaving deceptively with two contradictory faces. \"Duplicitous\" = deceitful; showing two contradictory sides.  B — unauthorized is a different violation.  C — negligent failure to disclose is carelessness, not calculated deception.  D — self-interested prioritization is a motivation, not the same as duplicity.  Kelime: duplicitous — iki yüzlü, sahte, samimiyetsiz","slug":"gri-mod-sat-v5-1-18"},{"slug":"gri-mod-sat-v5-1-19","why":"A is correct. Working midnight to dawn, refusing paper, courier notes = unconventional in behavior. \"Eccentric\" = unconventional and slightly strange; not following convention.  B — creatively chaotic is a different combination of qualities.  C — deliberately cultivating an image implies performance; eccentric behavior is genuine.  D — operating outside the professional mainstream is different from personal behavioral eccentricity.  Kelime: eccentric — alışılmışın dışında, tuhaf, ilginç","stem":"The inventor was considered eccentric even by the standards of his unconventional field: he worked only between midnight and dawn, refused to use printed paper, and communicated with his team exclusively through handwritten notes delivered by courier.  As used in the text, \"eccentric\" most nearly means:","ans":"A","choices":{"A":"unconventional in behavior or thought; odd","B":"highly creative but organizationally chaotic","D":"operating outside the mainstream of the professional field","C":"deliberately cultivating a distinctive public image"},"n":19},{"n":20,"choices":{"C":"require additional funding to investigate adequately","D":"appear in preliminary data but not replicate in later studies","A":"escape the understanding of; remain unclear to","B":"be disputed by competing research teams"},"ans":"A","why":"A is correct. They couldn't understand the mechanism even as the drug worked = escaped their understanding. \"Elude\" = to evade or escape from.  B — disputed by competitors is a different situation.  C — require additional funding is a resource issue.  D — appear in preliminary data but not replicate is a different problem.  Kelime: elude — kaçmak, atlatmak, akılda tutulamamak","slug":"gri-mod-sat-v5-1-20","stem":"The precise mechanism by which the drug prevented the cell mutation continued to elude researchers for three years, even as the clinical trials demonstrated its effectiveness in practice.  As used in the text, \"elude\" most nearly means:"},{"n":21,"choices":{"C":"experienced across a wide range of relevant topics","D":"controversial in their public positions on key questions","A":"widely regarded as outstanding in a field; distinguished","B":"recently recognized for a significant contribution"},"ans":"A","why":"A is correct. Nobel laureates, former heads of state, foundational scholar = widely regarded as outstanding. \"Eminent\" = famous and respected within a particular sphere.  B — recently recognized implies new prominence; eminent implies established distinction.  C — experienced across a wide range describes breadth, not distinction.  D — controversial implies disagreement about their positions.  Kelime: eminent — seçkin, önde gelen, çok tanınmış","stem":"The symposium brought together some of the most eminent scholars in the field, including three Nobel laureates, two former heads of state, and the scientist whose foundational paper had defined the discipline thirty years earlier.  As used in the text, \"eminent\" most nearly means:","slug":"gri-mod-sat-v5-1-21"},{"stem":"The philosopher argued that aesthetic judgments, while appearing subjective, could be informed by empirical findings about which structural features of works reliably produce pleasurable responses across diverse audiences.  As used in the text, \"empirical\" most nearly means:","slug":"gri-mod-sat-v5-1-22","why":"B is correct. Findings about structural features that produce measurable responses = based on observation and experiment. \"Empirical\" = based on observation or experience rather than theory alone.  A — widely agreed upon describes consensus, not empiricism.  C — established theoretical frameworks is the opposite of empirical grounding.  D — adjusted for culture describes a methodological consideration.  Kelime: empirical — deneysel, gözleme dayalı, ampirik","ans":"B","choices":{"A":"based on what is widely agreed upon","B":"derived from systematic observation and experiment","D":"adjusted to account for cultural differences","C":"supported by established theoretical frameworks"},"n":22},{"n":23,"choices":{"C":"regularly occurring in a particular area or system","D":"impossible to address without external assistance","A":"tolerated despite being widely recognized","B":"gradually worsening despite intervention"},"ans":"C","stem":"Corruption of this type was not unique to this administration — it was endemic to the regional procurement system, having persisted through five successive governments and survived several well-publicized reform efforts.  As used in the text, \"endemic\" most nearly means:","slug":"gri-mod-sat-v5-1-23","why":"C is correct. Persisted through five governments, survived reform efforts = regularly occurring in this particular system. \"Endemic\" = regularly found among particular people or in a certain area; ingrained.  A — tolerated describes a social response, not the nature of the problem.  B — gradually worsening implies a trend; endemic implies persistence.  D — impossible without external help is a different assessment.  Kelime: endemic — bir bölgeye özgü; kronik hale gelmiş"},{"choices":{"C":"influential only after death and posthumous recognition","D":"unconventional in creative process but not in public presence","A":"reluctant to accept commercial success or recognition","B":"mysterious; difficult to understand or interpret"},"n":24,"stem":"The composer left almost no personal correspondence, giving interviews only twice in thirty years, and released albums with no liner notes — an enigmatic figure whose biography remains largely a matter of speculation.  As used in the text, \"enigmatic\" most nearly means:","slug":"gri-mod-sat-v5-1-24","why":"B is correct. No correspondence, two interviews, no liner notes, biography speculative = mysterious, difficult to understand. \"Enigmatic\" = difficult to interpret or understand; mysterious.  A — reluctant to accept success is a specific attitude, not the quality of being enigmatic.  C — influential only posthumously is a different circumstance.  D — unconventional in process but not presence is a different distinction.  Kelime: enigmatic — gizemli, anlaşılması güç, esrarengiz","ans":"B"},{"slug":"gri-mod-sat-v5-1-25","why":"C is correct. Materials that deteriorate = lasting only briefly. \"Ephemeral\" = lasting for only a very short time.  A — visually striking is appearance quality.  B — intellectually inaccessible describes comprehension difficulty.  D — dependent on conditions describes fragility, not brevity.  Kelime: ephemeral — geçici, kısa ömürlü, anlık","stem":"The artist deliberately chose materials that would deteriorate over time, treating the ephemeral nature of the work not as a limitation but as a statement about impermanence and the futility of preservation.  As used in the text, \"ephemeral\" most nearly means:","ans":"C","choices":{"A":"visually striking but difficult to reproduce","B":"intellectually inaccessible without context","C":"lasting only for a short time; transitory","D":"dependent on specific environmental conditions"},"n":25}]}],"group":"Kelime","id":"v5","eyebrow":"Kelime"},{"group":"Kelime","name":"Philosophical & Analytical Vocabulary","blocks":[{"x":"SAT kelime â Philosophical & Analytical Vocabulary. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"ans":"C","why":"C is correct. Phrases allowing contradictory interpretations = open to more than one meaning. \"Equivocal\" = having more than one possible meaning; ambiguous.  A — simplified is not ambiguity.  B — conflict of interest is a motivation.  D — legal protection is a purpose, not the quality.  Kelime: equivocal — belirsiz, iki anlamlı, kaçamaklı","slug":"gri-mod-sat-v6-1-1","stem":"The minister's response was conspicuously equivocal, using phrases like 'in certain contexts' and 'depending on the evidence' in ways that allowed for mutually contradictory interpretations.  As used in the text, \"equivocal\" most nearly means:","n":1,"choices":{"D":"carefully worded to preserve legal protection","C":"open to more than one interpretation; ambiguous","A":"technically accurate but deliberately simplified","B":"evasive due to an obvious conflict of interest"}},{"n":2,"choices":{"A":"poorly communicated to a broader audience","B":"recently developed and not yet widely understood","C":"cross-disciplinary in a way that defied categorization","D":"intended only for a small circle with specialized knowledge"},"ans":"D","why":"D is correct. Requires languages, subfields, restricted archives = accessible only to a small specialized circle. \"Esoteric\" = intended for or understood by only a small group with specialized knowledge.  A — poorly communicated implies a communication failure.  B — recently developed is a different reason for limited access.  C — cross-disciplinary describes structure, not accessibility.  Kelime: esoteric — anlaşılması güç, az kişiye hitap eden","slug":"gri-mod-sat-v6-1-2","stem":"The professor's seminar was esoteric even by her department's standards: it required fluency in three languages, familiarity with three subfields, and access to an unpublished archive restricted to credentialed researchers.  As used in the text, \"esoteric\" most nearly means:"},{"ans":"B","why":"B is correct. Cooperative, truthful, voluntarily helpful = serving as a model worth imitating. \"Exemplary\" = serving as a desirable model.  A — legally compliant describes minimum compliance.  C — best possible outcome describes a result.  D — surprising given prior behavior is a contextual observation.  Kelime: exemplary — örnek niteliğinde, takdire değer","slug":"gri-mod-sat-v6-1-3","stem":"The judge praised the defendant's exemplary conduct during the trial — cooperative, truthful, and willing to provide documents not legally required but helpful to the court.  As used in the text, \"exemplary\" most nearly means:","n":3,"choices":{"D":"surprising given prior behavior in similar situations","C":"representing the best possible outcome","A":"legally compliant in all its particulars","B":"serving as a model worthy of imitation"}},{"slug":"gri-mod-sat-v6-1-4","ans":"A","why":"A is correct. Every contract, ninety-four individuals, thousand-page report = extremely thorough. \"Exhaustive\" = very comprehensive; covering all elements.  B — bureaucratic obstacles is a cause.  C — impartial experts describes process integrity.  D — wider than mandate is a scope observation.  Kelime: exhaustive — kapsamlı, eksiksiz, her şeyi kapsayan","stem":"The commission's review was exhaustive: it examined every contract signed over seven years, interviewed ninety-four individuals, and produced a final report of nearly a thousand pages before reaching its conclusions.  As used in the text, \"exhaustive\" most nearly means:","n":4,"choices":{"B":"time-consuming due to bureaucratic obstacles","A":"extremely thorough; covering all possibilities","C":"conducted by experts with no stake in the outcome","D":"wider in scope than the original mandate required"}},{"choices":{"D":"covered only partially by the organization's insurance","C":"difficult to justify to the organization's donors","B":"unreasonably high; greatly exceeding what is appropriate","A":"disproportionate to the complexity of the case"},"n":5,"slug":"gri-mod-sat-v6-1-5","why":"B is correct. Settled to avoid costs = unreasonably excessive. \"Exorbitant\" = unreasonably high in price.  A — disproportionate to complexity is a specific assessment.  C — difficult to justify to donors is a reporting problem.  D — insurance coverage is a financial detail.  Kelime: exorbitant — aşırı, fahiş, makul olanı çok aşan","stem":"The legal fees were so exorbitant that the nonprofit's board voted to settle the case rather than continue, even though their lawyer believed they had a strong chance of winning at trial.  As used in the text, \"exorbitant\" most nearly means:","ans":"B"},{"why":"B is correct. Gauge public reaction before committing = convenient, self-interested practicality. \"Expedient\" = convenient and practical, often at the expense of principle.  A — legally required is a different basis.  C — widely seen as sensible is a consensus view.  D — deferred to senior authority is a procedural step.  Kelime: expedient — pratik, elverişli; çıkara dayalı","slug":"gri-mod-sat-v6-1-6","stem":"The committee's decision to delay the vote was politically expedient rather than principled: it allowed each member to gauge public reaction before committing to a position that might prove unpopular.  As used in the text, \"expedient\" most nearly means:","ans":"B","choices":{"A":"legally required under parliamentary procedure","B":"convenient and practical, often for self-interested reasons","D":"postponed in deference to a more senior authority","C":"widely seen as the most sensible option"},"n":6},{"stem":"The contract contained an explicit clause forbidding the use of any proprietary data for competitive purposes, meaning the company had no legal grounds to argue ambiguity when the dispute arose.  As used in the text, \"explicit\" most nearly means:","slug":"gri-mod-sat-v6-1-7","why":"D is correct. Could not argue ambiguity = stated clearly, no room for interpretation. \"Explicit\" = stated clearly and in detail.  A — legal precedent is a different basis.  B — recently added is a historical detail.  C — agreed upon is a general contract condition.  Kelime: explicit — açık, net, kesin olarak ifade edilmiş","ans":"D","choices":{"B":"recently added to standard contract language","A":"supported by legal precedent from prior cases","D":"stated clearly and in detail; leaving no room for ambiguity","C":"agreed upon by both parties prior to signing"},"n":7},{"choices":{"D":"verified through independent fact-checking","C":"contrasted favorably against competing candidates","B":"documented objectively with supporting evidence","A":"praised enthusiastically"},"n":8,"why":"A is correct. Testimonials on a campaign poster = enthusiastic praise. \"Extol\" = to praise enthusiastically.  B — objectively documented implies neutral reporting.  C — contrasted favorably describes comparison, not pure praise.  D — fact-checking describes verification.  Kelime: extol — övmek, yüceltmek, göklere çıkarmak","slug":"gri-mod-sat-v6-1-8","stem":"The campaign poster was dominated by testimonials that extolled the candidate's record on public safety, featuring quotes from police commissioners, prosecutors, and community organizers across three counties.  As used in the text, \"extolled\" most nearly means:","ans":"A"},{"why":"C is correct. Made a joke about serious legislation = treating a serious issue with inappropriate humor. \"Facetious\" = treating serious issues with deliberately inappropriate humor.  A — dismissive is close but facetious specifies humor as the vehicle.  B — uncharacteristically informal describes a change in register.  D — audience targeting describes purpose, not the quality.  Kelime: facetious — şakacı, ciddiye alınmayacak, hafife alan","slug":"gri-mod-sat-v6-1-9","stem":"The senator's facetious remark about the legislation being written for extraterrestrials drew laughter from the gallery but frustrated colleagues who felt the debate warranted more substantive engagement.  As used in the text, \"facetious\" most nearly means:","ans":"C","choices":{"C":"treating serious issues with deliberately inappropriate humor","D":"designed to appeal to the gallery rather than persuade colleagues","A":"inappropriately dismissive of a serious issue","B":"uncharacteristically informal for a formal setting"},"n":9},{"n":10,"choices":{"D":"slower than automated tools at identifying discrepancies","C":"limited in their access to relevant information","B":"biased due to familiarity with the subject","A":"capable of making errors; not infallible"},"ans":"A","stem":"Even the most experienced auditors are fallible, which is why the firm requires two independent reviewers to verify any finding before it is included in the final report.  As used in the text, \"fallible\" most nearly means:","slug":"gri-mod-sat-v6-1-10","why":"A is correct. Even experienced auditors make errors — hence the two-reviewer requirement = capable of making mistakes. \"Fallible\" = capable of making mistakes.  B — biased due to familiarity is a specific kind of error.  C — limited access describes an information problem.  D — slower than automated tools describes a speed comparison.  Kelime: fallible — yanılabilir, hatalı olabilecek"},{"choices":{"D":"protective of relationships built over many years","C":"very attentive to accuracy and detail; hard to please","A":"unusually knowledgeable about agricultural production methods","B":"committed to supporting local and sustainable producers"},"n":11,"stem":"The chef was fastidious about sourcing: she visited suppliers personally, tasted samples before committing to orders, and dropped any producer whose quality she found inconsistent across two consecutive seasons.  As used in the text, \"fastidious\" most nearly means:","why":"C is correct. Personal visits, taste tests, dropping inconsistent suppliers = very attentive to quality, hard to please. \"Fastidious\" = very attentive to accuracy and detail.  A — knowledge of production is a separate quality.  B — commitment to local producers is a values issue.  D — protective of relationships is a loyalty quality.  Kelime: fastidious — titiz, özenli, seçici","ans":"C","slug":"gri-mod-sat-v6-1-11"},{"slug":"gri-mod-sat-v6-1-12","choices":{"D":"consistent with motivational research on team performance","C":"outwardly expressed rather than privately held","B":"technically informed and methodologically precise","A":"having or showing passionate intensity of feeling"},"n":12,"why":"A is correct. Belief communicated in every speech and drill with intensity = passionate intensity of feeling. \"Fervent\" = having or showing great warmth and intensity.  B — technically informed is a different quality.  C — outwardly expressed describes expression, not the feeling.  D — consistent with research describes an external standard.  Kelime: fervent — ateşli, coşkulu, tutkulu","stem":"The coach's fervent belief in the team's potential was communicated in every speech she gave and every drill she ran — an intensity that the players found either energizing or exhausting depending on the moment.  As used in the text, \"fervent\" most nearly means:","ans":"A"},{"choices":{"A":"influenced by external cultural and social forces","B":"changing frequently and unexpectedly; capricious","D":"driven by commercial rather than aesthetic considerations","C":"highly competitive due to low barriers to entry"},"n":13,"stem":"The fashion industry is notoriously fickle: what is considered essential this season may be dismissed as dated within eighteen months, requiring designers to anticipate trends years before they materialize.  As used in the text, \"fickle\" most nearly means:","slug":"gri-mod-sat-v6-1-13","why":"B is correct. Essential now, dated in eighteen months = changing frequently, capricious. \"Fickle\" = changing frequently; not reliable.  A — influenced by external forces is a cause.  C — competitive due to low barriers is an economic characteristic.  D — commercial over aesthetic is a motivational description.  Kelime: fickle — dönek, kararsız, tutarsız","ans":"B"},{"n":14,"choices":{"C":"motivated by commercial pressures from the league","D":"conspicuously and obviously wrong; shockingly so","B":"clearly contrary to the official rules of the game","A":"legally actionable under governing regulations"},"ans":"D","stem":"The referee's decision was widely condemned as a flagrant misapplication of the rule, clearly contradicting the regulation's plain language and appearing to benefit the home team in a way that drew immediate protests.  As used in the text, \"flagrant\" most nearly means:","slug":"gri-mod-sat-v6-1-14","why":"D is correct. Widely condemned, plain-language contradiction, immediate protests = conspicuously and obviously wrong. \"Flagrant\" = conspicuously offensive; brazenly obvious.  A — legally actionable is a consequence.  B — clearly contrary to rules is the specific mistake, not the quality of flagrancy.  C — commercial motivations speculates about purpose.  Kelime: flagrant — açık, bariz, yüzsüz (olumsuz bağlamda)"},{"slug":"gri-mod-sat-v6-1-15","choices":{"D":"prevent or obstruct by taking advance action","C":"delay by withholding relevant information","B":"minimize impact through strategic communication","A":"predict with a high degree of accuracy"},"n":15,"stem":"The company released a preemptive statement designed to forestall negative coverage, hoping to set the narrative before journalists had time to analyze the documents once they became public.  As used in the text, \"forestall\" most nearly means:","why":"D is correct. Preemptive statement to prevent coverage before it happened = taking advance action to obstruct. \"Forestall\" = to prevent something by taking action first.  A — predict accurately is a different function.  B — minimize impact through communication describes reputation management.  C — delay by withholding is a different tactic.  Kelime: forestall — önceden önlemek, önüne geçmek","ans":"D"},{"n":16,"choices":{"A":"experienced in cases with high reputational stakes","B":"inspiring awe or dread due to impressive scale","D":"recognized as the leading authority in the relevant area","C":"well-compensated relative to the complexity of the work"},"ans":"B","why":"B is correct. Four Supreme Court wins, forty litigators, precedent-setting brief = impressively powerful, inspiring awe. \"Formidable\" = inspiring respect or dread through impressive power.  A — experienced in high-stakes cases describes background.  C — well-compensated is a financial detail.  D — recognized as leading authority describes reputation.  Kelime: formidable — ürkütücü, zorlu, etkileyici","slug":"gri-mod-sat-v6-1-16","stem":"The legal team they faced was formidable: the lead attorney had won four consecutive Supreme Court cases, the firm had forty specialized litigators, and their research department had produced the precedent-setting brief.  As used in the text, \"formidable\" most nearly means:"},{"n":17,"choices":{"D":"affecting only certain types of users or use cases","C":"identified only after extensive user testing","B":"long-recognized but previously considered unsolvable","A":"forming a necessary base or core; essential"},"ans":"A","stem":"The redesign addressed not just the interface but a fundamental problem in the application's architecture: the way data moved between modules had made every update slower, regardless of how optimized the code was.  As used in the text, \"fundamental\" most nearly means:","why":"A is correct. A problem in the architecture = a problem at the core level. \"Fundamental\" = forming a necessary base or core; essential.  B — long-recognized but unsolvable describes history.  C — identified only after testing describes discovery.  D — affecting only certain users describes scope.  Kelime: fundamental — temel, esas, köklü","slug":"gri-mod-sat-v6-1-17"},{"choices":{"D":"attracted or gathered; obtained","C":"maintained consistently across different contexts","A":"produced as a result of long collaborative effort","B":"exceeded expectations set by prior work"},"n":18,"stem":"The documentary garnered significant attention at film festivals before its commercial release, winning three awards and generating a wave of critical commentary that broadened its audience considerably.  As used in the text, \"garnered\" most nearly means:","slug":"gri-mod-sat-v6-1-18","why":"D is correct. Winning awards and generating commentary = attracted, gathered, obtained. \"Garner\" = to gather or collect; to obtain.  A — collaborative effort describes a production method.  B — exceeded expectations describes reception quality.  C — maintained consistently describes persistence.  Kelime: garner — toplamak, edinmek, kazanmak","ans":"D"},{"slug":"gri-mod-sat-v6-1-19","why":"C is correct. Should have been prominent but was hidden in a footnote = conspicuous omission, obviously problematic. \"Glaring\" = highly conspicuous; obvious.  A — legally significant describes consequences.  B — impossible without bad faith implies intent.  D — apparent only to specialists is the opposite of glaring.  Kelime: glaring — göze batan, bariz, açık","stem":"The annual report contained a glaring omission: it mentioned the legal dispute in a footnote but said nothing about the sixty-million-dollar contingent liability that the dispute represented.  As used in the text, \"glaring\" most nearly means:","ans":"C","choices":{"C":"highly conspicuous and obvious, especially when problematic","D":"apparent only to those with specialist financial knowledge","B":"impossible to explain without bad faith","A":"legally significant in its potential consequences"},"n":19},{"n":20,"choices":{"D":"characteristic of someone unaccustomed to critical questioning","C":"deliberately provocative in a public setting","A":"arrogantly superior; showing disdain for others","B":"excessively rehearsed and performatively confident"},"ans":"A","slug":"gri-mod-sat-v6-1-20","why":"A is correct. Pause, ceiling look, dismissive statement = arrogantly superior, disdainful. \"Haughty\" = arrogantly superior; disdainfully proud.  B — rehearsed confidence describes a performance quality.  C — deliberately provocative implies intent to upset.  D — unaccustomed to questioning describes a situational explanation.  Kelime: haughty — kibirli, küstah, kendini beğenmiş","stem":"The heiress's haughty response to the journalist's question — she paused, looked at the ceiling, and said 'I really do not see why that would be relevant' — was widely circulated as an example of entitled behavior.  As used in the text, \"haughty\" most nearly means:"},{"n":21,"choices":{"B":"formal treaties establishing economic and military alliances","A":"dominance or leadership, especially over other countries","C":"the comparative advantage a country has in certain industries","D":"the ability to maintain internal stability"},"ans":"A","slug":"gri-mod-sat-v6-1-21","why":"A is correct. Military power, diplomatic leverage, control of institutions = dominance over other countries. \"Hegemony\" = leadership or dominance, especially of one country over others.  B — formal treaties describe diplomatic instruments.  C — comparative advantage is an economic concept.  D — maintaining internal stability is different from external hegemony.  Kelime: hegemony — hegemonya, üstünlük, hâkimiyet","stem":"The currency's dominance was not simply a function of the issuing country's economic size — it reflected a broader hegemony that included military power, diplomatic leverage, and the control of key global institutions.  As used in the text, \"hegemony\" most nearly means:"},{"n":22,"choices":{"C":"delay or obstruct the progress of","D":"draw external scrutiny to an otherwise private process","A":"prevent entirely from completion","B":"require the involvement of additional personnel"},"ans":"C","why":"C is correct. Repeating steps, launch pushed back = delaying, obstructing progress. \"Hinder\" = to make it difficult for someone; to delay.  A — prevent entirely is too strong; hinder implies delay, not total prevention.  B — require additional personnel is a consequence.  D — draw external scrutiny is a different effect.  Kelime: hinder — engellemek, zorlaştırmak, geciktirmek","slug":"gri-mod-sat-v6-1-22","stem":"Persistent technical failures continued to hinder the team's progress, forcing engineers to repeat steps they had already completed and pushing the projected launch date back by several weeks.  As used in the text, \"hinder\" most nearly means:"},{"n":23,"choices":{"B":"make clearer by providing detail or explanation","A":"confirm the most widely accepted version of events","C":"reconstruct through physical evidence alone","D":"reduce to its most essential elements"},"ans":"B","slug":"gri-mod-sat-v6-1-23","why":"B is correct. Provides new understanding of economic pressures = makes clearer through detail and explanation. \"Illuminate\" = to help clarify or explain; to shed light on.  A — confirm the accepted version is different; illuminate can offer new information.  C — reconstruct through physical evidence is a specific method.  D — reduce to essentials is simplification, not illumination.  Kelime: illuminate — aydınlatmak, açıklamak, anlaşılır kılmak","stem":"The new documentary does not attempt to resolve the longstanding controversy about the composer's final years but does illuminate the economic pressures that shaped her choices during that period.  As used in the text, \"illuminate\" most nearly means:"},{"n":24,"choices":{"B":"predictable based on historical weather patterns","A":"unavoidable regardless of precautions taken","C":"severe enough to require government intervention","D":"about to happen very soon"},"ans":"D","stem":"With the storm less than six hours from landfall and wind speeds still accelerating, evacuation was no longer optional — the danger was imminent and the time for voluntary action had effectively passed.  As used in the text, \"imminent\" most nearly means:","slug":"gri-mod-sat-v6-1-24","why":"D is correct. Less than six hours from landfall = about to happen very soon. \"Imminent\" = about to happen; impending.  A — unavoidable regardless of precautions is fatalism.  B — predictable based on patterns describes forecasting.  C — severe enough for government intervention is a different threshold.  Kelime: imminent — yakın, çok yakında olacak"},{"ans":"C","stem":"Outdated permitting requirements were found to impede the construction of new housing, adding between six and eighteen months to project timelines and significantly increasing development costs.  As used in the text, \"impede\" most nearly means:","why":"C is correct. Adding six to eighteen months = delaying, obstructing. \"Impede\" = to slow or obstruct progress.  A — financial barriers are a consequence.  B — selective application describes unequal enforcement.  D — additional requirements describes the mechanism.  Kelime: impede — engellemek, zorlaştırmak, geciktirmek","slug":"gri-mod-sat-v6-1-25","n":25,"choices":{"A":"create financial barriers for small developers","B":"prevent small-scale projects while permitting larger ones","C":"delay or obstruct the progress of","D":"subject projects to additional requirements not applied elsewhere"}}]}],"id":"v6","eyebrow":"Kelime"},{"blocks":[{"x":"SAT kelime â Argumentation & Logic Vocabulary. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"choices":{"A":"treating all parties equally; not biased","B":"legally authorized to make a binding decision","D":"acceptable to both parties before proceedings begin","C":"experienced in resolving disputes in this sector"},"n":1,"stem":"The arbitration panel was selected to ensure an impartial judgment: each member was required to have no prior professional or financial relationship with either of the disputing companies.  As used in the text, \"impartial\" most nearly means:","why":"A is correct. No prior relationships with either party = not biased toward either. \"Impartial\" = treating all parties equally and fairly.  B — legally authorized describes formal authority.  C — experienced in the sector describes expertise.  D — acceptable to both is a consent condition.  Kelime: impartial — tarafsız, yansız, önyargısız","slug":"gri-mod-sat-v7-1-1","ans":"A"},{"stem":"The memo's tone carried an implicit warning that the department head did not want to articulate directly: if the targets were not met in the next quarter, personnel changes would follow.  As used in the text, \"implicit\" most nearly means:","why":"C is correct. Warning in the tone but not directly articulated = implied rather than stated explicitly. \"Implicit\" = implied though not plainly expressed.  A — communicated through formal channels describes the medium.  B — understated to avoid accountability is a possible motivation.  D — likely to be misunderstood is a different quality.  Kelime: implicit — zımni, açıkça söylenmemiş, ima edilen","slug":"gri-mod-sat-v7-1-2","ans":"C","choices":{"D":"likely to be misunderstood without additional context","C":"implied or suggested rather than directly stated","A":"communicated through formal written channels","B":"deliberately understated to minimize accountability"},"n":2},{"slug":"gri-mod-sat-v7-1-3","choices":{"D":"expensive relative to its aesthetic contribution","C":"not in harmony with its surroundings; out of place","A":"structurally unsound compared to older buildings","B":"praised by some while criticized by others"},"n":3,"why":"C is correct. Glass pavilion next to stone cathedral, divided reactions = out of harmony with surroundings. \"Incongruous\" = not in harmony or keeping with the surroundings.  A — structural soundness is a different quality.  B — praised by some and criticized by others describes divided reception.  D — expensive relative to contribution is a value judgment.  Kelime: incongruous — uyumsuz, yersiz, birbiriyle bağdaşmayan","stem":"The ultra-modern glass pavilion looked incongruous beside the centuries-old stone cathedral — a juxtaposition that delighted architecture critics but troubled preservationists who felt the new structure undermined the historic setting.  As used in the text, \"incongruous\" most nearly means:","ans":"C"},{"n":4,"choices":{"D":"professionally obligated to present findings without modification","C":"deliberately insensitive to the concerns of stakeholders","B":"unaware of the political context surrounding the research","A":"having no particular interest or concern; not affected by"},"ans":"A","why":"A is correct. Not affected by political sensitivity, same directness regardless = having no particular concern. \"Indifferent\" = having no particular interest or sympathy; unconcerned.  B — unaware implies lack of knowledge; indifferent implies awareness but lack of concern.  C — deliberately insensitive implies intentional disregard; indifferent is simply unconcerned.  D — professionally obligated implies external constraint.  Kelime: indifferent — kayıtsız, umursamaz, ilgisiz","slug":"gri-mod-sat-v7-1-4","stem":"The consultant was indifferent to the political sensitivity of her findings, presenting the data with the same directness she would have brought to any other research context, regardless of who might be embarrassed.  As used in the text, \"indifferent\" most nearly means:"},{"ans":"C","stem":"The professor was visibly indignant when the review committee suggested her methodology was outdated, describing their assessment as uninformed and demanding that the critique be resubmitted with specific citations.  As used in the text, \"indignant\" most nearly means:","slug":"gri-mod-sat-v7-1-5","why":"C is correct. Called assessment uninformed, demanded citations = showing anger at what she considered unfair. \"Indignant\" = feeling or showing anger because of something unjust.  A — surprised implies unexpectedness; indignant implies a sense of injustice.  B — professionally embarrassed is different from righteous anger.  D — determined to contest is a behavioral response, not the emotion.  Kelime: indignant — öfkeli, kızgın, haksızlığa uğramış hisseden","n":5,"choices":{"B":"professionally embarrassed by a public criticism","A":"surprised by a conclusion she had not anticipated","C":"feeling or showing anger about unfair treatment","D":"determined to contest a decision through formal channels"}},{"choices":{"B":"confirm by consulting independent sources","A":"publicly speculate without sufficient evidence","D":"conclude from evidence; deduce","C":"report based on information from official channels"},"n":6,"why":"D is correct. From three resignations, observers concluded something about the investigation = deduce from evidence. \"Infer\" = to conclude from evidence or reasoning.  A — publicly speculate implies insufficient grounding.  B — confirm from independent sources is verification.  C — report from official channels is a different journalistic practice.  Kelime: infer — çıkarım yapmak, sonuç çıkarmak","slug":"gri-mod-sat-v7-1-6","stem":"From the sudden resignation of three senior officials in the same week, observers began to infer that the investigation had moved further than official statements had indicated.  As used in the text, \"infer\" most nearly means:","ans":"D"},{"choices":{"A":"socially inexperienced in a professionally limiting way","B":"unusually empathetic toward the opposing party","C":"unlikely to detect deception by experienced counterparts","D":"innocent and candid; not secretive or deceptive"},"n":7,"why":"D is correct. Visible excitement, expressing surprise openly = innocent, candid, not concealing. \"Ingenuous\" = innocent and candid; not practicing concealment.  A — socially inexperienced is a consequence.  B — unusually empathetic is a different quality.  C — unlikely to detect deception is a consequence.  Kelime: ingenuous — saf, açık sözlü, samimi (aldatıcı olmayan)","slug":"gri-mod-sat-v7-1-7","stem":"The young diplomat's ingenuous manner — her visible excitement at being in the room, her tendency to express surprise openly — was charming in social settings but made her colleagues nervous in formal negotiations.  As used in the text, \"ingenuous\" most nearly means:","ans":"D"},{"n":8,"choices":{"B":"unusually or disproportionately large","A":"difficult to predict due to shifting requirements","D":"approved without sufficient preliminary planning","C":"poorly managed from the beginning"},"ans":"B","why":"B is correct. Estimated three months became eleven, absorbed sixty percent = far more than expected. \"Inordinate\" = unusually or disproportionately large; excessive.  A — difficult to predict is a planning quality.  C — poorly managed is a management assessment.  D — approved without planning describes a process failure.  Kelime: inordinate — aşırı, gereğinden fazla, ölçüsüz","slug":"gri-mod-sat-v7-1-8","stem":"The project consumed an inordinate amount of resources: what had been estimated as a three-month initiative stretched to eleven months, absorbing sixty percent of the team's annual capacity.  As used in the text, \"inordinate\" most nearly means:"},{"n":9,"choices":{"D":"effective regardless of the players available to implement it","C":"based on deep experience in the relevant area","A":"bold and willing to take calculated risks","B":"having or showing an accurate and deep understanding"},"ans":"B","stem":"The coach's halftime adjustments were insightful: she identified in forty minutes what the opposing team's analysts had spent months designing, and her defensive scheme completely neutralized the strategy.  As used in the text, \"insightful\" most nearly means:","why":"B is correct. Identified in forty minutes what months of design had built = accurate and deep understanding. \"Insightful\" = having or showing an accurate and deep understanding.  A — bold and risk-taking is a different quality.  C — deep experience is a possible source, not the definition.  D — effective regardless of players describes robustness.  Kelime: insightful — kavrayışlı, derinlemesine anlayan","slug":"gri-mod-sat-v7-1-9"},{"slug":"gri-mod-sat-v7-1-10","ans":"B","stem":"The whistleblower's decision to go public before consulting the legal team may have jeopardized the formal investigation, potentially alerting individuals under scrutiny before evidence could be secured.  As used in the text, \"jeopardize\" most nearly means:","why":"B is correct. Going public before evidence was secured = putting the investigation at risk. \"Jeopardize\" = to put something in danger.  A — complicate by adding parties is more specific.  C — slowing by competing narratives is one way of jeopardizing.  D — require coordination is a logistical consequence.  Kelime: jeopardize — tehlikeye atmak, riske sokmak","n":10,"choices":{"B":"put into danger or at risk of failure","A":"complicate by adding additional parties","C":"slow the investigation by introducing competing narratives","D":"require coordination with additional agencies"}},{"slug":"gri-mod-sat-v7-1-11","n":11,"choices":{"C":"having or showing good judgment; wise","D":"responsive to the recommendations of the legal department","A":"experienced in making difficult decisions under pressure","B":"conservative in choosing stories to minimize risk"},"ans":"C","why":"C is correct. Prioritizing newsworthy and legally defensible stories = showing good judgment. \"Judicious\" = having, showing, or done with good judgment.  A — experienced describes background.  B — conservative to minimize risk is a risk-averse strategy.  D — responsive to legal recommendations describes deference.  Kelime: judicious — ihtiyatlı, sağduyulu, yerinde","stem":"The senior editor's judicious selection of which stories to pursue — prioritizing investigations that were both newsworthy and legally defensible — was credited with protecting the publication from potential lawsuits.  As used in the text, \"judicious\" most nearly means:"},{"ans":"C","stem":"The opening chapter succeeded in kindling the reader's curiosity without fully explaining the situation — an ambiguity that kept the narrative taut while suggesting that a much larger story was unfolding.  As used in the text, \"kindling\" most nearly means:","slug":"gri-mod-sat-v7-1-12","why":"C is correct. Awakening curiosity through ambiguity = arousing a feeling. \"Kindle\" = to arouse or inspire a feeling.  A — satisfying through complete revelation is the opposite.  B — sustaining through pacing is related but kindle means to arouse, not sustain.  D — preparing for a conclusion is a different narrative function.  Kelime: kindle — tutuşturmak, ateşlemek; harekete geçirmek","n":12,"choices":{"D":"preparing the reader for an unexpected conclusion","C":"arousing or inspiring a feeling","A":"satisfying through clear and complete revelation","B":"sustaining through carefully paced narrative"}},{"ans":"D","stem":"The critic lauded the performance as a career-defining achievement, singling out the lead actor's controlled physicality and the director's willingness to allow long silences to carry emotional weight.  As used in the text, \"lauded\" most nearly means:","slug":"gri-mod-sat-v7-1-13","why":"D is correct. Career-defining, singling out specific praised qualities = enthusiastic praise. \"Laud\" = to praise highly.  A — selected for awards is formal institutional recognition.  B — discussed at length in specialized contexts is critical attention.  C — cited as an influence is a legacy function.  Kelime: laud — övmek, alkışlamak, yüceltmek","n":13,"choices":{"D":"praised enthusiastically","C":"cited as an influence on subsequent works","A":"selected for recognition by a professional awards body","B":"discussed at length in specialized critical contexts"}},{"choices":{"C":"unnecessarily expensive relative to the occasion","D":"designed to impress a specific group of high-status guests","B":"generous to a large extent; sumptuously rich","A":"organized in a way that reflected the host's personal taste"},"n":14,"slug":"gri-mod-sat-v7-1-14","why":"B is correct. Three hundred guests, orchestra, imported flowers, Michelin chef = sumptuously generous and rich. \"Lavish\" = sumptuously rich, elaborate, or luxurious.  A — reflecting personal taste is a different quality.  C — unnecessarily expensive is a judgment; lavish simply describes abundance.  D — designed to impress specific guests describes purpose.  Kelime: lavish — cömert, savurgan; bol, gösterişli","stem":"The reception was lavish by any standard: three hundred guests, a twenty-piece orchestra, flowers flown in from the Netherlands, and a menu developed by a chef who had trained at three Michelin-starred restaurants.  As used in the text, \"lavish\" most nearly means:","ans":"B"},{"stem":"The company disputed the regulatory body's authority to impose the fine, arguing that the action fell outside the agency's legitimate jurisdiction under the statute that had created it.  As used in the text, \"legitimate\" most nearly means:","slug":"gri-mod-sat-v7-1-15","why":"A is correct. Outside the lawful scope of authority = beyond what is valid and lawfully defined. \"Legitimate\" = conforming to the law or to rules; justifiable.  B — consistent with administration policy describes alignment.  C — recognized by other bodies describes external validation.  D — explicitly granted versus implied is a legal distinction within legitimacy.  Kelime: legitimate — meşru, yasal, geçerli","ans":"A","choices":{"B":"consistent with the policy objectives of the administration","A":"conforming to the law or rules; valid and justifiable","C":"recognized as such by other regulatory bodies","D":"explicitly granted by the legislature rather than implied"},"n":15},{"ans":"A","stem":"The judge's lenient sentence — three years' probation with no custodial element — was defended by the defense attorney as appropriate for a first-time offender but criticized by victim advocates as inadequate.  As used in the text, \"lenient\" most nearly means:","why":"A is correct. Probation only, no custodial element = merciful, not severe. \"Lenient\" = more merciful or tolerant than expected.  B — unconventional is a different characterization.  C — consistent with comparable sentences would suggest it was standard.  D — motivated by rehabilitation is a possible reason.  Kelime: lenient — müsamahakâr, hoşgörülü, yumuşak","slug":"gri-mod-sat-v7-1-16","n":16,"choices":{"C":"consistent with sentences given for comparable offenses","D":"motivated by an assessment of rehabilitation potential","A":"more merciful than strict; not severe","B":"unconventional in its application of sentencing guidelines"}},{"ans":"D","slug":"gri-mod-sat-v7-1-17","why":"D is correct. Revenues tripled, exceptional distributions = producing a great deal of profit. \"Lucrative\" = producing a great deal of profit.  A — strategically wise is a different quality.  B — widely respected describes reputation.  C — sustainable is a different economic consideration.  Kelime: lucrative — kazançlı, kârlı, gelir getiren","stem":"The firm's pivot toward corporate law proved lucrative: within three years, revenues had tripled, it had added forty associates, and the founding partners had each received distributions exceeding their prior decade's earnings.  As used in the text, \"lucrative\" most nearly means:","n":17,"choices":{"D":"producing a great deal of profit or money","C":"sustainable over a longer term than alternative specializations","A":"strategically wise given the competitive landscape","B":"widely respected within the professional community"}},{"slug":"gri-mod-sat-v7-1-18","why":"D is correct. Praising the rival despite bitter competition = generous in spirit toward a rival. \"Magnanimous\" = generous or forgiving, especially toward a rival.  A — strategically generous implies calculated self-interest.  B — deliberately understated describes a communication choice.  C — emotionally mature is a broader quality.  Kelime: magnanimous — cömert kalpli, alicenap, kin gütmeyen","stem":"Despite the bitterness of the rivalry, the champion was magnanimous in victory, praising her opponent's preparation and sportsmanship rather than dwelling on her own superiority or the errors that had cost her challenger the match.  As used in the text, \"magnanimous\" most nearly means:","ans":"D","choices":{"A":"strategically generous to build a positive public image","B":"deliberately understated to avoid seeming arrogant","D":"generous in spirit, especially toward a rival","C":"emotionally mature in managing competitive relationships"},"n":18},{"ans":"D","why":"D is correct. Deliberately flooding with content to trigger artificial signals = skillfully controlling in an unfair, deceptive way. \"Manipulate\" = to control or influence cleverly or unscrupulously.  A — bypassed through expertise describes circumventing.  B — replicated artificially is what the manipulation involves.  C — improved by targeted interventions is a benign framing.  Kelime: manipulate — manipüle etmek, yönlendirmek","slug":"gri-mod-sat-v7-1-19","stem":"The campaign was later found to have deliberately manipulated the algorithm's recommendations by flooding the platform with low-cost content designed to trigger engagement signals without genuine user interest.  As used in the text, \"manipulated\" most nearly means:","n":19,"choices":{"B":"replicated artificially to simulate organic growth","A":"bypassed through technical expertise","D":"controlled or influenced skillfully, especially in an unfair way","C":"improved in measurable ways by targeted interventions"}},{"choices":{"A":"lacking in quantity or quality; insufficient","B":"professionally disappointing but scientifically useful","D":"produced under particularly difficult conditions","C":"limited in scope due to financial constraints"},"n":20,"stem":"Despite years of effort, the survey yielded meager results: three ceramic fragments and a corroded coin — consistent with human habitation but insufficient to confirm the settlement the team had sought.  As used in the text, \"meager\" most nearly means:","why":"A is correct. Three fragments after years of effort = lacking in quantity, insufficient. \"Meager\" = lacking in quantity or quality; not large enough.  B — disappointing but useful is an assessment.  C — limited due to financial constraints is a possible cause.  D — difficult conditions is a circumstance.  Kelime: meager — yetersiz, az, kıt","slug":"gri-mod-sat-v7-1-20","ans":"A"},{"ans":"A","slug":"gri-mod-sat-v7-1-21","why":"A is correct. Practice exercise, no binding consequences = serving as a simulation, not the real thing. \"Mock\" = not authentic; serving as an imitation of.  B — professional supervision describes the setting.  C — designed to reveal weaknesses is a possible purpose.  D — more demanding than the actual process is a specific design choice.  Kelime: mock — sahte, yapay, gerçek olmayan","stem":"The exercise was a mock negotiation: students took assigned roles, the professor observed from the back, and the outcomes had no binding consequences — but the pressure felt real enough to produce authentic behavior.  As used in the text, \"mock\" most nearly means:","n":21,"choices":{"A":"serving as a practice simulation; not genuine","B":"conducted under professional supervision","D":"more demanding than the actual process it represented","C":"designed to reveal weaknesses in current strategies"}},{"ans":"B","slug":"gri-mod-sat-v7-1-22","why":"B is correct. Speaking little, declining invitations, apparent purposelessness = gloomy, sullen. \"Morose\" = sullen and ill-tempered; gloomy.  A — resentful implies directed anger; morose is generalized gloom.  C — unable to concentrate describes a cognitive effect.  D — reluctant to begin new work is a behavioral response.  Kelime: morose — asık suratlı, somurtkan, neşesiz","stem":"In the weeks following the project's cancellation, the designer became visibly morose, speaking little at team meetings, declining lunch invitations, and spending most of his time at his desk without apparent purpose.  As used in the text, \"morose\" most nearly means:","n":22,"choices":{"A":"resentful toward the decision-makers responsible","B":"ill-tempered and gloomy; sullen","C":"unable to concentrate due to personal disappointment","D":"reluctant to begin new work before processing the setback"}},{"stem":"The legal agreement included a clause stating that the pricing structure was mutable and subject to annual renegotiation, a provision that the supplier had initially resisted but ultimately accepted.  As used in the text, \"mutable\" most nearly means:","why":"A is correct. Subject to annual renegotiation = subject to change, not fixed. \"Mutable\" = liable to change; subject to alteration.  B — open to legal challenge is a different kind of flexibility.  C — conditional upon market performance describes a specific trigger.  D — determined by external standards describes a different basis.  Kelime: mutable — değişebilir, değişken, dönüşebilir","slug":"gri-mod-sat-v7-1-23","ans":"A","choices":{"A":"subject to change; not fixed","B":"open to legal challenge if disputed","D":"determined by external regulatory standards","C":"conditional upon market performance"},"n":23},{"why":"C is correct. Shell companies, falsified invoices, concealed money movement = wicked, criminal. \"Nefarious\" = wicked or criminal.  A — complexity describes the scheme's design, not its moral character.  B — without regulatory knowledge describes concealment.  D — difficult to prosecute describes a legal challenge.  Kelime: nefarious — ahlaksız, kötü niyetli, suç olan","slug":"gri-mod-sat-v7-1-24","stem":"The investigation revealed a nefarious scheme involving shell companies, falsified invoices, and payments routed through multiple jurisdictions to conceal the movement of money from the organization's accounts.  As used in the text, \"nefarious\" most nearly means:","ans":"C","choices":{"D":"difficult to prosecute due to jurisdictional complications","C":"wicked or criminal; morally wrong","B":"carried out without the knowledge of regulatory authorities","A":"highly complex due to deliberate obfuscation"},"n":24},{"choices":{"A":"officially fixed by regulatory standards","B":"very small; existing in name only rather than in substance","C":"waived for participants meeting certain income thresholds","D":"applied uniformly across all categories of users"},"n":25,"stem":"The fee for the service was described as nominal — a symbolic charge intended not to generate revenue but to discourage casual use and ensure that those who scheduled the consultation were genuinely committed to attending.  As used in the text, \"nominal\" most nearly means:","why":"B is correct. Symbolic charge not intended for revenue = very small, existing in name more than in substance. \"Nominal\" = very small; existing in name only.  A — officially fixed by regulation describes a different basis.  C — waived for low-income users describes a policy exception.  D — applied uniformly describes consistent application.  Kelime: nominal — yalnızca isim olarak, sözde; çok küçük","slug":"gri-mod-sat-v7-1-25","ans":"B"}],"t":"mcqquiz"}],"name":"Argumentation & Logic Vocabulary","group":"Kelime","id":"v7","eyebrow":"Kelime"},{"eyebrow":"Kelime","group":"Kelime","name":"Historical & Institutional Vocabulary","blocks":[{"t":"p","x":"SAT kelime â Historical & Institutional Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"choices":{"D":"increasingly influential within a competitive field","C":"frequently discussed in specialist publications","B":"widely recognized for professional excellence","A":"famous or well-known, typically for something bad"},"n":1,"slug":"gri-mod-sat-v8-1-1","why":"A is correct. Reputation for risky loans that contributed to insolvency = known for something bad. \"Notorious\" = famous or well-known, typically for some bad quality.  B — recognized for excellence is the opposite.  C — frequently discussed is neutral, not specifically notorious.  D — increasingly influential is a different kind of recognition.  Kelime: notorious — kötü şöhretiyle tanınan, meşhur (olumsuz)","stem":"The banker was notorious in financial circles for his willingness to approve high-risk loans that most institutions would have declined, a reputation that had made him many clients but ultimately contributed to the firm's insolvency.  As used in the text, \"notorious\" most nearly means:","ans":"A"},{"stem":"The documentary's portrayal of the conflict was admirably nuanced, acknowledging competing narratives, showing internal divisions within each faction, and resisting the temptation to assign clear moral roles to either side.  As used in the text, \"nuanced\" most nearly means:","why":"B is correct. Competing narratives, internal divisions, no clear moral roles = subtle distinctions, not simplistic. \"Nuanced\" = characterized by subtle distinctions; showing careful attention to fine points.  A — sympathetic to the less powerful is a specific political stance.  C — historically accurate is a different quality.  D — accessible to general audiences describes communication, not complexity of perspective.  Kelime: nuanced — nüanslı, ayrıntılı, basit olmayan","slug":"gri-mod-sat-v8-1-2","ans":"B","choices":{"C":"historically accurate in its treatment of documented events","D":"presented in a way that was accessible to general audiences","A":"sympathetic to the perspective of the less powerful party","B":"characterized by subtle distinctions; not simplistic"},"n":2},{"slug":"gri-mod-sat-v8-1-3","why":"D is correct. Predetermined criteria rather than general impressions = not influenced by personal feelings, impartial. \"Objective\" = not influenced by personal feelings; impartial.  A — supported by the majority is a consensus standard.  B — consistent with the original purpose describes alignment.  C — based on recent data is an empirical standard.  Kelime: objective — nesnel, tarafsız, kişisel görüşten arındırılmış","stem":"The panel sought to produce an objective assessment of the competing proposals, asking each evaluator to score the submissions against predetermined criteria rather than general impressions.  As used in the text, \"objective\" most nearly means:","ans":"D","choices":{"D":"not influenced by personal feelings or opinions; impartial","C":"based on the most recent available data","A":"supported by the majority of the panel's members","B":"consistent with the original purpose of the program"},"n":3},{"n":4,"choices":{"C":"legally required to remain general until a process was complete","D":"informally communicated rather than placed in a formal statement","B":"diplomatically worded to protect institutional relationships","A":"not straightforward or explicit; indirect"},"ans":"A","why":"A is correct. Acknowledging 'certain decisions' without specifics = not straightforward, indirect. \"Oblique\" = not directly addressed to the matter in hand; indirect.  B — diplomatically worded describes a tone, not the directness.  C — legally required to remain general is a possible constraint, not the definition.  D — informally communicated is a channel distinction.  Kelime: oblique — dolaylı, dolambaçlı, doğrudan olmayan","slug":"gri-mod-sat-v8-1-4","stem":"Rather than addressing the criticism directly, the official offered only oblique responses, acknowledging that 'certain decisions could benefit from further review' without specifying which decisions or what changes were under consideration.  As used in the text, \"oblique\" most nearly means:"},{"n":5,"choices":{"C":"genuinely uncertain about the value of the disputed asset","D":"stubbornly refusing to change one's opinion or course","B":"strategically committed to a position to maximize leverage","A":"protected by legal counsel from making further concessions"},"ans":"D","slug":"gri-mod-sat-v8-1-5","why":"D is correct. Refusing to modify its position even as everything else was resolved = stubbornly refusing to change. \"Obstinate\" = stubbornly refusing to change one's opinion or chosen course.  A — protected by counsel describes a legal constraint.  B — strategically committed describes a tactical choice, not the quality of obstinacy.  C — genuinely uncertain is a different reason for not conceding.  Kelime: obstinate — inatçı, dik başlı, ikna edilmez","stem":"The negotiating team found the other party obstinate on the question of intellectual property rights, refusing to modify its position even as every other aspect of the agreement had been resolved to both sides' satisfaction.  As used in the text, \"obstinate\" most nearly means:"},{"stem":"The silence from the board in the days following the earnings report was ominous: senior analysts noted that the same silence had preceded the leadership transitions in two of the company's most turbulent years.  As used in the text, \"ominous\" most nearly means:","slug":"gri-mod-sat-v8-1-6","why":"B is correct. Preceded turbulent transitions previously = suggesting something bad is coming. \"Ominous\" = giving the impression that something bad or unpleasant is about to happen.  A — carefully calculated is a possible explanation.  C — consistent with established patterns would reduce the ominousness.  D — difficult to interpret describes ambiguity, not the quality of being ominous.  Kelime: ominous — tehdit edici, uğursuz, kötü haber veren","ans":"B","choices":{"A":"carefully calculated to avoid premature disclosure","B":"giving the impression that something bad is about to happen","D":"difficult to interpret without access to internal discussions","C":"consistent with the board's established communication patterns"},"n":6},{"n":7,"choices":{"C":"consistent with the company's previously announced expansion plans","D":"favorable; occurring at a useful or favorable time","A":"unexpected given the competitive landscape","B":"likely to accelerate developments the company had hoped to delay"},"ans":"D","why":"D is correct. Validated the market, attracted investors, shifted attention = occurring at a useful, favorable time. \"Opportune\" = well-chosen or favorable; occurring at a favorable time.  A — unexpected is a different quality from opportune.  B — likely to accelerate unwanted developments is a negative consequence.  C — consistent with expansion plans describes alignment.  Kelime: opportune — elverişli, uygun, tam zamanında","slug":"gri-mod-sat-v8-1-7","stem":"The release of the competing product at this moment proved opportune for our company: it validated the market category we had been developing, attracted new investor interest, and shifted analyst attention toward the space.  As used in the text, \"opportune\" most nearly means:"},{"choices":{"A":"recommended by the most respected authorities in the field","B":"conforming to what is generally or traditionally accepted","D":"supported by the most recent peer-reviewed research","C":"approved by the relevant regulatory body for clinical use"},"n":8,"why":"B is correct. Far from orthodox = far from what is generally or traditionally accepted. \"Orthodox\" = conforming to what is generally or traditionally accepted; standard.  A — recommended by respected authorities is a prestige criterion.  C — approved by a regulatory body is a formal certification.  D — supported by recent research is an evidence standard.  Kelime: orthodox — geleneksel, yerleşik, standar
