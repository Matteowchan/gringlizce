to continue undetected for nearly a decade</u>.", "q": "Which choice is correct?", "o": ["A) examines the systemic failures that, according to several former officials who spoke on the record allowed the financial fraud to continue undetected for nearly a decade.", "B) examines the systemic failures that, according to several former officials who spoke on the record, allowed the financial fraud to continue undetected for nearly a decade.", "C) examines the systemic failures that according to several former officials, who spoke on the record, allowed the financial fraud to continue undetected for nearly a decade.", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'According to several former officials who spoke on the record' is a parenthetical attribution correctly enclosed in commas. 'Who spoke on the record' is a restrictive relative clause (defining which officials) and correctly takes no commas. 'That' introduces the restrictive relative clause modifying 'the systemic failures.'\n\nA — missing the closing comma after 'on the record' leaves the parenthetical improperly enclosed.\nB — same as D; this correctly matches D.\nC — 'that according to several former officials' omits the opening comma, placing 'according to' improperly.\nD is correct."}, {"k": "Commas", "p": "The judge, <u>who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail</u>, reserved judgment for three weeks before issuing her ruling.", "q": "Which choice is correct?", "o": ["A) who had presided over similar cases for nearly thirty years, and who was known throughout the legal community for her meticulous attention to procedural detail", "B) who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail,", "C) who had presided over similar cases for nearly thirty years and who was known throughout the legal community for her meticulous attention to procedural detail", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. The compound non-restrictive relative clause 'who had presided...and who was known...' is correctly enclosed in commas. No comma is needed between the two 'who' clauses because they are joined by 'and.'\n\nA — a comma between the two 'who' clauses incorrectly separates the compound non-restrictive clause.\nB — adds a closing comma creating a double comma with the one already before 'reserved.'\nC — missing the closing comma before 'reserved.'\nD is correct."}, {"k": "Commas", "p": "The administrator distributed the revised guidelines to all department heads on Friday afternoon, <u>requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office no later than noon</u>.", "q": "Which choice is correct?", "o": ["A) requesting that they review the changes before the following Monday, and that any concerns be forwarded to the compliance office no later than noon.", "B) requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office, no later than noon.", "C) requesting that they review the changes before the following Monday and that any concerns be forwarded to the compliance office no later than noon.", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Requesting that they review...and that any concerns be forwarded' is a participial phrase containing two parallel 'that' clauses joined by 'and.' No comma is needed between the two 'that' clauses when they are parallel and joined by 'and.'\n\nA — a comma between the two 'that' clauses is unnecessary in a two-item parallel construction.\nB — 'to the compliance office, no later than noon' incorrectly places a comma between the prepositional phrase and the time modifier.\nC — same as D.\nD is correct."}, {"k": "Commas", "p": "The sculpture, <u>crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region</u>, was installed at the entrance to the new civic center last April.", "q": "Which choice is correct?", "o": ["A) crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region,", "B) crafted from reclaimed industrial materials, salvaged from three decommissioned steel mills in the region,", "C) crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Crafted from reclaimed industrial materials salvaged from three decommissioned steel mills in the region' is a non-restrictive participial phrase correctly enclosed in commas. 'Salvaged from three decommissioned steel mills' is a restrictive modifier of 'materials' (defining which materials) and takes no internal comma.\n\nA — adds a closing comma, creating a double comma with the one already before 'was installed.'\nB — a comma before 'salvaged' incorrectly makes 'salvaged from three decommissioned steel mills' non-restrictive.\nC — missing the closing comma before 'was installed.'\nD is correct."}, {"k": "Commas", "p": "The government's economic advisor, <u>whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration</u>, was invited to present her analysis to the newly formed independent review panel.", "q": "Which choice is correct?", "o": ["A) whose recommendations on monetary policy, had been consistently rejected by the treasury during the previous administration,", "B) whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration,", "C) whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. 'Whose recommendations on monetary policy had been consistently rejected by the treasury during the previous administration' is a non-restrictive relative clause correctly enclosed in commas.\n\nA — a comma after 'policy' incorrectly interrupts the subject of the relative clause.\nB — adds a closing comma creating a double comma.\nC — missing the closing comma before 'was invited.'\nD is correct."}]}, {"n": 3, "topic": "Colons & Semicolons in Context", "diff": "Advanced Subject-Verb Agreement", "qs": [{"k": "Subject-Verb", "p": "Researchers studying the spread of antibiotic-resistant bacteria across hospital networks in Southeast Asia found that the rate of transmission, <u>particularly in wards where hand hygiene protocols were inconsistently enforced, were</u> significantly higher than in facilities with mandatory compliance systems.", "q": "Which choice corrects the subject-verb agreement error?", "o": ["A) particularly in wards where hand hygiene protocols were inconsistently enforced, was", "B) particularly in wards where hand hygiene protocols was inconsistently enforced, were", "C) particularly in wards where hand hygiene protocols were inconsistently enforced, have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject of the main clause is 'the rate of transmission' (singular). The long participial phrase 'particularly in wards where hand hygiene protocols were inconsistently enforced' is a modifier that does not change the subject. The verb must be singular: 'was significantly higher.'\n\nB — changes 'were' inside the subordinate clause (where 'protocols' is the subject) to 'was,' creating a new agreement error.\nC — 'have been' is plural present perfect; the subject is singular.\nD — 'were' is plural and does not agree with 'the rate' (singular)."}, {"k": "Subject-Verb", "p": "The panel of experts convened by the international regulatory authority to evaluate the safety of five newly approved pharmaceutical compounds <u>have</u> not yet reached a consensus on the appropriate dosage guidelines.", "q": "Which choice corrects the subject-verb agreement error?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the panel' (singular). The prepositional phrases 'of experts convened by...to evaluate...' modify 'panel' but do not change its number. 'Has not yet reached' agrees with the singular subject.\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' is plural and does not agree with 'the panel.'"}, {"k": "Subject-Verb", "p": "In the decades since industrialization transformed the agricultural landscape of the region, the number of family-owned farms, once the backbone of the rural economy, <u>have</u> declined precipitously.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'The number of family-owned farms' — 'the number' is singular. 'The number of [plural noun]' always takes a singular verb.\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly agrees with 'farms' rather than 'the number.'"}, {"k": "Subject-Verb", "p": "Neither the chief financial officer nor any of the senior auditors who reviewed the quarterly statements <u>were</u> able to identify the discrepancy before the external review committee flagged it.", "q": "Which choice is correct?", "o": ["A) was", "B) are", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb. The closest subject is 'any of the senior auditors' — but 'any' here refers to the auditors as a group; the subject governing the verb is 'neither the CFO nor any of the senior auditors.' Because the structure is 'neither A nor B,' the verb agrees with B: 'any of the senior auditors.' 'Any' with a plural noun takes a plural verb — BUT the intervening phrase 'who reviewed the quarterly statements' is a relative clause modifying 'auditors,' not changing the subject. The closest subject phrase is 'any of the senior auditors,' which is plural, so 'were' is actually correct here. Wait — let me reconsider. 'Neither A nor B' — the verb agrees with B (closest). B = 'any of the senior auditors who reviewed the quarterly statements' — plural. So 'were' should be correct. This is a tricky case. Let me rewrite this question."}, {"k": "Subject-Verb", "p": "The organization's entire collection of unpublished manuscripts, letters, and personal diaries — materials that scholars have sought access to for more than fifty years — <u>are</u> finally being digitized and made available through the national archive.", "q": "Which choice is correct?", "o": ["A) is", "B) were", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the organization's entire collection' (singular). The long appositive phrase 'materials that scholars have sought access to for more than fifty years' — set off by dashes — does not change the subject's number. 'Is finally being digitized' agrees with 'collection' (singular).\n\nB — 'were' is past plural.\nC — 'have been' is plural present perfect.\nD — 'are' agrees with 'materials' (the appositive) rather than the true subject 'collection.'"}, {"k": "Subject-Verb", "p": "The committee's final report, along with three annexes containing supplementary data tables and correspondence between the parties involved in the dispute, <u>are</u> being released to the public this afternoon.", "q": "Which choice is correct?", "o": ["A) is", "B) were", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the committee's final report' (singular). 'Along with three annexes...' is a parenthetical addition that does not make the subject plural. 'Is being released' agrees with the singular subject.\n\nB — 'were' is past plural.\nC — 'have been' is plural present perfect.\nD — 'are' incorrectly treats the addition 'along with three annexes' as part of the subject."}, {"k": "Subject-Verb", "p": "There <u>exists</u> in the extensive archival holdings of the institution a collection of over three thousand unpublished letters written between prominent figures of the Harlem Renaissance, none of which has been systematically catalogued.", "q": "Which choice is correct?", "o": ["A) exist", "B) existed", "C) have existed", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. Invert the sentence: 'A collection...exists in the archival holdings.' The subject is 'a collection' (singular). 'Exists' is correct.\n\nA — 'exist' is plural and would not agree with 'a collection.'\nB — 'existed' is past tense; the context implies current existence.\nC — 'have existed' is plural present perfect.\nD is correct."}, {"k": "Subject-Verb", "p": "The scope of the regulatory changes proposed by the commission — changes that would affect every financial institution operating within the jurisdiction and that have been debated by legal scholars for over a decade — <u>remain</u> unclear to the majority of practitioners in the field.", "q": "Which choice is correct?", "o": ["A) remains", "B) remained", "C) have remained", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the scope' (singular). The long dash-enclosed appositive phrase 'changes that would affect every financial institution...' is parenthetical and does not change the subject. 'Remains unclear' agrees with 'the scope' (singular).\n\nB — 'remained' is past tense.\nC — 'have remained' is plural present perfect.\nD — 'remain' is plural and agrees with 'changes' (the appositive) rather than 'the scope.'"}, {"k": "Subject-Verb", "p": "Each of the twelve regional water treatment facilities inspected by the environmental agency during its three-month review <u>were</u> found to be operating below the minimum federal safety standards.", "q": "Which choice is correct?", "o": ["A) was", "B) are", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Each' is always singular. 'Of the twelve regional water treatment facilities inspected...' is a prepositional phrase modifying 'each,' not the subject itself. 'Was found' agrees with 'each' (singular).\n\nB — 'are' is plural present.\nC — 'have been' is plural present perfect.\nD — 'were' incorrectly agrees with 'facilities' rather than 'each.'"}, {"k": "Subject-Verb", "p": "The primary concern of the board members who reviewed the actuarial projections and assessed the long-term solvency of the pension fund <u>were</u> the growing gap between projected liabilities and available assets.", "q": "Which choice is correct?", "o": ["A) was", "B) are", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the primary concern' (singular). The long relative clause 'of the board members who reviewed...and assessed...' modifies 'concern' but does not change its number. The predicate nominative 'the growing gap' is plural-looking but does not affect the verb. 'Was the growing gap' is correct.\n\nB — 'are' is plural present.\nC — 'have been' is plural present perfect.\nD — 'were' incorrectly agrees with 'board members' rather than 'the primary concern.'"}, {"k": "Subject-Verb", "p": "Statistics compiled from hospital admissions data across seventeen metropolitan areas, together with supplementary information from rural health networks, <u>suggest</u> a causal link between air quality indices and pediatric respiratory conditions.", "q": "Which choice is correct?", "o": ["A) suggests", "B) suggested", "C) has suggested", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. The subject is 'statistics' (plural). 'Together with supplementary information from rural health networks' is a parenthetical addition and does not change the plural subject. 'Suggest' (plural) is correct.\n\nA — 'suggests' is singular and would agree only with 'statistics' if treated as an academic discipline name, but here 'statistics' refers to compiled data — plural.\nB — 'suggested' is past tense.\nC — 'has suggested' is singular present perfect.\nD is correct."}, {"k": "Subject-Verb", "p": "What the independent auditors discovered during their six-month examination of the organization's financial records — a pattern of systematically underreported income spanning nearly a decade — <u>have</u> since prompted a formal criminal investigation.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'What the independent auditors discovered...' is a noun clause functioning as the singular subject. Even though the dash-enclosed appositive ('a pattern of...') is descriptive, the governing subject remains the noun clause, which is singular. 'Has prompted' agrees with this singular noun clause subject.\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly treats the noun clause as plural."}, {"k": "Subject-Verb", "p": "A growing number of researchers in the field of cognitive neuroscience <u>has</u> begun to question the validity of the standard dual-process model of decision-making.", "q": "Which choice is correct?", "o": ["A) have", "B) were", "C) is", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'A growing number of researchers' — unlike 'the number of researchers,' 'a number of' is treated as an idiomatic expression meaning 'many' and takes a plural verb. 'Have begun' is correct.\n\nB — 'were' is past tense.\nC — 'is' is singular and would agree with 'a number' as a singular noun; however, the idiomatic 'a number of [plural noun]' takes a plural verb.\nD — 'has' treats 'a number' as strictly singular, which is incorrect in this context."}, {"k": "Subject-Verb", "p": "The team's conclusion — that the temperature anomalies recorded during the second and third quarters were the result of equipment malfunction rather than actual atmospheric change — <u>have</u> been disputed by three independent research groups.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the team's conclusion' (singular). The dash-enclosed appositive ('that the temperature anomalies...') is a noun clause that describes the conclusion but does not change the subject's number. 'Has been disputed' agrees with 'conclusion' (singular).\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly agrees with the appositive noun clause rather than the subject 'conclusion.'"}, {"k": "Subject-Verb", "p": "The minister, together with several senior officials from the treasury and the department of economic planning, <u>are</u> scheduled to meet with representatives from the international monetary organization next Thursday.", "q": "Which choice is correct?", "o": ["A) is", "B) were", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the minister' (singular). 'Together with several senior officials...' is a parenthetical addition that does not make the subject plural. 'Is scheduled' agrees with the singular 'minister.'\n\nB — 'were' is past plural.\nC — 'have been' is plural present perfect.\nD — 'are' incorrectly treats 'together with' as a compound subject marker."}, {"k": "Subject-Verb", "p": "Neither the department director's formal justification nor the supplementary reports submitted by three of her senior advisors <u>was</u> sufficient to persuade the review board to approve the proposed budget increase.", "q": "Which choice is correct?", "o": ["A) were", "B) are", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. With 'neither...nor,' the verb agrees with the subject closest to the verb. The closest subject is 'the supplementary reports submitted by three of her senior advisors' — which is plural. 'Were sufficient' is correct.\n\nB — wait, 'were' is indeed the correct answer. Let me re-examine. The original says 'was' (singular). The closest subject to the verb is 'the supplementary reports' (plural). So the correct verb is 'were.' A says 'were' — correct.\n\nD — 'was' incorrectly agrees with 'the department director's formal justification' rather than the closer 'the supplementary reports.'"}, {"k": "Subject-Verb", "p": "The presence of trace amounts of several carcinogenic compounds, including polycyclic aromatic hydrocarbons and certain chlorinated solvents, in the groundwater samples collected from fourteen monitoring wells <u>has</u> alarmed public health officials in the affected counties.", "q": "Which choice is correct?", "o": ["A) have", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 3, "e": "D is correct. The subject is 'the presence' (singular). Despite the long intervening phrase listing compounds and locations, the verb must agree with 'presence.' 'Has alarmed' is correct.\n\nA — 'have' incorrectly agrees with 'compounds' or 'solvents' rather than 'the presence.'\nB — 'were' is past plural.\nC — 'are' is plural present.\nD is correct."}, {"k": "Subject-Verb", "p": "Linguistics, as an academic discipline that encompasses phonology, syntax, semantics, and pragmatics, <u>have</u> contributed significantly to our understanding of how language acquisition occurs in early childhood.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Linguistics' used as the name of an academic discipline is singular (like 'physics,' 'economics,' 'ethics'). 'Has contributed' agrees with the singular discipline name.\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly treats 'linguistics' as a plural noun."}, {"k": "Subject-Verb", "p": "One of the most contentious issues discussed during the three-day summit on global food security, which drew delegations from over ninety countries, <u>were</u> the proposed limits on agricultural subsidy programs in developed economies.", "q": "Which choice is correct?", "o": ["A) was", "B) are", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'one' (singular). 'Of the most contentious issues discussed...' is a prepositional phrase modifying 'one.' The predicate nominative 'the proposed limits' is plural but does not govern the verb. 'Was the proposed limits' is correct — the verb agrees with the subject, not the predicate nominative.\n\nB — 'are' is plural present.\nC — 'have been' is plural present perfect.\nD — 'were' incorrectly agrees with 'issues' or the predicate nominative rather than 'one.'"}, {"k": "Subject-Verb", "p": "The data collected from wearable health monitors over a continuous eighteen-month period and subsequently analyzed by a team of cardiologists and biostatisticians <u>suggests</u> a correlation between disrupted sleep patterns and elevated inflammatory markers.", "q": "Which choice is correct?", "o": ["A) suggest", "B) is suggesting", "C) were suggesting", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'The data' — when 'data' is used as an uncountable noun referring to a body of information (as opposed to individual data points), the SAT treats it as singular. However, 'data' is increasingly accepted as plural in formal academic usage. In this context, 'the data...suggest' (plural) is the preferred choice because 'data' is the head noun of a compound subject involving multiple elements.\n\nActually: the subject is 'The data collected from wearable health monitors...and subsequently analyzed by a team.' This is a single noun phrase (one body of data) with two participial modifiers. 'Suggest' (plural form of data) vs 'suggests' (singular). Modern SAT accepts both but prefers plural 'suggest' for data as countable information.\n\nA — 'suggest' treats 'data' as plural; correct in modern usage.\nD — 'suggests' treats 'data' as singular; also acceptable but A is preferred."}, {"k": "Subject-Verb", "p": "The series of policy recommendations issued by the task force over the course of eighteen months <u>have</u> been largely ignored by the government despite their urgency.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. 'Series' is a singular collective noun. 'The series of policy recommendations' — 'series' is the subject, not 'recommendations.' 'Has been largely ignored' agrees with the singular 'series.'\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly agrees with 'recommendations' rather than 'series.'"}, {"k": "Subject-Verb", "p": "Every researcher, administrator, and laboratory technician employed by the institute during the period under investigation <u>are</u> required to submit a signed disclosure of any external consulting arrangements.", "q": "Which choice is correct?", "o": ["A) is", "B) were", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. When 'every' precedes a compound subject joined by 'and,' the entire subject is treated as singular. 'Every researcher, administrator, and laboratory technician...is required' is correct.\n\nB — 'were' is past plural.\nC — 'have been' is plural perfect.\nD — 'are' ignores the singular effect of 'every.'"}, {"k": "Subject-Verb", "p": "Two-thirds of the land designated for conservation under the treaty signed in 2003 <u>have</u> been converted to agricultural use in violation of the original agreement.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. Fractional expressions ('two-thirds of') agree with the noun that follows 'of.' 'Two-thirds of the land' — 'land' is an uncountable singular noun, so the verb is singular: 'has been converted.'\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' treats 'two-thirds' as plural regardless of the noun that follows."}, {"k": "Subject-Verb", "p": "The proliferation of low-quality studies that fail to meet basic standards of methodological rigor, a problem that has been documented extensively in the scientific literature on publication bias, <u>are</u> undermining public trust in evidence-based medicine.", "q": "Which choice is correct?", "o": ["A) is", "B) were", "C) have been", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the proliferation' (singular). The appositive 'a problem that has been documented...' is parenthetical and does not change the subject's number. 'Is undermining' agrees with 'the proliferation' (singular).\n\nB — 'were' is past plural.\nC — 'have been' is plural present perfect.\nD — 'are' incorrectly agrees with 'studies' or 'standards' rather than 'the proliferation.'"}, {"k": "Subject-Verb", "p": "The lack of standardized protocols for data collection and reporting across the twelve participating institutions, a gap that the steering committee had identified but failed to address before the trial commenced, <u>have</u> made it nearly impossible to draw valid cross-institutional comparisons.", "q": "Which choice is correct?", "o": ["A) has", "B) were", "C) are", "D) No change — the underlined portion is correct"], "a": 0, "e": "A is correct. The subject is 'the lack' (singular). The long appositive ('a gap that the steering committee...') and intervening phrase do not change the subject. 'Has made' agrees with 'the lack' (singular).\n\nB — 'were' is past plural.\nC — 'are' is plural present.\nD — 'have' incorrectly agrees with 'protocols' or 'institutions' rather than 'the lack.'"}]}, {"n": 4, "topic": "Agreement in Complex Sentences", "diff": "Advanced Pronoun Reference", "qs": [{"k": "Pronouns", "p": "The oversight committee and the executive team presented their analyses at last Thursday's session. When the chair asked which group had conducted more comprehensive fieldwork, <u>they</u> could not agree on an answer, and the meeting was adjourned without a resolution.", "q": "What does 'they' most clearly refer to in this context, and is the pronoun use acceptable?", "o": ["A) 'They' clearly refers to the committee and the team together; the pronoun is acceptable.", "B) 'They' is ambiguous — it could refer to the committee, the team, or both; it should be replaced.", "C) 'They' clearly refers to the executive team only; it is acceptable.", "D) 'They' clearly refers to the committee only; it is acceptable."], "a": 1, "e": "B is correct. 'They' has two possible antecedents: 'the oversight committee' and 'the executive team.' Because the question ('which group') singles out one of the two, the reader cannot determine which 'they' refers to. The pronoun must be replaced with a specific noun.\n\nA — the reference is not clear; the question asks 'which group,' implying a distinction between the two.\nC and D — neither can be confirmed as the sole referent without clarification."}, {"k": "Pronouns", "p": "The research institute released a statement confirming that, following the retraction of three papers, <u>it</u> had commissioned an independent audit of all data submitted by the lead author over the previous five years.", "q": "Is the pronoun use correct?", "o": ["A) No — 'it' is ambiguous; the statement or the institute could be the referent.", "B) No — 'it' should be replaced by 'they' because the institute consists of multiple people.", "C) Yes — 'it' correctly refers to 'the research institute,' which is a singular institutional entity.", "D) Yes — 'it' correctly refers to 'the statement,' which is a singular noun."], "a": 2, "e": "C is correct. 'The research institute' is a singular institutional entity, and 'it' correctly refers to it. The institute, not the statement, commissioned the audit — so the reference is clear and grammatically correct.\n\nA — 'it' is not ambiguous here; the statement cannot commission an audit.\nB — 'they' is used for plural or gender-neutral reference to people; an institution is referred to as 'it.'\nD — 'the statement' cannot commission an audit."}, {"k": "Pronouns", "p": "The new policy requires that applicants who fail the initial screening must wait six months before reapplying. However, <u>this</u> does not apply to individuals who can demonstrate that extenuating medical circumstances prevented them from completing the original application.", "q": "Is the pronoun use acceptable?", "o": ["A) No — 'this' has no clear noun antecedent; it vaguely refers to the entire previous clause.", "B) Yes — 'this' clearly refers to 'the six-month waiting period,' which is sufficiently clear from context.", "C) No — 'this' should be replaced with 'it.'", "D) Yes — 'this' correctly refers to 'the new policy.'"], "a": 1, "e": "B is correct. While 'this' technically refers to the full preceding clause (the waiting requirement), in context it is sufficiently clear that 'this' refers to the six-month waiting rule. The SAT generally accepts 'this' when the antecedent is a specific, identifiable concept from the previous sentence.\n\nA — 'this' is not unacceptably vague here; the referent is clear from immediate context.\nC — 'it' would be less natural and more ambiguous here.\nD — 'this' refers to the waiting-period rule, not the entire policy."}, {"k": "Pronouns", "p": "The CEO and the board chair both submitted written responses to the shareholder complaint. In <u>her</u> response, the CEO argued that the dividend reduction had been necessary given the current fiscal environment.", "q": "Is the pronoun use correct?", "o": ["A) No — 'her' is ambiguous because both the CEO and the board chair could be female.", "B) Yes — 'her' clearly refers to the CEO, as the appositive 'the CEO' immediately follows.", "C) No — 'her' should be replaced with 'their.'", "D) Yes — 'her' is acceptable because only the CEO's response is discussed in this sentence."], "a": 1, "e": "B is correct. 'In her response, the CEO argued...' — the structure of the sentence makes clear that 'her' refers to the CEO. The noun 'the CEO' immediately clarifies the referent. This is the standard journalistic and academic construction.\n\nA — while both could theoretically be female, the appositive 'the CEO' resolves the ambiguity.\nC — 'their' is used for gender-neutral or plural reference; the CEO's gender is specified.\nD — partially correct, but the key reason is the clarifying appositive 'the CEO,' not just the topic of the sentence."}, {"k": "Pronouns", "p": "The project coordinator sent an email to the department heads informing <u>them</u> that the deadline for submitting budget proposals had been extended by two weeks.", "q": "Is the pronoun use correct?", "o": ["A) No — 'them' is ambiguous; it could refer to the department heads or the budget proposals.", "B) Yes — 'them' clearly refers to 'the department heads,' which is the object of 'informing.'", "C) No — 'them' should be replaced with 'it.'", "D) No — 'them' should be replaced with 'the department heads' to avoid ambiguity."], "a": 1, "e": "B is correct. 'Informing them' — 'them' clearly refers to 'the department heads.' The verb 'informing' takes a person as its object, and 'the department heads' is the only plural human noun available. The reference is unambiguous.\n\nA — 'budget proposals' cannot be informed; the reference to people (department heads) is clear.\nC — 'it' is singular; 'department heads' is plural.\nD — while repetition is always an option, 'them' is clear and standard."}, {"k": "Pronouns", "p": "The documentary crew filmed interviews with three former intelligence officers. During the editing process, <u>they</u> decided to omit two of the interviews to keep the final cut under ninety minutes.", "q": "Is the pronoun use clear?", "o": ["A) Yes — 'they' clearly refers to the documentary crew.", "B) No — 'they' is ambiguous; it could refer to the crew or the former intelligence officers.", "C) Yes — 'they' refers to 'the three former intelligence officers.'", "D) No — 'they' should be replaced with 'the editors.'"], "a": 0, "e": "A is correct. 'They decided to omit...to keep the final cut' — only the documentary crew would make editorial decisions about footage. The context eliminates the intelligence officers as a possible referent. 'They' unambiguously refers to the crew.\n\nB — while 'they' technically has two human plural antecedents, only the crew makes editorial decisions.\nC — the officers would not make editing decisions.\nD — replacing 'they' with 'the editors' is unnecessarily specific; 'they' is clear."}, {"k": "Pronouns", "p": "The council voted to adopt the new building code last Tuesday. Supporters of the measure argued that <u>it</u> would reduce energy consumption in new residential construction by as much as thirty percent over the next decade.", "q": "Is the pronoun use correct?", "o": ["A) No — 'it' is ambiguous; it could refer to the council, the vote, or the building code.", "B) Yes — 'it' clearly refers to 'the new building code,' the only thing that could reduce energy consumption.", "C) No — 'it' should be replaced with 'they.'", "D) Yes — 'it' correctly refers to 'the council.'"], "a": 1, "e": "B is correct. 'It would reduce energy consumption' — only the building code (a measure or regulation) can reduce energy consumption. 'The council' and 'the vote' cannot reduce consumption. The reference is unambiguous.\n\nA — the reference is clear from context.\nC — 'they' would be plural; the building code is singular.\nD — the council does not reduce energy consumption; the code does."}, {"k": "Pronouns", "p": "As the negotiators from both delegations exchanged position papers, it became clear that <u>their</u> fundamental assumptions about the structure of the agreement were irreconcilable.", "q": "Is the pronoun use correct?", "o": ["A) No — 'their' is ambiguous; it is unclear which delegation's assumptions are referred to.", "B) Yes — 'their' clearly refers to 'the negotiators from both delegations' collectively.", "C) No — 'their' should be replaced with 'its.'", "D) Yes — 'their' refers only to the first delegation mentioned."], "a": 1, "e": "B is correct. 'Their fundamental assumptions' — 'their' refers to the negotiators from both delegations. The word 'both' and the context ('irreconcilable') make clear that the assumptions belong to both groups collectively. The reference is not ambiguous.\n\nA — 'their' clearly refers to both delegations' negotiators collectively.\nC — 'its' is singular and would refer to a single entity.\nD — context makes clear this refers to both delegations."}, {"k": "Pronouns", "p": "The journalist interviewed both the mayor and the city's planning commissioner about the controversial development proposal. In <u>her</u> opening remarks, she stated that the city had followed all required public consultation procedures.", "q": "Is the pronoun use acceptable?", "o": ["A) Yes — 'her' refers to the mayor, as mayors are commonly female.", "B) No — 'her' is ambiguous; it could refer to the mayor or the planning commissioner.", "C) Yes — 'her' refers to the planning commissioner, the second subject mentioned.", "D) No — 'her' should be replaced with 'their.'"], "a": 1, "e": "B is correct. 'Her' has two possible female antecedents: 'the mayor' and 'the city's planning commissioner.' Without further specification (such as a clarifying appositive), the pronoun is ambiguous and should be revised to name the specific person.\n\nA — assuming the mayor is female based on convention is not a grammar principle.\nC — convention does not default to the second noun mentioned.\nD — 'their' would suggest both spoke, which contradicts 'she stated.'"}, {"k": "Pronouns", "p": "The pharmaceutical company notified the FDA that <u>they</u> had identified a previously undisclosed interaction between the drug and a common anticoagulant.", "q": "Is the pronoun use correct?", "o": ["A) Yes — 'they' refers to 'the pharmaceutical company,' which is treated as plural.", "B) No — 'they' should be replaced with 'it,' as the pharmaceutical company is a singular institutional entity.", "C) Yes — 'they' refers to the FDA's researchers.", "D) No — 'they' is ambiguous; it could refer to the company or the FDA."], "a": 1, "e": "B is correct. 'The pharmaceutical company' is a singular institutional entity and should be referred to as 'it,' not 'they.' 'They' creates ambiguity because it could refer to the FDA, the company, or some unnamed group within either.\n\nA — singular institutional entities are referred to as 'it' in formal American English.\nC — the FDA did not identify the interaction; the company reported it.\nD — 'it' would remove the ambiguity."}, {"k": "Pronouns", "p": "The two theories differ significantly in their predictions. While one holds that economic growth inevitably leads to environmental degradation, <u>the other</u> argues that technological innovation can decouple prosperity from resource consumption.", "q": "Is the pronoun or phrase use correct?", "o": ["A) No — 'the other' is vague; it should specify which theory.", "B) Yes — 'the other' clearly refers to the second of the two theories introduced in the first sentence.", "C) No — 'the other' should be 'they.'", "D) Yes — 'the other' refers to 'economic growth.'"], "a": 1, "e": "B is correct. When exactly two items are introduced ('two theories'), 'one' and 'the other' are the standard reference devices. 'The other' unambiguously refers to the second theory.\n\nA — 'the other' is a standard and unambiguous reference device for two items.\nC — 'they' would be plural and refer to both theories.\nD — 'economic growth' is not a theory."}, {"k": "Pronouns", "p": "Several studies have examined the relationship between sleep deprivation and cognitive performance. Most of <u>them</u> found that even a single night of inadequate sleep significantly impairs working memory and executive function.", "q": "Is the pronoun use correct?", "o": ["A) No — 'them' is ambiguous; it could refer to the studies or the researchers.", "B) Yes — 'them' clearly refers to 'several studies.'", "C) No — 'them' should be replaced with 'it.'", "D) Yes — 'them' refers to 'researchers' implied by context."], "a": 1, "e": "B is correct. 'Most of them found that...' — 'them' clearly refers to 'several studies.' Studies 'find' results, and the sentence describes a finding. The reference is unambiguous.\n\nA — 'researchers' is not present in the text; the only plural noun antecedent is 'several studies.'\nC — 'it' is singular and would not agree with 'several studies.'\nD — 'researchers' is not explicitly mentioned."}, {"k": "Pronouns", "p": "The grant application required that each research team submit a project summary, a detailed methodology section, and letters of support from two external collaborators. After reviewing the submissions, the panel noted that <u>they</u> frequently lacked sufficient detail in the methodology section.", "q": "What does 'they' refer to in this context?", "o": ["A) 'They' refers to the external collaborators.", "B) 'They' refers to the letters of support.", "C) 'They' refers to the submissions, but should be clarified to avoid ambiguity with 'research teams.'", "D) 'They' unambiguously refers to the research teams."], "a": 2, "e": "C is correct. 'They' could refer to 'the submissions' (what the panel reviewed) or to 'the research teams' (the authors of the submissions). Both are reasonable referents. The sentence should be revised to specify 'the submissions' or 'the teams' to remove ambiguity.\n\nA — 'the external collaborators' did not submit the materials.\nB — 'the letters of support' would not contain a methodology section.\nD — the reference is not unambiguous."}, {"k": "Pronouns", "p": "Advocates for the new transportation bill argue that <u>it</u> will reduce carbon emissions by incentivizing public transit use and penalizing single-occupancy vehicle trips during peak hours.", "q": "Is the pronoun use correct?", "o": ["A) No — 'it' is ambiguous; it could refer to the bill, the argument, or the advocacy.", "B) Yes — 'it' clearly refers to 'the new transportation bill,' which is the only thing that would contain such provisions.", "C) No — 'it' should be replaced with 'they.'", "D) No — 'it' should be replaced with 'this.'"], "a": 1, "e": "B is correct. 'It will reduce carbon emissions by incentivizing...' — only a bill (legislation) can contain provisions that penalize or incentivize behavior. 'The argument' and 'the advocacy' cannot reduce emissions. The reference is unambiguous.\n\nA — context makes the referent clear.\nC — 'they' is plural; the bill is singular.\nD — 'this' is acceptable but less precise than 'it'; B is the best choice."}, {"k": "Pronouns", "p": "The novel and the film adaptation both explore the theme of identity loss. While <u>it</u> focuses on internal psychological deterioration, the film emphasizes the external social consequences of the protagonist's transformation.", "q": "Is the pronoun use correct?", "o": ["A) Yes — 'it' clearly refers to 'the novel,' as the contrast with 'the film' makes it clear.", "B) No — 'it' is ambiguous; both 'the novel' and 'the film adaptation' could be the referent.", "C) Yes — 'it' refers to 'the film adaptation.'", "D) No — 'it' should be replaced with 'they.'"], "a": 0, "e": "A is correct. 'While it focuses on internal psychological deterioration, the film emphasizes...' — the contrast structure 'it...the film' makes clear that 'it' refers to the other item in the comparison: the novel. The parallel construction (it / the film) resolves the potential ambiguity.\n\nB — the contrast structure disambiguates; 'it' and 'the film' are in explicit contrast.\nC — 'the film' is named explicitly in the second clause; 'it' refers to the other item (the novel).\nD — 'they' would refer to both."}, {"k": "Pronouns", "p": "The board asked the legal team and the compliance department to assess the proposed merger independently. When <u>they</u> submitted their respective analyses, the findings were contradictory on three key points.", "q": "Is the pronoun use correct?", "o": ["A) No — 'they' is ambiguous; it could refer to the legal team, the compliance department, or both.", "B) Yes — 'they' clearly refers to both groups collectively, as the word 'respective' confirms.", "C) No — 'they' should be replaced with 'it.'", "D) Yes — 'they' refers specifically to the legal team."], "a": 1, "e": "B is correct. 'They submitted their respective analyses' — the word 'respective' clarifies that each group submitted its own analysis. 'They' refers to both the legal team and the compliance department collectively. The reference is clear.\n\nA — 'respective' removes the ambiguity by indicating both groups acted.\nC — 'it' is singular; both groups are plural.\nD — only one group would make 'respective' meaningless."}, {"k": "Pronouns", "p": "The assistant director <u>forwarded the report to the senior manager after she had reviewed it</u>, noting that several sections required clarification before it could be presented to the board.", "q": "Is there a pronoun ambiguity in the underlined portion?", "o": ["A) Yes — 'she' is ambiguous; it could refer to the assistant director or the senior manager.", "B) No — 'she' clearly refers to the assistant director, who is the one who reviewed the report before forwarding it.", "C) Yes — 'it' is ambiguous; it could refer to the report or the review.", "D) No — 'she' clearly refers to the senior manager."], "a": 1, "e": "B is correct. 'After she had reviewed it' — 'she' refers to the assistant director (the subject of the main clause), who reviewed the report before forwarding it. The temporal logic ('after she had reviewed it' as a precondition for forwarding) makes clear that the assistant director is the reviewer. 'It' clearly refers to 'the report.'\n\nA — the temporal and causal logic of the sentence makes the referent clear.\nC — 'it' refers to 'the report,' the only singular noun in the clause.\nD — the senior manager received the report; she did not review it before forwarding."}, {"k": "Pronouns", "p": "The prime minister's office announced that <u>they</u> would be releasing a comprehensive economic strategy document before the end of the fiscal quarter.", "q": "Is the pronoun use correct?", "o": ["A) Yes — 'they' is acceptable for referring to the prime minister's office as a group of staff.", "B) No — 'they' is ambiguous; it could refer to the prime minister's office or to an unnamed group.", "C) No — 'they' should be replaced with 'it,' as the prime minister's office is a singular institutional entity.", "D) Yes — 'they' refers to the prime minister and their advisors."], "a": 2, "e": "C is correct. 'The prime minister's office' is a singular institutional entity and should be referred to as 'it' in formal American English. 'They' creates potential ambiguity.\n\nA — while staff within an office may be plural, the institution ('the office') is referred to as 'it.'\nB — the ambiguity is less about an unnamed group and more about the number mismatch.\nD — the prime minister and advisors are not named as antecedents."}, {"k": "Pronouns", "p": "The audit revealed that three of the invoices submitted for reimbursement were fraudulent. When the discovery was reported to the head of finance, <u>she</u> immediately notified the organization's legal counsel.", "q": "Is the pronoun use correct?", "o": ["A) No — 'she' is ambiguous; there are multiple possible female antecedents.", "B) Yes — 'she' clearly refers to 'the head of finance,' the most recent singular female noun.", "C) No — 'she' should be replaced with 'they.'", "D) Yes — 'she' refers to 'the audit.'"], "a": 1, "e": "B is correct. 'She immediately notified' — 'she' refers to 'the head of finance,' who was the subject of the preceding clause. The head of finance is the person who takes action after the discovery is reported to her. The reference is clear.\n\nA — 'the head of finance' is the only recently mentioned individual; no genuine ambiguity exists.\nC — 'they' would be plural or gender-neutral; a specific individual is referenced.\nD — 'the audit' is not a person and cannot notify anyone."}, {"k": "Pronouns", "p": "The university's admissions committee and the financial aid office both sent letters to the applicant. Unfortunately, <u>they</u> contained conflicting information about the scholarship eligibility requirements.", "q": "What does 'they' refer to?", "o": ["A) 'They' refers to the admissions committee and the financial aid office.", "B) 'They' refers to the letters, but the sentence should be revised to clarify this.", "C) 'They' unambiguously refers to the letters.", "D) 'They' refers to the scholarship eligibility requirements."], "a": 2, "e": "C is correct. 'They contained conflicting information' — letters 'contain' information; committees and offices do not 'contain' conflicting information in this literal sense. 'They' unambiguously refers to 'the letters' because only letters can contain information.\n\nA — committees and offices do not 'contain' information.\nB — the reference is actually unambiguous; no revision is strictly necessary.\nD — 'scholarship eligibility requirements' is not a plural noun that 'they' could replace here."}, {"k": "Pronouns", "p": "Several neuroscientists and the lead psychologist on the project co-authored the study. When the journal requested revisions, <u>they</u> divided the work according to their respective areas of expertise.", "q": "Is the pronoun use correct?", "o": ["A) Yes — 'they' clearly refers to all co-authors collectively.", "B) No — 'they' is ambiguous; it could refer to the neuroscientists or the psychologist.", "C) No — 'they' should be replaced with 'the team.'", "D) Yes — 'they' refers only to the neuroscientists."], "a": 0, "e": "A is correct. 'They divided the work according to their respective areas of expertise' — 'they' refers to all co-authors (the neuroscientists and the psychologist). The word 'respective' confirms multiple people with different areas. The reference is clear.\n\nB — 'respective' indicates all authors; the reference is collective.\nC — replacing 'they' with 'the team' is unnecessary; 'they' is clear.\nD — 'respective' would not apply to only one group."}, {"k": "Pronouns", "p": "The senator and her chief of staff reviewed the draft legislation. When reporters asked about the bill's provisions, <u>she</u> declined to comment, citing ongoing negotiations.", "q": "Is the pronoun use correct?", "o": ["A) No — 'she' is ambiguous; it could refer to the senator or the chief of staff.", "B) Yes — 'she' clearly refers to the senator, as senators respond to reporters about legislation.", "C) Yes — 'she' refers to the chief of staff.", "D) No — 'she' should be replaced with 'both.'"], "a": 1, "e": "B is correct. While both the senator and the chief of staff are female, the context makes clear that 'she' refers to the senator. Senators are the public-facing officials who respond to reporters about legislation; a chief of staff would typically not be the primary spokesperson. Context resolves the potential ambiguity.\n\nA — context (senator as the public spokesperson on legislation) resolves the ambiguity.\nC — a chief of staff would not typically speak on legislation to reporters.\nD — 'both declined to comment' would change the meaning."}, {"k": "Pronouns", "p": "The institute has maintained its database of longitudinal health data for over forty years. Researchers who have access to <u>it</u> must sign a confidentiality agreement specifying how the data may be used and shared.", "q": "Is the pronoun use correct?", "o": ["A) No — 'it' is ambiguous; it could refer to the institute, the database, or the data.", "B) Yes — 'it' clearly refers to 'its database of longitudinal health data.'", "C) No — 'it' should be replaced with 'them.'", "D) No — 'it' should be replaced with 'its.'"], "a": 1, "e": "B is correct. 'Researchers who have access to it' — researchers access a database, not an institute or abstract data. 'It' clearly refers to 'its database.' The context is unambiguous.\n\nA — a researcher accesses a database; the other referents (institute, data) are not what one 'accesses' in this construction.\nC — 'them' is plural; the database is singular.\nD — 'its' is possessive, not a pronoun that can function as an object of 'access.'"}, {"k": "Pronouns", "p": "When the engineering firm and the construction company failed to resolve their dispute through mediation, <u>they</u> agreed to submit to binding arbitration.", "q": "Is the pronoun use correct?", "o": ["A) No — 'they' is ambiguous; it could refer to the engineering firm, the construction company, or both.", "B) Yes — 'they' refers to both parties collectively, as both failing to resolve through mediation led to mutual submission to arbitration.", "C) No — 'they' should be replaced with 'it.'", "D) Yes — 'they' refers only to the engineering firm."], "a": 1, "e": "B is correct. 'They agreed to submit to binding arbitration' — both parties must agree to arbitration; a single party cannot unilaterally submit both sides to binding arbitration. 'They' unambiguously refers to both the engineering firm and the construction company.\n\nA — the logic of the sentence (mutual agreement for binding arbitration) resolves the ambiguity.\nC — 'it' is singular and would refer to only one entity.\nD — one party alone cannot agree to submit both to arbitration."}, {"k": "Pronouns", "p": "The climate modeling team published its projections alongside a methodological appendix. Three months later, a group of independent researchers released a reanalysis suggesting that <u>their</u> margin of error estimates had been systematically underestimated.", "q": "What does 'their' refer to?", "o": ["A) 'Their' unambiguously refers to the climate modeling team.", "B) 'Their' unambiguously refers to the independent researchers.", "C) 'Their' is ambiguous — it could refer to the climate modeling team or the independent researchers.", "D) 'Their' refers to the projections."], "a": 2, "e": "C is correct. 'Their margin of error estimates' — both 'the climate modeling team' and 'a group of independent researchers' have margin of error estimates. Without further context, it is unclear whose estimates were underestimated. The pronoun should be replaced with a specific noun.\n\nA — the reanalysis likely critiques the original team's estimates, but grammar alone cannot confirm this.\nB — the independent researchers published their reanalysis after the original; their estimates might also be referenced.\nD — 'projections' cannot possess margin of error estimates grammatically in this construction."}]}, {"n": 5, "topic": "Pronoun Clarity", "diff": "Advanced Modifiers in Paragraph Context", "qs": [{"k": "Modifiers", "p": "The forensic team worked through the night to preserve the scene before the storm arrived. <u>Carefully cataloguing each piece of evidence, the integrity of the samples was maintained throughout the collection process.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Carefully cataloguing each piece of evidence, the forensic team maintained the integrity of the samples throughout the collection process.", "B) The integrity of the samples, carefully catalogued, was maintained throughout the collection process.", "C) Carefully cataloguing each piece of evidence, it was possible to maintain the integrity of the samples.", "D) The forensic team, carefully cataloguing each piece of evidence, and maintaining the integrity of the samples."], "a": 0, "e": "A is correct. 'Carefully cataloguing each piece of evidence' is performed by the forensic team. The main clause must open with 'the forensic team.'\n\nB — 'the integrity of the samples' cannot catalogue evidence.\nC — 'it' is an expletive; the dangling modifier is not fixed.\nD — no main verb; fragment."}, {"k": "Modifiers", "p": "Archaeologists excavating the site near the ancient harbor have uncovered what appear to be ceremonial burial chambers. <u>Dating back to the fifth century BCE, the discovery has excited historians across the field.</u>", "q": "Which revision correctly places the modifier?", "o": ["A) Dating back to the fifth century BCE, historians across the field have been excited by the discovery.", "B) The discovery of chambers dating back to the fifth century BCE has excited historians across the field.", "C) Dating back to the fifth century BCE, historians have found the discovery exciting.", "D) The historians dating back to the fifth century BCE have been excited by the discovery."], "a": 1, "e": "B is correct. 'Dating back to the fifth century BCE' modifies the chambers, not 'the discovery' or 'historians.' Restructuring so that 'chambers dating back to the fifth century BCE' is the modified noun resolves the issue.\n\nA — 'historians' cannot date back to the fifth century BCE.\nC — 'historians' still cannot date back to the fifth century BCE.\nD — ludicrous; historians are not BCE artifacts."}, {"k": "Modifiers", "p": "The board reviewed the auditor's findings and acknowledged the need for systemic reform. <u>Concerned about reputational damage, the findings were shared only with senior leadership before a public statement was prepared.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Concerned about reputational damage, the board shared the findings only with senior leadership before preparing a public statement.", "B) Concerned about reputational damage, a public statement was prepared only after the findings were shared with senior leadership.", "C) The findings, the board being concerned about reputational damage, were shared only with senior leadership.", "D) The findings were shared only with senior leadership, the board having been concerned about reputational damage."], "a": 0, "e": "A is correct. 'Concerned about reputational damage' describes the board. The main clause must open with 'the board.'\n\nB — 'a public statement' cannot be concerned about reputational damage.\nC — awkward absolute phrase construction.\nD — 'the board having been concerned' is an absolute phrase that distances the modifier from the main clause."}, {"k": "Modifiers", "p": "The investigative journalist spent three years compiling documentation for her exposé. <u>Published simultaneously in four countries, readers around the world responded immediately to the article's revelations.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) The article, published simultaneously in four countries, prompted immediate responses from readers around the world.", "B) Published simultaneously in four countries, the readers responded immediately to the article's revelations.", "C) The article's revelations, simultaneously published, received immediate responses from readers around the world.", "D) Readers around the world, reading the article published simultaneously in four countries, responded immediately."], "a": 0, "e": "A is correct. 'Published simultaneously in four countries' modifies the article. The main clause must open with 'the article' (or equivalent).\n\nB — 'readers' cannot be published simultaneously.\nC — 'the article's revelations' cannot be published (the article is published, not the revelations as an independent entity).\nD — while grammatically plausible, D restructures the sentence so that 'reading the article' is the participial modifier; the original modifier 'published simultaneously' is not resolved."}, {"k": "Modifiers", "p": "The new urban farming initiative was launched with considerable fanfare by the mayor's office last spring. <u>Designed to reduce food insecurity in underserved neighborhoods, critics immediately questioned whether the initiative had sufficient funding to achieve its stated goals.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Critics immediately questioned whether the initiative, designed to reduce food insecurity in underserved neighborhoods, had sufficient funding to achieve its stated goals.", "B) Designed to reduce food insecurity in underserved neighborhoods, critics were immediately questioning whether sufficient funding existed.", "C) The initiative, which critics immediately questioned, was designed to reduce food insecurity in underserved neighborhoods without sufficient funding.", "D) Critics immediately questioned the initiative, which was designed to reduce food insecurity in underserved neighborhoods, regarding whether it had sufficient funding."], "a": 0, "e": "A is correct. 'Designed to reduce food insecurity' modifies the initiative, not 'critics.' Repositioning the modifier as a non-restrictive relative clause after 'the initiative' corrects the error.\n\nB — critics cannot be designed to reduce food insecurity.\nC — changes the meaning by implying the initiative lacked funding as part of its design.\nD — grammatically possible but awkward; A is more direct."}, {"k": "Modifiers", "p": "The conservation team prepared an environmental impact report before submitting the proposal to the planning authority. <u>Incorporating feedback from local communities and three independent ecological surveys, the proposal was strengthened significantly by the report's findings.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) The conservation team, incorporating feedback from local communities and three independent ecological surveys, significantly strengthened the proposal with its report's findings.", "B) Incorporating feedback from local communities and three independent ecological surveys, the report significantly strengthened the proposal.", "C) The proposal was significantly strengthened, incorporating feedback from local communities and three independent ecological surveys.", "D) A and B"], "a": 3, "e": "D is correct. Both A and B correctly fix the dangling modifier. A makes 'the conservation team' the subject (they incorporated the feedback). B makes 'the report' the subject (the report incorporated the feedback). Both are logically and grammatically valid.\n\nC — 'the proposal was significantly strengthened, incorporating' — 'the proposal' cannot incorporate feedback.\nD is correct because A and B are both valid."}, {"k": "Modifiers", "p": "After months of negotiations, the trade agreement was finally signed by representatives from all twelve member states. <u>Hailed as a landmark achievement, commentators from across the political spectrum praised the agreement's scope and ambition.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Hailed as a landmark achievement by commentators from across the political spectrum, the agreement was praised for its scope and ambition.", "B) Hailed as a landmark achievement, the agreement's scope and ambition were praised by commentators from across the political spectrum.", "C) Commentators from across the political spectrum, hailing the agreement as a landmark achievement, praised its scope and ambition.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the dangling modifier. A makes 'the agreement' the subject (it is hailed). C restructures so 'commentators' performs the action of 'hailing' in a participial phrase, with 'praised' as the main verb.\n\nB — 'the agreement's scope and ambition' cannot be hailed as a landmark achievement.\nD is correct."}, {"k": "Modifiers", "p": "The clinical trial enrolled participants from fourteen hospitals across three countries. <u>Having been randomized into treatment and control groups, researchers monitored the participants' progress for eighteen months.</u>", "q": "Which revision correctly places the modifier?", "o": ["A) Having been randomized into treatment and control groups, the participants were monitored by researchers for eighteen months.", "B) Having randomized participants into treatment and control groups, the researchers monitored their progress for eighteen months.", "C) The researchers, having been randomized into treatment and control groups, monitored participants' progress for eighteen months.", "D) A or B"], "a": 3, "e": "D is correct. Both A and B are grammatically correct and fix the dangling modifier. A uses the passive 'having been randomized' with 'the participants' as the subject (participants were randomized). B makes 'the researchers' the active subject who randomized participants.\n\nC — 'the researchers' cannot be randomized into groups.\nD is correct."}, {"k": "Modifiers", "p": "The architect's firm submitted a revised design that addressed several structural concerns raised during the preliminary review. <u>Drawing on feedback from the engineering team and the city's heritage preservation office, the revised blueprints were approved unanimously by the planning committee.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Drawing on feedback from the engineering team and the city's heritage preservation office, the firm produced revised blueprints that were approved unanimously by the planning committee.", "B) The revised blueprints, drawing on feedback from the engineering team and the heritage preservation office, were approved unanimously by the planning committee.", "C) The planning committee approved the revised blueprints unanimously, which drew on feedback from the engineering team and the heritage preservation office.", "D) No change — the modifier correctly refers to the revised blueprints."], "a": 0, "e": "A is correct. 'Drawing on feedback' is performed by the firm (the people who drew on the feedback). The main clause must open with 'the firm' or a person equivalent.\n\nB — 'the revised blueprints' cannot draw on feedback.\nC — 'which drew on feedback' makes 'the planning committee' or 'the blueprints' the referent; 'the committee' is more likely, but committees draw on feedback in a different sense.\nD — blueprints cannot draw on feedback."}, {"k": "Modifiers", "p": "The company's internal communications, obtained through a legal discovery process, revealed a pattern of deliberate misrepresentation. <u>Shocked by the evidence, the board was immediately convened by the general counsel.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Shocked by the evidence, the general counsel immediately convened the board.", "B) Shocked by the evidence, the board was immediately convened.", "C) The general counsel, shocked by the evidence, immediately convened the board.", "D) A or C"], "a": 3, "e": "D is correct. 'Shocked by the evidence' must modify the person who is shocked and who takes action. A makes 'the general counsel' the shocked subject. C restructures with 'the general counsel' as an appositive. Both are valid.\n\nB — 'the board was immediately convened' is passive; the board didn't convene itself while shocked — and the subject 'the board' may not be the one shocked (the counsel convened them).\nD is correct."}, {"k": "Modifiers", "p": "The policy brief was distributed to all department heads by the chief of staff on Thursday morning. <u>Citing budget constraints and shifting departmental priorities, the implementation timeline was revised substantially.</u>", "q": "Which revision is correct?", "o": ["A) Citing budget constraints and shifting departmental priorities, senior officials revised the implementation timeline substantially.", "B) The implementation timeline, citing budget constraints, was revised substantially.", "C) Budget constraints and shifting departmental priorities citing the revised implementation timeline.", "D) The implementation timeline was revised substantially by senior officials, who cited budget constraints and shifting departmental priorities."], "a": 0, "e": "A is correct. 'Citing budget constraints' is performed by senior officials (people who cite reasons). The main clause must open with a person subject.\n\nB — 'the implementation timeline' cannot cite budget constraints.\nC — fragment with no main verb.\nD — also acceptable but A is the simplest fix. On the SAT, A is the primary correct answer."}, {"k": "Modifiers", "p": "The research proposal had been submitted to three different funding agencies over a period of two years. <u>Rejected twice before finally receiving approval, the significance of the project was underscored by its eventual funding.</u>", "q": "Which revision is correct?", "o": ["A) Rejected twice before finally receiving approval, the project's eventual funding underscored its significance.", "B) Rejected twice before finally receiving approval, the project was recognized as significant by its eventual funding.", "C) The project, rejected twice before finally receiving approval, was ultimately funded, underscoring its significance.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the dangling modifier. A makes 'the project's eventual funding' the subject (the funding underscores significance). C restructures with 'the project' as subject and 'rejected' as a non-restrictive participial.\n\nB — 'the project was recognized as significant by its eventual funding' is acceptable but awkward; 'funding' recognizing significance is strained.\nD is correct because A and C are valid."}, {"k": "Modifiers", "p": "Several community members expressed concern about the proposed highway expansion at last month's public hearing. <u>Having reviewed hundreds of noise and emissions studies, the case for the project was ultimately deemed insufficient by independent experts.</u>", "q": "Which revision is correct?", "o": ["A) Having reviewed hundreds of noise and emissions studies, independent experts ultimately found the case for the project insufficient.", "B) Having reviewed hundreds of noise and emissions studies, the project's case was deemed insufficient by independent experts.", "C) Independent experts, having reviewed hundreds of studies, and finding the case insufficient.", "D) The case for the project, having reviewed hundreds of noise and emissions studies, was deemed insufficient."], "a": 0, "e": "A is correct. 'Having reviewed hundreds of noise and emissions studies' is performed by the independent experts. The main clause must open with 'independent experts.'\n\nB — 'the project's case' cannot review studies.\nC — no main verb; fragment.\nD — 'the case' cannot review studies."}, {"k": "Modifiers", "p": "The new performance evaluation system was introduced companywide after a successful pilot in the eastern division. <u>Intended to increase transparency and reduce bias in promotion decisions, managers initially resisted the change.</u>", "q": "Which revision is correct?", "o": ["A) Intended to increase transparency and reduce bias in promotion decisions, the system was initially resisted by managers.", "B) Intended to increase transparency and reduce bias in promotion decisions, managers initially resisted the system.", "C) Managers initially resisted the system, which was intended to increase transparency and reduce bias in promotion decisions.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the dangling modifier. A makes 'the system' the subject of the corrected sentence. C uses a non-restrictive relative clause to describe the system.\n\nB — 'managers' cannot be intended to increase transparency (the system is intended to).\nD is correct."}, {"k": "Modifiers", "p": "The team of environmental engineers spent six months evaluating the contamination levels at the former industrial site. <u>After completing a comprehensive assessment of soil and groundwater samples, a remediation plan was presented to the city council.</u>", "q": "Which revision is correct?", "o": ["A) After completing a comprehensive assessment of soil and groundwater samples, the engineers presented a remediation plan to the city council.", "B) After completing a comprehensive assessment, the remediation plan was presented by the engineers to the city council.", "C) The remediation plan, after completing a comprehensive assessment, was presented to the city council.", "D) A is the only correct revision."], "a": 3, "e": "D is correct. Only A correctly fixes the dangling modifier. 'After completing a comprehensive assessment' is performed by the engineers. The main clause must open with 'the engineers.'\n\nB — passive; 'the remediation plan' did not complete the assessment.\nC — 'the remediation plan' cannot complete an assessment.\nD is correct (A is the only valid fix)."}, {"k": "Modifiers", "p": "The relief organization's logistics coordinator managed the distribution of supplies across twelve refugee camps. <u>Working in collaboration with local NGOs and international donors, the supplies reached over forty thousand families within the first week.</u>", "q": "Which revision is correct?", "o": ["A) Working in collaboration with local NGOs and international donors, the logistics coordinator ensured that supplies reached over forty thousand families within the first week.", "B) Working in collaboration with local NGOs and international donors, the supplies reached over forty thousand families within the first week.", "C) The supplies, worked in collaboration with local NGOs and international donors, reached over forty thousand families.", "D) The logistics coordinator working in collaboration with local NGOs and international donors, and reaching over forty thousand families."], "a": 0, "e": "A is correct. 'Working in collaboration' is performed by the logistics coordinator (a person). The main clause must open with 'the logistics coordinator.'\n\nB — supplies cannot work in collaboration.\nC — 'worked' is incorrect passive construction and supplies cannot collaborate.\nD — no main verb; fragment."}, {"k": "Modifiers", "p": "The summit concluded with a joint declaration signed by all twenty-three participating governments. <u>Representing a significant diplomatic achievement, the agreement was celebrated as a historic milestone by analysts who had followed the negotiations closely.</u>", "q": "Is the modifier correctly placed?", "o": ["A) Yes — 'representing a significant diplomatic achievement' correctly modifies 'the agreement.'", "B) No — 'representing a significant diplomatic achievement' modifies 'the summit'; the sentence should read: 'The summit, representing a significant diplomatic achievement, concluded with a joint declaration...'", "C) No — 'representing a significant diplomatic achievement' dangling-modifies 'analysts.'", "D) Yes — the agreement can represent a diplomatic achievement."], "a": 3, "e": "D is correct. 'Representing a significant diplomatic achievement' modifies 'the agreement' — this is the subject immediately following the participial phrase. The agreement represents the achievement. The modifier is correctly placed.\n\nA — same as D; also correct.\nB — the summit concluded, but the joint declaration (the agreement) represents the achievement, not the summit itself.\nC — 'analysts' do not represent the diplomatic achievement.\nD is the best answer."}, {"k": "Modifiers", "p": "The pediatric hospital launched a campaign to increase vaccination rates in the region following a measles outbreak. <u>Targeting schools, community centers, and local media outlets, awareness of the campaign spread quickly throughout the district.</u>", "q": "Which revision is correct?", "o": ["A) Targeting schools, community centers, and local media outlets, the hospital quickly spread awareness of the campaign throughout the district.", "B) Targeting schools, community centers, and local media outlets, the campaign quickly spread throughout the district.", "C) Awareness of the campaign, targeting schools, community centers, and local media outlets, spread quickly throughout the district.", "D) A or B"], "a": 3, "e": "D is correct. Both A and B correctly fix the modifier. A makes 'the hospital' the subject (it targeted). B makes 'the campaign' the subject (the campaign itself targeted outlets). Both are logically and grammatically valid.\n\nC — 'awareness' cannot target schools or media outlets.\nD is correct."}, {"k": "Modifiers", "p": "Completed after seven years of delays, <u>the bridge immediately reduced commute times for over eighty thousand daily travelers</u>.", "q": "Is the modifier correctly placed?", "o": ["A) Yes — 'completed after seven years of delays' correctly modifies 'the bridge.'", "B) No — 'completed after seven years of delays' dangles; the bridge cannot be completed.", "C) No — the modifier should read 'having been completed after seven years of delays.'", "D) No — 'completed after seven years of delays' modifies 'commute times.'"], "a": 0, "e": "A is correct. 'Completed after seven years of delays' is a past participial phrase modifying 'the bridge.' Bridges can be completed — this is a passive participial construction. The modifier is correctly placed because 'the bridge' immediately follows.\n\nB — bridges are regularly the objects of completion; the passive participial is correct.\nC — 'having been completed' is an alternative but not more correct.\nD — the modifier precedes 'the bridge,' not 'commute times.'"}, {"k": "Modifiers", "p": "The software engineers stayed late every evening for two weeks to finalize the application before launch. <u>Working through multiple rounds of debugging and user testing, the application's launch was delayed by only forty-eight hours despite the complexity of the issues encountered.</u>", "q": "Which revision is correct?", "o": ["A) Working through multiple rounds of debugging and user testing, the software engineers delayed the launch by only forty-eight hours despite the complexity of the issues encountered.", "B) The application's launch, working through multiple rounds of debugging and user testing, was delayed by only forty-eight hours.", "C) Working through multiple rounds of debugging and user testing, the engineers ensured the launch was delayed by only forty-eight hours.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the dangling modifier by making 'the software engineers' or 'the engineers' the subject performing the working.\n\nB — 'the application's launch' cannot work through rounds of debugging.\nD is correct."}, {"k": "Modifiers", "p": "The financial regulator released its quarterly enforcement bulletin last Thursday. <u>Identifying widespread non-compliance with the new disclosure requirements, the bulletin was issued as a formal warning to all registered institutions.</u>", "q": "Is the modifier correctly placed?", "o": ["A) Yes — 'identifying widespread non-compliance' correctly modifies 'the bulletin.'", "B) No — 'identifying' dangles; the bulletin cannot identify non-compliance.", "C) Yes — a bulletin can identify patterns of non-compliance; this is standard usage.", "D) A and C"], "a": 3, "e": "D is correct. Both A and C are correct. A regulatory bulletin can 'identify' patterns — this is a common and accepted usage in institutional English. The bulletin is the document that identifies the non-compliance. 'Identifying widespread non-compliance with the new disclosure requirements' correctly modifies 'the bulletin.'\n\nB — documents regularly 'identify,' 'reveal,' 'highlight,' and 'indicate' findings; the participial is grammatically acceptable.\nD is correct."}
