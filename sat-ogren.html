:18,"choices":{"A":"a framework smaller businesses could access government contracts under","B":"a framework under which smaller businesses could access government contracts","D":"a framework in which smaller businesses could access government contracts","C":"a framework that smaller businesses could access government contracts under it"}},{"stem":"The experiment yielded data from which several unexpected conclusions could be drawn. The lead researcher acknowledged that the results had challenged her initial hypotheses significantly. A follow-up study was subsequently designed to test whether the anomalous patterns would replicate.  Which choice correctly uses a prepositional relative to refer to the data?","why":"'From which' correctly fronts the preposition in formal prose. B incorrectly uses 'that' after a preposition. C adds a double reference pronoun ('it'). D omits the relative pronoun, making the sentence an acceptable but informal contact clause — not the standard for formal academic prose.","slug":"gri-mod-sat-g28-1-19","ans":"A","choices":{"D":"data several unexpected conclusions could be drawn from","C":"data that several unexpected conclusions could be drawn from it","B":"data from that several unexpected conclusions could be drawn","A":"data from which several unexpected conclusions could be drawn"},"n":19},{"ans":"C","why":"'To which' fronts the preposition correctly in formal prose. B strands the preposition — acceptable in informal English but not preferred in formal writing when revision is available. C adds a double reference pronoun ('it'). D omits the relative pronoun entirely, forming a contact clause — grammatically passable informally but not appropriate for formal prose.","stem":"The coalition signed a declaration to which all member nations formally committed. The document outlined shared obligations regarding environmental protection and trade regulation. Signatories agreed to submit annual compliance reports to an independent monitoring body.  Which choice correctly uses 'to which' to show commitment in a formal clause?","n":20,"choices":{"D":"a declaration all member nations formally committed to","C":"a declaration to which all member nations formally committed","B":"a declaration that all member nations formally committed to it","A":"a declaration which all member nations formally committed to"},"slug":"gri-mod-sat-g28-1-20"},{"ans":"D","why":"Both A and B are grammatically correct. A uses the formal 'the [noun] of which' construction, which is preferred in highly formal or academic prose. B uses 'whose,' which is widely accepted for inanimate objects but slightly less formal. C and D insert redundant possessives ('its') after the relative pronoun, creating double reference errors. A is preferred given the formal register of the passage.","stem":"The architect designed a building the structural integrity of which had been validated through extensive seismic modeling. The project broke ground in spring and was expected to be completed within thirty months. Its distinctive curved facade had already attracted significant media attention before construction began.  Which choice uses the correct relative construction for a formal possessive reference to a thing?","n":21,"choices":{"C":"a building which its structural integrity had been validated","D":"a building the structural integrity of which had been validated","B":"a building that its structural integrity had been validated","A":"a building whose structural integrity had been validated"},"slug":"gri-mod-sat-g28-1-21"},{"stem":"The committee reviewed a proposal the feasibility of which had not been independently assessed. Members expressed concern that the cost projections relied heavily on optimistic assumptions. A second review was commissioned before any funding decision would be made.  Which choice correctly uses a formal 'of which' construction for an inanimate noun?","why":"'The feasibility of which' is the formal possessive relative construction used for inanimate nouns in academic prose. B ('whose') is grammatically acceptable but less formal. C inserts a redundant possessive ('its'). D uses 'that' incorrectly — 'the feasibility that had not been assessed' makes 'feasibility' the antecedent of the relative clause, which changes the logical relationship.","ans":"A","choices":{"A":"a proposal the feasibility of which had not been independently assessed","B":"a proposal whose feasibility had not been independently assessed","C":"a proposal that its feasibility had not been independently assessed","D":"a proposal the feasibility that had not been independently assessed"},"n":22,"slug":"gri-mod-sat-g28-1-22"},{"ans":"B","stem":"The documentary explored the mechanisms through which misinformation spreads across social media platforms. Researchers interviewed for the film emphasized the role of algorithmic amplification. They argued that platform design choices, not individual user behavior, were the primary drivers of viral falsehoods.  Which choice correctly uses a relative clause to identify the mechanisms described?","slug":"gri-mod-sat-g28-1-23","why":"'Through which' fronts the preposition correctly in formal prose. B adds a double reference pronoun ('them'). C omits the relative pronoun, forming an informal contact clause. D uses 'where,' which implies a location — mechanisms are processes, not places.","n":23,"choices":{"B":"the mechanisms through which misinformation spreads across social media platforms","A":"the mechanisms that misinformation spreads across social media platforms through them","C":"the mechanisms misinformation spreads across social media platforms through","D":"the mechanisms where misinformation spreads across social media platforms"}},{"ans":"A","slug":"gri-mod-sat-g28-1-24","why":"'In accordance with which' correctly fronts the entire prepositional phrase before the relative pronoun, as required in formal prose with compound prepositions. B strands the entire phrase at the end, informal but substandard here. C adds a double reference pronoun ('it'). D omits the relative pronoun entirely.","stem":"The judge delivered a verdict in accordance with which all seized assets would be returned to their original owners. The ruling was seen as a landmark decision in property rights litigation. Several similar cases pending in lower courts were expected to be influenced by its reasoning.  Which choice correctly maintains the formal prepositional relative construction?","n":24,"choices":{"A":"a verdict in accordance with which all seized assets would be returned","B":"a verdict that all seized assets would be returned in accordance with","C":"a verdict which all seized assets would be returned in accordance with it","D":"a verdict all seized assets would be returned in accordance with"}},{"choices":{"B":"a study that the researchers had spent two years collecting preliminary data for","A":"a study for which the researchers had spent two years collecting preliminary data","D":"a study which the researchers had spent two years collecting preliminary data for it","C":"a study the researchers had spent two years collecting preliminary data for it"},"n":25,"stem":"The grant supported a study for which the researchers had spent two years collecting preliminary data. The funding allowed them to scale their sample size significantly. Results from the expanded study were expected to produce findings with far greater statistical power than the pilot had achieved.  Which choice correctly uses a prepositional relative to indicate what the grant supported?","slug":"gri-mod-sat-g28-1-25","why":"'For which' fronts the preposition correctly in formal prose. B strands the preposition — acceptable informally but not preferred in formal writing. C omits the relative pronoun and adds a double reference pronoun ('it'). D also adds a double reference pronoun ('it') alongside a stranded preposition.","ans":"A"}]}],"name":"Tense Consistency","id":"g28"},{"id":"g29","group":"Dilbilgisi","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Subordinate Clauses. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"n":1,"choices":{"D":"Having published their findings in a peer-reviewed journal, the researchers completed the initial phase of the study.","C":"The researchers, who published their findings in a peer-reviewed journal, completed the initial phase of the study.","B":"The researchers completed the initial phase of the study, and they published their findings in a peer-reviewed journal.","A":"After completing the initial phase of the study, the researchers published their findings in a peer-reviewed journal."},"ans":"A","why":"A uses a participial phrase to subordinate the first action and makes 'publishing' the main clause emphasis — logical because the publication is what attracted attention. B uses simple coordination (and), which treats both actions as equal — accurate but less precise. C inverts the sequence illogically (they cannot publish before completing). D reverses the chronological order, implying publication preceded completion.","slug":"gri-mod-sat-g29-1-1","stem":"The researchers completed the initial phase of the study. They published their findings in a peer-reviewed journal. The publication attracted significant attention from the scientific community.  Which choice most effectively combines the first two sentences while preserving logical priority?"},{"stem":"The bridge had stood for over a century. Engineers determined it was structurally unsafe. The city ordered an immediate closure.  Which choice most effectively combines the first two sentences to show cause and effect?","slug":"gri-mod-sat-g29-1-2","why":"A correctly uses 'although' to show concession — the bridge's age is surprising given its unsafe condition. This is logically accurate: longevity does not guarantee safety. B uses 'so,' implying the age caused the determination of unsafety — a logical error. C uses neutral coordination. D uses 'because,' implying age directly caused the engineers' determination — also logically incorrect.","ans":"B","choices":{"B":"Although the bridge had stood for over a century, engineers determined it was structurally unsafe.","A":"The bridge had stood for over a century, so engineers determined it was structurally unsafe.","D":"Because the bridge had stood for over a century, engineers determined it was structurally unsafe.","C":"The bridge had stood for over a century, and engineers determined it was structurally unsafe."},"n":2},{"ans":"D","stem":"The company launched its new product line in March. Sales figures exceeded projections by forty percent. Investors responded with renewed confidence.  Which choice most effectively combines the first two sentences using subordination?","why":"A uses 'when' to establish a temporal relationship between the launch and the sales results — logical and precise. B uses 'but,' implying contrast, which misrepresents the relationship (exceeding projections is not a contrast to launching). C reverses the cause-and-effect relationship. D uses 'so that,' which implies the launch was deliberately designed to produce those exact figures — an overreach.","slug":"gri-mod-sat-g29-1-3","n":3,"choices":{"D":"When the company launched its new product line in March, sales figures exceeded projections by forty percent.","C":"The company launched its new product line in March, so that sales figures exceeded projections by forty percent.","A":"The company launched its new product line in March, but sales figures exceeded projections by forty percent.","B":"Because sales figures exceeded projections by forty percent, the company launched its new product line in March."}},{"ans":"B","stem":"The novel was rejected by twelve publishers. It went on to sell more than ten million copies. It is now considered a defining work of its generation.  Which choice most effectively combines the first two sentences to express contrast?","slug":"gri-mod-sat-g29-1-4","why":"'Although' correctly signals concession — the rejections make the eventual success surprising. B uses 'because,' implying rejections caused success. C uses 'so,' implying rejections led logically to sales — both are illogical. D uses 'when,' treating rejection and success as simultaneous or sequentially neutral events, which misrepresents the irony of the situation.","n":4,"choices":{"C":"The novel was rejected by twelve publishers, so it went on to sell more than ten million copies.","D":"When the novel was rejected by twelve publishers, it went on to sell more than ten million copies.","A":"Because the novel was rejected by twelve publishers, it went on to sell more than ten million copies.","B":"Although the novel was rejected by twelve publishers, it went on to sell more than ten million copies."}},{"ans":"A","stem":"The scientist had dedicated thirty years to the project. She was forced to retire before the final results were published. A junior colleague completed the analysis in her absence.  Which choice most effectively combines the first two sentences to emphasize the contrast between dedication and outcome?","why":"'Despite' signals concession — long dedication did not prevent early retirement. B implies dedication caused retirement — logically incorrect. C uses neutral coordination, losing the irony. D uses 'so,' implying dedication caused retirement — also incorrect.","n":5,"choices":{"D":"The scientist had dedicated thirty years to the project, so she was forced to retire before the final results were published.","C":"The scientist had dedicated thirty years to the project, and she was forced to retire before the final results were published.","A":"Despite having dedicated thirty years to the project, the scientist was forced to retire before the final results were published.","B":"Because the scientist had dedicated thirty years to the project, she was forced to retire before the final results were published."},"slug":"gri-mod-sat-g29-1-5"},{"stem":"The city installed new traffic signals at the intersection. Accident rates dropped by thirty percent in the following year. Urban planners called the intervention a model success.  Which choice most effectively combines the first two sentences to show cause and result?","why":"'After' establishes a clear temporal-causal relationship: installation preceded the drop. B uses 'although,' implying an unexpected contrast — but a drop after safety improvements is expected, not surprising. C reverses cause and effect. D uses 'but,' implying the drop was surprising or contradictory — which it is not.","slug":"gri-mod-sat-g29-1-6","ans":"C","choices":{"C":"After the city installed new traffic signals at the intersection, accident rates dropped by thirty percent in the following year.","D":"The city installed new traffic signals at the intersection, but accident rates dropped by thirty percent in the following year.","B":"Because accident rates dropped by thirty percent, the city installed new traffic signals at the intersection.","A":"Although the city installed new traffic signals at the intersection, accident rates dropped by thirty percent in the following year."},"n":6},{"choices":{"A":"The athlete trained for six months under extreme conditions, so she suffered a knee injury two weeks before the competition.","B":"Because she suffered a knee injury two weeks before the competition, the athlete had trained for six months.","D":"Although training for six months under extreme conditions, the athlete suffered a knee injury two weeks before the competition.","C":"Having trained for six months under extreme conditions, the athlete suffered a knee injury two weeks before the competition."},"n":7,"stem":"The athlete trained for six months under extreme conditions. She suffered a knee injury two weeks before the competition. She withdrew from the event entirely.  Which choice most effectively combines the first two sentences using a participial phrase?","why":"A uses a perfect participial phrase to establish prior context (training) before the main clause event (injury). B uses 'so,' implying training directly caused injury — an unfair implication. C reverses chronology. D uses 'although,' implying the training made the injury unexpected — logically awkward since injury can occur despite training.","slug":"gri-mod-sat-g29-1-7","ans":"C"},{"choices":{"D":"Because applications increased by sixty percent, the administration announced a new scholarship program.","C":"Although the administration announced a new scholarship program, applications increased by sixty percent.","A":"The administration announced a new scholarship program, but applications increased by sixty percent.","B":"Once the administration announced a new scholarship program, applications increased by sixty percent."},"n":8,"stem":"The administration announced a new scholarship program. Applications increased by sixty percent. Many students who had previously been unable to afford tuition enrolled.  Which choice most effectively combines the first two sentences?","slug":"gri-mod-sat-g29-1-8","why":"'Once' correctly shows that the increase followed the announcement — a clear sequential-causal relationship. B uses 'but,' which implies an unexpected or contradictory result. C uses 'although,' implying contrast. D reverses cause and effect.","ans":"B"},{"choices":{"A":"The documentary had a limited release in three cities, so it won four major awards at international film festivals.","B":"Because the documentary won four major awards, it had a limited release in three cities.","C":"Although it had a limited release in three cities, the documentary won four major awards at international film festivals.","D":"The documentary, which won four major awards at international film festivals, had a limited release in three cities."},"n":9,"why":"A uses 'although' to show that the limited release and the award wins are in tension — the success was surprising given the narrow distribution. B uses 'so,' implying the limited release caused the wins. C reverses the sequence. D (using a relative clause) merely places one fact inside another without expressing the contrast — acceptable but less effective than A.","slug":"gri-mod-sat-g29-1-9","stem":"The documentary had a limited release in three cities. It won four major awards at international film festivals. Distributors subsequently expanded its release nationally.  Which choice most effectively combines the first two sentences while preserving both facts without implying causation?","ans":"C"},{"slug":"gri-mod-sat-g29-1-10","why":"'Despite' signals that the extensive effort did not prevent the errors — the key concessive relationship. B implies refinement caused the errors. C uses 'after,' which is temporal but neutral — it doesn't convey that the effort was insufficient. D uses 'so,' implying the effort caused the errors.","stem":"The team spent three months refining their algorithm. The final model still produced errors in fifteen percent of cases. The engineers returned to the design phase.  Which choice most effectively combines the first two sentences to express that the effort did not fully succeed?","ans":"B","choices":{"A":"Because the team spent three months refining their algorithm, the final model produced errors in fifteen percent of cases.","B":"Despite spending three months refining their algorithm, the team's final model still produced errors in fifteen percent of cases.","C":"After spending three months refining their algorithm, the team produced a final model that still produced errors in fifteen percent of cases.","D":"The team spent three months refining their algorithm, so the final model still produced errors in fifteen percent of cases."},"n":10},{"slug":"gri-mod-sat-g29-1-11","ans":"B","stem":"The policy was initially praised by economists. It produced lower unemployment figures within its first year. Critics argued the gains were temporary and unsustainable.  Which choice most effectively combines the first two sentences using a relative clause?","why":"A places the economists' praise in a non-restrictive relative clause (supplementary detail) and makes the unemployment outcome the main clause — the more significant finding given the critical context that follows. B implies praise caused the results. C uses a restrictive clause that changes the meaning — implying only the result-producing policy was praised. D implies praise caused the results.","n":11,"choices":{"A":"The policy was initially praised by economists, so it produced lower unemployment figures within its first year.","B":"The policy, which was initially praised by economists, produced lower unemployment figures within its first year.","C":"The policy that produced lower unemployment figures was initially praised by economists within its first year.","D":"Because the policy was initially praised by economists, it produced lower unemployment figures within its first year."}},{"n":12,"choices":{"B":"Although the painting had been authenticated by three independent experts, a fourth expert disputed the findings upon closer examination.","A":"Because the painting had been authenticated by three independent experts, a fourth expert disputed the findings.","D":"When the painting had been authenticated by three experts, a fourth expert disputed the findings.","C":"The painting had been authenticated by three independent experts, so a fourth expert disputed the findings."},"ans":"B","slug":"gri-mod-sat-g29-1-12","why":"'Although' correctly signals the contrast: the consensus authentication makes the fourth expert's dispute particularly significant. B and C imply authentication caused the dispute. D uses 'when,' treating both events as simultaneous or sequentially neutral.","stem":"The painting had been authenticated by three independent experts. A fourth expert disputed the findings upon closer examination. The museum suspended public display pending further review.  Which choice most effectively combines the first two sentences to highlight the conflict?"},{"n":13,"choices":{"B":"The river flooded its banks, but agricultural land in the surrounding region was submerged.","A":"When the river flooded its banks, agricultural land in the surrounding region was submerged.","D":"Having flooded its banks, the river submerged agricultural land in the surrounding region.","C":"Although the river flooded its banks, agricultural land in the surrounding region was submerged."},"ans":"D","slug":"gri-mod-sat-g29-1-13","why":"B uses a perfect participial phrase ('Having flooded') to show the river as the agent of submersion, combining both sentences efficiently. A is temporal but slightly passive — 'was submerged' hides the river's agency. C uses 'but,' incorrectly implying contrast. D uses 'although,' implying submerging was unexpected after flooding — illogical.","stem":"The river flooded its banks. Agricultural land in the surrounding region was submerged. Farmers lost an estimated forty percent of their annual harvest.  Which choice most effectively combines the first two sentences using a participial phrase?"},{"n":14,"choices":{"C":"Although the author revised the manuscript seventeen times, each revision added clarity and reduced redundancy.","D":"Because each revision added clarity and reduced redundancy, the author revised the manuscript seventeen times.","A":"The author revised the manuscript seventeen times, each revision adding clarity and reducing redundancy.","B":"The author revised the manuscript seventeen times, but each revision added clarity and reduced redundancy."},"ans":"A","why":"A uses an absolute phrase ('each revision adding') to describe the process in parallel with the main clause — elegant and precise. B uses 'but,' implying an unexpected contrast. C uses 'although,' implying the improvements were surprising given the revisions. D reverses the logical order — clarity per revision was the result, not the motivation for the number of revisions.","stem":"The author revised the manuscript seventeen times. Each revision added clarity and reduced redundancy. The final version was praised universally by reviewers.  Which choice most effectively combines the first two sentences to show a cumulative process?","slug":"gri-mod-sat-g29-1-14"},{"choices":{"A":"The government introduced strict emissions regulations, so several major manufacturers initially resisted compliance.","B":"Although the government introduced strict emissions regulations, several major manufacturers initially resisted compliance.","C":"Because several major manufacturers initially resisted compliance, the government introduced strict emissions regulations.","D":"After the government introduced strict emissions regulations, several major manufacturers initially resisted compliance."},"n":15,"slug":"gri-mod-sat-g29-1-15","why":"'After' correctly establishes that resistance followed the introduction of regulations — a straightforward temporal-causal sequence. B uses 'so,' implying regulations logically caused resistance in a direct sense — too reductive. C uses 'although,' implying resistance was surprising — it is in fact a natural corporate response and not particularly unexpected. D reverses the sequence.","stem":"The government introduced strict emissions regulations. Several major manufacturers initially resisted compliance. Within two years, industry-wide emissions had fallen by twenty percent.  Which choice most effectively combines the first two sentences?","ans":"D"},{"n":16,"choices":{"C":"Although the linguist analyzed thousands of transcripts, she identified consistent patterns in how speakers signal disagreement.","D":"By analyzing thousands of transcripts, the linguist identified consistent patterns in how speakers signal disagreement without explicit negation.","A":"The linguist analyzed thousands of transcripts, so she identified consistent patterns in how speakers signal disagreement.","B":"The linguist analyzed thousands of transcripts, but she identified consistent patterns in how speakers signal disagreement."},"ans":"D","stem":"The linguist analyzed thousands of transcripts. She identified consistent patterns in how speakers signal disagreement without using explicit negation. The findings reshaped how pragmatics researchers studied indirect speech acts.  Which choice most effectively combines the first two sentences using subordination?","slug":"gri-mod-sat-g29-1-16","why":"A uses a 'by + gerund' construction to show the analysis as the method through which the discovery was made — precise and efficient. B uses 'so,' which is causal and accurate but less precise about the process-outcome relationship. C uses 'but,' implying identification was an unexpected result of analysis. D uses 'although,' which implies the same."},{"why":"A correctly uses 'because' to show that high attendance caused the extension — a direct and logical cause-effect relationship. B uses 'although,' implying extension was surprising given high attendance — illogical. C reverses cause and effect. D uses 'but,' implying extension was an unexpected or contradictory response.","slug":"gri-mod-sat-g29-1-17","stem":"The exhibition opened to the public on a Thursday. Attendance figures for the first weekend were nearly double the museum's projection. The museum extended the exhibition by three weeks.  Which choice most effectively combines the second and third sentences?","ans":"D","choices":{"A":"Although attendance figures were nearly double the projection, the museum extended the exhibition by three weeks.","B":"The museum extended the exhibition by three weeks, so attendance figures were nearly double the projection.","D":"Because attendance figures for the first weekend were nearly double the museum's projection, the museum extended the exhibition by three weeks.","C":"Attendance figures were nearly double the projection, but the museum extended the exhibition by three weeks."},"n":17},{"stem":"The surgeon operated for nine hours. The patient's condition had been considered critical before the procedure. The surgery was ultimately successful.  Which choice most effectively combines the first two sentences using a subordinate clause?","why":"B uses a relative clause to embed the patient's critical condition into a description of the patient — the most efficient and logical construction. A uses 'although' with the wrong main clause — the duration of surgery is not the surprising result; success is. C reverses cause and effect absurdly. D uses 'but,' creating a false contrast.","slug":"gri-mod-sat-g29-1-18","ans":"A","choices":{"D":"The surgeon operated for nine hours, but the patient's condition had been considered critical before the procedure.","C":"Because the surgeon operated for nine hours, the patient's condition had been considered critical.","B":"Although the patient's condition had been considered critical before the procedure, the surgeon operated for nine hours.","A":"The surgeon operated for nine hours on a patient whose condition had been considered critical before the procedure."},"n":18},{"choices":{"A":"Because the committee reviewed the evidence for three hours, no consensus was reached by the end of the session.","B":"The committee reviewed the evidence for three hours, so no consensus was reached by the end of the session.","D":"After reviewing the evidence for three hours, the committee reached no consensus by the end of the session.","C":"Despite reviewing the evidence for three hours, the committee reached no consensus by the end of the session."},"n":19,"stem":"The committee reviewed the evidence for three hours. No consensus was reached by the end of the session. A second meeting was scheduled for the following week.  Which choice most effectively combines the first two sentences to show that effort did not produce resolution?","why":"'Despite' signals concession — extensive review time did not produce consensus. B implies review caused failure. C implies the same with 'so.' D uses 'after,' which is temporally accurate but does not convey the sense of effort-without-result that the context implies.","slug":"gri-mod-sat-g29-1-19","ans":"C"},{"slug":"gri-mod-sat-g29-1-20","n":20,"choices":{"A":"The program trained over five hundred participants who all reported significant improvements in their professional skills.","B":"The program trained over five hundred participants, so most reported significant improvements in their skills.","C":"The program trained over five hundred participants, most of whom reported significant improvements in their professional skills.","D":"Most participants reported improvements because the program trained over five hundred of them."},"ans":"C","why":"A uses 'most of whom' — a partitive relative construction that accurately reflects 'most' (not all) participants. B uses 'who all,' implying every participant reported improvement, which contradicts 'most.' C uses 'so,' which implies training directly caused the improvements without distinguishing the proportion. D awkwardly reverses the sentence logic.","stem":"The program trained over five hundred participants. Most participants reported significant improvements in their professional skills. Retention rates in the participating organizations increased measurably.  Which choice most effectively combines the first two sentences using a relative clause?"},{"ans":"A","stem":"The engineers redesigned the cooling system. Energy consumption was reduced by eighteen percent. The company met its sustainability targets for the first time in a decade.  Which choice most effectively combines the first two sentences using a participial phrase?","why":"A uses 'by + gerund' to identify the method through which reduction was achieved — precise and grammatically correct. B creates a dangling modifier — 'redesigning' has no logical subject since 'energy consumption' did not redesign anything. C is acceptable but less economical. D uses 'although,' implying the reduction was unexpected.","slug":"gri-mod-sat-g29-1-21","n":21,"choices":{"B":"Redesigning the cooling system, energy consumption was reduced by eighteen percent.","A":"By redesigning the cooling system, the engineers reduced energy consumption by eighteen percent.","C":"The engineers redesigned the cooling system, so energy consumption was reduced by eighteen percent.","D":"Although the engineers redesigned the cooling system, energy consumption was reduced by eighteen percent."}},{"n":22,"choices":{"A":"Several factual inaccuracies were identified during the second review, but the article was not published.","B":"Although several factual inaccuracies were identified during the second review, the article was not published.","D":"Several factual inaccuracies were identified during the second review, so the article was not eventually published.","C":"Because several factual inaccuracies were identified during the second review, the article was not published."},"ans":"C","why":"A correctly uses 'because' to show inaccuracies as the direct cause of non-publication. B uses 'but,' implying non-publication was a surprising or contradictory response to finding errors. C uses 'although,' which would imply the article was published despite errors — then inverts with non-publication, creating confusion. D's 'so' is logically close to A but the phrase 'not eventually published' is awkward.","slug":"gri-mod-sat-g29-1-22","stem":"The editorial board reviewed the article twice. Several factual inaccuracies were identified during the second review. The article was not published.  Which choice most effectively combines the second and third sentences?"},{"n":23,"choices":{"D":"The astronauts completed their spacewalk in record time, and an equipment malfunction had threatened to cut the mission short.","C":"The astronauts completed their spacewalk in record time, so an equipment malfunction had threatened to cut the mission short.","B":"Because an equipment malfunction had threatened to cut the mission short, the astronauts completed their spacewalk in record time.","A":"Despite an earlier equipment malfunction that had threatened to cut the mission short, the astronauts completed their spacewalk in record time."},"ans":"A","stem":"The astronauts completed their spacewalk in record time. Equipment malfunction had threatened to cut the mission short earlier. Ground control celebrated the successful completion.  Which choice most effectively combines the first two sentences to highlight the achievement given the difficulty?","slug":"gri-mod-sat-g29-1-23","why":"A uses 'despite' and a relative clause to subordinate the obstacle and foreground the achievement. B implies the malfunction caused the record time — illogical. C reverses cause and effect. D coordinates both as equal facts, losing the sense of triumph over adversity."},{"stem":"The students submitted their final projects on the last day of the semester. Several projects demonstrated insights that went well beyond the requirements. The instructor offered three students the opportunity to expand their work into a publication.  Which choice most effectively combines the second and third sentences?","why":"A uses 'because' to clearly identify the exceptional quality of the projects as the reason for the publication offer. B uses 'but,' implying the offer was unexpected or contradictory. C uses 'although,' also implying the offer was a surprising response to quality. D is logically similar to A but 'were beyond requirements' loses the specific wording 'insights that went well beyond,' which better justifies the publication offer.","ans":"D","choices":{"A":"Several projects demonstrated insights that went well beyond the requirements, but the instructor offered three students the opportunity to expand their work.","B":"Although several projects demonstrated insights beyond the requirements, the instructor offered three students the opportunity to expand their work.","C":"The instructor offered three students the opportunity to expand their work because several projects were beyond requirements.","D":"Because several projects demonstrated insights that went well beyond the requirements, the instructor offered three students the opportunity to expand their work into a publication."},"n":24,"slug":"gri-mod-sat-g29-1-24"},{"slug":"gri-mod-sat-g29-1-25","why":"A uses 'many of which' — a partitive relative clause — to embed the additional detail within a single integrated sentence. 'Many of which' is more formal than 'many of them' (B). C incorrectly substitutes 'all of which,' changing 'many' to 'all' — factually inconsistent. D restructures the sentence to lead with the rare species, shifting the emphasis away from the team's discovery — grammatically correct but thematically less aligned with the passage's purpose.","stem":"The conservation team identified over two hundred plant species in the protected zone. Many species had not been recorded in the region for decades. The findings prompted calls for expanded protections.  Which choice most effectively combines the first two sentences using a partitive relative construction?","ans":"A","choices":{"D":"Many species that had not been recorded in the region for decades were identified by the conservation team in the protected zone.","C":"The conservation team identified over two hundred plant species, all of which had not been recorded in the region for decades.","A":"The conservation team identified over two hundred plant species in the protected zone, many of which had not been recorded in the region for decades.","B":"The conservation team identified over two hundred plant species in the protected zone, and many of them had not been recorded for decades."},"n":25}],"t":"mcqquiz"}],"name":"Subordinate Clauses","eyebrow":"Gramer"},{"eyebrow":"Gramer","id":"g210","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Mixed Grammar Review II. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"slug":"gri-mod-sat-g210-1-1","stem":"The committee convened three times before issuing a formal statement. Its members represented a wide range of professional backgrounds, including law, medicine, and academic research. The final document reflected weeks of careful deliberation and was issued without dissent.  Which choice correctly punctuates the boundary between two complete clauses?","why":"The two clauses are independent and must be separated by a period or semicolon. A creates a comma splice. B correctly uses a period. C adds a redundant pronoun ('it'). D incorrectly places the semicolon after 'backgrounds,' separating the introductory list from the clause it modifies.","ans":"C","choices":{"D":"Its members represented a wide range of professional backgrounds; including law, medicine, and academic research, the final document reflected weeks of careful deliberation.","C":"Its members represented a wide range of professional backgrounds, including law, medicine, and academic research. The final document reflected weeks of careful deliberation.","A":"its members represented a wide range of professional backgrounds, including law, medicine, and academic research, the final document reflected weeks of careful deliberation.","B":"Its members represented a wide range of professional backgrounds, including law, medicine, and academic research; the final document it reflected weeks of careful deliberation."},"n":1},{"slug":"gri-mod-sat-g210-1-2","why":"'Submitted three weeks after the original deadline' is a non-restrictive participial phrase that adds supplementary information — it must be enclosed in commas. A omits both commas, treating the phrase as essential (restrictive). C uses only the opening comma, breaking the sentence mid-phrase. D incorrectly places the comma after 'submitted,' splitting the phrase from its modifier head.","stem":"The report, submitted three weeks after the original deadline, contained data that contradicted the committee's earlier conclusions. Reviewers noted that several of the appendices were missing and that key citations had not been formatted according to the required style guide.  Which choice correctly uses commas to set off a non-restrictive modifier?","ans":"C","choices":{"C":"The report, submitted three weeks after the original deadline, contained data","D":"The report submitted, three weeks after the original deadline, contained data","B":"The report, submitted three weeks after the original deadline contained data","A":"The report submitted three weeks after the original deadline contained data"},"n":2},{"choices":{"C":"The collection of artifacts, discovered beneath the old courthouse, have attracted","D":"The collection, of artifacts discovered beneath the old courthouse, has attracted","B":"The collection of artifacts discovered beneath the old courthouse have attracted","A":"The collection of artifacts discovered beneath the old courthouse has attracted"},"n":3,"stem":"The collection of artifacts discovered beneath the old courthouse has attracted considerable scholarly attention. Archaeologists from three universities have been collaborating on a comprehensive catalogue of the finds. Publication of their findings is expected within the next eighteen months.  Which choice maintains correct subject-verb agreement with a prepositional phrase between subject and verb?","why":"The subject is 'collection' (singular), not 'artifacts.' The prepositional phrase 'of artifacts' does not change the subject. 'Has attracted' (singular) is correct. B uses 'have attracted,' agreeing with the closer noun 'artifacts' — a proximity agreement error. C also uses 'have attracted.' D is grammatically awkward and separates 'of artifacts' incorrectly.","ans":"A","slug":"gri-mod-sat-g210-1-3"},{"n":4,"choices":{"D":"who was expected to use it to fund three new research positions","C":"that was expected to use it to fund three new research positions","B":"which was expected to use the grant to fund three new research positions","A":"which was expected to use it to fund three new research positions"},"ans":"B","why":"'It' could refer ambiguously to either 'grant' or 'institute.' B replaces 'it' with 'the grant,' eliminating ambiguity. A retains the ambiguity. C uses 'that' in a non-restrictive clause (after a comma) — 'that' cannot introduce non-restrictive clauses. D uses 'who' for an organization, which is typically reserved for people.","slug":"gri-mod-sat-g210-1-4","stem":"The foundation awarded the grant to the institute, which was expected to use it to fund three new research positions. Members of the board had debated for weeks about which organization was best positioned to expand research in the relevant field.  Which choice ensures the pronoun clearly refers to the institute rather than the grant?"},{"n":5,"choices":{"A":"Having spent two years collecting and analyzing data from four continents, the panel questioned her methodology.","B":"Having spent two years collecting and analyzing data from four continents, the researcher presented her findings to a panel of experts.","D":"Having spent two years on four continents, the panel of experts analyzed the researcher's data.","C":"The researcher, having collected and analyzed data from four continents in two years, the panel questioned her methodology."},"ans":"B","why":"'Having spent two years collecting data' modifies the researcher, not the panel. B correctly places 'the researcher' immediately after the participial phrase. A makes the panel the implied subject — a dangling modifier. C creates a double subject ('the researcher... the panel'). D makes the panel the modifier's subject, which is also incorrect.","stem":"The researcher presented her findings to a panel of experts, having spent two years collecting and analyzing data from four continents. The panel's questions focused primarily on methodology and sample size. Several members expressed interest in collaborating on a follow-up study.  Which choice ensures the participial modifier is correctly attached to its subject?","slug":"gri-mod-sat-g210-1-5"},{"choices":{"D":"to restructure three departments, renegotiating key supplier contracts, and reducing overhead costs","C":"the restructuring of three departments, renegotiating key supplier contracts, and reducing overhead costs","A":"restructuring three departments, renegotiating key supplier contracts, and reducing overhead costs","B":"restructuring three departments, renegotiating key supplier contracts, and the reduction of overhead costs"},"n":6,"stem":"The executive's plan involved restructuring three departments, renegotiating key supplier contracts, and the reduction of overhead costs by fifteen percent. Analysts predicted that the combined measures would restore profitability within two fiscal quarters.  Which choice corrects the parallel structure error in the list?","slug":"gri-mod-sat-g210-1-6","why":"The list must use parallel gerunds: restructuring, renegotiating, reducing. A uses a noun phrase ('the reduction') as the third item — not parallel. C and D mix different structures for the first item.","ans":"A"},{"choices":{"D":"the team would already submit three draft versions","C":"the team had already submitted three draft versions","A":"the team already submitted three draft versions","B":"the team has already submitted three draft versions"},"n":7,"why":"'By the time the report was finalized' requires past perfect to show an earlier completed action. B ('had already submitted') correctly uses past perfect. A uses simple past — does not convey the temporal priority. C uses present perfect — inconsistent with the past-tense frame. D uses 'would submit' — a conditional or future-in-past, which does not fit the completed timeline.","stem":"By the time the report was finalized, the team had already submitted three draft versions for internal review. Each draft had undergone significant revision in response to feedback from the senior editorial board. The final version required only minor formatting adjustments before publication.  Which choice uses the correct past perfect tense to establish sequence?","ans":"C","slug":"gri-mod-sat-g210-1-7"},{"why":"After a preposition, the object form 'whom' is required. 'With whom' correctly fronts the preposition in formal prose. B uses 'who' (subject form) after a preposition — incorrect. C uses 'that' and strands the preposition — acceptable informally but substandard in formal prose. D uses 'which' for people — incorrect.","slug":"gri-mod-sat-g210-1-8","stem":"The organization awarded grants to researchers with whom it had previously collaborated on funded projects. New applicants without prior collaboration history were considered only under exceptional circumstances. The selection committee defended this policy as a protection against untested research proposals.  Which choice correctly uses the object form of the relative pronoun after a preposition?","ans":"D","choices":{"C":"researchers which it had previously collaborated with on funded projects","D":"researchers with whom it had previously collaborated on funded projects","A":"researchers with who it had previously collaborated on funded projects","B":"researchers that it had previously collaborated with on funded projects"},"n":8},{"slug":"gri-mod-sat-g210-1-9","why":"'Despite' signals concession — extended debate did not produce resolution. B implies debate caused failure. C implies the same with 'so.' D creates a dangling modifier since 'no agreement' did not do the debating.","stem":"The committee debated the proposal for over two hours. No agreement was reached. The chair postponed the vote until the following session.  Which choice most effectively combines the first two sentences to show that effort did not produce resolution?","ans":"B","choices":{"A":"Because the committee debated the proposal for over two hours, no agreement was reached.","B":"Despite debating the proposal for over two hours, the committee reached no agreement.","D":"After debating the proposal for over two hours, no agreement was reached.","C":"The committee debated the proposal for over two hours, so no agreement was reached."},"n":9},{"n":10,"choices":{"A":"The study's sample size was deliberately limited to reduce confounding variables, a larger group would have introduced logistical challenges.","B":"The study's sample size was deliberately limited to reduce confounding variables: a larger group would have introduced logistical challenges.","D":"The study's sample size was deliberately limited to reduce confounding variables; a larger group would have introduced logistical challenges.","C":"The study's sample size was deliberately limited; to reduce confounding variables, a larger group would have introduced logistical challenges."},"ans":"D","why":"A comma alone cannot join two independent clauses (comma splice). B correctly uses a semicolon. C uses a colon — acceptable if the second clause explains the first, but here the relationship is parallel contrast rather than elaboration. D misplaces the semicolon after 'limited,' separating 'to reduce confounding variables' from its governing verb — the infinitive phrase modifies 'limited.'","slug":"gri-mod-sat-g210-1-10","stem":"The study's sample size was deliberately limited to reduce confounding variables. A larger group would have introduced logistical challenges that the research team was not equipped to manage within the given timeframe. Future replications may address this limitation with expanded resources.  Which choice correctly uses a semicolon to join two independent clauses?"},{"choices":{"D":"The lead investigator, who had spent fifteen years studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate.","C":"The lead investigator who had spent fifteen years, studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate.","A":"The lead investigator who had spent fifteen years studying the phenomenon believed that the existing theoretical models were fundamentally inadequate.","B":"The lead investigator, who had spent fifteen years studying the phenomenon believed that the existing theoretical models were fundamentally inadequate."},"n":11,"slug":"gri-mod-sat-g210-1-11","why":"'Who had spent fifteen years studying the phenomenon' adds supplementary information about a specific individual already identified — making it non-restrictive. It must be enclosed in commas. A omits both commas. B provides only the opening comma, leaving the clause unclosed. D places commas incorrectly around 'studying the phenomenon,' breaking the relative clause illogically.","stem":"The lead investigator, who had spent fifteen years studying the phenomenon, believed that the existing theoretical models were fundamentally inadequate. Her dissent was well documented in the academic literature. Newer models developed in the past decade have begun to support her position.  Which choice correctly punctuates a non-restrictive relative clause?","ans":"D"},{"ans":"A","why":"With 'neither...nor,' the verb agrees with the noun closest to it — 'department heads' (plural). 'Were' is therefore correct. A uses 'was' (singular), agreeing with the more distant noun. C uses present perfect, inconsistent with the past-tense context. D uses 'is,' which is singular and present.","slug":"gri-mod-sat-g210-1-12","stem":"Neither the chief executive nor the department heads were informed of the policy change before its public announcement. This breakdown in communication prompted immediate calls for an internal review. Several recommendations from that review were subsequently implemented.  Which choice uses correct subject-verb agreement with a 'neither...nor' construction?","n":12,"choices":{"A":"Neither the chief executive nor the department heads were informed of the policy change","B":"Neither the chief executive nor the department heads was informed of the policy change","D":"Neither the chief executive nor the department heads is informed of the policy change","C":"Neither the chief executive nor the department heads have been informed of the policy change"}},{"choices":{"D":"the country which they had been taken from it","C":"the country from which it had been taken","B":"the country from which the artifacts had been taken","A":"the country from which they had been taken"},"n":13,"slug":"gri-mod-sat-g210-1-13","why":"'They' could refer to either 'artifacts' or 'officials' — both plural nouns recently mentioned. B replaces 'they' with 'the artifacts,' eliminating ambiguity. A retains the ambiguity. C uses 'it,' which is singular and incorrect for plural 'artifacts.' D adds a double reference pronoun ('it').","stem":"The museum returned the artifacts to the country from which they had been taken. Officials from both institutions signed the repatriation agreement at a ceremony attended by cultural leaders from both nations. The event was widely covered by international media.  Which choice ensures 'they' refers clearly to 'artifacts' rather than 'officials'?","ans":"B"},{"n":14,"choices":{"A":"Presented with the evidence of climate change, urgent policy reform became the priority of the international summit.","B":"Presented with the evidence of climate change, the delegates made urgent policy reform the priority of the summit.","C":"Urgent policy reform, presented with the evidence of climate change, became the priority of the international summit.","D":"With climate change evidence being presented, urgent policy reform became the priority."},"ans":"B","why":"'Presented with the evidence' modifies whoever received the evidence — the delegates, not 'urgent policy reform.' B correctly places 'the delegates' as the subject immediately after the participial phrase. A makes 'policy reform' the implied subject — it cannot be 'presented with evidence.' C places the phrase mid-sentence, still modifying 'policy reform.' D uses a different construction that avoids the error but is weaker stylistically.","slug":"gri-mod-sat-g210-1-14","stem":"Presented with the evidence of climate change, urgent policy reform became the priority of the international summit. Delegates from forty nations convened to draft binding emissions commitments. The negotiations lasted three days beyond the original schedule.  Which choice corrects the dangling modifier error?"},{"slug":"gri-mod-sat-g210-1-15","ans":"B","why":"The list requires parallel gerunds: adding, revising, eliminating. A mixes gerund, infinitive, and noun phrase. C mixes infinitive and gerunds. D mixes noun phrases and a gerund. B maintains consistent gerund form throughout.","stem":"The proposed curriculum changes included adding a mandatory research methods course, to revise the grading rubrics for senior projects, and the elimination of two elective offerings. Faculty members were divided on whether the changes would improve academic outcomes.  Which choice corrects the parallel structure error?","n":15,"choices":{"A":"adding a mandatory research methods course, to revise the grading rubrics for senior projects, and the elimination of two elective offerings","B":"adding a mandatory research methods course, revising the grading rubrics for senior projects, and eliminating two elective offerings","D":"the addition of a mandatory research methods course, the revision of the grading rubrics, and eliminating two elective offerings","C":"to add a mandatory research methods course, revising the grading rubrics for senior projects, and eliminating two elective offerings"}},{"ans":"C","stem":"The negotiators proposed that all disputed territories be returned to their pre-conflict boundaries. This demand was rejected outright by the opposing delegation. Further talks were suspended for two weeks as both sides consulted with their respective governments.  Which choice correctly uses the subjunctive mood after a verb of demand?","slug":"gri-mod-sat-g210-1-16","why":"After verbs of demand, request, or proposal (propose, demand, insist, require), the subjunctive form 'be' is required — not 'are,' 'were,' or 'will be.' This is the mandative subjunctive. A uses indicative present. C uses simple past. D uses future indicative. Only B uses the base form 'be' — the correct subjunctive.","n":16,"choices":{"D":"proposed that all disputed territories will be returned to their pre-conflict boundaries","C":"proposed that all disputed territories be returned to their pre-conflict boundaries","A":"proposed that all disputed territories are returned to their pre-conflict boundaries","B":"proposed that all disputed territories were returned to their pre-conflict boundaries"}},{"ans":"D","why":"After a preposition ('for'), 'whom' is required. 'For whom' correctly fronts the preposition and uses the object form. B uses 'who' (subject form) after a preposition — incorrect. C uses 'which' for people — incorrect. D uses 'that' with a stranded preposition and adds a double reference pronoun ('them').","slug":"gri-mod-sat-g210-1-17","stem":"The fund was established to support artists for whom commercial galleries offered few opportunities. Its mandate was to prioritize experimental work that challenged conventional aesthetic boundaries. In its first decade, the fund supported over three hundred emerging artists.  Which choice correctly uses the object form of the relative pronoun after a preposition referring to people?","n":17,"choices":{"D":"artists for whom commercial galleries offered few opportunities","C":"artists that commercial galleries offered few opportunities for them","A":"artists for who commercial galleries offered few opportunities","B":"artists which commercial galleries offered few opportunities for"}},{"stem":"The biologist had catalogued over four hundred species in the region. Several species were previously unknown to science. Her findings attracted international media coverage.  Which choice most effectively combines the first two sentences using a partitive relative clause?","slug":"gri-mod-sat-g210-1-18","why":"A uses 'several of which' — a partitive relative clause — accurately representing that only some (not all) species were new. B replaces 'several' with 'all,' contradicting the original. C uses a semicolon with a fragment ('several of them previously unknown' has no verb). D coordinates the facts as equal clauses, losing the elegant subordination.","ans":"C","choices":{"D":"The biologist catalogued over four hundred species, and several species were previously unknown to science.","C":"The biologist catalogued over four hundred species in the region, several of which were previously unknown to science.","B":"The biologist catalogued over four hundred species in the region; several of them previously unknown to science.","A":"The biologist catalogued over four hundred species in the region, all of which were previously unknown to science."},"n":18},{"why":"D correctly uses a participial phrase ('launched two years earlier') as a modifier — no extra clause needed. A runs two sentences together without punctuation. B splits the information into two separate clauses — grammatically correct but unnecessarily wordy. C adds a comma before 'launched,' slightly separating the modifier from its noun — acceptable but less tight than D.","slug":"gri-mod-sat-g210-1-19","stem":"The foundation's annual report documented a thirty percent increase in grant applications from underrepresented communities. This growth was attributed to a targeted outreach campaign launched two years earlier. The board voted to expand the campaign in the following fiscal year.  Which choice correctly punctuates the underlined section?","ans":"A","choices":{"C":"This growth was attributed to a targeted outreach campaign; it had been launched two years earlier.","D":"This growth was attributed to a targeted outreach campaign, launched two years earlier.","A":"This growth was attributed to a targeted outreach campaign launched two years earlier.","B":"This growth was attributed to a targeted outreach campaign it had been launched two years earlier."},"n":19},{"stem":"The delegate from Brazil, a seasoned diplomat who had participated in three previous summits, delivered the opening address. Her speech focused primarily on climate finance and technology transfer. Both issues had been contentious in prior negotiations.  Which choice correctly uses commas around an appositive phrase?","why":"'A seasoned diplomat who had participated in three previous summits' is an appositive phrase renaming 'the delegate from Brazil' — it must be enclosed in commas. A omits both commas. B correctly encloses the full appositive. C places the closing comma after 'diplomat,' separating the relative clause ('who had participated') from the appositive it belongs to. D omits the closing comma.","ans":"A","choices":{"C":"The delegate from Brazil, a seasoned diplomat, who had participated in three previous summits delivered the opening address.","D":"The delegate from Brazil, a seasoned diplomat who had participated in three previous summits delivered the opening address.","A":"The delegate from Brazil, a seasoned diplomat who had participated in three previous summits, delivered the opening address.","B":"The delegate from Brazil a seasoned diplomat who had participated in three previous summits delivered the opening address."},"n":20,"slug":"gri-mod-sat-g210-1-20"},{"choices":{"A":"The number of students enrolled in advanced science courses has increased significantly","B":"The number of students enrolled in advanced science courses have increased significantly","C":"A number of students enrolled in advanced science courses has increased significantly","D":"The number of students enrolling in advanced science courses were increased significantly"},"n":21,"why":"'The number of' takes a singular verb — 'has.' 'A number of' takes a plural verb. A uses 'have' with 'the number,' which is incorrect. C uses 'a number of' with 'has' — the opposite error. D uses 'were increased,' which is passive and inconsistent with the context.","stem":"The number of students enrolled in advanced science courses has increased significantly over the past five years. Educators attribute this growth to targeted recruitment efforts and curricular reforms. Many districts have since adopted similar strategies.  Which choice correctly uses 'the number of' with a singular verb?","ans":"A","slug":"gri-mod-sat-g210-1-21"},{"why":"The pronoun refers to 'the mayor' (singular). B uses 'she,' which matches context (the pronoun 'she' is already established in the passage). A uses 'they,' which could refer to the city council — ambiguous and number-inconsistent with 'the mayor.' C uses 'it' — inappropriate for a person. D uses 'he or she' — unnecessarily wordy when 'she' is already established.","slug":"gri-mod-sat-g210-1-22","stem":"When the mayor presented the budget to the city council, she noted that the previous administration had left a significant deficit. Council members questioned whether the figures accurately reflected the current fiscal situation. A full audit was subsequently requested.  Which choice ensures pronoun-antecedent agreement in number?","ans":"A","choices":{"D":"When the mayor presented the budget to the city council, he or she noted that the previous administration had left a significant deficit.","C":"When the mayor presented the budget to the city council, it noted that the previous administration had left a significant deficit.","B":"When the mayor presented the budget to the city council, they noted that the previous administration had left a significant deficit.","A":"When the mayor presented the budget to the city council, she noted that the previous administration had left a significant deficit."},"n":22},{"ans":"D","why":"'Located at the southern edge of the campus' describes the library. B correctly places 'the newly constructed library' immediately after the phrase. A makes 'students' the implied subject of 'located' — dangling modifier. C creates a double subject ('the library... students use it'). D is grammatically acceptable but positions the modifier after the sentence — the SAT convention prefers the fronted modifier to directly precede its subject.","slug":"gri-mod-sat-g210-1-23","stem":"Located at the southern edge of the campus, the newly constructed library serves students from all four colleges within the university. Its collection includes over two million volumes, and it provides access to more than forty online research databases.  Which choice correctly attaches the participial modifier to the noun it describes?","n":23,"choices":{"D":"Located at the southern edge of the campus, the newly constructed library serves students from all four colleges.","C":"Students from all four colleges use the newly constructed library, located at the southern edge of the campus.","B":"The newly constructed library, located at the southern edge of the campus, students from all four colleges use it.","A":"Located at the southern edge of the campus, students from all four colleges use the newly constructed library."}},{"choices":{"C":"to develop students' research skills, improve their professional communication, and broaden their exposure to industry practices","D":"to develop students' research skills, to improve their professional communication, and broaden their exposure to industry practices","B":"to develop students' research skills, improving their professional communication, and broaden their exposure to industry practices","A":"to develop students' research skills, improve their professional communication, and their exposure to industry practices would be broadened"},"n":24,"stem":"The internship program was designed to develop students' research skills, improve their professional communication, and their exposure to industry practices would be broadened by the experience. Mentors from partner organizations guided participants throughout the twelve-week placement.  Which choice corrects the parallel structure error in the list?","why":"The list follows 'to develop' — all items must be parallel infinitive base forms: develop, improve, broaden. D correctly uses all three base forms (after the governing 'to'). A uses a full clause for the third item. B uses a gerund ('improving') for the second. C repeats 'to' for the second item but drops it for the third — mixing forms unnecessarily.","ans":"C","slug":"gri-mod-sat-g210-1-24"},{"slug":"gri-mod-sat-g210-1-25","why":"'Insist that' triggers the mandative subjunctive, requiring the base form 'be.' B correctly uses 'be reviewed.' A uses 'was reviewed' — simple past indicative, not subjunctive. C uses 'is reviewed' — present indicative. D uses 'would be reviewed' — conditional, not subjunctive. The pattern 'insist/demand/require/propose + that + [subject] + base verb' is the defining subjunctive construction.","stem":"The engineers insisted that the structural report be reviewed by an independent consultant before any construction permits were issued. The project manager acknowledged the request and forwarded the report immediately. Both parties agreed that transparency was essential to maintaining public trust.  Which choice correctly uses the subjunctive after a verb of insistence?","ans":"D","choices":{"B":"The engineers insisted that the structural report is reviewed by an independent consultant","A":"The engineers insisted that the structural report was reviewed by an independent consultant","D":"The engineers insisted that the structural report be reviewed by an independent consultant","C":"The engineers insisted that the structural report would be reviewed by an independent consultant"},"n":25}],"t":"mcqquiz"}],"name":"Mixed Grammar Review II","group":"Dilbilgisi"},{"eyebrow":"Gramer","id":"g31","group":"Dilbilgisi","name":"Apostrophes & Possessives","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Apostrophes & Possessives. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"choices":{"B":"its","A":"its'","D":"its's","C":"it's"},"n":1,"slug":"gri-mod-sat-g31-1-1","why":"B doğrudur. 'Its' (kesme işareti olmadan) iyelik zamiridir. 'It's' = 'it is' anlamına gelir. 'Its'' diye bir form yoktur. İyelik zamirleri (its, his, hers, ours, theirs) asla kesme işareti almaz.  A — 'its'' standart bir İngilizce form değildir.  C — 'it's' = 'it is' demektir; cümle anlamsız olur.  D — 'its's' İngilizce'de bulunmaz.","stem":"The company updated its' privacy policy following the data breach.  Which choice corrects the underlined portion?","ans":"B"},{"choices":{"C":"there","D":"their","A":"theirs","B":"their's"},"n":2,"why":"D doğrudur. 'Their' iyelik sıfatıdır ve 'findings' ismini niteler. 'Theirs' bağımsız kullanılan iyelik zamiridir (isimden önce gelmez). 'Their's' diye bir sözcük yoktur.  A — 'theirs' isimden önce gelemez.  B — 'their's' gerçek bir sözcük değildir.  C — 'there' zarftır, iyelik değildir.","stem":"The researchers published theirs findings in a peer-reviewed journal last spring.  Which choice corrects the underlined portion?","ans":"D","slug":"gri-mod-sat-g31-1-2"},{"n":3,"choices":{"A":"their's","B":"their","D":"theirs","C":"theirs'"},"ans":"B","why":"B doğrudur. 'Their' iyelik sıfatıdır ve 'office' isminden önce gelir. 'Theirs' bağımsız zamirdir ('the office is theirs') ve doğrudan isimden önce kullanılamaz.  A — 'their's' yoktur.  C — 'theirs'' yoktur.  D — 'theirs' doğrudan isim niteler olarak kullanılamaz.","stem":"The two professors shared their's office during the renovation.  Which choice is correct?","slug":"gri-mod-sat-g31-1-3"},{"stem":"Whose report was submitted after the deadline, and who was responsible for the delay?  Which choice is correct?","why":"C doğrudur. 'Whose' iyelik ilgi zamiridir; 'report' ismini niteler. 'Who's' = 'who is' kısaltmasıdır, isim niтеleyемez.  A — 'who's' = 'who is'; 'who is report' anlamsızdır.  B — 'whos' bir sözcük değildir.  D — 'whos'' bir sözcük değildir.","slug":"gri-mod-sat-g31-1-4","ans":"C","choices":{"C":"Whose","D":"Whos'","A":"Who's","B":"Whos"},"n":4},{"ans":"A","why":"A doğrudur. 'Who's' = 'who is'; cümle 'who is responsible?' sorusunu soruyor. Burada kısaltma gereklidir, 'whose' değil.  B — 'whose' bir isim gerektirir: 'whose responsibility.'  C — 'whos'' bir sözcük değildir.  D — 'who is'' standart değildir.","slug":"gri-mod-sat-g31-1-5","stem":"Who's responsible for submitting the quarterly reports to the oversight committee?  Which choice is correct?","n":5,"choices":{"A":"Who's","B":"Whose","D":"Who is'","C":"Whos'"}},{"stem":"The committee reviewed all of the department head's proposals before voting.  Which choice is correct?","slug":"gri-mod-sat-g31-1-6","why":"B doğrudur. Tek bir department head var; tekil iyelik: 'head's' (s'den önce kesme işareti).  A — 'heads'' birden fazla department head'in tekliflerini ima eder.  C — 'heads' çoğul isimdir, iyelik değil.  D — 'head'' standart noktalama değildir.","ans":"B","choices":{"A":"heads'","B":"head's","C":"heads","D":"head'"},"n":6},{"choices":{"A":"head's","B":"heads","C":"heads'","D":"head's'"},"n":7,"slug":"gri-mod-sat-g31-1-7","why":"C doğrudur. Üç department head var (çoğul). -s ile biten düzenli çoğullarda iyelik için yalnızca s'den sonra kesme işareti eklenir: 'heads'.  A — 'head's' tekil iyeliktir.  B — 'heads' çoğuldur ama iyelik değil.  D — 'head's'' yoktur.","stem":"The three department head's proposals were all rejected by the board.  Which choice is correct?","ans":"C"},{"stem":"The childrens' museum features interactive exhibits on local history.  Which choice is correct?","slug":"gri-mod-sat-g31-1-8","why":"C doğrudur. 'Children' düzensiz çoğuldur (-s almaz). Düzensiz çoğullarda iyelik: kesme işareti + s → 'children's.'  A — 'childrens'' sözcüğü düzenli çoğul olarak yanlış ele alır.  B — 'childrens' bir sözcük değildir.  D — 'children'' standart değildir.","ans":"C","choices":{"B":"childrens","A":"childrens'","C":"children's","D":"children'"},"n":8},{"ans":"A","why":"A doğrudur. Tek bir şirket var; tekil iyelik: 'company's.'  B — 'companies'' birden fazla şirketin çoğul iyeliğidir.  C — 'companys'' standart bir form değildir.  D — 'companys' yanlış yazımla çoğuldur.","slug":"gri-mod-sat-g31-1-9","stem":"The company's board of directors voted unanimously to approve the merger.  Which choice is correct?","n":9,"choices":{"D":"companys","C":"companys'","B":"companies'","A":"company's"}},{"n":10,"choices":{"C":"companies","D":"companys'","A":"company's","B":"companies'"},"ans":"B","stem":"Several companies' financial disclosures were flagged for inconsistencies by the auditors.  Which choice is correct?","why":"B doğrudur. Birden fazla şirket (çoğul) bildirim sahibi. -s ile biten çoğulda iyelik: s'den sonra yalnızca kesme işareti.  A — 'company's' tekildir.  C — 'companies' çoğuldur ama iyelik değil.  D — 'companys'' standart form değildir.","slug":"gri-mod-sat-g31-1-10"},{"n":11,"choices":{"A":"witness's","B":"witness'","C":"witnesses'","D":"witnesse's"},"ans":"A","stem":"The witness's testimony contradicted the evidence presented by the prosecution.  Which choice is correct?","why":"A doğrudur. Modern stil (ve SAT kuralı) -s ile biten tekil isimlere kesme işareti + s ekler: 'witness's.'  B — 'witness'' eski formdur; SAT 'witness's' tercih eder.  C — 'witnesses'' birden fazla tanığı ima eder.  D — 'witnesse's' bir sözcük değildir.","slug":"gri-mod-sat-g31-1-11"},{"ans":"D","stem":"The policy requires that one's credentials be verified before accessing the secure database.  Which choice is correct?","why":"D doğrudur. 'One's' belirsiz zamiri 'one'ın iyeliğidir ve 'credentials' ismini niteler.  A — 'ones'' çoğul 'ones'ın iyeliği olurdu.  B — 'ones' çoğul isimdir, iyelik değil.  C — 'one is' farklı cümle yapısı gerektirir.","slug":"gri-mod-sat-g31-1-12","n":12,"choices":{"A":"ones'","B":"ones","C":"one is","D":"one's"}},{"n":13,"choices":{"C":"employees'","D":"employees's","A":"employees","B":"employee's"},"ans":"C","stem":"The new policy affects all of the employees benefits and retirement contributions.  Which choice is correct?","slug":"gri-mod-sat-g31-1-13","why":"C doğrudur. Tüm çalışanlar (çoğul) bu hakların sahibi. 'employees'' — s'den sonra yalnızca kesme işareti.  A — 'employees' çoğuldur ama iyelik değil.  B — 'employee's' tekil iyeliktir.  D — 'employees's' standart değildir."},{"slug":"gri-mod-sat-g31-1-14","ans":"D","why":"D doğrudur. 'Men' düzensiz çoğuldur (-s almaz). Düzensiz çoğullarda iyelik: kesme işareti + s → 'men's.'  A — 'mens'' hatalı: 'men' düzensiz çoğuldur.  B — 'mens' bir sözcük değildir.  C — 'men'' standart değildir.","stem":"The mens' locker room was closed for renovations throughout the month of February.  Which choice is correct?","n":14,"choices":{"A":"mens'","B":"mens","C":"men'","D":"men's"}},{"slug":"gri-mod-sat-g31-1-15","n":15,"choices":{"C":"Jameses'","D":"James'es","B":"James's","A":"James'"},"ans":"B","why":"B doğrudur. -s ile biten özel isimler için SAT kuralı: kesme işareti + s → 'James's.'  A — 'James'' eski kuraldır; SAT 'James's' tercih eder.  C — 'Jameses'' ismi gereksiz yere çoğullaştırır.  D — 'James'es' standart bir form değildir.","stem":"The professor argued that James's theory of pragmatism was more nuanced than his critics acknowledged.  Which choice is correct?"},{"choices":{"A":"its","B":"it's","C":"its'","D":"No change"},"n":16,"slug":"gri-mod-sat-g31-1-16","why":"A doğrudur. 'Its' iyelik zamiridir — kurulun tüzüğü ('its charter'). 'It's' = 'it is' demektir; burada anlamsız olur.  B — 'it's' = 'it is'; 'the board reviewed it is charter' yanlıştır.  C — 'its'' yoktur.  D — Değişiklik yapılmasa hata kalır.","stem":"The board reviewed it's charter to determine whether the proposed amendment was permissible.  Which choice is correct?","ans":"A"},{"n":17,"choices":{"C":"their","D":"there","B":"theirs","A":"their's"},"ans":"C","why":"C doğrudur. 'Their' iyelik sıfatıdır ve 'role' ismini niteler. 'Theirs' bağımsız zamirdir, isimden önce kullanılamaz.  A — 'their's' yoktur.  B — 'theirs' doğrudan isim niтеleyемez.  D — 'there' iyelik değildir.","stem":"Neither of the candidates acknowledged their's role in the breakdown of negotiations.  Which choice is correct?","slug":"gri-mod-sat-g31-1-17"},{"slug":"gri-mod-sat-g31-1-18","n":18,"choices":{"A":"firms","B":"firms'","D":"firm's","C":"firm'"},"ans":"D","stem":"The firm's approach to client confidentiality has been praised by industry regulators.  Which choice is correct?","why":"D doğrudur. Tek bir firma var; tekil iyelik: 'firm's.'  A — 'firms' çoğuldur, iyelik değil.  B — 'firms'' birden fazla firmanın çoğul iyeliğidir.  C — 'firm'' standart değildir."},{"n":19,"choices":{"B":"attorneys","A":"attorney's","C":"attorneys'","D":"attorneys's"},"ans":"C","slug":"gri-mod-sat-g31-1-19","why":"C doğrudur. Birden fazla avukat var; -s ile biten çoğulda iyelik: s'den sonra kesme işareti.  A — 'attorney's' tekil iyeliktir.  B — 'attorneys' çoğuldur ama iyelik değil.  D — 'attorneys's' standart değildir.","stem":"The attorneys' arguments were compelling, but the jury ultimately sided with the defense.  Which choice is correct?"},{"why":"A doğrudur. 'Its' iyelik zamiridir — ülkenin ticaret anlaşmaları. 'It's' = 'it is' olur, anlamsızlaşır.  B — 'it's' = 'it is'; dilbilgisel olarak yanlış.  C — 'its'' yoktur.  D — Değişiklik yapılmasa hata kalır.","slug":"gri-mod-sat-g31-1-20","stem":"The president announced that the country would reassess it's trade agreements with three major partners.  Which choice is correct?","ans":"A","choices":{"D":"No change","C":"its'","A":"its","B":"it's"},"n":20},{"n":21,"choices":{"A":"Yours'","B":"Your's","C":"Yors","D":"Yours"},"ans":"D","stem":"Yours' is the only application that meets all of the listed requirements.  Which choice is correct?","slug":"gri-mod-sat-g31-1-21","why":"D doğrudur. 'Yours' bağımsız iyelik zamiridir. İyelik zamirleri (yours, hers, his, ours, theirs) asla kesme işareti almaz.  A — 'yours'' gereksiz kesme işareti.  B — 'your's' bir sözcük değildir.  C — 'yors' yanlış yazım."},{"slug":"gri-mod-sat-g31-1-22","ans":"D","stem":"The two scientists published theirs findings in the same journal on the same day.  Which choice is correct?","why":"D doğrudur. 'Their' iyelik sıfatıdır ve 'findings' ismini niteler. 'Theirs' bağımsız zamirdir, isimden önce kullanılamaz.  A — 'theirs' doğrudan isim niтеleyемez.  B — 'their's' yoktur.  C — 'there' iyelik sıfatı değildir.","n":22,"choices":{"A":"theirs","B":"their's","C":"there","D":"their"}},{"ans":"B","why":"B doğrudur. Tek bir enstitü var; tekil iyelik: 'institute's.'  A — 'institutes' çoğuldur, iyelik değil.  C — 'institutes'' birden fazla enstitünün çoğul iyeliğidir.  D — 'institute'' standart değildir.","slug":"gri-mod-sat-g31-1-23","stem":"The grant proposal outlined the institute's long-term research priorities for the next decade.  Which choice is correct?","n":23,"choices":{"B":"institute's","A":"institutes","C":"institutes'","D":"institute'"}},{"n":24,"choices":{"C":"its'","D":"No change needed","A":"it's","B":"its"},"ans":"A","stem":"The it's difficult to overstate the importance of regular exercise for long-term health.  Which choice is correct?","why":"A doğrudur. 'It's' = 'it is'; cümle 'it is difficult to overstate...' demek istiyor. Bu kullanım doğrudur.  B — 'its' iyelik zamiridir; ardından isim gelmeden kullanılamaz.  C — 'its'' yoktur.  D — 'it's' zaten doğru kullanılmış; 'No change' da kabul edilebilir.","slug":"gri-mod-sat-g31-1-24"},{"slug":"gri-mod-sat-g31-1-25","choices":{"A":"It's … their","B":"Its … their","C":"It's … there","D":"Its … they're"},"n":25,"stem":"It's too early to determine whether the new regulations will achieve their intended effect.  Which choice correctly uses both underlined words?","why":"A doğrudur. 'It's' = 'it is' (doğru). 'Their' = 'effect' ismini niteleyen iyelik sıfatı (doğru).  B — 'Its' iyelik zamiridir; burada 'i
