to an interdependent community.","lesson":3,"id":"u1-l3-f1-03","target_family":"Çok dar","choices":{"A":"Fungi are among the most widespread organisms on Earth, thriving in soil, water, and air across virtually every habitat from the deep oceans to the highest mountains and shaping ecosystems the world over.","D":"Because trees can rely on fungal networks, they no longer compete with one another.","C":"Rather than acting alone, forest fungi connect trees into an interdependent network through which resources and signals pass.","B":"Older trees can send resources to struggling seedlings through fungal threads."},"stem":"Which choice best states the main idea of the text?","why_correct":"The passage overturns the image of solitary fungi, showing they knit trees into an interdependent community. Choice A captures that central point.","choice_families":{"B":"Çok dar","A":"Çok geniş","D":"Ters ilişki"},"why_wrong":{"B":"The transfer from old trees to seedlings is one example, a detail too narrow to be the main idea.","A":"The general prevalence of fungi across the planet is far broader than the passage's specific point that forest fungi link trees into an interdependent network.","D":"The passage never claims the network ends competition; this overstates and reverses the point."},"lesson_name":"Central Ideas and Details"},{"why_wrong":{"B":"The short-lived early filaments are one detail in the long relay of contributors, too narrow to be the passage's main idea.","C":"A sweeping claim about all invention across history is far broader than this passage's specific argument about the light bulb.","A":"The passage says the contributions made the bulb practical, not that none did; this reverses the point."},"choice_families":{"B":"Çok dar","C":"Çok geniş","A":"Ters ilişki"},"why_correct":"The passage argues the bulb accumulated from many partial solutions rather than one invention. Choice A states that central point.","lesson_name":"Central Ideas and Details","id":"u1-l3-f1-04","lesson":3,"passage":"It is tempting to credit a single inventor with the light bulb, but the device emerged from a long relay of contributors. Earlier experimenters produced glowing filaments that burned out in minutes; later ones found longer-lasting materials; still others devised the vacuum and power systems that made bulbs practical. The familiar bulb was less a sudden invention than a slow accumulation of partial solutions.","correct":"D","unit":1,"choices":{"D":"The light bulb was not the work of one inventor but the product of many contributors solving different pieces of the problem over time.","A":"Because so many people contributed, no single design of the bulb ever proved practical.","C":"Invention has always depended on the sharing of ideas among many people, with each generation building on the discoveries, the failures, and the half-finished efforts of those who worked on a problem before them.","B":"The earliest experimental filaments glowed only briefly before burning out within minutes of being lit, forcing experimenters to test one short-lived material after another in a long search for something that would last."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok dar"},{"choice_families":{"C":"Çok geniş","B":"Çok dar","D":"Ters ilişki"},"why_wrong":{"D":"The passage says the master designed the work; this denies his role and reverses the point.","C":"The broad impact of imaging on art scholarship is far wider than this passage's specific point that the painting was a workshop production designed by the master.","B":"The few master-finished passages are one detail, too narrow to be the main idea."},"why_correct":"The passage reframes the work as a workshop production designed by the master but executed by assistants. Choice A captures that conclusion.","lesson_name":"Central Ideas and Details","lesson":3,"id":"u1-l3-f1-05","unit":1,"correct":"A","passage":"A painting long attributed to a famous master had puzzled experts with its uneven quality. New imaging beneath the surface resolved the puzzle: the composition was sketched by the master but largely filled in by assistants, with only a few passages finished by his own hand. The work, then, is best understood not as a solo masterpiece but as a workshop production bearing the master's design.","choices":{"A":"Imaging reveals that the painting was designed by the master but executed mostly by assistants, making it a workshop production rather than a solo work.","D":"Because assistants did most of the work, the master had no role in the painting's design.","B":"Only a few passages of the painting were finished by the master himself.","C":"Modern imaging has transformed the study of historical paintings, letting scholars peer beneath the visible surface to trace underdrawings, revisions, and hidden layers that the naked eye alone could never have detected."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok dar"},{"id":"u1-l3-f1-06","why_wrong":{"D":"The passage links creativity to boredom, not to constant stimulation; this reverses the relationship.","A":"The study result is the evidence for the idea, a detail too narrow to be the main idea itself.","C":"A general statement about psychology's surprises is broader than this passage's argument."},"choice_families":{"C":"Çok geniş","A":"Çok dar","D":"Ters ilişki"},"lesson":3,"passage":"Conventional wisdom treats boredom as simply an absence of stimulation to be escaped. Some psychologists now argue otherwise. In studies, people prevented from filling every idle moment later showed more original thinking, as though a restless, unfilled mind had drifted into unexpected connections. Boredom, on this view, is not merely empty time but a state that can prime the mind for invention.","correct":"B","why_correct":"The passage revises the view of boredom as mere emptiness, proposing it can spur invention. Choice A states that central point.","unit":1,"choices":{"A":"People kept from filling idle moments later showed more original thinking.","D":"Because boredom fosters creativity, constant stimulation reliably makes people more inventive.","C":"Psychology has produced many surprising findings about the human mind.","B":"Rather than being merely empty time to escape, boredom may prime the mind for original thinking."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok dar","lesson_name":"Central Ideas and Details"},{"correct":"C","unit":1,"passage":"Historians once described the medieval guild mainly as a body that fixed prices. That role was real, but narrow. Guilds also trained apprentices, guaranteed the quality of goods, supported members who fell ill, and represented their trades to city governments. Seen whole, the guild was less a price-fixing cartel than a broad institution woven through the economic and civic life of the town.","lesson":3,"id":"u1-l3-f1-07","target_family":"Çok dar","stem":"Which choice best states the main idea of the text?","choices":{"B":"Guilds supported members who were unable to work because of illness.","C":"The medieval guild was not merely a price-fixing body but a broad institution central to a town's economic and civic life.","A":"Medieval towns were governed by a complex web of overlapping institutions, from councils and courts to guilds and religious bodies, each claiming its own authority over some corner of everyday urban life.","D":"Because guilds did so much beyond fixing prices, they had little influence over prices at all."},"why_correct":"The passage widens the guild from a price-fixer to a broad civic and economic institution. Choice A captures that central revision.","choice_families":{"B":"Çok dar","D":"Ters ilişki","A":"Çok geniş"},"why_wrong":{"D":"The passage affirms guilds fixed prices; this denies it and reverses the point.","A":"A general claim about the web of institutions governing medieval towns is broader than this passage's specific focus on what the guild was.","B":"Support for ill members is one of several functions, a detail too narrow to be the main idea."},"lesson_name":"Central Ideas and Details"},{"lesson_name":"Central Ideas and Details","why_correct":"The passage argues the potato mattered for its wartime resilience, not calories alone. Choice A states that central point.","choice_families":{"C":"Çok geniş","B":"Çok dar","A":"Ters ilişki"},"why_wrong":{"A":"The passage never says potatoes reduced warfare; this invents and reverses a relationship.","C":"A broad statement about war and agriculture across Europe is wider than this passage's specific argument about the potato's wartime resilience.","B":"That potatoes grow underground is the reason behind the passage's claim, a supporting detail too narrow to be the main idea."},"target_family":"Çok dar","choices":{"A":"Because potatoes yielded so many calories, European wars became less frequent.","D":"The potato's importance to Europe lay not only in its calories but in its resilience, since it survived the ravages of war that destroyed grain.","B":"Potatoes grow underground on the roots of the plant, unlike grain, which ripens in the open air on tall stalks above the soil where it stands exposed to whatever passes through the fields.","C":"Warfare has repeatedly shaped the agricultural history of Europe, determining which crops farmers dared to plant and which fields could be worked at all during the long centuries of recurring conflict."},"stem":"Which choice best states the main idea of the text?","unit":1,"correct":"D","passage":"A popular account holds that the potato transformed Europe simply by providing more calories. The truth is subtler. Because potatoes grew underground, they survived the trampling and burning that ruined grain fields during wars, giving populations a food supply that armies could not easily destroy. The crop's real advantage lay not only in yield but in its resilience amid conflict.","lesson":3,"id":"u1-l3-f1-08"},{"id":"u1-l3-f1-09","lesson":3,"passage":"The tuatara, a reptile of New Zealand, is often called a living fossil, as though it had stopped evolving. Genetic study undercuts the label. Although its body plan has changed little, its DNA has accumulated mutations faster than that of many mammals. The tuatara has not stood still in time; it has simply changed in ways the skeleton does not reveal.","correct":"A","unit":1,"stem":"Which choice best states the main idea of the text?","choices":{"B":"The tuatara's DNA has accumulated mutations faster than that of many mammals.","C":"New Zealand is home to many unusual and ancient animal species.","A":"Despite its 'living fossil' label, the tuatara has continued to evolve, changing genetically even as its body plan stayed similar.","D":"Because the tuatara's body has changed so little over the ages, its DNA too must have stayed almost unchanged, marking it as a creature that evolution has genuinely left behind in time."},"target_family":"Çok dar","why_wrong":{"D":"The passage says the tuatara's DNA changed despite its stable body; this claims the DNA stayed unchanged, reversing that contrast.","B":"The fast mutation rate is the evidence, a detail too narrow to be the whole main idea.","C":"A general remark about New Zealand's fauna is broader than this passage's focus."},"choice_families":{"D":"Ters ilişki","C":"Çok geniş","B":"Çok dar"},"why_correct":"The passage rejects the 'living fossil' label, showing the tuatara evolves genetically despite a stable body. Choice A captures that point.","lesson_name":"Central Ideas and Details"},{"lesson_name":"Central Ideas and Details","why_correct":"The passage argues the seemingly empty desert rests on a living microbial crust. Choice A states that central point.","why_wrong":{"C":"The global extent of deserts is broader than this passage's specific argument.","D":"The passage says the fragile crust is essential; this denies its role and reverses the point.","A":"Holding down the sand is one of several functions of the crust, a detail too narrow to stand as the passage's main idea."},"choice_families":{"C":"Çok geniş","D":"Ters ilişki","A":"Çok dar"},"target_family":"Çok dar","choices":{"D":"Because the desert crust is so fragile, the microbes within it play no lasting role.","A":"The living desert crust helps keep the loose sand from blowing away in the wind, binding the surface grains together into a fragile skin that holds its shape until something disturbs it.","C":"Deserts cover a large fraction of the Earth's land surface.","B":"Far from lifeless, many deserts depend on a fragile living crust of microorganisms that stabilizes and sustains the surface."},"stem":"Which choice best states the main idea of the text?","passage":"We tend to picture deserts as lifeless, but many are shaped by life at its smallest. Across vast dry expanses, a fragile crust of microbes, algae, and lichens binds the surface, holding moisture, fixing nitrogen, and keeping the sand from blowing away. Disturb this living skin and the desert loses its footing. The apparent emptiness rests on an unseen biological scaffolding.","correct":"B","unit":1,"id":"u1-l3-f1-10","lesson":3},{"lesson_name":"Central Ideas and Details","why_correct":"The passage ties the turn to everyday subjects to the tastes of a new merchant class. Choice A states that specific main idea.","why_wrong":{"D":"The passage never says religious subjects were entirely abandoned; this overstates and reverses the point.","A":"A sweeping claim about all art and society is far broader than this passage's specific case.","C":"The milkmaid is one example, a detail too narrow to be the main idea."},"choice_families":{"C":"Çok dar","D":"Ters ilişki","A":"Çok geniş"},"target_family":"Çok geniş","choices":{"D":"Because merchants preferred everyday scenes, Dutch painters abandoned religious subjects entirely.","A":"Art has always mirrored the values of the society that produces it.","C":"A maid pouring milk was one of the everyday subjects Dutch painters favored.","B":"Dutch painters' turn to everyday subjects in the 1600s reflected the tastes of a rising merchant class that bought art for the home."},"stem":"Which choice best states the main idea of the text?","passage":"In the 1600s, Dutch painters turned increasingly to everyday subjects: a maid pouring milk, a table of fruit, a quiet courtyard. This shift accompanied the rise of a merchant middle class that bought art for its homes rather than for churches or palaces. The ordinary scenes reflected, and appealed to, the tastes of these new patrons.","unit":1,"correct":"B","id":"u1-l3-f2-01","lesson":3},{"lesson_name":"Central Ideas and Details","why_correct":"The passage's point is that crows learn the technique socially, not by instinct. Choice A states it precisely.","why_wrong":{"A":"The crosswalk detail is one part of the technique, too narrow to be the main idea.","D":"The passage attributes the behavior to learning, not instinct; this reverses its central claim.","B":"A broad claim about animal intelligence in general is far wider than this passage's specific finding about how crows learn to crack nuts."},"choice_families":{"D":"Ters ilişki","A":"Çok dar","B":"Çok geniş"},"target_family":"Çok geniş","stem":"Which choice best states the main idea of the text?","choices":{"D":"Because the behavior is instinctive, young crows perform it without needing to watch others.","A":"Crows drop hard-shelled nuts onto crosswalks for cars to crack.","C":"Urban crows appear to learn a nut-cracking technique by observing others, indicating the behavior spreads through learning rather than instinct.","B":"Animals are far more intelligent than people have traditionally believed, solving problems, using tools, and passing learned habits from one generation to the next in ways once thought to belong to humans alone."},"passage":"A study of urban crows found that individuals learned to drop hard-shelled nuts onto crosswalks, wait for passing cars to crack them, and retrieve the exposed kernels when the traffic light stopped the cars. Younger crows appeared to acquire the trick by watching older ones, suggesting the behavior spread through observation rather than instinct.","correct":"C","unit":1,"id":"u1-l3-f2-02","lesson":3},{"why_correct":"The passage argues a concrete disaster overcame resistance that abstract warnings could not. Choice A states that specific point.","choice_families":{"C":"Çok dar","B":"Çok geniş","A":"Ters ilişki"},"why_wrong":{"A":"The passage says support for filtration grew; this claims none was adopted, reversing the outcome.","B":"A sweeping claim about public health across history is far broader than this single episode of a local outbreak winning support for filtration.","C":"The single well is one detail of the outbreak, too narrow to be the main idea."},"lesson_name":"Central Ideas and Details","unit":1,"correct":"D","passage":"When a nineteenth-century engineer proposed filtering a city's drinking water, officials resisted the cost. Then a cholera outbreak traced to a single contaminated well made the danger vivid, and support for filtration grew rapidly. The episode shows how a concrete, local disaster could overcome resistance that abstract warnings had failed to move.","lesson":3,"id":"u1-l3-f2-03","target_family":"Çok geniş","stem":"Which choice best states the main idea of the text?","choices":{"D":"A vivid local outbreak succeeded in winning support for water filtration where abstract warnings about risk had failed.","A":"Because officials feared the cost, no water filtration was ever adopted in the city.","C":"The cholera outbreak was traced to a single contaminated well.","B":"Public health measures have saved countless lives over the course of history, from clean water and sanitation to the vaccination campaigns that turned back diseases which once swept through entire populations."}},{"target_family":"Çok geniş","stem":"Which choice best states the main idea of the text?","choices":{"A":"Residue showing the shipwreck's jars held fish sauce rather than wine suggests the region's trade was more varied than assumed.","D":"Because the jars held fish sauce, the region did not trade in wine at all.","B":"Trade has connected distant regions throughout human history, carrying goods, people, and ideas along the routes that linked far-flung societies together long before the era of the shipwreck studied here.","C":"The jars in the shipwreck were of a type known as amphorae."},"unit":1,"correct":"A","passage":"A team studying an ancient shipwreck expected its cargo of amphorae to hold wine, the common trade good of the era. Chemical residue told a different story: the jars had carried fish sauce, a prized condiment. The find suggests that the region's trade was more varied than the usual focus on wine and grain had implied.","lesson":3,"id":"u1-l3-f2-04","lesson_name":"Central Ideas and Details","why_correct":"The passage's point is that the fish-sauce find implies more varied trade than the wine-and-grain focus suggested. Choice A states it.","choice_families":{"D":"Ters ilişki","C":"Çok dar","B":"Çok geniş"},"why_wrong":{"D":"The passage never says the region traded no wine; this overstates and reverses the point.","B":"A broad claim about trade across all of history far exceeds this passage's specific finding that the region's trade was more varied than assumed.","C":"That the jars were amphorae is a detail too narrow to be the main idea."}},{"lesson":3,"id":"u1-l3-f2-05","correct":"B","unit":1,"passage":"Observing that a coral species survived a marine heat wave that killed its neighbors, researchers found that its tissues harbored an unusually heat-tolerant strain of symbiotic algae. The result hints that a coral's fate in warming seas may depend less on the coral itself than on the particular algae it happens to host.","stem":"Which choice best states the main idea of the text?","choices":{"C":"The heat wave killed corals neighboring the surviving species.","B":"A coral's survival in warming seas may hinge on the heat tolerance of the specific algae it hosts rather than on the coral alone.","A":"Climate change threatens ecosystems across the entire planet, warming the oceans, shifting the seasons, and pushing countless species toward the edges of the ranges in which they evolved and long thrived.","D":"Because the algae are heat-tolerant, the coral species faces no risk from warming seas."},"target_family":"Çok geniş","choice_families":{"C":"Çok dar","A":"Çok geniş","D":"Ters ilişki"},"why_wrong":{"A":"A planet-wide claim about climate change is far broader than this passage's specific finding about a coral's survival and the algae it hosts.","D":"The passage says the coral may depend on its algae, not that it faces no risk; this overstates the point.","C":"The death of neighboring corals is a detail too narrow to be the main idea."},"why_correct":"The passage's point is that survival may depend on the hosted algae's heat tolerance. Choice A states it precisely.","lesson_name":"Central Ideas and Details"},{"choices":{"A":"The word for 'wheel' descended from a single ancient root.","D":"Because the languages share a word for 'wheel,' they must have invented the wheel separately.","B":"Languages change continually over the course of centuries.","C":"A shared inherited word for 'wheel' helps date the languages' common ancestor to the era when the wheel appeared."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok geniş","id":"u1-l3-f2-06","lesson":3,"passage":"A linguist tracking a word for 'wheel' across related languages found it descended from a single ancient root. Since the wheel was invented only once in the region, the shared word suggests the languages' common ancestor was still spoken when the wheel appeared, helping date that ancestor to a particular era.","unit":1,"correct":"C","lesson_name":"Central Ideas and Details","why_wrong":{"A":"That the word came from one root is a supporting detail, too narrow to be the main idea.","D":"The shared word implies one invention passed down, not separate inventions; this reverses the logic.","B":"A general claim that languages change is far broader than this specific dating argument."},"choice_families":{"B":"Çok geniş","D":"Ters ilişki","A":"Çok dar"},"why_correct":"The passage's point is that the shared word dates the common ancestor to the wheel's arrival. Choice A states it."},{"lesson_name":"Central Ideas and Details","choice_families":{"A":"Ters ilişki","B":"Çok geniş","C":"Çok dar"},"why_wrong":{"B":"A sweeping claim about nature and all well-being is far broader than this specific surgical finding.","C":"The brick-wall group's slower recovery is one detail, too narrow to be the main idea.","A":"The passage never claims medication becomes unnecessary; this overstates and reverses the point."},"why_correct":"The passage's point is that a nature view can aid physical recovery, not only mood. Choice A states it precisely.","choices":{"B":"Nature has a profound influence on every aspect of human well-being.","C":"Patients facing a brick wall took longer to leave the hospital.","D":"A view of nature may measurably speed physical recovery after surgery, not just improve patients' mood.","A":"Because a nature view aids recovery, hospitals no longer need pain medication."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok geniş","lesson":3,"id":"u1-l3-f2-07","correct":"D","unit":1,"passage":"In a trial, patients recovering from surgery in rooms with a window view of trees needed less pain medication and left the hospital sooner than those facing a brick wall. The finding suggests that even a passive glimpse of nature may measurably aid physical recovery, not merely lift mood."},{"why_correct":"The passage's point is that the dam's sediment trapping eroded the distant delta, an unintended effect. Choice A states it.","choice_families":{"D":"Ters ilişki","C":"Çok dar","B":"Çok geniş"},"why_wrong":{"D":"The passage says the delta eroded, not grew; this reverses the outcome.","C":"The land slipping under the sea is one detail, too narrow to be the main idea.","B":"A worldwide claim about human reshaping of rivers is far broader than this passage's specific case of one dam eroding one downstream delta."},"lesson_name":"Central Ideas and Details","correct":"A","unit":1,"passage":"A study of a river delta found that as an upstream dam trapped sediment, the delta downstream stopped growing and began to erode, its land slipping beneath the sea. The case illustrates how an intervention in one part of a river system can produce unintended consequences far away.","lesson":3,"id":"u1-l3-f2-08","target_family":"Çok geniş","stem":"Which choice best states the main idea of the text?","choices":{"B":"Human activity has reshaped rivers and coastlines around the world, damming, diverting, and channeling waterways until few large rivers still reach the sea as they once did before people intervened.","C":"The delta's land began to slip beneath the sea.","A":"By trapping sediment, an upstream dam caused the downstream delta to erode, showing how one intervention can have distant, unintended effects.","D":"Because the dam trapped sediment, the delta downstream grew larger than before."}},{"choices":{"C":"The two scientists exchanged letters over a period of years.","B":"Private letters reveal that the scientists' famous rivalry was, behind the scenes, also a quiet exchange of ideas.","A":"Scientific progress has always depended on cooperation among researchers, who build on one another's findings, share their methods and materials, and correct each other's errors across the generations of any field.","D":"Because the scientists borrowed from each other, their public rivalry never actually existed."},"stem":"Which choice best states the main idea of the text?","target_family":"Çok geniş","id":"u1-l3-f2-09","lesson":3,"passage":"Examining letters between two nineteenth-century scientists, a historian found that their public rivalry masked a private exchange of ideas, each quietly borrowing from the other. The correspondence suggests that a competition remembered as bitter was, behind the scenes, also a partnership.","correct":"B","unit":1,"lesson_name":"Central Ideas and Details","why_wrong":{"C":"That they exchanged letters is a detail too narrow to be the main idea.","A":"A sweeping claim about all scientific progress far exceeds this passage's specific case of two public rivals privately exchanging ideas.","D":"The passage affirms the public rivalry was real; this denies it, reversing the point."},"choice_families":{"C":"Çok dar","D":"Ters ilişki","A":"Çok geniş"},"why_correct":"The passage's point is that the bitter rivalry concealed a private partnership. Choice A states it precisely."},{"lesson_name":"Central Ideas and Details","choice_families":{"B":"Çok geniş","D":"Ters ilişki","A":"Çok dar"},"why_wrong":{"B":"A general claim that artists work in many forms is far broader than this passage's specific point about the composer's hidden miniatures.","A":"That the pieces were spare and intimate is a detail too narrow to be the main idea.","D":"The passage does not question her orchestral mastery; this invents and reverses a claim."},"why_correct":"The passage's point is that the miniatures reveal a hidden, intimate side of a large-scale composer. Choice A states it.","stem":"Which choice best states the main idea of the text?","choices":{"C":"A notebook of intimate piano miniatures reveals a private, small-scale side of a composer known for grand orchestral works.","B":"Great artists often produce work in more than one form, moving between the large and the small, the public and the private, as they explore the full range of what their materials and imagination allow.","D":"Because she wrote miniatures, the composer never truly mastered large orchestral works.","A":"The piano pieces in the notebook were spare and intimate."},"target_family":"Çok geniş","lesson":3,"id":"u1-l3-f2-10","correct":"C","unit":1,"passage":"A composer known for grand orchestral works left, at her death, a notebook of short pieces for solo piano. Spare and intimate, they reveal a side of her art her public works had hidden. The notebook suggests that even an artist defined by scale could think in miniature."},{"choices":{"D":"Because Meitner worked in exile, she made no contribution to explaining fission.","A":"Meitner's former collaborator ran the experiments that produced the results, working in the laboratory they had once shared while she followed the findings by letter from her place of exile abroad.","B":"Meitner fled Nazi Germany and worked in exile.","C":"Meitner supplied the theoretical explanation of nuclear fission yet was unjustly left out of the Nobel Prize for the discovery."},"stem":"Which choice best states the main idea of the text?","target_family":"Doğru ama alakasız","id":"u1-l3-f3-01","lesson":3,"passage":"The physicist Lise Meitner helped explain nuclear fission but was omitted from the Nobel Prize awarded for the discovery. Working in exile after fleeing Nazi Germany, she corresponded with her former collaborator, who ran the experiments while she supplied the theoretical account that made sense of the results. Later historians have widely regarded the omission as a serious injustice.","unit":1,"correct":"C","lesson_name":"Central Ideas and Details","why_wrong":{"B":"Her exile is true and mentioned, but it is background, tangential to the main point about her contribution and the prize.","A":"That her collaborator ran the experiments is true but a supporting detail, tangential to the central point about her theoretical contribution and the prize she was denied.","D":"The passage says she supplied the theory despite exile; this denies her contribution and reverses the point."},"choice_families":{"D":"Ters ilişki","A":"Doğru ama alakasız","B":"Doğru ama alakasız"},"why_correct":"The passage centers on Meitner's theoretical contribution and her unjust exclusion from the prize. Choice A captures that."},{"passage":"A restored wetland outside a growing city was expected mainly to shelter wildlife. It did, but its greatest value proved unexpected: during heavy storms, the marsh absorbed floodwater that would otherwise have swamped nearby streets, sparing the city costly damage. The project's return, officials found, lay as much in flood control as in habitat.","unit":1,"correct":"D","id":"u1-l3-f3-02","lesson":3,"target_family":"Doğru ama alakasız","stem":"Which choice best states the main idea of the text?","choices":{"D":"A wetland restored chiefly for wildlife turned out to deliver its greatest value through flood control.","A":"Because the wetland controlled floods, it provided no habitat for wildlife.","C":"The city around the wetland was expanding.","B":"The wetland lies just outside a growing city."},"why_correct":"The passage's point is that the wetland's unexpected flood-control value rivaled its habitat value. Choice A states it.","why_wrong":{"A":"The passage says it sheltered wildlife and controlled floods; this denies the habitat and reverses the point.","B":"The wetland's location is true but tangential to the point about its value.","C":"The city's growth is background, true but not the central idea."},"choice_families":{"A":"Ters ilişki","C":"Doğru ama alakasız","B":"Doğru ama alakasız"},"lesson_name":"Central Ideas and Details"},{"choices":{"D":"The coating caused more ice to build up on the cables than before.","A":"The coated cables shed ice more readily, reducing hazardous buildup.","C":"The bridge had been closed during past storms.","B":"The coated cables resisted corrosion over three winters."},"stem":"According to the text, what was the unexpected outcome of the coating trial?","target_family":"Doğru ama alakasız","lesson":3,"id":"u1-l3-f3-03","unit":1,"correct":"A","passage":"Engineers coated a set of bridge cables with a new polymer, expecting it chiefly to resist rust. Over three winters, the coated cables did resist corrosion, but they also shed ice far more readily than bare cables, reducing the dangerous buildup that had closed the bridge in past storms.","lesson_name":"Central Ideas and Details","choice_families":{"C":"Doğru ama alakasız","B":"Doğru ama alakasız","D":"Ters ilişki"},"why_wrong":{"D":"The text says the coating reduced ice buildup; this reverses that result.","C":"The past closures are background, true but not the unexpected outcome.","B":"Corrosion resistance was the expected outcome, not the unexpected one the question asks for."},"why_correct":"The text calls the ice-shedding the unexpected outcome, since corrosion resistance was expected. Choice A reports it."},{"target_family":"Doğru ama alakasız","stem":"Which choice best states the main idea of the text?","choices":{"B":"Evidence from the novelist's manuscripts complicates her claim that character, not plot, drove her writing.","C":"The novelist gave interviews about her writing method.","A":"The novelist was celebrated for the intricacy of her plots.","D":"Because character came first for her, she never planned her plots in advance."},"unit":1,"correct":"B","passage":"A novelist celebrated for her intricate plots claimed in interviews that character always came first for her, and that plot merely followed from who her people were. Critics, however, have noted that her manuscripts show plots mapped in detail before a single character was named, complicating the account she gave of her own method.","lesson":3,"id":"u1-l3-f3-04","lesson_name":"Central Ideas and Details","why_correct":"The passage's point is the tension between her stated method and the manuscript evidence. Choice A captures it.","choice_families":{"C":"Doğru ama alakasız","A":"Doğru ama alakasız","D":"Ters ilişki"},"why_wrong":{"C":"That she gave interviews is a true detail, not the central idea.","D":"The manuscripts show she did plan plots in advance; this reverses that evidence.","A":"Her fame for intricate plots is true but background to the point about her stated method."}},{"why_correct":"The passage's point is that removing the road cut total trips rather than displacing them. Choice A states it.","choice_families":{"B":"Doğru ama alakasız","D":"Ters ilişki","A":"Doğru ama alakasız"},"why_wrong":{"D":"The passage says gridlock never came; this asserts the opposite, reversing the outcome.","A":"The planners' expectation of worse traffic is background that sets up the surprise, not the passage's central point about total trips falling.","B":"The park is true but the setting, tangential to the point about traffic."},"lesson_name":"Central Ideas and Details","unit":1,"correct":"C","passage":"A city replaced a busy road with a linear park, and planners braced for worse traffic on surrounding streets. The gridlock never came. Many drivers, it turned out, simply stopped making trips they had taken only because the road made them easy, so the total number of car trips fell rather than shifting elsewhere.","lesson":3,"id":"u1-l3-f3-05","target_family":"Doğru ama alakasız","choices":{"B":"The city built a linear park where the road had been.","C":"Removing the road reduced the total number of car trips rather than pushing traffic onto other streets.","A":"The city's planners had braced for traffic on the surrounding streets to worsen once the busy road was gone, expecting the displaced cars to spill over into every neighboring route and clog them.","D":"Because the road was removed, traffic on surrounding streets grew much heavier."},"stem":"Which choice best states the main idea of the text?"},{"why_wrong":{"A":"The text says the heat cracked the coats to let water in; this reverses the effect.","B":"The shrub's rarity is true but not the reason for germination.","C":"The greenhouse failure sets up the puzzle but is not the cause the question asks for."},"choice_families":{"B":"Doğru ama alakasız","C":"Doğru ama alakasız","A":"Ters ilişki"},"why_correct":"The text says the fire's heat cracked the coats so water could enter, triggering germination. Choice A reports it.","lesson_name":"Central Ideas and Details","id":"u1-l3-f3-06","lesson":3,"passage":"The rare shrub had puzzled botanists whose greenhouse seeds never sprouted. In the wild, its seeds lay dormant until a wildfire swept through; the heat cracked their tough coats, letting in water. Only then, with competitors burned away and the coat breached, did the seedlings emerge.","correct":"D","unit":1,"stem":"According to the text, why did the seeds germinate only after the fire?","choices":{"B":"The shrub was rare and had puzzled botanists.","C":"The seeds had failed to sprout in the greenhouse.","D":"The fire's heat cracked the seeds' tough coats, allowing water to enter.","A":"The fire sealed the seed coats, keeping water out until later."},"target_family":"Doğru ama alakasız"},{"correct":"A","unit":1,"passage":"An economist studying a famine found that food output in the region had not actually fallen that year. Grain was available, but a collapse in wages left laborers unable to buy it, and much of the harvest was exported to areas that could pay more. The famine, she argued, was a failure of access, not of supply.","lesson":3,"id":"u1-l3-f3-07","target_family":"Doğru ama alakasız","stem":"Which choice best states the main idea of the text?","choices":{"A":"The famine resulted not from a shortage of food but from a collapse in access, as workers could not afford the grain that was available.","D":"Because food output fell sharply, the region ran out of grain.","C":"The economist studied a famine in a particular region.","B":"Much of the region's harvest that year was exported to areas that could pay higher prices for it, carried away from the hungry district to distant markets where buyers with money were waiting."},"why_correct":"The passage's point is that the famine was a failure of access, not supply. Choice A states it.","choice_families":{"D":"Ters ilişki","C":"Doğru ama alakasız","B":"Doğru ama alakasız"},"why_wrong":{"D":"The passage says output did not fall; this asserts the opposite, reversing the point.","C":"That she studied a famine is background, not the main idea.","B":"The export of grain is one supporting detail behind the argument, true but not the central claim that the famine was a failure of access rather than supply."},"lesson_name":"Central Ideas and Details"},{"lesson_name":"Central Ideas and Details","why_wrong":{"C":"The dream story is the popular view the passage sets out to correct, not its central claim that the insight developed gradually.","D":"The passage says the sketches did the work; this denies their role, reversing the point.","A":"That she kept notebooks is the source of evidence, a true detail but not the main idea."},"choice_families":{"A":"Doğru ama alakasız","D":"Ters ilişki","C":"Doğru ama alakasız"},"why_correct":"The passage's point is that the insight grew gradually, contrary to the dream legend. Choice A states it.","choices":{"B":"The scientist's notebooks show that her insight developed through long, gradual work, not the sudden dream of legend.","C":"A widely shared story describes how the scientist's great insight supposedly arrived all at once in a single vivid dream, a tale retold so often that it came in time to stand for the discovery itself.","A":"The scientist kept notebooks over a period of years.","D":"Because the insight came in a dream, the years of sketches contributed nothing."},"stem":"Which choice best states the main idea of the text?","target_family":"Doğru ama alakasız","id":"u1-l3-f3-08","lesson":3,"passage":"A widely shared story holds that a scientist's great insight came in a sudden dream. Her own notebooks, kept over years, tell a different tale: the idea took shape gradually through dozens of failed sketches and revisions. The dream, if it happened at all, capped a long labor rather than replacing it.","correct":"B","unit":1},{"correct":"C","unit":1,"passage":"Searchers had combed the seabed for years without success. The break came from an old harbor ledger listing the ship's final cargo and its recorded heading on the night it sank. Matching that heading to the currents, the divers narrowed the search area and found the wreck within days.","lesson":3,"id":"u1-l3-f3-09","target_family":"Doğru ama alakasız","stem":"According to the text, what allowed the divers to locate the wreck?","choices":{"C":"A harbor ledger recording the ship's heading, matched to the currents, narrowed the search area.","B":"Searchers had combed the seabed for years.","D":"The ledger's record of the heading led the divers away from the wreck.","A":"The divers found the wreck within days."},"why_correct":"The text credits the ledger's heading, matched to currents, for narrowing the search. Choice A reports it.","choice_families":{"B":"Doğru ama alakasız","D":"Ters ilişki","A":"Doğru ama alakasız"},"why_wrong":{"D":"The text says the heading led them to the wreck; this reverses that.","A":"Finding the wreck in days is the result, not the means the question asks about.","B":"The years of fruitless searching is background, not what finally worked."},"lesson_name":"Central Ideas and Details"},{"stem":"Which choice best states the main idea of the text?","choices":{"A":"Because remote work raised satisfaction, it improved every measure the study examined.","D":"The study of remote work found mixed results, with gains in satisfaction but slower learning for newer employees.","B":"Advocates of remote work often cite the study's findings.","C":"Employees reported higher satisfaction when working at home."},"target_family":"Doğru ama alakasız","id":"u1-l3-f3-10","lesson":3,"passage":"A study of remote work found that employees reported higher satisfaction and focus at home, a result often cited by its advocates. The same study, less often quoted, found that newer employees learned their roles more slowly without the informal guidance of nearby colleagues. The picture it painted was mixed, not simply favorable.","unit":1,"correct":"D","lesson_name":"Central Ideas and Details","why_wrong":{"B":"That advocates cite the study is a true aside, tangential to its mixed findings.","C":"The satisfaction gain is one half of the mixed picture, too narrow to be the whole main idea.","A":"The passage stresses a downside; this claims every measure improved, reversing the point."},"choice_families":{"B":"Doğru ama alakasız","C":"Çok dar","A":"Ters ilişki"},"why_correct":"The passage's point is that the study's results were mixed, not simply favorable. Choice A states it."},{"target_family":"Ters ilişki","stem":"Which choice best states the main idea of the text?","choices":{"D":"Among the birds, bright plumage raised the risk of predation but also increased reproductive success, so it carried both a cost and a reward.","A":"Birds are among the most colorful animals in the natural world.","B":"The birds' bright plumage made the males far more successful at avoiding predators, its bold colors somehow helping them slip away unseen whenever a hunting hawk or prowling fox drew near.","C":"The brightest males fathered the most chicks."},"correct":"D","unit":1,"passage":"A biologist studying a bird species found that the males with the brightest plumage were also the most vulnerable to predators, since their color made them easy to spot. Yet these males fathered the most chicks, because females strongly preferred them. Bright color, then, carried both a survival cost and a reproductive reward.","lesson":3,"id":"u1-l3-f4-01","lesson_name":"Central Ideas and Details","why_correct":"The passage's point is the trade-off: bright color costs survival but rewards reproduction. Choice A captures both sides.","choice_families":{"C":"Çok dar","B":"Ters ilişki","A":"Çok geniş"},"why_wrong":{"C":"The reproductive success is one half of the trade-off, too narrow to be the main idea.","B":"The passage says bright color made males easier for predators to spot; this claims it helped them avoid predators, reversing the survival relationship.","A":"A general claim about birds' colorfulness is far broader than this specific finding."}},{"choice_families":{"D":"Çok geniş","B":"Ters ilişki","C":"Çok dar"},"why_wrong":{"C":"The salt buildup is the mechanism behind the decline, a detail too narrow to be the passage's whole main idea about irrigation lowering yields.","B":"The passage shows irrigation lowering yields here, so this reverses its central finding.","D":"A general statement about water and agriculture is far broader than this specific case."},"why_correct":"The passage's point is that irrigation eventually lowered yields through salt buildup. Choice A states that reversal.","lesson_name":"Central Ideas and Details","lesson":3,"id":"u1-l3-f4-02","correct":"A","unit":1,"passage":"Contrary to the belief that irrigation always boosts farm output, a study of one arid region found that decades of irrigation had gradually left salt deposits in the soil as the water evaporated. Over time these deposits poisoned the land, and yields on the most heavily irrigated fields fell below those of fields left dry.","stem":"Which choice best states the main idea of the text?","choices":{"B":"Irrigation reliably increases farm output in arid regions.","C":"Salt deposits gradually formed in the soil as the irrigation water spread across the fields and evaporated under the sun, leaving behind a faint white crust that thickened season after season.","A":"In the region studied, long-term irrigation built up salt that eventually lowered yields below those of unirrigated fields.","D":"Water is essential to agriculture in dry parts of the world."},"target_family":"Ters ilişki"},{"choice_families":{"C":"Çok dar","D":"Çok geniş","A":"Ters ilişki"},"why_wrong":{"C":"That some drivers had avoided the route is a supporting detail explaining the influx, too narrow to be the passage's main idea.","D":"A general statement about highways is far broader than this specific finding.","A":"The passage shows widening failing to reduce congestion, so this reverses its finding."},"why_correct":"The passage's point is that widening drew more traffic and failed to ease congestion. Choice A states that reversal.","lesson_name":"Central Ideas and Details","lesson":3,"id":"u1-l3-f4-03","unit":1,"correct":"B","passage":"Planners once assumed that widening a highway would ease congestion. Studies of several widened highways found the opposite: the added capacity drew more drivers who had previously avoided the route or traveled at other times, so within a few years traffic was as heavy as before, or heavier.","choices":{"D":"Highways are a central feature of modern transportation systems.","A":"Widening a highway reliably reduces the congestion on it.","C":"Some drivers had previously avoided the route altogether or traveled only at off-peak hours, changing their habits once the widened road briefly seemed to promise a faster, less crowded trip.","B":"Widening highways tended to attract more drivers, leaving congestion as bad as or worse than before rather than easing it."},"stem":"Which choice best states the main idea of the text?","target_family":"Ters ilişki"},{"choice_families":{"A":"Çok dar","D":"Çok geniş","B":"Ters ilişki"},"why_wrong":{"B":"The passage shows the predator sustaining the prey, so this reverses the central finding.","D":"A general remark about island ecosystems is far broader than this passage's specific finding that the predator kept the prey sustainable.","A":"The overgrazing is the mechanism behind the crash, a detail too narrow to be the passage's whole main idea."},"why_correct":"The passage's point is that the predator sustained rather than harmed the prey population. Choice A states that reversal.","lesson_name":"Central Ideas and Details","lesson":3,"id":"u1-l3-f4-04","correct":"C","unit":1,"passage":"A common assumption holds that predators harm the populations of the animals they hunt. On one island, however, removing a top predator caused the prey population to crash, not flourish: freed from the predator, the prey overgrazed their food supply until famine set in. The predator, it turned out, had kept the prey's numbers sustainable.","choices":{"A":"Freed from the predator that had long hunted them, the prey overgrazed their own food supply until it gave out, stripping the island's vegetation faster than it could ever regrow.","D":"Islands often host unusual and fragile ecosystems, isolated worlds where a small number of species settle into a delicate balance that even a single change can easily tip over into collapse.","B":"Predators reduce the populations of the animals they hunt.","C":"Removing the predator caused the prey to overgraze and collapse, showing the predator had actually kept the prey population sustainable."},"stem":"Which choice best states the main idea of the text?","target_family":"Ters ilişki"},{"target_family":"Ters ilişki","stem":"Which choice best states the main idea of the text?","choices":{"C":"Shoppers offered many jams were less likely to make a purchase.","B":"More choices reliably make people happier with what they select.","A":"Consumer behavior is influenced by a great many psychological factors, from mood and habit to advertising and the subtle pull of how the choices happen to be arranged before a shopper at the moment of buying.","D":"Offering shoppers many choices left them less likely to buy and less satisfied than offering only a few, contrary to the assumption that more choice helps."},"unit":1,"correct":"D","passage":"It seems natural to assume that giving people more choices makes them happier with what they pick. A study of shoppers found the reverse: those offered dozens of jam varieties were less likely to buy any and less satisfied with their purchase than those offered only a few, as the abundance of options bred doubt and regret.","lesson":3,"id":"u1-l3-f4-05","lesson_name":"Central Ideas and Details","why_correct":"The passage's point is that more choice reduced satisfaction and purchasing. Choice A states that reversal.","choice_families":{"A":"Çok geniş","C":"Çok dar","B":"Ters ilişki"},"why_wrong":{"B":"The passage shows more choice lowering satisfaction, so this reverses the finding.","C":"The drop in purchasing is one half of the result, too narrow to be the whole main idea.","A":"A general claim about consumer psychology is far broader than this passage's specific study of how too many jam choices reduced buying and satisfaction."}},{"lesson_name":"Central Ideas and Details","why_wrong":{"D":"A general statement about the many factors in traffic safety is far broader than this passage's specific finding that brighter lighting was followed by more accidents.","B":"The passage shows lighting raising accidents here, so this reverses the finding.","C":"That the city installed the lighting is a setup detail, too narrow to be the main idea."},"choice_families":{"D":"Çok geniş","C":"Çok dar","B":"Ters ilişki"},"why_correct":"The passage's point is that brighter lighting was followed by more, not fewer, accidents. Choice A states that reversal.","stem":"Which choice best states the main idea of the text?","choices":{"B":"Brighter lighting reliably reduces nighttime traffic accidents.","C":"The city installed intense lighting on several roads.","A":"Brighter street lighting was followed by more accidents, apparently because it led drivers to speed, contrary to the city's expectation.","D":"Traffic safety depends on a wide range of contributing factors, including road design, vehicle condition, weather, signage, and the countless split-second decisions drivers make behind the wheel each day."},"target_family":"Ters ilişki","id":"u1-l3-f4-06","lesson":3,"passage":"A city assumed that brighter street lighting would lower nighttime accidents. After it installed intense lighting on several roads, accidents on them rose. Researchers suggested the glare and the false sense of safety led drivers to speed up, offsetting any benefit from better visibility.","unit":1,"correct":"A"},{"target_family":"Ters ilişki","stem":"Which choice best states the main idea of the text?","choices":{"C":"Overwhelmed by the crowded galleries, visitors skimmed quickly past the densely hung works and left the museum sooner, taking in little of what the packed walls had crammed before them.","B":"Showing fewer works with more space lengthened and increased visits, reversing the museum's belief that displaying more would draw more.","D":"Museums play an important cultural role in many communities.","A":"Displaying more of a collection reliably draws more visitors."},"passage":"Museums long believed that displaying more of their collection would draw more visitors. One museum found that crowding many works into each gallery actually shortened visits: overwhelmed, visitors skimmed and left sooner. When the museum showed fewer works with more space, people lingered and returned more often.","unit":1,"correct":"B","id":"u1-l3-f4-07","lesson":3,"lesson_name":"Central Ideas and Details","why_correct":"The passage's point is that showing fewer works improved visits, reversing the museum's assumption. Choice A states it.","why_wrong":{"C":"The skimming behavior is one detail in the account, too narrow to be the passage's whole main idea about showing fewer works.","D":"A general remark about museums' role is far broader than this specific finding.","A":"The passage shows more works shortening visits, so this reverses the finding."},"choice_families":{"C":"Çok dar","A":"Ters ilişki","D":"Çok geniş"}},{"lesson_name":"Central Ideas and Details","why_wrong":{"D":"A general claim about management is far broader than this specific case.","A":"The errors are the mechanism behind the delay, a detail too narrow to be the passage's whole main idea about tight deadlines lengthening total time.","B":"The passage shows tight deadlines slowing overall completion, so this reverses the finding."},"choice_families":{"B":"Ters ilişki","A":"Çok dar","D":"Çok geniş"},"why_correct":"The passage's point is that tight deadlines lengthened total time through errors. Choice A states that reversal.","stem":"Which choice best states the main idea of the text?","choices":{"B":"Tighter deadlines reliably make a team complete work faster.","C":"Tighter deadlines produced more errors and, after corrections, longer overall times, contrary to the manager's expectation of faster work.","A":"Under the tighter deadlines, errors steadily crept into the team's work, small mistakes multiplying as people hurried, each one waiting to be caught and fixed in some later, slower round of correction.","D":"Effective management requires attention to many competing demands."},"target_family":"Ters ilişki","id":"u1-l3-f4-08","lesson":3,"passage":"A manager assumed that setting tighter deadlines would push a team to work faster. Instead, the tighter the deadline, the more errors crept into the work, forcing time-consuming rounds of correction. The rushed projects ended up taking longer overall than those given generous schedules.","correct":"C","unit":1},{"why_correct":"The passage's point is that clearing deadwood harmed forests, reversing the old belief. Choice A states it.","choice_families":{"A":"Çok geniş","C":"Çok dar","B":"Ters ilişki"},"why_wrong":{"C":"What the logs housed is a supporting detail behind the finding, too narrow to be the passage's whole main idea about clearing deadwood harming forests.","B":"The passage shows clearing deadwood harming forests, so this reverses the finding.","A":"A general statement about forest complexity is far broader than this specific finding."},"lesson_name":"Central Ideas and Details","unit":1,"correct":"D","passage":"Foresters once cleared away fallen wood to keep forests tidy and, they believed, healthy. Studies revealed the practice backfired: the rotting logs they removed had housed insects, fungi, and seedlings, and had slowly released nutrients into the soil. Forests stripped of deadwood grew less diverse and less vigorous, not more.","lesson":3,"id":"u1-l3-f4-09","target_family":"Ters ilişki","choices":{"D":"Removing fallen wood left forests less diverse and less vigorous, reversing the belief that clearing deadwood keeps forests healthy.","A":"Forests are complex ecosystems supporting many forms of life.","B":"Clearing fallen wood keeps forests healthier and more vigorous.","C":"The rotting logs the foresters cleared away had housed insects, fungi, and seedlings, sheltering a small community of living things within the decaying wood as it slowly returned to the soil."},"stem":"Which choice best states the main idea of the text?"},{"lesson_name":"Central Ideas and Details","why_correct":"The passage's point is that beyond an hour, more homework lowered scores, reversing the assumption. Choice A states it.","why_wrong":{"B":"The passage shows more homework lowering scores past a point; this claims it reliably raises them, reversing the finding.","C":"That researchers tracked grade levels is a true procedural detail, tangential to the main idea.","D":"A general remark about education is far broader than this specific finding."},"choice_families":{"C":"Doğru ama alakasız","B":"Ters ilişki","D":"Çok geniş"},"target_family":"Ters ilişki","choices":{"B":"Assigning more homework reliably raises students' test scores, each additional hour of practice steadily strengthening what they have learned and lifting their performance further above where it began.","C":"Researchers tracked several grade levels in the study.","D":"Education is shaped by a wide array of policies and practices.","A":"Beyond about an hour a night, more homework was linked to slightly lower scores, contrary to the school's assumption that more would raise them."},"stem":"Which choice best states the main idea of the text?","passage":"A school assumed that assigning more homework would raise test scores. Tracking several grade levels, researchers found that beyond about an hour a night, additional homework was linked to slightly lower scores, as fatigue and lost sleep outweighed any gain from extra practice.","correct":"A","unit":1,"id":"u1-l3-f4-10","lesson":3}],"main_ids":["u1-l3-f1-01","u1-l3-f2-01","u1-l3-f3-01","u1-l3-f4-01"],"name":"Central Ideas and Details","fam_short":{"Çok dar":"Çok dar","Doğru ama alakasız":"Alakasiz","Çok geniş":"Çok geniş","Ters ilişki":"Ters ilişki"},"teaching":{"cozumlu_ornekler":[{"correct":"A","passage":"Octopuses were long thought to be solitary and unintelligent. Recent research, however, has revealed remarkable abilities: they solve puzzles, use tools, and even appear to recognize individual human handlers. These findings have forced scientists to rethink long-held assumptions about invertebrate intelligence.","sonuc":"Ana fikir metnin bütün hareketini kapsar. Doğru ama dar bir ayrıntı ana fikir olamaz.","adimlar":["Metnin hareketini izle: eski varsayım vardı, yeni araştırma onu değiştirdi.","Ana fikir bu bütün hareketi kapsamalı: yeni bulgular eski varsayımları yıkıyor.","A tam bunu söyler, metnin başından sonuna kadarki mesajı özetler.","B ve C doğru ama sadece birer ayrıntı, metnin bir parçası. D metinde yok, çok genel."],"stem":"Which choice best states the main idea of the text?","choices":{"C":"Octopuses were once thought to be solitary animals.","B":"Octopuses can solve puzzles when given the chance.","D":"Scientists study many kinds of invertebrates.","A":"New research on octopuses has overturned old assumptions about how intelligent invertebrates can be."}},{"stem":"According to the text, why did ships surrender books at the port?","choices":{"B":"because the scholars demanded payment","C":"to reduce the weight of the ships","A":"so that the books could be copied for the library","D":"because books were illegal to own"},"sonuc":"Ayrıntı sorusunda cevap metinde birebir dayanağı olan bilgidir, makul tahmin değil.","passage":"The ancient library of Alexandria housed hundreds of thousands of scrolls. Scholars traveled from across the Mediterranean to study there. Its collection was so vast that ships docking at the port were reportedly required to surrender any books on board for copying.","adimlar":["Bu bir ayrıntı sorusu: metin AÇIKÇA ne diyor.","İlgili cümleyi bul: gemiler kitaplarını KOPYALANMAK için teslim ediyordu.","A birebir metne dayanır. Doğru.","B, C, D metinde hiç geçmez, dışarıdan uydurulmuş makul görünen seçenekler."],"correct":"A"},{"stem":"Which choice best states the main idea of the text?","choices":{"D":"Conservators disagree about how best to preserve ancient fabrics.","A":"Ancient textiles are generally regarded as far more valuable to museums than most other kinds of historical artifacts.","C":"Visitors generally prefer brightly lit displays to dimly lit ones.","B":"Museums have reduced lighting on fragile textiles because bright light, though appealing, damages them."},"adimlar":["Metnin yapisi: eski uygulama (parlak isik) -> sorun (isik lifleri ve renkleri bozuyor) -> yeni cozum (los oda).","Ana fikir bu uc parcayi birlestirmeli: isik cekici ama zararli, bu yuzden muzeler isigi azaltti.","B tam bu neden-sonuc-cozum zincirini ozetliyor; hem cekicilik hem hasar hem tepki var.","A (deger kiyasi) metinde yok, C sadece bir yan detay (ziyaretci tercihi) ve asiri genelleme, D (anlasmazlik) metinde gecmiyor; konservatorler hemfikir gorunuyor."],"sonuc":"Neden-sonuc-cozum zincirini kapsayan tek sik B oldugundan ana fikir B'dir.","passage":"For decades, museums displayed ancient textiles under bright light so visitors could admire their colors. Conservators now know that this practice was self-defeating: the same light that revealed the fabrics' dyes also gradually broke down the fibers and faded those very colors. Many institutions have therefore moved their most fragile textiles into dim, carefully controlled rooms, accepting a less dazzling display in exchange for the pieces' survival.","correct":"B"},{"stem":"Which choice best states the main idea of the text?","sonuc":"Iki gelenegin harmanlanmasini vurgulayan sik C oldugundan ana fikir C'dir.","choices":{"A":"Price consistently preferred the grand tradition of European classical music to the spirituals she had grown up hearing in her own community.","D":"Price believed spirituals should never be altered when used in symphonies.","B":"Price's symphonies were rejected by audiences during her lifetime.","C":"Price blended spiritual melodies with European orchestral forms to create a distinctive style drawing on both traditions."},"correct":"C","adimlar":["Metnin merkezi: Price spiritual ezgilerini alip Avrupa orkestra formuna gore YENIDEN sekillendiriyor.","Son cumle anahtar: eserler 'tek basina hicbir gelenege ait degil ama ikisinden de guc aliyor' -> harmanlama fikri.","C bu harmanlamayi ve 'her iki gelenekten beslenen ozgun stil' fikrini birebir veriyor.","A yanlis (birini digerine tercih etme metinde yok), B (dinleyici reddi) metinde yok, D metnin tersi (Price ezgileri NOTA NOTA almiyor, degistiriyor)."],"passage":"The composer Florence Price often wove melodies from African American spirituals into her symphonies, but she rarely quoted them note for note. Instead, she reshaped their rhythms and harmonies to fit the large orchestral forms she admired in European classical music. In doing so, Price created works that belonged fully to neither tradition alone but drew authority from both."},{"correct":"B","passage":"A common assumption is that animals hibernate mainly to escape the cold. Yet many hibernating species could physically tolerate winter temperatures if they had enough to eat. Research increasingly suggests that the deeper driver of hibernation is scarcity of food: when winter removes the insects, fruits, or fresh plants an animal depends on, lowering its metabolism and sleeping through the shortage becomes a strategy for survival.","sonuc":"'Soguk degil besin kitligi' donusunu yakalayan sik B oldugundan ana fikir B'dir.","adimlar":["Metin bir yanlis kaniyi (soguktan kacmak) ele alip onun yerine daha derin nedeni (besin kitligi) one suruyor.","Ana fikir bu 'X degil, aslinda Y' yapisini yansitmali.","B tam bunu soyluyor: sogugun kendisinden cok kis besin kitligi hibernasyonu yonlendiriyor.","A metnin tersini iddia ediyor (hayvanlar sogugu tolere EDEBILIR deniyor), C asiri genelleme (sadece bocek degil, meyve/bitki de sayiliyor), D yanlis (metin bir neden ONERIYOR)."],"choices":{"C":"Most animals that hibernate depend entirely on insects for food.","B":"Research suggests hibernation is driven less by cold itself than by winter food scarcity.","D":"Scientists have not yet identified any reason why animals hibernate.","A":"Hibernating animals are physically unable to survive even the briefest exposure to freezing winter temperatures."},"stem":"Which choice best states the main idea of the text?"}],"sik_hatalar":[{"cozum":"Ana fikir sorusunda seçenek metnin bütününü kapsamalı. Tek bir cümleyi özetleyen seçenek çok dardır.","hata":"Doğru bir ayrıntıyı ana fikir sanmak"},{"hata":"Ayrıntı sorusunda metin dışı bilgi seçmek","cozum":"Ayrıntı sorusunda cevap metinde açıkça yazmalı. Genel havaya uyan ama yazılmayan şey yanlıştır."},{"cozum":"Ana fikir metni özetler, metnin ötesine geçmez. Çok genel seçenek de yanlıştır.","hata":"Çok geniş, metni aşan seçeneği ana fikir sanmak"},{"hata":"İlk tanıdık kelimeyi gören seçeneğe atlamak","cozum":"Metindeki kelimeyi tekrarlayan seçenek doğru olmayabilir. Anlama bak, kelime eşleşmesine değil."},{"hata":"Metindeki en carpici veya en son okunan cumleyi ana fikir sanmak; oysa o cumle sadece bir destek/ornek olabilir.","cozum":"'Bu metin tek cumlede neyi savunuyor?' diye sor ve tum paragraflari kapsayan siki sec; tek bir ayrintiyi ozetleyen siki reddet."},{"hata":"Asiri genelleme yapan siklari (her zaman, hicbir, tamamen, yalnizca) fark etmeden secmek.","cozum":"Mutlak kelimeler iceren siklarda dur ve metnin gercekten o kadar kesin konusup konusmadigini dogrula; metin 'cogu/genellikle' diyorsa 'tum' yanlistir."}],"top_tips":["But, however, yet, although kelimelerinden SONRA gelen cümle genelde metnin asıl iddiasını taşır. Öncesi hazırlıktır. Ana fikir sorusunda önce oraya bak.","Detay sorusunda şık metindeki kelimeyi aynen tekrarlıyorsa şüphelen. SAT doğru cevabı PARAFRAZ eder, çeldiriciyi kopyalar.","İki şık birbirinin tersiyse doğru cevap genelde o ikisinden biridir. Üçüncü ve dördüncü şıkkı önce ele.","Ana fikir sorusunda şıkkın fiiline bak. It describes, it argues, it contradicts. Fiil metnin yaptığı İŞİ doğru adlandırıyor mu."],"alt_konular_intro":"Bu beceri iki ölçeği ayırt etmeni ister: metnin BÜTÜNÜNÜ özetleyen ana fikir mi soruluyor, yoksa tek bir cümlede geçen belirli bir DETAY mı? Yanlış ölçeği seçmek en pahalı hatadır — ana fikir sorusuna detayla, detay sorusuna genellemeyle cevap vermek.","kavramsal_temel":["Central Ideas and Details, bir metnin ANA fikrini ya da o fikri destekleyen belirli bir AYRINTIYI bulmanı ister. Ana fikir sorusu metnin bütününü özetleyen ifadeyi arar, ayrıntı sorusu metnin açıkça söylediği belirli bir bilgiyi arar.","Ana fikir, metnin en geniş ve en kapsayıcı mesajıdır. Bir cümlelik bir ayrıntı değil, tüm paragrafı çatı altına alan fikirdir. Doğru cevap metnin bir kısmını değil, ağırlık merkezini yansıtmalıdır.","En sık tuzak, metinde geçen doğru bir ayrıntıyı ana fikir sanmaktır. O ayrıntı doğrudur ama metnin sadece bir parçasını kapsar, bütününü değil. Ana fikir sorusunda çok dar seçenek yanlıştır.","Ayrıntı sorusunda ise tam tersi risk vardır: metnin genel havasına uyan ama metinde AÇIKÇA söylenmeyen bir şey seçmek. Ayrıntı sorusunda cevap metinde birebir dayanağı olan bilgidir.","Central Ideas and Details sorularinda ana fikir (central idea), bir metnin butun parcalarini bir arada tutan cati argumandir; detaylar ise bu catiyi ayakta tutan tuglalardir. Bir sik dogru bir detayi tekrar edebilir ama yine de yanlis olabilir, cunku detay metnin bir parcasini ozetler, ana fikir ise TAMAMINI. En saglam yontem, metni okuduktan sonra 'yazar temelde neyi kanitlamaya calisiyor?' sorusuna tek cumlelik bir cevap uretmek ve bu cevaba en cok benzeyen siki secmektir. Bu cati-tugla ayrimi, detay-tuzagini elemenin anahtaridir.","SAT'in bu sorularda en cok kullandigi yapilardan biri 'yaygin kani X'tir, ama aslinda Y' donusudur. Metin once bilinen bir varsayimi kurar, sonra onu duzeltir; ana fikir neredeyse her zaman duzeltmenin (Y) tarafindadir, kurulan yanlis kaninin (X) degil. Bu yuzden 'ama', 'yet', 'however', 'instead' gibi donus kelimelerinden SONRA gelen cumleye ozel dikkat et; ana fikir cogunlukla orada gizlidir. Ayrica mutlak ifadeler (her zaman, hicbir, tamamen) iceren siklara suphe ile yaklas: metin genellikle bu kadar kesin konusmaz ve boyle siklar cogunlukla asiri genelleme tuzagidir."],"celdirici_aileleri":[{"ad":"Çok dar","tanim":"Metindeki gerçek bir detayı ana fikir diye sunar. Cümle doğru, ama metnin tamamını temsil etmiyor. En sık düşülen tuzak. Öğrenci metinde gördüğü bir cümleyi tanıyıp işaretler."},{"ad":"Çok geniş","tanim":"Metnin desteklediği şeyden fazlasını iddia eder. Genelde all, every, always, never kelimeleri taşır. Metin bir türden bahsediyorsa şık bütün türlere genelliyor demektir."},{"tanim":"İfade doğrudur, hatta metinle uyumludur, ama SORULAN şey değildir. Bu tuzak için tek savunma soru köküne geri dönmektir.","ad":"Doğru ama alakasız"},{"tanim":"Metnin kelimelerini kullanır ama sebep ile sonucu, ya da iki tarafı yer değiştirir. Kelimeler tanıdık geldiği için doğru hissettirir. İlişkiyi kontrol et, kelimeleri değil.","ad":"Ters ilişki"},{"tanim":"Metinde gecen dogru ama ikincil bir ayrintiyi (orn. ziyaretci tercihi, tek bir besin turu) butun metnin ana fikri gibi sunar. Ana fikir metnin TAMAMINI kapsamali; sadece bir cumleyi ozetleyen siki ele.","ad":"Detayi Ana Fikir Sanma"},{"ad":"Ters Cevirme","tanim":"Metnin acikca soyledigi seyin tam tersini iddia eder (orn. 'nota nota almiyor' derken 'hic degistirmemeli' der). Metnin yonunu bir kelimeyle degistiren siklara karsi uyanik ol; anahtar fiil ve olumsuzluklari kontrol et."}],"alt_konular":[{"baslik":"1) Ana fikir (central idea)","govde":["Soru kökü: \"Which choice best states the main idea of the text?\" Doğru cevap metnin TAMAMINI kapsar — bir cümleyi değil, bütünün gidişatını.","Test: seçtiğin seçenek metnin sadece bir paragrafı ya da bir örneği için geçerliyse, o ana fikir değil detaydır. Ana fikir metnin her bölümüyle uyumlu olmalı.","Tuzak ailesi: (a) doğru ama çok dar (tek detayı ana fikir sanmak), (b) çok geniş / metinde olmayan genelleme, (c) metindeki bir karşı görüşü ana fikir sanmak."],"kural":"Ana fikir metnin tümünü kapsamalı; tek paragrafa sığan seçenek detaydır, ana fikir değildir."},{"govde":["Soru kökü: \"According to the text, ...\" ya da \"The text indicates that ...\". Cevap metinde AÇIKÇA yazılıdır; yorum ya da çıkarım gerekmez.","Yöntem: soruların anahtarı metinde geçen bir kelime öbeğini bulmaktır. Seçeneği metinle birebir eşleştir; metnin söylemediği ama 'mantıklı görünen' seçeneği eleme.","Bu, Inferences'ın tersidir: burada 'metin dışına çıkma'. Doğru cevabı işaret eden cümleyi metinde bulup gösterebilmelisin."],"baslik":"2) Destekleyici detay (specific detail)","kural":"Detay sorusunda cevap metinde yazılıdır; işaret edilen cümleyi bulamıyorsan o seçenek yanlıştır."},{"govde":["Bazı sorular metnin ne YAPTIĞINI sorar: bir olguyu mu tanıtıyor, bir görüşü mü savunuyor, bir sorunu mu ortaya koyuyor? Bu, ana fikrin 'fiil' hâlidir.","Metnin yapısını izle: giriş bir durum kurar, gövde onu geliştirir ya da sorgular, son cümle çoğu zaman yazarın duruşunu verir. İşlevi bu yaydan çıkar.","Tuzak: metnin içeriğini doğru özetleyen ama işlevini yanlış adlandıran seçenek (örneğin 'eleştiriyor' derken metin sadece 'açıklıyor')."],"baslik":"3) Özet ve metnin işlevi"}],"strateji":["Soru ana fikir mi ayrıntı mi istiyor, önce onu belirle.","Ana fikir için metnin bütün hareketini tek cümlede özetle.","Ayrıntı için ilgili cümleyi metinde bul, birebir dayanak ara.","Çok dar ya da çok geniş seçenekleri ele.","Kelime eşleşmesine değil, anlama göre seç."],"karar_proseduru":["Soru kökünü oku ve tipi belirle.  Main idea mı, detay mı. Bu ikisi farklı okuma gerektirir.","Detay sorusuysa anahtar kelimeyi bul ve metinde ara.  Anahtar kelime genelde bir özel isim, bir sayı ya da bir terim. Metinde onu bul, etrafındaki cümleyi oku.","Ana fikir sorusuysa metnin YÖNÜNÜ bul.  Metin bir iddia mı kuruyor, bir yanlışı mı düzeltiyor, iki görüşü mu karşılaştırıyor. Yön bulununca doğru şık kendini gösterir.","Kendi cümleni kur, sonra şıklara bak.  Şıklardan önce kendi özetini yap. Yoksa ilk makul şık seni yakalar.","Her şıkkı metne karşı test et.  Sorma: bu doğru mu. Sor: bu METİNDE var mı ve SORULANI cevaplıyor mu."],"alt_konular_baslik":"Soru alt tipleri","ne_olculuyor":["Bu ders iki ayrı soru tipini kapsar ve öğrenciler bunları karıştırır.","ANA FİKİR sorusu metnin tamamını özetlemeni ister. Cevap metnin herhangi bir cümlesinde tek başına durmaz, metnin bütününden çıkar.","DETAY sorusu tek bir olguyu sorar. Cevap metinde açıkça yazar. Metni tarar, bulur, işaretlersin.","Soru köküne bakıp hangisi olduğunu anlamak zorundasın. Yanlış tipe çalışırsan yanlış yerde ararsın."]},"families":["Çok dar","Çok geniş","Doğru ama alakasız","Ters ilişki"],"no":3},{"main_ids":["u1-l4-f1-01","u1-l4-f2-01","u1-l4-f3-01","u1-l4-f4-01"],"questions":[{"id":"u1-l4-f1-01","lesson":4,"passage":"A team compared two methods of teaching vocabulary. Students who encountered new words in varied sentences remembered them better a month later than students who memorized definitions in isolation. The advantage held across every group tested, though its size varied from class to class. The results suggest that, for retention, encountering words in varied contexts is generally ______","unit":1,"correct":"A","choices":{"D":"proof that memorizing definitions harms students' vocabulary.","A":"more effective than memorizing isolated definitions.","B":"the only method by which students can ever learn new words.","C":"slightly less effective than memorizing definitions in isolation."},"stem":"Which choice most logically completes the text?","target_family":"Çok güçlü","why_wrong":{"C":"The data show varied contexts more effective, not slightly less, so this reverses the degree.","B":"Claiming it is the only way words can ever be learned goes far beyond a comparison of two methods.","D":"The study shows isolated memorization was less effective, not that it harms vocabulary; that is not in the text."},"choice_families":{"D":"Metnin dışına çıkma","C":"Yön doğru derece yanlış","B":"Çok güçlü"},"why_correct":"The study found varied-context learning outperformed isolated memorization across all groups, so concluding it is generally more effective is warranted.","lesson_name":"Inferences"},{"stem":"Which choice most logically completes the text?","choices":{"B":"be heard more clearly over the surrounding noise.","C":"make their songs harder for other birds to hear.","A":"eliminate all interference from traffic noise completely.","D":"attract the attention of the human residents nearby."},"lesson_name":"Inferences","target_family":"Çok güçlü","lesson":4,"choice_families":{"C":"Yön doğru derece yanlış","A":"Çok güçlü","D":"Metnin dışına çıkma"},"why_wrong":{"A":"Eliminating all interference completely overstates what a pitch shift could achieve.","D":"Nothing in the text concerns attracting human residents; that goes outside the passage.","C":"The birds raised pitch to be heard better, not to be harder to hear; this reverses the aim."},"id":"u1-l4-f1-02","unit":1,"why_correct":"The higher pitch carried better over traffic, so adjusting to be heard more clearly over the noise is the warranted inference.","correct":"B","passage":"Researchers found that a region's songbirds sang at a higher pitch in neighborhoods with heavy traffic noise than in quiet ones. Because the higher pitch carried better above the low rumble of traffic, the birds in noisy areas may have been adjusting their songs so as to ______"},{"why_correct":"Tools of distant stone with no local source imply the inhabitants obtained far-off materials somehow, the modest warranted inference.","why_wrong":{"D":"Nothing suggests they manufactured the stone; that goes outside the passage.","A":"The tools show contact with distant sources, so no contact contradicts the evidence.","B":"Complete control over every trade route far overstates what the tools show."},"choice_families":{"B":"Çok güçlü","A":"Öncül sonuç karışıklığı","D":"Metnin dışına çıkma"},"lesson_name":"Inferences","passage":"In an archaeological site, tools made of a stone found only in distant mountains appear in layers dated to a period when no local source of that stone was available. The presence of these tools indicates that the site's inhabitants had, in some form, ______","correct":"C","unit":1,"id":"u1-l4-f1-03","lesson":4,"target_family":"Çok güçlü","choices":{"A":"no contact whatsoever with distant communities.","D":"invented a method for creating the stone artificially.","C":"access to materials originating far from the site.","B":"complete control over every trade route in the region."},"stem":"Which choice most logically completes the text?"},{"lesson_name":"Inferences","why_correct":"Sample-takers were somewhat more likely to buy, though most did not, so a modest increase in purchase chance is the warranted inference.","why_wrong":{"C":"Samples raised the chance of buying, not lowered it; this reverses the direction.","B":"A guarantee of purchase is far too strong when most sample-takers did not buy.","A":"Whether every major seller uses samples is not addressed in the text."},"choice_families":{"A":"Metnin dışına çıkma","C":"Yön doğru derece yanlış","B":"Çok güçlü"},"target_family":"Çok güçlü","stem":"Which choice most logically completes the text?","choices":{"D":"can modestly increase the chance of a purchase.","A":"has been adopted by every major tea seller.","C":"makes shoppers less willing to buy the product.","B":"guarantees that shoppers will buy the product."},"passage":"A study tracked shoppers offered free samples of a new tea. Those who tasted a sample were somewhat more likely to buy the tea that day than those who did not, though most sample-takers still did not buy it. The results suggest that offering samples ______","correct":"D","unit":1,"id":"u1-l4-f1-04","lesson":4},{"why_correct":"A modest, consistent shift with warmth means blooming is somewhat sensitive to early-spring temperature, the warranted inference.","choice_families":{"C":"Öncül sonuç karışıklığı","B":"Çok güçlü","D":"Yön doğru derece yanlış"},"why_wrong":{"B":"Being entirely determined by temperature alone overstates a modest, few-day shift.","C":"The flower does respond to temperature, so calling it completely unaffected contradicts the data.","D":"The blooming time varied with warmth, so calling it identical every year misstates the degree."},"lesson_name":"Inferences","correct":"A","unit":1,"passage":"Over several winters, a botanist noted that a certain alpine flower bloomed a few days earlier in years with warmer early springs. The pattern was consistent but modest, with blooming rarely shifting by more than a week. The observations suggest that the flower's blooming time is ______","lesson":4,"id":"u1-l4-f1-05","target_family":"Çok güçlü","stem":"Which choice most logically completes the text?","choices":{"A":"somewhat sensitive to early-spring temperature.","D":"identical from one year to the next regardless of weather.","B":"entirely determined by early-spring temperature alone.","C":"completely unaffected by temperature of any kind."}},{"target_family":"Çok güçlü","choices":{"A":"single-handedly determine how satisfied any employee feels.","D":"be legally required of emplo
