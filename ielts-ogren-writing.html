<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gri IELTS . Writing</title>
<meta name="description" content="IELTS Academic Writing. Task 1 ve Task 2 iskeleti, cozumlu ornek, fiil ve oran bankasi, on bir gorev icin mini yazma sihirbazi.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EFE7D8; --ink:#26201A; --muted:#8A7F6E; --line:#E3D8C5;
  --accent:#B4692C; --accent-deep:#9A4A1C; --accent-soft:#EEDDC1; --panel:#F3E7D0;
  --good:#2E6E4E; --good-soft:#DCEBE1; --wrong:#A8382F; --wrong-soft:#F2E1DC;
  --paper:#FBF6EC; --card:#FCFAF4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Crimson Pro",Georgia,serif;font-size:19px;line-height:1.55}
.shell{max-width:1180px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:32px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:0 0 34px;overflow:hidden}
.pad{padding:0 34px}
.rail{width:262px;flex:none;position:sticky;top:20px}
@media(max-width:900px){.shell{flex-direction:column;gap:16px;padding:16px 14px 70px}.rail{width:100%;position:static;order:-1}.pad{padding:0 20px}}
.head{background:var(--panel);border-bottom:2px solid var(--accent);padding:26px 34px 22px}
.eyebrow{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:"Playfair Display",serif;font-weight:700;font-size:1.9rem;margin:.3rem 0 .15rem;line-height:1.14;color:var(--ink)}
.lead{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted)}
h2{font-family:"Playfair Display",serif;color:var(--accent-deep);font-size:1.3rem;margin:26px 0 5px}
.rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:0 0 15px}
h3{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--accent);padding:9px 17px;border-radius:22px;cursor:pointer;border:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}
.dt{border-collapse:collapse;width:100%;font-family:Inter,sans-serif;font-size:13.5px;margin:8px 0 14px}
.dt th,.dt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.dt th{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.note{margin:14px 0;border-radius:14px;padding:14px 16px;font-family:Inter,sans-serif;font-size:13.5px;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.note .nt{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.note.dikkat{background:var(--wrong-soft);border-color:#E4C4BC}.note.dikkat .nt{color:var(--wrong)}
.note.ipucu{background:var(--accent-soft);border-color:rgba(0,0,0,.08)}.note.ipucu .nt{color:var(--accent-deep)}
.note.protokol{background:var(--good-soft);border-color:#C4DCCB}.note.protokol .nt{color:var(--good)}
.note.hedef{background:var(--accent-soft);border-color:rgba(0,0,0,.08)}.note.hedef .nt{color:var(--accent-deep)}
.note ul{margin:0;padding-left:18px}.note li{margin:3px 0}
.given{background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:12px 15px;font-family:Inter,sans-serif;font-size:14px;line-height:1.6;margin:0 0 14px}
.given .gl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);margin-bottom:5px}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;font-family:Inter,sans-serif;font-size:14.5px;line-height:1.55;margin:0 0 14px}
.task .tl{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.qlist{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5}
.qlist .qh{font-weight:700;color:var(--accent-deep);margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.qlist ol{margin:0 0 6px;padding-left:22px}.qlist li{margin:4px 0}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
@media(max-width:560px){.plan{grid-template-columns:1fr}}
.plan .pf{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.plan .pf label{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plan .pf textarea{width:100%;border:none;outline:none;resize:vertical;min-height:44px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--ink);background:transparent}
.wz textarea.editor{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:Inter,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical}
.wz textarea.editor:focus{outline:none;border-color:var(--accent)}
.wc{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin:8px 0 12px}
.wc b{color:var(--accent-deep)}
.wc.ok b{color:var(--good)}
.check{font-family:Inter,sans-serif;font-size:14px;margin:6px 0 12px}
.check .ci{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check .ci:last-child{border-bottom:none}
.check .box{flex:none;width:20px;height:20px;border:1.6px solid var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.check .ci.on .box{background:var(--accent)}
.check .ci.on .ct{color:var(--muted);text-decoration:line-through}
.reveal{margin:8px 0 14px}
.reveal .body{display:none;margin-top:10px}
.reveal.open .body{display:block}
.drill{border-top:1px solid var(--line);padding:11px 0;font-family:Inter,sans-serif;font-size:14.5px}
.drill .dq{margin-bottom:6px}
.drill .da{display:none;font-size:13.5px;color:var(--good);background:var(--good-soft);border:1px solid #C4DCCB;border-radius:9px;padding:8px 11px}
.drill.open .da{display:block}
.drill .db{font-size:12px;font-weight:600;color:var(--accent-deep);background:transparent;border:1.5px solid var(--accent);border-radius:18px;padding:4px 12px;cursor:pointer;font-family:Inter,sans-serif}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.rec .rl{font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rec .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .dotrec{width:11px;height:11px;border-radius:50%;background:#c33;display:none}
.rec.recording .dotrec{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.rec .tm{font-family:Inter,sans-serif;font-size:13px;color:var(--muted)}
.rec audio{margin-top:10px;width:100%}
.rec .warn{font-family:Inter,sans-serif;font-size:12.5px;color:var(--wrong);margin-top:8px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:Inter,sans-serif;font-size:13.5px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:5px 12px}
.qz{border-top:1px solid var(--line);padding:11px 0}
.qz .qzq{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:7px}
.qz .qzn{font-weight:700;color:var(--accent-deep)}
.qz input{font-family:Inter,sans-serif;font-size:14px;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:200px}
.qz input:focus{outline:none;border-color:var(--accent)}
.qz.correct{background:linear-gradient(90deg,var(--good-soft),transparent)}
.qz.incorrect{background:linear-gradient(90deg,var(--wrong-soft),transparent)}
.qz .qzfb{display:none;font-family:Inter,sans-serif;font-size:13px;margin-top:7px;border-radius:9px;padding:7px 11px}
.qz .qzfb.ok{background:var(--good-soft);color:#1d4a34;border:1px solid #C4DCCB}
.qz .qzfb.no{background:var(--wrong-soft);color:#7c2a23;border:1px solid #E4C4BC}
.qz .diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.qscore{font-family:Inter,sans-serif;font-weight:700;font-size:15px;color:var(--accent-deep);background:var(--accent-soft);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:11px 15px;margin:14px 0}
.mcq{border-top:1px solid var(--line);padding:12px 0}
.mcq .mstem{font-family:Inter,sans-serif;font-size:14.5px;line-height:1.5;margin-bottom:8px}
.mcq .mstem .mn{font-weight:700;color:var(--accent-deep)}
.mcq .opts{display:flex;flex-direction:column;gap:5px}
.mcq .opts label{font-family:Inter,sans-serif;font-size:14px;display:flex;gap:9px;align-items:flex-start;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;background:#fff}
.mcq .opts label:hover{border-color:var(--accent)}
.mcq .opts label.pick{border-color:var(--accent);background:var(--accent-soft)}
.mcq .opts .ol{flex:none;font-weight:700;color:var(--accent-deep)}
.mcq.correct{background:linear-gradient(90deg,var(--good-soft),transparent)}
.mcq.incorrect{background:linear-gradient(90deg,var(--wrong-soft),transparent)}
.mcq .mfb{display:none;font-family:Inter,sans-serif;font-size:13px;line-height:1.5;margin-top:8px;border-radius:9px;padding:8px 11px}
.mcq .mfb.ok{background:var(--good-soft);color:#1d4a34;border:1px solid #C4DCCB}
.mcq .mfb.no{background:var(--wrong-soft);color:#7c2a23;border:1px solid #E4C4BC}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 18px rgba(24,40,60,.06)}
.rc .u{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--accent);font-weight:700;padding:3px 9px;border-radius:20px}
.rc .ut{font-family:"Playfair Display",serif;font-size:1.02rem;color:var(--ink);margin:9px 0 12px;line-height:1.2}
.rsec{font-family:Inter,sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.rlink{display:flex;align-items:center;gap:9px;font-family:Inter,sans-serif;font-size:13.5px;padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line)}
.rlink:last-child{border-bottom:none}.rlink:hover{background:var(--accent-soft)}
.rlink.cur{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.rlink .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.rlink.cur .dot{background:var(--accent)}
</style>

<style>.launch-banner{display:none;background:#1A2230;color:#F4EFE3;text-align:center;padding:.55rem 1rem;font-family:Inter,system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;line-height:1.5}.launch-banner strong{color:#C89A3C;font-weight:600}
/* face lift */
h1{letter-spacing:-.012em}
.eyebrow::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.btn{box-shadow:0 1px 2px rgba(30,20,10,.12);transition:filter .14s,transform .06s,box-shadow .14s}
.btn:hover{box-shadow:0 3px 10px rgba(30,20,10,.14)}
.btn:active{transform:translateY(1px)}
.rc{box-shadow:0 8px 28px rgba(30,25,18,.08)}
.rlink{transition:background .12s,box-shadow .12s}
.rlink.cur{box-shadow:inset 3px 0 0 var(--accent)}
.mcq .opts label,.opts label{transition:border-color .12s,background .12s,transform .05s}
.mcq .opts label:active,.opts label:active{transform:translateY(1px)}
.chip{transition:transform .1s}.chip:hover{transform:translateY(-1px)}
.head{position:relative}
.qz.correct,.mcq.correct{box-shadow:inset 3px 0 0 var(--good)}
.qz.incorrect,.mcq.incorrect{box-shadow:inset 3px 0 0 var(--wrong)}
</style>

 fiil üç kez", "increase, increase, increase. Lexical Resource düşer."], ["Sebep açıklanmış", "This is because... Task 1'de sebep yazılmaz."], ["Görüş bildirilmiş", "In my opinion... Task 1'de görüş yasaktır."]]}, {"t": "note", "k": "ipucu", "title": "Çıkaracağın tek şey", "lines": ["İyi bir Task 1 metni zeki değildir, disiplinlidir. Dört paragraf, seçilmiş sayılar, bir oran ifadesi, tekrar etmeyen fiiller, sıfır yorum.", "Bunları yapan herkes Band 6 alır. Zeka gerekmiyor, sıra gerekiyor."]}]}, {"id": "t1-g1", "group": "Task 1 Görevleri", "name": "Görev 1. Line Graph", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The graph below shows the percentage of the population using the internet in three countries between 2000 and 2020. Write at least 150 words.", "given": [{"title": "Verildi. Introduction", "x": "The line graph compares the proportion of people using the internet in Canada, Brazil and India over a twenty-year period from 2000 to 2020."}, {"title": "Verildi. Overview", "x": "Overall, internet use rose considerably in all three countries. Canada led throughout the period, whereas India remained well behind the other two, despite showing the fastest growth in the final decade."}], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t1-g2", "group": "Task 1 Görevleri", "name": "Görev 2. Bar Chart", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The chart below shows household spending by category in three countries in 2022. Write at least 150 words.", "given": [{"title": "Verildi. Introduction", "x": "The bar chart illustrates how households in the United Kingdom, Japan and Mexico divided their monthly income across five categories in 2022."}, {"title": "Verildi. Overview", "x": "Overall, housing was the largest expense in both the United Kingdom and Japan, while Mexican households spent most on food. Education accounted for the smallest share in every country except Mexico."}], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t1-g3", "group": "Task 1 Görevleri", "name": "Görev 3. Pie Chart", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The charts below show the sources of electricity generation in one country in 2010 and 2020. Write at least 150 words.", "given": [{"title": "Verildi. Introduction", "x": "The two pie charts compare the sources used to generate electricity in a single country in 2010 and in 2020."}, {"title": "Verildi. Overview", "x": "Overall, the country moved away from coal and towards renewable energy over the decade. Renewables replaced coal as the leading source, while the contribution of nuclear power fell only slightly."}], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t1-g4", "group": "Task 1 Görevleri", "name": "Görev 4. Table", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The table below shows the average number of hours per week spent on four activities by students in three age groups (Studying 12.5/18.0/22.4, Social media 14.2/16.8/11.3, Sport 6.8/5.1/3.2, Part-time work 1.4/4.6/9.7 for ages 13-15 / 16-18 / 19-22). Write at least 150 words.", "given": [{"title": "Verildi. Overview", "x": "Overall, time spent studying and on part-time work rose steadily with age, whereas hours given to sport declined. Social media use was the only category to peak in the middle age group rather than at either extreme."}], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."], "model": {"title": "Model cevap (Band 7)", "x": "The table shows the average number of hours per week that students in three age bands spend on four activities. Overall, time devoted to studying and to part-time work increased steadily with age, whereas hours spent on sport fell, and social media use peaked in the middle age band.\n\nThe clearest upward trend was in studying, which rose from 12.5 hours a week among 13 to 15 year-olds to 22.4 hours among 19 to 22 year-olds, an increase of almost eighty per cent. Part-time work followed a similar pattern, climbing sharply from just 1.4 hours in the youngest group to 9.7 hours in the oldest, roughly a sevenfold rise.\n\nThe other two activities moved in the opposite direction. Time spent on sport declined consistently across the three groups, more than halving from 6.8 to 3.2 hours. Social media was the exception to every trend: rather than rising or falling steadily, it reached its highest level of 16.8 hours in the middle band before dropping to 11.3 hours among the oldest students, the lowest figure for that activity."}}]}, {"id": "t1-g5", "group": "Task 1 Görevleri", "name": "Görev 5. Process Diagram", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The diagram below shows the process of producing coffee, from harvest to sale. Write at least 150 words.", "given": [{"title": "Verildi. Overview", "x": "Overall, the process is linear rather than cyclical, and it is entirely man-made, requiring no natural inputs once the beans have been picked. The beans undergo four separate treatments before the product is packaged and distributed."}], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t1-g6", "group": "Task 1 Görevleri", "name": "Görev 6. Map", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The maps below show the town of Riverdale in 1995 and in 2025. Write at least 150 words. Bu görevde iskele yok: introduction, overview, detail 1, detail 2 hepsini sen yaz.", "given": [], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t1-g7", "group": "Task 1 Görevleri", "name": "Görev 7. Mixed Chart", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "wizard", "ptitle": "Task 1", "prompt": "The chart below shows the number of tourists and the average spending per visitor in one country between 2018 and 2022. Write at least 150 words. Bu görevde iskele yok.", "given": [], "plan": ["Overview. Genel eğilim ne", "Detay 1. Hangi grup, hangi sayılar", "Detay 2. Hangi grup, hangi sayılar", "Karşılaştırma. Neyi neyle kıyaslayacaksın"], "target": 150, "check": ["Soruyu kendi cümlemle yeniden yazdım, kopyalamadım.", "Ayrı bir overview paragrafım var.", "Overview'de sayı kullanmadım.", "Ana eğilimi doğru yakaladım.", "Bütün sayıları değil, seçilmiş sayıları yazdım.", "Her sayıda birim var (yüzde, milyon, saat).", "Aynı artış/düşüş fiilini iki kez kullanmadım.", "En az bir oran ifadesi kullandım.", "Zaman kipi doğru.", "Süreç/harita ise edilgen çatı kullandım.", "En az 150 kelime yazdım.", "Yorum yapmadım, sebep açıklamadım, görüş bildirmedim."]}]}, {"id": "t2-iskele", "group": "Task 2", "name": "Yapı İskeleti", "eyebrow": "Task 2", "blocks": [{"t": "p", "x": "Altı soru tipinde de aynı dört paragraf. Değişen şey, body paragraflarının ne yaptığı."}, {"t": "table", "head": ["Soru tipi", "Body 1", "Body 2", "Pozisyon nerede"], "rows": [["Opinion. To what extent", "Kendi görüşünün ilk gerekçesi", "İkinci gerekçe, veya karşı görüşün kabulü ve sınırlandırılması", "Girişte ve sonuçta"], ["Discussion. Both views", "Birinci görüş", "İkinci görüş", "Sonuçta. Girişte sezdirilmeli"], ["Advantages, Disadvantages", "Avantajlar", "Dezavantajlar", "Sonuçta. Tartı kurulmalı"], ["Problem and Solution", "Sebepler", "Çözümler. Her çözüm bir sebebe cevap", "Pozisyon gerekmez"], ["Two-Part", "Birinci soru", "İkinci soru", "İkinci soruda. İkisi de cevaplanmalı"]]}]}, {"id": "t2-mantik", "group": "Task 2", "name": "Paragraf İçi Mantık", "eyebrow": "Task 2", "blocks": [{"t": "p", "x": "Her body paragrafı dört adımdan oluşur. İddia. Gerekçe. Örnek. Sonuç."}, {"t": "table", "head": ["Adım", "Örnek"], "rows": [["İDDİA", "Practical skills deserve a place in the curriculum."], ["GEREKÇE", "Many young people leave school without knowing how to manage money."], ["ÖRNEK", "In my country, many first-year university students fall into debt."], ["SONUÇ", "A single term of financial education could prevent this."]]}, {"t": "note", "k": "dikkat", "title": "Orta bandda en çok atlanan adım", "lines": ["Neredeyse her zaman ÖRNEK ve SONUÇ adımı eksik kalır. Öğrenci iddia ve gerekçe yazıp durur.", "Bu yüzden paragraflar kısa ve yüzeysel kalır. Kelime sorunu değil, mimari sorunu.", "Kural: her body paragrafında en az bir örnek. Örnek yoksa paragraf bitmemiştir."]}]}, {"id": "t2-g1", "group": "Task 2 Görevleri", "name": "Görev 1. Opinion", "eyebrow": "Task 2 . Yaz", "blocks": [{"t": "task", "title": "Task 2", "lines": ["Some people believe that schools should teach practical skills such as cooking and money management instead of academic subjects like history. To what extent do you agree or disagree? Write at least 250 words."]}, {"t": "note", "k": "ipucu", "title": "Bir taraf", "lines": ["Bütçe yönetimi bilmeyen genç borca giriyor. Örnek: üniversite öğrencilerinin çoğu ilk yılında kredi kartı borcuna giriyor, kimse faizi anlatmadı.", "Pratik beceriler evrenseldir. Herkes yemek yemek ve para harcamak zorunda, ama herkesin tarih bilgisine ihtiyacı yok.", "Okul hayata hazırlamalı. On iki yıl okuyup vergi beyannamesi dolduramayan öğrenci için okul görevini yapmamıştır."]}, {"t": "note", "k": "ipucu", "title": "Diğer taraf", "lines": ["Akademik dersler düşünme biçimi kazandırır. Tarih kanıt değerlendirmeyi ve çelişen anlatıları karşılaştırmayı öğretir.", "Pratik beceri sonradan öğrenilebilir, düşünme biçimi öğrenilemez. Yemek yapmayı bir hafta sonunda öğrenirsin, eleştirel düşünme yıllar alır.", "İşverenler zaten düşünme becerisi arıyor. İlanlarda problem çözme ve analiz isteniyor, yemek pişirme değil."]}, {"t": "note", "k": "dikkat", "title": "Pozisyon önerisi", "lines": ["En güçlü pozisyon: pratik beceriler eklenmeli ama akademik derslerin yerine değil. instead of değil, alongside. Böylece iki tarafı da kullanabilirsin."]}, {"t": "wizard", "prompt": null, "plan": ["Pozisyon. Ne düşünüyorsun", "Body 1. İddia, gerekçe, örnek", "Body 2. İddia, gerekçe, örnek", "Sonuç. Nasıl kapatacaksın"], "target": 250, "check": ["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.", "Pozisyonum giriş paragrafında net.", "Pozisyonum sonuna kadar değişmedi.", "Her body paragrafının tek bir ana fikri var.", "Her ana fikirde gerekçe var.", "Her body paragrafında en az bir örnek var.", "İki tam cümleyi virgülle birleştirmedim.", "However ve therefore öncesine nokta koydum.", "important, good, bad kelimelerini az kullandım.", "Sonuç paragrafı özet değil, yargı.", "En az 250 kelime yazdım."], "model": {"title": "Model cevap (Band 7)", "x": "It is sometimes argued that schools should replace academic subjects such as history with practical skills like cooking and managing money. While I accept that practical skills deserve more attention than they currently receive, I do not believe they should be taught instead of academic ones.\n\nThere is a strong case for practical instruction. Many young people leave school unable to perform basic tasks that adult life demands, from budgeting to preparing a simple meal. In my own country, a large number of first-year university students fall into debt within months, largely because no one has ever explained to them how interest works. A single term devoted to financial literacy could prevent a great deal of later hardship.\n\nNevertheless, abandoning academic subjects would be a serious mistake. Subjects such as history do not merely transmit facts; they train the mind to weigh evidence, compare conflicting accounts and think critically. These habits cannot easily be acquired later, whereas a skill such as cooking can be picked up in a weekend. Employers, moreover, increasingly value exactly the analytical abilities that academic study develops.\n\nThe sensible solution, therefore, is not to choose between the two but to combine them. Schools should make room for practical instruction alongside traditional subjects, not in place of them. In my view, an education that produces young people who can both think critically and manage their own affairs is far stronger than one that sacrifices the first for the second."}}]}, {"id": "t2-g2", "group": "Task 2 Görevleri", "name": "Görev 2. Discussion", "eyebrow": "Task 2 . Yaz", "blocks": [{"t": "task", "title": "Task 2", "lines": ["Some people think that students should study subjects they enjoy, while others believe they should study subjects that are useful for future employment. Discuss both views and give your own opinion. Write at least 250 words."]}, {"t": "note", "k": "ipucu", "title": "Bir taraf", "lines": ["Sevdiğin dersi okumak motivasyon getirir. İlgi duyan öğrenci zorlandığında bırakmaz.", "Sevmediğin bölüm genelde bırakılıyor. Kariyer için seçilen bölümlerde bırakma oranı yüksek, bitmeyen diploma işe yaramaz.", "İlgi zaten pratik bir varlıktır. İlgi seni bitirten şeydir, yani ilgi ile fayda karşıt değil."]}, {"t": "note", "k": "ipucu", "title": "Diğer taraf", "lines": ["Eğitim pahalıdır, hobi gibi görülemez. Çok az aile üniversiteyi hobi olarak finanse edebilir.", "İstihdam edilemeyen diploma güvensizlik yaratır. İşverenin değer vermediği diplomayla mezun olan yıllarca güvencesiz çalışabilir.", "Düşük gelirli aileler için bu tercih değil, hayatta kalma meselesidir. Zengin öğrenci felsefe okuyup risk alabilir, başkası alamaz."]}, {"t": "note", "k": "dikkat", "title": "Pozisyon önerisi", "lines": ["En güçlü pozisyon: bu yanlış bir ikilem. İlgi ile fayda kesişir. Kesişimi ara, kesişim yoksa faydayı seç."]}, {"t": "wizard", "prompt": null, "plan": ["Pozisyon. Ne düşünüyorsun", "Body 1. İddia, gerekçe, örnek", "Body 2. İddia, gerekçe, örnek", "Sonuç. Nasıl kapatacaksın"], "target": 250, "check": ["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.", "Pozisyonum giriş paragrafında net.", "Pozisyonum sonuna kadar değişmedi.", "Her body paragrafının tek bir ana fikri var.", "Her ana fikirde gerekçe var.", "Her body paragrafında en az bir örnek var.", "İki tam cümleyi virgülle birleştirmedim.", "However ve therefore öncesine nokta koydum.", "important, good, bad kelimelerini az kullandım.", "Sonuç paragrafı özet değil, yargı.", "En az 250 kelime yazdım."], "model": {"title": "Model cevap (Band 7)", "x": "People disagree about whether students should choose subjects they find enjoyable or ones likely to lead to a secure job. Both positions have merit, and I will argue that the two are less opposed than they first appear.\n\nThose who favour an enjoyable subject point to motivation. A student who is genuinely interested will read beyond the syllabus, persist when the work becomes difficult, and is far less likely to abandon the course. Dropout rates are often highest among students who chose a field purely for its career prospects and then lost heart, and an unfinished degree serves no one.\n\nOn the other hand, education is expensive, and for many families it cannot be treated as a hobby. A graduate whose qualification is not valued by employers may spend years in insecure work, and for students from low-income backgrounds this is not an abstract risk but a matter of survival. A wealthy student can afford to study philosophy for its own sake; others cannot.\n\nIn my view, this is a false choice. Interest and usefulness frequently overlap, and the wisest approach is to look for that overlap first. A student fascinated by biology can train as a doctor; one who loves writing can enter journalism or law. Where no overlap exists, practical considerations should probably take priority, since a degree that leads nowhere benefits neither the student nor society."}}]}, {"id": "t2-g3", "group": "Task 2 Görevleri", "name": "Görev 3. Advantages / Disadvantages", "eyebrow": "Task 2 . Yaz", "blocks": [{"t": "task", "title": "Task 2", "lines": ["More and more people are working from home rather than in an office. Do the advantages of this development outweigh the disadvantages? Write at least 250 words."]}, {"t": "note", "k": "ipucu", "title": "Avantajlar", "lines": ["Yol süresi kazanılır. İstanbul'da bir çalışan günde iki saat yolda geçiriyor, bu süre spora veya uykuya gider.", "Esneklik, özellikle ebeveynler ve sağlık sorunu olanlar için. Çocuğunu okuldan alabilen ebeveyn işe devam edebilir.", "Şirket maliyeti düşer, daha geniş havuzdan işe alım yapılır. Ofis kirası ödemeyen şirket başka şehirden çalışan alabilir."]}, {"t": "note", "k": "ipucu", "title": "Dezavantajlar", "lines": ["İzolasyon. Meslektaşlarıyla hiç görüşmeyen çalışan aidiyetini kaybeder.", "İş ve ev sınırı kayboluyor. Laptop hep salonda duruyorsa iş günü bitmiyor.", "Genç çalışan öğrenemiyor. Meslek deneyimli meslektaşı izleyerek öğrenilir, bu online yapılamaz."]}, {"t": "note", "k": "dikkat", "title": "Pozisyon önerisi", "lines": ["En güçlü pozisyon: avantajlar ağır basar, çünkü dezavantajlar yönetilebilir (hibrit model, net çalışma saati), avantajlar ise yapısaldır."]}, {"t": "wizard", "prompt": null, "plan": ["Pozisyon. Ne düşünüyorsun", "Body 1. İddia, gerekçe, örnek", "Body 2. İddia, gerekçe, örnek", "Sonuç. Nasıl kapatacaksın"], "target": 250, "check": ["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.", "Pozisyonum giriş paragrafında net.", "Pozisyonum sonuna kadar değişmedi.", "Her body paragrafının tek bir ana fikri var.", "Her ana fikirde gerekçe var.", "Her body paragrafında en az bir örnek var.", "İki tam cümleyi virgülle birleştirmedim.", "However ve therefore öncesine nokta koydum.", "important, good, bad kelimelerini az kullandım.", "Sonuç paragrafı özet değil, yargı.", "En az 250 kelime yazdım."], "model": {"title": "Model cevap (Band 7)", "x": "An increasing number of people now work from home rather than commuting to an office. In my opinion, although this shift brings real drawbacks, its advantages clearly outweigh them.\n\nThe benefits are considerable. The most obvious is the time saved. A worker in a city such as Istanbul may spend two hours a day travelling, and reclaiming those hours for exercise, family or rest improves both health and morale. Home working also offers flexibility that particularly helps parents and people with health conditions, while employers who save on office space can recruit from a far wider pool of talent.\n\nThe disadvantages, however, are genuine. Employees who rarely see their colleagues can feel isolated and lose their sense of belonging to a team. The boundary between work and home also tends to dissolve: when the laptop is always on the kitchen table, the working day never truly ends. Younger employees may suffer most, since much of a profession is learned by watching experienced colleagues.\n\nYet these problems can largely be managed. A hybrid model that combines home and office days restores social contact, and clear rules about working hours protect personal time. The core advantages, by contrast, are structural and do not disappear. On balance, therefore, the move towards home working is a positive development, provided that companies take deliberate steps to soften its weaknesses."}}]}, {"id": "t2-g4", "group": "Task 2 Görevleri", "name": "Görev 4. Problem / Solution", "eyebrow": "Task 2 . Yaz", "blocks": [{"t": "task", "title": "Task 2", "lines": ["Traffic congestion is becoming a serious problem in many large cities. What are the main causes of this problem and what measures could be taken to solve it? Write at least 250 words."]}, {"t": "note", "k": "ipucu", "title": "Sebepler", "lines": ["Sebep: özel araç sahipliği artıyor. Gelir arttıkça araba ulaşılabilir hale geliyor, yollar daha küçük bir nüfus için tasarlanmıştı.", "Sebep: toplu taşıma yetersiz. Metro ve otobüs dış mahallelere ulaşmıyor, orada oturanın alternatifi yok.", "Sebep: şehir planlaması dağıtık. Konut, işyeri ve okul birbirinden uzaksa uzun yolculuk kaçınılmaz."]}, {"t": "note", "k": "ipucu", "title": "Çözümler", "lines": ["Çözüm: raylı sisteme yatırım. Çok sayıda insanı yola araç eklemeden taşır, ilk adım budur.", "Çözüm: tıkanma ücreti, ama önce alternatif olmalı. Londra bunu yaptı, metro varken işe yarar.", "Çözüm: karma kullanımlı planlama. Konut ve işyeri yakınlaştırılırsa yolculuk ihtiyacı kalkar."]}, {"t": "note", "k": "dikkat", "title": "Pozisyon önerisi", "lines": ["Bu soruda pozisyon değil, eşleşme gerekir. Her çözüm bir sebebe cevap versin. En çok puan getiren hamle budur."]}, {"t": "wizard", "prompt": null, "plan": ["Pozisyon. Ne düşünüyorsun", "Body 1. İddia, gerekçe, örnek", "Body 2. İddia, gerekçe, örnek", "Sonuç. Nasıl kapatacaksın"], "target": 250, "check": ["Soruyu tekrar okudum. İki şey soruyorsa ikisini de cevapladım.", "Pozisyonum giriş paragrafında net.", "Pozisyonum sonuna kadar değişmedi.", "Her body paragrafının tek bir ana fikri var.", "Her ana fikirde gerekçe var.", "Her body paragrafında en az bir örnek var.", "İki tam cümleyi virgülle birleştirmedim.", "However ve therefore öncesine nokta koydum.", "important, good, bad kelimelerini az kullandım.", "Sonuç paragrafı özet değil, yargı.", "En az 250 kelime yazdım."], "model": {"title": "Model cevap (Band 7)", "x": "Traffic congestion has become a serious problem in many large cities. This essay will examine its principal causes and suggest measures that could realistically address them.\n\nThe first cause is the steady rise in private car ownership. As incomes grow, a car becomes both affordable and desirable, yet the roads of most cities were designed for a far smaller population. A second, related cause is the inadequacy of public transport: in many cities the metro and bus networks do not reach outer districts, leaving residents there with no genuine alternative to driving. Finally, dispersed planning means that homes, workplaces and schools are located far apart, making long daily journeys unavoidable.\n\nFortunately, each cause points towards a solution. The most effective response to rising car use is heavy investment in rail-based transport, which moves large numbers of people without adding vehicles to the road. Where a reliable network already exists, a congestion charge can discourage unnecessary driving, as London has shown; without such an alternative, however, the charge is merely a penalty. Dispersed planning can be tackled through mixed-use development, which places housing and workplaces close together so that the need to travel is reduced rather than shifted.\n\nThe key, in my view, is to match each solution to a cause rather than relying on a single measure. Congestion is the product of several overlapping pressures, and only a combination of better public transport, sensible pricing and smarter planning is likely to relieve it."}}]}, {"id": "t1-band", "group": "Task 1", "name": "Band Descriptor (Task 1)", "eyebrow": "Task 1", "blocks": [{"t": "p", "x": "Değerlendirici dört ölçüte bakar. Band 6 ile 7 arasındaki farkı bilirsen puanını nerede kaybettiğini görürsün."}, {"t": "table", "head": ["Ölçüt", "Band 5", "Band 6", "Band 7"], "rows": [["Task Achievement", "Overview yok veya yetersiz. Detaylar mekanik, bazı veriler yanlış aktarılmış.", "Overview var, ana özellikler seçilmiş. Detaylar bazen yetersiz veya hatalı.", "Net overview, ana özellikler açıkça seçilip vurgulanmış ve iyi geliştirilmiş."], ["Coherence and Cohesion", "Bağlaçlar mekanik veya yanlış, paragraflama zayıf.", "Bilgi mantıklı sıralanmış, bağlaçlar var ama bazen hatalı.", "Mantıklı akış, çeşitli ve doğru bağlaç, açık paragraf yapısı."], ["Lexical Resource", "Sınırlı kelime, sık tekrar, hatalar anlamı zorlar.", "Yeterli kelime, bazı hatalar var ama iletişimi bozmaz.", "Çeşitli kelime, bazı az kullanılan ifadeler, nadir hata."], ["Grammatical Range and Accuracy", "Sınırlı yapı, sık hata.", "Basit ve karmaşık yapı karışık, hatalar nadiren iletişimi bozar.", "Çeşitli karmaşık yapı, cümlelerin çoğu hatasız."]]}, {"t": "note", "k": "ipucu", "title": "Band 6'dan 7'ye", "lines": ["Overview'ü keskinleştir, bir oran ifadesi ekle, aynı fiili tekrar etme, iki karmaşık cümleyi hatasız kur. Fark çoğu zaman burada."]}]}, {"id": "t1-overview", "group": "Task 1", "name": "Overview Drilli", "eyebrow": "Task 1 . Yaz", "blocks": [{"t": "p", "x": "En yüksek değerli beceriyi izole et. Aşağıdaki veriye SADECE overview cümlesini yaz. Sayı verme, genel eğilimi ve sıralamayı söyle. Sonra modeli aç, karşılaştır."}, {"t": "task", "title": "Veri 1", "lines": ["Bar chart: kişi başı yıllık kahve tüketimi, 2020. Finland 12 kg, Italy 5.9 kg, Brazil 5.5 kg, USA 4.7 kg, Japan 3.4 kg."]}, {"t": "wizard", "prompt": null, "target": 30, "check": ["Sayı kullanmadım.", "Genel eğilimi veya en yüksek/en düşüğü söyledim.", "Bir karşılaştırma kurdum."], "model": {"title": "Model overview", "x": "Overall, Finland consumed considerably more coffee per person than any other country shown, more than twice the level of the next highest, whereas Japan recorded the lowest figure of all."}}, {"t": "task", "title": "Veri 2", "lines": ["Line graph: işsizlik oranı 2010-2020, iki ülke. A ülkesi yüzde 9'dan yüzde 4'e düştü. B ülkesi yüzde 5'ten yüzde 8'e çıktı."]}, {"t": "wizard", "prompt": null, "target": 30, "check": ["Sayı kullanmadım.", "İki ülkenin zıt yönde hareket ettiğini söyledim.", "Dönem sonundaki durumu belirttim."], "model": {"title": "Model overview", "x": "Overall, the two countries moved in opposite directions over the decade: unemployment fell steadily in Country A but rose in Country B, so that their positions had effectively reversed by 2020."}}, {"t": "task", "title": "Veri 3", "lines": ["Process diagram: ekmek yapımı. Karıştır, yoğur, mayalanmaya bırak, pişir, soğut."]}, {"t": "wizard", "prompt": null, "target": 30, "check": ["Kaç aşama olduğunu söyledim.", "Sürecin doğrusal mı döngüsel mi olduğunu belirttim.", "Başlangıç ve bitişi verdim."], "model": {"title": "Model overview", "x": "Overall, the process of making bread is linear and consists of five main stages, beginning with the mixing of the ingredients and ending with the baked loaf being left to cool."}}]}, {"id": "t2-band", "group": "Task 2", "name": "Band Descriptor (Task 2)", "eyebrow": "Task 2", "blocks": [{"t": "p", "x": "Task 2 ölçütleri Task 1'e benzer, tek fark ilk ölçüt Task Response'tur: soruyu ne kadar tam cevapladın ve pozisyonun ne kadar net."}, {"t": "table", "head": ["Ölçüt", "Band 5", "Band 6", "Band 7"], "rows": [["Task Response", "Soruya kısmen cevap, pozisyon belirsiz, fikirler geliştirilmemiş.", "Soruya cevap veriyor, pozisyon var ama yer yer belirsizleşir, bazı fikirler yetersiz gelişmiş.", "Soruya tam cevap, net ve tutarlı pozisyon, fikirler genişletilip desteklenmiş."], ["Coherence and Cohesion", "Bağlaçlar mekanik veya yanlış, paragraflama zayıf.", "Mantıklı düzen, bağlaçlar var ama bazen hatalı, paragraflar bazen dengesiz.", "Fikirler mantıkla sıralanmış, her paragrafın net bir merkez fikri var."], ["Lexical Resource", "Sınırlı kelime, sık tekrar.", "Yeterli kelime, konuya uygun, bazı hatalar.", "Yeterince geniş kelime, bazı az kullanılan ifadeler, nadir hata."], ["Grammatical Range and Accuracy", "Sınırlı yapı, sık hata.", "Basit ve karmaşık yapı karışık, hatalar iletişimi nadiren bozar.", "Çeşitli karmaşık yapı, cümlelerin çoğu hatasız."]]}, {"t": "note", "k": "dikkat", "title": "En sık Band 6 tavanı", "lines": ["Pozisyonun sonuca doğru bulanıklaşıyorsa Task Response 6'da kalır. Girişte aldığın tutumu sonuçta aynen tekrarla.", "Örneksiz paragraf fikri geliştirmemiş sayılır ve bu da 6 tavanıdır."]}]}, {"id": "t2-bank", "group": "Task 2", "name": "Fikir ve Kelime Bankası", "eyebrow": "Task 2", "blocks": [{"t": "p", "x": "Tema bazlı fikir ve kelime. Kopyalama, kendi cümlene çevir. Amaç boş sayfaya bakıp donmayı engellemek."}, {"t": "table", "head": ["Tema", "Kullanışlı kelime ve ifadeler"], "rows": [["Education", "critical thinking, rote learning, well-rounded, tuition fees, vocational training, lifelong learning, academic pressure"], ["Technology", "automation, screen time, digital literacy, misinformation, privacy, dependence on devices, remote access"], ["Environment", "carbon emissions, renewable energy, single-use plastic, conservation, sustainable, biodiversity, ecological footprint"], ["Health", "sedentary lifestyle, preventive care, mental wellbeing, processed food, public healthcare, work-life balance"], ["Work", "job security, remote working, automation, skills gap, productivity, burnout, the gig economy"], ["Crime and society", "deterrent, rehabilitation, root causes, community, surveillance, social inequality, public safety"]]}, {"t": "table", "head": ["İşlev", "Bağlayıcı ifadeler"], "rows": [["Görüş belirtme", "In my view, It seems to me that, I would argue that"], ["Karşıt görüş", "Admittedly, It is true that, Critics might argue"], ["Gerekçe", "This is largely because, The main reason is that, owing to"], ["Örnek", "For instance, A clear example of this is, as can be seen in"], ["Sonuç", "Consequently, As a result, This means that"], ["Kapanış", "On balance, Taking everything into account, In conclusion"]]}, {"t": "note", "k": "ipucu", "title": "Kural", "lines": ["Bir fikir seç, kendi cümlenle yaz ve kendi örneğini ekle. Ezberlenmiş kalıp cümleler puan getirmez, kendi ürettiğin örnek getirir."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "p", "x": "Yazmadan önce ve yazarken aklında tutacağın yüksek getirili kurallar."}, {"t": "note", "k": "dikkat", "title": "Task 1", "lines": ["Overview olmadan Band 6 yok. Ayrı bir paragraf olsun ve içinde sayı olmasın.", "Aynı artış veya düşüş fiilini iki kez kullanma. Her Task 1'de en az bir oran ifadesi kullan.", "Yorum yapma, sebep açıklama, görüş bildirme. Grafik anlatılır, yorumlanmaz.", "Bütün sayıları değil, seçilmiş sayıları yaz. Seçmek bir beceridir ve puanlanır."]}, {"t": "note", "k": "dikkat", "title": "Task 2", "lines": ["Pozisyonun girişte net olsun ve sonuna kadar değişmesin.", "Her body paragrafında en az bir örnek. Örnek yoksa paragraf bitmemiştir.", "İki tam cümleyi virgülle birleştirme. However ve therefore öncesine nokta koy.", "Sonuç paragrafı özet değil yargı olmalı."]}, {"t": "note", "k": "ipucu", "title": "Zaman", "lines": ["Task 1 için 20 dakika, Task 2 için 40 dakika. Task 2 daha çok puan getirir, önce onu düşün.", "Task 1'de 150, Task 2'de 250 kelime alt sınır. Aşağısı ceza, çok yukarısı zaman kaybı."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz">`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
