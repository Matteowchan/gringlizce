 en çok puan kaybettiren tek nokta budur. Dört adımla çözülür."}, {"t": "note", "k": "karar", "title": "Dört adım", "lines": ["1. Metinde bu konu geçiyor mu. Geçmiyorsa NOT GIVEN. Karar bitti.", "2. Geçiyorsa, metin ifadenin AYNISINI mı söylüyor. Evet ise TRUE.", "3. Metin ifadenin TERSİNİ mi söylüyor. Evet ise FALSE.", "4. Metin konudan bahsediyor ama bu özel iddiaya girmiyorsa NOT GIVEN."]}, {"t": "note", "k": "dikkat", "title": "Not Given ile False farkı", "lines": ["FALSE: metin bunun TERSİNİ söylüyor. Bir karşıtlık var.", "NOT GIVEN: metin bu konuda HİÇBİR ŞEY söylemiyor. Bilgi yok.", "Kendi bilgin işin içine girmesin. İfade dünyada doğru olabilir ama metinde yoksa NOT GIVEN'dır."]}, {"t": "note", "k": "ipucu", "title": "İki küçük kural, çok puan", "lines": ["some ile all farklıdır. Metin some diyorsa ve ifade all diyorsa cevap FALSE'tur, NOT GIVEN değil.", "may ile will farklıdır. Metin may diyorsa ve ifade will diyorsa cevap FALSE'tur."]}]}, {"id": "tfng-pratik", "name": "Alıştırma: True False Not Given", "blocks": [{"t": "p", "x": "Metni oku. Yedi ifade için karar ver. Kararını dört adım testiyle gerekçelendir."}], "passage": ["The Arctic tern makes the longest migration of any animal. Each year it travels from its breeding grounds in the Arctic to the Antarctic and back, a round trip of around 70,000 kilometres. Researchers tracked eleven birds using tiny devices attached to their legs. The study revealed that the terns do not fly in a straight line but follow winding routes that take advantage of prevailing winds. Some birds stopped in the North Atlantic for around a month before continuing south. The reason for this stop is still debated among scientists."], "groups": [{"type": "tf", "instr": "Metne göre karar ver.", "items": [{"n": 1, "label": "The Arctic tern travels further each year than any other animal.", "ans": "TRUE", "why": "Metin longest migration of any animal diyor. En uzun göç = herkesten uzağa. TRUE."}, {"n": 2, "label": "Researchers tracked more than twenty birds.", "ans": "FALSE", "why": "Metin tracked eleven birds diyor. On bir, yirmiden fazla değil. FALSE."}, {"n": 3, "label": "The terns fly directly from the Arctic to the Antarctic.", "ans": "FALSE", "why": "Metin do not fly in a straight line, winding routes diyor. Directly ile çelişir. FALSE."}, {"n": 4, "label": "The devices attached to the birds were expensive.", "ans": "NOT GIVEN", "why": "Cihazların fiyatı hakkında metinde hiçbir bilgi yok. NOT GIVEN."}, {"n": 5, "label": "All the tracked birds stopped in the North Atlantic.", "ans": "FALSE", "why": "Metin Some birds stopped diyor. some ile all farkı: FALSE, NOT GIVEN değil."}, {"n": 6, "label": "Scientists agree on why the birds stop in the North Atlantic.", "ans": "FALSE", "why": "Metin the reason is still debated diyor. still debated ile agree karşıttır. FALSE."}, {"n": 7, "label": "Arctic terns live longer than most seabirds.", "ans": "NOT GIVEN", "why": "Ömür karşılaştırması metinde geçmiyor. NOT GIVEN."}]}]}, {"id": "heading-pratik", "name": "Alıştırma: Matching Headings", "blocks": [{"t": "p", "x": "Paragrafın ana fikri, içindeki en çarpıcı detay değildir. İlk ve son cümle genelde ana fikri taşır. Aşağıda beş paragrafın özeti var. Her paragrafa uygun başlığı seç. İki başlık fazladır."}], "groups": [{"type": "select", "variant": "heading", "instr": "Her paragraf için doğru başlığı seç. İki başlık fazladır.", "options": [{"k": "i", "label": "The economic cost of the problem"}, {"k": "ii", "label": "How the material was first discovered"}, {"k": "iii", "label": "Why recycling has not solved the issue"}, {"k": "iv", "label": "Public attitudes are beginning to shift"}, {"k": "v", "label": "A material that changed manufacturing"}, {"k": "vi", "label": "Alternatives now under development"}, {"k": "vii", "label": "Government responses so far"}], "items": [{"n": 1, "label": "A. Few inventions have reshaped industry as completely as plastic. Within decades it had replaced wood, metal and glass in countless products.", "ans": "v", "why": "reshaped industry, replaced wood metal glass = üretimi değiştiren malzeme. v."}, {"n": 2, "label": "B. In theory, most plastics can be recycled. In practice, only a small fraction ever is, because sorting is expensive and contaminated material is worthless.", "ans": "iii", "why": "In theory recycled, in practice only a small fraction = geri dönüşüm neden çözmedi. iii."}, {"n": 3, "label": "C. Surveys suggest that consumers are increasingly uncomfortable with single-use packaging. Retailers report growing demand for refillable containers.", "ans": "iv", "why": "consumers increasingly uncomfortable, growing demand = kamuoyu değişiyor. iv."}, {"n": 4, "label": "D. Several laboratories are now testing polymers derived from plant starch. Early results are promising, though costs remain high.", "ans": "vi", "why": "laboratories testing polymers, alternatives = geliştirilen alternatifler. vi."}, {"n": 5, "label": "E. Dozens of countries have introduced bans on plastic bags. Enforcement, however, varies enormously from one region to another.", "ans": "vii", "why": "countries introduced bans = hükümet tepkileri. vii."}]}]}, {"id": "paraphrase", "name": "Paraphrase Avı", "blocks": [{"t": "p", "x": "Soruda geçen kelime metinde neredeyse hiç geçmez. Soruyu okurken anahtar kelimeyi bul, sonra metinde o kelimeyi ARAMA. Onun eşanlamlısını ara. IELTS soruyu bilerek başka kelimelerle yazar."}, {"t": "table", "head": ["Soruda geçen", "Metinde muhtemelen böyle yazar"], "rows": [["reduce", "cut, lower, bring down, decrease, curb"], ["important", "significant, crucial, vital, key"], ["cause", "lead to, result in, bring about, trigger"], ["increase", "rise, grow, climb, expand, a surge in"], ["expensive", "costly, pricey, at considerable expense"], ["many", "numerous, a great deal of, countless"], ["show", "reveal, indicate, demonstrate, point to"], ["problem", "issue, difficulty, obstacle, drawback"]]}, {"t": "note", "k": "taktik", "title": "Aranmayacak ve aranacak kelimeler", "lines": ["Metinde DEĞİŞMEYEN kelimeler: özel isimler, tarihler, sayılar, teknik terimler. Bunları ara, çabuk bulunur.", "Metinde MUTLAKA DEĞİŞEN kelimeler: fiiller, sıfatlar, genel isimler. Bunları arama, eşanlamlısını bekle.", "Soruda 1997 ve difficult varsa, metinde 1997'yi ara. difficult yerine challenging yazacak."]}]}, {"id": "protokol", "name": "Çalışma Protokolü", "blocks": [{"t": "p", "x": "Test çözmek öğretmez. Test analiz etmek öğretir. Önemli olan kaç test çözdüğün değil, her testten sonra ne yaptığın."}, {"t": "table", "head": ["Adım", "Ne yapılır"], "rows": [["Önce", "Bir tam test çöz. Sınav süresinde, duraksız, telefon uzakta."], ["Sonra", "Cevabı kontrol et. Yanlışları işaretle."], ["Asıl iş", "Her yanlış için metne dön ve doğru cevabın nerede olduğunu BUL."], ["Soru", "Bu soruyu neden kaçırdım. Kelime mi bilmedim. Paraphrase'i mi göremedim. Zaman mı yetmedi. Tuzağa mı düştüm."]]}, {"t": "note", "k": "dikkat", "title": "Yapılmayacaklar", "lines": ["Testi yarım bırakıp cevaplara bakmak. Sınavda o şansın yok.", "Aynı testi ikinci kez çözmek. Cevapları hatırlarsın, sonuç yanıltır.", "Bir oturuşta birden fazla tam test çözmek. Analiz edilmeyen test boşa gider."]}]}, {"id": "ipucu", "name": "İpuçları ve Tuzaklar", "blocks": [{"t": "p", "x": "Teste girmeden aklında tutacağın yüksek getirili kurallar."}, {"t": "note", "k": "dikkat", "title": "Karar", "lines": ["Not Given ile False'u karıştırma. False tersini söyler, Not Given hiç söylemez.", "some ile all farklıdır. Metin some diyorsa ifade all diyorsa cevap FALSE'tur.", "Şıktaki doğru kelimeler yanlış ilişkiyle birleştirilir. Kelimeye değil ilişkiye bak."]}, {"t": "note", "k": "ipucu", "title": "Yöntem", "lines": ["Kelimeyi arama, eşanlamlısını ara. Özel isim, tarih ve sayı değişmez, önce onları bul.", "Çoğu soru tipi metni takip eder. Matching headings ve matching information sırasızdır, ikisini de sona bırak."]}, {"t": "note", "k": "ipucu", "title": "Zaman", "lines": ["Passage 1'de tam puan hedefle, Passage 3'te ulaşabildiğini al.", "Cevabı bulur bulmaz yaz, Reading'de transfer süresi yoktur.", "Emin değilsen boş bırakma, bir tahmin yaz."]}]}, {"id": "drill-tfng", "sec": "Soru Tipi Drilleri", "name": "Drill: True False Not Given", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["Metin ne diyor, ona bak. Tersini söylüyorsa FALSE, hiç söylemiyorsa NOT GIVEN.", "some/all ve may/will farkına dikkat."]}], "passage": ["The tomato was brought to Europe from South America in the sixteenth century. For nearly two hundred years, many Europeans refused to eat it, believing it to be poisonous. This suspicion was not entirely unfounded: the plant belongs to the nightshade family, and its leaves and stems do contain toxic compounds. Wealthy families sometimes fell ill after eating tomatoes, though the true cause was the pewter plates of the time, which released lead when they touched the acidic fruit. It was only in the nineteenth century, when the tomato became central to southern Italian cooking, that it was widely accepted across the continent."], "groups": [{"type": "tf", "instr": "Metne göre karar ver.", "items": [{"n": 1, "label": "The tomato was first grown in Europe.", "ans": "FALSE", "why": "brought to Europe from South America. Avrupa'da yetişmedi. FALSE."}, {"n": 2, "label": "Some Europeans thought the tomato was dangerous to eat.", "ans": "TRUE", "why": "believing it to be poisonous. TRUE."}, {"n": 3, "label": "The leaves of the tomato plant contain harmful substances.", "ans": "TRUE", "why": "leaves and stems do contain toxic compounds. TRUE."}, {"n": 4, "label": "Wealthy families became ill because the fruit itself was poisonous.", "ans": "FALSE", "why": "the true cause was the pewter plates (lead), meyve değil. FALSE."}, {"n": 5, "label": "Pewter plates were more expensive than other plates.", "ans": "NOT GIVEN", "why": "Fiyat karşılaştırması yok. NOT GIVEN."}, {"n": 6, "label": "The tomato became popular in Europe through Italian cooking.", "ans": "TRUE", "why": "central to southern Italian cooking... widely accepted. TRUE."}]}]}, {"id": "drill-ynng", "sec": "Soru Tipi Drilleri", "name": "Drill: Yes No Not Given", "blocks": [{"t": "note", "k": "karar", "title": "Kural", "lines": ["YNNG yazarın GÖRÜŞÜNE bakar, olguya değil.", "Yazar bir şeyi kabul edip sınırlıyorsa dikkatli oku."]}], "passage": ["In my view, the current obsession with measuring everything a child does at school has gone too far. Regular testing, its defenders argue, keeps standards high and tells parents how their children are progressing. There is some truth in this. But a test measures only what is easy to measure, and the most important qualities a school can develop, such as curiosity and resilience, slip through the net entirely. Worse, when a number becomes the goal, teaching narrows to whatever the number rewards. I do not deny that some assessment is necessary. I argue only that we have crossed the line from useful information into harmful distraction."], "groups": [{"type": "yn", "instr": "Yazarın görüşüne göre karar ver.", "items": [{"n": 1, "label": "The writer believes schools test children too much.", "ans": "YES", "why": "the obsession with measuring... has gone too far. YES."}, {"n": 2, "label": "Testing gives parents no useful information at all.", "ans": "NO", "why": "tells parents how children are progressing; there is some truth. NO."}, {"n": 3, "label": "Curiosity is easy to measure with a test.", "ans": "NO", "why": "curiosity... slips through the net; test only easy things. NO."}, {"n": 4, "label": "The writer thinks all assessment should be abolished.", "ans": "NO", "why": "some assessment is necessary. NO."}, {"n": 5, "label": "Teachers deliberately narrow their teaching to cheat tests.", "ans": "NOT GIVEN", "why": "teaching narrows ama deliberately/cheat yazar demez. NOT GIVEN."}, {"n": 6, "label": "The writer regards the current situation as harmful.", "ans": "YES", "why": "harmful distraction. YES."}]}]}, {"id": "drill-heading", "sec": "Soru Tipi Drilleri", "name": "Drill: Matching Headings", "blocks": [{"t": "note", "k": "ipucu", "title": "Kural", "lines": ["Paragrafın ana fikri, en çarpıcı detay değil. İlk ve son cümleye bak.", "Başlıkları önce oku, iki başlık fazladır."]}], "passage": ["A. The idea was born in 2007, when two friends in San Francisco, short of money, rented out air mattresses in their flat to visitors attending a conference.", "B. The company itself owns no property. It simply connects guests with hosts and takes a percentage of each booking, a model that keeps its costs remarkably low.", "C. For many owners, the appeal is straightforward. A spare room that once sat empty now brings in enough to cover a mortgage payment or fund a holiday.", "D. Critics point to the effect on housing. In popular districts, flats that would once have been rented to residents are now let to tourists, driving up prices for locals.", "E. Regulation has struggled to keep pace. Some cities cap the number of nights a property can be let, others require a licence, and a few have banned the practice almost entirely."], "groups": [{"type": "select", "variant": "heading", "instr": "Her paragraf için doğru başlığı seç. İki başlık fazladır.", "options": [{"k": "i", "label": "A hobby that became an industry"}, {"k": "ii", "label": "The problem of fake reviews"}, {"k": "iii", "label": "How the platform makes money"}, {"k": "iv", "label": "Concerns about the effect on cities"}, {"k": "v", "label": "The origins of the idea"}, {"k": "vi", "label": "Rules that vary by country"}, {"k": "vii", "label": "Why hosts take part"}], "items": [{"n": 1, "label": "Paragraph A", "ans": "v", "why": "born in 2007... rented out air mattresses = fikrin kökeni. v."}, {"n": 2, "label": "Paragraph B", "ans": "iii", "why": "takes a percentage of each booking = platform nasıl para kazanır. iii."}, {"n": 3, "label": "Paragraph C", "ans": "vii", "why": "the appeal for owners... brings in enough = ev sahipleri neden katılır. vii."}, {"n": 4, "label": "Paragraph D", "ans": "iv", "why": "effect on housing, prices for locals = şehirlere etki kaygısı. iv."}, {"n": 5, "label": "Paragraph E", "ans": "vi", "why": "some cities cap... others require a licence = ülkeye göre değişen kurallar. vi."}]}]}, {"id": "drill-info", "sec": "Soru Tipi Drilleri", "name": "Drill: Matching Information", "blocks": [{"t": "note", "k": "ipucu", "title": "Kural", "lines": ["Sıra takip etmez, her paragrafa bakman gerekir. En zor tip.", "Bir harf birden çok kez kullanılabilir."]}], "passage": ["A. Coffee was first cultivated in the highlands of Ethiopia, where wild plants still grow today. From there it spread to Yemen, where it was brewed as a drink by the fifteenth century.", "B. The plant is fussy about climate. It needs warmth, steady rainfall and no frost, conditions found mainly in a band of countries near the equator known as the coffee belt.", "C. Once picked, the red cherries must be processed within hours, either by drying them in the sun or by washing away the pulp with water.", "D. Prices paid to growers swing wildly from year to year, and a farmer who does well in one season may struggle to cover costs in the next."], "groups": [{"type": "select", "variant": "info", "instr": "Hangi paragrafta hangi bilgi var? A-D. Bir harf birden çok kez kullanılabilir.", "options": [{"k": "A", "label": "A"}, {"k": "B", "label": "B"}, {"k": "C", "label": "C"}, {"k": "D", "label": "D"}], "items": [{"n": 1, "label": "a description of where coffee originally grew", "ans": "A", "why": "first cultivated in the highlands of Ethiopia. A."}, {"n": 2, "label": "the climate conditions the plant requires", "ans": "B", "why": "needs warmth, steady rainfall and no frost. B."}, {"n": 3, "label": "how the harvested fruit is treated", "ans": "C", "why": "cherries must be processed... drying or washing. C."}, {"n": 4, "label": "a reference to the instability of growers' incomes", "ans": "D", "why": "prices swing wildly... struggle to cover costs. D."}, {"n": 5, "label": "a mention of an early coffee-drinking region", "ans": "A", "why": "Yemen, brewed as a drink by the fifteenth century. A."}]}]}, {"id": "drill-features", "sec": "Soru Tipi Drilleri", "name": "Drill: Matching Features", "blocks": [{"t": "note", "k": "ipucu", "title": "Kural", "lines": ["İsimleri metinde işaretle, sonra sadece o çevreleri oku.", "İfade ile ismi eşleştir, tüm metni tekrar okuma."]}], "passage": ["Three figures shaped early cinema. The Lumiere brothers, working in France, saw film as a way of recording real life and made short scenes of workers and trains. Georges Melies, a former magician, took the opposite view and used the camera to create fantasy, pioneering special effects. In the United States, D. W. Griffith cared less about realism or spectacle and more about storytelling, developing techniques of editing that let a film hold an audience through a long narrative."], "groups": [{"type": "select", "variant": "features", "instr": "Her ifadeyi doğru kişiyle eşleştir, A, B veya C.", "options": [{"k": "A", "label": "A. The Lumiere brothers"}, {"k": "B", "label": "B. Georges Melies"}, {"k": "C", "label": "C. D. W. Griffith"}], "items": [{"n": 1, "label": "used film to show everyday reality", "ans": "A", "why": "Lumiere: recording real life, workers and trains. A."}, {"n": 2, "label": "focused on telling a long story", "ans": "C", "why": "Griffith: storytelling, long narrative. C."}, {"n": 3, "label": "came from a background in magic", "ans": "B", "why": "Melies, a former magician. B."}, {"n": 4, "label": "developed early special effects", "ans": "B", "why": "Melies: pioneering special effects. B."}, {"n": 5, "label": "advanced the art of editing", "ans": "C", "why": "Griffith: techniques of editing. C."}]}]}, {"id": "drill-completion", "sec": "Soru Tipi Drilleri", "name": "Drill: Sentence Completion", "blocks": [{"t": "note", "k": "ipucu", "title": "Kural", "lines": ["Boşluk için ne tür kelime gerektiğini önce tahmin et: isim, sayı, tarih.", "Kelime sınırına uy, metinden birebir yaz."]}], "passage": ["The Eden Project in Cornwall was built in a disused clay pit. Its most striking features are two enormous domes, known as biomes, each made from hexagonal panels of a light, transparent plastic rather than glass. The larger biome recreates a tropical rainforest and is kept hot and humid all year round. The smaller one holds plants from Mediterranean climates. The site opened in 2001 and has since become one of the region's most visited attractions."], "groups": [{"type": "gap", "instr": "Cümleleri tamamla. Metinden NO MORE THAN TWO WORDS AND/OR A NUMBER.", "items": [{"n": 1, "label": "The Eden Project was constructed in a former", "ans": ["clay pit", "disused clay pit"], "why": "built in a disused clay pit. clay pit."}, {"n": 2, "label": "The domes are covered with panels made of ______ instead of glass.", "ans": ["transparent plastic", "plastic"], "why": "panels of a light, transparent plastic rather than glass. transparent plastic."}, {"n": 3, "label": "The two large structures are called", "ans": ["biomes"], "why": "two enormous domes, known as biomes. biomes."}, {"n": 4, "label": "The larger biome recreates a", "ans": ["tropical rainforest", "rainforest"], "why": "recreates a tropical rainforest. tropical rainforest."}, {"n": 5, "label": "The attraction first opened in", "ans": ["2001"], "why": "opened in 2001. 2001."}]}]}, {"id": "drill-mcq", "sec": "Soru Tipi Drilleri", "name": "Drill: Multiple Choice", "blocks": [{"t": "note", "k": "ipucu", "title": "Kural", "lines": ["Yanlış şık doğru kelimeleri yanlış ilişkiyle birleştirir. İlişkiye bak.", "Doğru şık genelde en uzun şık değildir."]}], "passage": ["The idea that we only use ten per cent of our brains is one of the most persistent myths in popular science. It appears in advertisements, self-help books and films, usually alongside the promise that the other ninety per cent can be unlocked. Neurologists find the claim baffling. Brain scans show activity across the whole organ, even during sleep, and there is no dormant region waiting to be switched on. Damage to almost any part of the brain produces some loss of function, which would be impossible if most of it did nothing. The myth's appeal is not scientific but emotional: it suggests a hidden reserve of untapped potential, a more impressive version of ourselves just out of reach."], "groups": [{"type": "mcq", "instr": "Doğru harfi seç, A, B, C veya D.", "items": [{"n": 1, "label": "According to the passage, the ten per cent myth is", "choices": {"A": "rarely encountered today.", "B": "supported by recent brain scans.", "C": "found in many kinds of media.", "D": "accepted by most neurologists."}, "ans": "C", "why": "appears in advertisements, self-help books and films."}, {"n": 2, "label": "Brain scans show that", "choices": {"A": "the brain is active throughout.", "B": "only ten per cent of the brain is active.", "C": "the brain shuts down during sleep.", "D": "one region controls the rest."}, "ans": "A", "why": "activity across the whole organ, even during sleep."}, {"n": 3, "label": "The writer mentions brain damage to show that", "choices": {"A": "the brain can always repair itself.", "B": "every region has some function.", "C": "most of the brain is unused.", "D": "scans are unreliable."}, "ans": "B", "why": "damage to almost any part produces some loss of function."}, {"n": 4, "label": "The writer says the myth's appeal is mainly", "choices": {"A": "emotional.", "B": "scientific.", "C": "financial.", "D": "historical."}, "ans": "A", "why": "not scientific but emotional."}, {"n": 5, "label": "The writer's overall attitude to the myth is", "choices": {"A": "cautious agreement.", "B": "genuine uncertainty.", "C": "mild support.", "D": "clear rejection."}, "ans": "D", "why": "myths... baffling... impossible; açıkça reddeder."}]}]}], "tests": [{"id": 1, "name": "Reading Test 1", "passages": [{"no": 1, "title": "The Return of the Beaver", "qrange": "1 - 13", "time": "17 dakika", "paras": ["The European beaver was once found in almost every river system on the continent. By the beginning of the twentieth century, however, fewer than 1,200 animals remained, scattered across eight isolated populations. The species had been hunted relentlessly, and not chiefly for its meat. What made it valuable was its dense waterproof fur and castoreum, a bitter substance produced in glands near the tail, which was used in perfume and in traditional medicine. In Britain the animal vanished altogether, probably during the sixteenth century.", "Reintroduction began quietly. Small groups were released in Sweden in the 1920s, and further releases followed in Russia, Latvia and Poland. These early projects were driven mainly by a wish to restore a lost species rather than by any expectation of practical gain. It was only much later, when ecologists began to measure the animals' effect on the landscape, that a second argument for reintroduction emerged.", "Beavers are what biologists call ecosystem engineers. They fell trees, dig canals and build dams, and in doing so they turn a fast, narrow stream into a slow mosaic of pools, wet meadows and standing dead wood. A single family can flood several hectares. The structures they build are not permanent. Once the willow and aspen within easy reach have been used up, the animals abandon the site and move upstream, and the pond silts up gradually into wet grassland.", "The consequences of this activity are significant. Water that would otherwise rush downstream is held back, which lowers the height of flood peaks in the valleys below. In one study on a small Devon catchment, a single family reduced the peak flow leaving the site by roughly thirty per cent. The ponds also trap sediment and agricultural chemicals, so the water leaving a beaver wetland is measurably cleaner than the water entering it. Fish, amphibians and water birds increase in both number and variety.", "Not everyone welcomes them. Farmers whose land lies beside a river may find their fields waterlogged and their drainage ditches blocked. Foresters lose trees. In Bavaria, where beavers were reintroduced in the 1960s and now number more than 20,000, the regional government employs a team of specialists whose job is to negotiate between the animals and the landowners. Their standard toolkit includes the flow device, a pipe pushed through a dam that lowers the water level without destroying the structure, and, where nothing else works, permits to remove individual animals.", "The British case has been unusually contentious. A population appeared on the River Otter in Devon around 2008, almost certainly escaped from captivity rather than deliberately released. The government's first response was to catch and remove them, on the grounds that the animals might be carrying disease. A public campaign followed, and the beavers were allowed to remain under licence while a five-year monitoring project ran. The project's final report, published in 2020, concluded that the benefits outweighed the costs, and the animals were given permission to stay. Scotland had already granted the beaver protected status two years earlier.", "Whether the species will now spread quickly across Britain is far from certain. Beavers disperse slowly, rarely more than a few kilometres in a year, and they cannot cross wide stretches of dry land. Much will depend on whether further releases are licensed and on whether the compensation schemes now under discussion are generous enough to make the animals tolerable to the people who must live alongside them."], "groups": [{"type": "tf", "range": "1 - 6", "instr": "Do the following statements agree with the information given in the passage? Write TRUE, FALSE or NOT GIVEN.", "items": [{"n": 1, "label": "The beaver was hunted mainly as a source of food.", "ans": "FALSE", "why": "Metin: hunted... not chiefly for its meat; değerli olan kürkü ve castoreum. Yiyecek için değil. FALSE."}, {"n": 2, "label": "The beaver was already extinct in Britain by the seventeenth century.", "ans": "TRUE", "why": "Metin: In Britain the animal vanished... probably during the sixteenth century. 16. yy, 17. yy'dan önce. TRUE."}, {"n": 3, "label": "The first reintroductions were carried out because of the beaver's effect on flooding.", "ans": "FALSE", "why": "Metin: early projects driven mainly by a wish to restore a lost species, sel etkisi much later fark edildi. FALSE."}, {"n": 4, "label": "Beaver dams eventually disappear if the animals leave.", "ans": "TRUE", "why": "Metin: structures not permanent; animals abandon the site, pond silts up. TRUE."}, {"n": 5, "label": "Beaver ponds increase the number of insect species.", "ans": "NOT GIVEN", "why": "Metin fish, amphibians, water birds artışından söz eder; böcek türlerinden değil. NOT GIVEN."}, {"n": 6, "label": "Bavaria has more beavers than any other European region.", "ans": "NOT GIVEN", "why": "Metin 20,000'den fazla der ama başka bölgelerle karşılaştırma yok. NOT GIVEN."}]}, {"type": "gap", "range": "7 - 10", "instr": "Complete the sentences below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "items": [{"n": 7, "label": "Perfume makers prized a glandular secretion known as", "ans": ["castoreum"], "why": "castoreum... used in perfume. Cevap: castoreum."}, {"n": 8, "label": "Biologists apply the term ______ to animals that remake their surroundings.", "ans": ["ecosystem engineers"], "why": "biologists call ecosystem engineers. Cevap: ecosystem engineers."}, {"n": 9, "label": "Water levels can be lowered without dismantling a dam by fitting a", "ans": ["flow device"], "why": "the flow device, a pipe... lowers the water level without destroying the structure. Cevap: flow device."}, {"n": 10, "label": "Wide expanses of ______ stop the animals from spreading.", "ans": ["dry land"], "why": "they cannot cross wide stretches of dry land. Cevap: dry land."}]}, {"type": "gap", "range": "11 - 13", "instr": "Answer the questions below. Choose NO MORE THAN THREE WORDS AND/OR A NUMBER from the passage for each answer.", "items": [{"n": 11, "label": "By how much did the Devon beavers reduce peak flow?", "ans": ["thirty per cent", "30 per cent", "thirty percent", "roughly thirty per cent"], "why": "reduced the peak flow... by roughly thirty per cent. Cevap: thirty per cent."}, {"n": 12, "label": "What reason did the government first give for removing the Devon beavers?", "ans": ["carrying disease", "disease", "possible disease"], "why": "on the grounds that the animals might be carrying disease. Cevap: (carrying) disease."}, {"n": 13, "label": "In which year was the monitoring report published?", "ans": ["2020"], "why": "final report, published in 2020. Cevap: 2020."}]}]}, {"no": 2, "title": "Why Cities Get Hotter", "qrange": "14 - 26", "time": "20 dakika", "paras": ["A   On a clear, still night in July, the centre of a large city can be as much as ten degrees warmer than the farmland twenty kilometres away. The effect was first described in 1818 by Luke Howard, an amateur meteorologist who had been keeping careful records of London's temperature, and it has been given a name that is now standard in the field: the urban heat island. Howard could not explain what he had found. Two centuries later, the mechanism is well understood, and the consequences are becoming urgent.", "B   Three processes are at work. The first is absorption. Asphalt and dark roofing material take in a far greater share of the sunlight that falls on them than grass or soil, and release it slowly through the night. The second is the loss of evaporation. In the countryside, a large proportion of the sun's energy is spent turning water into vapour, drawn up through the leaves of plants. Concrete does not sweat. The third is geometry. Tall buildings standing close together trap the heat radiating from one another, so that a narrow street behaves rather like the inside of an oven.", "C   To these must be added the heat that cities generate themselves. Engines, factories, air conditioners and human bodies all release warmth into the air. In Tokyo in midsummer, waste heat from air conditioning alone has been estimated to raise the street temperature by one to two degrees. The irony is obvious. The hotter the city becomes, the harder its cooling systems work, and the more heat those systems pour into the street.", "D   The cost is not evenly shared. Studies in a number of American cities have found that the hottest districts are consistently the poorest. This is not a coincidence. Wealthy neighbourhoods tend to have more trees, larger gardens and lower building density, while poorer ones are more likely to sit beside motorways or industrial land, with little shade and few parks. During a heatwave in Chicago in 1995, more than seven hundred people died, and the death rate was several times higher in the districts with the least tree cover.", "E   What can be done is, in principle, straightforward. Painting roofs white reflects sunlight rather than absorbing it, and a number of cities now require it on new flat-roofed buildings. Planting trees provides both shade and evaporation. Green roofs, where a shallow layer of soil and vegetation is laid over the roof surface, do the same and also slow the flow of rainwater into the drains. Replacing solid paving with permeable surfaces allows water to remain in the ground, where it can evaporate on hot days rather than running away.", "F   None of this is expensive by the standards of urban engineering, and yet progress has been slow. Part of the difficulty is that the benefits are diffuse. A homeowner who plants a tree cools the whole street, but pays for the tree alone. Part of it is that the responsibility is divided: roofs belong to building owners, streets to the municipality, and parks to a third authority which may have no obligation to think about temperature at all. Where cities have made real progress, it has usually been because a single office was given the task and the budget to pursue it.", "G   The urgency is increasing. By 2050 something like two thirds of the world's population will live in cities, and the cities themselves are expanding into exactly the kind of open land that once helped to cool them. Meanwhile the background climate is warming. A heat island that added five degrees to a summer night was uncomfortable in 1980. Added to the temperatures now expected in southern Europe and southern Asia, the same five degrees will be dangerous."], "groups": [{"type": "select", "variant": "heading", "range": "14 - 19", "instr": "Choose the correct heading for paragraphs B to G. Paragraph A example: iv.", "options": [{"k": "i", "label": "Why the poor suffer most"}, {"k": "ii", "label": "A problem that is getting worse"}, {"k": "iii", "label": "The city as its own furnace"}, {"k": "iv", "label": "How the effect was first recorded"}, {"k": "v", "label": "The physics of a warm street"}, {"k": "vi", "label": "Remedies that are already available"}, {"k": "vii", "label": "Measuring temperature accurately"}, {"k": "viii", "label": "Why nobody acts"}, {"k": "ix", "label": "The cost of air conditioning"}, {"k": "x", "label": "Cities in the developing world"}], "items": [{"n": 14, "label": "Paragraph B", "ans": "v", "why": "Three processes: absorption, loss of evaporation, geometry = sıcak sokağın fiziği. v."}, {"n": 15, "label": "Paragraph C", "ans": "iii", "why": "heat that cities generate themselves: engines, factories, air conditioners = şehir kendi fırını. iii."}, {"n": 16, "label": "Paragraph D", "ans": "i", "why": "hottest districts are consistently the poorest = en çok yoksullar etkilenir. i."}, {"n": 17, "label": "Paragraph E", "ans": "vi", "why": "Painting roofs white, planting trees, green roofs = hazır çözümler. vi."}, {"n": 18, "label": "Paragraph F", "ans": "viii", "why": "progress slow, benefits diffuse, responsibility divided = kimse harekete geçmiyor. viii."}, {"n": 19, "label": "Paragraph G", "ans": "ii", "why": "The urgency is increasing, by 2050 = gittikçe kötüleşen sorun. ii."}]}, {"type": "select", "variant": "info", "range": "20 - 23", "instr": "Which paragraph contains the following information? Write the correct letter, A to G. You may use any letter more than once.", "options": [{"k": "A", "label": "A"}, {"k": "B", "label": "B"}, {"k": "C", "label": "C"}, {"k": "D", "label": "D"}, {"k": "E", "label": "E"}, {"k": "F", "label": "F"}, {"k": "G", "label": "G"}], "items": [{"n": 20, "label": "a figure for the human cost of a single extreme weather event", "ans": "D", "why": "D: Chicago 1995 heatwave, more than seven hundred people died. D."}, {"n": 21, "label": "a claim that no single body is responsible for the problem", "ans": "F", "why": "F: responsibility is divided: roofs, streets, parks to a third authority. F."}, {"n": 22, "label": "an account of how vegetation removes heat from the air", "ans": "B", "why": "B: energy spent turning water into vapour, drawn up through the leaves. B."}, {"n": 23, "label": "a mention of the person who first recorded the effect", "ans": "A", "why": "A: first described in 1818 by Luke Howard. A."}]}, {"type": "select", "variant": "summary", "range": "24 - 26", "instr": "Complete the summary using the list of words, A to H, below.", "intro": "Cities become hotter than the surrounding countryside partly because dark surfaces (24) more of the sun's energy than vegetation does, and partly because concrete cannot lose heat through (25). Several remedies exist. White roofs (26) sunlight instead of taking it in, and trees provide both cooling and shade.", "options": [{"k": "A", "label": "A. shade"}, {"k": "B", "label": "B. reflect"}, {"k": "C", "label": "C. drains"}, {"k": "D", "label": "D. absorb"}, {"k": "E", "label": "E. evaporation"}, {"k": "F", "label": "F. budget"}, {"k": "G", "label": "G. density"}, {"k": "H", "label": "H. vapour"}], "items": [{"n": 24, "label": "Gap 24", "ans": "D", "why": "dark surfaces absorb more of the sun's energy. D. absorb."}, {"n": 25, "label": "Gap 25", "ans": "E", "why": "concrete cannot lose heat through evaporation. E. evaporation."}, {"n": 26, "label": "Gap 26", "ans": "B", "why": "White roofs reflect sunlight. B. reflect."}]}]}, {"no": 3, "title": "Does Bilingualism Change the Brain?", "qrange": "27 - 40", "time": "23 dakika", "paras": ["For most of the twentieth century, the received opinion among educators in Britain and the United States was that growing up with two languages was a handicap. Bilingual children were thought to be confused, to have smaller vocabularies, and to fall behind their monolingual classmates. The evidence for this view came largely from studies conducted in the 1920s and 1930s on the children of recent immigrants. Those studies were, by any modern standard, badly designed. The bilingual children were poorer, they were often tested in their weaker language, and the tests themselves assumed a cultural knowledge the children had no reason to possess.", "The reversal came slowly, and then all at once. In 1962 Elizabeth Peal and Wallace Lambert, working in Montreal, took the elementary precaution of matching their bilingual and monolingual participants for social class and for the language of testing. Their bilingual children did not merely catch up. On a range of tasks they performed better. The finding was surprising enough that for two decades it was treated as an anomaly.", "Interest revived in the 1990s with the work of Ellen Bialystok, who proposed a mechanism. A bilingual speaker, she argued, never fully switches one of her languages off. Both remain active, and every time she speaks she must suppress the language she does not want. This constant act of suppression, repeated thousands of times a day over a lifetime, is exercise for a general-purpose mental system that psychologists call executive control: the capacity to hold a goal in mind, ignore distraction and switch between tasks. If bilinguals are better at this, the advantage should show up not only in language but in tasks that have nothing to do with words at all.", "For a time the evidence seemed to support her. Bilinguals were reported to outperform monolinguals on the Simon task, on card-sorting problems, and on a range of other measures of attention. More striking still were the findings on ageing. Bialystok and her colleagues examined the clinical records of several hundred patients at a memory clinic in Toronto and found that the bilingual patients had been diagnosed with dementia, on average, more than four years later than the monolingual ones. Bilingualism, the headlines announced, was a defence against Alzheimer's disease.", "It was at this point that the field began to argue with itself. Kenneth Paap, a psychologist at San Francisco State University, reviewed the published literature and pointed out an uncomfortable pattern. The studies that found a bilingual advantage were overwhelmingly small. The larger the sample, the smaller the reported effect, and in the largest studies it vanished entirely. This is the signature of publication bias: a striking result from a small sample is easy to publish, a null result from a small sample is not, and the literature therefore fills up with flukes. Paap did not claim that the advantage was impossible. He claimed that it had not been demonstrated.", "Angela de Bruin, then at Edinburgh, tested the accusation directly. She looked at every study presented at conferences over a five-year period and asked which of them had subsequently appeared in a journal. Of the studies that had found a bilingual advantage, sixty-eight per cent were published. Of those that had found nothing, or had found an advantage for monolinguals, only thirty-six per cent were. The bias was not a suspicion. It was measurable.", "Bialystok has not conceded. Her reply is that the effect is real but conditional, and that most of the failed replications have looked for it in the wrong people. A young adult at the peak of her cognitive powers has ample executive control to spare, and no additional exercise will make a visible difference. The advantage, if it exists, should appear where the system is under strain: in young children, in the elderly, and in the damaged brain. The dementia findings, she notes, have been replicated in India and in Belgium by groups with no stake in her career.", "Where this leaves the ordinary parent is less clear than either side would like. The strong claim, that bilingualism sharpens general intelligence, is not supported. The weak claim, that speaking two languages is not a disadvantage, is now beyond argument, and given that this was denied for fifty years it is not a trivial result. Whether the brain of a lifelong bilingual is in some measurable sense more resilient remains, after sixty years of work, genuinely open."], "groups": [{"type": "yn", "range": "27 - 32", "instr": "Do the following statements agree with the claims of the writer? Write YES, NO or NOT GIVEN.", "items": [{"n": 27, "label": "Paap concluded that a bilingual advantage could not exist.", "ans": "NO", "why": "Metin: Paap did not claim the advantage was impossible; it had not been demonstrated. NO."}, {"n": 28, "label": "The studies carried out in the 1920s and 1930s were poorly constructed.", "ans": "YES", "why": "Metin: those studies were, by any modern standard, badly designed. YES."}, {"n": 29, "label": "Peal and Lambert anticipated that the bilingual group would do better.", "ans": "NOT GIVEN", "why": "Beklentileri belirtilmiyor; sadece bulgunun şaşırtıcı olduğu söyleniyor. NOT GIVEN."}, {"n": 30, "label": "De Bruin showed that researchers had concealed their findings on purpose.", "ans": "NO", "why": "Yayın yanlılığı yapısal bir etkidir (null sonuçlar basılmaz), kasıtlı gizleme değil. on purpose çeliştir. NO."}, {"n": 31, "label": "Bialystok's account implies the benefit should also show in tasks without words.", "ans": "YES", "why": "Metin: advantage should show up not only in language but in tasks with nothing to do with words. YES."}, {"n": 32, "label": "The writer regards the matter as now resolved.", "ans": "NO", "why": "Metin: remains, after sixty years, genuinely open. NO."}]}, {"type": "select", "variant": "features", "range": "33 - 36", "instr": "Match each statement with the correct researcher, A, B, C or D.", "options": [{"k": "A", "label": "A. Peal and Lambert"}, {"k": "B", "label": "B. Ellen Bialystok"}, {"k": "C", "label": "C. Kenneth Paap"}, {"k": "D", "label": "D. Angela de Bruin"}], "items": [{"n": 33, "label": "demonstrated that larger studies reported weaker effects", "ans": "C", "why": "Paap: the larger the sample, the smaller the reported effect. C."}, {"n": 34, "label": "matched the two groups for background before comparing them", "ans": "A", "why": "Peal and Lambert: matching participants for social class. A."}, {"n": 35, "label": "measured how selectively research findings reach print", "ans": "D", "why": "de Bruin: 68% vs 36% yayınlanma oranı. D."}, {"n": 36, "label": "explained the benefit as a by-product of constant inhibition", "ans": "B", "why": "Bialystok: constant act of suppression, exercise for executive control. B."}]}, {"type": "mcq", "range": "37 - 40", "instr": "Choose the correct letter, A, B, C or D.", "items": [{"n": 37, "label": "What point does the writer make about the Toronto dementia study?", "choices": {"A": "Independent groups abroad have reached the same conclusion.", "B": "The sample was far too small for the conclusion to be trusted.", "C": "No researcher has yet attempted to repeat the work.", "D": "Its author has quietly withdrawn the claim she once made in public."}, "ans": "A", "why": "replicated in India and in Belgium by groups with no stake in her career. A."}, {"n": 38, "label": "Publication bias arises, according to the passage, because", "choices": {"A": "journals will not accept any study with a small number of participants.", "B": "researchers rarely attempt to repeat one another's work.", "C": "conference papers are not subject to peer review.", "D": "an unexpected finding is easier to place than an empty one."}, "ans": "D", "why": "a striking result is easy to publish, a null result is not. D."}, {"n": 39, "label": "Bialystok answers her critics by arguing that the advantage", "choices": {"A": "is considerably greater than she first suggested.", "B": "has nothing to do with executive control, as she once believed.", "C": "surfaces only where the mental system is already stretched.", "D": "cannot be detected in children, whatever the circumstances."}, "ans": "C", "why": "real but conditional; appears where the system is under strain. C."}, {"n": 40, "label": "Which statement best captures the writer's own position?", "choices": {"A": "Two languages sharpen general intelligence, and the Toronto findings confirm it.", "B": "Speaking two languages does no harm, but the wider benefit is unproven.", "C": "The critics of the 1930s were right, though for reasons they never gave.", "D": "Sixty years of work have produced nothing worth keeping."}, "ans": "B", "why": "strong claim not supported; weak claim beyond argument; resilience open. B."}]}]}]}, {"id": 2, "name": "Reading Test 2", "passages": [{"no": 1, "title": "The Story of Saffron", "qrange": "1 - 13", "time": "17 dakika", "paras": ["Saffron is the dried stigma of Crocus sativus, a small autumn-flowering plant that no longer exists in the wild. It is sterile: every crocus now growing was propagated from a corm, an underground bulb, and every corm descends from a single ancestral plant that was selected, most probably in Bronze Age Crete, more than three thousand years ago. The species cannot reproduce without human hands, and it has travelled wherever people have carried it.", "The reason for its extraordinary price is arithmetic. Each flower produces exactly three crimson stigmas. They must be picked by hand, in the few hours after the flower opens and before the sun wilts it, and they must then be dried without being crushed. It takes something in the region of 150,000 flowers to yield a single kilogram of dried saffron, and a skilled picker working through a cold October dawn will gather enough for perhaps twenty grams in a day. No machine has been built that can do the work, because the stigma must be separated from the style below it, and the difference is a matter of colour and texture that no sorting device has yet been able to detect reliably.", "Iran now supplies close to ninety per cent of the world's crop, most of it from the dry plateau of Khorasan in the north-east. Kashmir, Spain and Morocco produce most of the remainder. Spanish saffron, grown chiefly on the plain of La Mancha, commands a premium price on the strength of its reputation, although a good deal of what is sold as Spanish is in fact imported from Iran, dried in Spain and re-exported. Greece, once a significant producer, now grows relatively little.", "Adulteration has followed saffron throughout its history. In fifteenth-century Nuremberg a body called the Safranschou court was established specifically to inspect the spice, and merchants convicted of mixing it with marigold petals or with dyed horsehair could be fined, imprisoned or burned. The temptation has not gone away. Modern testing laboratories routinely find turmeric, safflower and dyed corn silk in samples bought from markets, and a chemical standard, ISO 3632, now defines the concentration of the three compounds that give saffron its colour, its aroma and its bitter taste.", "The plant is undemanding but particular. It needs a hot dry summer, a cold winter, and rain in the autumn at the moment the flower is forming. It will not tolerate waterlogged ground. Because it flowers so briefly and so unpredictably, the harvest cannot be planned far in advance: growers watch the fields daily for a fortnight and then work continuously for two or three weeks. The corms must be lifted and divided every few years or the yield collapses.", "Whether saffron production has a future in Europe is unclear. The work is unattractive and the wages are low, and in Spain the area under cultivation has fallen by more than ninety per cent since the 1970s. Some growers have responded by selling directly to consumers at prices far above the wholesale rate, and by seeking protected designation status, which prevents anyone outside the region from using the name. Others have simply given up. Meanwhile new producers have appeared in unexpected places, including Afghanistan, where saffron has been promoted as an alternative to opium poppy, and even in parts of England, where a village in Essex is named after the crop it grew four hundred years ago."], "groups": [{"type": "gap", "range": "1 - 5", "instr": "Complete the table below. Choose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.", "items": [{"n": 1, "label": "Number of stigmas per flower", "ans": ["three", "3"], "why": "exactly three crimson stigmas. three."}, {"n": 2, "label": "Flowers needed for one kilogram: about", "ans": ["150,000", "150000"], "why": "about 150,000 flowers to yield a single kilogram. 150,000."}, {"n": 3, "label": "Iran's share of world production: roughly", "ans": ["ninety per cent", "90 per cent", "ninety percent"], "why": "close to ninety per cent of the world's crop. ninety per cent."}, {"n": 4, "label": "Main Iranian growing region", "ans": ["Khorasan"], "why": "the dry plateau of Khorasan. Khorasan."}, {"n": 5, "label": "Name of the modern quality standard", "ans": ["ISO 3632"], "why": "a chemical standard, ISO 3632. ISO 3632."}]}, {"type": "tf", "range": "6 - 11", "instr": "Do the following statements agree with the information given in the passage? Write TRUE, FALSE or NOT GIVEN.", "items": [{"n": 6, "label": "Crocus sativus can still be found growing wild in Crete.", "ans": "FALSE", "why": "a plant that no longer exists in the wild. FALSE."}, {"n": 7, "label": "Machines are now used to separate the stigma from the style.", "ans": "FALSE", "why": "No machine has been built that can do the work. FALSE."}, {"n": 8, "label": "Some saffron sold as Spanish was grown in Iran.", "ans": "TRUE", "why": "sold as Spanish is in fact imported from Iran, dried in Spain. TRUE."}, {"n": 9, "label": "Greek saffron is considered to be of poorer quality than Spanish saffron.", "ans": "NOT GIVEN", "why": "Yunan safranının kalitesi hakkında karşılaştırma yok. NOT GIVEN."}, {"n": 10, "label": "Merchants in Nuremberg could be executed for adulterating saffron.", "ans": "TRUE", "why": "could be fined, imprisoned or burned. burned = idam. TRUE."}, {"n": 11, "label": "Saffron crocuses grow best in wet soil.", "ans": "FALSE", "why": "It will not tolerate waterlogged ground. FALSE."}]}, {"type": "gap", "range": "12 - 13", "instr": "Answer the questions below. Choose NO MORE THAN THREE WORDS from the passage for each answer.", "items": [{"n": 12, "label": "In which country has saffron been promoted as a replacement for a drug crop?", "ans": ["Afghanistan"], "why": "Afghanistan... an alternative to opium poppy. Afghanistan."}, {"n": 13, "label": "What legal protection are some Spanish growers seeking?", "ans": ["protected designation status", "protected designation"], "why": "seeking protected designation status. protected designation status."}]}]}, {"no": 2, "title": "The Rise of the Night Shift", "qrange": "14 - 26", "time": "20 dakika", "paras": ["A   Before the invention of reliable artificial light, night work was rare and mostly confined to those who had no choice: watchmen, bakers, sailors. The gas lamp changed this, and the electric bulb changed it completely. By the 1880s cotton mills in Lancashire were running two twelve-hour shifts, and the argument used to justify the practice was simply that the machinery was expensive and ought not to stand idle. That argument has never gone away.", "B   Today somewhere between fifteen and twenty per cent of workers in the industrialised world are employed outside conventional daytime hours. The figure is highest in health care, transport, policing and manufacturing, and it has been rising steadily in warehousing and delivery as consumers have come to expect goods ordered at midnight to arrive the following afternoon. The night shift, once a mark of industrial hardship, has quietly become a feature of ordinary economic life.", "C   The human body is not neutral about this. Almost every physiological system, from body temperature to the release of hormones, follows a roughly twenty-four hour cycle governed by a cluster of cells in the hypothalamus. That clock is set principally by light. When a person is awake and eating at three in the morning, the clock does not simply adjust. It becomes desynchronised from the behaviour imposed on it, and the mismatch is measurable within days: digestion slows, blood pressure rises, glucose is handled less efficiently.", "D   The long-term consequences are now reasonably well established, if still debated at the margins. Large studies of nurses in the United States and of industrial workers in Scandinavia have found elevated rates of cardiovascular disease, type 2 diabetes and obesity among those who have worked nights for many years. In 2007 the World Health Organization's cancer research agency classified shift work involving circadian disruption as a probable human carcinogen, a decision that attracted a good deal of criticism at the time and that has been reaffirmed, with qualifications, since.", "E   The costs are not only medical. Reaction times are at their worst between two and six in the morning, and the accident record reflects it. The Chernobyl reactor explosion, the Exxon Valdez grounding and the Bhopal gas leak all began in the small hours. Investigations into each identified fatigue as a contributing factor, though in no case was it the sole cause, and it would be careless to blame the night alone for disasters that also involved poor design and poor management.", "F   Employers have not been indifferent. Rotating shifts forwards rather than backwards, so that a worker moves from mornings to afternoons to nights rather than the reverse, appears to be easier for the body to absorb. Bright light in the workplace at the start of a night shift and dark glasses on the journey home can shift the internal clock deliberately rather than leaving it to drift. Napping, long regarded as a disciplinary matter, is now permitted or even required in some air traffic control centres and hospitals. None of these measures abolishes the problem. They reduce it.", "G   What is striking is how little the underlying justification has changed. The capital equipment is still expensive; it still ought not to stand idle. What has changed is that the capital is now a distribution centre or a data centre rather than a spinning mule, and that the people who work through the night are more likely to be sorting parcels than tending machines. The question of who bears the cost of keeping the economy awake has not been answered. It has merely been moved."], "groups": [{"type": "select", "variant": "heading", "range": "14 - 19", "instr": "Choose the correct heading for paragraphs B to G. Paragraph A example: viii.", "options": [{"k": "i", "label": "The clock that light controls"}, {"k": "ii", "label": "An old justification in a new setting"}, {"k": "iii", "label": "Measures that help without solving"}, {"k": "iv", "label": "Disasters in the small hours"}, {"k": "v", "label": "How widespread night work now is"}, {"k": "vi", "label": "The long-term damage to health"}, {"k": "vii", "label": "Why bakers work at night"}, {"k": "viii", "label": "The origins of working after dark"}, {"k": "ix", "label": "Sleep and memory"}, {"k": "x", "label": "The end of the night shift"}], "items": [{"n": 14, "label": "Paragraph B", "ans": "v", "why": "15-20% of workers outside daytime hours, rising = gece işinin yaygınlığı. v."}, {"n": 15, "label": "Paragraph C", "ans": "i", "why": "24-hour cycle governed by hypothalamus, set by light = ışığın kontrol ettiği saat. i."}, {"n": 16, "label": "Paragraph D", "ans": "vi", "why": "cardiovascular disease, diabetes, WHO carcinogen = sağlığa uzun vadeli zarar. vi."}, {"n": 17, "label": "Paragraph E", "ans": "iv", "why": "Chernobyl, Exxon Valdez, Bhopal, small hours = küçük saatlerdeki felaketler. iv."}, {"n": 18, "label": "Paragraph F", "ans": "iii", "why": "rotating forwards, bright light, napping, reduce it = çözmeden azaltan önlemler. iii."}, {"n": 19, "label": "Paragraph G", "ans": "ii", "why": "how little the justification has changed = yeni ortamda eski gerekçe. ii."}]}, {"type": "gap", "range": "20 - 24", "instr": "Complete the summary below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "intro": "The body's daily rhythm is controlled by cells in the (20), and this internal clock is set mainly by (21). When someone works at night, the clock becomes (22) from their behaviour, and effects such as raised blood pressure appear within (23). Employers can reduce the harm by rotating shifts (24) rather than in the opposite direction.", "items": [{"n": 20, "label": "Gap 20", "ans": ["hypothalamus", "the hypothalamus"], "why": "a cluster of cells in the hypothalamus. hypothalamus."}, {"n": 21, "label": "Gap 21", "ans": ["light"], "why": "That clock is set principally by light. light."}, {"n": 22, "label": "Gap 22", "ans": ["desynchronised", "desynchronized"], "why": "It becomes desynchronised from the behaviour. desynchronised."}, {"n": 23, "label": "Gap 23", "ans": ["days"], "why": "the mismatch is measurable within days. days."}, {"n": 24, "label": "Gap 24", "ans": ["forwards", "forward"], "why": "Rotating shifts forwards rather than backwards. forwards."}]}, {"type": "select", "variant": "info", "range": "25 - 26", "instr": "Which paragraph contains the following information? Write the correct letter, A to G.", "options": [{"k": "A", "label": "A"}, {"k": "B", "label": "B"}, {"k": "C", "label": "C"}, {"k": "D", "label": "D"}, {"k": "E", "label": "E"}, {"k": "F", "label": "F"}, {"k": "G", "label": "G"}], "items": [{"n": 25, "label": "a ruling by an international health body that provoked objections", "ans": "D", "why": "D: WHO classified shift work... attracted criticism. D."}, {"n": 26, "label": "a caution against blaming one factor for a complex failure", "ans": "E", "why": "E: careless to blame the night alone... poor design and management. E."}]}]}, {"no": 3, "title": "The Limits of Expert Prediction", "qrange": "27 - 40", "time": "23 dakika", "paras": ["In 1984 Philip Tetlock, then a young psychologist, was invited to sit on a committee at the American National Research Council. The committee's task was to assess what the social sciences could contribute to the management of the Cold War, and Tetlock spent much of his time listening to distinguished specialists explain, with great confidence and mutually incompatible reasoning, what the Soviet Union was about to do. He came away with a question that would occupy him for the next thirty years. Were any of them right, and if so, could you tell in advance which ones?", "The study he designed was tedious in the way that good studies often are. He recruited 284 people whose professional lives involved commenting on political and economic trends, and over roughly twenty years he asked them to assign probabilities to specific, checkable outcomes. Would Quebec separate from Canada? Would South Africa's transition end in civil war? Would the euro survive its first decade? By the time he closed the project he had collected more than 82,000 individual forecasts, and, crucially, every one of them could be scored, because every question had a date and an answer.", "The headline result was unflattering. The average expert performed, as Tetlock put it, about as well as a dart-throwing chimpanzee. This sentence has been quoted so often that it has come to be regarded as the whole of his finding, which is a pity, because it is the least interesting part of it. What mattered was that the experts were not equally bad. A minority did substantially better than chance, and the variable that separated them was not their subject knowledge, their academic rank, their access to classified material, or their political leaning. It was their style of thinking.", "Borrowing a distinction from the philosopher Isaiah Berlin, Tetlock divided his forecasters into hedgehogs and foxes. The hedgehog knows one big thing. He has a governing theory, and he applies it with confidence and consistency to every problem that comes his way. The fox knows many small things. She is sceptical of grand theories, gathers information from sources that disagree with one another, tolerates contradiction, and is willing to say that she does not know. The foxes forecast better. The hedgehogs forecast worse than the foxes, and the most confident hedgehogs forecast worst of all.", "There is a bitter irony in this, which Tetlock did not fail to notice. The hedgehog is exactly the sort of expert whom broadcasters want. He gives a clean answer, he gives it quickly, and he does not qualify it into uselessness. The fox hedges, and hedging makes poor television. The very qualities that made a forecaster accurate made him unemployable as a pundit, and the qualities that made him a compelling pundit made him unreliable as a forecaster. The market for confident prediction, in other words, systematically rewards the people who are worst at it.", "The natural response is despair, and Tetlock has resisted it. In 2011 he and his collaborators entered a forecasting tournament run by the American intelligence community, competing against teams from other universities and against professional analysts with access to secret intelligence. His team, made up largely of volunteers recruited through the internet, won every year. Within that team a subgroup emerged whose accuracy was startling. He called them superforecasters, and the point he has since laboured is that they were not exceptional people. Most had no relevant expertise at all. They were, however, exceptional in their habits.", "Those habits are learnable, and this is the part of the work that ought to matter to anyone who has to make a decision under uncertainty. Superforecasters break a vague question into parts that can be estimated separately. They start from a base rate rather than from a story. They update in small increments when new information arrives, rather than either ignoring it or overreacting to it. They keep a written record of their predictions, which makes self-deception harder. And they treat being wrong as information rather than as humiliation, which is easier to describe than to do.", "Whether any of this survives contact with the institutions that actually make decisions is another matter. Tetlock's own view is guardedly pessimistic. Governments and companies do not, on the whole, keep score. They do not record what their advisers predicted, and so they cannot discover which advisers were right. A scoring system would be cheap to build and painful to use, and the pain, he suspects, is why it has not been built."], "groups": [{"type": "mcq", "range": "27 - 30", "instr": "Choose the correct letter, A, B, C or D.", "items": [{"n": 27, "label": "What set Tetlock on this line of research?", "choices": {"A": "A dispute with a colleague over Soviet intentions.", "B": "An approach from the American intelligence services asking for help.", "C": "Listening to assured specialists contradict one another.", "D": "His own inability to foresee the end of the Cold War."}, "ans": "C", "why": "specialists explain with great confidence and mutually incompatible reasoning. C."}, {"n": 28, "label": "Why does the writer call the study tedious?", "choices": {"A": "Because scoring thousands of dated forecasts took twenty years.", "B": "Because the questions themselves turned out to be of little interest.", "C": "Because a majority of the forecasters dropped out.", "D": "Because the outcome could have been guessed in advance."}, "ans": "A", "why": "over roughly twenty years... 82,000 forecasts, every one scored. A."}, {"n": 29, "label": "What distinguished the better forecasters?", "choices": {"A": "The schools and universities they had attended.", "B": "The classified material they could see.", "C": "Their political sympathies.", "D": "The manner in which they reasoned."}, "ans": "D", "why": "not subject knowledge... It was their style of thinking. D."}, {"n": 30, "label": "Broadcasters favour hedgehogs, the writer suggests, because", "choices": {"A": "hedgehogs turn out to be more accurate than foxes in the long run.", "B": "hedgehogs answer cleanly and without qualification.", "C": "foxes decline to appear in public.", "D": "hedgehogs are already better known to the audience."}, "ans": "B", "why": "gives a clean answer, quickly, does not qualify it. B."}]}, {"type": "yn", "range": "31 - 35", "instr": "Do the following statements agree with the claims of the writer? Write YES, NO or NOT GIVEN.", "items": [{"n": 31, "label": "The chimpanzee comparison is the most useful part of Tetlock's work.", "ans": "NO", "why": "it is the least interesting part of it. NO."}, {"n": 32, "label": "What the superforecasters did well can be taught.", "ans": "YES", "why": "Those habits are learnable. YES."}, {"n": 33, "label": "The superforecasters were chosen for their professional standing.", "ans": "NO", "why": "they were not exceptional people; most had no relevant expertise. NO."}, {"n": 34, "label": "Tetlock's tournament team was paid for by a commercial sponsor.", "ans": "NO", "why": "tournament run by the American intelligence community; team of volunteers. Ticari sponsor değil. NO."}, {"n": 35, "label": "The writer expects organisations to begin scoring their advisers before long.", "ans": "NO", "why": "guardedly pessimistic; the pain is why it has not been built. NO."}]}, {"type": "gap", "range": "36 - 40", "instr": "Complete the sentences below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "items": [{"n": 36, "label": "Tetlock borrowed his hedgehog and fox distinction from", "ans": ["Isaiah Berlin", "Berlin"], "why": "a distinction from the philosopher Isaiah Berlin. Isaiah Berlin."}, {"n": 37, "label": "The most ______ hedgehogs produced the least accurate forecasts.", "ans": ["confident"], "why": "the most confident hedgehogs forecast worst of all. confident."}, {"n": 38, "label": "Superforecasters begin with a ______ instead of with a narrative.", "ans": ["base rate"], "why": "They start from a base rate rather than from a story. base rate."}, {"n": 39, "label": "Keeping a written record makes ______ more difficult.", "ans": ["self-deception", "self deception"], "why": "makes self-deception harder. self-deception."}, {"n": 40, "label": "Tetlock believes organisations avoid scoring their advisers because it would be", "ans": ["painful"], "why": "cheap to build and painful to use. painful."}]}]}]}, {"id": 3, "name": "Reading Test 3", "passages": [{"no": 1, "title": "Cork", "qrange": "1 - 13", "time": "17 dakika", "paras": ["The cork oak is unlike almost every other tree that human beings exploit, in that it can be stripped of its bark and survive. The outer bark is a thick, spongy, fire-resistant layer that the tree regenerates, and a healthy specimen can be harvested every nine years for two centuries or more. Roughly half the world's cork comes from Portugal, where the trees grow in the montado, an open woodland of scattered oaks and grazing land that has been managed in much the same way since the Middle Ages.", "The harvest is skilled and entirely manual. It takes place between May and August, when the tree is growing and the bark separates cleanly from the trunk beneath. A team of two works each tree. Using a long-handled axe, they cut a horizontal ring around the trunk, then several vertical lines down from it, and then work the blade gently under the edge of each panel until it lifts away in a curved plank. A single mistake, a cut a few millimetres too deep, damages the living layer and the tree will produce poor bark for decades. There is no machine for this, and there is no substitute for an experienced hand.", "The planks are stacked in the open air for around six months, so that the wood can stabilise and the tannins can be washed out by rain. They are then boiled for about an hour, which softens the cork, expands it by up to a fifth and kills any organism living in it. After boiling, the planks are rested again, this time in a dark and humid room, and only then are they trimmed and graded. The best material, thick and free of cracks, goes to the wine trade. The rest is granulated and pressed into flooring, insulation board and the cores of cricket balls.", "The first stripping from a young tree, which happens at about twenty-five years of age, produces bark that is hard, irregular and useless for stoppers. So does the second, nine years later. Only the third harvest, when the tree is more than forty years old, yields cork of the quality a bottle requires. A grower who plants a cork oak is therefore working for a generation he will not see, and this fact more than any other has shaped the culture of the montado.", "Cork was almost destroyed by an accident of chemistry. In the 1980s the wine industry became aware of a compound, TCA, which can form when chlorine used in bleaching reacts with mould in the bark. In minute quantities TCA gives wine a smell of damp cardboard, and by some estimates it was tainting one bottle in twenty. The industry's response was to abandon cork. Screw caps and plastic stoppers took a large share of the market within a decade, and the price of cork collapsed.", "The recovery has been slower than the collapse but it is real. Producers stopped using chlorine, introduced steam cleaning, and developed a scanning process that tests individual stoppers for TCA. Contamination rates are now reported to be well below one per cent. At the same time an argument that had nothing to do with wine began to work in cork's favour. The montado is a habitat. It supports the Iberian lynx, the Spanish imperial eagle and a great many other species, and it survives only because the cork is worth harvesting. If the market for cork disappears, the argument runs, the oaks will be cleared for eucalyptus plantations, and the ecosystem will go with them. Whether that argument persuades a supermarket buyer is another question."], "groups": [{"type": "gap", "range": "1 - 5", "instr": "Complete the flow-chart below. Choose NO MORE THAN TWO WORDS from the passage for each answer.", "items": [{"n": 1, "label": "The bark is prised off the trunk using a long-handled", "ans": ["axe"], "why": "Using a long-handled axe. axe."}, {"n": 2, "label": "Planks are left outside for about ______ so that rain removes the tannins.", "ans": ["six months"], "why": "stacked in the open air for around six months. six months."}, {"n": 3, "label": "The cork is ______ for around an hour, which softens it and kills organisms.", "ans": ["boiled"], "why": "They are then boiled for about an hour. boiled."}, {"n": 4, "label": "The planks rest in a room that is dark and", "ans": ["humid"], "why": "in a dark and humid room. humid."}, {"n": 5, "label": "Poorer cork is granulated for ______ and insulation.", "ans": ["flooring"], "why": "granulated and pressed into flooring, insulation board. flooring."}]}, {"type": "tf", "range": "6 - 10", "instr": "Do the following statements agree with the information given in the passage? Write TRUE, FALSE or NOT GIVEN.", "items": [{"n": 6, "label": "Stripping the bark kills the cork oak.", "ans": "FALSE", "why": "it can be stripped of its bark and survive. FALSE."}, {"n": 7, "label": "Cork is harvested in the winter months.", "ans": "FALSE", "why": "takes place between May and August. FALSE."}, {"n": 8, "label": "Cork harvesters are paid more than other agricultural workers.", "ans": "NOT GIVEN", "why": "Ücret karşılaştırması metinde yok. NOT GIVEN."}, {"n": 9, "label": "The bark from a tree's first harvest cannot be used for bottle stoppers.", "ans": "TRUE", "why": "The first stripping... useless for stoppers. TRUE."}, {"n": 10, "label": "TCA contamination now affects around five per cent of bottles.", "ans": "FALSE", "why": "now reported to be well below one per cent. FALSE."}]}, {"type": "gap", "range": "11 - 13", "instr": "Complete the sentences below. Choose NO MORE THAN THREE WORDS from the passage for each answer.", "items": [{"n": 11, "label": "The Portuguese woodland where cork oaks grow is called the", "ans": ["montado"], "why": "the montado, an open woodland. montado."}, {"n": 12, "label": "A cork oak must be over ______ before it produces cork suitable for wine.", "ans": ["forty years old", "forty", "forty years"], "why": "the third harvest, when the tree is more than forty years old. forty years old."}, {"n": 13, "label": "Environmentalists argue that without a cork market the oaks would be replaced by", "ans": ["eucalyptus plantations", "eucalyptus"], "why": "the oaks will be cleared for eucalyptus plantations. eucalyptus plantations."}]}]}, {"no": 2, "title": "The Decline of the Honeybee", "qrange": "14 - 26", "time": "20 dakika", "paras": ["A   In the winter of 2006 beekeepers across the United States began to report something they had not seen before. Hives were not dying in the ordinary way, with a heap of dead insects on the floor. They were emptying. The workers had flown out and had not come back, leaving the queen, a handful of nurse bees, and a comb still full of honey that no scavenger would touch. The phenomenon was given a name, colony collapse disorder, and for several years it was reported as an epidemic of unknown origin.", "B   Dennis vanEngelsdorp, an entomologist at the University of Maryland who has surveyed American beekeepers annually since 2007, has been careful about the word. Colony collapse in the strict sense, he argues, has become rare since about 2010. What has not gone away is the underlying loss rate: American beekeepers now lose roughly a third of their colonies every winter, and they lose them for reasons that are individually well understood and collectively difficult to disentangle.", "C   The first of those reasons is a parasite. Varroa destructor is a mite, about the size of a pinhead, that arrived in Europe and America from Asia in the second half of the twentieth century. It feeds on the fat body of both adult bees and developing larvae, and it carries at least five viruses, of which deformed wing virus is the most damaging. Almost every untreated colony in the northern hemisphere now carries the mite. Left alone, a colony will usually die within three years.", "D   The second is agricultural chemistry. Neonicotinoid insecticides, introduced in the 1990s, are applied as a coating to seed and are taken up by the whole plant, including its pollen and nectar. Field-realistic doses do not usually kill a bee outright. Instead they appear to impair navigation, so that foragers become less likely to find their way home. Whether this is enough to destroy a colony has been fought over for twenty years. The European Union banned the outdoor use of three neonicotinoids in 2018; a number of member states have since granted emergency exemptions.", "E   The third is nutrition, and it is the one that receives least attention. A field of a single flowering crop, however vast, provides pollen for a few weeks and then nothing. Hedgerows and rough margins, which once supplied forage through the season, have been removed across much of the arable landscape. Claire Kremen, an ecologist who has worked on Californian farmland, has argued that the honeybee's problem is best understood as a habitat problem, and that a landscape which cannot feed wild pollinators will not sustain managed ones either.", "F   It is tempting to look for a single culprit, and journalism has generally obliged. The researchers themselves have moved in the opposite direction. The favoured explanation is now interactive: a mite-weakened bee is more vulnerable to a sublethal pesticide dose, and a poorly nourished bee is less able to detoxify the pesticide or to mount an immune response to the virus. Each stressor alone might be survivable. Together they are not. This is a less satisfying story, and it is much harder to legislate against.", "G   Meanwhile the demand for pollination continues to rise. The area planted with pollinator-dependent crops has grown far faster than the number of managed hives, and in California almonds alone now require the temporary import of more than two million colonies every February, trucked in from across the continent. Whether an industry can be built on an insect that is dying at thirty per cent a year is a question that the almond growers, at least, have begun to ask."], "groups": [{"type": "select", "variant": "heading", "range": "14 - 18", "instr": "Choose the correct heading for paragraphs B to F. Paragraph A example: i.", "options": [{"k": "i", "label": "An empty hive with no bodies"}, {"k": "ii", "label": "A parasite and the viruses it carries"}, {"k": "iii", "label": "Why no single cause is enough"}, {"k": "iv", "label": "Chemicals that confuse rather than kill"}, {"k": "v", "label": "The landscape that cannot feed them"}, {"k": "vi", "label": "A more accurate picture of the losses"}, {"k": "vii", "label": "The economics of almond farming"}, {"k": "viii", "label": "How honey is produced"}, {"k": "ix", "label": "Why beekeepers are leaving the trade"}], "items": [{"n": 14, "label": "Paragraph B", "ans": "vi", "why": "vanEngelsdorp careful; collapse rare since 2010; lose a third = kayıpların daha doğru resmi. vi."}, {"n": 15, "label": "Paragraph C", "ans": "ii", "why": "Varroa destructor, carries at least five viruses = parazit ve taşıdığı virüsler. ii."}, {"n": 16, "label": "Paragraph D", "ans": "iv", "why": "neonicotinoids impair navigation, not kill outright = öldürmeyip şaşırtan kimyasallar. iv."}, {"n": 17, "label": "Paragraph E", "ans": "v", "why": "nutrition; a landscape which cannot feed pollinators = besleyemeyen manzara. v."}, {"n": 18, "label": "Paragraph F", "ans": "iii", "why": "interactive; each stressor alone survivable, together not = tek neden yetmez. iii."}]}, {"type": "select", "variant": "features", "range": "19 - 23", "instr": "Match each statement with the correct person or thing, A, B, C, D or E.", "options": [{"k": "A", "label": "A. Dennis vanEngelsdorp"}, {"k": "B", "label": "B. Varroa destructor"}, {"k": "C", "label": "C. Neonicotinoids"}, {"k": "D", "label": "D. Claire Kremen"}, {"k": "E", "label": "E. Colony collapse disorder"}], "items": [{"n": 19, "label": "has become uncommon since around 2010", "ans": "E", "why": "Colony collapse... has become rare since about 2010. E."}, {"n": 20, "label": "is transmitted through the plant's pollen and nectar", "ans": "C", "why": "Neonicotinoid... taken up by the whole plant, including pollen and nectar. C."}, {"n": 21, "label": "frames the issue as one of habitat rather than of poison", "ans": "D", "why": "Kremen: best understood as a habitat problem. D."}, {"n": 22, "label": "arrived from another continent in the twentieth century", "ans": "B", "why": "Varroa... arrived from Asia in the second half of the twentieth century. B."}, {"n": 23, "label": "has collected data from beekeepers every year since 2007", "ans": "A", "why": "vanEngelsdorp: surveyed beekeepers annually since 2007. A."}]}, {"type": "select", "variant": "summary", "range": "24 - 26", "instr": "Complete the summary using the list of words, A to G, below.", "intro": "Researchers no longer look for a single cause. The explanation they now favour is (24): a bee weakened by mites is less able to
