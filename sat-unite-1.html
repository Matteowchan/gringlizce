<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit":1,"lessons":[{"main_ids":["u1-l1-f1-01","u1-l1-f2-01","u1-l1-f3-01","u1-l1-f4-01"],"questions":[{"why_wrong":{"C":"The firing of the dwellings' mud brick concerns building technique, a settlement detail unrelated to how the pits were used.","B":"Greater depth speaks to the pits' capacity, not to whether they were used communally or by individual households.","D":"That regional communities stored surplus grain is a general backdrop that does not distinguish communal from household use at this site."},"choice_families":{"D":"Çok genel","C":"Konuyla ilgili iddiayla ilgisiz","B":"Tek unsur"},"why_correct":"Nandakumar's claim is that the pits were used communally. Grain drawn from jointly cultivated fields directly indicates shared, not household, use, supporting the communal-use claim.","lesson_name":"Command of Evidence: Textual","id":"u1-l1-f1-01","lesson":1,"passage":"Archaeologist Priya Nandakumar has proposed that a cluster of Bronze Age storage pits at a settlement in the Indus Valley was used communally rather than by individual households, citing the pits' uniform construction and their placement along a shared central path rather than beside particular dwellings.","correct":"A","unit":1,"stem":"Which finding, if true, would most directly support Nandakumar's proposal?","choices":{"D":"Bronze Age communities across the region are known to have stored surplus grain against seasonal shortages.","A":"Residue analysis shows that the grain stored in each pit came from fields cultivated jointly by the whole settlement rather than by single families.","C":"The settlement's dwellings were built from mud brick fired at consistently high temperatures.","B":"The pits were dug to a greater depth than storage pits at neighboring settlements of the same period."},"target_family":"Konuyla ilgili iddiayla ilgisiz"},{"passage":"Linguist Tomas Vaillant argues that a decline in the use of a regional dialect in southern France was driven mainly by the spread of standardized schooling in the early twentieth century, when instruction was delivered exclusively in the national language and pupils were discouraged from speaking the dialect.","correct":"B","unit":1,"id":"u1-l1-f1-02","lesson":1,"target_family":"Konuyla ilgili iddiayla ilgisiz","choices":{"C":"Standardized schooling in the same period also raised literacy rates throughout southern France.","B":"In districts where compulsory schooling arrived earliest, dialect use declined most sharply within a single generation, whereas isolated districts without schools retained the dialect far longer.","D":"Many regional languages across Europe have lost speakers over the past century.","A":"The regional dialect had been recorded in detail by folklorists several decades before compulsory schooling arrived, and their published glossaries and song collections preserve many of its words and pronunciations that might otherwise have been lost."},"stem":"Which finding, if true, would most directly support Vaillant's argument?","why_correct":"Vaillant's claim ties decline specifically to schooling. Sharper decline exactly where schooling arrived first, and persistence where it was absent, links the mechanism to the outcome.","why_wrong":{"C":"Rising literacy is a parallel effect of schooling but does not show that schooling drove the dialect's decline.","D":"A continent-wide pattern of language loss is too general to confirm this specific cause at this site.","A":"That folklorists had thoroughly recorded the dialect beforehand tells us nothing about whether schooling later drove its decline."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","A":"Konuyla ilgili iddiayla ilgisiz"},"lesson_name":"Command of Evidence: Textual"},{"passage":"Ecologist Dara Okonkwo hypothesizes that a species of fig wasp times its emergence to the flowering of a single fig species by detecting a volatile chemical the figs release, rather than by responding to temperature or day length as many insects do.","correct":"C","why_correct":"The claim is that the chemical cue, not temperature or light, triggers emergence. Emergence tracking the compound while temperature and light are held constant isolates the chemical cue as the trigger.","unit":1,"why_wrong":{"B":"A narrow flowering window shows the timing to be matched but not that a chemical cue rather than temperature drives it.","A":"That the wasps develop inside the figs concerns their life cycle, not the trigger for emergence.","D":"A broad tendency of insects to synchronize with host plants is general background and does not establish that a chemical cue, rather than temperature, triggers this wasp's emergence."},"id":"u1-l1-f1-03","lesson":1,"choice_families":{"B":"Tek unsur","D":"Çok genel","A":"Konuyla ilgili iddiayla ilgisiz"},"target_family":"Konuyla ilgili iddiayla ilgisiz","lesson_name":"Command of Evidence: Textual","stem":"Which finding, if true, would most directly support Okonkwo's hypothesis?","choices":{"C":"Wasps exposed in the laboratory to the fig's volatile compound emerged on schedule even when kept at constant temperature and light, while wasps shielded from the compound did not.","B":"The fig species flowers within a narrow window each year across its entire range.","A":"The wasps complete their entire life cycle inside the figs they pollinate.","D":"Many insect species across a wide range of habitats are known to synchronize their activity with the plants they depend on, timing emergence, feeding, or breeding to the seasonal cycles of the particular host species around them."}},{"target_family":"Konuyla ilgili iddiayla ilgisiz","stem":"Which finding, if true, would most directly support Marchetti's contention?","choices":{"B":"The chapel was completed within a single year according to surviving construction records.","C":"Workshops of several painters collaborating on a single commission were common throughout Tuscany during the period the chapel was decorated, and surviving contracts from many towns show masters routinely subcontracting portions of large fresco cycles to assistants.","A":"The frescoes depict scenes drawn from a widely circulated devotional text whose episodes were illustrated in much the same sequence in numerous chapels, manuscripts, and altarpieces produced across the region during those decades.","D":"Chemical analysis reveals that adjacent figures in a single scene were painted with pigments ground to different specifications, consistent with several hands mixing paint separately at the same time."},"unit":1,"correct":"D","passage":"Art historian Lucia Marchetti contends that a series of unsigned frescoes in a Tuscan chapel was produced by a workshop of several painters working simultaneously, not by a single master, pointing to abrupt shifts in brushwork from one figure to the next within the same scene.","lesson":1,"id":"u1-l1-f1-04","lesson_name":"Command of Evidence: Textual","why_correct":"Marchetti claims multiple painters worked simultaneously. Different pigment preparations in adjacent figures point to separate hands mixing paint at once, directly supporting the workshop claim.","choice_families":{"A":"Konuyla ilgili iddiayla ilgisiz","C":"Çok genel","B":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"A":"The devotional source of the scenes concerns their subject matter and how widely it was illustrated, not the number of hands that painted this cycle.","C":"That collaborative workshops were common across Tuscany is general context about the period, not evidence about how many painters worked on this particular chapel.","B":"A one-year completion speaks to speed, not to whether one or several painters were responsible."}},{"lesson_name":"Command of Evidence: Textual","why_wrong":{"B":"Harbor capacity bears on the volume of seaborne trade, the very factor Farouk downplays, and says nothing about whether the courts drew merchants to the city.","C":"Rising trade volume points to the very explanation Farouk argues against.","D":"A general claim about ports mixing trade and services does not single out dispute resolution here."},"choice_families":{"B":"Konuyla ilgili iddiayla ilgisiz","C":"Ters yön","D":"Çok genel"},"why_correct":"Farouk claims prosperity rested on the city's role in dispute resolution, not trade volume. Merchants coming mainly to use the courts while trading elsewhere directly supports that the courts, not throughput, drew them.","stem":"Which finding, if true, would most directly support Farouk's proposal?","choices":{"D":"Medieval ports generally grew wealthy through a mix of trade and services.","A":"Records show that many merchants who used the city's courts conducted their actual buying and selling elsewhere, traveling to the city chiefly to have contracts adjudicated.","B":"The city's harbor could accommodate more ships at once than any other port along that stretch of coast, and dredging works undertaken in the same period deepened its channels enough to admit the largest merchant vessels then in use.","C":"The volume of goods passing through the city rose steadily over two centuries."},"target_family":"Konuyla ilgili iddiayla ilgisiz","id":"u1-l1-f1-05","lesson":1,"passage":"Economist Hassan Farouk proposes that a medieval port city's prosperity depended less on the volume of goods passing through it than on its role as a place where merchants settled disputes, arguing that the city's courts drew traders who might otherwise have avoided the region.","unit":1,"correct":"A"},{"correct":"B","unit":1,"passage":"Astronomer Wei Lin suggests that a faint, slowly fading glow observed after a distant stellar explosion came from dust in the surrounding space reheated by the blast, rather than from the explosion's own cooling debris, noting that the glow persisted far longer than debris alone would allow.","lesson":1,"id":"u1-l1-f1-06","target_family":"Konuyla ilgili iddiayla ilgisiz","stem":"Which finding, if true, would most directly support Lin's suggestion?","choices":{"C":"Stellar explosions of this type are observed several times each year across the galaxy.","B":"The wavelengths of the lingering glow match those emitted by heated interstellar dust and differ from those expected of the explosion's cooling debris.","D":"The distant galaxy hosting the explosion contains many young, massive stars.","A":"The explosion was among the brightest recorded in that region of the sky."},"why_correct":"Lin claims the glow came from reheated dust, not cooling debris. A spectral match to heated dust, and mismatch to debris, directly distinguishes the two sources in Lin's favor.","choice_families":{"D":"Konuyla ilgili iddiayla ilgisiz","A":"Konuyla ilgili iddiayla ilgisiz","C":"Çok genel"},"why_wrong":{"D":"The galaxy's stellar population is unrelated to what produced this particular afterglow.","A":"The explosion's brightness does not indicate whether dust or debris produced the later glow.","C":"How often such explosions occur is general background, not evidence about this glow's source."},"lesson_name":"Command of Evidence: Textual"},{"id":"u1-l1-f1-07","lesson":1,"passage":"Historian Amara Belet argues that a nineteenth-century reformer's influence came less from her published pamphlets, which circulated modestly, than from the network of correspondence she maintained with officials, through which her proposals reached lawmakers directly.","correct":"C","unit":1,"choices":{"A":"The reformer corresponded in three languages over the course of her career.","D":"Reformers of the era commonly relied on both printed publications and personal connections to advance their causes, corresponding with sympathetic officials while also issuing pamphlets aimed at a wider reading public.","B":"The reformer's pamphlets were reprinted twice during her lifetime.","C":"Several laws of the period contain provisions closely echoing wording found only in the reformer's private letters to officials, not in her published pamphlets."},"stem":"Which finding, if true, would most directly support Belet's argument?","target_family":"Konuyla ilgili iddiayla ilgisiz","why_wrong":{"B":"Reprinting of the pamphlets points to the channel Belet argues was less important.","A":"The languages she wrote in concern her range, not how her influence reached lawmakers.","D":"A general reliance on both publications and personal connections does not show that, in this reformer's case, the correspondence rather than the pamphlets carried her influence to lawmakers."},"choice_families":{"A":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","B":"Ters yön"},"why_correct":"Belet claims the letters, not the pamphlets, carried the reformer's influence to lawmakers. Laws echoing wording unique to her letters directly ties her impact to the correspondence.","lesson_name":"Command of Evidence: Textual"},{"choice_families":{"A":"Konuyla ilgili iddiayla ilgisiz","B":"Konuyla ilgili iddiayla ilgisiz","C":"Çok genel"},"lesson":1,"why_wrong":{"B":"Total darkness explains why vision is useless but not the trade-off toward other senses that Ferreira proposes.","C":"Eye loss in other, unrelated cave animals is general background about life in darkness and does not test Ferreira's specific energy trade-off in this salamander.","A":"That surface relatives depend on vision concerns their way of life above ground, not whether eyeless cave populations redirect saved energy into other senses."},"id":"u1-l1-f1-08","unit":1,"correct":"D","why_correct":"Ferreira's specific claim is an energy trade-off: savings from eye loss go into other senses. Denser touch receptors in eyeless populations than sighted relatives directly supports that redirection.","passage":"Biologist Sofia Ferreira hypothesizes that a cave-dwelling salamander lost its eyes over evolutionary time not simply because vision was useless in the dark but because the energy saved by not building eyes was redirected to other senses, predicting that eyeless populations invest more in touch-sensitive organs than sighted relatives do.","stem":"Which finding, if true, would most directly support Ferreira's hypothesis?","choices":{"B":"The cave environment the salamanders inhabit is completely dark year-round.","C":"Several unrelated cave-dwelling animals, including certain fish and insects, have independently lost their eyes over evolutionary time after countless generations spent in the perpetual darkness far from any source of light.","A":"The salamander's surface-dwelling relatives rely heavily on vision to locate the small invertebrates they feed on, hunting by sight in daylight much as many other surface amphibians of the same family do.","D":"Eyeless cave populations develop markedly denser arrays of touch receptors along their skin than closely related surface populations that retain eyes."},"lesson_name":"Command of Evidence: Textual","target_family":"Konuyla ilgili iddiayla ilgisiz"},{"why_correct":"Takahashi claims the sonatas were pedagogical, their difficulty tracking a teaching sequence. One new technique per sonata in the exact order of lesson books directly links the set to instruction.","why_wrong":{"D":"The general prevalence of teaching pieces does not tie this set to instruction.","C":"That concerts featured similar sonatas points toward performance, the use Takahashi argues against.","B":"Being copied alongside famous composers concerns the contents and ownership of the manuscript, not whether the set was written to teach."},"choice_families":{"D":"Çok genel","C":"Ters yön","B":"Konuyla ilgili iddiayla ilgisiz"},"lesson_name":"Command of Evidence: Textual","passage":"Musicologist Ren Takahashi proposes that a set of anonymous eighteenth-century sonatas was written for teaching rather than public performance, arguing that their steadily increasing technical difficulty across the set mirrors the order in which skills were introduced in period instruction manuals.","correct":"A","unit":1,"id":"u1-l1-f1-09","lesson":1,"target_family":"Konuyla ilgili iddiayla ilgisiz","stem":"Which finding, if true, would most directly support Takahashi's proposal?","choices":{"B":"The sonatas were copied into a single manuscript alongside works by several well-known composers of the day, bound together in an ornate volume that appears to have been assembled for a wealthy private collector.","C":"Public concerts in the period often featured sonatas of comparable length.","A":"Each sonata in the set introduces exactly one new technique not required by the sonatas before it, in the same sequence taught in surviving lesson books of the time.","D":"Teaching pieces were widely produced in the eighteenth century."}},{"id":"u1-l1-f1-10","lesson":1,"passage":"Geologist Nadia Popescu contends that a layer of fine ash found across a wide region settled from a single volcanic eruption rather than accumulating from many smaller events, citing the layer's uniform thickness over hundreds of kilometers.","correct":"B","unit":1,"stem":"Which finding, if true, would most directly support Popescu's contention?","choices":{"A":"Volcanic ash layers are found at many depths in the region's sediments.","D":"Fine ash can be carried great distances by high-altitude winds.","B":"The ash throughout the layer shares an identical chemical signature that matches one specific eruption and no others in the region's record.","C":"The region has experienced numerous volcanic eruptions over the past million years, some of them violent enough to blanket the surrounding valleys in ash and to reshape the courses of the local rivers."},"target_family":"Konuyla ilgili iddiayla ilgisiz","why_wrong":{"A":"Many ash layers at many depths suggests multiple events, working against a single-eruption origin.","D":"That ash travels far explains the layer's spread but not whether one or many eruptions produced it.","C":"A long regional history of many eruptions is background that does not tie this particular ash layer to one event rather than several."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","A":"Ters yön"},"why_correct":"Popescu claims a single eruption produced the layer. An identical chemical signature matching one eruption throughout directly indicates a single source.","lesson_name":"Command of Evidence: Textual"},{"why_correct":"Kaya claims the dinosaurs fed low. Tooth wear matching gritty ground-level plants directly indicates a low-browsing diet.","choice_families":{"A":"Ters yön","D":"Çok genel","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"A":"Stomach contents of high conifer foliage indicate the opposite, high feeding, undercutting rather than supporting the claim.","D":"The animals' great size is general background unrelated to what they ate.","C":"The presence of other grazers concerns the ecosystem, not this species' feeding height."},"lesson_name":"Command of Evidence: Textual","correct":"B","unit":1,"passage":"Paleontologist Idris Kaya hypothesizes that a group of long-necked dinosaurs fed mainly on low-growing vegetation, despite their height, arguing that the structure of their neck vertebrae limited how far upward they could raise their heads.","lesson":1,"id":"u1-l1-f2-01","target_family":"Ters yön","stem":"Which finding, if true, would most directly support Kaya's hypothesis?","choices":{"B":"Microscopic wear patterns on the dinosaurs' teeth match the abrasion produced by ground-level plants rich in grit, not by foliage from tall trees.","C":"The dinosaurs shared their habitat with shorter species that grazed on ferns.","A":"Fossilized stomach contents from the dinosaurs consist largely of leaves from the crowns of tall conifers.","D":"Long-necked dinosaurs are among the largest land animals ever to have lived."}},{"lesson":1,"id":"u1-l1-f2-02","correct":"C","unit":1,"passage":"Sociologist Mei-Ling Zhou argues that a city's decision to convert several downtown streets into pedestrian-only zones increased business for local shops, contending that foot traffic, not vehicle access, drives sales in dense commercial districts.","choices":{"C":"Shops along the converted streets reported higher revenue in the year after the change than in the year before, while comparable shops on unchanged streets saw no such rise.","B":"Several shops on the converted streets closed within a year of the change, citing lost customers who had driven in.","A":"The city added bicycle parking near the converted streets at the same time.","D":"Pedestrian zones have been introduced in many cities around the world."},"stem":"Which finding, if true, would most directly support Zhou's argument?","target_family":"Ters yön","choice_families":{"B":"Ters yön","A":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel"},"why_wrong":{"A":"Added bicycle parking is a coinciding change that muddies rather than supports the specific claim.","D":"The worldwide spread of pedestrian zones is too general to bear on this city's outcome.","B":"Closures blamed on lost drive-in customers point to a decline, contradicting the claim."},"why_correct":"Zhou claims the change raised business. A revenue rise on converted streets but not on comparable unchanged streets directly ties the gain to the conversion.","lesson_name":"Command of Evidence: Textual"},{"lesson_name":"Command of Evidence: Textual","why_correct":"Bello claims the coating works by blocking oxygen, not neutralizing acid. Indifference to acidity plus rapid corrosion once air reaches scratched metal points precisely to an oxygen barrier.","choice_families":{"A":"Çok genel","B":"Ters yön","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"A":"The general cost of corrosion does not bear on how this coating works.","B":"Better performance specifically in acidic conditions suggests acid neutralization, the mechanism Bello rules out.","C":"Ease of application is a practical trait unrelated to the corrosion mechanism."},"target_family":"Ters yön","stem":"Which finding, if true, would most directly support Bello's proposal?","choices":{"D":"Steel treated with the coating corrodes no faster in acidic conditions than in neutral ones, but corrodes rapidly once the coating is scratched to expose bare metal to air.","A":"Corrosion is a costly problem across many industries that rely on steel.","B":"Steel treated with the coating corrodes markedly more slowly in acidic conditions than untreated steel does.","C":"The coating can be applied to steel at room temperature."},"correct":"D","unit":1,"passage":"Chemist Olamide Bello proposes that a newly synthesized coating slows corrosion in steel by forming a barrier that blocks oxygen from reaching the metal's surface, rather than by neutralizing acids as older coatings do.","lesson":1,"id":"u1-l1-f2-03"},{"passage":"Historian Paulo Rivas contends that a colonial-era road was built primarily to move troops rapidly between garrisons, not to promote trade, pointing to its straight course through sparsely populated terrain that bypassed the region's market towns.","correct":"A","unit":1,"id":"u1-l1-f2-04","lesson":1,"target_family":"Ters yön","stem":"Which finding, if true, would most directly support Rivas's contention?","choices":{"B":"Merchants' account books from the era record frequent shipments of goods along the road between market towns.","C":"The road was paved with stone quarried near its midpoint.","A":"Surviving military dispatches from the period repeatedly describe using the road to reinforce distant garrisons on short notice, with no mention of commercial use.","D":"Roads served many purposes in colonial administration."},"why_correct":"Rivas claims a military purpose over trade. Dispatches describing troop movement and no commerce directly supports the military-first reading.","why_wrong":{"C":"The paving material concerns construction, not the road's purpose.","B":"Records of frequent commercial shipments point to the trade purpose Rivas argues against.","D":"That roads served many purposes is too general to establish this road's primary aim."},"choice_families":{"D":"Çok genel","B":"Ters yön","C":"Konuyla ilgili iddiayla ilgisiz"},"lesson_name":"Command of Evidence: Textual"},{"id":"u1-l1-f2-05","why_wrong":{"D":"A general reliance on memory across animals does not test the seasonal mechanism proposed.","A":"Retrieving fewer caches when caching is reduced concerns behavior, not the seasonal brain change Vogel predicts.","C":"The family's vocal complexity is unrelated to spatial memory."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","A":"Tek unsur"},"lesson":1,"passage":"Neuroscientist Hana Vogel hypothesizes that a bird species' remarkable spatial memory for thousands of hidden food caches arises from an enlarged brain region devoted to spatial processing, which she predicts grows seasonally as caching begins.","correct":"B","why_correct":"Vogel's specific prediction is seasonal growth of the spatial region tied to caching. Measured autumn expansion at caching onset and later contraction directly confirms it.","unit":1,"choices":{"B":"The spatial-processing region of the birds' brains expands measurably each autumn as caching starts and contracts again after the caches are recovered.","C":"The birds belong to a family known for complex vocalizations.","D":"Many animals rely on memory to locate stored or hidden resources.","A":"The birds retrieve fewer of their caches in years when food is abundant and caching is reduced."},"stem":"Which finding, if true, would most directly support Vogel's hypothesis?","target_family":"Ters yön","lesson_name":"Command of Evidence: Textual"},{"choice_families":{"D":"Çok genel","A":"Ters yön","B":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"B":"The number of surviving copies speaks to the poem's popularity, not to singing.","A":"Readers prizing silent reading points toward the opposite of oral performance.","D":"The common themes of medieval poems are too general to bear on how this one was used."},"why_correct":"Rossi claims the poem was meant to be sung. Melody notation aligned to its verses in the earliest manuscript directly indicates musical performance.","lesson_name":"Command of Evidence: Textual","lesson":1,"id":"u1-l1-f2-06","correct":"C","unit":1,"passage":"Literary scholar Bianca Rossi argues that an anonymous medieval poem was composed to be sung rather than read silently, citing its regular refrains and its heavy use of sound patterns that reward the ear more than the eye.","stem":"Which finding, if true, would most directly support Rossi's argument?","choices":{"B":"The poem survives in more manuscript copies than any other work of its period.","C":"Musical notation for a melody appears in the margins of the earliest surviving manuscript of the poem, aligned line by line with its verses.","A":"The poem's earliest readers are known to have prized silent, private reading.","D":"Medieval poems often addressed themes of love and loss."},"target_family":"Ters yön"},{"id":"u1-l1-f2-07","lesson":1,"passage":"Agronomist Yusuf Demir proposes that intercropping beans with maize raises total yield because the beans enrich the soil with nitrogen that the maize can then use, rather than because the two crops simply occupy space more efficiently.","correct":"D","unit":1,"choices":{"D":"Maize grown beside beans shows elevated nitrogen levels in its tissues and outyields maize given the same spacing but paired with a non-nitrogen-fixing plant.","A":"Intercropping is practiced by farmers on several continents.","C":"Beans and maize have been grown together in the region for centuries.","B":"Fields intercropping beans and maize produce more total plant matter per hectare than fields of maize alone."},"stem":"Which finding, if true, would most directly support Demir's proposal?","target_family":"Ters yön","why_wrong":{"A":"The worldwide use of intercropping is too general to test Demir's specific claim.","B":"Greater total plant matter shows a yield gain but not whether nitrogen or spacing produced it.","C":"The long local tradition of the practice does not identify the mechanism."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","B":"Tek unsur","A":"Çok genel"},"why_correct":"Demir's mechanism is nitrogen enrichment, not mere spacing. Higher nitrogen in maize beside beans, plus a gain over maize paired with a non-fixing plant at equal spacing, isolates nitrogen as the cause.","lesson_name":"Command of Evidence: Textual"},{"why_correct":"Aydar claims trade, not migration, brought the beads. Their appearance with other coast-traceable goods in exchange-typical quantities supports arrival through trade.","choice_families":{"D":"Konuyla ilgili iddiayla ilgisiz","B":"Ters yön","C":"Çok genel"},"why_wrong":{"D":"The length of occupation is unrelated to how the beads arrived.","B":"Evidence that the inhabitants themselves spent time on the coast supports migration, the explanation Aydar rejects.","C":"The general value of shell beads does not distinguish trade from migration."},"lesson_name":"Command of Evidence: Textual","unit":1,"correct":"A","passage":"Anthropologist Selin Aydar contends that a set of shell beads found far inland reached the site through long-distance trade rather than seasonal migration by the site's inhabitants, noting that the beads come from a coastal species the inhabitants are not known to have traveled to collect.","lesson":1,"id":"u1-l1-f2-08","target_family":"Ters yön","stem":"Which finding, if true, would most directly support Aydar's contention?","choices":{"A":"The beads appear at the inland site alongside other goods traceable to the same distant coast, in the quantities typical of exchanged goods rather than personally gathered ones.","D":"The inland site was occupied for several centuries.","C":"Shell beads were valued ornaments in many ancient societies.","B":"Isotopic analysis of the inhabitants' remains shows they spent part of each year on the coast where the shells originate."}},{"stem":"Which finding, if true, would most directly support Mwangi's hypothesis?","choices":{"D":"Many desert animals have adaptations that reduce their need for water.","A":"The rodents produce urine far more concentrated than that of any related species.","B":"Rodents fed only dry seeds maintain stable body water even when their urine is no more concentrated than that of related species that must drink.","C":"The rodents are active mainly at night, when desert air is cooler."},"target_family":"Ters yön","id":"u1-l1-f2-09","lesson":1,"passage":"Physiologist Grace Mwangi hypothesizes that a desert rodent survives without drinking by producing metabolic water from the dry seeds it eats, rather than by minimizing water loss through unusually concentrated urine.","correct":"B","unit":1,"lesson_name":"Command of Evidence: Textual","why_wrong":{"D":"A general note about desert adaptations does not test the specific mechanism.","A":"Exceptionally concentrated urine supports the water-conservation mechanism Mwangi rules out.","C":"Nighttime activity reduces heat exposure but does not show water is made from seeds."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","A":"Ters yön"},"why_correct":"Mwangi's claim is metabolic water production, not water conservation via concentrated urine. Stable body water on dry seeds despite ordinary urine concentration points to internal water generation."},{"why_correct":"Salas claims influence came from selection of topics, not editorials. Covered topics driving later debate regardless of editorial stance directly supports agenda-setting through selection.","why_wrong":{"B":"Editorials quoted in speeches points to editorial influence, the channel Salas downplays.","A":"The size of the reporting staff concerns the paper's capacity to gather news, not whether its selection of topics, rather than its editorials, set the public agenda.","D":"The general importance of newspapers in the era is too broad to show that this paper shaped opinion through its choice of what to cover."},"choice_families":{"B":"Ters yön","A":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel"},"lesson_name":"Command of Evidence: Textual","passage":"Political historian Diego Salas argues that a nineteenth-century newspaper shaped public opinion less through its editorials than through its choice of which events to report at all, contending that its selective coverage set the agenda readers debated.","unit":1,"correct":"C","id":"u1-l1-f2-10","lesson":1,"target_family":"Ters yön","choices":{"B":"The newspaper's editorials were quoted approvingly in political speeches of the period.","C":"Topics the newspaper chose to cover, regardless of the stance its editorials took, became the subjects most discussed in readers' letters and rival papers in the following weeks.","D":"Newspapers were a leading source of public information throughout the nineteenth century, shaping what ordinary readers knew about distant events at a time when few other channels of news reached the general public.","A":"The newspaper employed more reporters on its staff than any of its competitors in the city, maintaining correspondents in several outlying districts and a larger office than any rival paper of the period could afford."},"stem":"Which finding, if true, would most directly support Salas's argument?"},{"correct":"C","why_correct":"Cho's claim has two parts: heat-tolerant algae and rapid replacement. Only the finding showing both the algae's superior tolerance and the days-not-weeks recovery supports the full proposal.","unit":1,"passage":"Marine biologist Renata Cho proposes that a coral species survives warming seas better than its relatives both because it hosts unusually heat-tolerant algae and because it can expel and quickly replace those algae when stressed, minimizing the time it spends without them.","choice_families":{"B":"Tek unsur","A":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel"},"lesson":1,"id":"u1-l1-f3-01","why_wrong":{"B":"Superior algal tolerance addresses only the first part and says nothing about rapid replacement.","D":"A general statement about varying coral sensitivity does not support this specific two-part claim.","A":"Sharing reef zones with vulnerable relatives is on topic but tests neither part of the claim."},"target_family":"Tek unsur","lesson_name":"Command of Evidence: Textual","stem":"Which finding, if true, would most strongly support Cho's proposal?","choices":{"D":"Coral species worldwide vary in their sensitivity to rising sea temperatures.","A":"The coral occupies the same reef zones as several of its more vulnerable relatives.","C":"The coral hosts algae that withstand higher temperatures than the algae of related species, and it reacquires expelled algae within days rather than the weeks its relatives require.","B":"The algae hosted by the coral tolerate temperatures several degrees higher than those tolerated by the algae of related species."}},{"target_family":"Tek unsur","choices":{"C":"The guild maintained a hall in the city center where members gathered.","B":"The guild's charter granted its members the sole right to sell finished cloth throughout the region.","D":"Surviving records show the guild both set strict limits on the number of apprentices admitted each year and held a charter barring non-members from selling cloth at regional markets.","A":"Craft guilds were a common feature of urban economies across medieval Europe, regulating trades and defending their members' interests in town after town throughout the centuries when the cloth guild described here was active."},"stem":"Which finding, if true, would most strongly support Obi's argument?","unit":1,"correct":"D","passage":"Historian Nkechi Obi argues that a guild in a medieval city maintained its dominance over cloth production both by controlling who could be trained in the craft and by securing exclusive rights to sell finished cloth in the region's markets.","lesson":1,"id":"u1-l1-f3-02","lesson_name":"Command of Evidence: Textual","why_correct":"Obi names two mechanisms: control of training and exclusive sales rights. Only the finding documenting both apprenticeship limits and the sales charter supports the full argument.","choice_families":{"B":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz","A":"Çok genel"},"why_wrong":{"C":"The guild hall concerns its premises, not either mechanism of dominance.","B":"The exclusive sales right covers one mechanism but leaves control of training unaddressed.","A":"The general prevalence of guilds across medieval Europe does not show that this guild held its dominance through both restricted training and exclusive sales rights."}},{"target_family":"Tek unsur","stem":"Which finding, if true, would most strongly support Rao's proposal?","choices":{"C":"The bridge's supports are anchored in bedrock beneath the riverbed.","B":"During simulated quakes, the deck slid smoothly on its flexible bearings without binding.","A":"In shake-table tests, the deck slid smoothly on its bearings during simulated quakes, and sensors confirmed that the dampers absorbed most of the motion's energy before it reached the supports.","D":"Earthquake-resistant designs have become standard for large bridges built in seismically active regions, where engineers routinely combine flexible supports, energy-absorbing components, and reinforced foundations to guard against sudden ground motion."},"correct":"A","unit":1,"passage":"Engineer Priyanka Rao proposes that a new bridge design withstands earthquakes both by allowing its deck to slide slightly on flexible bearings and by channeling the resulting motion into dampers that absorb the energy before it stresses the supports.","lesson":1,"id":"u1-l1-f3-03","lesson_name":"Command of Evidence: Textual","why_correct":"Rao's design has two working parts: sliding bearings and energy-absorbing dampers. Only the finding confirming both the sliding and the dampers' absorption supports the full proposal.","choice_families":{"D":"Çok genel","B":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"D":"The general adoption of quake-resistant designs says nothing about whether this particular bridge works through both sliding bearings and energy-absorbing dampers.","C":"How the supports are anchored is on topic but tests neither part of the mechanism.","B":"Smooth sliding confirms the bearings alone and says nothing about the dampers absorbing energy."}},{"lesson_name":"Command of Evidence: Textual","why_correct":"Kaplan names two factors: fungal partnership and fire-triggered germination. Only the finding showing both the fungi and the heat-or-smoke germination requirement supports the full argument.","why_wrong":{"D":"A general statement about plant-fungi partnerships does not confirm that this wildflower depends on both the fungi and fire-triggered germination.","A":"The fungal partnership addresses one factor and leaves the fire-dependent germination untested.","C":"Low rainfall describes the habitat but tests neither the fungal partnership nor the fire-triggered germination Kaplan names."},"choice_families":{"D":"Çok genel","A":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz"},"target_family":"Tek unsur","choices":{"A":"The wildflower's roots are consistently colonized by fungi that draw scarce minerals from the soil.","D":"Many plants across a wide variety of habitats form beneficial partnerships with soil fungi, trading sugars for water and scarce nutrients their roots could not otherwise reach, an association found in ecosystems the world over.","C":"The slopes where the wildflower grows receive little rainfall for much of the year, drying to bare, dusty ground each summer before the brief rains of autumn briefly green the surrounding hillsides.","B":"The wildflower's roots consistently host mineral-gathering fungi, and its seeds fail to germinate in the laboratory unless first exposed to heat or smoke of the kind produced by wildfire."},"stem":"Which finding, if true, would most strongly support Kaplan's argument?","passage":"Botanist Emre Kaplan argues that a wildflower thrives on nutrient-poor slopes both because its roots partner with fungi that extract scarce minerals and because its seeds germinate only after the fires that periodically clear competing vegetation.","unit":1,"correct":"B","id":"u1-l1-f3-04","lesson":1},{"choice_families":{"D":"Çok genel","A":"Konuyla ilgili iddiayla ilgisiz","B":"Tek unsur"},"why_wrong":{"B":"Rising employment addresses the investment driver alone, not the export effect.","D":"A general claim that recoveries have several causes does not support this specific two-part proposal.","A":"Modest population growth is on topic for the region but tests neither the public-investment driver nor the export effect Nasser names."},"why_correct":"Nasser names two drivers: public investment and a cheaper currency boosting exports. Only the finding showing both the employment jump and the export surge tied to the currency's fall supports the full proposal.","lesson_name":"Command of Evidence: Textual","lesson":1,"id":"u1-l1-f3-05","unit":1,"correct":"C","passage":"Economist Leila Nasser proposes that a region's rapid recovery from a downturn owed both to public investment that put people back to work and to a fall in the local currency's value that made the region's exports cheaper abroad.","stem":"Which finding, if true, would most strongly support Nasser's proposal?","choices":{"D":"Economic recoveries generally depend on several reinforcing factors.","A":"The region's population grew modestly over the years of the recovery, with towns along the coast gaining residents as families moved in from the surrounding countryside in search of steadier, better-paid work.","B":"Employment in the region rose sharply once the public investment projects were under way.","C":"Employment rose sharply as public projects began, and in the same period the currency's decline coincided with a marked jump in orders for the region's exports from foreign buyers."},"target_family":"Tek unsur"},{"lesson":1,"id":"u1-l1-f3-06","correct":"D","unit":1,"passage":"Zoologist Tunde Bassey proposes that a frog species avoids predators both by secreting a bitter toxin through its skin and by displaying bright coloration that warns experienced predators to keep away.","choices":{"A":"Bright coloration serves a warning function in a wide range of animals, from insects to amphibians, signalling to would-be predators that the creature displaying it is toxic, distasteful, or otherwise best left alone.","D":"The frog's skin secretions taste bitter enough to deter predators, and predators that have once tasted the frog thereafter avoid others sharing its bright coloration.","C":"The frog is most active during the cooler hours of the early morning.","B":"Chemical analysis confirms that the frog's skin secretes a distinctly bitter compound."},"stem":"Which finding, if true, would most strongly support Bassey's proposal?","target_family":"Tek unsur","choice_families":{"A":"Çok genel","B":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"A":"A general statement about warning coloration across many animals does not show that this frog relies on both a bitter toxin and a warning color predators learn to avoid.","B":"Confirming the bitter secretion addresses one defense and leaves the warning-color function untested.","C":"The frog's activity time is on topic but tests neither defense."},"why_correct":"Bassey names two defenses: a bitter toxin and warning coloration that predators learn. Only the finding showing both the deterrent secretion and predators avoiding the color after tasting supports the full proposal.","lesson_name":"Command of Evidence: Textual"},{"lesson":1,"id":"u1-l1-f3-07","correct":"A","unit":1,"passage":"Historian Camille Fournier argues that a printing house came to dominate the book trade in its city both because it obtained a royal privilege shielding its titles from copying and because it built a distribution network reaching booksellers in distant towns.","stem":"Which finding, if true, would most strongly support Fournier's argument?","choices":{"D":"Printing houses of the era competed for advantages of many kinds, seeking royal favor, skilled workers, reliable paper supplies, and profitable titles as they struggled to outlast their rivals in a crowded and uncertain trade.","A":"Records show the printing house held a royal privilege against unauthorized reprints and maintained standing accounts with booksellers in a dozen distant towns.","C":"The printing house operated several presses under one roof.","B":"A royal privilege protected the printing house's titles from being reprinted by rivals."},"target_family":"Tek unsur","choice_families":{"D":"Çok genel","B":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"D":"A general statement about competition among printers does not show that this house owed its dominance to both a royal privilege and a distant distribution network.","B":"The royal privilege covers legal protection alone, not the distribution network.","C":"The number of presses concerns capacity, not either named source of dominance."},"why_correct":"Fournier names two sources of dominance: legal protection and a distribution network. Only the finding documenting both the privilege and the distant bookseller accounts supports the full argument.","lesson_name":"Command of Evidence: Textual"},{"passage":"Climate scientist Ingrid Halvorsen proposes that a coastal marsh limits flooding in the town behind it both by absorbing storm water into its spongy soil and by slowing incoming waves as they pass through its dense grasses.","unit":1,"correct":"B","id":"u1-l1-f3-08","lesson":1,"target_family":"Tek unsur","choices":{"A":"During storms, the marsh's soil absorbs large volumes of incoming storm water.","D":"Coastal wetlands are widely recognized for reducing flood risk, buffering the land behind them against storms along temperate and tropical coastlines alike wherever such marshes have been allowed to remain intact.","B":"During storms, the marsh soil takes up large volumes of water, and wave-height sensors show waves losing much of their force as they cross the marsh's grasses before reaching the town.","C":"The marsh is home to several species of wading birds, which nest among its grasses in spring and feed along its channels, drawing birdwatchers from the town throughout the warmer months of the year."},"stem":"Which finding, if true, would most strongly support Halvorsen's proposal?","why_correct":"Halvorsen names two protections: soil absorption and wave slowing. Only the finding showing both the water uptake and the measured loss of wave force supports the full proposal.","why_wrong":{"C":"The marsh's bird life is on topic for the wetland but tests neither the soil absorption nor the wave slowing Halvorsen names.","D":"A general statement about wetlands and flood risk does not confirm that this marsh protects the town through both soil absorption and wave slowing.","A":"Soil absorption addresses one protection and leaves the wave-slowing effect untested."},"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","A":"Tek unsur"},"lesson_name":"Command of Evidence: Textual"},{"correct":"C","unit":1,"passage":"Literary scholar Daniel Wexler argues that a novelist revised her manuscript both to sharpen the moral ambiguity of her protagonist and to compress a sprawling timeline into a single decisive season.","lesson":1,"id":"u1-l1-f3-09","target_family":"Tek unsur","stem":"Which finding, if true, would most strongly support Wexler's argument?","choices":{"B":"Across successive drafts, the protagonist's motives become steadily more difficult to judge as simply good or bad.","C":"Across successive drafts, the protagonist's choices grow harder to judge as clearly right or wrong, and events once spread over several years are drawn together into the span of one summer.","A":"The novelist kept detailed notebooks throughout the years she spent writing the book, filling them with character sketches, fragments of dialogue, and lists of possible titles that she crossed out and revised again and again.","D":"Novelists frequently revise their manuscripts substantially before publication."},"why_correct":"Wexler names two aims: deepening moral ambiguity and compressing the timeline. Only the finding showing both the harder-to-judge protagonist and the collapse of years into one season supports the full argument.","choice_families":{"D":"Çok genel","A":"Konuyla ilgili iddiayla ilgisiz","B":"Tek unsur"},"why_wrong":{"D":"A general statement that novelists revise heavily does not support this specific two-part claim.","A":"The novelist's working notebooks concern her process, not whether her revisions both deepened the protagonist's ambiguity and compressed the timeline.","B":"The protagonist's growing ambiguity addresses one aim and leaves the timeline compression untested."},"lesson_name":"Command of Evidence: Textual"},{"target_family":"Tek unsur","choices":{"B":"In trials, the design's wider mirror collected substantially more light than standard mirrors did.","C":"The telescope is intended for a site at high altitude in a dry climate.","D":"In trials, the wider mirror collected substantially more light than standard mirrors, and the real-time correction system measurably reduced atmospheric blurring in the resulting images.","A":"Larger mirrors have long been used to improve astronomical images, since a wider surface gathers more light and reveals fainter, more distant objects than the smaller instruments of earlier generations could ever detect."},"stem":"Which finding, if true, would most strongly support Nakamura's proposal?","correct":"D","unit":1,"passage":"Physicist Aya Nakamura proposes that a proposed telescope design produces sharper images both by using a wider mirror that gathers more light and by correcting, in real time, the blurring that the atmosphere introduces.","lesson":1,"id":"u1-l1-f3-10","lesson_name":"Command of Evidence: Textual","why_correct":"Nakamura names two contributors to sharpness: a wider light-gathering mirror and real-time atmospheric correction. Only the finding confirming both supports the full proposal.","choice_families":{"B":"Tek unsur","C":"Konuyla ilgili iddiayla ilgisiz","A":"Çok genel"},"why_wrong":{"C":"The intended site is on topic but tests neither part of the design.","B":"The wider mirror's light gathering addresses one contributor and leaves the atmospheric correction untested.","A":"A general statement about larger mirrors does not show that this design sharpens images through both a wider mirror and real-time atmospheric correction."}},{"why_wrong":{"A":"Range-wide average warming does not show that this particular population, unlike its neighbors, shifted its timing in response to local temperatures.","B":"A worldwide trend among migratory birds is too general to establish this one population's specific, distinctive shift while its neighbors did not change.","C":"The species' broad range is general background unrelated to this population's timing."},"id":"u1-l1-f4-01","lesson":1,"choice_families":{"A":"Çok genel","B":"Çok genel","C":"Konuyla ilgili iddiayla ilgisiz"},"passage":"Ornithologist Sabine Roux proposes that a particular warbler population, unlike neighboring populations of the same species, has begun migrating a month earlier in response to warmer springs at its breeding grounds.","correct":"D","why_correct":"Roux's claim is specific: this population, unlike its neighbors, shifted its timing with local warming. The population's advancing departure tracking local temperature while neighbors stay put confirms exactly that contrast.","unit":1,"stem":"Which finding, if true, would most directly support Roux's proposal?","choices":{"A":"Spring temperatures have risen, on average, across the warbler's entire range over recent decades, part of a broad warming trend that has reached the breeding grounds of many songbird species across the continent.","D":"Over the past two decades, this population's departure date has advanced in step with rising spring temperatures at its breeding grounds, while neighboring populations' dates have not shifted.","B":"Migratory birds around the world are adjusting the timing of their seasonal movements as the climate warms, with many species now arriving at or departing from their breeding grounds earlier than records from a century ago describe.","C":"The warbler species as a whole occupies a broad range across the continent."},"target_family":"Çok genel","lesson_name":"Command of Evidence: Textual"},{"lesson_name":"Command of Evidence: Textual","choice_families":{"B":"Çok genel","C":"Çok genel","D":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"D":"The general importance of print in the era does not establish this pamphlet's particular role.","B":"A region-wide role for pamphlets is too general to single out the decisive effect of this one pamphlet in this one city.","C":"Mounting regional tension points to the broad explanation Feld sets aside, not the specific spark."},"why_correct":"Feld credits one specific pamphlet in one city. Protest beginning there within days, while neighboring towns lagged by months, isolates the pamphlet's local effect from the broader regional unrest.","stem":"Which finding, if true, would most directly support Feld's argument?","choices":{"A":"In that city, organized protest began within days of the pamphlet's appearance, though the same unrest did not reach neighboring towns until months afterward.","D":"Printed material played an important role in the politics of the era.","B":"Political pamphlets circulated widely and shaped public opinion throughout the region during the 1770s, passing from hand to hand in taverns and markets and feeding the mounting political arguments of that turbulent decade.","C":"The 1770s were a decade of mounting tension across the wider region."},"target_family":"Çok genel","lesson":1,"id":"u1-l1-f4-02","unit":1,"correct":"A","passage":"Historian Marcus Feld argues that one specific pamphlet, published in a single city in 1775, was the decisive spark for a local uprising, rather than the broader unrest already spreading through the wider region."},{"choice_families":{"C":"Konuyla ilgili iddiayla ilgisiz","A":"Çok genel","D":"Çok genel"},"why_wrong":{"C":"General progress in filtration technology does not establish this town's particular outcome.","D":"The general importance of clean water does not tie the decline to this specific plant.","A":"A region-wide decline is the general improvement Menon argues against, not evidence that this town's own filtration plant produced its particular drop."},"why_correct":"Menon credits this town's specific plant over general regional improvement. A sharp local drop absent in nearby towns sharing the same water but lacking new plants isolates the plant's effect.","lesson_name":"Command of Evidence: Textual","lesson":1,"id":"u1-l1-f4-03","correct":"B","unit":1,"passage":"Epidemiologist Ravi Menon proposes that a decline in a specific town's rate of a waterborne illness after 2015 resulted from the town's new filtration plant in particular, not from the general improvement in regional water quality over the same years.","stem":"Which finding, if true, would most directly support Menon's proposal?","choices":{"B":"After 2015, the illness fell sharply in this town but stayed roughly constant in nearby towns that drew from the same regional water sources but lacked new filtration plants.","C":"Modern filtration technology has improved considerably over the past several decades.","A":"Rates of waterborne illness declined across the region as a whole after 2010, as several towns upgraded their water systems and growing public awareness of contamination slowly spread through the surrounding districts.","D":"Clean water is essential to preventing many waterborne illnesses."},"target_family":"Çok genel"},{"choice_families":{"D":"Çok genel","A":"Çok genel","B":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"D":"The general importance of rhythm does not establish this composer's specific priority.","A":"Widespread rhythmic experimentation among many composers points away from a single pioneer and does not show this composer originated the technique.","B":"That the technique later spread is on topic but does not show this composer originated it."},"why_correct":"Nwosu credits one specific composer as the pioneer. The technique appearing in her work years before any contemporary's, with contemporaries known to have studied her, directly supports her priority.","lesson_name":"Command of Evidence: Textual","lesson":1,"id":"u1-l1-f4-04","unit":1,"correct":"C","passage":"Musicologist Clara Nwosu argues that one particular composer, rather than her contemporaries generally, pioneered a distinctive rhythmic technique that later became widespread.","stem":"Which finding, if true, would most directly support Nwosu's argument?","choices":{"C":"The technique appears in this composer's works dated years before any surviving example by her contemporaries, several of whom are known to have studied her scores.","B":"The rhythmic technique became common among composers across the following generation.","D":"Rhythm is a fundamental element of nearly all musical composition.","A":"The period saw a great deal of experimentation with rhythm among many composers, who traded ideas freely in the salons and conservatories where new techniques were tried out, refined, and passed from one hand to another."},"target_family":"Çok genel"},{"stem":"Which finding, if true, would most directly support Alves's proposal?","choices":{"B":"Pollution levels fell throughout the river system over the years in question.","C":"Otters are known to shape the ecosystems of many rivers they inhabit, preying on fish and shellfish and altering the balance of species in the waters where they establish themselves across their range.","A":"Healthy rivers generally support larger and more varied fish populations than degraded ones, offering cleaner water, richer food, and more sheltered spawning grounds for the many species that live along their length.","D":"Fish numbers rebounded on the stretch of river where otters returned but remained low on an equally clean stretch of the same river where otters were still absent."},"target_family":"Çok genel","lesson":1,"id":"u1-l1-f4-05","unit":1,"correct":"D","passage":"Ecologist Bruno Alves proposes that the return of a specific predator, the otter, to one river, in particular, restored that river's fish populations, rather than the general cleanup of the river system that occurred in the same years.","lesson_name":"Command of Evidence: Textual","choice_families":{"A":"Konuyla ilgili iddiayla ilgisiz","B":"Çok genel","C":"Çok genel"},"why_wrong":{"C":"A general statement about otters shaping rivers does not establish that the otters, not the system-wide cleanup, restored this river's fish.","B":"A system-wide fall in pollution is the general explanation Alves argues against.","A":"The general link between clean rivers and abundant fish does not tie this river's rebound to the otters rather than to the wider cleanup."},"why_correct":"Alves credits the otters' return over the general cleanup. Fish rebounding where otters returned but not on an equally clean otterless stretch isolates the otters' specific effect."},{"stem":"Which finding, if true, would most directly support Haddad's argument?","choices":{"C":"Craft techniques have spread between cultures throughout recorded history.","B":"Long-distance trade linked many distant civilizations during the period.","D":"The two civilizations exchanged a wide variety of goods over many centuries, trading foodstuffs, textiles, metals, and luxury items back and forth along the several routes that linked their territories during that long period.","A":"The technique appears at sites along this route in a clear sequence from the source civilization outward, and is absent from sites connected only by other trade routes."},"lesson_name":"Command of Evidence: Textual","target_family":"Çok genel","why_wrong":{"C":"That techniques spread across cultures generally does not identify this specific route.","B":"The general existence of long-distance trade is the broad explanation Haddad narrows down from.","D":"A broad exchange of many goods does not show that this particular route, rather than long-distance trade in general, carried the craft technique."},"id":"u1-l1-f4-06","lesson":1,"choice_families":{"D":"Konuyla ilgili iddiayla ilgisiz","B":"Çok genel","C":"Çok genel"},"passage":"Historian Yara Haddad argues that one specific trade route, rather than long-distance commerce in general, carried a particular craft technique from one civilization to another.","unit":1,"why_correct":"Haddad credits one specific route. The technique appearing in sequence along that route and absent where only other routes connected sites isolates this route as the path of transmission.","correct":"A"},{"lesson":1,"id":"u1-l1-f4-07","correct":"B","unit":1,"passage":"Neuroscientist Petra Lindqvist proposes that one specific brain region, not the broad network active during memory tasks generally, is essential for recalling the order in which events occurred.","stem":"Which finding, if true, would most directly support Lindqvist's proposal?","choices":{"A":"A broad network of brain regions becomes active whenever people perform memory tasks of almost any kind, lighting up together in scans as the brain encodes, holds, and later retrieves the information a task requires.","D":"Different memory tasks draw on overlapping sets of brain regions.","C":"Memory is among the most intensively studied functions in neuroscience.","B":"Patients with damage confined to that single region can recall which events happened but not their sequence, while patients with damage elsewhere in the network retain the sequence."},"target_family":"Çok genel","choice_families":{"A":"Çok genel","D":"Çok genel","C":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"D":"Overlapping regions across tasks does not single out this region for sequence memory.","A":"The broad active network is the general picture Lindqvist narrows down from and does not show that this single region is essential for recalling sequence.","C":"The intensity of memory research is unrelated to this specific region's role."},"why_correct":"Lindqvist credits one specific region for sequence memory. Damage to just that region sparing event recall but destroying sequence, while other damage spares sequence, isolates the region's specific role.","lesson_name":"Command of Evidence: Textual"},{"unit":1,"correct":"C","passage":"Economist Sara Villanueva argues that one specific policy, a targeted tax credit, rather than the general economic growth of the period, was responsible for a rise in a region's small-business formation.","lesson":1,"id":"u1-l1-f4-08","target_family":"Çok genel","stem":"Which finding, if true, would most directly support Villanueva's argument?","choices":{"B":"The region's overall economy expanded steadily throughout the years in question, with rising output, growing employment, and increasing investment lifting activity across nearly every sector during that period of general prosperity.","C":"New business registrations jumped just after the credit took effect and only among the specific firms eligible for it, while ineligible firms of similar size showed no such increase.","A":"Small businesses are widely regarded as important engines of employment.","D":"Tax policy can influence economic activity in many different ways."},"why_correct":"Villanueva credits one specific credit over general growth. A jump confined to eligible firms right after the credit, absent among similar ineligible firms, isolates the policy's specific effect.","choice_families":{"A":"Konuyla ilgili iddiayla ilgisiz","D":"Çok genel","B":"Çok genel"},"why_wrong":{"D":"A general statement about tax policy's influence does not establish this credit's specific effect.","A":"The general importance of small business does not tie the rise to this policy.","B":"General economic expansion is the broad explanation Villanueva argues against, not evidence that the targeted tax credit itself drove the rise in small-business formation."},"lesson_name":"Command of Evidence: Textual"},{"passage":"Archaeologist Kwame Asante proposes that one particular settlement, rather than the region's population generally, first adopted a new pottery style, later spreading it to neighboring communities.","unit":1,"why_correct":"Asante credits one specific settlement as the origin. The style appearing there a generation earlier, with later examples elsewhere copying its forms, directly supports that settlement's priority and role in spreading it.","correct":"D","id":"u1-l1-f4-09","why_wrong":{"A":"The presence of many settlements is background that does not single out this one as the first to adopt the pottery style.","C":"The general fact that pottery styles change does not identify this settlement's priority.","B":"That the style later spread across the region is on topic but does not show where it began."},"choice_families":{"B":"Konuyla ilgili iddiayla ilgisiz","C":"Çok genel","A":"Çok genel"},"lesson":1,"lesson_name":"Command of Evidence: Textual","target_family":"Çok genel","stem":"Which finding, if true, would most directly support Asante's proposal?","choices":{"A":"The region supported many settlements of varying size during the period, scattered across the river valleys and coastal plains where fertile ground and reliable water allowed sizeable communities to take root and endure.","D":"The style appears in this settlement's layers a full generation before it shows up anywhere else in the region, and the earliest examples elsewhere closely copy this settlement's forms.","B":"The pottery style eventually became common throughout the region, appearing in the households and burial sites of communities far beyond the valley where it is thought to have first been made.","C":"Pottery styles have changed continually across human history."}},{"unit":1,"correct":"A","passage":"Physiologist Omar Khoury argues that one specific muscle adaptation, rather than improved fitness in general, explains why a group of high-altitude residents tires less quickly during exertion than lowland visitors do.","lesson":1,"id":"u1-l1-f4-10","target_family":"Çok genel","choices":{"D":"Physical endurance depends on numerous interacting factors.","A":"The high-altitude residents' muscles contain a distinctive density of energy-producing structures not found in lowlanders, and this specific difference predicts their endurance better than overall fitness measures do.","B":"People who exercise regularly tend to tire less quickly than sedentary people.","C":"High-altitude environments pose many physiological challenges to the human body, from thinner air and lower oxygen to greater cold and stronger sun, and people living at such elevations must contend with all of these conditions at once throughout their lives."},"stem":"Which finding, if true, would most directly support Khoury's argument?","why_correct":"Khoury credits one specific muscle adaptation over general fitness. A distinctive density of energy structures absent in lowlanders, predicting endurance better than fitness measures, isolates that specific adaptation.","choice_families":{"D":"Çok genel","C":"Çok genel","B":"Konuyla ilgili iddiayla ilgisiz"},"why_wrong":{"C":"The many challenges of altitude are general background about high-elevation life, not evidence for the specific muscle adaptation Khoury proposes over general fitness.","B":"The general link between exercise and endurance is the broad explanation Khoury argues against.","D":"That endurance has many causes does not single out this muscle adaptation."},"lesson_name":"Command of Evidence: Textual"}],"name":"Command of Evidence: Textual","fam_short":{"Konuyla ilgili iddiayla ilgisiz":"İlgisiz","Çok genel":"Çok genel","Ters yön":"Ters yön","Tek unsur":"Tek unsur"},"teaching":{"ne_olculuyor":["Metin bir hipotez, iddia ya da tahmin sunar. Soru sana dört bulgu verir ve sorar: hangisi bu iddiayı en çok destekler? Bazen tersini sorar: hangisi zayıflatır?","Bu soru gerçek bir mantık sorusudur. Okuma sorusu gibi görünür ama değildir.","Kritik nokta: şıkkın DOĞRU olması yetmez. Şıkkın İDDİAYI destekliyor olması gerekir. Bu ikisi aynı şey değil ve soru tam olarak burada tuzak kurar."],"alt_konular_baslik":"Soru alt tipleri","celdirici_aileleri":[{"tanim":"Şık aynı konudan bahseder, aynı terimleri kullanır, ama iddiayı ne destekler ne çürütür. En yaygın çeldirici. Tanıdık kelimeler gören öğrenci işaretler.","ad":"Konuyla ilgili, iddiayla ilgisiz"},{"tanim":"Şık aslında iddianın tersini destekler. Destekleme sorusunda bu ölümcül. Aceleyle okuyan öğrenci ilgiyi görür, yönü görmez.","ad":"Ters yön"},{"ad":"Tek unsur","tanim":"İddianın iki unsuru varsa şık sadece birini karşılar. Yarım destek destek değildir. Bu tuzak en incesidir ve Advanced seviyede çok çıkar."},{"ad":"Çok genel","tanim":"İddia spesifiktir, şık geneldir. Genel bir ifade spesifik bir iddiayı kanıtlamaz. Örnek: iddia bu türün bu bölgede azaldığını söylüyor, şık bütün kuşların azaldığını söylüyor."},{"ad":"Kanit Var Ama Yon Yanlis","tanim":"Pasajdaki kanitla ayni konuya deginir ama neden-sonuc yonunu tersine cevirir; ornegin cesitliligi artiran bir sebebi miktar dususu gibi gosterir. Kanitin tam olarak neyi kanitladigini (yonu ve degiskeni) kontrol et."},{"tanim":"Pasajin dar iddiasini (orn. sadece polen cesitliligi) daha genis bir sonuca (orn. genel bal kalitesi, satis, populerlik) sicratir. Dogru sik, pasajin savundugu dar degiskenin disina cikmamalidir.","ad":"Kapsam Genisletme"}],"alt_konular":[{"ornek":"Hipotez: \"Gece ışığı arttıkça gece aktif böceklerin sayısı azalır.\" Destekleyen bulgu, ışığın yüksek olduğu bölgelerde böcek sayısının düşük ölçülmesidir — iki değişkeni de aynı yönde bağlar.","baslik":"1) İddiayı destekleme (support / strengthen)","kural":"İddiayı tek cümleye indir, kaç unsuru olduğunu say, seçeneğin bütün unsurlara dokunup dokunmadığını kontrol et.","govde":["Soru kökü genelde şöyledir: \"Which finding, if true, would most strongly support the researcher's hypothesis?\" Sana bir hipotez verilir, dört seçenek birer bulgudur ve iddiaya en çok güç katanı seçmen istenir.","Doğru cevap iddianın öne sürdüğü ilişkiyi doğrular. İddia iki değişken arasında bir bağ kuruyorsa (X artınca Y azalır gibi), doğru seçenek bu bağın İKİ ucuna da dokunur. Sadece bir değişkenden söz eden seçenek eksik kalır ve tuzaktır.","En sık hata: konuyla ilgili ama iddiayı desteklemeyen doğru bir cümleyi seçmek. \"Doğru olması\" yetmez; iddiaya YÖNELMESİ gerekir."]},{"ornek":"Aynı hipotezde zayıflatan bulgu: Böcek sayısındaki düşüşün asıl nedeninin ışık değil, o bölgedeki sıcaklık artışı olduğunu gösteren veridir.","baslik":"2) İddiayı zayıflatma (weaken / undermine)","kural":"Zayıflatma = iddianın kurduğu neden-sonucu bozan veya alternatif neden sunan bulgu.","govde":["Soru kökü tersine döner: \"Which finding would most directly weaken the conclusion?\" Burada hedef, iddiayı çürüten ya da açıklamaya alternatif getiren seçeneği bulmaktır.","Zayıflatan doğru cevap çoğu zaman iddianın önerdiği SEBEBİN yerine BAŞKA bir sebep sunar. Yani gözlemlenen sonucun aslında farklı bir nedenden kaynaklandığını gösterir. \"Alternatif açıklama\" arayan gözle oku.","Yön kontrolü şart: destekleme sorusunda seçenek iddiayla aynı yöndeydi; zayıflatmada ters yönde olmalı. Yönü karıştıran öğrenci, doğru cevabı destekleyici sanıp eler."]},{"baslik":"3) Örnekle gösterme (illustrate / exemplify)","govde":["Soru kökü: \"Which quotation from the text most effectively illustrates the claim?\" ya da \"which example best supports the generalization?\" Burada iddiayı KANITLAMAK değil, onu somut bir örnekle GÖRSELLEŞTİRMEK istenir.","Doğru seçenek, genel iddianın tarif ettiği durumun net bir örneğidir. Genellemeyle örnek arasındaki eşleşmeyi kontrol et: iddia \"sanatçı doğadan ilham aldı\" diyorsa, doğru alıntı doğa unsurunun eserde kullanıldığını gösterir.","Tuzak: kulağa etkileyici gelen ama iddiadaki ÖZELLİĞİ taşımayan alıntı. Süslü cümle değil, iddiayla birebir örtüşen cümle doğrudur."],"ornek":"İddia: \"Yazarın üslubu okuru doğrudan içine çeker.\" İllüstre eden alıntı, metinde okura \"siz\" diye seslenen ya da doğrudan soru soran cümledir."},{"kural":"Tamamlayan seçenek yalnızca verilen öncüllerden çıkarılabilecek kadar iddialı olmalı — ne fazla ne eksik.","baslik":"4) Örneği / mantığı tamamlama (complete the reasoning)","govde":["Bu alt tipte metin bir örnek örgüsü kurar ve son halkayı boş bırakır: \"...and so the team concluded that ____.\" Senden akıl yürütmeyi mantıklı biçimde tamamlayan seçeneği bulman istenir.","Yöntem: metnin kurduğu mantık zincirini takip et. Verilen öncüller hangi sonuca çıkıyor? Sonuç, öncüllerin İZİN VERDİĞİNDEN fazlasını iddia etmemeli (aşırı genelleme tuzağı) ve azını da söylememeli.","Bu tip Inferences becerisine çok yakındır; farkı, burada dayanak metinde açık bir kanıt/örnek zinciri olmasıdır."]}],"karar_proseduru":["İddiayı bul ve TEK CÜMLEYE indir.  Genelde metnin son cümlesindedir ya da hypothesize, propose, argue, suggest fiilinden sonra gelir. Kendi kelimelerinle yaz.","İddianın KAÇ unsuru var, say.  Çoğu iddia iki unsurludur. Örnek: X arttığında Y azalır. İki unsur var: X'in artması ve Y'nin azalması.","Her şıkkı iddiaya karşı test et.  Şık iddianın BÜTÜN unsurlarını içeriyor mu. Tek unsuru içeren şık tuzaktır.","Yön kontrolü yap.  Destekleme sorusunda şık iddiayla aynı yönde olmalı. Zayıflatma sorusunda ters yönde."],"strateji":["İddiayı tek cümlede kendi kelimenle yaz. Hangi değişkenler arasında nasıl bir bağ var.","Soru destek mi zayıflatma mi istiyor, işaretle.","Her seçeneği iddianın tam noktasına götürüp test et: bu ilişkiyi doğruluyor ya da yıkıyor mu.","Konuyla ilgili ama ilişkiye dokunmayanları ele.","En doğrudan ve spesifik ölçen seçeneği seç."],"top_tips":["İddiayı bir eşitlik gibi yaz. Örnek: geçe ışığı artar ise böcek sayısı azalır. Şimdi her şıkkın bu eşitliğin iki tarafına da dokunup dokunmadığını kontrol et. Sadece bir tarafa dokunan şık yanlıştır.","Zayıflatma sorusunda doğru cevap genelde iddianın ÖNERDİĞİ sebep yerine BAŞKA bir sebep sunar. Alternatif açıklama arayan şık doğru cevaptır.","if true ifadesi önemlidir. Şıkkın gerçekten doğru olup olmadığını tartışma. Doğru VARSAY, sonra iddiaya ne yaptığını sor.","Alıntı sorularında iddianın OLUMSUZ yarısını tekrar eden şık tuzaktır. Bir iddiayı kendisiyle destekleyemezsin."],"alt_konular_intro":"Textual Command of Evidence tek bir kalıp değildir. Aynı beceri dört farklı soru tipine bürünür. Hangisiyle karşı karşıya olduğunu ilk 5 saniyede anlarsan doğru stratejiyi kurarsın. Aşağıdaki dört alt tipin her birinin kendi soru kökü (stem) ve kendi tuzak ailesi vardır.","kavramsal_temel":["Command of Evidence: Textual, bir iddiayı ya da sonucu DESTEKLEYEN ya da ZAYIFLATAN kanıtı seçmeni ister. Soru sana bir araştırma bulgusu, bir hipotez ya da bir görüş verir, sonra dört seçenekten hangisinin o iddiaya en doğrudan etki ettiğini sorar.","Bu soru okuduğunu anlamaktan çok MANTIKSAL İLİŞKİ kurmayı ölçer. Doğru cevap her zaman doğru bir cümle değildir. Önemli olan, iddianın TAM olarak neyi öne sürdüğünü bulmak ve seçeneğin o noktaya dokunup dokunmadığına bakmaktır.","Kritik ayrım şudur: bir seçenek konuyla ilgili, hatta doğru olabilir ama iddianın öne sürdüğü belirli ilişkiyi desteklemiyorsa yanlıştır. Öğrenci çoğu zaman tanıdık ya da makul geleni seçer, oysa görev iddiayı test etmektir.","Bu yüzden önce iddiayı tek cümlede kendi kelimenle yaz. İddia neyi söylüyor, hangi değişkenler arasında nasıl bir bağ kuruyor. Bunu netleştirmeden seçeneğe bakma.","Textual Command of Evidence sorularinin ozu, bir iddia (claim) ile o iddiayi ayakta tutan gerekce (reasoning) arasindaki mantik koprusunu tamamlamaktir. SAT bu soruları cogunlukla '______' ile biten bir cumleyle kurar ve senden en tutarli devami secmeni ister. Anahtar, boslugu bir 'bosluk doldurma' degil, bir 'cikarim' olarak gormektir: pasaj sana bir kural veya gozlem verir, sen o kuralin mantiksal sonucunu uretirsin. Bu yuzden once pasajin ana degiskenini (ornekte 'polen cesitliligi') net saptamak, sonra siki o degisken uzerinden test etmek gerekir.","Bu ders turunde en verimli strateji, siklari okumadan once kendi cevabini zihninde uretmektir (prediction). Pasajin mantigini kendi cumlenle tamamlar, sonra bu tahmine en yakin siki ararsan, celdiricilerin cazibesine kapilma ihtimalin ciddi olcude duser. Celdiriciler genellikle dogru konuya degindigi icin yanlis hissettirmez; onlari eleyen sey, pasajin YONUNE ve KAPSAMINA sadakattir. 'Konusu dogru ama yonu/kapsami yanlis' testini her zaman uygula."],"cozumlu_ornekler":[{"passage":"A researcher hypothesized that a certain songbird sings more frequently at dawn because the cooler, denser morning air carries its song farther. To support this claim, the researcher would need evidence that ______","correct":"B","sonuc":"Doğru kanıt iddianın kurduğu belirli ilişkiyi (serin hava, daha uzak ses) doğrudan test eder. Konuyla ilgili olmak yetmez.","adimlar":["İddiayı tek cümlede yaz: kuş şafakta daha çok ötüyor ÇÜNKÜ serin sabah havası sesi daha uzağa taşıyor. Yani iddia hava ile ses mesafesi arasında bir bağ kuruyor.","Doğru kanıt tam bu bağı test etmeli: serin havada ses gerçekten daha uzağa gidiyor mu.","B tam bu ilişkiyi ölçüyor: sabah serin havada ses ölçülebilir şekilde daha uzağa gidiyor. İddianın mekanizmasını doğruluyor.","A iddiayı zayıflatır, çünkü sadece şafakta ötmüyor demek. C ve D konuyla ilgili ama hava-mesafe bağına dokunmaz."],"choices":{"D":"other species of birds also sing in the early morning","A":"the birds sing at several times during the day, not only at dawn","B":"the birds' songs travel measurably farther in the cool morning air than in the warm afternoon air","C":"the birds have brightly colored feathers that stand out at dawn"},"stem":"Which finding, if true, would most directly support the researcher's hypothesis?"},{"correct":"B","passage":"A historian argues that a medieval town grew wealthy mainly because it sat at the crossing of two major trade routes. A skeptic wants to challenge this explanation.","sonuc":"Bir açıklamayı zayıflatmanın en güçlü yolu, aynı nedenin başka yerde aynı sonucu vermediğini göstermektir.","adimlar":["İddia: şehir zengin oldu ÇÜNKÜ iki ticaret yolunun kesişiminde. Yani konum tek başına zenginliği açıklıyor.","Zayıflatmak için, aynı konum avantajına sahip başka yerlerin zengin OLMADIĞINI göstermek gerekir.","B tam bunu yapıyor: aynı yollardaki komşu kasabalar yoksul kaldı. Demek konum tek başına yeterli değil, başka etken var.","A ve D zenginliği açıklayabilir ama iddiayı çürütmez, hatta destekler gibidir. C sadece büyümeyi söyler, nedenine dokunmaz."],"choices":{"B":"several nearby towns on the same trade routes remained poor","C":"the town's population grew steadily over two centuries","A":"the town held a large annual fair that drew merchants","D":"the town minted its own coins"},"stem":"Which finding, if true, would most directly weaken the historian's argument?"},{"passage":"In her study of urban beekeeping, entomologist Dr. Priya Nair observed that hives placed on rooftops in dense city centers produced honey with a wider variety of
