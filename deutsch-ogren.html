<script id="data" type="application/json">{"title": "Deutsch B", "badge": "DE", "groups": ["Öğren", "Kişisel", "Profesyonel", "Kitle İletişim", "Writing", "İpuçları"], "lessons": [{"id": "basla", "group": "Öğren", "name": "Paper 1 ve Kriterler", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "IB Deutsch B Paper 1'de üç görevden (Aufgabe) birini seçip belirli bir metin türünde (Textsorte) Almanca yazarsın. Doğru türü seçmek ve o türün kurallarına (biçim, register, ton) uymak, dilbilgisi kadar önemlidir."}, {"t": "table", "head": ["Kriter", "Ne ölçer", "Neye dikkat"], "rows": [["A. Sprache", "Dil: kelime çeşitliliği, dilbilgisi doğruluğu, akıcılık", "Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Artikel (der/die/das) ve fiilin cümle sonu konumuna dikkat."], ["B. Botschaft", "Mesaj: göreve uygunluk, fikir gelişimi, ilgililik", "Aufgabe'nin istediğini tam karşıla; fikirleri örnekle geliştir, yüzeysel bırakma."], ["C. Konzeptverständnis", "Kavramsal: metin türü, amaç, kitle, register, ton", "Seçtiğin Textsorte'nin kurallarına uy; kitleye uygun du/Sie ve biçim kullan."]]}, {"t": "note", "k": "dikkat", "title": "En kritik Almanca kararı: du mu, Sie mi?", "lines": ["Arkadaşa/aileye: 'du' (informell). Yetkiliye/tanımadığına: 'Sie' (formell). Bu seçim tüm metnin tonunu ve fiil çekimini belirler.", "Yanlış register (arkadaşa Sie, müdüre du) Criterion C'yi ciddi düşürür. Önce kitleyi belirle, sonra du/Sie'ye karar ver."]}, {"t": "note", "k": "ipucu", "title": "Alman metin türü işaretleri", "lines": ["Formeller Brief: 'Sehr geehrte Frau .../Sehr geehrter Herr ...' + kapanış 'Mit freundlichen Grüßen'.", "Informeller Brief: 'Liebe .../Lieber ...' + kapanış 'Liebe Grüße / Bis bald'.", "Her türün açılışı, düzeni ve register'ı farklıdır. Önce türü tanı, sonra yaz."]}]}, {"id": "karsilastirma", "group": "Öğren", "name": "Karşılaştırma Tablosu", "eyebrow": "Metin Türleri", "blocks": [{"t": "p", "x": "En sık çıkan Alman metin türlerinin hızlı karşılaştırması. Ayrıntılar alt derslerde."}, {"t": "table", "head": ["Textsorte", "Amaç", "Kitle", "Register"], "rows": [["Blog", "Kişisel deneyim/görüş paylaş", "Çevrimiçi okurlar", "Kişisel, du"], ["Tagebuch (Günlük)", "Özel kayıt ve yansıtma", "Yazan kişi", "Çok kişisel"], ["Informeller Brief", "Arkadaşa haber/davet", "Arkadaş/aile", "Samimi, du"], ["Formeller Brief", "Talep, şikayet, başvuru", "Yetkili/kurum", "Resmi, Sie"], ["Bericht", "Bulgu ve öneri sun", "Karar verici", "Resmi, nesnel"], ["Artikel", "Bilgilendir ve ilgi çek", "Dergi okuru", "Yarı resmi"], ["Rede", "İkna et/bilgilendir", "Dinleyici kitlesi", "Hitabet, du/Sie"], ["Rezension", "Değerlendir ve öner", "Karar veren okur", "Yarı resmi"]]}, {"t": "note", "k": "ipucu", "title": "Seçim kuralı", "lines": ["Aufgabe kitleyi ve amacı söyler: 'für die Schülerzeitung' -> Artikel, 'an deine Freundin' -> informeller Brief, 'bei einer Versammlung' -> Rede. Kitle + amaç türü belirler."]}]}, {"id": "t-blog", "group": "Kişisel", "name": "Blog", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Kişisel bir deneyimi, düşünceyi veya görüşü bir okur kitlesiyle paylaşmak."], ["Kitle", "Blogu takip eden çevrimiçi okurlar."], ["Register / Ton", "Kişisel ve samimi ama düzgün. 'du' ile okura seslen."], ["Yapı", "Çekici başlık (Titel), okuru içine çeken giriş, kişisel anlatı/görüş, okura seslenme, düşündüren kapanış."], ["Tipik özellikler", "Titel, birinci tekil (ich), retorik sorular, duygu, günlük ama düzgün dil, doğrudan du, yorum daveti."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin kişisel açını belirle.", "2. Merak uyandıran kısa bir başlık (Titel) bul.", "3. Girişte okuru içine çek: bir soru veya çarpıcı bir sahne.", "4. Deneyimini/görüşünü somut örneklerle anlat; 'du' ile okurla bağ kur.", "5. Sadece olayı değil, ne hissettiğini de göster.", "6. Düşündüren veya harekete geçiren bir kapanış yaz.", "7. Son kontrol: Titel, ich-perspektifi, okura hitap (du), kişisel ses var mı?"]}, {"t": "given", "title": "Birinci örnek (kişisel deneyim)", "x": "Der Tag, an dem ich mein Handy weglegte\n\nLetzten Monat, an einem ganz normalen Dienstag, habe ich etwas getan, das mir wirklich Angst machte: Ich habe alle sozialen Netzwerke von meinem Handy gelöscht. Ehrlich, könntest du das?"}, {"t": "given", "title": "İkinci örnek (görüş/tavsiye, farklı bağlam)", "x": "Warum meine erste schlechte Note das Beste war, was mir passieren konnte\n\nNiemand sagt dir das, aber Scheitern kann ein Geschenk sein. Als ich letztes Jahr diese rote Zahl sah, wollte ich im Boden versinken. Heute bin ich fast dankbar dafür."}, {"t": "wizard", "wt": "blog", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Beitrag für den Schulblog über eine Gewohnheit, ein Erlebnis oder eine Entscheidung, die dich verändert hat. Erzähl persönlich, sprich die Leser direkt an (du) und rege sie zum Nachdenken oder Handeln an.", "target": 250, "check": ["Bir Titel ile açtım ve ich-perspektifiyle kişisel bir ses kullandım.", "Okura doğrudan 'du' ile seslendim ve en az bir retorik soru sordum (Criterion C).", "Deneyimimi somut örnekle anlattım ve duygumu gösterdim (Criterion B).", "Kelime çeşitliliği kullandım, tekrardan kaçındım (Criterion A).", "Düşündüren bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Blog)", "x": "Der Tag, an dem ich mein Handy weglegte\n\nLetzten Monat, an einem ganz normalen Dienstag, habe ich etwas getan, das mir wirklich Angst machte: Ich habe alle sozialen Netzwerke von meinem Handy gelöscht. Ehrlich, könntest du eine Woche ohne durchhalten?\n\nDie ersten zwei Tage waren schrecklich. Meine Hand griff ständig nach einem Bildschirm, auf dem nichts mehr war. Ich fühlte mich gelangweilt, unruhig und seltsam einsam.\n\nDann veränderte sich etwas. Ich bemerkte die Dinge wieder: das Frühstück, die Menschen im Bus, ganze Gespräche, die ich früher verpasst hätte. Ich las zwei Bücher in einer Woche und schlief endlich gut.\n\nIch sage dir nicht, du sollst alles für immer löschen. Aber probier ein Wochenende ohne Bildschirm. Vielleicht entdeckst du, dass das Leben leise auf dich wartet, während du weiterscrollst."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Blogu özel bir günlüğe çevirmek. Blogun bir OKURU vardır; ona 'du' ile seslen.", "Sadece olay anlatıp duyguyu/anlamı atlamak.", "Titel'siz veya çok resmi dille yazmak. Titel ve samimi ses Criterion C'yi belirler."]}]}, {"id": "t-tagebuch", "group": "Kişisel", "name": "Tagebuch (Günlük)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Günün olaylarını ve kişisel duyguları özel olarak kaydetmek, yansıtmak."], ["Kitle", "Yalnızca yazan kişi (özel, mahrem)."], ["Register / Ton", "Çok kişisel ve düşünsel. Birinci tekil (ich)."], ["Yapı", "Tarih, günün olayı (geçmiş: Perfekt/Präteritum), o an hissedilenler, geleceğe dair umut/kaygı."], ["Tipik özellikler", "Tarih, ich, geçmiş anlatı + şimdiki duygular, iç ses, 'Liebes Tagebuch' (opsiyonel)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Tarihi yaz (Dienstag, 14. Mai).", "2. Günün seni en çok etkileyen olayını seç.", "3. Ne olduğunu geçmiş zamanla (Perfekt) kısaca anlat.", "4. O AN ne hissettiğini yansıt.", "5. İçindeki çelişkiyi/çatışmayı göster.", "6. Geleceğe dair bir umut veya kaygıyla bitir.", "7. Son kontrol: tarih + ich + olay + duygu + yansıtma var mı?"]}, {"t": "given", "title": "Birinci örnek (mutlu sürpriz)", "x": "Dienstag, 14. Mai\n\nIch kann den Stift kaum ruhig halten. Heute hat sich alles verändert, und ich weiß immer noch nicht, ob ich lachen oder weinen soll."}, {"t": "given", "title": "İkinci örnek (zor bir gün, farklı bağlam)", "x": "Donnerstag, 2. November\n\nIch will heute Abend gar nicht schreiben, aber ich habe es mir versprochen. Heute habe ich mich zum letzten Mal von diesem Haus verabschiedet. Die leeren Zimmer sahen so fremd aus, wie das Foto eines Ortes, den ich nur geträumt habe."}, {"t": "wizard", "wt": "tagebuch", "ai": false, "ptitle": "Görev", "prompt": "Denk an einen Tag, an dem eine wichtige Entscheidung fiel oder etwas Unerwartetes geschah. Schreib einen Tagebucheintrag, der die Ereignisse und deine Gefühle in diesem Moment zeigt.", "target": 250, "check": ["Tarihle başladım ve ich-perspektifiyle kişisel bir ses kullandım.", "Sadece olayları değil, o an hissettiklerimi ve iç düşüncelerimi yansıttım (Criterion C).", "Aufgabe'nin istediği günü/kararı işledim (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Tagebuch)", "x": "Dienstag, 14. Mai\n\nIch kann den Stift kaum ruhig halten. Heute hat sich alles verändert, und ich weiß nicht, ob ich lachen oder weinen soll.\n\nEs begann wie jeder andere Dienstag. Ich war halb eingeschlafen im Matheunterricht, als mich das Sekretariat herunterrief. Mein erster Gedanke war, dass ich Ärger bekomme. Stattdessen sagten sie mir, dass meine Kurzgeschichte den Landeswettbewerb gewonnen hat.\n\nIch glaube, ich stand einfach nur da. Jemand schüttelte mir die Hand. Später im Bus traf es mich endlich, und ich musste mein Gesicht verstecken.\n\nWas mir Angst macht, ist das, was jetzt kommt: eine Preisverleihung, eine Lesung, ein echtes Publikum. Der alte Ich hätte sofort Nein gesagt. Aber heute Abend flüstert eine kleine Stimme: Vielleicht schaffst du das."}}, {"t": "note", "k": "dikkat", "title": "Blogdan farkı", "lines": ["Tagebuch özeldir, kendine yazarsın; Blog bir okur kitlesine yazılır. Günlükte 'du' ile okura seslenmezsin.", "İç dünyayı ve çelişkili duyguları göster; sadece olay anlatımı değil, yansıtma beklenir."]}]}, {"id": "t-informell", "group": "Kişisel", "name": "Informeller Brief / E-Mail", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir arkadaşa veya aile üyesine haber vermek, davet etmek, teşekkür etmek."], ["Kitle", "Yakın bir arkadaş veya aile üyesi."], ["Register / Ton", "Samimi, sıcak. 'du' ve günlük ifadeler serbest."], ["Yapı", "Selamlama (Liebe/Lieber + isim), hâl hatır, gövde (asıl haber), sıcak kapanış (Liebe Grüße) + isim."], ["Tipik özellikler", "'du', sorular, ünlemler, günlük ifadeler, kişisel ayrıntılar."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle (arkadaş/aile) ve 'du' tonunu ayarla.", "2. Samimi selamla: 'Liebe Ayla,' / 'Lieber Can,'.", "3. Kısa bir hâl hatır ile aç ('Wie geht es dir?').", "4. Asıl haberi/amacı sıcak, kişisel bir dille anlat.", "5. Sorular sor; ünlem ve günlük ifade kullan.", "6. Sıcak kapanış: 'Liebe Grüße / Bis bald' + adın.", "7. Son kontrol: samimi selam/kapanış, 'du', kişisel ton var mı?"]}, {"t": "given", "title": "Birinci örnek (haber verme)", "x": "Liebe Deniz,\n\nes fühlt sich an, als hätten wir ewig nicht gesprochen! Ich habe Neuigkeiten, die ich dir einfach erzählen musste, und ich grinse schon die ganze Woche."}, {"t": "given", "title": "İkinci örnek (davet, farklı bağlam)", "x": "Lieber Can,\n\nrate mal — ich mache endlich diese Geburtstagsgrillparty, und ohne dich wäre es einfach nicht dasselbe! Es ist diesen Samstag bei uns, ab vier. Bring nur dich selbst mit und vielleicht deine berühmte Playlist. Sag mir Bescheid, ob du kommst, okay?\n\nBis bald,\nEcem"}, {"t": "wizard", "wt": "informell", "ai": false, "ptitle": "Görev", "prompt": "Du hast an einem Sommercamp im Ausland teilgenommen. Schreib eine informelle E-Mail an eine gute Freundin/einen guten Freund, in der du von deinem Erlebnis erzählst und sie/ihn ermutigst, nächstes Jahr mitzukommen.", "target": 250, "check": ["Samimi bir selamlama (Liebe/Lieber + isim) ve sıcak bir kapanış (Liebe Grüße + isim) kullandım.", "'du' ve günlük ifadelerle samimi bir ton tutturdum (Criterion C).", "Aufgabe'yi karşıladım: deneyimi anlattım ve arkadaşımı teşvik ettim (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Informeller Brief)", "x": "Liebe Deniz,\n\nes fühlt sich an, als hätten wir ewig nicht gesprochen! Ich muss dir unbedingt etwas erzählen: Ich war drei Wochen in einem Sommercamp in Wales, und es hat wirklich verändert, wie ich mich sehe.\n\nDie ersten Tage waren schrecklich. Ich kannte niemanden, mein Englisch fühlte sich holprig an, und ich hätte fast zu Hause angerufen. Aber am Ende der ersten Woche wanderte ich mit Leuten aus sechs Ländern und lachte über Witze, die ich einen Monat vorher nicht verstanden hätte.\n\nAm meisten hat mich überrascht, wie schnell ich meine Schüchternheit verlor. Wenn du auf Englisch nach dem Frühstück fragen musst, machst du es einfach.\n\nDu würdest es lieben, und die Anmeldung öffnet im Januar. Versprich mir, dass du darüber nachdenkst!\n\nGanz liebe Grüße,\nEcem"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Resmi kalıplara ('Sehr geehrte...', 'Mit freundlichen Grüßen') kaymak. Bu tür samimidir, 'du' kullanır.", "Selamlamada yanlış cinsiyet/çekim: kadın için 'Liebe', erkek için 'Lieber'.", "Soğuk, mesafeli ton. Sorular, ünlemler ve kişisel ayrıntı samimiyeti kurar."]}]}, {"id": "t-formell", "group": "Profesyonel", "name": "Formeller Brief / E-Mail", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Talep etmek, şikayet etmek, başvurmak veya resmi bilgi vermek."], ["Kitle", "Belirli bir kişi veya kurum (yetkili, şirket, müdür)."], ["Register / Ton", "Resmi ve nazik. Her yerde 'Sie'. Kısaltma yok."], ["Yapı", "Anrede (Sehr geehrte...), amacı belirten açılış, gerekçeli gövde, istek, Grußformel (Mit freundlichen Grüßen) + isim."], ["Anrede/Grußformel kuralı", "İsim biliniyorsa 'Sehr geehrte Frau/Herr [Nachname],'; bilinmiyorsa 'Sehr geehrte Damen und Herren,'. Kapanış: 'Mit freundlichen Grüßen'."], ["Tipik özellikler", "'Sie', net amaç cümlesi (Ich schreibe Ihnen, um ...), nazik ton, gerekçe, Grußformel."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Alıcıyı belirle: adını biliyor musun?", "2. Doğru Anrede'yi seç: 'Sehr geehrte Frau ...,' veya 'Sehr geehrte Damen und Herren,'.", "3. Amaç cümlesini yaz: 'Ich schreibe Ihnen, um ...'.", "4. Gerekçeni 'Sie' ile nazik ve net paragraflarla açıkla.", "5. Ne istediğini/beklediğini açıkça belirt.", "6. 'Mit freundlichen Grüßen' + adınla bitir.", "7. Son kontrol: baştan sona 'Sie', doğru Anrede ve Grußformel, net amaç var mı?"]}, {"t": "given", "title": "Birinci örnek (şikayet)", "x": "Sehr geehrter Herr Thompson,\n\nich schreibe Ihnen, um meine Sorge über die geänderten Busfahrzeiten auszudrücken, die viele Schülerinnen und Schüler in meiner Nachbarschaft betreffen."}, {"t": "given", "title": "İkinci örnek (başvuru, farklı bağlam)", "x": "Sehr geehrte Damen und Herren,\n\nich schreibe Ihnen, um mich für die Stelle als Sommerhelfer in der Stadtbibliothek zu bewerben, die auf Ihrer Webseite ausgeschrieben ist. Als begeisterte Leserin und zuverlässige Schülerin könnte ich viel zu Ihrem Team beitragen.\n\nÜber die Möglichkeit eines Gesprächs würde ich mich sehr freuen. Vielen Dank für Ihre Zeit.\n\nMit freundlichen Grüßen\nMert Atasal"}, {"t": "wizard", "wt": "formell", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen formellen Brief an die Stadtverwaltung oder die Schulleitung über ein Problem, das dich betrifft (die Schließung einer Einrichtung, eine Regeländerung). Nenne dein Anliegen klar, begründe es und bitte um eine Lösung.", "target": 250, "check": ["Doğru Anrede (Sehr geehrte ...) ve doğru Grußformel (Mit freundlichen Grüßen) kullandım.", "Baştan sona 'Sie' kullandım ve amacımı net belirttim (Ich schreibe Ihnen, um ...) (Criterion C).", "Gerekçemi nazik paragraflarla açıkladım ve bir çözüm/istek sundum (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Formeller Brief)", "x": "Sehr geehrter Herr Thompson,\n\nich schreibe Ihnen, um meine Sorge über die geänderten Busfahrzeiten auszudrücken, die es den Schülerinnen und Schülern im Stadtteil Riverside sehr erschweren, pünktlich zu sein.\n\nSeit der frühere Bus gestrichen wurde, müssen viele von uns einen Bus nehmen, der die Schule erst zehn Minuten nach der ersten Stunde erreicht. Dadurch werden Schüler ohne eigenes Verschulden regelmäßig als verspätet notiert, und einige nehmen an den freiwilligen Lernstunden am Morgen gar nicht mehr teil.\n\nIch wäre Ihnen sehr dankbar, wenn die Schule den früheren Bus wieder einführen oder eine kurze Toleranzzeit einrichten könnte. Eine kleine Anpassung würde das Problem für viele Familien lösen.\n\nVielen Dank, dass Sie sich dieser Angelegenheit annehmen. Ich freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nMert Atasal"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["'du' veya günlük ifade kullanmak. Formeller Brief baştan sona 'Sie' ister.", "Yanlış Grußformel: informell 'Liebe Grüße' değil, formell 'Mit freundlichen Grüßen'.", "Amacı geç söylemek. İlk cümlede 'Ich schreibe Ihnen, um ...' ile amacı net ver."]}]}, {"id": "t-bericht", "group": "Profesyonel", "name": "Bericht (Rapor)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuyu araştırıp bulguları ve önerileri resmi biçimde bir yetkiliye sunmak."], ["Kitle", "Bir karar verici (Schulleitung, yönetim)."], ["Register / Ton", "Resmi, nesnel, kişisellikten uzak."], ["Yapı", "Titel, An/Von/Datum, Einleitung (amaç), başlıklı Ergebnisse, Empfehlungen, kısa Schluss."], ["Tipik özellikler", "Bölüm başlıkları, madde işaretleri, nesnel dil, veri, öneri kalıpları (Es wird empfohlen, dass ...)."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Titel ve An / Von / Datum bilgisini yaz.", "2. Einleitung'da raporun amacını tek cümleyle belirt.", "3. Ergebnisse bölümünde sorunu nesnel ve veriye dayalı anlat (başlık kullan).", "4. Her bulguyu kısa ve tarafsız ver; kişisel görüş katma.", "5. Empfehlungen bölümünde çözümleri 'Es wird empfohlen, dass ...' ile sırala.", "6. Kısa bir Schluss ile bitir.", "7. Son kontrol: Titel + bölüm başlıkları + nesnel dil + öneriler var mı?"]}, {"t": "given", "title": "Birinci örnek (kantin)", "x": "Bericht über die Schulmensa\nAn: Die Schulleitung\nVon: Der Schülerrat\nDatum: 10. März\n\nEinleitung\nDieser Bericht untersucht die Sorgen der Schüler über die Mensa und schlägt praktische Verbesserungen vor."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Bericht über das AG-Angebot\nAn: Die stellvertretende Schulleitung\nVon: Der Schülerrat\nDatum: 3. April\n\nErgebnisse\nEine Umfrage unter 200 Schülern zeigte, dass die AGs beliebt, aber begrenzt sind. Die beliebtesten Aktivitäten — Programmieren, Debattieren und Film — werden derzeit nicht angeboten.\n\nEmpfehlungen\nEs wird empfohlen, dass nächstes Halbjahr drei neue AGs eingeführt werden. Außerdem wird empfohlen, die AG-Zeiten an den Busfahrplan anzupassen."}, {"t": "wizard", "wt": "bericht", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen formellen Bericht für die Schulleitung über ein Problem (Öffnungszeiten der Bibliothek, Mensa, Verkehr) und schlage Lösungen vor. Verwende Titel, An/Von/Datum sowie die Abschnitte Ergebnisse und Empfehlungen.", "target": 280, "check": ["Titel ve An/Von/Datum ile resmi rapor biçimini kullandım.", "Başlıklı bölümler (Einleitung, Ergebnisse, Empfehlungen) ve nesnel dil kullandım (Criterion C).", "Bulguları verdim ve çözüm önerileri sundum (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Bericht)", "x": "Bericht über die Schulbibliothek\nAn: Die Schulleitung\nVon: Der Schülerrat\nDatum: 10. März\n\nEinleitung\nDieser Bericht untersucht die Sorgen der Schüler über die Bibliothek und empfiehlt Verbesserungen bei Öffnungszeiten und Lernraum.\n\nErgebnisse\nEine Umfrage unter 150 Schülern ergab zwei Hauptprobleme. Erstens schließt die Bibliothek um 15 Uhr, sodass Schüler mit AGs sie nicht nutzen können. Zweitens gibt es in Prüfungszeiten zu wenige ruhige Plätze.\n\nEmpfehlungen\nEs wird empfohlen, dass die Bibliothek werktags bis 17 Uhr geöffnet bleibt. Außerdem wird empfohlen, eine ruhige Zone für das Einzellernen einzurichten.\n\nSchluss\nDiese Änderungen wären günstig, würden aber das Lernen an der Schule deutlich verbessern."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kişisel ton kullanmak. Bericht nesnel ve veri odaklıdır.", "Bölüm başlıklarını atlamak. Einleitung, Ergebnisse, Empfehlungen görünür olmalı (Criterion C).", "Öneri bölümünü unutmak. 'Es wird empfohlen, dass ...' kalıbını kullan."]}]}, {"id": "t-vorschlag", "group": "Profesyonel", "name": "Vorschlag (Öneri, HL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir fikri/planı gerekçelendirip onay ve destek istemek."], ["Kitle", "Bir karar verici (Leitung, Vorstand)."], ["Register / Ton", "Resmi ve ikna edici, ama nesnel ve gerçekçi. 'Sie'."], ["Yapı", "Titel, Einleitung (özet), Nutzen/Vorteile, Umsetzung (plan), Kosten, ikna edici Schluss."], ["Tipik özellikler", "Bölüm başlıkları, gelecek (würde/wird), fayda vurgusu, gerçekçi plan, ölçülü ikna dili."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Titel'de öneriyi adlandır (Vorschlag: ...).", "2. Einleitung'da fikri tek paragrafta özetle: ne öneriyorsun ve neden?", "3. Vorteile bölümünde kime, nasıl fayda sağladığını göster.", "4. Umsetzung'da gerçekçi adımlar ver (kim, ne zaman, nasıl).", "5. Kosten'i dürüstçe ele al (düşük maliyet güven verir).", "6. Schluss'ta ölçülü ama net bir onay çağrısı yap.", "7. Son kontrol: Titel + öneri + fayda + plan + gerçekçilik var mı?"]}, {"t": "given", "title": "Birinci örnek (akran mentorluğu)", "x": "Vorschlag: Ein Programm für Nachhilfe unter Schülern\n\nDieser Vorschlag beschreibt ein von Schülern geleitetes Nachhilfeprogramm, das Lernende in den Kernfächern unterstützt, und zwar ohne Kosten für die Schule."}, {"t": "given", "title": "İkinci örnek (kısa, farklı konu)", "x": "Vorschlag: Ein Recycling-System für die Schule\n\nEinleitung\nDieser Vorschlag empfiehlt, in jedem Klassenzimmer und Flur deutlich beschriftete Recyclingbehälter aufzustellen.\n\nVorteile\nDas System würde Müll reduzieren, Kosten sparen und den Schülern nachhaltige Gewohnheiten vermitteln.\n\nUmsetzung\nFreiwillige der Umwelt-AG würden die Behälter wöchentlich leeren und kontrollieren.\n\nKosten\nDie einzigen Kosten sind die Behälter, die ein lokaler Anbieter sponsern würde. Ich bitte höflich um eine Testphase von einem Monat."}, {"t": "wizard", "wt": "vorschlag", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Vorschlag an die Schulleitung für eine neue AG, Veranstaltung oder ein neues System. Erkläre die Idee, die Vorteile und einen realistischen Umsetzungsplan. (HL)", "target": 300, "check": ["Titel ve Einleitung'da öneriyi net özetledim.", "Vorteile ve gerçekçi bir Umsetzung planını başlıklarla sundum (Criterion C).", "İkna edici ama ölçülü bir dille Aufgabe'yi karşıladım (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım (HL: daha uzun)."], "model": {"title": "Model cevap (Vorschlag)", "x": "Vorschlag: Ein Nachhilfeprogramm unter Schülern\n\nEinleitung\nDieser Vorschlag empfiehlt, ein Programm einzurichten, bei dem ältere Schüler jüngeren helfen, die in den Kernfächern Schwierigkeiten haben. Es würde zweimal pro Woche nach der Schule stattfinden und die Schule fast nichts kosten.\n\nVorteile\nSchwächere Schüler könnten ihre Noten in einer entspannten Umgebung verbessern. Gleichzeitig würden die Tutoren ihr eigenes Wissen vertiefen und Führungskompetenzen entwickeln, die auch Universitäten schätzen.\n\nUmsetzung\nJedes Halbjahr würden Fachlehrer freiwillige Tutoren mit jüngeren Schülern zusammenbringen. Die Treffen fänden dienstags und donnerstags in der Bibliothek statt, betreut von einer Lehrkraft.\n\nKosten\nDie einzigen Kosten sind die Aufsicht, die vorhandenes Personal übernehmen könnte. Ich bitte die Schule höflich, das Programm ein Halbjahr lang zu erproben."}}, {"t": "note", "k": "dikkat", "title": "Berichtten farkı", "lines": ["Bericht mevcut durumu inceler; Vorschlag gelecekte yapılacak bir şeyi savunur ve onay ister.", "Faydaları vurgula ama abartma; gerçekçi bir plan ve maliyet güven verir."]}]}, {"id": "t-anleitung", "group": "Profesyonel", "name": "Anleitung (Yönerge)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir işin nasıl yapılacağını adım adım öğretmek."], ["Kitle", "İşi ilk kez yapacak kullanıcı."], ["Register / Ton", "Nötr, net. Genelde Imperativ (Nimm, Füge ... hinzu) veya 'man'."], ["Yapı", "Titel, gerekli malzemeler (Du brauchst / Man braucht), numaralı adımlar, ipuçları/uyarılar."], ["Tipik özellikler", "Imperativ, numaralı adımlar, sıra bağlaçları (Zuerst, Dann, Zum Schluss), kısa net cümleler."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir Titel yaz (Wie man ... / Anleitung: ...).", "2. Gerekli malzemeleri listele (Du brauchst: ...).", "3. Adımları mantıksal sıraya koy; her adım tek bir eylem olsun.", "4. Her adımı Imperativ ile başlat (Schneide, Gib ... hinzu).", "5. Sıra bağlaçları kullan (Zuerst, Dann, Danach, Zum Schluss).", "6. Gerekirse bir Tipp veya uyarı ekle (Achtung: ...).", "7. Son kontrol: Titel + malzemeler + numaralı adımlar + Imperativ var mı?"]}, {"t": "given", "title": "Birinci örnek (menemen)", "x": "Wie man ein einfaches Menemen kocht\n\nDu brauchst: drei Eier, zwei Tomaten, eine grüne Paprika, etwas Olivenöl, Salz und eine Scheibe Brot.\n\n1. Zuerst wasche die Tomaten und die Paprika. Schneide die Paprika in kleine Stücke."}, {"t": "given", "title": "İkinci örnek (dijital, farklı bağlam)", "x": "Wie man ein neues E-Mail-Konto einrichtet\n\nDu brauchst: ein Handy oder einen Computer, eine Internetverbindung und ein sicheres Passwort.\n\n1. Öffne zuerst den App-Store und lade die E-Mail-App herunter.\n2. Tippe auf 'Konto erstellen' und gib deinen Namen ein.\n3. Wähle danach einen Benutzernamen und ein Passwort mit mindestens acht Zeichen.\n4. Gib deine Handynummer ein, damit die App einen Code senden kann.\n5. Zum Schluss tippe den Code ein und tippe auf 'Fertig'. Tipp: Teile dein Passwort mit niemandem."}, {"t": "wizard", "wt": "anleitung", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Anleitung, die einem Anfänger eine Fähigkeit beibringt (ein einfaches Gericht, eine App einrichten, ein Bastelprojekt). Verwende eine Materialliste und nummerierte Schritte im Imperativ.", "target": 220, "check": ["Titel ve gerekli malzemeler listesi ekledim.", "Numaralı adımlar, Imperativ ve sıra bağlaçları kullandım (Criterion C).", "Adımlar net, sıralı ve eksiksiz (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Anleitung)", "x": "Wie man einen kleinen Balkongarten anlegt\n\nDu brauchst: zwei oder drei Töpfe, Blumenerde, Samen, eine kleine Schaufel und Wasser.\n\n1. Wähle zuerst einen Platz auf dem Balkon, der mindestens vier Stunden Sonne bekommt.\n2. Fülle die Töpfe mit Erde, aber lass oben etwas Platz.\n3. Streue danach die Samen auf die Erde und bedecke sie leicht.\n4. Gieße vorsichtig, sodass die Erde feucht, aber nicht nass ist.\n5. Stelle die Töpfe an den sonnigen Platz.\n6. Gieße jeden zweiten Tag und warte geduldig. Zum Schluss ein Tipp: Zu viel Wasser schadet den jungen Pflanzen mehr als zu wenig."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Her adımda birden fazla eylem yazmak. Her adım tek bir Imperativ olsun.", "Sıra bağlaçlarını ve malzeme listesini atlamak. Zuerst/Dann/Zum Schluss yapıyı gösterir (Criterion C).", "Uzun, karmaşık cümleler. Anleitung kısa ve net olmalı."]}]}, {"id": "t-aufsatz", "group": "Profesyonel", "name": "Aufsatz (Deneme, SL)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konuda görüş geliştirmek ve gerekçelerle savunmak."], ["Kitle", "Genel veya akademik okur."], ["Register / Ton", "Yarı resmi, mantıklı, dengeli."], ["Yapı", "Einleitung (konu + tez), her biri bir fikri işleyen Hauptteil paragrafları (gerekçe + örnek), Schluss."], ["Tipik özellikler", "Net tez, bağlaçlar (jedoch, deshalb, zum Beispiel), gerekçeli argüman, denge, Schluss."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Soruyu (Frage) çöz: seni ne hakkında görüş bildirmeye çağırıyor?", "2. Net bir tez (These) belirle.", "3. Einleitung'da konuyu tanıt ve tezini son cümlede ver.", "4. Her Hauptteil paragrafında bir fikri işle: iddia + gerekçe + örnek.", "5. Karşı görüşe de değin (Manche sagen ...), sonra dengeleyip çürüt.", "6. Schluss'ta tezi toparla; yeni bilgi ekleme.", "7. Son kontrol: These + gerekçeli paragraflar + bağlaçlar + denge + Schluss var mı?"]}, {"t": "given", "title": "Birinci örnek (sosyal medya)", "x": "Sollten soziale Medien Teil des Schullebens sein?\n\nSoziale Medien werden oft dafür verantwortlich gemacht, dass Schüler abgelenkt werden, doch sie bieten auch echte Lernchancen. Dieser Aufsatz argumentiert, dass sie, klug genutzt, in den Unterricht gehören."}, {"t": "given", "title": "İkinci örnek (giriş + tez, farklı konu)", "x": "Sollten Schulen Handys verbieten?\n\nWenige Gegenstände spalten ein Klassenzimmer so wie das Handy. Für die einen ist es ein starkes Lernwerkzeug, für die anderen die größte Ablenkung des Tages. Dieser Aufsatz argumentiert, dass Schulen Handys im Unterricht zu Recht einschränken, weil der Preis für die Konzentration größer ist als der Nutzen."}, {"t": "wizard", "wt": "aufsatz", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Aufsatz zu dieser Frage: 'Sollten Schüler zu sozialem Engagement (Gemeinschaftsdienst) verpflichtet werden?' Verwende eine klare These, begründete Hauptteil-Absätze und einen ausgewogenen Schluss. (SL)", "target": 280, "check": ["Einleitung'da konuyu tanıttım ve net bir These yazdım.", "Her Hauptteil paragrafı bir fikri gerekçe ve örnekle işledi; bağlaçlar kullandım (Criterion C).", "Konuyu dengeli ele aldım ve Schluss'ta görüşümü toparladım (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Aufsatz)", "x": "Sollten Schüler zu sozialem Engagement verpflichtet werden?\n\nViele Schulen verlangen heute, dass Schüler eine bestimmte Zahl an Stunden für die Gemeinschaft leisten. Manche sehen darin eine unfaire Belastung, doch ich bin überzeugt, dass verpflichtetes Engagement, klug umgesetzt, weit mehr nützt als schadet.\n\nDas stärkste Argument dafür ist, was Schüler dabei lernen. Wer in einem Heim hilft oder ein jüngeres Kind unterrichtet, lernt Verantwortung und Empathie, wie es kein Lehrbuch vermitteln kann.\n\nKritiker sagen, Zwang nehme der guten Tat ihre Freiwilligkeit. Darin steckt etwas Wahres. Jedoch würden viele Schüler von allein nie beginnen, und oft machen sie später freiwillig weiter. Die Pflicht öffnet nur eine Tür.\n\nNatürlich muss der Umfang vernünftig bleiben. Zusammenfassend nützt verpflichtetes Engagement, mit Augenmaß angewendet, sowohl den Schülern als auch der Gesellschaft."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Aufsatz net bir These ile başlar.", "Karşı görüşü hiç anmamak. Ona değinip dengelemek yazını olgunlaştırır.", "Bağlaçsız, kopuk paragraflar. jedoch, deshalb, zum Beispiel fikirleri bağlar."]}]}, {"id": "t-artikel", "group": "Kitle İletişim", "name": "Artikel (Makale)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir konu hakkında bilgilendirmek ve okuru ilgilendirmek."], ["Kitle", "Bir dergi, gazete veya Schülerzeitung okuru."], ["Register / Ton", "Yarı resmi. Ne akademik ne günlük konuşma."], ["Yapı", "Çekici Titel, ilgi çeken giriş, Zwischenüberschriften ile bölümlenmiş gövde, toparlayan kapanış."], ["Tipik özellikler", "Titel, doğrudan okura soru, örnekler, alt başlıklar, bazen yazar adı."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Konuyu ve senin açını belirle.", "2. Merak uyandıran çekici bir Titel bul.", "3. Girişte okuru içine çek: bir soru veya çarpıcı bir gerçek.", "4. Gövdeyi 2-3 bölüme ayır, her birine bir Zwischenüberschrift ver.", "5. Fikirleri örnekle geliştir; yer yer okura seslen.", "6. Toparlayan, düşündüren bir kapanış yaz.", "7. Son kontrol: Titel + ilgi çeken giriş + alt başlıklar + yarı resmi ton var mı?"]}, {"t": "given", "title": "Birinci örnek (teknoloji)", "x": "Verlernen wir das Gespräch?\n\nGeh heute in irgendein Café und du siehst dieselbe Szene: ein Tisch voller Freunde, jeder starrt auf einen Bildschirm. Aber ist die Technik wirklich schuld?"}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Die Vier-Tage-Woche in der Schule: Traum oder Albtraum?\n\nStell dir eine Schulwoche ohne Freitag vor. Es klingt wie der Traum jedes Schülers, doch einige Schulen im Ausland haben es tatsächlich ausprobiert, und die Ergebnisse sind überraschender, als du denkst."}, {"t": "wizard", "wt": "artikel", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Artikel für die Schülerzeitung über ein Thema, das Jugendliche betrifft (Schlaf, soziale Medien, Prüfungsstress, Hobbys). Verwende einen packenden Titel, einen interessanten Einstieg, Zwischenüberschriften und einen runden Schluss.", "target": 250, "check": ["Çekici bir Titel ve ilgi çeken bir giriş yazdım.", "Gövdeyi Zwischenüberschriften ile böldüm ve yarı resmi ton tutturdum (Criterion C).", "Fikirleri somut örneklerle geliştirdim (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "Toparlayan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Artikel)", "x": "Verlernen wir das Gespräch?\n\nGeh heute in irgendein Café und du siehst dieselbe Szene: ein Tisch voller Freunde, jeder starrt auf ein Handy. Aber ist die Technik wirklich schuld, oder haben wir einfach verlernt zu reden?\n\nDer Trost des Bildschirms\nHandys bieten einen leichten Ausweg aus unangenehmer Stille. Sobald ein Gespräch stockt, greifen wir zum Bildschirm. Es wirkt harmlos, doch jedes Mal sagen wir der Person gegenüber, dass sie weniger interessant ist als eine Benachrichtigung.\n\nWas wir verlieren\nEchtes Gespräch ist eine Fähigkeit, und wie jede Fähigkeit verblasst sie ohne Übung.\n\nAlso eine kleine Herausforderung: Lass beim nächsten Treffen dein Handy in der Tasche. Vielleicht führst du das beste Gespräch der Woche."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Titel veya alt başlık olmadan yazmak. Makalenin görünür bir yapısı olmalı (Criterion C).", "Çok akademik veya çok günlük dil. Artikel yarı resmidir.", "Fikri örneklemeden yüzeysel bırakmak."]}]}, {"id": "t-rede", "group": "Kitle İletişim", "name": "Rede (Konuşma)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Canlı bir kitleyi ikna etmek veya bilgilendirmek."], ["Kitle", "Bir toplantı, tören veya etkinlikteki dinleyiciler."], ["Register / Ton", "Hitabet. Doğrudan seslenme, güçlü ve ritmik. (du veya Sie, bağlama göre)"], ["Yapı", "Anrede (Liebe Mitschülerinnen und Mitschüler), dikkat çeken açılış, işaretli bölümler, güçlü kapanış."], ["Tipik özellikler", "Anrede, retorik sorular, tekrar, üçlemeler, doğrudan hitap."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kitleyi ve amacı belirle (ikna/bilgilendirme).", "2. Bir Anrede ve dikkat çeken açılış yaz (soru veya çarpıcı iddia).", "3. Ana mesajını tek cümlede belirle.", "4. 2-3 noktayla geliştir; retorik soru ve tekrar kullan.", "5. Doğrudan dinleyiciye seslen; kısa, ritmik cümleler kur.", "6. Güçlü, akılda kalan bir kapanışla bitir (ve teşekkür).", "7. Son kontrol: Anrede + retorik araçlar + doğrudan hitap + güçlü kapanış var mı?"]}, {"t": "given", "title": "Birinci örnek (ilham)", "x": "Guten Morgen zusammen. Lasst mich mit einer einfachen Frage beginnen: Wann habt ihr zuletzt etwas zum ersten Mal getan? Heute möchte ich darüber sprechen, warum das wichtig ist."}, {"t": "given", "title": "İkinci örnek (ikna, farklı bağlam)", "x": "Liebe Mitschülerinnen und Mitschüler, schaut euch in diesem Raum um. In zehn Jahren werden einige von uns diese Stadt verbessert haben, und es beginnt mit einer kleinen Entscheidung heute. Ich bitte euch um diese Entscheidung: Macht beim Freiwilligenprogramm mit."}, {"t": "wizard", "wt": "rede", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Rede für eine Schulversammlung, in der du die Schüler aufforderst, sich für etwas einzusetzen (Freiwilligenarbeit, Umwelt, etwas Neues wagen). Verwende eine Anrede, rhetorische Fragen, Wiederholung und einen starken Schluss.", "target": 250, "check": ["Bir Anrede ve dikkat çeken açılışla başladım.", "Retorik soru, tekrar ve doğrudan hitap kullandım (Criterion C).", "Mesajımı örneklerle geliştirdim ve dinleyiciyi harekete çağırdım (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "Güçlü, akılda kalan bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Rede)", "x": "Guten Morgen zusammen. Lasst mich mit einer einfachen Frage beginnen: Wann habt ihr zuletzt etwas zum ersten Mal getan?\n\nFür viele von uns lautet die ehrliche Antwort: 'Ich weiß es nicht mehr.' Wir stehen auf, wir scrollen, wir gehen denselben sicheren Weg. Und langsam hören wir auf zu wachsen.\n\nIch bitte euch nicht, morgen einen Berg zu besteigen. Ich bitte um etwas Kleineres und Mutigeres: Probiert diese Woche eine neue Sache. Sprecht jemanden an, den ihr nie angesprochen habt. Meldet euch für die AG, die euch Angst macht.\n\nDenn jede Fähigkeit, die ihr bewundert, begann genau dort, wo ihr jetzt seid.\n\nAlso sucht heute nicht das Bequeme. Sucht das erste Mal. Danke."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Anrede ve doğrudan hitabı unutmak. Rede bir kitleye seslenir.", "Retorik araç kullanmamak. Retorik soru, tekrar ve üçleme konuşmayı güçlendirir (Criterion C).", "Zayıf bitirmek. En güçlü cümle kapanışta olmalı."]}]}, {"id": "t-broschuere", "group": "Kitle İletişim", "name": "Broschüre / Flyer", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir yeri, ürünü veya etkinliği tanıtıp okuru harekete geçirmek."], ["Kitle", "Potansiyel ziyaretçi/müşteri."], ["Register / Ton", "İkna edici, enerjik, kısa."], ["Yapı", "Büyük Titel + slogan, alt başlıklı 2-3 bölüm, madde işaretleri, iletişim/çağrı kutusu."], ["Format (A4)", "Katlanır: dreifach (3 sütun) veya zweifach. Elle yazımda her bölümü bir alt başlıkla temsil et."], ["Tipik özellikler", "Titel, alt başlıklar, madde imleri, Imperativ (Entdecke, Komm), [Bild: ...] yer tutucu, çağrı."]]}, {"t": "note", "k": "protokol", "title": "A4'e nasıl yerleştirilir?", "lines": ["Sınav elle yazılır; yerleşimi kelime ve düzenle göster, çizim yapma.", "En üste büyük bir Titel ve altına tek satır slogan koy.", "Görsel yerini belirt: [Bild: Wanderer bei Sonnenaufgang].", "Gövdeyi 2-3 bölüme ayır; her birine bir alt başlık ver (Warum? / Was mitbringen? / Besuch planen).", "Her bölümde 2-4 kısa madde (•) kullan.", "En alta bir bilgi/çağrı kutusu koy: Öffnungszeiten, Preis, Adresse, Web ve net bir çağrı.", "Dreifach düşünüyorsan üç bölümü üç sütun gibi kurgula."]}, {"t": "given", "title": "Örnek metin (yerleşim işaretli)", "x": "ENTDECKE DEN GRÜNEN-TAL-WANDERWEG\nRaus aus der Stadt. Atme die Bergluft.\n\n[Bild: Wanderer auf einem grünen Bergpfad bei Sonnenaufgang]\n\nWARUM DAS GRÜNE TAL?\n• 12 km gut markierte, familienfreundliche Wege\n• Traumhafte Aussichten auf drei Wasserfälle\n• Seltene Vögel und völlige Stille\n\nBESUCH PLANEN\nTäglich 8 bis 18 Uhr · Eintritt für Schüler frei\nNur zwei Stunden vom Stadtzentrum\nFührung buchen: www.gruenestal.example\n\nKomm und entdecke die Natur neu. Dein Abenteuer beginnt dieses Wochenende!"}, {"t": "wizard", "wt": "broschuere", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Broschüre/einen Flyer über einen Ort in deiner Stadt (ein Park, ein Museum, ein Festival). Verwende einen packenden Titel, Abschnitte mit Zwischenüberschriften, Aufzählungspunkte und einen Info-/Handlungsaufruf-Kasten.", "target": 220, "check": ["Büyük bir Titel ve bir slogan ile açtım.", "2-3 alt başlıklı bölüm ve madde işaretleri kullandım (Criterion C).", "Imperativ ve net bir çağrı (Handlungsaufruf) koydum.", "Bir bilgi kutusu (Öffnungszeiten, Preis, Adresse) ekledim.", "İkna edici, kısa dil kullandım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Broschüre)", "x": "KOMM ZUM RIVERSIDE-KUNSTFESTIVAL\nDrei Tage Musik, Farbe und unvergessliche Momente.\n\n[Bild: eine tanzende Menge vor einer hellen Freilichtbühne]\n\nWAS GIBT ES?\n• Live-Bands auf zwei Freilichtbühnen\n• Streetfood aus über dreißig lokalen Küchen\n• Kostenlose Workshops in Malen, Tanz und Fotografie\n\nWARUM DU NICHT FEHLEN DARFST\nWo sonst kannst du mittags malen lernen, um sechs die Welt schmecken und um Mitternacht unter den Sternen tanzen?\n\nWOCHENENDE PLANEN\nFreitag bis Sonntag, 14. bis 16. Juni · ab 10 Uhr\nTickets: 50 Lira fürs Wochenende, für Kinder unter 12 frei\nRiverside-Park, neben der alten Brücke\nJetzt buchen: www.riversidefest.example\n\nBring deine Freunde und deine Tanzschuhe mit. Wir sehen uns am Fluss!"}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Broşürü düz bir denemeye çevirmek. Titel, alt başlık ve madde işaretleri olmalı (Criterion C).", "Abartılı, inandırıcılıktan uzak övgü. Somut ayrıntı güven verir.", "Handlungsaufruf ve iletişim bilgisini unutmak."]}]}, {"id": "t-meinung", "group": "Kitle İletişim", "name": "Meinungsartikel / Kommentar", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir görüşü gerekçeli biçimde savunmak."], ["Kitle", "Bir gazete/derginin okurları."], ["Register / Ton", "İkna edici, kişisel görüş, yer yer duygusal."], ["Yapı", "Net bir tez, gerekçelerle gelişen paragraflar, karşı görüşe kısa değinme, güçlü kapanış."], ["Tipik özellikler", "Birinci tekil görüş (ich), retorik sorular, örnekler, ikna edici dil."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Net bir görüş/tez belirle: neyi savunuyorsun?", "2. Çarpıcı bir açılışla tezini hemen ortaya koy.", "3. Her paragrafta bir gerekçe ver ve örnekle destekle.", "4. Karşı görüşe kısaca değin (Manche behaupten ...), sonra çürüt.", "5. İkna edici dil ve retorik sorular kullan.", "6. Güçlü, akılda kalan bir kapanış yaz.", "7. Son kontrol: net tez + gerekçeler + karşı görüş + ikna edici ton var mı?"]}, {"t": "given", "title": "Birinci örnek (sınav baskısı)", "x": "Es wird Zeit, eine unbequeme Wahrheit zuzugeben: Unsere Besessenheit von Prüfungsnoten schadet genau den Schülern, denen sie helfen soll."}, {"t": "given", "title": "İkinci örnek (farklı konu)", "x": "Alle sagen jungen Menschen, sie sollten 'ihrer Leidenschaft folgen'. Auf einem Poster klingt das inspirierend. In Wirklichkeit ist es vielleicht der nutzloseste Rat, den wir ihnen geben, und ich erkläre, warum."}, {"t": "wizard", "wt": "meinung", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Meinungsartikel/Kommentar für eine Zeitung: Vertritt zu einem umstrittenen Thema (soziale Medien, Prüfungen, Umwelt) eine klare Meinung. Nenne deine These, begründe sie, geh auf die Gegenmeinung ein und schließe stark ab.", "target": 250, "check": ["Girişte net bir tez/görüş verdim.", "Görüşümü gerekçe ve örneklerle geliştirdim; retorik soru kullandım (Criterion C).", "Karşı görüşe değindim ve onu çürüttüm (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "Güçlü bir kapanış yazdım ve istenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Kommentar)", "x": "Es wird Zeit, eine unbequeme Wahrheit zuzugeben: Unsere Besessenheit von Noten schadet genau den Schülern, denen sie helfen soll.\n\nNatürlich zählen Noten. Sie öffnen Türen, und das Gegenteil zu behaupten wäre unehrlich. Aber wenn ein Vierzehnjähriger aus Angst vor einem Test nicht schlafen kann, läuft etwas gründlich falsch.\n\nManche behaupten, Druck stärke den Charakter. Vielleicht ein wenig. Doch die Schüler, die ich kenne, werden nicht stärker, sondern erschöpft und ängstlich.\n\nStell dir stattdessen eine Schule vor, die Neugier, Freundlichkeit und Anstrengung ebenso schätzt wie Noten. Würden unsere Schüler wirklich weniger lernen? Oder endlich lernen, das Lernen zu lieben?\n\nWir können das System nicht über Nacht ändern. Aber wir können die Geschichte ändern, die wir erzählen: Du bist viel mehr als deine Noten."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Belirsiz kalmak. Kommentar NET bir taraf tutar.", "Karşı görüşü hiç anmamak. Ona değinip çürütmek yazını olgunlaştırır.", "Sadece duyguya yaslanmak. Duygu + gerekçe + örnek birlikte ikna eder."]}]}, {"id": "t-interview", "group": "Kitle İletişim", "name": "Interview (Röportaj)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir kişiden bilgi/görüş almak ve okura aktarmak."], ["Kitle", "Bir dergi/gazete/site okuru."], ["Register / Ton", "Yarı resmi. Sorular net; cevaplar doğal, konuşma dilinde."], ["Yapı", "Kişiyi tanıtan kısa Einleitung, ardından Frage-Antwort dizisi, kısa kapanış."], ["Tipik özellikler", "Röportajcı ve konuşan belirtilir, doğrudan konuşma, konu odaklı sorular."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Röportaj yapılan kişiyi ve konuyu kısa bir girişle tanıt.", "2. Sorular konuya odaklansın; açık uçlu (Was/Warum/Wie).", "3. Frage-Antwort biçimini kur: 'Interviewer:' / 'Name:'.", "4. Cevapları doğal, konuşma dilinde yaz.", "5. Bir soru bir öncekinden doğsun (akış).", "6. Kısa bir kapanışla bitir.", "7. Son kontrol: tanıtım + net sorular + doğal cevaplar + Frage-Antwort biçimi var mı?"]}, {"t": "given", "title": "Birinci örnek (biyolog)", "x": "Wir haben mit Dr. Elif Kaya, einer Meeresbiologin, über das Plastik in unseren Ozeanen gesprochen.\n\nInterviewer: Was hat Sie zuerst zum Meer gebracht?\nDr. Kaya: Ehrlich gesagt ein Urlaub als Kind. Ich fand eine Schildkröte in einem Netz und habe das nie vergessen."}, {"t": "given", "title": "İkinci örnek (kısa, farklı kişi)", "x": "Diese Woche sprachen wir mit Selin Arslan, der Kapitänin des Basketballteams, über Führung.\n\nInterviewer: Was macht eine gute Kapitänin aus?\nSelin: Ehrlich, nicht die beste Spielerin zu sein. Es geht darum, die Person zu bemerken, die kämpft, und sie aufzubauen.\n\nInterviewer: Was ist am schwersten?\nSelin: Verlieren. Ein Gewinnerteam kann jeder führen. Leute nach einer Niederlage zusammenzuhalten, das ist der echte Test."}, {"t": "wizard", "wt": "interview", "ai": false, "ptitle": "Görev", "prompt": "Führe für die Schülerzeitung ein Interview mit einer inspirierenden Person (Lehrer, Sportler, Freiwillige). Schreib eine kurze Einleitung und dann im Frage-Antwort-Format.", "target": 250, "check": ["Kısa bir Einleitung yazdım, sonra Frage-Antwort biçimini kullandım.", "Sorular net; cevaplar doğal ve konuşma dilinde (Criterion C).", "Konuya odaklı, Aufgabe'nin istediğini işledim (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Interview)", "x": "Jede Schule hat einen stillen Helden. Unserer ist Herr Demir, der Hausmeister, der seit zwölf Jahren unser Recyclingprojekt leitet. Wir fragten ihn, warum.\n\nInterviewer: Die meisten gehen achtlos an den Tonnen vorbei. Warum ist es Ihnen so wichtig?\nHerr Demir: Weil es jemand tun muss. Am Anfang warfen wir alles weg. Jetzt trennen die Schüler ihren Müll. Das ist eine kleine Revolution.\n\nInterviewer: War es schwer, Gewohnheiten zu ändern?\nHerr Demir: Sehr. Zwei Jahre hörte niemand zu. Ich machte einfach weiter, eine Tonne nach der anderen.\n\nInterviewer: Was würden Sie einem Schüler sagen?\nHerr Demir: Warte nicht, bis du wichtig bist, um etwas Nützliches zu tun. Fang heute an."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Konuşanların isimlerini her replikte belirtmemek (Interviewer: / Name:).", "Cevapları resmi deneme diline kaçırmak. Röportaj konuşma dilindedir.", "Kapalı uçlu sorular. Açık uçlu sorular (Warum/Wie) daha iyi cevap getirir."]}]}, {"id": "t-nachricht", "group": "Kitle İletişim", "name": "Nachrichtenbericht (Haber)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir olayı nesnel ve doğru biçimde haber vermek."], ["Kitle", "Gazete/haber sitesi okuru."], ["Register / Ton", "Resmi, nesnel, tarafsız. Üçüncü şahıs."], ["Yapı", "Schlagzeile (başlık), ilk cümlede W-Fragen (wer/was/wann/wo), önemliden az önemliye, alıntılar."], ["Tipik özellikler", "Schlagzeile, geçmiş zaman, alıntılar (sagte), nesnel dil, isim/tarih/yer."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Kısa, bilgilendirici bir Schlagzeile yaz.", "2. İlk cümlede W-Fragen'i ver: wer, was, wann, wo.", "3. Önemliden az önemliye doğru sırala (ters piramit).", "4. Nesnel, üçüncü şahıs ve geçmiş zaman kullan.", "5. En az bir doğrudan alıntı ekle (sagte/fügte hinzu).", "6. Kendi görüşünü katma; görüşler yalnızca alıntılarda.", "7. Son kontrol: Schlagzeile + W-Fragen + nesnellik + alıntı var mı?"]}, {"t": "given", "title": "Birinci örnek (bağış)", "x": "Schüler sammeln Rekordsumme für Tierheim\n\nSchülerinnen und Schüler der Grünen-Tal-Schule sammelten am vergangenen Samstag über 5.000 Lira für ein Tierheim, wie die Organisatoren am Montag bestätigten."}, {"t": "given", "title": "İkinci örnek (kısa, farklı olay)", "x": "Schultheater gewinnt Regionalpreis\n\nDie Aufführung 'Die lange Nacht' der Grünen-Tal-Schule gewann am Freitag den ersten Preis beim regionalen Theaterfestival und setzte sich gegen zwölf andere Schulen durch. Die dreißig Schüler hatten vier Monate lang geprobt.\n\n'Ich bin unglaublich stolz auf sie', sagte Theaterlehrerin Frau Aydin. Die Schule vertritt die Region nun beim Landesfinale im Juni."}, {"t": "wizard", "wt": "nachricht", "ai": false, "ptitle": "Görev", "prompt": "Schreib einen Nachrichtenbericht über eine Veranstaltung an deiner Schule (ein Wettbewerb, eine Aufführung, eine Spendenaktion). Verwende eine Schlagzeile und die umgekehrte Pyramide, und füge mindestens ein Zitat ein.", "target": 250, "check": ["Bir Schlagzeile yazdım ve ilk cümlede wer/was/wann/wo verdim.", "Nesnel, tarafsız, üçüncü şahıs dil kullandım (Criterion C).", "En az bir doğrudan alıntı ekledim ve olayı işledim (Criterion B).", "Kelime çeşitliliği kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Nachrichtenbericht)", "x": "Schüler sammeln Rekordsumme für Tierheim\n\nSchülerinnen und Schüler der Grünen-Tal-Schule sammelten am vergangenen Samstag mehr als 5.000 Lira für ein örtliches Tierheim, wie die Organisatoren am Montag bestätigten. Es ist die höchste Summe, die die Schule je an einem Tag gesammelt hat.\n\nDas Geld kam bei einem Wohltätigkeitsbasar in der Aula zusammen, wo Schüler Gebäck verkauften und ein kleines Konzert organisierten. Über dreihundert Besucher kamen.\n\n'Wir hatten mit der Hälfte gerechnet', sagte Ayse Yildiz, die die Aktion leitete. 'Die Leute waren unglaublich großzügig.'\n\nDas Tierheim, das über vierzig Tiere versorgt, will das Geld für Futter und Medikamente nutzen. Die Organisatoren hoffen, den Basar jährlich zu wiederholen."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Kendi görüşünü katmak. Haber tarafsızdır; görüşler yalnızca alıntılarda.", "En önemli bilgiyi başa koymamak (ters piramit).", "Schlagzeile veya alıntıyı unutmak."]}]}, {"id": "t-rezension", "group": "Kitle İletişim", "name": "Rezension (İnceleme)", "eyebrow": "Metin Türü", "blocks": [{"t": "table", "head": ["Özellik", "Değer"], "rows": [["Amaç", "Bir film, kitap, restoran vb. değerlendirip okura öneri sunmak."], ["Kitle", "Karar vermeye çalışan okur."], ["Register / Ton", "Yarı resmi, öznel ama gerekçeli."], ["Yapı", "Ne incelendiği, kısa özet (spoilersız), güçlü/zayıf yönler, öneri/puan."], ["Tipik özellikler", "Değerlendirici sıfatlar, gerekçeli görüş, okura öneri, denge."]]}, {"t": "note", "k": "protokol", "title": "Adım adım nasıl yazılır", "lines": ["1. Neyi incelediğini baştan belli et.", "2. Kısa, sürprizsiz bir özet ver.", "3. Güçlü yönleri gerekçele.", "4. Zayıf yönleri de dürüstçe belirt (denge).", "5. Değerlendirici ama gerekçeli sıfatlar kullan.", "6. Net bir öneri/puanla bitir.", "7. Son kontrol: özet + güçlü/zayıf + denge + net öneri var mı?"]}, {"t": "given", "title": "Birinci örnek (film)", "x": "Ein Fest für die Augen, wenn auch nicht fürs Herz\n\n'Die blaue Laterne' verspricht viel, und in der ersten Stunde hält der Film es fast. Fast."}, {"t": "given", "title": "İkinci örnek (restoran, farklı ürün)", "x": "Warmes Essen, kühler Service: Das neue Eckcafé\n\nDas Eckcafé ist seit Wochen das Gesprächsthema, und das Essen hält meist, was es verspricht. Die Suppen sind reichhaltig, das Brot täglich frisch.\n\nDer Service ist leider eine andere Geschichte. Wir warteten zwanzig Minuten allein aufs Bestellen. Wenn die Besitzer das ändern, könnte es ein Lieblingsort werden. Vorerst: Geh für das Essen, aber bring Geduld mit. Drei von fünf Sternen."}, {"t": "wizard", "wt": "rezension", "ai": false, "ptitle": "Görev", "prompt": "Schreib eine Rezension zu einem Film, den du gesehen, oder einem Buch, das du gelesen hast. Gib eine kurze, spoilerfreie Zusammenfassung, nenne Stärken und Schwächen und eine klare Empfehlung.", "target": 250, "check": ["Neyi incelediğimi ve kısa, sürprizsiz bir özet verdim.", "Hem güçlü hem zayıf yönleri gerekçeleriyle değerlendirdim (dengeli, Criterion C).", "Sonunda okura net bir öneri sundum (Criterion B).", "Değerlendirici, çeşitli kelimeler kullandım (Criterion A).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Rezension)", "x": "Ein Fest für die Augen, wenn auch nicht fürs Herz\n\n'Die blaue Laterne' verspricht viel, und in der ersten Stunde hält der Film es fast. Er spielt in einer verfallenden Küstenstadt und folgt einem jungen Leuchtturmwärter, der ein geheimnisvolles Licht auf dem Meer entdeckt.\n\nVisuell ist der Film atemberaubend. Jedes Bild wirkt wie ein Gemälde, und das Sounddesign lässt dich den kalten Wind spüren.\n\nDas Problem ist die Geschichte. Nach der Hälfte kommt die Handlung fast zum Stillstand, und die Figuren treffen keine glaubwürdigen Entscheidungen.\n\nAlso, lohnt es sich? Wenn du Atmosphäre liebst und eine dünne Handlung verzeihen kannst, ja. Wenn du eine packende Geschichte brauchst, bleibst du vielleicht etwas kalt zurück. Drei von fünf Sternen: wunderschön, aber leer."}}, {"t": "note", "k": "dikkat", "title": "Sık hatalar", "lines": ["Sadece övme veya sadece yerme. Güçlü ve zayıf yönleri birlikte ver.", "Kararsız kalmak. Sonunda net bir öneri ver.", "Özeti spoiler'la doldurmak. Kısa ve sürprizsiz tut."]}]}, {"id": "paper1", "group": "Writing", "name": "Paper 1 Yazma", "eyebrow": "Paper 1 . Yaz", "blocks": [{"t": "p", "x": "Bir Aufgabe seç, Textsorte'yi belirle, o türün kurallarına göre Almanca yaz. Yazdıktan sonra kontrol listesini işaretle, sonra modeli aç."}, {"t": "task", "title": "Örnek görev (Aufgabe)", "lines": ["Deine Schule möchte, dass Schüler eine zweite Sprache lernen. Schreib einen Text für den Schulblog, in dem du von deiner eigenen Erfahrung erzählst und andere Schüler ermutigst, damit anzufangen.", "Textsorte: Blog. Kitle: okul öğrencileri. Amaç: deneyim paylaşmak ve teşvik etmek."]}, {"t": "given", "title": "Blog hatırlatması", "x": "Titel. Ich-Perspektive. Persönliche Erzählung und Gefühl. Direkte Ansprache (du). Ein ermutigender Schluss."}, {"t": "wizard", "wt": "blog", "ai": false, "prompt": null, "target": 250, "check": ["Doğru Textsorte'yi seçtim ve o türün açılış, düzen ve register kurallarına uydum.", "Aufgabe'nin istediği amacı ve kitleyi karşıladım (Criterion B).", "Fikirlerimi örnekle geliştirdim.", "Kelime çeşitliliği kullandım (Criterion A).", "Ton ve register kitleye uygun (du/Sie doğru) (Criterion C).", "İstenen uzunluğa ulaştım."], "model": {"title": "Model cevap (Blog)", "x": "Warum Spanisch mein Jahr verändert hat\n\nVor einem Jahr konnte ich kaum 'Hallo' in einer anderen Sprache sagen. Heute kann ich ein echtes Gespräch auf Spanisch führen, und ich will dir erzählen, wie das passiert ist, denn wenn ich es kann, kannst du es auch.\n\nEhrlich gesagt habe ich nur angefangen, weil eine Freundin mich in einen Club schleppte. Am Anfang war es frustrierend. Ich verwechselte Wörter und wollte fast aufgeben. Aber etwas änderte sich, als ich aufhörte, perfekt sein zu wollen. Ich schaute spanische Serien und sprach mit einem Austauschschüler.\n\nAm meisten überraschte mich nicht die Grammatik, sondern das Selbstvertrauen. Eine zweite Sprache hat mir gezeigt, dass ich schlecht in etwas sein und trotzdem weitermachen kann.\n\nAlso mein ehrlicher Rat: Warte nicht, bis du bereit bist. Wähl eine Sprache und mach heute ein paar Fehler."}}, {"t": "note", "k": "ipucu", "title": "Puan getiren hamle", "lines": ["Textsorte'nin biçimini görünür yap: Blogda Titel ve du, Rede'de retorik soru, Brief'te doğru selamlama/kapanış. Değerlendirici Criterion C'yi buradan okur.", "Fikri örnekle geliştir: genel cümle değil, kişisel somut örnek."]}]}, {"id": "ipucu", "group": "İpuçları", "name": "İpuçları ve Tuzaklar", "eyebrow": "İpuçları", "blocks": [{"t": "note", "k": "dikkat", "title": "Register (du/Sie)", "lines": ["Önce kitleyi bul, du mu Sie mi karar ver. Yanlış register Criterion C'yi düşürür.", "Formeller Brief: 'Sehr geehrte/r' + 'Mit freundlichen Grüßen'. Informeller: 'Liebe/r' + 'Liebe Grüße'."]}, {"t": "note", "k": "ipucu", "title": "Sprache (Criterion A)", "lines": ["Basit ama doğru cümle, karmaşık ama hatalıdan iyidir. Fiili doğru konuma koy (yan cümlede sona).", "Aynı kelimeyi tekrarlama: 'gut' yerine 'wertvoll, hilfreich, sinnvoll'."]}, {"t": "note", "k": "ipucu", "title": "Botschaft (Criterion B)", "lines": ["Aufgabe iki şey istiyorsa ikisini de yap.", "Her fikri bir örnekle destekle; yüzeysel liste değil, gelişmiş fikir."]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}
function recAns(slug,status){try{if(!slug||!window.GRI_SB||!window.GRI_UID)return;window.GRI_SB.from('user_answers').upsert({user_id:window.GRI_UID,question_slug:slug,status:status,answered_at:new Date().toISOString()},{onConflict:'user_id,question_slug'}).then(function(){},function(){});if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}catch(e){}}
const S={id:D.lessons[0].id};
function renderRail(){
  const groups=D.groups.map(g=>{
    const items=D.lessons.filter(l=>l.group===g).map(l=>`<div class="rlink ${S.id===l.id?'cur':''}" data-go="${l.id}"><span class="dot"></span>${esc(l.name)}</div>`).join('');
    return `<div class="rsec">${esc(g)}</div>${items}`;
  }).join('');
  railEl.innerHTML=`<div class="rc"><span class="u">${esc(D.badge||'IELTS')}</span><div class="ut">${esc(D.title)}</div>${groups}</div>`;
  railEl.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>show(e.getAttribute('data-go')));
}
function blockHTML(b,i){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='h')return `<h2>${esc(b.x)}</h2><div class="rule"></div>`;
  if(b.t==='table'){const head=(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('');
    const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<table class="dt">${b.head?`<thead><tr>${head}</tr></thead>`:''}<tbody>${rows}</tbody></table>`;}
  if(b.t==='note'){const li=b.lines.map(x=>`<li>${esc(x)}</li>`).join('');
    return `<div class="note ${b.k||'ipucu'}"><span class="nt">${esc(b.title)}</span><ul>${li}</ul></div>`;}
  if(b.t==='task')return `<div class="task"><span class="tl">${esc(b.title||'Görev')}</span>${b.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  if(b.t==='given')return `<div class="given"><span class="gl">${esc(b.title)}</span>${esc(b.x)}</div>`;
  if(b.t==='svg')return `<div class="figure">${b.svg}${b.cap?`<div class="figcap">${esc(b.cap)}</div>`:''}</div>`;
  if(b.t==='qlist'){let h='<div class="qlist">';(b.groups||[]).forEach(gr=>{h+=`<div class="qh">${esc(gr.h)}</div><ol>`+gr.items.map(q=>`<li>${esc(q)}</li>`).join('')+'</ol>';});return h+'</div>';}
  if(b.t==='plan'){return `<div class="plan">`+b.fields.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;}
  if(b.t==='cue'){return `<div class="task"><span class="tl">Cue card</span><div><b>${esc(b.title)}</b></div><div style="margin-top:6px">You should say:</div><ul style="margin:4px 0 0;padding-left:20px">`+b.points.map(p=>`<li>${esc(p)}</li>`).join('')+`</ul></div>`;}
  if(b.t==='wizard'){
    let h=`<div class="wz"${b.wt?` data-wt="${esc(b.wt)}"`:''}>`;
    if(b.prompt)h+=`<div class="task"><span class="tl">${esc(b.ptitle||'Görev')}</span>${esc(b.prompt)}</div>`;
    if(b.given)b.given.forEach(g=>h+=`<div class="given"><span class="gl">${esc(g.title)}</span>${esc(g.x)}</div>`);
    if(b.plan)h+=`<div class="plan">`+b.plan.map(f=>`<div class="pf"><label>${esc(f)}</label><textarea rows="2"></textarea></div>`).join('')+`</div>`;
    h+=`<textarea class="editor" data-target="${b.target||150}" placeholder="Buraya yaz. En az ${b.target||150} kelime."></textarea>`;
    h+=`<div class="wc">Kelime: <b class="cnt">0</b> / ${b.target||150}</div>`;
    if(b.check)h+=`<div class="check">`+b.check.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+`</div>`;
    if(b.model)h+=`<div class="reveal"><button class="btn ghost rvb">Model cevabı göster</button><div class="body"><div class="given"><span class="gl">${esc(b.model.title||'Model cevap')}</span>${esc(b.model.x)}</div></div></div>`;
    if(b.ai!==false)h+=`<div class="griwz"><button class="btn griask" type="button">Gri'ye sor . yazını değerlendir</button><span class="griq">günde 2 hak</span><div class="grifb"></div></div>`;
    h+=`</div>`;return h;
  }
  if(b.t==='drill'){let h='';if(b.instr)h+=`<p style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--muted)">${esc(b.instr)}</p>`;
    b.items.forEach((it,k)=>{h+=`<div class="drill"><div class="dq">${it.n?it.n+'. ':''}${esc(it.q)}</div><button class="db">Öneri</button><div class="da" style="margin-top:8px">${esc(it.a)}</div></div>`;});return h;}
  if(b.t==='recorder'){
    return `<div class="rec"><div class="rl">Kayıt</div><div class="rrow"><button class="btn recbtn">Kaydı başlat</button><span class="dotrec"></span><span class="tm">00:00</span></div><div class="warn">Tarayıcı mikrofon erişimi vermedi. Kayıt bu cihazda çalışmıyor, gene de soruları sesli yanıtla ve telefonuna kaydet.</div><div class="playhold"></div></div>`;
  }
  if(b.t==='checklist'){
    let h='';
    if(b.title)h+=`<div class="rl" style="font-family:Inter,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px">${esc(b.title)}</div>`;
    h+='<div class="check">'+b.items.map(c=>`<div class="ci"><span class="box">✓</span><span class="ct">${esc(c)}</span></div>`).join('')+'</div>';
    return h;
  }
  if(b.t==='mcqquiz'){
    let h='';
    b.items.forEach(it=>{h+=`<div class="mcq" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}><div class="mstem"><span class="mn">${it.n}.</span> ${esc(it.stem)}</div><div class="opts">`+Object.keys(it.choices).map(k=>`<label data-k="${k}"><span class="ol">${k}</span><span>${esc(it.choices[k])}</span></label>`).join('')+`</div><div class="mwhy" style="display:none">${esc(it.why||'')}</div><div class="mfb"></div></div>`;});
    h+=`<button class="btn mcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  if(b.t==='quiz'){
    let h='';
    if(b.box)h+='<div class="chips">'+b.box.map(w=>`<span class="chip">${esc(w)}</span>`).join('')+'</div>';
    b.items.forEach(it=>{h+=`<div class="qz" data-ans="${esc(it.ans)}"${it.slug?` data-slug="${esc(it.slug)}"`:''}${it.alt?` data-alt="${esc(it.alt.join('|'))}"`:''}><div class="qzq"><span class="qzn">${it.n}.</span> ${esc(it.q)}${it.diff?`<span class="diff">${esc(it.diff)}</span>`:''}</div><input type="text" autocomplete="off" placeholder="${esc(b.ph||'cevabını yaz')}"><div class="qzwhy" style="display:none">${esc(it.why||'')}</div><div class="qzfb"></div></div>`;});
    h+=`<button class="btn qzcheck">Cevabı kontrol et</button><div class="qscore" style="display:none"></div>`;
    return h;
  }
  return '';
}
function show(id){
  S.id=id;renderRail();window.scrollTo(0,0);
  const l=D.lessons.find(x=>x.id===id);
  let h=`<div class="head"><div class="eyebrow">${esc(l.eyebrow||l.group)}</div><h1>${esc(l.name)}</h1><div class="lead">${esc(l.lead||D.title)}</div></div><div class="pad">`;
  (l.blocks||[]).forEach((b,i)=>h+=blockHTML(b,i));
  h+=`</div>`;app.innerHTML=h;wire();
  try{location.hash!=='#'+id&&history.replaceState(null,'','#'+id);localStorage.setItem('gri_resume',JSON.stringify({exam:D.badge||D.title,lesson:(l.name||''),url:location.pathname.split('/').pop()+'#'+id,t:Date.now()}));}catch(e){}
}
function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}
// ---- Gri writing AI ----
var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types, wt){
  // IB modulu: wizard'in data-wt'sine gore ib text_type sec (blog, article, review, report...)
  const av=types.filter(t=>String(t.exam||'').toLowerCase()==='ib'&&!t.is_coming_soon&&t.is_active!==false);
  let m=null;
  if(wt)m=av.find(t=>String(t.text_type||'').toLowerCase()===String(wt).toLowerCase());
  return m||av[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  if(q.n>=2){fb.className='grifb on err';fb.textContent='Bugünlük Gri değerlendirme hakkın doldu (2/2). Yarın tekrar dene.';return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types, wz.dataset.wt);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}
