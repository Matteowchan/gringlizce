<div class="shell"><div class="main" id="main" data-mode="lesson"><div id="app"></div><div class="note" id="note">Bu alıştırma seni her tuzak ailesiyle sınar. Yanlış yaptıkça o tuzaktan daha fazla soru gelir, doğru yaptıkça sonraki aileye geçersin. Bütün soru havuzunu karışık ve puanlı görmek için Ünite Testi ni aç.</div></div><div class="rail" id="rail"></div></div><script id="data" type="application/json">{"unit_title":"SAT Reading & Writing Kampı","lessons":[{"no":1,"fam_short":{"Çağrışım tuzağı":"Çağrışım","İkincil sözlük anlamı":"İkincil anlam","Ters anlam":"Ters anlam","Ton ve derece uyumsuzluğu":"Ton/derece"},"families":["Ters anlam","İkincil sözlük anlamı","Ton ve derece uyumsuzluğu","Çağrışım tuzağı"],"main_ids":["u2-l1-f1-01","u2-l1-f2-01","u2-l1-f3-01","u2-l1-f4-01"],"teaching":{"kavramsal_temel":["Words in Context, bir boşluğu EN KESİN kelimeyle doldurmanı ister. Bu soru kelime bilgisini değil, BAĞLAM okumasını ölçer. Cümlenin kurduğu mantık hangi anlamı zorunlu kılıyor, önce onu bulursun.","Doğru kelime cümlenin yönüne, tonuna ve derecesine tam oturmalıdır. Bir kelime kabaca doğru anlamda olabilir ama tonu ya da şiddeti cümleye uymuyorsa yanlıştır. SAT bu ince farkı sever.","En güçlü ipucu bağlaçlardır. although, but, instead zıtlık kurar, so, therefore sonuç kurar, for example örnek verir. Bu kelimeler boşluğun yönünü belirler ve çoğu soruyu tek başına çözer.","Bu yüzden seçeneklere bakmadan önce cümleyi oku ve boşluğun anlamını kendi kelimenle tahmin et. İlk tanıdık kelimeye atlamak en sık ve en pahalı hatadır.","Bağlamsal kelime sorularının temel mantığı şudur: doğru cevap, kelimenin senin bildiğin anlamıyla değil, pasajın o cümleye sağladığı KANITLA belirlenir. Digital SAT bilerek çok anlamlı veya birbirine yakın kelimeler kullanır; bu yüzden 'hangi kelime kulağa daha bilgili geliyor' sorusu seni yanıltır. Doğru yaklaşım, boşluğu bir denklem gibi görmektir: cümlenin geri kalanı bir 'ipucu bloğu'dur ve doğru kelime o blokla tam olarak dengelenir. Kelimeyi tek başına değil, kanıtın yarattığı boşluğa oturan bir parça olarak düşün.","Bağlam ipuçları birkaç türde gelir ve bunları tanımak sorunu hızlandırır. (1) Tanım/yeniden ifade ipucu: cümle boşluğun anlamını başka sözcüklerle açıklar ('rather than explaining ... she trusts viewers to piece together' gibi). (2) Zıtlık ipucu: 'although', 'but', 'yet', 'far from' beklenen anlamı tersine çevirir. (3) Örnek ipucu: 'such as', 'for instance' ile boşluğun kapsamını gösterir. (4) Sonuç/neden ipucu: 'because', 'as a result' ile boşluğu bir mantık zincirine bağlar. Sınavda önce hangi ipucu türünün devrede olduğunu belirle; bu, doğru kelimenin olumlu/olumsuz yönünü ve gücünü anında netleştirir."],"ne_olculuyor":["Bir cümlede bir boşluk vardır ve dört kelime ya da kısa ifade verilir. Görev: boşluğu EN KESİN dolduran seçeneği bulmak.","Bu soru kelime bilgisinden çok BAĞLAM okuması ölçer. Doğru kelime, cümlenin kurduğu mantığa tam oturmalıdır.","Kritik nokta: bir seçenek doğru anlam ailesinden olabilir ama tonu, yönü ya da derecesi cümleye uymayabilir. Tuzak tam burada kurulur."],"top_tips":["Boşluktan önceki bağlaca bak. although, but, yet, instead varsa boşluk beklentinin TERSİ yönde. Bu tek ipucu Ters anlam tuzağını çözer.","Kelimeyi tanıdın diye doğru sanma. SAT çok anlamlı kelimeleri sever. run, address, novel, check gibi kelimelerin cümledeki anlamını kontrol et, ilk akla geleni değil.","Cümle ölçülü bir dil kullanıyorsa (somewhat, tends to, often) doğru cevap da ölçülüdür. obliterate, eliminate, guarantee gibi mutlak kelimeler genelde ton tuzağıdır.","Konudan gelen tanıdık bir kelime görürsen dur. Kelime konuya değil, CÜMLENİN MANTIĞINA uymalı. Çağrışım tuzağı tam bu refleksi avlar."],"alt_konular":[{"baslik":"1) Boşluğa en uygun kelime (fill the blank)","kural":"Seçeneklere bakmadan boşluğa kendi kelimeni yaz; sonra yön ve derece bakımından en yakın seçeneği seç.","govde":["Soru kökü: \"Which choice completes the text with the most logical and precise word or phrase?\" Boşluğun yerine dört kelime verilir; cümlenin mantığına en tam oturanı seçersin.","Yöntem: seçeneklere bakmadan önce boşluğa KENDİ kelimeni koy. Cümle olumlu mu olumsuz mu bir anlam istiyor? Güçlü mü ölçülü mü? Kendi tahminine en yakın seçeneği ara.","Tuzak: anlamı doğru ama tonu/derecesi yanlış kelime. Cümle 'hafif bir şaşkınlık' istiyorsa 'dehşet' fazla güçlüdür. Yön (olumlu/olumsuz) ve derece (hafif/güçlü) iki filtredir."]},{"ornek":"\"Her approach to the problem was quite novel.\" Burada 'novel' = yeni/özgün; 'roman' anlamı bağlama uymaz.","govde":["Soru kökü: \"As used in the text, the word 'X' most nearly means...\" Burada kelimenin en bilinen anlamı çoğu zaman TUZAKTIR; soru ikincil ya da bağlama özgü anlamı ölçer.","Kelimeyi cümleden çıkar, yerine her seçeneği tek tek koy ve cümle hâlâ aynı anlamı veriyor mu diye oku. Sadece bağlamda cümleyi bozmayan seçenek doğrudur.","En sık hata: kelimenin ezberden bilinen birincil anlamını işaretlemek. 'Novel' hem 'roman' hem 'yeni/özgün' demektir; bağlam hangisini istiyorsa o doğrudur."],"baslik":"2) Kelimenin bağlamdaki anlamı (most nearly means)"},{"govde":["Doğru kelimeyi bağlam üç yolla ele verir: TANIM (kelime cümlede açıklanır), ZITLIK (but/however ile ters anlam kurulur), ÖRNEK (for instance ile somutlaşır). Önce hangi ipucunun devrede olduğunu bul.","Zıtlık ipucu en çok kaçırılanıdır: 'unlike', 'whereas', 'yet' gördüğünde boşluk, kıyaslanan şeyin TERSİ anlamı ister. Aynı yönde kelime seçen öğrenci burada düşer.","İpucunu bulduktan sonra seçenekleri elemek kolaylaşır: bağlamın istediği yönü taşımayan her seçenek gider."],"baslik":"3) Bağlam ipuçlarını kullanma (context clues)"}],"strateji":["Seçeneklere bakmadan cümleyi oku, boşluğun anlamını kendi kelimenle tahmin et.","Bağlacı bul: zıtlık mi, sonuç mu, örnek mi. Yönü belirle.","Tahminine en yakın seçeneği ara.","Yön ve derece kontrolü yap, çok güçlü ya da çok zayıfı ele.","Kalan seçenekleri cümleye koyup oku, mantık akıyor mu bak."],"alt_konular_baslik":"Soru alt tipleri","cozumlu_ornekler":[{"stem":"Which choice completes the text with the most logical and precise word?","choices":{"A":"ease","B":"inflame","C":"obliterate","D":"mediate"},"correct":"A","passage":"Although the committee expected the new policy to ______ tensions between the departments, it instead deepened the rivalry.","sonuc":"Bağlaç (although, instead) boşluğun yönünü belirledi. Yön azaltma, doğru kelime ease.","adimlar":["Bağlaca bak: although ... instead deepened. Bu zıtlık kuruyor, yani beklenen şey gerçekleşenin TERSİ.","Gerçekleşen: rekabet derinleşti. Beklenen tersi: gerginlik azalacaktı.","Boşluk azaltma anlamında olmalı. ease (yatıştırmak) tam oturur.","inflame tersini söyler (körüklemek). obliterate yön doğru ama çok aşırı (tümden yok etmek). mediate konuya yakın ama boşluğun mantığına oturmaz."]},{"sonuc":"Boşluğun anlamını cümlenin ipucundan tahmin et, sonra en yakın kelimeyi ara.","adimlar":["İpucu cümlenin ikinci yarısında: hiçbir cümle fazlalık hissettirmiyor.","Demek üslup sade, yalın, gereksizden arınmış.","spare (yalın, ekonomik) tam bunu karşılar.","ornate tersi (süslü). legible el yazısı okunaklılığı, yanlış anlam. fictional konuya (roman) yakın ama üslubu tarif etmez."],"stem":"Which choice completes the text with the most logical and precise word?","correct":"B","choices":{"C":"legible","A":"ornate","B":"spare","D":"fictional"},"passage":"The critic praised the novel for its ______ prose, noting that not a single sentence felt padded or unnecessary."},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","correct":"B","choices":{"B":"muted","A":"hostile","C":"enthusiastic","D":"unpredictable"},"passage":"Although the committee had expected the new recycling policy to be met with resistance, the response from residents was surprisingly ______; few people voiced objections, and most simply adapted to the changes without complaint.","sonuc":"Doğru cevap B. Bağlamdaki 'az itiraz, sessiz uyum' kanıtı sönük bir tepkiyi (muted) gösterir; en çekici çeldirici olan 'enthusiastic' olumlu ama yanlış bir ton yükler.","adimlar":["Boşluğu kendi kelimenle doldur: cümle 'az kişi itiraz etti, çoğu şikayetsiz uyum sağladı' diyor, yani tepki 'sönük, sessiz' olmalı.","'Although ... expected resistance' zıtlık kuruyor: beklenen direnç GELMEDİ, demek ki boşluk direncin zıddını, yani düşük/sessiz tepkiyi anlatmalı.","A (düşmanca) direnç anlamına gelir, kanıtla çelişir; C (coşkulu) olumlu bir heyecan ister ama 'şikayetsiz uyum' coşku değil sessiz kabuldür; D (öngörülemez) ipuçlarıyla desteklenmez.","B (muted = ölçülü, sönük) 'few voiced objections' kanıtına birebir oturur."]},{"passage":"The film's director is known for her ______ style: rather than explaining every plot point aloud, she trusts viewers to piece together the story from small gestures, glances, and background details.","correct":"D","adimlar":["Anahtar ipucu 'rather than explaining every plot point ... trusts viewers to piece together': yönetmen her şeyi açıkça SÖYLEMİYOR, ima ediyor.","Boşluk için tahmin: 'ima eden, açıkça söylemeyen' bir üslup.","A (titiz) ayrıntıya düşkünlüğü anlatır ama 'her şeyi açıklamama' fikriyle çelişir; B (geleneksel) ayırt edici bir üslubu değil sıradanlığı ima eder; C (melodramatik) abartılı duygu demektir, 'küçük jestler'le ters düşer.","D (suggestive = ima eden, çağrıştıran) 'trusts viewers to piece together from small details' kanıtına oturur."],"sonuc":"Doğru cevap D. 'Açıkça söylemek yerine ima etmek' fikri suggestive kelimesini gerektirir; 'meticulous' kulağa olumlu gelen ama bağlama uymayan bir tuzaktır.","choices":{"C":"melodramatic","A":"meticulous","B":"conventional","D":"suggestive"},"stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"sonuc":"Doğru cevap A. 'Daha önce defalarca sunulup reddedildi' kanıtı, teklifin 'yeni' (novel) olmadığını gösterir; diğer şıklar kanıtla mantıksal bağ kurmaz.","adimlar":["Kanıt cümlesi: 'nearly identical measures had already been introduced ... by three previous administrations' — yani teklif hiç de YENİ değil.","'far from ______' kalıbı boşluğa, eleştirmenlerin reddettiği özelliği koyar; 'bold experiment' iddiasının zıddı 'yenilik/özgünlük' olur.","B (uygulanabilir), C (tartışmalı), D (ayrıntılı) — hiçbiri 'daha önce defalarca sunulmuş olmak' kanıtıyla mantıksal bağ kurmaz.","A (novel = yeni, özgün) tam olarak eleştirilen noktadır: 'far from novel' = hiç de yeni değil."],"stem":"Which choice completes the text with the most logical and precise word or phrase?","passage":"The senator presented her healthcare bill as a bold experiment, but critics pointed out that the proposal was far from ______: nearly identical measures had already been introduced, debated, and rejected by three previous administrations.","choices":{"C":"controversial","A":"novel","B":"practical","D":"detailed"},"correct":"A"}],"alt_konular_intro":"Words in Context iki yüzü olan bir beceridir: ya boşluğa en uygun kelimeyi seçersin, ya da metinde geçen bir kelimenin o bağlamdaki anlamını bulursun. Her ikisinde de cevabı kelimenin sözlük anlamı değil, CÜMLENİN kurduğu bağlam belirler. Bağlam ipuçlarını okumayı öğrenen öğrenci bu soruları neredeyse hiç kaçırmaz.","karar_proseduru":["SEÇENEKLERE HENÜZ BAKMA. Önce cümleyi oku ve boşluğun anlamını KENDİ kelimenle tahmin et.  Bir yön belirle: olumlu mu olumsuz mu, artıran mi azaltan mi.","Bağlam ipucunu bul.  although, but, instead, because, so gibi bağlaçlar boşluğun yönünü belirler. Bu kelimeyi işaretle.","Kendi tahminini seçeneklerle eşle.  Tahminine en yakın kelimeyi ara. İlk tanıdık kelimeye atlamak en sık hatadır.","Yön ve derece kontrolü yap.  Seçenek doğru yönde mi. Çok mu güçlü, çok mu zayıf. Cümlenin tonuna uyuyor mu.","Kalan seçenekleri cümleye tek tek koy.  Kelimeyi boşlukta oku. Kulağa doğru gelmiyorsa ele."],"celdirici_aileleri":[{"tanim":"Seçenek boşluğun ihtiyaç duyduğu anlamın TERSİNİ verir. Bağlaç ipucunu (although, instead, but) atlayan öğrenci yönü ters okur. Kelime konuya uyar ama mantık yönü yanlıştır.","ad":"Ters anlam"},{"tanim":"Çok anlamlı bir kelimenin GERÇEK ama bu cümleye uymayan bir anlamı. Kelime sözlükte vardır, öğrenci tanıdık gelince işaretler, ama burada kastedilen anlam değildir.","ad":"İkincil sözlük anlamı"},{"tanim":"Seçenek doğru YÖNDE ama yanlış ŞİDDETTE. Cümle ölçülü bir şey söylerken seçenek mutlak ya da aşırı olur, ya da tam tersi. Yön doğru, derece yanlış.","ad":"Ton ve derece uyumsuzluğu"},{"ad":"Çağrışım tuzağı","tanim":"Seçenek metnin KONUSUYLA çağrışım yapar ama boşluğun mantığına oturmaz. Konu bilimsel bilimsel bir kelime konur, ama o kelime cümlenin istediği is değildir. Tanıdık alan, yanlış kelime."},{"tanim":"Kelimenin en yaygın sözlük anlamını taşıyan ama pasajın bağlamına uymayan şık. Kelimeyi tek başına düşünürsen doğru gibi görünür; ancak cümledeki ipuçlarıyla test edince elenir. SAT bu tuzağı, ezbere anlam bilenleri yakalamak için kullanır.","ad":"Doğru Sözlük Anlamı Tuzağı"},{"tanim":"Pasajın ima ettiğinden çok daha güçlü, çok daha olumlu veya çok daha olumsuz bir anlam yükleyen şık. Bağlam ölçülü bir ton kurarken (örneğin 'sessiz tepki') şık uç noktaya kaçar ('düşmanca' ya da 'coşkulu'). Derecesi kanıttan büyük olan şık yanlıştır.","ad":"Aşırı Uç / Abartı Şıkkı"}],"sik_hatalar":[{"cozum":"although, but, instead varsa boşluk beklentinin TERSİ yönde. Önce bağlaca bak.","hata":"Bağlacı atlayıp yönü ters okumak"},{"hata":"Tanıdık kelimeyi doğru sanmak","cozum":"SAT çok anlamlı kelimeleri sever. Kelimenin cümledeki anlamını kontrol et, ilk akla geleni değil."},{"hata":"Doğru yön ama yanlış derece seçmek","cozum":"Cümle ölçülü ise (somewhat, tends to) cevap da ölçülü olmalı. obliterate, eliminate gibi mutlak kelimeler çoğu zaman ton tuzağıdır."},{"hata":"Konudan gelen kelimeye kanmak","cozum":"Kelime konuya değil, cümlenin mantığına uymalı. Çağrışım tuzağı bu reflekse avlanır."},{"hata":"Boşluğu okur okumaz şıklara atlayıp kulağa en 'akademik' veya en hoş gelen kelimeyi seçmek.","cozum":"Önce şıklara bakmadan boşluğu kendi basit kelimenle doldur; sonra bu tahmine anlamca en yakın şıkkı ara. Tahmin adımı, çekici ama yanlış kelimelere karşı en güçlü kalkandır."},{"cozum":"Zıtlık ve derece bildiren bağlaç/sözcüklerin altını çiz. Bunlar boşluğun olumlu mu olumsuz mu, güçlü mü ölçülü mü olacağını belirler; genellikle beklenen anlamı tersine çevirirler.","hata":"Cümledeki 'although', 'yet', 'rather than', 'far from', 'few' gibi yön veren sözcükleri atlayıp cümleyi düz okumak."}]},"questions":[{"choices":{"C":"obliterate","B":"inflame","A":"ease","D":"mediate"},"lesson_name":"Words in Context","why_correct":"The word 'although ... instead deepened' signals that the committee expected the opposite of deepening, so the policy was meant to reduce tension. 'Ease' fits.","unit":2,"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"D":"Çağrışım tuzağı","B":"Ters anlam","C":"Ton ve derece uyumsuzluğu"},"target_family":"Ters anlam","correct":"A","passage":"Although the committee had expected the new seating policy to ______ the tension between the two departments, it instead deepened their long-standing rivalry.","why_wrong":{"D":"'Mediate' belongs to the world of committees and disputes but does not fit the slot; one mediates a dispute, not 'mediate the tension' in this sense.","C":"'Obliterate' points the right way (reducing) but is far too strong; wiping out tension entirely overshoots the sentence.","B":"'Inflame' means to worsen, the opposite of what the committee expected before tension deepened."},"id":"u2-l1-f1-01"},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ters anlam","choice_families":{"D":"Çağrışım tuzağı","C":"İkincil sözlük anlamı","A":"Ters anlam"},"why_wrong":{"C":"'Legible' concerns handwriting being readable, a different sense that does not describe a lean style.","A":"'Ornate' means heavily decorated, the opposite of prose with nothing padded.","D":"'Fictional' is associated with a novel but does not describe the density of the prose the sentence is about."},"correct":"B","passage":"The critic praised the novel for its ______ prose, noting that not a single sentence felt padded or unnecessary.","id":"u2-l1-f1-02","lesson_name":"Words in Context","choices":{"D":"fictional","C":"legible","B":"spare","A":"ornate"},"unit":2,"why_correct":"'Not a single sentence felt padded' means the prose is stripped down, so 'spare' (lean, economical) fits.","lesson":1},{"correct":"C","passage":"Far from being ______, the ambassador's remarks were blunt enough to offend several delegates in the room.","why_wrong":{"A":"'Brutal' matches the blunt, offensive remarks rather than the quality they lacked, so it reverses the logic.","B":"'Audible' means able to be heard, a real word but the wrong sense for describing tactfulness.","D":"'Diplomatic' fits the ambassador setting by association but, like the answer, would need the 'far from' frame; placed alone it competes weakly and is the topical lure here."},"id":"u2-l1-f1-03","lesson":1,"choices":{"D":"diplomatic","B":"audible","A":"brutal","C":"tactful"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"why_correct":"'Far from being ___ ... blunt enough to offend' means the remarks were the opposite of tactful, so 'tactful' correctly names what they were NOT.","target_family":"Ters anlam","unit":2},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","choices":{"A":"eradicate","B":"aggravate","C":"diagnose","D":"alleviate"},"unit":2,"target_family":"Ters anlam","choice_families":{"A":"Ton ve derece uyumsuzluğu","B":"Ters anlam","C":"Çağrışım tuzağı"},"why_correct":"'But ... grown more severe' shows the medication was expected to do the opposite: reduce symptoms. 'Alleviate' fits.","why_wrong":{"C":"'Diagnose' is a medical-sounding word tied to the topic but names identifying an illness, not reducing symptoms.","B":"'Aggravate' means to worsen, which is what actually happened, not what was expected.","A":"'Eradicate' points the right way but is too absolute; wiping out symptoms entirely overshoots 'expected to reduce.'"},"correct":"D","passage":"The medication was expected to ______ the patient's symptoms, but after a week they had grown noticeably more severe.","lesson":1,"id":"u2-l1-f1-04"},{"choices":{"D":"cement","B":"erode","A":"restore","C":"audit"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"C":"Çağrışım tuzağı","B":"Ters anlam","D":"Ton ve derece uyumsuzluğu"},"why_correct":"'Yet ... more skeptical' signals the reforms were meant to do the opposite of eroding trust, so 'restore' fits.","target_family":"Ters anlam","unit":2,"passage":"The reforms were meant to ______ public trust in the agency, yet each new scandal left citizens more skeptical than before.","correct":"A","why_wrong":{"C":"'Audit' is associated with an agency but names a financial review, not the rebuilding of trust.","B":"'Erode' means to wear away, matching the skepticism that grew rather than the intended repair.","D":"'Cement' points toward strengthening but is too strong for trust that must first be rebuilt; one cannot cement trust that is currently absent."},"id":"u2-l1-f1-05","lesson":1},{"target_family":"Ters anlam","choice_families":{"D":"Ton ve derece uyumsuzluğu","A":"Ters anlam","C":"Çağrışım tuzağı"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f1-06","why_wrong":{"D":"'Annihilating' aims the right way but is wildly too strong for easing a debate.","A":"'Escalating' means intensifying, which is what happened, not the contrast the sentence sets up.","C":"'Scheduling' is associated with a moderator's duties but does not fit calming a debate."},"passage":"Rather than ______ the debate, the moderator's pointed questions only sharpened the disagreement between the candidates.","correct":"B","unit":2,"why_correct":"'Rather than ___ ... only sharpened the disagreement' means the moderator failed to do the opposite: calm the debate. 'Defusing' fits.","lesson_name":"Words in Context","choices":{"C":"scheduling","B":"defusing","A":"escalating","D":"annihilating"},"lesson":1},{"id":"u2-l1-f1-07","correct":"C","passage":"The evidence was supposed to ______ the theory, but the new data instead confirmed it beyond reasonable doubt.","why_wrong":{"A":"'Publish' is associated with theories and research but names releasing work, not weakening a theory.","B":"'Reinforce' means to strengthen, matching what the data actually did rather than what was expected.","D":"'Demolish' points the right way but is too extreme for the measured 'supposed to' setup, which implies casting doubt, not total destruction."},"choice_families":{"D":"Ton ve derece uyumsuzluğu","B":"Ters anlam","A":"Çağrışım tuzağı"},"target_family":"Ters anlam","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_correct":"'But ... confirmed it' shows the evidence was expected to do the opposite of confirming, so 'undermine' (weaken) fits.","unit":2,"choices":{"D":"demolish","C":"undermine","B":"reinforce","A":"publish"},"lesson_name":"Words in Context"},{"unit":2,"why_correct":"'Though ... worn them down further' signals the speech was intended to do the opposite, to energize tired players. 'Invigorate' fits.","lesson_name":"Words in Context","choices":{"A":"electrify","B":"deplete","C":"recruit","D":"invigorate"},"lesson":1,"target_family":"Ters anlam","choice_families":{"C":"Çağrışım tuzağı","A":"Ton ve derece uyumsuzluğu","B":"Ters anlam"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f1-08","why_wrong":{"A":"'Electrify' is the right direction but too intense for a speech meant simply to revive worn-out players.","B":"'Deplete' means to drain, which is what the speech did, not what it aimed to do.","C":"'Recruit' is associated with coaching but names signing new players, not re-energizing tired ones."},"correct":"D","passage":"The coach's speech was intended to ______ the exhausted players, though several admitted afterward that it had only worn them down further."},{"unit":2,"why_correct":"'But smaller firms actually multiplied' shows the feared effect was the opposite of growth: to suppress competition. 'Stifle' fits.","lesson_name":"Words in Context","choices":{"C":"regulate","B":"foster","A":"stifle","D":"annihilate"},"lesson":1,"target_family":"Ters anlam","choice_families":{"C":"Çağrışım tuzağı","B":"Ters anlam","D":"Ton ve derece uyumsuzluğu"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f1-09","why_wrong":{"B":"'Foster' means to encourage, matching the multiplication that occurred, not the feared harm.","C":"'Regulate' is associated with industry and mergers but names oversight, not the suppression the critics feared.","D":"'Annihilate' aims the right way but is too absolute; critics feared competition would be suppressed, not utterly destroyed."},"correct":"A","passage":"Critics feared the merger would ______ competition in the industry, but smaller firms actually multiplied in the years that followed."},{"correct":"B","passage":"The new irrigation system was designed to ______ the region's dependence on seasonal rain, yet farmers found themselves relying on the rains as heavily as ever.","why_wrong":{"C":"'Channel' is associated with irrigation and water but names directing flow, not reducing dependence.","A":"'Heighten' means to increase, the reverse of what an irrigation system built to reduce reliance would aim for.","D":"'Abolish' points the right way but is too absolute for a system meant to reduce, not entirely end, reliance on rain."},"id":"u2-l1-f1-10","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"C":"Çağrışım tuzağı","A":"Ters anlam","D":"Ton ve derece uyumsuzluğu"},"target_family":"Ters anlam","lesson":1,"choices":{"D":"abolish","B":"lessen","A":"heighten","C":"channel"},"lesson_name":"Words in Context","why_correct":"'Yet ... relying ... as heavily as ever' shows the system was designed to do the opposite of increasing dependence, so 'lessen' fits.","unit":2},{"id":"u2-l1-f2-01","lesson":1,"passage":"The historian's account is admirably ______: she keeps strictly to what the documents show and adds no speculation of her own.","correct":"B","why_wrong":{"D":"'Archival' is associated with documents and history but describes records themselves, not the historian's restraint.","A":"'Novel' can mean new or original, but that dictionary sense does not match staying strictly to evidence; the sentence is about restraint, not originality.","C":"'Reckless' is the opposite of the careful restraint described."},"why_correct":"'Keeps strictly to what the documents show, adds no speculation' describes controlled restraint, so 'disciplined' fits.","choice_families":{"A":"İkincil sözlük anlamı","C":"Ters anlam","D":"Çağrışım tuzağı"},"target_family":"İkincil sözlük anlamı","unit":2,"choices":{"D":"archival","C":"reckless","B":"disciplined","A":"novel"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"id":"u2-l1-f2-02","correct":"C","passage":"Before the vote, the chair asked each member to ______ the proposal carefully, weighing its costs against its likely benefits.","why_wrong":{"D":"'Legislate' is associated with votes and chairs but names making law, not evaluating a single proposal.","B":"'Table' can mean to set aside a proposal, a real parliamentary sense, but here the members are asked to consider it, not shelve it.","A":"'Dismiss' is the opposite of the careful consideration the chair requests."},"choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"target_family":"İkincil sözlük anlamı","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_correct":"'Weighing its costs against its benefits' calls for careful evaluation, so 'weigh' (consider) fits.","unit":2,"choices":{"D":"legislate","A":"dismiss","B":"table","C":"weigh"},"lesson_name":"Words in Context"},{"id":"u2-l1-f2-03","lesson":1,"correct":"D","passage":"The essay's argument is ______: each claim follows cleanly from the one before it, with no gaps in the reasoning.","why_wrong":{"B":"'Current' can mean up to date, a real sense, but that does not describe how claims connect; the sentence is about logical flow, not timeliness.","A":"'Published' is associated with essays but describes release, not the internal logic of the argument.","C":"'Disjointed' is the opposite of claims that follow cleanly."},"choice_families":{"A":"Çağrışım tuzağı","B":"İkincil sözlük anlamı","C":"Ters anlam"},"why_correct":"'Each claim follows cleanly ... no gaps' describes tight logical connection, so 'coherent' fits.","target_family":"İkincil sözlük anlamı","unit":2,"choices":{"C":"disjointed","A":"published","B":"current","D":"coherent"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"unit":2,"target_family":"İkincil sözlük anlamı","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","B":"İkincil sözlük anlamı"},"why_correct":"In technical writing an 'elegant' solution is one that is simple and efficient, matching 'fewest possible parts,' so 'elegant' fits.","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","choices":{"D":"structural","B":"stylish","A":"elegant","C":"convoluted"},"lesson":1,"id":"u2-l1-f2-04","why_wrong":{"C":"'Convoluted' means overly complex, the opposite of using the fewest parts.","B":"'Stylish' captures the fashion sense of elegant but not the technical sense of simple and efficient the sentence requires.","D":"'Structural' is associated with engineering but describes what a thing relates to, not the simplicity of the solution."},"passage":"The engineer proposed a ______ solution, one that used the fewest possible parts to do the job reliably.","correct":"A"},{"choices":{"D":"sworn","C":"garbled","B":"orderly","A":"tidy"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","why_correct":"'Each moment in the exact order it occurred' describes a well-sequenced account, so 'orderly' fits.","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","A":"İkincil sözlük anlamı"},"target_family":"İkincil sözlük anlamı","unit":2,"correct":"B","passage":"The witness gave a ______ account of the accident, describing each moment in the exact order it occurred.","why_wrong":{"C":"'Garbled' means confused and jumbled, the opposite of a clear sequence.","A":"'Tidy' shares the neat sense of orderly but usually describes physical spaces, not the sequence of a spoken account.","D":"'Sworn' is associated with witnesses and testimony but describes an oath, not how the account is arranged."},"id":"u2-l1-f2-05","lesson":1},{"lesson":1,"choices":{"D":"orchestral","C":"memorable","A":"forgettable","B":"commemorative"},"lesson_name":"Words in Context","why_correct":"'Listeners could hum after a single hearing' means the melodies stick in the mind, so 'memorable' fits.","unit":2,"correct":"C","passage":"The composer was known for ______ melodies that listeners could hum after a single hearing.","why_wrong":{"A":"'Forgettable' is the opposite of melodies people hum after one hearing.","B":"'Commemorative' shares the memory root but means honoring an event, not easy to remember.","D":"'Orchestral' is associated with composers but describes instrumentation, not memorability."},"id":"u2-l1-f2-06","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"target_family":"İkincil sözlük anlamı"},{"passage":"Her leadership style was refreshingly ______: she made decisions openly and explained the reasons behind each one.","correct":"D","why_wrong":{"C":"'Secretive' is the opposite of making decisions openly.","B":"'See-through' captures the literal, physical sense of transparent but not the figurative sense of open and candid the sentence needs.","A":"'Executive' is associated with leadership but names a role, not the openness described."},"id":"u2-l1-f2-07","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"B":"İkincil sözlük anlamı","A":"Çağrışım tuzağı","C":"Ters anlam"},"target_family":"İkincil sözlük anlamı","lesson":1,"choices":{"D":"transparent","C":"secretive","B":"see-through","A":"executive"},"lesson_name":"Words in Context","why_correct":"'Made decisions openly and explained the reasons' describes openness, so 'transparent' (open, candid) fits.","unit":2},{"choices":{"B":"luminous","A":"lucid","C":"opaque","D":"editorial"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","why_correct":"'Laid out the findings plainly, without jargon' describes clarity, so 'lucid' (clear, easy to follow) fits.","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","B":"İkincil sözlük anlamı"},"unit":2,"target_family":"İkincil sözlük anlamı","passage":"The report was praised as ______: it laid out the findings plainly, without jargon that would confuse a general reader.","correct":"A","why_wrong":{"D":"'Editorial' is associated with reports and writing but names opinion content, not clarity.","C":"'Opaque' means hard to understand, the opposite of plainly laid out.","B":"'Luminous' shares a light-giving root with lucid but means glowing, not clear in expression."},"id":"u2-l1-f2-08","lesson":1},{"unit":2,"target_family":"İkincil sözlük anlamı","choice_families":{"D":"Çağrışım tuzağı","A":"İkincil sözlük anlamı","C":"Ters anlam"},"why_correct":"'Never raising her voice or losing focus' describes calm self-control, so 'composed' fits.","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","choices":{"D":"contractual","C":"frantic","A":"composite","B":"composed"},"lesson":1,"id":"u2-l1-f2-09","why_wrong":{"C":"'Frantic' is the opposite of the calm control described.","A":"'Composite' shares the root with composed but means made of parts, an unrelated sense.","D":"'Contractual' is associated with negotiation but describes agreements, not the negotiator's calm."},"correct":"B","passage":"The negotiator stayed ______ throughout the tense meeting, never once raising her voice or losing her focus."},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"B":"İkincil sözlük anlamı","A":"Ters anlam","D":"Çağrışım tuzağı"},"target_family":"İkincil sözlük anlamı","correct":"C","passage":"The teacher's feedback was consistently ______: it pointed out weaknesses in a way that helped students improve rather than discouraging them.","why_wrong":{"D":"'Academic' is associated with teachers but describes a field, not the helpful quality of the feedback.","A":"'Harsh' is the opposite of feedback that helps rather than discourages.","B":"'Structural' shares the build root with constructive but means relating to structure, not helpful in intent."},"id":"u2-l1-f2-10","choices":{"D":"academic","C":"constructive","A":"harsh","B":"structural"},"lesson_name":"Words in Context","why_correct":"'Helped students improve rather than discouraging them' describes helpful criticism, so 'constructive' fits.","unit":2,"lesson":1},{"choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Ters anlam","D":"Çağrışım tuzağı"},"target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f3-01","passage":"The study found that the drug ______ symptoms in most patients, though a few reported no change at all.","correct":"C","why_wrong":{"B":"'Eliminated' is the right direction but too absolute; if it eliminated symptoms, the sentence could not add 'though a few reported no change.'","A":"'Worsened' reverses the direction the sentence needs.","D":"'Medicated' is associated with drugs and patients but names giving medicine, not the effect on symptoms."},"why_correct":"'In most patients, though a few reported no change' calls for a measured, partial effect, so 'reduced' fits.","unit":2,"choices":{"D":"medicated","A":"worsened","B":"eliminated","C":"reduced"},"lesson_name":"Words in Context","lesson":1},{"id":"u2-l1-f3-02","why_wrong":{"B":"'Flawless' overshoots; reviewers who stop short of 'masterpiece' would not call the film flawless.","A":"'Cinematic' is associated with film but describes a visual quality, not the level of the reviewers' praise.","C":"'Dreadful' reverses the positive direction the praise establishes."},"correct":"D","passage":"Reviewers found the film ______, praising its steady craft while stopping short of calling it a masterpiece.","target_family":"Ton ve derece uyumsuzluğu","choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","C":"Ters anlam"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"unit":2,"why_correct":"'Stopping short of calling it a masterpiece' signals moderate praise, so 'solid' fits the measured tone.","lesson_name":"Words in Context","choices":{"C":"dreadful","B":"flawless","A":"cinematic","D":"solid"}},{"stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"D":"Çağrışım tuzağı","C":"Ton ve derece uyumsuzluğu","B":"Ton ve derece uyumsuzluğu"},"target_family":"Ton ve derece uyumsuzluğu","correct":"A","passage":"The senator expressed ______ support for the bill, backing its goals while noting several provisions she hoped to amend.","why_wrong":{"D":"'Legislative' is associated with senators and bills but describes lawmaking, not the degree of support.","C":"'Outright' also overshoots, implying total and unconditional support, which the reservations contradict.","B":"'Wholehearted' overshoots; support with reservations is not wholehearted."},"id":"u2-l1-f3-03","choices":{"D":"legislative","C":"outright","B":"wholehearted","A":"qualified"},"lesson_name":"Words in Context","why_correct":"'Backing its goals while noting provisions she hoped to amend' describes limited, conditional support, so 'qualified' fits.","unit":2,"lesson":1},{"why_correct":"'Enough for indoor use but not for harsh outdoor exposure' describes limited protection, so 'modest' fits.","unit":2,"choices":{"D":"metallic","A":"total","B":"modest","C":"negligible"},"lesson_name":"Words in Context","lesson":1,"choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","A":"Ton ve derece uyumsuzluğu"},"target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f3-04","passage":"The coating gives the metal ______ protection against rust, enough for indoor use but not for harsh outdoor exposure.","correct":"B","why_wrong":{"C":"'Negligible' undershoots in the other direction; the coating does help indoors, so the protection is not negligible.","A":"'Total' overshoots; protection that fails outdoors is not total.","D":"'Metallic' is associated with metal but describes a material quality, not the degree of protection."}},{"why_correct":"'Disagreed firmly but never insulted anyone' calls for sharp but controlled, so 'pointed' fits.","choice_families":{"A":"Ters anlam","B":"Ton ve derece uyumsuzluğu","D":"Çağrışım tuzağı"},"unit":2,"target_family":"Ton ve derece uyumsuzluğu","choices":{"D":"vocal","A":"gentle","B":"savage","C":"pointed"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","id":"u2-l1-f3-05","lesson":1,"passage":"Her tone was ______ rather than hostile; she disagreed firmly but never insulted anyone in the room.","correct":"C","why_wrong":{"D":"'Vocal' is associated with tone and speaking but describes loudness, not the controlled sharpness meant.","B":"'Savage' overshoots into hostility, which the sentence explicitly rules out.","A":"'Gentle' undershoots; firm disagreement is stronger than gentle."}},{"why_wrong":{"C":"'Hostile' reverses the direction, since the board approved the proposal.","B":"'Boundless' overshoots; enthusiasm that trims the budget is not boundless.","A":"'Fiscal' is associated with budgets but describes finance, not the degree of enthusiasm."},"passage":"The proposal met with ______ enthusiasm: the board approved it but asked for a smaller budget than requested.","correct":"D","id":"u2-l1-f3-06","stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Ton ve derece uyumsuzluğu","choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","C":"Ters anlam"},"lesson":1,"lesson_name":"Words in Context","choices":{"C":"hostile","A":"fiscal","B":"boundless","D":"tempered"},"unit":2,"why_correct":"'Approved it but asked for a smaller budget' signals restrained enthusiasm, so 'tempered' fits."},{"why_correct":"'Small but consistent' points to a slight gain, so 'marginal' fits the degree.","unit":2,"choices":{"C":"ruinous","A":"marginal","B":"dramatic","D":"mechanical"},"lesson_name":"Words in Context","lesson":1,"choice_families":{"D":"Çağrışım tuzağı","B":"Ton ve derece uyumsuzluğu","C":"Ters anlam"},"target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f3-07","correct":"A","passage":"The change produced a ______ improvement in efficiency, small but consistent across every trial.","why_wrong":{"D":"'Mechanical' is associated with efficiency and machines but describes a manner, not the size of the improvement.","B":"'Dramatic' overshoots; the sentence calls the improvement small.","C":"'Ruinous' reverses direction, implying harm rather than improvement."}},{"choices":{"D":"authorial","C":"admiring","A":"scathing","B":"wary"},"lesson_name":"Words in Context","why_correct":"'A few concerns without rejecting it outright' describes mild caution, so 'wary' fits.","unit":2,"lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"D":"Çağrışım tuzağı","A":"Ton ve derece uyumsuzluğu","C":"Ters anlam"},"target_family":"Ton ve derece uyumsuzluğu","correct":"B","passage":"The author is ______ of the policy, raising a few concerns without rejecting it outright.","why_wrong":{"D":"'Authorial' is associated with an author but describes writing itself, not an attitude.","C":"'Admiring' reverses the direction, since the author has concerns.","A":"'Scathing' overshoots; raising a few concerns is far milder than a scathing attack."},"id":"u2-l1-f3-08"},{"correct":"C","passage":"The mayor offered a ______ apology, acknowledging the error briefly before moving on to other business.","why_wrong":{"D":"'Municipal' is associated with a mayor but describes city government, not the quality of the apology.","B":"'Profound' overshoots; a brief acknowledgment is the opposite of a deep, heartfelt apology.","A":"'Defiant' reverses direction, since the mayor does apologize."},"id":"u2-l1-f3-09","lesson":1,"choices":{"D":"municipal","C":"perfunctory","B":"profound","A":"defiant"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","why_correct":"'Acknowledging the error briefly before moving on' signals a token, minimal apology, so 'perfunctory' fits.","choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Ters anlam","D":"Çağrışım tuzağı"},"unit":2,"target_family":"Ton ve derece uyumsuzluğu"},{"id":"u2-l1-f3-10","passage":"Sales showed a ______ recovery, ticking upward slightly after months of steep decline.","correct":"D","why_wrong":{"B":"'Triumphant' overshoots; a slight uptick is not a triumphant recovery.","A":"'Commercial' is associated with sales but describes business, not the strength of the recovery.","C":"'Catastrophic' reverses direction, describing disaster rather than recovery."},"choice_families":{"B":"Ton ve derece uyumsuzluğu","A":"Çağrışım tuzağı","C":"Ters anlam"},"target_family":"Ton ve derece uyumsuzluğu","stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson":1,"why_correct":"'Ticking upward slightly' after decline describes a cautious, early recovery, so 'tentative' fits.","unit":2,"choices":{"C":"catastrophic","A":"commercial","B":"triumphant","D":"tentative"},"lesson_name":"Words in Context"},{"id":"u2-l1-f4-01","lesson":1,"passage":"The astronomer's lecture was so ______ that even listeners with no science background followed every point with ease.","correct":"D","why_wrong":{"C":"'Impenetrable' reverses the meaning, describing something impossible to understand.","A":"'Stellar' evokes stars and can mean excellent, but the slot needs 'easy to follow,' not 'excellent'; it is the topical lure.","B":"'Celestial' is tied to astronomy by topic but describes the sky, not how easy the lecture was to follow."},"why_correct":"'Even listeners with no background followed every point with ease' means the lecture was easy to grasp, so 'accessible' fits.","choice_families":{"C":"Ters anlam","A":"Çağrışım tuzağı","B":"Çağrışım tuzağı"},"unit":2,"target_family":"Çağrışım tuzağı","choices":{"D":"accessible","A":"stellar","B":"celestial","C":"impenetrable"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context"},{"lesson_name":"Words in Context","choices":{"B":"culinary","A":"inventive","C":"derivative","D":"savory"},"unit":2,"why_correct":"'Blending techniques that rarely appear together' describes originality, so 'inventive' fits.","lesson":1,"stem":"Which choice completes the text with the most logical and precise word or phrase?","target_family":"Çağrışım tuzağı","choice_families":{"B":"Çağrışım tuzağı","C":"Ters anlam","D":"Çağrışım tuzağı"},"why_wrong":{"D":"'Savory' evokes food but describes a taste, not the originality of the menu; it is the topical lure.","C":"'Derivative' reverses the meaning, describing unoriginal work.","B":"'Culinary' is tied to a chef and menu by topic but simply means relating to cooking, not original."},"passage":"The chef's new menu was praised as ______, blending techniques from cuisines that rarely appear together.","correct":"A","id":"u2-l1-f4-02"},{"unit":2,"why_correct":"'Applying the same standard to both sides without favor' describes fairness, so 'impartial' fits.","lesson_name":"Words in Context","choices":{"D":"legal","C":"biased","A":"judicial","B":"impartial"},"lesson":1,"target_family":"Çağrışım tuzağı","choice_families":{"D":"Çağrışım tuzağı","A":"Çağrışım tuzağı","C":"Ters anlam"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","id":"u2-l1-f4-03","why_wrong":{"D":"'Legal' evokes the courtroom but means lawful, not even-handed; it is the topical lure.","C":"'Biased' reverses the meaning, describing favoritism.","A":"'Judicial' is tied to a judge by topic but means relating to courts, not fair."},"passage":"The judge's ruling was widely seen as ______, applying the same standard to both sides without favor.","correct":"B"},{"choices":{"C":"efficient","A":"wasteful","B":"architectural","D":"structural"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choice_families":{"D":"Çağrışım tuzağı","B":"Çağrışım tuzağı","A":"Ters anlam"},"why_correct":"'Using every square meter ... without feeling cramped' describes smart use of space, so 'efficient' fits.","target_family":"Çağrışım tuzağı","unit":2,"correct":"C","passage":"The architect's design was admired for being ______, using every square meter of the small lot without feeling cramped.","why_wrong":{"A":"'Wasteful' reverses the meaning, describing poor use of space.","B":"'Architectural' is tied to an architect by topic but just means relating to buildings, not economical in space.","D":"'Structural' evokes construction but describes load and framework, not spatial economy; it is the topical lure."},"id":"u2-l1-f4-04","lesson":1},{"id":"u2-l1-f4-05","lesson":1,"passage":"The novelist's later work grew more ______, stripping away subplots until only the central story remained.","correct":"D","why_wrong":{"C":"'Sprawling' reverses the meaning, describing something that spreads out rather than narrows.","A":"'Narrative' evokes storytelling but names a type of writing, not the tightening described; it is the topical lure.","B":"'Literary' is tied to a novelist by topic but means relating to literature, not concentrated."},"why_correct":"'Stripping away subplots until only the central story remained' describes concentration, so 'focused' fits.","choice_families":{"C":"Ters anlam","A":"Çağrışım tuzağı","B":"Çağrışım tuzağı"},"unit":2,"target_family":"Çağrışım tuzağı","choices":{"D":"focused","C":"sprawling","A":"narrative","B":"literary"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context"},{"choices":{"D":"monetary","A":"accurate","B":"economic","C":"mistaken"},"lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","why_correct":"'Matching the actual figures almost exactly' describes correctness, so 'accurate' fits.","choice_families":{"D":"Çağrışım tuzağı","C":"Ters anlam","B":"Çağrışım tuzağı"},"target_family":"Çağrışım tuzağı","unit":2,"correct":"A","passage":"The economist's forecast proved ______, matching the actual figures released months later almost exactly.","why_wrong":{"C":"'Mistaken' reverses the meaning, describing a wrong forecast.","B":"'Economic' is tied to an economist by topic but means relating to the economy, not correct.","D":"'Monetary' evokes economics but concerns money supply, not the forecast's correctness; it is the topical lure."},"id":"u2-l1-f4-06","lesson":1},{"lesson":1,"unit":2,"why_correct":"'Each cut placed with control ... no room for error' describes exactness, so 'precise' fits.","lesson_name":"Words in Context","choices":{"C":"clumsy","A":"surgical","B":"precise","D":"medical"},"id":"u2-l1-f4-07","why_wrong":{"C":"'Clumsy' reverses the meaning, describing a lack of control.","A":"'Surgical' is tied to a surgeon by topic; though it can mean precise, here it is the circular topical lure, and 'precise' names the quality directly.","D":"'Medical' evokes the operating room but means relating to medicine, not exact; it is the topical lure."},"passage":"The surgeon's movements were remarkably ______, each cut placed with control that left no room for error.","correct":"B","target_family":"Çağrışım tuzağı","choice_families":{"C":"Ters anlam","A":"Çağrışım tuzağı","D":"Çağrışım tuzağı"},"stem":"Which choice completes the text with the most logical and precise word or phrase?"},{"why_correct":"'Drawing on letters and records earlier accounts overlooked' describes completeness, so 'thorough' fits.","choice_families":{"A":"Ters anlam","B":"Çağrışım tuzağı","D":"Çağrışım tuzağı"},"unit":2,"target_family":"Çağrışım tuzağı","choices":{"D":"chronological","C":"thorough","A":"superficial","B":"historical"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context","id":"u2-l1-f4-08","lesson":1,"correct":"C","passage":"The historian's biography is admirably ______, drawing on letters and records that earlier accounts overlooked.","why_wrong":{"A":"'Superficial' reverses the meaning, describing shallow work.","B":"'Historical' is tied to a historian by topic but means relating to history, not exhaustive in research.","D":"'Chronological' evokes history and biography but describes time order, not depth of research; it is the topical lure."}},{"id":"u2-l1-f4-09","lesson":1,"passage":"The pianist's performance was ______, holding the audience in complete silence until the final note faded.","correct":"D","why_wrong":{"C":"'Tedious' reverses the meaning, describing a dull performance.","A":"'Melodic' evokes music but describes tunefulness, not the gripping effect on the audience; it is the topical lure.","B":"'Musical' is tied to a pianist by topic but just means relating to music, not spellbinding."},"why_correct":"'Holding the audience in complete silence' describes a gripping performance, so 'captivating' fits.","choice_families":{"C":"Ters anlam","B":"Çağrışım tuzağı","A":"Çağrışım tuzağı"},"unit":2,"target_family":"Çağrışım tuzağı","choices":{"A":"melodic","B":"musical","C":"tedious","D":"captivating"},"stem":"Which choice completes the text with the most logical and precise word or phrase?","lesson_name":"Words in Context"},{"why_wrong":{"D":"'Biological' evokes the natural science but describes the field, not the breadth of the report; it is the topical lure.","C":"'Narrow' reverses the meaning, describing limited scope.","B":"'Ecological' is tied to an ecosystem by topic but means relating to ecology, not wide-ranging."},"correct":"A","passage":"The report on the ecosystem was praised as ______, tracing how a single species loss rippled through the whole food web.","lesson":1,"id":"u2-l1-f4-10","lesson_name":"Words in Context","stem":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"D":"biological","B":"ecological","A":"comprehensive","C":"narrow"},"target_family":"Çağrışım tuzağı","unit":2,"choice_families":{"C":"Ters anlam","B":"Çağrışım tuzağı","D":"Çağrışım tuzağı"},"why_correct":"'Tracing how a single loss rippled through the whole food web' describes wide coverage, so 'comprehensive' fits."}],"name":"Words in Context"},{"fam_short":{"Metnin bir kısmi bütünü değil":"Parça/bütün","Ters işlev":"Ters işlev","Doğru konu yanlış işlev":"Konu/işlev","Metinde olmayan işlev":"Olmayan işlev"},"families":["Doğru konu yanlış işlev","Metnin bir kısmi bütünü değil","Ters işlev","Metinde olmayan işlev"],"teaching":{"kavramsal_temel":["Text Structure and Purpose, metnin NE dediğini değil, NASIL kurulduğunu ya da bir parçanın NE ISE YARADIĞINI sorar. Yani konu değil, işlev ve yapı ölçülür.","Üç biçimde gelir: metnin genel yapısı, metnin ana amacı, ya da belirli bir cümlenin metindeki işlevi. Her üç biçimde de doğru cevap metnin YAPTIĞI hareketi tarif eder, konusunu özetlemez.","En kritik ayrım özet ile işlev arasındadır. discusses the history of X gibi bir seçenek metnin ne HAKKINDA olduğunu söyler, ne YAPTIĞINI değil. İşlev sorusunda bu tür özet seçenekler yanlıştır.","Bu yüzden metni okurken yazarın hareketini fiil olarak düşün: sunar, karşılaştırır, eleştirir, örnekler, çürütür. Bu fiil, doğru cevabın çekirdeğidir.","Text Structure and Purpose sorularının kalbinde 'retorik işlev' kavramı yatar: SAT sana metnin NE söylediğini değil, o cümleyi ya da metni NASIL ve NİÇİN kurduğunu sorar. Aynı bilgi bir örnek, bir karşı görüş, bir sonuç ya da bir varsayımı bozan kanıt olarak sunulabilir; senin görevin içeriği özetlemek değil, yazarın o parçayı hangi amaçla oraya koyduğunu adlandırmaktır. Bu yüzden bu sorularda 'doğru ama alakasız' özet şıkları çok yaygındır: söyledikleri metinde geçer, ama sorulan işlevi karşılamaz. Her zaman şıkkın FİİLİNE (açıklıyor / karşılaştırıyor / nitelendiriyor / çürütüyor) odaklan.","Digital SAT metinleri sık kullanılan birkaç yapı kalıbına oturur ve bu kalıpları tanımak işini kolaylaştırır: (1) Genel görüş → nitelendirme: yaygın bir kanı verilir, sonra 'yet/however' ile sınırlandırılır (çürütülmez). (2) İddia → kanıt: bir tez ileri sürülür, arkasından örnek veya veri gelir. (3) Problem → çözüm: bir zorluk tanımlanır, ardından bir öneri sunulur. (4) Varsayım → altüst eden bulgu: eski bir kabul anlatılır, sonra onu deviren yeni bir keşif verilir. Sinyal sözcükler bu kalıpların pusulasıdır: 'however', 'yet', 'but' dönüş; 'for example', 'such as' örnekleme; 'as a result', 'therefore' sonuç; 'because', 'since' gerekçe bildirir. Metni okurken bu sinyalleri işaretle; yapı çoğu zaman bu birkaç sözcükte gizlidir."],"cozumlu_ornekler":[{"choices":{"D":"Two gardening methods are compared and one is recommended.","B":"The text describes how soil nutrients affect the growth of wildflowers.","A":"A common assumption is presented, then challenged with a study whose results point to a more complicated conclusion.","C":"A study is described and then dismissed as unreliable."},"correct":"A","passage":"Many gardeners assume that richer soil always yields healthier plants. A recent study complicates this belief: in nutrient-heavy soil, several wildflowers grew tall but produced far fewer blooms. The finding suggests that abundance can sometimes work against a plant's reproductive success.","stem":"Which choice best describes the overall structure of the text?","adimlar":["Yazarın hareketini izle: önce yaygın bir varsayım veriliyor, sonra bir çalışma onu karmaşıklaştırıyor.","Bu bir hareket: varsayım sun, sonra ona karşı kanıt getir.","A tam bu hareketi tarif eder.","B konuyu özetler, işlevi değil. C yanlış, çalışma reddedilmiyor. D metinde yok, iki yöntem karşılaştırılmıyor."],"sonuc":"Doğru cevap metnin yaptığı hareketi (varsayım, sonra itiraz) tarif eder, konusunu özetlemez."},{"correct":"A","passage":"Coral reefs are often described as fragile, but this framing can mislead. Reefs have survived dramatic temperature swings over millions of years. What threatens them now is not fragility but the unusual speed of current change.","adimlar":["Yazar ne yapıyor: yaygın bir tanımı (kırılgan) düzeltiyor ve gerçek tehlikeyi (değişim hızı) gösteriyor.","Amaç bu düzeltme hareketidir.","A tam bunu söyler.","B konu özeti. C yanlış, metin tehlikeyi kabul ediyor. D karşılaştırma yok."],"sonuc":"Amaç sorusunda cevap metnin yaptığı ise (düzeltmek, yerini göstermek) odaklanır, konuya değil.","choices":{"C":"To argue that coral reefs are not in any danger today.","A":"To correct a common characterization of reefs by locating the real source of their present danger.","B":"To explain how coral reefs respond to changes in ocean temperature.","D":"To compare modern reefs with ancient reefs."},"stem":"Which choice best states the main purpose of the text?"},{"choices":{"D":"It compares two inventors and argues that one deserves far more credit than the other.","A":"It presents a scientific hypothesis and then describes a controlled experiment designed to confirm it.","B":"It defines a technical term and then lists several practical examples of its everyday use.","C":"It introduces a widely held view and then presents evidence that qualifies it."},"stem":"Which choice best describes the overall structure of the text?","adimlar":["Metnin 'ne yaptığını' izle: ilk cümle yaygın bir görüş verir ('çoğu tarih Gutenberg'e odaklanır').","'Yet' ile bir dönüş gelir: Çin ve Kore'deki daha erken örnekler sunulur — bu, ilk görüşü tümden reddetmez, sınırlandırır.","Son cümle bunu açıkça söyler: 'do not diminish ... but they do complicate' = nitelendirme, çürütme değil.","A deney anlatmaz; B teknik terim tanımlamaz; D 'birini daha üstün ilan eder' ama metin tersine 'başarıyı azaltmaz' der. C, 'yaygın görüş + onu nitelendiren kanıt' yapısını tam karşılar."],"sonuc":"Doğru cevap C. Metin bir genel kanı kurar ve ardından onu tümden yıkmadan sınırlandıran kanıt sunar; D, 'complicate' ile 'argues one deserves more credit' arasındaki farkı ıskalayan tuzaktır.","passage":"Most histories of the printing press focus on Gutenberg's fifteenth-century Europe. Yet movable type was invented in China centuries earlier, and Korean printers were casting metal type decades before Gutenberg. These facts do not diminish Gutenberg's achievement, but they do complicate the familiar story of a single European origin.","correct":"C"},{"passage":"The old ferry no longer runs. Where crowds once jostled for the morning crossing, gulls now pick at the rotting planks of the dock. The ticket booth, its window clouded with grime, still bears a faded schedule for boats that will never come.","choices":{"D":"To compare the dock's past and present levels of daily activity in depth.","C":"To argue that the ferry service should be restored for the community.","B":"To evoke a sense of abandonment through concrete, sensory detail.","A":"To explain the economic reasons the ferry service was permanently discontinued."},"correct":"B","stem":"Which choice best states the main purpose of the text?","adimlar":["Metnin amacını sor: yazar bilgi mi veriyor, ikna mı ediyor, yoksa bir his mi uyandırıyor?","Somut imgeler ('rotting planks', 'clouded window', 'boats that will never come') açıklama değil atmosfer kurar; bir terk edilmişlik hissi yaratır.","A ekonomik 'neden' açıklamaz — metinde sebep yok; C 'restore edilmeli' diye bir savunma yok; D geçmiş-şimdi karşılaştırmasını kullanır ama amacı 'karşılaştırma' değil, hissi güçlendiren bir araç olarak kullanır.","B, somut duyusal ayrıntı yoluyla terk edilmişlik hissi uyandırma amacını doğru adlandırır."],"sonuc":"Doğru cevap B. Pasaj, olguları açıklamak yerine somut imgelerle bir terk edilmişlik atmosferi kurar; A ve C metinde bulunmayan sebep/savunma öğeleri ekleyen tuzaklardır."},{"passage":"For decades, biologists assumed that the tuatara, a reptile native to New Zealand, was simply an unusual kind of lizard. Recent genetic analysis, however, has shown that the tuatara belongs to an entirely separate order, one whose other members died out over a hundred million years ago. As a result, the animal is now studied as a rare window into deep evolutionary history.","correct":"D","sonuc":"Doğru cevap D. 'However' ile giren cümle, önceki varsayımı çürüten yeni kanıtı sunar; A, cümlenin yönünü tersine okuyan (destekliyor sanan) klasik tuzaktır.","adimlar":["Önceki cümleyi oku: 'biologists assumed ... simply a lizard' = uzun süredir tutulan bir varsayım.","Altı çizili cümle 'however' ile başlar ve genetik analizin tuatara'nın AYRI bir takıma ait olduğunu gösterdiğini söyler: varsayımı bozar.","Sonraki cümle 'As a result' ile sonucu verir, bu da altı çizili cümlenin bir dönüm noktası olduğunu doğrular.","A varsayımı 'destekler' der (tersi doğru); B analizin sınırından bahsetmez; C ana fikri tekrar etmez, yeni bir bulgu ekler. D, 'uzun süreli varsayımı deviren bulgu' işlevini doğru tanımlar."],"stem":"Which choice best describes the function of the underlined second sentence (\"Recent genetic ... years ago\") in the text as a whole?","choices":{"D":"It presents a finding that overturns a long-held assumption.","B":"It acknowledges a significant limitation of the genetic analysis being described.","A":"It offers a specific example that further supports the passage's opening assumption.","C":"It restates the passage's main idea using more technical vocabulary."}}],"alt_konular_baslik":"Soru alt tipleri","celdirici_aileleri":[{"ad":"Doğru konu yanlış işlev","tanim":"Seçenek metnin KONUSUNU doğru söyler ama YAPTIĞI şeyi yanlış tarif eder. Özet gibi okunur, işlev değil. Öğrenci konuyu tanıdığı için işaretler ama soru işlev sorar."},{"ad":"Metnin bir kısmi bütünü değil","tanim":"Seçenek metnin sadece BIR bölümünü doğru tarif eder ama soru BÜTÜNÜN yapısını ister. İlk cümleye ya da son cümleye uyar, metnin tamamına uymaz."},{"ad":"Ters işlev","tanim":"Seçenek metnin yaptığının TERSİ bir hareket söyler. Metin destekliyorsa seçenek eleştirir der, metin örnekliyorsa reddeder der. Yön yanlıştır."},{"ad":"Metinde olmayan işlev","tanim":"Seçenek makul görünen ama metnin ASLA yapmadığı bir hareket tarif eder. Metinde olmayan bir karşılaştırma, çözüm ya da eleştiri uydurur."},{"ad":"Yanlış Retorik Fiil Şıkkı","tanim":"Yapı/amaç şıkları genellikle bir fiille tanımlanır (açıklar, karşılaştırır, savunur, tanımlar, çürütür, nitelendirir). Bu çeldirici, metnin gerçekte yaptığından farklı bir fiil seçer: metin bir görüşü 'nitelendiriyor' iken şık 'tümden çürütüyor' ya da 'destekliyor' der. Şıkkın fiilini metnin eylemiyle birebir eşleştirmezsen yakalanırsın."},{"tanim":"Metnin yalnızca bir cümlesi veya bölümü için geçerli olan, ama metnin geneli için geçerli olmayan bir yapı/amaç tanımı. Tek bir ayrıntıyı doğru betimlediği için çekicidir, ancak sorunun istediği 'genel yapı' veya 'ana amaç' düzeyini ıskalar. Doğru şık daima metnin bütününü kapsar.","ad":"Parça Doğru, Bütün Yanlış Şıkkı"}],"alt_konular":[{"govde":["Soru kökü: \"Which choice best describes the overall structure of the text?\" Metnin baştan sona nasıl ilerlediğini tarif eden seçeneği seçersin: sorun-çözüm, genel-özel, iddia-karşı iddia, kronolojik gibi.","Yöntem: metni iki-üç aşamaya böl. İlk cümleler ne yapıyor (durum kuruyor mu, soru mu soruyor)? Gövde ne yapıyor? Son ne yapıyor? Bu üç hareketi birleştiren seçenek doğrudur.","Tuzak: metnin sadece bir bölümünü doğru tarif eden ama tümünü kapsamayan seçenek. Yapı sorusu bütünü ister."],"baslik":"1) Metnin genel yapısı (overall structure)","kural":"Metni hareketlere böl (giriş → gelişme → sonuç) ve üçünü birden tarif eden seçeneği seç."},{"ornek":"Bir örnek cümlesi çoğu zaman 'bir önceki genellemeyi somut bir durumla destekler' işlevi taşır.","govde":["Soru kökü: \"Which choice best describes the function of the underlined sentence in the text as a whole?\" Altı çizili cümlenin metindeki GÖREVİNİ sorar — ne söylediğini değil, ne İŞE yaradığını.","İşlev fiilleri anahtardır: örnek verir, karşı görüş sunar, iddiayı sınırlar, geçiş yapar, kanıt getirir. Cümlenin bir öncesi ve bir sonrasıyla ilişkisine bak; işlev bu ilişkiden doğar.","Tuzak: cümlenin içeriğini doğru özetleyen ama işlevini yanlış adlandıran seçenek. 'Ne diyor' ile 'ne yapıyor' farkını koru."],"baslik":"2) Bir bölümün işlevi (function of a sentence)"},{"govde":["Soru kökü: \"The main purpose of the text is to...\" Yazarın bu metni neden yazdığını tek fiille yakalarsın: tanıtmak, karşılaştırmak, eleştirmek, ikna etmek, açıklamak.","Amaç, ana fikrin niyet hâlidir. Metin bir olguyu yalnızca aktarıyorsa amaç 'açıklamak'tır; bir tarafı savunuyorsa 'ikna etmek'tir. Metnin tonunu ölç: nötr mü, taraflı mı?","Tuzak: metinde geçen ama amacı olmayan bir ayrıntıyı amaç sanmak, ya da metnin tonundan daha güçlü/zayıf bir fiil seçmek."],"baslik":"3) Yazarın amacı (main purpose)"}],"top_tips":["Seçeneği bir FİİLE indir. introduces, then evaluates, gibi. Metin bu fiili gerçekten yapıyor mu diye kontrol et. Yapmıyorsa ele.","Konu özeti tuzağına dikkat. discusses the history of X gibi seçenekler çoğu zaman konuyu söyler, işlevi değil. Soru işlev soruyorsa bunlar yanlıştır.","Genel yapı sorusunda tek parça tarif eden seçeneği ele. Cevap metnin başından sonuna kadarki hareketi kapsamalı.","Bir cümlenin işlevi soruluyorsa, o cümleyi metinden ÇIKAR ve ne kaybettiğini düşün. Kaybettiğin şey o cümlenin işlevidir."],"ne_olculuyor":["Bu soru metnin NE dediğini değil, NASIL kurulduğunu ya da bir parçanın NE ISE YARADIĞINI ölçer. Yapı ve işlev sorusudur.","Üç biçimde gelir: metnin genel yapısı, metnin ana amacı, ya da belirli bir cümlenin metindeki işlevi.","Kritik nokta: doğru seçenek metnin YAPTIĞI şeyi tarif eder, konusunu ÖZETLEMEZ. Özet ile işlev farklı şeylerdir ve tuzak tam burada kurulur."],"strateji":["Yazarın hareketini fiil olarak düşün: sunar, çürütür, örnekler, karşılaştırır.","Soru genel yapı mi, amaç mi, tek cümle işlevi mi belirle.","Genel soruda cevap bütünü kapsamalı, parça tarifini ele.","Konu özeti olan seçenekleri ele, işlev arayan sorularda.","Seçeneğin fiili metnin gerçekte yaptığı harekete uyuyor mu kontrol et."],"karar_proseduru":["Önce metnin hareketini izle.  Yazar ne yapıyor: bir iddia mi kuruyor, bir problem mi sunuyor, iki görüş mu karşılaştırıyor, bir örnek mi veriyor. Fiil olarak düşün: sunar, karşılaştırır, eleştirir, örnekler.","Soru genel mi özel mi belirle.  Genel yapı soruluyorsa cevap metnin BÜTÜNÜNÜ kapsamalı. Tek bir cümlenin işlevi soruluyorsa cevap o cümlenin metne KATKISINI vermeli.","Seçenekleri fiil olarak oku.  Her seçenek bir hareket tarif eder: introduces, challenges, illustrates, qualifies. Bu fiil metnin gerçekte yaptığı harekete uyuyor mu.","Konu özeti olan seçenekleri ele.  Metnin ne HAKKINDA olduğunu söyleyip ne YAPTIĞINI söylemeyen seçenek yanlıştır.","Kapsam kontrolü yap.  Seçenek metnin sadece bir kısmını mi tarif ediyor, yoksa bütününü mu. Genel soruda parça tarifi tuzaktır."],"alt_konular_intro":"Bu beceri 'metin ne diyor'dan çok 'metin nasıl kurulmuş ve neden' sorusunu sorar. Üç ölçek vardır: bütün metnin yapısı, tek bir cümlenin işlevi, ve yazarın genel amacı. Soruyu okur okumaz hangi ölçekte olduğunu belirlemek doğru cevaba giden ilk adımdır.","sik_hatalar":[{"cozum":"discusses X gibi seçenekler konuyu söyler. Soru işlev soruyorsa bunlar yanlıştır. Fiile bak: yazar ne YAPIYOR.","hata":"Konu özetini işlev sanmak"},{"cozum":"Genel yapı sorusunda cevap metnin başından sonuna kadarki hareketi kapsamalı, sadece bir cümleyi değil.","hata":"Genel yapı sorusunda tek parçayı tarif etmek"},{"cozum":"Metin destekliyorsa çürütür, örnekliyorsa reddeder gibi seçenekler yönü ters okur. Yazarın gerçek hareketine bak.","hata":"Ters işlev seçmek"},{"cozum":"Makul görünen ama metnin yapmadığı bir karşılaştırma ya da çözüm eklenmişse, o seçenek yanlıştır.","hata":"Metinde olmayan işlev uydurmak"},{"cozum":"'Bu metin ne ANLATIYOR' değil, 'bu cümle/metin ne YAPIYOR' diye sor: örnek mi veriyor, karşı görüş mü sunuyor, sonuç mu çıkarıyor, varsayımı mı bozuyor? İşlev sorularında konu değil eylem önemlidir.","hata":"Metnin konusuna (neyden bahsettiğine) odaklanıp retorik işlevini (ne yaptığını) atlamak."},{"hata":"Altı çizili cümlenin işlevini, çevresindeki cümlelerle ilişkisine bakmadan tek başına değerlendirmek.","cozum":"Cümleden hemen önceki ve sonraki cümleyi mutlaka oku. İşlev her zaman komşu cümlelerle kurulan ilişkiden (destek mi, çelişki mi, sonuç mu) doğar; 'however', 'as a result', 'for example' gibi sinyaller yönü ele verir."}]},"no":2,"main_ids":["u2-l2-f1-01","u2-l2-f2-01","u2-l2-f3-01","u2-l2-f4-01"],"name":"Text Structure and Purpose","questions":[{"correct":"A","passage":"Many gardeners assume that richer soil always yields healthier plants. A recent study complicates this belief: in nutrient-heavy soil, several native wildflowers grew tall but produced far fewer blooms than the same species grown in leaner ground. The finding suggests that abundance can sometimes work against a plant's reproductive success.","why_wrong":{"D":"No two gardening methods are compared or recommended.","B":"This names the topic (soil and wildflowers) but not what the text does; it reads like a summary, not a description of structure.","C":"The text does not dismiss the study; it treats the results as meaningful."},"id":"u2-l2-f1-01","stem":"Which choice best describes the overall structure of the text?","choice_families":{"B":"Doğru konu yanlış işlev","C":"Ters işlev","D":"Metinde olmayan işlev"},"target_family":"Doğru konu yanlış işlev","lesson":2,"choices":{"A":"A common assumption is presented, then challenged with a study whose results point to a more complicated conclusion.","B":"The text lays out how different levels of soil nutrients affect the growth and the flowering of several native wildflower species in the study.","C":"A study is described in detail and then dismissed as unreliable.","D":"Two competing gardening methods are compared and one is recommended."},"lesson_name":"Text Structure and Purpose","why_correct":"The text states a common belief, then introduces a study that complicates it and draws a nuanced conclusion. Choice A captures that movement.","unit":2},{"why_correct":"The text moves toward the scholars' argument that her works deserve attention, so its purpose is to make that case. Choice A fits.","choice_families":{"A":"Doğru konu yanlış işlev","C":"Ters işlev","D":"Metinde olmayan işlev"},"target_family":"Doğru konu yanlış işlev","unit":2,"choices":{"C":"To question whether Clara Schumann's compositions have any lasting value.","A":"To describe, in roughly chronological order, the life and the celebrated performing career of the composer Clara Schumann.","B":"To argue that a historically neglected composer's works merit renewed critical attention.","D":"To compare Clara Schumann's performing career with her teaching career."},"lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","id":"u2-l2-f1-02","lesson":2,"correct":"B","passage":"The composer Clara Schumann was celebrated as a performer in her lifetime, yet her compositions were long overlooked. Only in recent decades have scholars begun to examine her songs and piano works closely, arguing that they deserve a place beside those of her better-known contemporaries.","why_wrong":{"D":"No teaching career is mentioned or compared.","C":"The text supports the value of her works rather than questioning it.","A":"Describing her life is the topic, not the purpose; the text builds toward an argument, not a biography."}},{"id":"u2-l2-f1-03","correct":"C","passage":"Coral reefs are often described as fragile, but this framing can mislead. Reefs have survived dramatic swings in ocean temperature over millions of years. What threatens them now is not fragility but the unusual speed of current change, which outpaces the corals' capacity to adapt.","why_wrong":{"B":"Explaining temperature response is topic material, not the text's purpose, which is corrective.","A":"The text says reefs are threatened now, so it does not claim they are safe.","D":"Past and present reefs are mentioned but not systematically compared."},"choice_families":{"D":"Metinde olmayan işlev","A":"Ters işlev","B":"Doğru konu yanlış işlev"},"target_family":"Doğru konu yanlış işlev","stem":"Which choice best states the main purpose of the text?","lesson":2,"why_correct":"The text rejects the 'fragile' framing and pinpoints speed of change as the real threat, so its purpose is to correct and relocate the danger. Choice A fits.","unit":2,"choices":{"D":"To compare modern reefs with the reefs of millions of years ago.","A":"To argue that coral reefs are not actually in any danger today.","B":"To explain in some detail how coral reefs physically respond to gradual and sudden shifts in the temperature of the ocean around them.","C":"To correct a common characterization of reefs by locating the real source of their present danger."},"lesson_name":"Text Structure and Purpose"},{"lesson_name":"Text Structure and Purpose","choices":{"D":"To explain how a set of images came to have an influence beyond their documentary value.","A":"To compare early space photography with modern satellite imaging.","B":"To describe the first photographs of Earth taken from space.","C":"To argue that the first photographs of Earth from space had no real effect on public attitudes, despite how widely they circulated."},"unit":2,"why_correct":"The text explains how the images gained influence beyond documentation, energizing a movement. Choice A captures that purpose.","lesson":2,"stem":"Which choice best states the main purpose of the text?","target_family":"Doğru konu yanlış işlev","choice_families":{"B":"Doğru konu yanlış işlev","A":"Metinde olmayan işlev","C":"Ters işlev"},"why_wrong":{"B":"Describing the photographs is the topic; the text's aim is to explain their larger effect.","A":"Modern satellite imaging is never mentioned.","C":"The text credits the images with real influence, the opposite of claiming none."},"correct":"D","passage":"The first photographs of Earth from space did more than document the planet. Circulated widely in the late 1960s, the images gave many viewers a sudden sense of the planet as small, whole, and shared, and historians credit them with helping to energize the emerging environmental movement.","id":"u2-l2-f1-04"},{"correct":"A","passage":"For years, economists treated commuting time as a minor cost. Newer research challenges that view, linking long daily commutes to measurable declines in well-being and even in job performance. The costs of distance, this work suggests, reach well beyond the hours spent in transit.","why_wrong":{"B":"This states the topic (effects of commuting) rather than the text's structure.","C":"The text endorses the newer research rather than rejecting it.","D":"No two measurement methods are contrasted."},"id":"u2-l2-f1-05","lesson":2,"choices":{"A":"A long-held view is noted, then countered by research that broadens the understood costs of an activity.","B":"The text explains the many effects that unusually long daily commutes can have on workers' well-being and on their job performance.","C":"A body of research is introduced and then rejected as overstated.","D":"Two methods of measuring commuting time are contrasted."},"stem":"Which choice best describes the overall structure of the text?","lesson_name":"Text Structure and Purpose","why_correct":"The text states the old view, then uses new research to widen the recognized costs. Choice A tracks that structure.","choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Doğru konu yanlış işlev"},"unit":2,"target_family":"Doğru konu yanlış işlev"},{"correct":"B","passage":"The novel's narrator seems, at first, entirely trustworthy. Only gradually do small contradictions accumulate in her account, until the reader begins to suspect that she has been concealing her own role in the events she describes. The unease is the point: the book asks how much any single narrator can be believed.","why_wrong":{"A":"Describing the narrator is topic material, not the purpose, which is about the effect she creates.","C":"The text argues the narrator is not fully reliable, the reverse of C.","D":"Other novels' narrators are not compared."},"id":"u2-l2-f1-06","lesson":2,"choices":{"D":"To compare this novel's narrator with narrators in other novels.","C":"To argue that the novel's narrator is fully reliable throughout.","B":"To show how the novel uses a gradually unreliable narrator to raise a larger question.","A":"To describe the novel's seemingly trustworthy narrator and the events she recounts as small contradictions gradually accumulate."},"lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","choice_families":{"D":"Metinde olmayan işlev","A":"Doğru konu yanlış işlev","C":"Ters işlev"},"why_correct":"The text explains how the narrator's growing unreliability serves a larger question about belief. Choice A fits.","target_family":"Doğru konu yanlış işlev","unit":2},{"target_family":"Doğru konu yanlış işlev","unit":2,"why_correct":"The text tempers the 'press alone' explanation by embedding it among other conditions. Choice A fits.","choice_families":{"D":"Metinde olmayan işlev","B":"Doğru konu yanlış işlev","A":"Ters işlev"},"lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","choices":{"C":"To qualify a single-cause explanation by placing one factor within a broader set of conditions.","A":"To argue that the printing press had essentially nothing to do with the spread of literacy across early modern Europe.","B":"To describe how the printing press was invented and spread.","D":"To compare literacy rates in urban and rural Europe."},"lesson":2,"id":"u2-l2-f1-07","why_wrong":{"B":"How the press spread is topic material, not the corrective purpose.","A":"The text says the press mattered, so it does not dismiss its role.","D":"Urban and rural literacy rates are not compared."},"passage":"It is tempting to see the printing press as the sole cause of the spread of literacy in Europe. Yet presses were useless without cheap paper, rising urban schools, and a growing class of readers. The press mattered, but it was one part of a wider set of conditions that made mass reading possible.","correct":"C"},{"stem":"Which choice best describes the overall structure of the text?","target_family":"Doğru konu yanlış işlev","choice_families":{"C":"Ters işlev","A":"Metinde olmayan işlev","B":"Doğru konu yanlış işlev"},"why_wrong":{"C":"The text complicates the popular view rather than confirming it.","B":"This names the topic (worker behavior) rather than the text's structure.","A":"No two bee species are compared."},"passage":"Bee colonies are often praised as models of selfless cooperation. The reality is subtler. Workers do labor for the hive, but recent studies show they also compete, police one another, and occasionally lay their own eggs. Cooperation in the hive is real, yet it rests on constant internal negotiation.","correct":"D","id":"u2-l2-f1-08","lesson_name":"Text Structure and Purpose","choices":{"D":"An idealized view is stated, then complicated by evidence of tension beneath the cooperation.","B":"The text describes the everyday social behavior of worker bees inside a colony as they labor, compete, and police one another.","A":"Two species of bees are compared in terms of cooperation.","C":"A popular view of bee colonies is presented and then fully confirmed."},"unit":2,"why_correct":"The text states the idealized view, then complicates it with evidence of internal competition. Choice A captures the structure.","lesson":2},{"correct":"A","passage":"The painter spent her final years on a single mural, and critics a
