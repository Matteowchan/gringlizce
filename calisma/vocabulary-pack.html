 and alert during a period of vulnerability = keenly watchful to detect danger. \"Vigilant\" = keeping careful watch for possible danger.\n\nA — present in greater numbers describes staffing levels.\nC — following an expanded checklist is a procedural response.\nD — coordinating across jurisdictions is a cooperative arrangement.\n\nKelime: vigilant — tetikte, uyanık, dikkatli"}, {"k": "vocab", "p": "The long-awaited scientific study seemed to <u>vindicate</u> the nutritional approach that had been dismissed for decades: participants following the protocol showed measurably better outcomes across every health marker tracked.", "q": "As used in the text, \"vindicate\" most nearly means:", "o": ["A) explain the scientific mechanism underlying", "B) demonstrate to be right or justified after doubt", "C) extend to a broader population than originally studied", "D) encourage wider adoption through policy incentives"], "a": 1, "e": "B is correct. Dismissed for decades but now shown to produce better outcomes = shown to be right after being doubted. \"Vindicate\" = to clear of blame or suspicion; to show or prove to be right.\n\nA — explain the mechanism describes scientific elaboration.\nC — extend to a broader population describes scale.\nD — encourage adoption describes a policy action.\n\nKelime: vindicate — haklı çıkarmak, temize çıkarmak, doğrulamak"}, {"k": "vocab", "p": "Public enthusiasm for the project began to <u>wane</u> after the first delays were announced: attendance at community meetings dropped, media coverage shifted to other stories, and the petition's online support page stopped adding new signatures.", "q": "As used in the text, \"wane\" most nearly means:", "o": ["A) shift direction entirely", "B) become smaller or weaker; diminish", "C) generate criticism instead of support", "D) become associated with controversy"], "a": 1, "e": "B is correct. Attendance dropped, coverage shifted, petition stalled = getting smaller and weaker. \"Wane\" = to decrease in vigor, power, or extent; to diminish.\n\nA — shift direction implies change in type, not reduction.\nC — generate criticism describes a change in kind, not in degree.\nD — association with controversy is a different change.\n\nKelime: wane — azalmak, zayıflamak, giderek küçülmek"}, {"k": "vocab", "p": "Burned twice by partners who had failed to deliver on their commitments, the startup's founders were understandably <u>wary</u> of entering new agreements without extensive due diligence and contract safeguards.", "q": "As used in the text, \"wary\" most nearly means:", "o": ["A) legally protected through prior contractual experience", "B) feeling or showing caution about possible dangers", "C) financially constrained after previous losses", "D) strategically selective about potential partnerships"], "a": 1, "e": "B is correct. Previous partners failed to deliver; the founders now exercise caution = feeling caution about possible dangers. \"Wary\" = feeling or showing caution about possible dangers.\n\nA — legally protected describes a status, not a disposition.\nC — financially constrained is a material consequence, not the emotional state of wariness.\nD — strategically selective describes behavior, not the underlying disposition.\n\nKelime: wary — temkinli, ihtiyatlı, dikkatli"}, {"k": "vocab", "p": "The new volunteer coordinator was so <u>zealous</u> in her outreach that she personally contacted every former donor in the database, organized three fundraising events in her first month, and began designing a mobile app to streamline donations.", "q": "As used in the text, \"zealous\" most nearly means:", "o": ["A) professionally experienced and technically skilled", "B) having or showing great energy and enthusiasm", "C) highly systematic in her organizational approach", "D) primarily motivated by financial compensation"], "a": 1, "e": "B is correct. Personally contacting every donor, three events in one month, designing an app = great energy and enthusiasm. \"Zealous\" = having or showing great energy or enthusiasm in pursuit of a cause.\n\nA — professionally experienced describes background, not enthusiasm.\nC — systematic describes method, not the intensity of commitment.\nD — financial motivation is not implied.\n\nKelime: zealous — hevesli, gayretli, coşkulu"}, {"k": "vocab", "p": "The judge <u>admonished</u> the witness for speaking before being asked a question, reminding her that the court's procedures required direct answers and that unsolicited elaborations were not permitted.", "q": "As used in the text, \"admonished\" most nearly means:", "o": ["A) formally disqualified from testifying", "B) warned or reprimanded firmly but not severely", "C) requested to clarify a confusing response", "D) publicly praised for a valuable contribution"], "a": 1, "e": "B is correct. Reminded about procedure, not disqualified = warned firmly but not severely. \"Admonish\" = to warn or reprimand someone, often gently.\n\nA — disqualified is a severe formal action; admonish is a warning.\nC — requested to clarify is a different communicative act.\nD — praised is the opposite.\n\nKelime: admonish — uyarmak, azarlamak, ikaz etmek"}, {"k": "vocab", "p": "The report did not merely describe the problem — it actively <u>advocated</u> for a specific policy response, recommending that the legislature adopt the proposed subsidy framework within the current session.", "q": "As used in the text, \"advocated\" most nearly means:", "o": ["A) described objectively without expressing a preference", "B) publicly supported and recommended", "C) predicted the likelihood of adoption", "D) criticized alternative approaches to the same problem"], "a": 1, "e": "B is correct. Actively recommending a specific policy = publicly supporting and recommending. \"Advocate\" = to publicly recommend or support.\n\nA — objectively described is the opposite; the report took a position.\nC — predicted likelihood is different from recommending.\nD — criticized alternatives is a method of advocacy, not the definition.\n\nKelime: advocate — savunmak, desteklemek; taraftar"}, {"k": "vocab", "p": "Researchers hoped that the new drug would <u>alleviate</u> the most painful symptoms even if a complete cure remained out of reach, allowing patients to manage daily life without constant reliance on strong analgesics.", "q": "As used in the text, \"alleviate\" most nearly means:", "o": ["A) permanently eliminate through targeted treatment", "B) make less severe; relieve partially", "C) identify the specific mechanism causing", "D) prevent the symptoms from recurring"], "a": 1, "e": "B is correct. Relieve the most painful symptoms even without a full cure = make less severe, relieve partially. \"Alleviate\" = to make suffering or a problem less severe.\n\nA — permanently eliminate is too strong; alleviate implies partial relief.\nC — identify the mechanism is a diagnostic function.\nD — prevent recurrence is different from relieving current severity.\n\nKelime: alleviate — hafifletmek, azaltmak, rahatlatmak"}, {"k": "vocab", "p": "The treaty's third clause was sufficiently <u>ambiguous</u> that both parties signed it with different interpretations in mind, and the resulting disagreement required three years of subsequent negotiation to resolve.", "q": "As used in the text, \"ambiguous\" most nearly means:", "o": ["A) open to more than one interpretation", "B) deliberately misleading in its language", "C) translated imperfectly from another language", "D) legally contested by third-party observers"], "a": 0, "e": "A is correct. Both parties signed with different interpretations = open to more than one meaning. \"Ambiguous\" = open to more than one interpretation; not having one obvious meaning.\n\nB — deliberately misleading implies intent; ambiguous can be unintentional.\nC — poor translation is a possible cause, not the definition.\nD — legally contested by third parties describes a consequence.\n\nKelime: ambiguous — belirsiz, iki anlamlı, muğlak"}, {"k": "vocab", "p": "The graduate student was <u>ambivalent</u> about leaving academia: she was exhausted by the funding uncertainty and long hours, but she had genuinely loved the research and feared she would miss the intellectual community.", "q": "As used in the text, \"ambivalent\" most nearly means:", "o": ["A) confused about what the right decision would mean in practice", "B) having mixed feelings; uncertain due to opposing reactions", "C) gradually becoming more negative about an earlier commitment", "D) influenced by both personal and professional considerations"], "a": 1, "e": "B is correct. Both exhausted and genuinely loving the work = having mixed feelings, opposing reactions simultaneously. \"Ambivalent\" = having mixed feelings or contradictory ideas about something.\n\nA — confused about practical implications is different from having mixed feelings.\nC — gradually becoming more negative implies a trajectory; ambivalent implies simultaneous opposing feelings.\nD — personal and professional considerations describes the categories, not the emotional state.\n\nKelime: ambivalent — kararsız, iki duygu arasında kalmış"}, {"k": "vocab", "p": "The manager's dismissive response to the team's concerns only served to <u>antagonize</u> them further, making it significantly harder to resolve the underlying dispute before it escalated to the executive level.", "q": "As used in the text, \"antagonize\" most nearly means:", "o": ["A) confuse by providing contradictory information", "B) cause hostility in; provoke opposition from", "C) exclude from future decision-making processes", "D) deliberately misrepresent to other stakeholders"], "a": 1, "e": "B is correct. Dismissive response made the dispute worse and harder to resolve = provoked hostility, made them more opposed. \"Antagonize\" = to cause hostility in; to provoke opposition.\n\nA — confuse with contradictory information is a different effect.\nC — exclude from decision-making is a specific action.\nD — misrepresent to stakeholders is a different behavior.\n\nKelime: antagonize — düşman etmek, kışkırtmak, karşı cephede bırakmak"}, {"k": "vocab", "p": "The company's HR policies were widely criticized as <u>archaic</u>: the leave request process required paper forms to be submitted in triplicate, approved at four levels of management, and filed in physical folders.", "q": "As used in the text, \"archaic\" most nearly means:", "o": ["A) inconsistent across different departments", "B) very old-fashioned; belonging to an earlier period", "C) excessively bureaucratic in its requirements", "D) rarely followed in practice despite remaining on the books"], "a": 1, "e": "B is correct. Paper triplicate forms approved at four levels = belonging to an earlier, outdated era. \"Archaic\" = very old or old-fashioned.\n\nA — inconsistency is a different problem.\nC — excessively bureaucratic describes the effect, not the quality of archaism.\nD — rarely followed in practice is a different observation.\n\nKelime: archaic — eskimiş, günümüzde kullanılmayan, çok eski"}, {"k": "vocab", "p": "The intern surprised everyone in the presentation by being able to <u>articulate</u> the project's core tensions clearly — explaining not just what the challenges were but why they were fundamentally difficult to resolve simultaneously.", "q": "As used in the text, \"articulate\" most nearly means:", "o": ["A) express coherently and in detail", "B) resolve through structured analysis", "C) identify through extended research", "D) present in a format suited to the audience"], "a": 0, "e": "A is correct. Explaining clearly both what and why = expressing coherently and in detail. \"Articulate\" (v.) = to express an idea or feeling clearly and effectively.\n\nB — resolve implies finding a solution; articulate means expressing clearly.\nC — identify through research describes discovery.\nD — format suited to audience describes presentation strategy.\n\nKelime: articulate — açık ifade etmek; anlaşılır konuşan"}, {"k": "vocab", "p": "The writer lived an almost <u>ascetic</u> life during the composition of the novel: he sublet his apartment, moved to a small room in the countryside, ate two meals a day, and checked his email once a week.", "q": "As used in the text, \"ascetic\" most nearly means:", "o": ["A) isolated to avoid professional interruption", "B) characterized by severe self-discipline; austere", "C) financially constrained by limited earnings", "D) devoted entirely to creative rather than social life"], "a": 1, "e": "B is correct. Sublet apartment, countryside room, two meals, weekly email = severe self-discipline, willingly austere. \"Ascetic\" = characterized by the practice of severe self-discipline.\n\nA — isolated to avoid interruption is a reason, not the quality itself.\nC — financially constrained implies necessity; ascetic implies chosen simplicity.\nD — devoted to creative life is a motivation, not the quality of asceticism.\n\nKelime: ascetic — dünyadan el etek çekmiş; sade, kendini kısıtlayan"}, {"k": "vocab", "p": "The new employees were encouraged to <u>assimilate</u> the company's design principles not as a set of rules to memorize but as a way of thinking that would eventually shape their instinctive responses to new problems.", "q": "As used in the text, \"assimilate\" most nearly means:", "o": ["A) memorize through repeated review and testing", "B) absorb and integrate into one's thinking", "C) apply consistently in all professional contexts", "D) teach to colleagues through structured mentorship"], "a": 1, "e": "B is correct. Not memorize as rules but internalize as a way of thinking = absorb and integrate. \"Assimilate\" = to absorb and integrate; to take in and make part of oneself.\n\nA — memorize through repetition is the approach being contrasted with assimilation.\nC — apply consistently describes behavior after assimilation.\nD — teach to colleagues is a different activity.\n\nKelime: assimilate — özümsemek, benimsemek; uyum sağlamak"}, {"k": "vocab", "p": "The startup's pitch was <u>audacious</u> by any measure: the founders were requesting twenty million dollars with no revenue, no signed customers, and a technology platform that had been demonstrated only in a controlled laboratory environment.", "q": "As used in the text, \"audacious\" most nearly means:", "o": ["A) clearly unrealistic in its financial projections", "B) showing a willingness to take surprisingly bold risks", "C) compelling in its vision despite practical limitations", "D) ambitious in scope but modest in its initial claims"], "a": 1, "e": "B is correct. No revenue, no customers, unproven technology = requesting a bold amount with very little established. \"Audacious\" = showing a willingness to take surprisingly bold risks.\n\nA — unrealistic describes the evaluation, not the quality.\nC — compelling describes reception, not audacity.\nD — modest in initial claims is the opposite of what is described.\n\nKelime: audacious — cüretkar, gözüpek, atılgan"}, {"k": "vocab", "p": "The novelist's <u>aversion</u> to social media was well-known: she had deactivated all her accounts years before, saw no reason to return to them, and found even the language of digital engagement distasteful.", "q": "As used in the text, \"aversion\" most nearly means:", "o": ["A) a strong dislike of or opposition to", "B) a principled philosophical objection to", "C) a pattern of behavior established over many years", "D) an inability to understand the appeal of"], "a": 0, "e": "A is correct. Deactivated accounts, no reason to return, finds the language distasteful = strong dislike. \"Aversion\" = a strong dislike or disinclination.\n\nB — principled philosophical objection implies a systematic position; aversion is an emotional response.\nC — pattern of behavior is a consequence of aversion, not the definition.\nD — inability to understand the appeal is different from actively disliking.\n\nKelime: aversion — tiksinti, nefret, isteksizlik"}, {"k": "vocab", "p": "What the investors had initially characterized as a <u>benign</u> accounting irregularity turned out to be a more serious problem: the irregularity had masked a systematic overstatement of revenue across four consecutive quarters.", "q": "As used in the text, \"benign\" most nearly means:", "o": ["A) isolated and unlikely to recur", "B) unintentional and therefore less serious", "C) not harmful; relatively minor", "D) already identified and corrected by the company"], "a": 2, "e": "C is correct. Called benign = considered harmless or minor; it turned out to be something worse. \"Benign\" = gentle; not harmful.\n\nA — isolated and unlikely to recur describes a different assessment.\nB — unintentional is a cause, not what benign means.\nD — already corrected is a different status.\n\nKelime: benign — zararsız, iyi huylu; nazik"}, {"k": "vocab", "p": "The <u>blatant</u> contradiction between the senator's public statements and her private communications left the editorial board with no choice but to publish the internal documents, despite objections from her office.", "q": "As used in the text, \"blatant\" most nearly means:", "o": ["A) legally actionable under campaign finance law", "B) done openly and unashamedly; obvious", "C) recently discovered rather than long-standing", "D) significant enough to affect the election outcome"], "a": 1, "e": "B is correct. The contradiction was open and undeniable = done openly, obviously. \"Blatant\" = done openly and unashamedly; conspicuously obvious.\n\nA — legally actionable describes a consequence, not the quality.\nC — recently discovered describes when it became known.\nD — affecting the election describes an outcome.\n\nKelime: blatant — bariz, apaçık, yüzsüz"}, {"k": "vocab", "p": "The memo was praised for its <u>brevity</u>: what had previously required a two-page analysis was compressed into three bullet points, each containing precisely the information that managers needed to make the decision.", "q": "As used in the text, \"brevity\" most nearly means:", "o": ["A) clarity and freedom from technical jargon", "B) conciseness; the quality of being brief", "C) precision in numerical and statistical reporting", "D) accessibility for readers without specialist training"], "a": 1, "e": "B is correct. Compressed into three bullet points what previously took two pages = the quality of being brief. \"Brevity\" = concise and exact use of words; briefness.\n\nA — clarity is related but separate from brevity.\nC — numerical precision is a specific kind of accuracy.\nD — accessibility to non-specialists is a different quality.\n\nKelime: brevity — kısalık, öz ifade"}, {"k": "vocab", "p": "The CEO's <u>candor</u> in the earnings call surprised analysts accustomed to hedged language: she named the specific divisions that had underperformed, identified the decisions that had contributed to the shortfall, and offered no self-serving rationalizations.", "q": "As used in the text, \"candor\" most nearly means:", "o": ["A) detailed knowledge of complex financial matters", "B) willingness to provide information on request", "C) the quality of being honest and straightforward", "D) an absence of conflict of interest"], "a": 2, "e": "C is correct. Named specific failures without rationalization = honest and straightforward. \"Candor\" = the quality of being open and honest.\n\nA — detailed knowledge is expertise, not candor.\nB — willingness to provide information on request describes responsiveness.\nD — absence of conflict of interest is an ethics standard.\n\nKelime: candor — açıksözlülük, dürüstlük, samimiyet"}, {"k": "vocab", "p": "Many readers found the novel's devastating final act unexpectedly <u>cathartic</u>: the accumulated weight of the narrative demanded exactly such an ending, and experiencing it brought a strange sense of resolution and relief.", "q": "As used in the text, \"cathartic\" most nearly means:", "o": ["A) emotionally overwhelming and difficult to process", "B) providing relief through the release of strong emotions", "C) thematically consistent with the book's central concerns", "D) likely to be divisive among readers with different expectations"], "a": 1, "e": "B is correct. Strange sense of resolution and relief after an emotionally heavy ending = release of strong emotions providing relief. \"Cathartic\" = providing psychological relief through the release of strong emotions.\n\nA — emotionally overwhelming without relief is different from cathartic.\nC — thematically consistent describes artistic coherence.\nD — likely to be divisive describes reception.\n\nKelime: cathartic — arındırıcı, duygusal boşalma sağlayan"}, {"k": "vocab", "p": "The ethics committee voted to <u>censure</u> the official for misusing public funds, stopping short of recommending removal but issuing a formal statement of disapproval that was entered permanently into the public record.", "q": "As used in the text, \"censure\" most nearly means:", "o": ["A) formally reprimand or express strong disapproval of", "B) remove from a position of public trust", "C) investigate through an independent inquiry", "D) acquit following a thorough review of the evidence"], "a": 0, "e": "A is correct. Stopping short of removal but issuing formal disapproval entered into the record = formally reprimanding. \"Censure\" = to express severe disapproval of, formally and publicly.\n\nB — remove from position is a more severe action that was explicitly not taken.\nC — investigate is what precedes censure.\nD — acquit is the opposite.\n\nKelime: censure — kınamak, eleştirmek, resmen suçlamak"}]}, {"n": 5, "topic": "Social & Political Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The city had struggled with <u>chronic</u> underfunding of its public transit system for nearly three decades, a period during which deferred maintenance had accumulated into a backlog estimated at four billion dollars.", "q": "As used in the text, \"chronic\" most nearly means:", "o": ["A) worsening due to deliberate neglect", "B) persisting for a long time; habitual", "C) recognized as a problem only in recent years", "D) affecting the system's operational capacity directly"], "a": 1, "e": "B is correct. Nearly three decades of underfunding = persisting for a long time. \"Chronic\" = persisting for a long time; constantly recurring.\n\nA — deliberate neglect implies intent; chronic describes duration.\nC — recognized only recently is the opposite.\nD — affecting operational capacity is a consequence.\n\nKelime: chronic — kronik, uzun süreli, süreğen"}, {"k": "vocab", "p": "Rather than confronting the regulation directly, the company found a legal way to <u>circumvent</u> it, restructuring its contracts so that the employees subject to the rule were reclassified as independent contractors.", "q": "As used in the text, \"circumvent\" most nearly means:", "o": ["A) repeal through legislative action", "B) comply with while minimizing operational impact", "C) find a way around; get around by avoiding", "D) challenge through formal administrative appeal"], "a": 2, "e": "C is correct. Found a legal way to avoid the regulation's effect by reclassifying workers = get around by avoiding. \"Circumvent\" = to find a way around an obstacle; to avoid by going around.\n\nA — repeal through legislation is a different action.\nB — comply while minimizing impact is the opposite of circumventing.\nD — formal administrative challenge is a different approach.\n\nKelime: circumvent — atlatmak, aşmak, çevresinden dolaşmak"}, {"k": "vocab", "p": "Investigators found evidence that employees had been <u>coerced</u> into signing the non-disclosure agreements, with supervisors threatening termination as a direct consequence of refusing to sign.", "q": "As used in the text, \"coerced\" most nearly means:", "o": ["A) persuaded through financial incentives", "B) legally required under employment law", "C) compelled through threats or force", "D) misled about the contents or implications"], "a": 2, "e": "C is correct. Threatening termination to compel signing = compelled through threats. \"Coerce\" = to persuade an unwilling person to do something through force or threats.\n\nA — financial incentives is persuasion, not coercion.\nB — legally required is compulsion by law, not by individual threatening.\nD — misled about contents describes a different kind of manipulation.\n\nKelime: coerce — zorlamak, baskı yaparak yaptırmak"}, {"k": "vocab", "p": "The team's third season was the most <u>cohesive</u> in the franchise's history: the players had internalized the system, communicated automatically on defense, and won twelve consecutive games without a single poor performance.", "q": "As used in the text, \"cohesive\" most nearly means:", "o": ["A) well-coached and disciplined in execution", "B) characterized by unity and internal consistency", "C) performing significantly above prior-season expectations", "D) supported by an experienced and stable roster"], "a": 1, "e": "B is correct. Internalized system, automatic communication, consistent winning = unity and internal consistency. \"Cohesive\" = forming a unified whole; sticking together.\n\nA — well-coached describes external guidance, not the team's internal unity.\nC — above prior-season expectations describes improvement, not cohesion.\nD — experienced and stable roster is a resource, not the quality of cohesion.\n\nKelime: cohesive — bütünlük taşıyan, tutarlı, bir arada tutan"}, {"k": "vocab", "p": "After months of public conflict, the company's new director attempted to <u>conciliate</u> the union by reinstating the disputed benefits, publicly acknowledging the workers' contributions, and meeting directly with shop stewards.", "q": "As used in the text, \"conciliate\" most nearly means:", "o": ["A) negotiate a legally binding agreement with", "B) gain goodwill of; appease or placate", "C) investigate the grievances of", "D) comply with the demands of following arbitration"], "a": 1, "e": "B is correct. Reinstating benefits, public acknowledgment, direct meetings = gaining goodwill, placating. \"Conciliate\" = to stop someone from being angry; to make peace with.\n\nA — legally binding negotiation is a more formal process.\nC — investigate grievances is a different step.\nD — comply following arbitration implies a formal ruling.\n\nKelime: conciliate — uzlaştırmak, barıştırmak, hoşnut etmek"}, {"k": "vocab", "p": "The school's refusal to take disciplinary action was widely interpreted as implicitly <u>condoning</u> the behavior — a perception that intensified after the principal publicly described the incident as a minor misunderstanding.", "q": "As used in the text, \"condoning\" most nearly means:", "o": ["A) providing factual context to explain", "B) accepting or allowing without protest or punishment", "C) downplaying the severity of", "D) shifting responsibility to other parties"], "a": 1, "e": "B is correct. No disciplinary action = accepting or allowing without protest. \"Condone\" = to accept and allow behavior that is considered morally wrong.\n\nA — providing context is different from condoning.\nC — downplaying severity is a consequence, not the definition.\nD — shifting responsibility is a different behavior.\n\nKelime: condone — görmezden gelmek, hoş görmek, affetmek"}, {"k": "vocab", "p": "The instructions for filing the tax rebate were so <u>convoluted</u> that the government's own telephone helpline had no clear answer to callers' questions and eventually directed most inquiries to an external consulting firm.", "q": "As used in the text, \"convoluted\" most nearly means:", "o": ["A) excessively lengthy due to unnecessary repetition", "B) highly complicated; intricately tangled", "C) difficult to find using standard search methods", "D) requiring specialist knowledge to complete accurately"], "a": 1, "e": "B is correct. So complicated that the government helpline had no answers = highly complicated, intricately tangled. \"Convoluted\" = extremely complex; intricately involved.\n\nA — excessively lengthy due to repetition is verbose, not necessarily convoluted.\nC — difficult to find is a different issue.\nD — requiring specialist knowledge describes a skill requirement.\n\nKelime: convoluted — karmaşık, dolambaçlı, girift"}, {"k": "vocab", "p": "The journalist arrived at the interview with <u>copious</u> notes — three notebooks filled with transcribed sources, cross-referenced with printed excerpts and hand-drawn timelines — suggesting months of preparatory research.", "q": "As used in the text, \"copious\" most nearly means:", "o": ["A) organized into a clear system of reference", "B) obtained through legitimate and verifiable means", "C) abundant in quantity; extensive", "D) supplemented by electronic records"], "a": 2, "e": "C is correct. Three notebooks, transcribed sources, cross-references, timelines = abundant in quantity. \"Copious\" = abundant in supply or quantity.\n\nA — organized systematically describes structure, not quantity.\nB — legitimately obtained describes provenance.\nD — supplemented by electronic records is a detail about format.\n\nKelime: copious — bol, çok, geniş kapsamlı"}, {"k": "vocab", "p": "Three independent witnesses came forward to <u>corroborate</u> the survivor's account, providing details consistent with her description of events that had not been publicly disclosed before their interviews.", "q": "As used in the text, \"corroborate\" most nearly means:", "o": ["A) challenge the accuracy of", "B) help establish as officially valid", "C) confirm or give support to", "D) amplify by adding additional detail"], "a": 2, "e": "C is correct. Consistent unpublished details = supporting and confirming the account. \"Corroborate\" = to confirm or give support to a statement or theory.\n\nA — challenge accuracy is the opposite.\nB — establish as officially valid is more formal than corroborate.\nD — amplify by adding detail is different from confirming.\n\nKelime: corroborate — doğrulamak, desteklemek, güçlendirmek"}, {"k": "vocab", "p": "The scam succeeded because it targeted <u>credulous</u> investors who did not question the implausibly high returns being promised, signing documents without independent legal or financial advice.", "q": "As used in the text, \"credulous\" most nearly means:", "o": ["A) financially inexperienced and poorly advised", "B) too willing to believe; easily deceived", "C) motivated primarily by greed", "D) aware of the risks but willing to accept them"], "a": 1, "e": "B is correct. Not questioning implausible returns, signing without advice = too willing to believe. \"Credulous\" = having or showing too great a readiness to believe things.\n\nA — inexperienced describes background, not disposition.\nC — motivated by greed is a different driver.\nD — aware of risks but accepting them describes a different attitude.\n\nKelime: credulous — safdil, çabuk inanan, saf"}, {"k": "vocab", "p": "The manager's <u>cursory</u> review of the report missed three factual errors that a more careful reading would have caught, and the errors were only discovered when the document was distributed to the full board.", "q": "As used in the text, \"cursory\" most nearly means:", "o": ["A) completed under significant time pressure", "B) hasty and therefore not thorough", "C) focused on summary rather than detail", "D) conducted by an unqualified reviewer"], "a": 1, "e": "B is correct. Missed errors that careful reading would have caught = hasty, not thorough. \"Cursory\" = hasty and therefore not thorough or detailed.\n\nA — time pressure is a cause, not the definition.\nC — focused on summary is a choice; cursory implies the thoroughness is lacking.\nD — unqualified reviewer is a different issue.\n\nKelime: cursory — yüzeysel, acele, gelişigüzel"}, {"k": "vocab", "p": "The prolonged illness had <u>debilitated</u> the economist to the point where she could no longer attend conferences, maintain her research schedule, or complete the drafts she had been working on before her diagnosis.", "q": "As used in the text, \"debilitated\" most nearly means:", "o": ["A) isolated from professional networks", "B) forced to reconsider research priorities", "C) weakened to the point of being unable to function normally", "D) distracted by the demands of medical treatment"], "a": 2, "e": "C is correct. Could no longer attend conferences, maintain schedule, or complete drafts = weakened to the point of not functioning normally. \"Debilitate\" = to make someone very weak and infirm.\n\nA — isolated from networks is a consequence, not the definition.\nB — reconsidering priorities is a choice response.\nD — distracted by treatment is a different effect.\n\nKelime: debilitate — zayıflatmak, güçten düşürmek"}, {"k": "vocab", "p": "The opposition party moved quickly to <u>denounce</u> the legislation, calling it an attack on civil liberties, demanding its immediate repeal, and encouraging civil society organizations to join a coordinated campaign of resistance.", "q": "As used in the text, \"denounce\" most nearly means:", "o": ["A) investigate through an independent commission", "B) propose amendments to address identified weaknesses", "C) publicly declare to be wrong or evil", "D) refer to constitutional review by the judiciary"], "a": 2, "e": "C is correct. Calling it an attack on civil liberties and demanding repeal = publicly declaring it wrong. \"Denounce\" = to publicly declare to be wrong or evil.\n\nA — investigate through commission is a different process.\nB — propose amendments is a constructive response.\nD — refer to constitutional review is a legal process.\n\nKelime: denounce — kınamak, ihbar etmek; açıkça suçlamak"}, {"k": "vocab", "p": "Three consecutive droughts had severely <u>depleted</u> the region's groundwater reserves, and hydrologists warned that at current rates of extraction, the aquifer could reach critically low levels within a decade.", "q": "As used in the text, \"depleted\" most nearly means:", "o": ["A) contaminated through agricultural runoff", "B) reduced significantly through use", "C) reduced in replenishment rate", "D) inaccessible due to deepening water tables"], "a": 1, "e": "B is correct. Three droughts severely reducing reserves = reduced significantly through use. \"Deplete\" = to use up the supply of.\n\nA — contamination is a different kind of damage.\nC — reduced replenishment rate is a cause, not the effect of depletion.\nD — inaccessible is a different kind of problem.\n\nKelime: deplete — tüketmek, azaltmak, bitirmek"}, {"k": "vocab", "p": "The veteran diplomat made no effort to conceal her <u>disdain</u> for the proposal, describing it in the meeting as naive, politically tone-deaf, and likely to produce the opposite of its stated objectives.", "q": "As used in the text, \"disdain\" most nearly means:", "o": ["A) a carefully reasoned professional objection", "B) the feeling that something is unworthy; contempt", "C) an ideological disagreement rooted in different values", "D) a strategic concern about practical implementation"], "a": 1, "e": "B is correct. Naive, tone-deaf, likely to backfire = she considers it unworthy, feels contempt for it. \"Disdain\" = the feeling that someone or something is unworthy of consideration.\n\nA — carefully reasoned objection is analytical; disdain is emotional contempt.\nC — ideological disagreement rooted in values is a principled stance.\nD — strategic concern about implementation is practical, not contemptuous.\n\nKelime: disdain — hor görmek, küçümsemek, tepeden bakmak"}, {"k": "vocab", "p": "Two members of the panel chose to <u>dissent</u> from the majority report, submitting a twelve-page alternative analysis that reached different conclusions on four of the report's ten recommendations.", "q": "As used in the text, \"dissent\" most nearly means:", "o": ["A) abstain from voting on a contested question", "B) hold or express opinions contrary to those of the majority", "C) supplement the majority's findings with additional data", "D) demand a second round of deliberation before finalization"], "a": 1, "e": "B is correct. Submitting an alternative analysis reaching different conclusions = expressing opinions contrary to the majority. \"Dissent\" = to hold or express opinions that are at variance with an official view.\n\nA — abstain means not participating; dissent means actively expressing disagreement.\nC — supplement with data is adding to, not disagreeing with.\nD — demand additional deliberation is a procedural request.\n\nKelime: dissent — karşı çıkmak, ayrı düşmek; muhalefet"}, {"k": "vocab", "p": "The professor was known for being <u>dogmatic</u> in her assessment of methodological choices: she dismissed approaches that deviated from her preferred framework without engaging with the evidence that supported them.", "q": "As used in the text, \"dogmatic\" most nearly means:", "o": ["A) inclined to impose one's views on others", "B) excessively attached to fixed beliefs; unwilling to consider alternatives", "C) knowledgeable but resistant to new research", "D) evaluating students harshly relative to professional standards"], "a": 1, "e": "B is correct. Dismissed alternatives without engaging with evidence = excessively attached to fixed beliefs. \"Dogmatic\" = inclined to lay down principles as incontrovertibly true.\n\nA — imposing on others describes behavior toward others; dogmatic can be a private stance.\nC — resistant to new research is related but dogmatic implies rejection regardless of evidence.\nD — harsh evaluation is a behavioral quality, not dogmatism.\n\nKelime: dogmatic — dogmatik, katı, tartışmaya kapalı"}, {"k": "vocab", "p": "The negotiator's <u>duplicitous</u> conduct was eventually exposed: he had been simultaneously offering different terms to both parties, leading each side to believe it had secured concessions the other side had not received.", "q": "As used in the text, \"duplicitous\" most nearly means:", "o": ["A) deceitful; behaving in a way that shows two contradictory sides", "B) unauthorized; acting beyond the scope of official responsibility", "C) negligent; failing to disclose relevant information", "D) self-interested; prioritizing personal gain over the agreement"], "a": 0, "e": "A is correct. Offering different terms to both parties simultaneously = behaving deceptively with two contradictory faces. \"Duplicitous\" = deceitful; showing two contradictory sides.\n\nB — unauthorized is a different violation.\nC — negligent failure to disclose is carelessness, not calculated deception.\nD — self-interested prioritization is a motivation, not the same as duplicity.\n\nKelime: duplicitous — iki yüzlü, sahte, samimiyetsiz"}, {"k": "vocab", "p": "The inventor was considered <u>eccentric</u> even by the standards of his unconventional field: he worked only between midnight and dawn, refused to use printed paper, and communicated with his team exclusively through handwritten notes delivered by courier.", "q": "As used in the text, \"eccentric\" most nearly means:", "o": ["A) highly creative but organizationally chaotic", "B) unconventional in behavior or thought; odd", "C) deliberately cultivating a distinctive public image", "D) operating outside the mainstream of the professional field"], "a": 1, "e": "B is correct. Working midnight to dawn, refusing paper, courier notes = unconventional in behavior. \"Eccentric\" = unconventional and slightly strange; not following convention.\n\nA — creatively chaotic is a different combination of qualities.\nC — deliberately cultivating an image implies performance; eccentric behavior is genuine.\nD — operating outside the professional mainstream is different from personal behavioral eccentricity.\n\nKelime: eccentric — alışılmışın dışında, tuhaf, ilginç"}, {"k": "vocab", "p": "The precise mechanism by which the drug prevented the cell mutation continued to <u>elude</u> researchers for three years, even as the clinical trials demonstrated its effectiveness in practice.", "q": "As used in the text, \"elude\" most nearly means:", "o": ["A) be disputed by competing research teams", "B) escape the understanding of; remain unclear to", "C) require additional funding to investigate adequately", "D) appear in preliminary data but not replicate in later studies"], "a": 1, "e": "B is correct. They couldn't understand the mechanism even as the drug worked = escaped their understanding. \"Elude\" = to evade or escape from.\n\nA — disputed by competitors is a different situation.\nC — require additional funding is a resource issue.\nD — appear in preliminary data but not replicate is a different problem.\n\nKelime: elude — kaçmak, atlatmak, akılda tutulamamak"}, {"k": "vocab", "p": "The symposium brought together some of the most <u>eminent</u> scholars in the field, including three Nobel laureates, two former heads of state, and the scientist whose foundational paper had defined the discipline thirty years earlier.", "q": "As used in the text, \"eminent\" most nearly means:", "o": ["A) recently recognized for a significant contribution", "B) widely regarded as outstanding in a field; distinguished", "C) experienced across a wide range of relevant topics", "D) controversial in their public positions on key questions"], "a": 1, "e": "B is correct. Nobel laureates, former heads of state, foundational scholar = widely regarded as outstanding. \"Eminent\" = famous and respected within a particular sphere.\n\nA — recently recognized implies new prominence; eminent implies established distinction.\nC — experienced across a wide range describes breadth, not distinction.\nD — controversial implies disagreement about their positions.\n\nKelime: eminent — seçkin, önde gelen, çok tanınmış"}, {"k": "vocab", "p": "The philosopher argued that aesthetic judgments, while appearing subjective, could be informed by <u>empirical</u> findings about which structural features of works reliably produce pleasurable responses across diverse audiences.", "q": "As used in the text, \"empirical\" most nearly means:", "o": ["A) based on what is widely agreed upon", "B) derived from systematic observation and experiment", "C) supported by established theoretical frameworks", "D) adjusted to account for cultural differences"], "a": 1, "e": "B is correct. Findings about structural features that produce measurable responses = based on observation and experiment. \"Empirical\" = based on observation or experience rather than theory alone.\n\nA — widely agreed upon describes consensus, not empiricism.\nC — established theoretical frameworks is the opposite of empirical grounding.\nD — adjusted for culture describes a methodological consideration.\n\nKelime: empirical — deneysel, gözleme dayalı, ampirik"}, {"k": "vocab", "p": "Corruption of this type was not unique to this administration — it was <u>endemic</u> to the regional procurement system, having persisted through five successive governments and survived several well-publicized reform efforts.", "q": "As used in the text, \"endemic\" most nearly means:", "o": ["A) tolerated despite being widely recognized", "B) regularly occurring in a particular area or system", "C) gradually worsening despite intervention", "D) impossible to address without external assistance"], "a": 1, "e": "B is correct. Persisted through five governments, survived reform efforts = regularly occurring in this particular system. \"Endemic\" = regularly found among particular people or in a certain area; ingrained.\n\nA — tolerated describes a social response, not the nature of the problem.\nC — gradually worsening implies a trend; endemic implies persistence.\nD — impossible without external help is a different assessment.\n\nKelime: endemic — bir bölgeye özgü; kronik hale gelmiş"}, {"k": "vocab", "p": "The composer left almost no personal correspondence, giving interviews only twice in thirty years, and released albums with no liner notes — an <u>enigmatic</u> figure whose biography remains largely a matter of speculation.", "q": "As used in the text, \"enigmatic\" most nearly means:", "o": ["A) reluctant to accept commercial success or recognition", "B) mysterious; difficult to understand or interpret", "C) influential only after death and posthumous recognition", "D) unconventional in creative process but not in public presence"], "a": 1, "e": "B is correct. No correspondence, two interviews, no liner notes, biography speculative = mysterious, difficult to understand. \"Enigmatic\" = difficult to interpret or understand; mysterious.\n\nA — reluctant to accept success is a specific attitude, not the quality of being enigmatic.\nC — influential only posthumously is a different circumstance.\nD — unconventional in process but not presence is a different distinction.\n\nKelime: enigmatic — gizemli, anlaşılması güç, esrarengiz"}, {"k": "vocab", "p": "The artist deliberately chose materials that would deteriorate over time, treating the <u>ephemeral</u> nature of the work not as a limitation but as a statement about impermanence and the futility of preservation.", "q": "As used in the text, \"ephemeral\" most nearly means:", "o": ["A) visually striking but difficult to reproduce", "B) lasting only for a short time; transitory", "C) intellectually inaccessible without context", "D) dependent on specific environmental conditions"], "a": 1, "e": "B is correct. Materials that deteriorate = lasting only briefly. \"Ephemeral\" = lasting for only a very short time.\n\nA — visually striking is appearance quality.\nC — intellectually inaccessible describes comprehension difficulty.\nD — dependent on conditions describes fragility, not brevity.\n\nKelime: ephemeral — geçici, kısa ömürlü, anlık"}]}, {"n": 6, "topic": "Philosophical & Analytical Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The minister's response was conspicuously <u>equivocal</u>, using phrases like 'in certain contexts' and 'depending on the evidence' in ways that allowed for mutually contradictory interpretations.", "q": "As used in the text, \"equivocal\" most nearly means:", "o": ["A) technically accurate but deliberately simplified", "B) open to more than one interpretation; ambiguous", "C) evasive due to an obvious conflict of interest", "D) carefully worded to preserve legal protection"], "a": 1, "e": "B is correct. Phrases allowing contradictory interpretations = open to more than one meaning. \"Equivocal\" = having more than one possible meaning; ambiguous.\n\nA — simplified is not ambiguity.\nC — conflict of interest is a motivation.\nD — legal protection is a purpose, not the quality.\n\nKelime: equivocal — belirsiz, iki anlamlı, kaçamaklı"}, {"k": "vocab", "p": "The professor's seminar was <u>esoteric</u> even by her department's standards: it required fluency in three languages, familiarity with three subfields, and access to an unpublished archive restricted to credentialed researchers.", "q": "As used in the text, \"esoteric\" most nearly means:", "o": ["A) intended only for a small circle with specialized knowledge", "B) poorly communicated to a broader audience", "C) recently developed and not yet widely understood", "D) cross-disciplinary in a way that defied categorization"], "a": 0, "e": "A is correct. Requires languages, subfields, restricted archives = accessible only to a small specialized circle. \"Esoteric\" = intended for or understood by only a small group with specialized knowledge.\n\nB — poorly communicated implies a communication failure.\nC — recently developed is a different reason for limited access.\nD — cross-disciplinary describes structure, not accessibility.\n\nKelime: esoteric — anlaşılması güç, az kişiye hitap eden"}, {"k": "vocab", "p": "The judge praised the defendant's <u>exemplary</u> conduct during the trial — cooperative, truthful, and willing to provide documents not legally required but helpful to the court.", "q": "As used in the text, \"exemplary\" most nearly means:", "o": ["A) legally compliant in all its particulars", "B) representing the best possible outcome", "C) serving as a model worthy of imitation", "D) surprising given prior behavior in similar situations"], "a": 2, "e": "C is correct. Cooperative, truthful, voluntarily helpful = serving as a model worth imitating. \"Exemplary\" = serving as a desirable model.\n\nA — legally compliant describes minimum compliance.\nB — best possible outcome describes a result.\nD — surprising given prior behavior is a contextual observation.\n\nKelime: exemplary — örnek niteliğinde, takdire değer"}, {"k": "vocab", "p": "The commission's review was <u>exhaustive</u>: it examined every contract signed over seven years, interviewed ninety-four individuals, and produced a final report of nearly a thousand pages before reaching its conclusions.", "q": "As used in the text, \"exhaustive\" most nearly means:", "o": ["A) time-consuming due to bureaucratic obstacles", "B) extremely thorough; covering all possibilities", "C) conducted by experts with no stake in the outcome", "D) wider in scope than the original mandate required"], "a": 1, "e": "B is correct. Every contract, ninety-four individuals, thousand-page report = extremely thorough. \"Exhaustive\" = very comprehensive; covering all elements.\n\nA — bureaucratic obstacles is a cause.\nC — impartial experts describes process integrity.\nD — wider than mandate is a scope observation.\n\nKelime: exhaustive — kapsamlı, eksiksiz, her şeyi kapsayan"}, {"k": "vocab", "p": "The legal fees were so <u>exorbitant</u> that the nonprofit's board voted to settle the case rather than continue, even though their lawyer believed they had a strong chance of winning at trial.", "q": "As used in the text, \"exorbitant\" most nearly means:", "o": ["A) disproportionate to the complexity of the case", "B) difficult to justify to the organization's donors", "C) unreasonably high; greatly exceeding what is appropriate", "D) covered only partially by the organization's insurance"], "a": 2, "e": "C is correct. Settled to avoid costs = unreasonably excessive. \"Exorbitant\" = unreasonably high in price.\n\nA — disproportionate to complexity is a specific assessment.\nB — difficult to justify to donors is a reporting problem.\nD — insurance coverage is a financial detail.\n\nKelime: exorbitant — aşırı, fahiş, makul olanı çok aşan"}, {"k": "vocab", "p": "The committee's decision to delay the vote was politically <u>expedient</u> rather than principled: it allowed each member to gauge public reaction before committing to a position that might prove unpopular.", "q": "As used in the text, \"expedient\" most nearly means:", "o": ["A) legally required under parliamentary procedure", "B) convenient and practical, often for self-interested reasons", "C) widely seen as the most sensible option", "D) postponed in deference to a more senior authority"], "a": 1, "e": "B is correct. Gauge public reaction before committing = convenient, self-interested practicality. \"Expedient\" = convenient and practical, often at the expense of principle.\n\nA — legally required is a different basis.\nC — widely seen as sensible is a consensus view.\nD — deferred to senior authority is a procedural step.\n\nKelime: expedient — pratik, elverişli; çıkara dayalı"}, {"k": "vocab", "p": "The contract contained an <u>explicit</u> clause forbidding the use of any proprietary data for competitive purposes, meaning the company had no legal grounds to argue ambiguity when the dispute arose.", "q": "As used in the text, \"explicit\" most nearly means:", "o": ["A) supported by legal precedent from prior cases", "B) recently added to standard contract language", "C) stated clearly and in detail; leaving no room for ambiguity", "D) agreed upon by both parties prior to signing"], "a": 2, "e": "C is correct. Could not argue ambiguity = stated clearly, no room for interpretation. \"Explicit\" = stated clearly and in detail.\n\nA — legal precedent is a different basis.\nB — recently added is a historical detail.\nD — agreed upon is a general contract condition.\n\nKelime: explicit — açık, net, kesin olarak ifade edilmiş"}, {"k": "vocab", "p": "The campaign poster was dominated by testimonials that <u>extolled</u> the candidate's record on public safety, featuring quotes from police commissioners, prosecutors, and community organizers across three counties.", "q": "As used in the text, \"extolled\" most nearly means:", "o": ["A) documented objectively with supporting evidence", "B) praised enthusiastically", "C) contrasted favorably against competing candidates", "D) verified through independent fact-checking"], "a": 1, "e": "B is correct. Testimonials on a campaign poster = enthusiastic praise. \"Extol\" = to praise enthusiastically.\n\nA — objectively documented implies neutral reporting.\nC — contrasted favorably describes comparison, not pure praise.\nD — fact-checking describes verification.\n\nKelime: extol — övmek, yüceltmek, göklere çıkarmak"}, {"k": "vocab", "p": "The senator's <u>facetious</u> remark about the legislation being written for extraterrestrials drew laughter from the gallery but frustrated colleagues who felt the debate warranted more substantive engagement.", "q": "As used in the text, \"facetious\" most nearly means:", "o": ["A) inappropriately dismissive of a serious issue", "B) treating serious issues with deliberately inappropriate humor", "C) uncharacteristically informal for a formal setting", "D) designed to appeal to the gallery rather than persuade colleagues"], "a": 1, "e": "B is correct. Made a joke about serious legislation = treating a serious issue with inappropriate humor. \"Facetious\" = treating serious issues with deliberately inappropriate humor.\n\nA — dismissive is close but facetious specifies humor as the vehicle.\nC — uncharacteristically informal describes a change in register.\nD — audience targeting describes purpose, not the quality.\n\nKelime: facetious — şakacı, ciddiye alınmayacak, hafife alan"}, {"k": "vocab", "p": "Even the most experienced auditors are <u>fallible</u>, which is why the firm requires two independent reviewers to verify any finding before it is included in the final report.", "q": "As used in the text, \"fallible\" most nearly means:", "o": ["A) biased due to familiarity with the subject", "B) capable of making errors; not infallible", "C) limited in their access to relevant information", "D) slower than automated tools at identifying discrepancies"], "a": 1, "e": "B is correct. Even experienced auditors make errors — hence the two-reviewer requirement = capable of making mistakes. \"Fallible\" = capable of making mistakes.\n\nA — biased due to familiarity is a specific kind of error.\nC — limited access describes an information problem.\nD — slower than automated tools describes a speed comparison.\n\nKelime: fallible — yanılabilir, hatalı olabilecek"}, {"k": "vocab", "p": "The chef was <u>fastidious</u> about sourcing: she visited suppliers personally, tasted samples before committing to orders, and dropped any producer whose quality she found inconsistent across two consecutive seasons.", "q": "As used in the text, \"fastidious\" most nearly means:", "o": ["A) unusually knowledgeable about agricultural production methods", "B) very attentive to accuracy and detail; hard to please", "C) committed to supporting local and sustainable producers", "D) protective of relationships built over many years"], "a": 1, "e": "B is correct. Personal visits, taste tests, dropping inconsistent suppliers = very attentive to quality, hard to please. \"Fastidious\" = very attentive to accuracy and detail.\n\nA — knowledge of production is a separate quality.\nC — commitment to local producers is a values issue.\nD — protective of relationships is a loyalty quality.\n\nKelime: fastidious — titiz, özenli, seçici"}, {"k": "vocab", "p": "The coach's <u>fervent</u> belief in the team's potential was communicated in every speech she gave and every drill she ran — an intensity that the players found either energizing or exhausting depending on the moment.", "q": "As used in the text, \"fervent\" most nearly means:", "o": ["A) technically informed and methodologically precise", "B) outwardly expressed rather than privately held", "C) having or showing passionate intensity of feeling", "D) consistent with motivational research on team performance"], "a": 2, "e": "C is correct. Belief communicated in every speech and drill with intensity = passionate intensity of feeling. \"Fervent\" = having or showing great warmth and intensity.\n\nA — technically informed is a different quality.\nB — outwardly expressed describes expression, not the feeling.\nD — consistent with research describes an external standard.\n\nKelime: fervent — ateşli, coşkulu, tutkulu"}, {"k": "vocab", "p": "The fashion industry is notoriously <u>fickle</u>: what is considered essential this season may be dismissed as dated within eighteen months, requiring designers to anticipate trends years before they materialize.", "q": "As used in the text, \"fickle\" most nearly means:", "o": ["A) influenced by external cultural and social forces", "B) changing frequently and unexpectedly; capricious", "C) highly competitive due to low barriers to entry", "D) driven by commercial rather than aesthetic considerations"], "a": 1, "e": "B is correct. Essential now, dated in eighteen months = changing frequently, capricious. \"Fickle\" = changing frequently; not reliable.\n\nA — influenced by external forces is a cause.\nC — competitive due to low barriers is an economic characteristic.\nD — commercial over aesthetic is a motivational description.\n\nKelime: fickle — dönek, kararsız, tutarsız"}, {"k": "vocab", "p": "The referee's decision was widely condemned as a <u>flagrant</u> misapplication of the rule, clearly contradicting the regulation's plain language and appearing to benefit the home team in a way that drew immediate protests.", "q": "As used in the text, \"flagrant\" most nearly means:", "o": ["A) legally actionable under governing regulations", "B) clearly contrary to the official rules of the game", "C) conspicuously and obviously wrong; shockingly so", "D) motivated by commercial pressures from the league"], "a": 2, "e": "C is correct. Widely condemned, plain-language contradiction, immediate protests = conspicuously and obviously wrong. \"Flagrant\" = conspicuously offensive; brazenly obvious.\n\nA — legally actionable is a consequence.\nB — clearly contrary to rules is the specific mistake, not the quality of flagrancy.\nD — commercial motivations speculates about purpose.\n\nKelime: flagrant — açık, bariz, yüzsüz (olumsuz bağlamda)"}, {"k": "vocab", "p": "The company released a preemptive statement designed to <u>forestall</u> negative coverage, hoping to set the narrative before journalists had time to analyze the documents once they became public.", "q": "As used in the text, \"forestall\" most nearly means:", "o": ["A) predict with a high degree of accuracy", "B) prevent or obstruct by taking advance action", "C) minimize impact through strategic communication", "D) delay by withholding relevant information"], "a": 1, "e": "B is correct. Preemptive statement to prevent coverage before it happened = taking advance action to obstruct. \"Forestall\" = to prevent something by taking action first.\n\nA — predict accurately is a different function.\nC — minimize impact through communication describes reputation management.\nD — delay by withholding is a different tactic.\n\nKelime: forestall — önceden önlemek, önüne geçmek"}, {"k": "vocab", "p": "The legal team they faced was <u>formidable</u>: the lead attorney had won four consecutive Supreme Court cases, the firm had forty specialized litigators, and their research department had produced the precedent-setting brief.", "q": "As used in the text, \"formidable\" most nearly means:", "o": ["A) experienced in cases with high reputational stakes", "B) well-compensated relative to the complexity of the work", "C) inspiring awe or dread due to impressive scale", "D) recognized as the leading authority in the relevant area"], "a": 2, "e": "C is correct. Four Supreme Court wins, forty litigators, precedent-setting brief = impressively powerful, inspiring awe. \"Formidable\" = inspiring respect or dread through impressive power.\n\nA — experienced in high-stakes cases describes background.\nB — well-compensated is a financial detail.\nD — recognized as leading authority describes reputation.\n\nKelime: formidable — ürkütücü, zorlu, etkileyici"}, {"k": "vocab", "p": "The redesign addressed not just the interface but a <u>fundamental</u> problem in the application's architecture: the way data moved between modules had made every update slower, regardless of how optimized the code was.", "q": "As used in the text, \"fundamental\" most nearly means:", "o": ["A) long-recognized but previously considered unsolvable", "B) forming a necessary base or core; essential", "C) identified only after extensive user testing", "D) affecting only certain types of users or use cases"], "a": 1, "e": "B is correct. A problem in the architecture = a problem at the core level. \"Fundamental\" = forming a necessary base or core; essential.\n\nA — long-recognized but unsolvable describes history.\nC — identified only after testing describes discovery.\nD — affecting only certain users describes scope.\n\nKelime: fundamental — temel, esas, köklü"}, {"k": "vocab", "p": "The documentary <u>garnered</u> significant attention at film festivals before its commercial release, winning three awards and generating a wave of critical commentary that broadened its audience considerably.", "q": "As used in the text, \"garnered\" most nearly means:", "o": ["A) produced as a result of long collaborative effort", "B) attracted or gathered; obtained", "C) exceeded expectations set by prior work", "D) maintained consistently across different contexts"], "a": 1, "e": "B is correct. Winning awards and generating commentary = attracted, gathered, obtained. \"Garner\" = to gather or collect; to obtain.\n\nA — collaborative effort describes a production method.\nC — exceeded expectations describes reception quality.\nD — maintained consistently describes persistence.\n\nKelime: garner — toplamak, edinmek, kazanmak"}, {"k": "vocab", "p": "The annual report contained a <u>glaring</u> omission: it mentioned the legal dispute in a footnote but said nothing about the sixty-million-dollar contingent liability that the dispute represented.", "q": "As used in the text, \"glaring\" most nearly means:", "o": ["A) legally significant in its potential consequences", "B) impossible to explain without bad faith", "C) highly conspicuous and obvious, especially when problematic", "D) apparent only to those with specialist financial knowledge"], "a": 2, "e": "C is correct. Should have been prominent but was hidden in a footnote = conspicuous omission, obviously problematic. \"Glaring\" = highly conspicuous; obvious.\n\nA — legally significant describes consequences.\nB — impossible without bad faith implies intent.\nD — apparent only to specialists is the opposite of glaring.\n\nKelime: glaring — göze batan, bariz, açık"}, {"k": "vocab", "p": "The heiress's <u>haughty</u> response to the journalist's question — she paused, looked at the ceiling, and said 'I really do not see why that would be relevant' — was widely circulated as an example of entitled behavior.", "q": "As used in the text, \"haughty\" most nearly means:", "o": ["A) excessively rehearsed and performatively confident", "B) arrogantly superior; showing disdain for others", "C) deliberately provocative in a public setting", "D) characteristic of someone unaccustomed to critical questioning"], "a": 1, "e": "B is correct. Pause, ceiling look, dismissive statement = arrogantly superior, disdainful. \"Haughty\" = arrogantly superior; disdainfully proud.\n\nA — rehearsed confidence describes a performance quality.\nC — deliberately provocative implies intent to upset.\nD — unaccustomed to questioning describes a situational explanation.\n\nKelime: haughty — kibirli, küstah, kendini beğenmiş"}, {"k": "vocab", "p": "The currency's dominance was not simply a function of the issuing country's economic size — it reflected a broader <u>hegemony</u> that included military power, diplomatic leverage, and the control of key global institutions.", "q": "As used in the text, \"hegemony\" most nearly means:", "o": ["A) dominance or leadership, especially over other countries", "B) formal treaties establishing economic and military alliances", "C) the comparative advantage a country has in certain industries", "D) the ability to maintain internal stability"], "a": 0, "e": "A is correct. Military power, diplomatic leverage, control of institutions = dominance over other countries. \"Hegemony\" = leadership or dominance, especially of one country over others.\n\nB — formal treaties describe diplomatic instruments.\nC — comparative advantage is an economic concept.\nD — maintaining internal stability is different from external hegemony.\n\nKelime: hegemony — hegemonya, üstünlük, hâkimiyet"}, {"k": "vocab", "p": "Persistent technical failures continued to <u>hinder</u> the team's progress, forcing engineers to repeat steps they had already completed and pushing the projected launch date back by several weeks.", "q": "As used in the text, \"hinder\" most nearly means:", "o": ["A) prevent entirely from completion", "B) delay or obstruct the progress of", "C) require the involvement of additional personnel", "D) draw external scrutiny to an otherwise private process"], "a": 1, "e": "B is correct. Repeating steps, launch pushed back = delaying, obstructing progress. \"Hinder\" = to make it difficult for someone; to delay.\n\nA — prevent entirely is too strong; hinder implies delay, not total prevention.\nC — require additional personnel is a consequence.\nD — draw external scrutiny is a different effect.\n\nKelime: hinder — engellemek, zorlaştırmak, geciktirmek"}, {"k": "vocab", "p": "The new documentary does not attempt to resolve the longstanding controversy about the composer's final years but does <u>illuminate</u> the economic pressures that shaped her choices during that period.", "q": "As used in the text, \"illuminate\" most nearly means:", "o": ["A) confirm the most widely accepted version of events", "B) reconstruct through physical evidence alone", "C) make clearer by providing detail or explanation", "D) reduce to its most essential elements"], "a": 2, "e": "C is correct. Provides new understanding of economic pressures = makes clearer through detail and explanation. \"Illuminate\" = to help clarify or explain; to shed light on.\n\nA — confirm the accepted version is different; illuminate can offer new information.\nB — reconstruct through physical evidence is a specific method.\nD — reduce to essentials is simplification, not illumination.\n\nKelime: illuminate — aydınlatmak, açıklamak, anlaşılır kılmak"}, {"k": "vocab", "p": "With the storm less than six hours from landfall and wind speeds still accelerating, evacuation was no longer optional — the danger was <u>imminent</u> and the time for voluntary action had effectively passed.", "q": "As used in the text, \"imminent\" most nearly means:", "o": ["A) unavoidable regardless of precautions taken", "B) predictable based on historical weather patterns", "C) about to happen very soon", "D) severe enough to require government intervention"], "a": 2, "e": "C is correct. Less than six hours from landfall = about to happen very soon. \"Imminent\" = about to happen; impending.\n\nA — unavoidable regardless of precautions is fatalism.\nB — predictable based on patterns describes forecasting.\nD — severe enough for government intervention is a different threshold.\n\nKelime: imminent — yakın, çok yakında olacak"}, {"k": "vocab", "p": "Outdated permitting requirements were found to <u>impede</u> the construction of new housing, adding between six and eighteen months to project timelines and significantly increasing development costs.", "q": "As used in the text, \"impede\" most nearly means:", "o": ["A) create financial barriers for small developers", "B) delay or obstruct the progress of", "C) prevent small-scale projects while permitting larger ones", "D) subject projects to additional requirements not applied elsewhere"], "a": 1, "e": "B is correct. Adding six to eighteen months = delaying, obstructing. \"Impede\" = to slow or obstruct progress.\n\nA — financial barriers are a consequence.\nC — selective application describes unequal enforcement.\nD — additional requirements describes the mechanism.\n\nKelime: impede — engellemek, zorlaştırmak, geciktirmek"}]}, {"n": 7, "topic": "Argumentation & Logic Vocabulary", "diff": "Words in Context", "qs": [{"k": "vocab", "p": "The arbitration panel was selected to ensure an <u>impartial</u> judgment: each member was required to have no prior professional or financial relationship with either of the disputing companies.", "q": "As used in the text, \"impartial\" most nearly means:", "o": ["A) legally authorized to make a binding decision", "B) treating all parties equally; not biased", "C) experienced in resolving disputes in this sector", "D) acceptable to both parties before proceedings begin"], "a": 1, "e": "B is correct. No prior relationships with either party = not biased toward either. \"Impartial\" = treating all parties equally and fairly.\n\nA — legally authorized describes formal authority.\nC — experienced in the sector describes expertise.\nD — acceptable to both is a consent condition.\n\nKelime: impartial — tarafsız, yansız, önyargısız"}, {"k": "vocab", "p": "The memo's tone carried an <u>implicit</u> warning that the department head did not want to articulate directly: if the targets were not met in the next quarter, personnel changes would follow.", "q": "As used in the text, \"implicit\" most nearly means:", "o": ["A) communicated through formal written channels", "B) deliberately understated to minimize accountability", "C) implied or suggested rather than directly stated", "D) likely to be misunderstood without additional context"], "a": 2, "e": "C is correct. Warning in the tone but not directly articulated = implied rather than stated explicitly. \"Implicit\" = implied though not plainly expressed.\n\nA — communicated through formal channels describes the medium.\nB — understated to avoid accountability is a possible motivation.\nD — likely to be misunderstood is a different quality.\n\nKelime: implicit — zımni, açıkça söylenmemiş, ima edilen"}, {"k": "vocab", "p": "The ultra-modern glass pavilion looked <u>incongruous</u> beside the centuries-old stone cathedral — a juxtaposition that delighted architecture critics but troubled preservationists who felt the new structure undermined the historic setting.", "q": "As used in the text, \"incongruous\" most nearly means:", "o": ["A) structurally unsound compared to older buildings", "B) not in harmony with its surroundings; out of place", "C) praised by some while criticized by others", "D) expensive relative to its aesthetic contribution"], "a": 1, "e": "B is correct. Glass pavilion next to stone cathedral, divided reactions = out of harmony with surroundings. \"Incongruous\" = not in harmony or keeping with the surroundings.\n\nA — structural soundness is a different quality.\nC — praised by some and criticized by others describes divided reception.\nD — expensive relative to contribution is a value judgment.\n\nKelime: incongruous — uyumsuz, yersiz, birbiriyle bağdaşmayan"}, {"k": "vocab", "p": "The consultant was <u>indifferent</u> to the political sensitivity of her findings, presenting the data with the same directness she would have brought to any other research context, regardless of who might be embarrassed.", "q": "As used in the text, \"indifferent\" most nearly means:", "o": ["A) unaware of the political context surrounding the research", "B) having no particular interest or concern; not affected by", "C) deliberately insensitive to the concerns of stakeholders", "D) professionally obligated to present findings without modification"], "a": 1, "e": "B is correct. Not affected by political sensitivity, same directness regardless = having no particular concern. \"Indifferent\" = having no particular interest or sympathy; unconcerned.\n\nA — unaware implies lack of knowledge; indifferent implies awareness but lack of concern.\nC — deliberately insensitive implies intentional disregard; indifferent is simply unconcerned.\nD — professionally obligated implies external constraint.\n\nKelime: indifferent — kayıtsız, umursamaz, ilgisiz"}, {"k": "vocab", "p": "The professor was visibly <u>indignant</u> when the review committee suggested her methodology was outdated, describing their assessment as uninformed and demanding that the critique be resubmitted with specific citations.", "q": "As used in the text, \"indignant\" most nearly means:", "o": ["A) surprised by a conclusion she had not anticipated", "B) feeling or showing anger about unfair treatment", "C) professionally embarrassed by a public criticism", "D) determined to contest a decision through formal channels"], "a": 1, "e": "B is correct. Called assessment uninformed, demanded citations = showing anger at what she considered unfair. \"Indignant\" = feeling or showing anger because of something unjust.\n\nA — surprised implies unexpectedness; indignant implies a sense of injustice.\nC — professionally embarrassed is different from righteous anger.\nD — determined to contest is a behavioral response, not the emotion.\n\nKelime: indignant — öfkeli, kızgın, haksızlığa uğramış hisseden"}, {"k": "vocab", "p": "From the sudden resignation of three senior officials in the same week, observers began to <u>infer</u> that the investigation had moved further than official statements had indicated.", "q": "As used in the text, \"infer\" most nearly means:", "o": ["A) publicly speculate without sufficient evidence", "B) conclude from evidence; deduce", "C) confirm by consulting independent sources", "D) report based on information from official channels"], "a": 1, "e": "B is correct. From three resignations, observers concluded something about the investigation = deduce from evidence. \"Infer\" = to conclude from evidence or reasoning.\n\nA — publicly speculate implies insufficient grounding.\nC — confirm from independent sources is verification.\nD — report from official channels is a different journalistic practice.\n\nKelime: infer — çıkarım yapmak, sonuç çıkarmak"}, {"k": "vocab", "p": "The young diplomat's <u>ingenuous</u> manner — her visible excitement at being in the room, her tendency to express surprise openly — was charming in social settings but made her colleagues nervous in formal negotiations.", "q": "As used in the text, \"ingenuous\" most nearly means:", "o": ["A) socially inexperienced in a professionally limiting way", "B) innocent and candid; not secretive or deceptive", "C) unusually empathetic toward the opposing party", "D) unlikely to detect deception by experienced counterparts"], "a": 1, "e": "B is correct. Visible excitement, expressing surprise openly = innocent, candid, not concealing. \"Ingenuous\" = innocent and candid; not practicing concealment.\n\nA — socially inexperienced is a consequence.\nC — unusually empathetic is a different quality.\nD — unlikely to detect deception is a consequence.\n\nKelime: ingenuous — saf, açık sözlü, samimi (aldatıcı olmayan)"}, {"k": "vocab", "p": "The project consumed an <u>inordinate</u> amount of resources: what had been estimated as a three-month initiative stretched to eleven months, absorbing sixty percent of the team's annual capacity.", "q": "As used in the text, \"inordinate\" most nearly means:", "o": ["A) difficult to predict due to shifting requirements", "B) unusually or disproportionately large", "C) poorly managed from the beginning", "D) approved without sufficient preliminary planning"], "a": 1, "e": "B is correct. Estimated three months became eleven, absorbed sixty percent = far more than expected. \"Inordinate\" = unusually or disproportionately large; excessive.\n\nA — difficult to predict is a planning quality.\nC — poorly managed is a management assessment.\nD — approved without planning describes a process failure.\n\nKelime: inordinate — aşırı, gereğinden fazla, ölçüsüz"}, {"k": "vocab", "p": "The coach's halftime adjustments were <u>insightful</u>: she identified in forty minutes what the opposing team's analysts had spent months designing, and her defensive scheme completely neutralized the strategy.", "q": "As used in the text, \"insightful\" most nearly means:", "o": ["A) bold and willing to take calculated risks", "B) based on deep experience in the relevant area", "C) having or showing an accurate and deep understanding", "D) effective regardless of the players available to implement it"], "a": 2, "e": "C is correct. Identified in forty minutes what months of design had built = accurate and deep understanding. \"Insightful\" = having or showing an accurate and deep understanding.\n\nA — bold and risk-taking is a different quality.\nB — deep experience is a possible source, not the definition.\nD — effective regardless of players describes robustness.\n\nKelime: insightful — kavrayışlı, derinlemesine anlayan"}, {"k": "vocab", "p": "The whistleblower's decision to go public before consulting the legal team may have <u>jeopardized</u> the formal investigation, potentially alerting individuals under scrutiny before evidence could be secured.", "q": "As used in the text, \"jeopardize\" most nearly means:", "o": ["A) complicate by adding additional parties", "B) put into danger or at risk of failure", "C) slow the investigation by introducing competing narratives", "D) require coordination with additional agencies"], "a": 1, "e": "B is correct. Going public before evidence was secured = putting the investigation at risk. \"Jeopardize\" = to put something in danger.\n\nA — complicate by adding parties is more specific.\nC — slowing by competing narratives is one way of jeopardizing.\nD — require coordination is a logistical consequence.\n\nKelime: jeopardize — tehlikeye atmak, riske sokmak"}, {"k": "vocab", "p": "The senior editor's <u>judicious</u> selection of which stories to pursue — prioritizing investigations that were both newsworthy and legally defensible — was credited with protecting the publication from potential lawsuits.", "q": "As used in the text, \"judicious\" most nearly means:", "o": ["A) experienced in making difficult decisions under pressure", "B) having or showing good judgment; wise", "C) conservative in choosing stories to minimize risk", "D) responsive to the recommendations of the legal department"], "a": 1, "e": "B is correct. Prioritizing newsworthy and legally defensible stories = showing good judgment. \"Judicious\" = having, showing, or done with good judgment.\n\nA — experienced describes background.\nC — conservative to minimize risk is a risk-averse strategy.\nD — responsive to legal recommendations describes deference.\n\nKelime: judicious — ihtiyatlı, sağduyulu, yerinde"}, {"k": "vocab", "p": "The opening chapter succeeded in <u>kindling</u> the reader's curiosity without fully explaining the situation — an ambiguity that kept the narrative taut while suggesting that a much larger story was unfolding.", "q": "As used in the text, \"kindling\" most nearly means:", "o": ["A) satisfying through clear and complete revelation", "B) arousing or inspiring a feeling", "C) sustaining through carefully paced narrative", "D) preparing the reader for an unexpected conclusion"], "a": 1, "e": "B is correct. Awakening curiosity through ambiguity = arousing a feeling. \"Kindle\" = to arouse or inspire a feeling.\n\nA — satisfying through complete rev
