es":{"D":"The scientist discovered a new compound that can dissolve plastic in seawater.","C":"Discovering a new compound, the scientist found it can dissolve plastic in seawater.","B":"A new compound was discovered by the scientist, it can dissolve plastic in seawater.","A":"The scientist discovered a new compound, which can dissolve plastic in seawater."},"n":9},{"choices":{"D":"Announcing the merger on Tuesday, industry analysts were surprised.","C":"The merger was announced on Tuesday, surprising industry analysts.","A":"The merger was announced on Tuesday, and it surprised industry analysts.","B":"The merger announcement on Tuesday surprised industry analysts."},"n":10,"stem":"The merger was announced on Tuesday. The announcement surprised industry analysts.  Which choice most effectively combines these sentences?","slug":"gri-mod-sat-g37-1-10","why":"C doğrudur. Katılımcı öbek ('surprising industry analysts') duyurunun etkisini gereksiz tekrar olmadan aktarıyor.  A — dilbilgisel olarak doğru ama D'den az özlü.  B — 'merger announcement on Tuesday' biraz belirsiz.  D — sarkan belirteç: analistler duyuruyu yapmadı.","ans":"C"},{"stem":"The study was peer-reviewed. It was published in a prestigious journal. It had significant implications for treatment.  Which choice most effectively combines these three sentences?","why":"A doğrudur. İki indirgenmiş niteleyici ('peer-reviewed' sıfat, 'published in a prestigious journal' katılımcı öbek) üç cümlenin bilgisini verimli şekilde birleştirir.  B — üç 'and' yan cümlesi gereksiz uzun.  C — 'in a prestigious journal' yanlış yerde ('implications'dan sonra).  D — üç cümleyi tam olarak birleştirmiyor.","slug":"gri-mod-sat-g37-1-11","ans":"A","choices":{"C":"Peer-reviewed and published, the study had significant implications in a prestigious journal.","D":"The study was peer-reviewed. Published in a prestigious journal, it had significant implications.","A":"The peer-reviewed study, published in a prestigious journal, had significant implications for treatment.","B":"The study was peer-reviewed and published in a prestigious journal and it had significant implications."},"n":11},{"slug":"gri-mod-sat-g37-1-12","why":"B doğrudur. Açıklayıcı öbek ('an accomplished violinist') kimliğini tanıtırken iki eşgüdümlü fiil ('plays' ve 'teaches') son iki cümleyi birleştirir.  A — dilbilgisel olarak doğru ama daha uzun.  C — 'accomplished and plays violin' garip bir yapı.  D — olgular arasındaki ilişkileri bozuyor.","stem":"She is an accomplished violinist. She plays in the city orchestra. She also teaches at the conservatory.  Which choice most effectively combines these three sentences?","ans":"B","choices":{"D":"Playing violin, she teaches at the conservatory and is also in the orchestra.","C":"She is accomplished and plays violin in the city orchestra and teaches at the conservatory.","B":"An accomplished violinist, she plays in the city orchestra and teaches at the conservatory.","A":"She is an accomplished violinist who plays in the city orchestra and who also teaches at the conservatory."},"n":12},{"n":13,"choices":{"A":"The policy was controversial, it was nonetheless adopted by a majority of the council.","B":"Although controversial, the policy was nonetheless adopted by a majority of the council.","C":"The policy was controversial; being nonetheless adopted by a majority.","D":"Controversial though it was, the policy was nonetheless adopted by a majority of the council."},"ans":"D","why":"D doğrudur. 'Controversial though it was' zarif bir taviz inversiyonudur. B de doğrudur ama D daha stilistik açıdan kesindir.  A — comma splice.  B — doğru ama D'den biraz daha az özlü.  C — noktalı virgül bir cümle parçasının (fragment) ardından geliyor.","slug":"gri-mod-sat-g37-1-13","stem":"The policy was controversial. It was nonetheless adopted by a majority of the council.  Which choice most effectively combines these sentences?"},{"slug":"gri-mod-sat-g37-1-14","why":"C doğrudur. 'After submitting the blueprints' olayların sırasını açıkça gösterirken ilk yan cümleyi bağımlıya indirger.  A — özneyi tekrarlıyor ve gereksiz 'and' kullanıyor.  B — anlamı bozuyor; mimar burada onay almıyor.  D — 'having waited' beklemenin onaydan önce tamamlandığını ima ediyor; belirsiz.","stem":"The architect submitted the blueprints. She then waited three months for approval.  Which choice most effectively combines these sentences?","ans":"C","choices":{"D":"Having submitted the blueprints and having waited three months for approval, the architect was done.","C":"After submitting the blueprints, the architect waited three months for approval.","A":"The architect submitted the blueprints and she waited three months for approval.","B":"Submitting the blueprints, and then waiting three months, the architect received approval."},"n":14},{"choices":{"D":"Income, education, and health outcomes were the three variables that the study examined.","C":"The study examined three variables which were income, education, and health outcomes.","B":"The study examined three variables, and these were income, education, and health outcomes.","A":"The study examined three variables: income, education, and health outcomes."},"n":15,"stem":"The study examined three variables. These variables were income, education, and health outcomes.  Which choice most effectively combines these sentences?","slug":"gri-mod-sat-g37-1-15","why":"A doğrudur. Tam bir yan cümleden sonra iki nokta üst üste (colon) listeyi verimli ve resmi şekilde sunar.  B — 'and these were' gereksiz uzun.  C — 'which were' gereksiz ilgi yan cümlesi; virgül yok.  D — dilbilgisel olarak doğru ama ayrıntıları bağlamdan önce sunar.","ans":"A"},{"n":16,"choices":{"B":"Although the medication is effective, it has significant side effects.","A":"The medication is effective; however, it has significant side effects.","C":"All of the above are correct.","D":"The medication is effective, but it has significant side effects."},"ans":"C","why":"C doğrudur. Üç seçeneğin hepsi zıtlığı doğru ifade eder: A noktalı virgül + bağlaç zarfı, B bağımlılık bağlacı, C eşgüdüm bağlacı kullanıyor.  A — doğru.  B — doğru.  D — doğru.","slug":"gri-mod-sat-g37-1-16","stem":"The medication is effective. However, it has significant side effects.  Which choice most effectively combines these sentences?"},{"slug":"gri-mod-sat-g37-1-17","choices":{"A":"The CEO announced the restructuring plan, alarming many employees.","B":"The CEO announced the restructuring plan and many employees were alarmed.","D":"The restructuring plan announced by the CEO alarmed many employees being there.","C":"Alarmed by the restructuring plan, the CEO made an announcement."},"n":17,"stem":"The CEO announced the restructuring plan. Many employees were alarmed by the announcement.  Which choice most effectively combines these sentences?","why":"A doğrudur. Katılımcı öbek ('alarming many employees') duyurunun sonucunu verimli şekilde aktarıyor.  B — iki tam yan cümle; daha az özlü.  C — sarkan belirteç: CEO alarmed değildi.  D — 'being there' garip ve belirsiz.","ans":"A"},{"ans":"D","stem":"The expedition lasted six months. It was the longest in the organization's history.  Which choice most effectively combines these sentences?","slug":"gri-mod-sat-g37-1-18","why":"D doğrudur. Hem A hem de B cümleleri etkin şekilde birleştiriyor. A 'lasting six months'ı kısıtlayıcı olmayan bir katılımcı öbek olarak, B ise giriş katılımcı öbeği olarak kullanıyor.  A — doğru.  B — doğru.  C — dilbilgisel olarak iyi ama iki tam yan cümle kullanıyor.","n":18,"choices":{"B":"Lasting six months, the expedition was the longest in the organization's history.","A":"The expedition, lasting six months, was the longest in the organization's history.","C":"The expedition lasted six months, and it was the longest in the organization's history.","D":"A and B are both effective."}},{"slug":"gri-mod-sat-g37-1-19","why":"C doğrudur. Hem B hem de C nedeni doğru şekilde entegre ediyor.  A — 'due to'dan önce virgül bu kullanımda standart değildir.  B — doğru.  D — doğru.","stem":"The company lost market share last year. This was due to increased competition from overseas.  Which choice most effectively combines these sentences?","ans":"C","choices":{"C":"B and C are both effective.","D":"Due to increased competition from overseas, the company lost market share last year.","A":"The company lost market share last year, due to increased competition from overseas.","B":"The company lost market share last year because of increased competition from overseas."},"n":19},{"n":20,"choices":{"D":"Poorly researched and poorly written, the article was flawed.","C":"The article was poorly researched and it was poorly written as well.","A":"The article was poorly researched, and it was also poorly written.","B":"The article was both poorly researched and poorly written."},"ans":"B","stem":"The article was poorly researched. It was also poorly written.  Which choice most effectively combines these sentences?","why":"B doğrudur. 'Both...and' iki paralel öbek ('poorly researched and poorly written') ile temiz bir yapı kurar.  A — özneyi tekrarlıyor ve 'also' gereksiz.  C — 'as well' sonda gereksiz.  D — dilbilgisel olarak doğru ama 'flawed' orijinal cümlelerde olmayan yeni bir sonuç ekliyor.","slug":"gri-mod-sat-g37-1-20"},{"why":"A doğrudur. Bileşik yüklem ('was submitted on time and met all the specified requirements') iki eylemi aynı özne altında verimli şekilde birleştiriyor.  B — katılımcı öbek de doğru.  D — da kabul edilebilir. A en doğal ve doğrudan birleştirme.","slug":"gri-mod-sat-g37-1-21","stem":"The report was submitted on time. It met all the specified requirements.  Which choice most effectively combines these sentences?","ans":"A","choices":{"C":"On time, the report was submitted and met requirements.","D":"The report, submitted on time, met all the specified requirements.","A":"The report was submitted on time and met all the specified requirements.","B":"Submitted on time, the report met all the specified requirements."},"n":21},{"choices":{"A":"The defendant entered the courtroom, and the defendant appeared calm and composed.","B":"Entering the courtroom, the defendant appeared calm and composed.","D":"The defendant entered the courtroom appearing calm and composed.","C":"Both B and C are effective."},"n":22,"slug":"gri-mod-sat-g37-1-22","why":"C doğrudur. Hem B hem de C cümleleri doğru birleştiriyor. B giriş katılımcı öbeği, C ise sonda katılımcı öbek kullanıyor.  A — 'the defendant' tekrarlanıyor.  B — doğru.  D — doğru.","stem":"The defendant entered the courtroom. The defendant appeared calm and composed.  Which choice most effectively combines these sentences?","ans":"C"},{"n":23,"choices":{"D":"The committee reviewed the application. The committee contacted the references.","C":"The committee has reviewed the application and contacted the references.","A":"The committee has reviewed the application and has also contacted the references.","B":"Having reviewed the application, the committee has contacted the references."},"ans":"C","slug":"gri-mod-sat-g37-1-23","why":"C doğrudur. Bileşik yüklem ('has reviewed...and contacted') yardımcı fiili paylaşarak en özlü birleştirmeyi sağlıyor.  A — 'has' gereksiz tekrar ediyor ('has also contacted').  B — incelemenin önce tamamlandığını ima ediyor; bu sıra her zaman geçerli değil.  D — iki ayrı cümle kalıyor.","stem":"The committee has reviewed the application. The committee has also contacted the references.  Which choice most effectively combines these sentences?"},{"why":"B doğrudur. Üç seçeneğin hepsi doğru şekilde birleştiriyor: A bileşik yüklem, B zamansal bağımlı yan cümle, C giriş katılımcı öbeği kullanıyor.  A — doğru.  C — doğru.  D — doğru.","slug":"gri-mod-sat-g37-1-24","stem":"The volcano erupted in 1980. The eruption destroyed thousands of acres of forest.  Which choice most effectively combines these sentences?","ans":"B","choices":{"B":"All three are effective.","A":"The volcano erupted in 1980 and destroyed thousands of acres of forest.","D":"Erupting in 1980, the volcano destroyed thousands of acres of forest.","C":"When the volcano erupted in 1980, it destroyed thousands of acres of forest."},"n":24},{"ans":"A","why":"A doğrudur. İndirgenmiş ilgi yan cümlesi ('intended to reduce unemployment') 'measures'ı doğrudan ve özlü şekilde niteler.  B — 'and these were' gereksiz uzun.  C — pasif yapı daha az doğrudan.  D — 'which were intended' dilbilgisel olarak doğru ama B'den daha uzun.","stem":"The government announced new measures. These measures were intended to reduce unemployment.  Which choice most effectively combines these sentences?","n":25,"choices":{"C":"New measures intended to reduce unemployment were announced by the government.","D":"The government announced new measures which were intended to reduce unemployment.","B":"The government announced new measures, and these were intended to reduce unemployment.","A":"The government announced new measures intended to reduce unemployment."},"slug":"gri-mod-sat-g37-1-25"}]}],"eyebrow":"Gramer"},{"blocks":[{"x":"SAT Reading & Writing dilbilgisi â Style, Register & Tone Consistency. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"choices":{"B":"So the committee really did amazing work.","A":"Basically, they totally crushed it this year.","D":"Overall, the committee demonstrated considerable progress across multiple performance indicators.","C":"In sum, they nailed all their goals."},"n":1,"why":"D doğrudur. Pasaj resmi, profesyonel bir dil kullanıyor. 'Demonstrated considerable progress across multiple performance indicators' bu register (dil düzeyi) ile uyumludur.  A, C, D — 'crushed it,' 'nailed,' 'really did amazing work' gibi günlük dil kullanıyor; resmi register ile uyumsuz.","slug":"gri-mod-sat-g38-1-1","stem":"The committee's annual report detailed significant achievements in environmental sustainability and outlined several key areas for improvement. Basically, they totally crushed it this year.  Which choice maintains the formal register of the passage?","ans":"D"},{"n":2,"choices":{"B":"After a while, she went in a completely other direction.","A":"Later, she started doing totally different stuff.","C":"She then changed her style quite a bit.","D":"As her career progressed, her work shifted toward more minimalist approaches."},"ans":"D","stem":"The artist's early work explored themes of displacement and cultural hybridity through fragmented imagery and non-linear narrative structures. Later, she started doing totally different stuff.  Which choice is consistent with the analytical tone of the passage?","why":"D doğrudur. 'As her career progressed, her work shifted toward more minimalist approaches' analitik ve resmi tonu korur.  A, C, D — 'totally different stuff,' 'went in a completely other direction,' 'quite a bit' gibi günlük ifadeler register ile uyumsuz.","slug":"gri-mod-sat-g38-1-2"},{"ans":"C","stem":"The merger negotiations were conducted over a period of eight months and involved representatives from three continents. It was a pretty long process, to be honest.  Which choice maintains the formal, informative register?","why":"C doğrudur. 'The extended duration of the negotiations reflected the complexity of the cross-continental agreement' resmi ve analitiktir.  A, C, D — 'pretty,' 'to be honest,' 'way longer,' 'Honestly' gibi günlük işaretçiler resmi tonu bozuyor.","slug":"gri-mod-sat-g38-1-3","n":3,"choices":{"A":"It was a pretty long process, to be honest.","B":"The whole thing took way longer than expected.","D":"Honestly, eight months is a lot.","C":"The extended duration of the negotiations reflected the complexity of the cross-continental agreement."}},{"choices":{"C":"Bottom line: exercise makes you healthier.","D":"Everyone basically knows exercise is important.","A":"So yeah, working out is good for you.","B":"These findings underscore the multidimensional health benefits of sustained physical activity."},"n":4,"why":"B doğrudur. 'These findings underscore the multidimensional health benefits of sustained physical activity' bilimsel register ile uyumludur.  A, C, D — 'So yeah,' 'Bottom line,' 'basically knows' gibi günlük ifadeler bilimsel bağlamla uyumsuz.","slug":"gri-mod-sat-g38-1-4","stem":"Studies have consistently demonstrated that regular physical activity reduces the risk of cardiovascular disease, improves cognitive function, and enhances overall psychological well-being. So yeah, working out is good for you.  Which choice is consistent with the scientific register?","ans":"B"},{"n":5,"choices":{"C":"Rich people and poor people had lots of drama.","D":"It was a time when money and class were a big deal.","B":"Contemporary readers were deeply preoccupied with the ethical legitimacy of wealth accumulation.","A":"People back then were really into whether rich folks deserved their money."},"ans":"B","slug":"gri-mod-sat-g38-1-5","why":"B doğrudur. 'Preoccupied with the ethical legitimacy of wealth accumulation' akademik, edebi-eleştirel tona uygundur.  A, C, D — 'really into,' 'rich folks,' 'lots of drama,' 'big deal' gibi günlük sözcükler register ile uyumsuz.","stem":"The nineteenth-century novel frequently engaged with questions of social mobility, class conflict, and the moral dimensions of economic aspiration. People back then were really into whether rich folks deserved their money.  Which choice is consistent with the literary-critical register?"},{"n":6,"choices":{"A":"This methodology ensured that neither participants nor researchers were aware of treatment assignments during data collection.","B":"They didn't tell anyone what they were taking, which is a smart move.","C":"Nobody knew who had the real drug, which is the point.","D":"The blind approach kept things fair, basically."},"ans":"A","stem":"The pharmaceutical trial employed a double-blind, placebo-controlled methodology to minimize the influence of bias on the measured outcomes. They didn't tell anyone what they were taking, which is a smart move.  Which choice maintains the technical, scientific register?","slug":"gri-mod-sat-g38-1-6","why":"A doğrudur. 'Neither participants nor researchers were aware of treatment assignments' yöntemi bilimsel dilde doğru şekilde ifade eder.  A, C, D — 'didn't tell,' 'nobody knew,' 'smart move,' 'basically' gibi günlük ifadeler teknik register ile uyumsuz."},{"n":7,"choices":{"A":"The design was really cool and creative.","B":"Everyone loved how neat and inventive the design was.","C":"Honestly, it was one of the better designs they'd seen.","D":"The proposal was lauded for its creative and technically sophisticated approach to sustainable design."},"ans":"D","stem":"The architectural firm's proposal was praised for its innovative integration of passive solar design principles with the site's existing topographical features. The design was really cool and creative.  Which choice maintains the formal, professional tone?","slug":"gri-mod-sat-g38-1-7","why":"D doğrudur. 'Lauded for its creative and technically sophisticated approach' profesyonel register'ı korur.  A, C, D — 'really cool,' 'Everyone loved,' 'neat,' 'Honestly' gibi günlük dil resmi tonu bozuyor."},{"choices":{"C":"Things changed a lot for everyone in terms of economic policy.","D":"This period marked a decisive shift toward state intervention in economic governance.","A":"Back then, the government got really involved in money stuff.","B":"The government basically started controlling everything."},"n":8,"stem":"The economic downturn of the 1930s fundamentally restructured the relationship between the state and the market, as governments across the industrialized world assumed unprecedented regulatory authority over financial institutions. Back then, the government got really involved in money stuff.  Which choice maintains the historical, academic register?","why":"D doğrudur. 'A decisive shift toward state intervention in economic governance' tarihsel ve analitik tona uygundur.  A, C, D — 'money stuff,' 'basically,' 'a lot,' 'everyone' gibi günlük dil akademik register ile uyumsuz.","slug":"gri-mod-sat-g38-1-8","ans":"D"},{"n":9,"choices":{"D":"It turns out animals can be more clever than we thought.","C":"Basically, chimpanzees can teach skills to younger ones.","B":"These observations suggest that cultural transmission of knowledge is not exclusively a human phenomenon.","A":"Chimps are pretty smart and learn from each other."},"ans":"B","stem":"Primatological research has documented sophisticated forms of social learning among chimpanzees, including the transmission of tool-use behaviors across generations. Chimps are pretty smart and learn from each other.  Which choice is consistent with the scientific register?","slug":"gri-mod-sat-g38-1-9","why":"B doğrudur. 'Cultural transmission of knowledge is not exclusively a human phenomenon' bilimsel dile uygundur.  A, C, D — 'pretty smart,' 'Basically,' 'more clever than we thought' gibi günlük ifadeler bilimsel bağlamla uyumsuz."},{"why":"D doğrudur. 'Critics contended that the measures represented an unconstitutional infringement on individual rights' resmi ve hukuki açıdan kesindir.  A, C, D — 'really mad,' 'spy stuff,' 'felt like,' 'folks' gibi günlük ifadeler yasal bağlamla uyumsuz.","stem":"The legislative debate centered on the constitutionality of the proposed surveillance measures, with opponents arguing that the legislation violated foundational principles of civil liberties. A lot of people were really mad about the new spy stuff.  Which choice maintains the formal, analytical register?","ans":"D","choices":{"D":"Critics contended that the measures represented an unconstitutional infringement on individual rights.","C":"The surveillance thing made many folks upset.","B":"People didn't like it because it felt like an invasion of privacy.","A":"A lot of people were really mad about the new spy stuff."},"n":10,"slug":"gri-mod-sat-g38-1-10"},{"stem":"The play examines the psychological deterioration of its protagonist through a series of increasingly fragmented interior monologues. The audience gets kind of confused as the character goes more and more crazy.  Which choice is consistent with the literary-critical register?","why":"C doğrudur. 'Drawn into the protagonist's disintegrating psychological landscape' eleştirel ve analitiktir.  A, C, D — 'kind of confused,' 'losing it,' 'fall apart,' 'basically' gibi günlük dil edebi-eleştirel register ile uyumsuz.","ans":"C","choices":{"D":"watches the character fall apart, which is a little hard to follow","C":"is drawn into the protagonist's disintegrating psychological landscape alongside the character","B":"basically can't follow what's happening because the character is losing it","A":"gets kind of confused as the character goes more and more crazy"},"n":11,"slug":"gri-mod-sat-g38-1-11"},{"choices":{"B":"Everyone seemed happy because developing countries got help.","A":"It was a good deal that helped poorer countries with climate stuff.","C":"The agreement represented a significant advance in international solidarity on climate resilience.","D":"It worked out well for the countries that needed the most help."},"n":12,"stem":"The treaty established a framework for multilateral cooperation on climate adaptation, including provisions for technology transfer to developing nations. It was a good deal that helped poorer countries with climate stuff.  Which choice maintains the formal, diplomatic register?","why":"C doğrudur. 'A significant advance in international solidarity on climate resilience' resmi diplomatik dile uygundur.  A, C, D — 'good deal,' 'climate stuff,' 'Everyone seemed happy,' 'worked out well' gibi günlük ifadeler diplomatik register ile uyumsuz.","ans":"C","slug":"gri-mod-sat-g38-1-12"},{"n":13,"choices":{"D":"Young people's brains being less mature explains a lot of their behavior.","C":"Teenagers have less developed brains, which affects how they make decisions.","A":"These structural differences may contribute to the diminished inhibitory capacity observed in adolescent populations.","B":"Teen brains aren't fully grown, so they can't control themselves as well."},"ans":"A","stem":"Neuroimaging studies have identified structural differences in the prefrontal cortex associated with impulse control deficits in adolescents. Teen brains aren't fully grown, so they can't control themselves as well.  Which choice maintains the scientific register?","why":"A doğrudur. 'Diminished inhibitory capacity observed in adolescent populations' nörobilimsel dile kesin olarak uygundur.  A, C, D — 'Teen brains aren't fully grown,' 'explains a lot,' 'can't control themselves' gibi ifadeler bilimsel register ile uyumsuz.","slug":"gri-mod-sat-g38-1-13"},{"n":14,"choices":{"C":"The unusual setup was meant to make people think differently.","D":"The weird arrangement was supposed to be confusing for visitors.","A":"This deliberate subversion of conventional display practices invited a reexamination of curatorial assumptions.","B":"Basically, the museum layout was weird on purpose."},"ans":"A","why":"A doğrudur. 'Deliberate subversion of conventional display practices' resmi eleştirel dile uygundur.  A, C, D — 'basically,' 'weird,' 'think differently,' 'confusing' gibi günlük ifadeler analitik register ile uyumsuz.","slug":"gri-mod-sat-g38-1-14","stem":"The curator argued that the exhibition's unconventional spatial arrangement was intended to challenge visitors' assumptions about the relationship between object and context. Basically, the museum layout was weird on purpose.  Which choice is consistent with the analytical, critical register?"},{"choices":{"B":"The accounting was a mess, so the government had to step in.","A":"They found that the numbers were totally off, and the regulators got involved.","D":"Things didn't add up, so investigators had to look into it.","C":"The identified discrepancies necessitated the intervention of the relevant regulatory body."},"n":15,"why":"C doğrudur. 'The identified discrepancies necessitated the intervention of the relevant regulatory body' resmi ve mesleki register ile uyumludur.  A, C, D — 'totally off,' 'a mess,' 'step in,' 'Things didn't add up' gibi günlük ifadeler resmi denetim bağlamıyla uyumsuz.","slug":"gri-mod-sat-g38-1-15","stem":"The audit revealed significant discrepancies between the reported figures and the actual financial records, prompting an investigation by the regulatory authority. They found that the numbers were totally off, and the regulators got involved.  Which choice maintains the formal register?","ans":"C"},{"why":"B doğrudur. 'These constraints may affect the generalizability of the findings to broader populations' metodolojik dile kesin olarak uygundur.  A, C, D — 'wasn't perfect,' 'honestly,' 'mess up' gibi günlük ifadeler metodolojik register ile uyumsuz.","slug":"gri-mod-sat-g38-1-16","stem":"The study's limitations include a relatively small sample size and the exclusive reliance on self-reported data, which may have introduced response bias. But the study wasn't perfect, honestly.  Which choice is consistent with the scientific, methodological register?","ans":"B","choices":{"D":"The study had problems that could mess up the results.","C":"So the results might not apply to everyone.","B":"These constraints may affect the generalizability of the findings to broader populations.","A":"But the study wasn't perfect, honestly."},"n":16},{"n":17,"choices":{"D":"The poem's style reflects how messed up the speaker is emotionally.","C":"The formal fragmentation of the text enacts the speaker's internal disorder at the level of language itself.","B":"The writing style is confusing, like the speaker's state of mind.","A":"The poem sounds broken-up because the speaker feels messed up inside."},"ans":"C","why":"C doğrudur. 'The formal fragmentation of the text enacts the speaker's internal disorder at the level of language itself' kesin olarak analitiktir.  A, C, D — 'sounds broken-up,' 'messed up,' 'confusing,' 'style' gibi günlük ifadeler edebi-analitik register ile uyumsuz.","stem":"The poet employs fragmented syntax and dissonant imagery to mirror the fractured consciousness of the speaker, creating a textual experience of psychological disorientation. The poem sounds broken-up because the speaker feels messed up inside.  Which choice is consistent with the literary-analytical register?","slug":"gri-mod-sat-g38-1-17"},{"ans":"B","why":"B doğrudur. 'A strategic commitment to accountability and inclusive organizational governance' kurumsal dile uygundur.  A, C, D — 'trying harder to be good,' 'do better,' 'show they care' gibi günlük ifadeler kurumsal register ile uyumsuz.","slug":"gri-mod-sat-g38-1-18","stem":"The company's revised corporate social responsibility framework reflects an increased emphasis on stakeholder engagement and transparent governance. They're trying harder to be good and honest.  Which choice maintains the corporate, formal register?","n":18,"choices":{"D":"They're making changes to show they care about ethics.","C":"The company wants to do better in terms of ethical behavior.","B":"These revisions signal a strategic commitment to accountability and inclusive organizational governance.","A":"They're trying harder to be good and honest."}},{"n":19,"choices":{"B":"Poor people get sick more, basically.","A":"These patterns indicate that socioeconomic vulnerability is a significant determinant of population health outcomes.","D":"Low-income groups are more likely to be sick than rich ones.","C":"People with less money tend to have more health problems, studies show."},"ans":"A","stem":"Epidemiological data suggest a strong correlation between socioeconomic disadvantage and elevated rates of chronic disease across demographic groups. Poor people get sick more, basically.  Which choice is consistent with the epidemiological register?","slug":"gri-mod-sat-g38-1-19","why":"A doğrudur. 'Socioeconomic vulnerability is a significant determinant of population health outcomes' epidemiyolojik dile kesin olarak uygundur.  A, C, D — 'Poor people get sick more,' 'basically,' 'more likely to be sick' gibi ifadeler bilimsel register ile uyumsuz."},{"slug":"gri-mod-sat-g38-1-20","ans":"C","why":"C doğrudur. 'Prioritized the recovery of classical knowledge as a foundation for renewed scholarly inquiry' akademik tarihsel dile uygundur.  A, C, D — 'got really into,' 'stuff,' 'liked looking' gibi günlük ifadeler akademik register ile uyumsuz.","stem":"The Renaissance marked a profound reorientation of European intellectual culture toward classical antiquity, with humanist scholars championing individual reason and empirical inquiry. Back then, smart people got really into ancient Greek and Roman stuff.  Which choice is consistent with the historical, academic register?","n":20,"choices":{"B":"Scholars at the time were very interested in ancient history and philosophy.","A":"Back then, smart people got really into ancient Greek and Roman stuff.","C":"This intellectual movement prioritized the recovery of classical knowledge as a foundation for renewed scholarly inquiry.","D":"People in this era liked looking at old texts from Greece and Rome."}},{"ans":"D","stem":"The defendant's motion to suppress the evidence was denied on the grounds that the search had been conducted pursuant to a valid warrant. The judge said no because the search was legal.  Which choice maintains the formal, legal register?","slug":"gri-mod-sat-g38-1-21","why":"D doğrudur. 'The court upheld the admissibility of the evidence, affirming the constitutional validity of the search' kesin hukuki dile uygundur.  A, C, D — 'said no,' 'throw out,' 'done legally' gibi günlük ifadeler hukuki register ile uyumsuz.","n":21,"choices":{"D":"The court upheld the admissibility of the evidence, affirming the constitutional validity of the search.","C":"They weren't allowed to throw out the evidence because everything was done legally.","A":"The judge said no because the search was legal.","B":"The judge rejected the motion since the search followed the law."}},{"choices":{"D":"It turned out the algorithm handled a lot of data just fine.","C":"The algorithm did well when tested on millions of data points.","B":"They tested the algorithm on a ton of data, and it worked pretty well.","A":"The evaluation methodology demonstrated robust algorithmic performance across a large-scale dataset."},"n":22,"stem":"The algorithm's performance was evaluated using a cross-validation methodology applied to a dataset of over two million entries. They tested the algorithm on a ton of data, and it worked pretty well.  Which choice maintains the technical, academic register?","why":"A doğrudur. 'Robust algorithmic performance across a large-scale dataset' teknik dile uygundur.  A, C, D — 'a ton of data,' 'pretty well,' 'just fine' gibi günlük ifadeler teknik register ile uyumsuz.","slug":"gri-mod-sat-g38-1-22","ans":"A"},{"choices":{"A":"People who want change say the rules keep poor folks stuck where they are.","B":"Advocates contend that the existing regulatory framework sustains structural inequities that constrain socioeconomic mobility.","D":"Supporters argue that the laws are unfair to people who don't have much money.","C":"Reformers say the current rules make it hard for low-income people to improve their situation."},"n":23,"slug":"gri-mod-sat-g38-1-23","why":"B doğrudur. 'The existing regulatory framework sustains structural inequities that constrain socioeconomic mobility' resmi ve analitik politika diline uygundur.  A, C, D — 'poor folks,' 'stuck where they are,' 'don't have much money' gibi günlük ifadeler politika register ile uyumsuz.","stem":"Proponents of the reform argue that existing zoning regulations perpetuate residential segregation and limit economic mobility for lower-income households. People who want change say the rules keep poor folks stuck where they are.  Which choice is consistent with the analytical, policy-oriented register?","ans":"B"},{"slug":"gri-mod-sat-g38-1-24","choices":{"D":"Methane was found in large amounts, as scientists had predicted.","C":"The satellite picked up high methane levels, which matched the predictions.","A":"The sensor data corroborated the projected atmospheric methane concentrations for the target region.","B":"The satellite found a lot of methane up there, which is what they expected."},"n":24,"why":"A doğrudur. 'The sensor data corroborated the projected atmospheric methane concentrations' kesin bilimsel dil kullanıyor.  A, C, D — 'a lot,' 'up there,' 'picked up,' 'large amounts' gibi günlük ifadeler bilimsel register ile uyumsuz.","stem":"The satellite's onboard sensors detected elevated concentrations of methane in the atmosphere above the target region, consistent with the predicted emissions profile. The satellite found a lot of methane up there, which is what they expected.  Which choice maintains the scientific register?","ans":"A"},{"ans":"A","stem":"The foundation's grant program has supported over three hundred independent research projects across seventeen countries since its inception in 2001. They've funded a bunch of projects worldwide, which is great.  Which choice maintains the formal register?","slug":"gri-mod-sat-g38-1-25","why":"A doğrudur. 'Sustained financial support for independent scholarly inquiry at an international scale' resmi ve kesindir.  A, C, D — 'a bunch,' 'which is great,' 'lots of researchers,' 'shows how committed' gibi günlük ifadeler resmi register ile uyumsuz.","n":25,"choices":{"A":"Since its establishment, the program has provided sustained financial support for independent scholarly inquiry at an international scale.","B":"They've funded a bunch of projects worldwide, which is great.","C":"The foundation has given money to lots of researchers around the world.","D":"They've supported many projects globally, which shows how committed they are."}}]}],"name":"Style, Register & Tone Consistency","group":"Dilbilgisi","id":"g38","eyebrow":"Gramer"},{"blocks":[{"x":"SAT Reading & Writing dilbilgisi â Pronoun Case — Who/Whom & Reflexives. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"ans":"A","slug":"gri-mod-sat-g39-1-1","why":"A doğrudur. 'Whoever' bağımlı cümlenin öznesidir ('whoever submits...'). 'To' edat olmasına rağmen zamir kendi cümlesinin öznesidir — 'whoever' kullanılır.  B — 'whomever' nesne formudur; burada zamir 'submits'in öznesi.  C — 'who' bu cümle yapısında tek başına çalışmaz.  D — 'whom' nesne formudur.","stem":"The prize will be awarded to whoever submits the most innovative proposal.  Which pronoun is correct?","n":1,"choices":{"B":"whomever","A":"whoever","C":"who","D":"whom"}},{"ans":"B","stem":"The award was given to whomever the committee deemed most deserving.  Which pronoun is correct?","why":"B doğrudur. 'Whomever the committee deemed most deserving' cümlesinde zamir 'deemed'in nesnesidir (the committee deemed whomever). Nesne formu: 'whomever.'  A — 'whoever' özne formudur; burada zamir nesne.  C — 'who' basit özne formudur.  D — 'whom' bu yapıda 'whomever'ın yerini tutmaz.","slug":"gri-mod-sat-g39-1-2","n":2,"choices":{"C":"who","D":"whom","A":"whoever","B":"whomever"}},{"stem":"The manager asked who was responsible for the error in the report.  Which pronoun is correct?","why":"D doğrudur. 'Who' gömülü cümlenin öznesidir ('who was responsible'). 'Was' yardımcı fiili özne zamiri gerektirir.  A — 'whom' nesne formudur; burada zamir 'was'ın öznesi.  B — 'whoever' belirli olmayan her kişiyi kasteder.  C — 'whomever' nesne formudur.","slug":"gri-mod-sat-g39-1-3","ans":"D","choices":{"D":"who","C":"whomever","B":"whoever","A":"whom"},"n":3},{"stem":"The investigator could not determine whom the anonymous tip had been directed at.  Which pronoun is correct?","why":"B doğrudur. Yeniden yaz: 'the tip had been directed at ___.' Zamir 'at' edatının nesnesidir — 'whom' kullanılır.  A — 'who' özne formudur; burada zamir nesne.  C — 'whoever' belirli olmayan her kişiyi kasteder.  D — 'whomever' bağımlı cümle içinde nesne formu için kullanılır; burada 'whom' doğru basit nesne zamiridir.","slug":"gri-mod-sat-g39-1-4","ans":"B","choices":{"D":"whomever","C":"whoever","A":"who","B":"whom"},"n":4},{"ans":"A","why":"A doğrudur. 'Who' ilgi yan cümlesinin öznesidir ('who had negotiated'). Avukatlar eylemi gerçekleştiriyor — özne formu gerekli.  B — 'whom' nesne formudur; burada zamir 'had negotiated'ın öznesi.  C — 'that' insanlar için kısıtlayıcı yan cümlelerde kullanılabilir ama cümle nonrestrictive (virgüllü); 'who' tercih edilir.  D — 'whoever' belirli olmayan her kişiyi kasteder.","slug":"gri-mod-sat-g39-1-5","stem":"The contract was signed by the two attorneys who had negotiated the terms.  Which pronoun is correct?","n":5,"choices":{"C":"that","D":"whoever","B":"whom","A":"who"}},{"ans":"C","slug":"gri-mod-sat-g39-1-6","why":"C doğrudur. 'Whoever' gömülü cümlenin öznesidir ('whoever is managing'). Tüm cümle 'to'nun nesnesi olsa da zamir kendi cümlesi içinde öznedir.  A — 'whomever' nesne formudur; zamir 'is managing'ın öznesi.  B — 'who' bu yapıda cümle içinde çalışmaz.  D — 'whom' nesne formudur.","stem":"Please forward the message to whoever is managing the project this week.  Which pronoun is correct?","n":6,"choices":{"D":"whom","C":"whoever","A":"whomever","B":"who"}},{"stem":"The researchers interviewed participants whom they had recruited from three different cities.  Which pronoun is correct?","why":"C doğrudur. Yeniden yaz: 'they had recruited ___.' Zamir 'recruited'ın nesnesidir — 'whom' kullanılır.  A — 'who' özne formudur; burada zamir nesne.  B — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'whom' insanlar için daha kesindir.  D — 'whose' iyelik formudur.","slug":"gri-mod-sat-g39-1-7","ans":"C","choices":{"C":"whom","D":"whose","A":"who","B":"that"},"n":7},{"stem":"She is the one whom I believe will lead the department most effectively.  Which pronoun is correct?","slug":"gri-mod-sat-g39-1-8","why":"B doğrudur. 'I believe' parantez içi ek (parenthetical). Zamir 'will lead'in öznesidir. Test: 'she will lead' (özne) → 'who' kullanılır.  A — 'whom' nesne formu; 'I believe' bir eklemedir ve zamir 'will lead'in öznesidir.  C — 'whoever' belirli olmayan her kişiyi kasteder.  D — 'whomever' nesne formudur.","ans":"B","choices":{"D":"whomever","C":"whoever","B":"who","A":"whom"},"n":8},{"choices":{"C":"who","D":"whose","A":"whom","B":"that"},"n":9,"slug":"gri-mod-sat-g39-1-9","why":"C doğrudur. Zamir 'won'un öznesidir — özne formu 'who' kullanılır. Test: 'she won' (özne değil 'her won').  A — 'whom' nesne formu; burada zamir 'won'un öznesi.  B — 'that' insanlar için kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' tercih edilir.  D — 'whose' iyelik formudur.","stem":"The director whom won the award gave a lengthy acceptance speech.  Which pronoun is correct?","ans":"C"},{"n":10,"choices":{"D":"which","C":"that","B":"who","A":"whom"},"ans":"B","why":"B doğrudur. Zamir 'specializes'ın öznesidir — özne formu 'who' kullanılır. Test: 'she specializes' (özne).  A — 'whom' nesne formu; burada zamir özne.  C — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' insanlar için tercih edilir.  D — 'which' nesnelere atıfta bulunur.","slug":"gri-mod-sat-g39-1-10","stem":"The report was submitted by a consultant whom specializes in regulatory compliance.  Which pronoun is correct?"},{"slug":"gri-mod-sat-g39-1-11","why":"B doğrudur. Yeniden yaz: 'she considered ___ the most qualified.' Zamir 'considered'ın nesnesidir — 'whom' kullanılır.  A — 'who' özne formudur; burada zamir nesne.  C — 'whoever' özne formu için gömülü cümlelerde kullanılır.  D — 'whomever' gömülü cümle içinde nesne formu için kullanılır; bu yapıda 'whom' daha uygun.","stem":"The CEO hired whom she considered the most qualified candidate.  Which pronoun is correct?","ans":"B","choices":{"B":"whom","A":"who","C":"whoever","D":"whomever"},"n":11},{"choices":{"C":"who","D":"whom","A":"whomever","B":"whoever"},"n":12,"stem":"The committee will invite whoever demonstrates the most thorough understanding of the issues.  Which pronoun is correct?","why":"B doğrudur. 'Whoever' gömülü cümlenin öznesidir ('whoever demonstrates'). 'Invite' fiilinin ardından gelse de zamir kendi cümlesinde öznedir.  A — 'whomever' nesne formu; zamir 'demonstrates'ın öznesi.  C — 'who' gömülü cümlelerde 'whoever'ın yerini tutmaz.  D — 'whom' nesne formudur.","ans":"B","slug":"gri-mod-sat-g39-1-12"},{"n":13,"choices":{"C":"that","D":"who","B":"which","A":"whom"},"ans":"D","stem":"The professor gave extra credit to students whom she felt had worked especially hard.  Which pronoun is correct?","why":"D doğrudur. 'She felt' parantez içi ek. Zamir 'had worked'ın öznesidir. 'She felt'i çıkar: 'students who had worked' → özne formu 'who.'  A — 'whom' nesne olduğunda kullanılır; burada zamir 'had worked'ın öznesidir.  B — 'which' nesnelere atıfta bulunur.  C — 'that' kısıtlayıcı yan cümlelerde kullanılabilir ama 'who' insanlar için tercih edilir.","slug":"gri-mod-sat-g39-1-13"},{"ans":"A","slug":"gri-mod-sat-g39-1-14","why":"A doğrudur. 'Whomever the selection committee recommends' gömülü cümlesinde zamir 'recommends'in nesnesidir. Nesne formu: 'whomever.'  B — 'whoever' özne formudur; burada zamir nesne.  C — 'who' basit özne formudur.  D — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır.","stem":"The scholarship will be granted to whomever the selection committee recommends.  Which pronoun is correct?","n":14,"choices":{"A":"whomever","B":"whoever","C":"who","D":"whom"}},{"stem":"The athlete herself was surprised by the record-breaking performance.  Which choice correctly uses a reflexive or intensive pronoun?","slug":"gri-mod-sat-g39-1-15","why":"D doğrudur. 'Herself' burada yoğunlaştırıcı (intensive pronoun) olarak kullanılıyor — sporcunun bizzat şaşırdığını vurguluyor.  A — 'her' nesne zamiridir; yoğunlaştırıcı işlevi göremez.  B — 'she' özne zamiridir; yoğunlaştırıcı değil.  C — 'hers' iyelik zamiridir.","ans":"D","choices":{"A":"her","B":"she","C":"hers","D":"herself"},"n":15},{"slug":"gri-mod-sat-g39-1-16","choices":{"D":"I","C":"mine","B":"me","A":"myself"},"n":16,"stem":"The director and myself reviewed the final budget projections before the board meeting.  Which pronoun is correct?","why":"D doğrudur. 'The director and I' bileşik öznedir — 'I' özne zamiridir. Dönüşlü zamirler (myself) bileşik öznelerde özne zamirinin yerini tutamaz.  A — 'myself' bileşik özne olamaz; yaygın bir hatadır.  B — 'me' nesne zamiridir.  C — 'mine' iyelik zamiridir.","ans":"D"},{"ans":"D","slug":"gri-mod-sat-g39-1-17","why":"D doğrudur. 'The award was presented to my colleague and me' — 'me' 'to' edatının nesnesidir. Test: 'my colleague and'ı çıkar → 'presented to me' (I değil).  A — 'I' özne zamiridir; bu bir nesne konumudur.  B — 'myself' basit nesne zamirinin yerini tutamaz.  C — 'mine' iyelik zamiridir.","stem":"The award was presented to my colleague and I at the annual conference.  Which pronoun is correct?","n":17,"choices":{"A":"I","B":"myself","C":"mine","D":"me"}},{"ans":"A","why":"A doğrudur. 'Between you and me' — 'me' 'between' edatının nesnesidir. Edatlar her zaman nesne zamiri alır.  B — 'I' özne zamiridir; edatlar nesne zamiri gerektirir.  C — 'myself' edatın basit nesnesi olarak kullanılamaz.  D — 'mine' iyelik zamiridir.","slug":"gri-mod-sat-g39-1-18","stem":"Between you and I, the project was managed poorly from the start.  Which pronoun is correct?","n":18,"choices":{"C":"myself","D":"mine","B":"I","A":"me"}},{"ans":"C","why":"C doğrudur. 'Himself' burada yoğunlaştırıcı olarak kullanılıyor — müdürün bizzat itiraf ettiğini vurguluyor.  A — 'him' nesne zamiridir; özneyi yoğunlaştıramaz.  B — 'his' iyelik zamiridir.  D — 'hers' başka bir kişiye atıfta bulunur.","slug":"gri-mod-sat-g39-1-19","stem":"The manager himself admitted that the scheduling error was avoidable.  Which choice correctly uses a reflexive or intensive pronoun?","n":19,"choices":{"B":"his","A":"him","C":"himself","D":"hers"}},{"ans":"C","stem":"The students should ask whomever they see in the office for a copy of the form.  Which pronoun is correct?","why":"C doğrudur. 'Whomever they see in the office' gömülü cümlesinde zamir 'see'nin nesnesidir (they see whomever). Nesne formu: 'whomever.'  A — 'whoever' özne formu; burada zamir 'see'nin nesnesi.  B — 'who' basit özne formudur.  D — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır.","slug":"gri-mod-sat-g39-1-20","n":20,"choices":{"C":"whomever","D":"whom","B":"who","A":"whoever"}},{"ans":"A","why":"A doğrudur. 'It was she who discovered...' — resmi dilbilgisi standardı 'she' gerektirir çünkü ilgi yan cümlesinin öznesidir ('who discovered'). 'It was' den sonra 'to be' fiilinin tamamlayıcısı özne formunda olmalıdır.  B — 'her' nesne formu; resmi dilbilgisi özne formu gerektirir.  C — 'herself' dönüşlü/yoğunlaştırıcı; burada yanlış.  D — 'hers' iyelik zamiridir.","slug":"gri-mod-sat-g39-1-21","stem":"It was her who discovered the discrepancy in the financial records.  Which pronoun is correct?","n":21,"choices":{"A":"she","B":"her","C":"herself","D":"hers"}},{"ans":"C","why":"C doğrudur. 'Invited the finalist and her' — 'her' 'invited'ın nesnesidir. Test: 'the finalist and'ı çıkar → 'the committee invited her.' Nesne zamiri.  A — 'she' özne zamiridir; bu bir nesne konumudur.  B — 'herself' basit nesne zamirinin bileşik nesne konumunda yerini tutamaz.  D — 'hers' iyelik zamiridir.","slug":"gri-mod-sat-g39-1-22","stem":"The scholarship committee invited the finalist and her to present before the full board.  Which pronoun is correct?","n":22,"choices":{"D":"hers","C":"her","B":"herself","A":"she"}},{"choices":{"B":"themself","A":"themselves","D":"theirselves","C":"theirself"},"n":23,"why":"A doğrudur. 'The board members' çoğuldur — dönüşlü zamir çoğul olmalı: 'themselves.'  B — 'themself' tekil cinsiyet nötr dönüşlü zamir olarak kullanılabilir ama açıkça çoğul bir özne için yanlış.  C — 'theirself' standart İngilizcede yoktur.  D — 'theirselves' standart İngilizcede yoktur.","slug":"gri-mod-sat-g39-1-23","stem":"The board members expressed themself confidently during the press conference.  Which pronoun is correct?","ans":"A"},{"n":24,"choices":{"D":"she","C":"hers","A":"her","B":"herself"},"ans":"D","stem":"No one but she could have solved the problem in under two minutes.  Which pronoun is correct?","slug":"gri-mod-sat-g39-1-24","why":"D doğrudur. Bu yapıda 'but' 'except' anlamına gelir ve özne konumunda olduğundan SAT özne formu 'she'yi kabul eder. Test: 'she could have solved' (özne-fiil uyumu) → özne formu.  A — 'her' bir nesne konumunda kullanılırdı: 'No one but her was present' (nesne). Burada zamir 'could have solved'un anlaşılan öznesidir.  B — 'herself' dönüşlü; burada yanlış.  C — 'hers' iyelik zamiridir."},{"stem":"The firm promoted whoever the senior partners had unanimously endorsed for the partnership track.  Which pronoun is correct?","slug":"gri-mod-sat-g39-1-25","why":"A doğrudur. 'Whomever the senior partners had unanimously endorsed' gömülü cümlesinde zamir 'endorsed'ın nesnesidir (the senior partners endorsed whomever). Nesne formu: 'whomever.'  B — 'whoever' özne formu; burada zamir 'endorsed'ın nesnesidir.  C — 'who' basit özne formudur.  D — 'whom' basit nesne formu; gömülü cümlelerde 'whomever' kullanılır.","ans":"A","choices":{"C":"who","D":"whom","B":"whoever","A":"whomever"},"n":25}]}],"name":"Pronoun Case — Who/Whom & Reflexives","group":"Dilbilgisi","id":"g39","eyebrow":"Gramer"},{"id":"g310","group":"Dilbilgisi","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Mixed Grammar Review III. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"choices":{"B":"companies' its","A":"company's its","D":"companies its","C":"company's"},"n":1,"slug":"gri-mod-sat-g310-1-1","why":"C doğrudur. 'The company's new headquarters' — 'company's' iyeliği yeterlidir. 'Its' gereksiz ikinci iyelik oluşturur.  A — iki iyelik formu gereksizdir.  B — çoğul iyelik + gereksiz zamir.  D — çoğul ama iyelik işareti yok + gereksiz zamir.","stem":"The company's its new headquarters was designed by a renowned architect from Barcelona.  Which choice is correct?","ans":"C"},{"ans":"C","stem":"The report was criticized by whoever had read it most carefully — and that was her.  Which pronoun is correct?","why":"C doğrudur. 'Whoever had read it most carefully' — zamir 'had read'in öznesidir. Tüm cümle 'by' edatının ardından gelse de zamir kendi cümlesinde öznedir. 'Whoever' doğrudur.  A — 'whomever' nesne formu; burada zamir 'had read'in öznesidir — YANLIŞ. Bu soru öğrencilerin edattan sonra yanlışlıkla 'whomever' kullanıp kullanmadığını test ediyor.  B — 'who' gömülü cümle yapısında yetersiz.  D — 'whom' nesne formudur.","slug":"gri-mod-sat-g310-1-2","n":2,"choices":{"D":"whom","C":"whoever","B":"who","A":"whomever"}},{"choices":{"A":"has","B":"have","D":"were","C":"are"},"n":3,"slug":"gri-mod-sat-g310-1-3","why":"A doğrudur. 'Each' her zaman tekildir. 'Each of the participants has been assigned.' Edat öbeğini çıkarın.  B — 'have' 'participants'a uyuyor, özne 'each'e değil.  C — 'are' çoğul geniş zamandır.  D — 'were' geçmiş çoğuldur.","stem":"Each of the participants have been assigned to a different research group.  Which verb is correct?","ans":"A"},{"n":4,"choices":{"D":"not to be revealing","C":"to not reveal","A":"not revealing","B":"not to reveal"},"ans":"B","slug":"gri-mod-sat-g310-1-4","why":"B doğrudur. 'Advise someone to do something' — olumsuz mastar 'not'u 'to'dan önce koyar: 'advised the client not to reveal.'  A — 'not revealing' bu yapıda standart değildir.  C — 'to not reveal' bölünmüş mastar (split infinitive); 'not to reveal' tercih edilir.  D — 'not to be revealing' süregelen mastar gereksizdir.","stem":"The attorney advised the client not revealing any additional information to the opposing counsel.  Which verb form is correct?"},{"ans":"B","stem":"The data collected over five years suggest that dietary habits are more influential than previously assumed.  Which verb form is correct?","slug":"gri-mod-sat-g310-1-5","why":"B doğrudur. 'Data' modern SAT kullanımında tekil sayılır ('information' gibi). 'The data suggests.'  A — 'suggest' 'data'yı çoğul sayar — bazı akademik stillerde kabul edilebilir ama SAT 'data'yı tekil kullanır.  C — geniş zaman süregelen burada uygun değildir.  D — present perfect süregelen genel bir bulgu için uygun değildir.","n":5,"choices":{"A":"suggest","B":"suggests","D":"have been suggesting","C":"are suggesting"}},{"ans":"A","slug":"gri-mod-sat-g310-1-6","why":"A doğrudur. 'That the expedition team made' hangi keşif olduğunu belirten kısıtlayıcı yan cümledir. 'That' kullanılır; 'which' virgülsüz SAT'ta standart değildir.  B — 'which' virgülsüz kısıtlayıcı yan cümleler için SAT'ta standart değildir.  C — 'who' insanlara atıfta bulunur.  D — 'whose' iyelik formudur.","stem":"The discovery which the expedition team made was entirely unexpected.  Which relative pronoun is correct?","n":6,"choices":{"D":"whose","C":"who","B":"which","A":"that"}},{"n":7,"choices":{"C":"are","D":"was","B":"were","A":"is"},"ans":"C","stem":"Neither the new policy nor the existing regulations are sufficient to address the emerging issue.  Which verb is correct?","why":"C doğrudur. 'Neither...nor' yapısında en yakın özneyle uyuşulur. 'The existing regulations' çoğul → 'are.'  A — 'is' 'the new policy'ye uyuyor, en yakın 'existing regulations'a değil.  B — 'were' geçmiş çoğuldur.  D — 'was' geçmiş tekildir.","slug":"gri-mod-sat-g310-1-7"},{"slug":"gri-mod-sat-g310-1-8","n":8,"choices":{"D":"Moby-Dick, published in 1851, initially received","C":"Published in 1851, Moby-Dick's initial reviews were poor","B":"The novel, published in 1851, Moby-Dick initially received","A":"The novel published in 1851, Moby-Dick initially received"},"ans":"D","why":"D doğrudur. 'Moby-Dick, published in 1851, initially received...' — 'published in 1851' katılımcı öbeği nitelediği ismin (Moby-Dick) hemen yanında ve virgüllerle doğru şekilde kapatılmış.  A — 'The novel published in 1851, Moby-Dick' belirsiz appositive yapısı.  B — 'Moby-Dick'i appositive olarak sonraya koyuyor; garip.  C — 'Moby-Dick'in initial reviews were poor' özneyi ve sesi değiştiriyor.","stem":"The novel published in 1851, Moby-Dick initially received poor reviews from contemporary critics.  Which choice correctly handles the nonrestrictive element?"},{"n":9,"choices":{"A":"previous studies","B":"those of previous studies","D":"previous studies' conclusions","C":"that of previous studies"},"ans":"B","stem":"The study's conclusions are more persuasive than previous studies on the same topic.  Which revision corrects the faulty comparison?","why":"B doğrudur. 'Conclusions' (çoğul) çalışmalarla değil, önceki çalışmaların sonuçlarıyla karşılaştırılmalı. 'Those of previous studies' çoğuldur.  A — sonuçları çalışmalarla karşılaştırır — mantıksız.  C — 'that' tekildir; sonuçlar çoğuldur.  D — dilbilgisel olarak doğru ama B'den uzun.","slug":"gri-mod-sat-g310-1-9"},{"n":10,"choices":{"C":"the committee's decision was made","D":"the committee made a decision","B":"the decision was the committee's","A":"a decision was made by the committee"},"ans":"D","stem":"Having reviewed all the applications, a decision was made by the committee.  Which choice avoids the dangling modifier?","why":"D doğrudur. 'Having reviewed all the applications' komite tarafından yapılıyor. Ana cümle 'the committee' ile başlamalı.  A — 'a decision' başvuruları inceleyemez; sarkan belirteç (dangling modifier).  B — garip yapı; dilbilgisel olarak eşdeğer değil.  C — pasif; belirteç sorunu devam ediyor.","slug":"gri-mod-sat-g310-1-10"},{"choices":{"B":"having redesigned","A":"to redesign","D":"redesigning","C":"redesign"},"n":11,"why":"D doğrudur. 'Suggest' gerund alır: 'suggested redesigning.'  A — 'suggested to redesign' standart değildir.  B — 'having redesigned' önceden tamamlanmışlık ima eder.  C — 'suggest redesign' dilbilgisel değildir.","slug":"gri-mod-sat-g310-1-11","stem":"The engineer suggested to redesign the interface to reduce user errors.  Which verb form is correct?","ans":"D"},{"choices":{"C":"and also feasibility assessment","D":"in addition to feasibility","B":"and assessing the feasibility","A":"and the feasibility"},"n":12,"slug":"gri-mod-sat-g310-1-12","why":"A doğrudur. 'Both the cost and the feasibility' — paralel isim öbekleri.  B — 'both the cost and assessing the feasibility' ismi gerund öbeğiyle karıştırıyor; paralel değil.  C — 'also feasibility assessment' garip ve paralel değil.  D — 'in addition to' 'both...and' yapısını bozuyor.","stem":"The task force was asked to evaluate both the cost and assessing the feasibility of the proposed expansion.  Which choice maintains parallel structure?","ans":"A"},{"ans":"B","slug":"gri-mod-sat-g310-1-13","why":"B doğrudur. 'Whoever leaves the office last' — zamir 'leaves'in öznesidir. Özne formu: 'whoever.' Hem ana cümlenin öznesi hem de 'leaves'in öznesi olarak zamir kendi cümlesinde özne olduğundan belirleyici.  A — 'Whomever' nesne formu; burada zamir 'leaves'in öznesidir.  C — 'Whom' basit nesne formudur.  D — 'Who' basit özne formudur; gömülü cümlelerde 'whoever' kullanılır.","stem":"Whomever leaves the office last is responsible for locking up.  Which pronoun is correct?","n":13,"choices":{"B":"Whoever","A":"Whomever","D":"Who","C":"Whom"}},{"ans":"B","why":"B doğrudur. 'Who' insanlara atıfta bulunur. 'The professor who wrote the textbook' — profesör bir insandır; 'who' kullanılır.  A — 'which' nesnelere atıfta bulunur.  C — 'that' kısıtlayıcı yan cümlelerde insanlar için kullanılabilir ama 'who' tercih edilir.  D — 'whom' nesne formu; burada zamir 'wrote'un öznesidir.","stem":"The professor which wrote the textbook is retiring at the end of the academic year.  Which relative pronoun is correct?","n":14,"choices":{"B":"who","A":"which","C":"that","D":"whom"},"slug":"gri-mod-sat-g310-1-14"},{"stem":"The decision to not pursue the acquisition was supported by a majority of the board.  Which choice is correct?","slug":"gri-mod-sat-g310-1-15","why":"B doğrudur. 'The decision to not pursue' bölünmüş mastar (split infinitive) kullanır; modern İngilizce'de geniş çapta kabul edilmektedir.  A — 'not to pursue' geleneksel bölünmemiş form; da doğrudur.  C — 'pursue not' standart değildir.  D — 'not pursuing' gerund yapısını değiştirir.","ans":"B","choices":{"A":"not to pursue","B":"not pursue","C":"pursue not","D":"not pursuing"},"n":15},{"why":"C doğrudur. 'Everyone' cinsiyeti belirsiz tekil belirsiz zamirdir. SAT cinsiyet nötr tekil 'they/their' kullanımını kabul eder.  A — 'his' erkek cinsiyet varsayar.  B — 'her' kadın cinsiyet varsayar.  D — 'its' nesnelere atıfta bulunur.","slug":"gri-mod-sat-g310-1-16","stem":"Everyone on the committee is expected to bring their notes to the annual review session.  Which pronoun is correct?","ans":"C","choices":{"D":"its","C":"their","B":"her","A":"his"},"n":16},{"choices":{"D":"that of our competitors","C":"our competitors' records","A":"our competitors","B":"those of our competitors"},"n":17,"stem":"The company's environmental record is better than our competitors.  Which revision corrects the faulty comparison?","why":"D doğrudur. 'Environmental record' (tekil) rakiplerin çevre siciliyle karşılaştırılmalı. 'That of our competitors' = 'rakiplerimizin çevre sicili.'  A — sicili şirketlerle karşılaştırır — mantıksız.  B — 'those' çoğuldur; sicil tekildir.  C — dilbilgisel olarak doğru ama C'den uzun.","slug":"gri-mod-sat-g310-1-17","ans":"D"},{"n":18,"choices":{"A":"very unique","B":"extremely unique","D":"exceptionally one-of-a-kind","C":"unique"},"ans":"C","slug":"gri-mod-sat-g310-1-18","why":"C doğrudur. 'Unique' tek türünde anlamına gelir; 'very' veya 'extremely' ile nitelendirilemez. Mutlak sıfattır.  A — 'very unique' gereksiz tekrardır.  B — 'extremely unique' de gereksiz tekrardır.  D — 'one-of-a-kind' 'unique'in zaten söylediğini tekrar eder.","stem":"The board was very unique in its approach to governance, blending traditional oversight with innovative transparency measures.  Which choice is most concise and correct?"},{"ans":"A","why":"A doğrudur. 'Whose' iyelik ilgi zamiridir — 'whose report' = 'analistin raporu.' 'Who's' = 'who is' demektir; burada anlamsız olur.  B — 'who's' = 'who is'; 'the analyst, who is report' saçmadır.  C — 'whos' bir sözcük değildir.  D — 'whos'' bir sözcük değildir.","slug":"gri-mod-sat-g310-1-19","stem":"The analyst, who's report was leaked to the press, was placed on administrative leave.  Which word is correct?","n":19,"choices":{"A":"whose","B":"who's","C":"whos","D":"whos'"}},{"choices":{"B":"between each other","A":"between themselves","C":"among themselves","D":"with themselves"},"n":20,"slug":"gri-mod-sat-g310-1-20","why":"A doğrudur. 'Between themselves' iki birim için doğrudur. 'Between' iki şey için, 'among' üç veya daha fazla şey için kullanılır.  B — 'between each other' da kabul edilebilir ama biraz gayri resmi.  C — 'among themselves' üç veya daha fazla tarafı ima eder.  D — 'with themselves' deyimsel değildir.","stem":"The two divisions must coordinate between themselves to ensure consistent implementation of the policy.  Which choice is correct?","ans":"A"},{"choices":{"C":"whose","D":"which","A":"whom","B":"who"},"n":21,"stem":"The lab technician who the supervisor trained became the department's most reliable analyst.  Which relative pronoun is correct?","slug":"gri-mod-sat-g310-1-21","why":"A doğrudur. Yeniden yaz: 'the supervisor trained ___.' Zamir 'trained'ın nesnesidir — nesne formu 'whom' kullanılır.  B — 'who' özne formu; burada zamir nesne.  C — 'whose' iyelik formudur.  D — 'which' nesnelere atıfta bulunur.","ans":"A"},{"n":22,"choices":{"B":"the printer was out of ink","A":"the researcher discovered the printer was out of ink","D":"a lack of ink in the printer caused a delay","C":"it was discovered that the printer was out of ink"},"ans":"A","stem":"Having finished the draft, the printer was out of ink, which delayed the submission.  Which choice avoids the dangling modifier?","slug":"gri-mod-sat-g310-1-22","why":"A doğrudur. 'Having finished the draft' bir araştırmacı tarafından yapılıyor (ima edilmiş). Ana cümle o kişiyle başlamalı. 'The researcher discovered' sarkan belirteci düzeltiyor.  B — 'the printer' taslak bitiremez; sarkan belirteç.  C — 'it was discovered' taslak bitiremez; kişisiz özne.  D — 'a lack of ink' taslak bitiremez; sarkan belirteç."},{"n":23,"choices":{"D":"not accept","C":"not have accepted","B":"not to accept","A":"not accepting"},"ans":"D","slug":"gri-mod-sat-g310-1-23","why":"D doğrudur. 'Decided to' mastar alır: 'decided not to accept' veya 'decided to not accept.' Her iki durumda da yalın fiil kullanılır.  A — 'to not accepting' mastar işaretçisini gerundla karıştırıyor.  B — 'decided to not to accept' gereksiz çift 'to' olurdu; 'not to accept' 'decided'dan sonra standart değil.  C — 'not have accepted' önceden tamamlanmış eylemi ima eder.","stem":"The committee decided to not accepting any late applications for the grant cycle.  Which verb form is correct?"},{"ans":"C","stem":"The new regulations apply to all organizations which employ more than one hundred full-time workers.  Which relative pronoun is correct?","slug":"gri-mod-sat-g310-1-24","why":"C doğrudur. 'That employ more than one hundred full-time workers' hangi organizasyonları kapsadığını belirten kısıtlayıcı yan cümledir. 'That' kullanılır.  A — 'which' virgülsüz kısıtlayıcı yan cümleler için SAT'ta standart değildir.  B — 'who' insanlara atıfta bulunur; organizasyonlar tüzel kişiliklerdir.  D — 'whom' insanlar için nesne formudur.","n":24,"choices":{"B":"who","A":"which","C":"that","D":"whom"}},{"choices":{"C":"were","D":"has","A":"have","B":"are"},"n":25,"why":"D doğrudur. 'Each' her zaman tekildir. 'Each of the four seasons has its own distinct characteristics.'  A — 'have' 'seasons'a uyuyor, özne 'each'e değil.  B — 'are' çoğul geniş zamandır.  C — 'were' geçmiş çoğuldur.","stem":"Each of the four seasons have its own distinct characteristics that appeal to different preferences.  Which verb is correct?","ans":"D","slug":"gri-mod-sat-g310-1-25"}]}],"name":"Mixed Grammar Review III","eyebrow":"Gramer"},{"eyebrow":"Kelime","group":"Kelime","name":"Foundation Vocabulary","blocks":[{"t":"p","x":"SAT kelime â Foundation Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"items":[{"choices":{"D":"temporarily delay without permanent resolution","C":"study and document for future analysis","B":"completely solve through decisive action","A":"make something bad less severe or more tolerable"},"n":1,"stem":"The new urban policy was designed to ameliorate the housing shortage, providing subsidized units for low-income families while encouraging private developers to build in underserved neighborhoods.  As used in the text, \"ameliorate\" most nearly means:","slug":"gri-mod-sat-v1-1-1","why":"A is correct. The policy addresses the shortage by providing units — it makes the problem less severe. \"Ameliorate\" = to make something bad less severe.  A is too strong — completely solve overstates.  C = analyze, not remedy.  D = delay implies no actual improvement.  Kelime: ameliorate — iyileştirmek, hafifletmek","ans":"A"},{"choices":{"C":"poorly organized from the outset","D":"longer in duration than originally planned","A":"dangerous beyond all reasonable expectation","B":"requiring great effort and endurance; very difficult"},"n":2,"slug":"gri-mod-sat-v1-1-2","why":"B is correct. Steep terrain, shortages, three turning back = extreme difficulty requiring great effort. \"Arduous\" = requiring great effort; very difficult.  A — dangerous focuses on risk, not effort.  C — poor organization is a cause, not the definition.  D — longer duration alone is not what arduous means.  Kelime: arduous — çok güç, yorucu, zahmetli","stem":"The expedition proved far more arduous than the team had anticipated: the terrain was steep, supplies ran short, and three of the five climbers had to turn back before reaching base camp.  As used in the text, \"arduous\" most nearly means:","ans":"B"},{"n":3,"choices":{"D":"confirm through direct observation","C":"communicate clearly to the patient","B":"estimate with a reasonable degree of confidence","A":"find out with certainty; definitively establish"},"ans":"A","slug":"gri-mod-sat-v1-1-3","why":"A is correct. Tests to eliminate diagnoses = the goal is certainty. \"Ascertain\" = to find out definitely.  B — estimate implies uncertainty; ascertain implies certainty.  C — communicate is what happens after ascertaining.  D — direct observation is a method, not the definition.  Kelime: ascertain — kesinlikle öğrenmek, tespit etmek","stem":"Before recommending treatment, the physician needed to ascertain the precise cause of the symptoms, ordering a series of blood tests and imaging scans to eliminate possible diagnoses one by one.  As used in the text, \"ascertain\" most nearly means:"},{"stem":"The graduate student was known for her assiduous research habits: she arrived at the library when it opened, filled entire notebooks with primary source material, and never submitted work she considered incomplete.  As used in the text, \"assiduous\" most nearly means:","why":"C is correct. Early arrival, thorough notes, refusing to submit incomplete work = extremely diligent. \"Assiduous\" = showing great care and perseverance.  A — giftedness is separate from diligence.  B — caution implies reluctance; assiduous implies committed effort.  D — competitive motivation is not described.  Kelime: assiduous — çok çalışkan, gayretli, titiz","slug":"gri-mod-sat-v1-1-4","ans":"C","choices":{"D":"competitive and driven by external recognition","C":"extremely diligent and thorough","A":"intellectually gifted and highly creative","B":"cautious and unwilling to take risks"},"n":4},{"choices":{"A":"substantially change the direction of","B":"evaluate before deciding to expand","C":"add to in order to increase size or scope","D":"transform into a more effective structure"},"n":5,"why":"C is correct. Adding streams while preserving existing support = increasing what is already there. \"Augment\" = to add to; to make larger.  A — changing direction implies replacing, not augmenting.  B — evaluate describes a prior step, not augmentation itself.  D — transform implies fundamental structural change.  Kelime: augment — artırmak, büyütmek, genişletmek","slug":"gri-mod-sat-v1-1-5","stem":"The foundation chose to augment its existing grant program rather than replace it, adding funding streams for digital initiatives while preserving support for traditional community arts organizations.  As used in the text, \"augment\" most nearly means:","ans":"C"},{"slug":"gri-mod-sat-v1-1-6","n":6,"choices":{"B":"architecturally innovative in its use of natural materials","A":"severe in appearance and lacking comfort or decoration","D":"built to withstand harsh weather conditions","C":"intentionally closed to outside visitors"},"ans":"A","why":"A is correct. Bare stone, no cushions, single window = stripped of decoration and comfort. \"Austere\" = severely plain; lacking ornamentation.  B — innovative is not implied.  C — privacy describes access, not appearance.  D — durability describes structure, not aesthetic quality.  Kelime: austere — sade, gösterişsiz; sert, katı","stem":"The monastery's interior was deliberately austere: bare stone walls, wooden benches without cushions, and a single window letting in a shaft of morning light — nothing that might distract from prayer.  As used in the text, \"austere\" most nearly means:"},{"choices":{"D":"contradict with new information","C":"present in simplified form","B":"question or subject to scrutiny","A":"strengthen or reinforce"},"n":7,"why":"A is correct. Emphasizing consistency to increase the jury's confidence = reinforcing the evidence. \"Bolster\" = to support and strengthen.  B — question implies doubt; bolster implies support.  C — simplification is not what the argument does.  D — contradict is the opposite of bolster.  Kelime: bolster — güçlendirmek, desteklemek, pekiştirmek","slug":"gri-mod-sat-v1-1-7","stem":"The attorney's closing argument was designed to bolster the jury's confidence in the forensic evidence, dwelling on the consistency between the physical findings and the prosecution's timeline.  As used in the text, \"bolster\" most nearly means:","ans":"A"},{"stem":"The director's candid assessment surprised the board: rather than offering reassurance, she acknowledged the project's delays, identified specific management failures, and proposed concrete steps for recovery.  As used in the text, \"candid\" most nearly means:","why":"A is correct. Acknowledged delays and failures honestly rather than offering reassurance = straightforward, truthful. \"Candid\" = forthright and honest.  B — overly critical implies excessive negativity; candid is simply honest.  C — preliminary implies incompleteness.  D — brevity describes length, not honesty.  Kelime: candid — açık sözlü, dürüst, samimi","slug":"gri-mod-sat-v1-1-8","ans":"A","choices":{"B":"overly critical and lacking diplomatic sensitivity","A":"truthful and straightforwardly expressed","D":"brief and efficiently communicated","C":"preliminary and subject to revision"},"n":8},{"slug":"gri-mod-sat-v1-1-9","ans":"B","why":"B is correct. No commitments, careful language = considering implications before acting. \"Circumspect\" = wary; considering all circumstances before deciding.  A — deliberately misleading implies deception; circumspect implies honest caution.  C — unwilling to engage is too extreme.  D — legal procedure is not the basis described.  Kelime: circumspect — ihtiyatlı, temkinli, dikkatli","stem":"The negotiator remained circumspect throughout the early sessions, offering no firm commitments and carefully avoiding language that could be interpreted as binding before the full terms had been reviewed.  As used in the text, \"circumspect\" most nearly means:","n":9,"choices":{"C":"unwilling to engage under any conditions","D":"guided by strict adherence to legal procedure","B":"wary; taking all factors into consideration before acting","A":"deliberately vague in order to mislead"}},{"why":"C is correct. Data, clear logic, addressed counterarguments = persuasive and well-reasoned. \"Cogent\" = clear, logical, and convincing.  A — brevity is not what cogent describes.  B — complexity is separate; cogent implies clarity.  D — consistency with preferences describes reception, not reasoning quality.  Kelime: cogent — ikna edici, tutarlı, mantıklı","slug":"gri-mod-sat-v1-1-10","stem":"The committee found the proposal's arguments cogent: each claim was supported by specific data, the logical sequence was easy to follow, and anticipated counterarguments were addressed directly.  As used in the text, \"cogent\" most nearly means:","ans":"C","choices":{"A":"sufficiently brief to hold the committee's attention","B":"technically complex in its evidence","C":"persuasive and logically compelling","D":"consistent with the committee's prior preferences"},"n":10},{"choices":{"A":"excessively cautious about future projections","B":"overconfident and inattentive to potential risks","C":"satisfied with modest rather than ambitious targets","D":"preoccupied with internal disagreements"},"n":11,"stem":"After three consecutive profitable quarters, the management team grew complacent, assuming the conditions driving their success would persist indefinitely and investing little in anticipating change.  As used in the text, \"complacent\" most nearly means:","slug":"gri-mod-sat-v1-1-11","why":"B is correct. Assuming indefinite success + not anticipating change = overconfident, not alert to risks. \"Complacent\" = self-satisfied; uncritically at ease when there is risk.  A — excessive caution is the opposite of complacency.  C — modest ambition is different from neglecting risk.  D — internal disagreements are not described.  Kelime: complacent — kendinden memnun, umursamaz; riske karşı kayıtsız","ans":"B"},{"ans":"D","slug":"gri-mod-sat-v1-1-12","why":"D is correct. The author admits the chapter overstated while defending the thesis = reluctant partial acknowledgment. \"Concede\" = to admit that something is true, often reluctantly.  A — argue against is the opposite.  B — explain in detail describes clarification, not admission.  C — withdraw from circulation is not what concede means here.  Kelime: concede — kabul etmek, teslim olmak, itiraf etmek","stem":"The author conceded in her response to critics that the book's third chapter overstated the evidence, while maintaining that its central thesis remained sound.  As used in the text, \"conceded\" most nearly means:","n":12,"choices":{"D":"acknowledged reluctantly as true","C":"withdrew from circulation","B":"explained in greater detail","A":"argued persuasively against"}},{"ans":"C","stem":"The architect's use of bright red cladding made the building conspicuous even from a distance, ensuring that the new civic center would be immediately identifiable within the surrounding streetscape.  As used in the text, \"conspicuous\" most nearly means:","slug":"gri-mod-sat-v1-1-13","why":"C is correct. Identifiable from a distance = easily noticed, standing out. \"Conspicuous\" = readily visible; attracting attention.  A — controversial implies divided reaction; conspicuous simply means noticeable.  B — structural soundness is a different quality.  D — reflecting history describes intent, not visibility.  Kelime: conspicuous — göze çarpan, belirgin, dikkat çekici","n":13,"choices":{"D":"designed to reflect local architectural history","C":"visually distinctive; easily noticed","A":"aesthetically controversial among observers","B":"structurally sound despite its unusual design"}},{"slug":"gri-mod-sat-v1-1-14","stem":"The proposed redistricting plan proved deeply contentious, drawing opposition from residents, advocacy groups, and elected officials who disagreed sharply about which neighborhoods would be grouped together.  As used in the text, \"contentious\" most nearly means:","why":"D is correct. Multiple opposing groups, sharp disagreements = generating strong argument and conflict. \"Contentious\" = causing controversy; likely to be disputed.  A — legal problems are not mentioned.  B — technical complexity is a different issue.  C — misunderstanding is not what contentious describes.  Kelime: contentious — tartışmalı, çekişmeli, anlaşmazlık yaratan","ans":"D","choices":{"C":"widely misunderstood by the general public","D":"causing or likely to cause argument and disagreement","A":"legally problematic due to procedural errors","B":"technically complex and difficult to implement"},"n":14},{"ans":"D","slug":"gri-mod-sat-v1-1-15","why":"D is correct. The collaboration reached its highest point — the study was the final, defining outcome. \"Culminate\" = to reach the highest or final point; to end in a climax.  A — interrupted is the opposite.  B — expanded into a broader partnership describes continuation, not conclusion.  C — recognition describes reception, not what culminate means.  Kelime: culminate — doruğa ulaşmak, zirveye çıkmak, sonuçlanmak","stem":"The decade-long collaboration between the two research institutions culminated in a jointly published study that redefined the field's understanding of protein folding.  As used in the text, \"culminated\" most nearly means:","n":15,"choices":{"C":"was recognized by the broader scientific community","D":"reached its highest point; resulted in as a final outcome","B":"was expanded into a broader partnership","A":"was interrupted at a critical stage"}},{"slug":"gri-mod-sat-v1-1-16","why":"B is correct. Low literacy, systematic gaps, loss to disaster = scarcity of sources. \"Dearth\" = a scarcity or lack of something.  A — poor quality is different; the issue is that few sources exist.  C — disputed status is not mentioned.  D — restricted archives describes access problems, not quantity.  Kelime: dearth — kıtlık, yokluk, eksiklik","stem":"Researchers studying medieval public health were hampered by a dearth of documentary sources: literacy rates were low, records were rarely kept systematically, and most that had been created were lost to fire and flood.  As used in the text, \"dearth\" most nearly means:","ans":"B","choices":{"D":"inaccessibility due to restricted archives","C":"controversial or disputed status","A":"poor quality or unreliability","B":"scarcity or lack"},"n":16},{"ans":"C","stem":"The speaker's presentation style was diffuse, moving between anecdotes, statistics, and tangential observations without the organizing logic that would have tied these elements into a coherent argument.  As used in the text, \"diffuse\" most nearly means:","slug":"gri-mod-sat-v1-1-17","why":"C is correct. Moving between unconnected elements without organizing logic = spread out and lacking focus. \"Diffuse\" (adj.) = not concentrated; lacking clarity.  A — informal is not the issue; diffuse refers to lack of cohesion.  B — scope and time constraints are different issues.  D — enthusiasm without evidence is a different criticism.  Kelime: diffuse — yayılmış, dağınık; net olmayan","n":17,"choices":{"C":"spread out and lacking focus; not concentrated","D":"enthusiastic without sufficient supporting evidence","B":"ambitious in scope but limited in time","A":"deliberately informal and accessible to a general audience"}},{"n":18,"choices":{"C":"assess the monetary value of","D":"perceive or recognize with careful attention","A":"restore to its original condition","B":"document for preservation purposes"},"ans":"D","stem":"Only after studying the painting for s
