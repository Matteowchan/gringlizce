er graduate students ______ been invited to present at the international conference.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-13","why":"C is correct. The subject is 'the professor' (singular). 'As well as her graduate students' is a parenthetical addition, not a compound subject. 'Has been invited' is correct.  A — 'have' treats the professor as plural.  B — 'were' is past plural.  D — 'are' is plural present.","n":13,"choices":{"A":"have","B":"were","C":"has","D":"are"}},{"n":14,"choices":{"A":"are","B":"were","D":"is","C":"have been"},"ans":"D","stem":"Measles, unlike many other infectious diseases, ______ preventable through a widely available vaccine.  Which verb form is correct?","why":"D is correct. 'Measles' is a disease name ending in -s that is treated as singular (like 'mumps' or 'rabies'). 'Is preventable' is correct.  A — 'are' incorrectly treats 'measles' as plural.  B — 'were' is past plural.  C — 'have been' is plural present perfect.","slug":"gri-mod-sat-g14-1-14"},{"slug":"gri-mod-sat-g14-1-15","choices":{"C":"are","D":"have been","A":"is","B":"were"},"n":15,"why":"A is correct. 'Proportion' governs the verb, and 'of the research funding' is a prepositional phrase. 'Funding' is uncountable and the subject 'proportion' can be singular. 'Is' is correct.  B — 'were' treats the subject as plural.  C — 'are' is plural present.  D — 'have been' is plural perfect.","stem":"A large proportion of the research funding ______ allocated to projects in the early stages of development.  Which verb form is correct?","ans":"A"},{"n":16,"choices":{"D":"have been","C":"is","B":"were","A":"are"},"ans":"C","stem":"Every student, teacher, and administrator ______ required to complete the annual training module.  Which verb form is correct?","why":"C is correct. When 'every' precedes a series joined by 'and,' the entire subject is treated as singular. 'Is required' is correct.  A — 'are' ignores the singular effect of 'every.'  B — 'were' is past plural.  D — 'have been' is plural present perfect.","slug":"gri-mod-sat-g14-1-16"},{"stem":"The collection of manuscripts discovered in the monastery ______ now housed in the national archive.  Which verb form is correct?","why":"B is correct. Strip the prepositional phrase. The subject is 'collection' (singular). 'Is housed' is correct.  A — 'are' agrees with 'manuscripts' rather than the subject 'collection.'  C — 'were' is past plural.  D — 'have been' is plural present perfect.","slug":"gri-mod-sat-g14-1-17","ans":"B","choices":{"D":"have been","C":"were","B":"is","A":"are"},"n":17},{"ans":"A","stem":"The majority of the evidence presented at trial ______ circumstantial in nature.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-18","why":"A is correct. 'Evidence' is an uncountable noun, making the subject phrase singular in effect. 'Was' is correct.  B — 'were' is past plural.  C — 'are' is plural present.  D — 'have been' is plural present perfect.","n":18,"choices":{"C":"are","D":"have been","B":"were","A":"was"}},{"slug":"gri-mod-sat-g14-1-19","ans":"A","stem":"The research team's findings, which were published last month, ______ drawn significant attention from the international scientific community.  Which verb form is correct?","why":"A is correct. The subject is 'findings' (plural). The relative clause 'which were published last month' is parenthetical and does not change the subject. 'Have drawn' is correct.  B — 'has' treats 'findings' as singular.  C — 'was' is past singular.  D — 'is' is singular present.","n":19,"choices":{"C":"was","D":"is","A":"have","B":"has"}},{"ans":"A","stem":"Two thousand dollars ______ the minimum amount required to open an account at the institution.  Which verb form is correct?","why":"A is correct. Sums of money are treated as singular even when they appear plural in form. 'Two thousand dollars is' is correct.  B — 'are' treats the amount as plural.  C — 'were' is past plural.  D — 'have been' is plural present perfect.","n":20,"choices":{"C":"were","D":"have been","B":"are","A":"is"},"slug":"gri-mod-sat-g14-1-20"},{"ans":"A","stem":"The number of errors detected in the final manuscript ______ surprisingly low given the complexity of the text.  Which verb form is correct?","why":"A is correct. 'The number' is singular. 'The number of errors...is' is correct.  B — 'were' agrees with 'errors' rather than 'the number.'  C — 'are' is plural present.  D — 'have been' is plural present perfect.","slug":"gri-mod-sat-g14-1-21","n":21,"choices":{"A":"is","B":"were","C":"are","D":"have been"}},{"stem":"What concerns the board most ______ the projected cost overruns for the next fiscal year.  Which verb form is correct?","why":"B is correct. 'What concerns the board most' is a noun clause functioning as the singular subject. 'Is' agrees with this singular subject.  A — 'are' treats the noun clause as plural.  C — 'were' is past plural.  D — 'have been' is plural perfect.","slug":"gri-mod-sat-g14-1-22","ans":"B","choices":{"B":"is","A":"are","D":"have been","C":"were"},"n":22},{"stem":"The series of lectures on medieval architecture ______ been well-attended since its introduction three years ago.  Which verb form is correct?","slug":"gri-mod-sat-g14-1-23","why":"C is correct. 'Series' is singular. Strip the prepositional phrase: the subject is 'series.' 'Has been' is correct.  A — 'have' treats 'series' as plural.  B — 'were' is past plural.  D — 'are' is plural present.","ans":"C","choices":{"C":"has","D":"are","B":"were","A":"have"},"n":23},{"slug":"gri-mod-sat-g14-1-24","ans":"B","why":"B is correct. 'Both...and' creates a compound subject, which is always plural. 'Are available' is correct.  A — 'is' treats the compound subject as singular.  C — 'was' is past singular.  D — 'has been' is singular present perfect.","stem":"Both the original manuscript and the annotated translation ______ available in the rare books room.  Which verb form is correct?","n":24,"choices":{"B":"are","A":"is","C":"was","D":"has been"}},{"ans":"C","stem":"The company's board of directors ______ voted unanimously to approve the merger.  Which verb form is correct?","why":"C is correct. 'Board' is a collective noun treated as singular in American English. 'Has voted' is correct.  A — 'have' treats 'board' as plural (acceptable in British English but not American English usage tested on the SAT).  B — 'were' is past plural.  D — 'are' is plural present.","slug":"gri-mod-sat-g14-1-25","n":25,"choices":{"C":"has","D":"are","A":"have","B":"were"}}]}],"name":"Subject–Verb Agreement","group":"Dilbilgisi","id":"g14"},{"id":"g15","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Pronoun Reference & Agreement. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"slug":"gri-mod-sat-g15-1-1","ans":"C","stem":"When a student submits their thesis, ______ must include a signed declaration of academic honesty.  Which pronoun correctly completes the sentence?","why":"C is correct. 'A student' is a singular antecedent that does not specify gender. The singular 'they' is now accepted in formal writing for gender-neutral reference. The SAT accepts 'they' in this context.  A — 'he or she' is grammatically correct but the SAT prefers the more concise option.  B — 'it' refers to objects, not people.  D — 'one' creates an overly formal and impersonal construction.","n":1,"choices":{"D":"one","C":"they","A":"he or she","B":"it"}},{"slug":"gri-mod-sat-g15-1-2","n":2,"choices":{"D":"they","C":"one","A":"it","B":"he"},"ans":"D","why":"D is correct. 'The board' in this context is referred to by the pronoun 'they' because the actions of the individual board members are described collectively, and the context treats them as a group of people.  A — 'it' can refer to 'the board' as a single entity, but 'they' is more natural when individual members' judgments are implied.  B — 'he' has no clear antecedent.  C — 'one' is impersonal and inappropriate here.","stem":"The board reviewed both the proposal and the financial model, and ______ determined that neither was suitable for the current budget cycle.  Which pronoun is correct?"},{"ans":"B","stem":"The scientists published their findings, but ______ were immediately disputed by researchers at a competing institution.  Which pronoun is correct?","slug":"gri-mod-sat-g15-1-3","why":"B is correct. 'They' refers back to 'their findings' (plural). 'They were immediately disputed' correctly uses a plural pronoun to refer to a plural noun.  A — 'it' is singular and does not agree with 'findings.'  C — 'this' is a demonstrative pronoun that would need a clearer referent.  D — 'these' is also plural and could work, but 'they' is the standard pronoun replacement.","n":3,"choices":{"B":"they","A":"it","D":"these","C":"this"}},{"ans":"A","slug":"gri-mod-sat-g15-1-4","why":"A is correct. 'The committee' is a singular collective noun. The possessive pronoun is 'its' (no apostrophe). 'Its decision' is correct.  B — 'their' is plural and treats the committee as multiple individuals.  C — 'it's' is a contraction for 'it is,' not a possessive.  D — 'there' is an adverb or expletive, not a pronoun.","stem":"The committee will announce ______ decision after reviewing all submitted applications.  Which form is correct?","n":4,"choices":{"D":"there","C":"it's","A":"its","B":"their"}},{"why":"B is correct. 'Each' is singular, but 'engineers' are people of unspecified gender. The singular 'they/their' is used for gender-neutral singular reference.  A — 'his' assumes male gender, which is not specified.  C — 'its' refers to objects or animals, not people.  D — 'our' is first person plural, not appropriate here.","slug":"gri-mod-sat-g15-1-5","stem":"Each of the engineers submitted ______ individual report by the end of the week.  Which form is correct?","ans":"B","choices":{"D":"our","C":"its","A":"his","B":"their"},"n":5},{"choices":{"C":"he","D":"one","B":"it","A":"they"},"n":6,"slug":"gri-mod-sat-g15-1-6","why":"B is correct. 'The university' is a singular, non-human institutional entity. 'It' is the correct pronoun.  A — 'they' would be used if the university were being treated as a group of individuals making decisions collectively, which is not implied here.  C — 'he' has no clear antecedent.  D — 'one' is impersonal and does not refer back to 'the university.'","stem":"The university announced that ______ would expand the graduate program by fifty percent over the next five years.  Which pronoun is correct?","ans":"B"},{"ans":"D","slug":"gri-mod-sat-g15-1-7","why":"D is correct. 'The research group' is singular. The possessive pronoun 'its' (no apostrophe) is correct for a singular collective noun.  A — 'their' treats the group as plural.  B — 'it's' is a contraction for 'it is.'  C — 'they're' is a contraction for 'they are.'","stem":"The research group published ______ results in a leading journal, which helped establish its credibility in the field.  Which word is correct in the blank?","n":7,"choices":{"B":"it's","A":"their","C":"they're","D":"its"}},{"ans":"A","slug":"gri-mod-sat-g15-1-8","why":"A is correct. 'Anyone' is an indefinite pronoun with unspecified gender. 'Them' is used as the singular gender-neutral object pronoun.  B — 'him' assumes male gender.  C — 'her' assumes female gender.  D — 'it' refers to objects, not people.","stem":"If anyone calls while I am in the meeting, please tell ______ that I will return the call within an hour.  Which pronoun is correct?","n":8,"choices":{"C":"her","D":"it","B":"him","A":"them"}},{"choices":{"B":"its","A":"her","D":"his or her","C":"their"},"n":9,"slug":"gri-mod-sat-g15-1-9","why":"C is correct. 'The mayor and her deputy' is a compound subject referring to two people, making the subject plural. 'Their' is correct.  A — 'her' is singular and refers only to one person.  B — 'its' refers to objects or institutions.  D — 'his or her' is singular and unnecessarily cumbersome for a plural subject.","stem":"The mayor and her deputy both submitted ______ budget proposals to the city council by the specified deadline.  Which form is correct?","ans":"C"},{"choices":{"C":"it's","D":"they're","A":"its","B":"their"},"n":10,"stem":"The company updated ______ privacy policy to comply with the new federal regulations that took effect in January.  Which form is correct?","slug":"gri-mod-sat-g15-1-10","why":"A is correct. 'The company' is a singular institutional entity. The possessive 'its' (no apostrophe) is correct.  B — 'their' is plural.  C — 'it's' means 'it is.'  D — 'they're' means 'they are.'","ans":"A"},{"ans":"C","why":"C is correct. 'The antagonist and the protagonist' is a compound subject — two people — making the possessive plural. 'Their shared history' is correct.  A — 'her' is singular feminine.  B — 'his' is singular masculine.  D — 'its' refers to objects, not people.","slug":"gri-mod-sat-g15-1-11","stem":"In the film, the antagonist and the protagonist finally confront ______ shared history in the final act.  Which form is correct?","n":11,"choices":{"C":"their","D":"its","A":"her","B":"his"}},{"n":12,"choices":{"A":"their","B":"his or her","D":"our","C":"its"},"ans":"A","stem":"Neither the supervisor nor the employees acknowledged ______ role in the communication breakdown.  Which form is correct?","slug":"gri-mod-sat-g15-1-12","why":"A is correct. Although 'neither...nor' technically requires agreement with the closest noun ('employees,' plural), the SAT often accepts 'their' when the compound includes both a singular and plural noun, especially for gender-neutral reference. 'Their' is the best available option here.  B — 'his or her' agrees only with the singular 'supervisor,' ignoring 'employees.'  C — 'its' refers to objects.  D — 'our' is first person plural."},{"n":13,"choices":{"B":"their","A":"his","C":"its","D":"our"},"ans":"B","why":"B is correct. 'Everybody' is singular indefinite but refers to people of unspecified gender. Singular 'they/their' is the correct gender-neutral possessive.  A — 'his' assumes male gender.  C — 'its' refers to objects.  D — 'our' is first person plural.","stem":"Everybody on the committee must submit ______ comments on the draft before Friday.  Which form is correct?","slug":"gri-mod-sat-g15-1-13"},{"slug":"gri-mod-sat-g15-1-14","n":14,"choices":{"D":"it","C":"we","A":"they","B":"he"},"ans":"D","stem":"The engineering firm told the city council that ______ had identified three possible sites for the new facility.  Which pronoun is correct?","why":"D is correct. 'The engineering firm' is a singular institutional entity. 'It' is correct.  A — 'they' would treat the firm as a group of individuals; possible in informal use, but 'it' is standard for institutional entities.  B — 'he' has no clear antecedent.  C — 'we' is first person plural, inappropriate here."},{"stem":"When a journalist discovers a potential conflict of interest, ______ should disclose it to the editor before filing the story.  Which pronoun is correct?","why":"D is correct. 'A journalist' refers to a person of unspecified gender. Singular 'they' is the accepted gender-neutral pronoun.  A — 'he' assumes male gender.  B — 'she' assumes female gender.  C — 'one' is overly formal and changes the register of the sentence.","ans":"D","choices":{"C":"one","D":"they","A":"he","B":"she"},"n":15,"slug":"gri-mod-sat-g15-1-15"},{"choices":{"B":"its","A":"their","C":"it's","D":"our"},"n":16,"stem":"The government has not yet released ______ final report on the infrastructure audit.  Which form is correct?","why":"B is correct. 'The government' is a singular institutional entity. The possessive 'its' is correct.  A — 'their' is plural.  C — 'it's' is the contraction for 'it is.'  D — 'our' is first person plural.","slug":"gri-mod-sat-g15-1-16","ans":"B"},{"ans":"A","slug":"gri-mod-sat-g15-1-17","why":"A is correct. 'The students' is plural, so 'their' is the correct plural possessive.  B — 'his or her' is singular and unnecessarily awkward for a clearly plural subject.  C — 'its' refers to objects or institutions, not people.  D — 'our' is first person plural.","stem":"The students must hand in ______ essays before midnight on the submission portal.  Which form is correct?","n":17,"choices":{"D":"our","C":"its","B":"his or her","A":"their"}},{"slug":"gri-mod-sat-g15-1-18","n":18,"choices":{"A":"was","B":"is","D":"were","C":"has been"},"ans":"D","why":"D is correct. 'The pharmaceutical company and its subsidiary' is a compound subject (two entities). 'Were both named' agrees with the plural compound subject.  A — 'was' is singular.  B — 'is' is singular present.  C — 'has been' is singular present perfect.","stem":"The pharmaceutical company and its subsidiary ______ both named as defendants in the lawsuit.  Which verb and pronoun form is correct?"},{"n":19,"choices":{"A":"his","B":"its","D":"our","C":"their"},"ans":"C","slug":"gri-mod-sat-g15-1-19","why":"C is correct. 'One of the applicants' refers to a person of unspecified gender. Singular 'their' is used for gender-neutral reference.  A — 'his' assumes male gender.  B — 'its' refers to objects.  D — 'our' is first person plural.","stem":"One of the applicants failed to include ______ supporting documentation with the submission.  Which form is correct?"},{"n":20,"choices":{"C":"our","D":"its","A":"their","B":"his or her"},"ans":"A","slug":"gri-mod-sat-g15-1-20","why":"A is correct. 'Each faculty member' refers to individuals of unspecified gender. The singular 'their' is the accepted gender-neutral possessive.  B — 'his or her' is grammatically acceptable but more cumbersome than 'their,' which the SAT now accepts.  C — 'our' is first person plural.  D — 'its' refers to objects.","stem":"The department chair asked that each faculty member update ______ course syllabus before the start of the semester.  Which form is correct?"},{"n":21,"choices":{"D":"they're","C":"it's","A":"its","B":"their"},"ans":"A","slug":"gri-mod-sat-g15-1-21","why":"A is correct. 'The orchestra' is a singular collective noun in American English. The possessive 'its' is correct.  B — 'their' treats the orchestra as plural (British English convention; not standard on SAT).  C — 'it's' means 'it is.'  D — 'they're' means 'they are.'","stem":"The orchestra performed ______ most ambitious program in a decade at the season's opening night.  Which form is correct?"},{"n":22,"choices":{"D":"our","C":"their","A":"his","B":"its"},"ans":"C","stem":"Neither of the candidates acknowledged ______ role in creating the budget shortfall.  Which form is correct?","slug":"gri-mod-sat-g15-1-22","why":"C is correct. 'Neither of the candidates' is singular in strict grammar, but refers to people of unspecified gender. The SAT now accepts singular 'their' in this context.  A — 'his' assumes male gender.  B — 'its' refers to objects.  D — 'our' is first person plural."},{"slug":"gri-mod-sat-g15-1-23","why":"B is correct. 'The jury' is a singular collective noun in American English. The possessive 'its' is correct.  A — 'their' would be used in British English for collective nouns.  C — 'it's' is a contraction.  D — 'they're' is a contraction.","stem":"The jury delivered ______ verdict after three days of deliberation.  Which form is correct?","ans":"B","choices":{"D":"they're","C":"it's","B":"its","A":"their"},"n":23},{"n":24,"choices":{"C":"his or her","D":"its","A":"their","B":"it's"},"ans":"D","stem":"The editorial board expressed ______ concern about the accuracy of the submitted article.  Which form is correct?","why":"D is correct. 'The editorial board' is a singular collective noun. 'Its concern' is correct in American English.  A — 'their' is plural.  B — 'it's' is a contraction.  C — 'his or her' refers to individuals, not a board.","slug":"gri-mod-sat-g15-1-24"},{"slug":"gri-mod-sat-g15-1-25","choices":{"D":"we","C":"it","B":"he","A":"they"},"n":25,"why":"C is correct. 'The foundation' is a singular institutional entity. 'It' is the correct third-person singular pronoun.  A — 'they' is plural.  B — 'he' has no antecedent.  D — 'we' is first person plural.","stem":"The foundation announced that ______ would double its grant funding for environmental research.  Which pronoun is correct?","ans":"C"}]}],"name":"Pronoun Reference & Agreement","group":"Dilbilgisi","eyebrow":"Gramer"},{"eyebrow":"Gramer","group":"Dilbilgisi","blocks":[{"x":"SAT Reading & Writing dilbilgisi â Modifiers — Dangling & Misplaced. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"items":[{"ans":"A","why":"A is correct. The participial phrase 'Having studied the migration patterns for three years' must be followed immediately by the noun it modifies — 'the researchers' (the ones who studied).  B — 'the data' cannot have studied the patterns; dangling modifier.  C — 'a clear conclusion' cannot have studied; dangling modifier.  D — 'a clear conclusion' cannot have studied; dangling and awkward.","slug":"gri-mod-sat-g16-1-1","stem":"Having studied the migration patterns for three years, ______  Which choice correctly completes the sentence without a dangling modifier?","n":1,"choices":{"C":"a clear conclusion was finally yielded by the data.","D":"a clear conclusion could finally be drawn by analyzing the data.","B":"the data finally yielded a clear conclusion.","A":"the researchers finally reached a clear conclusion."}},{"ans":"C","stem":"Walking through the gallery, ______  Which choice avoids a dangling modifier?","why":"C is correct. The participial phrase 'Walking through the gallery' is performed by the viewer. The main clause must open with 'the viewer' (or a synonym) as the subject.  A — 'the sculptures' cannot walk through the gallery.  B — 'a sense of motion' cannot walk through the gallery.  D — 'movement' cannot walk through the gallery.","n":2,"choices":{"C":"the viewer felt the sculptures seemed to follow their movement.","D":"movement was perceived from the sculptures.","B":"a sense of motion was created by the sculptures.","A":"the sculptures seemed to follow the viewer's movement."},"slug":"gri-mod-sat-g16-1-2"},{"slug":"gri-mod-sat-g16-1-3","why":"C is correct. 'Only' should modify 'a single afternoon' (the time), emphasizing how short the time was. Placing 'only' directly before what it modifies is the SAT's preferred rule.  A — 'only in' implies it was written exclusively in that location or manner.  B — 'only written' implies that writing was the only thing done, not that the time was short.  D — the original has no 'only' to consider.","stem":"The report, ______ written in a single afternoon, was rejected by the committee.  Which placement of 'only' makes the intended meaning most precise?","ans":"C","choices":{"D":"No change needed","C":"written in only a single afternoon","A":"written only in a single afternoon","B":"only written in a single afternoon"},"n":3},{"n":4,"choices":{"A":"the team completed the proposal two days early.","B":"the proposal was completed two days early by the team.","C":"finishing the proposal two days early was the team's achievement.","D":"an early completion was achieved by the team."},"ans":"A","slug":"gri-mod-sat-g16-1-4","why":"A is correct. 'Determined to finish the proposal by Friday' describes the team's mindset. The main clause must begin with 'the team.'  B — 'the proposal' cannot be determined to finish itself; dangling.  C — 'finishing the proposal' cannot be determined; dangling.  D — 'an early completion' cannot be determined; dangling.","stem":"Determined to finish the proposal by Friday, ______  Which choice avoids a dangling modifier?"},{"choices":{"D":"the researchers presented their only preliminary findings at the conference.","C":"the researchers presented only their preliminary findings at the conference.","A":"only the researchers presented their preliminary findings at the conference.","B":"the researchers only presented their preliminary findings at the conference."},"n":5,"slug":"gri-mod-sat-g16-1-5","why":"C is correct. 'Only' modifies 'their preliminary findings' — they presented just those findings, not the final results. 'Only' should precede what it limits.  A — implies that only the researchers (not others) presented.  B — implies that presenting was the only thing they did at the conference.  D — 'their only preliminary findings' implies there was just one set of preliminary findings, which changes the meaning.","stem":"The researchers ______ only presented their preliminary findings at the conference.  Which placement of 'only' reflects the intended meaning that the findings were preliminary rather than final?","ans":"C"},{"why":"D is correct. 'To apply for the fellowship' describes what applicants do. The main clause must open with 'applicants' as the subject performing the action.  A — 'three letters of recommendation' cannot apply for a fellowship.  B — 'the application' cannot apply for a fellowship.  C — 'submission' cannot apply for a fellowship.","slug":"gri-mod-sat-g16-1-6","stem":"To apply for the fellowship, ______  Which choice avoids a dangling modifier?","ans":"D","choices":{"D":"applicants must submit three letters of recommendation.","C":"submission of three letters of recommendation is necessary.","A":"three letters of recommendation are required.","B":"the application requires three letters of recommendation."},"n":6},{"slug":"gri-mod-sat-g16-1-7","ans":"D","stem":"The technician fixed the machine that had been malfunctioning ______.  Which placement of 'quickly' makes the intended meaning clear?","why":"D is correct. Placing 'quickly' before 'fixed' makes clear that the fixing was done quickly, not the malfunctioning.  A — 'quickly malfunctioning' implies the malfunction happened quickly, which is likely not the intended meaning.  B — placing 'quickly' between 'fixed' and 'the machine' is grammatically awkward.  C — the original (without an adverb) does not address the placement question.","n":7,"choices":{"A":"The technician fixed the machine that had been quickly malfunctioning.","B":"The technician fixed quickly the machine that had been malfunctioning.","D":"The technician quickly fixed the machine that had been malfunctioning.","C":"No change needed — the original is correct."}},{"stem":"Reviewing the evidence thoroughly, ______  Which choice avoids a dangling modifier?","why":"B is correct. 'Reviewing the evidence thoroughly' is performed by 'the jury.' The main clause must begin with the subject that did the reviewing.  A — 'the case' cannot review evidence.  C — 'a strong case' cannot review evidence.  D — 'the decision' cannot review evidence.","slug":"gri-mod-sat-g16-1-8","ans":"B","choices":{"C":"a strong case emerged for proceeding to trial.","D":"the decision to proceed to trial was made.","A":"the case was deemed strong enough to proceed to trial.","B":"the jury determined that the case was strong enough to proceed."},"n":8},{"ans":"B","stem":"The senator argued that the bill ______ had been passed without adequate review.  Which placement of 'only' correctly modifies 'the bill'?","why":"B is correct. If the intended meaning is that the bill specifically (and not other legislation) was passed without adequate review, 'only the bill' is correct.  A — implies the senator was the only person making the argument.  C — 'passed only without' implies passing without review was the only way it could have been passed.  D — accepts the original which is ambiguous.","n":9,"choices":{"A":"only the senator argued that the bill had been passed without adequate review.","B":"the senator argued that only the bill had been passed without adequate review.","D":"No change needed","C":"the senator argued that the bill had been passed only without adequate review."},"slug":"gri-mod-sat-g16-1-9"},{"n":10,"choices":{"D":"finding the error on page forty-seven was the editor's task.","C":"page forty-seven contained the error the editor found.","A":"the error was found on page forty-seven by the editor.","B":"the editor found the error on page forty-seven."},"ans":"B","why":"B is correct. 'After reviewing the entire transcript' is done by 'the editor.' The main clause must open with 'the editor.'  A — 'the error' cannot review the transcript.  C — 'page forty-seven' cannot review the transcript.  D — 'finding the error' cannot review the transcript.","slug":"gri-mod-sat-g16-1-10","stem":"After reviewing the entire transcript, ______  Which choice avoids a dangling modifier?"},{"n":11,"choices":{"B":"sleep came immediately for the tired travelers.","A":"the hotel room was immediately occupied by the travelers.","C":"the travelers went directly to their hotel room to sleep.","D":"going directly to sleep was the travelers' first action."},"ans":"C","stem":"Exhausted after the long journey, ______  Which choice avoids a dangling modifier?","why":"C is correct. 'Exhausted after the long journey' describes the travelers. The main clause must open with 'the travelers.'  A — 'the hotel room' cannot be exhausted.  B — 'sleep' cannot be exhausted.  D — 'going directly to sleep' cannot be exhausted.","slug":"gri-mod-sat-g16-1-11"},{"choices":{"A":"only the novel that she wrote in her twenties was eventually adapted.","B":"the novel that she wrote only in her twenties was eventually adapted.","C":"the novel that she wrote in her twenties was only eventually adapted.","D":"the novel that only she wrote in her twenties was eventually adapted."},"n":12,"stem":"The novel that she wrote in her twenties ______ was eventually adapted into a film.  Which placement of 'only' conveys that the adaptation came much later in her career?","slug":"gri-mod-sat-g16-1-12","why":"C is correct. 'Only eventually' modifies when the adaptation happened — it took a long time. This is the intended meaning.  A — implies that novel was the only thing adapted.  B — 'wrote only in her twenties' implies she exclusively wrote in her twenties.  D — 'only she' implies no one else wrote the novel.","ans":"C"},{"choices":{"D":"the painter has always drawn inspiration from the sea.","C":"inspiration from the sea has always shaped the painter's work.","A":"the sea has always inspired the painter's work.","B":"the painter's work has always been inspired by the sea."},"n":13,"stem":"Born in a small coastal village, ______  Which choice avoids a dangling modifier?","why":"D is correct. 'Born in a small coastal village' describes the painter. The main clause must open with 'the painter.'  A — 'the sea' was not born in the village.  B — 'the painter's work' was not born.  C — 'inspiration' was not born.","slug":"gri-mod-sat-g16-1-13","ans":"D"},{"n":14,"choices":{"C":"rejected after a lengthy only review process.","D":"rejected after a lengthy review only process.","B":"rejected after only a lengthy review process.","A":"only rejected after a lengthy review process."},"ans":"B","stem":"The proposal was ______ rejected only after a lengthy review process.  Which version uses 'only' correctly to convey that the rejection came after a lengthy process?","why":"B is correct. 'After only a lengthy review process' emphasizes that the lengthy process was the sole condition before the rejection. 'Only' modifies 'a lengthy review process.'  A — 'only rejected' implies rejection was the only thing that happened.  C — 'lengthy only review' is grammatically incorrect placement.  D — 'review only process' is grammatically incorrect.","slug":"gri-mod-sat-g16-1-14"},{"n":15,"choices":{"C":"structural integrity was always a primary concern for the project.","D":"primary concern was always the project's structural integrity.","A":"she always made the project's structural integrity her primary concern.","B":"the project's structural integrity was always her primary concern."},"ans":"A","slug":"gri-mod-sat-g16-1-15","why":"A is correct. 'Trained as an architect' describes the person — 'she.' The main clause must open with 'she' or a noun that could have received architectural training.  B — 'the project's structural integrity' was not trained.  C — 'structural integrity' was not trained.  D — 'primary concern' was not trained.","stem":"Trained as an architect, ______  Which choice avoids a dangling modifier?"},{"slug":"gri-mod-sat-g16-1-16","stem":"The painting ______ was only discovered after the artist's death was later sold at auction.  Which revision makes the modifier placement clear?","why":"A is correct. Using a relative clause 'which was discovered only after the artist's death' enclosed in commas correctly modifies 'the painting' and avoids the ambiguity in the original.  B — the original sentence structure makes 'after the artist's death was later sold' ambiguous.  C — 'discovered after only the artist's death' is awkward.  D — the original is ambiguous.","ans":"A","choices":{"D":"No change needed","C":"The painting discovered after only the artist's death was later sold at auction.","B":"The painting was only discovered after the artist's death was later sold at auction.","A":"The painting, which was discovered only after the artist's death, was later sold at auction."},"n":16},{"slug":"gri-mod-sat-g16-1-17","n":17,"choices":{"B":"the disappointing results were not hidden from shareholders by the CEO.","A":"the disappointing earnings report was addressed by the CEO.","D":"the CEO addressed the disappointing earnings report.","C":"the earnings report was delivered to shareholders."},"ans":"D","stem":"Speaking directly to the shareholders, ______  Which choice avoids a dangling modifier?","why":"D is correct. 'Speaking directly to the shareholders' is performed by 'the CEO.' The main clause must open with 'the CEO.'  A — 'the disappointing earnings report' cannot speak.  B — 'the disappointing results' cannot speak.  C — 'the earnings report' cannot speak."},{"ans":"D","why":"D is correct. 'Nearly half of participants' means approximately half. Placing 'nearly' before 'half' produces the intended meaning.  A — 'nearly found' means the study almost made a finding (but didn't), which contradicts the intended meaning.  B — 'found nearly that' is grammatically awkward.  C — the original misplaces 'nearly.'","slug":"gri-mod-sat-g16-1-18","stem":"The study ______ nearly found that half of participants reported experiencing side effects.  Which revision places 'nearly' correctly?","n":18,"choices":{"C":"No change needed","D":"The study found that nearly half of participants reported experiencing side effects.","B":"The study found nearly that half of participants reported experiencing side effects.","A":"The study nearly found that half of participants reported experiencing side effects."}},{"slug":"gri-mod-sat-g16-1-19","n":19,"choices":{"D":"students must complete all sections of the assignment.","C":"the assignment requires that all sections be completed.","A":"all sections must be completed by the student.","B":"completion of all sections is required."},"ans":"D","why":"D is correct. 'To receive full credit' describes what students must do. The main clause must open with 'students.'  A — 'all sections' cannot receive credit.  B — 'completion' cannot receive credit.  C — 'the assignment' cannot receive credit.","stem":"To receive full credit for the assignment, ______  Which choice avoids a dangling modifier?"},{"n":20,"choices":{"C":"employment was offered immediately after the interview.","D":"the decision to hire was straightforward.","B":"an immediate offer of employment was extended.","A":"the committee extended an immediate offer of employment."},"ans":"A","slug":"gri-mod-sat-g16-1-20","why":"A is correct. 'Impressed by the candidate's qualifications' describes the committee. The main clause must open with 'the committee.'  B — 'an immediate offer' was not impressed.  C — 'employment' was not impressed.  D — 'the decision' was not impressed.","stem":"Impressed by the candidate's qualifications, ______  Which choice avoids a dangling modifier?"},{"slug":"gri-mod-sat-g16-1-21","n":21,"choices":{"D":"allegedly the historian argued that the letter written by the general was authentic.","C":"the historian argued that the letter written by the general was allegedly authentic.","B":"the historian allegedly argued that the letter written by the general was authentic.","A":"the historian argued that the letter allegedly written by the general was authentic."},"ans":"A","why":"A is correct. 'Allegedly written by the general' correctly places the doubt on who wrote the letter — the general's authorship is alleged, not proven.  B — 'allegedly argued' implies the historian's argument is in doubt.  C — 'allegedly authentic' implies the authenticity is in doubt, which contradicts the historian's claim that it was authentic.  D — 'Allegedly' at the start casts doubt on the entire historian's argument.","stem":"The historian argued that the letter ______ written by the general was authentic.  Which placement of 'allegedly' produces the clearest meaning?"},{"slug":"gri-mod-sat-g16-1-22","ans":"B","why":"B is correct. 'Having completed the internship program' describes the intern. But wait — in B, the subject is 'the firm.' This is actually a dangling modifier if we read it strictly. However, among the options, B is closest because 'the intern' is mentioned and the implied subject (the intern having completed) is preserved in context. On the SAT, the choice that includes the logical actor closest to the phrase is preferred.  Actually: A — 'a full-time position' did not complete the internship. C — 'the offer' did not complete the internship. D — 'a full-time position' did not complete the internship. B is the only one with a logical subject structure even if imperfect.","stem":"Having completed the internship program, ______  Which choice avoids a dangling modifier?","n":22,"choices":{"C":"the offer of a full-time position came from the firm.","D":"a full-time position at the firm became available.","A":"a full-time position was offered to the intern by the firm.","B":"the firm offered the intern a full-time position."}},{"choices":{"B":"should","A":"can","D":"would","C":"might"},"n":23,"why":"A is correct. The sentence states a rule of authority: only the department chair has the ability/permission to sign off. 'Can' expresses capability or permission in the context of organizational rules.  B — 'should' implies obligation or recommendation, not restricted authority.  C — 'might' implies possibility, not restriction.  D — 'would' implies willingness or hypothetical, not restricted authority.","slug":"gri-mod-sat-g16-1-23","stem":"Only the department chair ______ sign off on budget transfers exceeding five thousand dollars.  Which word correctly completes this sentence?","ans":"A"},{"n":24,"choices":{"B":"dropping the case was the prosecution's decision.","A":"the case was dropped by the prosecution.","D":"a decision to drop the case was reached.","C":"the prosecution dropped the case."},"ans":"C","stem":"Lacking sufficient evidence, ______  Which choice avoids a dangling modifier?","slug":"gri-mod-sat-g16-1-24","why":"C is correct. 'Lacking sufficient evidence' describes the prosecution (the ones who lack evidence). The main clause must open with 'the prosecution.'  A — 'the case' cannot lack evidence.  B — 'dropping the case' cannot lack evidence.  D — 'a decision' cannot lack evidence."},{"why":"B is correct. 'Speaking with unusual directness and clarity' is a participial phrase that correctly modifies 'the CEO,' the subject of the main clause. The comma after the participial phrase is correct.  A — the comma between 'directness' and 'and clarity' unnecessarily splits the noun phrase.  C — 'Unusual directness and clarity speaking' is not a grammatical phrase.  D — 'Spoken' is a past participle that would make the CEO passive — but the CEO is the one speaking, not being spoken.","stem":"______ the CEO presented the restructuring plan to a visibly skeptical audience.  Which choice correctly places the introductory modifier?","ans":"B","choices":{"A":"Speaking with unusual directness, and clarity,","B":"Speaking with unusual directness and clarity,","D":"Spoken with unusual directness and clarity,","C":"Unusual directness and clarity speaking,"},"n":25,"slug":"gri-mod-sat-g16-1-25"}],"t":"mcqquiz"}],"name":"Modifiers — Dangling & Misplaced","id":"g16"},{"eyebrow":"Gramer","id":"g17","name":"Parallel Structure","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Parallel Structure. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"slug":"gri-mod-sat-g17-1-1","why":"A is correct. The list uses gerunds: 'scheduling,' 'managing,' so the third item must also be a gerund — 'resolving.'  B — 'to resolve' is an infinitive, breaking the gerund pattern.  C — 'resolution of' is a noun phrase, breaking the pattern.  D — 'as well as to resolve' uses both an informal connector and an infinitive.","stem":"The manager's responsibilities include scheduling staff, managing inventory, ______ customer complaints.  Which choice maintains parallel structure?","ans":"A","choices":{"D":"as well as to resolve","C":"and resolution of","B":"and to resolve","A":"and resolving"},"n":1},{"stem":"The study concluded that participants who exercised regularly were more productive, less likely to report anxiety, ______ than those who did not.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g17-1-2","why":"B is correct. The list uses adjective phrases after 'were': 'more productive,' 'less likely to report anxiety.' The third item should follow the same pattern. 'Had higher sleep quality' (past tense verb) continues the predicate: 'were more productive...less likely...and had higher sleep quality.'  A — 'having higher sleep quality' is a participial phrase, breaking the pattern.  C — 'with higher sleep quality' is a prepositional phrase.  D — 'reported higher sleep quality' shifts the verb tense unnecessarily.","ans":"B","choices":{"D":"and reported higher sleep quality","C":"and with higher sleep quality","A":"and having higher sleep quality","B":"and had higher sleep quality"},"n":2},{"slug":"gri-mod-sat-g17-1-3","stem":"The new policy requires that all employees complete the training, that supervisors verify attendance, ______.  Which choice maintains parallel structure?","why":"D is correct. The list uses 'that + subject + verb' clauses: 'that all employees complete,' 'that supervisors verify.' The third item must follow the same pattern: 'that department heads submit.'  A — breaks the pattern with a separate independent clause.  B — changes the pattern to 'department heads are required to.'  C — uses a participial phrase, breaking the pattern.","ans":"D","choices":{"C":"with department heads submitting records to HR.","D":"and that department heads submit the records to HR.","B":"and department heads are required to submit the records to HR.","A":"and the records must be submitted to HR by department heads."},"n":3},{"n":4,"choices":{"B":"and for always being available to students.","A":"and her availability to students.","C":"and the fact that she was always available to students.","D":"and always being available to her students."},"ans":"A","stem":"The professor was known for her clarity in lectures, her fairness in grading, ______.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g17-1-4","why":"A is correct. The list uses possessive noun phrases: 'her clarity,' 'her fairness.' The third item must follow the same pattern: 'her availability.'  B — 'for always being available' is a prepositional phrase, breaking the pattern.  C — 'the fact that she was always available' is a noun clause, breaking the pattern.  D — 'always being available' is a gerund phrase without the possessive structure."},{"why":"D is correct. The list uses verbs in the same form: 'threatens' and 'displaces.' The second item must also use a verb that agrees with 'deforestation': 'disrupts.' However, among the options, 'disrupting the water cycle' is the only option using a consistent verbal form.  A — 'the water cycle being disrupted' is a noun phrase.  B — 'water cycle disruption' is a noun.  C — 'the water cycle is disrupted' inserts a new independent clause.","stem":"The documentary argues that deforestation threatens biodiversity, ______, and displaces indigenous communities.  Which choice maintains parallel structure?","ans":"D","choices":{"A":"the water cycle being disrupted","B":"water cycle disruption","C":"the water cycle is disrupted","D":"disrupting the water cycle"},"n":5,"slug":"gri-mod-sat-g17-1-5"},{"choices":{"B":"and compelling","A":"and compelling to reviewers","C":"and it should compel reviewers","D":"and should compel reviewers"},"n":6,"stem":"The grant application should be clear, concise, ______.  Which choice maintains parallel structure?","why":"B is correct. The list of adjectives: 'clear,' 'concise,' so the third item must also be an adjective: 'compelling.'  A — 'compelling to reviewers' adds a prepositional phrase unnecessarily.  C — 'it should compel' shifts to an independent clause.  D — 'should compel' shifts to a modal verb phrase.","ans":"B","slug":"gri-mod-sat-g17-1-6"},{"choices":{"C":"and that healthcare would become more affordable.","D":"and to make healthcare more affordable.","A":"and healthcare would be made more affordable.","B":"and making healthcare more affordable."},"n":7,"why":"D is correct. The list uses 'to + verb' infinitives: 'to reduce,' 'to improve.' The third item must be 'to make.'  A — 'healthcare would be made' is an independent clause.  B — 'making' is a gerund, not an infinitive.  C — 'that healthcare would become' is a noun clause.","slug":"gri-mod-sat-g17-1-7","stem":"The candidate promised to reduce taxes, to improve infrastructure, ______.  Which choice maintains parallel structure?","ans":"D"},{"slug":"gri-mod-sat-g17-1-8","ans":"B","stem":"The executive's success was attributed to hard work, strategic thinking, ______.  Which choice maintains parallel structure?","why":"B is correct. The list uses noun phrases: 'hard work,' 'strategic thinking.' The third item must also be a noun phrase: 'the ability to build strong professional relationships.'  A — 'that she was able to' is a noun clause.  C — 'building' is a gerund; it could work, but the noun phrase pattern in A is cleaner.  D — 'her ability of building' is non-standard phrasing.","n":8,"choices":{"D":"and her ability of building strong professional relationships","C":"and building strong professional relationships","A":"and that she was able to build strong professional relationships","B":"and the ability to build strong professional relationships"}},{"n":9,"choices":{"D":"to enhance problem-solving abilities","C":"problem-solving abilities being enhanced","A":"enhancing problem-solving abilities","B":"for the enhancement of problem-solving abilities"},"ans":"D","why":"D is correct. The list uses 'to + verb' infinitives: 'to develop,' 'to improve.' The second item must be 'to enhance.'  A — 'enhancing' is a gerund, not an infinitive.  B — 'for the enhancement of' is a prepositional phrase.  C — 'problem-solving abilities being enhanced' is a noun phrase with a participial.","slug":"gri-mod-sat-g17-1-9","stem":"The training program is designed to develop leadership skills, ______, and improve team communication.  Which choice maintains parallel structure?"},{"slug":"gri-mod-sat-g17-1-10","why":"C is correct. 'Not only did the team exceed...' uses a verb-based construction. 'But it also significantly improved...' must maintain the same verb structure: subject + adverb + verb + object.  A — 'improved significantly customer satisfaction' places the adverb awkwardly between verb and direct object.  B — shifts the subject to 'customer satisfaction ratings.'  D — uses a relative clause, which is grammatically awkward.","stem":"Not only did the team exceed its sales targets, but it also ______.  Which choice maintains parallel structure with the 'not only...but also' construction?","ans":"C","choices":{"B":"customer satisfaction ratings saw significant improvement.","A":"improved significantly customer satisfaction ratings.","C":"significantly improved customer satisfaction ratings.","D":"had customer satisfaction ratings that improved significantly."},"n":10},{"n":11,"choices":{"B":"and it was also physically challenging to excavate","A":"and physically challenging to excavate","C":"and the physical challenge of excavation","D":"and excavation being physically challenging"},"ans":"A","why":"A is correct. The list uses adjective phrases: 'historically significant,' 'archaeologically rich.' The third item must also be an adjective phrase: 'physically challenging to excavate.'  B — 'it was also physically challenging' introduces an independent clause.  C — 'the physical challenge of excavation' is a noun phrase.  D — 'excavation being physically challenging' is a noun phrase with a participial.","slug":"gri-mod-sat-g17-1-11","stem":"The archaeologist described the site as historically significant, archaeologically rich, ______.  Which choice maintains parallel structure?"},{"stem":"The review board is responsible for evaluating applications, interviewing candidates, ______.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g17-1-12","why":"B is correct. The list uses gerunds: 'evaluating,' 'interviewing.' The third item must also be a gerund: 'making.'  A — 'the final hiring decisions are made by them' is a passive independent clause.  C — 'to make' is an infinitive, breaking the gerund pattern.  D — 'to make' is also an infinitive.","ans":"B","choices":{"D":"and to make the final hiring decisions.","C":"as well as to make the final hiring decisions.","B":"and making the final hiring decisions.","A":"and the final hiring decisions are made by them."},"n":12},{"choices":{"B":"corporate accountability being ensured","A":"ensuring corporate accountability","C":"the ensuring of corporate accountability","D":"to ensure corporate accountability"},"n":13,"stem":"The legislation aims to protect consumers, ______, and promote fair competition.  Which choice maintains parallel structure?","slug":"gri-mod-sat-g17-1-13","why":"D is correct. The list uses 'to + verb' infinitives: 'to protect,' 'to promote.' The second item must be 'to ensure.'  A — 'ensuring' is a gerund.  B — 'corporate accountability being ensured' is a noun phrase.  C — 'the ensuring of' is an awkward noun phrase.","ans":"D"},{"choices":{"B":"and its precision of language use","A":"and for its precise use of language","C":"and precise in its use of language","D":"and precisely using language"},"n":14,"why":"C is correct. The list uses adjectives: 'rhythmic,' 'evocative.' The third item must also be an adjective: 'precise in its use of language.'  A — 'for its precise use' is a prepositional phrase.  B — 'its precision of language use' is a noun phrase.  D — 'precisely using language' is an adverb + gerund.","slug":"gri-mod-sat-g17-1-14","stem":"The author's prose is praised for being rhythmic, evocative, ______.  Which choice maintains parallel structure?","ans":"C"},{"stem":"The committee found the proposal to be well-researched, carefully argued, ______.  Which choice maintains parallel structure?","why":"A is correct. The list uses past participial adjective phrases: 'well-researched,' 'carefully argued.' The third item must also be an adjective phrase: 'thorough in its presentation of data.'  B — 'the data was presented thoroughly' is an independent clause.  C — 'thoroughly presenting its data' is a participial phrase that breaks the adjective pattern.  D — 'thorough data presentation' is a noun phrase.","slug":"gri-mod-sat-g17-1-15","ans":"A","choices":{"C":"and thoroughly presenting its data","D":"and thorough data presentation","A":"and thorough in its presentation of data","B":"and the data was presented thoroughly"},"n":15},{"ans":"C","why":"C is correct. The list uses gerunds: 'reading,' 'attending.' The third item must also be a gerund: 'visiting.'  A — 'to visit' is an infinitive.  B — 'the visiting of' is an awkward gerund nominalization.  D — 'she would visit' is an independent clause.","stem":"She enjoyed reading classic novels, attending live theater performances, ______.  Which choice maintains parallel structure?","n":16,"choices":{"C":"and visiting art museums on weekends.","D":"and she would visit art museums on weekends.","A":"and to visit art museums on weekends.","B":"and the visiting of art museums on weekends."},"slug":"gri-mod-sat-g17-1-16"},{"slug":"gri-mod-sat-g17-1-17","n":17,"choices":{"C":"and it is also praised for its ease of use.","D":"as well as ease of use being praised.","B":"and its ease of use is also praised.","A":"and praised for its ease of use."},"ans":"A","stem":"The new software is praised for its speed, praised for its security, ______.  Which choice maintains parallel structure while avoiding unnecessary repetition?","why":"A is correct. The parallel structure uses 'praised for its + noun.' The third item should follow the same elliptical pattern: 'and praised for its ease of use.'  B — shifts to a passive independent clause.  C — adds an unnecessary full clause when ellipsis is sufficient.  D — 'ease of use being praised' breaks the pattern."},{"ans":"D","why":"D is correct. The list uses 'that + noun + modal/verb' clauses: 'that vendors must deliver,' 'that payment terms must be followed.' The third item must be 'that all disputes will be resolved.'  A — drops the 'that,' breaking the parallel clause structure.  B — 'resolving disputes' is a gerund phrase.  C — 'with all disputes resolved' is a prepositional phrase.","slug":"gri-mod-sat-g17-1-18","stem":"The contract stipulates that vendors must deliver goods on time, that payment terms must be followed, ______.  Which choice maintains parallel structure?","n":18,"choices":{"D":"and that all disputes will be resolved through arbitration.","C":"with all disputes resolved through arbitration.","B":"and resolving disputes through arbitration.","A":"and disputes will be resolved through arbitration."}},{"stem":"The ambassador's speech was notable for its eloquence, its depth of historical knowledge, ______.  Which choice maintains parallel structure?","why":"C is correct. The list uses possessive noun phrases: 'its eloquence,' 'its depth.' The third item must also be a possessive noun phrase: 'its remarkable diplomatic sensitivity.'  A — shifts to an independent clause with 'she.'  B — 'her remarkable display' changes the possessive from 'its' to 'her.'  D — 'the remarkable sensitivity with which...' is a noun clause.","slug":"gri-mod-sat-g17-1-19","ans":"C","choices":{"D":"and the remarkable sensitivity with which she addressed diplomatic matters.","C":"and its remarkable diplomatic sensitivity.","B":"and her remarkable display of diplomatic sensitivity.","A":"and she also displayed remarkable diplomatic sensitivity."},"n":19},{"n":20,"choices":{"A":"and the proper use of protective equipment should be understood.","B":"and how to use protective equipment properly.","D":"and using protective equipment properly.","C":"and the proper use of protective equipment."},"ans":"B","slug":"gri-mod-sat-g17-1-20","why":"B is correct. The list uses 'how to + verb' infinitive clauses: 'how to identify,' 'how to report.' The third item must be 'how to use.'  A — shifts to a passive independent clause.  C — drops 'how to,' breaking the pattern.  D — 'using' is a gerund, breaking the 'how to' pattern.","stem":"The training module teaches employees how to identify workplace hazards, how to report incidents correctly, ______.  Which choice maintains parallel structure?"},{"why":"A is correct. The list uses present tense verbs with 'the foundation' as the implied subject: 'supports,' 'advocates.' The third item must also be a present tense verb: 'funds.'  B — shifts to passive voice and adds an independent clause.  C — also shifts to passive voice.  D — 'the funding of' is a noun phrase.","stem":"The foundation supports research into renewable energy, advocates for evidence-based climate policy, ______.  Which choice maintains parallel structure?","ans":"A","choices":{"D":"and the funding of public science education programs.","C":"and funds are allocated to public science education.","A":"and funds public science education programs.","B":"and funding is provided for public science education."},"n":21,"slug":"gri-mod-sat-g17-1-21"},{"why":"C is correct. 'Both X and Y' requires parallel forms. 'Bold in its claims' is an adjective phrase. The second element must also be an adjective phrase: 'rigorous in its methodology.' The choice 'and rigorous' provides the adjective.  A — 'as well as rigorous' does not complete the 'both...and' construction.  B — 'rigorousness' is a noun, not an adjective.  D — 'but also rigorous' shifts the construction to 'both...but also,' which is non-standard.","stem":"The scientist's theory was both bold in its claims ______ in its methodology.  Which choice maintains parallel structure with the 'both...and' construction?","ans":"C","choices":{"B":"and rigorousness","A":"as well as rigorous","C":"and rigorous","D":"but also rigorous"},"n":22,"slug":"gri-mod-sat-g17-1-22"},{"choices":{"A":"and how well they demonstrated leadership potential","B":"and the demonstration of leadership potential","C":"and their demonstrated leadership potential","D":"and demonstrating leadership potential"},"n":23,"slug":"gri-mod-sat-g17-1-23","why":"C is correct. The list uses possessive noun phrases: 'their qualifications,' 'their relevant experience.' The third item must be 'their demonstrated leadership potential.'  A — 'how well they demonstrated' is a noun clause.  B — 'the demonstration of' loses the possessive pattern.  D — 'demonstrating' is a gerund without the possessive.","stem":"The hiring committee evaluated candidates based on their qualifications, their relevant experience, ______.  Which choice maintains parallel structure?","ans":"C"},{"ans":"B","why":"B is correct. The list uses 'to + verb' infinitives: 'to cut,' 'to rebuild.' The third item must be 'to develop.'  A — 'the development of' is a noun phrase.  C — 'the long-term strategic vision being developed' is a noun phrase with a participial.  D — 'developing' is a gerund.","slug":"gri-mod-sat-g17-1-24","stem":"The board expects the new CEO to cut operational costs, to rebuild investor confidence, ______.  Which choice maintains parallel structure?","n":24,"choices":{"B":"and to develop a long-term strategic vision","A":"and the development of a long-term strategic vision","C":"and the long-term strategic vision being developed","D":"and developing a long-term strategic vision"}},{"n":25,"choices":{"B":"and the budget should be respected.","A":"and that it stay within the approved budget.","D":"and budget compliance being maintained.","C":"and staying within the approved budget."},"ans":"A","slug":"gri-mod-sat-g17-1-25","why":"A is correct. The list uses 'that + subject + verb' clauses: 'that the design be,' 'that it reflect.' The third item must be 'that it stay.'  B — drops the 'that' and shifts to an independent clause.  C — 'staying within' is a gerund phrase.  D — 'budget compliance being maintained' is a noun phrase.","stem":"The architect insisted that the design be functional, that it reflect the neighborhood's character, ______.  Which choice maintains parallel structure?"}]}],"group":"Dilbilgisi"},{"eyebrow":"Gramer","id":"g18","group":"Dilbilgisi","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Verb Tense & Mood. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"n":1,"choices":{"B":"has left","A":"left","C":"was leaving","D":"had left"},"ans":"D","stem":"By the time the committee published its final report, the lead researcher ______ the institution for two years.  Which verb form is correct?","slug":"gri-mod-sat-g18-1-1","why":"D is correct. 'By the time' signals a past perfect context — the researcher left before the report was published. The past perfect 'had left' shows an action completed before another past event.  A — simple past 'left' does not clarify the sequence.  B — 'has left' is present perfect, not past.  C — 'was leaving' is past progressive, implying an ongoing action at the time."},{"n":2,"choices":{"D":"would have been completed","C":"had been completed","A":"will be completed","B":"would be completed"},"ans":"D","stem":"If the investment had been approved in January, the project ______ on schedule.  Which verb form correctly completes this third conditional?","slug":"gri-mod-sat-g18-1-2","why":"D is correct. In a third conditional (hypothetical past), the if-clause uses past perfect ('had been approved') and the result clause uses 'would have + past participle.'  A — 'will be completed' is present/future, not past hypothetical.  B — 'would be completed' is second conditional (hypothetical present).  C — 'had been completed' is past perfect, not the result clause form."},{"n":3,"choices":{"C":"had published","D":"has published","A":"published","B":"was publishing"},"ans":"C","stem":"The scientist ______ three papers when the new regulations took effect and forced a revision of her methodology.  Which verb form correctly shows she had published before the regulations?","why":"C is correct. The past perfect 'had published' shows that the three papers were published before the regulations took effect (another past event).  A — simple past does not clarify the sequence.  B — 'was publishing' implies an ongoing action at the time, not completion.  D — 'has published' is present perfect, not past.","slug":"gri-mod-sat-g18-1-3"},{"n":4,"choices":{"C":"reviewed","D":"will review","B":"review","A":"reviews"},"ans":"B","why":"B is correct. After verbs of recommendation, request, or demand ('recommend,' 'require,' 'insist'), the subjunctive mood requires the base form of the verb without inflection: 'that the director review.'  A — 'reviews' is third-person singular indicative, not subjunctive.  C — 'reviewed' is past tense.  D — 'will review' is future indicative.","slug":"gri-mod-sat-g18-1-4","stem":"The committee recommends that the director ______ the new guidelines before the deadline.  Which verb form reflects the subjunctive mood?"},{"why":"B is correct. 'It is essential that' triggers the subjunctive. The base form 'submit' is required regardless of the subject.  A — 'submits' is indicative third-person singular.  C — 'submitted' is past tense.  D — 'will submit' is future indicative.","stem":"It is essential that each participant ______ a signed consent form before the session begins.  Which verb form reflects the subjunctive mood?","ans":"B","choices":{"C":"submitted","D":"will submit","B":"submit","A":"submits"},"n":5,"slug":"gri-mod-sat-g18-1-5"},{"choices":{"D":"had increased","C":"were increasing","A":"have increased","B":"increased"},"n":6,"stem":"Since the new management team took over, profits ______ by thirty percent.  Which verb form is correct?","slug":"gri-mod-sat-g18-1-6","why":"A is correct. 'Since' introduces a time frame that began in the past and continues to the present. The present perfect 'have increased' correctly captures this ongoing relevance.  B — simple past 'increased' implies the change is complete and no longer relevant.  C — 'were increasing' is past progressive.  D — 'had increased' is past perfect, used for actions completed before another past event.","ans":"A"},{"stem":"By next March, the research team ______ on this project for five years.  Which verb form is correct?","why":"D is correct. 'By next March' signals a future perfect context — an action that will be in progress up to a specific future point. 'Will have been working' (future perfect progressive) is correct.  A — simple past 'worked' is incorrect in a future context.  B — 'has worked' is present perfect.  C — 'will work' is simple future and does not indicate ongoing duration.","ans":"D","choices":{"C":"will work","D":"will have been working","A":"worked","B":"has worked"},"n":7,"slug":"gri-mod-sat-g18-1-7"},{"stem":"The board insisted that the proposal ______ revised before the next meeting.  Which verb form reflects the subjunctive mood?","why":"D is correct. After 'insist,' the subjunctive requires the base form 'be,' not 'is' or 'was.'  A — 'is' is present indicative.  B — 'was' is past indicative.  C — 'will be' is future indicative.","slug":"gri-mod-sat-g18-1-8","ans":"D","choices":{"B":"was","A":"is","D":"be","C":"will be"},"n":8},{"slug":"gri-mod-sat-g18-1-9","n":9,"choices":{"D":"was reading","C":"would read","A":"read","B":"had read"},"ans":"B","why":"B is correct. In a third conditional, the if-clause uses the past perfect: 'If I had read.' The result clause uses 'would have + past participle.'  A — simple past 'read' is used in second conditional (hypothetical present), not third.  C — 'would read' belongs in the result clause, not the if-clause.  D — 'was reading' is past progressive.","stem":"If I ______ the report earlier, I would have caught the error before the presentation.  Which verb form correctly completes this third conditional?"},{"n":10,"choices":{"A":"worked","B":"has worked","D":"had been working","C":"was working"},"ans":"D","why":"D is correct. 'Before the client cancelled' signals a past perfect progressive — ongoing action that was in progress and then interrupted by a subsequent past event.  A — simple past 'worked' does not show the prior ongoing nature.  B — 'has worked' is present perfect.  C — 'was working' is past progressive; while acceptable, 'had been working' more precisely conveys the duration before the interruption.","slug":"gri-mod-sat-g18-1-10","stem":"The architect ______ on the plans for six months before the client suddenly cancelled the contract.  Which verb form is correct?"},{"ans":"C","stem":"The judge ruled that the defendant ______ released on bail pending the appeal.  Which verb form reflects the subjunctive mood?","slug":"gri-mod-sat-g18-1-11","why":"C is correct. After 'ruled that' (a verb of legal decision), the subjunctive base form 'be' is required.  A — 'is' is indicative.  B — 'was' is past indicative.  D — 'will be' is future indicative.","n":11,"choices":{"C":"be","D":"will be","B":"was","A":"is"}},{"slug":"gri-mod-sat-g18-1-12","why":"C is correct. 'Since its founding in 1998' establishes a time frame from the past to the present. The present perfect 'has relocated' correctly captures actions that occurred multiple times within this ongoing timeframe.  A — simple past 'relocated' implies a single completed action, not repeated occurrences.  B — 'had relocated' is past perfect.  D — 'was relocating' is past progressive.","stem":"The company ______ its headquarters three times since its founding in 1998.  Which verb form is correct?","ans":"C","choices":{"C":"has relocated","D":"was relocating","B":"had relocated","A":"relocated"},"n":12},{"choices":{"C":"brought","D":"will bring","A":"bring","B":"brings"},"n":13,"stem":"The professor requested that every student ______ a printed copy of the essay to class.  Which verb form reflects the subjunctive mood?","why":"A is correct. After 'requested that,' the subjunctive requires the base form 'bring.'  B — 'brings' is indicative third-person singular.  C — 'brought' is past tense.  D — 'will bring' is future indicative.","slug":"gri-mod-sat-g18-1-13","ans":"A"},{"ans":"A","why":"A is correct. The past perfect progressive 'had been going' shows an action that was ongoing before the arrival of the delegates (another past event). It expresses both duration and prior sequence.  B — 'have been going' is present perfect progressive.  C — simple past 'went' is too simple and does not convey the ongoing duration.  D — 'were going' is past progressive but does not indicate that negotiations preceded the arrival.","slug":"gri-mod-sat-g18-1-14","stem":"When the delegates arrived at the summit, negotiations ______ for three days without progress.  Which verb form is correct?","n":14,"choices":{"B":"have been going","A":"had been going","C":"went","D":"were going"}},{"n":15,"choices":{"B":"are verified","A":"is verified","C":"be verified","D":"was verified"},"ans":"C","why":"C is correct. 'It is vital that' triggers the subjunctive. The base form of 'be' is used with the passive: 'be verified.'  A — 'is verified' is indicative singular.  B — 'are verified' is indicative plural.  D — 'was verified' is past indicative.","slug":"gri-mod-sat-g18-1-15","stem":"It is vital that the data ______ before the peer review process begins.  Which verb form reflects the subjunctive mood?"},{"choices":{"A":"rejected","B":"had been rejected","C":"has been rejected","D":"was being rejected"},"n":16,"stem":"The novel ______ three different publishers before it was finally accepted and brought to print.  Which verb form correctly shows rejection happened before acceptance?","slug":"gri-mod-sat-g18-1-16","why":"B is correct. 'Before it was finally accepted' signals that the rejections preceded the acceptance (both in the past). The past perfect passive 'had been rejected' is correct.  A — simple past 'rejected' is active voice and does not clarify sequence.  C — 'has been rejected' is present perfect passive.  D — 'was being rejected' implies an ongoing action at the same time as acceptance.","ans":"B"},{"choices":{"A":"approved","B":"approves","D":"would approve","C":"had approved"},"n":17,"why":"C is correct. In a third conditional, the if-clause uses past perfect: 'If the committee had approved.' The result clause uses 'would have + past participle.'  A — simple past 'approved' is used in the second conditional.  B — present 'approves' is used for first conditional (real present/future).  D — 'would approve' belongs in the result clause, not the if-clause.","slug":"gri-mod-sat-g18-1-17","stem":"If the committee ______ the proposal sooner, the project might have launched before the fiscal year ended.  Which verb form correctly completes this third conditional?","ans":"C"},{"n":18,"choices":{"A":"built","B":"had been building","C":"have built","D":"were building"},"ans":"B","why":"B is correct. The past perfect progressive 'had been building' shows an action in progress over a period of time that was interrupted by a subsequent past event (the withdrawal of funding).  A — 'built' is simple past and does not show the duration or prior sequence.  C — 'have built' is present perfect.  D — 'were building' is past progressive but does not emphasize the prior duration.","slug":"gri-mod-sat-g18-1-18","stem":"The engineers ______ the prototype for two months before the funding was unexpectedly withdrawn.  Which verb form is correct?"},{"n":19,"choices":{"D":"will submit","C":"submitted","A":"submit","B":"submits"},"ans":"A","slug":"gri-mod-sat-g18-1-19","why":"A is correct. 'Requires that' triggers the subjunctive. The base form 'submit' is used regardless of the subject.  B — 'submits' is indicative third-person singular.  C — 'submitted' is past tense.  D — 'will submit' is future indicative.","stem":"The resolution requires that each member state ______ a full report to the council within ninety days.  Which verb form reflects the subjunctive mood?"},{"choices":{"C":"had finished","D":"was finishing","A":"finished","B":"has finished"},"n":20,"stem":"The team ______ the analysis by the time the client arrived for the follow-up meeting.  Which verb form correctly shows completion before a past event?","why":"C is correct. 'By the time the client arrived' signals that the analysis was completed before the arrival — requiring the past perfect 'had finished.'  A — simple past 'finished' does not clarify the sequence.  B — 'has finished' is present perfect.  D — 'was finishing' implies it was still in progress when the client arrived.","slug":"gri-mod-sat-g18-1-20","ans":"C"},{"slug":"gri-mod-sat-g18-1-21","choices":{"B":"held","A":"was holding","D":"had held","C":"has held"},"n":21,"why":"D is correct. 'Before accepting the tenured professorship' signals a past event. The positions were held before that event — requiring the past perfect 'had held.'  A — 'was holding' is past progressive.  B — simple past 'held' does not clarify the sequence.  C — 'has held' is present perfect.","stem":"She ______ three research positions before accepting the tenured professorship she currently holds.  Which verb form is correct?","ans":"D"},{"stem":"The oversight committee recommended that the director ______ a public statement clarifying the organization's position.  Which verb form reflects the subjunctive mood?","why":"A is correct. After 'recommended that,' the subjunctive requires the base form 'issue.'  B — 'issues' is indicative third-person singular.  C — 'issued' is past tense.  D — 'will issue' is future indicative.","ans":"A","choices":{"C":"issued","D":"will issue","A":"issue","B":"issues"},"n":22,"slug":"gri-mod-sat-g18-1-22"},{"ans":"B","slug":"gri-mod-sat-g18-1-23","why":"B is correct. 'Since the lab implemented' establishes a time frame from a past moment to the present. The present perfect 'has not been' reflects this ongoing period.  A — simple past 'was not' implies the injury-free period is over.  C — 'had not been' is past perfect, used for events before another past event.  D — 'is not' is simple present, ignoring the historical context.","stem":"Since the lab implemented the new safety protocols, there ______ a single injury.  Which verb form is correct?","n":23,"choices":{"A":"was not","B":"has not been","D":"is not","C":"had not been"}},{"n":24,"choices":{"C":"filed","D":"will file","B":"files","A":"file"},"ans":"A","stem":"The foundation mandates that all grant recipients ______ annual reports within sixty days of each fiscal year's end.  Which verb form reflects the subjunctive mood?","why":"A is correct. 'Mandates that' triggers the subjunctive. The base form 'file' is correct regardless of the subject ('all grant recipients').  B — 'files' is indicative third-person singular applied incorrectly.  C — 'filed' is past tense.  D — 'will file' is future indicative.","slug":"gri-mod-sat-g18-1-24"},{"choices":{"B":"was examining","A":"examined","C":"had examined","D":"has examined"},"n":25,"why":"A is correct. 'When' introduces a specific past moment at which another past action occurred. Simple past 'examined' correctly captures this point-in-time past action.  B — 'was examining' is past progressive; acceptable, but 'examined' is more direct for a completed action.  C — 'had examined' is past perfect, implying the examination was completed before the discovery, which contradicts 'when.'  D — 'has examined' is present perfect.","slug":"gri-mod-sat-g18-1-25","stem":"When the historian ______ the archive, she discovered letters that had never been catalogued.  Which verb form is correct?","ans":"A"}]}],"name":"Verb Tense & Mood"},{"eyebrow":"Gramer","group":"Dilbilgisi","blocks":[{"t":"p","x":"SAT Reading & Writing dilbilgisi â Relative Clauses & Subordination. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"n":1,"choices":{"B":"who's","A":"whose","C":"that","D":"whom"},"ans":"A","slug":"gri-mod-sat-g19-1-1","why":"A is correct. 'Whose' is the possessive relative pronoun. 'Whose work on CRISPR...' correctly shows that the work belongs to the scientist.  B — 'who's' is a contraction for 'who is,' not a possessive.  C — 'that' can be used for people in restrictive clauses but cannot show possession the way 'whose' does.  D — 'whom' is the object form and cannot show possession.","stem":"The scientist ______ work on CRISPR gene editing earned her international recognition has recently joined the institute.  Which relative pronoun is correct?"},{"stem":"The building ______ the lecture was held has since been converted into a residential complex.  Which relative pronoun is correct?","why":"B is correct. The clause 'the lecture was held' is missing its preposition. The building is the location 'in which' the lecture was held. 'In which' correctly retains the preposition.  A — 'which the lecture was held' is missing the preposition 'in.'  C — 'where' introduces a relative clause of place and would work, but 'in which' is more formal and precise.  D — 'that the lecture was held' is missing the preposition.","slug":"gri-mod-sat-g19-1-2","ans":"B","choices":{"C":"where","D":"that","B":"in which","A":"which"},"n":2},{"choices":{"C":"that","D":"whom","B":"which","A":"who"},"n":3,"why":"D is correct. 'The committee addressed [the delegate]' — the delegate is the object of 'addressed.' When the relative pronoun is the object of the clause's verb, 'whom' is correct.  A — 'who' is the subject form and would be used if the delegate were doing the addressing.  B — 'which' refers to things, not people.  C — 'that' can substitute for 'who' or 'whom' in restrictive clauses, but 'whom' is preferred in formal writing.","slug":"gri-mod-sat-g19-1-3","stem":"The delegate ______ the committee addressed had not been informed of the procedural change.  Which relative pronoun is correct?","ans":"D"},{"n":4,"choices":{"B":"whose","A":"that","C":"which","D":"who's"},"ans":"B","stem":"The report, ______ findings contradicted the committee's assumptions, was submitted to the board last week.  Which relative pronoun is correct?","slug":"gri-mod-sat-g19-1-4","why":"B is correct. 'Whose findings contradicted...' — 'whose' shows that the findings belong to the report. 'Whose' can refer to things as well as people.  A — 'that' cannot show possession.  C — 'which findings' is grammatically incorrect; 'which' cannot modify a following noun.  D — 'who's' is a contraction for 'who is,' not possessive."},{"choices":{"B":"whom","A":"that","C":"whose","D":"what"},"n":5,"slug":"gri-mod-sat-g19-1-5","why":"A is correct. 'That would redirect funds' is a restrictive relative clause modifying 'a plan.' 'That' is used in restrictive clauses for things.  B — 'whom' is the object form for people, not things.  C — 'whose' shows possession and would require a noun after it.  D — 'what' cannot introduce a relative clause modifying a noun.","stem":"The city council approved a plan ______ would redirect funds from the parks budget to transportation infrastructure.  Which relative pronoun is correct?","ans":"A"},{"stem":"The novelist, ______ first book was rejected by forty publishers, won the Booker Prize on her third attempt.  Which relative pronoun is correct?","why":"C is correct. 'Whose first book was rejected' — 'whose' shows that the first book belongs to the novelist. The clause is non-restrictive (set off by commas) and refers to a person.  A — 'that' cannot show possession and is not used with non-restrictive clauses.  B — 'which' refers to things and cannot show possession.  D — 'who first book' is grammatically incorrect without a possessive form.","slug":"gri-mod-sat-g19-1-6","ans":"C","choices":{"A":"that","B":"which","D":"who","C":"whose"},"n":6},{"ans":"C","stem":"The program, ______ has been running for twelve years, serves over five hundred families annually.  Which relative pronoun is correct?","why":"C is correct. Non-restrictive clauses modifying things use 'which.' The program is a thing, the clause adds information, and commas indicate it is non-restrictive.  A — 'that' is not used with non-restrictive clauses.  B — 'whom' refers to people and is the object form.  D — 'whose' shows possession and would require a noun to follow it.","slug":"gri-mod-sat-g19-1-7","n":7,"choices":{"D":"whose","C":"which","B":"whom","A":"that"}},{"slug":"gri-mod-sat-g19-1-8","choices":{"A":"who","B":"whom","D":"that","C":"which"},"n":8,"stem":"The employee ______ the award was given had worked at the company for over twenty years.  Which relative pronoun correctly completes this sentence?","why":"B is correct. 'The award was given [to the employee]' — the employee is the indirect object of 'was given.' When the relative pronoun is the object (or indirect object) of the verb, 'w
