everal hours could the conservator discern the underpainting beneath the surface — a preliminary sketch that revealed the artist's original compositional intention.  As used in the text, \"discern\" most nearly means:","slug":"gri-mod-sat-v1-1-18","why":"D is correct. Extended study required before the conservator could perceive the underpainting = recognize with careful attention. \"Discern\" = to recognize something that is not immediately obvious.  A — restore describes a conservation action.  B — document describes recording.  C — assess value is unrelated to discerning.  Kelime: discern — seçip ayırt etmek, fark etmek, kavramak"},{"stem":"The anthology brought together disparate voices — novelists, journalists, environmental scientists, and urban planners — who shared a concern about coastal erosion but approached it from entirely different disciplinary perspectives.  As used in the text, \"disparate\" most nearly means:","slug":"gri-mod-sat-v1-1-19","why":"D is correct. Novelists, journalists, scientists, and planners = fundamentally different types of contributors. \"Disparate\" = so unlike as to not be comparable; essentially different.  A — recognition is not what disparate describes.  B — common professional background is the opposite.  C — geographic diversity is not what disparate means here.  Kelime: disparate — birbirinden çok farklı, benzemez","ans":"D","choices":{"C":"selected from geographically diverse regions","D":"fundamentally different in kind or character","B":"united by a common professional background","A":"widely recognized in their respective fields"},"n":19},{"stem":"The senator's floor speech was widely praised as eloquent: its language was precise and evocative, its emotional appeals were earned rather than manipulative, and its structure guided listeners from premise to conclusion with ease.  As used in the text, \"eloquent\" most nearly means:","why":"D is correct. Precise language, evocative expression, earned appeals, clear structure = fluent, persuasive speech. \"Eloquent\" = fluent and persuasive in speaking or writing.  A — political effectiveness describes outcome.  B — brevity is not what eloquent describes.  C — technical detail is a different quality.  Kelime: eloquent — etkileyici, belagatli, güzel konuşan","slug":"gri-mod-sat-v1-1-20","ans":"D","choices":{"A":"politically effective in securing votes","B":"unusually brief for the complexity of the subject","D":"fluent and persuasive in expression","C":"technically detailed and well-documented"},"n":20},{"n":21,"choices":{"B":"formally certify as qualified in a recognized discipline","A":"match or attempt to equal by imitating","D":"critique in order to develop independent judgment","C":"assist with practical tasks in a professional setting"},"ans":"A","why":"A is correct. Studying a master's thinking process to replicate it = match by imitating. \"Emulate\" = to match or surpass by imitating.  B — certification is a formal credential process.  C — assisting with tasks is an apprenticeship function, not emulation.  D — critique implies analysis and disagreement, not imitation.  Kelime: emulate — taklit etmek, örnek alarak aynısını yapmak","slug":"gri-mod-sat-v1-1-21","stem":"Young architects often study under established practitioners not merely to learn technical skills but to emulate the thinking process — the way a master weighs constraints and arrives at a design concept.  As used in the text, \"emulate\" most nearly means:"},{"slug":"gri-mod-sat-v1-1-22","ans":"B","why":"B is correct. Incorrect formula produced wrong results = the conclusions were wrong. \"Erroneous\" = wrong; containing an error.  A — insufficient evidence is a different kind of problem.  C — misleading presentation implies intent; erroneous simply means incorrect.  D — revised following review describes what happened afterward.  Kelime: erroneous — hatalı, yanlış, doğru olmayan","stem":"The study's conclusions were later shown to be erroneous: an audit revealed that the data had been processed with an incorrect formula, producing results that systematically overstated the claimed effect.  As used in the text, \"erroneous\" most nearly means:","n":22,"choices":{"B":"containing errors; not correct","A":"based on insufficient evidence","C":"presented in a misleading or selective way","D":"subsequently revised following peer review"}},{"n":23,"choices":{"D":"provide an unexpected cause of a condition","C":"make something bad worse by adding to it","A":"temporarily stabilize a difficult situation","B":"draw public attention to a problem"},"ans":"C","slug":"gri-mod-sat-v1-1-23","why":"C is correct. The drought was already bad; the frost made it worse. \"Exacerbate\" = to make a bad situation worse.  A — stabilize is the opposite.  B — draw attention is a different function.  D — unexpected cause describes origin, not worsening.  Kelime: exacerbate — daha da kötüleştirmek, şiddetlendirmek","stem":"The drought was already straining agricultural output, and the unseasonably early frost served only to exacerbate the shortage, damaging crops that had managed to survive the dry summer.  As used in the text, \"exacerbate\" most nearly means:"},{"n":24,"choices":{"B":"make easier or less difficult","A":"mandate or require by regulation","C":"physically accommodate more users","D":"reduce the financial cost of a service"},"ans":"B","why":"B is correct. The hub reduces friction = makes transfers easier. \"Facilitate\" = to make an action or process easier.  A — mandate implies legal requirement; facilitate implies ease, not compulsion.  C — accommodating more users describes capacity.  D — reducing cost is an economic outcome.  Kelime: facilitate — kolaylaştırmak, mümkün kılmak","slug":"gri-mod-sat-v1-1-24","stem":"The new transit hub was designed to facilitate transfers between bus, rail, and bicycle infrastructure, reducing the friction that had previously discouraged commuters from combining multiple modes of transportation.  As used in the text, \"facilitate\" most nearly means:"},{"n":25,"choices":{"B":"statistically imprecise","A":"based on false reasoning; logically flawed","D":"inconsistent with current scientific consensus","C":"widely accepted but unverified"},"ans":"A","slug":"gri-mod-sat-v1-1-25","why":"A is correct. Correlation-implies-causation is logically flawed reasoning. \"Fallacious\" = based on mistaken belief or unsound reasoning.  B — imprecision is a different kind of error.  C — widely accepted but unverified is a different problem.  D — inconsistency with consensus is a separate issue.  Kelime: fallacious — yanıltıcı, hatalı, yanlış temele dayalı","stem":"The argument that correlation implies causation is fallacious: the fact that two trends move together does not establish that one produces the other, a point routinely missed in popular reporting on scientific studies.  As used in the text, \"fallacious\" most nearly means:"}],"t":"mcqquiz"}],"id":"v1"},{"group":"Kelime","name":"Academic & Scientific Vocabulary","blocks":[{"t":"p","x":"SAT kelime â Academic & Scientific Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"n":1,"choices":{"A":"publicize broadly to maximize impact","B":"strengthen by adding more support or evidence","D":"simplify for communication to a general audience","C":"acknowledge the limitations of"},"ans":"B","stem":"The researchers sought to fortify their initial findings by replicating the experiment under a range of conditions, ensuring the results held not just in the original laboratory setting but across varied contexts.  As used in the text, \"fortify\" most nearly means:","slug":"gri-mod-sat-v2-1-1","why":"B is correct. Replicating across conditions adds supporting evidence = strengthens the findings. \"Fortify\" = to strengthen or reinforce.  A — publicize describes dissemination.  C — acknowledge limitations is the opposite.  D — simplify describes communication strategy.  Kelime: fortify — güçlendirmek, pekiştirmek"},{"why":"D is correct. Correspondence, salons, working with conversation nearby = someone who thrives in social company. \"Gregarious\" = fond of the company of others; sociable.  A — productivity is a separate quality.  B — resistance to conventions is different.  C — interest in social issues is different from enjoying social company.  Kelime: gregarious — sosyal, arkadaş canlısı, toplumsal","slug":"gri-mod-sat-v2-1-2","stem":"Despite the reputation of writers as solitary figures, the novelist was famously gregarious, maintaining an extensive correspondence, hosting a weekly salon, and rarely working without the sound of conversation in the background.  As used in the text, \"gregarious\" most nearly means:","ans":"D","choices":{"D":"sociable; enjoying the company of others","C":"interested in social and political issues","A":"unusually productive in professional output","B":"resistant to established literary conventions"},"n":2},{"n":3,"choices":{"A":"the direct cause of a significant event","B":"a sign that announces something to come","C":"the most severe manifestation of a problem","D":"a temporary relief from a persistent condition"},"ans":"B","slug":"gri-mod-sat-v2-1-3","why":"B is correct. The warmth signals future disruption — it announces what is coming. \"Harbinger\" = a person or thing that signals the approach of something.  A — direct cause implies it produces the event; a harbinger signals without necessarily causing.  C — most severe manifestation is the opposite (a harbinger comes before).  D — temporary relief is the opposite meaning.  Kelime: harbinger — habercisi, ön işareti, müjdecisi","stem":"The unusual warmth in February was not, as some hoped, a pleasant anomaly — ecologists warned that it was a harbinger of the ecosystem disruption that decades of rising temperatures had been building toward.  As used in the text, \"harbinger\" most nearly means:"},{"choices":{"B":"deliberately provocative toward musical tradition","A":"technically demanding for all performers","C":"peculiar to the individual; highly distinctive","D":"inconsistent in quality across different compositions"},"n":4,"why":"C is correct. Invented notation, unconventional sounds = highly distinctive, peculiar to this composer. \"Idiosyncratic\" = peculiar to or characteristic of a particular individual.  A — technical difficulty is a different quality.  B — provocation implies intent to challenge; idiosyncratic is simply individual distinctiveness.  D — inconsistent quality is a different issue.  Kelime: idiosyncratic — kendine özgü, biricik, alışılmışın dışında","slug":"gri-mod-sat-v2-1-4","stem":"The composer's scoring was highly idiosyncratic: she incorporated unpitched vocal sounds, notated silences with symbols she had invented herself, and wrote dynamics that could not be reproduced on conventional instruments.  As used in the text, \"idiosyncratic\" most nearly means:","ans":"C"},{"stem":"The impetuous decision to launch the product before testing was complete proved costly: three critical design flaws emerged within weeks of release, requiring an expensive recall and a public apology.  As used in the text, \"impetuous\" most nearly means:","slug":"gri-mod-sat-v2-1-5","why":"A is correct. Launching before testing = acting without adequate thought. \"Impetuous\" = acting quickly and without thought.  B — external pressure is a cause, not the meaning.  C — overconfidence is a cause, not the definition.  D — contrary to recommendations is a specific circumstance.  Kelime: impetuous — düşüncesiz, ani, aceleci","ans":"A","choices":{"D":"contrary to the engineering team's recommendations","C":"based on overconfidence in prior success","B":"influenced by external commercial pressure","A":"made without adequate reflection; hasty"},"n":5},{"n":6,"choices":{"C":"focused exclusively on stylistic issues","D":"given verbally rather than in written form","B":"clear and accurate in identifying what matters","A":"unnecessarily harsh or dismissive"},"ans":"B","why":"B is correct. Going directly to structural problems and identifying the specific failure = clear and accurate. \"Incisive\" = intelligently analytical; clear-cut.  A — harsh implies cruelty; incisive implies precision.  C — stylistic issues is opposite of the structural focus described.  D — verbal vs. written is not what incisive means.  Kelime: incisive — keskin, zekice, konuya doğrudan giren","slug":"gri-mod-sat-v2-1-6","stem":"The editor's feedback was always incisive: she did not waste time on general praise but went directly to the structural problems in an argument, identifying exactly which paragraph failed to deliver on the introduction's promise.  As used in the text, \"incisive\" most nearly means:"},{"ans":"C","slug":"gri-mod-sat-v2-1-7","why":"C is correct. Stretching twenty minutes to an hour by repeating established beats = gratuitously excessive. \"Indulgent\" = allowing excessive self-gratification without restraint.  A — technically accomplished but cold is a different criticism.  B — ambiguous resolution is a different problem.  D — narrow appeal is not what indulgent describes.  Kelime: indulgent — hoşgörülü, aşırıya kaçan; kendine müsamahalı","stem":"Critics found the final act of the film indulgent, arguing that what might have served as a twenty-minute denouement had been stretched to nearly an hour through scenes that repeated emotional beats already established.  As used in the text, \"indulgent\" most nearly means:","n":7,"choices":{"A":"technically accomplished but emotionally cold","B":"deliberately ambiguous in its resolution","C":"excessive and self-gratifying without justification","D":"appealing to a narrow rather than general audience"}},{"slug":"gri-mod-sat-v2-1-8","choices":{"C":"unable or unwilling to take action; inactive","D":"cautiously evaluating all options before committing","A":"opposed to the committee's recommendations","B":"lacking the authority to implement changes"},"n":8,"why":"C is correct. No implementation, no explanation = inactive, unresponsive. \"Inert\" = lacking the ability or strength to act.  A — opposed implies active disagreement; inert implies absence of action.  B — lacking authority is a specific cause, not the definition.  D — careful evaluation implies a process; inert implies no process at all.  Kelime: inert — hareketsiz, eylemsiz, tepkisiz","stem":"Despite the committee's urgent recommendations, the administration remained inert for months, neither implementing the proposed reforms nor offering a clear explanation for why action was being delayed.  As used in the text, \"inert\" most nearly means:","ans":"C"},{"ans":"A","why":"A is correct. Not a historical accident but a permanent built-in feature = naturally, inseparably present. \"Inherent\" = existing in something as a permanent, essential attribute.  B — growing in intensity implies change; inherent implies permanence.  C — only recently recognized contradicts inherence.  D — caused by institutional failures implies it could be removed; inherent implies it cannot.  Kelime: inherent — doğasında olan, ayrılmaz, içkin","stem":"The philosopher argued that the tension between individual freedom and social obligation is not a historical accident but an inherent feature of political life — one that must be managed rather than resolved.  As used in the text, \"inherent\" most nearly means:","n":9,"choices":{"B":"growing more intense over time","A":"existing as a natural, inseparable part of something","C":"recognized only recently by political theorists","D":"caused by specific institutional failures"},"slug":"gri-mod-sat-v2-1-9"},{"n":10,"choices":{"A":"suppressed through organized opposition","B":"brought about by incitement; provoked","D":"misrepresented in subsequent news coverage","C":"documented by independent journalists"},"ans":"B","slug":"gri-mod-sat-v2-1-10","why":"B is correct. Initiated through a coordinated campaign that exploited grievances = provoked, brought about. \"Instigate\" = to bring about or initiate through incitement.  A — suppressed is the opposite.  C — documented describes journalistic recording.  D — misrepresented describes media coverage, not the origin.  Kelime: instigate — kışkırtmak, başlatmak, tetiklemek","stem":"The investigation revealed that the early protests had been instigated not by local activists as initially reported, but by a coordinated campaign from outside the region that had exploited pre-existing economic grievances.  As used in the text, \"instigated\" most nearly means:"},{"n":11,"choices":{"B":"self-funded and operating independently","A":"fearless in the face of danger; very brave","C":"experienced in reporting from difficult environments","D":"ideologically committed to the story's subject"},"ans":"A","slug":"gri-mod-sat-v2-1-11","why":"A is correct. Entering alone without protection = fearless, brave. \"Intrepid\" = fearless; adventurously bold.  B — self-funded is a logistical circumstance.  C — experience is different from intrepidity.  D — ideological commitment is a motivation, not the quality described.  Kelime: intrepid — cesur, korkusuz, yılmaz","stem":"The intrepid journalist entered the conflict zone alone, without press credentials or official protection, to document the conditions in the border villages sealed off from outside reporters for months.  As used in the text, \"intrepid\" most nearly means:"},{"stem":"In the final chapter, the memoirist does not lament the opportunities she did not pursue in her youth — she frames them instead as preconditions that shaped the unexpected path her life actually took.  As used in the text, \"lament\" most nearly means:","why":"D is correct. Lament implies grief or regret; the memoirist chooses not to feel that. \"Lament\" = to express passionate grief or regret.  A — analyze is neutral; lament is emotional.  B — justify is a different activity.  C — public acknowledgment is different from expressing grief.  Kelime: lament — ağıt yakmak, yanıp yakılmak; derin üzüntü","ans":"D","choices":{"A":"analyze systematically for their effects","B":"justify or explain after the fact","C":"publicly acknowledge for the first time","D":"express deep grief or regret about"},"n":12,"slug":"gri-mod-sat-v2-1-12"},{"stem":"Prolonged exposure to the heavy, humid air left the team lethargic, moving through tasks at half their usual pace and losing the thread of complex discussions that would have been effortless in a cooler environment.  As used in the text, \"lethargic\" most nearly means:","why":"C is correct. Slow pace and difficulty with complex thinking = lacking energy. \"Lethargic\" = sluggish and apathetic; lacking energy.  A — irritable is a different physical response.  B — disoriented implies confusion about surroundings; lethargic implies low energy.  D — focused on immediate needs is a different behavioral response.  Kelime: lethargic — uyuşuk, halsiz, üşengeç","ans":"C","choices":{"D":"focused only on immediate physical needs","C":"sluggish and lacking energy or enthusiasm","B":"disoriented by unfamiliar surroundings","A":"unusually irritable due to physical discomfort"},"n":13,"slug":"gri-mod-sat-v2-1-13"},{"ans":"D","stem":"Even late in her illness, the novelist remained lucid, dictating precise edits to her assistant and engaging in sharp-minded discussions about the book's structure that showed no decline in her analytical powers.  As used in the text, \"lucid\" most nearly means:","slug":"gri-mod-sat-v2-1-14","why":"D is correct. Precise edits and sharp analytical discussions = clear, coherent mind. \"Lucid\" = clearly expressed; able to think and express clearly.  A — physical activity is different from cognitive clarity.  B — emotional resilience is a different quality.  C — creative productivity is not the specific quality of lucidity here.  Kelime: lucid — açık, anlaşılır, berrak; berrak düşünen","n":14,"choices":{"D":"clear and coherent in thought and expression","C":"creatively productive until the end of life","B":"emotionally resilient under difficult conditions","A":"physically active despite illness"}},{"n":15,"choices":{"A":"not yet fully developed from a cognitive standpoint","B":"capable of being shaped or influenced","C":"prone to accepting information uncritically","D":"easily distracted from sustained tasks"},"ans":"B","why":"B is correct. With guidance, their understanding can be changed — it is shapeable. \"Malleable\" = easily influenced or shaped; pliable.  A — not fully developed is different; malleable implies capacity for shaping.  C — uncritical acceptance implies passivity; malleable implies responsiveness to guidance.  D — distraction is a different cognitive tendency.  Kelime: malleable — şekil verilebilir, esnek; etkilenmeye açık","slug":"gri-mod-sat-v2-1-15","stem":"Young children's understanding of social norms is highly malleable: with careful guidance, they can learn to question inherited biases and develop more flexible frameworks for interpreting unfamiliar situations.  As used in the text, \"malleable\" most nearly means:"},{"ans":"A","stem":"The archivist's restoration work was meticulous: each page was treated with a different chemical solution based on its specific composition, and the sequencing of interventions followed a protocol she had developed over decades.  As used in the text, \"meticulous\" most nearly means:","why":"A is correct. Different solutions per page, precise protocols = extreme care and precision. \"Meticulous\" = showing great attention to detail; very careful.  B — innovation is a different quality.  C — slowness due to resources is a different cause.  D — historical convention is a different characteristic.  Kelime: meticulous — titiz, çok dikkatli, ayrıntılara özen gösteren","slug":"gri-mod-sat-v2-1-16","n":16,"choices":{"C":"slow and methodical due to limited resources","D":"guided by historical convention rather than new methods","A":"extremely careful and precise in attention to detail","B":"innovative in the application of new techniques"}},{"choices":{"B":"measure accurately for planning purposes","A":"completely eliminate through design intervention","C":"lessen the severity or intensity of","D":"draw attention to for public awareness"},"n":17,"slug":"gri-mod-sat-v2-1-17","why":"C is correct. Reducing the temperature differential = making the problem less severe. \"Mitigate\" = to lessen the force or intensity of something harmful.  A — eliminate is too strong; mitigate implies reduction, not removal.  B — measure is a different activity.  D — draw attention is a different goal.  Kelime: mitigate — hafifletmek, azaltmak, yumuşatmak","stem":"The architects incorporated rooftop gardens and permeable paving to mitigate the urban heat island effect, reducing the temperature differential between the building complex and the surrounding parkland.  As used in the text, \"mitigate\" most nearly means:","ans":"C"},{"why":"D is correct. Everyday practices, habits, and decisions = the ordinary, everyday. \"Mundane\" = lacking interest or excitement; relating to everyday life.  A — moral ambiguity is not what mundane describes.  B — social construction is a philosophical position.  C — resistant to analysis is not what mundane means.  Kelime: mundane — sıradan, olağan, gündelik","slug":"gri-mod-sat-v2-1-18","stem":"The philosopher argued that philosophy's preoccupation with abstract systems had caused it to neglect the mundane — the everyday practices, habits, and decisions that constitute most of actual human life.  As used in the text, \"mundane\" most nearly means:","ans":"D","choices":{"B":"socially constructed rather than naturally given","A":"morally ambiguous or difficult to evaluate","C":"resistant to philosophical analysis","D":"relating to ordinary everyday life"},"n":18},{"choices":{"A":"require the study to be redesigned","B":"reduce the significance of without eliminating","D":"attract critical attention from peer reviewers","C":"make null or invalid; nullify"},"n":19,"stem":"A single flaw in the experimental design was enough to negate the study's primary finding: the contaminated control group meant the results could not distinguish the treatment's effect from the contamination's effect.  As used in the text, \"negate\" most nearly means:","slug":"gri-mod-sat-v2-1-19","why":"C is correct. The contamination makes the results invalid = nullified. \"Negate\" = to nullify; to make ineffective or invalid.  A — requiring redesign is a consequence.  B — reduce significance is weaker than negate implies.  D — peer review is a process.  Kelime: negate — geçersiz kılmak, olumsuzlamak, çürütmek","ans":"C"},{"why":"A is correct. Cannot be read, no longer supported, documents inaccessible = no longer used or useful. \"Obsolete\" = no longer produced or used; out of date.  B — criticized implies active evaluation; obsolete implies simple non-use.  C — gradually being replaced is part of the process, not the final state.  D — incompatibility with some systems is a technical cause, not the definition.  Kelime: obsolete — eski moda, artık kullanılmayan, geçerliliğini yitirmiş","slug":"gri-mod-sat-v2-1-20","stem":"Within a decade, the file format had become obsolete: newer systems could not read it, most software no longer included support for it, and documents stored in it were effectively inaccessible.  As used in the text, \"obsolete\" most nearly means:","ans":"A","choices":{"B":"widely criticized for its technical limitations","A":"no longer used or useful; out of date","C":"gradually being replaced by an improved version","D":"incompatible with certain operating systems only"},"n":20},{"n":21,"choices":{"C":"deliberately favorable to one party","D":"difficult to understand; not transparent in meaning","B":"legally unenforceable under current statute","A":"unnecessarily lengthy and repetitive"},"ans":"D","stem":"The contract's indemnification clause was so opaque that the company's own lawyers spent three days debating what it actually required, concluding that its meaning depended entirely on which court interpreted it.  As used in the text, \"opaque\" most nearly means:","slug":"gri-mod-sat-v2-1-21","why":"D is correct. Lawyers debated for three days and could not determine the meaning = unclear. \"Opaque\" (fig.) = difficult or impossible to understand.  A — length is a different issue.  B — unenforceable is a legal status.  C — favorable to one party describes purpose, not clarity.  Kelime: opaque — anlaşılmaz, muğlak; ışık geçirmez"},{"ans":"D","slug":"gri-mod-sat-v2-1-22","why":"D is correct. Unanswered applications, no invitations, no responses = excluded from the professional community. \"Ostracize\" = to exclude from a group or society.  A — legal proceedings are mentioned as insufficient; ostracism is the social exclusion despite legal protection.  B — undermined within an organization is narrower.  C — denied opportunities is a consequence, not the definition.  Kelime: ostracize — toplumdan dışlamak, reddetmek","stem":"The whistleblower found that, despite formal legal protections, she was effectively ostracized within her industry: job applications went unanswered, conference invitations stopped, and former colleagues no longer returned her messages.  As used in the text, \"ostracized\" most nearly means:","n":22,"choices":{"C":"denied professional development opportunities","D":"excluded from a community or group; socially rejected","B":"systematically undermined within her organization","A":"subjected to formal legal proceedings"}},{"n":23,"choices":{"A":"widely recognized as effective","B":"most important; of supreme importance","D":"frequently discussed but rarely implemented","C":"required by regulatory authority"},"ans":"B","stem":"In aviation safety protocols, redundancy is paramount: every critical system must have a backup, every backup must have its own backup, and the failure of any single component must never cause a catastrophic outcome.  As used in the text, \"paramount\" most nearly means:","slug":"gri-mod-sat-v2-1-23","why":"B is correct. \"Every critical system must have a backup\" — redundancy is the top priority. \"Paramount\" = more important than anything else.  A — widely recognized describes reception.  C — regulatory requirement is a formal mandate; paramount is a statement of importance.  D — frequently discussed but rarely implemented is the opposite of paramount.  Kelime: paramount — en önemli, başat, her şeyin üzerinde"},{"slug":"gri-mod-sat-v2-1-24","why":"A is correct. Unnecessary qualifications, obscure sources where simpler would do, insights buried in footnotes = excessive focus on minor details. \"Pedantic\" = excessively concerned with minor details or rules.  B — inaccessible to specialists reverses the audience.  C — poor organization is different from pedantry.  D — challenging conventions is a different intellectual stance.  Kelime: pedantic — bilgiçlik taslayan, aşırı akademik, detaylara takılan","stem":"The professor's writing was pedantic in the worst sense: he devoted entire paragraphs to qualifications that readers did not need, cited obscure sources where standard ones would have sufficed, and buried his central insight in footnotes.  As used in the text, \"pedantic\" most nearly means:","ans":"A","choices":{"B":"technically accurate but inaccessible to specialists","A":"overly concerned with minor details or rules at the expense of clarity","D":"deliberately challenging to conventional views","C":"well-researched but poorly organized"},"n":24},{"n":25,"choices":{"C":"was detected by individuals with heightened sensory awareness","D":"intensified as it moved further from its source","A":"spread throughout; penetrated every part of","B":"was produced in unusually large quantities"},"ans":"A","stem":"The smell of baking bread permeated the entire building within minutes: it moved through the stairwells, slipped under doors, and reached even the top floors long before the loaves were taken out of the oven.  As used in the text, \"permeated\" most nearly means:","slug":"gri-mod-sat-v2-1-25","why":"A is correct. Moving through stairwells, under doors, to the top floors = spreading throughout. \"Permeate\" = to spread through; to penetrate every part of.  B — large quantities is about the amount produced, not the spreading.  C — detected by sensitive individuals describes a subset of those affected, not the spreading itself.  D — intensifying as it moves further is the opposite of what typically happens with diffusion.  Kelime: permeate — sızmak, işlemek, yaygınlaşmak"}]}],"id":"v2","eyebrow":"Kelime"},{"id":"v3","name":"Critical Thinking Vocabulary","blocks":[{"t":"p","x":"SAT kelime â Critical Thinking Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"ans":"B","why":"B is correct. Despite rejections, the author continued and rewrote three more times = continued steadfastly. \"Persevere\" = to continue steadfastly despite difficulty.  A — adapting to market demands describes a different strategy.  C — seeking validation is different from persevering alone.  D — consulting collaborators is a different approach.  Kelime: persevere — ısrar etmek, kararlılıkla sürdürmek","slug":"gri-mod-sat-v3-1-1","stem":"Despite repeated rejections from publishers, the author chose to persevere, rewriting the manuscript three more times before finally finding an editor who recognized its merits.  As used in the text, \"persevere\" most nearly means:","n":1,"choices":{"C":"seek external validation before continuing","D":"consult collaborators to improve the work","A":"adapt the work to suit market demands","B":"continue steadfastly despite difficulty"}},{"n":2,"choices":{"A":"cautious and inclined to avoid risk","B":"supported by empirical research","D":"consistent with established institutional practice","C":"guided by practical considerations rather than ideals"},"ans":"C","slug":"gri-mod-sat-v3-1-2","why":"C is correct. Choosing what can be done within constraints rather than the ideal = guided by practical considerations. \"Pragmatic\" = dealing with things realistically; practical rather than idealistic.  A — cautious is different from pragmatic.  B — empirical support is a different quality.  D — consistent with established practice is different from being pragmatic.  Kelime: pragmatic — pratik, gerçekçi, uygulamaya dönük","stem":"Rather than insisting on the ideal solution, the committee adopted a pragmatic approach, choosing reforms that could be implemented within the existing budget and were likely to gain stakeholder approval.  As used in the text, \"pragmatic\" most nearly means:"},{"choices":{"A":"discouraged but did not legally prohibit","B":"required formal approval before proceeding","D":"prevented; made impossible","C":"delayed pending review by a higher authority"},"n":3,"why":"D is correct. The agreement made public discussion impossible. \"Preclude\" = to prevent from happening; to make impossible.  A — discouraged implies it was still possible; precluded means impossible.  B — required approval is a different procedural requirement.  C — delayed implies temporary; precluded means permanently impossible.  Kelime: preclude — önlemek, engellemek, olanaksız kılmak","slug":"gri-mod-sat-v3-1-3","stem":"The strict confidentiality agreement signed by all participants precluded any public discussion of the proceedings, meaning that the committee's deliberations would remain entirely unknown to the press and the general public.  As used in the text, \"precluded\" most nearly means:","ans":"D"},{"ans":"A","stem":"Depression among college students is more prevalent than most campus surveys have historically captured, partly because stigma discourages self-reporting and partly because mild cases often go untreated and unrecorded.  As used in the text, \"prevalent\" most nearly means:","slug":"gri-mod-sat-v3-1-4","why":"A is correct. More common than surveys have captured = widely occurring. \"Prevalent\" = widespread; occurring frequently.  B — severity describes intensity, not frequency.  C — treatment resistance is a different characteristic.  D — associated with demographics is a different issue.  Kelime: prevalent — yaygın, sık görülen, hâkim olan","n":4,"choices":{"B":"severe in its clinical manifestations","A":"widely or commonly occurring","D":"associated with specific demographic groups","C":"resistant to available treatment options"}},{"n":5,"choices":{"C":"contested by a significant number of specialists","D":"deep and far-reaching in its effects","A":"widely publicized beyond the academic community","B":"immediately practical in its applications"},"ans":"D","why":"D is correct. Overturned decades of assumptions, opened new research, forced model rebuilding = deep and far-reaching. \"Profound\" = having or showing great depth of knowledge; very great or intense.  A — wide publicity describes dissemination, not the quality of the effect.  B — immediately practical is different; the discovery affected the theoretical field.  C — contested by specialists is a different circumstance.  Kelime: profound — derin, köklü, çok büyük; derinlikli","stem":"The discovery had a profound effect on the field: it overturned assumptions that had been held for decades, opened entirely new lines of research, and forced theorists to rebuild their models from the ground up.  As used in the text, \"profound\" most nearly means:","slug":"gri-mod-sat-v3-1-5"},{"n":6,"choices":{"D":"influential on subsequent generations of writers","C":"recognized internationally during her lifetime","A":"producing a large body of work","B":"financially successful through creative work"},"ans":"A","stem":"The poet was remarkably prolific despite working full-time as a teacher: she published eleven collections in twenty years and contributed to dozens of anthologies, while also corresponding extensively with other writers.  As used in the text, \"prolific\" most nearly means:","slug":"gri-mod-sat-v3-1-6","why":"A is correct. Eleven collections, dozens of anthologies, extensive correspondence = producing large quantities of work. \"Prolific\" = producing many works, results, or offspring; highly productive.  B — financial success is not what prolific describes.  C — international recognition is a reception outcome, not a production quality.  D — influence on subsequent generations is a legacy outcome.  Kelime: prolific — üretken, çok eser veren, verimli"},{"slug":"gri-mod-sat-v3-1-7","why":"A is correct. Gains, high confidence, no competing releases = conditions that favor success. \"Propitious\" = giving or indicating a good chance of success; favorable.  B — carefully selected describes the decision process, not the conditions.  C — widely anticipated describes public expectation.  D — aligned with strategy describes planning, not the favorability of conditions.  Kelime: propitious — elverişli, uygun, şansı getiren","stem":"The timing of the announcement was propitious: the market had just recorded three consecutive weeks of gains, investor confidence was high, and no major competing products were scheduled for release that quarter.  As used in the text, \"propitious\" most nearly means:","ans":"A","choices":{"C":"widely anticipated by industry observers","D":"aligned with the company's long-term strategy","A":"likely to produce favorable results; auspicious","B":"carefully selected after thorough analysis"},"n":7},{"ans":"C","why":"C is correct. Given volatility, holding low-risk assets = acting carefully and thinking about consequences. \"Prudent\" = acting with care and thought for the future.  A — fiduciary obligation is a legal requirement; prudent is a judgment quality.  B — consistent with preferences is a different consideration.  D — regulatory approval is a formal process, not the meaning of prudent.  Kelime: prudent — tedbirli, ihtiyatlı, sağduyulu","slug":"gri-mod-sat-v3-1-8","stem":"Given the market's volatility, the financial advisor considered it prudent to hold a larger-than-usual proportion of the portfolio in low-risk assets until conditions stabilized.  As used in the text, \"prudent\" most nearly means:","n":8,"choices":{"B":"consistent with the investor's stated preferences","A":"required by fiduciary obligation","D":"approved by the relevant regulatory authority","C":"acting with care and thought for consequences"}},{"ans":"D","stem":"The defense attorney spent most of her closing argument attempting to refute the prosecution's forensic timeline, presenting new photographic evidence that she argued was inconsistent with the alleged sequence of events.  As used in the text, \"refute\" most nearly means:","why":"D is correct. Presenting new evidence to show the timeline was wrong = proving it to be false. \"Refute\" = to prove a statement or person to be wrong.  A — reinterpret is more neutral; refute implies proving wrong.  B — delay consideration is a procedural action.  C — drawing attention to inconsistencies may be a method of refuting, but it is not the definition.  Kelime: refute — çürütmek, yanıtlamak, geçersiz kılmak","slug":"gri-mod-sat-v3-1-9","n":9,"choices":{"C":"draw attention to inconsistencies in","D":"prove to be wrong or false","A":"reinterpret in a more favorable light","B":"delay the consideration of"}},{"why":"A is correct. Normally not speaking openly = reserved, not inclined to reveal personal thoughts. \"Reticent\" = not revealing one's thoughts or feelings readily.  B — hostile implies active negative reaction; reticent is simply reserved.  C — prepared but prone to distraction is a different quality.  D — focusing on professional topics is a choice, not the quality of reticence.  Kelime: reticent — çekingen, az konuşan, ketum","slug":"gri-mod-sat-v3-1-10","stem":"Normally reticent in interviews, the author surprised journalists at the book launch by speaking openly about the autobiographical elements of the novel and the personal losses that had inspired its central themes.  As used in the text, \"reticent\" most nearly means:","ans":"A","choices":{"C":"well-prepared but prone to distraction","D":"focused on professional rather than personal topics","B":"hostile toward media attention","A":"not revealing one's thoughts or feelings; reserved"},"n":10},{"why":"D is correct. Going against all advice and being proven right = showing keen perception and good judgment. \"Sagacious\" = having or showing keen mental discernment and good judgment.  A — emotionally driven is the opposite of sagacious.  B — contrary to consensus without justification implies irrationality; sagacious implies good judgment.  C — fortunate due to luck is different from sagacious judgment.  Kelime: sagacious — basiretli, zeki, anlayışlı","slug":"gri-mod-sat-v3-1-11","stem":"The investor's most sagacious decision turned out to be the one she made against the advice of her entire team: pulling out of the sector eighteen months before the regulatory changes that decimated her competitors.  As used in the text, \"sagacious\" most nearly means:","ans":"D","choices":{"A":"emotionally driven and impossible to explain","B":"boldly contrary to consensus without justification","D":"having or showing keen mental discernment","C":"fortunate due to unforeseeable circumstances"},"n":11},{"n":12,"choices":{"D":"compare against industry benchmarks","C":"flag for external review","A":"record in a permanent audit log","B":"examine very carefully and critically"},"ans":"B","why":"B is correct. Examining every transaction carefully with particular attention = careful critical examination. \"Scrutinize\" = to examine or inspect closely and thoroughly.  A — record in a log is a documentation function.  C — flag for external review is a procedural action.  D — compare against benchmarks is a specific analytical method.  Kelime: scrutinize — dikkatlice incelemek, titizlikle gözden geçirmek","slug":"gri-mod-sat-v3-1-12","stem":"The auditors were instructed to scrutinize every transaction above ten thousand dollars for the previous three fiscal years, paying particular attention to transfers between subsidiaries in jurisdictions with limited disclosure requirements.  As used in the text, \"scrutinize\" most nearly means:"},{"choices":{"C":"having doubts; not easily convinced","D":"ideologically opposed to central banking in principle","B":"formally disagreeing through institutional channels","A":"publicly opposed to the central bank's policies"},"n":13,"slug":"gri-mod-sat-v3-1-13","why":"C is correct. Not convinced by the projections, arguing assumptions are too optimistic = having doubts, not easily persuaded. \"Skeptical\" = not easily convinced; having doubts or reservations.  A — publicly opposed implies formal opposition; skeptical is an epistemic stance.  B — formal institutional disagreement is a procedural action.  D — ideological opposition is a principled rejection, not mere skepticism.  Kelime: skeptical — şüpheci, kuşkucu, ihtiyatlı","stem":"Many economists remained skeptical of the central bank's projections, arguing that the assumptions underpinning the forecast were too optimistic and that three of the key variables had been mismodeled.  As used in the text, \"skeptical\" most nearly means:","ans":"C"},{"ans":"B","stem":"The organization launched a public campaign to solicit donations from former students, emphasizing that even small contributions would help fund scholarships for the next generation of underrepresented applicants.  As used in the text, \"solicit\" most nearly means:","why":"B is correct. Launching a campaign to get donations = asking for, seeking to obtain. \"Solicit\" = to ask for or try to obtain something from someone.  A — require by obligation implies compulsion; solicit implies a request.  C — acknowledge with gratitude describes a response, not a request.  D — distribute through channels describes outbound action.  Kelime: solicit — istemek, talep etmek, başvurmak","slug":"gri-mod-sat-v3-1-14","n":14,"choices":{"B":"ask for or seek to obtain","A":"require by formal obligation","C":"acknowledge with gratitude","D":"distribute through official channels"}},{"stem":"The patient reported sporadic episodes of dizziness — sometimes twice a day for a week, then none for a month — making it difficult for the neurologist to identify any consistent trigger or pattern.  As used in the text, \"sporadic\" most nearly means:","slug":"gri-mod-sat-v3-1-15","why":"B is correct. Sometimes twice a day, then none for a month = irregular, not continuous. \"Sporadic\" = occurring at irregular intervals; not steady or regular.  A — increasing frequency is a trend; sporadic implies no consistent trend.  C — limited to a specific time describes a trigger pattern not present here.  D — associated with activity describes a trigger, not the pattern of occurrence.  Kelime: sporadic — ara sıra olan, düzensiz, aralıklı","ans":"B","choices":{"A":"increasing in frequency over time","B":"occurring at irregular intervals; not continuous","D":"associated with a particular physical activity","C":"limited to a specific time of day"},"n":15},{"choices":{"D":"motivated primarily by personal conviction rather than consensus","C":"resolutely firm and unwavering","A":"inflexible because of lack of imagination","B":"cautious in the face of external pressure"},"n":16,"stem":"The organization's founder remained steadfast in her commitment to the original mission even as board members, donors, and staff urged her to pursue more commercially viable programming.  As used in the text, \"steadfast\" most nearly means:","slug":"gri-mod-sat-v3-1-16","why":"C is correct. Remaining committed despite pressure from all directions = resolutely firm and unwavering. \"Steadfast\" = resolutely or dutifully firm and unwavering.  A — inflexibility due to lack of imagination implies a deficiency; steadfast implies principled commitment.  B — cautious implies hesitation; steadfast implies firm continuation.  D — personal conviction is a motivation, not the quality of steadfastness itself.  Kelime: steadfast — kararlı, sarsılmaz, yerinden oynamaz","ans":"C"},{"slug":"gri-mod-sat-v3-1-17","n":17,"choices":{"B":"recently adopted without sufficient evidence","A":"controversial among affected industries","D":"applied selectively across different sectors","C":"requiring strict compliance; severe"},"ans":"C","stem":"The new environmental regulations were among the most stringent in the region's history, setting emissions limits far below what most industries currently achieved and imposing automatic penalties for violations.  As used in the text, \"stringent\" most nearly means:","why":"C is correct. Far below current levels with automatic penalties = requiring strict compliance, severe. \"Stringent\" = strict, precise, and exacting.  A — controversial describes reception, not the regulations themselves.  B — recently adopted without evidence describes a criticism, not the meaning.  D — selective application describes scope, not stringency.  Kelime: stringent — sıkı, katı, tavizsiz"},{"n":18,"choices":{"D":"economically exploit through imposed trade terms","C":"defeat and bring under complete control","A":"negotiate a peace settlement with","B":"monitor continuously for signs of rebellion"},"ans":"C","stem":"The empire did not merely defeat its rivals militarily; it sought to subjugate them entirely, replacing local administrative structures, suppressing native languages, and installing loyal governors at every level of regional authority.  As used in the text, \"subjugate\" most nearly means:","why":"C is correct. Replacing structures, suppressing languages, installing governors = bringing under complete control. \"Subjugate\" = to bring under domination or control, especially by conquest.  A — negotiate settlement implies mutual terms; subjugate implies complete dominance.  B — monitor for rebellion is one tool of subjugation, not the definition.  D — economic exploitation is one aspect; subjugate is broader total control.  Kelime: subjugate — boyun eğdirmek, egemenlik altına almak","slug":"gri-mod-sat-v3-1-18"},{"stem":"The committee's report was admirably succinct: in six pages it conveyed all the findings, identified three actionable priorities, and included a summary table that allowed readers to grasp the conclusions at a glance.  As used in the text, \"succinct\" most nearly means:","slug":"gri-mod-sat-v3-1-19","why":"D is correct. Six pages conveying everything clearly = brief and clearly expressed. \"Succinct\" = briefly and clearly expressed.  A — organized with visual aids is a formatting quality; succinct is about brevity of expression.  B — accessible to non-specialists is a readability quality, not the definition.  C — unanimous recommendations is about the committee's agreement, not the document's style.  Kelime: succinct — kısa ve öz, veciz, özlü","ans":"D","choices":{"A":"clearly organized with visual aids","B":"accessible to non-specialist readers","C":"unanimous in its recommendations","D":"brief and clearly expressed"},"n":19},{"ans":"B","stem":"The editor removed three entire chapters from the draft, arguing that they were superfluous — they added length and certain atmospheric details, but the book's argument was complete and fully convincing without them.  As used in the text, \"superfluous\" most nearly means:","why":"B is correct. Removed because the argument worked without them = unnecessary, more than needed. \"Superfluous\" = unnecessary; more than what is needed or wanted.  A — stylistic inconsistency is a different editorial problem.  C — inaccessible to general readers is a different concern.  D — originally written for a different purpose is a different circumstance.  Kelime: superfluous — gereksiz, fazladan, fazla","slug":"gri-mod-sat-v3-1-20","n":20,"choices":{"D":"originally written for a different purpose","C":"technically accurate but inaccessible to general readers","B":"unnecessary; more than what is needed","A":"stylistically inconsistent with the rest of the book"}},{"stem":"The investigative journalist spent four years pursuing the story, filing freedom-of-information requests, appealing denials, and cultivating sources inside the organization — a tenacious pursuit that eventually produced the exposé.  As used in the text, \"tenacious\" most nearly means:","why":"A is correct. Four years, repeated requests, appealing denials = not giving up. \"Tenacious\" = very determined; holding fast.  B — resourcefulness describes a method; tenacious describes persistence itself.  C — motivation for recognition is speculative and not implied.  D — skill in bureaucracy describes a capability, not the quality of tenacity.  Kelime: tenacious — ısrarcı, azimli, sıkı tutunan","slug":"gri-mod-sat-v3-1-21","ans":"A","choices":{"D":"skilled in navigating institutional bureaucracy","C":"motivated by a desire for public recognition","A":"holding fast; not giving up easily","B":"resourceful in finding alternative approaches"},"n":21},{"n":22,"choices":{"C":"dependent on temporary environmental conditions","D":"composed of works from multiple international sources","A":"accessible to a broad range of visitors","B":"lasting only a short time; temporary"},"ans":"B","why":"B is correct. Six weeks, then dispersed never to be shown together again = existing only for a short time. \"Transient\" = lasting only for a short time; temporary.  A — accessible to broad audiences describes the visitor experience.  C — dependent on temporary conditions is a different kind of temporariness.  D — composed of international sources describes the collection's origins.  Kelime: transient — geçici, kısa ömürlü, geçip giden","slug":"gri-mod-sat-v3-1-22","stem":"The exhibition's appeal was partly its transient nature: it would be installed for exactly six weeks, after which the works would be dispersed to museums and private collections around the world, never to be shown together again.  As used in the text, \"transient\" most nearly means:"},{"stem":"Within five years of its introduction, the device had become ubiquitous: it was used in offices, schools, hospitals, and homes across every economic tier, and it was difficult to imagine the routines of daily life without it.  As used in the text, \"ubiquitous\" most nearly means:","slug":"gri-mod-sat-v3-1-23","why":"A is correct. Used across offices, schools, hospitals, and homes at every economic level = present everywhere. \"Ubiquitous\" = present, appearing, or found everywhere.  B — affordable describes an economic quality.  C — well-regarded describes reputation.  D — regularly updated describes a maintenance quality.  Kelime: ubiquitous — her yerde olan, yaygın, kaçınılmaz","ans":"A","choices":{"A":"present, appearing, or found everywhere","B":"affordable across different income levels","D":"regularly updated to maintain its relevance","C":"well-regarded by both specialists and the general public"},"n":23},{"n":24,"choices":{"C":"sought compromise language that could satisfy both sides","D":"delayed action until the political climate became clearer","A":"wavered indecisively between opposing positions","B":"attempted to appear neutral to avoid political damage"},"ans":"A","stem":"The senator vacillated for weeks on the immigration bill, issuing statements that seemed supportive on Monday, raising objections on Wednesday, and requesting additional consultation by Friday — behavior that frustrated colleagues on both sides of the debate.  As used in the text, \"vacillated\" most nearly means:","why":"A is correct. Supportive statements, then objections, then more consultation = wavering indecisively. \"Vacillate\" = to keep changing one's mind; to waver between alternatives.  B — appearing neutral is a deliberate political strategy; vacillating is genuine indecision.  C — seeking compromise language implies a constructive goal; vacillating implies indecision.  D — delaying until conditions improve implies a deliberate wait; vacillating implies inability to decide.  Kelime: vacillate — kararsız kalmak, bocalamak, duraksamak","slug":"gri-mod-sat-v3-1-24"},{"stem":"The scientist's vehement denial of the allegations surprised even those who had not expected a quiet response: she called the accusations professionally irresponsible, demanded a public retraction, and threatened legal action.  As used in the text, \"vehement\" most nearly means:","why":"D is correct. Called accusations irresponsible, demanded retraction, threatened legal action = intensely forceful, showing strong feeling. \"Vehement\" = showing strong feeling; forceful, passionate.  A — legally informed describes the content of the response, not its quality.  B — supported by colleagues describes external support.  C — calm and systematic is the opposite of vehement.  Kelime: vehement — şiddetli, ateşli, hararetli","slug":"gri-mod-sat-v3-1-25","ans":"D","choices":{"C":"calm and systematic in its methodology","D":"showing strong feeling; intensely forceful","A":"legally informed and strategically precise","B":"widely supported by colleagues in the field"},"n":25}]}],"group":"Kelime","eyebrow":"Kelime"},{"eyebrow":"Kelime","name":"Literature & Arts Vocabulary","blocks":[{"x":"SAT kelime â Literature & Arts Vocabulary. 25 soru, her birinde ayrıntılı açıklama.","t":"p"},{"t":"mcqquiz","items":[{"n":1,"choices":{"B":"deliberately vague to preserve flexibility","A":"technically precise at the expense of readability","C":"using more words than necessary; wordy","D":"written for an audience with specialist knowledge"},"ans":"C","stem":"The contract was so verbose that the standard summary version, itself twenty pages long, was required by the company's legal team before any executive would agree to read the full document.  As used in the text, \"verbose\" most nearly means:","slug":"gri-mod-sat-v4-1-1","why":"C is correct. So long it required a twenty-page summary = using more words than necessary. \"Verbose\" = using or expressed in more words than needed.  A — technically precise is a different quality.  B — deliberately vague describes clarity, not length.  D — written for specialists describes the audience, not the writing style.  Kelime: verbose — fazla kelime kullanan, uzun soluklu, sözcük cömbertiği"},{"choices":{"B":"consistent with the client's original specifications","A":"preferred by the engineering team for aesthetic reasons","D":"capable of being done or working successfully","C":"supported by sufficient empirical data"},"n":2,"stem":"After months of testing, only two of the seven proposed designs remained viable: the others had been eliminated for exceeding the weight limit, failing structural stress tests, or proving too expensive to manufacture at scale.  As used in the text, \"viable\" most nearly means:","why":"D is correct. The others were eliminated for specific disqualifying reasons; these two still work = capable of working successfully. \"Viable\" = capable of working successfully; feasible.  A — preferred for aesthetic reasons describes a preference, not viability.  B — consistent with specifications is a requirement, not the definition of viable.  C — supported by data is a criterion, not the definition.  Kelime: viable — uygulanabilir, gerçekleştirilebilir, yaşayabilir","slug":"gri-mod-sat-v4-1-2","ans":"D"},{"ans":"D","stem":"Border agents were instructed to remain especially vigilant during the holiday period, when historically higher passenger volumes had provided cover for attempts to circumvent customs inspections.  As used in the text, \"vigilant\" most nearly means:","slug":"gri-mod-sat-v4-1-3","why":"D is correct. Remaining watchful and alert during a period of vulnerability = keenly watchful to detect danger. \"Vigilant\" = keeping careful watch for possible danger.  A — present in greater numbers describes staffing levels.  B — following an expanded checklist is a procedural response.  C — coordinating across jurisdictions is a cooperative arrangement.  Kelime: vigilant — tetikte, uyanık, dikkatli","n":3,"choices":{"C":"coordinating with counterparts across jurisdictions","D":"keenly watchful to detect danger; alert","B":"following an expanded checklist of procedures","A":"present in greater numbers than usual"}},{"choices":{"A":"explain the scientific mechanism underlying","B":"extend to a broader population than originally studied","D":"encourage wider adoption through policy incentives","C":"demonstrate to be right or justified after doubt"},"n":4,"stem":"The long-awaited scientific study seemed to vindicate the nutritional approach that had been dismissed for decades: participants following the protocol showed measurably better outcomes across every health marker tracked.  As used in the text, \"vindicate\" most nearly means:","slug":"gri-mod-sat-v4-1-4","why":"C is correct. Dismissed for decades but now shown to produce better outcomes = shown to be right after being doubted. \"Vindicate\" = to clear of blame or suspicion; to show or prove to be right.  A — explain the mechanism describes scientific elaboration.  B — extend to a broader population describes scale.  D — encourage adoption describes a policy action.  Kelime: vindicate — haklı çıkarmak, temize çıkarmak, doğrulamak","ans":"C"},{"n":5,"choices":{"A":"become smaller or weaker; diminish","B":"shift direction entirely","D":"become associated with controversy","C":"generate criticism instead of support"},"ans":"A","slug":"gri-mod-sat-v4-1-5","why":"A is correct. Attendance dropped, coverage shifted, petition stalled = getting smaller and weaker. \"Wane\" = to decrease in vigor, power, or extent; to diminish.  B — shift direction implies change in type, not reduction.  C — generate criticism describes a change in kind, not in degree.  D — association with controversy is a different change.  Kelime: wane — azalmak, zayıflamak, giderek küçülmek","stem":"Public enthusiasm for the project began to wane after the first delays were announced: attendance at community meetings dropped, media coverage shifted to other stories, and the petition's online support page stopped adding new signatures.  As used in the text, \"wane\" most nearly means:"},{"n":6,"choices":{"A":"feeling or showing caution about possible dangers","B":"legally protected through prior contractual experience","C":"financially constrained after previous losses","D":"strategically selective about potential partnerships"},"ans":"A","slug":"gri-mod-sat-v4-1-6","why":"A is correct. Previous partners failed to deliver; the founders now exercise caution = feeling caution about possible dangers. \"Wary\" = feeling or showing caution about possible dangers.  B — legally protected describes a status, not a disposition.  C — financially constrained is a material consequence, not the emotional state of wariness.  D — strategically selective describes behavior, not the underlying disposition.  Kelime: wary — temkinli, ihtiyatlı, dikkatli","stem":"Burned twice by partners who had failed to deliver on their commitments, the startup's founders were understandably wary of entering new agreements without extensive due diligence and contract safeguards.  As used in the text, \"wary\" most nearly means:"},{"choices":{"D":"having or showing great energy and enthusiasm","C":"primarily motivated by financial compensation","A":"professionally experienced and technically skilled","B":"highly systematic in her organizational approach"},"n":7,"stem":"The new volunteer coordinator was so zealous in her outreach that she personally contacted every former donor in the database, organized three fundraising events in her first month, and began designing a mobile app to streamline donations.  As used in the text, \"zealous\" most nearly means:","slug":"gri-mod-sat-v4-1-7","why":"D is correct. Personally contacting every donor, three events in one month, designing an app = great energy and enthusiasm. \"Zealous\" = having or showing great energy or enthusiasm in pursuit of a cause.  A — professionally experienced describes background, not enthusiasm.  B — systematic describes method, not the intensity of commitment.  C — financial motivation is not implied.  Kelime: zealous — hevesli, gayretli, coşkulu","ans":"D"},{"ans":"C","slug":"gri-mod-sat-v4-1-8","why":"C is correct. Reminded about procedure, not disqualified = warned firmly but not severely. \"Admonish\" = to warn or reprimand someone, often gently.  A — disqualified is a severe formal action; admonish is a warning.  B — requested to clarify is a different communicative act.  D — praised is the opposite.  Kelime: admonish — uyarmak, azarlamak, ikaz etmek","stem":"The judge admonished the witness for speaking before being asked a question, reminding her that the court's procedures required direct answers and that unsolicited elaborations were not permitted.  As used in the text, \"admonished\" most nearly means:","n":8,"choices":{"B":"requested to clarify a confusing response","A":"formally disqualified from testifying","C":"warned or reprimanded firmly but not severely","D":"publicly praised for a valuable contribution"}},{"ans":"C","stem":"The report did not merely describe the problem — it actively advocated for a specific policy response, recommending that the legislature adopt the proposed subsidy framework within the current session.  As used in the text, \"advocated\" most nearly means:","slug":"gri-mod-sat-v4-1-9","why":"C is correct. Actively recommending a specific policy = publicly supporting and recommending. \"Advocate\" = to publicly recommend or support.  A — objectively described is the opposite; the report took a position.  B — predicted likelihood is different from recommending.  D — criticized alternatives is a method of advocacy, not the definition.  Kelime: advocate — savunmak, desteklemek; taraftar","n":9,"choices":{"B":"predicted the likelihood of adoption","A":"described objectively without expressing a preference","D":"criticized alternative approaches to the same problem","C":"publicly supported and recommended"}},{"n":10,"choices":{"A":"make less severe; relieve partially","B":"permanently eliminate through targeted treatment","D":"prevent the symptoms from recurring","C":"identify the specific mechanism causing"},"ans":"A","slug":"gri-mod-sat-v4-1-10","why":"A is correct. Relieve the most painful symptoms even without a full cure = make less severe, relieve partially. \"Alleviate\" = to make suffering or a problem less severe.  B — permanently eliminate is too strong; alleviate implies partial relief.  C — identify the mechanism is a diagnostic function.  D — prevent recurrence is different from relieving current severity.  Kelime: alleviate — hafifletmek, azaltmak, rahatlatmak","stem":"Researchers hoped that the new drug would alleviate the most painful symptoms even if a complete cure remained out of reach, allowing patients to manage daily life without constant reliance on strong analgesics.  As used in the text, \"alleviate\" most nearly means:"},{"choices":{"C":"translated imperfectly from another language","D":"legally contested by third-party observers","A":"open to more than one interpretation","B":"deliberately misleading in its language"},"n":11,"stem":"The treaty's third clause was sufficiently ambiguous that both parties signed it with different interpretations in mind, and the resulting disagreement required three years of subsequent negotiation to resolve.  As used in the text, \"ambiguous\" most nearly means:","why":"A is correct. Both parties signed with different interpretations = open to more than one meaning. \"Ambiguous\" = open to more than one interpretation; not having one obvious meaning.  B — deliberately misleading implies intent; ambiguous can be unintentional.  C — poor translation is a possible cause, not the definition.  D — legally contested by third parties describes a consequence.  Kelime: ambiguous — belirsiz, iki anlamlı, muğlak","ans":"A","slug":"gri-mod-sat-v4-1-11"},{"choices":{"C":"gradually becoming more negative about an earlier commitment","D":"influenced by both personal and professional considerations","A":"confused about what the right decision would mean in practice","B":"having mixed feelings; uncertain due to opposing reactions"},"n":12,"slug":"gri-mod-sat-v4-1-12","why":"B is correct. Both exhausted and genuinely loving the work = having mixed feelings, opposing reactions simultaneously. \"Ambivalent\" = having mixed feelings or contradictory ideas about something.  A — confused about practical implications is different from having mixed feelings.  C — gradually becoming more negative implies a trajectory; ambivalent implies simultaneous opposing feelings.  D — personal and professional considerations describes the categories, not the emotional state.  Kelime: ambivalent — kararsız, iki duygu arasında kalmış","stem":"The graduate student was ambivalent about leaving academia: she was exhausted by the funding uncertainty and long hours, but she had genuinely loved the research and feared she would miss the intellectual community.  As used in the text, \"ambivalent\" most nearly means:","ans":"B"},{"slug":"gri-mod-sat-v4-1-13","why":"D is correct. Dismissive response made the dispute worse and harder to resolve = provoked hostility, made them more opposed. \"Antagonize\" = to cause hostility in; to provoke opposition.  A — confuse with contradictory information is a different effect.  B — exclude from decision-making is a specific action.  C — misrepresent to stakeholders is a different behavior.  Kelime: antagonize — düşman etmek, kışkırtmak, karşı cephede bırakmak","stem":"The manager's dismissive response to the team's concerns only served to antagonize them further, making it significantly harder to resolve the underlying dispute before it escalated to the executive level.  As used in the text, \"antagonize\" most nearly means:","ans":"D","choices":{"B":"exclude from future decision-making processes","A":"confuse by providing contradictory information","C":"deliberately misrepresent to other stakeholders","D":"cause hostility in; provoke opposition from"},"n":13},{"slug":"gri-mod-sat-v4-1-14","choices":{"C":"excessively bureaucratic in its requirements","D":"rarely followed in practice despite remaining on the books","B":"inconsistent across different departments","A":"very old-fashioned; belonging to an earlier period"},"n":14,"stem":"The company's HR policies were widely criticized as archaic: the leave request process required paper forms to be submitted in triplicate, approved at four levels of management, and filed in physical folders.  As used in the text, \"archaic\" most nearly means:","why":"A is correct. Paper triplicate forms approved at four levels = belonging to an earlier, outdated era. \"Archaic\" = very old or old-fashioned.  B — inconsistency is a different problem.  C — excessively bureaucratic describes the effect, not the quality of archaism.  D — rarely followed in practice is a different observation.  Kelime: archaic — eskimiş, günümüzde kullanılmayan, çok eski","ans":"A"},{"choices":{"C":"identify through extended research","D":"present in a format suited to the audience","A":"resolve through structured analysis","B":"express coherently and in detail"},"n":15,"slug":"gri-mod-sat-v4-1-15","why":"B is correct. Explaining clearly both what and why = expressing coherently and in detail. \"Articulate\" (v.) = to express an idea or feeling clearly and effectively.  A — resolve implies finding a solution; articulate means expressing clearly.  C — identify through research describes discovery.  D — format suited to audience describes presentation strategy.  Kelime: articulate — açık ifade etmek; anlaşılır konuşan","stem":"The intern surprised everyone in the presentation by being able to articulate the project's core tensions clearly — explaining not just what the challenges were but why they were fundamentally difficult to resolve simultaneously.  As used in the text, \"articulate\" most nearly means:","ans":"B"},{"ans":"B","stem":"The writer lived an almost ascetic life during the composition of the novel: he sublet his apartment, moved to a small room in the countryside, ate two meals a day, and checked his email once a week.  As used in the text, \"ascetic\" most nearly means:","slug":"gri-mod-sat-v4-1-16","why":"B is correct. Sublet apartment, countryside room, two meals, weekly email = severe self-discipline, willingly austere. \"Ascetic\" = characterized by the practice of severe self-discipline.  A — isolated to avoid interruption is a reason, not the quality itself.  C — financially constrained implies necessity; ascetic implies chosen simplicity.  D — devoted to creative life is a motivation, not the quality of asceticism.  Kelime: ascetic — dünyadan el etek çekmiş; sade, kendini kısıtlayan","n":16,"choices":{"A":"isolated to avoid professional interruption","B":"characterized by severe self-discipline; austere","C":"financially constrained by limited earnings","D":"devoted entirely to creative rather than social life"}},{"why":"B is correct. Not memorize as rules but internalize as a way of thinking = absorb and integrate. \"Assimilate\" = to absorb and integrate; to take in and make part of oneself.  A — memorize through repetition is the approach being contrasted with assimilation.  C — apply consistently describes behavior after assimilation.  D — teach to colleagues is a different activity.  Kelime: assimilate — özümsemek, benimsemek; uyum sağlamak","stem":"The new employees were encouraged to assimilate the company's design principles not as a set of rules to memorize but as a way of thinking that would eventually shape their instinctive responses to new problems.  As used in the text, \"assimilate\" most nearly means:","ans":"B","choices":{"D":"teach to colleagues through structured mentorship","C":"apply consistently in all professional contexts","A":"memorize through repeated review and testing","B":"absorb and integrate into one's thinking"},"n":17,"slug":"gri-mod-sat-v4-1-17"},{"stem":"The startup's pitch was audacious by any measure: the founders were requesting twenty million dollars with no revenue, no signed customers, and a technology platform that had been demonstrated only in a controlled laboratory environment.  As used in the text, \"audacious\" most nearly means:","slug":"gri-mod-sat-v4-1-18","why":"B is correct. No revenue, no customers, unproven technology = requesting a bold amount with very little established. \"Audacious\" = showing a willingness to take surprisingly bold risks.  A — unrealistic describes the evaluation, not the quality.  C — compelling describes reception, not audacity.  D — modest in initial claims is the opposite of what is described.  Kelime: audacious — cüretkar, gözüpek, atılgan","ans":"B","choices":{"D":"ambitious in scope but modest in its initial claims","C":"compelling in its vision despite practical limitations","A":"clearly unrealistic in its financial projections","B":"showing a willingness to take surprisingly bold risks"},"n":18},{"choices":{"B":"a pattern of behavior established over many years","A":"a principled philosophical objection to","C":"a strong dislike of or opposition to","D":"an inability to understand the appeal of"},"n":19,"why":"C is correct. Deactivated accounts, no reason to return, finds the language distasteful = strong dislike. \"Aversion\" = a strong dislike or disinclination.  A — principled philosophical objection implies a systematic position; aversion is an emotional response.  B — pattern of behavior is a consequence of aversion, not the definition.  D — inability to understand the appeal is different from actively disliking.  Kelime: aversion — tiksinti, nefret, isteksizlik","slug":"gri-mod-sat-v4-1-19","stem":"The novelist's aversion to social media was well-known: she had deactivated all her accounts years before, saw no reason to return to them, and found even the language of digital engagement distasteful.  As used in the text, \"aversion\" most nearly means:","ans":"C"},{"ans":"B","stem":"What the investors had initially characterized as a benign accounting irregularity turned out to be a more serious problem: the irregularity had masked a systematic overstatement of revenue across four consecutive quarters.  As used in the text, \"benign\" most nearly means:","why":"B is correct. Called benign = considered harmless or minor; it turned out to be something worse. \"Benign\" = gentle; not harmful.  A — isolated and unlikely to recur describes a different assessment.  C — unintentional is a cause, not what benign means.  D — already corrected is a different status.  Kelime: benign — zararsız, iyi huylu; nazik","slug":"gri-mod-sat-v4-1-20","n":20,"choices":{"D":"already identified and corrected by the company","C":"unintentional and therefore less serious","B":"not harmful; relatively minor","A":"isolated and unlikely to recur"}},{"ans":"A","stem":"The blatant contradiction between the senator's public statements and her private communications left the editorial board with no choice but to publish the internal documents, despite objections from her office.  As used in the text, \"blatant\" most nearly means:","why":"A is correct. The contradiction was open and undeniable = done openly, obviously. \"Blatant\" = done openly and unashamedly; conspicuously obvious.  B — legally actionable describes a consequence, not the quality.  C — recently discovered describes when it became known.  D — affecting the election describes an outcome.  Kelime: blatant — bariz, apaçık, yüzsüz","n":21,"choices":{"C":"recently discovered rather than long-standing","D":"significant enough to affect the election outcome","B":"legally actionable under campaign finance law","A":"done openly and unashamedly; obvious"},"slug":"gri-mod-sat-v4-1-21"},{"n":22,"choices":{"B":"precision in numerical and statistical reporting","A":"clarity and freedom from technical jargon","C":"accessibility for readers without specialist training","D":"conciseness; the quality of being brief"},"ans":"D","stem":"The memo was praised for its brevity: what had previously required a two-page analysis was compressed into three bullet points, each containing precisely the information that managers needed to make the decision.  As used in the text, \"brevity\" most nearly means:","why":"D is correct. Compressed into three bullet points what previously took two pages = the quality of being brief. \"Brevity\" = concise and exact use of words; briefness.  A — clarity is related but separate from brevity.  B — numerical precision is a specific kind of accuracy.  C — accessibility to non-specialists is a different quality.  Kelime: brevity — kısalık, öz ifade","slug":"gri-mod-sat-v4-1-22"},{"choices":{"B":"detailed knowledge of complex financial matters","A":"the quality of being honest and straightforward","C":"willingness to provide information on request","D":"an absence of conflict of interest"},"n":23,"stem":"The CEO's candor in the earnings call surprised analysts accustomed to hedged language: she named the specific divisions that had underperformed, identified the decisions that had contributed to the shortfall, and offered no self-serving rationalizations.  As used in the text, \"candor\" most nearly means:","why":"A is correct. Named specific failures without rationalization = honest and straightforward. \"Candor\" = the quality of being open and honest.  B — detailed knowledge is expertise, not candor.  C — willingness to provide information on request describes responsiveness.  D — absence of conflict of interest is an ethics standard.  Kelime: candor — açıksözlülük, dürüstlük, samimiyet","ans":"A","slug":"gri-mod-sat-v4-1-23"},{"n":24,"choices":{"A":"emotionally overwhelming and difficult to process","B":"thematically consistent with the book's central concerns","C":"providing relief through the release of strong emotions","D":"likely to be divisive among readers with different expectations"},"ans":"C","why":"C is correct. Strange sense of resolution and relief after an emotionally heavy ending = release of strong emotions providing relief. \"Cathartic\" = providing psychological relief through the release of strong emotions.  A — emotionally overwhelming without relief is different from cathartic.  B — thematically consistent describes artistic coherence.  D — likely to be divisive describes reception.  Kelime: cathartic — arındırıcı, duygusal boşalma sağlayan","stem":"Many readers found the novel's devastating final act unexpectedly cathartic: the accumulated weight of the narrative demanded exactly such an ending, and experiencing it brought a strange sense of resolution and relief.  As used in the text, \"cathartic\" most nearly means:","slug":"gri-mod-sat-v4-1-24"},{"slug":"gri-mod-sat-v4-1-25","n":25,"choices":{"B":"investigate through an independent inquiry","A":"remove from a position of public trust","C":"acquit following a thorough review of the evidence","D":"formally reprimand or express strong disapproval of"},"ans":"D","stem":"The ethics committee voted to censure the official for misusing public funds, stopping short of recommending removal but issuing a formal statement of disapproval that was entered permanently into the public record.  As used in the text, \"censure\" most nearly means:","why":"D is correct. Stopping short of removal but issuing formal disapproval entered into the record = formally reprimanding. \"Censure\" = to express severe disapproval of, formally and publicly.  A — remove from position is a more severe action that was explicitly not taken.  B — investigate is what precedes censure.  C — acquit is the opposite.  Kelime: censure — kınamak, eleştirmek, resmen suçlamak"}]}],"group":"Kelime","id":"v4"},{"name":"Social & Political Vocabulary","blocks":[{"t":"p","x":"SAT kelime â Social & Political Vocabulary. 25 soru, her birinde ayrıntılı açıklama."},{"t":"mcqquiz","items":[{"n":1,"choices":{"A":"worsening due to deliberate
