m + iyelik + collocation birlikte çalışır."}, {"k": "dikkat","lines": ["his/her'i sahibin cinsiyetine göre seç, nesneye göre değil.","Yaş 'be' ile: 'he is thirty'; 'he has thirty years' yanlış.","das Kind ve das Mädchen nötrdür (das), doğal cinsiyete aldanma.","look after (bakmak) ile take after (benzemek) karıştırma."],"t": "note","title": "Bu paketin tuzak özeti"}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "die Mutter", "choices": {"A": "father", "B": "child", "C": "mother", "D": "sister"}, "ans": "C", "why": "die Mutter = mother (anne).", "slug": "gri-mod-udsp-p5-1"}, {"n": 2, "stem": "der Vater", "choices": {"A": "father", "B": "brother", "C": "man", "D": "child"}, "ans": "A", "why": "der Vater = father (baba).", "slug": "gri-mod-udsp-p5-2"}, {"n": 3, "stem": "das Kind", "choices": {"A": "woman", "B": "girl", "C": "boy", "D": "child"}, "ans": "D", "why": "das Kind = child (çocuk).", "slug": "gri-mod-udsp-p5-3"}, {"n": 4, "stem": "die Schwester", "choices": {"A": "mother", "B": "sister", "C": "brother", "D": "woman"}, "ans": "B", "why": "die Schwester = sister (kız kardeş).", "slug": "gri-mod-udsp-p5-4"}, {"n": 5, "stem": "der Mann", "choices": {"A": "woman", "B": "boy", "C": "man", "D": "father"}, "ans": "C", "why": "der Mann = man (adam).", "slug": "gri-mod-udsp-p5-5"}, {"n": 6, "stem": "die Leute", "choices": {"A": "people", "B": "child", "C": "girl", "D": "family"}, "ans": "A", "why": "die Leute = people (insanlar).", "slug": "gri-mod-udsp-p5-6"}]}]}, {"id": "p6", "group": "Kelime Paketleri", "name": "Paket 6. Natur und Wetter", "eyebrow": "P6", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["die Sonne", "sun", "güneş"], ["der Regen", "rain", "yağmur"], ["der Schnee", "snow", "kar"], ["der Wind", "wind", "rüzgar"], ["der Baum", "tree", "ağaç"], ["die Blume", "flower", "çiçek"], ["das Meer", "sea", "deniz"], ["der Berg", "mountain", "dağ"], ["kalt", "cold", "soğuk"], ["warm", "warm", "sıcak"]]}, {"t": "h","x": "Doğa ve hava kelimeleri: betimleme ve kıyas sorularının zemini"}, {"t": "p","x": "Bu paketteki kelimeler (güneş, yağmur, kar, rüzgar, ağaç, çiçek, deniz, dağ, soğuk, sıcak) sınavda doğa, coğrafya ve mevsim anlatan betimleme metinlerinin temelini kurar. Bir okuma parçasında bir bölgenin iklimi anlatılırken 'it is cold in winter', 'the mountains are covered with snow' gibi ifadeler geçer; cloze paragraflarında hava ve doğa kelimeleri sahneyi kurar ve gerisini tahmin etmeni sağlar. Bu kelimeleri sıfat ve kalıplarıyla bilmek, betimleme ve karşılaştırma sorularını birlikte çözer. Doğa metinleri sınavda çoğu zaman bir yerin coğrafyasını, mevsim değişimini ya da çevre konusunu anlatır; bu parçalarda hava ve arazi kelimeleri hem özne hem de betimleyici ayrıntı olarak sürekli tekrar eder."}, {"t": "p","x": "Hava kelimelerinin tuzağı, İngilizcenin havayı 'kişisiz' anlatmasıdır. Türkçede 'yağmur yağıyor' deriz, özne yoktur; İngilizce ise boş bir özne olan 'it' kullanır: 'It is raining.' Almanca da 'es' ile aynısını yapar: 'Es regnet.' Öğrenci bu 'it'i atlayıp 'Is raining' ya da 'Rain is falling' gibi yapay cümleler kurar. Bu paketin asıl konusu, doğa kelimelerini doğru hava kalıbı ('it is + sıfat', 'it is + -ing') ve karşılaştırma yapısıyla kullanmaktır."}, {"t": "h","x": "Artikel: doğa isimlerini cinsiyetiyle öğren"}, {"t": "p","x": "Almanca doğa isimlerinde artikel ezberlenmelidir çünkü mantık her zaman açık değildir. Hava olayları çoğunlukla 'der' alır: der Regen (yağmur), der Schnee (kar), der Wind (rüzgar). Bitki ve yükseltiler de sık 'der'dir: der Baum (ağaç), der Berg (dağ). 'die' alanlar: die Sonne (güneş), die Blume (çiçek). 'das' alan: das Meer (deniz). Bu artikelleri isimle birlikte söyleyerek ezberle. Unutma: 'kalt' ve 'warm' birer sıfattır ve artikel almaz; yalnızca isimlerin (Sonne, Regen, Meer) artikeli vardır. Bu ayrımı karıştırmamak için her satırı zihninde 'artikel + isim' ya da 'yalnız sıfat' diye işaretle."}, {"head": ["Almanca","Artikel","Türkçe"],"rows": [["Regen, Schnee, Wind","der","yağmur, kar, rüzgar"],["Baum, Berg","der","ağaç, dağ"],["Sonne, Blume","die","güneş, çiçek"],["Meer","das","deniz"],["kalt / warm","(sıfat)","soğuk / sıcak — artikel almaz"]],"t": "table"}, {"t": "h","x": "Hava durumu kalıbı: it is + sıfat / it is + -ing"}, {"t": "p","x": "İngilizcede havayı boş özne 'it' ile anlatırız. İki temel kalıp vardır: durum için 'it is + sıfat' (It is cold. It is sunny. It is windy.), süregelen olay için 'it is + fiil-ing' (It is raining. It is snowing.). 'It' asla düşmez; 'Is cold today' yanlıştır, 'It is cold today' doğrudur. Geçmişte 'it was cold', gelecekte 'it will be cold' aynı boş özneyi korur. Hava sormak için de aynı kalıp kullanılır: 'What is the weather like?' (Hava nasıl?) ve cevabı 'It is sunny and warm.' biçimindedir. 'How is the weather?' de kabul edilir ama '... like?' kalıbı daha yaygındır."}, {"t": "p","x": "Hava sıfatlarının çoğu, isimden '-y' ekiyle türetilir: sun → sunny (güneşli), rain → rainy (yağmurlu), wind → windy (rüzgarlı), snow → snowy (karlı), cloud → cloudy (bulutlu), fog → foggy (sisli). Bu düzenli türetmeyi bilmek, tek bir isimden hem hava durumu sıfatını hem de fiili ('to rain', 'to snow') çıkarmanı sağlar."}, {"head": ["İsim","Sıfat","Örnek"],"rows": [["sun","sunny","It is sunny today."],["rain","rainy","a rainy afternoon"],["wind","windy","It is very windy."],["snow","snowy","a snowy mountain"],["cloud","cloudy","The sky is cloudy."]],"t": "table"}, {"k": "dikkat","lines": ["Boş özne 'it' düşmez: 'It is raining.' ('Is raining' ya da 'Raining now' yanlış).","Süregelen hava için -ing: 'It is snowing' (şu an); genel durum için geniş zaman: 'It often rains here.'","Sıfat çoğulda -s almaz: 'cold winds' doğru, 'colds winds' yanlış."],"t": "note","title": "Hava kalıbı tuzağı"}, {"t": "h","x": "Sıfatlar: sıra ve be fiili"}, {"t": "p","x": "Sıfatlar ismin önünde durur ('a cold wind', 'a high mountain') ya da 'be' fiilinden sonra gelir ('The wind is cold', 'The mountain is high'). İki kullanım da doğrudur ama anlam aynıdır. İngilizce sıfat, ismin sayısından etkilenmez: 'a warm day', 'warm days' — sıfat hep 'warm' kalır. Bu, Türkçe konuşan öğrenci için kolaydır ama Almancadaki sıfat çekimini (kalter Wind / kalte Winde) İngilizceye taşımamak gerekir. İngilizcede birden fazla sıfat yan yana gelince aralarına virgül ya da 'and' konabilir: 'a cold, windy day' ya da 'the day was cold and windy'. Bu, doğa betimlemesini zenginleştirir ve sık karşılaşılan bir yapıdır."}, {"head": ["Yapı","Örnek","Not"],"rows": [["sıfat + isim","a cold sea","sıfat önde"],["be + sıfat","The sea is cold.","yüklem sıfatı"],["çoğulda değişmez","warm days","sıfat -s almaz"],["derece zarfı","very / quite cold","zarf sıfattan önce"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: it is + sıfat mı, -ing mi?","x": "Cümle: 'Take an umbrella; ___ outside.' Seçenekler: (A) it rains  (B) it is raining  (C) is raining  (D) rains it. Mantık: 'şu anda' bir durum ('şemsiye al') anlatılıyor, yani süregelen hava: 'it is raining'. 'it rains' genel/alışkanlık anlatır, bu ana uymaz; 'is raining' boş özneyi ('it') düşürdüğü için yanlış. Doğru cevap: B. Ders: şu anki hava = it is + -ing; genel hava = it + geniş zaman."}, {"k": "protokol","lines": ["1) Tabloyu sesli oku: Almanca artikel + İngilizce + Türkçe.","2) Her isimden hava sıfatını türet: sun→sunny, wind→windy.","3) Boş özne 'it' ile hava cümlesi kur: 'It is cold.', 'It is snowing.'","4) Karşılaştırma yap: 'colder than', 'the coldest'.","5) Alıştırmayı çöz, sonra quizi çöz."],"t": "note","title": "Bu paketi çalışma sırası"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'It is'. Hava boş özne 'it' ile anlatılır: 'It is very cold.' Özneyi düşürüp 'Is very cold' demek yanlıştır.","n": 1,"q": "'___ very cold in the mountains.' boşluğa ne gelir ve neden?"},{"a": "'-y' ekiyle: snow → snowy (karlı). Aynı kural: rain→rainy, wind→windy, sun→sunny. Bu düzenli türetme sınavda kelime bilgisini genişletir.","n": 2,"q": "'snow' isminden hava sıfatı nasıl türetilir?"},{"a": "'is raining'. 'right now' şu anı gösterir, süregelen hava present continuous ister: 'it is raining'. 'it rains' genel durum içindir.","n": 3,"q": "'It ___ (rain) right now, so we can not go out.' fiil nasıl çekilir?"}],"t": "drill"}, {"t": "h","x": "Karşılaştırma: -er / more ... than, the -est"}, {"t": "p","x": "Doğa betimlemesi sık sık karşılaştırma gerektirir. Kısa sıfatlarda '-er ... than' kullanılır: 'colder than', 'higher than', 'warmer than'. Uzun sıfatlarda (iki heceden fazla) 'more ... than' gelir: 'more beautiful than', 'more dangerous than'. En üstünlük için kısa sıfata 'the -est' ('the coldest', 'the highest'), uzun sıfata 'the most' ('the most beautiful') eklenir. Düzensizler ezberlenir: good/better/best, bad/worse/worst."}, {"t": "p","x": "Eşitlik için 'as ... as' kullanılır: 'The sea is as cold as ice.' Yazımda küçük kurallar vardır: tek heceli ve tek ünsüzle biten sıfatlarda ünsüz iki katlanır (hot → hotter, big → bigger); '-y' ile bitenlerde 'y' 'i'ye döner (dry → drier, happy → happier). Bu ayrıntılar karşılaştırma sorularının klasik tuzaklarıdır. Karşılaştırmayı güçlendirmek için 'much' ya da 'far' eklenir: 'much colder', 'far more beautiful'. Ayrıca 'the + karşılaştırma ..., the + karşılaştırma' kalıbı orantı kurar: 'The higher you go, the colder it gets' (Ne kadar yükseğe çıkarsan o kadar soğur)."}, {"head": ["Sıfat","Karşılaştırma","En üstün"],"rows": [["cold","colder than","the coldest"],["hot","hotter than","the hottest"],["dry","drier than","the driest"],["beautiful","more beautiful than","the most beautiful"],["good","better than","the best"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: karşılaştırma","x": "Cümle: 'Winter in the north is ___ than in the south.' Seçenekler: (A) cold  (B) colder  (C) coldest  (D) more cold. Mantık: iki bölge kıyaslanıyor ve 'than' var, yani karşılaştırma biçimi gerekir. 'cold' kısa bir sıfat olduğu için '-er' alır: 'colder than'. 'more cold' yanlıştır (kısa sıfat), 'coldest' en üstünlük içindir ve 'than' ile kullanılmaz. Doğru cevap: B. Ders: kısa sıfat + -er + than; 'the -est' en üstünlük içindir."}, {"k": "ipucu","lines": ["Her hava ismini sıfatıyla eşleştirerek söyle: 'sun → sunny → It is sunny.'","Karşılaştırmayı üçlü söyle: 'cold – colder – the coldest'.","Boş özne 'it'i her hava cümlesinin başına koymayı alışkanlık yap.","Yazım kurallarını örnekle sabitle: 'hot → hotter', 'dry → drier'."],"t": "note","title": "Kalıcılaştırma tekniği"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'highest'. Tek bir şey bir grubun zirvesinde olduğunda en üstünlük gerekir: 'the highest'. 'high' kısa sıfat olduğu için 'the -est' alır, 'the most high' yanlıştır.","n": 1,"q": "'Mount Everest is the ___ mountain in the world.' boşluğa ne gelir?"},{"a": "'hotter'. Tek heceli, tek ünlü + tek ünsüzle biten sıfatlarda son ünsüz iki katlanır: hot → hotter. Aynı kural: big → bigger, wet → wetter.","n": 2,"q": "'hot' sıfatının karşılaştırma biçimi nedir ve neden çift 't'?"},{"a": "'as beautiful as'. Eşitlik 'as + sıfat + as' kalıbıyla kurulur: 'as beautiful as'. Karşılaştırma ('more beautiful than') iki şeyin farkını, 'as ... as' ise eşitliğini anlatır.","n": 3,"q": "'This flower is ___ beautiful ___ that one.' eşitlik nasıl kurulur?"}],"t": "drill"}, {"t": "h","x": "Toparlama: bütünleşik cloze"}, {"t": "p","x": "Şimdi öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf doğa kelimelerini, hava kalıplarını ve karşılaştırmayı aynı anda test eder. Önce paragı boşlukları atlayarak oku, sahneyi (bir yerin iklimi) belirle, sonra her boşluğu anlam ve yapı açısından çöz."}, {"t": "given","title": "Bütünleşik örnek","x": "Paragraf: 'In the mountains the weather changes fast. In winter (1)___ is very cold and it often (2)___. The peaks are (3)___ than the valleys, so they get more snow. In summer, however, (4)___ is warm and (5)___, and the flowers open.' Çözüm: (1) 'it' (boş özne: 'it is very cold'). (2) 'snows' (genel hava, geniş zaman: 'it often snows'). (3) 'colder' (kıyas + 'than': 'colder than'). (4) 'it' (yine boş özne). (5) 'sunny' (hava sıfatı: 'it is warm and sunny'). Ders: her boşlukta boş özne, hava kalıbı ve karşılaştırma birlikte çalışır."}, {"k": "dikkat","lines": ["Boş özne 'it' düşmez: 'It is cold', 'It is raining'.","Şu anki hava -ing, genel hava geniş zaman: 'it is raining' / 'it often rains'.","Kısa sıfat + -er + than; uzun sıfat more + ... + than.","Sıfat çoğulda -s almaz: 'cold winds', 'colds' değil."],"t": "note","title": "Bu paketin tuzak özeti"}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "die Sonne", "choices": {"A": "rain", "B": "snow", "C": "wind", "D": "sun"}, "ans": "D", "why": "die Sonne = sun (güneş).", "slug": "gri-mod-udsp-p6-1"}, {"n": 2, "stem": "der Regen", "choices": {"A": "sun", "B": "rain", "C": "snow", "D": "wind"}, "ans": "B", "why": "der Regen = rain (yağmur).", "slug": "gri-mod-udsp-p6-2"}, {"n": 3, "stem": "der Schnee", "choices": {"A": "snow", "B": "sun", "C": "sea", "D": "tree"}, "ans": "A", "why": "der Schnee = snow (kar).", "slug": "gri-mod-udsp-p6-3"}, {"n": 4, "stem": "der Baum", "choices": {"A": "flower", "B": "mountain", "C": "tree", "D": "sea"}, "ans": "C", "why": "der Baum = tree (ağaç).", "slug": "gri-mod-udsp-p6-4"}, {"n": 5, "stem": "kalt", "choices": {"A": "warm", "B": "sunny", "C": "windy", "D": "cold"}, "ans": "D", "why": "kalt = cold (soğuk).", "slug": "gri-mod-udsp-p6-5"}, {"n": 6, "stem": "das Meer", "choices": {"A": "mountain", "B": "sea", "C": "tree", "D": "flower"}, "ans": "B", "why": "das Meer = sea (deniz).", "slug": "gri-mod-udsp-p6-6"}]}]}, {"id": "p7", "group": "Kelime Paketleri", "name": "Paket 7. Stadt und Verkehr", "eyebrow": "P7", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["die Stadt", "city", "şehir"], ["das Auto", "car", "araba"], ["der Zug", "train", "tren"], ["der Bus", "bus", "otobüs"], ["die Straße", "street", "cadde"], ["der Bahnhof", "station", "istasyon"], ["das Flugzeug", "plane", "uçak"], ["fahren", "to drive", "sürmek"], ["links", "left", "sol"], ["rechts", "right", "sağ"]]}, {"t": "h","x": "Şehir ve ulaşım kelimeleri: yer, yön ve tarif sorularının merkezi"}, {"t": "p","x": "Bu paketteki kelimeler (şehir, araba, tren, otobüs, cadde, istasyon, uçak, sürmek, sol, sağ) sınavda yer belirtme, yön tarifi ve şehir hayatını anlatan metinlerin merkezindedir. Bir diyalogda birine yol tarif edilirken 'turn left', 'it is on your right', 'near the station' gibi ifadeler geçer; cloze parçalarında ise yer edatları (in/on/at) neredeyse her cümlede bulunur. Bu kelimeleri doğru edat ve 'there is/are' kalıbıyla bilmek, hem okuma hem cloze sorularını çözer. Şehir ve ulaşım metinleri sınavda genellikle bir yere nasıl gidildiğini, bir semtin nasıl göründüğünü ya da toplu taşıma alışkanlıklarını anlatır; bu parçalarda yer, yön ve mesafe kelimeleri neredeyse her cümlede bulunur."}, {"t": "p","x": "Ulaşım kelimelerinin asıl zorluğu yer edatlarıdır. Türkçede tek bir '-de/-da' eki her şeye yeter ('şehirde', 'otobüste', 'istasyonda'); İngilizcede ise in, on, at üçü de farklı mantıkla kullanılır ve birbirinin yerine geçmez. Üstelik ulaşım araçlarında beklenmedik bir kural vardır: 'on the bus/train' ama 'in the car'. Bu paketin konusu, yer kelimelerini doğru edatla ve 'there is/are' yapısıyla kullanmaktır."}, {"t": "h","x": "Artikel: ulaşım isimleri"}, {"t": "p","x": "Almanca ulaşım isimlerinde artikel ezberlenir. 'der' alanlar: der Zug (tren), der Bus (otobüs), der Bahnhof (istasyon). 'die' alanlar: die Stadt (şehir), die Straße (cadde). 'das' alanlar: das Auto (araba), das Flugzeug (uçak). 'fahren' (sürmek/gitmek) bir fiildir, artikel almaz. Bu isimleri artikeliyle söyleyerek çalış."}, {"head": ["Almanca","Artikel","Türkçe"],"rows": [["Zug, Bus, Bahnhof","der","tren, otobüs, istasyon"],["Stadt, Straße","die","şehir, cadde"],["Auto, Flugzeug","das","araba, uçak"],["fahren","(fiil)","sürmek, (araçla) gitmek"],["links / rechts","(zarf)","sol / sağ"]],"t": "table"}, {"t": "h","x": "Yer edatları: in, on, at"}, {"t": "p","x": "İngilizcede yeri üç edatla anlatırız. 'at' bir noktayı gösterir: 'at the station' (istasyonda), 'at the bus stop' (durakta), 'at the corner' (köşede). 'on' bir yüzeyi ya da caddeyi gösterir: 'on the street' (caddede), 'on the wall' (duvarda). 'in' kapalı ya da sınırlı bir alanı gösterir: 'in the city' (şehirde), 'in the room' (odada), 'in the car' (arabada). Genel kural: küçük noktadan (at) yüzeye (on) ve büyük alana (in) doğru genişler."}, {"t": "p","x": "Ulaşımda özel bir kalıp vardır: büyük araçlarda 'on' kullanılır (on the bus, on the train, on the plane), küçük ve kapalı araçlarda 'in' kullanılır (in the car, in the taxi). Ayrıca varış fiillerinde fark önemlidir: bir binaya/noktaya 'arrive at' (arrive at the station), bir şehre/ülkeye 'arrive in' (arrive in London). 'live in' (bir yerde yaşamak) da 'in' ister. Hareket edatlarını da karıştırmamak gerekir: bir yere gitmek 'go to' (go to the station), bir aracın içine binmek 'get on/in' (get on the bus, get in the car), inmek 'get off/out of' (get off the train, get out of the car)."}, {"head": ["Edat","Kullanım","Örnek"],"rows": [["at","nokta","at the station"],["on","yüzey / cadde","on the street"],["in","kapalı/geniş alan","in the city"],["on (araç)","büyük araç","on the bus / train"],["in (araç)","küçük araç","in the car / taxi"]],"t": "table"}, {"k": "dikkat","lines": ["Büyük araç 'on' (on the bus/train/plane), küçük araç 'in' (in the car/taxi).","arrive at + bina/nokta (arrive at the airport); arrive in + şehir/ülke (arrive in Paris).","'at home', 'at work', 'at school' kalıpları sabittir; the almaz."],"t": "note","title": "Yer edatı tuzağı"}, {"t": "h","x": "there is / there are: bir yerde ne var"}, {"t": "p","x": "Bir yerde bir şeyin var olduğunu 'there is / there are' ile söyleriz; bu, Türkçedeki 'var' karşılığıdır. Tekil isimle 'there is' (There is a station near here = Yakında bir istasyon var), çoğul isimle 'there are' (There are two buses every hour = Saatte iki otobüs var) kullanılır. Olumsuzu 'there is no / there aren't', sorusu 'Is there ...? / Are there ...?' biçimindedir. Fiil, kendisinden sonra gelen ismin tekil/çoğul olmasına göre çekilir."}, {"head": ["Yapı","Kullanım","Örnek"],"rows": [["there is","tekil","There is a park."],["there are","çoğul","There are three shops."],["there is no","olumsuz","There is no bus stop here."],["is there ...?","soru","Is there a station nearby?"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: there is / there are","x": "Cümle: '___ two train stations in this city.' Seçenekler: (A) There is  (B) There are  (C) It is  (D) They are. Mantık: 'two train stations' çoğuldur, bu yüzden 'there are' gerekir. 'there is' tekil içindir; 'it is' ve 'they are' bir yerde var olmayı anlatmaz. Doğru cevap: B. Ders: there is + tekil, there are + çoğul; fiil sonraki isme göre çekilir."}, {"k": "protokol","lines": ["1) Tabloyu sesli oku: Almanca artikel + İngilizce + Türkçe.","2) Her yer ismini doğru edatla söyle: 'at the station', 'in the city', 'on the street'.","3) Araç kalıplarını sabitle: 'on the bus', 'in the car'.","4) 'there is/are' ile şehir betimle: 'There is a park, there are two schools.'","5) Alıştırmayı çöz, sonra quizi çöz."],"t": "note","title": "Bu paketi çalışma sırası"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'on'. Otobüs, tren, uçak gibi büyük araçlarda 'on' kullanılır: 'on the bus'. Araba ve taksi gibi küçük araçlarda ise 'in' gelir: 'in the car'.","n": 1,"q": "'I go to work ___ the bus every morning.' boşluğa hangi edat gelir?"},{"a": "'arrive at' bir bina ya da noktaya varmayı anlatır (arrive at the station). 'arrive in' ise bir şehre ya da ülkeye varmayı anlatır (arrive in London). Sınav bu ayrımı sık sorar.","n": 2,"q": "'arrive at' ile 'arrive in' arasındaki fark nedir?"},{"a": "'Is there'. Bir yerde bir şeyin var olup olmadığını sormak için 'Is there ...?' (tekil) ya da 'Are there ...?' (çoğul) kullanılır. Tekil 'a bank' olduğu için 'Is there' doğrudur.","n": 3,"q": "'___ a bank near the station?' sorusunu nasıl tamamlarsın?"}],"t": "drill"}, {"t": "h","x": "Yön tarifi: go straight, turn left / right"}, {"t": "p","x": "Yol tarif ederken emir kipini kullanırız (özne yok): 'Go straight on' (düz devam et), 'Turn left/right' (sola/sağa dön), 'Take the first street on your right' (sağdaki ilk caddeye gir), 'It is on your left' (sol tarafında). Bu kalıplar sabittir ve sınavda diyaloglarda sık çıkar. 'links' (sol) ve 'rechts' (sağ) Almanca karşılıklarıdır; İngilizcede 'left' ve 'right' kullanılır."}, {"t": "p","x": "Yeri tarif eden edatlar da yön anlatımının parçasıdır: 'next to' (yanında), 'opposite' (karşısında), 'between' (arasında), 'near' (yakınında), 'in front of' (önünde), 'behind' (arkasında), 'on the corner of' (köşesinde). Bunları bir harita üzerinde düşünerek ezberlemek, hem yön tarifi hem betimleme sorularını çözer. Mesafe ve sıra bildiren ifadeler de tarife eklenir: 'about 200 metres away' (yaklaşık 200 metre ileride), 'the second turning on the left' (soldaki ikinci sapak), 'at the end of the street' (caddenin sonunda). Bu kalıplar diyalog ve dinleme sorularında sık çıkar."}, {"head": ["Kalıp","Anlam","Örnek"],"rows": [["go straight on","düz devam et","Go straight on for 100 metres."],["turn left / right","sola / sağa dön","Turn left at the lights."],["next to","yanında","The bank is next to the school."],["opposite","karşısında","It is opposite the station."],["between","arasında","between the shop and the café"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: yön tarifi","x": "Cümle: 'The post office is ___ the bank and the bakery.' Seçenekler: (A) next  (B) opposite  (C) between  (D) in front. Mantık: iki yer ('the bank' ve 'the bakery') sayılıyor, yani ikisinin 'arasında' anlamı gerekir: 'between A and B'. 'next to' tek bir şeyin yanını, 'opposite' karşısını anlatır. Doğru cevap: C. Ders: 'between' iki şey arasını anlatır ve 'and' ile bağlanır."}, {"k": "ipucu","lines": ["Her yer ismini doğru edatla mini cümlede söyle: 'at the station', 'on the bus'.","Yön tarifini yüksek sesle uygula: 'Turn left, then go straight on.'","Konum edatlarını çift olarak öğren: next to / opposite, in front of / behind.","there is/are ile bulunduğun anda etrafını betimle: 'There is a table, there are two chairs.'"],"t": "note","title": "Kalıcılaştırma tekniği"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "Örneğin 'left ... right' ya da 'right ... left'. Yön tarifinde 'turn left/right' (dön) ve 'on your left/right' (senin sol/sağ tarafında) kalıpları kullanılır; İngilizcede 'links/rechts' değil 'left/right' denir.","n": 1,"q": "'Turn ___ at the traffic lights, and the shop is on your ___.' boşlukları nasıl doldurursun?"},{"a": "'opposite'. 'opposite' karşısında demektir (The café is opposite the bookshop). 'next to' yanında, 'between' arasında anlamındadır; bağlam 'karşısında' istiyorsa 'opposite' doğrudur.","n": 2,"q": "'The café is ___ the bookshop.' (karşısında) boşluğa ne gelir?"},{"a": "Yol tarifi emir kipiyle verilir ve özne düşer: 'Go straight on.', 'Turn right.', 'Take the second street.' Bu kalıplar doğrudan dinleyene seslendiği için 'you' yazılmaz.","n": 3,"q": "Yön tarifinde neden özne kullanılmaz, örnek ver."}],"t": "drill"}, {"t": "h","x": "Toparlama: bütünleşik cloze"}, {"t": "p","x": "Şimdi öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf yer edatlarını, 'there is/are' yapısını ve yön tarifini aynı anda test eder. Önce paragı okuyup sahneyi (bir şehirde yol sorma) belirle, sonra her boşluğu anlam ve yapı açısından çöz."}, {"t": "given","title": "Bütünleşik örnek","x": "Paragraf: 'Excuse me, is (1)___ a bank near here? Yes, go straight (2)___ and turn (3)___ at the corner. The bank is (4)___ the post office, and there (5)___ two cash machines outside it.' Çözüm: (1) 'there' ('Is there a bank ...?' = ... var mı?). (2) 'on' ('go straight on' = düz devam et). (3) 'left' ya da 'right' (yön tarifi: 'turn left/right'). (4) 'opposite' ya da 'next to' (konum edatı). (5) 'are' ('two cash machines' çoğul → there are). Ders: her boşlukta yer edatı, 'there is/are' ve yön kalıbı birlikte çalışır."}, {"k": "dikkat","lines": ["in/on/at karışır: at the station (nokta), on the street (yüzey), in the city (alan).","Büyük araç 'on', küçük araç 'in': on the bus, in the car.","there is + tekil, there are + çoğul; fiil sonraki isme göre çekilir.","Yön tarifi emir kipiyle, öznesiz: 'Turn left', 'Go straight on'."],"t": "note","title": "Bu paketin tuzak özeti"}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "die Stadt", "choices": {"A": "city", "B": "street", "C": "car", "D": "train"}, "ans": "A", "why": "die Stadt = city (şehir).", "slug": "gri-mod-udsp-p7-1"}, {"n": 2, "stem": "das Auto", "choices": {"A": "bus", "B": "train", "C": "car", "D": "street"}, "ans": "C", "why": "das Auto = car (araba).", "slug": "gri-mod-udsp-p7-2"}, {"n": 3, "stem": "der Zug", "choices": {"A": "bus", "B": "train", "C": "plane", "D": "car"}, "ans": "B", "why": "der Zug = train (tren).", "slug": "gri-mod-udsp-p7-3"}, {"n": 4, "stem": "der Bahnhof", "choices": {"A": "airport", "B": "street", "C": "city", "D": "station"}, "ans": "D", "why": "der Bahnhof = station (istasyon).", "slug": "gri-mod-udsp-p7-4"}, {"n": 5, "stem": "das Flugzeug", "choices": {"A": "plane", "B": "train", "C": "car", "D": "bus"}, "ans": "A", "why": "das Flugzeug = plane (uçak).", "slug": "gri-mod-udsp-p7-5"}, {"n": 6, "stem": "rechts", "choices": {"A": "left", "B": "up", "C": "right", "D": "down"}, "ans": "C", "why": "rechts = right (sağ).", "slug": "gri-mod-udsp-p7-6"}]}]}, {"id": "p8", "group": "Kelime Paketleri", "name": "Paket 8. Arbeit und Zeit", "eyebrow": "P8", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["die Arbeit", "work", "iş"], ["der Beruf", "job", "meslek"], ["das Büro", "office", "ofis"], ["der Tag", "day", "gün"], ["die Woche", "week", "hafta"], ["der Monat", "month", "ay"], ["das Jahr", "year", "yıl"], ["heute", "today", "bugün"], ["morgen", "tomorrow", "yarın"], ["die Uhr", "clock", "saat"]]}, {"t": "h","x": "İş ve zaman kelimeleri: zaman edatları ve tense sinyallerinin kaynağı"}, {"t": "p","x": "Bu paketteki kelimeler (iş, meslek, ofis, gün, hafta, ay, yıl, bugün, yarın, saat) sınavda zaman belirtme, rutin anlatma ve iş hayatını konu alan metinlerin temelini kurar. Bir cloze parçasında bir kişinin iş günü anlatılırken 'at nine o'clock', 'on Monday', 'in the morning' gibi zaman ifadeleri döner; okuma metinlerinde ise zaman zarfları hangi zaman kipinin kullanıldığını ele verir. Bu kelimeleri doğru zaman edatı ve tense sinyaliyle bilmek, hem cloze hem dilbilgisi sorularını çözer. İş ve zaman metinleri sınavda çoğu zaman bir kişinin günlük programını, kariyerini ya da bir kurumun işleyişini anlatır; bu parçalarda zaman ifadeleri ve fiil kipleri, olayın ne zaman ve ne sıklıkla olduğunu belirlediği için kritik önemdedir."}, {"t": "p","x": "Zaman kelimelerinin asıl zorluğu, İngilizcenin at/on/in üçlüsüdür. Türkçede '-de/-da' eki her zaman ifadesine yeter ('saat dokuzda', 'pazartesi günü', 'temmuzda'); İngilizcede ise saat için 'at', gün için 'on', ay/yıl için 'in' kullanılır ve karıştırılamaz. Ayrıca 'work' ile 'job' farkı ('I have a job' ama 'I go to work') klasik bir tuzaktır. Bu paketin konusu, zaman kelimelerini doğru edatla ve doğru zaman kipiyle kullanmaktır."}, {"t": "h","x": "Artikel: iş ve zaman isimleri"}, {"t": "p","x": "Almanca iş ve zaman isimlerinde artikel ezberlenir. 'der' alanlar: der Beruf (meslek), der Tag (gün), der Monat (ay). 'die' alanlar: die Arbeit (iş), die Woche (hafta), die Uhr (saat). 'das' alanlar: das Büro (ofis), das Jahr (yıl). 'heute' (bugün) ve 'morgen' (yarın) zaman zarflarıdır, artikel almaz. İsimleri artikeliyle çalış."}, {"head": ["Almanca","Artikel","Türkçe"],"rows": [["Beruf, Tag, Monat","der","meslek, gün, ay"],["Arbeit, Woche, Uhr","die","iş, hafta, saat"],["Büro, Jahr","das","ofis, yıl"],["heute / morgen","(zarf)","bugün / yarın"]],"t": "table"}, {"t": "h","x": "Zaman edatları: at, on, in"}, {"t": "p","x": "İngilizcede zamanı üç edatla anlatırız. 'at' kesin saat ve belirli anlar için: 'at 9 o'clock' (saat dokuzda), 'at noon', 'at night', 'at the weekend' (İngiliz İngilizcesi). 'on' günler ve tarihler için: 'on Monday' (pazartesi), 'on 5 May', 'on my birthday'. 'in' ay, yıl, mevsim ve günün bölümleri için: 'in July', 'in 2020', 'in summer', 'in the morning'. Kural: kesin andan (at) güne (on) ve geniş zaman dilimine (in) doğru genişler."}, {"t": "p","x": "Bazı zaman ifadeleri edat almaz. 'today' (bugün), 'tomorrow' (yarın), 'yesterday' (dün), 'this week', 'next month', 'last year', 'every day' ifadelerinden önce at/on/in kullanılmaz: 'I will see you tomorrow' (on tomorrow değil), 'We meet every day' (in every day değil). Bu edatsız kalıpları ezberlemek, en sık yapılan hatalardan birini önler. Süreyi anlatan başka kalıplar da vardır: 'for two hours' (iki saat boyunca), 'during the meeting' (toplantı sırasında), 'from nine to five' (dokuzdan beşe). Bunlar 'at/on/in' üçlüsünün dışında kalır ve ayrı öğrenilir."}, {"head": ["Edat","Kullanım","Örnek"],"rows": [["at","saat / belirli an","at 7 o'clock, at night"],["on","gün / tarih","on Monday, on 3 June"],["in","ay / yıl / bölüm","in May, in 2021, in the morning"],["edatsız","today, tomorrow, every day","See you tomorrow."]],"t": "table"}, {"k": "dikkat","lines": ["'in the morning / afternoon / evening' ama 'at night' — gece 'at' alır.","today, tomorrow, yesterday, every day edat almaz: 'on tomorrow' yanlış.","at + saat (at 8), on + gün (on Friday), in + ay/yıl (in June, in 2020)."],"t": "note","title": "Zaman edatı tuzağı"}, {"t": "h","x": "İş collocationları: work ve job"}, {"t": "p","x": "İngilizcede 'work' ve 'job' aynı değildir. 'work' sayılamayan bir isimdir ve genel faaliyeti anlatır: 'I go to work', 'I have a lot of work'. 'job' ise sayılabilir bir isimdir ve belirli bir pozisyonu anlatır: 'I have a good job', 'She is looking for a job'. 'a work' denmez; 'a job' denir. Fiil kalıpları da önemlidir: 'do a job', 'find/get a job', 'lose a job', 'work for a company', 'work as a teacher', 'work on a project'. Meslek söylerken 'a/an' kullanılır: 'She is a teacher', 'He is an engineer' (Türkçedeki 'öğretmendir' etkisiyle 'a' atlanmaz). Ayrıca 'go to work' (işe gitmek, the almaz) ile 'go to the office' (ofise gitmek, the alır) farkı da sık test edilir."}, {"head": ["Kalıp","Anlam","Örnek"],"rows": [["go to work","işe gitmek","I go to work by bus."],["have a job","bir işi olmak","She has a good job."],["work as","olarak çalışmak","He works as an engineer."],["work for","(şirket) için çalışmak","They work for a bank."],["full-time / part-time","tam / yarı zamanlı","a part-time job"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: work mı, job mu?","x": "Cümle: 'My sister has a very interesting ___ at a hospital.' Seçenekler: (A) work  (B) job  (C) office  (D) business. Mantık: 'a very interesting' ifadesi 'a' ile başlıyor, yani sayılabilir bir isim gerekir; 'work' sayılamaz ('a work' denmez), 'job' sayılabilir. Belirli bir pozisyon da anlatıldığı için 'job' doğrudur. Doğru cevap: B. Ders: sayılabilir pozisyon = job; genel faaliyet = work (a work değil)."}, {"k": "protokol","lines": ["1) Tabloyu sesli oku: Almanca artikel + İngilizce + Türkçe.","2) Her zaman ifadesini doğru edatla söyle: 'at 8', 'on Monday', 'in July'.","3) Edatsız kalıpları ayır: today, tomorrow, every day.","4) work / job farkını cümlede kullan: 'go to work', 'have a job'.","5) Alıştırmayı çöz, sonra quizi çöz."],"t": "note","title": "Bu paketi çalışma sırası"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'on Monday, at 10 o'clock, in the morning'. Gün için 'on', saat için 'at', günün bölümü için 'in' kullanılır. Bu üçlü, zaman edatlarının temel dağılımını gösterir.","n": 1,"q": "'The meeting is ___ Monday ___ 10 o'clock ___ the morning.' üç boşluğa hangi edatlar gelir?"},{"a": "'job'. 'a' ile kullanılan ve belirli bir pozisyonu anlatan isim sayılabilir olmalıdır; 'work' sayılamaz ('a work' yanlış), 'job' sayılabilir: 'a good job'.","n": 2,"q": "'I have a good ___' cümlesinde 'work' mü 'job' mu doğru, neden?"},{"a": "Hayır. 'tomorrow', 'today', 'yesterday', 'every day' gibi ifadeler edat almaz: 'See you tomorrow.' 'on tomorrow' demek yaygın bir hatadır.","n": 3,"q": "'See you ___ tomorrow.' cümlesinde edat gerekir mi?"}],"t": "drill"}, {"t": "h","x": "Zaman zarfları: tense sinyalleri"}, {"t": "p","x": "Zaman zarfları hangi zaman kipinin kullanılacağını ele verir; sınav bunu bilerek test eder. 'now', 'at the moment', 'right now' şimdiki zamanı (present continuous) çağırır: 'She is working now.' 'every day', 'usually', 'always', 'often' geniş zamanı (present simple) çağırır: 'He usually works late.' 'yesterday', 'last week', 'two days ago' geçmiş zamanı (past simple) çağırır: 'They arrived yesterday.' Bu sinyaller cümlenin kipini kilitler."}, {"t": "p","x": "İki zor sinyal grubu vardır. 'already', 'yet', 'just', 'since', 'for', 'ever' present perfect ister: 'I have just finished', 'She has worked here since 2019', 'We have known them for years'. Gelecek için 'tomorrow', 'next week', 'soon' 'will' ya da 'going to' ile gelir: 'I will call you tomorrow.' Ayrıca 'ago' geçmişle (two years ago), 'for/since' ise süre/başlangıçla (for two years / since 2019) kullanılır; bunları karıştırmamak gerekir."}, {"head": ["Sinyal","Zaman kipi","Örnek"],"rows": [["now, at the moment","present continuous","He is reading now."],["every day, usually","present simple","She works every day."],["yesterday, ago","past simple","We met two days ago."],["already, yet, since, for","present perfect","I have already eaten."],["tomorrow, next week","future (will/going to)","I will start tomorrow."]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: tense sinyali","x": "Cümle: 'She ___ in this office since 2018.' Seçenekler: (A) works  (B) worked  (C) has worked  (D) is working. Mantık: 'since 2018' bir başlangıç noktasından bugüne uzanan süreyi gösterir ve present perfect ister: 'has worked since 2018'. 'works' (geniş zaman) ve 'worked' (geçmiş) bu süreklilik anlamını vermez. Doğru cevap: C. Ders: 'since/for' = present perfect; 'ago' = past simple; 'now' = present continuous."}, {"k": "ipucu","lines": ["Her zaman edatını örnekle sabitle: 'at 8, on Monday, in July'.","Sinyal zarfını kipiyle eşleştir: 'now → is working', 'ago → worked', 'since → has worked'.","work ve job farkını iki cümlede tekrarla: 'I go to work.', 'I have a job.'","Edatsız zaman ifadelerini bir liste olarak ezberle: today, tomorrow, every day."],"t": "note","title": "Kalıcılaştırma tekniği"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'arrived'. 'ago' geçmişte bitmiş bir anı gösterir ve past simple ister: 'arrived two hours ago'. 'ago' asla present perfect ile kullanılmaz ('have arrived ago' yanlış).","n": 1,"q": "'They ___ (arrive) two hours ago.' fiil nasıl çekilir ve neden?"},{"a": "'for' bir süreyi anlatır (for two years = iki yıldır), 'since' ise bir başlangıç noktasını anlatır (since 2019 = 2019'dan beri). İkisi de çoğunlukla present perfect ile kullanılır: 'I have lived here for five years / since 2019.'","n": 2,"q": "'for' ile 'since' arasındaki fark nedir?"},{"a": "'is raining'. 'Look!' şu ana işaret eder ve present continuous ister: 'It is raining.' Şu anı gösteren 'now', 'at the moment', 'Look!' gibi sinyaller süregelen zamanı çağırır.","n": 3,"q": "'Look! It ___ (rain)' cümlesinde hangi kip gerekir?"}],"t": "drill"}, {"t": "h","x": "Toparlama: bütünleşik cloze"}, {"t": "p","x": "Şimdi öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf zaman edatlarını, work/job farkını ve tense sinyallerini aynı anda test eder. Önce paragı okuyup konuyu (bir kişinin iş rutini) belirle, sonra her boşluğu anlam ve yapı açısından çöz."}, {"t": "given","title": "Bütünleşik örnek","x": "Paragraf: 'Emma has a good (1)___ at a law firm. She starts work (2)___ nine o'clock every morning and finishes (3)___ the evening. She has worked there (4)___ 2019, and (5)___ she is working on an important project.' Çözüm: (1) 'job' (sayılabilir pozisyon, 'a' ile). (2) 'at' (saat: 'at nine o'clock'). (3) 'in' (günün bölümü: 'in the evening'). (4) 'since' (başlangıç noktası + present perfect: 'has worked since 2019'). (5) 'now' ya da 'at the moment' (present continuous sinyali: 'she is working'). Ders: her boşlukta zaman edatı, work/job ve tense sinyali birlikte çalışır."}, {"k": "dikkat","lines": ["at + saat, on + gün, in + ay/yıl; 'at night' ama 'in the morning'.","today, tomorrow, every day edat almaz.","work sayılamaz ('a work' yok); job sayılabilir ('a job').","since/for → present perfect; ago → past simple; now → present continuous."],"t": "note","title": "Bu paketin tuzak özeti"}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "die Arbeit", "choices": {"A": "job", "B": "work", "C": "office", "D": "day"}, "ans": "B", "why": "die Arbeit = work (iş).", "slug": "gri-mod-udsp-p8-1"}, {"n": 2, "stem": "der Beruf", "choices": {"A": "work", "B": "office", "C": "day", "D": "job"}, "ans": "D", "why": "der Beruf = job (meslek).", "slug": "gri-mod-udsp-p8-2"}, {"n": 3, "stem": "das Büro", "choices": {"A": "work", "B": "day", "C": "office", "D": "week"}, "ans": "C", "why": "das Büro = office (ofis).", "slug": "gri-mod-udsp-p8-3"}, {"n": 4, "stem": "der Tag", "choices": {"A": "day", "B": "week", "C": "month", "D": "year"}, "ans": "A", "why": "der Tag = day (gün).", "slug": "gri-mod-udsp-p8-4"}, {"n": 5, "stem": "morgen", "choices": {"A": "today", "B": "tomorrow", "C": "yesterday", "D": "week"}, "ans": "B", "why": "morgen = tomorrow (yarın).", "slug": "gri-mod-udsp-p8-5"}, {"n": 6, "stem": "das Jahr", "choices": {"A": "day", "B": "week", "C": "month", "D": "year"}, "ans": "D", "why": "das Jahr = year (yıl).", "slug": "gri-mod-udsp-p8-6"}]}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app'),railEl=document.getElementById('rail');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[.,;:!?"'\u2019\u2018\u00b4\u02bc\u0060]/g,'').replace(/\s+/g,' ').trim();
function logErr(q,a){try{const k='gri_errors';const cur=JSON.parse(localStorage.getItem(k)||'[]');const key=(D.title||'')+'|'+q;if(!cur.some(e=>e.key===key)){cur.push({key:key,m:D.title||'',q:q,a:a,t:Date.now()});localStorage.setItem(k,JSON.stringify(cur.slice(-800)));}}catch(e){}}
function clearErr(q){try{const k='gri_errors';const key=(D.title||'')+'|'+q;const cur=JSON.parse(localStorage.getItem(k)||'[]').filter(e=>e.key!==key);localStorage.setItem(k,JSON.stringify(cur));}catch(e){}}

const S={id:D.lessons[0].id,done:{}};
function _griSlugsOf(node,out){if(!node||typeof node!=='object')return;if(Array.isArray(node)){for(var i=0;i<node.length;i++)_griSlugsOf(node[i],out);return;}for(var k in node){if(!Object.prototype.hasOwnProperty.call(node,k))continue;var v=node[k];if(k==='slug'&&typeof v==='string'&&v)out.push(v);else if(v&&typeof v==='object')_griSlugsOf(v,out);}}

function show(id){

function wire(){
  app.querySelectorAll('.check .ci').forEach(ci=>ci.onclick=()=>ci.classList.toggle('on'));
  app.querySelectorAll('.reveal .rvb').forEach(b=>b.onclick=()=>{const r=b.closest('.reveal');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Modeli gizle':'Model cevabı göster';});
  app.querySelectorAll('.drill .db').forEach(b=>b.onclick=()=>{const d=b.closest('.drill');d.classList.toggle('open');b.textContent=d.classList.contains('open')?'Gizle':'Öneri';});
  app.querySelectorAll('.wz .editor').forEach(t=>{const cnt=t.closest('.wz').querySelector('.cnt');const wc=t.closest('.wz').querySelector('.wc');const tg=parseInt(t.getAttribute('data-target'),10);
    const upd=()=>{const n=(t.value.trim().match(/\S+/g)||[]).length;cnt.textContent=n;wc.classList.toggle('ok',n>=tg);};t.addEventListener('input',upd);upd();});
  app.querySelectorAll('.rec .recbtn').forEach(btn=>setupRecorder(btn));
  app.querySelectorAll('.griask').forEach(btn=>btn.onclick=()=>griEval(btn));
  app.querySelectorAll('.mcq .opts').forEach(box=>box.querySelectorAll('label').forEach(l=>l.onclick=()=>{
    if(box.closest('.mcq').classList.contains('done'))return;
    box.querySelectorAll('label').forEach(x=>x.classList.remove('pick'));l.classList.add('pick');}));
  app.querySelectorAll('.mcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.mcq').forEach(q=>{tot++;q.classList.add('done');
      const want=q.getAttribute('data-ans');const pick=q.querySelector('.opts label.pick');const val=pick?pick.getAttribute('data-k'):'';
      const good=val===want;if(good)ok++;q.classList.add(good?'correct':'incorrect');
      const stem=q.querySelector('.mstem')?q.querySelector('.mstem').textContent:'';
      const ct=q.querySelector('.opts label[data-k="'+want+'"] span:last-child');
      const ansTxt=want+(ct?'. '+ct.textContent:'');
      if(good)clearErr(stem);else logErr(stem,ansTxt);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.mwhy')?q.querySelector('.mwhy').textContent:'';
      const fb=q.querySelector('.mfb');fb.style.display='block';fb.className='mfb '+(good?'ok':'no');
      fb.innerHTML=good?`Doğru. <b>${esc(want)}</b>. ${esc(why)}`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>. ${esc(why)}`;
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
  app.querySelectorAll('.qzcheck').forEach(btn=>btn.onclick=()=>{
    let ok=0,tot=0;
    app.querySelectorAll('.qz').forEach(q=>{tot++;
      const want=q.getAttribute('data-ans');const alt=(q.getAttribute('data-alt')||'').split('|').filter(Boolean);
      const inp=q.querySelector('input');const val=inp.value||'';
      const good=norm(val)===norm(want)||alt.some(a=>norm(a)===norm(val));
      inp.disabled=true;q.classList.add(good?'correct':'incorrect');if(good)ok++;
      const qtext=q.querySelector('.qzq')?q.querySelector('.qzq').textContent:'';
      if(good)clearErr(qtext);else logErr(qtext,want);
      recAns(q.getAttribute('data-slug'),good?'correct':'incorrect');
      const why=q.querySelector('.qzwhy')?q.querySelector('.qzwhy').textContent:'';
      const fb=q.querySelector('.qzfb');fb.style.display='block';fb.className='qzfb '+(good?'ok':'no');
      fb.innerHTML=(good?`Doğru. <b>${esc(want)}</b>.`:`Yanlış. Senin: ${esc(val||'—')}. Doğru: <b>${esc(want)}</b>.`)+(why?' '+esc(why):'');
    });
    btn.disabled=true;const sc=btn.nextElementSibling;if(sc&&sc.classList.contains('qscore')){sc.style.display='block';sc.textContent=`Doğru: ${ok} / ${tot}`;}
  });
}

var _wtypes=null;
async function loadWTypes(){if(_wtypes)return _wtypes;try{const r=await window.GRI_SB.from('writing_text_types').select('*');_wtypes=r.data||[];}catch(e){_wtypes=[];}return _wtypes;}
function pickWType(types){
  const t2=/task\s*2/i.test(D.title||'');const want=t2?'task_response':'task_achievement';
  const ie=types.filter(t=>String(t.exam||'').toLowerCase()==='ielts'&&!t.is_coming_soon&&t.is_active!==false);
  let m=ie.find(t=>{try{return ((t.rubric_json&&t.rubric_json.criteria)||[]).some(c=>c.key===want);}catch(e){return false;}});
  if(!m)m=ie.find(t=>new RegExp(t2?'task\\s*2|essay|2':'task\\s*1|graph|1','i').test((t.display_name||'')+' '+(t.text_type||'')));
  return m||ie[0]||null;
}
async function griEval(btn){
  const wz=btn.closest('.wz');const ed=wz.querySelector('.editor');const fb=wz.querySelector('.grifb');
  const text=(ed?ed.value:'').trim();const wc=(text.match(/\S+/g)||[]).length;
  const pe=wz.querySelector('.task');const prompt=(pe?pe.textContent.trim():'')||(D.title||'');
  if(!window.GRI_UID){fb.className='grifb on err';fb.textContent='Değerlendirme için giriş yapmalısın.';return;}
  if(wc<50){fb.className='grifb on err';fb.textContent='En az 50 kelime yaz, sonra Gri değerlendirsin. Şu an: '+wc+' kelime.';return;}
  const today=new Date().toISOString().slice(0,10);let q={};try{q=JSON.parse(localStorage.getItem('gri_wz_ai')||'{}');}catch(e){}
  if(q.date!==today)q={date:today,n:0};
  
  const old=btn.textContent;btn.disabled=true;btn.textContent='Gri değerlendiriyor...';fb.className='grifb on';fb.textContent='Gri yazını okuyor, birkaç saniye sürebilir.';
  try{
    const types=await loadWTypes();const tt=pickWType(types);
    if(!tt){fb.className='grifb on err';fb.textContent='Gri writing değerlendirmesi bu sınav için henüz hazır değil.';btn.disabled=false;btn.textContent=old;return;}
    const ses=await window.GRI_SB.auth.getSession();const tok=(ses&&ses.data&&ses.data.session)?ses.data.session.access_token:'';
    const resp=await fetch('https://vazbvbqgvtlaqkytfsbi.supabase.co/functions/v1/gri-evaluate-writing',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text_type_id:tt.id,level:null,prompt_id:null,prompt_snapshot:prompt,text:text,word_count:wc})});
    const data=await resp.json();
    if(resp.status===402||data.code==='quota_exhausted'){fb.className='grifb on err';fb.textContent='Günlük yazı değerlendirme hakkı doldu. '+(data.error||'');btn.disabled=false;btn.textContent=old;return;}
    if(!resp.ok)throw new Error(data.error||('HTTP '+resp.status));
    q.n++;try{localStorage.setItem('gri_wz_ai',JSON.stringify(q));}catch(e){}
    renderEval(fb,data,tt);
  }catch(e){fb.className='grifb on err';fb.textContent='Değerlendirme hatası: '+(e.message||'bilinmeyen');}
  btn.disabled=false;btn.textContent=old;
}
function renderEval(fb,data,tt){
  const ev=data.evaluation||{};const crit=((tt.rubric_json&&tt.rubric_json.criteria)||[]);
  let h='';
  if(typeof data.total_score!=='undefined')h+=`<div class="gscore">Gri değerlendirmesi: ${esc(String(data.total_score))} / ${esc(String(data.total_max))}</div>`;
  crit.forEach(c=>{const sc=ev.scores?ev.scores[c.key]:undefined;const cm=ev.comments?ev.comments[c.key]:'';if(sc===undefined&&!cm)return;h+=`<div class="gcrit"><b>${esc(c.label||c.key)}${sc!==undefined?': '+esc(String(sc)):''}</b><div>${esc(cm||'')}</div></div>`;});
  if(ev.overallComment)h+=`<div class="gsec">Genel</div><div>${esc(ev.overallComment)}</div>`;
  if(ev.improvementAdvice)h+=`<div class="gsec">Öncelik</div><div>${esc(ev.improvementAdvice)}</div>`;
  if(ev.specificMistakes&&ev.specificMistakes.length){h+=`<div class="gsec">Düzeltmeler</div>`;ev.specificMistakes.forEach(m=>{h+=`<div class="gmis"><span class="o">${esc(m.original)}</span> &rarr; <span class="c">${esc(m.correction)}</span><div>${esc(m.explanation)}</div></div>`;});}
  const rem=data.quota?data.quota.total_remaining:data.remaining;
  if(typeof rem!=='undefined')h+=`<div class="griq" style="display:block;margin:12px 0 0">Sunucu kotası kalan: ${esc(String(rem))}</div>`;
  fb.className='grifb on';fb.innerHTML=h;
}
function setupRecorder(btn){
  const box=btn.closest('.rec');let mr=null,chunks=[],t0=0,iv=null;
  const tm=box.querySelector('.tm'),hold=box.querySelector('.playhold'),warn=box.querySelector('.warn');
  btn.onclick=async()=>{
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){warn.style.display='block';btn.disabled=true;return;}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{clearInterval(iv);box.classList.remove('recording');btn.textContent='Yeni kayıt';
        stream.getTracks().forEach(x=>x.stop());
        const blob=new Blob(chunks,{type:chunks[0]?chunks[0].type:'audio/webm'});const url=URL.createObjectURL(blob);
        hold.innerHTML=`<audio controls src="${url}"></audio><div class="tm" style="margin-top:6px">Kaydını bastan sona dinle. Bu adim atlanmaz.</div>`;};
      mr.start();box.classList.add('recording');btn.textContent='Durdur';t0=Date.now?0:0;let s=0;
      iv=setInterval(()=>{s++;const m=String((s/60|0)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');tm.textContent=m+':'+ss;},1000);
    }catch(e){warn.style.display='block';btn.disabled=true;}
  };
}

.gribm:hover{background:rgba(46,110,106,.12)}
.gribm:disabled{opacity:.5;cursor:default}
.gribm svg{width:17px;height:17px;fill:none;stroke:#8a8f9c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,fill .15s}
.gribm.on svg{fill:#2E6E6A;stroke:#2E6E6A}
.mcq[data-slug] .mstem,.qz[data-slug] .qzq{padding-right:40px}
.q[data-bm-slug] .ql{padding-right:40px}
.st-q[data-bm-slug] .gribm{top:.7rem;right:.7rem}
</style>
<script>
(function(){
  var ICON='<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  var st={},seen={};
  function sb(){return window.GRI_SB||null;}
  function uid(){return window.GRI_UID||null;}
  function slugOf(el){return el.getAttribute('data-bm-slug')||el.getAttribute('data-slug')||'';}
  function paint(slug){
    var bs=document.querySelectorAll('.gribm'),i,b;
    for(i=0;i<bs.length;i++){b=bs[i];if(b.getAttribute('data-bm-for')!==slug)continue;
      if(st[slug]){b.className='gribm on';b.setAttribute('aria-label','Yer imini kaldır');b.title='Yer imini kaldır';}
      else{b.className='gribm';b.setAttribute('aria-label','Yer imine ekle');b.title='Yer imine ekle';}}
  }
  function badge(){if(typeof window.triggerBadgeCheck==='function'){try{window.triggerBadgeCheck();}catch(e){}}}
  function toggle(btn,slug){
    if(!sb()||!uid()){try{alert('Yer imi için giriş yapmalısın.');}catch(e){}return;}
    if(btn.disabled)return;btn.disabled=true;
    var done=function(){btn.disabled=false;};
    try{
      if(st[slug]){
        sb().from('user_bookmarks')['delete']().eq('user_id',uid()).eq('question_slug',slug).then(function(r){done();if(!r||!r.error){st[slug]=false;paint(slug);badge();}},done);
      }else{
        sb().from('user_bookmarks').insert({user_id:uid(),question_slug:slug}).then(function(r){done();if(!r||!r.error||(r.error&&r.error.code==='23505')){st[slug]=true;paint(slug);badge();}},done);
      }
    }catch(e){done();}
  }
  function fetchState(slugs){
    if(!slugs.length||!sb()||!uid())return;
    try{
      sb().from('user_bookmarks').select('question_slug').eq('user_id',uid())['in']('question_slug',slugs).then(function(r){
        var i;if(r&&r.data){for(i=0;i<r.data.length;i++){st[r.data[i].question_slug]=true;paint(r.data[i].question_slug);}}
      },function(){});
    }catch(e){}
  }
  function scan(){
    var els=document.querySelectorAll('.mcq[data-slug],.qz[data-slug],[data-bm-slug]');
    var fresh=[],i,el,slug,b;
    for(i=0;i<els.length;i++){
      el=els[i];slug=slugOf(el);
      if(!slug||el.querySelector('.gribm'))continue;
      b=document.createElement('button');
      b.type='button';b.className=st[slug]?'gribm on':'gribm';
      b.setAttribute('data-bm-for',slug);
      b.setAttribute('aria-label',st[slug]?'Yer imini kaldır':'Yer imine ekle');
      b.title=st[slug]?'Yer imini kaldır':'Yer imine ekle';
      b.innerHTML=ICON;
      (function(bb,ss){bb.onclick=function(ev){if(ev){ev.preventDefault();ev.stopPropagation();}toggle(bb,ss);};})(b,slug);
      el.appendChild(b);
      if(!seen[slug]){seen[slug]=true;fresh.push(slug);}
    }
    if(fresh.length)fetchState(fresh);
  }
  var tmr=null;
  function later(){if(tmr)clearTimeout(tmr);tmr=setTimeout(scan,120);}
  function boot(){
    scan();
    var root=document.getElementById('app')||document.getElementById('st-app')||document.body;
    if(window.MutationObserver){try{new MutationObserver(later).observe(root,{childList:true,subtree:true});}catch(e){}}
    else setInterval(scan,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script src="assets/gri-review.js" defer></script>
</body></html>
