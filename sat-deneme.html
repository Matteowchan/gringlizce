<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

const app = document.getElementById('st-app');
function param(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------- Ham -> Ölçekli puan (TAHMİN, path-bağımlı) ---------- */
function round10(x){ return Math.round(x/10)*10; }
function scaledRW(raw, path){
  const f = Math.max(0, Math.min(54, raw)) / 54;
  const s = (path==='easy') ? 200 + 380*Math.pow(f,0.90)   // kolay yol ~200-580
                            : 300 + 500*Math.pow(f,0.98);   // zor yol ~300-800
  return Math.max(200, Math.min(800, round10(s)));
}
function scaledMath(raw, path){
  const f = Math.max(0, Math.min(44, raw)) / 44;
  const s = (path==='easy') ? 200 + 380*Math.pow(f,0.90)
                            : 300 + 500*Math.pow(f,0.98);
  return Math.max(200, Math.min(800, round10(s)));
}

/* ---------- Bölüm tanımları ---------- */
const SEC = {
  rw:   { key:'rw',   db:'rw',   label:'Reading & Writing', nQ:27, mins:32, threshold:19, rawMax:54, scale:scaledRW },
  math: { key:'math', db:'math', label:'Math',              nQ:22, mins:35, threshold:16, rawMax:44, scale:scaledMath },
};

function parseDeneme(d){
  const m = /^(rw|math|full)-(\d+)$/.exec((d||'').trim());
  if (!m) return null;
  const kind = m[1], n = parseInt(m[2],10);
  let sections;
  if (kind==='rw')        sections = [ Object.assign({}, SEC.rw) ];
  else if (kind==='math') sections = [ Object.assign({}, SEC.math) ];
  else                    sections = [ Object.assign({}, SEC.rw), Object.assign({}, SEC.math) ];
  return { kind, n, slug:`${kind}-${n}`, sections };
}

/* ---------- Veri çekimi (etiket dizisiyle, slug sıralı) ----------
   Kontrat: her deneme sorusu tags içerir:
     'deneme:<slug>' (ör. deneme:rw-1) + 'dmod:<m1|m2h|m2e>' + (tam SAT için) 'dsec:<rw|math>'
   Bankadan alınan sorular gri-den-* slug taşımayabilir; sadece etiketle gelir. */
async function fetchModule(tags, db){
  const { data, error } = await sb.from('questions')
    .select('id,slug,section,difficulty,question_text,options,correct_answer,explanations,passage_id,created_at')
    .eq('active',true).eq('exam_type','sat').eq('section',db)
    .contains('tags', tags)
    .order('slug', { ascending:true }).order('created_at', { ascending:true }).range(0,299);
  if (error) throw error;
  return data || [];
}
async function fetchPassages(ids){
  const uniq = [...new Set(ids.filter(Boolean))];
  if (!uniq.length) return {};
  const { data } = await sb.from('passages').select('id,texts').in('id', uniq);
  const m = {}; (data||[]).forEach(p=>{ m[p.id]=p.texts; }); return m;
}
function formatMath(s){
  // s zaten esc'lenmis olmali; matematik gosterimini guzellestir
  return String(s)
    .replace(/\^\(([^)]+)\)/g,'<sup>$1</sup>')
    .replace(/\^(-?\d+(?:\.\d+)?)/g,'<sup>$1</sup>')
    .replace(/\^([A-Za-z])/g,'<sup>$1</sup>')
    .replace(/\bsqrt\s*\(/g,'√(')
    .replace(/\bpi\b/g,'π')
    .replace(/&lt;=/g,'≤').replace(/&gt;=/g,'≥').replace(/!=/g,'≠')
    .replace(/(\d)\s*\*\s*(\d)/g,'$1·$2');
}
function mtext(s, isMath){ return isMath ? formatMath(esc(s)) : esc(s); }
function mdTableHtml(block){
  var rows = block.map(function(line){ return line.split('|').map(function(c){ return c.trim(); }); });
  if (!rows.length) return '';
  var head = rows[0], body = rows.slice(1);
  var h = '<table class="st-dtable"><thead><tr>'+head.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>';
  body.forEach(function(r){ h += '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; });
  return h+'</tbody></table>';
}
function passageHtml(texts){
  if (!Array.isArray(texts)) return '';
  return texts.map(t=>{
    const lbl = (t && t.label && texts.length>1) ? '<strong>'+esc(t.label)+'</strong><br>' : '';
    let tbl = (t && t.table_html) ? '<div class="st-table">'+t.table_html+'</div>' : '';
    var cnt = String((t && t.content) || '')
      .replace(/<\s*\/?\s*(ul|ol)\s*>/gi,'').replace(/<\s*li\s*>/gi,'\n• ').replace(/<\s*\/\s*li\s*>/gi,'');
    // Duz-metin boru (|) tablosunu gercek HTML tabloya cevir (CoE-Quant)
    if (!tbl && cnt.indexOf('|') >= 0){
      var lines = cnt.split('\n'), start=-1, end=-1;
      for (var i=0;i<lines.length;i++){
        if (lines[i].split('|').length >= 3){ if(start<0) start=i; end=i; }
        else if (start>=0){ break; }
      }
      if (start>=0 && end>start){
        tbl = '<div class="st-table">'+mdTableHtml(lines.slice(start,end+1))+'</div>';
        lines.splice(start, end-start+1);
        cnt = lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
      }
    }
    // Icerik XSS'e karsi escape edilir; yalnizca alti-cizili (<u>) etiketine izin verilir (soru koku "underlined sentence" referanslari icin)
    var safe = esc(cnt).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>');
    return '<div class="st-passage" style="white-space:pre-line">'+lbl+tbl+safe+'</div>';
  }).join('');
}

/* ---------- Grid-in (SPR) cevap kontrolü ---------- */
function isSpr(q){ return Array.isArray(q.options) && q.options.length===0; }
function parseSpr(raw){
  if (raw==null) return null;
  let s = String(raw).trim().replace(/\s+/g,'').replace(/^\+/,'');
  if (!s) return null;
  if (/^-?\d+\/\d+$/.test(s)){ const p=s.split('/'); const a=parseFloat(p[0]), b=parseFloat(p[1]); if(!b) return null; return a/b; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)){ const n=parseFloat(s); return isNaN(n)?null:n; }
  return null;
}
function sprCorrect(userRaw, acceptedRaw){
  const u = parseSpr(userRaw); if (u==null) return false;
  const acc = String(acceptedRaw==null?'':acceptedRaw).split('|');
  for (const a of acc){ const v=parseSpr(a); if (v!=null && Math.abs(u-v)<1e-6) return true; }
  return false;
}

/* ---------- Adım adım açıklama (soru bankasıyla aynı şema) ---------- */
function exNode(node){
  if (node==null) return '';
  if (typeof node==='string') return '<p class="ex-b">'+esc(node)+'</p>';
  const steps = Array.isArray(node.steps) ? node.steps : null;
  if (steps){
    return steps.map(s=>{
      let x='';
      if (s.title) x+='<div class="ex-t">'+esc(s.title)+'</div>';
      if (s.quote) x+='<blockquote class="ex-q">'+esc(s.quote)+'</blockquote>';
      if (s.body)  x+='<p class="ex-b">'+esc(s.body)+'</p>';
      return x;
    }).join('');
  }
  if (typeof node.body==='string') return '<p class="ex-b">'+esc(node.body)+'</p>';
  return '';
}
function explHtml(q){
  const e = q.explanations || {};
  const ca = q.correct_answer;
  let h = '';
  if (isSpr(q)){
    const disp = String(ca||'').split('|').join('  ·  ');
    h += '<h5>Doğru cevap: '+esc(disp)+'</h5>';
    h += exNode(e.answer) || (typeof e==='object' && e.steps ? exNode(e) : '');
    if (!h.includes('ex-')) h += '<p class="ex-b st-note">Bu soru için adım adım açıklama henüz eklenmemiş.</p>';
    return h;
  }
  h += '<h5>Doğru cevap: '+esc(ca)+'</h5>';
  h += e[ca] ? exNode(e[ca]) : (e.answer ? exNode(e.answer) : '');
  const wrongs = (Array.isArray(q.options)?q.options:[]).map(o=>o.letter).filter(l=>l!==ca);
  const anyWrong = wrongs.some(w=>{ const n=e[w]; return n && (typeof n==='string' || (n.steps&&n.steps.length) || n.body); });
  if (anyWrong){
    h += '<h5>Yanlış şıklar neden yanlış</h5>';
    wrongs.forEach(w=>{ const b=exNode(e[w]); if(b) h += '<div class="ex-w"><strong>'+esc(w)+'.</strong> '+b+'</div>'; });
  }
  if (e.type)  h = '<h5>Soru tipi</h5><p class="ex-b">'+esc(e.type)+'</p>'+h;
  if (e.trick) h += '<h5>Tuzak / ipucu</h5><p class="ex-b">'+esc(e.trick)+'</p>';
  if (!h.replace(/<h5>[^<]*<\/h5>/g,'').trim()) h += '<p class="ex-b st-note">Bu soru için adım adım açıklama henüz eklenmemiş.</p>';
  return h;
}

/* ================= Durum ================= */
let DEN = null, UID = null;
let STATE = null;   // { si, mod, sections:[{cfg, secondHard, m1:{q,a,raw}, m2:{q,a,raw,tier}}], done }
let TIMER = null;
function saveKey(){ return 'sat-den-'+DEN.slug; }
function persist(){ try{
  const snap = { v:1, si:STATE.si, mod:STATE.mod, done:STATE.done,
    sections: STATE.sections.map(s=>({ secondHard:s.secondHard,
      m1:{ q:s.m1.q, a:s.m1.a, raw:s.m1.raw },
      m2:{ q:s.m2.q, a:s.m2.a, raw:s.m2.raw, tier:s.m2.tier } })) };
  localStorage.setItem(saveKey(), JSON.stringify(snap));
}catch(e){} }
function clearSave(){ try{ localStorage.removeItem(saveKey()); }catch(e){} }
function loadSave(){ try{ const s=localStorage.getItem(saveKey()); return s?JSON.parse(s):null; }catch(e){ return null; } }

function recAns(slug, ok){
  try{ if(!slug||!UID) return;
    sb.from('user_answers').upsert({ user_id:UID, question_slug:slug, status:ok?'correct':'incorrect', answered_at:new Date().toISOString() }, { onConflict:'user_id,question_slug' }).then(function(){},function(){});
  }catch(e){}
}

/* ================= Deneme-içi sözlük =================
   Kural: deneme SIRASINDA öğrenci kelime seçip KAYDEDEBİLİR (user_vocab),
   ama ANLAM GÖSTERİLMEZ (spoiler/dikkat dağıtma yok). gri-sozluk.js bu
   yüzden test sırasında YÜKLENMEZ; sadece sade "Kelimeyi Kaydet" butonu.
   Deneme BİTİNCE (finishDeneme) gri-sozluk.js yüklenir (normal anlam-popup
   serbest) + "Kaydettiğin Kelimeler" anlamlarıyla listelenir. */
let TOKEN = null, TESTING = false, GS_LOADED = false, vBtn = null, vLast = null, vHideT = null;
const VOCAB_FN = window.SUPABASE_URL + '/functions/v1/vocab-lookup';
function vocabKey(){ return 'sat-den-vocab-' + (DEN ? DEN.slug : ''); }
function loadSavedVocab(){ try{ const s=localStorage.getItem(vocabKey()); return s?JSON.parse(s):[]; }catch(e){ return []; } }
function pushSavedVocab(item){ try{ const a=loadSavedVocab(); if(!a.some(x=>x.vid===item.vid)){ a.push(item); localStorage.setItem(vocabKey(), JSON.stringify(a)); } }catch(e){} }

function vEnsureBtn(){
  if (vBtn) return;
  vBtn = document.createElement('button'); vBtn.id='stv-save'; vBtn.type='button';
  vBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Kelimeyi Kaydet';
  vBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });   // seçim dağılmasın
  vBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); vSaveWord(); });
  document.body.appendChild(vBtn);
}
function vHideBtn(){ if(vBtn){ vBtn.classList.remove('show'); } }
function vResetBtn(){ if(vBtn){ vBtn.disabled=false; vBtn.classList.remove('done'); vBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Kelimeyi Kaydet'; } }

function vSelWord(){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const t = sel.toString().trim();
  if (!t) return null;
  if (!/^[A-Za-z][A-Za-z'’\-]*$/.test(t)) return null;   // tek İngilizce kelime
  const node = sel.anchorNode; const el = node && (node.nodeType===1 ? node : node.parentElement);
  if (!el || !el.closest) return null;
  if (!el.closest('.st-passage, .st-stem')) return null;  // yalnızca pasaj/soru metni
  if (el.closest('input,textarea')) return null;
  return { text:t, range: sel.getRangeAt(0) };
}
function vContext(range){
  try{
    const node = range.startContainer;
    let host = node.nodeType===1 ? node : node.parentElement;
    host = (host && host.closest) ? (host.closest('.st-passage, .st-stem') || host) : host;
    const full = ((host && host.textContent) || range.toString() || '').replace(/\s+/g,' ').trim();
    const word = (range.toString()||'').trim().toLowerCase();
    let ctx = full;
    if (word){
      const parts = full.split(/(?<=[.!?])\s+/);
      const hit = parts.find(function(s){ return s.toLowerCase().indexOf(word)!==-1; });
      if (hit) ctx = hit.trim();
    }
    if (ctx.length>240) ctx = ctx.slice(0,240)+'…';
    return ctx;
  }catch(e){ return ''; }
}
function vShowBtn(range){
  vEnsureBtn(); vResetBtn();
  const r = range.getBoundingClientRect();
  if (!r || (!r.width && !r.height)) return;
  vBtn.classList.add('show');
  const bw = vBtn.offsetWidth || 150, bh = vBtn.offsetHeight || 30;
  let top = r.top + window.scrollY - bh - 8;
  if (top < window.scrollY + 4) top = r.bottom + window.scrollY + 8;
  let left = r.left + window.scrollX + (r.width/2) - (bw/2);
  left = Math.max(8, Math.min(left, window.innerWidth + window.scrollX - bw - 8));
  vBtn.style.top = top + 'px'; vBtn.style.left = left + 'px';
}
function vOnSelection(e){
  if (!TESTING || !UID) return;
  if (e && e.target && vBtn && (e.target===vBtn || vBtn.contains(e.target))) return;
  if (vHideT){ clearTimeout(vHideT); vHideT=null; }
  setTimeout(function(){
    const w = vSelWord();
    if (!w){ vHideBtn(); return; }
    vLast = w; vShowBtn(w.range);
  }, 10);
}
function vOnDocDown(e){
  if (vBtn && (e.target===vBtn || vBtn.contains(e.target))) return;
  if (!window.getSelection || !window.getSelection().toString().trim()) vHideBtn();
}
async function vSaveWord(){
  if (!vLast || !UID) return;
  const text = vLast.text, ctx = vContext(vLast.range);
  vEnsureBtn(); vBtn.disabled = true; vBtn.innerHTML = 'Kaydediliyor...';
  try{
    let token = TOKEN;
    try{ const s = await sb.auth.getSession(); if (s && s.data && s.data.session){ token=s.data.session.access_token; UID=s.data.session.user.id; } }catch(_){}
    const headers = { 'Content-Type':'application/json', 'apikey': window.SUPABASE_KEY };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(VOCAB_FN, { method:'POST', headers: headers, body: JSON.stringify({ word: text }) });
    const d = await r.json();
    if (!d || !d.ok || !d.vocabulary_id){ vBtn.innerHTML='Kaydedilemedi'; setTimeout(vHideBtn,1400); return; }
    const ins = await sb.from('user_vocab').insert({ user_id:UID, vocabulary_id:d.vocabulary_id, custom_note: ctx || null });
    if (ins.error && !(ins.error.code==='23505' || (ins.error.message||'').toLowerCase().indexOf('duplicate')!==-1)){ vBtn.innerHTML='Hata'; setTimeout(vHideBtn,1400); return; }
    pushSavedVocab({ word:text, vid:d.vocabulary_id });
    vBtn.classList.add('done'); vBtn.innerHTML = ins.error ? 'Zaten listende ✓' : 'Kaydedildi ✓';
    try{ window.getSelection().removeAllRanges(); }catch(_){}
    setTimeout(vHideBtn, 1100);
  }catch(e){ vBtn.innerHTML='Hata'; setTimeout(vHideBtn,1400); }
}
function loadGriSozluk(){
  if (GS_LOADED) return; GS_LOADED = true;
  try{ window.GRI_SB = sb; window.GRI_UID = UID; }catch(e){}
  const s = document.createElement('script'); s.src = 'assets/gri-sozluk.js?v=7'; s.defer = true;
  document.body.appendChild(s);
}
async function savedVocabHtml(){
  if (!UID) return '';
  const saved = loadSavedVocab();
  if (!saved.length) return '';
  const ids = [...new Set(saved.map(x=>x.vid).filter(Boolean))];
  const map = {};
  if (ids.length){
    try{
      const { data } = await sb.from('user_vocab')
        .select('vocabulary_id, custom_note, vocabulary:vocabulary_id(word_display, definition_json)')
        .eq('user_id', UID).in('vocabulary_id', ids);
      (data||[]).forEach(function(r){ map[r.vocabulary_id]=r; });
    }catch(e){}
  }
  const cards = saved.map(function(s){
    const r = map[s.vid] || {}; const v = r.vocabulary || {}; const def = v.definition_json || {};
    const word = v.word_display || s.word || '';
    const meanings = (Array.isArray(def.meanings) && def.meanings.length) ? def.meanings.join(', ') : (def.translation||'');
    const level = def.level||'', example = def.example||'', translation = def.translation||'', note = r.custom_note||'';
    return '<div class="stv-card">'+
      '<div class="stv-w">'+esc(word)+(level?'<span class="stv-lvl">'+esc(level)+'</span>':'')+'</div>'+
      (meanings ? '<div class="stv-mean">'+esc(meanings)+'</div>' : '<div class="stv-mean stv-muted">Anlam bulunamadı</div>')+
      (example ? '<div class="stv-ex">'+esc(example)+'</div>' : '')+
      (example && translation ? '<div class="stv-tr">'+esc(translation)+'</div>' : '')+
      (note ? '<div class="stv-ctx">Bağlam: '+esc(note)+'</div>' : '')+
    '</div>';
  }).join('');
  return '<div class="stv-sec"><div class="st-review-head" style="margin-top:1.6rem">Kaydettiğin Kelimeler</div>'+
    '<p class="st-sub">Deneme sırasında işaretlediğin kelimeler — artık anlamlarıyla birlikte. Hepsi <strong>Çalışma Masam</strong>&apos;daki kelime listene de eklendi. Aşağıdaki incelemede herhangi bir kelimeye çift tıklayarak da anlamına bakabilirsin.</p>'+
    '<div class="stv-grid">'+cards+'</div></div>';
}

/* ================= Zamanlayıcı ================= */
function startTimer(mins){
  stopTimer();
  let remain = mins*60;
  const el = document.getElementById('st-timer');
  const warn = document.getElementById('st-warn');
  function tick(){
    const el2 = document.getElementById('st-timer'); if(!el2){ stopTimer(); return; }
    const m = Math.floor(Math.abs(remain)/60), s = Math.abs(remain)%60;
    el2.textContent = (remain<0?'+':'')+m+':'+(s<10?'0':'')+s;
    if (remain<=0){ el2.classList.add('over'); if(warn) warn.classList.add('show'); }
    remain--;
  }
  tick(); TIMER = setInterval(tick, 1000);
}
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }

/* ================= Modül yükleme / render ================= */
async function loadModule(){
  const sec = STATE.sections[STATE.si];
  const cfg = sec.cfg;
  const modKey = STATE.mod;            // 'm1' | 'm2'
  let slot = sec[modKey];
  if (!slot.q){
    // modül etiketi belirle
    const modTag = (modKey==='m1') ? 'm1' : (sec.secondHard ? 'm2h' : 'm2e');
    const tags = ['deneme:'+DEN.slug, 'dmod:'+modTag];
    if (DEN.kind==='full') tags.push('dsec:'+cfg.key);
    let pool = await fetchModule(tags, cfg.db);
    if (!pool.length){
      // içerik yok -> zarif hazırlanıyor
      renderNotReady(cfg, modKey); return;
    }
    slot.q = pool.slice(0, cfg.nQ);
    slot.a = {};
    slot.tier = (modKey==='m2') ? (sec.secondHard?'m2h':'m2e') : 'm1';
    persist();
  }
  const passages = cfg.db==='rw' ? await fetchPassages(slot.q.map(q=>q.passage_id)) : {};
  renderModule(sec, cfg, modKey, slot, passages);
}

function moduleHeaderRule(sec, cfg, modKey){
  const isFull = DEN.kind==='full';
  const secTxt = isFull ? '<strong>'+esc(cfg.label)+' bölümü.</strong> ' : '';
  if (modKey==='m1'){
    return '<div class="st-rulecard">'+secTxt+'<strong>Modül 1 / 2 — '+cfg.nQ+' soru, '+cfg.mins+' dakika.</strong> '+
      cfg.threshold+' veya üzeri doğru yaparsan <strong>zor 2. modüle</strong> (tavan 800), altında kalırsan <strong>kolay 2. modüle</strong> yönlendirilirsin. Gerçek Digital SAT gibi adaptif; sonunda 200-800 tahmini puanın hesaplanır.</div>';
  }
  const tier = sec.secondHard ? 'zor (tavan 800)' : 'kolay';
  return '<div class="st-rulecard">'+secTxt+'<strong>Modül 2 / 2 — '+tier+' ('+cfg.nQ+' soru, '+cfg.mins+' dakika).</strong> Modül 1 sonucuna göre yönlendirildin. Bu son modül; bittiğinde ham puanın 200-800 ölçeğine çevrilir.</div>';
}

function renderModule(sec, cfg, modKey, slot, passages){
  const modNo = modKey==='m1'?1:2;
  let h = moduleHeaderRule(sec, cfg, modKey);
  h += '<div class="st-warn" id="st-warn">Süre doldu. Cevaplarını gözden geçir ve hazır olduğunda <strong>Bitir</strong>&apos;e bas — otomatik gönderim yoktur.</div>';
  h += '<div class="st-bar"><span>'+esc(cfg.label)+' · Modül '+modNo+'/2</span><span class="st-clock">Süre <span class="st-timer" id="st-timer"></span></span></div>';
  const isM = (cfg.db==='math');
  slot.q.forEach((q,i)=>{
    const pass = (cfg.db==='rw' && q.passage_id && passages[q.passage_id]) ? passageHtml(passages[q.passage_id]) : '';
    h += '<div class="st-q" data-qi="'+i+'"><span class="st-q-num">'+(i+1)+'</span>'+pass+
      '<div class="st-stem">'+mtext(q.question_text, isM)+'</div>';
    if (isSpr(q)){
      h += '<div class="st-spr"><input type="text" data-qi="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ör. 7 · 1.5 · 3/4" value="'+esc(slot.a[i]||'')+'"><div class="note">Tam sayı, ondalık veya kesir. 1/2, 0.5 ve .5 aynı kabul edilir.</div></div>';
    } else {
      const opts = Array.isArray(q.options)?q.options:[];
      opts.forEach(o=>{
        const selCls = slot.a[i]===o.letter ? ' sel' : '';
        h += '<label class="st-opt'+selCls+'" data-letter="'+esc(o.letter)+'"><input type="radio" name="q'+i+'" value="'+esc(o.letter)+'"'+(slot.a[i]===o.letter?' checked':'')+'><span class="st-oletter">'+esc(o.letter)+'</span>'+mtext(o.text, isM)+'</label>';
      });
    }
    h += '</div>';
  });
  h += '<div class="st-actions"><button class="st-btn gold" id="st-submit">Bitir ve Değerlendir</button></div>';
  app.innerHTML = h;
  // MC seçim
  app.querySelectorAll('.st-opt').forEach(l=>{
    l.addEventListener('click',()=>{
      const qi = l.closest('.st-q').dataset.qi;
      l.closest('.st-q').querySelectorAll('.st-opt').forEach(x=>x.classList.remove('sel'));
      l.classList.add('sel'); l.querySelector('input').checked=true;
      slot.a[qi]=l.dataset.letter; persist();
    });
  });
  // Grid-in giriş
  app.querySelectorAll('.st-spr input').forEach(inp=>{
    inp.addEventListener('input',()=>{ slot.a[inp.dataset.qi]=inp.value; persist(); });
  });
  document.getElementById('st-submit').addEventListener('click', ()=>submitModule(sec, cfg, modKey, slot));
  startTimer(cfg.mins);
  TESTING = true; vHideBtn();   // sözlük: kaydet-butonu aktif, anlam yok
  window.scrollTo({top:0,behavior:'smooth'});
}

function gradeModule(slot){
  let correct = 0;
  slot.q.forEach((q,i)=>{
    const ans = slot.a[i];
    let ok;
    if (isSpr(q)) ok = sprCorrect(ans, q.correct_answer);
    else ok = ans===q.correct_answer;
    if (ok) correct++;
    if (q.slug && ans!=null && ans!=='') recAns(q.slug, ok);
  });
  return correct;
}

function submitModule(sec, cfg, modKey, slot){
  stopTimer();
  TESTING = false; vHideBtn();
  const correct = gradeModule(slot);
  slot.raw = correct;
  persist();
  if (modKey==='m1'){
    sec.secondHard = correct >= cfg.threshold;
    const box = '<div class="st-result"><div class="st-eyebrow">'+esc(cfg.label)+' · Modül 1 / 2</div>'+
      '<div class="st-score">'+correct+' / '+cfg.nQ+'</div>'+
      '<div class="st-pill '+(sec.secondHard?'pass':'fail')+'">Yönlendirme: 2. modül '+(sec.secondHard?'zor (tavan 800)':'kolay')+'</div>'+
      '<p class="st-note">'+(sec.secondHard
          ? '%70+ yaptın — zor 2. modüle geçiyorsun, üst puanların yolu açık.'
          : 'Baraj (' +cfg.threshold+ ') altında kaldın — kolay 2. modüle geçiyorsun (tavan sınırlı).')+
      '</p><div class="st-actions"><button class="st-btn gold" id="st-next">2. Modüle Geç &rsaquo;</button></div></div>';
    app.innerHTML = box;
    persist();
    window.scrollTo({top:0,behavior:'smooth'});
    document.getElementById('st-next').addEventListener('click', ()=>{ STATE.mod='m2'; persist(); loadModule(); });
    return;
  }
  // Modül 2 bitti -> bölüm tamam
  const rawTotal = (sec.m1.raw||0) + (sec.m2.raw||0);
  sec.rawTotal = rawTotal;
  sec.path = sec.secondHard ? 'hard' : 'easy';
  sec.scaled = cfg.scale(rawTotal, sec.secondHard ? 'hard' : 'easy');
  // sonraki bölüm var mı? (full: rw sonrası math)
  if (STATE.si < STATE.sections.length-1){
    const nextCfg = STATE.sections[STATE.si+1].cfg;
    const box = '<div class="st-result"><div class="st-eyebrow">'+esc(cfg.label)+' bölümü tamamlandı</div>'+
      '<div class="st-score">~'+sec.scaled+'</div>'+
      '<div class="st-pill pass">Ham: '+rawTotal+' / '+cfg.rawMax+' &middot; '+(sec.secondHard?'zor yol':'kolay yol')+'</div>'+
      '<p class="st-note">Şimdi <strong>'+esc(nextCfg.label)+'</strong> bölümüne geçiyorsun. Detaylı inceleme, tüm bölümler bitince gösterilir.</p>'+
      '<div class="st-actions"><button class="st-btn gold" id="st-next">'+esc(nextCfg.label)+' Bölümüne Geç &rsaquo;</button></div></div>';
    app.innerHTML = box;
    persist();
    window.scrollTo({top:0,behavior:'smooth'});
    document.getElementById('st-next').addEventListener('click', ()=>{ STATE.si++; STATE.mod='m1'; persist(); loadModule(); });
    return;
  }
  // tüm deneme bitti
  STATE.done = true; persist();
  finishDeneme();
}

/* ================= Sonuç + İnceleme ================= */
function saveAttempt(){
  if (!UID) return;
  const rwSec = STATE.sections.find(s=>s.cfg.key==='rw');
  const mSec  = STATE.sections.find(s=>s.cfg.key==='math');
  const detail = { sections: STATE.sections.map(s=>({
    key:s.cfg.key, path:s.path, m1_raw:s.m1.raw, m2_raw:s.m2.raw, m2_tier:s.m2.tier,
    m1:(s.m1.q||[]).map((q,i)=>({slug:q.slug, given:s.m1.a[i]??null, correct:q.correct_answer, ok: isSpr(q)?sprCorrect(s.m1.a[i],q.correct_answer):(s.m1.a[i]===q.correct_answer)})),
    m2:(s.m2.q||[]).map((q,i)=>({slug:q.slug, given:s.m2.a[i]??null, correct:q.correct_answer, ok: isSpr(q)?sprCorrect(s.m2.a[i],q.correct_answer):(s.m2.a[i]===q.correct_answer)}))
  })) };
  const total = STATE.sections.reduce((acc,s)=>acc+(s.scaled||0),0);
  const row = {
    user_id: UID, deneme_slug: DEN.slug, kind: DEN.kind,
    rw_raw: rwSec?rwSec.rawTotal:null, rw_scaled: rwSec?rwSec.scaled:null,
    math_raw: mSec?mSec.rawTotal:null, math_scaled: mSec?mSec.scaled:null,
    total_scaled: DEN.kind==='full' ? total : (STATE.sections[0].scaled),
    path: { rw: rwSec?rwSec.path:null, math: mSec?mSec.path:null },
    answers: detail, completed_at: new Date().toISOString()
  };
  try{ sb.from('sat_deneme_attempts').insert(row).then(function(){},function(e){ console.warn('attempt save failed', e); }); }catch(e){}
}

function reviewQuestionHtml(q, given, passages, cfg){
  const ok = isSpr(q) ? sprCorrect(given,q.correct_answer) : (given===q.correct_answer);
  const blank = given==null || given==='';
  const numCls = blank ? 'blank' : (ok ? '' : 'wrong');
  const pass = (cfg.db==='rw' && q.passage_id && passages[q.passage_id]) ? passageHtml(passages[q.passage_id]) : '';
  let h = '<div class="st-q"><span class="st-q-num '+numCls+'">'+(ok?'✓':(blank?'—':'✗'))+'</span>'+pass+
    '<div class="st-stem">'+esc(q.question_text)+'</div>';
  if (isSpr(q)){
    const gd = blank ? '(boş)' : esc(given);
    h += '<div class="st-ansline"><span class="chip '+(ok?'good':(blank?'neu':'bad'))+'">Senin cevabın</span>'+gd+'</div>';
    h += '<div class="st-ansline"><span class="chip good">Doğru cevap</span>'+esc(String(q.correct_answer||'').split('|').join('  ·  '))+'</div>';
  } else {
    const opts = Array.isArray(q.options)?q.options:[];
    opts.forEach(o=>{
      let cls='st-opt';
      if (o.letter===q.correct_answer) cls+=' correct';
      else if (o.letter===given) cls+=' wrong';
      h += '<div class="'+cls+'"><span class="st-oletter">'+esc(o.letter)+'</span>'+esc(o.text)+'</div>';
    });
    h += '<div class="st-ansline"><span class="chip '+(ok?'good':(blank?'neu':'bad'))+'">Senin cevabın</span>'+(blank?'(boş)':esc(given))+
         ' &nbsp; <span class="chip good">Doğru</span>'+esc(q.correct_answer)+'</div>';
  }
  h += '<div class="st-expl">'+explHtml(q)+'</div></div>';
  return h;
}

async function finishDeneme(){

  TESTING = false; vHideBtn();

  app.innerHTML = '<div class="st-loading">Sonuçların ve detaylı inceleme hazırlanıyor...</div>';

    res = '<div class="st-result"><div class="st-eyebrow">Tam SAT Denemesi · Sonuç</div>'+
      '<div class="st-score big">~'+total+'</div><div class="st-note">400-1600 tahmini toplam</div>'+
      '<div class="st-scores">'+
        '<div class="st-scorecell"><b>~'+rw.scaled+'</b><span>Reading &amp; Writing<br>Ham '+rw.rawTotal+'/54 · '+(rw.secondHard?'zor':'kolay')+' yol</span></div>'+
        '<div class="st-scorecell"><b>~'+m.scaled+'</b><span>Math<br>Ham '+m.rawTotal+'/44 · '+(m.secondHard?'zor':'kolay')+' yol</span></div>'+
      '</div>'+
      '<p class="st-note">Bu bir <strong>tahmindir</strong>, resmi puan değildir. Gerçek Digital SAT her forma göre eşitlenir.</p>'+
      (((rw.rawTotal||0)+(m.rawTotal||0) < 12) ? '<p class="st-note" style="margin-top:.7rem;border-left:3px solid var(--st-gold);padding:.4rem .7rem;text-align:left">Çok az soru doğru yanıtlandı. Gösterilen puan ölçeğin <strong>taban puanıdır</strong> (her bölüm en az 200; toplam 400) ve gerçek performansı yansıtmaz — denemeyi baştan sona çözünce puanın anlamlı olur.</p>' : '')+
      '</div>';
  } else {
    const s = STATE.sections[0];
    res = '<div class="st-result"><div class="st-eyebrow">'+esc(s.cfg.label)+' Denemesi · '+(s.secondHard?'Zor yol (tavan 800)':'Kolay yol')+'</div>'+
      '<div class="st-score big">~'+s.scaled+'</div><div class="st-note">200-800 tahmini</div>'+
      '<div class="st-pill pass">Ham: '+s.rawTotal+' / '+s.cfg.rawMax+' (M1 '+s.m1.raw+' + M2 '+s.m2.raw+')</div>'+
      '<p class="st-note">Bu bir <strong>tahmindir</strong>, resmi puan değildir.</p>'+
      ((s.rawTotal < s.cfg.rawMax*0.12) ? '<p class="st-note" style="margin-top:.7rem;border-left:3px solid var(--st-gold);padding:.4rem .7rem;text-align:left">Çok az soru doğru yanıtlandı. Gösterilen puan <strong>taban puandır</strong> (en az 200) ve gerçek performansı yansıtmaz — denemeyi baştan sona çözünce puanın anlamlı olur.</p>' : '')+
      '</div>';
  }
  // İnceleme
  let rev = '<div class="st-review-head">Soru Soru İnceleme</div>'+
    '<p class="st-sub">Her soru için senin cevabın, doğru cevap ve adım adım çözüm. Neden yanlış yaptığını burada gör.</p>';
  for (const sec of STATE.sections){
    const cfg = sec.cfg;
    // pasajları topla
    let passages = {};
    if (cfg.db==='rw'){
      const ids = [].concat((sec.m1.q||[]).map(q=>q.passage_id), (sec.m2.q||[]).map(q=>q.passage_id));
      passages = await fetchPassages(ids);
    }
    if (DEN.kind==='full') rev += '<div class="st-sectlabel">'+esc(cfg.label)+'</div>';
    rev += '<div class="st-sectlabel">Modül 1</div>';
    (sec.m1.q||[]).forEach((q,i)=>{ rev += reviewQuestionHtml(q, sec.m1.a[i], passages, cfg); });
    rev += '<div class="st-sectlabel">Modül 2 ('+(sec.secondHard?'zor':'kolay')+')</div>';
    (sec.m2.q||[]).forEach((q,i)=>{ rev += reviewQuestionHtml(q, sec.m2.a[i], passages, cfg); });
  }
  const foot = '<div class="st-actions"><a class="st-btn ghost" href="'+(DEN.kind==='math'?'sat-denemeler-math':'sat-denemeler-rw')+'">Diğer Denemeler</a>'+
    '<a class="st-btn" href="panelim">Çalışma Masam</a></div>';
  const vocabBlock = await savedVocabHtml();   // Kaydettiğin Kelimeler (anlamlarıyla)
  app.innerHTML = res + vocabBlock + rev + foot;
  clearSave();
  loadGriSozluk();   // inceleme ekranında normal anlam-popup artık serbest
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= Başlangıç ekranı / akış ================= */
function newState(){
  return { si:0, mod:'m1', done:false,
    sections: DEN.sections.map(cfg=>({ cfg, secondHard:false,
      m1:{q:null,a:{},raw:null}, m2:{q:null,a:{},raw:null,tier:null} })) };
}

function showStart(hasSave){
  const kindLabel = DEN.kind==='full' ? 'Tam SAT (R&W + Math)' : (DEN.kind==='rw'?'Reading & Writing':'Math');
  let facts;
  if (DEN.kind==='full'){
    facts = '<div class="st-fact"><b>4 modül</b><span>R&amp;W 2 + Math 2, adaptif</span></div>'+
            '<div class="st-fact"><b>~134 dk</b><span>R&amp;W 2×32 + Math 2×35</span></div>'+
            '<div class="st-fact"><b>400-1600</b><span>Tahmini toplam + bölüm puanları</span></div>';
  } else if (DEN.kind==='rw'){
    facts = '<div class="st-fact"><b>2 modül</b><span>27+27 soru, adaptif</span></div>'+
            '<div class="st-fact"><b>~64 dk</b><span>Modül başına 32 dk</span></div>'+
            '<div class="st-fact"><b>200-800</b><span>Tahmini R&amp;W puanı</span></div>';
  } else {
    facts = '<div class="st-fact"><b>2 modül</b><span>22+22 soru, adaptif</span></div>'+
            '<div class="st-fact"><b>~70 dk</b><span>Modül başına 35 dk</span></div>'+
            '<div class="st-fact"><b>200-800</b><span>Tahmini Math puanı</span></div>';
  }
  let actions = '<div class="st-actions">';
  if (hasSave) actions += '<button class="st-btn gold" id="st-resume">Kaldığın Yerden Devam Et</button><button class="st-btn ghost" id="st-restart">Baştan Başla</button>';
  else actions += '<button class="st-btn gold" id="st-begin">Denemeye Başla &rsaquo;</button>';
  actions += '</div>';
  app.innerHTML =
    '<div class="st-eyebrow">Digital SAT · Adaptif Deneme</div>'+
    '<h1 class="st-h1">'+esc(kindLabel)+' Denemesi '+DEN.n+'</h1>'+
    '<p class="st-sub">3 aşamalı adaptif yapı: Modül 1 herkes için standart zorluktadır. Modül 1&apos;deki başarına göre Modül 2 <strong>zor</strong> (yüksek puan yolu, tavan 800) ya da <strong>kolay</strong> gelir. Sonunda ham puanın 200-800 ölçeğine çevrilir (tahmin). Otomatik gönderim yoktur; süre dolunca uyarı gösterilir ama sen Bitir&apos;e basana kadar devam edebilirsin.</p>'+
    '<div class="st-facts">'+facts+'</div>'+
    '<div class="st-rulecard">Baraj: R&amp;W için Modül 1&apos;de <strong>19/27</strong>, Math için <strong>16/22</strong> ve üzeri → zor Modül 2. Her modülün kendi süresi vardır. Çalışman <strong>Çalışma Masam</strong>&apos;a işlenir.</div>'+
    actions;
  const beg = document.getElementById('st-begin');
  if (beg) beg.addEventListener('click', ()=>{ STATE=newState(); persist(); loadModule(); });
  const rsm = document.getElementById('st-resume');
  if (rsm) rsm.addEventListener('click', resume);
  const rst = document.getElementById('st-restart');
  if (rst) rst.addEventListener('click', ()=>{ clearSave(); STATE=newState(); persist(); loadModule(); });
}

function resume(){
  const snap = loadSave();
  if (!snap){ STATE=newState(); loadModule(); return; }
  STATE = { si:snap.si||0, mod:snap.mod||'m1', done:!!snap.done,
    sections: DEN.sections.map((cfg,idx)=>{
      const ss = (snap.sections&&snap.sections[idx])||{};
      return { cfg, secondHard:!!ss.secondHard,
        m1:{ q:(ss.m1&&ss.m1.q)||null, a:(ss.m1&&ss.m1.a)||{}, raw:(ss.m1&&ss.m1.raw!=null)?ss.m1.raw:null },
        m2:{ q:(ss.m2&&ss.m2.q)||null, a:(ss.m2&&ss.m2.a)||{}, raw:(ss.m2&&ss.m2.raw!=null)?ss.m2.raw:null, tier:(ss.m2&&ss.m2.tier)||null } };
    }) };
  if (STATE.done){ finishDeneme(); return; }
  const sec = STATE.sections[STATE.si];
  const slot = sec[STATE.mod];
  // Modül puanlandıysa ama sonraki adıma geçilmediyse -> akışı ilerlet
  if (slot.raw!=null){
    if (STATE.mod==='m1'){ STATE.mod='m2'; loadModule(); return; }
    // m2 puanlanmış: bölüm bitmiş; sonraki bölüm ya da bitir
    if (STATE.si < STATE.sections.length-1){ STATE.si++; STATE.mod='m1'; loadModule(); return; }
    STATE.done=true; finishDeneme(); return;
  }
  loadModule();   // in-progress modül; loadModule stored q varsa yeniden çeker/render eder
}

function renderNotReady(cfg, modKey){
  stopTimer();
  app.innerHTML =
    '<div class="st-eyebrow">Digital SAT · Adaptif Deneme</div>'+
    '<h1 class="st-h1">Bu deneme hazırlanıyor</h1>'+
    '<div class="st-rulecard">'+esc(cfg.label)+' bölümünün soruları henüz yüklenmedi. Bu deneme için içerik yakında eklenecek. O zamana kadar diğer denemeleri ya da soru bankasını deneyebilirsin.</div>'+
    '<div class="st-actions"><a class="st-btn" href="'+(cfg.db==='math'?'sat-denemeler-math':'sat-denemeler-rw')+'">Denemeler</a>'+
    '<a class="st-btn ghost" href="sat-soru-bankasi">Soru Bankası</a></div>';
  clearSave();
}

function showAuthGate(){
  const ret = encodeURIComponent('/sat-deneme.html'+location.search);
  app.innerHTML =
    '<div class="st-eyebrow">Digital SAT · Adaptif Deneme</div>'+
    '<h1 class="st-h1">Denemeye başlamak için giriş yap</h1>'+
    '<p class="st-sub">Bu adaptif deneme, sonuçlarını kaydeder ve <strong>Çalışma Masam</strong>&apos;a işler. Devam etmek için ücretsiz hesabınla giriş yapmalısın.</p>'+
    '<div class="st-actions"><a class="st-btn gold" href="giris?return='+ret+'">Giriş Yap</a><a class="st-btn ghost" href="giris#signup">Ücretsiz Hesap Aç</a></div>';
}

async function init(){
  DEN = parseDeneme(param('d'));
  if (!DEN){
    app.innerHTML = '<div class="st-eyebrow">Digital SAT · Adaptif Deneme</div><h1 class="st-h1">Deneme bulunamadı</h1>'+
      '<p class="st-sub">Geçerli bir deneme seç.</p><div class="st-actions"><a class="st-btn" href="sat-denemeler-rw">R&amp;W Denemeleri</a><a class="st-btn ghost" href="sat-denemeler-math">Math Denemeleri</a></div>';
    return;
  }
  document.title = (DEN.kind==='full'?'Tam SAT':(DEN.kind==='rw'?'SAT R&W':'SAT Math'))+' Denemesi '+DEN.n+' | Gri English';
  try{
    const s = await sb.auth.getSession();
    if (s && s.data && s.data.session){ UID = s.data.session.user.id; TOKEN = s.data.session.access_token; window.GRI_SB=sb; window.GRI_UID=UID; }
  }catch(e){}
  if (!UID){ showAuthGate(); return; }
  // Deneme-içi sözlük: yalnızca giriş yapılınca (UID yoksa sessizce devre dışı)
  document.addEventListener('mouseup', vOnSelection);
  document.addEventListener('touchend', vOnSelection);
  document.addEventListener('dblclick', vOnSelection);
  document.addEventListener('mousedown', vOnDocDown, true);
  window.addEventListener('scroll', vHideBtn, { passive:true });
  showStart(!!loadSave());
}
init();
</script>
