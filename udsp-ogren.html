*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{max-width:1200px;margin:0 auto;padding:24px 22px 90px;display:flex;gap:24px;align-items:flex-start}
.main{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 0 32px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.04)}

.head{background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:26px 30px 24px;color:#fff}

.rec audio{margin-top:10px;width:100%}

:root[data-theme="dark"] .rlink.done::after{color:#5fd0a0}
.pad>p{max-width:68ch}
</style>

<script id="data" type="application/json">{"title": "UDSP Kelime", "badge": "UDSP", "groups": ["Öğren", "Kelime Paketleri"], "lessons": [{"id": "basla", "group": "Öğren", "name": "UDSP Hakkında", "eyebrow": "Öğren", "blocks": [{"t": "p", "x": "Bu modül UDSP için Almanca ve İngilizce temel kelimeleri tema tema çalıştırır. Her kelimenin Almancası, İngilizcesi ve Türkçesi bir arada. Önce listeyi çalış, sonra Almancadan İngilizceye eşleştirme quizini çöz."}, {"t": "h", "x": "UDSP nedir ve bu modül neyi hedefler"}, {"t": "p", "x": "UDSP (Üniversitelerarası Dil Sınavı Pratiği), akademik amaçlı dil yeterlik sınavlarının; yani YÖKDİL, YDS ve e-YDS gibi sınavların ortak mantığını çalıştırmak için hazırlanmış bir hazırlık modülüdür. Bu sınavlar akademik yükseltmelerde, doktora başvurularında, doçentlik ve yurt dışı burs süreçlerinde istenen dil belgesinin temelidir. Sınav 80 sorudan oluşur, süre 180 dakikadır ve tek bir kelime bilgisi ölçmez: kelime, dilbilgisi, cloze (boşluk doldurma), cümle tamamlama, çeviri, restatement (anlamca en yakın cümle) ve okuma parçalarını bir arada ölçer. Yani sınav bir 'ezber testi' değil, kelimeyi cümlenin ve paragrafın içinde doğru yere oturtabilme testidir."}, {"t": "p", "x": "Bu modülün rolü şudur: sınavın en alt katmanını, yani kelime tabanını, üç dilli (Almanca, İngilizce, Türkçe) bir sistemle sağlamlaştırmak. Kelime tabanı olmadan yukarıdaki hiçbir beceri çalışmaz; çünkü cloze de, çeviri de, okuma da önce 'bu kelime ne demek' sorusunun otomatik olarak cevaplanmasını ister. Sen sınavda bir kelimeyi düşünürken kaybettiğin her üç saniye, paragrafın mantığını takip etme gücünden çalınır. Bu yüzden burada amaç kelimeyi tanımak değil, kelimeyi refleks hâline getirmektir. Aşağıda önce sınavın yapısını, sonra soruların arkasındaki mantığı, en sonda da kelimeyi kalıcı öğrenmenin yöntemini adım adım göreceksin."}, {"t": "h", "x": "Sınavın yapısı: 80 soru, 180 dakika"}, {"t": "p", "x": "Sınavı doğru okumak, hangi soruya kaç dakika ayıracağını bilmekle başlar. 80 soruyu 180 dakikaya böldüğünde soru başına ortalama 2 dakikadan biraz fazla süren düşer; ama bu ortalama yanıltıcıdır. Kelime ve dilbilgisi sorularını 30-45 saniyede bitirip, kazandığın zamanı okuma ve cloze paragraflarına aktarman gerekir. Aşağıdaki dağılım, sınavın klasik omurgasıdır; yıldan yıla küçük oynamalar olsa da soru tipleri değişmez."}, {"t": "table", "head": ["Bölüm", "Yaklaşık soru", "Ne ölçer"], "rows": [["Kelime ve phrasal verb", "6", "Doğru kelimeyi bağlamda seçme"], ["Dilbilgisi (tense, preposition, yapı)", "10", "Zaman, edat ve cümle yapısı uyumu"], ["Cloze test (2 paragraf)", "10", "Paragraf bütünlüğü, bağlaç, collocation"], ["Cümle tamamlama", "8", "Yan cümle ve mantık ilişkisi"], ["Çeviri (İng-Tür / Tür-İng)", "6", "Anlamı bozmadan aktarma"], ["Okuma parçaları", "20", "Ana fikir, detay, çıkarım"], ["Diyalog tamamlama", "5", "Konuşma mantığı ve tutarlılık"], ["Restatement (en yakın cümle)", "4", "Aynı anlamı farklı yapıyla kurma"], ["Paragraf tamamlama", "4", "Boşluğa uygun cümle"], ["Anlam bütünlüğünü bozan cümle", "5", "Konu dışı cümleyi ayıklama"]]}, {"t": "p", "x": "Her doğru cevap yaklaşık 1,25 puan değerindedir ve yanlışın doğruyu götürmediği bir sistemde çalışırsın; yani boş bırakmak yerine mantıklı bir tahmin her zaman daha iyidir. Dikkat etmen gereken nokta şudur: puanın yarısından fazlası (okuma + cloze + tamamlama = yaklaşık 47 soru) doğrudan 'kelimeyi bağlamda anlama' becerisine dayanır. Bu yüzden kelime çalışması, sınavın sadece 6 soruluk kelime bölümünü değil, neredeyse tüm sınavı besler."}, {"t": "note", "k": "ipucu", "title": "Zaman yönetimi", "lines": ["Kelime ve dilbilgisi sorularını hızlı bitir, kazandığın zamanı okuma ve cloze paragraflarına aktar.", "Bir kelimede takılırsan işaretle ve geç; ikinci turda çevre kelimeler ipucu verir.", "Okuma parçasında önce soruları oku, sonra cevabı metinde ara; bütün metni ezberlemeye çalışma."]}, {"t": "h", "x": "Kelime ve dilbilgisi sorularının mantığı"}, {"t": "p", "x": "Kelime sorusu asla 'bu kelimenin sözlük anlamı nedir' diye sormaz; 'bu cümleye anlamca ve dilbilgisel olarak hangi kelime oturur' diye sorar. Doğru cevabı bulmanın en güçlü yolu, boşluğun etrafındaki sinyalleri okumaktır: fiil hangi edatı ister, isim hangi sıfatla birlikte gelir, cümlenin tonu olumlu mu olumsuz mu. Örneğin 'to eat' fiilini bilmek yetmez; 'eat breakfast', 'eat healthily', 'eat out (dışarıda yemek)' gibi birlikte kullanımları da bilmen gerekir. Bu birlikte kullanımlara collocation denir ve sınavın gizli belkemiğidir."}, {"t": "p", "x": "Dilbilgisi sorusunda ise iki şeye bakılır: zaman uyumu ve yapı uyumu. Cümlede 'yesterday', 'in 1990', 'ago' gibi bir zaman zarfı varsa geçmiş zaman istenir; 'since', 'for', 'already' varsa present perfect devreye girer. Bir edat sorusunda ise kelimenin sabit ortağını hatırlaman gerekir: 'depend on', 'interested in', 'responsible for'. Bunları tek tek ezberlemek yerine, bir kelimeyi öğrenirken hep yanındaki edatla birlikte not almak en verimli yoldur."}, {"t": "given", "title": "Çözümlü örnek: kelime sorusu", "x": "Cümle: 'She had to ___ a difficult decision about her career.' Seçenekler: (A) do  (B) make  (C) take  (D) get. Mantık: 'decision' ismi İngilizcede 'make' fiiliyle collocation kurar: 'make a decision'. 'do a decision' ya da 'take a decision (İngiliz kullanımında nadiren geçse de sınavda tercih edilmez)' doğru sayılmaz. Anlam da yapı da 'make' der. Doğru cevap: B. Ders: kelimeyi tek başına değil, sabit ortağıyla öğren."}, {"t": "h", "x": "Cloze test: paragrafı tek bir bütün olarak oku"}, {"t": "p", "x": "Cloze test, bir paragrafta 5 boşluğun peş peşe çıktığı bölümdür ve en çok puan kaybedilen yerlerden biridir; çünkü öğrenciler her boşluğu ayrı bir soru gibi çözmeye çalışır. Doğru yöntem tam tersidir: paragrafı önce baştan sona, boşlukları görmezden gelerek oku. Amacın konuyu, tonu ve zaman akışını yakalamaktır. Bir cloze paragrafında genellikle iki-üç kelime sorusu (isim, fiil, edat) ve iki gramer sorusu (tense, bağlaç) bulunur. En sık çıkan gramer konusu bağlaçtır: 'however', 'therefore', 'although', 'because', 'moreover'."}, {"t": "p", "x": "Bağlaç sorusunda kritik olan şey, boşluğun öncesindeki cümle ile sonrasındaki cümle arasındaki mantıksal ilişkidir. İki cümle birbirine zıtsa 'however' veya 'although' gelir; biri diğerinin sonucuysa 'therefore' veya 'as a result' gelir; biri diğerine ekleme yapıyorsa 'moreover' veya 'in addition' gelir. Bu ilişkiyi görmek için boşluktan önceki ve sonraki bir-iki cümleyi dikkatle okumak gerekir. Kelime boşluklarında ise en güvenilir dayanağın collocation ve konu bütünlüğüdür."}, {"t": "given", "title": "Çözümlü örnek: cloze bağlaç", "x": "Paragraf: 'Renewable energy is clean and increasingly cheap. ___, its supply can be unpredictable because the sun does not always shine.' Boşluk: (A) Therefore  (B) However  (C) Moreover  (D) For example. Mantık: ilk cümle olumlu (temiz ve ucuz), ikinci cümle bir dezavantaj getiriyor (arz belirsiz). Bu bir zıtlık ilişkisidir, sonuç ya da ekleme değil. Zıtlık bağlacı 'However' gerekir. Doğru cevap: B. Ders: bağlaç sorusunu iki cümle arasındaki ilişkiyi adlandırarak çöz."}, {"t": "note", "k": "protokol", "title": "Cloze çözüm protokolü", "lines": ["1) Paragrafı boşlukları atlayarak baştan sona oku, konuyu ve tonu belirle.", "2) En kolay boşluktan başla; kesin bildiğin cevaplar paragrafın anlamını kilitler.", "3) Bağlaç boşluğunda önceki ve sonraki cümlenin ilişkisini adlandır (zıtlık, sonuç, ekleme).", "4) Kelime boşluğunda collocation ve konu bütünlüğüne dayan.", "5) Kararını tek bir sinyale değil, en az iki uyum kriterine yasla (anlam + yapı)."]}, {"t": "h", "x": "Kelimeyi kalıcı öğrenmek: artikel, collocation, köken"}, {"t": "p", "x": "Bu modül üç dilli olduğu için sana çift bir avantaj sunar. Almanca ve İngilizce aynı dil ailesinden (Germen dilleri) geldiği için pek çok kelime birbirine benzer; buna cognate (köken akrabası) denir. 'das Haus / house', 'die Milch / milk', 'der Freund / friend', 'trinken / to drink' gibi çiftlerde benzerlik tesadüf değildir. Bu benzerliği fark etmek hem Almanca hem İngilizce kelimeyi aynı anda hafızaya kazır. Ama dikkat: bazı kelimeler benzer görünür, farklı anlam taşır; bunlara 'sahte dost' (false friend) denir. Örneğin Almanca 'bekommen' İngilizce 'become' gibi görünür ama 'almak, elde etmek' demektir, 'olmak' değil. Benzerliği ipucu olarak kullan, ama anlamı her zaman doğrula."}, {"t": "p", "x": "Almanca isimlerde artikel (der, die, das) kelimenin ayrılmaz parçasıdır ve isim cinsiyetini gösterir: der eril, die dişil, das nötr. Kelimeyi 'Haus' diye değil, her zaman 'das Haus' diye öğren; çünkü artikeli yanlış bilmek cümledeki tüm çekimleri bozar. İngilizce tarafında ise kelimeyi yalın hâliyle değil, en sık geçtiği collocation ile öğren: sadece 'decision' değil 'make a decision'; sadece 'attention' değil 'pay attention'; sadece 'responsibility' değil 'take responsibility'. Böylece sınavda kelime aklına tek başına değil, gireceği kalıpla birlikte gelir ve doğru cevabı seçmek refleks olur."}, {"t": "note", "k": "dikkat", "title": "Sık yapılan hatalar", "lines": ["Kelimeyi artikelsiz ezberlemek: 'Haus' değil 'das Haus'; artikel yanlışsa çekim yanlış olur.", "Kelimeyi collocationsuz ezberlemek: 'make a decision' yerine sadece 'decision' bilmek sınavda yetmez.", "Cloze boşluklarını tek tek çözmeye çalışmak: paragrafı bütün olarak okumadan boşluk doldurmak hata üretir.", "Sahte dostlara güvenmek: 'bekommen' = almak, 'become' değil; benzerliği doğrula.", "Zaman zarfını atlamak: 'ago', 'yesterday' geçmiş; 'since', 'already' present perfect ister."]}, {"t": "h", "x": "Çeviri ve restatement mantığı"}, {"t": "p", "x": "Çeviri sorularında amaç kelime kelime aktarmak değil, cümlenin anlamını bozmadan hedef dile geçirmektir. Türkçe 'karar vermek' fiilini İngilizceye 'to give a decision' diye çevirmek yanlıştır; doğru kalıp 'to make a decision'. İşte burada collocation bilgisi doğrudan puana dönüşür. Restatement (anlamca en yakın cümle) sorularında ise verilen cümlenin aynısını farklı bir yapıyla kuran seçeneği bulursun. Örneğin 'He couldn't attend because he was ill' cümlesinin en yakını 'His illness prevented him from attending' olur; anlam aynıdır, yapı farklıdır. Bu soruda tuzak, bir-iki kelimesi değişmiş ama anlamı bozulmuş seçeneklerdir; her seçeneği orijinal cümlenin anlamıyla tek tek karşılaştır."}, {"t": "drill", "instr": "Aşağıdaki soruları kendi kendine cevapla, sonra Öneri düğmesine basıp karşılaştır. Amaç, yukarıdaki mantığı refleks hâline getirmek.", "items": [{"n": 1, "q": "'She is very good ___ mathematics.' boşluğuna hangi edat gelir ve neden?", "a": "'at' gelir: 'good at' sabit bir collocationdır (bir konuda iyi olmak). Edatı kelimeyle birlikte öğrenmek bu soruyu üç saniyede bitirir."}, {"n": 2, "q": "Bir cloze boşluğunda önceki cümle bir sorunu, sonraki cümle çözümü anlatıyorsa hangi bağlaç ailesi gelir?", "a": "Sonuç/çözüm ilişkisi: 'therefore', 'thus', 'as a result'. Zıtlık (however) ya da ekleme (moreover) değil; iki cümlenin ilişkisini adlandırmak seçeneği kilitler."}, {"n": 3, "q": "Almanca 'das Buch' ve İngilizce 'book' arasındaki benzerlik neyi gösterir, bu bilgiyi nasıl kullanırsın?", "a": "İkisi de Germen kökenli cognate. Benzerlik iki kelimeyi aynı anda hafızaya kazır; ama anlamı doğrula (her benzer kelime sahte dost olabilir). 'das Buch' artikeliyle, 'book' ise 'read a book' collocationıyla öğrenilir."}]}, {"t": "note", "k": "hedef", "title": "Çalışma planı", "lines": ["Her paketi önce sesli oku; Almanca artikeli, İngilizce collocationı ve Türkçe karşılığı birlikte söyle.", "Aşağıdaki konu anlatımını okuduktan sonra quizi çöz; yanlışlarını not al ve ertesi gün tekrar çöz.", "Haftada en az iki cloze paragrafı çöz ve her yanlışta 'hangi sinyali kaçırdım' diye sor.", "Almanca isimleri artikelsiz, İngilizce kelimeleri collocationsuz asla ezberleme."]}, {"t": "h", "x": "Kelime türetme: bir kökten çok kelime kazanmak"}, {"t": "p", "x": "Sınavda bilmediğin bir kelimeyle karşılaştığında panik yapma; İngilizce kelimelerin çoğu ön ek (prefix) ve son ek (suffix) ile türer ve kökü tanırsan anlamı çıkarabilirsin. Ön ekler anlamı çevirir: 'un-', 'in-', 'dis-' olumsuzluk verir (happy-unhappy, correct-incorrect, agree-disagree); 're-' tekrar anlatır (read-reread, do-redo); 'over-' fazlalık, 'under-' eksiklik anlatır (overwork, underestimate). Son ekler ise kelimenin türünü belirler: '-tion/-ment/-ness' isim yapar (decide-decision, develop-development, happy-happiness); '-ful/-less' sıfat yapar (care-careful-careless); '-ly' zarf yapar (quick-quickly). Bir kökü öğrendiğinde ailesini de öğren: 'decide, decision, decisive, decisively' aynı köktendir."}, {"t": "given", "title": "Çözümlü örnek: kelime türetme", "x": "Cümle: 'The results of the experiment were ___; nobody expected them.' Seçenekler: (A) predictable  (B) unpredictable  (C) prediction  (D) predict. Mantık: 'nobody expected them' (kimse beklemiyordu) sinyali 'öngörülemez' anlamını ister; 'predict' köküne olumsuzluk ön eki 'un-' ve sıfat son eki '-able' eklenir: 'unpredictable'. 'prediction' isim, 'predict' fiildir; cümle sıfat ister (were + sıfat). Doğru cevap: B. Ders: ön ek anlamı, son ek türü belirler; ikisini birlikte oku."}, {"t": "note", "k": "ipucu", "title": "Nasıl çalışılır", "lines": ["Her paketi önce sesli oku, sonra quizi çöz.", "Almanca isimlerde artikel (der, die, das) kelimenin bir parçasıdır, birlikte öğren.", "Bir kelimeyi öğrenirken ailesini de not al: decide-decision-decisive.", "Ön ek (un-, re-, dis-) anlamı; son ek (-tion, -ful, -ly) türü değiştirir."]}]}, {"id": "p1", "group": "Kelime Paketleri", "name": "Paket 1. Alltag (Günlük)", "eyebrow": "P1", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["das Haus", "house", "ev"], ["die Familie", "family", "aile"], ["essen", "to eat", "yemek"], ["trinken", "to drink", "içmek"], ["schlafen", "to sleep", "uyumak"], ["arbeiten", "to work", "çalışmak"], ["kaufen", "to buy", "satın almak"], ["die Zeit", "time", "zaman"], ["das Geld", "money", "para"], ["der Freund", "friend", "arkadaş"]]}, {"t": "h", "x": "Alltag: günlük hayat kelimeleri neden sınavın kalbindedir"}, {"t": "p", "x": "Bu paketteki kelimeler (ev, aile, yemek, içmek, uyumak, çalışmak, satın almak, zaman, para, arkadaş) sınavın en sık geçen 'yüksek frekanslı' kelimeleridir. Akademik metinler bile bu temel fiil ve isimlerin üstüne kurulur: bir iktisat paragrafında 'money', 'buy', 'work' geçer; bir sosyoloji parçasında 'family', 'friend', 'time' geçer. Yani bu kelimeleri refleks hâline getirmek, sadece 6 soruluk kelime bölümüne değil, okuma ve cloze paragraflarının tümüne yatırımdır. Amacın, bu kelimeleri görünce düşünmeden anlamı ve gireceği kalıbı hatırlamaktır."}, {"t": "p", "x": "Günlük hayat kelimelerinin sınavdaki tuzağı, çok tanıdık olmalarıdır. Öğrenci 'bunu zaten biliyorum' der ve collocationını atlar. Oysa sınav 'time' kelimesini tek başına değil, 'spend time', 'waste time', 'on time', 'in time' gibi kalıplarla sorar; 'money' kelimesini 'spend money', 'save money', 'make money' gibi kalıplarla test eder. Kelimeyi tanımak ile kelimeyi doğru kalıpta kullanmak arasındaki fark, bu bölümde puan kaybının ana kaynağıdır."}, {"t": "h", "x": "Artikel ve cinsiyet: bu paketteki isimleri artikeliyle öğren"}, {"t": "p", "x": "Almanca isimlerde artikel keyfi değildir; ismin cinsiyetini gösterir ve cümledeki tüm çekimleri (sıfat sonu, zamir, hâl eki) belirler. Bu yüzden 'Haus' değil 'das Haus', 'Zeit' değil 'die Zeit' diye öğrenmelisin. Aşağıdaki tablo bu paketteki isimlerin artikellerini ve küçük bir mantık ipucunu gösterir. Kesin kural olmasa da bazı desenler işine yarar: soyut ve '-e' ile biten pek çok isim dişildir (die Zeit, die Familie), pek çok temel nesne nötr ya da erildir."}, {"t": "table", "head": ["İsim", "Cinsiyet", "İpucu / not"], "rows": [["das Haus", "nötr (das)", "İngilizce 'house' ile cognate; ev/bina"], ["die Familie", "dişil (die)", "-e ile biten pek çok isim dişildir"], ["die Zeit", "dişil (die)", "soyut kavram; 'time' karşılığı"], ["das Geld", "nötr (das)", "sayılamayan; 'money' gibi tekil kullanılır"], ["der Freund", "eril (der)", "dişili 'die Freundin' (kadın arkadaş)"]]}, {"t": "h", "x": "Cognate köprüsü: Almanca-İngilizce benzerliği ipucu olarak kullan"}, {"t": "p", "x": "Almanca ve İngilizce aynı Germen kökünden geldiği için bu paketteki birçok kelime birbirine benzer. Bu benzerliği fark etmek, iki dilin kelimesini aynı anda hafızaya kazır ve sınavda tanıma hızını artırır. Ancak benzerlik her zaman birebir değildir; ses ve yazım kaymış olabilir. Aşağıdaki tablo bu paketteki cognate çiftlerini gösterir."}, {"t": "table", "head": ["Almanca", "İngilizce", "Benzerlik notu"], "rows": [["das Haus", "house", "Neredeyse aynı; au/ou dönüşümü"], ["trinken", "to drink", "t/d ve k sesleri korunmuş"], ["der Freund", "friend", "Freund/friend aynı kökten"], ["essen", "to eat", "Uzak akraba; anlamı doğrula"], ["das Geld", "(gold ile karıştırma)", "Geld = para; 'gold' değil, sahte dost riski"]]}, {"t": "note", "k": "dikkat", "title": "Sahte dost uyarısı", "lines": ["Almanca 'das Geld' İngilizce 'gold' gibi görünür ama 'para' demektir, 'altın' değil.", "Almanca 'bekommen' İngilizce 'become' gibi görünür ama 'almak, elde etmek' demektir.", "Benzerliği ipucu olarak kullan, anlamı her zaman Türkçe karşılığıyla doğrula."]}, {"t": "h", "x": "Fiiller ve collocation: kelimeyi kalıbıyla öğren"}, {"t": "p", "x": "Bu paketteki fiiller (essen, trinken, schlafen, arbeiten, kaufen) günlük ama sınavda hep bir kalıp içinde çıkar. İngilizce tarafında bu fiillerin sabit ortaklarını öğrenmek, hem kelime hem cloze sorusunu çözer. 'work' fiili 'work hard', 'work on a project', 'work for a company' kalıplarıyla; 'buy' fiili 'buy something for someone' yapısıyla; 'eat' fiili 'eat breakfast', 'eat out' kalıplarıyla gelir. Almanca tarafında ise bu fiillerin bir kısmı düzensizdir (starke Verben): 'essen' bugünkü hâlde 'er isst', 'schlafen' 'er schläft' olur; kök sesli harfi değişir. Bu değişimi baştan öğrenmek sınavda seni yormaz."}, {"t": "given", "title": "Çözümlü örnek: collocation sorusu", "x": "Cümle: 'I need to ___ some money before the holiday.' Seçenekler: (A) make  (B) do  (C) save  (D) work. Mantık: 'para biriktirmek' anlamı isteniyorsa 'save money' collocationı doğrudur; 'make money' para kazanmaktır, 'do money' diye bir kalıp yoktur. Tatilden önce 'biriktirmek' anlamı bağlamla uyar. Doğru cevap: C. Ders: aynı isim (money) farklı fiillerle farklı anlam kurar; bağlam hangi kalıbı istediğini söyler."}, {"t": "h", "x": "Bu kelimeler cloze ve çeviride nasıl çıkar"}, {"t": "p", "x": "Cloze paragraflarında bu temel kelimeler çoğu zaman 'kolay boşluk' rolündedir; yani paragrafın anlamını kilitleyen çapa kelimelerdir. Onları hızlı doğrularsan zor boşluklara daha çok zaman kalır. Çeviride ise Türkçe kalıpları İngilizceye birebir çevirmemeye dikkat et: 'zaman geçirmek' 'spend time' olur, 'make time' değil; 'para kazanmak' 'make/earn money' olur, 'win money' değil (win sadece kumar/ödül için)."}, {"t": "given", "title": "Çözümlü örnek: çeviri tuzağı", "x": "Türkçe: 'Arkadaşlarımla vakit geçirmeyi seviyorum.' Yanlış çeviri: 'I like to pass time with my friends.' Doğru: 'I enjoy spending time with my friends.' Mantık: 'vakit geçirmek' İngilizcede 'spend time' kalıbıdır; 'pass time' daha çok 'canı sıkılmasın diye oyalanmak' anlamı taşır ve resmî sınavda tercih edilmez. Ayrıca 'like to do' yerine 'enjoy doing' daha doğal ve sınav-güvenlidir. Ders: kalıbı Türkçeden değil İngilizceden düşün."}, {"t": "note", "k": "protokol", "title": "Bu paketi çalışma sırası", "lines": ["1) Tabloyu sesli oku: Almanca artikel + İngilizce collocation + Türkçe.", "2) Cognate çiftlerini eşleştir, sahte dostları (Geld/gold) işaretle.", "3) Fiillerin İngilizce kalıplarını bir cümlede kullan (save money, spend time).", "4) Aşağıdaki alıştırmayı çöz, sonra quizi çöz.", "5) Yanlışları not al, ertesi gün tekrar bak."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'___ money' kalıbında 'biriktirmek' ve 'harcamak' için hangi fiiller gelir?", "a": "Biriktirmek: 'save money'. Harcamak: 'spend money'. Kazanmak: 'make/earn money'. Aynı isim farklı fiillerle farklı anlam kurar; sınav bunu ölçer."}, {"n": 2, "q": "Almanca 'das Geld' hangi İngilizce kelimeye benzer ve bu neden tuzaktır?", "a": "'gold' kelimesine benzer ama anlamı 'para'dır, 'altın' değil. Bu bir sahte dosttur; benzerliği ipucu olarak al, anlamı Türkçe karşılığıyla doğrula."}, {"n": 3, "q": "'die Familie' ve 'die Zeit' neden 'die' artikeli alır, bu bilgi neye yarar?", "a": "İkisi de dişil; '-e' ile biten ve soyut isimlerde 'die' sık görülür. Artikeli doğru bilmek cümledeki sıfat ve zamir çekimlerini doğru yapmanı sağlar."}]}, {"t": "h", "x": "Derinleştirme: günlük fiiller ve zaman"}, {"t": "p", "x": "Günlük hayat fiilleri (essen, trinken, schlafen, arbeiten) sınavda çoğu zaman alışkanlık ve rutin anlatan cümlelerde geçer; bu da onları geniş zaman (present simple) ve sıklık zarflarıyla birlikte getirir. 'always', 'usually', 'often', 'sometimes', 'rarely', 'never' gibi zarflar geniş zamanın en güçlü sinyalidir ve genellikle özneden sonra, ana fiilden önce durur: 'She usually works from home.' Bir cümlede bu zarflardan biri varsa ve başka bir zaman işareti yoksa, fiil geniş zaman ister. Bu bilgi, dilbilgisi ve cloze'daki tense sorularını hızla çözer."}, {"t": "p", "x": "İngilizce geniş zamanda üçüncü tekil şahısta fiile '-s' eklenir (he works, she eats, it sleeps) ve bu, sınavın en sık test ettiği özne-fiil uyumudur. Almanca tarafında da benzer bir çekim vardır ama daha zengindir: 'ich arbeite, du arbeitest, er arbeitet'. İki dili yan yana çalışmak, özne-fiil uyumu refleksini güçlendirir. 'die Zeit' (zaman) ismi ise İngilizcede zaman ifadelerinin merkezindedir: 'on time' (tam vaktinde), 'in time' (son anda yetişerek), 'at the same time' (aynı anda), 'from time to time' (zaman zaman). Bu kalıpların anlamları birbirine yakın göründüğü için sınav tam da bu farkları sorar."}, {"t": "table", "head": ["Kalıp", "Anlam", "Örnek"], "rows": [["on time", "tam vaktinde (gecikmesiz)", "The train left on time."], ["in time", "son anda yetişerek", "We arrived just in time for the film."], ["spend time", "vakit geçirmek", "I spend time with my family."], ["waste time", "vakit harcamak (boşa)", "Don't waste time on details."], ["work hard", "çok çalışmak", "She works hard every day."]]}, {"t": "given", "title": "Çözümlü örnek: sıklık zarfı ve tense", "x": "Cümle: 'My grandfather ___ coffee; he prefers tea.' Seçenekler: (A) never drinks  (B) is never drinking  (C) never drank  (D) has never drink. Mantık: 'prefers' (geniş zaman) genel bir alışkanlık kuruyor; aynı akışta 'asla içmez' de geniş zaman ister. 'never drinks' doğru; 'is drinking' (şimdiki) alışkanlık anlatmaz, 'drank' (geçmiş) bağlamla çelişir, 'has never drink' dilbilgisel hatadır (drunk olmalı). Doğru cevap: A. Ders: alışkanlık + sıklık zarfı = geniş zaman."}, {"t": "note", "k": "ipucu", "title": "Kalıcılaştırma tekniği", "lines": ["Her kelimeyi bir mini cümlede kullan: 'I buy bread every morning.'", "Sıklık zarfını fiile yapıştır: always/usually/never + geniş zaman.", "'time' ve 'money' gibi soyut isimleri kalıplarıyla ezberle: spend/save/waste.", "Almanca ve İngilizce çekimi yan yana söyle: 'er arbeitet / he works'."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'on time' ile 'in time' arasındaki fark nedir?", "a": "'on time' tam vaktinde, gecikmesiz demektir (The bus came on time). 'in time' son anda, bir şeye yetişerek demektir (We got there in time to catch it). Sınav bu ince farkı sorar."}, {"n": 2, "q": "'She ___ (work) in a hospital.' cümlesinde fiil nasıl çekilir ve neden?", "a": "'works'. Üçüncü tekil şahısta (she) geniş zamanda fiile '-s' eklenir. Özne-fiil uyumu sınavın en sık test ettiği noktadır."}, {"n": 3, "q": "Bir cümlede 'usually' zarfı varsa hangi zaman beklenir ve zarf nereye konur?", "a": "Geniş zaman (present simple) beklenir; 'usually' özneden sonra, ana fiilden önce durur: 'He usually eats at home.' Sıklık zarfı geniş zamanın güçlü sinyalidir."}]}, {"t": "h", "x": "Toparlama: bütünleşik cloze"}, {"t": "p", "x": "Şimdi öğrendiklerini bir arada gör. Aşağıdaki kısa cloze paragrafı bu paketin kelimelerini, geniş zaman uyumunu ve collocationları aynı anda test eder. Önce paragrafı boşlukları atlayarak oku, konuyu (bir kişinin günlük rutini) belirle, sonra her boşluğu hem anlam hem yapı açısından çöz. Bu, sınavdaki gerçek cloze deneyimini küçük ölçekte yaşamandır."}, {"t": "given", "title": "Bütünleşik örnek", "x": "Paragraf: 'Anna is a busy person. She (1)___ up early and always (2)___ breakfast before work. She spends (3)___ time with her family in the evenings and tries not to (4)___ money on things she does not need.' Boşluklar ve çözüm: (1) 'gets' (geniş zaman, üçüncü tekil -s; 'wakes/gets up' rutin). (2) 'has' ('have breakfast' collocationı; 'eat breakfast' de olur ama 'have' daha doğaldır). (3) 'time' ('spend time' collocationı). (4) 'waste' ('waste money' = parayı boşa harcamak; bağlam 'ihtiyacı olmayan şeyler' der). Ders: her boşlukta anlam + yapı + collocation birlikte çalışır."}, {"t": "note", "k": "dikkat", "title": "Bu paketin tuzak özeti", "lines": ["Tanıdık kelimeyi collocationsuz bırakmak: spend/save/waste money, spend/waste time.", "Üçüncü tekilde '-s' unutmak: she works, he eats.", "'on time' (gecikmesiz) ile 'in time' (son anda yetişerek) karıştırmak.", "'die Geld' değil 'das Geld'; 'gold' sahte dostuna aldanmamak."]}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "das Haus", "choices": {"A": "time", "B": "family", "C": "money", "D": "house"}, "ans": "D", "why": "das Haus = house (ev).", "slug": "gri-mod-udsp-p1-4-1"}, {"n": 2, "stem": "essen", "choices": {"A": "to drink", "B": "to work", "C": "to sleep", "D": "to eat"}, "ans": "D", "why": "essen = to eat (yemek).", "slug": "gri-mod-udsp-p1-4-2"}, {"n": 3, "stem": "das Geld", "choices": {"A": "time", "B": "friend", "C": "money", "D": "house"}, "ans": "C", "why": "das Geld = money (para).", "slug": "gri-mod-udsp-p1-4-3"}, {"n": 4, "stem": "arbeiten", "choices": {"A": "to buy", "B": "to work", "C": "to sleep", "D": "to eat"}, "ans": "B", "why": "arbeiten = to work (çalışmak).", "slug": "gri-mod-udsp-p1-4-4"}, {"n": 5, "stem": "der Freund", "choices": {"A": "family", "B": "friend", "C": "house", "D": "money"}, "ans": "B", "why": "der Freund = friend (arkadaş).", "slug": "gri-mod-udsp-p1-4-5"}, {"n": 6, "stem": "schlafen", "choices": {"A": "to drink", "B": "to sleep", "C": "to buy", "D": "to work"}, "ans": "B", "why": "schlafen = to sleep (uyumak).", "slug": "gri-mod-udsp-p1-4-6"}]}]}, {"id": "p2", "group": "Kelime Paketleri", "name": "Paket 2. Schule (Okul)", "eyebrow": "P2", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["die Schule", "school", "okul"], ["lernen", "to learn", "öğrenmek"], ["der Lehrer", "teacher", "öğretmen"], ["das Buch", "book", "kitap"], ["schreiben", "to write", "yazmak"], ["lesen", "to read", "okumak"], ["die Prüfung", "exam", "sınav"], ["die Frage", "question", "soru"], ["die Antwort", "answer", "cevap"], ["verstehen", "to understand", "anlamak"]]}, {"t": "h", "x": "Schule: akademik kelime tabanının çekirdeği"}, {"t": "p", "x": "Bu paket (okul, öğrenmek, öğretmen, kitap, yazmak, okumak, sınav, soru, cevap, anlamak) doğrudan sınavın alanıyla örtüşür; çünkü UDSP akademik bir dil sınavıdır ve metinlerin çoğu eğitim, araştırma ve bilgi üretimiyle ilgilidir. 'read', 'write', 'understand', 'learn', 'question', 'answer' kelimeleri hem okuma parçalarının konusunu hem de soru köklerini oluşturur. Örneğin bir okuma sorusu 'Which of the following can be understood from the passage?' diye sorar; burada 'understood' fiilini tanımak, soruyu doğru okumanın ön şartıdır."}, {"t": "p", "x": "Akademik kelimelerin ayırt edici özelliği, resmî (formal) register istemeleridir. Günlük İngilizcede 'find out' dersin, akademik metinde 'discover' ya da 'determine' geçer. Bu pakette de 'learn' yanında 'acquire knowledge', 'read' yanında 'examine a text', 'understand' yanında 'comprehend' gibi daha akademik eşdeğerleri tanımak avantaj sağlar. Restatement ve çeviri sorularında sınav, aynı anlamı daha resmî bir yapıyla kuran seçeneği doğru sayar."}, {"t": "h", "x": "Bu paketin fiilleri: düzenli, düzensiz ve kalıpları"}, {"t": "p", "x": "İngilizce tarafında bu fiillerin collocationları sınavın çekirdeğidir: 'take an exam / sit an exam' (sınava girmek), 'pass an exam' (geçmek), 'fail an exam' (kalmak), 'ask a question' (soru sormak), 'answer a question / give an answer' (cevap vermek), 'read a book', 'write an essay'. Bunları kelimeyle birlikte öğren; çünkü sınav 'exam' kelimesini tek başına değil, 'take/pass/fail' fiillerinden hangisinin bağlama uyduğunu sorar. Almanca tarafında 'lesen' (okumak) ve 'schreiben' (yazmak) düzensizdir: 'lesen' bugünkü hâlde 'er liest' olur (kök sesli değişir); 'verstehen' ise 'ver-' ön ekiyle 'stehen' fiilinden türer ama anlamı 'anlamak'tır, 'ayakta durmak' değil."}, {"t": "table", "head": ["İsim/fiil (İng.)", "Sık collocation", "Türkçe"], "rows": [["exam", "take / pass / fail an exam", "sınava girmek / geçmek / kalmak"], ["question", "ask / raise a question", "soru sormak / gündeme getirmek"], ["answer", "give / provide an answer", "cevap vermek"], ["book", "read / publish a book", "kitap okumak / yayımlamak"], ["knowledge", "acquire / gain knowledge", "bilgi edinmek"]]}, {"t": "note", "k": "dikkat", "title": "Sık karıştırılanlar", "lines": ["'learn' (öğrenmek, edinmek) ile 'teach' (öğretmek) zıttır; özneyi kontrol et: teacher teaches, student learns.", "'study' bir süreçtir (ders çalışmak), 'learn' sonuçtur (öğrenmek); 'I studied but didn't learn much' ikisini ayırır.", "Almanca 'die Prüfung' = sınav; 'proof' (kanıt) ile karıştırma, benzer kökten gelseler de anlam farklıdır."]}, {"t": "h", "x": "Cloze ve okuma sorularında bu kelimeler"}, {"t": "p", "x": "Akademik cloze paragraflarında bu kelimeler hem boşluk hem de bağlam çapası olur. 'understand / comprehend' gibi fiiller genellikle bir sonuç cümlesinde geçer; 'because', 'so that', 'in order to' gibi bağlaçlarla birlikte çıkar. Örneğin 'Students reread the text ___ they could understand the argument.' boşluğunda amaç ilişkisi vardır ve 'so that' gelir. Kelimeyi tanımak, boşluğun etrafındaki mantığı okumanı hızlandırır."}, {"t": "given", "title": "Çözümlü örnek: exam collocation", "x": "Cümle: 'She studied hard and managed to ___ the exam with a high score.' Seçenekler: (A) make  (B) pass  (C) take  (D) win. Mantık: yüksek puanla 'geçmek' anlamı isteniyor; 'pass an exam' bunu karşılar. 'take an exam' sadece sınava girmektir (sonuç belirtmez), 'win' sınav için kullanılmaz, 'make the exam' yanlış kalıptır. Bağlam ('high score', 'managed to') başarı der. Doğru cevap: B."}, {"t": "given", "title": "Çözümlü örnek: restatement", "x": "Cümle: 'The students could not understand the lecture because it was too fast.' En yakın anlam: 'The speed of the lecture prevented the students from understanding it.' Mantık: sebep-sonuç aynı; 'because it was too fast' bilgisi 'the speed ... prevented' yapısına dönüşmüş, anlam korunmuş. Tuzak seçenek genelde 'the students understood the fast lecture' gibi anlamı tersine çeviren cümledir. Ders: restatement'te anlamı değil yapıyı değiştir."}, {"t": "note", "k": "protokol", "title": "Bu paketi çalışma sırası", "lines": ["1) Fiil-isim collocationlarını sesli kur: take an exam, ask a question, read a book.", "2) Akademik eşdeğerleri not al: understand-comprehend, find out-discover.", "3) 'learn' ve 'teach', 'study' ve 'learn' farkını bir örnek cümleyle sabitle.", "4) Aşağıdaki alıştırmayı çöz, sonra quizi çöz."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'exam' kelimesi hangi üç fiille sık kullanılır ve her biri ne anlatır?", "a": "'take/sit an exam' (girmek), 'pass an exam' (geçmek), 'fail an exam' (kalmak). Sınav bağlamdan hangisinin gerektiğini sorar; sonuç mu süreç mi olduğuna bak."}, {"n": 2, "q": "'The lecture was so fast that nobody could follow it.' cümlesinin restatement'i nasıl kurulur?", "a": "'Nobody could follow the lecture because of its speed.' ya da 'The speed of the lecture prevented everyone from following it.' Anlam korunur, yapı değişir; anlamı tersine çeviren seçenek tuzaktır."}, {"n": 3, "q": "'study' ile 'learn' arasındaki fark nedir?", "a": "'study' süreçtir (ders çalışmak, incelemek), 'learn' sonuçtur (öğrenmek, edinmek). 'I studied all night but didn't learn much' cümlesi farkı net gösterir."}]}, {"t": "h", "x": "Derinleştirme: akademik yapılar (pasif ve ilgi cümleleri)"}, {"t": "p", "x": "Akademik metinlerin dili günlük konuşmadan yapı olarak da ayrılır. En belirgin fark edilgen (passive) çatının sıklığıdır: kim yaptığı değil, ne yapıldığı önemli olduğunda pasif kullanılır. 'They wrote the book in 1990' yerine akademik metin 'The book was written in 1990' der. Bu paketin fiilleri (write, read, teach, understand) sınavda sık sık pasif hâlde çıkar: 'The exam was taken by 500 students', 'The topic is well understood'. Pasif yapı 'be + fiilin üçüncü hâli (past participle)' ile kurulur; sınav bu üçüncü hâlleri (write-written, read-read, teach-taught) doğrudan sorar. Bu yüzden düzensiz fiillerin üç hâlini birlikte öğrenmelisin."}, {"t": "p", "x": "İkinci önemli yapı ilgi cümleleridir (relative clauses): bir ismi 'who', 'which', 'that', 'whose' ile tanımlayan yan cümleler. İnsanlar için 'who' (the teacher who helped me), nesneler için 'which' (the book which I read), sahiplik için 'whose' (the student whose exam was lost) kullanılır. Akademik cümleler bilgiyi bu yan cümlelerle katmanlar; okuma parçalarında uzun cümlelerin belkemiği bunlardır. İlgi zamirini doğru seçmek hem dilbilgisi hem cloze sorusudur."}, {"t": "table", "head": ["Fiil (İng.)", "İkinci hâl (past)", "Üçüncü hâl (participle)"], "rows": [["write", "wrote", "written"], ["read", "read (okunuş: red)", "read"], ["teach", "taught", "taught"], ["understand", "understood", "understood"], ["learn", "learned/learnt", "learned/learnt"]]}, {"t": "given", "title": "Çözümlü örnek: pasif yapı", "x": "Cümle: 'The novel ___ by a young author who later became famous.' Seçenekler: (A) wrote  (B) was written  (C) has wrote  (D) writing. Mantık: özne 'the novel' eylemi yapan değil, eyleme maruz kalan; yani pasif gerekir: 'was written'. 'by a young author' (fail belirteci) pasifin güçlü işaretidir. 'wrote' aktiftir, 'has wrote' hatalı (written olmalı). Doğru cevap: B. Ders: 'by + kişi' gördüğünde pasifi düşün ve üçüncü hâli kullan."}, {"t": "given", "title": "Çözümlü örnek: ilgi zamiri", "x": "Cümle: 'The professor ___ lectures I attended has published three books.' Seçenekler: (A) which  (B) who  (C) whose  (D) that. Mantık: 'professor' + 'lectures' arasında sahiplik var (profesörün dersleri); sahiplik için 'whose' kullanılır: 'the professor whose lectures I attended'. 'who' özne, 'which' nesne içindir, sahiplik anlatmaz. Doğru cevap: C. Ders: iki isim arasında sahiplik varsa 'whose'."}, {"t": "note", "k": "ipucu", "title": "Kalıcılaştırma tekniği", "lines": ["Düzensiz fiilleri üç hâliyle ezberle: write-wrote-written.", "'by + kişi' gördüğünde pasif yapıyı düşün.", "İlgi zamiri seç: insan-who, nesne-which/that, sahiplik-whose.", "Akademik eşdeğerleri çift olarak not al: understand-comprehend, find out-determine."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'The results ___ (publish) last week.' cümlesini akademik biçimde nasıl tamamlarsın?", "a": "'were published'. Sonuçlar yayımlanan taraf olduğu için pasif gerekir: be + past participle. Akademik metinler eyleme maruz kalan özneyle sık sık pasif kurar."}, {"n": 2, "q": "'the student ___ book was lost' boşluğuna hangi ilgi zamiri gelir?", "a": "'whose'. Öğrenci ile kitap arasında sahiplik var (öğrencinin kitabı). Sahiplik için 'whose'; 'who' özne, 'which' nesne içindir."}, {"n": 3, "q": "'read' fiilinin üç hâli nedir, tuzağı nerede?", "a": "read-read-read; yazılışı aynı ama okunuşu değişir (present: riyd, past/participle: red). Sınav yazılışa bakarak tense'i gizler; cümledeki zaman işaretine güven."}]}, {"t": "h", "x": "Toparlama: bütünleşik cloze"}, {"t": "p", "x": "Öğrendiklerini bir arada gör. Aşağıdaki akademik tonlu kısa paragraf bu paketin kelimelerini, pasif yapıyı ve ilgi cümlelerini birlikte test eder. Paragrafı önce bütün olarak oku, konuyu (bir kitabın ve yazarının anlatımı) belirle, sonra boşlukları çöz. Akademik metinlerde pasif ve ilgi cümlelerinin ne kadar sık geçtiğini burada göreceksin."}, {"t": "given", "title": "Bütünleşik örnek", "x": "Paragraf: 'The book, which (1)___ by a well-known scholar, is used in many universities. Students who (2)___ it carefully often (3)___ the topic better and pass the final exam. The questions at the end help them (4)___ what they have learned.' Çözüm: (1) 'was written' (pasif; 'by a scholar' fail işareti). (2) 'read' (geniş zaman, çoğul özne 'students'). (3) 'understand' (geniş zaman, alışkanlık; 'often' sinyali). (4) 'review / revise' ya da 'test' (öğrendiklerini gözden geçirmek/sınamak; bağlam 'end questions' der). Ders: akademik cloze pasif + ilgi cümlesi + geniş zamanı bir arada sorar."}, {"t": "note", "k": "dikkat", "title": "Bu paketin tuzak özeti", "lines": ["'by + kişi' varsa pasif yapıyı düşün: was written, was taught.", "İlgi zamirini şaşırmak: insan-who, nesne-which, sahiplik-whose.", "'study' (süreç) ile 'learn' (sonuç), 'teach' (öğretmek) ile 'learn' (öğrenmek) karışımı.", "'read' fiilinde yazılış aynı; tense'i cümledeki zaman işaretinden oku."]}, {"t": "note", "k": "protokol", "title": "Akademik cümleyi çözme sırası", "lines": ["1) Cümlenin öznesi eylemi yapıyor mu yoksa eyleme maruz mu kalıyor? Maruz kalıyorsa pasifi düşün.", "2) Bir isimden sonra 'who/which/that/whose' varsa, o yan cümle ismi tanımlar; ana fiili bu yan cümleyle karıştırma.", "3) Zaman işaretini bul (already, since, last week); tense'i ona göre kilitle.", "4) Bilmediğin akademik kelimeyi kökünden çöz (comprehension < comprehend; development < develop)."]}, {"t": "p", "x": "Bu paket sınavın akademik omurgasına en yakın olan pakettir: 'read', 'write', 'understand', 'question', 'answer' kelimeleri hem okuma parçalarının içinde hem de soru köklerinde sürekli karşına çıkar. Bu yüzden bu paketi ezberden çıkarıp refleks hâline getirmek, sınavın sadece kelime bölümünü değil, en çok puan taşıyan okuma bölümünü de doğrudan güçlendirir. Kısaca: bu kelimeleri gördüğünde bir daha 'ne demekti' diye durmamalısın; o an paragrafın mantığını takip etmeye, cümlenin pasif mi aktif mi olduğunu ve hangi zaman diliminde ilerlediğini görmeye ayrılmalıdır. Kelime tanıma hızın arttıkça, aynı süre içinde daha çok soru okuyup daha isabetli seçim yaparsın."}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "die Schule", "choices": {"A": "school", "B": "book", "C": "teacher", "D": "exam"}, "ans": "A", "why": "die Schule = school (okul).", "slug": "gri-mod-udsp-p2-4-1"}, {"n": 2, "stem": "schreiben", "choices": {"A": "to write", "B": "to learn", "C": "to read", "D": "to understand"}, "ans": "A", "why": "schreiben = to write (yazmak).", "slug": "gri-mod-udsp-p2-4-2"}, {"n": 3, "stem": "die Prüfung", "choices": {"A": "exam", "B": "answer", "C": "book", "D": "question"}, "ans": "A", "why": "die Prüfung = exam (sınav).", "slug": "gri-mod-udsp-p2-4-3"}, {"n": 4, "stem": "der Lehrer", "choices": {"A": "school", "B": "teacher", "C": "book", "D": "answer"}, "ans": "B", "why": "der Lehrer = teacher (öğretmen).", "slug": "gri-mod-udsp-p2-4-4"}, {"n": 5, "stem": "verstehen", "choices": {"A": "to write", "B": "to read", "C": "to understand", "D": "to learn"}, "ans": "C", "why": "verstehen = to understand (anlamak).", "slug": "gri-mod-udsp-p2-4-5"}, {"n": 6, "stem": "die Antwort", "choices": {"A": "question", "B": "school", "C": "exam", "D": "answer"}, "ans": "D", "why": "die Antwort = answer (cevap).", "slug": "gri-mod-udsp-p2-4-6"}]}]}, {"id": "p3", "group": "Kelime Paketleri", "name": "Paket 3. Reisen (Seyahat)", "eyebrow": "P3", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["reisen", "to travel", "seyahat etmek"], ["der Zug", "train", "tren"], ["das Flugzeug", "plane", "uçak"], ["die Stadt", "city", "şehir"], ["das Land", "country", "ülke"], ["die Fahrkarte", "ticket", "bilet"], ["fahren", "to go/drive", "gitmek, sürmek"], ["ankommen", "to arrive", "varmak"], ["der Weg", "way", "yol"], ["die Reise", "journey", "yolculuk"]]}, {"t": "h", "x": "Reisen: hareket fiilleri ve edatlar"}, {"t": "p", "x": "Bu paket (seyahat etmek, tren, uçak, şehir, ülke, bilet, gitmek, varmak, yol, yolculuk) sınavda çoğunlukla edat (preposition) sorularının merkezinde durur. Çünkü hareket ve yer bildiren kelimeler İngilizcede sabit edatlarla gelir: 'travel to a city', 'arrive at a station / arrive in a country', 'go by train', 'on the way'. Dilbilgisi bölümünde ve cloze'da en sık kaybedilen puanlardan biri edat sorularıdır; bu paketi doğru çalışmak o soruları doğrudan kazandırır."}, {"t": "p", "x": "Türkçede tek bir 'e/a' hâli (-e gitmek) İngilizcede birden çok edata dağılır ve bu, en sık hata kaynağıdır. 'şehre varmak' 'arrive in the city', 'istasyona varmak' 'arrive at the station' olur; küçük noktalar (istasyon) için 'at', büyük alanlar (şehir, ülke) için 'in' kullanılır. 'gitmek' 'go to' ister ama 'home' istisnadır: 'go home' (edatsız). Bu ince farkları kelimeyle birlikte öğrenmek, sınavda düşünmeden doğru edatı seçmeni sağlar."}, {"t": "table", "head": ["İngilizce fiil/isim", "Doğru edat kalıbı", "Türkçe"], "rows": [["arrive", "arrive at (nokta) / arrive in (şehir, ülke)", "varmak"], ["travel", "travel to / travel by (train, plane)", "seyahat etmek / ile"], ["go", "go to (yer) / go home (edatsız)", "gitmek"], ["way", "on the way / in the way", "yolda / yolu tıkayan"], ["ticket", "a ticket to / a ticket for", "-e bileti"]]}, {"t": "note", "k": "dikkat", "title": "Edat tuzakları", "lines": ["'arrive to' YANLIŞTIR; doğru: 'arrive at' (nokta) veya 'arrive in' (şehir/ülke).", "'go to home' YANLIŞTIR; doğru: 'go home' (edatsız).", "'by train / by plane / by car' araç için 'by' alır ama 'on foot' (yürüyerek) istisnadır.", "'get on/off' toplu taşıma için (get on the bus), 'get in/out of' araba için (get in the car)."]}, {"t": "h", "x": "Almanca ayrılabilen fiiller: 'ankommen' örneği"}, {"t": "p", "x": "Almanca 'ankommen' (varmak) ayrılabilen bir fiildir (trennbares Verb): cümlede 'an' ön eki ayrılıp sona gider. 'Der Zug kommt um acht Uhr an.' (Tren saat sekizde varır.) Bu yapı İngilizce phrasal verb mantığına benzer: 'come' + 'an' gibi 'take off', 'get on' de fiil + parça yapısıdır. Bu benzerliği görmek, iki dilin de mantığını aynı anda kavramanı sağlar. 'fahren' (gitmek, sürmek) ise düzensizdir: 'er fährt' olur, kök sesli değişir."}, {"t": "given", "title": "Çözümlü örnek: edat sorusu", "x": "Cümle: 'The train will arrive ___ the central station at noon.' Seçenekler: (A) to  (B) in  (C) at  (D) on. Mantık: 'arrive' belirli bir nokta (istasyon) için 'at' alır; 'arrive to' hiçbir zaman doğru değildir, 'arrive in' ise şehir/ülke gibi geniş alanlar içindir. İstasyon bir noktadır. Doğru cevap: C. Ders: 'arrive' fiilini edatıyla ezberle: at (nokta), in (alan)."}, {"t": "h", "x": "Cloze ve çeviride hareket kelimeleri"}, {"t": "p", "x": "Seyahat temalı cloze paragraflarında hem edat hem de bağlaç boşlukları çıkar. Bir yolculuğun aşamaları anlatılırken 'first', 'then', 'finally', 'meanwhile' gibi sıralama bağlaçları; bir gecikme anlatılırken 'because of', 'due to', 'as a result' gibi sebep-sonuç bağlaçları görürsün. Çeviride ise Türkçe 'ile' edatını İngilizceye hep 'with' diye çevirme tuzağına düşme: 'trenle gitmek' 'go by train' olur, 'go with train' değil."}, {"t": "given", "title": "Çözümlü örnek: çeviri tuzağı", "x": "Türkçe: 'Şehir merkezine otobüsle gittik.' Yanlış: 'We went to the city center with bus.' Doğru: 'We went to the city center by bus.' Mantık: ulaşım aracı için 'by + araç' (edatsız, artikelsiz) kalıbı kullanılır: by bus, by train, by car. 'with' aracı değil beraberliği anlatır (with my friend). Ders: 'ile' her zaman 'with' değildir; ulaşımda 'by'."}, {"t": "note", "k": "protokol", "title": "Bu paketi çalışma sırası", "lines": ["1) 'arrive at/in', 'go to', 'travel by' kalıplarını sesli tekrar et.", "2) Edat tablosunu bir cümlede kullan: 'I arrived at the airport by taxi.'", "3) Almanca 'ankommen'in ayrılabilen yapısını bir örnekle sabitle.", "4) Aşağıdaki alıştırmayı çöz, sonra quizi çöz."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'arrive' fiili istasyon ve ülke için hangi edatları alır?", "a": "Nokta (istasyon, havaalanı): 'arrive at'. Geniş alan (şehir, ülke): 'arrive in'. 'arrive to' asla doğru değildir."}, {"n": 2, "q": "'trenle seyahat etmek' İngilizcede nasıl kurulur, neden 'with' değil?", "a": "'travel by train'. Ulaşım aracı için 'by + araç' (edatsız/artikelsiz) kullanılır; 'with' beraberliği anlatır, aracı değil."}, {"n": 3, "q": "Almanca 'ankommen' fiili cümlede nasıl davranır, hangi İngilizce yapıya benzer?", "a": "Ayrılabilen fiildir; 'an' ön eki sona gider: 'Der Zug kommt an.' İngilizce phrasal verb'lere (take off, get on) benzer: fiil + parça."}]}, {"t": "h", "x": "Derinleştirme: hareket phrasal verb'leri ve karşılaştırma"}, {"t": "p", "x": "Seyahat teması, sınavın 6 soruluk phrasal verb bölümünü besleyen en verimli alandır. Yolculukla ilgili phrasal verb'ler bir yolculuğun aşamalarını anlatır: 'set off / set out' (yola çıkmak), 'check in' (giriş yapmak), 'take off' (kalkmak, uçak), 'get on / get off' (binmek / inmek, toplu taşıma), 'get in / get out of' (binmek / inmek, araba), 'pick someone up' (birini almak, arabayla), 'drop someone off' (birini bırakmak). Bu fiilleri tek tek anlamıyla ezberle; çünkü sınav 'get on the bus' ile 'get in the car' arasındaki farkı doğrudan sorar. Kural: içine girip ayakta durabildiğin büyük araçlar (bus, train, plane) 'on/off' alır; içine eğilip oturduğun küçük araçlar (car, taxi) 'in/out of' alır."}, {"t": "p", "x": "İkinci güçlü yapı karşılaştırmadır (comparatives ve superlatives): seyahat cümleleri sürekli hız, mesafe ve süre karşılaştırır. Kısa sıfatlara '-er/-est' eklenir (fast-faster-the fastest), uzun sıfatlarda 'more/the most' kullanılır (expensive-more expensive-the most expensive). Karşılaştırmada 'than' (The plane is faster than the train), üstünlükte 'the ... in/of' (the fastest way to travel) yapısı gelir. Ayrıca gelecek planları için iki yapı vardır: kesin plan ve program için 'be going to' ya da present continuous (I am flying to Berlin tomorrow), anlık karar ve tahmin için 'will'. Seyahat programları genellikle 'going to' ve present continuous ister."}, {"t": "table", "head": ["Phrasal verb", "Anlam", "Araç/kullanım"], "rows": [["get on / off", "binmek / inmek", "bus, train, plane (büyük araç)"], ["get in / out of", "binmek / inmek", "car, taxi (küçük araç)"], ["set off / out", "yola çıkmak", "yolculuğun başlangıcı"], ["check in", "giriş yapmak", "havaalanı, otel"], ["take off", "kalkmak", "uçak (zıttı: land)"]]}, {"t": "given", "title": "Çözümlü örnek: phrasal verb", "x": "Cümle: 'We had to ___ the train at the last station and take a bus.' Seçenekler: (A) get off  (B) get out of  (C) take off  (D) set off. Mantık: trenden 'inmek' anlamı isteniyor; tren büyük bir araç olduğu için 'get off' doğrudur. 'get out of' araba/taksi içindir, 'take off' uçak kalkışıdır, 'set off' yola çıkmaktır. Doğru cevap: A. Ders: araç büyükse on/off, küçükse in/out of."}, {"t": "given", "title": "Çözümlü örnek: karşılaştırma", "x": "Cümle: 'Travelling by plane is much ___ than travelling by train, but it is more expensive.' Seçenekler: (A) fast  (B) faster  (C) fastest  (D) the fastest. Mantık: 'than' kelimesi karşılaştırma (comparative) ister; 'fast' kısa sıfat olduğu için '-er' alır: 'faster'. 'much' comparative'i güçlendirir (çok daha hızlı). 'fastest' üstünlük içindir ve 'the' ister. Doğru cevap: B. Ders: 'than' gördüğünde comparative kullan."}, {"t": "note", "k": "ipucu", "title": "Kalıcılaştırma tekniği", "lines": ["Phrasal verb'leri araçla eşleştir: get on the bus, get in the car.", "'than' comparative'in, 'the ...-est' superlative'in işaretidir.", "Seyahat planları için 'going to' ve present continuous kullan.", "Bir yolculuğu aşamalarıyla anlat: set off, check in, take off, arrive."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'get on' ve 'get in' arasındaki fark nedir?", "a": "Büyük, içinde ayakta durulan araçlar (bus, train, plane) 'get on/off' alır; küçük, eğilip binilen araçlar (car, taxi) 'get in / get out of' alır. Sınav tam bu ayrımı sorar."}, {"n": 2, "q": "'This road is ___ (dangerous) than the old one.' cümlesini nasıl tamamlarsın?", "a": "'more dangerous'. 'dangerous' uzun bir sıfat olduğu için '-er' değil 'more' alır; 'than' comparative işaretidir. Kısa sıfatlar '-er', uzun sıfatlar 'more' kullanır."}, {"n": 3, "q": "Yarınki uçuşunu anlatırken hangi gelecek yapısı daha doğaldır?", "a": "Program/plan için 'be going to' ya da present continuous: 'I am flying to Berlin tomorrow.' 'will' daha çok anlık karar ve tahmin içindir; planlanmış seyahatte tercih edilmez."}]}, {"t": "h", "x": "Toparlama: bütünleşik cloze"}, {"t": "p", "x": "Öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf bu paketin kelimelerini, hareket edatlarını ve phrasal verb'leri birlikte test eder. Paragrafı önce bütün olarak oku, konuyu (bir yolculuk planı) belirle, sonra boşlukları çöz. Seyahat paragraflarının edat ve phrasal verb açısından ne kadar yoğun olduğunu göreceksin."}, {"t": "given", "title": "Bütünleşik örnek", "x": "Paragraf: 'We are travelling (1)___ train to Munich next week. We will set (2)___ early in the morning and hope to arrive (3)___ the city before noon. It is (4)___ than flying, but the journey itself is more enjoyable.' Çözüm: (1) 'by' ('travel by train'; araç için by). (2) 'off / out' ('set off' = yola çıkmak). (3) 'in' ('arrive in' + şehir; nokta olsaydı 'at' olurdu). (4) 'cheaper / slower' (comparative; 'than' işareti). Ders: seyahat cloze'u edat + phrasal verb + comparative'i bir arada sorar."}, {"t": "note", "k": "dikkat", "title": "Bu paketin tuzak özeti", "lines": ["'arrive to' YANLIŞ; nokta için 'at', şehir/ülke için 'in'.", "Araç için 'by train/car' (edatsız); 'with' değil.", "'get on/off' büyük araç, 'get in/out of' küçük araç.", "'than' varsa comparative; 'the ...-est' superlative ister."]}, {"t": "note", "k": "protokol", "title": "Hareket cümlesini çözme sırası", "lines": ["1) Fiil bir yer değiştirme mi anlatıyor? Öyleyse doğru edatı hedefine göre seç (arrive at/in, go to).", "2) Bir araç adı varsa 'by + araç' (edatsız) kalıbını hatırla; binme/inme için on/off ya da in/out of.", "3) 'than' ya da 'the ...-est' gördüğünde karşılaştırma/üstünlük yapısına geç.", "4) Plan mı anlık karar mı? Plan için 'going to' / present continuous, anlık karar için 'will'."]}, {"t": "p", "x": "Seyahat teması sınavda edat ve phrasal verb sorularının en yoğun çıktığı alandır; bu iki soru tipi de ezberden çok kalıp bilgisi ister. Kelimeyi hep edatıyla ve phrasal verb'ü hep aracıyla öğrenirsen, bu sorularda düşünmeden doğru seçeneğe gidersin ve kazandığın zamanı okuma parçalarına aktarırsın. Unutma: edat ve phrasal verb soruları mantıkla çözülmez, kalıp bilgisiyle çözülür; bu yüzden burada ezber değil, doğru kalıbı çok kez tekrar ederek oturtmak esastır. Her yeni fiili bir örnek cümle içinde, edatıyla birlikte söylemek en hızlı yoldur."}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "das Flugzeug", "choices": {"A": "train", "B": "city", "C": "plane", "D": "country"}, "ans": "C", "why": "das Flugzeug = plane (uçak).", "slug": "gri-mod-udsp-p3-4-1"}, {"n": 2, "stem": "die Stadt", "choices": {"A": "country", "B": "city", "C": "way", "D": "ticket"}, "ans": "B", "why": "die Stadt = city (şehir).", "slug": "gri-mod-udsp-p3-4-2"}, {"n": 3, "stem": "ankommen", "choices": {"A": "to arrive", "B": "to travel", "C": "to go", "D": "to drive"}, "ans": "A", "why": "ankommen = to arrive (varmak).", "slug": "gri-mod-udsp-p3-4-3"}, {"n": 4, "stem": "die Fahrkarte", "choices": {"A": "way", "B": "train", "C": "journey", "D": "ticket"}, "ans": "D", "why": "die Fahrkarte = ticket (bilet).", "slug": "gri-mod-udsp-p3-4-4"}, {"n": 5, "stem": "der Zug", "choices": {"A": "train", "B": "city", "C": "plane", "D": "country"}, "ans": "A", "why": "der Zug = train (tren).", "slug": "gri-mod-udsp-p3-4-5"}, {"n": 6, "stem": "reisen", "choices": {"A": "to arrive", "B": "to go", "C": "to travel", "D": "to read"}, "ans": "C", "why": "reisen = to travel (seyahat etmek).", "slug": "gri-mod-udsp-p3-4-6"}]}]}, {"id": "p4", "group": "Kelime Paketleri", "name": "Paket 4. Essen und Trinken", "eyebrow": "P4", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["das Brot", "bread", "ekmek"], ["der Apfel", "apple", "elma"], ["das Wasser", "water", "su"], ["die Milch", "milk", "süt"], ["der Käse", "cheese", "peynir"], ["das Fleisch", "meat", "et"], ["das Gemüse", "vegetable", "sebze"], ["der Zucker", "sugar", "şeker"], ["kochen", "to cook", "pişirmek"], ["das Frühstück", "breakfast", "kahvaltı"]]}, {"t": "h", "x": "Essen und Trinken: sayılabilen ve sayılamayan isimler"}, {"t": "p", "x": "Bu paket (ekmek, elma, su, süt, peynir, et, sebze, şeker, pişirmek, kahvaltı) sınavdaki en önemli gramer konularından birine, sayılabilen (countable) ve sayılamayan (uncountable) isimlere doğrudan kapı açar. Yiyecek ve içecekler bu ayrımın en klasik örnekleridir ve dilbilgisi bölümünde 'much/many', 'some/any', 'a few/a little', 'a piece of' gibi yapıların doğru seçilmesi bu ayrıma bağlıdır. Kelimeyi öğrenirken 'sayılabilir mi' sorusunu da öğrenmek, seni bu soru tipinde otomatik doğruya götürür."}, {"t": "p", "x": "Kural şudur: sayılabilen isimler çoğul olabilir ve 'many', 'a few', 'a/an' alır (an apple, many apples, a few apples). Sayılamayan isimler çoğul olmaz ve 'much', 'a little', 'some' alır (much water, a little milk, some bread). Miktar belirtmek için sayılamayanlarda 'a piece of', 'a glass of', 'a slice of' gibi kaplar kullanılır: 'a slice of bread', 'a glass of water', 'a piece of cheese'. Bu kap yapıları çeviri ve kelime sorularında sık çıkar."}, {"t": "table", "head": ["İsim (İng.)", "Tür", "Miktar yapısı"], "rows": [["apple", "sayılabilen", "an apple / many apples / a few apples"], ["water", "sayılamayan", "much water / a little water / a glass of water"], ["bread", "sayılamayan", "some bread / a slice of bread"], ["cheese", "sayılamayan", "a piece of cheese / much cheese"], ["vegetable(s)", "sayılabilen", "many vegetables / a few vegetables"]]}, {"t": "note", "k": "dikkat", "title": "Countable / uncountable tuzakları", "lines": ["'water', 'milk', 'bread', 'cheese', 'meat', 'sugar' sayılamazdır: 'many waters' YANLIŞ, 'much water' doğru.", "'a bread' değil 'a loaf/slice of bread'; 'a water' değil 'a glass of water'.", "'vegetable' sayılabilir (a vegetable, vegetables); ama 'fruit' genelde sayılamaz (much fruit).", "'information', 'advice', 'news' de sayılamazdır; bu mantığı yiyeceklerden öğrenip genelle."]}, {"t": "h", "x": "Collocation ve öğün kalıpları"}, {"t": "p", "x": "Öğün isimleri İngilizcede özel bir kalıp ister: 'have breakfast / have lunch / have dinner' (edatsız, artikelsiz). 'make breakfast' (kahvaltı hazırlamak) ile 'have breakfast' (kahvaltı etmek) farklıdır; bağlam hangisini istediğini söyler. 'cook' fiili 'cook a meal', 'cook dinner' kalıplarıyla; 'kahvaltıda' derken 'at breakfast', 'kahvaltı için' derken 'for breakfast' kullanılır. Bu kalıpları öğünle birlikte öğren."}, {"t": "given", "title": "Çözümlü örnek: much/many sorusu", "x": "Cümle: 'There isn't ___ milk left in the fridge.' Seçenekler: (A) many  (B) much  (C) few  (D) a number of. Mantık: 'milk' sayılamayan bir isimdir; olumsuz cümlede sayılamayan için 'much' gelir. 'many', 'few', 'a number of' sadece sayılabilen çoğul isimlerle kullanılır. Doğru cevap: B. Ders: önce ismin sayılabilir mi olduğuna karar ver, miktar kelimesi ondan sonra gelir."}, {"t": "h", "x": "Almanca birleşik isimler ve cognate'ler"}, {"t": "p", "x": "Almanca uzun kelimeleri parçalayarak okumak korkuyu azaltır. 'das Frühstück' iki parçadan oluşur: 'früh' (erken) + 'Stück' (parça) = erken parça, yani kahvaltı. Almanca sık sık böyle birleşik isimler (Komposita) kurar; parçaları tanırsan anlamı çıkarırsın. Bu pakette de cognate köprüleri var: 'das Wasser / water', 'die Milch / milk', 'das Brot / bread (uzak akraba)'. Benzerlik iki dilin kelimesini birden hafızaya kazır; ama 'der Käse' (peynir) İngilizce 'case' değildir, sahte dost riskine dikkat et."}, {"t": "given", "title": "Çözümlü örnek: kap yapısı çeviri", "x": "Türkçe: 'Bir bardak su ve iki dilim ekmek aldı.' Yanlış: 'She took a water and two breads.' Doğru: 'She had a glass of water and two slices of bread.' Mantık: 'water' ve 'bread' sayılamaz; miktar için kap yapısı gerekir: 'a glass of water', 'a slice of bread'. 'a water' ve 'two breads' dilbilgisel hatadır. Ayrıca yiyecek/içecek 'almak' anlamında 'have' daha doğaldır. Ders: sayılamayan ismi kapla say."}, {"t": "note", "k": "protokol", "title": "Bu paketi çalışma sırası", "lines": ["1) Her ismi 'sayılabilir mi' etiketiyle oku: apple sayılabilir, water sayılamaz.", "2) Kap yapılarını sesli kur: a glass of water, a slice of bread, a piece of cheese.", "3) 'have/make breakfast' farkını bir cümleyle sabitle.", "4) Aşağıdaki alıştırmayı çöz, sonra quizi çöz."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'water' ile 'apple' için hangi miktar kelimeleri kullanılır ve neden farklı?", "a": "'water' sayılamaz: much water, a little water, a glass of water. 'apple' sayılabilir: many apples, a few apples, an apple. Önce sayılabilirliğe karar ver, miktar kelimesi ona bağlıdır."}, {"n": 2, "q": "'a bread' neden yanlıştır, doğrusu nasıl kurulur?", "a": "'bread' sayılamayan bir isimdir; 'a' alamaz. Miktar için kap: 'a slice of bread', 'a loaf of bread'. Aynı mantık water (a glass of), cheese (a piece of) için de geçerlidir."}, {"n": 3, "q": "Almanca 'das Frühstück' kelimesini parçalayınca ne çıkar, bu strateji neye yarar?", "a": "'früh' (erken) + 'Stück' (parça) = kahvaltı. Almanca birleşik isimleri parçalara ayırmak, uzun ve tanımadık kelimelerin anlamını çıkarmanı sağlar."}]}, {"t": "h", "x": "Derinleştirme: artikeller ve miktar sözcükleri"}, {"t": "p", "x": "Sayılabilen/sayılamayan ayrımını öğrendikten sonra sıra artikellere (a/an/the) ve daha geniş miktar sözcüklerine gelir; bunlar dilbilgisi bölümünün sabit müşterileridir. Belirsiz artikel 'a/an' yalnızca sayılabilen tekil isimle kullanılır (an apple, a book) ve sesli harfle başlayan seslerde 'an' olur (an apple, an hour). Belirli artikel 'the' hem sayılabilen hem sayılamayanla, belirli/bilinen bir şeyden söz edildiğinde kullanılır (the water in this glass). Genel bir gerçekten söz ederken sayılamayan ve çoğul isimler artikelsiz (zero article) gelir: 'Water is essential for life', 'Apples are healthy'. Bu 'artikelsiz genel kullanım' sınavda çok sık test edilir."}, {"t": "p", "x": "Miktar sözcüklerinde ise hem sayılabilen hem sayılamayanla kullanılan esnek kalıplar vardır ve bunlar puan kurtarır: 'a lot of', 'plenty of', 'enough', 'some', 'any' hem 'apples' hem 'water' ile çalışır. Buna karşılık 'many' ve 'a few' yalnızca sayılabilen, 'much' ve 'a little' yalnızca sayılamayanla gelir. 'some' olumlu cümlede, 'any' olumsuz ve soru cümlelerinde tercih edilir: 'I have some bread' / 'I don't have any bread' / 'Do you have any bread?'. Ayrıca 'there is' tekil ve sayılamayanla ('There is some milk'), 'there are' çoğulla ('There are some apples') kullanılır; özne-yüklem uyumu burada da ölçülür."}, {"t": "table", "head": ["Miktar sözcüğü", "Kullanım", "Örnek"], "rows": [["many / a few", "sadece sayılabilen", "many apples, a few eggs"], ["much / a little", "sadece sayılamayan", "much water, a little sugar"], ["a lot of / plenty of", "her ikisi", "a lot of apples, a lot of water"], ["some / any", "her ikisi (some olumlu, any olumsuz/soru)", "some bread / any bread"], ["there is / there are", "is: tekil-sayılamayan, are: çoğul", "There is milk / There are apples"]]}, {"t": "given", "title": "Çözümlü örnek: artikel", "x": "Cümle: '___ is important for a healthy diet, so eat it every day.' Seçenekler: (A) A fruit  (B) The fruit  (C) Fruit  (D) An fruit. Mantık: genel bir gerçekten söz ediliyor (meyve, genel olarak) ve 'fruit' sayılamayan olarak kullanılıyor; genel gerçekte sayılamayan isim artikelsiz gelir: 'Fruit is important'. 'A/An fruit' sayılabilir tekil ister, 'the fruit' belirli bir meyveyi işaret eder. Doğru cevap: C. Ders: genel gerçekte sayılamayan ve çoğul isim artikelsizdir."}, {"t": "given", "title": "Çözümlü örnek: some/any", "x": "Cümle: 'We don't have ___ sugar left, so I need to buy some.' Seçenekler: (A) some  (B) many  (C) any  (D) a few. Mantık: olumsuz cümlede ('don't have') sayılamayan 'sugar' için 'any' gelir; 'some' olumlu cümlede kullanılır, 'many/a few' sadece sayılabilen çoğul içindir. Doğru cevap: C. Ders: olumsuz ve soruda 'any', olumluda 'some'."}, {"t": "note", "k": "ipucu", "title": "Kalıcılaştırma tekniği", "lines": ["Genel gerçekte sayılamayan/çoğul ismi artikelsiz kullan: 'Water is life.'", "'a/an' sadece sayılabilen tekille; sesliyle 'an' (an apple, an hour).", "Esnek kalıpları öğren: a lot of, plenty of, enough her ikisiyle çalışır.", "'there is' tekil/sayılamayan, 'there are' çoğulla; uyuma dikkat et."]}, {"t": "drill", "instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.", "items": [{"n": 1, "q": "'___ is good for your health' cümlesinde genel olarak 'süt' nasıl ifade edilir?", "a": "'Milk is good for your health.' Genel bir gerçekte sayılamayan isim artikelsiz (zero article) gelir; 'A milk' ya da 'The milk' yanlış olur çünkü belirli bir sütten değil, genel olarak sütten söz ediliyor."}, {"n": 2, "q": "'much' ve 'a lot of' arasındaki kullanım farkı nedir?", "a": "'much' sadece sayılamayanla ve çoğunlukla olumsuz/soru cümlesinde gelir (not much water). 'a lot of' hem sayılabilen hem sayılamayanla, olumlu cümlede rahatça kullanılır (a lot of water, a lot of apples). Şüphede kalırsan 'a lot of' güvenlidir."}, {"n": 3, "q": "'There ___ some apples on the table' cümlesinde fiil ne olur?", "a": "'are'. 'apples' çoğul olduğu için 'there are' gelir. Sayılamayan ya da tekilde 'there is' olurdu (There is some milk). Özne-yüklem uyumu burada da ölçülür."}]}, {"t": "h", "x": "Toparlama: bütünleşik cloze"}, {"t": "p", "x": "Öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf bu paketin kelimelerini, sayılabilen/sayılamayan ayrımını ve miktar sözcüklerini birlikte test eder. Paragrafı önce bütün olarak oku, konuyu (sağlıklı beslenme) belirle, sonra boşlukları çöz. Yiyecek temalı paragrafların miktar ve artikel açısından ne kadar yoğun olduğunu göreceksin."}, {"t": "given", "title": "Bütünleşik örnek", "x": "Paragraf: 'A healthy breakfast is important. You should not eat too (1)___ sugar, but you can have (2)___ fruit and a (3)___ of bread with cheese. (4)___ is also good, so drink a glass every morning.' Çözüm: (1) 'much' (sayılamayan 'sugar' + olumsuz ton). (2) 'some / a lot of' (sayılamayan 'fruit'; esnek kalıp). (3) 'slice' ('a slice of bread'; sayılamayanı kapla say). (4) 'Milk' (genel gerçek, sayılamayan, artikelsiz). Ders: yiyecek cloze'u sayılabilirlik + miktar + artikeli bir arada sorar."}, {"t": "note", "k": "dikkat", "title": "Bu paketin tuzak özeti", "lines": ["Sayılamayanla 'many' kullanmak: 'many water' değil 'much water'.", "'a bread / a water' demek: doğru olan 'a slice of bread', 'a glass of water'.", "Genel gerçekte artikel koymak: 'The milk is good' değil 'Milk is good'.", "Olumsuz/soruda 'some' kullanmak: doğru olan 'any' (I don't have any sugar)."]}, {"t": "note", "k": "protokol", "title": "Miktar cümlesini çözme sırası", "lines": ["1) İsim sayılabilir mi sayılamaz mı? Önce buna karar ver; miktar kelimesi buna bağlıdır.", "2) Sayılabilen çoğul: many/a few. Sayılamayan: much/a little. Şüphede: a lot of / plenty of (her ikisi).", "3) Cümle olumlu mu olumsuz/soru mu? Olumlu: some. Olumsuz/soru: any.", "4) Genel bir gerçek mi belirli bir şey mi? Genel gerçekte sayılamayan/çoğul isim artikelsizdir."]}, {"t": "p", "x": "Sayılabilen/sayılamayan ayrımı yalnızca yiyecekler için değildir; aynı mantık akademik metinlerdeki 'information', 'advice', 'research', 'evidence', 'knowledge' gibi sayılamayan isimlere de uygulanır. Yani bu paketi doğru çalışmak, sınavın çok daha soyut sorularında da işine yarar; 'much information' doğru, 'many informations' yanlıştır."}, {"t": "h", "x": "Quiz: Almanca → İngilizce"}, {"t": "p", "x": "Almanca kelimenin İngilizce karşılığını seç."}, {"t": "mcqquiz", "items": [{"n": 1, "stem": "das Brot", "choices": {"A": "water", "B": "bread", "C": "apple", "D": "cheese"}, "ans": "B", "why": "das Brot = bread (ekmek).", "slug": "gri-mod-udsp-p4-1"}, {"n": 2, "stem": "der Apfel", "choices": {"A": "milk", "B": "meat", "C": "sugar", "D": "apple"}, "ans": "D", "why": "der Apfel = apple (elma).", "slug": "gri-mod-udsp-p4-2"}, {"n": 3, "stem": "das Wasser", "choices": {"A": "water", "B": "bread", "C": "vegetable", "D": "cheese"}, "ans": "A", "why": "das Wasser = water (su).", "slug": "gri-mod-udsp-p4-3"}, {"n": 4, "stem": "der Käse", "choices": {"A": "sugar", "B": "meat", "C": "cheese", "D": "milk"}, "ans": "C", "why": "der Käse = cheese (peynir).", "slug": "gri-mod-udsp-p4-4"}, {"n": 5, "stem": "kochen", "choices": {"A": "to eat", "B": "to cook", "C": "to drink", "D": "to buy"}, "ans": "B", "why": "kochen = to cook (pişirmek).", "slug": "gri-mod-udsp-p4-5"}, {"n": 6, "stem": "das Frühstück", "choices": {"A": "vegetable", "B": "sugar", "C": "meat", "D": "breakfast"}, "ans": "D", "why": "das Frühstück = breakfast (kahvaltı).", "slug": "gri-mod-udsp-p4-6"}]}]}, {"id": "p5", "group": "Kelime Paketleri", "name": "Paket 5. Familie und Menschen", "eyebrow": "P5", "blocks": [{"t": "p", "x": "Almanca, İngilizce ve Türkçe. Önce çalış, sonra quizi çöz."}, {"t": "table", "head": ["Almanca", "İngilizce", "Türkçe"], "rows": [["die Mutter", "mother", "anne"], ["der Vater", "father", "baba"], ["das Kind", "child", "çocuk"], ["die Schwester", "sister", "kız kardeş"], ["der Bruder", "brother", "erkek kardeş"], ["der Mann", "man", "adam"], ["die Frau", "woman", "kadın"], ["das Mädchen", "girl", "kız"], ["der Junge", "boy", "oğlan"], ["die Leute", "people", "insanlar"]]}, {"t": "h","x": "Aile ve insan kelimeleri: tanıdık ama kalıpla sınanan bir alan"}, {"t": "p","x": "Bu paketteki kelimeler (anne, baba, çocuk, kardeş, adam, kadın, insanlar) sınavda ilişki, biyografi ve toplum anlatan metinlerin çapa kelimeleridir. Bir okuma parçasında bir bilim insanının hayatı anlatılırken 'his mother', 'her family', 'their children' gibi ifadeler sürekli döner; cloze paragraflarında ise bu isimler cümlenin öznesini kilitler ve gerisini çözmeni sağlar. Aile kelimelerini bilmek, hem kelime sorusunu hem de paragın kim hakkında olduğunu hızla yakalamanı sağlar. Özellikle biyografi, tarih ve toplum metinlerinde bir kişinin ailesi, çocukluğu ve yakınları anlatılır; bu yüzden aile sözcükleri paragrafın konusunu ve kişiler arası ilişkileri taşıyan omurga kelimelerdir."}, {"t": "p","x": "Aile kelimelerinin tuzağı, herkesin 'bunları zaten biliyorum' demesidir. Oysa sınav 'mother' kelimesini tek başına değil, iyelik zamiriyle ('his mother', 'her mother') ve collocation içinde ('a large family', 'an only child', 'close friends') sorar. Türkçede 'annesi' derken sahibin cinsiyetini belirtmeyiz; İngilizcede ise 'his mother' (erkeğin annesi) ile 'her mother' (kadının annesi) farkı zorunludur. İşte bu paketin asıl konusu: kelimenin kendisi değil, onu doğru zamir ve kalıpla kullanmaktır."}, {"t": "h","x": "Artikel ve cinsiyet: aile isimlerini artikeliyle öğren"}, {"t": "p","x": "Almanca isimlerde artikel ismin cinsiyetini gösterir. Aile kelimelerinde çoğu zaman doğal cinsiyetle örtüşür: erkekler 'der' (der Vater, der Bruder, der Mann, der Junge), kadınlar 'die' (die Mutter, die Schwester, die Frau) alır. Ama iki önemli istisna vardır: 'das Kind' (çocuk) ve 'das Mädchen' (kız) nötrdür. 'Mädchen' anlamca kız olsa da '-chen' küçültme ekiyle bittiği için dilbilgisel olarak 'das' alır. Bu kural, sınavda seni şaşırtabilecek türden bir ayrıntıdır."}, {"head": ["Almanca","Cinsiyet mantığı","Not"],"rows": [["der Vater / der Bruder","doğal erkek → der","Mann, Junge de böyle"],["die Mutter / die Schwester","doğal kadın → die","Frau da böyle"],["das Kind","nötr → das","cinsiyet belirsiz, çoğulu die Kinder"],["das Mädchen","-chen eki → das","anlamı kız ama nötr"],["die Leute","her zaman çoğul","insanlar; 'die Leute sind ...'"]],"t": "table"}, {"t": "h","x": "İngilizce iyelik zamirleri: my, your, his, her"}, {"t": "p","x": "İngilizcede bir ismin kime ait olduğunu iyelik sıfatlarıyla söyleriz: my (benim), your (senin), his (onun-erkek), her (onun-kadın), its (onun-cansız), our (bizim), their (onların). Bu sözcükler her zaman ismin önünde durur: 'my father', 'her sister', 'their children'. En kritik nokta şudur: his/her sahibin cinsiyetine göre seçilir, sahip olunan şeye göre değil. 'John loves his mother' (John erkek → his), 'Mary loves her father' (Mary kadın → her). Türk öğrenciler burada sık hata yapar çünkü Türkçede tek bir 'onun' vardır."}, {"t": "p","x": "İyelik sıfatı ile özne zamirini karıştırma: 'he' (o) özne, 'his' (onun) iyelik, 'him' (ona/onu) nesnedir. Ayrıca özne-fiil uyumuna dikkat et: 'My sister is a doctor' (tekil → is), 'My parents are teachers' (çoğul → are). Aile isimleri tekil mi çoğul mu diye bakıp fiili ona göre çekmek, cloze sorularında sık test edilen bir noktadır. Ayrıca sahiplik, ismin sonuna gelen '-s (genitive) ile de kurulur: 'my sister's husband' (kız kardeşimin kocası), 'the children's room' (çocukların odası). İyelik sıfatı (his) ile bu '-s eki farklı araçlardır ama ikisi de bir şeyin kime ait olduğunu gösterir."}, {"head": ["Zamir","Kullanım","Örnek"],"rows": [["my","benim","This is my brother."],["your","senin","Is that your mother?"],["his","onun (erkek)","He visits his grandmother."],["her","onun (kadın)","She calls her father."],["their","onların","They love their children."]],"t": "table"}, {"k": "dikkat","lines": ["his mother = erkeğin annesi; her mother = kadının annesi. Zamir sahibin cinsiyetine göre seçilir.","Özne 'he/she' ile iyelik 'his/her' aynı değildir: 'He calls his sister.' (He özne, his iyelik).","das Mädchen dilbilgisel nötr olsa da, ondan bahsederken İngilizcede doğal cinsiyetle 'she' beklenir."],"t": "note","title": "Zamir tuzağı"}, {"t": "h","x": "Aile collocationları: kelimeyi kalıbıyla öğren"}, {"t": "p","x": "Aile kelimeleri sınavda sabit kalıplarla gelir. 'a close family' (birbirine bağlı aile), 'an only child' (tek çocuk), 'elder/younger brother' (büyük/küçük erkek kardeş), 'get married' (evlenmek), 'bring up / raise children' (çocuk büyütmek), 'look after' (bakmak, ilgilenmek), 'take after' (birine benzemek, huy ya da görünüş olarak). Bu kalıpları fiilleriyle birlikte ezberlemek, hem kelime sorusunu hem deyim sorusunu çözer. Başka sık kalıplar da vardır: 'grow up' (büyümek, yetişmek), 'get on well with' (biriyle iyi geçinmek), 'a close relative' (yakın akraba) ve 'run in the family' (ailede olmak, kalıtsal olmak). Bu ifadeleri tek tek değil, sık göründükleri cümle kalıbıyla öğrenmek kalıcılığı artırır."}, {"head": ["Kalıp","Anlam","Örnek"],"rows": [["a close family","birbirine bağlı aile","We are a close family."],["an only child","tek çocuk","She is an only child."],["get married","evlenmek","They got married last year."],["bring up children","çocuk büyütmek","She brought up three children."],["look after","bakmak, ilgilenmek","He looks after his little sister."],["take after","(birine) benzemek","She takes after her mother."]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: look after mı, take after mı?","x": "Cümle: 'My son ___ after his grandfather; they have exactly the same eyes.' Seçenekler: (A) looks  (B) takes  (C) brings  (D) gets. Mantık: 'aynı gözlere sahipler' benzerlik anlatır; 'take after' birine (görünüş/huy olarak) benzemek demektir. 'look after' bakmaktır, bağlamla uymaz. Doğru cevap: B. Ders: 'take after' benzerlik, 'look after' ilgilenmek; ikisini bağlamdaki ipucu ('same eyes') ayırır."}, {"k": "protokol","lines": ["1) Tabloyu sesli oku: Almanca artikel + İngilizce + Türkçe.","2) Her aile ismini bir iyelik zamiriyle söyle: 'his brother', 'her mother'.","3) Collocationları bir cümlede kullan: 'look after', 'take after', 'get married'.","4) das Kind ve das Mädchen istisnalarını işaretle.","5) Aşağıdaki alıştırmayı çöz, sonra quizi çöz."],"t": "note","title": "Bu paketi çalışma sırası"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'his'. Tom erkek olduğu için 'his mother' (onun annesi) doğrudur. İyelik zamiri sahibin (Tom) cinsiyetine göre seçilir, anneye göre değil.","n": 1,"q": "'Tom ___ mother is a nurse.' boşluğuna hangi iyelik sıfatı gelir?"},{"a": "'-chen' küçültme eki alan isimler dilbilgisel olarak nötrdür, bu yüzden 'das Mädchen' der. Anlam (kız) ile dilbilgisel cinsiyet (nötr) burada ayrışır.","n": 2,"q": "'das Mädchen' neden 'das' artikeli alır, anlamı kız olmasına rağmen?"},{"a": "'look after' bakmak, ilgilenmek demektir (She looks after the baby). 'take after' ise birine benzemek demektir (He takes after his father). Sınav bu ince farkı bağlamla sorar.","n": 3,"q": "'look after' ile 'take after' arasındaki fark nedir?"}],"t": "drill"}, {"t": "h","x": "Betimleme: insanları anlatmak (sıfat, be ve have)"}, {"t": "p","x": "İnsanları anlatırken iki tür sıfat kullanırız: fiziksel (tall, short, young, old, thin) ve karakter (kind, friendly, clever, quiet). İngilizcede sıfat her zaman ismin önünde durur ve çoğul olsa bile '-s' almaz: 'a tall man', 'two tall men' (talls değil). Sıfatı 'be' fiiliyle de kullanabilirsin: 'My brother is tall.' Sıra önemlidir: 'a kind old woman' (önce fikir/görüş, sonra yaş, sonra isim)."}, {"t": "p","x": "Özellikleri 'have / have got' ile veririz: 'She has blue eyes', 'He has short hair'. Yaşı ise 'be' fiiliyle söyleriz: 'He is thirty' ya da 'He is thirty years old'. Türkçedeki 'otuz yaşında' kalıbını birebir çevirip 'He has thirty years' demek klasik bir hatadır; İngilizce yaşta 'be' kullanır. 'How old are you?' sorusunun cevabı da 'be' iledir."}, {"head": ["Yapı","Örnek","Not"],"rows": [["sıfat + isim","a friendly teacher","sıfat çoğulda -s almaz"],["be + sıfat","My sister is quiet.","durum/özellik"],["have + özellik","He has brown eyes.","fiziksel ayrıntı"],["be + yaş","She is twenty (years old).","'have' değil 'be'"]],"t": "table"}, {"t": "given","title": "Çözümlü örnek: yaş ve betimleme","x": "Cümle: 'My grandfather ___ eighty, but he is still very active.' Seçenekler: (A) has  (B) is  (C) makes  (D) does. Mantık: İngilizcede yaş 'be' fiiliyle söylenir: 'he is eighty (years old)'. Türkçedeki 'seksen yaşında' etkisiyle 'has' seçmek tuzaktır. Doğru cevap: B. Ders: yaş = be; 'have' yalnızca fiziksel özellik (blue eyes, short hair) için."}, {"k": "ipucu","lines": ["Her aile ismini bir iyelik zamiriyle mini cümlede kullan: 'her brother is tall'.","his/her'i sahibin cinsiyetiyle eşleştirerek yüksek sesle tekrarla.","Yaşı hep 'be' ile söyle: 'I am ... years old'; 'have' deme.","Collocationları çift olarak ezberle: look after / take after, bring up / grow up."],"t": "note","title": "Kalıcılaştırma tekniği"}, {"instr": "Önce kendin cevapla, sonra Öneri ile karşılaştır.","items": [{"a": "'is'. İngilizcede yaş 'be' fiiliyle verilir: 'is forty-five (years old)'. 'has' demek Türkçe etkisiyle yapılan bir hatadır.","n": 1,"q": "'My mother ___ forty-five years old.' boşluğa hangi fiil gelir?"},{"a": "'a kind old woman'. İngilizcede fikir/görüş sıfatı (kind) yaş sıfatından (old) önce gelir. Sıfatlar çoğulda bile -s almaz.","n": 2,"q": "'a ___ woman' ifadesinde 'kind' ve 'old' sıfatlarını nasıl sıralarsın?"},{"a": "'people' çoğuldur ve çoğul fiil ister: 'People are friendly here.' 'People is' yanlıştır. Almanca 'die Leute' de her zaman çoğuldur.","n": 3,"q": "'people' kelimesi tekil mi çoğul mu, fiil nasıl çekilir?"}],"t": "drill"}, {"t": "h","x": "Toparlama: bütünleşik cloze"}, {"t": "p","x": "Şimdi öğrendiklerini bir arada gör. Aşağıdaki kısa paragraf aile isimlerini, iyelik zamirlerini ve betimleme kalıplarını aynı anda test eder. Önce paragı boşlukları atlayarak oku, kimden bahsedildiğini belirle, sonra her boşluğu hem anlam hem yapı açısından çöz. Sınavda cloze çözerken tam olarak bu adımları izleyeceksin."}, {"t": "given","title": "Bütünleşik örnek","x": "Paragraf: 'Anna comes from a (1)___ family. She is an only (2)___, so she has no brothers or sisters. She lives with (3)___ parents and often looks (4)___ her old grandmother. Everyone says she (5)___ after her mother.' Çözüm: (1) 'close' ('a close family' collocationı). (2) 'child' ('an only child' = tek çocuk). (3) 'her' (Anna kadın → her parents). (4) 'after' ('look after' = bakmak, ilgilenmek). (5) 'takes' ('take after' = benzemek; 'her mother' benzerlik anlatır). Ders: her boşlukta anla
