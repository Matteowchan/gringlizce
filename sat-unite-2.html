s to its likely effects and argues that the promised growth rarely materializes and that deficits usually widen instead.","why_correct":"The text lays out the supporters' case and then argues against the cut. Choice A fits.","why_wrong":{"B":"The economist argues against the cut rather than endorsing it, so B reverses the function.","C":"Explaining how it works is topic material, not the argue-against move.","D":"Only one policy is discussed."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","target_family":"Ters işlev","lesson_name":"Text Structure and Purpose"},{"stem":"Which choice best describes the function of the closing anecdote?","target_family":"Ters işlev","lesson_name":"Text Structure and Purpose","why_wrong":{"A":"It sharpens rather than lightens the tone, so B reverses the function.","C":"It does more than restate the slogan; it undercuts it.","D":"No solution is introduced."},"lesson":2,"id":"u2-l2-f3-08","correct":"B","passage":"The closing anecdote is not there to lighten the mood. It lands as a rebuke: the cheerful company slogan is quoted just after the account of the layoffs, so that the slogan reads as hollow.","why_correct":"The anecdote places the slogan against the layoffs so it reads as hollow, a rebuke. Choice A fits.","choices":{"A":"It lightens the tone after the account of the layoffs.","B":"It undercuts the company's slogan rather than relieving the tone.","D":"It introduces a solution to the layoffs described.","C":"It restates the company's official slogan for emphasis."},"choice_families":{"C":"Doğru konu yanlış işlev","D":"Metinde olmayan işlev","A":"Ters işlev"},"unit":2},{"choices":{"A":"To explain how standardized tests are scored.","B":"To accept a position and then build further support for it.","D":"To recommend a new kind of standardized test.","C":"To appear to accept a position in order to dismantle it."},"unit":2,"choice_families":{"B":"Ters işlev","A":"Doğru konu yanlış işlev","D":"Metinde olmayan işlev"},"id":"u2-l2-f3-09","passage":"The passage opens by seeming to agree that standardized tests measure ability fairly. That agreement is a setup. The rest of the passage dismantles it, showing how test scores track family income more closely than they track talent.","why_correct":"The apparent agreement is a setup that the passage then dismantles. Choice A fits.","correct":"C","why_wrong":{"D":"No new test is recommended.","B":"The passage tears the position down rather than supporting it, so B reverses the function.","A":"How tests are scored is topic material, not the dismantling move."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","target_family":"Ters işlev","lesson_name":"Text Structure and Purpose"},{"unit":2,"choice_families":{"A":"Metinde olmayan işlev","B":"Ters işlev","C":"Doğru konu yanlış işlev"},"choices":{"D":"It serves as a cautionary case rather than a model to imitate.","C":"It describes the geography of the settlement in detail.","A":"It compares two colonies founded in the same year.","B":"It serves as a model of successful settlement to imitate."},"passage":"The example of the failed colony is not offered as a model to follow. The author presents it as a warning, tracing how ignoring local knowledge doomed the settlement within a single winter.","why_correct":"The failed colony is presented as a warning about ignoring local knowledge. Choice A fits.","correct":"D","id":"u2-l2-f3-10","lesson":2,"why_wrong":{"C":"It does not detail the settlement's geography.","B":"It is a cautionary case, not a model to imitate, so B reverses the function.","A":"Only one colony is discussed."},"target_family":"Ters işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best describes the function of the example of the failed colony?"},{"lesson":2,"why_wrong":{"C":"The passage treats tree rings as reliable, not unreliable, so C reverses the stance.","B":"The passage never weighs advantages against disadvantages.","A":"The passage does more than a general claim about 'a natural feature'; and it never sets up the record as one option among several, which this phrasing implies."},"target_family":"Metinde olmayan işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","unit":2,"choice_families":{"C":"Ters işlev","B":"Metinde olmayan işlev","A":"Metinde olmayan işlev"},"choices":{"D":"To describe how tree rings form and record climate.","C":"To argue that tree rings are unreliable climate indicators.","A":"To explain how a natural feature can serve as a record of past climate.","B":"To weigh the advantages and disadvantages of using tree rings."},"passage":"The passage explains how tree rings record a region's climate history. Each ring's width reflects a year's growing conditions, so a cross-section becomes a readable archive of past wet and dry seasons.","why_correct":"The passage describes how tree rings form and record climate, presenting it as a readable archive. Choice D fits.","correct":"D","id":"u2-l2-f4-01"},{"passage":"The article traces how a small bakery grew into a national chain. It follows the founder's decisions year by year, from her first rented oven to the opening of her hundredth store.","why_correct":"The article narrates the bakery's growth through the founder's year-by-year decisions. Choice B fits.","correct":"A","id":"u2-l2-f4-02","unit":2,"choice_families":{"B":"Metinde olmayan işlev","D":"Metinde olmayan işlev","C":"Ters işlev"},"choices":{"C":"To criticize the founder's choices as reckless.","D":"To compare the chain with its main competitor.","B":"To recommend strategies other bakeries should adopt.","A":"To narrate the growth of a business through its founder's decisions."},"target_family":"Metinde olmayan işlev","lesson_name":"Text Structure and Purpose","stem":"Which choice best states the main purpose of the text?","lesson":2,"why_wrong":{"B":"The article recounts a story; it never offers strategies for others to adopt.","D":"No competitor is compared.","C":"It follows her choices without criticizing them as reckless, so C misstates the stance."}},{"unit":2,"choice_families":{"C":"Ters işlev","D":"Metinde olmayan işlev","A":"Metinde olmayan işlev"},"choices":{"B":"To describe an unusual adaptation and the advantage it provides.","A":"To rank desert plants by how much water they save.","C":"To argue that the adaptation is harmful to the plants.","D":"To propose an experiment on desert plants."},"why_correct":"The text describes the night-photosynthesis adaptation and its water-saving advantage. Choice A fits.","passage":"The text describes a curious property of certain desert plants: they photosynthesize at night, opening their pores in darkness to lose less water than they would under the noon sun.","correct":"B","id":"u2-l2-f4-03","lesson":2,"why_wrong":{"A":"The text never ranks plants by water saved.","C":"The adaptation is presented as beneficial, not harmful, so C reverses the stance.","D":"No experiment is proposed."},"lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","stem":"Which choice best states the main purpose of the text?"},{"lesson":2,"why_wrong":{"B":"It presents the notebooks as significant, not worthless, so C reverses the stance.","A":"The passage reports the facts; it never stages an evaluation of who deserves credit.","D":"No detailed comparison with contemporaries is made."},"lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","stem":"Which choice best states the main purpose of the text?","unit":2,"choice_families":{"D":"Metinde olmayan işlev","A":"Metinde olmayan işlev","B":"Ters işlev"},"choices":{"C":"To recount a rediscovery and note what the notebooks anticipated.","D":"To compare the mathematician with her contemporaries in detail.","B":"To argue that the notebooks contain nothing of value.","A":"To evaluate whether the mathematician deserves more credit than she received."},"why_correct":"The passage recounts the rediscovery and notes what the notebooks anticipated. Choice B fits.","passage":"The passage recounts how a forgotten mathematician's notebooks were rediscovered in an attic and how their contents anticipated results credited to others decades later.","correct":"C","id":"u2-l2-f4-04"},{"id":"u2-l2-f4-05","why_correct":"The essay conveys the felt experience of acquiring a language over time. Choice B fits.","passage":"The essay describes the experience of learning a second language as an adult: the early stumbling, the slow gains, and the strange moment when the new language begins to feel like one's own.","correct":"D","choices":{"D":"To convey the experience of gradually acquiring a second language.","C":"To argue that adults cannot truly learn a second language.","A":"To offer step-by-step instructions for learning a language.","B":"To compare two methods of language teaching."},"unit":2,"choice_families":{"B":"Metinde olmayan işlev","A":"Metinde olmayan işlev","C":"Ters işlev"},"stem":"Which choice best states the main purpose of the text?","lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","why_wrong":{"B":"No two teaching methods are compared.","A":"The essay evokes an experience; it never gives step-by-step instructions.","C":"It shows the language becoming one's own, the opposite of claiming adults cannot learn, so C reverses the stance."},"lesson":2},{"choices":{"D":"To compare suspension bridges with arch bridges.","C":"To argue that swaying bridges are dangerous and should be avoided.","A":"To explain why a seemingly undesirable feature is actually functional.","B":"To list the materials used in modern bridge construction."},"unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Metinde olmayan işlev"},"id":"u2-l2-f4-06","passage":"The text explains why some bridges are built to sway. A degree of movement, it notes, lets a structure absorb wind and traffic forces that a perfectly rigid bridge would transmit straight into its joints.","why_correct":"The text explains why sway, which sounds like a flaw, is actually functional. Choice A fits.","correct":"A","why_wrong":{"B":"The text never lists construction materials.","C":"It defends swaying as useful, not dangerous, so C reverses the stance.","D":"No two bridge types are compared."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","lesson_name":"Text Structure and Purpose"},{"lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","stem":"Which choice best states the main purpose of the text?","lesson":2,"why_wrong":{"A":"The passage never turns to predictions about climate change.","D":"Fish spawning is not compared.","C":"It presents the event as understood enough to describe, not as a mystery, so C misstates it."},"why_correct":"The passage describes the synchronized spawning event and its lunar timing. Choice B fits.","passage":"The passage describes how a coral spawning event unfolds: on a few nights each year, entire reefs release eggs and sperm at once, timed to the moon, in a synchronized burst that floods the water with life.","correct":"B","id":"u2-l2-f4-07","unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","A":"Metinde olmayan işlev"},"choices":{"B":"To describe a striking natural event and its timing.","A":"To predict how climate change will alter coral spawning.","C":"To argue that coral spawning is poorly understood.","D":"To compare spawning in corals with spawning in fish."}},{"why_wrong":{"B":"It does not argue for repeal, so C adds a stance the text lacks.","A":"The text describes a history; it never proposes a new law.","D":"No cross-country comparison is made."},"lesson":2,"stem":"Which choice best states the main purpose of the text?","target_family":"Metinde olmayan işlev","lesson_name":"Text Structure and Purpose","choices":{"D":"To compare traffic laws across different countries.","C":"To trace how an old law was extended to new technologies over time.","A":"To propose a new law covering electric scooters.","B":"To argue that the old law should be repealed."},"unit":2,"choice_families":{"A":"Metinde olmayan işlev","B":"Ters işlev","D":"Metinde olmayan işlev"},"id":"u2-l2-f4-08","passage":"The text recounts how an old law, written to regulate horse-drawn carriages, was later stretched to cover automobiles, then bicycles, then electric scooters, as courts applied its language to vehicles its authors never imagined.","why_correct":"The text traces how one old law was stretched to cover new vehicles over time. Choice B fits.","correct":"C"},{"choice_families":{"A":"Metinde olmayan işlev","B":"Metinde olmayan işlev","C":"Ters işlev"},"unit":2,"choices":{"B":"To compare salt mining with sea-salt evaporation.","A":"To assess whether salt is still economically important today.","C":"To argue that salt's historical value has been exaggerated.","D":"To explain how a common substance once shaped trade and settlement."},"correct":"D","why_correct":"The passage explains how salt once shaped trade routes, taxes, and settlement. Choice B fits.","passage":"The passage explains how salt was once so valuable that it shaped trade routes and taxes, and how roads and cities grew up around the places where it could be mined or evaporated from the sea.","id":"u2-l2-f4-09","lesson":2,"why_wrong":{"C":"It affirms salt's historical value rather than calling it exaggerated, so C reverses the stance.","A":"The passage stays with the past; it never assesses salt's importance today.","B":"The two extraction methods are mentioned, not systematically compared."},"lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","stem":"Which choice best states the main purpose of the text?"},{"why_correct":"The text explains that song develops from both an inborn template and learning from adults. Choice B fits.","passage":"The text describes the way certain birds learn their songs: hatched knowing only a rough template, they refine it by listening to adults, so that a young bird raised in silence never sings a full, normal song.","correct":"A","id":"u2-l2-f4-10","unit":2,"choice_families":{"D":"Metinde olmayan işlev","C":"Ters işlev","B":"Metinde olmayan işlev"},"choices":{"C":"To argue that birdsong is entirely instinctive.","D":"To compare the songs of two different bird species.","B":"To recommend methods for raising songbirds in captivity.","A":"To explain how song develops through a mix of instinct and learning."},"lesson_name":"Text Structure and Purpose","target_family":"Metinde olmayan işlev","stem":"Which choice best states the main purpose of the text?","lesson":2,"why_wrong":{"D":"No two species' songs are compared.","C":"It shows learning is required, the opposite of 'entirely instinctive,' so C reverses the point.","B":"The text explains a process; it never recommends captive-rearing methods."}}],"teaching":{"kavramsal_temel":["Text Structure and Purpose, metnin NE dediğini değil, NASIL kurulduğunu ya da bir parçanın NE ISE YARADIĞINI sorar. Yani konu değil, işlev ve yapı ölçülür.","Üç biçimde gelir: metnin genel yapısı, metnin ana amacı, ya da belirli bir cümlenin metindeki işlevi. Her üç biçimde de doğru cevap metnin YAPTIĞI hareketi tarif eder, konusunu özetlemez.","En kritik ayrım özet ile işlev arasındadır. discusses the history of X gibi bir seçenek metnin ne HAKKINDA olduğunu söyler, ne YAPTIĞINI değil. İşlev sorusunda bu tür özet seçenekler yanlıştır.","Bu yüzden metni okurken yazarın hareketini fiil olarak düşün: sunar, karşılaştırır, eleştirir, örnekler, çürütür. Bu fiil, doğru cevabın çekirdeğidir."],"cozumlu_ornekler":[{"adimlar":["Yazarın hareketini izle: önce yaygın bir varsayım veriliyor, sonra bir çalışma onu karmaşıklaştırıyor.","Bu bir hareket: varsayım sun, sonra ona karşı kanıt getir.","A tam bu hareketi tarif eder.","B konuyu özetler, işlevi değil. C yanlış, çalışma reddedilmiyor. D metinde yok, iki yöntem karşılaştırılmıyor."],"sonuc":"Doğru cevap metnin yaptığı hareketi (varsayım, sonra itiraz) tarif eder, konusunu özetlemez.","stem":"Which choice best describes the overall structure of the text?","passage":"Many gardeners assume that richer soil always yields healthier plants. A recent study complicates this belief: in nutrient-heavy soil, several wildflowers grew tall but produced far fewer blooms. The finding suggests that abundance can sometimes work against a plant's reproductive success.","correct":"A","choices":{"D":"Two gardening methods are compared and one is recommended.","C":"A study is described and then dismissed as unreliable.","A":"A common assumption is presented, then challenged with a study whose results point to a more complicated conclusion.","B":"The text describes how soil nutrients affect the growth of wildflowers."}},{"stem":"Which choice best states the main purpose of the text?","adimlar":["Yazar ne yapıyor: yaygın bir tanımı (kırılgan) düzeltiyor ve gerçek tehlikeyi (değişim hızı) gösteriyor.","Amaç bu düzeltme hareketidir.","A tam bunu söyler.","B konu özeti. C yanlış, metin tehlikeyi kabul ediyor. D karşılaştırma yok."],"sonuc":"Amaç sorusunda cevap metnin yaptığı ise (düzeltmek, yerini göstermek) odaklanır, konuya değil.","correct":"A","passage":"Coral reefs are often described as fragile, but this framing can mislead. Reefs have survived dramatic temperature swings over millions of years. What threatens them now is not fragility but the unusual speed of current change.","choices":{"B":"To explain how coral reefs respond to changes in ocean temperature.","A":"To correct a common characterization of reefs by locating the real source of their present danger.","C":"To argue that coral reefs are not in any danger today.","D":"To compare modern reefs with ancient reefs."}}],"ne_olculuyor":["Bu soru metnin NE dediğini değil, NASIL kurulduğunu ya da bir parçanın NE ISE YARADIĞINI ölçer. Yapı ve işlev sorusudur.","Üç biçimde gelir: metnin genel yapısı, metnin ana amacı, ya da belirli bir cümlenin metindeki işlevi.","Kritik nokta: doğru seçenek metnin YAPTIĞI şeyi tarif eder, konusunu ÖZETLEMEZ. Özet ile işlev farklı şeylerdir ve tuzak tam burada kurulur."],"alt_konular_baslik":"Soru alt tipleri","sik_hatalar":[{"hata":"Konu özetini işlev sanmak","cozum":"discusses X gibi seçenekler konuyu söyler. Soru işlev soruyorsa bunlar yanlıştır. Fiile bak: yazar ne YAPIYOR."},{"cozum":"Genel yapı sorusunda cevap metnin başından sonuna kadarki hareketi kapsamalı, sadece bir cümleyi değil.","hata":"Genel yapı sorusunda tek parçayı tarif etmek"},{"hata":"Ters işlev seçmek","cozum":"Metin destekliyorsa çürütür, örnekliyorsa reddeder gibi seçenekler yönü ters okur. Yazarın gerçek hareketine bak."},{"hata":"Metinde olmayan işlev uydurmak","cozum":"Makul görünen ama metnin yapmadığı bir karşılaştırma ya da çözüm eklenmişse, o seçenek yanlıştır."}],"alt_konular":[{"govde":["Soru kökü: \"Which choice best describes the overall structure of the text?\" Metnin baştan sona nasıl ilerlediğini tarif eden seçeneği seçersin: sorun-çözüm, genel-özel, iddia-karşı iddia, kronolojik gibi.","Yöntem: metni iki-üç aşamaya böl. İlk cümleler ne yapıyor (durum kuruyor mu, soru mu soruyor)? Gövde ne yapıyor? Son ne yapıyor? Bu üç hareketi birleştiren seçenek doğrudur.","Tuzak: metnin sadece bir bölümünü doğru tarif eden ama tümünü kapsamayan seçenek. Yapı sorusu bütünü ister."],"kural":"Metni hareketlere böl (giriş → gelişme → sonuç) ve üçünü birden tarif eden seçeneği seç.","baslik":"1) Metnin genel yapısı (overall structure)"},{"ornek":"Bir örnek cümlesi çoğu zaman 'bir önceki genellemeyi somut bir durumla destekler' işlevi taşır.","govde":["Soru kökü: \"Which choice best describes the function of the underlined sentence in the text as a whole?\" Altı çizili cümlenin metindeki GÖREVİNİ sorar — ne söylediğini değil, ne İŞE yaradığını.","İşlev fiilleri anahtardır: örnek verir, karşı görüş sunar, iddiayı sınırlar, geçiş yapar, kanıt getirir. Cümlenin bir öncesi ve bir sonrasıyla ilişkisine bak; işlev bu ilişkiden doğar.","Tuzak: cümlenin içeriğini doğru özetleyen ama işlevini yanlış adlandıran seçenek. 'Ne diyor' ile 'ne yapıyor' farkını koru."],"baslik":"2) Bir bölümün işlevi (function of a sentence)"},{"baslik":"3) Yazarın amacı (main purpose)","govde":["Soru kökü: \"The main purpose of the text is to...\" Yazarın bu metni neden yazdığını tek fiille yakalarsın: tanıtmak, karşılaştırmak, eleştirmek, ikna etmek, açıklamak.","Amaç, ana fikrin niyet hâlidir. Metin bir olguyu yalnızca aktarıyorsa amaç 'açıklamak'tır; bir tarafı savunuyorsa 'ikna etmek'tir. Metnin tonunu ölç: nötr mü, taraflı mı?","Tuzak: metinde geçen ama amacı olmayan bir ayrıntıyı amaç sanmak, ya da metnin tonundan daha güçlü/zayıf bir fiil seçmek."]}],"strateji":["Yazarın hareketini fiil olarak düşün: sunar, çürütür, örnekler, karşılaştırır.","Soru genel yapı mi, amaç mi, tek cümle işlevi mi belirle.","Genel soruda cevap bütünü kapsamalı, parça tarifini ele.","Konu özeti olan seçenekleri ele, işlev arayan sorularda.","Seçeneğin fiili metnin gerçekte yaptığı harekete uyuyor mu kontrol et."],"karar_proseduru":["Önce metnin hareketini izle.  Yazar ne yapıyor: bir iddia mi kuruyor, bir problem mi sunuyor, iki görüş mu karşılaştırıyor, bir örnek mi veriyor. Fiil olarak düşün: sunar, karşılaştırır, eleştirir, örnekler.","Soru genel mi özel mi belirle.  Genel yapı soruluyorsa cevap metnin BÜTÜNÜNÜ kapsamalı. Tek bir cümlenin işlevi soruluyorsa cevap o cümlenin metne KATKISINI vermeli.","Seçenekleri fiil olarak oku.  Her seçenek bir hareket tarif eder: introduces, challenges, illustrates, qualifies. Bu fiil metnin gerçekte yaptığı harekete uyuyor mu.","Konu özeti olan seçenekleri ele.  Metnin ne HAKKINDA olduğunu söyleyip ne YAPTIĞINI söylemeyen seçenek yanlıştır.","Kapsam kontrolü yap.  Seçenek metnin sadece bir kısmını mi tarif ediyor, yoksa bütününü mu. Genel soruda parça tarifi tuzaktır."],"top_tips":["Seçeneği bir FİİLE indir. introduces, then evaluates, gibi. Metin bu fiili gerçekten yapıyor mu diye kontrol et. Yapmıyorsa ele.","Konu özeti tuzağına dikkat. discusses the history of X gibi seçenekler çoğu zaman konuyu söyler, işlevi değil. Soru işlev soruyorsa bunlar yanlıştır.","Genel yapı sorusunda tek parça tarif eden seçeneği ele. Cevap metnin başından sonuna kadarki hareketi kapsamalı.","Bir cümlenin işlevi soruluyorsa, o cümleyi metinden ÇIKAR ve ne kaybettiğini düşün. Kaybettiğin şey o cümlenin işlevidir."],"alt_konular_intro":"Bu beceri 'metin ne diyor'dan çok 'metin nasıl kurulmuş ve neden' sorusunu sorar. Üç ölçek vardır: bütün metnin yapısı, tek bir cümlenin işlevi, ve yazarın genel amacı. Soruyu okur okumaz hangi ölçekte olduğunu belirlemek doğru cevaba giden ilk adımdır.","celdirici_aileleri":[{"tanim":"Seçenek metnin KONUSUNU doğru söyler ama YAPTIĞI şeyi yanlış tarif eder. Özet gibi okunur, işlev değil. Öğrenci konuyu tanıdığı için işaretler ama soru işlev sorar.","ad":"Doğru konu yanlış işlev"},{"ad":"Metnin bir kısmi bütünü değil","tanim":"Seçenek metnin sadece BIR bölümünü doğru tarif eder ama soru BÜTÜNÜN yapısını ister. İlk cümleye ya da son cümleye uyar, metnin tamamına uymaz."},{"tanim":"Seçenek metnin yaptığının TERSİ bir hareket söyler. Metin destekliyorsa seçenek eleştirir der, metin örnekliyorsa reddeder der. Yön yanlıştır.","ad":"Ters işlev"},{"tanim":"Seçenek makul görünen ama metnin ASLA yapmadığı bir hareket tarif eder. Metinde olmayan bir karşılaştırma, çözüm ya da eleştiri uydurur.","ad":"Metinde olmayan işlev"}]}},{"no":3,"name":"Cross-Text Connections","fam_short":{"Metin dışı çıkarım":"Metin dışı","Tek metne dayanma":"Tek metin","İlişki yönü ters":"Yön ters","İlişkiyi yanlış kurma":"Yanlış ilişki"},"families":["Tek metne dayanma","İlişki yönü ters","İlişkiyi yanlış kurma","Metin dışı çıkarım"],"main_ids":["u2-l3-f1-01","u2-l3-f2-01","u2-l3-f3-01","u2-l3-f4-01"],"teaching":{"cozumlu_ornekler":[{"adimlar":["Her metni özetle: Text 1 uzaktan çalışmanın faydasını övüyor (odaklanma, özgürlük). Text 2 gözden kaçan bir maliyeti gösteriyor (sınır hiç kapanmıyor).","İlişkiyi adlandır: Text 2, Text 1'in övdüğü faydayı karmaşıklaştırıyor.","A tam bunu söyler ve iki metni de kullanır.","B sadece Text 1'i tekrarlar, ilişki kurmaz. C yönü ters, Text 2 katılmıyor. D metinde yok."],"sonuc":"Doğru cevap iki metne de dokunur ve ilişkiyi (karmaşıklaştırma) doğru adlandırır.","stem":"Which choice best describes the relationship between the two texts?","passage":"Text 1: Remote work, supporters argue, frees employees from long commutes and lets them focus without office interruptions.\n\nText 2: In practice, many remote workers report that the boundary between job and home never closes; without an office to leave, they answer messages late into the night.","correct":"A","choices":{"D":"Text 2 argues that offices should be redesigned.","C":"Text 2 fully agrees with Text 1 that remote work reduces interruptions.","A":"Text 2 complicates the benefit Text 1 praises by pointing to a cost Text 1 overlooks.","B":"Text 2 explains that remote work frees employees from commutes."}},{"choices":{"D":"Text 2 recommends replacing parks with gyms.","C":"Text 2 argues that parks provide no measurable benefits.","A":"Text 2 agrees with Text 1 and extends its case with additional benefits.","B":"Text 2 disputes Text 1's claim that parks improve health."},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","adimlar":["Text 1: parklar sağlığı iyileştirir. Text 2: bu doğru DER ve üstüne ekler (serinletme, hava temizleme).","İlişki yönü: katılıyor ve genişletiyor.","A tam bunu söyler.","B ve C yönü ters, Text 2 karşı çıkmıyor katılıyor. D metinde yok."],"sonuc":"Yönü iki kez kontrol et. Text 2 açıkça these benefits are real diyor, yani katılıyor.","correct":"A","passage":"Text 1: A researcher argues that city parks measurably improve residents' health through lower stress and more exercise.\n\nText 2: These benefits are real, a second researcher agrees, and adds that parks also cool neighborhoods and clean the air."}],"kavramsal_temel":["Cross-Text Connections, aynı konuda iki kısa metin verir ve aralarındaki İLİŞKİYİ doğru kurmanı ister. İki biçimde gelir: Text 2 yazarı Text 1'e nasıl yanıt verirdi, ya da iki metin arasındaki ilişki nedir.","Doğru cevap HER İKİ metni de kullanmalı ve ilişkinin yönünü doğru vermeli. Sadece bir metni özetleyen ya da ilişkinin yönünü ters okuyan seçenek yanlıştır.","En sık iki hata şudur: tek metne dayanmak, yani iki metni bağlamadan birini özetlemek, ve yönü ters okumak, yani kimin katıldığını kimin karşı çıktığını karıştırmak.","Bu yüzden önce her metnin pozisyonunu tek cümlede yaz. Text 1 ne savunuyor, Text 2 ne savunuyor. Sonra ilişkiyi adlandır: katılıyor mu, çürütüyor mu, sınırlıyor mu, koşul mu ekliyor."],"ne_olculuyor":["İki kısa metin verilir, Text 1 ve Text 2, aynı konuda. Görev: aralarındaki İLİŞKİYİ doğru kurmak.","İki biçimde gelir: Text 2 yazarı Text 1'e nasıl yanıt verirdi, ya da iki metin arasındaki ilişki nedir.","Kritik nokta: doğru cevap HER İKİ metni de kullanmalı ve ilişkinin yönünü doğru vermeli. Tek metne dayanmak ya da yönü ters okumak en sık hatadır."],"sik_hatalar":[{"hata":"Tek metne dayanmak","cozum":"Sadece Text 1'i ya da Text 2'yı özetleyen seçenek ilişki kurmaz. Doğru cevap ikisine de dokunur."},{"cozum":"Kim katılıyor kim karşı çıkıyor karıştırma. Text 2'nin kendi sözlerine bak, yönü iki kez kontrol et.","hata":"İlişki yönünü ters okumak"},{"hata":"İlişki türünü yanlış kurmak","cozum":"Kısmen katılıyorsa tamamen çürütüyor demek yanlıştır. Katılma, çürütme, sınırlama, koşul ekleme farklı ilişkilerdir."},{"hata":"Metin dışı görüş yüklemek","cozum":"İki yazardan hiçbirinin söylemediği bir görüşü seçenek eklemiş olabilir. Her iddianın metinde dayanağını ara."}],"alt_konular_baslik":"Soru alt tipleri","alt_konular":[{"baslik":"1) İki metnin ilişkisi (agree / disagree / build on)","kural":"Her metnin iddiasını tek cümleye indir; ilişki daima üçünden biridir: katılır / karşı çıkar / geliştirir.","govde":["Soru kökü: \"Based on the texts, how would the author of Text 2 most likely respond to...\" ya da iki metnin aynı konuda nasıl bir ilişki kurduğunu sorar.","Önce her metnin ANA İDDİASINI ve TONUNU tek cümlede yaz. Text 2, Text 1 ile aynı fikirde mi, karşı mı, yoksa onu geliştiriyor/nüanslıyor mu? İlişki bu üç olasılıktan biridir.","Tuzak: iki metni de doğru özetleyen ama aralarındaki ilişkinin YÖNÜNÜ karıştıran seçenek (karşı çıkmayı 'destekleme' sanmak gibi)."]},{"baslik":"2) Bir yazarın diğerine yanıtı (author's likely response)","ornek":"Text 1 bir yöntemi över, Text 2 o yöntemin bir sınırını gösterirse; Text 2 yazarının yanıtı 'yöntem işe yarar ama şu koşulda yetersiz' olur.","govde":["Bu tipte Text 2 yazarının Text 1'deki belirli bir noktaya ne diyeceğini tahmin edersin. Cevap, Text 2'nin duruşundan MANTIKSAL olarak çıkmalı — metnin söylemediği bir görüşü ona atfetme.","Yöntem: Text 1'in ilgili iddiasını bul, sonra Text 2'nin bu konudaki kanıtını/duruşunu bul. Yanıt, Text 2'nin kanıtını Text 1'in iddiasına uygulamaktır.","En sık hata: kendi görüşünü ya da 'makul' bir tepkiyi seçmek. Yalnızca Text 2'de dayanağı olan yanıt doğrudur."]}],"strateji":["Her metnin pozisyonunu tek cümlede yaz.","İlişkiyi adlandır: katılıyor, çürütüyor, sınırlıyor, koşul ekliyor.","Yanıt sorusunda Text 2'nin gerçek sözlerine bak, genel değil spesifik noktaya.","İki metni de kullan, tek taraflı seçeneği ele.","Yönü iki kez kontrol et, ters okuma en sık hatadır."],"karar_proseduru":["Önce her metnin POZİSYONUNU tek cümlede yaz.  Text 1 ne savunuyor. Text 2 ne savunuyor. Kendi kelimenle, kısa.","İlişkiyi adlandır.  Aynı fikirdeler mi, Text 2 Text 1'i cürütüyor mu, sınırlıyor mu, örnekliyor mu, koşul mu ekliyor.","Text 2 yazarının GERÇEK sözlerine bak.  Yanıt sorusunda, Text 2'nin kendi iddiası Text 1'in tam neyine dokunuyor. Genel değil, spesifik noktaya.","Her iki metni de kullan.  Sadece bir metne uyan seçenek yanlıştır. Doğru cevap ilişkiyi kurar, tek tarafı özetlemez.","Yönü kontrol et.  Kim katılıyor kim katılmıyor. Seçenek bunu ters çevirmiş olabilir. Yön yanlışsa ele."],"top_tips":["İlişki sorusunda doğru cevap HER İKİ metne dokunur. Sadece Text 1'i ya da sadece Text 2'yı özetleyen seçeneği hemen ele.","Kim ne diyor karıştırma. Text 1 A der, Text 2 B der. Seçenek bunları yer değiştirmiş olabilir. Yönü iki kez kontrol et.","Katılmak, cürütmek, sınırlamak, koşul eklemek farklı ilişkilerdir. Text 2 kısmen katılıyorsa tamamen cürütüyor demek yanlıştır.","Seçenekteki her iddianın metinde dayanağını bul. Dayanağı olmayan, kulağa mantıklı gelen seçenek metin dışı çıkarım tuzağıdır."],"alt_konular_intro":"Cross-Text Connections tek metin değil, İKİ metin verir (Text 1 ve Text 2) ve aralarındaki ilişkiyi sorar. Zor görünmesinin nedeni iki metni birden tutmaktır. Çözüm: her metnin duruşunu tek cümleyle yaz, sonra ikisini karşılaştır. İş, okuma değil, iki duruşu hizalamaktır.","celdirici_aileleri":[{"tanim":"Seçenek sadece BIR metni doğru özetler ama iki metin arasındaki ilişkiyi kurmaz. Genelde Text 1 ya da Text 2'nin tek başına söylediği bir şey. İlişki sorusuna tek taraflı cevap.","ad":"Tek metne dayanma"},{"ad":"İlişki yönü ters","tanim":"Seçenek ilişkinin YÖNÜNÜ ters okur. Text 2 katılmıyorsa katılıyor der, ya da kim hangi görüşü savunuyor karıştırır. İki metin de doğru anlaşılır ama yön yanlıştır."},{"tanim":"İki görüş de doğru verilir ama ARALARINDAKİ ilişki yanlış adlandırılır. Text 2 aslında sınırlıyorken tamamen cürütüyor der, ya da katılıyorken karşı çıkıyor der. İlişkinin türü yanlıştır.","ad":"İlişkiyi yanlış kurma"},{"ad":"Metin dışı çıkarım","tanim":"Seçenek iki yazardan HİÇBİRİNİN söylemediği bir görüşü birine yükler. Makul görünür ama metinde dayanağı yoktur. Metin dışı bir iddia."}]},"questions":[{"choices":{"D":"Text 2 argues that offices should be redesigned to be quieter.","C":"Text 2 fully agrees with Text 1 that remote work reduces interruptions.","A":"Text 2 complicates the benefit Text 1 praises by pointing to a cost Text 1 overlooks.","B":"Text 2 explains that remote work frees employees from long commutes."},"choice_families":{"C":"İlişki yönü ters","D":"Metin dışı çıkarım","B":"Tek metne dayanma"},"unit":2,"id":"u2-l3-f1-01","correct":"A","passage":"Text 1: Remote work, its supporters argue, frees employees from long commutes and lets them focus without the interruptions of a busy office.\n\nText 2: In practice, many remote workers report that the boundary between job and home never closes; without the office to leave, they find themselves answering messages late into the night.","why_correct":"Text 1 praises focus and freedom; Text 2 raises an overlooked cost (no boundary), complicating that benefit. Choice A captures the relationship.","why_wrong":{"B":"This restates only Text 1's point and ignores Text 2's contrast, so it fails to build the relationship.","D":"Neither text proposes redesigning offices.","C":"Text 2 does not agree that remote work is all benefit; it raises a downside, so the direction is reversed."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"Tek metne dayanma","lesson_name":"Cross-Text Connections"},{"why_wrong":{"C":"Text 2 disagrees with Text 1, so 'agrees' reverses the direction.","D":"Neither text recommends larger enclosures.","A":"This restates Text 1's point, not Text 2's counter, so it does not build the relationship."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"Tek metne dayanma","choices":{"A":"Text 2 argues that zoos educate the public about endangered species.","B":"Text 2 challenges Text 1's defense by questioning both its conservation and its spending priorities.","D":"Text 2 recommends building larger enclosures for zoo animals.","C":"Text 2 agrees with Text 1 that zoos are essential to conservation."},"unit":2,"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","A":"Tek metne dayanma"},"id":"u2-l3-f1-02","why_correct":"Text 1 defends zoos; Text 2 challenges that defense on conservation and spending. Choice A names the relationship.","passage":"Text 1: Zoos, defenders say, play a vital role in conservation, breeding endangered species and educating the public about the need to protect them.\n\nText 2: Critics counter that most zoo animals belong to species in no danger of extinction, and that the money spent housing them could do more good protecting habitats in the wild.","correct":"B"},{"id":"u2-l3-f1-03","correct":"C","why_correct":"Text 2 would push back on Text 1 by noting that a single test misses persistence and growth that grades reveal. Choice A fits.","passage":"Text 1: Standardized testing, supporters hold, gives colleges a single objective measure that lets them compare applicants from very different schools.\n\nText 2: Yet a test taken on one morning captures a narrow slice of a student. Grades earned over years, some argue, reveal persistence and growth that a single score cannot.","choices":{"C":"By arguing that a single score misses qualities a longer record reveals.","D":"By proposing that colleges stop admitting students altogether.","B":"By agreeing that standardized tests offer a single objective measure.","A":"By claiming that grades are also completely objective measures."},"choice_families":{"B":"Tek metne dayanma","A":"Metin dışı çıkarım","D":"Metin dışı çıkarım"},"unit":2,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","target_family":"Tek metne dayanma","why_wrong":{"B":"This restates Text 1's claim; it is not how Text 2 would respond.","A":"Text 2 never claims grades are 'completely objective'; that view is in neither text.","D":"Neither text suggests colleges stop admitting students."},"lesson":3},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"Tek metne dayanma","lesson_name":"Cross-Text Connections","why_wrong":{"C":"Text 2 allows that economic strain mattered, so 'any role' reverses its stance.","B":"This restates Text 1's economic claim, not Text 2's addition.","A":"Text 2 does not claim there is no identifiable cause; it names two."},"lesson":3,"id":"u2-l3-f1-04","correct":"D","passage":"Text 1: The historian argues that the revolution was driven mainly by economic hardship, as rising bread prices pushed ordinary people to the brink.\n\nText 2: Economic strain mattered, a second historian allows, but ideas mattered too; pamphlets and debates gave the hardship a language and a target it would otherwise have lacked.","why_correct":"Text 2 grants the economic factor but adds the role of ideas that Text 1 downplays. Choice A captures the qualifying relationship.","choices":{"B":"Text 2 argues that rising bread prices pushed people to the brink.","A":"Text 2 claims the revolution had no single identifiable cause at all.","C":"Text 2 rejects the idea that economic hardship played any role.","D":"Text 2 accepts part of Text 1's claim while adding a factor Text 1 downplays."},"choice_families":{"A":"Metin dışı çıkarım","B":"Tek metne dayanma","C":"İlişki yönü ters"},"unit":2},{"id":"u2-l3-f1-05","correct":"A","why_correct":"Text 2 qualifies Text 1's optimism by noting extreme voices dominate. Choice A fits.","passage":"Text 1: Social media, some argue, has widened the public square, giving ordinary people a platform that was once reserved for a few powerful outlets.\n\nText 2: But a louder square is not always a fairer one. On these platforms, researchers find, the most extreme voices travel fastest, drowning out the moderate majority.","choices":{"B":"Text 2 explains that social media gives ordinary people a platform.","A":"Text 2 qualifies Text 1's optimism by describing a distortion in how attention spreads.","C":"Text 2 fully endorses Text 1's view of a wider public square.","D":"Text 2 argues that traditional outlets should be shut down."},"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","B":"Tek metne dayanma"},"unit":2,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"Tek metne dayanma","why_wrong":{"D":"Neither text calls for shutting outlets down.","C":"Text 2 complicates rather than endorses Text 1, so the direction is off.","B":"This restates Text 1's point, not Text 2's qualification."},"lesson":3},{"unit":2,"choice_families":{"A":"İlişki yönü ters","D":"Metin dışı çıkarım","C":"Tek metne dayanma"},"choices":{"A":"By agreeing that the drug should be approved rapidly.","B":"By arguing that the trial was too short to justify the confidence Text 1 expresses.","D":"By claiming the drug is certainly dangerous over the long term.","C":"By reporting that the drug lowered blood pressure sharply."},"why_correct":"Text 2 would respond that eight weeks is too short to support rapid approval. Choice A fits.","passage":"Text 1: A team reports that a new drug lowered blood pressure sharply in their trial, and they call for its rapid approval.\n\nText 2: A second group notes that the trial ran only eight weeks. Long-term safety, they caution, cannot be judged from so short a study, whatever the early numbers show.","correct":"B","id":"u2-l3-f1-06","lesson":3,"why_wrong":{"C":"This restates Text 1's result, not Text 2's response.","D":"Text 2 says safety cannot yet be judged, not that the drug is certainly dangerous.","A":"Text 2 urges caution rather than agreeing to rapid approval, so the direction is reversed."},"lesson_name":"Cross-Text Connections","target_family":"Tek metne dayanma","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?"},{"lesson":3,"why_wrong":{"B":"Text 2 criticizes the screens rather than praising them, reversing the direction.","A":"Text 2 does not agree the screens are a clear benefit, so 'agrees' is wrong.","D":"Neither text mentions ticket prices."},"target_family":"Tek metne dayanma","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","unit":2,"choice_families":{"D":"Metin dışı çıkarım","B":"İlişki yönü ters","A":"İlişki yönü ters"},"choices":{"B":"Text 2 praises the bright signs and interactive screens.","A":"Text 2 agrees that the screens make art more accessible to all.","C":"Text 2 raises a concern about the very feature Text 1 praises.","D":"Text 2 suggests the museum should charge higher ticket prices."},"passage":"Text 1: The critic praises the museum's new wing for making art accessible, with bright signs and interactive screens guiding every visitor.\n\nText 2: Another critic worries that the screens do the looking for us. Told what to notice, she argues, visitors stop discovering anything on their own.","why_correct":"Text 2 worries the screens 'do the looking for us,' targeting the feature Text 1 praised. Choice A fits.","correct":"C","id":"u2-l3-f1-07"},{"unit":2,"choice_families":{"C":"İlişki yönü ters","B":"Tek metne dayanma","A":"Metin dışı çıkarım"},"choices":{"B":"Text 2 argues that automation frees workers for creative work.","A":"Text 2 recommends banning automation in most industries.","C":"Text 2 denies that automation will change the workplace at all.","D":"Text 2 makes Text 1's promise conditional on a step Text 1 leaves out."},"passage":"Text 1: Automation, its advocates argue, will free workers from dull, repetitive tasks and let them focus on more creative work.\n\nText 2: For that promise to hold, a labor economist notes, displaced workers must be retrained for the new roles, and history shows such retraining is often too slow to catch those left behind.","why_correct":"Text 2 makes Text 1's promise depend on retraining, a step Text 1 omits. Choice A fits.","correct":"D","id":"u2-l3-f1-08","lesson":3,"why_wrong":{"C":"Text 2 assumes automation changes work; it disputes the ease, not the fact.","A":"Neither text calls for banning automation.","B":"This restates Text 1's promise, not Text 2's condition."},"target_family":"Tek metne dayanma","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"choice_families":{"C":"Tek metne dayanma","D":"İlişki yönü ters","B":"İlişki yönü ters"},"unit":2,"choices":{"B":"By agreeing that genetic diversity is the single decisive factor.","A":"By arguing that habitat loss can override the genetic advantage Text 1 emphasizes.","C":"By restating that diverse genes let some individuals withstand threats.","D":"By claiming that genetic diversity has no effect on survival."},"correct":"A","why_correct":"Text 2 responds that fast habitat loss can override genetic diversity. Choice A fits.","passage":"Text 1: A biologist argues that a species' survival depends most on its genetic diversity, which lets some individuals withstand new threats.\n\nText 2: Genes are only part of it, another biologist responds. A population can be genetically rich yet still collapse if its habitat disappears faster than any individual can adapt.","id":"u2-l3-f1-09","lesson":3,"why_wrong":{"C":"This restates Text 1's claim rather than Text 2's response.","D":"Text 2 says genes are 'only part of it,' not that they have no effect.","B":"Text 2 denies that genes are the single decisive factor, reversing Text 1."},"lesson_name":"Cross-Text Connections","target_family":"Tek metne dayanma","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?"},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"Tek metne dayanma","lesson_name":"Cross-Text Connections","why_wrong":{"D":"Neither text calls for banning all tourism.","C":"Text 2 says the logic holds 'up to a point,' not never, so 'never' overstates it.","A":"This restates Text 1's claim, not Text 2's limit."},"lesson":3,"id":"u2-l3-f1-10","passage":"Text 1: Ecotourism, supporters say, protects wild places by giving local communities a financial reason to keep them intact.\n\nText 2: The logic holds only up to a point. Beyond a certain number of visitors, one study warns, the very traffic drawn by ecotourism begins to erode the habitats it was meant to preserve.","why_correct":"Text 2 accepts the benefit but caps it: past a threshold, traffic erodes habitats. Choice A fits.","correct":"B","choices":{"D":"Text 2 recommends banning all tourism in natural areas.","C":"Text 2 concludes that ecotourism never protects wild places.","A":"Text 2 argues that ecotourism gives communities a reason to protect nature.","B":"Text 2 sets a limit on the benefit Text 1 describes."},"unit":2,"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","A":"Tek metne dayanma"}},{"why_wrong":{"C":"Text 2 affirms benefits and adds more, so 'no benefits' reverses its stance.","D":"Neither text suggests replacing parks with gyms.","A":"Text 2 agrees rather than disputes, so this reverses the direction."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"İlişki yönü ters","choices":{"B":"Text 2 agrees with Text 1 and extends its case with additional benefits.","A":"Text 2 disputes Text 1's claim that parks improve health.","C":"Text 2 argues that parks provide no measurable benefits.","D":"Text 2 recommends replacing parks with indoor gyms."},"unit":2,"choice_families":{"A":"İlişki yönü ters","D":"Metin dışı çıkarım","C":"İlişki yönü ters"},"id":"u2-l3-f2-01","why_correct":"Text 2 explicitly agrees ('these benefits are real') and adds cooling and air-cleaning. Choice A gives the correct direction.","passage":"Text 1: A researcher argues that city parks measurably improve residents' health, pointing to lower stress and more exercise among people who live near green space.\n\nText 2: These benefits are real, a second researcher agrees, and adds that parks also cool neighborhoods and clean the air, strengthening the case for building more of them.","correct":"B"},{"lesson":3,"why_wrong":{"B":"Text 2 praises the late poems, so agreeing they are weakest reverses its view.","A":"Both texts assume the late poems exist; neither denies it.","D":"No contemporary novelist is mentioned."},"target_family":"İlişki yönü ters","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?","choice_families":{"D":"Metin dışı çıkarım","A":"Metin dışı çıkarım","B":"İlişki yönü ters"},"unit":2,"choices":{"C":"Text 2 defends the late work that Text 1 dismisses.","D":"Text 2 compares the poet with a contemporary novelist.","B":"Text 2 agrees that the late poems are the poet's weakest.","A":"Text 2 argues that the poet wrote no late poems at all."},"correct":"C","passage":"Text 1: A critic contends that the poet's late work is his weakest, its images blurred and its rhythms slack.\n\nText 2: A second critic sees the same late poems as his richest, arguing that what looks like slackness is a deliberate loosening that lets feeling breathe.","why_correct":"Text 1 calls the late work weakest; Text 2 calls it richest, defending it. Choice A gives the direction.","id":"u2-l3-f2-02"},{"choices":{"D":"By presenting evidence that challenges Text 1's prediction of job losses.","C":"By agreeing that higher wages always reduce total employment.","A":"By arguing that wages should never be regulated by law.","B":"By confirming that minimum wage increases cause employers to cut staff."},"unit":2,"choice_families":{"C":"İlişki yönü ters","A":"Metin dışı çıkarım","B":"İlişki yönü ters"},"id":"u2-l3-f2-03","passage":"Text 1: One economist warns that raising the minimum wage will cost jobs, as employers cut staff to offset higher labor costs.\n\nText 2: Recent studies, another economist notes, find little job loss after modest increases; some even show slight employment gains as higher pay reduces turnover.","why_correct":"Text 2 offers studies finding little job loss, challenging Text 1's prediction. Choice A gives the direction.","correct":"D","why_wrong":{"C":"Text 2 cites possible gains, so 'always reduce employment' reverses its point.","A":"Text 2 discusses evidence, not whether wages should ever be regulated.","B":"Text 2 challenges the job-loss claim rather than confirming it."},"lesson":3,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","target_family":"İlişki yönü ters","lesson_name":"Cross-Text Connections"},{"id":"u2-l3-f2-04","correct":"A","passage":"Text 1: A teacher argues that homework reinforces learning and builds the discipline students will need later.\n\nText 2: Another teacher counters that for young children, research links heavy homework to stress and to a loss of interest in school, with little gain in achievement.","why_correct":"Text 2 counters Text 1, citing stress and lost interest for young children. Choice A gives the direction.","choices":{"B":"Text 2 supports Text 1's claim that homework builds discipline.","A":"Text 2 opposes Text 1's endorsement, at least for young children.","C":"Text 2 argues that homework has no effect of any kind.","D":"Text 2 proposes lengthening the school day instead."},"choice_families":{"D":"Metin dışı çıkarım","C":"İlişkiyi yanlış kurma","B":"İlişki yönü ters"},"unit":2,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişki yönü ters","lesson_name":"Cross-Text Connections","why_wrong":{"C":"Text 2 reports specific effects, so 'no effect of any kind' misstates it.","D":"Neither text proposes lengthening the school day.","B":"Text 2 opposes rather than supports Text 1, reversing the direction."},"lesson":3},{"correct":"B","why_correct":"Text 2 argues added capacity draws more drivers (induced demand), opposing Text 1. Choice A gives the direction.","passage":"Text 1: A planner argues that wider roads ease congestion by giving traffic more room to flow.\n\nText 2: Wider roads, a transport scholar replies, tend to fill up again as the added capacity draws more drivers, a pattern known as induced demand.","id":"u2-l3-f2-05","choice_families":{"A":"İlişki yönü ters","C":"Tek metne dayanma","D":"Metin dışı çıkarım"},"unit":2,"choices":{"C":"By confirming that traffic has more room to flow on wider roads.","D":"By recommending that all existing roads be narrowed.","B":"By arguing that added road capacity tends to attract traffic rather than relieve it.","A":"By agreeing that wider roads reliably ease congestion."},"lesson_name":"Cross-Text Connections","target_family":"İlişki yönü ters","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson":3,"why_wrong":{"A":"Text 2 disputes that wider roads ease congestion, so agreeing reverses its view.","D":"Text 2 never recommends narrowing all roads.","C":"This restates Text 1's premise, not Text 2's response."}},{"id":"u2-l3-f2-06","why_correct":"Text 2 proposes independent origin as an alternative to Text 1's migration account. Choice A gives the relationship.","passage":"Text 1: A scholar claims that folktales spread mainly by migration, carried from place to place as people moved.\n\nText 2: Another scholar finds the same tales arising independently in distant cultures that never met, suggesting shared human concerns can produce similar stories on their own.","correct":"C","choices":{"C":"Text 2 offers an alternative to Text 1's explanation for how similar tales appear.","D":"Text 2 claims that folktales were invented by a single culture.","B":"Text 2 confirms that folktales spread only through migration.","A":"Text 2 argues that folktales do not actually resemble one another."},"unit":2,"choice_families":{"A":"Metin dışı çıkarım","B":"İlişki yönü ters","D":"Metin dışı çıkarım"},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"İlişki yönü ters","why_wrong":{"A":"Text 2 assumes the tales resemble one another; that is the puzzle it addresses.","B":"Text 2 offers a different mechanism, so 'only through migration' reverses it.","D":"Neither text claims a single culture invented all folktales."},"lesson":3},{"choice_families":{"B":"İlişki yönü ters","A":"Metin dışı çıkarım","C":"İlişki yönü ters"},"unit":2,"choices":{"D":"Text 2 supports Text 1's claim with experimental evidence.","C":"Text 2 argues that fiction reduces readers' empathy.","A":"Text 2 recommends that schools stop teaching fiction.","B":"Text 2 disputes Text 1's claim that fiction builds empathy."},"correct":"D","passage":"Text 1: A columnist argues that reading fiction builds empathy by letting readers inhabit lives unlike their own.\n\nText 2: A psychologist agrees, citing studies in which readers of literary fiction performed better on tests of reading others' emotions.","why_correct":"Text 2 agrees and supplies supporting studies. Choice A gives the direction.","id":"u2-l3-f2-07","lesson":3,"why_wrong":{"C":"Text 2 shows fiction improves emotion reading, so 'reduces empathy' reverses it.","B":"Text 2 supports rather than disputes Text 1, reversing the direction.","A":"Neither text recommends dropping fiction."},"target_family":"İlişki yönü ters","lesson_name":"Cross-Text Connections","stem":"Which choice best describes the relationship between Text 1 and Text 2?"},{"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","target_family":"İlişki yönü ters","lesson_name":"Cross-Text Connections","why_wrong":{"C":"Text 2 shows museums stayed full, so 'cannot survive returns' reverses its point.","D":"Neither text argues against all display.","B":"Text 2 disputes the emptying claim, so agreeing reverses it."},"lesson":3,"id":"u2-l3-f2-08","passage":"Text 1: A curator argues that returning artifacts to their countries of origin will empty the world's great museums.\n\nText 2: Returns have not emptied museums, a second curator observes; loans, replicas, and new donations have kept the halls full while artifacts went home.","why_correct":"Text 2 notes returns have not emptied museums, countering Text 1's fear. Choice A gives the direction.","correct":"A","choices":{"A":"By pointing to evidence that returns have not had the effect Text 1 fears.","B":"By agreeing that returning artifacts will empty the museums.","D":"By arguing that no artifacts should ever be displayed.","C":"By confirming that museums cannot survive any returns."},"unit":2,"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","B":"İlişki yönü ters"}},{"correct":"B","why_correct":"Text 2 grants a role to talent but argues practice predicts performance better. Choice A gives the direction.","passage":"Text 1: A coach insists that natural talent is what separates elite athletes from the rest.\n\nText 2: Talent opens the door, a sports scientist responds, but tracking studies show that hours of deliberate practice predict elite performance far better than early talent does.","id":"u2-l3-f2-09","choice_families":{"C":"Tek metne dayanma","D":"Metin dışı çıkarım","A":"İlişki yönü ters"},"unit":2,"choices":{"D":"By claiming that practice has no measurable effect on performance.","C":"By confirming that talent alone separates elite athletes.","A":"By agreeing that natural talent is the decisive factor.","B":"By arguing that practice predicts elite performance more than talent does."},"lesson_name":"Cross-Text Connections","target_family":"İlişki yönü ters","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson":3,"why_wrong":{"D":"Text 2 credits practice heavily, so 'no effect' reverses its point.","C":"This restates Text 1's claim, not Text 2's response.","A":"Text 2 makes practice decisive, so agreeing talent is decisive reverses it."}},{"choices":{"D":"By recommending that people eat five meals a day.","C":"By citing trials that contradict Text 1's warning about skipping breakfast.","A":"By confirming that breakfast-skippers overeat later in the day.","B":"By agreeing that skipping breakfast slows metabolism."},"choice_families":{"D":"Metin dışı çıkarım","A":"İlişki yönü ters","B":"İlişki yönü ters"},"unit":2,"id":"u2-l3-f2-10","correct":"C","why_correct":"Text 2 cites trials finding no slowdown and sometimes less eating, contradicting Text 1. Choice A gives the direction.","passage":"Text 1: One nutritionist warns that skipping breakfast slows metabolism and leads to overeating later in the day.\n\nText 2: Controlled trials, another nutritionist notes, find no metabolic slowdown from skipping breakfast, and some participants ate less overall, not more.","why_wrong":{"D":"Neither text recommends a five-meal schedule.","A":"Text 2 found some ate less, so 'overeat later' reverses its finding.","B":"Text 2 contradicts the slowdown claim, so agreeing reverses it."},"lesson":3,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","target_family":"İlişki yönü ters"},{"choices":{"B":"Text 2 completely refutes Text 1's claim that dogs read gestures.","A":"Text 2 restates Text 1's explanation in different words.","C":"Text 2 qualifies Text 1's explanation without rejecting the ability it describes.","D":"Text 2 argues that dogs cannot understand pointing at all."},"choice_families":{"A":"İlişkiyi yanlış kurma","B":"İlişkiyi yanlış kurma","D":"İlişki yönü ters"},"unit":2,"id":"u2-l3-f3-01","correct":"C","why_correct":"Text 2 accepts that the animals read pointing but qualifies the cause (contact, not only domestication). Choice A names that limited disagreement.","passage":"Text 1: A scientist argues that dogs understand human pointing because domestication shaped them to read our gestures.\n\nText 2: Wolves raised by humans can learn to follow pointing too, a second scientist notes, which suggests the ability may owe as much to close contact as to domestication.","why_wrong":{"D":"Text 2 accepts the ability; 'cannot understand pointing' reverses it.","A":"Text 2 offers a different cause, so it is not a restatement.","B":"Text 2 refines the cause; it does not refute that dogs read gestures, so 'completely refutes' overstates the relationship."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"İlişkiyi yanlış kurma"},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections","why_wrong":{"A":"Text 2 adds a new factor, so it does not merely repeat Text 1.","B":"Text 2 agrees with Text 1, so 'flatly contradicts' mischaracterizes the relationship.","C":"Text 2 grants the press a role, so 'no role' reverses it."},"lesson":3,"id":"u2-l3-f3-02","passage":"Text 1: A historian argues that the printing press caused the rapid spread of new ideas in Europe.\n\nText 2: The press mattered, a second historian agrees, but adds that without rising literacy the presses would have had few readers to reach.","why_correct":"Text 2 agrees the press mattered but adds literacy as a needed condition. Choice A names that agree-and-add relationship.","correct":"D","choices":{"A":"Text 2 simply repeats Text 1's point about the press.","B":"Text 2 flatly contradicts Text 1's claim about the press.","D":"Text 2 agrees with Text 1 but adds a condition Text 1 leaves out.","C":"Text 2 argues that the press had no role in spreading ideas."},"unit":2,"choice_families":{"C":"İlişki yönü ters","B":"İlişkiyi yanlış kurma","A":"İlişkiyi yanlış kurma"}},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections","why_wrong":{"B":"Text 2 judges the pressure positively, so 'fully agrees' with the harm claim mischaracterizes it.","D":"Text 2 describes a real effect, so 'no effect' reverses it.","C":"Text 2 accepts that streaming shapes songwriting; it disputes the evaluation, not the effect."},"lesson":3,"id":"u2-l3-f3-03","correct":"A","passage":"Text 1: A critic argues that streaming has hurt music by pushing artists to write short, catchy openings that grab listeners in seconds.\n\nText 2: The same pressure, another critic suggests, has sharpened songwriting, forcing artists to cut filler and make every second count.","why_correct":"Both note the same pressure to grab listeners fast but judge it oppositely, harm versus sharpening. Choice A names that relationship.","choices":{"B":"Text 2 fully agrees with Text 1 that streaming has hurt music.","A":"The two texts draw opposite evaluations from the same observed pressure.","C":"Text 2 denies that streaming affects how songs are written.","D":"Text 2 argues that streaming has no effect on artists at all."},"choice_families":{"B":"İlişkiyi yanlış kurma","D":"İlişki yönü ters","C":"İlişki yönü ters"},"unit":2},{"why_correct":"Text 2 grants the general rule but notes an exception with invasive plants. Choice A names the rule-and-exception relationship.","passage":"Text 1: A biologist argues that a forest recovers fastest when left completely untouched after a fire.\n\nText 2: In many forests that is true, a second biologist allows, but where invasive plants move in first, some human intervention speeds recovery rather than slowing it.","correct":"B","id":"u2-l3-f3-04","unit":2,"choice_families":{"A":"İlişkiyi yanlış kurma","C":"İlişkiyi yanlış kurma","D":"İlişki yönü ters"},"choices":{"A":"Text 2 rejects Text 1's claim entirely.","B":"Text 2 accepts Text 1's claim as a general rule but marks an exception to it.","D":"Text 2 argues that forests never recover after fire.","C":"Text 2 restates Text 1's claim without change."},"lesson_name":"Cross-Text Connections","target_family":"İlişkiyi yanlış kurma","stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson":3,"why_wrong":{"D":"Text 2 discusses recovery, so 'never recover' reverses it.","C":"Text 2 adds an exception, so it does not merely restate Text 1.","A":"Text 2 accepts the rule generally, so 'rejects entirely' overstates the disagreement."}},{"why_wrong":{"D":"Text 2 never argues bilingualism is harmful.","A":"Text 2 weakens the claim, so it does not confirm it 'exactly.'","B":"Text 2 says the advantage is not absent, so 'no advantage whatsoever' misstates it."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"İlişkiyi yanlış kurma","choices":{"B":"Text 2 shows that bilingual children have no advantage whatsoever.","A":"Text 2 confirms Text 1's claim exactly as stated.","C":"Text 2 tempers the strength of Text 1's claim rather than overturning it.","D":"Text 2 argues that bilingualism harms children's thinking."},"choice_families":{"D":"İlişki yönü ters","A":"İlişkiyi yanlış kurma","B":"İlişkiyi yanlış kurma"},"unit":2,"id":"u2-l3-f3-05","correct":"C","why_correct":"Text 2 says the advantage is small and uneven but 'not absent,' tempering rather than overturning Text 1. Choice A fits.","passage":"Text 1: A researcher argues that bilingual children have a cognitive advantage in switching between tasks.\n\nText 2: A second researcher reports that when studies are combined, the advantage is small and does not appear in every group, though it is not absent."},{"choices":{"C":"Text 2 agrees that harvests were the single main cause.","D":"Text 2 accepts Text 1's factor but ranks a different one as more important.","B":"Text 2 rejects the idea that climate mattered at all.","A":"Text 2 argues that the city never actually grew."},"unit":2,"choice_families":{"C":"İlişkiyi yanlış kurma","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"id":"u2-l3-f3-06","passage":"Text 1: A scholar argues that a warm climate spurred the ancient city's growth by producing rich harvests.\n\nText 2: Climate helped, a second scholar agrees, but trade routes through the city, she argues, did more to drive its growth than harvests alone.","why_correct":"Text 2 grants climate a role but ranks trade above harvests. Choice A names that reprioritizing relationship.","correct":"D","why_wrong":{"C":"Text 2 puts trade above harvests, so agreeing harvests were the main cause mischaracterizes it.","A":"Both texts assume the city grew.","B":"Text 2 says climate helped, so 'mattered not at all' reverses it."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections"},{"choices":{"B":"Text 2 fully endorses Text 1's prediction about drivers.","A":"Text 2 questions the mechanism Text 1 relies on rather than the goal it shares.","C":"Text 2 argues that reducing traffic is not worth pursuing.","D":"Text 2 claims that free transit would have no riders."},"choice_families":{"B":"İlişki yönü ters","C":"Metin dışı çıkarım","D":"İlişki yönü ters"},"unit":2,"id":"u2-l3-f3-07","correct":"A","passage":"Text 1: A policy expert argues that free public transit would cut traffic by luring drivers out of their cars.\n\nText 2: Free transit mostly attracts people who already walked or biked, a second expert finds, so it fills buses without taking many cars off the road.","why_correct":"Text 2 disputes the mechanism (that free transit pulls drivers from cars) while sharing the traffic goal. Choice A fits.","why_wrong":{"C":"Text 2 does not argue the goal is not worth pursuing; it questions the method.","D":"Text 2 says buses fill up, so 'no riders' contradicts it.","B":"Text 2 disputes the prediction, so 'fully endorses' reverses it."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections"},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"İlişkiyi yanlış kurma","why_wrong":{"D":"Text 2 finds a place for laptops, so 'no place' reverses it.","C":"Text 2 supports structured use, not a ban.","A":"Text 2 shows laptops can help, so 'always lower grades' reverses it."},"lesson":3,"id":"u2-l3-f3-08","why_correct":"Text 2 conditions the harm on usage, showing benefit with structured tasks. Choice A names that conditional relationship.","passage":"Text 1: An educator argues that laptops in classrooms distract students and lower their grades.\n\nText 2: The harm depends on how laptops are used, a second educator argues; when tied to structured tasks, they raised engagement in her study rather than lowering it.","correct":"B","choices":{"A":"Text 2 agrees that laptops always lower grades.","B":"Text 2 makes Text 1's blanket claim conditional on how the tool is used.","D":"Text 2 claims laptops have no place in education.","C":"Text 2 argues that laptops should be banned from classrooms."},"unit":2,"choice_families":{"D":"İlişki yönü ters","C":"İlişki yönü ters","A":"İlişki yönü ters"}},{"choices":{"C":"The texts reach contrary conclusions about how deadlines affect creative work.","D":"Text 2 claims that deadlines have no effect on artists.","B":"Text 2 agrees that deadlines kill creativity.","A":"Text 2 argues that creative work needs no structure at all."},"unit":2,"choice_families":{"A":"Metin dışı çıkarım","B":"İlişki yönü ters","D":"İlişki yönü ters"},"id":"u2-l3-f3-09","passage":"Text 1: A writer argues that deadlines kill creativity by forcing work before ideas are ripe.\n\nText 2: For many artists the opposite holds, a second writer notes; a firm deadline ends endless tinkering and pushes the work to completion.","why_correct":"Text 1 says deadlines harm creativity; Text 2 says they help finish work, a contrary conclusion. Choice A names it.","correct":"C","why_wrong":{"D":"Text 2 describes a real effect, so 'no effect' reverses it.","A":"Text 2 praises the structure a deadline gives, so 'needs no structure' misstates it.","B":"Text 2 defends deadlines, so agreeing they kill creativity reverses it."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections"},{"choices":{"C":"Text 2 agrees that recovery is quick and uniform everywhere.","D":"Text 2 confirms Text 1's effect while complicating how reliably it occurs.","B":"Text 2 denies that wolves affect deer or forests.","A":"Text 2 argues that wolves should be removed from all parks."},"choice_families":{"A":"Metin dışı çıkarım","B":"İlişki yönü ters","C":"İlişkiyi yanlış kurma"},"unit":2,"id":"u2-l3-f3-10","correct":"D","passage":"Text 1: A conservationist argues that reintroducing wolves restores balance by controlling deer that would otherwise strip young forests.\n\nText 2: The effect is real but slower and patchier than often claimed, a second conservationist reports; in some valleys the forests recovered, in others they did not.","why_correct":"Text 2 confirms the effect is real but says it is slower and patchier, complicating reliability. Choice A fits.","why_wrong":{"A":"Neither text calls for removing wolves.","B":"Text 2 calls the effect 'real,' so denying it reverses the stance.","C":"Text 2 stresses uneven recovery, so 'quick and uniform' mischaracterizes it."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"İlişkiyi yanlış kurma","lesson_name":"Cross-Text Connections"},{"choice_families":{"C":"İlişki yönü ters","B":"İlişki yönü ters","A":"Metin dışı çıkarım"},"unit":2,"choices":{"A":"By arguing that all children should be required to study music.","B":"By claiming that music training harms children's memory.","D":"By noting that the benefit Text 1 describes may not last without continued training.","C":"By agreeing that early music training permanently improves memory."},"correct":"D","why_correct":"Text 2 says the gains fade without continued training, qualifying Text 1's benefit. Choice A fits.","passage":"Text 1: A researcher argues that early exposure to music training improves children's memory.\n\nText 2: A second researcher finds the memory gains fade within a few years unless the training continues.","id":"u2-l3-f4-01","lesson":3,"why_wrong":{"A":"Neither text argues music should be required for all children.","B":"Text 2 does not say training harms memory; it says the gains fade without practice.","C":"Text 2 shows the benefit is not permanent, so 'permanently improves' reverses it."},"lesson_name":"Cross-Text Connections","target_family":"Metin dışı çıkarım","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?"},{"choices":{"C":"By agreeing that density reduces driving in all cases.","D":"By claiming that transit systems can never be made reliable.","B":"By concluding that dense housing should never be built.","A":"By arguing that the benefit depends on the quality of the transit service."},"unit":2,"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","B":"Metin dışı çıkarım"},"id":"u2-l3-f4-02","why_correct":"Text 2 conditions the benefit on frequent, reliable transit. Choice A fits.","passage":"Text 1: A planner argues that dense housing near transit reduces the distances people must drive.\n\nText 2: Density helps only where the transit is frequent and reliable, a second planner notes; where service is poor, residents drive as much as anyone.","correct":"A","why_wrong":{"C":"Text 2 limits the benefit to good-service areas, so 'in all cases' reverses it.","D":"Text 2 assumes transit can be reliable; it never claims the opposite.","B":"Text 2 supports density where transit is good; it never says density should never be built."},"lesson":3,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson_name":"Cross-Text Connections","target_family":"Metin dışı çıkarım"},{"choices":{"D":"By claiming that films are always better than the novels they adapt.","C":"By agreeing that film cannot show a character's inner life.","A":"By concluding that novels should never be adapted into films.","B":"By arguing that film has its own means of conveying what Text 1 says is lost."},"choice_families":{"A":"Metin dışı çıkarım","D":"Metin dışı çıkarım","C":"İlişki yönü ters"},"unit":2,"id":"u2-l3-f4-03","correct":"B","passage":"Text 1: A critic argues that adapting a novel to film inevitably loses the book's inner life, its access to a character's private thoughts.\n\nText 2: Skilled filmmakers, a second critic replies, convey inner life through image and sound, giving in pictures what the novel gives in words.","why_correct":"Text 2 argues film conveys inner life through image and sound, countering Text 1's 'loss.' Choice A fits.","why_wrong":{"D":"Text 2 says film has its own means, not that it is always better.","C":"Text 2 argues film can show inner life, so 'cannot' reverses it.","A":"Text 2 defends adaptation; it never says novels should not be adapted."},"lesson":3,"stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","target_family":"Metin dışı çıkarım","lesson_name":"Cross-Text Connections"},{"target_family":"Metin dışı çıkarım","lesson_name":"Cross-Text Connections","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","lesson":3,"why_wrong":{"D":"Neither text suggests removing trees.","A":"Text 2 limits a single tree's effect, so agreeing it cools a city misstates it.","B":"Text 2 says one tree 'helps a little,' so denying any cooling reverses it."},"passage":"Text 1: A scientist argues that a single tree can cool a street measurably on a hot day.\n\nText 2: One tree helps a little, a second scientist notes, but only a connected canopy across many streets produces cooling large enough to feel citywide.","why_correct":"Text 2 grants a small effect from one tree but says citywide cooling needs a connected canopy. Choice A fits.","correct":"C","id":"u2-l3-f4-04","unit":2,"choice_families":{"A":"İlişkiyi yanlış kurma","B":"İlişki yönü ters","D":"Metin dışı çıkarım"},"choices":{"C":"By arguing that a citywide effect requires far more than a single tree.","D":"By claiming that cities should remove their existing trees.","B":"By denying that trees provide any cooling at all.","A":"By agreeing that one tree cools an entire city."}},{"why_wrong":{"C":"Text 2 shows some reviews are planted, so 'always honest' reverses it.","A":"Neither text claims consumers do not read reviews.","B":"Text 2 warns of a drawback; it never calls for banning reviews."},"lesson":3,"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"Metin dışı çıkarım","lesson_name":"Cross-Text Connections","choices":{"D":"Text 2 points to a drawback of the very anonymity Text 1 praises.","C":"Text 2 agrees that anonymous reviews are always honest.","A":"Text 2 claims that consumers never read online reviews.","B":"Text 2 concludes that online reviews should be banned."},"choice_families":{"C":"İlişki yönü ters","A":"Metin dışı çıkarım","B":"Metin dışı çıkarım"},"unit":2,"id":"u2-l3-f4-05","correct":"D","passage":"Text 1: A scholar argues that anonymous online reviews give consumers honest, unfiltered opinions.\n\nText 2: Anonymity also invites abuse, a second scholar warns; without accountability, some reviews are planted by sellers or rivals rather than real customers.","why_correct":"Text 2 notes that anonymity, which Text 1 praises, also invites fake reviews. Choice A fits."},{"lesson":3,"why_wrong":{"D":"Text 2 says the gap narrows, not that solid walls waste more.","C":"Text 2 shows glass can be made more efficient, so 'cannot' reverses it.","B":"Text 2 defends improved glass; it never says no glass towers should be built."},"target_family":"Metin dışı çıkarım","lesson_name":"Cross-Text Connections","stem":"Based on the texts, how would the author of Text 2 most likely respond to the view presented in Text 1?","choice_families":{"B":"Metin dışı çıkarım","D":"Metin dışı çıkarım","C":"İlişki yönü ters"},"unit":2,"choices":{"A":"By arguing that technology has reduced the problem Text 1 describes.","B":"By concluding that no more glass towers should be built.","D":"By claiming that solid walls always waste more energy than glass.","C":"By agreeing that glass towers cannot be made efficient."},"correct":"A","passage":"Text 1: An architect argues that glass towers waste energy, letting heat pour in through their windows.\n\nText 2: New coatings and shading, a second architect notes, now let glass buildings block much of that heat, narrowing the gap with solid walls.","why_correct":"Text 2 says coatings and shading now reduce the heat problem Text 1 raises. Choice A fits.","id":"u2-l3-f4-06"},{"stem":"Which choice best describes the relationship between Text 1 and Text 2?","target_family":"Metin dışı çıkarım","lesson_name":"Cross-Text Connections","why_wrong":{"A":"Both texts assume the movement succeeded; Text 2 explains it differently.","C":"Text 2 downplays the single leader, so agreeing reverses it.","D":"Neither text says the leader opposed the movement."},"lesson":3,"id":"u2-l3-f4-07","correct":"B","passage":"Text 1: A historian argues that a single charismatic leader was the main force behind the movement's success.\n\nText 2: Focusing on one leader, a second historian cautions, hides the organizers, writers, and local groups whose steady work made the movement possible.","why_correct":"Text 2 broadens the account by crediting organizers and local groups, not just one leader. Choice A fits.","choices":{"C":"Text 2 agrees that a single leader was the main force.","D":"Text 2 claims the leader opposed the movement he led.","B":"Text 2 broadens the account Text 1 centers on one person.","A":"Text 2 argues that the movement had no success to explain."},"choice_families":{"D":"Metin dışı çıkarım","C":"İlişki yönü ters","A":"Metin dışı çıkarım"},"unit":2},{"id":"u2-l3-f4-08","why_correct":"Text 2 notes anxiety and dropout for some users, undercutting Text 1's benefit. Choice A fits.","passage":"Text 1: A doctor argues that wearable trackers improve health by making people aware of how little they move.\n\nText 2: For some users, a second doctor notes, the constant numbers breed anxiety, and a few abandon exercise once the novelty and the guilt wear off.","correct":"C","choices":{"C":"Text 2 identifies an unintended effect that can undercut Text 1's benefit.","D":"Text 2 claims that trackers cannot measure movement.","B":"Text 2 concludes that no one should exercise at all.","A":"Text 2 agrees that trackers help every user equally."},"unit":2,"choice_families":{"D":"Metin dışı çıkarım","A":"İlişkiyi yanlış kurma","B":"Metin dışı çıkarım"},"stem":"Which choice best describes the relationship between Text 1 and Text 2?","lesson_name":"Cross-Text Connections","target_family":"Metin dışı çıkarım","why_wrong":{"A":"Text 2 shows effects vary, so 'help every user equally' misstates it.","B":"Text 2 never argues against exercise itself.","D":"Neither text disputes that trackers measure movement."},"lesson":3},{"choices":{"C":"By agreeing that texting makes students' writing sloppier.","D":"By citing findings that contradict Text 1's claim of harm.","B":"By concluding that texting should be banned for young people.","A":"By claiming that formal writing no longer matters."},"un
