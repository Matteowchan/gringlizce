function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// NOTE: content strings intentionally allow inline <b>/<i> tags authored above.

function renderBlock(b){
  if(b.t==='p') return '<p>'+b.v+'</p>';
  if(b.t==='h3') return '<h3>'+b.v+'</h3>';
  if(b.t==='ul') return '<ul>'+b.v.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if(b.t==='qs') return '<ol class="oz-qs">'+b.v.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
  if(b.t==='box') return '<div class="oz-box"><div class="bt">'+b.bt+'</div><ul>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
  if(b.t==='qa') return '<div class="oz-qa"><div class="q">'+b.q+'</div><div class="a">'+b.a+'</div></div>';
  if(b.t==='hw') return '<div class="oz-hw"><b>Ödev.</b> '+b.v+'</div>';
  if(b.t==='note') return '<div class="oz-note">'+b.v+'</div>';
  if(b.t==='src') return '<div class="oz-src">'+b.v+'</div>';
  if(b.t==='video') return '<div class="oz-video"><iframe src="https://www.youtube-nocookie.com/embed/'+b.id+'?rel=0" title="TED" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
  if(b.t==='link') return '<a class="oz-link" href="'+b.url+'" target="_blank" rel="noopener noreferrer">'+b.label+' ↗</a>';
  return '';
}

function render(){
  var toc=document.getElementById('ozToc');
  var host=document.getElementById('ozLessons');
  var tocHtml='', lesHtml='';
  LESSONS.forEach(function(L,i){
    var sk=SKILL[L.skill];
    tocHtml+='<a href="#les'+L.no+'">'+L.no+'. '+esc(L.title.split(' — ')[0])+'</a>';
    var body='<div class="oz-obj">'+L.objective+'</div>'+
             '<div class="oz-time">⏱ '+L.timing+'</div>'+
             L.blocks.map(renderBlock).join('');
    lesHtml+='<details class="oz-les" id="les'+L.no+'"'+(i===0?' open':'')+'>'+
      '<summary class="oz-sum">'+
        '<span class="oz-no">'+L.no+'</span>'+
        '<span class="t"><b>'+esc(L.title)+'</b></span>'+
        '<span class="oz-badge" style="background:'+sk.color+'">'+sk.label+'</span>'+
        '<span class="oz-chev">›</span>'+
      '</summary>'+
      '<div class="oz-body">'+body+'</div>'+
    '</details>';
  });
  toc.innerHTML=tocHtml;
  host.innerHTML=lesHtml;
  document.getElementById('ozLoading').style.display='none';
  document.getElementById('ozWrap').style.display='';
  // TOC click opens target details
  toc.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click',function(){
      var id=a.getAttribute('href').slice(1);
      var d=document.getElementById(id); if(d) d.open=true;
    });
  });
}
</script>
