- It was used for gladiatorial contests and public spectacles.\n- Parts of it were later damaged by earthquakes.", "stem": "The student wants to describe the Colosseum's capacity and use. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Colosseum drew visitors from across the entire Roman Empire for its games.", "B": "The Colosseum, built by thousands of enslaved workers, held some 50,000 spectators.", "C": "The Colosseum, which held some 50,000 spectators, was used for gladiatorial contests and public spectacles.", "D": "The Colosseum remains the most visited monument in Italy today."}, "correct": "C", "choice_families": {"B": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is capacity and use; A pairs the 50,000 figure with the contests and spectacles, both from the notes.", "why_wrong": {"B": "The claim about enslaved workers building it appears nowhere in the notes.", "D": "The claim that it is Italy's most visited monument today is not in the notes.", "A": "The claim that visitors came from across the empire is not in the notes."}}, {"id": "u3-l2-f3-02", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Bamboo is one of the fastest-growing plants on Earth.\n- Some species can grow nearly a meter in a single day.\n- Bamboo is technically a type of grass.\n- It is used for construction, furniture, and food.", "stem": "The student wants to emphasize how fast bamboo grows. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Bamboo can grow quickly even in poor, rocky soil.", "B": "Bamboo grows so fast that entire forests can appear within a few months.", "C": "Bamboo grows faster than any tree in the tropical rainforest.", "D": "Bamboo is among the fastest-growing plants on Earth, with some species growing nearly a meter in a single day."}, "correct": "D", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is bamboo's growth speed; A joins the 'fastest-growing' claim with the meter-a-day figure, both in the notes.", "why_wrong": {"B": "The claim about whole forests appearing in months is not in the notes.", "C": "The comparison to rainforest trees appears nowhere in the notes.", "A": "The claim about poor, rocky soil is not in the notes."}}, {"id": "u3-l2-f3-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The human brain contains around 86 billion neurons.\n- Neurons communicate through electrical and chemical signals.\n- The brain uses about 20 percent of the body's energy.\n- It makes up only about 2 percent of body weight.", "stem": "The student wants to emphasize how much energy the brain uses relative to its size. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Though it is only about 2 percent of body weight, the brain uses roughly 20 percent of the body's energy.", "B": "The brain uses more energy than any other organ in the human body.", "C": "The brain's energy demand rises sharply when a person is solving problems.", "D": "The brain burns most of its energy while a person sleeps."}, "correct": "A", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi"}, "why_correct": "The goal is energy relative to size; A pairs the 2 percent weight with the 20 percent energy, both from the notes.", "why_wrong": {"B": "The claim that it uses more than any other organ is not in the notes.", "C": "The claim about problem-solving is not in the notes.", "D": "The claim about sleep is not in the notes."}}, {"id": "u3-l2-f3-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Mount Everest is the highest mountain above sea level, at 8,849 meters.\n- Its summit was first reached in 1953.\n- Climbers face extreme cold and thin air near the top.\n- The 'death zone' above 8,000 meters has too little oxygen to survive for long.", "stem": "The student wants to explain the dangers climbers face near Everest's summit. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Near the summit, sudden avalanches are the leading cause of climber deaths.", "B": "Near the summit, climbers face extreme cold and, in the 'death zone' above 8,000 meters, air too thin to survive for long.", "C": "Climbers near the top must also contend with fierce, unpredictable winds.", "D": "The route to the summit is crowded with hundreds of climbers each season."}, "correct": "B", "choice_families": {"C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is the dangers near the summit; A joins the extreme cold with the low-oxygen death zone, both from the notes.", "why_wrong": {"C": "The claim about fierce winds is not in the notes.", "D": "The claim about crowding is not in the notes.", "A": "The claim about avalanches being the leading cause of death is not in the notes."}}, {"id": "u3-l2-f3-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Amazon rainforest produces a large share of the world's oxygen.\n- It is home to millions of species of plants and animals.\n- It spans nine countries in South America.\n- Large areas are cleared each year for farming.", "stem": "The student wants to convey the biological diversity of the Amazon. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Amazon shelters thousands of species still unknown to science.", "B": "The Amazon is home to more species of insects than anywhere else on Earth.", "C": "The Amazon, spanning nine countries, is home to millions of species of plants and animals.", "D": "The Amazon's rivers alone contain over 3,000 species of fish."}, "correct": "C", "choice_families": {"B": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is biological diversity; A pairs the nine-country span with the millions of species, both from the notes.", "why_wrong": {"B": "The claim about insects being the most anywhere is not in the notes.", "D": "The figure of 3,000 fish species is not in the notes.", "A": "The claim about thousands of unknown species is not in the notes."}}, {"id": "u3-l2-f3-06", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Sahara is the largest hot desert in the world.\n- It covers much of North Africa.\n- Daytime temperatures can exceed 45 degrees Celsius.\n- At night, temperatures can drop below freezing.", "stem": "The student wants to emphasize the Sahara's extreme temperature swings. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Sahara was once a green landscape with lakes and rivers.", "B": "In the Sahara, sandstorms can raise temperatures even higher during the day.", "C": "The Sahara's temperature swings are the widest of any desert on Earth.", "D": "In the Sahara, daytime temperatures can top 45 degrees Celsius, yet at night they can fall below freezing."}, "correct": "D", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is the temperature swing; A pairs the 45-degree days with the below-freezing nights, both from the notes.", "why_wrong": {"B": "The claim about sandstorms raising temperatures is not in the notes.", "C": "The claim that its swings are the widest of any desert is not in the notes.", "A": "The claim about a once-green Sahara is not in the notes."}}, {"id": "u3-l2-f3-07", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Eiffel Tower was completed in 1889.\n- It stands about 330 meters tall.\n- It was built for the World's Fair in Paris.\n- It was meant to be temporary but was kept for its use as a radio antenna.", "stem": "The student wants to explain why the Eiffel Tower was not torn down. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Though built as a temporary structure for the 1889 World's Fair, the Eiffel Tower was kept for its use as a radio antenna.", "B": "The Eiffel Tower was spared because Parisians had grown to love its silhouette.", "C": "The Eiffel Tower was kept because tearing down such a tall structure was too costly.", "D": "The Eiffel Tower survived because it quickly became a symbol of France."}, "correct": "A", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi"}, "why_correct": "The goal is why it was not torn down; A joins its temporary purpose with its retention as a radio antenna, both from the notes.", "why_wrong": {"B": "The claim that Parisians grew to love it is not in the notes.", "C": "The claim about demolition cost is not in the notes.", "D": "The claim that it became a symbol of France is not in the notes."}}, {"id": "u3-l2-f3-08", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Penguins are flightless birds.\n- Their wings have evolved into flippers for swimming.\n- Most species live in the Southern Hemisphere.\n- They huddle together in large groups to stay warm.", "stem": "The student wants to explain how penguins are adapted for life in water. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Penguins have a thick layer of blubber that keeps them warm in icy water.", "B": "Though penguins cannot fly, their wings have evolved into flippers that make them strong swimmers.", "C": "Penguins can dive to depths of more than 500 meters in search of food.", "D": "Penguins have webbed feet that help them steer while swimming."}, "correct": "B", "choice_families": {"C": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is adaptation for water; A joins their flightlessness with the flippers that make them swimmers, both from the notes.", "why_wrong": {"C": "The diving-depth figure is not in the notes.", "D": "The claim about webbed feet is not in the notes.", "A": "The claim about blubber is not in the notes."}}, {"id": "u3-l2-f3-09", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- Honey never spoils if it is sealed and stored properly.\n- Its low moisture and high acidity stop bacteria from growing.\n- Archaeologists have found edible honey in ancient tombs.\n- Bees make honey from the nectar of flowers.", "stem": "The student wants to explain why honey does not spoil. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Honey does not spoil because it is heated to high temperatures before storage.", "B": "Honey does not spoil because bees add a natural preservative as they make it.", "C": "Honey does not spoil because its low moisture and high acidity keep bacteria from growing.", "D": "Honey does not spoil because sugar itself is a poison to most microbes."}, "correct": "C", "choice_families": {"B": "Notta olmayan bilgi", "D": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is why honey does not spoil; A uses the low moisture and high acidity from the notes.", "why_wrong": {"B": "The claim about a preservative added by bees is not in the notes.", "D": "The claim that sugar poisons microbes is not in the notes.", "A": "The claim about heating is not in the notes."}}, {"id": "u3-l2-f3-10", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Notta olmayan bilgi", "passage": "While researching a topic, a student took the following notes:\n\n- The Panama Canal connects the Atlantic and Pacific Oceans.\n- It opened in 1914.\n- It uses a system of locks to raise and lower ships.\n- It saves ships from the long journey around South America.", "stem": "The student wants to explain the canal's main benefit to shipping. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Panama Canal became the busiest waterway in the world after it opened.", "B": "The Panama Canal cut the cost of shipping goods worldwide by nearly half.", "C": "The Panama Canal allowed the largest cargo ships of its era to pass with ease.", "D": "By connecting the Atlantic and Pacific, the Panama Canal spares ships the long voyage around South America."}, "correct": "D", "choice_families": {"B": "Notta olmayan bilgi", "C": "Notta olmayan bilgi", "A": "Notta olmayan bilgi"}, "why_correct": "The goal is the main benefit; A joins the ocean connection with sparing the long voyage, both from the notes.", "why_wrong": {"B": "The claim about halving shipping cost is not in the notes.", "C": "The claim about the largest ships is not in the notes.", , is best known for the subject's enigmatic smile.", "B": "The Mona Lisa hangs in the Louvre, protected behind bulletproof glass.", "C": "The Mona Lisa is protected behind bulletproof glass.", "D": "The Mona Lisa hangs in the Louvre in Paris."}, "correct": "A", "choice_families": {"B": "Yanlış vurgu", "C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor"}, "why_correct": "The goal is artistic fame; A joins the painter with the enigmatic smile, the source of its acclaim.", "why_wrong": {"B": "This emphasizes its location and security, not what makes it artistically famous.", "C": "This emphasizes its protection, not its artistry.", "D": "This emphasizes its location alone."}}, {"id": "u3-l2-f4-03", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Yanlış vurgu", "passage": "While researching a topic, a student took the following notes:\n\n- Antarctica is the coldest continent on Earth.\n- It holds about 70 percent of the world's fresh water as ice.\n- No permanent human population lives there.\n- Scientists visit to conduct research.", "stem": "The student wants to emphasize Antarctica's importance as a water reserve. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "Antarctica is the coldest continent, with no permanent human population.", "B": "Antarctica holds about 70 percent of the world's fresh water, locked away as ice.", "C": "Antarctica has no permanent human population.", "D": "Scientists visit Antarctica to conduct research."}, "correct": "B", "choice_families": {"C": "Amacı karşılamıyor", "D": "Amacı karşılamıyor", "A": "Yanlış vurgu"}, "why_correct": "The goal is its role as a water reserve; A foregrounds the 70 percent fresh-water figure.", "why_wrong": {"C": "This emphasizes the absence of people.", "D": "This emphasizes research visits, not the water reserve.", "A": "This emphasizes cold and lack of population, not the water reserve."}}, {"id": "u3-l2-f4-04", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Yanlış vurgu", "passage": "While researching a topic, a student took the following notes:\n\n- The cheetah is the fastest land animal.\n- It can reach speeds of about 110 kilometers per hour.\n- It can sustain top speed only for short bursts.\n- It hunts mainly by day.", "stem": "The student wants to emphasize the cheetah's remarkable speed. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The cheetah hunts mainly during the day.", "B": "The cheetah can hold its top speed only for short bursts.", "C": "The cheetah is the fastest land animal, reaching speeds of about 110 kilometers per hour.", "D": "The cheetah can sustain its fastest pace only briefly."}, "correct": "C", "choice_families": {"B": "Yanlış vurgu", "D": "Yanlış vurgu", "A": "Amacı karşılamıyor"}, "why_correct": "The goal is the cheetah's speed; A joins its status as fastest with the 110 km/h figure.", "why_wrong": {"B": "This emphasizes the limit on its speed, not the speed itself.", "D": "This emphasizes the brevity of its top pace rather than the speed.", "A": "This emphasizes its hunting schedule, not its speed."}}, {"id": "u3-l2-f4-05", "unit": 3, "lesson": 2, "lesson_name": "Rhetorical Synthesis", "target_family": "Yanlış vurgu", "passage": "While researching a topic, a student took the following notes:\n\n- The Rosetta Stone is inscribed in three scripts.\n- The same text appears in hieroglyphic, Demotic, and Greek.\n- Scholars used the Greek to decode the hieroglyphs.\n- It was discovered in Egypt in 1799.", "stem": "The student wants to emphasize why the stone was key to decoding hieroglyphs. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": {"A": "The Rosetta Stone was discovered by soldiers during a military campaign.", "B": "The Rosetta Stone was discovered in Egypt in 1799.", "C": "The   window.scrollTo(0,0);
}
function pick(x){if(S.locked)return;S.picked=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('submit').disabled=false;}
function submit(){
  if(!S.picked||S.locked)return;S.locked=true;const q=S.activeQ,c=q.correct,p=S.picked;
  app.querySelectorAll('.opt').forEach(o=>{o.classList.add('locked');if(o.dataset.l===c)o.classList.add('correct');if(o.dataset.l===p&&p!==c)o.classList.add('wrong');});
  const fb=document.getElementById('fb');
  if(p===c){fb.className='fb ok';fb.innerHTML=`<b>Doğru.</b> ${esc(q.why_correct)}`;
    if(S.remedFor){lp().family[S.remedFor]='mastered';Progress.saveFamily(D.unit,curL().no,S.remedFor,'mastered');}renderRail();
    fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="advance">Devam</button></div>`);
  }else{const fam=q.choice_families[p];const target=S.remedFor||fam;
    lp().family[target]='shaky';Progress.saveFamily(D.unit,curL().no,target,'shaky');if(!S.remedFor){S.remedFor=fam;S.remedCount=0;}renderRail();
    fb.className='fb no';fb.innerHTML=`<b>Yanlış.</b> ${esc(q.why_wrong[p])}<div class="tagline">Bu bir "${esc(sf(fam))}" hatasi. Ayni tuzagi calisalim.</div>`;
    const nq=unseen(S.remedFor);
    if(S.remedCount>=2||!nq){fb.insertAdjacentHTML('beforeend',`<div class="tagline">Iki denemede tutmadi. Bu tuzagi konu anlatimindan tekrar oku.</div><div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="advance">Sonraki soru</button></div>`);}
    else{fb.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn" data-action="remed">Bu tuzaktan yeni soru</button></div>`);}
  }
}
function serveRemed(){S.remedCount++;const nq=unseen(S.remedFor);if(!nq){advance();return;}showQ(nq,'remed');}
function advance(){if(S.remedFor){S.remedFor=null;S.remedCount=0;}S.idx++;nextMain();}
function doneView(){
  lp().phaseDone.practice=true;Progress.saveState(D.unit,curL().no,lp().seen.size);setMode('practice');renderRail();
  const rows=curL().families.map(f=>{const st=lp().family[f];const cls=st==='shaky'?'warn':'good';const lab=st==='shaky'?'tekrar gerek':'ogrenildi';
    return `<div class="mrow"><span>${esc(sf(f))}</span><span class="st ${cls}">${lab}</span></div>`;}).join('');
  const nextL = S.cur<D.lessons.length-1 ? `<button class="btn" data-action="goto" data-lesson="${S.cur+1}">Sonraki ders &rsaquo;</button>`:'';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ders ${curL().no} . Sonuc</div><h1>Ders tamam</h1></div>
   <div class="pad"><p class="tagline" style="text-align:center;margin-top:6px">Bu derste ${lp().seen.size} soru gordun</p>
   <h2>Aile bazında durum</h2><div class="rule"></div>${rows}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn ghost" data-action="start">Tekrar çalış</button>${nextL}</div></div>`;
  window.scrollTo(0,0);
}
// ===== UNIT TEST MODE =====
const TEST_N=27;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildTest(){
  const groups={};
  D.lessons.forEach(l=>{l.questions.forEach(q=>{const k=l.no+'|'+q.target_family;(groups[k]=groups[k]||[]).push(q);});});
  const keys=Object.keys(groups);
  const per=Math.max(1,Math.floor(TEST_N/keys.length));
  let picks=[]; const used=new Set();
  keys.forEach(k=>{shuffle(groups[k]).slice(0,per).forEach(q=>{picks.push(q);used.add(q.id);});});
  let guard=0;
  while(picks.length<TEST_N && guard++<keys.length*12){
    const k=keys[guard%keys.length];const extra=groups[k].find(q=>!used.has(q.id));
    if(extra){picks.push(extra);used.add(extra.id);}
  }
  return shuffle(picks).slice(0,TEST_N);
}
function startTest(){setMode('test');S.test={q:buildTest(),idx:0,pick:null,rec:[]};showTestQ();}
function showTestQ(){
  const T=S.test,q=T.q[T.idx];T.pick=null;
  main.setAttribute('data-mode','test');railEl.innerHTML=`<div class="rc"><span class="u">Unite ${D.unit}</span><div class="ut">${esc(D.unit_title)}</div><div class="tprog"><div class="tprog-l">Ünite Testi</div><div class="tprog-bar"><div class="tprog-fill" style="width:${Math.round(T.idx/T.q.length*100)}%"></div></div><div class="tprog-n">Soru ${T.idx+1} / ${T.q.length}</div></div></div>`;
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . ${esc(q.lesson_name)}</div><h1>Soru ${T.idx+1}</h1>
     <button class="backbtn" data-action="test-quit">&lsaquo; Testten cik</button></div>
   <div class="pad">
    ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
    <p class="stem">${esc(q.stem)}</p>
    <div id="opts">${L.map(x=>`<div class="opt" data-action="test-pick" data-l="${x}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" id="tnext" data-action="test-next" disabled>${T.idx===T.q.length-1?'Testi bitir':'Sonraki soru'}</button></div></div>`;
  window.scrollTo(0,0);
}
function testPick(x){const T=S.test;T.pick=x;app.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.dataset.l===x));document.getElementById('tnext').disabled=false;}
function testNext(){const T=S.test;if(!T.pick)return;const q=T.q[T.idx];T.rec.push({q,picked:T.pick,ok:T.pick===q.correct});T.idx++;if(T.idx>=T.q.length)return testResult();showTestQ();}
function testResult(){
  const T=S.test,rec=T.rec,total=rec.length,score=rec.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  // weak areas by lesson and by family
  const byLesson={},byFam={};
  rec.forEach(r=>{const ln=r.q.lesson_name,f=r.q.target_family;
    byLesson[ln]=byLesson[ln]||{ok:0,n:0};byLesson[ln].n++;if(r.ok)byLesson[ln].ok++;
    byFam[f]=byFam[f]||{ok:0,n:0};byFam[f].n++;if(r.ok)byFam[f].ok++;});
  // save to Supabase: per-family status from test performance (reuse existing table)
  Object.keys(byFam).forEach(f=>{const g=byFam[f];const st=g.ok===g.n?'mastered':'shaky';
    // find the lesson number that owns this family
    const l=D.lessons.find(L=>L.families.includes(f));if(l)Progress.saveFamily(D.unit,l.no,f,st);});
  try{if(window.logEvent)window.logEvent('unit_test_done',{unit:D.unit,score:score,total:total});}catch(e){}
  const lessonRows=Object.keys(byLesson).map(ln=>{const g=byLesson[ln];const cls=g.ok/g.n>=0.7?'good':'warn';
    return `<div class="mrow"><span>${esc(ln)}</span><span class="st ${cls}">${g.ok}/${g.n}</span></div>`;}).join('');
  const weakFams=Object.keys(byFam).filter(f=>byFam[f].ok<byFam[f].n).sort((a,b)=>(byFam[a].ok/byFam[a].n)-(byFam[b].ok/byFam[b].n));
  const famBlock=weakFams.length?`<h2>Tekrar edilecek tuzaklar</h2><div class="rule"></div>${weakFams.map(f=>`<div class="mrow"><span>${esc(f)}</span><span class="st warn">${byFam[f].ok}/${byFam[f].n}</span></div>`).join('')}`:`<p class="tagline" style="text-align:center">Hiçbir tuzak ailesinde zayıflık yok. Tebrikler.</p>`;
  const review=rec.map((r,i)=>{const q=r.q;
    return `<div class="rev ${r.ok?'ok':'no'}"><div class="rev-h" data-action="test-review" data-i="${i}"><span class="rev-ic">${r.ok?'dogru':'yanlis'}</span><span class="rev-t">Soru ${i+1} . ${esc(q.lesson_name)}</span><span class="rev-chev">+</span></div><div class="rev-body" id="rev-${i}">
      ${q.passage?`<div class="passage">${esc(q.passage).replace(/\n/g,"<br>")}</div>`:''}${tableHTML(q.table)}
      <p class="stem">${esc(q.stem)}</p>
      ${L.map(x=>`<div class="opt locked ${x===q.correct?'correct':''} ${x===r.picked&&r.picked!==q.correct?'wrong':''}"><span class="ltr">${x}</span><span>${esc(q.choices[x])}</span></div>`).join('')}
      <div class="fb ok" style="margin-top:12px"><b>Doğru cevap ${q.correct}.</b> ${esc(q.why_correct)}</div>
      ${!r.ok?`<div class="fb no" style="margin-top:8px"><b>Senin cevabin ${r.picked}.</b> ${esc(q.why_wrong[r.picked]||'')}</div>`:''}
    </div></div>`;}).join('');
  const verdict=pct>=70?'Geçtin':'Biraz daha çalışma gerek';
  app.innerHTML=`<div class="head"><div class="eyebrow">Ünite Testi . Sonuç</div><h1>${verdict}</h1></div>
   <div class="pad">
   <div class="scorewrap"><div class="scorebig">${score}<span class="scoreof">/${total}</span></div><div class="scorepct">${pct}%</div></div>
   <h2>Ders bazında</h2><div class="rule"></div>${lessonRows}
   ${famBlock}
   <h2>Soru soru inceleme</h2><div class="rule"></div><p class="tagline">Bir soruya tıkla, doğru cevabı ve açıklamayı gör.</p>${review}
   <div class="row"><button class="btn ghost" data-action="nav" data-target="lesson">Konuya dön</button><button class="btn" data-action="nav" data-target="test">Testi tekrar çöz</button></div></div>`;
  window.scrollTo(0,0);
}
function toggleReview(i){const b=document.getElementById('rev-'+i);if(b)b.classList.toggle('open');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='goto')gotoLesson(+el.dataset.lesson);
  else if(a==='start')startPractice();
  else if(a==='pick')pick(el.dataset.l);
  else if(a==='submit')submit();
  else if(a==='remed')serveRemed();
  else if(a==='advance')advance();
  else if(a==='test-pick')testPick(el.dataset.l);
  else if(a==='test-next')testNext();
  else if(a==='test-quit')lessonView();
  else if(a==='test-review')toggleReview(+el.dataset.i);
  else if(a==='nav'){const t=el.dataset.target;if(t==='lesson')lessonView();else if(t==='practice')startPractice();else if(t==='test')startTest();}});
