sson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "A linguist claims that among four languages surveyed, the one with the largest number of speakers has the fewest distinct vowel sounds, consistent with the idea that widely spoken languages tend toward simpler vowel systems.", "table": {"head": ["Language", "Speakers (millions)", "Distinct vowels"], "rows": [["L1", "95", "5"], ["L2", "40", "9"], ["L3", "12", "11"], ["L4", "28", "7"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "L1 has 95 million speakers.", "B": "L3 has 11 distinct vowels, the most of the four.", "C": "L1, with the most speakers at 95 million, has the fewest distinct vowels, at 5.", "D": "L3, with the most speakers, has the fewest distinct vowels."}, "correct": "C", "choice_families": {"B": "Doğru sayı yanlış iş", "D": "Satır sütun karışıklığı", "A": "Kıyassız tek değer"}, "why_correct": "The claim links the most speakers to the fewest vowels. L1 has the most speakers (95M) and fewest vowels (5), pairing both to support the claim.", "why_wrong": {"B": "L3's high vowel count is accurate but does not address the speakers-to-vowels link the claim makes.", "D": "L3 has the fewest speakers, not the most; this misreads the speakers column.", "A": "L1's speaker count alone offers no vowel comparison, so it does not support the claim."}}, {"id": "u1-l2-f1-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "An economist claims that among four cities, the one with the highest average commute time also has the lowest rate of car ownership, supporting the idea that long commutes push residents toward public transit.", "table": {"head": ["City", "Avg commute (min)", "Car ownership (%)"], "rows": [["Cityton", "48", "41"], ["Riverside", "33", "72"], ["Hillford", "39", "60"], ["Baymouth", "44", "55"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Riverside, with the longest commute, has the lowest car ownership.", "B": "Riverside has the highest car ownership, at 72 percent.", "C": "Cityton's average commute is 48 minutes.", "D": "Cityton, with the longest average commute at 48 minutes, has the lowest car ownership, at 41 percent."}, "correct": "D", "choice_families": {"B": "Doğru sayı yanlış iş", "C": "Kıyassız tek değer", "A": "Satır sütun karışıklığı"}, "why_correct": "The claim ties the longest commute to the lowest car ownership. Cityton has both (48 min, 41 percent), pairing the variables to support the claim.", "why_wrong": {"B": "Riverside's high car ownership is accurate but does not address the commute-to-ownership link.", "C": "Cityton's commute figure alone offers no ownership comparison, so it does not support the claim.", "A": "Riverside has the shortest commute, not the longest; this misreads the commute column."}}, {"id": "u1-l2-f1-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "A marine biologist claims that among four reef sites, the one with the warmest water has the lowest coral cover, consistent with heat stress reducing coral growth.", "table": {"head": ["Site", "Water temp (C)", "Coral cover (%)"], "rows": [["Reef A", "29.5", "22"], ["Reef B", "27.1", "58"], ["Reef C", "28.3", "41"], ["Reef D", "26.4", "66"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Reef A, with the warmest water at 29.5 C, has the lowest coral cover, at 22 percent.", "B": "Reef D has the highest coral cover, at 66 percent.", "C": "Reef A's water temperature is 29.5 C.", "D": "Reef D, with the warmest water, has the lowest coral cover."}, "correct": "A", "choice_families": {"B": "Doğru sayı yanlış iş", "C": "Kıyassız tek değer", "D": "Satır sütun karışıklığı"}, "why_correct": "The claim ties warmest water to lowest coral cover. Reef A has both (29.5 C, 22 percent), pairing the variables to support the claim.", "why_wrong": {"B": "Reef D's high coral cover is accurate but does not address the temperature-to-cover link.", "C": "Reef A's temperature alone offers no coral comparison, so it does not support the claim.", "D": "Reef D has the coolest water, not the warmest; this misreads the temperature column."}}, {"id": "u1-l2-f1-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "An archaeologist claims that among four excavation layers, the deepest layer contains the fewest metal artifacts, consistent with metalworking arriving late at the site.", "table": {"head": ["Layer", "Depth (m)", "Metal artifacts"], "rows": [["I", "1.2", "54"], ["II", "2.0", "31"], ["III", "3.1", "9"], ["IV", "2.6", "20"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Layer I contains 54 metal artifacts, the most of any layer.", "B": "Layer III, the deepest at 3.1 meters, contains the fewest metal artifacts, at 9.", "C": "Layer III lies at a depth of 3.1 meters.", "D": "Layer I, the deepest, contains the fewest metal artifacts."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Satır sütun karışıklığı", "A": "Doğru sayı yanlış iş"}, "why_correct": "The claim ties the deepest layer to the fewest metal artifacts. Layer III is deepest (3.1 m) and has the fewest artifacts (9), pairing both to support the claim.", "why_wrong": {"C": "Layer III's depth alone offers no artifact comparison, so it does not support the claim.", "D": "Layer I is the shallowest, not the deepest; this misreads the depth column.", "A": "Layer I's high artifact count is accurate but does not address the depth-to-artifacts link."}}, {"id": "u1-l2-f1-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "A sleep researcher claims that among four age groups, the group averaging the least sleep also reports the highest daytime fatigue, supporting a link between short sleep and fatigue.", "table": {"head": ["Group", "Avg sleep (hr)", "Fatigue score"], "rows": [["Teens", "6.4", "72"], ["Young adults", "7.1", "55"], ["Middle-aged", "6.8", "61"], ["Older adults", "7.5", "44"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Teens average 6.4 hours of sleep.", "B": "Older adults report the lowest fatigue score, at 44.", "C": "Teens, who average the least sleep at 6.4 hours, report the highest fatigue score, at 72.", "D": "Older adults, who average the least sleep, report the highest fatigue."}, "correct": "C", "choice_families": {"B": "Doğru sayı yanlış iş", "D": "Satır sütun karışıklığı", "A": "Kıyassız tek değer"}, "why_correct": "The claim ties the least sleep to the highest fatigue. Teens have both (6.4 hr, score 72), pairing the variables to support the claim.", "why_wrong": {"B": "Older adults' low fatigue is accurate but does not address the sleep-to-fatigue link.", "D": "Older adults average the most sleep, not the least; this misreads the sleep column.", "A": "Teens' sleep figure alone offers no fatigue comparison, so it does not support the claim."}}, {"id": "u1-l2-f1-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "A geographer claims that among four watersheds, the one with the most forest cover loses the least soil to erosion each year, consistent with forests stabilizing soil.", "table": {"head": ["Watershed", "Forest cover (%)", "Soil loss (t/ha)"], "rows": [["W1", "78", "1.1"], ["W2", "45", "4.3"], ["W3", "61", "2.6"], ["W4", "30", "6.0"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "W4, with the most forest cover, loses the least soil.", "B": "W4 loses the most soil, at 6.0 tonnes per hectare.", "C": "W1 has 78 percent forest cover.", "D": "W1, with the most forest cover at 78 percent, loses the least soil, at 1.1 tonnes per hectare."}, "correct": "D", "choice_families": {"B": "Doğru sayı yanlış iş", "C": "Kıyassız tek değer", "A": "Satır sütun karışıklığı"}, "why_correct": "The claim ties the most forest cover to the least soil loss. W1 has both (78 percent, 1.1 t/ha), pairing the variables to support the claim.", "why_wrong": {"B": "W4's high soil loss is accurate but does not address the forest-to-erosion link.", "C": "W1's forest figure alone offers no erosion comparison, so it does not support the claim.", "A": "W4 has the least forest cover, not the most; this misreads the forest column."}}, {"id": "u1-l2-f1-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "An energy analyst claims that among four solar farms, the one at the highest elevation generates the most power per panel, consistent with thinner air letting more sunlight reach the panels.", "table": {"head": ["Farm", "Elevation (m)", "Power per panel (W)"], "rows": [["F1", "320", "280"], ["F2", "1450", "365"], ["F3", "760", "310"], ["F4", "1100", "340"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "F2, at the highest elevation of 1,450 meters, generates the most power per panel, at 365 watts.", "B": "F1 generates 280 watts per panel, the least of the four.", "C": "F2 sits at an elevation of 1,450 meters.", "D": "F1, at the highest elevation, generates the most power per panel."}, "correct": "A", "choice_families": {"B": "Doğru sayı yanlış iş", "C": "Kıyassız tek değer", "D": "Satır sütun karışıklığı"}, "why_correct": "The claim ties highest elevation to most power per panel. F2 has both (1,450 m, 365 W), pairing the variables to support the claim.", "why_wrong": {"B": "F1's low output is accurate but does not address the elevation-to-power link.", "C": "F2's elevation alone offers no power comparison, so it does not support the claim.", "D": "F1 sits at the lowest elevation, not the highest; this misreads the elevation column."}}, {"id": "u1-l2-f1-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Doğru sayı yanlış iş", "passage": "A public-health researcher claims that among four districts, the one with the most clinics per resident has the shortest average wait for care, supporting a link between clinic density and shorter waits.", "table": {"head": ["District", "Clinics per 10,000", "Avg wait (days)"], "rows": [["D1", "3.1", "12"], ["D2", "5.4", "4"], ["D3", "4.0", "8"], ["D4", "2.2", "16"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "D4 has the longest average wait, at 16 days.", "B": "D2, with the most clinics per resident at 5.4 per 10,000, has the shortest average wait, at 4 days.", "C": "D2 has 5.4 clinics per 10,000 residents.", "D": "D4, with the most clinics per resident, has the shortest wait."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Satır sütun karışıklığı", "A": "Doğru sayı yanlış iş"}, "why_correct": "The claim ties the most clinics per resident to the shortest wait. D2 has both (5.4 per 10,000, 4 days), pairing the variables to support the claim.", "why_wrong": {"C": "D2's clinic density alone offers no wait comparison, so it does not support the claim.", "D": "D4 has the fewest clinics per resident, not the most; this misreads the clinics column.", "A": "D4's long wait is accurate but does not address the clinics-to-wait link."}}, {"id": "u1-l2-f2-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that of the three tested coatings, Coating B reduced water loss from the leaves more than the others did.", "table": {"head": ["Coating", "Water loss, treated (g)", "Water loss, untreated (g)"], "rows": [["A", "4.1", "5.0"], ["B", "2.3", "5.0"], ["C", "3.6", "5.0"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Under Coating B, untreated leaves lost 2.3 grams.", "B": "Treated leaves lost 2.3 grams under Coating B, the lowest of the treated values against the same 5.0-gram untreated baseline.", "C": "Treated leaves under Coating A lost 4.1 grams.", "D": "Coating C reduced water loss more than Coating B did."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Yön tersine çevrilmiş", "A": "Satır sütun karışıklığı"}, "why_correct": "The claim is that Coating B reduced loss most. Its treated leaves lost the least (2.3 g) against the common 5.0-g baseline, using the correct row and column to support the claim.", "why_wrong": {"C": "Coating A's treated value is accurate but makes no comparison, so it does not support the claim about B.", "D": "Coating C's treated loss (3.6 g) is higher than B's, so it reduced loss less, reversing the comparison.", "A": "The 2.3-gram figure belongs to treated leaves, not untreated; this swaps the columns."}}, {"id": "u1-l2-f2-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among the three regions, the northern region saw a greater rise in bird sightings from spring to summer than the others did.", "table": {"head": ["Region", "Spring sightings", "Summer sightings"], "rows": [["Northern", "120", "210"], ["Central", "150", "190"], ["Southern", "90", "140"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The central region recorded 190 summer sightings.", "B": "In the northern region, sightings fell from 210 in spring to 120 in summer.", "C": "In the northern region, sightings rose from 120 in spring to 210 in summer, a gain of 90, the largest of the three.", "D": "The southern region saw a greater rise than the northern region did."}, "correct": "C", "choice_families": {"B": "Satır sütun karışıklığı", "D": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is that the north rose most. Its 120-to-210 gain of 90 exceeds central's 40 and southern's 50, using the correct columns to support the claim.", "why_wrong": {"B": "The 210 figure is the summer value and 120 the spring value; this swaps the season columns and reverses the change.", "D": "The southern rise (50) is smaller than the northern rise (90), so this reverses the comparison.", "A": "Central's summer count alone makes no comparison, so it does not support the claim about the north."}}, {"id": "u1-l2-f2-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that the new curriculum raised test scores more in mathematics than in reading.", "table": {"head": ["Subject", "Score before", "Score after"], "rows": [["Mathematics", "62", "78"], ["Reading", "70", "79"], ["Science", "65", "74"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Reading scores rose more than mathematics scores did.", "B": "Mathematics scores rose from 78 to 62.", "C": "Reading scores reached 79 after the new curriculum.", "D": "Mathematics scores rose from 62 to 78, a gain of 16, larger than reading's rise from 70 to 79."}, "correct": "D", "choice_families": {"B": "Satır sütun karışıklığı", "C": "Kıyassız tek değer", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim is math rose more than reading. Math's 16-point gain exceeds reading's 9-point gain, using the correct before-and-after columns to support the claim.", "why_wrong": {"B": "The 78 is the after value and 62 the before value; this swaps the columns and reverses the change.", "C": "Reading's after-score alone makes no comparison, so it does not support the claim about math.", "A": "Reading rose 9 points, less than math's 16, so this reverses the comparison."}}, {"id": "u1-l2-f2-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among three materials, aluminum conducts heat better than the others relative to its weight.", "table": {"head": ["Material", "Conductivity (W/mK)", "Density (kg/m3)"], "rows": [["Aluminum", "237", "2700"], ["Steel", "50", "7850"], ["Copper", "401", "8960"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Aluminum's conductivity of 237 against its low density of 2,700 gives it the best conductivity-to-weight ratio of the three.", "B": "Aluminum's density is 237 kilograms per cubic meter.", "C": "Copper has a conductivity of 401.", "D": "Steel offers a better conductivity-to-weight ratio than aluminum does."}, "correct": "A", "choice_families": {"B": "Satır sütun karışıklığı", "C": "Kıyassız tek değer", "D": "Yön tersine çevrilmiş"}, "why_correct": "The claim concerns conductivity relative to weight. Aluminum's high conductivity (237) with low density (2,700) gives the best ratio, using both columns correctly.", "why_wrong": {"B": "237 is aluminum's conductivity, not its density; this swaps the columns.", "C": "Copper's conductivity alone ignores weight, so it does not address the ratio in the claim.", "D": "Steel's low conductivity (50) and high density give a worse ratio, reversing the comparison."}}, {"id": "u1-l2-f2-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that the fertilizer increased fruit count more than it increased fruit size.", "table": {"head": ["Measure", "Control", "Fertilized"], "rows": [["Fruit count", "24", "39"], ["Fruit size (g)", "55", "61"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Fruit count rose from 39 to 24.", "B": "Fruit count rose from 24 to 39, a gain of about 63 percent, far exceeding the rise in fruit size from 55 to 61 grams, about 11 percent.", "C": "Fertilized plants produced fruit averaging 61 grams.", "D": "Fruit size increased by a greater proportion than fruit count did."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Yön tersine çevrilmiş", "A": "Satır sütun karışıklığı"}, "why_correct": "The claim is count rose more than size. Count's ~63 percent rise dwarfs size's ~11 percent, using the correct rows and columns to support the claim.", "why_wrong": {"C": "The fertilized fruit size alone makes no comparison, so it does not support the claim.", "D": "Size rose proportionally far less than count, so this reverses the comparison.", "A": "39 is the fertilized value and 24 the control; this swaps the columns and reverses the change."}}, {"id": "u1-l2-f2-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among three lakes, Lake Two showed the sharpest drop in oxygen from surface to deep water.", "table": {"head": ["Lake", "Surface oxygen (mg/L)", "Deep oxygen (mg/L)"], "rows": [["One", "9.0", "6.5"], ["Two", "9.2", "3.1"], ["Three", "8.8", "5.9"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Lake One's surface oxygen measured 9.0.", "B": "In Lake Two, oxygen rose from 3.1 at the surface to 9.2 in deep water.", "C": "In Lake Two, oxygen fell from 9.2 at the surface to 3.1 in deep water, a drop of 6.1, the sharpest of the three.", "D": "Lake Three showed a sharper oxygen drop than Lake Two did."}, "correct": "C", "choice_families": {"B": "Satır sütun karışıklığı", "D": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is Lake Two dropped most. Its 9.2-to-3.1 fall of 6.1 exceeds the others' drops, using the correct surface and deep columns.", "why_wrong": {"B": "3.1 is the deep value and 9.2 the surface value; this swaps the columns and reverses the change.", "D": "Lake Three's drop (2.9) is smaller than Lake Two's (6.1), reversing the comparison.", "A": "Lake One's surface figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f2-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that the training program improved sprint times more for novices than for experienced runners.", "table": {"head": ["Group", "Time before (s)", "Time after (s)"], "rows": [["Novices", "14.8", "13.5"], ["Experienced", "12.6", "12.2"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Experienced runners improved more than novices did.", "B": "Novices improved from 13.5 to 14.8 seconds.", "C": "Experienced runners finished in 12.2 seconds after training.", "D": "Novices improved from 14.8 to 13.5 seconds, a gain of 1.3, larger than the experienced runners' 0.4-second gain."}, "correct": "D", "choice_families": {"B": "Satır sütun karışıklığı", "C": "Kıyassız tek değer", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim is novices improved more. Their 1.3-second gain exceeds the experienced runners' 0.4, using the correct before-and-after columns.", "why_wrong": {"B": "13.5 is the after time and 14.8 the before time; this swaps the columns and reverses the change.", "C": "The experienced runners' after-time alone makes no comparison, so it does not support the claim.", "A": "Experienced runners improved only 0.4 seconds, less than novices' 1.3, reversing the comparison."}}, {"id": "u1-l2-f2-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among three products, Product Y had the largest gap between its list price and its actual selling price.", "table": {"head": ["Product", "List price ($)", "Selling price ($)"], "rows": [["X", "40", "36"], ["Y", "90", "62"], ["Z", "55", "48"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Product Y listed at 90 dollars but sold for 62, a gap of 28, the largest of the three.", "B": "Product Y listed at 62 dollars and sold for 90.", "C": "Product Z sold for 48 dollars.", "D": "Product Z had a larger list-to-selling gap than Product Y did."}, "correct": "A", "choice_families": {"B": "Satır sütun karışıklığı", "C": "Kıyassız tek değer", "D": "Yön tersine çevrilmiş"}, "why_correct": "The claim is Y had the largest gap. Its 90-to-62 gap of 28 exceeds the others', using the correct list and selling columns.", "why_wrong": {"B": "62 is the selling price and 90 the list price; this swaps the columns.", "C": "Product Z's selling price alone makes no comparison, so it does not support the claim.", "D": "Product Z's gap (7) is smaller than Y's (28), reversing the comparison."}}, {"id": "u1-l2-f2-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among three towns, Town B had the greatest increase in recycling rate over the decade.", "table": {"head": ["Town", "Rate 2010 (%)", "Rate 2020 (%)"], "rows": [["A", "30", "45"], ["B", "22", "58"], ["C", "41", "52"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Town B's rate fell from 58 percent in 2010 to 22 percent in 2020.", "B": "Town B's recycling rate rose from 22 percent in 2010 to 58 percent in 2020, a gain of 36 points, the greatest of the three.", "C": "Town C reached a 52 percent recycling rate in 2020.", "D": "Town A's rate rose more than Town B's did."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Yön tersine çevrilmiş", "A": "Satır sütun karışıklığı"}, "why_correct": "The claim is Town B rose most. Its 22-to-58 gain of 36 points exceeds the others', using the correct 2010 and 2020 columns.", "why_wrong": {"C": "Town C's 2020 rate alone makes no comparison, so it does not support the claim.", "D": "Town A rose 15 points, less than Town B's 36, reversing the comparison.", "A": "58 is the 2020 value and 22 the 2010 value; this swaps the columns and reverses the change."}}, {"id": "u1-l2-f2-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Satır sütun karışıklığı", "passage": "A researcher claims that among three engines, Engine Three converted the most of its fuel energy into motion rather than heat.", "table": {"head": ["Engine", "Energy to motion (%)", "Energy to heat (%)"], "rows": [["One", "31", "69"], ["Two", "28", "72"], ["Three", "42", "58"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Engine One directed 31 percent of its energy to motion.", "B": "Engine Three directed 58 percent of its energy to motion.", "C": "Engine Three directed 42 percent of its fuel energy to motion, the highest of the three, against 58 percent lost to heat.", "D": "Engine Two directed more energy to motion than Engine Three did."}, "correct": "C", "choice_families": {"B": "Satır sütun karışıklığı", "D": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is Engine Three converted the most to motion. Its 42 percent leads the three, using the correct motion column.", "why_wrong": {"B": "58 percent is Engine Three's heat figure, not its motion figure; this swaps the columns.", "D": "Engine Two directed only 28 percent to motion, less than Engine Three's 42, reversing the comparison.", "A": "Engine One's motion figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f3-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as study group size increased across the four sessions, the average quiz score fell.", "table": {"head": ["Session", "Group size", "Avg quiz score"], "rows": [["1", "4", "88"], ["2", "8", "81"], ["3", "12", "74"], ["4", "16", "66"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The largest group, of 16, scored 66 on average.", "B": "As group size rose from 4 to 16, the average score rose from 66 to 88.", "C": "As group size rose from 4 to 16 across the sessions, the average score fell from 88 to 66.", "D": "Session 1's group of 4 scored 88 while sessions with larger groups scored lower on some measures."}, "correct": "C", "choice_families": {"B": "Yön tersine çevrilmiş", "D": "Doğru sayı yanlış iş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is that larger groups scored lower. Scores fall from 88 to 66 as size rises from 4 to 16, matching the claimed direction.", "why_wrong": {"B": "This states scores rising with group size, the opposite of the falling trend the claim describes.", "D": "This cites accurate figures but describes only session 1 vaguely, not the full falling trend.", "A": "The largest group's score alone shows no trend across sizes, so it does not support the claim."}}, {"id": "u1-l2-f3-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that thicker insulation was associated with lower monthly heating cost across the four homes.", "table": {"head": ["Home", "Insulation (cm)", "Heating cost ($)"], "rows": [["H1", "5", "210"], ["H2", "10", "160"], ["H3", "15", "120"], ["H4", "20", "90"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Home H1 had 5 centimeters of insulation and a relatively high cost.", "B": "As insulation rose from 5 to 20 centimeters, heating cost rose from 90 to 210 dollars.", "C": "The home with 20 centimeters of insulation paid 90 dollars.", "D": "As insulation thickness rose from 5 to 20 centimeters, heating cost fell from 210 to 90 dollars."}, "correct": "D", "choice_families": {"B": "Yön tersine çevrilmiş", "C": "Kıyassız tek değer", "A": "Doğru sayı yanlış iş"}, "why_correct": "The claim is thicker insulation, lower cost. Cost falls from 210 to 90 as insulation rises from 5 to 20, matching the claimed direction.", "why_wrong": {"B": "This has cost rising with insulation, the opposite of the falling trend the claim describes.", "C": "The thickest-insulation home's cost alone shows no trend, so it does not support the claim.", "A": "This cites one home's figures without tracing the full inverse trend the claim makes."}}, {"id": "u1-l2-f3-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that higher soil acidity was associated with reduced earthworm density across the four plots.", "table": {"head": ["Plot", "Soil pH", "Earthworms per m2"], "rows": [["P1", "4.8", "12"], ["P2", "5.6", "28"], ["P3", "6.4", "51"], ["P4", "7.1", "74"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "As soil pH rose from 4.8 to 7.1, becoming less acidic, earthworm density rose from 12 to 74, so greater acidity accompanied fewer earthworms.", "B": "As soil became more acidic, earthworm density rose from 12 to 74.", "C": "The least acidic plot held 74 earthworms per square meter.", "D": "Plot P1 was the most acidic, at pH 4.8."}, "correct": "A", "choice_families": {"B": "Yön tersine çevrilmiş", "C": "Kıyassız tek değer", "D": "Doğru sayı yanlış iş"}, "why_correct": "The claim is more acidity, fewer earthworms. Density rises as pH rises (less acidity), so higher acidity accompanies fewer earthworms, matching the claim.", "why_wrong": {"B": "This ties more acidity to more earthworms, reversing the relationship the claim describes.", "C": "The least acidic plot's count alone shows no trend across acidity, so it does not support the claim.", "D": "Identifying the most acidic plot alone cites a figure without tracing the trend."}}, {"id": "u1-l2-f3-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that longer daily screen time was associated with shorter nightly sleep across the four groups.", "table": {"head": ["Group", "Screen time (hr)", "Sleep (hr)"], "rows": [["G1", "2", "8.1"], ["G2", "4", "7.4"], ["G3", "6", "6.8"], ["G4", "8", "6.0"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "As screen time rose from 2 to 8 hours, sleep rose from 6.0 to 8.1 hours.", "B": "As screen time rose from 2 to 8 hours, sleep fell from 8.1 to 6.0 hours.", "C": "The group with 8 hours of screen time slept 6.0 hours.", "D": "Group G1 had the least screen time of the four."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Doğru sayı yanlış iş", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim is more screen time, less sleep. Sleep falls from 8.1 to 6.0 as screen time rises, matching the claimed direction.", "why_wrong": {"C": "The highest-screen-time group's sleep alone shows no trend, so it does not support the claim.", "D": "Naming the lowest-screen-time group cites a figure without tracing the inverse trend.", "A": "This has sleep rising with screen time, the opposite of the falling trend the claim describes."}}, {"id": "u1-l2-f3-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as ticket price rose across the four events, attendance declined.", "table": {"head": ["Event", "Ticket price ($)", "Attendance"], "rows": [["E1", "10", "900"], ["E2", "20", "720"], ["E3", "30", "540"], ["E4", "40", "410"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The 40-dollar event drew 410 attendees.", "B": "As ticket price rose from 10 to 40 dollars, attendance rose from 410 to 900.", "C": "As ticket price rose from 10 to 40 dollars, attendance fell from 900 to 410.", "D": "Event E1 charged the lowest price of the four."}, "correct": "C", "choice_families": {"B": "Yön tersine çevrilmiş", "D": "Doğru sayı yanlış iş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is higher price, lower attendance. Attendance falls from 900 to 410 as price rises, matching the claimed direction.", "why_wrong": {"B": "This has attendance rising with price, the opposite of the falling trend the claim describes.", "D": "Naming the cheapest event cites a figure without tracing the inverse trend.", "A": "The priciest event's attendance alone shows no trend, so it does not support the claim."}}, {"id": "u1-l2-f3-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as altitude increased across the four stations, average air temperature fell.", "table": {"head": ["Station", "Altitude (m)", "Avg temp (C)"], "rows": [["S1", "200", "18.5"], ["S2", "900", "14.0"], ["S3", "1600", "9.6"], ["S4", "2300", "5.1"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Station S1 sat at the lowest altitude of the four.", "B": "As altitude rose from 200 to 2,300 meters, temperature rose from 5.1 to 18.5 degrees.", "C": "The highest station, at 2,300 meters, averaged 5.1 degrees.", "D": "As altitude rose from 200 to 2,300 meters, average temperature fell from 18.5 to 5.1 degrees."}, "correct": "D", "choice_families": {"B": "Yön tersine çevrilmiş", "C": "Kıyassız tek değer", "A": "Doğru sayı yanlış iş"}, "why_correct": "The claim is higher altitude, lower temperature. Temperature falls from 18.5 to 5.1 as altitude rises, matching the claimed direction.", "why_wrong": {"B": "This has temperature rising with altitude, the opposite of the falling trend the claim describes.", "C": "The highest station's temperature alone shows no trend, so it does not support the claim.", "A": "Naming the lowest station cites a figure without tracing the inverse trend."}}, {"id": "u1-l2-f3-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as a metal was heated across the four trials, its electrical resistance rose.", "table": {"head": ["Trial", "Temperature (C)", "Resistance (ohm)"], "rows": [["T1", "20", "1.10"], ["T2", "60", "1.28"], ["T3", "100", "1.47"], ["T4", "140", "1.66"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "As temperature rose from 20 to 140 degrees, resistance rose from 1.10 to 1.66 ohms.", "B": "As temperature rose from 20 to 140 degrees, resistance fell from 1.66 to 1.10 ohms.", "C": "At 140 degrees, resistance measured 1.66 ohms.", "D": "Trial T1 was conducted at the lowest temperature."}, "correct": "A", "choice_families": {"B": "Yön tersine çevrilmiş", "C": "Kıyassız tek değer", "D": "Doğru sayı yanlış iş"}, "why_correct": "The claim is that heating raised resistance. Resistance rises from 1.10 to 1.66 as temperature rises, matching the claimed direction.", "why_wrong": {"B": "This has resistance falling as temperature rises, the opposite of the claimed trend.", "C": "The highest-temperature resistance alone shows no trend, so it does not support the claim.", "D": "Naming the coolest trial cites a figure without tracing the rising trend."}}, {"id": "u1-l2-f3-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as a reservoir's water level fell across four months, the concentration of dissolved salts rose.", "table": {"head": ["Month", "Water level (m)", "Salt conc. (g/L)"], "rows": [["Jun", "12.0", "1.8"], ["Jul", "10.5", "2.3"], ["Aug", "8.9", "2.9"], ["Sep", "7.2", "3.6"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "As the water level fell from 12.0 to 7.2 meters, salt concentration fell from 3.6 to 1.8 grams per liter.", "B": "As the water level fell from 12.0 to 7.2 meters, salt concentration rose from 1.8 to 3.6 grams per liter.", "C": "In September, salt concentration reached 3.6 grams per liter.", "D": "June had the highest water level of the four months."}, "correct": "B", "choice_families": {"C": "Kıyassız tek değer", "D": "Doğru sayı yanlış iş", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim is falling level, rising salt. As level drops from 12.0 to 7.2, salt rises from 1.8 to 3.6, matching the claimed inverse relationship.", "why_wrong": {"C": "September's salt figure alone shows no trend, so it does not support the claim.", "D": "Naming the highest-level month cites a figure without tracing the trend.", "A": "This has salt falling as the level falls, reversing the relationship the claim describes."}}, {"id": "u1-l2-f3-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as a plant received more shade across four plots, its stem grew taller in a reach for light.", "table": {"head": ["Plot", "Shade (%)", "Stem height (cm)"], "rows": [["P1", "10", "22"], ["P2", "30", "28"], ["P3", "50", "35"], ["P4", "70", "41"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The most shaded plot produced stems 41 centimeters tall.", "B": "As shade rose from 10 to 70 percent, stem height fell from 41 to 22 centimeters.", "C": "As shade rose from 10 to 70 percent, stem height rose from 22 to 41 centimeters.", "D": "Plot P1 received the least shade of the four."}, "correct": "C", "choice_families": {"B": "Yön tersine çevrilmiş", "D": "Doğru sayı yanlış iş", "A": "Kıyassız tek değer"}, "why_correct": "The claim is more shade, taller stems. Height rises from 22 to 41 as shade rises, matching the claimed direction.", "why_wrong": {"B": "This has height falling as shade rises, the opposite of the claimed trend.", "D": "Naming the least-shaded plot cites a figure without tracing the rising trend.", "A": "The most-shaded plot's height alone shows no trend, so it does not support the claim."}}, {"id": "u1-l2-f3-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Yön tersine çevrilmiş", "passage": "A researcher claims that as a coin's silver content rose across four issues, its market value climbed.", "table": {"head": ["Issue", "Silver content (%)", "Value ($)"], "rows": [["First", "40", "55"], ["Second", "55", "78"], ["Third", "70", "104"], ["Fourth", "85", "139"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The first issue had the lowest silver content.", "B": "As silver content rose from 40 to 85 percent, value fell from 139 to 55 dollars.", "C": "The issue with 85 percent silver was valued at 139 dollars.", "D": "As silver content rose from 40 to 85 percent, value rose from 55 to 139 dollars."}, "correct": "D", "choice_families": {"B": "Yön tersine çevrilmiş", "C": "Kıyassız tek değer", "A": "Doğru sayı yanlış iş"}, "why_correct": "The claim is more silver, higher value. Value rises from 55 to 139 as silver content rises, matching the claimed direction.", "why_wrong": {"B": "This has value falling as silver content rises, the opposite of the claimed trend.", "C": "The highest-silver issue's value alone shows no trend, so it does not support the claim.", "A": "Naming the lowest-silver issue cites a figure without tracing the rising trend."}}, {"id": "u1-l2-f4-01", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the treated group scored higher on the memory test than the untreated group did.", "table": {"head": ["Group", "Memory score"], "rows": [["Treated", "82"], ["Untreated", "67"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The untreated group scored 67 on the memory test.", "B": "The treated group scored 82 on the memory test.", "C": "The untreated group scored higher than the treated group.", "D": "The treated group scored 82, above the untreated group's 67."}, "correct": "D", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim compares the two groups. Stating 82 above 67 makes the comparison the claim requires.", "why_wrong": {"B": "The treated score alone makes no comparison with the untreated group, so it does not support the claim.", "C": "This says the untreated group scored higher, reversing the comparison.", "A": "The untreated score alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-02", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the coastal site received more annual rainfall than the inland site did.", "table": {"head": ["Site", "Annual rainfall (mm)"], "rows": [["Coastal", "1420"], ["Inland", "870"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The coastal site received 1,420 millimeters, more than the inland site's 870.", "B": "The coastal site received 1,420 millimeters of rain.", "C": "The inland site received more rain than the coastal site.", "D": "The inland site received 870 millimeters of rain."}, "correct": "A", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "D": "Kıyassız tek değer"}, "why_correct": "The claim compares the two sites. Stating 1,420 above 870 makes the comparison the claim requires.", "why_wrong": {"B": "The coastal figure alone makes no comparison with the inland site, so it does not support the claim.", "C": "This says the inland site received more, reversing the comparison.", "D": "The inland figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-03", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the redesigned website kept users on the page longer than the old design did.", "table": {"head": ["Design", "Avg time on page (s)"], "rows": [["Redesigned", "96"], ["Old", "61"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Users spent 96 seconds on the redesigned page.", "B": "Users spent 96 seconds on the redesigned page, longer than the 61 seconds on the old design.", "C": "Users spent longer on the old design than on the redesigned page.", "D": "Users spent 61 seconds on the old design."}, "correct": "B", "choice_families": {"C": "Yön tersine çevrilmiş", "D": "Kıyassız tek değer", "A": "Kıyassız tek değer"}, "why_correct": "The claim compares the two designs. Stating 96 above 61 makes the comparison the claim requires.", "why_wrong": {"C": "This says users stayed longer on the old design, reversing the comparison.", "D": "The old-design time alone makes no comparison, so it does not support the claim.", "A": "The redesigned time alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-04", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the enriched diet produced heavier fish than the standard diet did.", "table": {"head": ["Diet", "Avg mass (g)"], "rows": [["Enriched", "318"], ["Standard", "247"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Fish on the standard diet were heavier than those on the enriched diet.", "B": "Fish on the enriched diet averaged 318 grams.", "C": "Fish on the enriched diet averaged 318 grams, heavier than the 247 grams on the standard diet.", "D": "Fish on the standard diet averaged 247 grams."}, "correct": "C", "choice_families": {"B": "Kıyassız tek değer", "D": "Kıyassız tek değer", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim compares the two diets. Stating 318 above 247 makes the comparison the claim requires.", "why_wrong": {"B": "The enriched-diet mass alone makes no comparison, so it does not support the claim.", "D": "The standard-diet mass alone makes no comparison, so it does not support the claim.", "A": "This says the standard diet produced heavier fish, reversing the comparison."}}, {"id": "u1-l2-f4-05", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the morning shift completed more orders than the evening shift did.", "table": {"head": ["Shift", "Orders completed"], "rows": [["Morning", "340"], ["Evening", "275"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The evening shift completed 275 orders.", "B": "The morning shift completed 340 orders.", "C": "The evening shift completed more orders than the morning shift.", "D": "The morning shift completed 340 orders, more than the evening shift's 275."}, "correct": "D", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim compares the two shifts. Stating 340 above 275 makes the comparison the claim requires.", "why_wrong": {"B": "The morning figure alone makes no comparison, so it does not support the claim.", "C": "This says the evening shift completed more, reversing the comparison.", "A": "The evening figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-06", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the shaded plot yielded more berries than the sunlit plot did.", "table": {"head": ["Plot", "Berry yield (kg)"], "rows": [["Shaded", "14.6"], ["Sunlit", "9.2"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The shaded plot yielded 14.6 kilograms, more than the sunlit plot's 9.2.", "B": "The shaded plot yielded 14.6 kilograms of berries.", "C": "The sunlit plot yielded more berries than the shaded plot.", "D": "The sunlit plot yielded 9.2 kilograms of berries."}, "correct": "A", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "D": "Kıyassız tek değer"}, "why_correct": "The claim compares the two plots. Stating 14.6 above 9.2 makes the comparison the claim requires.", "why_wrong": {"B": "The shaded-plot yield alone makes no comparison, so it does not support the claim.", "C": "This says the sunlit plot yielded more, reversing the comparison.", "D": "The sunlit-plot yield alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-07", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the recycled-content paper cost less per ream than the virgin-pulp paper did.", "table": {"head": ["Paper", "Cost per ream ($)"], "rows": [["Recycled", "4.20"], ["Virgin", "5.65"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Recycled-content paper cost 4.20 dollars per ream.", "B": "Recycled-content paper cost 4.20 dollars per ream, less than the virgin-pulp paper's 5.65.", "C": "Virgin-pulp paper cost less per ream than recycled-content paper.", "D": "Virgin-pulp paper cost 5.65 dollars per ream."}, "correct": "B", "choice_families": {"C": "Yön tersine çevrilmiş", "D": "Kıyassız tek değer", "A": "Kıyassız tek değer"}, "why_correct": "The claim compares the two papers. Stating 4.20 below 5.65 makes the comparison the claim requires.", "why_wrong": {"C": "This says virgin-pulp cost less, reversing the comparison.", "D": "The virgin-pulp figure alone makes no comparison, so it does not support the claim.", "A": "The recycled figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-08", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the northern colony produced more honey than the southern colony did.", "table": {"head": ["Colony", "Honey (kg)"], "rows": [["Northern", "31.5"], ["Southern", "24.0"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The southern colony produced more honey than the northern colony.", "B": "The northern colony produced 31.5 kilograms of honey.", "C": "The northern colony produced 31.5 kilograms, more than the southern colony's 24.0.", "D": "The southern colony produced 24.0 kilograms of honey."}, "correct": "C", "choice_families": {"B": "Kıyassız tek değer", "D": "Kıyassız tek değer", "A": "Yön tersine çevrilmiş"}, "why_correct": "The claim compares the two colonies. Stating 31.5 above 24.0 makes the comparison the claim requires.", "why_wrong": {"B": "The northern figure alone makes no comparison, so it does not support the claim.", "D": "The southern figure alone makes no comparison, so it does not support the claim.", "A": "This says the southern colony produced more, reversing the comparison."}}, {"id": "u1-l2-f4-09", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the insulated container kept its contents cold longer than the plain container did.", "table": {"head": ["Container", "Time below 5 C (hr)"], "rows": [["Insulated", "9.4"], ["Plain", "3.1"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "The plain container held its contents below 5 degrees for 3.1 hours.", "B": "The insulated container held its contents below 5 degrees for 9.4 hours.", "C": "The plain container kept its contents cold longer than the insulated one.", "D": "The insulated container held its contents below 5 degrees for 9.4 hours, longer than the plain container's 3.1."}, "correct": "D", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "A": "Kıyassız tek değer"}, "why_correct": "The claim compares the two containers. Stating 9.4 above 3.1 makes the comparison the claim requires.", "why_wrong": {"B": "The insulated figure alone makes no comparison, so it does not support the claim.", "C": "This says the plain container lasted longer, reversing the comparison.", "A": "The plain-container figure alone makes no comparison, so it does not support the claim."}}, {"id": "u1-l2-f4-10", "unit": 1, "lesson": 2, "lesson_name": "Command of Evidence: Quantitative", "target_family": "Kıyassız tek değer", "passage": "A researcher claims that the revised syllabus led students to submit more assignments on time than the old syllabus did.", "table": {"head": ["Syllabus", "On-time submissions (%)"], "rows": [["Revised", "88"], ["Old", "64"]]}, "stem": "Which choice most effectively uses data from the table to support the claim?", "choices": {"A": "Under the revised syllabus, 88 percent of assignments arrived on time, above the 64 percent under the old one.", "B": "Under the revised syllabus, 88 percent of assignments arrived on time.", "C": "The old syllabus produced a higher on-time rate than the revised one.", "D": "Under the old syllabus, 64 percent of assignments arrived on time."}, "correct": "A", "choice_families": {"B": "Kıyassız tek değer", "C": "Yön tersine çevrilmiş", "D": "Kıyassız tek değer"}, "why_correct": "The claim compares the two syllabi. Stating 88 above 64 makes the comparison the claim requires.", "why_wrong": {"B": "The revised figure alone makes no comparison, so it does not support the claim.", "C": "This says the old syllabus did better, reversing the comparison.", "D": "The old-syllabus figure alone makes no comparison, so it does not support the claim."}}]}, {"no": 3, "name": "Central Ideas and Details", "teaching": {"ne_olculuyor": ["Bu ders iki ayrı soru tipini kapsar ve öğrenciler bunları karıştırır.", "ANA FİKİR sorusu metnin tamamını özetlemeni ister. Cevap metnin herhangi bir cümlesinde tek başına durmaz, metnin bütününden çıkar.", "DETAY sorusu tek bir olguyu sorar. Cevap metinde açıkça yazar. Metni tarar, bulur, işaretlersin.", "Soru köküne bakıp hangisi olduğunu anlamak zorundasın. Yanlış tipe çalışırsan yanlış yerde ararsın."], "karar_proseduru": ["Soru kökünü oku ve tipi belirle.  Main idea mı, detay mı. Bu ikisi farklı okuma gerektirir.", "Detay sorusuysa anahtar kelimeyi bul ve metinde ara.  Anahtar kelime genelde bir özel isim, bir sayı ya da bir terim. Metinde onu bul, etrafındaki cümleyi oku.", "Ana fikir sorusuysa metnin YÖNÜNÜ bul.  Metin bir iddia mı kuruyor, bir yanlışı mı düzeltiyor, iki görüşü mu karşılaştırıyor. Yön bulununca doğru şık kendini gösterir.", "Kendi cümleni kur, sonra şıklara bak.  Şıklardan önce kendi özetini yap. Yoksa ilk makul şık seni yakalar.", "Her şıkkı metne karşı test et.  Sorma: bu doğru mu. Sor: bu METİNDE var mı ve SORULANI cevaplıyor mu."], "celdirici_aileleri": [{"ad": "Çok dar", "tanim": "Metindeki gerçek bir detayı ana fikir diye sunar. Cümle doğru, ama metnin tamamını temsil etmiyor. En sık düşülen tuzak. Öğrenci metinde gördüğü bir cümleyi tanıyıp işaretler."}, {"ad": "Çok geniş", "tanim": "Metnin desteklediği şeyden fazlasını iddia eder. Genelde all, every, always, never kelimeleri taşır. Metin bir türden bahsediyorsa şık bütün türlere genelliyor demektir."}, {"ad": "Doğru ama alakasız", "tanim": "İfade doğrudur, hatta metinle uyumludur, ama SORULAN şey değildir. Bu tuzak için tek savunma soru köküne geri dönmektir."}, {"ad": "Ters ilişki", "tanim": "Metnin kelimelerini kullanır ama sebep ile sonucu, ya da iki tarafı yer değiştirir. Kelimeler tanıdık geldiği için doğru hissettirir. İlişkiyi kontrol et, kelimeleri değil."}], "top_tips": ["But, however, yet, although kelimelerinden SONRA gelen cümle genelde metnin asıl iddiasını taşır. Öncesi hazırlıktır. Ana fikir sorusunda önce oraya bak.", "Detay sorusunda şık metindeki kelimeyi aynen tekrarlıyorsa şüphelen. SAT doğru cevabı PARAFRAZ eder, çeldiriciyi kopyalar.", "İki şık birbirinin tersiyse doğru cevap genelde o ikisinden biridir. Üçüncü ve dördüncü şıkkı önce ele.", "Ana fikir sorusunda şıkkın fiiline bak. It describes, it argues, it contradicts. Fiil metnin yaptığı İŞİ doğru adlandırıyor mu."], "kavramsal_temel": ["Central Ideas and Details, bir metnin ANA fikrini ya da o fikri destekleyen belirli bir AYRINTIYI bulmanı ister. Ana fikir sorusu metnin bütününü özetleyen ifadeyi arar, ayrıntı sorusu metnin açıkça söylediği belirli bir bilgiyi arar.", "Ana fikir, metnin en geniş ve en kapsayıcı mesajıdır. Bir cümlelik bir ayrıntı değil, tüm paragrafı çatı altına alan fikirdir. Doğru cevap metnin bir kısmını değil, ağırlık merkezini yansıtmalıdır.", "En sık tuzak, metinde geçen doğru bir ayrıntıyı ana fikir sanmaktır. O ayrıntı doğrudur ama metnin sadece bir parçasını kapsar, bütününü değil. Ana fikir sorusunda çok dar seçenek yanlıştır.", "Ayrıntı sorusunda ise tam tersi risk vardır: metnin genel havasına uyan ama metinde AÇIKÇA söylenmeyen bir şey seçmek. Ayrıntı sorusunda cevap metinde birebir dayanağı olan bilgidir."], "cozumlu_ornekler": [{"passage": "Octopuses were long thought to be solitary and unintelligent. Recent research, however, has revealed remarkable abilities: they solve puzzles, use tools, and even appear to recognize individual human handlers. These findings have forced scientists to rethink long-held assumptions about invertebrate intelligence.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "New research on octopuses has overturned old assumptions about how intelligent invertebrates can be.", "B": "Octopuses can solve puzzles when given the chance.", "C": "Octopuses were once thought to be solitary animals.", "D": "Scientists study many kinds of invertebrates."}, "correct": "A", "adimlar": ["Metnin hareketini izle: eski varsayım vardı, yeni araştırma onu değiştirdi.", "Ana fikir bu bütün hareketi kapsamalı: yeni bulgular eski varsayımları yıkıyor.", "A tam bunu söyler, metnin başından sonuna kadarki mesajı özetler.", "B ve C doğru ama sadece birer ayrıntı, metnin bir parçası. D metinde yok, çok genel."], "sonuc": "Ana fikir metnin bütün hareketini kapsar. Doğru ama dar bir ayrıntı ana fikir olamaz."}, {"passage": "The ancient library of Alexandria housed hundreds of thousands of scrolls. Scholars traveled from across the Mediterranean to study there. Its collection was so vast that ships docking at the port were reportedly required to surrender any books on board for copying.", "stem": "According to the text, why did ships surrender books at the port?", "choices": {"A": "so that the books could be copied for the library", "B": "because the scholars demanded payment", "C": "to reduce the weight of the ships", "D": "because books were illegal to own"}, "correct": "A", "adimlar": ["Bu bir ayrıntı sorusu: metin AÇIKÇA ne diyor.", "İlgili cümleyi bul: gemiler kitaplarını KOPYALANMAK için teslim ediyordu.", "A birebir metne dayanır. Doğru.", "B, C, D metinde hiç geçmez, dışarıdan uydurulmuş makul görünen seçenekler."], "sonuc": "Ayrıntı sorusunda cevap metinde birebir dayanağı olan bilgidir, makul tahmin değil."}], "sik_hatalar": [{"hata": "Doğru bir ayrıntıyı ana fikir sanmak", "cozum": "Ana fikir sorusunda seçenek metnin bütününü kapsamalı. Tek bir cümleyi özetleyen seçenek çok dardır."}, {"hata": "Ayrıntı sorusunda metin dışı bilgi seçmek", "cozum": "Ayrıntı sorusunda cevap metinde açıkça yazmalı. Genel havaya uyan ama yazılmayan şey yanlıştır."}, {"hata": "Çok geniş, metni aşan seçeneği ana fikir sanmak", "cozum": "Ana fikir metni özetler, metnin ötesine geçmez. Çok genel seçenek de yanlıştır."}, {"hata": "İlk tanıdık kelimeyi gören seçeneğe atlamak", "cozum": "Metindeki kelimeyi tekrarlayan seçenek doğru olmayabilir. Anlama bak, kelime eşleşmesine değil."}], "strateji": ["Soru ana fikir mi ayrıntı mi istiyor, önce onu belirle.", "Ana fikir için metnin bütün hareketini tek cümlede özetle.", "Ayrıntı için ilgili cümleyi metinde bul, birebir dayanak ara.", "Çok dar ya da çok geniş seçenekleri ele.", "Kelime eşleşmesine değil, anlama göre seç."]}, "families": ["Çok dar", "Çok geniş", "Doğru ama alakasız", "Ters ilişki"], "fam_short": {"Çok dar": "Çok dar", "Çok geniş": "Çok geniş", "Doğru ama alakasız": "Alakasiz", "Ters ilişki": "Ters ilişki"}, "main_ids": ["u1-l3-f1-01", "u1-l3-f2-01", "u1-l3-f3-01", "u1-l3-f4-01"], "questions": [{"id": "u1-l3-f1-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "For decades, scholars assumed that the elaborate roads built by the Inca served chiefly to move armies. More recent study complicates that picture. The same roads carried relay runners bearing messages, llama caravans moving goods, and officials conducting censuses. The network, it now appears, was less a military corridor than the connective tissue of an entire administrative state.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The Inca road network served not mainly a military function but a broad administrative one, binding the state together.", "B": "Relay runners used the Inca roads to carry messages across the empire.", "C": "The Inca built some of the most elaborate roads of the ancient world.", "D": "Because the roads were so useful for administration, the Inca had little need for an army."}, "correct": "A", "choice_families": {"B": "Çok dar", "C": "Çok geniş", "D": "Ters ilişki"}, "why_correct": "The passage revises an older military reading, arguing the roads chiefly served administration. Choice A captures that central revision.", "why_wrong": {"B": "Relay runners are one example of the roads' varied uses, a detail too narrow to be the main idea.", "C": "The elaborateness of the roads is a general aside, not the passage's argument about their function.", "D": "The passage never claims the roads reduced the need for an army; this reverses the relationship."}}, {"id": "u1-l3-f1-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "The common view holds that a language's writing system simply records its sounds. The Chinese script complicates this. Its characters encode meaning as much as sound, so speakers of mutually unintelligible spoken varieties can read the same text. Writing, in this case, does not merely transcribe speech; it operates on a partly independent plane of meaning.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Speakers of different Chinese varieties can read the same written text.", "B": "Chinese script shows that writing can encode meaning independently of sound, unlike the common view that writing merely records speech.", "C": "Writing systems are among humanity's most important cultural inventions.", "D": "Because Chinese characters encode sound so precisely, readers can always tell how a word is pronounced."}, "correct": "B", "choice_families": {"C": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage challenges the view that writing merely records sound, using Chinese to show writing can carry meaning independently. Choice A states that central point.", "why_wrong": {"C": "The general importance of writing systems is broader than the passage's specific argument.", "D": "The passage says characters encode meaning as much as sound, not that they fix pronunciation; this reverses the point.", "A": "Mutual readability is one illustration, a detail too narrow to be the main idea."}}, {"id": "u1-l3-f1-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "Fungi are often pictured as lone decomposers breaking down dead matter. Yet beneath many forests, fungal threads link the roots of different trees into a shared network. Through it, trees trade sugars and warning signals, and older trees can channel resources to struggling seedlings. Far from solitary, these fungi weave a forest into an interdependent community.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Fungi are among the most widespread organisms on Earth.", "B": "Older trees can send resources to struggling seedlings through fungal threads.", "C": "Rather than acting alone, forest fungi connect trees into an interdependent network through which resources and signals pass.", "D": "Because trees can rely on fungal networks, they no longer compete with one another."}, "correct": "C", "choice_families": {"B": "Çok dar", "D": "Ters ilişki", "A": "Çok geniş"}, "why_correct": "The passage overturns the image of solitary fungi, showing they knit trees into an interdependent community. Choice A captures that central point.", "why_wrong": {"B": "The transfer from old trees to seedlings is one example, a detail too narrow to be the main idea.", "D": "The passage never claims the network ends competition; this overstates and reverses the point.", "A": "The general prevalence of fungi is broader than the passage's specific argument."}}, {"id": "u1-l3-f1-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "It is tempting to credit a single inventor with the light bulb, but the device emerged from a long relay of contributors. Earlier experimenters produced glowing filaments that burned out in minutes; later ones found longer-lasting materials; still others devised the vacuum and power systems that made bulbs practical. The familiar bulb was less a sudden invention than a slow accumulation of partial solutions.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because so many people contributed, no single design of the bulb ever proved practical.", "B": "Early experimental filaments burned out within minutes of being lit.", "C": "Invention has always depended on the sharing of ideas among many people.", "D": "The light bulb was not the work of one inventor but the product of many contributors solving different pieces of the problem over time."}, "correct": "D", "choice_families": {"B": "Çok dar", "C": "Çok geniş", "A": "Ters ilişki"}, "why_correct": "The passage argues the bulb accumulated from many partial solutions rather than one invention. Choice A states that central point.", "why_wrong": {"B": "The short-lived early filaments are one detail, too narrow to be the main idea.", "C": "A sweeping claim about all invention is broader than this passage's specific argument.", "A": "The passage says the contributions made the bulb practical, not that none did; this reverses the point."}}, {"id": "u1-l3-f1-05", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "A painting long attributed to a famous master had puzzled experts with its uneven quality. New imaging beneath the surface resolved the puzzle: the composition was sketched by the master but largely filled in by assistants, with only a few passages finished by his own hand. The work, then, is best understood not as a solo masterpiece but as a workshop production bearing the master's design.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Imaging reveals that the painting was designed by the master but executed mostly by assistants, making it a workshop production rather than a solo work.", "B": "Only a few passages of the painting were finished by the master himself.", "C": "Modern imaging has transformed the study of historical paintings.", "D": "Because assistants did most of the work, the master had no role in the painting's design."}, "correct": "A", "choice_families": {"B": "Çok dar", "C": "Çok geniş", "D": "Ters ilişki"}, "why_correct": "The passage reframes the work as a workshop production designed by the master but executed by assistants. Choice A captures that conclusion.", "why_wrong": {"B": "The few master-finished passages are one detail, too narrow to be the main idea.", "C": "The broad impact of imaging on art study is wider than this passage's specific point.", "D": "The passage says the master designed the work; this denies his role and reverses the point."}}, {"id": "u1-l3-f1-06", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "Conventional wisdom treats boredom as simply an absence of stimulation to be escaped. Some psychologists now argue otherwise. In studies, people prevented from filling every idle moment later showed more original thinking, as though a restless, unfilled mind had drifted into unexpected connections. Boredom, on this view, is not merely empty time but a state that can prime the mind for invention.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "People kept from filling idle moments later showed more original thinking.", "B": "Rather than being merely empty time to escape, boredom may prime the mind for original thinking.", "C": "Psychology has produced many surprising findings about the human mind.", "D": "Because boredom fosters creativity, constant stimulation reliably makes people more inventive."}, "correct": "B", "choice_families": {"C": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage revises the view of boredom as mere emptiness, proposing it can spur invention. Choice A states that central point.", "why_wrong": {"C": "A general statement about psychology's surprises is broader than this passage's argument.", "D": "The passage links creativity to boredom, not to constant stimulation; this reverses the relationship.", "A": "The study result is the evidence for the idea, a detail too narrow to be the main idea itself."}}, {"id": "u1-l3-f1-07", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "Historians once described the medieval guild mainly as a body that fixed prices. That role was real, but narrow. Guilds also trained apprentices, guaranteed the quality of goods, supported members who fell ill, and represented their trades to city governments. Seen whole, the guild was less a price-fixing cartel than a broad institution woven through the economic and civic life of the town.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Medieval towns were governed by a complex web of institutions.", "B": "Guilds supported members who were unable to work because of illness.", "C": "The medieval guild was not merely a price-fixing body but a broad institution central to a town's economic and civic life.", "D": "Because guilds did so much beyond fixing prices, they had little influence over prices at all."}, "correct": "C", "choice_families": {"B": "Çok dar", "D": "Ters ilişki", "A": "Çok geniş"}, "why_correct": "The passage widens the guild from a price-fixer to a broad civic and economic institution. Choice A captures that central revision.", "why_wrong": {"B": "Support for ill members is one of several functions, a detail too narrow to be the main idea.", "D": "The passage affirms guilds fixed prices; this denies it and reverses the point.", "A": "A general claim about medieval town governance is broader than this passage's focus on guilds."}}, {"id": "u1-l3-f1-08", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "A popular account holds that the potato transformed Europe simply by providing more calories. The truth is subtler. Because potatoes grew underground, they survived the trampling and burning that ruined grain fields during wars, giving populations a food supply that armies could not easily destroy. The crop's real advantage lay not only in yield but in its resilience amid conflict.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because potatoes yielded so many calories, European wars became less frequent.", "B": "Potatoes grow underground, unlike grain, which grows above the soil.", "C": "Warfare has repeatedly shaped the agricultural history of Europe.", "D": "The potato's importance to Europe lay not only in its calories but in its resilience, since it survived the ravages of war that destroyed grain."}, "correct": "D", "choice_families": {"B": "Çok dar", "C": "Çok geniş", "A": "Ters ilişki"}, "why_correct": "The passage argues the potato mattered for its wartime resilience, not calories alone. Choice A states that central point.", "why_wrong": {"B": "That potatoes grow underground is the reason behind the claim, a detail too narrow to be the main idea.", "C": "A broad statement about war and agriculture is wider than this passage's specific argument.", "A": "The passage never says potatoes reduced warfare; this invents and reverses a relationship."}}, {"id": "u1-l3-f1-09", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "The tuatara, a reptile of New Zealand, is often called a living fossil, as though it had stopped evolving. Genetic study undercuts the label. Although its body plan has changed little, its DNA has accumulated mutations faster than that of many mammals. The tuatara has not stood still in time; it has simply changed in ways the skeleton does not reveal.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Despite its 'living fossil' label, the tuatara has continued to evolve, changing genetically even as its body plan stayed similar.", "B": "The tuatara's DNA has accumulated mutations faster than that of many mammals.", "C": "New Zealand is home to many unusual and ancient animal species.", "D": "Because the tuatara's body has changed little, its DNA has changed little as well."}, "correct": "A", "choice_families": {"B": "Çok dar", "C": "Çok geniş", "D": "Ters ilişki"}, "why_correct": "The passage rejects the 'living fossil' label, showing the tuatara evolves genetically despite a stable body. Choice A captures that point.", "why_wrong": {"B": "The fast mutation rate is the evidence, a detail too narrow to be the whole main idea.", "C": "A general remark about New Zealand's fauna is broader than this passage's focus.", "D": "The passage says the DNA changed despite a stable body; this reverses that contrast."}}, {"id": "u1-l3-f1-10", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok dar", "passage": "We tend to picture deserts as lifeless, but many are shaped by life at its smallest. Across vast dry expanses, a fragile crust of microbes, algae, and lichens binds the surface, holding moisture, fixing nitrogen, and keeping the sand from blowing away. Disturb this living skin and the desert loses its footing. The apparent emptiness rests on an unseen biological scaffolding.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "The desert crust helps keep sand from blowing away in the wind.", "B": "Far from lifeless, many deserts depend on a fragile living crust of microorganisms that stabilizes and sustains the surface.", "C": "Deserts cover a large fraction of the Earth's land surface.", "D": "Because the desert crust is so fragile, the microbes within it play no lasting role."}, "correct": "B", "choice_families": {"C": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage argues the seemingly empty desert rests on a living microbial crust. Choice A states that central point.", "why_wrong": {"C": "The global extent of deserts is broader than this passage's specific argument.", "D": "The passage says the fragile crust is essential; this denies its role and reverses the point.", "A": "Holding down sand is one function of the crust, a detail too narrow to be the main idea."}}, {"id": "u1-l3-f2-01", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "In the 1600s, Dutch painters turned increasingly to everyday subjects: a maid pouring milk, a table of fruit, a quiet courtyard. This shift accompanied the rise of a merchant middle class that bought art for its homes rather than for churches or palaces. The ordinary scenes reflected, and appealed to, the tastes of these new patrons.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Art has always mirrored the values of the society that produces it.", "B": "Dutch painters' turn to everyday subjects in the 1600s reflected the tastes of a rising merchant class that bought art for the home.", "C": "A maid pouring milk was one of the everyday subjects Dutch painters favored.", "D": "Because merchants preferred everyday scenes, Dutch painters abandoned religious subjects entirely."}, "correct": "B", "choice_families": {"C": "Çok dar", "D": "Ters ilişki", "A": "Çok geniş"}, "why_correct": "The passage ties the turn to everyday subjects to the tastes of a new merchant class. Choice A states that specific main idea.", "why_wrong": {"C": "The milkmaid is one example, a detail too narrow to be the main idea.", "D": "The passage never says religious subjects were entirely abandoned; this overstates and reverses the point.", "A": "A sweeping claim about all art and society is far broader than this passage's specific case."}}, {"id": "u1-l3-f2-02", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "A study of urban crows found that individuals learned to drop hard-shelled nuts onto crosswalks, wait for passing cars to crack them, and retrieve the exposed kernels when the traffic light stopped the cars. Younger crows appeared to acquire the trick by watching older ones, suggesting the behavior spread through observation rather than instinct.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Crows drop hard-shelled nuts onto crosswalks for cars to crack.", "B": "Animals are far more intelligent than people have traditionally believed.", "C": "Urban crows appear to learn a nut-cracking technique by observing others, indicating the behavior spreads through learning rather than instinct.", "D": "Because the behavior is instinctive, young crows perform it without needing to watch others."}, "correct": "C", "choice_families": {"B": "Çok geniş", "D": "Ters ilişki", "A": "Çok dar"}, "why_correct": "The passage's point is that crows learn the technique socially, not by instinct. Choice A states it precisely.", "why_wrong": {"B": "A broad claim about all animal intelligence is far wider than this passage's specific finding.", "D": "The passage attributes the behavior to learning, not instinct; this reverses its central claim.", "A": "The crosswalk detail is one part of the technique, too narrow to be the main idea."}}, {"id": "u1-l3-f2-03", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "When a nineteenth-century engineer proposed filtering a city's drinking water, officials resisted the cost. Then a cholera outbreak traced to a single contaminated well made the danger vivid, and support for filtration grew rapidly. The episode shows how a concrete, local disaster could overcome resistance that abstract warnings had failed to move.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Because officials feared the cost, no water filtration was ever adopted in the city.", "B": "Public health measures have saved countless lives over the course of history.", "C": "The cholera outbreak was traced to a single contaminated well.", "D": "A vivid local outbreak succeeded in winning support for water filtration where abstract warnings about risk had failed."}, "correct": "D", "choice_families": {"B": "Çok geniş", "C": "Çok dar", "A": "Ters ilişki"}, "why_correct": "The passage argues a concrete disaster overcame resistance that abstract warnings could not. Choice A states that specific point.", "why_wrong": {"B": "A sweeping claim about public health across history is far broader than this single episode.", "C": "The single well is one detail of the outbreak, too narrow to be the main idea.", "A": "The passage says support for filtration grew; this claims none was adopted, reversing the outcome."}}, {"id": "u1-l3-f2-04", "unit": 1, "lesson": 3, "lesson_name": "Central Ideas and Details", "target_family": "Çok geniş", "passage": "A team studying an ancient shipwreck expected its cargo of amphorae to hold wine, the common trade good of the era. Chemical residue told a different story: the jars had carried fish sauce, a prized condiment. The find suggests that the region's trade was more varied than the usual focus on wine and grain had implied.", "stem": "Which choice best states the main idea of the text?", "choices": {"A": "Residue showing the shipwreck's jars held fish sauce rather than wine suggests the region's trade was m
