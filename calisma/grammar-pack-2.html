, {"k": "Modifiers", "p": "<u>Awarded the highest safety rating in its category for three consecutive years, consumer advocates praised the vehicle for its reliability and crashworthiness.</u>", "q": "Which revision corrects the dangling modifier?", "o": ["A) Awarded the highest safety rating in its category for three consecutive years, the vehicle was praised by consumer advocates for its reliability and crashworthiness.", "B) Consumer advocates praised the vehicle, which had been awarded the highest safety rating in its category for three consecutive years, for its reliability and crashworthiness.", "C) The vehicle, awarded the highest safety rating in its category for three consecutive years, was praised by consumer advocates for its reliability and crashworthiness.", "D) All of the above"], "a": 3, "e": "D is correct. All three revisions correctly fix the dangling modifier. A uses a passive main clause with 'the vehicle' as subject. B uses a relative clause. C uses a participial phrase within the main clause. All are grammatically valid.\n\nA — correct.\nB — correct.\nC — correct.\nD is correct because all three are valid."}, {"k": "Modifiers", "p": "The conference on artificial intelligence ethics drew over two thousand attendees from forty countries. <u>Spanning three days and featuring keynote speakers from academia, industry, and government, participants engaged in discussions about regulation, bias, and accountability.</u>", "q": "Which revision is correct?", "o": ["A) Spanning three days and featuring keynote speakers from academia, industry, and government, the conference provided participants with opportunities to discuss regulation, bias, and accountability.", "B) Participants, spanning three days and featuring keynote speakers from academia, industry, and government, engaged in discussions about regulation, bias, and accountability.", "C) Spanning three days and featuring keynote speakers, participants engaged in discussions about regulation, bias, and accountability.", "D) No change needed."], "a": 0, "e": "A is correct. 'Spanning three days and featuring keynote speakers' modifies the conference (a three-day event featuring speakers). The main clause must open with 'the conference.'\n\nB — 'participants' cannot span three days or feature keynote speakers.\nC — same error as the original; 'participants' cannot span three days.\nD — the original contains a dangling modifier."}, {"k": "Modifiers", "p": "Determined to publish the investigation before the election, <u>the story was released two days ahead of schedule by the editorial team</u>.", "q": "Which revision corrects the dangling modifier?", "o": ["A) Determined to publish the investigation before the election, the editorial team released the story two days ahead of schedule.", "B) The story was released two days ahead of schedule, determined to publish the investigation before the election.", "C) Determined to publish the investigation, the editorial team was ahead of schedule releasing the story.", "D) The editorial team, determined to publish the investigation before the election, released the story two days ahead of schedule."], "a": 0, "e": "A is correct. 'Determined to publish the investigation' describes the editorial team. The main clause must open with 'the editorial team.' Both A and D are grammatically correct, but A uses the participial phrase at the front (matching the original structure) while D uses it as an embedded non-restrictive clause.\n\nB — 'the story' cannot be determined to publish.\nC — 'was ahead of schedule releasing' is grammatically awkward.\nA is the cleaner correction."}, {"k": "Modifiers", "p": "The board of trustees convened an emergency session in response to the audit findings. <u>Having failed to detect the irregularities for three consecutive fiscal years, remedial action was immediately recommended by the compliance committee.</u>", "q": "Which revision is correct?", "o": ["A) Having failed to detect the irregularities for three consecutive fiscal years, the compliance committee immediately recommended remedial action.", "B) Having failed to detect the irregularities for three consecutive fiscal years, the board of trustees accepted the compliance committee's recommendation for remedial action.", "C) The compliance committee, having failed to detect the irregularities for three consecutive fiscal years, immediately recommended remedial action.", "D) A or C"], "a": 3, "e": "D is correct. Both A and C correctly fix the dangling modifier. 'Having failed to detect the irregularities' must be performed by the compliance committee (or the board — who failed to detect?). Both A and C make 'the compliance committee' the subject performing the failing-to-detect action.\n\nB — 'the board of trustees' could also have failed to detect; B is plausible but changes who makes the recommendation.\nD is correct because A and C are both valid."}]}, {"n": 6, "topic": "Modifiers — Advanced", "diff": "Advanced Parallel Structure in Context", "qs": [{"k": "Parallel Structure", "p": "The foundation's mission is to identify promising researchers at an early stage of their careers, to provide them with funding and mentorship, <u>and connecting them with professional networks that can sustain their work over the long term</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and connect them with professional networks that can sustain their work over the long term.", "B) and to connect them with professional networks that can sustain their work over the long term.", "C) and connection with professional networks that can sustain their work over the long term.", "D) as well as to connect them with professional networks that can sustain their work over the long term."], "a": 1, "e": "B is correct. The list uses 'to + verb' infinitives: 'to identify,' 'to provide.' The third item must be 'to connect.'\n\nA — 'connect' without 'to' breaks the infinitive pattern.\nC — 'connection' is a noun, breaking the pattern.\nD — 'as well as to connect' uses a non-parallel connector."}, {"k": "Parallel Structure", "p": "The report criticized the company's failure to disclose material risks, <u>misrepresenting financial projections, and the manipulation of earnings data prior to the quarterly report</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) for misrepresenting financial projections, and for manipulating earnings data prior to the quarterly report.", "B) misrepresenting financial projections, and to manipulate earnings data prior to the quarterly report.", "C) its misrepresentation of financial projections, and its manipulation of earnings data prior to the quarterly report.", "D) to misrepresent financial projections, and the manipulation of earnings data prior to the quarterly report."], "a": 2, "e": "C is correct. The list follows 'failure to disclose' — all three items should be parallel noun phrases functioning as objects of 'failure': 'failure to disclose material risks,' 'its misrepresentation,' 'its manipulation.' Among the options, C provides parallel possessive noun phrases.\n\nA — shifts to prepositional phrases ('for misrepresenting'), breaking the pattern.\nB — 'misrepresenting' (gerund) and 'to manipulate' (infinitive) are not parallel.\nD — mixes infinitive and noun phrase."}, {"k": "Parallel Structure", "p": "The supervisor's annual review praised the analyst for her thoroughness in data collection, <u>for the clarity she brought to complex interpretations, and maintaining meticulous documentation throughout the project</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) for the clarity she brought to complex interpretations, and for maintaining meticulous documentation throughout the project.", "B) clarity in complex interpretations, and meticulous documentation throughout the project.", "C) for clarity in complex interpretations, and for meticulous documentation throughout the project.", "D) A or C"], "a": 3, "e": "D is correct. The list uses 'for + noun phrase' or 'for + gerund phrase.' A provides 'for the clarity she brought' and 'for maintaining.' C provides 'for clarity' and 'for meticulous documentation.' Both maintain the 'for + [phrase]' pattern.\n\nB — drops the 'for,' breaking the parallel structure.\nD is correct because A and C are both valid."}, {"k": "Parallel Structure", "p": "Ethnographers studying the community documented how residents organized their time around agricultural cycles, <u>how communal decisions were made by consensus, and the way spiritual practices were integrated into daily routines</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) how communal decisions were made by consensus, and how spiritual practices were integrated into daily routines.", "B) how communal decisions were made by consensus, and spiritual practices' integration into daily routines.", "C) communal decision-making by consensus, and spiritual practices integrated into daily routines.", "D) how communal decisions were made by consensus, and the integration of spiritual practices into daily routines."], "a": 0, "e": "A is correct. The list uses 'how + clause': 'how residents organized' and 'how communal decisions were made.' The third item must also be 'how + clause': 'how spiritual practices were integrated.'\n\nB — 'spiritual practices' integration' is a noun phrase, breaking the 'how' clause pattern.\nC — shifts to noun phrases entirely, losing the 'how + clause' pattern.\nD — 'the integration of spiritual practices' is a noun phrase, breaking the pattern."}, {"k": "Parallel Structure", "p": "The expedition's success depended on the team's physical endurance, <u>the precision with which they navigated the difficult terrain, and trusting the judgment of local guides who knew the mountain's changing conditions</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) precise navigation of difficult terrain, and trust in the judgment of local guides who knew the mountain's changing conditions.", "B) the precision with which they navigated the difficult terrain, and the trust they placed in local guides who knew the mountain's changing conditions.", "C) navigating difficult terrain with precision, and trusting the judgment of local guides who knew the mountain's changing conditions.", "D) their precise navigation of difficult terrain, and their trust in the judgment of local guides who knew the mountain's changing conditions."], "a": 1, "e": "B is correct. The list uses possessive noun phrases: 'the team's physical endurance,' 'the precision with which they navigated.' The third item must continue with a noun phrase of similar form: 'the trust they placed in local guides.' B maintains the 'the + noun + subordinate element' structure.\n\nA — 'precise navigation' drops the article 'the' and the relative structure.\nC — shifts to gerund phrases.\nD — changes to possessive pronouns ('their'), which slightly alters the structure from the opening 'the team's.'"}, {"k": "Parallel Structure", "p": "The environmental impact assessment required developers to demonstrate that the proposed facility would not contaminate local water sources, <u>would not significantly disrupt wildlife migration patterns, and the air quality standards in the surrounding communities would be met</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) would not significantly disrupt wildlife migration patterns, and would meet air quality standards in the surrounding communities.", "B) would not significantly disrupt wildlife migration patterns, and meeting air quality standards in the surrounding communities.", "C) would not significantly disrupt wildlife migration patterns, and air quality standards in the surrounding communities would be met.", "D) would not significantly disrupting wildlife migration patterns, and would meet air quality standards in the surrounding communities."], "a": 0, "e": "A is correct. The list uses 'would not + verb' or 'would + verb': 'would not contaminate,' 'would not...disrupt.' The third item must follow the same modal pattern: 'would meet.'\n\nB — 'meeting' is a gerund, breaking the modal verb pattern.\nC — shifts to 'air quality standards would be met' (passive), breaking the active 'would' pattern.\nD — 'would not significantly disrupting' is grammatically incorrect."}, {"k": "Parallel Structure", "p": "The CEO outlined the company's three strategic priorities: expanding into emerging markets in Southeast Asia, <u>strengthening the supply chain through vertical integration, and to reduce the company's carbon footprint by forty percent before 2030</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) strengthening the supply chain through vertical integration, and reducing the company's carbon footprint by forty percent before 2030.", "B) to strengthen the supply chain through vertical integration, and reduce the company's carbon footprint by forty percent before 2030.", "C) strengthening the supply chain through vertical integration, and the reduction of the company's carbon footprint by forty percent before 2030.", "D) the strengthening of the supply chain through vertical integration, and to reduce the company's carbon footprint by forty percent before 2030."], "a": 0, "e": "A is correct. The list follows a colon and uses gerunds: 'expanding,' 'strengthening.' The third item must also be a gerund: 'reducing.'\n\nB — shifts to infinitives ('to strengthen,' 'reduce'), breaking the gerund pattern.\nC — 'the reduction of' is a noun phrase, breaking the gerund pattern.\nD — mixes noun phrase and infinitive with gerund."}, {"k": "Parallel Structure", "p": "Historians have noted that the general was admired by his troops for his decisiveness in battle, <u>his willingness to share the hardships of his soldiers, and because he never asked his men to do what he was unwilling to do himself</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) his willingness to share the hardships of his soldiers, and his refusal to ask his men to do what he was unwilling to do himself.", "B) his willingness to share the hardships of his soldiers, and the fact that he never asked his men to do what he was unwilling to do himself.", "C) his willingness to share the hardships of his soldiers, and he never asked his men to do what he was unwilling to do himself.", "D) his willingness to share the hardships of his soldiers, and never asking his men to do what he was unwilling to do himself."], "a": 0, "e": "A is correct. The list uses possessive noun phrases: 'his decisiveness,' 'his willingness.' The third item must be a possessive noun phrase: 'his refusal.'\n\nB — 'the fact that he never asked' is a noun clause, not a possessive noun phrase.\nC — 'he never asked' is an independent clause, breaking the pattern.\nD — 'never asking' is a gerund phrase, breaking the possessive noun phrase pattern."}, {"k": "Parallel Structure", "p": "The treaty required signatories to reduce greenhouse gas emissions by thirty percent before 2035, <u>to establish national carbon pricing mechanisms by 2028, and submitting annual progress reports to an independent international review body</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) to establish national carbon pricing mechanisms by 2028, and to submit annual progress reports to an independent international review body.", "B) to establish national carbon pricing mechanisms by 2028, and the submission of annual progress reports to an independent international review body.", "C) establishing national carbon pricing mechanisms by 2028, and submit annual progress reports to an independent international review body.", "D) to establish national carbon pricing mechanisms by 2028, and they must submit annual progress reports to an independent international review body."], "a": 0, "e": "A is correct. The list uses 'to + verb' infinitives: 'to reduce,' 'to establish.' The third item must be 'to submit.'\n\nB — 'the submission of' is a noun phrase, breaking the infinitive pattern.\nC — 'establishing' is a gerund, 'submit' is a bare infinitive; neither matches 'to + verb.'\nD — 'they must submit' is an independent clause, breaking the pattern."}, {"k": "Parallel Structure", "p": "The board evaluated candidates on three criteria: the depth of their experience in international finance, <u>whether they demonstrated the ability to manage large cross-functional teams, and their vision for the company's expansion into new markets</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) the depth of their experience in international finance, their ability to manage large cross-functional teams, and their vision for the company's expansion into new markets.", "B) the depth of their experience in international finance, whether they demonstrated the ability to manage large cross-functional teams, and their vision for the company's expansion into new markets.", "C) depth of experience in international finance, the ability to manage large cross-functional teams, and vision for the company's expansion into new markets.", "D) A or C"], "a": 0, "e": "A is correct. All three items should be parallel noun phrases: 'the depth of their experience,' 'their ability to manage,' 'their vision.' Option A makes all three items parallel possessive noun phrases.\n\nB — 'whether they demonstrated' is a noun clause, which is not parallel to the noun phrases flanking it.\nC — drops articles and possessives inconsistently.\nD — D is incorrect because C is not fully parallel (inconsistent article use).\nA is the correct choice."}, {"k": "Parallel Structure", "p": "The scientist argued that her findings contradicted three widely held assumptions: that dietary fat is inherently harmful, <u>that caloric restriction is the primary driver of sustainable weight loss, and exercise is more important than diet for long-term health outcomes</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) that caloric restriction is the primary driver of sustainable weight loss, and that exercise is more important than diet for long-term health outcomes.", "B) that caloric restriction is the primary driver of sustainable weight loss, and the importance of exercise over diet for long-term health outcomes.", "C) that caloric restriction is the primary driver of sustainable weight loss, and exercise being more important than diet for long-term health outcomes.", "D) the primacy of caloric restriction as a driver of sustainable weight loss, and exercise being more important than diet for long-term health outcomes."], "a": 0, "e": "A is correct. The list uses 'that + clause': 'that dietary fat is inherently harmful,' 'that caloric restriction is the primary driver.' The third item must also be 'that + clause': 'that exercise is more important.'\n\nB — 'the importance of exercise' is a noun phrase, breaking the 'that + clause' pattern.\nC — 'exercise being more important' is a participial phrase, breaking the pattern.\nD — shifts entirely to noun phrases, breaking the 'that + clause' pattern."}, {"k": "Parallel Structure", "p": "Critics praised the production for its innovative staging, <u>the nuanced performances delivered by the lead actors, and because the script retained the thematic complexity of the original novel</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) its innovative staging, the nuanced performances delivered by the lead actors, and the script's faithful retention of the original novel's thematic complexity.", "B) its innovative staging, nuanced lead performances, and the script's thematic complexity.", "C) its innovative staging, its nuanced lead performances, and its script's faithful retention of the original novel's thematic complexity.", "D) B or C"], "a": 1, "e": "B is correct. The list follows 'for its + noun phrase': 'for its innovative staging.' B provides clean, parallel noun phrases: 'innovative staging,' 'nuanced lead performances,' 'the script's thematic complexity.'\n\nA — 'its innovative staging,' 'the nuanced performances,' 'the script's faithful retention' — inconsistent use of possessives.\nC — 'its script's' is a double possessive that is grammatically awkward.\nD — C has an awkward double possessive.\nB is cleanest."}, {"k": "Parallel Structure", "p": "The candidate's platform called for reforming the tax code to eliminate loopholes benefiting large corporations, <u>investing in renewable energy infrastructure through public-private partnerships, and to create a national job retraining program for workers displaced by automation</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) investing in renewable energy infrastructure through public-private partnerships, and creating a national job retraining program for workers displaced by automation.", "B) to invest in renewable energy infrastructure through public-private partnerships, and creating a national job retraining program for workers displaced by automation.", "C) the investment in renewable energy infrastructure through public-private partnerships, and creating a national job retraining program for workers displaced by automation.", "D) investment in renewable energy infrastructure through public-private partnerships, and the creation of a national job retraining program for workers displaced by automation."], "a": 0, "e": "A is correct. The list uses gerunds following 'for': 'reforming the tax code' and 'investing in renewable energy.' The third must also be a gerund: 'creating.'\n\nB — mixes infinitive 'to invest' with gerund 'creating.'\nC — 'the investment in' is a noun phrase.\nD — 'investment in' and 'the creation of' are noun phrases."}, {"k": "Parallel Structure", "p": "The diplomatic delegation's goals were to secure a bilateral trade agreement, <u>to establish a framework for joint scientific research, and gaining formal recognition of the two nations' disputed maritime boundaries</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) to establish a framework for joint scientific research, and to gain formal recognition of the two nations' disputed maritime boundaries.", "B) establishing a framework for joint scientific research, and gaining formal recognition of the two nations' disputed maritime boundaries.", "C) to establish a framework for joint scientific research, and the formal recognition of the two nations' disputed maritime boundaries.", "D) a framework for joint scientific research, and formal recognition of the two nations' disputed maritime boundaries."], "a": 0, "e": "A is correct. The list uses 'to + verb' infinitives: 'to secure,' 'to establish.' The third item must be 'to gain.'\n\nB — shifts to gerunds: 'establishing,' 'gaining.'\nC — 'the formal recognition of' is a noun phrase.\nD — drops the infinitive entirely, using noun phrases."}, {"k": "Parallel Structure", "p": "The documentary profiles three photographers who have spent their careers documenting communities affected by climate change: one who focuses on coastal erosion in Bangladesh, <u>one who captures life in drought-stricken regions of sub-Saharan Africa, and another whose work examines wildfire displacement in the American West</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) one who captures life in drought-stricken regions of sub-Saharan Africa, and one who examines wildfire displacement in the American West.", "B) one who captures life in drought-stricken regions of sub-Saharan Africa, and another examining wildfire displacement in the American West.", "C) one capturing life in drought-stricken regions of sub-Saharan Africa, and another who examines wildfire displacement in the American West.", "D) No change — the current structure is acceptable."], "a": 3, "e": "D is correct. The list uses 'one who + verb' for the first two items and 'another whose work + verb' for the third. While 'another whose work examines' slightly varies the structure, on the SAT this is acceptable because the variation (one who/another whose) is a standard English construction for enumerating people. The underlying structure (relative clause modifier) is consistent.\n\nA — changes 'another' to 'one,' making all three identical, which is slightly monotonous but also correct.\nB — 'another examining' uses a participial, varying the construction.\nC — 'one capturing' is participial for the second item, inconsistent.\nD is correct — the original structure is acceptable."}, {"k": "Parallel Structure", "p": "The training program is designed to help participants identify cognitive biases that affect decision-making, <u>to develop strategies for mitigating those biases in professional contexts, and applying these skills to real case studies drawn from participants' own industries</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) to develop strategies for mitigating those biases in professional contexts, and to apply these skills to real case studies drawn from participants' own industries.", "B) developing strategies for mitigating those biases in professional contexts, and applying these skills to real case studies drawn from participants' own industries.", "C) to develop strategies for mitigating those biases in professional contexts, and the application of these skills to real case studies drawn from participants' own industries.", "D) to develop strategies for mitigating those biases in professional contexts, and apply these skills to real case studies drawn from participants' own industries."], "a": 0, "e": "A is correct. The list uses 'to + verb' infinitives: 'to identify,' 'to develop.' The third must be 'to apply.'\n\nB — shifts to gerunds.\nC — 'the application of' is a noun phrase.\nD — 'apply' without 'to' breaks the infinitive pattern."}, {"k": "Parallel Structure", "p": "The new trade agreement has been criticized for failing to protect domestic manufacturers from unfair competition, <u>to address currency manipulation by trading partners, and inadequate enforcement mechanisms for labor and environmental standards</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) for failing to protect domestic manufacturers from unfair competition, to address currency manipulation by trading partners, and to include adequate enforcement mechanisms for labor and environmental standards.", "B) for failing to protect domestic manufacturers from unfair competition, for failing to address currency manipulation by trading partners, and for failing to include adequate enforcement mechanisms for labor and environmental standards.", "C) for failing to protect domestic manufacturers from unfair competition, to address currency manipulation by trading partners, and the inclusion of inadequate enforcement mechanisms for labor and environmental standards.", "D) A or B"], "a": 3, "e": "D is correct. Both A and B correctly fix the parallel structure. A uses 'to + verb' infinitives after 'failing': 'to protect,' 'to address,' 'to include.' B uses 'for failing to + verb' for all three: 'for failing to protect,' 'for failing to address,' 'for failing to include.' Both are parallel.\n\nC — 'the inclusion of inadequate enforcement mechanisms' is a noun phrase, breaking the pattern.\nD is correct."}, {"k": "Parallel Structure", "p": "The panel of judges evaluated the entries on four criteria: the originality of the concept, the technical execution of the design, <u>how well it communicated its intended message to a general audience, and whether it demonstrated cultural sensitivity</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) how well it communicated its intended message to a general audience, and whether it demonstrated cultural sensitivity", "B) the clarity with which it communicated its intended message to a general audience, and its demonstration of cultural sensitivity.", "C) how well it communicated its intended message to a general audience, and the cultural sensitivity it demonstrated.", "D) B is the only correct answer."], "a": 3, "e": "D is correct. The list uses noun phrases: 'the originality of the concept,' 'the technical execution of the design.' For parallel structure, the third and fourth items should also be noun phrases. B provides: 'the clarity with which it communicated its intended message' and 'its demonstration of cultural sensitivity' — both noun phrases.\n\nA — 'how well it communicated' and 'whether it demonstrated' are clauses, not parallel to the noun phrases.\nC — 'how well it communicated' is a clause; 'the cultural sensitivity it demonstrated' is a noun phrase; inconsistent.\nD is correct — B is the only fully parallel option."}, {"k": "Parallel Structure", "p": "The investigation revealed that the suspect had entered the building through an unlocked service entrance, <u>had disabled the security cameras in the main corridor, and the safe was accessed using a stolen keycard</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) had disabled the security cameras in the main corridor, and had accessed the safe using a stolen keycard.", "B) disabled the security cameras in the main corridor, and accessed the safe using a stolen keycard.", "C) had disabled the security cameras in the main corridor, and the safe was accessed using a stolen keycard.", "D) disabling the security cameras in the main corridor, and accessing the safe using a stolen keycard."], "a": 0, "e": "A is correct. The list uses 'had + past participle': 'had entered,' 'had disabled.' The third item must be 'had accessed.'\n\nB — drops 'had,' using simple past; inconsistent with the sequence of actions.\nC — shifts to passive voice with 'the safe was accessed.'\nD — shifts to gerunds."}, {"k": "Parallel Structure", "p": "The professor argued that the course would equip students to analyze primary sources critically, <u>to situate historical events within their broader social and economic contexts, and they would learn to construct evidence-based arguments that engage with existing scholarship</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) to situate historical events within their broader social and economic contexts, and to construct evidence-based arguments that engage with existing scholarship.", "B) situating historical events within their broader social and economic contexts, and constructing evidence-based arguments that engage with existing scholarship.", "C) to situate historical events within their broader social and economic contexts, and constructing evidence-based arguments that engage with existing scholarship.", "D) to situate historical events within their broader social and economic contexts, and the construction of evidence-based arguments that engage with existing scholarship."], "a": 0, "e": "A is correct. The list uses 'to + verb' infinitives: 'to analyze,' 'to situate.' The third must be 'to construct.'\n\nB — shifts to gerunds.\nC — mixes infinitive 'to situate' with gerund 'constructing.'\nD — 'the construction of' is a noun phrase."}, {"k": "Parallel Structure", "p": "The conservation strategy outlines three priorities: restoring degraded ecosystems through targeted reforestation programs, <u>protecting critically endangered species by expanding wildlife corridors, and to reduce illegal poaching through stricter enforcement and community-based monitoring</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) protecting critically endangered species by expanding wildlife corridors, and reducing illegal poaching through stricter enforcement and community-based monitoring.", "B) to protect critically endangered species by expanding wildlife corridors, and reduce illegal poaching through stricter enforcement and community-based monitoring.", "C) to protect critically endangered species by expanding wildlife corridors, and to reduce illegal poaching through stricter enforcement and community-based monitoring.", "D) the protection of critically endangered species by expanding wildlife corridors, and the reduction of illegal poaching through stricter enforcement and community-based monitoring."], "a": 0, "e": "A is correct. The list follows a colon and uses gerunds: 'restoring,' 'protecting.' The third must also be a gerund: 'reducing.'\n\nB — shifts to infinitives 'to protect' and bare 'reduce.'\nC — shifts to infinitives 'to protect' and 'to reduce.'\nD — shifts to noun phrases."}, {"k": "Parallel Structure", "p": "The journalist's investigation uncovered evidence of three forms of misconduct: the falsification of expense reports, <u>the acceptance of undisclosed payments from lobbyists, and that contracts were awarded to companies with which senior officials had undisclosed financial ties</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) the acceptance of undisclosed payments from lobbyists, and the awarding of contracts to companies with which senior officials had undisclosed financial ties.", "B) the acceptance of undisclosed payments from lobbyists, and contracts were awarded to companies with which senior officials had undisclosed financial ties.", "C) accepting undisclosed payments from lobbyists, and awarding contracts to companies with which senior officials had undisclosed financial ties.", "D) the acceptance of undisclosed payments from lobbyists, and the fact that contracts were awarded to companies with which senior officials had undisclosed financial ties."], "a": 0, "e": "A is correct. The list follows a colon and uses 'the + noun phrase': 'the falsification of expense reports,' 'the acceptance of undisclosed payments.' The third must be 'the awarding of contracts.'\n\nB — 'contracts were awarded' is an independent clause, breaking the noun phrase pattern.\nC — shifts to gerunds.\nD — 'the fact that' introduces a noun clause."}, {"k": "Parallel Structure", "p": "The senator's speech called on citizens to hold their elected officials accountable, to demand transparency in government contracting, <u>and voting for candidates who prioritize public interest over private gain</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and to vote for candidates who prioritize public interest over private gain.", "B) and vote for candidates who prioritize public interest over private gain.", "C) and the voting for candidates who prioritize public interest over private gain.", "D) and they should vote for candidates who prioritize public interest over private gain."], "a": 0, "e": "A is correct. The list uses 'to + verb' infinitives: 'to hold,' 'to demand.' The third must be 'to vote.'\n\nB — 'vote' without 'to' breaks the infinitive pattern.\nC — 'the voting for' is a noun phrase.\nD — 'they should vote' is an independent clause."}, {"k": "Parallel Structure", "p": "The new library policy requires that all visitors sign in upon arrival, that personal electronic devices be kept on silent mode, <u>and researchers must return all archival materials to the designated return desk before leaving</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) and that researchers return all archival materials to the designated return desk before leaving.", "B) and returning all archival materials to the designated return desk before leaving.", "C) and the returning of all archival materials to the designated return desk before leaving.", "D) and all archival materials are to be returned to the designated return desk by researchers before leaving."], "a": 0, "e": "A is correct. The list uses 'that + subject + verb' clauses: 'that all visitors sign in,' 'that personal electronic devices be kept.' The third must be 'that researchers return.'\n\nB — 'returning all archival materials' is a gerund phrase.\nC — 'the returning of' is a noun phrase.\nD — 'all archival materials are to be returned' is a passive independent clause."}, {"k": "Parallel Structure", "p": "The review board assessed the organization's performance on three dimensions: whether it had achieved its stated programmatic goals, <u>how efficiently it had deployed its financial resources, and the degree to which it had maintained stakeholder trust and transparency throughout the reporting period</u>.", "q": "Which choice maintains parallel structure?", "o": ["A) whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and whether it had maintained stakeholder trust and transparency throughout the reporting period.", "B) whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and the degree to which it had maintained stakeholder trust and transparency throughout the reporting period.", "C) whether it had achieved its stated programmatic goals, how efficiently it had deployed its financial resources, and how effectively it had maintained stakeholder trust and transparency throughout the reporting period.", "D) C is the only correct answer."], "a": 2, "e": "C is correct. The list uses interrogative clauses: 'whether it had achieved' (yes/no type) and 'how efficiently it had deployed' (manner/degree type). The third item should also be an interrogative clause: 'how effectively it had maintained' maintains the 'how + adverb + clause' pattern and is more parallel than 'the degree to which,' which is a noun phrase.\n\nA — 'whether it had maintained' is a yes/no clause; less parallel than a 'how' clause.\nB — the original; 'the degree to which' is a noun phrase, breaking the clause pattern.\nC — 'how effectively' maintains the 'how + adverb + clause' pattern.\nD is incorrect; B preserves the original error."}]}, {"n": 7, "topic": "Parallel Structure II", "diff": "Advanced Verb Tense & Mood in Paragraph Context", "qs": [{"k": "Verb Tense", "p": "The geologist's preliminary report, submitted in October, suggested that the mineral deposits <u>extended</u> well beyond the boundaries of the initial survey area. By the time the full study was published the following spring, more advanced imaging technology had confirmed that the deposits were nearly twice as large as originally estimated.", "q": "Is the underlined verb form correct in context?", "o": ["A) Yes — 'extended' is the correct simple past in a reported speech context.", "B) No — 'had extended' is needed to show the extension preceded the report's submission.", "C) Yes — the backshifted past in reported speech ('suggested that...extended') is correct.", "D) A and C"], "a": 3, "e": "D is correct. In reported speech following a past reporting verb ('suggested'), the verb in the that-clause is backshifted: present becomes past. 'The deposits extended' (backshifted from 'extend') is correct. Both A and C express this correctly.\n\nB — 'had extended' would imply the extension was completed before another past event, which changes the meaning; simple past is correct for reported speech backshift.\nD is correct."}, {"k": "Verb Tense", "p": "When the inspection team arrived at the facility last Tuesday, they discovered that the cooling system <u>malfunctioned</u> for more than six hours before anyone on site had reported the issue to the maintenance department.", "q": "Which verb form is correct?", "o": ["A) malfunctioned", "B) had malfunctioned", "C) was malfunctioning", "D) has been malfunctioning"], "a": 1, "e": "B is correct. 'By the time the team arrived' implies a sequence: the malfunction happened (and had been ongoing) before the team arrived. The past perfect 'had malfunctioned' correctly shows this prior action.\n\nA — simple past does not establish the prior sequence.\nC — past progressive 'was malfunctioning' implies the malfunction was still ongoing when they arrived; possible but 'more than six hours before' requires the past perfect to show completion before the arrival.\nD — 'has been malfunctioning' is present perfect progressive; incorrect for a past context."}, {"k": "Verb Tense", "p": "The resolution required that each participating government <u>submits</u> a detailed implementation plan to the secretariat within ninety days of ratification.", "q": "Which verb form is correct?", "o": ["A) No change — 'submits' is correct in this context.", "B) 'submit' — the subjunctive requires the base form.", "C) 'submitted' — past tense is required after 'required.'", "D) 'will submit' — future tense is needed to indicate an upcoming action."], "a": 1, "e": "B is correct. After 'required that,' the subjunctive mood is triggered, requiring the base form of the verb: 'that each government submit.' The base form is used regardless of the subject.\n\nA — 'submits' is indicative third-person singular, not subjunctive.\nC — 'submitted' is past tense, not subjunctive base form.\nD — 'will submit' is future indicative."}, {"k": "Verb Tense", "p": "Astronomers working with data from the new orbital telescope <u>have identified</u> seventeen previously unknown exoplanets since the instrument was launched eighteen months ago.", "q": "Is the underlined verb form correct?", "o": ["A) Yes — 'have identified' correctly captures ongoing discovery within a period that began in the past and continues to the present.", "B) No — 'identified' (simple past) is needed because the period of discovery is complete.", "C) No — 'had identified' is needed to show completion before another event.", "D) No — 'identify' is needed for a general scientific statement."], "a": 0, "e": "A is correct. 'Since the instrument was launched eighteen months ago' establishes a time frame that started in the past and continues to the present. The present perfect 'have identified' correctly captures this ongoing relevance.\n\nB — simple past 'identified' would imply the discovery period is complete, but 'since...eighteen months ago' indicates it is ongoing.\nC — 'had identified' is past perfect, used for actions before another past event.\nD — simple present 'identify' does not capture the relevance of the past-to-present timeframe."}, {"k": "Verb Tense", "p": "If the research team <u>had implemented</u> the revised protocols from the outset, the contamination of the control samples would have been avoided, and the entire study would not have needed to be repeated.", "q": "Is the verb form correct in the if-clause?", "o": ["A) Yes — 'had implemented' correctly forms the if-clause of a third conditional.", "B) No — 'implemented' (simple past) is needed for the if-clause of a third conditional.", "C) No — 'would have implemented' is needed for the if-clause.", "D) No — 'has implemented' is needed."], "a": 0, "e": "A is correct. In a third conditional (hypothetical past), the if-clause uses past perfect ('had implemented') and the result clause uses 'would have + past participle.' Both parts of the sentence are correctly formed.\n\nB — simple past 'implemented' is used in the second conditional (hypothetical present), not the third.\nC — 'would have implemented' belongs in the result clause, not the if-clause.\nD — 'has implemented' is present perfect."}, {"k": "Verb Tense", "p": "The chief engineer noted in her final memo that the structural assessment <u>will be</u> completed before the building is opened to the public.", "q": "Which verb form correctly handles the reported speech context?", "o": ["A) No change — 'will be' is correct as a direct quotation.", "B) 'would be' — in reported speech after a past verb ('noted'), future 'will' is backshifted to 'would.'", "C) 'had been' — past perfect is needed to show prior completion.", "D) 'has been' — present perfect is correct after a reporting verb."], "a": 1, "e": "B is correct. 'Noted' is a past reporting verb. In reported speech, future 'will' is backshifted to 'would': 'she noted that the assessment would be completed.' This is standard sequence-of-tenses in indirect speech.\n\nA — 'will be' is appropriate in direct speech but not in reported speech after a past verb.\nC — 'had been' would imply the assessment was already completed before the memo was written.\nD — 'has been' is present perfect; inappropriate after a past reporting verb."}, {"k": "Verb Tense", "p": "The policy mandates that every employee <u>completes</u> the mandatory training module within the first thirty days of their employment.", "q": "Which verb form is correct?", "o": ["A) No change — 'completes' is acceptable in a prescriptive policy statement.", "B) 'complete' — after 'mandates that,' the subjunctive base form is required.", "C) 'completed' — past tense is needed.", "D) 'will complete' — future is required for a prospective action."], "a": 1, "e": "B is correct. 'Mandates that' triggers the subjunctive. The base form 'complete' is required regardless of the subject ('every employee').\n\nA — 'completes' is indicative third-person singular, not subjunctive.\nC — 'completed' is past tense.\nD — 'will complete' is future indicative."}, {"k": "Verb Tense", "p": "The documentary crew <u>filmed</u> the entire migratory cycle before they realized that three of their cameras had malfunctioned during the first week, corrupting over forty hours of footage.", "q": "Is 'filmed' the correct verb form?", "o": ["A) Yes — simple past 'filmed' is correct for an action completed in the past.", "B) No — 'had filmed' is needed because the filming was completed before the realization.", "C) Yes — simple past is correct because the two actions occurred at the same time.", "D) No — 'were filming' is needed because the filming was still ongoing when they realized."], "a": 1, "e": "B is correct. 'Before they realized' signals that the filming was completed prior to the realization. Past perfect 'had filmed' correctly captures this sequence.\n\nA — simple past does not clarify that filming was complete before the realization.\nC — the actions did not occur simultaneously; filming preceded the realization.\nD — 'were filming' would imply the filming was still in progress when they realized."}, {"k": "Verb Tense", "p": "The commission's final report was more damning than analysts <u>have expected</u>. It documented not only the regulatory failures that had allowed the crisis to develop but also the systematic suppression of early warning signals by three senior officials.", "q": "Which verb form is correct?", "o": ["A) No change — 'have expected' is correct because analysts are still relevant.", "B) 'had expected' — the expectation existed before the report was released; past perfect is needed.", "C) 'expected' — simple past is sufficient for past expectations.", "D) B or C"], "a": 3, "e": "D is correct. Both B and C are grammatically acceptable. 'Had expected' (past perfect) more precisely shows that the expectations preceded the report. 'Expected' (simple past) is also grammatically correct in this context, though less precise. The SAT accepts both for past comparisons.\n\nA — 'have expected' (present perfect) implies the expectation is ongoing, which is unlikely after the report has already been released.\nD is correct."}, {"k": "Verb Tense", "p": "It is imperative that the laboratory director <u>reviews</u> the safety protocols before any new technicians are allowed to operate the high-pressure equipment.", "q": "Which verb form is correct?", "o": ["A) No change — 'reviews' is correct in a present-tense imperative context.", "B) 'reviewed' — past tense is needed.", "C) 'review' — after 'it is imperative that,' the subjunctive base form is required.", "D) 'will review' — future is needed."], "a": 2, "e": "C is correct. 'It is imperative that' is a subjunctive trigger. The base form 'review' is required regardless of the subject.\n\nA — 'reviews' is indicative third-person singular, not the subjunctive base form.\nB — 'reviewed' is past tense.\nD — 'will review' is future indicative."}, {"k": "Verb Tense", "p": "By the time the final round of negotiations concludes next month, the two governments <u>will negotiate</u> for nearly three years.", "q": "Which verb form is correct?", "o": ["A) No change — 'will negotiate' is correct as a future action.", "B) 'will have been negotiating' — future perfect progressive is needed for an ongoing action up to a future point.", "C) 'have been negotiating' — present perfect progressive is correct.", "D) 'had been negotiating' — past perfect progressive is needed."], "a": 1, "e": "B is correct. 'By the time the final round concludes next month' signals a future perfect context. An action ongoing up to a specific future point requires the future perfect progressive: 'will have been negotiating.'\n\nA — 'will negotiate' is simple future; does not express the ongoing duration.\nC — 'have been negotiating' is present perfect progressive; incorrect for a future reference.\nD — 'had been negotiating' is past perfect progressive; incorrect for a future context."}, {"k": "Verb Tense", "p": "The laboratory proposed that the trial <u>would be</u> extended by an additional six months to allow for a more robust assessment of the treatment's long-term side effects.", "q": "Is the verb form correct?", "o": ["A) Yes — 'would be' is acceptable in a reported speech context after 'proposed.'", "B) No — 'be' is needed; 'proposed that' triggers the subjunctive.", "C) Yes — 'would be' captures the conditional/future nature of the proposal.", "D) A and C"], "a": 3, "e": "D is correct. Both A and C are correct. 'Proposed that' can trigger either the subjunctive ('proposed that the trial be extended') or, in informal/semi-formal writing, the conditional 'would be.' The SAT accepts 'would be' after verbs like 'proposed' when the context implies a conditional future. Both A and C correctly describe why 'would be' is acceptable.\n\nB — while the formal subjunctive 'be' is also correct, 'would be' is not incorrect here.\nD is correct."}, {"k": "Verb Tense", "p": "Had the city council <u>acts</u> on the engineer's recommendation two years ago, the structural failure that collapsed the pedestrian bridge last spring might never have occurred.", "q": "Which verb form is correct?", "o": ["A) No change — 'acts' is needed for a general statement.", "B) 'acted' — simple past is needed in the if-clause of a third conditional.", "C) 'have acted' — the if-clause requires 'had + past participle.'", "D) 'acted' with the inversion: 'Had the city council acted...' already uses past perfect inversion."], "a": 3, "e": "D is correct. 'Had the city council [verb]' uses the inversion of the past perfect (dropping 'if' and inverting): 'Had the city council acted on...' The past participle 'acted' is required.\n\nA — 'acts' is present tense; incorrect for past perfect inversion.\nB — 'acted' alone without the auxiliary 'had' would not form the inversion correctly.\nC — 'have acted' would produce 'Had the city council have acted,' which is incorrect.\nD is correct: 'acted' completes 'Had the city council acted...' as a past perfect inversion."}, {"k": "Verb Tense", "p": "The auditors discovered that the funds <u>were misappropriated</u> over a period of seven years before the fraud was detected by an external review.", "q": "Which verb form is most precise?", "o": ["A) No change — 'were misappropriated' correctly describes the ongoing past action.", "B) 'had been misappropriated' — past perfect passive is needed to show the action was completed before the detection.", "C) 'had been misappropriating' — past perfect progressive active is needed.", "D) A or B"], "a": 3, "e": "D is correct. Both A and B are grammatically acceptable. 'Were misappropriated' (past passive) is acceptable for describing an ongoing past action. 'Had been misappropriated' (past perfect passive) more precisely shows that the misappropriation was completed/ongoing prior to the detection (another past event). Both are grammatically valid on the SAT.\n\nC — 'had been misappropriating' uses an active voice construction; 'funds' cannot actively misappropriate themselves.\nD is correct."}, {"k": "Verb Tense", "p": "The treaty stipulated that all signatory nations <u>will withdraw</u> their military forces from the disputed zone within ninety days of ratification.", "q": "Which verb form is correct in the indirect speech context?", "o": ["A) No change — 'will withdraw' is correct for a future obligation.", "B) 'would withdraw' — after 'stipulated' (past tense), future 'will' is backshifted to 'would' in reported speech.", "C) 'withdraw' — subjunctive is needed after 'stipulated that.'", "D) B or C"], "a": 3, "e": "D is correct. Both B and C are grammatically correct. B applies the sequence-of-tenses rule (backshifting 'will' to 'would' after a past verb). C applies the subjunctive (base form 'withdraw') after a verb of stipulation. Both are standard grammatical choices.\n\nA — 'will withdraw' is appropriate for direct speech but not standard in reported speech after a past verb.\nD is correct."}, {"k": "Verb Tense", "p": "Since the new algorithm <u>was deployed</u> six months ago, processing time for complex queries has decreased by nearly forty percent.", "q": "Is 'was deployed' correct?", "o": ["A) Yes — simple past 'was deployed' correctly establishes a starting point for the 'since' clause.", "B) No — 'has been deployed' is needed because the deployment is still ongoing.", "C) No — 'had been deployed' is needed to show the deployment preceded the decrease.", "D) Yes — the passive voice is appropriate here."], "a": 0, "e": "A is correct. 'Since the algorithm was deployed' uses simple past in the 'since' clause to establish the starting point of a time period. The main clause then uses present perfect ('has decreased') to describe what has happened within that period. This is correct.\n\nB — 'has been deployed' (present perfect) would be used if the deployment itself were the ongoing focus; but here the deployment is a completed starting point.\nC — 'had been deployed' is past perfect; incorrect for a 'since' clause establishing a starting point.\nD — passive voice is indeed appropriate; A is the best answer."}, {"k": "Verb Tense", "p": "The scientist insisted that the preliminary results <u>were</u> taken into account before the final methodology was approved.", "q": "Which verb form is correct?", "o": ["A) No change — 'were' is correct in indirect speech after 'insisted.'", "B) 'be' — after 'insisted that,' the subjunctive base form is required.", "C) 'are' — present tense is needed.", "D) 'had been' — past perfect is needed."], "a": 1, "e": "B is correct. 'Insisted that' triggers the subjunctive. The base form of 'be' is required: 'insisted that the results be taken into account.' The passive base form is 'be + past participle.'\n\nA — 'were taken' is past passive indicative, not the subjunctive.\nC — 'are' is present indicative.\nD — 'had been taken' is past perfect passive."}, {"k": "Verb Tense", "p": "As of last December, the organization <u>has operated</u> three regional offices in Southeast Asia for over a decade.", "q": "Which verb form is correct?", "o": ["A) No change — 'has operated' is correct for an action ongoing to the present.", "B) 'had operated' — 'as of last December' sets a past reference point; past perfect is needed.", "C) 'was operating' — past progressive is needed.", "D) 'operated' — simple past is correct after 'as of last December.'"], "a": 1, "e": "B is correct. 'As of last December' establishes a specific past reference point. The action of operating had been ongoing up to that past point. Past perfect 'had operated' correctly captures duration up to a past moment.\n\nA — 'has operated' is present perfect; incorrect when the reference point is explicitly in the past ('last December').\nC — 'was operating' is past progressive, which does not express the duration.\nD — 'operated' is simple past and does not express the ten-year duration."}, {"k": "Verb Tense", "p": "The board requested that the external auditor <u>presents</u> a comprehensive summary of the firm's financial exposure at the next quarterly meeting.", "q": "Which verb form is correct?", "o": ["A) No change — 'presents' is acceptable in a formal request context.", "B) 'present' — after 'requested that,' the subjunctive base form is required.", "C) 'presented' — past tense is needed after 'requested.'", "D) 'will present' — future is required."], "a": 1, "e": "B is correct. 'Requested that' triggers the subjunctive. The base form 'present' is required regardless of the subject ('the external auditor').\n\nA — 'presents' is indicative third-person singular.\nC — 'presented' is past tense.\nD — 'will present' is future indicative."}, {"k": "Verb Tense", "p": "When the analysts reviewed the revised forecasts, they noted that the economic recovery <u>has slowed</u> significantly in the third quarter relative to initial projections.", "q": "Which verb form is correct?", "o": ["A) No change — 'has slowed' is correct in this context.", "B) 'had slowed' — the slowdown preceded the analysts' review; past perfect is needed.", "C) 'slowed' — simple past is correct in reported speech after a past verb.", "D) B or C"], "a": 3, "e": "D is correct. Both B and C are grammatically acceptable. 'Had slowed' (past perfect) more precisely shows that the slowdown preceded the review. 'Slowed' (simple past backshifted from present perfect in reported speech) is also acceptable. Both are valid.\n\nA — 'has slowed' (present perfect) is inappropriate in reported speech after a past verb ('noted').\nD is correct."}, {"k": "Verb Tense", "p": "The professor proposed that the university <u>establishes</u> a dedicated research center to study the long-term social effects of social media use on adolescent development.", "q": "Which verb form is correct?", "o": ["A) No change — 'establishes' is acceptable after 'proposed.'", "B) 'establish' — after 'proposed that,' the subjunctive base form is required.", "C) 'established' — past tense is needed.", "D) 'will establish' — future is needed for a prospective action."], "a": 1, "e": "B is correct. 'Proposed that' triggers the subjunctive. The base form 'establish' is required.\n\nA — 'establishes' is indicative third-person singular.\nC — 'established' is past tense.\nD — 'will establish' is future indicative."}, {"k": "Verb Tense", "p": "The clinical trial, which began in 2019, was still in its third phase when the pandemic disrupted supply chains. Researchers hoped that results <u>will be</u> available by the end of the following year.", "q": "Which verb form is correct?", "o": ["A) No change — 'will be' is appropriate for a future expectation.", "B) 'would be' — in reported speech after 'hoped' (past), 'will' is backshifted to 'would.'", "C) 'were' — past tense is needed in reported speech.", "D) 'had been' — past perfect is needed."], "a": 1, "e": "B is correct. 'Hoped' is a past reporting verb. In reported speech, 'will' is backshifted to 'would': 'researchers hoped that results would be available.'\n\nA — 'will be' is appropriate in direct speech but not in reported speech after a past verb.\nC — 'were' is past; would imply the results already existed.\nD — 'had been' is past perfect; incorrect."}, {"k": "Verb Tense", "p": "It is crucial that the steering committee <u>reached</u> a consensus before the public consultation period opens next month.", "q": "Which verb form is correct?", "o": ["A) No change — 'reached' is appropriate as a past reference.", "B) 'reach' — after 'it is crucial that,' the subjunctive base form is required.", "C) 'reaches' — present indicative is needed.", "D) 'will reach' — future is needed."], "a": 1, "e": "B is correct. 'It is crucial that' triggers the subjunctive. The base form 'reach' is required.\n\nA — 'reached' is past tense.\nC — 'reaches' is indicative third-person singular.\nD — 'will reach' is future indicative."}, {"k": "Verb Tense", "p": "The investment committee <u>would have approved</u> the proposal had the projected return on equity been above twelve percent, but the revised financial model fell just short of that threshold.", "q": "Is the underlined verb form correct?", "o": ["A) Yes — 'would have approved' correctly forms the result clause of a third conditional.", "B) No — 'would approve' is needed for a second conditional.", "C) No — 'had approved' is needed for the result clause.", "D) Yes — 'would have approved' is correct because the condition was not met."], "a": 0, "e": "A is correct. This is a third conditional. The if-clause uses past perfect inversion ('had the return been above twelve percent'), and the result clause uses 'would have + past participle': 'would have approved.' Both D and A are essentially the same reasoning, but A is the primary answer.\n\nB — 'would approve' is the second conditional result clause form.\nC — 'had approved' is past perfect and belongs in an if-clause, not the result clause.\nA is correct."}, {"n": 25, "type": "Verb Tense & Mood", "passage": "The committee reviewed the proposal for weeks before reaching a final verdict. Several members argued that the entire funding structure needed to be reconsidered before any decision were finalized. The chair, however, insisted that time constraints made further deliberation impractical.", "question": "Which choice correctly completes the underlined portion of the sentence?", "underline": "before any decision were finalized", "choices": [{"label": "A", "text": "before any decision were finalized"}, {"label": "B", "text": "before any decision was finalized"}, {"label": "C", "text": "before any decision had finalized"}, {"label": "D", "text": "before any decision is finalized"}], "answer": "B", "explanation": "The clause describes a real condition linked to past deliberation, not a hypothetical. The correct verb is the simple past \"was finalized\" agreeing with singular \"decision.\" The subjunctive \"were\" is reserved for counterfactual or hypothetical conditions (e.g., \"if a decision were made\"). \"Had finalized\" is intransitive and illogical. \"Is finalized\" introduces an inconsistent present tense."}]}, {"n": 8, "topic": "Tense Consistency", "diff": "Advanced Relative Clauses & Subordination", "qs": [{"n": 1, "type": "Relative Clauses & Subordination", "passage": "The observatory atop Mount Palomar houses a telescope to which astronomers from around the world travel each year. The instrument, which was completed in 1948, remains one of the most productive research tools in modern astrophysics. Its design set the standard for large reflector telescopes built in subsequent decades.", "question": "Which choice correctly uses a relative construction to refer to the telescope in the passage?", "underline": "a telescope to which astronomers from around the world travel each year", "choices": [{"label": "A", "text": "a telescope to which astronomers from around the world travel each year"}, {"label": "B", "text": "a telescope that astronomers from around the world travel to it each year"}, {"label": "C", "text": "a telescope which astronomers from around the world travel to each year"}, {"label": "D", "text": "a telescope whom astronomers from around the world travel to each year"}], "answer": "A", "explanation": "When a preposition governs the relative pronoun, formal usage requires the preposition to precede 'which': 'to which.' Choice B creates a pronoun double ('to it') after the relative clause, which is ungrammatical. Choice C strands the preposition informally and is inappropriate in formal writing when revision is possible. Choice D uses 'whom,' reserved for persons, not things."}, {"n": 2, "type": "Relative Clauses & Subordination", "passage": "The researcher identified a chemical compound through which the bacteria transmit resistance genes to neighboring cells. Understanding this mechanism was considered essential to developing effective treatments. Without this knowledge, pharmaceutical responses would remain largely reactive rather than preventive.", "question": "Which choice correctly expresses the prepositional relative construction in formal written English?", "underline": "a chemical compound through which the bacteria transmit resistance genes", "choices": [{"label": "A", "text": "a chemical compound through which the bacteria transmit resistance genes"}, {"label": "B", "text": "a chemical compound that the bacteria transmit resistance genes through it"}, {"label": "C", "text": "a chemical compound which the bacteria transmit resistance genes through"}, {"label": "D", "text": "a chemical compound where the bacteria transmit resistance genes"}], "answer": "A", "explanation": "'Through which' correctly places the preposition before the relative pronoun, as required in formal prose. B creates a double reference ('through it'). C strands the preposition, acceptable in speech but substandard in formal written English when revision is available. D uses 'where,' which refers to a place, not a compound."}, {"n": 3, "type": "Relative Clauses & Subordination", "passage": "The commission submitted its report to the council, by which all future zoning decisions would be governed. Local residents had waited months for the document, hoping it would address the longstanding conflicts between residential expansion and protected green spaces. The report ultimately satisfied neither faction completely.", "question": "Which choice uses the correct relative construction to refer to the report?", "underline": "to the council, by which all future zoning decisions would be governed", "choices": [{"label": "A", "text": "to the council, by which all future zoning decisions would be governed"}, {"label": "B", "text": "to the council, by that all future zoning decisions would be governed"}, {"label": "C", "text": "to the council, which all future zoning decisions would be governed by it"}, {"label": "D", "text": "to the council, that all future zoning decisions would be governed by"}], "answer": "A", "explanation": "In non-restrictive clauses (set off by commas), 'which' is required — not 'that.' A correctly uses 'by which' with the preposition fronted. B incorrectly uses 'that' in a non-restrictive clause. C creates a double reference error ('by it'). D also uses 'that' inappropriately in a non-restrictive clause and strands the preposition."}, {"n": 4, "type": "Relative Clauses & Subordination", "passage": "The architect selected a building material of which the thermal properties had been independently certified. This choice reflected her commitment to verifiable performance standards rather than manufacturer claims alone. The certification process, though time-consuming, added credibility to the final design proposal.", "question": "Which choice correctly expresses the relationship between the noun and the relative clause?", "underline": "a building material of which the thermal properties had been independently certified", "choices": [{"label": "A", "text": "a building material of which the thermal properties had been independently certified"}, {"label": "B", "text": "a building material whose thermal properties had been independently certified"}, {"label": "C", "text": "a building material that its thermal properties had been independently certified"}, {"label": "D", "text": "a building material which its thermal properties had been independently certified"}], "answer": "A", "explanation": "Both A and B are grammatically acceptable. However, A uses the formal 'of which' construction appropriate to formal academic prose, while B uses 'whose,' which is correct but slightly less formal in reference to inanimate objects. C and D both insert a redundant possessive pronoun ('its') after the relative pronoun, creating double reference errors. Since the passage maintains a formal register throughout, A is the best choice."}, {"n": 5, "type": "Relative Clauses & Subordination", "passage": "The professor cited three studies upon which her central argument depended. Each study had been peer-reviewed and replicated across different populations. Despite this, several members of the audience questioned whether the combined evidence was sufficient to support the sweeping conclusions she had drawn.", "question": "Which choice correctly uses a prepositional relative construction in formal prose?", "underline": "three studies upon which her central argument depended", "choices": [{"label": "A", "text": "three studies upon which her central argument depended"}, {"label": "B", "text": "three studies that her central argument depended upon them"}, {"label": "C", "text": "three studies her central argument depended upon"}, {"label": "D", "text": "three studies which her central argument depended upon"}], "answer": "A", "explanation": "'Upon which' fronts the preposition correctly in formal prose. B adds an unnecessary pronoun ('them'), creating a double reference error. C omits the relative pronoun entirely — acceptable informally but not in formal writing. D strands the preposition, which is acceptable in informal English but incorrect in formal academic prose when a fronted alternative is available."}, {"n": 6, "type": "Relative Clauses & Subordination", "passage": "The judge issued a ruling in which she distinguished between two categories of evidence. The first category included direct testimony from witnesses present at the scene. The second comprised documentary records assembled after the fact, which she treated with greater scrutiny due to their potential for retrospective distortion.", "question": "Which choice most correctly uses a relative clause to refer to the ruling?", "underline": "a ruling in which she distinguished between two categories of evidence", "choices": [{"label": "A", "text": "a ruling in which she distinguished between two categories of evidence"}, {"label": "B", "text": "a ruling where she distinguished between two categories of evidence"}, {"label": "C", "text": "a ruling that she distinguished between two categories of evidence in"}, {"label": "D", "text": "a ruling she distinguished between two categories of evidence in it"}], "answer": "A", "explanation": "'In which' correctly governs the relative clause in formal prose. B uses 'where,' which is restricted to location unless the noun genuinely refers to a place or situation. C strands the preposition informally. D adds an unnecessary pronoun ('it'), producing a double reference error."}, {"n": 7, "type": "Relative Clauses & Subordination", "passage": "The negotiators reached an agreement under which both parties would suspend hostilities for a period of thirty days. International observers praised the deal as a fragile but necessary first step. Whether the agreement would survive domestic opposition in both countries remained deeply uncertain.", "question": "Which choice correctly expresses the prepositional relative relationship in formal written English?", "underline": "an agreement under which both parties would suspend hostilities", "choices": [{"label": "A", "text": "an agreement under which both parties would suspend hostilities"}, {"label": "B", "text": "an agreement that both parties would suspend hostilities under"}, {"label": "C", "text": "an agreement which both parties would suspend hostilities under it"}, {"label": "D", "text": "an agreement where both parties would suspend hostilities"}], "answer": "A", "explanation": "'Under which' correctly fronts the preposition in formal prose. B strands the preposition, informal but substandard in formal written English. C strands the preposition and adds a pronoun ('it'), creating a double reference error. D uses 'where' incorrectly — an agreement is not a location."}, {"n": 8, "type": "Relative Clauses & Subordination", "passage": "The historian documented the precise conditions under which the treaty was signed. Primary sources confirmed that both delegations had arrived exhausted after weeks of failed negotiation. The final terms, widely seen as a compromise, satisfied neither side fully but prevented the outbreak of renewed conflict.", "question": "Which choice uses the correct relative pronoun form for a person?", "underline": "The historian, who had spent fifteen years researching the period, documented the treaty's origins.", "choices": [{"label": "A", "text": "The historian, who had spent fifteen years researching the period, documented the treaty's origins."}, {"label": "B", "text": "The historian, whom had spent fifteen years researching the period, documented the treaty's origins."}, {"label": "C", "text": "The historian, which had spent fifteen years researching the period, documented the treaty's origins."}, {"label": "D", "text": "The historian, that had spent fifteen years researching the period, documented the treaty's origins."}], "answer": "A", "explanation": "'Who' is the subject of the relative clause ('who had spent') and correctly refers to a person. 'Whom' is an object pronoun — incorrect here since the pronoun functions as the subject. 'Which' refers to things, not people. 'That' cannot introduce a non-restrictive clause (one set off by commas)."}, {"n": 9, "type": "Relative Clauses & Subordination", "passage": "The award was presented to the scientist whom the committee had unanimously selected. Her research on quantum entanglement had produced results that challenged long-held assumptions about information transfer. The ceremony attracted international media attention, reflecting the global significance of her findings.", "question": "Which choice uses the correct relative pronoun case?", "underline": "the scientist whom the committee had unanimously selected", "choices": [{"label": "A", "text": "the scientist whom the committee had unanimously selected"}, {"label": "B", "text": "the scientist who the committee had unanimously selected"}, {"label": "C", "text": "the scientist that the committee had unanimously selected"}, {"label": "D", "text": "the scientist which the committee had unanimously selected"}], "answer": "A", "explanation": "'Whom' is correct because it functions as the direct object of 'selected' — the committee selected her, not she. To test: substitute 'him/her' (object) vs. 'he/she' (subject). 'The committee selected her' — object case = 'whom.' B uses 'who' (subject case) incorrectly. C ('that') is acceptable informally but less precise than 'whom' in formal prose. D ('which') refers to things, not people."}, {"n": 10, "type": "Relative Clauses & Subordination", "passage": "The foundation awarded grants to researchers with whom it had collaborated on previous projects. These ongoing relationships were seen as a strategic investment in long-term scientific progress. New applicants without prior collaboration history were considered only in exceptional circumstances.", "question": "Which choice correctly uses the object form of the relative pronoun after a preposition?", "underline": "researchers with whom it had collaborated on previous projects", "choices": [{"label": "A", "text": "researchers with whom it had collaborated on previous projects"}, {"label": "B", "text": "researchers with who it had collaborated on previous projects"}, {"label": "C", "text": "researchers that it had collaborated with on previous projects"}, {"label": "D", "text": "researchers which it had collaborated with on previous projects"}], "answer": "A", "explanation": "After a preposition, 'whom' is required — 'with whom.' B incorrectly uses 'who' (subject form) after a preposition. C uses 'that' and strands the preposition, acceptable informally but not the best choice in formal prose when a fronted form is available. D uses 'which' for people, which is incorrect."}, {"n": 11, "type": "Relative Clauses & Subordination", "passage": "The novel contains several passages that have been cited frequently in literary criticism. One passage, which appears in the third chapter, describes the protagonist's childhood in vivid detail. Critics disagree about whether this passage constitutes the thematic center of the work or functions merely as atmospheric background.", "question": "Which choice uses the correct relative pronoun to introduce a restrictive clause?", "underline": "several passages that have been cited frequently in literary criticism", "choices": [{"label": "A", "text": "several passages that have been cited frequently in literary criticism"}, {"label": "B", "text": "several passages, which have been cited frequently in literary criticism,"}, {"label": "C", "text": "several passages whom have been cited frequently in literary criticism"}, {"label": "D", "text": "several passages what have been cited frequently in literary criticism"}], "answer": "A", "explanation": "'That' correctly introduces a restrictive relative clause — one that defines which passages are meant, without commas. B uses 'which' with commas, making it non-restrictive; this would imply all passages in the novel are frequently cited, changing the meaning. C uses 'whom,' reserved for people. D uses 'what,' which cannot introduce a relative clause modifying a noun."}, {"n": 12, "type": "Relative Clauses & Subordination", "passage": "The expedition followed a route that earlier explorers had abandoned due to extreme weather. Modern equipment allowed the team to navigate conditions that would have been prohibitive in previous centuries. The final summit attempt lasted eighteen hours and required careful rationing of oxygen supplies.", "question": "Which choice correctly identifies the relationship between the restrictive clause and its antecedent?", "underline": "a route that earlier explorers had abandoned due to extreme weather", "choices": [{"label": "A", "text": "a route that earlier explorers had abandoned due to extreme weather"}, {"label": "B", "text": "a route, which earlier explorers had abandoned due to extreme weather,"}, {"label": "C", "text": "a route which earlier explorers had abandoned due to extreme weather"}, {"label": "D", "text": "a route where earlier explorers had abandoned it due to extreme weather"}], "answer": "A", "explanation": "'That' is correct for a restrictive clause — it specifies which route. B converts it to a non-restrictive clause with commas, implying the route is already known and the detail is supplementary — a meaning shift. C uses 'which' without commas in a restrictive clause, technically acceptable in British English but not the preferred SAT convention. D adds a double reference pronoun ('it')."}, {"n": 13, "type": "Relative Clauses & Subordination", "passage": "The committee approved only proposals that met all three criteria. Projects that failed even one criterion were returned to applicants for revision. This rigorous filtering process ensured that funded projects maintained the highest standards of methodological integrity.", "question": "Which choice correctly uses a relative pronoun for a restrictive clause defining which proposals were approved?", "underline": "only proposals that met all three criteria", "choices": [{"label": "A", "text": "only proposals that met all three criteria"}, {"label": "B", "text": "only proposals, which met all three criteria,"}, {"label": "C", "text": "only proposals meeting all three of them criteria"}, {"label": "D", "text": "only proposals whom met all three criteria"}], "answer": "A", "explanation": "'That' introduces the restrictive clause specifying exactly which proposals were approved. B makes it non-restrictive, implying all proposals met the criteria — a logical contradiction with 'only.' C is grammatically awkward ('of them criteria' is nonstandard). D uses 'whom' for things, which is incorrect."}, {"n": 14, "type": "Relative Clauses & Subordination", "passage": "The museum acquired a painting that had been missing for over sixty years. The work, which had passed through several private collections before its disappearance, was authenticated using advanced imaging technology. Its return to public display was celebrated by art historians and the general public alike.", "question": "Which choice correctly distinguishes between restrictive and non-restrictive usage for the second relative cl
